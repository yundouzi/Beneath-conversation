    <script type="application/json" id="episode-data">{"episode":{"id":"S7E5","label":"S7E5","title":"S7E5 Lu Yu in Conversation with Joan Chen | Love, like trembling internal organs, also like magma beneath the earth.","intro":"Chen Chong, actress, director, writer\nChen Luyu, media personality, host\nActress Chen Chong wearing GIADA Andi trench coat\n\nIn the fifth episode of the seventh season of 'Among the Rocks and Flowers,' Luyu reunites with Chen Chong, a star she once saw in childhood photos.\nChen Chong says her life has been guided by 'love and loss.'\nAt 20, she went to study in the US, hoping to broaden her horizons, but fate led her back to 'performance.' At that time, Hollywood was depicting a fantasy of the East, unable to offer suitable roles for Chinese actors, until she stumbled upon 'The Last Emperor.' But 'Wanrong' doesn't come often.\nOut of a preference for 'the scene,' she stood behind the monitor, expressing her understanding of 'love' in the films she directed. In 'Autumn in New York,' love is beautiful, even saccharine; in 'She Has a Name,' love is broken yet solid. Now, she believes love is the quality of attention, containing repeated cruel choices and farewells.\nShe is passionate about reading, experiencing the withering and gathering of senses in Woolf's stream of consciousness, and bearing the depth and intensity of philosophical thought in Glück's light verses. Words best express the weight of 'love and loss,' so she uses 'Catfish' to preserve all losses and retain the paradise of the past.\nKnowing that death is ordinary, she decides to live more intensely, enjoying sweetness, tasting bitterness, and exhausting all hugs and kisses.","duration":3985.0000000000005,"displayDuration":3985.0000000000005,"audioSrc":"s7e5.m4a","guest":"Joan Chen","host":"Lu Yu","releaseDate":"2025.4.23"},"topicDefinitions":{"0":{"label":"C0","name":"Episode Summary","color":"#FFFFFF","opacity":0.2,"firstCategory":"Episode Summary","secondCategory":"Episode Summary","keyWords":["Episode Summary","Opening","Introduction"]},"1":{"label":"C1","name":"History, Era, and Culture","color":"#B9B4B6","opacity":0.2,"firstCategory":"History, Era, and Culture","secondCategory":"History, Era, and Culture","keyWords":["Episode Summary","Opening","Introduction"]},"2":{"label":"C2","name":"Actor Growth and Life Experience","color":"#CB7281","opacity":0.2,"firstCategory":"Actor Growth and Life Experience","secondCategory":"Actor Growth and Life Experience","keyWords":["Movies","Characters","Kramer","Absolutely Not","Actress"]},"3":{"label":"C3","name":"Writing, Literature, and Language","color":"#DFA870","opacity":0.2,"firstCategory":"Writing, Literature, and Language","secondCategory":"Writing, Literature, and Language","keyWords":["Thoughts","First to Bear the Brunt","Same as Words","Indeed, language","Language is indeed thought"]},"4":{"label":"C4","name":"Film performance and director collaboration","color":"#000000","opacity":0.2,"firstCategory":"Film performance and director collaboration","secondCategory":"Film performance and director collaboration","keyWords":["Actor","Director","As","Necessary","Fastest speech speed"]},"5":{"label":"C5","name":"Chinese identity and cultural identity","color":"#387C7D","opacity":0.2,"firstCategory":"Chinese identity and cultural identity","secondCategory":"Chinese Identity and Cultural Belonging","keyWords":["The Role of Chinese Descendants","Have You Ever Seen Any","To Act in Hollywood","Hollywood Acting","After Coming to the US"]},"6":{"label":"C6","name":"Female Roles and Life Stories","color":"#7CFDFF","opacity":0.2,"firstCategory":"Female Roles and Life Stories","secondCategory":"Female Roles and Life Stories","keyWords":["Documentary","Elizabeth","Love Story","Taylor","Two People"]},"7":{"label":"C7","name":"Natural Aesthetics and Life Insights","color":"#995A91","opacity":0.2,"firstCategory":"Natural Aesthetics and Life Insights","secondCategory":"Natural Aesthetics and Life Insights", eet, and under it were a few photos from the household."},{"id":"17","start":140.72,"end":153.44,"displayStart":140.72,"displayEnd":153.44,"displayMid":147.07999999999998,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.956288,"pitch":22.303436,"speechRate":5.031,"hasEvents":false,"sentence_source":"我们家的玻璃板下压着一张 我妈妈跟的合影，当时我妈妈是一个30多岁年纪的年轻女性，那时候已经凭借小花拿到了大众电影《百花奖》的引后。","sentence_en":"Under our glass sheet was a photo of my mom with someone. At the time, my mom was a young woman in her 30s, and she had already won the Hundred Flowers Award for Best Actress for 'Little Flower."},{"id":"18","start":153.44,"end":163.9,"displayStart":153.44,"displayEnd":163.9,"displayMid":158.67000000000002,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.933728,"pitch":21.685139,"speechRate":4.78,"hasEvents":false,"sentence_source":"那是第一次有一个电影明星 一个名人，他出现在我家里 不是在电视上或者杂志上，而是一张照片里面 和我妈妈站在一起。","sentence_en":"That was the first time a movie star, a celebrity, appeared in my home—not on TV or in a magazine, but in a photo, standing next to my mom."},{"id":"19","start":163.9,"end":178.9,"displayStart":163.9,"displayEnd":178.9,"displayMid":171.4,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.889747,"pitch":21.397299,"speechRate":4.558,"hasEvents":false,"sentence_source":"那是一种很神奇的感觉，关于的第二个印象 他在猫鱼里面也写到，他说 江门有一次就跟他讲 觉得很有趣，好几次见到他 头发都是湿漏漏的 好像没有吹过。","sentence_en":"It was such a surreal feeling. My second impression of him: he also wrote in 'Catfish' that someone once told him they found it funny that every time they saw him, his hair was wet, like he hadn't dried it."},{"id":"20","start":178.9,"end":183.04,"displayStart":178.9,"displayEnd":18 "hasEvents":false,"sentence_source":"那个对家的思念对你整个所熟悉的一切的思念。","sentence_en":"That longing for home, for everything familiar."},{"id":"40","start":304.36,"end":312.48,"displayStart":304.36,"displayEnd":312.48,"displayMid":308.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.6,"loudness":0.831991,"pitch":18.603823,"speechRate":3.435,"hasEvents":false,"sentence_source":"那是一种非常剧烈的感觉，没有经历过的人不可能能够体会到的。","sentence_en":"It was an extremely intense feeling that no one who hasn't experienced it can truly understand."},{"id":"41","start":312.48,"end":317.22,"displayStart":312.48,"displayEnd":317.22,"displayMid":314.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.894191,"pitch":19.085642,"speechRate":3.579,"hasEvents":false,"sentence_source":"那种私心劣费的 特别绝望的一种思念。","sentence_en":"That kind of selfish and desperate longing."},{"id":"42","start":317.22,"end":329.1,"displayStart":317.22,"displayEnd":329.1,"displayMid":323.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.823519,"pitch":20.558304,"speechRate":3.341,"hasEvents":false,"sentence_source":"因为也是差不多三年半都没有机会回家，尤其当年的出国跟今天的出国有完全是不一样的。","sentence_en":"Because I also didn't get to go home for almost three and a half years. Studying abroad back then was completely different from studying abroad today."},{"id":"43","start":329.1,"end":340.82,"displayStart":329.1,"displayEnd":340.82,"displayMid":334.96000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.4,"loudness":0.900626,"pitch":20.037994,"speechRate":3.669,"hasEvents":false,"sentence_source":"因为当时我们是成长在一个非常局限的一个生活当中，根本就不知道另外任何一种生活状态的可能性。","sentence_en":"We grew up in a very confined life, with no idea of any other way of living."},{"id":"44","start":340.82,"end":350.98,"displayStart":340.82,"displayEnd":350.98,"displayMid":345.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.88125,"pitch":19.307817,"speechRate":3.879,"hasEvents":false,"sentence_source":"所以这个陌生感就是文化冲击太强烈了，如今的话孩子们不管怎么说，多多少少的都知道一些。","sentence_en":"So the strangeness was a huge culture shock. Nowadays, kids more or less know something about it."},{"id":"45","start":350.98,"end":355.08,"displayStart":350.98,"displayEnd":355.08,"displayMid":353.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.838205,"pitch":18.24262,"speechRate":4.146,"hasEvents":false,"sentence_source":"然后去留学 也可以知道会有一张回程票。","sentence_en":"And when they go abroad to study, they know there will be a return ticket."},{"id":"46","start":355.08,"end":369.96,"displayStart":355.08,"displayEnd":369.96,"displayMid":362.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.811351,"pitch":20.54369,"speechRate":4.199,"hasEvents":false,"sentence_source":"因为当时是没有回程票 也没有这个金钱，这个思念是我永生难忘的，而这个思念它也成为了某一种象征，你说再怎么艰苦地成长 那也是我的一片乐园。","sentence_en":"Back then there was no return ticket and no money. That longing is unforgettable, and it became a symbol—no matter how hard the growth was, it was still my paradise."},{"id":"47","start":369.96,"end":379.9,"displayStart":369.96,"displayEnd":379.9,"displayMid":374.92999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.860449,"pitch":19.059893,"speechRate":4.188,"hasEvents":false,"sentence_source":"爱于失去 从那个时候就有了真正的一种感受，而它也成为了我的人生写作 创作任何东西的主题。","sentence_en":"Love for what's lost—I truly felt that from then on, and it became the theme of my life writing and everything I create."},{"id":"48","start":382.02,"end":393.44,"displayStart":382.02,"displayEnd":393.44,"displayMid":387.73,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.929771,"pitch":25.586447,"speechRate":4.991,"hasEvents":true,"sentence_source":"2024年对我来说最愉快最有意义的阅读经历之一就是读的作品《猫鱼》，冬天的时候我跟在北京做了一次他新书的分享活动。","sentence_en":"One of the most enjoyable and meaningful reading experiences for me in 2024 was reading 'Catfish'. In winter, I did a book-sharing event for his new book in Beijing."},{"id":"49","start":393.44,"end":405.92,"displayStart":393.44,"displayEnd":405.92,"displayMid":399.68,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.110196,"pitch":27.488873,"speechRate":5.369,"hasEvents":false,"sentence_source":"然后当时我就说我每次出差前决定带一本书上飞机是个很重要的仪式，我必须要带这样一本书 然后猫鱼这本书很重 有两斤重，但我当时想了想还是毫不犹豫的。","sentence_en":"And then I said that deciding which book to bring on the plane before a business trip is an important ritual. I had to bring that book. 'Catfish' is very heavy, about two jin, but I thought about it and didn't hesitate."},{"id":"50","start":405.92,"end":408.86,"displayStart":405.92,"displayEnd":408.86,"displayMid":407.39,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":1.27092,"pitch":29.613348,"speechRate":5.782,"hasEvents":false,"sentence_source":"而不是犹豫了一下 依然把它带上了飞机。","sentence_en":"Rather than hesitating, I still took it on the plane."},{"id":"51","start":408.86,"end":422.48,"displayStart":408.86,"displayEnd":422.48,"displayMid":415.67,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.942188,"pitch":24.324474,"speechRate":4.405,"hasEvents":false,"sentence_source":"因为这本书的确是一个非常难忘愉快的一个阅读体验，它将我的整个的80年代、90年代到这几十年代成长经历，好像某种程度也包含在其中。","sentence_en":"Because this book is indeed a very memorable and pleasant reading experience. It seems to include, to some extent, my entire growth experience from the '80s, '90s, to the past few decades."},{"id":"52","start":422.48,"end":435.98,"displayStart":422.48,"displayEnd":435.98,"displayMid":429.23,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.910621,"pitch":26.214727,"speechRate":5.381,"hasEvents":false,"sentence_source":"所以我特别认同陈冲曾经讲过也写过，他说对抗遗忘最好的方法之一就是写作，好像很多时候画面和声音都不足以帮我们捕捉到的那些记忆，通过文字是能够最最先活真实。","sentence_en":"So I especially agree with what Chen Chong once said and wrote: one of the best ways to fight forgetting is writing. It seems that images and sounds often can't capture those memories, but words can bring them to life most vividly and truly."},{"id":"53","start":435.98,"end":438.6,"displayStart":435.98,"displayEnd":438.6,"displayMid":437.29,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.813182,"pitch":19.209078,"speechRate":4.198,"hasEvents":false,"sentence_source":"而且无比真诚地记录下来。","sentence_en":"And record them with incredible sincerity."},{"id":"54","start":438.6,"end":453.48,"displayStart":438.6,"displayEnd":453.48,"displayMid":446.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.808446,"pitch":22.85745,"speechRate":3.352,"hasEvents":false,"sentence_source":"对 就是说写作的过程是一个重新经历的过程，是一个自己对过往 对历史重新建立的某一种关系，也是一种安抚之余。","sentence_en":"Right, the process of writing is a process of re-experiencing, a way to rebuild a relationship with the past and history, and also a form of comfort."},{"id":"55","start":453.48,"end":455.74,"displayStart":453.48,"displayEnd":455.74,"displayMid":454.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.692382,"pitch":18.546999,"speechRate":3.982,"hasEvents":false,"sentence_source":"《猫鱼》是我的第一本书。","sentence_en":"Catfish' is my first book."},{"id":"56","start":455.74,"end":469.4,"displayStart":455.74,"displayEnd":469.4,"displayMid":462.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.864679,"pitch":19.866987,"speechRate":3.88,"hasEvents":false,"sentence_source":"但是我从中所得到的这样一种心血落狂，是让我觉得不久的将来某一天我可能又会再回去写作，我其实在这种不停的繁忙当中。","sentence_en":"But the kind of passion I gained from it makes me feel that one day in the near future I might go back to writing. I'm actually in this constant busyness."},{"id":"57","start":469.4,"end":477.4,"displayStart":469.4,"displayEnd":477.4,"displayMid":473.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.4,"loudness":0.749744,"pitch":18.554335,"speechRate":3.442,"hasEvents":false,"sentence_source":"现在那种繁忙有时候只是忙而已，会很怀念当时写作的那个状态。","sentence_en":"Now that busyness is sometimes just being busy, and I really miss the state of writing back then."},{"id":"58","start":477.4,"end":478.46,"displayStart":477.4,"displayEnd":478.46,"displayMid":477.92999999999995,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Writing, Literature, and Language","sentiment_en":"Neutral","score":0,"loudness":0.590182,"pitch":19.965996,"speechRate":4.717,"hasEvents":false,"sentence_source":"我其实明白。","sentence_en":"I actually understand."},{"id":"59","start":478.46,"end":485.66,"displayStart":478.46,"displayEnd":485.66,"displayMid":482.06,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.989656,"pitch":23.638035,"speechRate":5,"hasEvents":false,"sentence_source":"因为那种状态不得不生活在一种特别安静的，每天自己面对自己 面对自己生活的状态。","sentence_en":"Because that state forces you to live in a very quiet way, facing yourself and your life every day."},{"id":"60","start":485.66,"end":486.8,"displayStart":485.66,"displayEnd":486.8,"displayMid":486.23,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.972675,"pitch":28.658716,"speechRate":6.14,"hasEvents":false,"sentence_source":"那种状态很孤独。","sentence_en":"That state is very lonely."},{"id":"61","start":486.8,"end":489.68,"displayStart":486.8,"displayEnd":489.68,"displayMid":488.24,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.4,"loudness":0.853349,"pitch":21.208677,"speechRate":6.618,"hasEvents":false,"sentence_source":"但是某种程度对写作对创作有是有帮助的。","sentence_en":"But to some extent, it is helpful for writing and creation."},{"id":"62","start":489.68,"end":501.4,"displayStart":489.68,"displayEnd":501.4,"displayMid":495.53999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.740715,"pitch":21.714035,"speechRate":3.406,"hasEvents":false,"sentence_source":"对 就是其实孤独对创作是一个必须的前提，当然不仅仅是孤独﹐某种独处﹐也许你本来是孤独的。","sentence_en":"Yes, solitude is actually a necessary prerequisite for creation. Of course, it's not just loneliness—a certain kind of being alone. Maybe you were already lonely to begin with."},{"id":"63","start":501.4,"end":509.16,"displayStart":501.4,"displayEnd":509.16,"displayMid":505.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.784877,"pitch":15.774693,"speechRate":4.394,"hasEvents":false,"sentence_source":"但是写作就让你的独处得到某一种昇华，也就不是那种真正特别痛苦的孤独了。","sentence_en":"But writing elevates that solitude, so it's no longer that truly painful loneliness."},{"id":"64","start":509.16,"end":523.16,"displayStart":509.16,"displayEnd":523.16,"displayMid":516.16,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.924876,"pitch":22.130417,"speechRate":4.357,"hasEvents":false,"sentence_source":"我前阵跟著名的华裔作家李奕云对话的时候，我就说有一些作家他的写作是有画面感的，后来李奕云说他倒没有画面感，但他对于节奏更有感觉。","sentence_en":"When I spoke with the famous Chinese-American writer Li Yiyun recently, I said that some writers have a visual sense in their writing. She replied that she doesn't have that, but she is more sensitive to rhythm."},{"id":"65","start":523.58,"end":534.68,"displayStart":523.58,"displayEnd":534.68,"displayMid":529.13,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":1.00776,"pitch":23.63253,"speechRate":5.405,"hasEvents":false,"sentence_source":"我觉得猫鱼一开始也是特别有画面感的，大家不知道有没有读过猫鱼这本书，它的开场就是一个小女孩叫妹妹，通过妹妹的视线就从草坪看过去。","sentence_en":"I think 'Catfish' also has a strong visual sense from the start. I don't know if you've read it, but it opens with a little girl named Meimei, looking across the lawn through her eyes."},{"id":"66","start":534.68,"end":543.48,"displayStart":534.68,"displayEnd":543.48,"displayMid":539.0799999999999,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":1.035888,"pitch":22.051723,"speechRate":5.455,"hasEvents":false,"sentence_source":"然后爸爸推着自行车下班回来，车把手上还挂着一个网兜，网兜这个词就特别我小时候，是特别七十年代八十年代的。","sentence_en":"Then her father comes home from work pushing a bicycle, with a mesh bag hanging from the handlebar. The word 'mesh bag' is very nostalgic for me—it's very 70s and 80s."},{"id":"67","start":543.48,"end":545.34,"displayStart":543.48,"displayEnd":545.34,"displayMid":544.4100000000001,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.164683,"pitch":29.633106,"speechRate":7.143,"hasEvents":false,"sentence_source":"然后网兜里面还有个纸带。","sentence_en":"And inside the mesh bag there was a paper bag."},{"id":"68","start":545.34,"end":557.32,"displayStart":545.34,"displayEnd":557.32,"displayMid":551.33,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.026157,"pitch":24.168119,"speechRate":4.934,"hasEvents":false,"sentence_source":"然后爸爸拖着纸带上楼，从纸带里面会拿出咸肉拿出火腿，给拿出那个年代很少见的很奢侈的物品，就这一小段就是一个电影的开场的画面。","sentence_en":"Then he carries the paper bag upstairs, and from it he takes out salted meat, ham—luxury items rare in that era. That short scene is like the opening shot of a film."},{"id":"69","start":557.32,"end":561.44,"displayStart":557.32,"displayEnd":561.44,"displayMid":559.3800000000001,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.691573,"pitch":15.596033,"speechRate":4.762,"hasEvents":false,"sentence_source":"对，我的写作可能是由这方面给它感性的地方。","sentence_en":"Yes, my writing draws its emotional quality from that aspect."},{"id":"70","start":561.44,"end":571.04,"displayStart":561.44,"displayEnd":571.04,"displayMid":566.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.754249,"pitch":21.140036,"speechRate":4.175,"hasEvents":false,"sentence_source":"我对记忆的感受它的确是画面的碎片，有时候很莫名的某一个碎片，你都不知道把它安放在哪里。","sentence_en":"My perception of memory is indeed fragments of images. Sometimes a fragment appears out of nowhere, and you don't know where to place it."},{"id":"71","start":571.04,"end":576.02,"displayStart":571.04,"displayEnd":576.02,"displayMid":573.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.800028,"pitch":17.910175,"speechRate":3.375,"hasEvents":false,"sentence_source":"但是非常强烈 就会勾起你很多想法。","sentence_en":"But it's very intense and stirs up many thoughts."},{"id":"72","start":576.02,"end":591.32,"displayStart":576.02,"displayEnd":591.32,"displayMid":583.6700000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.8145,"pitch":22.735003,"speechRate":3.225,"hasEvents":false,"sentence_source":"然后写作的过程当中，将你慢慢地会将它联系起来，但的确就是是从画面 味觉 嗅觉，有时候是音乐会被刺激到会联想起。","sentence_en":"And during the writing process, you slowly connect them together. But it's indeed triggered by images, tastes, smells, and sometimes music, which evoke memories."},{"id":"73","start":591.32,"end":597.64,"displayStart":591.32,"displayEnd":597.64,"displayMid":594.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.4,"loudness":0.766506,"pitch":14.442989,"speechRate":3.67,"hasEvents":false,"sentence_source":"或者会渴望起某一种未来，联想起某一种遥远的东西。","sentence_en":"Or it might make you long for a certain future, or t Emperor projects—such things are too rare. Actually it was self-deception. I thought I should do something that could earn respect,"},{"id":"136","start":1138.56,"end":1149.02,"displayStart":1138.56,"displayEnd":1149.02,"displayMid":1143.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.867743,"pitch":17.638767,"speechRate":4.493,"hasEvents":false,"sentence_source":"能够在收入上也是相对比较好的，而且是自己头脑可以完成的事情，的确是在想这件事情，回头想是自己 互能自己。","sentence_en":"With relatively good income, and something I could accomplish with my mind. I was indeed thinking about that. Looking back, it was self-deception."},{"id":"137","start":1149.2,"end":1161.86,"displayStart":1149.2,"displayEnd":1161.86,"displayMid":1155.53,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.996482,"pitch":23.132626,"speechRate":5.453,"hasEvents":false,"sentence_source":"自己安慰自己，但我现在想想 能够有一部电影是在故宫里面拍摄，这如今看来也是不可想象的，就跟我后来在重新看我小时候看的，70年代那个版本的《尼罗河惨案》。","sentence_en":"I comforted myself, but now when I think about it, having a movie filmed inside the Forbidden City is unimaginable today, just like when I later rewatched the 1970s version of Death on the Nile that I saw as a child."},{"id":"138","start":1161.86,"end":1166.54,"displayStart":1161.86,"displayEnd":1166.54,"displayMid":1164.1999999999998,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.053417,"pitch":23.074356,"speechRate":5.556,"hasEvents":false,"sentence_source":"我才意识到它有很多场景是真的，就是在埃及的金字塔拍摄的。","sentence_en":"I realized many of its scenes were actually shot at the pyramids in Egypt."},{"id":"139","start":1166.54,"end":1168.9,"displayStart":1166.54,"displayEnd":1168.9,"displayMid":1167.72,"speaker": ":1197.58,"displayMid":1193.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.937103,"pitch":23.529024,"speechRate":4.267,"hasEvents":true,"sentence_source":"那是真正的一种合作，哎呀 贝托鲁琪那时候真的是完全在跟中国文化恋爱着。","sentence_en":"It was a true collaboration. Oh, Bertolucci was truly in love with Chinese culture back then."},{"id":"144","start":1197.58,"end":1209.06,"displayStart":1197.58,"displayEnd":1209.06,"displayMid":1203.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.870854,"pitch":19.627764,"speechRate":3.666,"hasEvents":true,"sentence_source":"我们中国所有的能够给予他的支持都给予他了，成千上万的部队的士兵都替光了头做群众演员。","sentence_en":"We gave him all the support China could offer; thousands of soldiers shaved their heads to be extras."},{"id":"145","start":1209.06,"end":1214.64,"displayStart":1209.06,"displayEnd":1214.64,"displayMid":1211.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.744988,"pitch":14.768538,"speechRate":3.417,"hasEvents":false,"sentence_source":"达青岗 天不亮 都在那里 特别有纪律地待着了。","sentence_en":"They were at Daqinggang before dawn, waiting with great discipline."},{"id":"146","start":1214.64,"end":1226.66,"displayStart":1214.64,"displayEnd":1226.66,"displayMid":1220.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.802789,"pitch":18.973722,"speechRate":3.862,"hasEvents":false,"sentence_source":"然后故宫也是整个故宫为我们敞开着，故宫连门票都不卖 都关门了，在故宫里面看日出看日落，这种感受真的是。","sentence_en":"And the entire Forbidden City was open to us; they didn't even sell tickets, just closed it off. Watching sunrise and sunset inside the Forbidden City—that feeling was truly..."},{"id":"147","start":1227.1,"end":1230.9,"displayStart":1227.1,"displayEnd":1230.9,"displayMid":1229,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.011726,"pitch":25.425879,"speechRate":5.436,"hasEvents":false,"sentence_source":"哪怕摩丹皇帝如果是拍出了一部特烂的电影。","sentence_en":"Even if The Last Emperor had turned out to be a terrible film,"},{"id":"148","start":1230.9,"end":1234.74,"displayStart":1230.9,"displayEnd":1234.74,"displayMid":1232.8200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.992515,"pitch":25.16853,"speechRate":3.23,"hasEvents":true,"sentence_source":"我觉得我都已经直了哈哈哈。","sentence_en":"I think I would have still been satisfied, haha."},{"id":"149","start":1235.47,"end":1242.77,"displayStart":1235.47,"displayEnd":1242.77,"displayMid":1239.12,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":1.182864,"pitch":28.519754,"speechRate":5.658,"hasEvents":true,"sentence_source":"你知道后来我看你顺便有一段描写，我当时看着还挺兮兮的，过了很多年之后，你又见到贝多鲁奇。","sentence_en":"You know, later I read a description you wrote; I found it quite touching. Many years later, you met Bertolucci again."},{"id":"150","start":1242.77,"end":1247.43,"displayStart":1242.77,"displayEnd":1247.43,"displayMid":1245.1,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.987002,"pitch":24.092255,"speechRate":5.794,"hasEvents":false,"sentence_source":"然后你当时写你说，你们当时其实想象不到，就在故宫拍摄的时候。","sentence_en":"And you wrote that back then, during the filming in the Forbidden City, you couldn't have imagined..."},{"id":"151","start":1247.43,"end":1251.37,"displayStart":1247.43,"displayEnd":1251.37,"displayMid":1249.4,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":1.08318,"pitch":26.19208,"speechRate":5.33,"hasEvents":false,"sentence_source":"其实好像你们各自都处于，与你认为的事业的巅峰。","sentence_en":"It seems you were both at what you thought was the peak of your careers."},{"id":"152","start":1251.37,"end":1264.63,"displayStart":1251.37,"displayEnd":1264.63,"displayMid":1258,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Positive","score":0.5,"loudness":1.048708,"pitch":25.378376,"speechRate":6.025,"hasEvents":false,"sentence_source":"然后那个瞬间我就明白是一个人，经历过人生之后的一个感慨的确是，但我觉得你写《贝托鲁奇》的那一段，我让我明白就一个演员，他认为一个好的导演，是能给到一些特别具体的一些指引。","sentence_en":"And at that moment I understood—it's a reflection after experiencing life. But I think the passage you wrote about Bertolucci made me realize that for an actor, a good director can give very specific guidance."},{"id":"153","start":1264.63,"end":1275.55,"displayStart":1264.63,"displayEnd":1275.55,"displayMid":1270.0900000000001,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Positive","score":0.6,"loudness":1.018842,"pitch":24.535795,"speechRate":4.945,"hasEvents":false,"sentence_source":"你当时有个描述你说，《贝托鲁奇》会跟你有很多动词，他告诉你要吃 要嚼 要塞，我说原来对演员来说，这样的导演是对演员会有帮助的。","sentence_en":"You once described that Bertolucci would give you many verbs—he'd tell you to eat, chew, stuff. I thought, so this kind of director is helpful to actors."},{"id":"154","start":1275.77,"end":1277.89,"displayStart":1275.77,"displayEnd":1277.89,"displayMid":1276.83,"speaker":"Lu Yu","speakerCo d director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.835141,"pitch":15.991244,"speechRate":4.319,"hasEvents":true,"sentence_source":"当然我最快的语速也不是那种可以让人觉得幽默好笑的程度，它就是机关枪扫射这样的把台词拖出来。","sentence_en":"Of course, my fastest speed wasn't funny or amusing; it was just rattling off lines like a machine gun."},{"id":"174","start":1429.17,"end":1431.45,"displayStart":1429.17,"displayEnd":1431.45,"displayMid":1430.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.85116,"pitch":20.911911,"speechRate":6.047,"hasEvents":true,"sentence_source":"所以这也是很具体的一个体识。","sentence_en":"So this was also a very specific insight."},{"id":"175","start":1431.45,"end":1444.11,"displayStart":1431.45,"displayEnd":1444.11,"displayMid":1437.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Positive","score":0.6,"loudness":0.850223,"pitch":20.045164,"speechRate":4.396,"hasEvents":false,"sentence_source":"其实我也学到了就是某一种类型演出的时候，可以以什么样的一种方式去做而通过这个找到了，这些都是我觉得一个好导演的对。","sentence_en":"Actually, I also learned how to approach a certain type of performance, and through that I found the way. These are what I think a good director does."},{"id":"176","start":1444.11,"end":1445.39,"displayStart":1444.11,"displayEnd":1445.39,"displayMid":1444.75,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.792221,"pitch":18.575447,"speechRate":4.219,"hasEvents":false,"sentence_source":"演员的指导。","sentence_en":"Directing actors."},{"id":"177","start":1445.39,"end":1459.13,"displayStart":1445.39,"displayEnd":1459.13,"displayMid":1452.2600000000002,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.8,"loudness":1.003745,"pitch":26.421228,"speechRate":5.798,"hasEvents":false,"sentence_source":"所以你这几十年你在每一部电影的拍摄过程当中，请你总能够从某一方面学习到一些什么，有一些成长，无论是跟好的导演合作，还是这个剧组有一种你觉得非常先进的一种工作的方式。","sentence_en":"So over these decades, during the filming of every movie, you always managed to learn something and grow, whether from working with good directors or from a crew that had a very advanced working method."},{"id":"178","start":1459.13,"end":1460.87,"displayStart":1459.13,"displayEnd":1460.87,"displayMid":1460,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":1.135683,"pitch":27.173428,"speechRate":5.634,"hasEvents":false,"sentence_source":"这个过程总能学到。","sentence_en":"You can always learn from the process."},{"id":"179","start":1460.87,"end":1465.17,"displayStart":1460.87,"displayEnd":1465.17,"displayMid":1463.02,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.990342,"pitch":22.837679,"speechRate":5.224,"hasEvents":false,"sentence_source":"是的，嗯 我就这一次因为这一阵在看一些你的电影。","sentence_en":"Yes. Well, this time, because I've been watching some of your films lately."},{"id":"180","start":1465.17,"end":1468.29,"displayStart":1465.17,"displayEnd":1468.29,"displayMid":1466.73,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.078162,"pitch":26.605192,"speechRate":7.012,"hasEvents":false,"sentence_source":"然后我突然好奇，我想在同一时间发生了一些什么。","sentence_en":"Then I got curious—I wondered what else happened at the same time."},{"id":"181","start":1468.29,"end":1474.57,"displayStart":1468.29,"displayEnd":1474.57,"displayMid":1471.4299999999998,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.006135,"pitch":26.670551,"speechRate":5.522,"hasEvents":false,"sentence_source":"然后我就想到，哎 我说小花那个1979年那个时候，就同一时期有什么电影。","sentence_en":"And I thought, hey, Little Flower was in 1979. What films were from that same period?"},{"id":"182","start":1474.57,"end":1485.45,"displayStart":1474.57,"displayEnd":1485.45,"displayMid":1480.01,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.018541,"pitch":26.739784,"speechRate":5.221,"hasEvents":false,"sentence_source":"然后我就发现在那一时期，美国出现的就是Kramer v. Kramer，克雷莫夫妇 有异形 还有现代歧视录，还有伍迪艾伦的曼哈顿。","sentence_en":"And I discovered that in that period, the U.S. had Kramer vs. Kramer, Alien, Apocalypse Now, and Woody Allen's Manhattan."},{"id":"183","start":1485.45,"end":1493.67,"displayStart":1485.45,"displayEnd":1493.67,"displayMid":1489.56,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.933652,"pitch":25.157352,"speechRate":5.312,"hasEvents":false,"sentence_source":"然后那一瞬间我还是会有一些感慨的，我就明白那时候你出去决定某种程度，就是一个本能的对的选择。","sentence_en":"At that moment, I felt something—I understood that your decision to go abroad was, to some extent, an instinctive right choice."},{"id":"184","start":1494.55,"end":1510.21,"displayStart":1494.55,"displayEnd":1510.21,"displayMid":1502.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.7,"loudness":0.857529,"pitch":20.168665,"speechRate":4.406,"hasEvents":false,"sentence_source":"其实Kramer v. Kramer 也是我们看一些参考片，内部参考片 是外部看不到的这些电影，的确是感到某一种灵感 某一种刺激，让我觉得可以学到的东西太多。","sentence_en":"Actually, Kramer vs. Kramer was also a reference film we watched—internal reference films not available outside. It really gave me inspiration and stimulation, making me feel there was so much to learn."},{"id":"185","start":1510.21,"end":1517.89,"displayStart":1510.21,"displayEnd":1517.89,"displayMid":1514.0500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.73435,"pitch":15.964286,"speechRate":3.823,"hasEvents":false,"sentence_source":"就觉得说 哎呀 我太缺乏了，当时出国留学是再自然不过的一件事情了。","sentence_en":"I felt, 'Ah, I lack so much.' Studying abroad was the most natural thing at the time."},{"id":"186","start":1517.89,"end":1521.57,"displayStart":1517.89,"displayEnd":1521.57,"displayMid":1519.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.809641,"pitch":19.445669,"speechRate":4.469,"hasEvents":false,"sentence_source":"对于一个想学习 想提高的一个人来说。","sentence_en":"For someone who wanted to learn and improve."},{"id":"187","start":1521.57,"end":1533.73,"displayStart":1521.57,"displayEnd":1533.73,"displayMid":1527.65,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":1.050918,"pitch":24.342911,"speechRate":5.631,"hasEvents":false,"sentence_source":"我记得我当年还不太理解，我说 哎呀 演员离开自己的市场，到国外去留学 我本能都会觉得可惜，但如今你在回看 你明白在那时候，他其实是必须要做的一个选择。","sentence_en":"I remember I didn't quite understand back then. I thought, 'Oh, an actor leaving his own market to study abroad—I instinctively felt it was a pity.' But now looking back, you understand that at that time, it was actually a necessary choice."},{"id":"188","start":1533.73,"end":1537.27,"displayStart":1533.73,"displayEnd":1537.27,"displayMid":1535.5,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel": t was a very simple initial intention. That's how I started making my first film, just like when I started acting as a child. I was very lucky to have an opportunity to learn by doing."},{"id":"225","start":1843.69,"end":1846.67,"displayStart":1843.69,"displayEnd":1846.67,"displayMid":1845.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Positive","score":0.6,"loudness":1.049417,"pitch":18.677176,"speechRate":4.239,"hasEvents":false,"sentence_source":"对于现场来说我是喜欢的。","sentence_en":"I like being on set."},{"id":"226","start":1846.67,"end":1851.09,"displayStart":1846.67,"displayEnd":1851.09,"displayMid":1848.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.870665,"pitch":16.534365,"speechRate":4.726,"hasEvents":false,"sentence_source":"因为我十几岁 十四岁开始就已经看到现场了。","sentence_en":"Because I've been on set since I was 14 or so."},{"id":"227","start":1851.28,"end":1866.76,"displayStart":1851.28,"displayEnd":1866.76,"displayMid":1859.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Positive","score":0.5,"loudness":0.875982,"pitch":20.876045,"speechRate":4.204,"hasEvents":false,"sentence_source":"所以现场对我来说是一个非常安全的地方，你到了现场你才会发现说，就是拍电影的这一波人是一种特殊人群，大鹏车上的这一群人，他渴望有一个领导。","sentence_en":"So the set is a very safe place for me. When you get there, you realize that the people making movies are a special kind of group. The crew—they want a leader."},{"id":"228","start":1866.76,"end":1873.82,"displayStart":1866.76,"displayEnd":1873.82,"displayMid":1870.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Film performance and director collaboration","sentiment_en":"Neutral","score":0,"loudness":0.808498,"pitch":15. 687,"displayEnd":2696.5,"displayMid":2691.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.727394,"pitch":17.600574,"speechRate":3.789,"hasEvents":false,"sentence_source":"因为有时候你会拿起来又放一下，再一次受到冲击，第一次爱上他写这种意识流的东西。","sentence_en":"Because sometimes you pick it up and put it down, and it hits you again—the first time I fell in love with his stream-of-consciousness writing."},{"id":"311","start":2696.5,"end":2697.9,"displayStart":2696.5,"displayEnd":2697.9,"displayMid":2697.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.904695,"pitch":20.960159,"speechRate":4.724,"hasEvents":false,"sentence_source":"其实是去灯塔。","sentence_en":"Actually, it was 'To the Lighthouse'."},{"id":"312","start":2697.9,"end":2711.86,"displayStart":2697.9,"displayEnd":2711.86,"displayMid":2704.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.763626,"pitch":17.523735,"speechRate":4.147,"hasEvents":false,"sentence_source":"那种也是意识流的，不是完全靠情节的，完了以后给你留下的这种人去漏空，这样一份感受，也可能就是我在一开始的时候说到的，爱于失去。","sentence_en":"That's also stream-of-consciousness, not entirely plot-driven. After reading, it leaves you with a sense of emptiness, a feeling that might be what I mentioned at the beginning: love in loss."},{"id":"313","start":2711.86,"end":2727.66,"displayStart":2711.86,"displayEnd":2727.66,"displayMid":2719.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.8,"loudness":0.785191,"pitch":18.216784,"speechRate":3.417,"hasEvents":false,"sentence_source":"它对时间 对失去，哎呀 写的如此之深刻，深刻到就是轻描淡写，非常令人满足，就是在繁忙当中，如果说夜晚，我哪怕是睡前读了两页。","sentence_en":"It writes about time and loss so profoundly—so profound that it's understated, very satisfying. When I'm busy, even if I read just two pages before bed..."},{"id":"314","start":2727.66,"end":2731.48,"displayStart":2727.66,"displayEnd":2731.48,"displayMid":2729.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.6043,"pitch":13.999477,"speechRate":3.141,"hasEvents":false,"sentence_source":"我也会得到滋养某一种安抚。","sentence_en":"...I would be nourished and comforted."},{"id":"315","start":2731.48,"end":2741.8,"displayStart":2731.48,"displayEnd":2741.8,"displayMid":2736.6400000000003,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.966421,"pitch":25.739737,"speechRate":5.375,"hasEvents":false,"sentence_source":"我读的 沃尔夫美女，读的那么多次数那么多，我就觉得他太会写了，有时候会感慨为什么他的作品，尤其是这些年越来越受欢迎。","sentence_en":"I've read Woolf so many times, and I feel he's such a great writer. Sometimes I wonder why his works, especially in recent years, have become more popular."},{"id":"316","start":2741.8,"end":2751.96,"displayStart":2741.8,"displayEnd":2751.96,"displayMid":2746.88,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.938168,"pitch":24.002213,"speechRate":4.921,"hasEvents":false,"sentence_source":"但是能够改变成电影真的很少，可能就是因为语言到了极致之后，你不需要再去帮他讲故事，不需要画面了，你改他干嘛呀。","sentence_en":"But very few have been adapted into movies. Maybe because when language reaches its peak, you don't need to tell the story with images anymore—why would you adapt it?"},{"id":"317","start":2751.96,"end":2753.22,"displayStart":2751.96,"displayEnd":2753.22,"displayMid":2752.59,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.995688,"pitch":29.560217,"speechRate":4.098,"hasEvents":true,"sentence_source":"对 很难改变。","sentence_en":"Yes, it's hard to adapt."},{"id":"318","start":2753.84,"end":2757.52,"displayStart":2753.84,"displayEnd":2757.52,"displayMid":2755.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.893838,"pitch":17.619238,"speechRate":4.076,"hasEvents":true,"sentence_source":"不能改变，他本身是一个完美的呈现。","sentence_en":"It can't be adapted—it's a perfect presentation in itself."},{"id":"319","start":2757.52,"end":2772.18,"displayStart":2757.52,"displayEnd":2772.18,"displayMid":2764.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.802659,"pitch":19.226271,"speechRate":4.093,"hasEvents":false,"sentence_source":"因为电影从小说改编电影，他是一个翻译，是将文学变成了另外一个完全不同的媒体，这个援助它越是纯粹的话，它就越难把它变成另外一个媒介。","sentence_en":"Because adapting a novel into a film is a translation, turning literature into a completely different medium. The purer the original work, the harder it is to adapt into another medium."},{"id":"320","start":2772.18,"end":2781.6,"displayStart":2772.18,"displayEnd":2781.6,"displayMid":2776.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.752643,"pitch":20.157848,"speechRate":3.886,"hasEvents":false,"sentence_source":"因为它完美，你变成另外一个媒体了，你也就不需要它了，它自己是一个完美完整的东西。","sentence_en":"Because it's perfect. If you turn it into another medium, you don't need the original anymore—it's already a perfect, complete thing."},{"id":"321","start":2781.6,"end":2797.44,"displayStart":2781.6,"displayEnd":2797.44,"displayMid":2789.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Histo ensity of attention, is actually love."},{"id":"428","start":3711.52,"end":3725.48,"displayStart":3711.52,"displayEnd":3725.48,"displayMid":3718.5,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Neutral","score":0,"loudness":0.997801,"pitch":23.785347,"speechRate":4.944,"hasEvents":false,"sentence_source":"一个人我们要拥有不同的生命体验，我要在一个情感关系当中，我是妻子 我是妈妈或者我是丈夫 是儿子，同时我也是演员 是导演，就我要体验不同的生命的经历的话。","sentence_en":"As a person, we want to have diverse life experiences. In an emotional relationship, I am a wife, a mother, or a husband, a son. At the same time, I am an actor, a director. So if I want to experience different life journeys,"},{"id":"429","start":3725.48,"end":3734.44,"displayStart":3725.48,"displayEnd":3734.44,"displayMid":3729.96,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Negative","score":-0.4,"loudness":0.934552,"pitch":22.010178,"speechRate":5.804,"hasEvents":false,"sentence_source":"我势必在某一个时刻 我缺席某一个场合，要不然我就缺席家庭 要不然我就缺席工作场合，必然要做出这种很难的选择 没办法。","sentence_en":"I will inevitably be absent from some occasion at some point. Either I miss family or I miss work. Have to make such difficult choices—no way around it."},{"id":"430","start":3734.44,"end":3737.52,"displayStart":3734.44,"displayEnd":3737.52,"displayMid":3735.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Neutral","score":0,"loudness":1.080002,"pitch":25.410444,"speechRate":4.332,"hasEvents":false,"sentence_source":"是 我其实是一个挺绝对的人。","sentence_en":"Yes, I'm actually quite an absolute person."},{"id":"431","start":3737.52,"end":3750.62,"displayStart":3737.52,"displayEnd":3750.62,"displayMid":3744.0699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Negative","score":-0.5,"loudness":0.8301,"pitch":19.108921,"speechRate":3.435,"hasEvents":true,"sentence_source":"其实我痛恨生活当中的这种中庸折中这种妥协，我喜欢绝对的东西 这也可能是，我当时觉得啊 伊丽莎白太乐。","sentence_en":"In fact, I hate the moderation and compromise in life. I like absolute things. That might be why I thought, 'Ah, Elizabeth Taylor is too much."},{"id":"432","start":3751.6,"end":3767.58,"displayStart":3751.6,"displayEnd":3767.58,"displayMid":3759.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Positive","score":0.7,"loudness":0.838803,"pitch":19.701641,"speechRate":3.51,"hasEvents":true,"sentence_source":"能够这样无畏无惧地拼着命地去付出了代价的去爱，真的是值得羡慕的，就说不能把这样的东西都变得如此之廉价，你不愿意付出代价。","sentence_en":"To love so fearlessly, desperately, and at a cost is truly enviable. We shouldn't make such things so cheap; you have to be willing to pay the price."},{"id":"433","start":3767.58,"end":3779.1,"displayStart":3767.58,"displayEnd":3779.1,"displayMid":3773.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Negative","score":-0.5,"loudness":0.714007,"pitch":18.59734,"speechRate":4.635,"hasEvents":false,"sentence_source":"就说明这个东西对你来说是廉价的爱，应该是有代价的，爱的越深代价越大，连这个代价都不愿意付出的话，你也白活了 说实话。","sentence_en":"That shows that this thing is cheap love for you. It should have a cost. The deeper the love, the greater the cost. If you're not even willing to pay that cost, you've lived in vain, to be honest."},{"id":"434","start":3779.64,"end":3794.58,"displayStart":3779.64,"displayEnd":3794.58,"displayMid":3787.1099999999997,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Roles and Life Stories","sentiment_en":"Positive","score":0.8,"loudness":1.111524,"pitch":25.37863,"speechRate":5.128,"hasEvents":false,"sentence_source":"但是泰勒在于他天赋异禀，他一方面像这样就是焚身以火似的，去追求爱情，但同时人家事业一点也没落下，而且他是一个极其聪明智慧的一个女人，他跟好莱坞谈生意的时候 y, very successful. He was the first person to step up and raise funds for AIDS."},{"id":"438","start":3825.2,"end":3838.6,"displayStart":3825.2,"displayEnd":3838.6,"displayMid":3831.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.776635,"pitch":16.535011,"speechRate":4.03,"hasEvents":false,"sentence_source":"所以道了他仍然是给予了自己生命，某一种意义，的确是人们总是把它给弄成一个，结果那么多慈婚的女人，她其实远远超过了这些。","sentence_en":"So she still gave her life a certain meaning. Indeed, people always simplify it, but for a woman who married so many times, she was far more than that."},{"id":"439","start":3839.08,"end":3848.56,"displayStart":3839.08,"displayEnd":3848.56,"displayMid":3843.8199999999997,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.7,"loudness":1.044043,"pitch":30.186596,"speechRate":6.801,"hasEvents":false,"sentence_source":"这个女人我后来也是在看我觉得太有趣，包括她最后晚年跟那个Debbie Reynolds两个人，又相逢一笑敏恩仇又拍电影，我就觉得 哇 人生啊。","sentence_en":"This woman I later watched and found so interesting, including in her later years when she and Debbie Reynolds met again, smiled away grievances, and made a movie together. I thought, wow, life."},{"id":"440","start":3848.56,"end":3854.92,"displayStart":3848.56,"displayEnd":3854.92,"displayMid":3851.74,"speaker":"Joan Chen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Actor Growth and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":1.019922,"pitch":28.436474,"speechRate":5.316,"hasEvents":false,"sentence_source":"不到最后 你真的不知道会有什么样的那种转弯，会有什么样的改变 就很有趣。","sentence_en":"Until the very end, you never know what twists and changes will come. It's very interesting."},{"id":"441","start":3855.42,"end":3863.36,"displayStart":3855.42,"displayEnd":3863.36,"displayMid":3859.3900000000003,"speaker":"Joan Chen",
