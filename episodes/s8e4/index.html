sed down through generations in this lifetime. That's all there is to it. Writing is not for achieving who you are now; it's for achieving who you will become in the future, even if you are no longer around."},{"id":"8","start":60.17,"end":63.75,"displayStart":60.17,"displayEnd":63.75,"displayMid":61.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.969308,"pitch":21.918077,"speechRate":7.051,"hasEvents":true,"sentence_source":"你的作品也是在向人说说着你是怎么样的一个作家。","sentence_en":"Your work also tells people what kind of writer you are."},{"id":"9","start":84.34,"end":86.42,"displayStart":84.34,"displayEnd":86.42,"displayMid":85.38,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.93019,"pitch":20.925156,"speechRate":2.885,"hasEvents":true,"sentence_source":"鲁豫对。","sentence_en":"Lu Yu, right?"},{"id":"10","start":88.57,"end":97.99,"displayStart":88.57,"displayEnd":97.99,"displayMid":93.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.862812,"pitch":20.151836,"speechRate":0.756,"hasEvents":true,"sentence_source":"话黎紫书鲁豫对。","sentence_en":"Li Zishu and Lu Yu talk."},{"id":"11","start":97.99,"end":110.93,"displayStart":97.99,"displayEnd":110.93,"displayMid":104.46000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.7,"loudness":1.000161,"pitch":22.082079,"speechRate":5.255,"hasEvents":false,"sentence_source":"我觉得我说话真的是很事无忌惮，我只要觉得应该说的 必须说的，我就说出了，有了这个想法，以后我觉得我在江湖上行走，好像就更快艺了，只要拿起笔去书写 去写信。","sentence_en":"I think I really speak without restraint. As long as I feel something should be said or must be said, I say it. With this mindset, I feel I move more freely in the world of writing—just pick up a pen and write, write letters."},{"id":"12","start":110.93,"end":113.09,"displayStart":110.93,"displayEnd":113.09,"displayMid":112.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":1.156161,"pitch":28.026714,"speechRate":6.019,"hasEvents":false,"sentence_source":"我觉得那个诚意就自然会出来。","sentence_en":"I think that sincerity will naturally come out."},{"id":"13","start":113.09,"end":114.63,"displayStart":113.09,"displayEnd":114.63,"displayMid":113.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":1.020331,"pitch":21.091608,"speechRate":6.767,"hasEvents":true,"sentence_source":"那个心就自然会出来。","sentence_en":"That heart will naturally come out."},{"id":"14","start":125.22,"end":126.08,"displayStart":125.22,"displayEnd":126.08,"displayMid":125.65,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":1.924854,"pitch":33.091393,"speechRate":6.107,"hasEvents":true,"sentence_source":"嗨 大家好。","sentence_en":"Hi everyone."},{"id":"15","start":126.08,"end":131.56,"displayStart":126.08,"displayEnd":131.56,"displayMid":128.82,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.100949,"pitch":25.272345,"speechRate":4.197,"hasEvents":false,"sentence_source":"欢迎来到岩中花述，这两天北京天气好到让人无法相信。","sentence_en":"Welcome to 'Story in the Stone'. The weather in Beijing these past two days has been unbelievably beautiful."},{"id":"16","start":131.56,"end":138.68,"displayStart":131.56,"displayEnd":138.68,"displayMid":135.12,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.960102,"pitch":22.882229,"speechRate":4.741,"hasEvents":false,"sentence_source":"但是已经是秋天的尾声了，真的是秋高气上，阳光惨烂人心情特别的美好而温暖。","sentence_en":"But it's already the end of autumn—crisp and clear, with brilliant sunshine that lifts your spirits and brings warmth."},{"id":"17","start":138.68,"end":143.74,"displayStart":138.68,"displayEnd":143.74,"displayMid":141.21,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.230075,"pitch":24.274136,"speechRate":5.112,"hasEvents":false,"sentence_source":"那在这样一个秋天的尾声美好的一天，我终于见到了黎紫书。","sentence_en":"On such a perfect day at autumn's close, I finally got to meet Li Zishu."},{"id":"18","start":143.74,"end":150.8,"displayStart":143.74,"displayEnd":150.8,"displayMid":147.27,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.013332,"pitch":23.478832,"speechRate":5.522,"hasEvents":false,"sentence_source":"那大家都知道黎紫书是来自马来西亚著名的作家，我是大概在2022年23年某一年。","sentence_en":"As everyone knows, Li Zishu is a renowned author from Malaysia. I think it was around 2022 or 2023."},{"id":"19","start":150.8,"end":154.07999999999998,"displayStart":150.8,"displayEnd":154.07999999999998,"displayMid":152.44,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":0.839197,"pitch":25.883253,"speechRate":5.724,"hasEvents":false,"sentence_source":"那一年几乎频繁的听到黎紫书这个名字。","sentence_en":"That year, I kept hearing Li Zishu's name constantly."},{"id":"20","start":154.07999999999998,"end":162,"displayStart":154.07999999999998,"displayEnd":162,"displayMid":158.04,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":1.059107,"pitch":25.461845,"speechRate":5.307,"hasEvents":false,"sentence_source":"然后那一年尤其到年中所有的重要的国内的文学奖项，其中必有一本书得到那个大奖就是刘苏蒂。","sentence_en":"And especially mid-year, for almost every major literary award in China, there was one book that swept the big prizes—'The Story of Su Di'."},{"id":"21","start":162,"end":164.68,"displayStart":162,"displayEnd":164.68,"displayMid":163.34,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":0.853995,"pitch":23.015842,"speechRate":6.343,"hasEvents":false,"sentence_source":"然后大家会不断的谈到黎紫书这个名字。","sentence_en":"And people couldn't stop talking about Li Zishu."},{"id":"22","start":164.68,"end":173.7,"displayStart":164.68,"displayEnd":173.7,"displayMid":169.19,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.6,"loudness":0.995949,"pitch":23.683933,"speechRate":6.648,"hasEvents":false,"sentence_source":"但是一个人跟一个人见面总是需要缘分的，从我在那一年不断听到她的名字到此刻我终于见到她，中间大概也过了可能至少一两年的时间。","sentence_en":"But meeting someone always takes fate. From the year I kept hearing her name to now finally seeing her, probably at least a year or two passed."},{"id":"23","start":173.7,"end":183.08,"displayStart":173.7,"displayEnd":183.08,"displayMid":178.39,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.003795,"pitch":21.142765,"speechRate":4.584,"hasEvents":false,"sentence_source":"所以非常高兴此刻紫书坐在我的面前，先请她跟大家打个招呼，嗨 大家好 我是黎紫书，紫书是马来西亚人。","sentence_en":"So I'm really glad to have Zishu sitting here with me now. Let's have her say hello—Hi everyone, I'm Li Zishu, from Malaysia."},{"id":"24","start":183.08,"end":193.16,"displayStart":183.08,"displayEnd":193.16,"displayMid":188.12,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.000913,"pitch":24.742559,"speechRate":5.666,"hasEvents":false,"sentence_source":"然后我们俩是同龄人，我是70年 你是71年，可能70年代末 80年代初的时候，当时我们会在亚洲不断谈到亚洲四小龙，和亚洲四小虎。","sentence_en":"And we're about the same age—I was born in '70, you in '71. Back in the late '70s and early '80s, Asia was all about the Four Asian Tigers and the Four Little Dragons."},{"id":"25","start":193.16,"end":199.18,"displayStart":193.16,"displayEnd":199.18,"displayMid":196.17000000000002,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":0.956892,"pitch":21.36664,"speechRate":5.316,"hasEvents":false,"sentence_source":"所以我从小会认为马来西亚是一个在我成长过程当中飞速发展的一个国家。","sentence_en":"So growing up, I always thought of Malaysia as a country that was rapidly developing during my childhood."},{"id":"26","start":199.18,"end":204.14,"displayStart":199.18,"displayEnd":204.14,"displayMid":201.66,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":1.075343,"pitch":28.792995,"speechRate":5.784,"hasEvents":false,"sentence_source":"那，怎么会 我觉得我们都是在马来西亚就看着中国大陆的腾飞。","sentence_en":"And then, I think we both watched China's rise from Malaysia."},{"id":"27","start":204.14,"end":215.96,"displayStart":204.14,"displayEnd":215.96,"displayMid":210.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.172264,"pitch":27.520208,"speechRate":5.819,"hasEvents":false,"sentence_source":"就看着你们怎么大国崛起 整个所有马来西亚的华人都非常的兴奋，就觉得这个大国崛起对我们马来西亚的华人是一件好事，是一个好消息 觉得中国的影响力大了。","sentence_en":"Watching your great power ascend—all the Chinese in Malaysia were so excited, feeling that this rise was a good thing, a positive sign for us."},{"id":"28","start":215.96,"end":220.6,"displayStart":215.96,"displayEnd":220.6,"displayMid":218.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.6,"loudness":1.112335,"pitch":25.70647,"speechRate":5.603,"hasEvents":false,"sentence_source":"那在马来西亚的华人的那个处境 那个地位可能也会随着提升。","sentence_en":"They felt that as China's influence grew, the situation and status of Chinese Malaysians might also improve."},{"id":"29","start":220.6,"end":225.34,"displayStart":220.6,"displayEnd":225.34,"displayMid":222.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":1.1447,"pitch":26.10004,"speechRate":5.274,"hasEvents":false,"sentence_source":"我们学习的中文我们的华文使用也派得上用场了可能将来。","sentence_en":"The Chinese we learned and used might finally come in handy someday."},{"id":"30","start":225.34,"end":239.62,"displayStart":225.34,"displayEnd":239.62,"displayMid":232.48000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.07796,"pitch":25.608883,"speechRate":5.742,"hasEvents":false,"sentence_source":"所以那时候是这真的是喜气洋洋，可能不是我们自己的国家怎么腾飞，事实上我们经历了像酒器的金融海消什么之类的挫折也挺大的，可是因为看到中国大陆的腾飞还是让我们升起了无数的希望。","sentence_en":"So back then it was really joyful. It wasn't our own country soaring—in fact, we went through big setbacks like the financial crisis—but seeing China's takeoff still gave us so much hope."},{"id":"31","start":239.62,"end":253.9,"displayStart":239.62,"displayEnd":253.9,"displayMid":246.76,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":0.97781,"pitch":26.207462,"speechRate":5.252,"hasEvents":false,"sentence_source":"我觉得这种感觉非常的微妙，就是我们是同一个种族同样的语言，虽然我们语言的口音然后语言背后的有一些审美已经发生了很微妙的，甚至巨大的改变，但我原来发现雪原的神奇。","sentence_en":"I find this feeling very subtle—same ethnicity, same language, even though accents and some aesthetic sensibilities behind the language have changed subtly or even drastically. But I discovered the magic of shared roots."},{"id":"32","start":253.9,"end":262.68,"displayStart":253.9,"displayEnd":262.68,"displayMid":258.29,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.5,"loudness":0.863811,"pitch":22.660505,"speechRate":5.409,"hasEvents":false,"sentence_source":"我会觉得基因里的东西，它有一天是会慢慢在你的文化生活方方面面展现出来的，就人最终会回到自己的原点。","sentence_en":"I believe that something in our genes will slowly reveal itself in every aspect of cultural life, and people eventually return to their origins."},{"id":"33","start":262.68,"end":278.08,"displayStart":262.68,"displayEnd":278.08,"displayMid":270.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.6,"loudness":1.04091,"pitch":26.326174,"speechRate":4.681,"hasEvents":false,"sentence_source":"也许是这样子吧，也可能是我过去年轻的时候想往到处去闯荡，可是到年纪大了，就会很清楚的意识到自己真真有归属感，生活的最愈悦的最舒适的那个地方，就是老家了。","sentence_en":"Maybe that's it. When I was young, I wanted to go out and explore, but as I got older, I clearly realized that my true sense of belonging, the place where I feel most comfortable and content, is my hometown."},{"id":"34","start":278.08,"end":279.52,"displayStart":278.08,"displayEnd":279.52,"displayMid":278.79999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","cluste Name":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.4,"loudness":1.096859,"pitch":23.244583,"speechRate":4.901,"hasEvents":false,"sentence_source":"我看了又看 或者说后来我的舅舅用金庸的武侠巧术来打发我，我就拼命看武侠巧术，就看得很杂，也在上学的时候经常到学校后面的那个书包摊那边去找日本漫画香港的连环图。","sentence_en":"I read and read, or later my uncle kept me occupied with Jin Yong's martial arts novels. I devoured them widely, and often went to the bookstall behind school for Japanese manga and Hong Kong comics."},{"id":"55","start":449.56,"end":455.14,"displayStart":449.56,"displayEnd":455.14,"displayMid":452.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.3,"loudness":1.01348,"pitch":26.656107,"speechRate":5.735,"hasEvents":false,"sentence_source":"因为在以宝这个小的地方，它不像骑龙坡，而且是一个文化丧墨，读书的人很少。","sentence_en":"Because in a small place like Yibao, it's not like Qilongpo — it's a cultural backwater, very few people read."},{"id":"56","start":455.14,"end":469.46,"displayStart":455.14,"displayEnd":469.46,"displayMid":462.29999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.093468,"pitch":25.210812,"speechRate":5.646,"hasEvents":false,"sentence_source":"所以当时那个年代连一斤像样的书店都没有，如果真的要买书 那也是我成年可能开始工作以后，到吉隆坡每次都要到书店去 而且只要进了书店，最后的时候 只要算着 等下我回去的时候要坐车。","sentence_en":"So back then, there wasn't even a decent bookstore. If I really wanted to buy books, it wasn't until I was an adult and started working that I'd go to bookstores whenever I was in Kuala Lumpur. Every time I entered a bookstore, I'd calculate: 'I need to save money for the ride back."},{"id":"57","start":469.46,"end":471.12,"displayStart":469.46,"displayEnd":471.12,"displayMid":470.28999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.258734,"pitch":22.150272,"speechRate":5.263,"hasEvents":false,"sentence_source":"要搭车 要花多少钱。","sentence_en":"How much will the bus fare cost?"},{"id":"58","start":471.12,"end":477.16,"displayStart":471.12,"displayEnd":477.16,"displayMid":474.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":1.135288,"pitch":26.424877,"speechRate":5.96,"hasEvents":false,"sentence_source":"然后我还剩下多少 我一定会把所有的钱都花光，买这一袋啦 带书 然后就去坐车回忆保。","sentence_en":"Then how much do I have left?' I'd always spend every last cent, buy a bag of books, and then take the bus back to Yibao."},{"id":"59","start":477.16,"end":480.42,"displayStart":477.16,"displayEnd":480.42,"displayMid":478.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.94755,"pitch":28.46842,"speechRate":5.093,"hasEvents":false,"sentence_source":"因为我是那样子买书得到阅读的人。","sentence_en":"Because that's how I bought books and got to read."},{"id":"60","start":480.42,"end":483.82,"displayStart":480.42,"displayEnd":483.82,"displayMid":482.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.164958,"pitch":27.413651,"speechRate":5,"hasEvents":false,"sentence_source":"所以对我来说 我阅读的作家他们的年代。","sentence_en":"So for me, the era of the writers I read..."},{"id":"61","start":483.82,"end":493.28,"displayStart":483.82,"displayEnd":493.28,"displayMid":488.54999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.997321,"pitch":23.264795,"speechRate":6.342,"hasEvents":false,"sentence_source":"对我没有影响 我读鲁迅的时候 我都不知道鲁迅是不是一个还活着的一个作家，这些作家他们生在哪个年代 对我这个读者来说一点影响都没有。","sentence_en":"doesn't matter at all. When I read Lu Xun, I didn't even know if he was still alive. What era those writers were born in has no effect on me as a reader."},{"id":"62","start":493.46,"end":494.04,"displayStart":493.46,"displayEnd":494.04,"displayMid":493.75,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.557301,"pitch":31.468187,"speechRate":10.345,"hasEvents":false,"sentence_source":"一点都不重要。","sentence_en":"It's totally unimportant."},{"id":"63","start":494.04,"end":500.34,"displayStart":494.04,"displayEnd":500.34,"displayMid":497.19,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":0.982983,"pitch":27.538855,"speechRate":4.762,"hasEvents":false,"sentence_source":"那就很有趣 因为没有影响 所以当你读你决定喜欢的完全是发自内心的。","sentence_en":"That's interesting — because there's no influence, so when you decide you like something, it's completely from the heart."},{"id":"64","start":500.34,"end":510.54,"displayStart":500.34,"displayEnd":510.54,"displayMid":505.44,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.004951,"pitch":23.704269,"speechRate":4.902,"hasEvents":false,"sentence_source":"那是什么戏 你是你站在那个书架前 翻开鲁迅 比如说孔乙级还是那函，读了那几行字以后 瞬间你就被击中了 是因为什么。","sentence_en":"What was it? Standing in front of the shelf, flipping open Lu Xun — say, 'Kong Yiji' or something — reading a few lines, and instantly you were struck. What was it about?"},{"id":"65","start":510.54,"end":522.7,"displayStart":510.54,"displayEnd":522.7,"displayMid":516.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.949024,"pitch":26.918465,"speechRate":5.811,"hasEvents":false,"sentence_source":"我想说可能你们读你们的年代的作家的时候有一种他写的东西跟你是相关的，你就生活在那个社会里头，可是对我来说大部分我的阅读的文学作品都跟我是无关的。","sentence_en":"I think maybe when you read writers from your own era, what they write is relevant to you — you live in that society. But for me, most of the literature I read has nothing to do with me."},{"id":"66","start":522.7,"end":523.98,"displayStart":522.7,"displayEnd":523.98,"displayMid":523.34,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.207527,"pitch":29.55975,"speechRate":6.25,"hasEvents":false,"sentence_source":"读的外国的作品对。","sentence_en":"Reading foreign works — yes."},{"id":"67","start":523.98,"end":525.44,"displayStart":523.98,"displayEnd":525.44,"displayMid":524.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.261857,"pitch":28.609449,"speechRate":6.944,"hasEvents":false,"sentence_source":"不管是翻译的还是中国。","sentence_en":"Whether translated or Chinese —"},{"id":"68","start":525.44,"end":538.7,"displayStart":525.44,"displayEnd":538.7,"displayMid":532.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.981848,"pitch":25.896763,"speechRate":5.43,"hasEvents":false,"sentence_source":"其实都跟我无关，我读书的时候我都不知道书里面的那个背景跟历史，我纯粹只是从文字上所表达的一种情感把我感受，可能会接中我跟我懂不懂认不认知那个小说的背景。","sentence_en":"actually none of it is related to me. When I read, I don't even know the background and history in the book. Purely from the emotions expressed through the words, I feel something — maybe it resonates with me, regardless of whether I understand or recognize the novel's background."},{"id":"69","start":538.7,"end":543.52,"displayStart":538.7,"displayEnd":543.52,"displayMid":541.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.4,"loudness":0.952532,"pitch":23.584074,"speechRate":5.187,"hasEvents":false,"sentence_source":"其实一点关系都没有，鲁逊也同样 当初我被孔义籍小说打动。","sentence_en":"It really has nothing to do with that. Same with Lu Xun — I was moved by 'Kong Yiji' back then."},{"id":"70","start":543.52,"end":558.18,"displayStart":543.52,"displayEnd":558.18,"displayMid":550.8499999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.6,"loudness":0.949975,"pitch":25.98494,"speechRate":4.357,"hasEvents":false,"sentence_source":"那时候的我一个青少年对中国的历史背景 其实了解不多，我读到的时候只是对人的一个社会里头人机的冷漠，感到惊心动魄 我就是怎么人那么残忍。","sentence_en":"At that time as a teenager, I didn't know much about China's historical background. When I read it, I was just shocked by the coldness of human relationships in society — how can people be so cruel?"},{"id":"71","start":558.18,"end":571,"displayStart":558.18,"displayEnd":571,"displayMid":564.5899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.7,"loudness":0.9009,"pitch":24.420565,"speechRate":4.465,"hasEvents":false,"sentence_source":"冷漠到这种境地大家都站在同一个阵线上，用如此冷军的眼光去看待孔义籍的时候，我是被那种人击中的 跟当时的背景和历史没有关系。","sentence_en":"When indifference reached such a point that everyone stood on the same front, looking at Kong Yiji with such cold eyes, I was struck by that kind of person. It had nothing to do with the background or history of the time."},{"id":"72","start":571,"end":577.38,"displayStart":571,"displayEnd":577.38,"displayMid":574.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.4,"loudness":0.916394,"pitch":22.785851,"speechRate":4.636,"hasEvents":false,"sentence_source":"我觉得我能够在文字里头感受到那种作者其实要批判的是这种人物。","sentence_en":"I feel that within the text, I can sense the author's intent to critique such characters."},{"id":"73","start":577.38,"end":591.26,"displayStart":577.38,"displayEnd":591.26,"displayMid":584.3199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.6,"loudness":0.918617,"pitch":20.167362,"speechRate":5.403,"hasEvents":false,"sentence_source":"但是年少的时候其实还不准确的能够感受到是什么打中自己，可是就是觉得很难受，我记得当时在中学的图书馆里头读到这个小说短篇吧，不晓得为什么就在图书馆里面哭了起来。","sentence_en":"But back then I couldn't exactly pinpoint what struck me; I just felt terrible. I remember reading that short story in my middle school library and inexplicably bursting into tears."},{"id":"74","start":591.26,"end":594.72,"displayStart":591.26,"displayEnd":594.72,"displayMid":592.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.7,"loudness":1.017363,"pitch":25.485943,"speechRate":6.678,"hasEvents":true,"sentence_source":"觉得怎么会这样子有一个很难受很难受的感觉。","sentence_en":"I felt how could this be? There was this intensely painful feeling."},{"id":"75","start":595.16,"end":599.86,"displayStart":595.16,"displayEnd":599.86,"displayMid":597.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.110853,"pitch":24.774334,"speechRate":6.43,"hasEvents":true,"sentence_source":"那个时代到底离我多远 地理上又离我多远，在那个时候我来说是一点。","sentence_en":"How distant that era was from me, geographically and temporally; at that time, it meant nothing to me."},{"id":"76","start":599.86,"end":605.04,"displayStart":599.86,"displayEnd":605.04,"displ d it particularly liberating and wonderful. I've always had a desire to share—whatever I felt, I wanted to find someone to share it with—but that desire was extremely rare, whether for joy or sorrow."},{"id":"87","start":686.8,"end":690.8,"displayStart":686.8,"displayEnd":690.8,"displayMid":688.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":1.100152,"pitch":23.346521,"speechRate":5.45,"hasEvents":false,"sentence_source":"对来说我好像都能够一个人自己去吸收 去笑话。","sentence_en":"For me, I seem to be able to absorb and digest everything on my own."},{"id":"88","start":690.8,"end":702.16,"displayStart":690.8,"displayEnd":702.16,"displayMid":696.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":0.988336,"pitch":22.102583,"speechRate":5.861,"hasEvents":false,"sentence_source":"所以虽然是小的时候都是一个比较孤僻的 特别自闭的孩子，可是我当时并没有觉得这有什么不妥，也觉得自己的情绪感受完全是自己有能力去笑话掉的。","sentence_en":"So although I was a relatively solitary, particularly withdrawn child, I never felt there was anything wrong with it, and I felt fully capable of digesting my own emotions and feelings."},{"id":"89","start":702.16,"end":712.1,"displayStart":702.16,"displayEnd":712.1,"displayMid":707.13,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.91836,"pitch":22.907852,"speechRate":4.804,"hasEvents":false,"sentence_source":"那你住的那个环境 有点像刘淑蒂的那个环境吗，包括住宅的那个样态，从来没有住过像刘苏帝里面的那个祖屋。","sentence_en":"Was the environment you lived in somewhat like Liu Shudi's? Including the style of housing—I've never lived in a 'zu wu' like in Liu Sudi's story."},{"id":"90","start":712.1,"end":722.36,"displayStart":712.1,"displayEnd":722.36,"displayMid":717.23,"speaker":"Lu Yu","speake ifferent languages, different foods, and different religions."},{"id":"120","start":926.82,"end":936.3,"displayStart":926.82,"displayEnd":936.3,"displayMid":931.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Malaysian Society and Cultural Identity","sentiment_en":"Positive","score":0.6,"loudness":0.999493,"pitch":26.106611,"speechRate":5.106,"hasEvents":false,"sentence_source":"对我们来说这种是那么自然的事情，要去接受 要去包容这个东西的存在，要去尝试别人的食物 欣赏他们的那种口味。","sentence_en":"To us, it's so natural—to accept and tolerate their existence, to try their food and appreciate their tastes."},{"id":"121","start":936.3,"end":950.18,"displayStart":936.3,"displayEnd":950.18,"displayMid":943.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Malaysian Society and Cultural Identity","sentiment_en":"Neutral","score":0,"loudness":1.101259,"pitch":24.86796,"speechRate":5.259,"hasEvents":false,"sentence_source":"对我们来说好像不会太难的事情，而对马来西亚人来说我们极少会在国外形成自己的部落，每个人都是分散的，我在美国也遇到很多马来西亚朋友，各自都是单独在纽约在LA。","sentence_en":"For us, it might not seem like a difficult thing, but for Malaysians, we rarely form our own tribes abroad. Everyone is scattered. I've met many Malaysian friends in the US, each alone in New York or LA."},{"id":"122","start":950.18,"end":952.78,"displayStart":950.18,"displayEnd":952.78,"displayMid":951.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Malaysian Society and Cultural Identity","sentiment_en":"Neutral","score":0,"loudness":1.108577,"pitch":20.968643,"speechRate":6.923,"hasEvents":false,"sentence_source":"可能那个区域里面只有他一个马来西亚人。","sentence_en":"Maybe he was the only Malaysian in that area."},{"id":"123","start":952.78,"end":965.84,"displayStart":952.78,"displayEnd":965.84,"displayMid":959.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":0.972343," chRate":5.677,"hasEvents":false,"sentence_source":"对我造成多大的伤害或阴影，而父母的事情可以说我妈从来没有直面的，正式的跟我说我嫁离的情况，我爸还有另外一个家庭，可是你就是在一个成长，但小孩知道，你阴影的在成长的过程中。","sentence_en":"...caused me much harm or shadow. And regarding my parents' affairs, I can say my mom never directly or formally told me about the divorce situation – that my dad had another family. But you grow up, and as a child you know, and you have shadows during the growing process."},{"id":"219","start":1814.66,"end":1825.58,"displayStart":1814.66,"displayEnd":1825.58,"displayMid":1820.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.986117,"pitch":25.688122,"speechRate":6.144,"hasEvents":false,"sentence_source":"就是你减一些那你减一些，听到我妈跟阿姨们讲话的那些内容，慢慢的这个东西就拼凑起来，你就知道爸爸在金融坡，之所以我爸有什么每个礼拜只回来一次两天。","sentence_en":"You pick up bits and pieces from my mom talking to her friends, and slowly you piece it together. You realize Dad is in Financial Slope, that's why he only comes back once a week for two days."},{"id":"220","start":1825.58,"end":1834.46,"displayStart":1825.58,"displayEnd":1834.46,"displayMid":1830.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.927981,"pitch":25.367174,"speechRate":6.081,"hasEvents":false,"sentence_source":"原来他在金融坡有一另外一个家，这个东西全部是自己凑起来的，从来我妈没有直接跟我们说过，你看我们成长70年代，我在中国。","sentence_en":"Turns out he had another family in Financial Slope. I figured it all out on my own; Mom never told us directly. You see, we grew up in the 70s, in China."},{"id":"221","start":1834.46,"end":1846.68,"displayStart":1834.46,"displayEnd":1846.68,"displayMid":1840.5700000000002,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.903844,"pitch":25.203789,"s l world."},{"id":"334","start":2828.54,"end":2833.44,"displayStart":2828.54,"displayEnd":2833.44,"displayMid":2830.99,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":1.183771,"pitch":28.343803,"speechRate":5.918,"hasEvents":true,"sentence_source":"那当时你在做报道说你用的名字是你的本名保林还是黎紫书本名啊。","sentence_en":"When you were reporting, did you use your real name, Lin Baolin, or your pen name Li Zishu?"},{"id":"335","start":2833.44,"end":2842.34,"displayStart":2833.44,"displayEnd":2842.34,"displayMid":2837.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":0.957657,"pitch":28.773695,"speechRate":5.359,"hasEvents":false,"sentence_source":"我分得很清楚 就是我只有在进行文学创作的时候 我是用黎紫书这一笔名，在新闻工作上我是用林保林我的原名。","sentence_en":"I keep them very separate: I only use the pen name Li Zishu for literary creation, and for journalism I use my original name Lin Baolin."},{"id":"336","start":2842.34,"end":2849.9,"displayStart":2842.34,"displayEnd":2849.9,"displayMid":2846.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Negative","score":-0.5,"loudness":1.002735,"pitch":24.812029,"speechRate":5.101,"hasEvents":false,"sentence_source":"因为这个事情我甚至跟我的上市当时闹翻了啊 他们在办一个看屋的时候要调我去当主编。","sentence_en":"Because of this, I even had a falling out with my superiors. When they were starting a new section, they wanted to transfer me to be editor-in-chief..."},{"id":"337","start":2851.66,"end":2857.64,"displayStart":2851.66,"displayEnd":2857.64,"displayMid":2854.6499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Negative","score":-0.6,"loudness":0.907865,"pitch":26.471146,"speechRate":5.686,"hasEvents":true,"sentence_source":"的名气比林宝林的名气大，可是我就跟他们吵翻天脑，就不能接受这个事情。","sentence_en":"...(Li Zishu's) fame was greater than Lin Baolin's, but I argued fiercely with them; I couldn't accept that."},{"id":"338","start":2857.64,"end":2866.62,"displayStart":2857.64,"displayEnd":2866.62,"displayMid":2862.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":0.96036,"pitch":23.717319,"speechRate":5.83,"hasEvents":false,"sentence_source":"对我来说，黎紫书是我自己另外竞赢出来的一个生命的伪度，是另外一个身份，我不想把它搞混了，当然也出过很多搞笑的事情。","sentence_en":"For me, Li Zishu is a dimension of life I earned separately, another identity. I don't want to mix them up. Of course, many funny things happened."},{"id":"339","start":2866.62,"end":2871.62,"displayStart":2866.62,"displayEnd":2871.62,"displayMid":2869.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Positive","score":0.5,"loudness":0.959552,"pitch":23.778986,"speechRate":6.701,"hasEvents":false,"sentence_source":"因为有一些报纸的读者，特别喜欢林宝林写的一些报导，或者一个直视评论转转。","sentence_en":"Because some newspaper readers particularly liked certain reports or editorial comments written by Lin Baolin."},{"id":"340","start":2871.62,"end":2885.04,"displayStart":2871.62,"displayEnd":2885.04,"displayMid":2878.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":1.048488,"pitch":25.533039,"speechRate":5.885,"hasEvents":false,"sentence_source":"但是他们并不曉得，这个人还有另外一个比名叫，有一个读者他一向很喜欢林宝林写的评论，他不是文学挂的读者 可是有一天他不小心无意之间读了一篇写的短片小说。","sentence_en":"But they didn't know this person had another pen name. There was a reader who always liked Lin Baolin's commentary. He wasn't a literary reader, but one day he accidentally read a short story."},{"id":"341","start":2885.04,"end":2897.62,"displayStart":2885.04,"displayEnd":2897.62,"displayMid":2891.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Positive","score":0.6,"loudness":1.048151,"pitch":24.430183,"speechRate":5.705,"hasEvents":false,"sentence_source":"大受感触 觉得很好 他还以为这个是一个老作家什么之类，后来他跟他的一个作家朋友提到的事情 朋友就跟他说，就是你向来喜欢的那个专栏作者林宝林。","sentence_en":"He was deeply moved and thought it was excellent. He assumed it was by an old writer. Later he mentioned it to a writer friend, who said, 'That's Lin Baolin, the columnist you've always liked."},{"id":"342","start":2897.62,"end":2911.02,"displayStart":2897.62,"displayEnd":2911.02,"displayMid":2904.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Positive","score":0.7,"loudness":0.987792,"pitch":23.159187,"speechRate":5.391,"hasEvents":false,"sentence_source":"这个人受到很大的激荡 他是马来西亚的一个商人 富豪吧，他打电话到我工作的办事处 向我表达了他多么激动，她发现这两个人是同一个人，她觉得她需要为我做一点什么。","sentence_en":"This person was greatly shaken. He was a Malaysian businessman, wealthy. He called my office, thrilled to discover they were the same person, and felt he needed to do something for me."},{"id":"343","start":2911.02,"end":2923.1,"displayStart":2911.02,"displayEnd":2923.1,"displayMid":2917.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.059373,"pitch":24.688679,"speechRate":5.294,"hasEvents":false,"sentence_source":"就问我说你不是没上过大学吗，你想要上大学吗，就想要跟我去读书，给出这样子的offle，我就跟她说好不容易，你才不用再上学，你又不要把我送到。","sentence_en":"He asked me, 'Didn't you go to university? Do you want to go?' He made such an offer. I told him, 'It's not easy—I finally don't have to go to school, and you want to send me back?"},{"id":"344","start":2923.1,"end":2924.06,"displayStart":2923.1,"displayEnd":2924.06,"displayMid":2923.58,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.228227,"pitch":28.045507,"speechRate":4.167,"hasEvents":false,"sentence_source":"学校去吗。","sentence_en":"To school?"},{"id":"345","start":2924.81,"end":2936.05,"displayStart":2924.81,"displayEnd":2936.05,"displayMid":2930.4300000000003,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.908642,"pitch":26.031742,"speechRate":5.388,"hasEvents":false,"sentence_source":"那你当时没有想过，我对文字这么敏感，你又很喜欢阅读也写作，你为什么不去吉隆坡、新加坡，或者来到中国北京读一个中文系，我喜欢看书我从。","sentence_en":"Then you didn't think at the time—since I'm so sensitive to words and you love reading and writing—why didn't you go to Kuala Lumpur, Singapore, or Beijing to study Chinese literature? I like reading, I..."},{"id":"346","start":2936.05,"end":2944.59,"displayStart":2936.05,"displayEnd":2944.59,"displayMid":2940.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.6,"loudness":0.958827,"pitch":24.808344,"speechRate":5.152,"hasEvents":false,"sentence_source":"小就閱讀大量的书，而我觉得写作这个事情不见得是需要上学去学的，我很小就知道我比其他孩子更能写。","sentence_en":"read a lot of books from a young age, and I feel writing doesn't need to be learned in school. I knew from early on that I could write better than other kids."},{"id":"347","start":2944.59,"end":2949.75,"displayStart":2944.59,"displayEnd":2949.75,"displayMid":2947.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.901186,"pitch":23.9867,"speechRate":5.744,"hasEvents":false,"sentence_source":"我觉得不是因为我成绩比他们好，不是因为我能学习，而是我看书多。","sentence_en":"I think it's not because my grades were better or because I could study well, but because I read more."},{"id":"348","start":2949.75,"end":2962.29,"displayStart":2949.75,"displayEnd":2962.29,"displayMid":2956.02,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.984576,"pitch":23.619545,"speechRate":5.502,"hasEvents":false,"sentence_source":"但是你看啊，像我小时候我就一直认为作家是一个职业，当然如今在中国也还是有职业作家，你有很多渠道也可以自己去写，我想认为你只有成为作家你才有可能写作。","sentence_en":"But you see, as a child I always thought writer was a profession. Of course, in China today there are still professional writers. You have many channels to write on your own. I thought you had to become a writer to write."},{"id":"349","start":2962.29,"end":2971.63,"displayStart":2962.29,"displayEnd":2971.63,"displayMid":2966.96,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.103253,"pitch":24.129055,"speechRate":6.095,"hasEvents":false,"sentence_source":"那你也大概知道成为作家的方式，我向报社向哪里投稿 你被发表 出书 然后成为作家，你当时能够看到成为作家的路径是什么呀。","sentence_en":"Then you probably know the way to become a writer: submit to newspapers, get published, publish a book, then become a writer. What path to becoming a writer could you see back then?"},{"id":"350","start":2971.63,"end":2982.45,"displayStart":2971.63,"displayEnd":2982.45,"displayMid":2977.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.4,"loudness":0.965272,"pitch":27.64373,"speechRate":5.128,"hasEvents":false,"sentence_source":"没有 在马来西亚怎么会跟中国一样，马来西亚没有这个市场 你不可能想要用写作来谋生，但只要你出国一两本书 你也会被称为作家。","sentence_en":"No, how could it be the same in Malaysia as in China? Malaysia doesn't have that market. You can't make a living by writing. But if you publish a couple of books, you'll also be called a writer."},{"id":"351","start":2982.45,"end":2989.21,"displayStart":2982.45,"displayEnd":2989.21,"displayMid":2985.83,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.906681,"pitch":18.538805,"speechRate":5.325,"hasEvents":false,"sentence_source":"你之前 有没有一样能够在商业上还比较成功，能够养活自己 活得不错的作家 只凭写作。","sentence_en":"Have you ever had any writer who was commercially successful, able to support themselves and live well, just by writing?"},{"id":"352","start":2989.21,"end":2994.61,"displayStart":2989.21,"displayEnd":2994.61,"displayMid":2991.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.103971,"pitch":24.643059,"speechRate":7.15,"hasEvents":false,"sentence_source":"在马来西亚的话 可能只出过一条温锐安的吧，她是写武侠小说﹐ 温宇安是我们，时候看的。","sentence_en":"In Malaysia, maybe only Wen Ruian? She wrote wuxia novels. Wen Yu'an was someone we read when we were young."},{"id":"353","start":2994.61,"end":3007.37,"displayStart":2994.61,"displayEnd":3007.37,"displayMid":3000.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.899984,"pitch":22.882107,"speechRate":4.389,"hasEvents":false,"sentence_source":"对呀 她是写武侠小说，在我们纯的文学创作者眼中，她也不算是文学挂的，但她应该是唯一一个又写作来谋生，了解成功了吧，之后都没有。","sentence_en":"Right, she wrote wuxia novels. In the eyes of pure literary creators, she's not considered literary either. But she might be the only one who made a living by writing, succeeded? After that, none."},{"id":"354","start":3007.37,"end":3013.77,"displayStart":3007.37,"displayEnd":3013.77,"displayMid":3010.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","senti peechRate":5.871,"hasEvents":false,"sentence_source":"那对你来说 在漫长岁月当中，你其实 折腹等待那个机会，它意味着什么了，有一天我能写 它又意味着什么了。","sentence_en":"Then for you, over the long years, you were waiting patiently for that opportunity. What did it mean? What did it mean that one day I could write?"},{"id":"359","start":3030.67,"end":3044.31,"displayStart":3030.67,"displayEnd":3044.31,"displayMid":3037.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.945808,"pitch":26.090769,"speechRate":4.773,"hasEvents":false,"sentence_source":"但是并没有真的想要去，计划要成为一个全职的作家，这个事情 我不知道，很多年的记者吗，当然在当记者之前，我打过很多砸工，就是卖个鞋子，在厨房女帮工。","sentence_en":"But I never really planned to become a full-time writer. I don't know—many years as a journalist? Before that, I had many odd jobs: selling shoes, working as a kitchen helper."},{"id":"360","start":3044.31,"end":3051.73,"displayStart":3044.31,"displayEnd":3051.73,"displayMid":3048.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.975424,"pitch":26.903267,"speechRate":4.987,"hasEvents":false,"sentence_source":"或者当过小学的临时教室一堆的，当时每一份工作我自己觉得我会一辈子都打这份工作。","sentence_en":"Or worked as a temporary teacher in primary school, all sorts. At the time, for each job, I thought I'd do it for life."},{"id":"361","start":3051.73,"end":3059.67,"displayStart":3051.73,"displayEnd":3059.67,"displayMid":3055.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.876376,"pitch":22.839617,"speechRate":5.02,"hasEvents":false,"sentence_source":"但是我也不介意一辈子打这种工作，当时我真的没有对自己的将来有什么特别大的想象。","sentence_en":"But I didn't mind doing such jobs forever. Back then, I had no big imagination for my future."},{"id":"362","start":3059.67,"end":3063.03,"displayStart":3059.67,"displayEnd":3063.03,"displayMid":3061.3500000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.095759,"pitch":28.939489,"speechRate":6.918,"hasEvents":false,"sentence_source":"我觉得这样子有份工作可以养活自己也就差不多了。","sentence_en":"I felt that having a job to support myself was enough."},{"id":"363","start":3063.03,"end":3073.25,"displayStart":3063.03,"displayEnd":3073.25,"displayMid":3068.1400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":0.892248,"pitch":23.556658,"speechRate":5.479,"hasEvents":false,"sentence_source":"然后你可能就找了一个男的校服教子，或者说就嫁人过普通通的生活，没有看到自己的将来有什么其他的可能性，可是就是喜欢写作嘛。","sentence_en":"Then maybe you'd find a man to marry, live an ordinary life, not seeing any other possibilities. But you just liked writing."},{"id":"364","start":3073.25,"end":3076.85,"displayStart":3073.25,"displayEnd":3076.85,"displayMid":3075.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Neutral","score":0,"loudness":1.028386,"pitch":30.637833,"speechRate":5.18,"hasEvents":true,"sentence_source":"然后有一天发现我家你订阅的一份华文报。","sentence_en":"Then one day I discovered a Chinese newspaper subscribed to at home."},{"id":"367","start":3163.79,"end":3176.57,"displayStart":3163.79,"displayEnd":3176.57,"displayMid":3170.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Journalism and Creative Philosophy","sentiment_en":"Positive","score":0.5,"loudness":0.947434,"pitch":24.215645,"speechRate":4.601,"hasEvents":true,"sentence_source":"鲁豫对话，我出去采访的时候 我马上能够进入被采访者的那个语境里头去跟他打较到，这下跟外注入的谈 然后等下你可能就跟那个学者谈。","sentence_en":"Lu Yu's dialogue: when I go out to interview, I can immediately enter the 356,"pitch":22.949722,"speechRate":5.99,"hasEvents":false,"sentence_source":"那个学习能力 模仿能力都是很高很强的人。","sentence_en":"...I had strong learning and imitation abilities."},{"id":"379","start":3262.17,"end":3275.59,"displayStart":3262.17,"displayEnd":3275.59,"displayMid":3268.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":1.006246,"pitch":26.366467,"speechRate":5.514,"hasEvents":true,"sentence_source":"但是比起我的其他的写作同行，他们本身都是在大学里面教书的，有的很高的学历 学养很分厚，比起这些人 我自己知道我最大的优势就是，我当记者 我的打工，还有这些人生的阅历。","sentence_en":"But compared to other writing peers—many taught at universities with high degrees and deep knowledge—I knew my biggest advantage was my experience as a journalist, my day jobs, and life experiences."},{"id":"380","start":3275.59,"end":3279.95,"displayStart":3275.59,"displayEnd":3279.95,"displayMid":3277.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.6,"loudness":0.93399,"pitch":19.68602,"speechRate":5.505,"hasEvents":true,"sentence_source":"我接触的社会层面，我很清楚知道这才是我最大的保障吧。","sentence_en":"The social circles I encountered—I knew that was my greatest asset."},{"id":"381","start":3280.47,"end":3284.69,"displayStart":3280.47,"displayEnd":3284.69,"displayMid":3282.58,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":0.980686,"pitch":27.445692,"speechRate":5.57,"hasEvents":true,"sentence_source":"我现在发现作为一个作家 她的人生经历太重要了。","sentence_en":"I now realize that for a writer, life experience is crucial."},{"id":"382","start":3284.69,"end":3289.43,"displayStart":3284.69,"displayEnd":3289.43,"displayMid":3287.06,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Lite n Chinese writers who studied in Taiwan, and they're quite popular there."},{"id":"431","start":3615.91,"end":3621.49,"displayStart":3615.91,"displayEnd":3621.49,"displayMid":3618.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.904052,"pitch":25.521404,"speechRate":5.778,"hasEvents":false,"sentence_source":"我们觉得我们没在台湾念书留学的一个本土作者，如果能得到台湾文学奖。","sentence_en":"We local authors who didn't study in Taiwan felt that if we could win a Taiwanese literary award,"},{"id":"432","start":3621.49,"end":3633.29,"displayStart":3621.49,"displayEnd":3633.29,"displayMid":3627.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":0.942494,"pitch":26.947451,"speechRate":5.834,"hasEvents":false,"sentence_source":"然后得到台湾出版社的认可，甚至他们的文台你会邀请你去做一些活动，就认可了你在中文文堂的那个地位的时候，一定觉得我们应该最远去到那里已经是最远了。","sentence_en":"and then gain recognition from Taiwanese publishers, even get invited to events, that would affirm our place in the Chinese literary world. We thought that was as far as we could go."},{"id":"433","start":3633.29,"end":3646.29,"displayStart":3633.29,"displayEnd":3646.29,"displayMid":3639.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.918757,"pitch":26.338827,"speechRate":5.102,"hasEvents":false,"sentence_source":"当然我这几年因为刘淑蒂在中国大陆的被广泛的欢迎，这个事情对我们马华作者来说又是另外一个更高的一个鼓舞，过去我们根本没有想到有这样的一天。","sentence_en":"Of course, in recent years, because Liu Shudi has been widely welcomed in mainland China, that's been an even bigger boost for us Malaysian Chinese writers. We never imagined such a day would come."},{"id":"434","start":3646.29,"end":3659.59,"displayStart":3646.29,"displayEnd":3659.59,"displayMid":3652.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Negative","score":-0.6,"loudness":1.054196,"pitch":25.050018,"speechRate":5.14,"hasEvents":false,"sentence_source":"所以相对来说这些年，应该也不仅仅是中文的世界吧，在英文的世界其实也都是一样的，就是文学的阅读 断崖式的下降跟伪说，各地的出版社或者作者都在惨教。","sentence_en":"So relatively speaking, these days it's not just in the Chinese world—the same is true in the English world: literary reading has fallen off a cliff, and publishers and authors everywhere are struggling."},{"id":"435","start":3659.59,"end":3672.31,"displayStart":3659.59,"displayEnd":3672.31,"displayMid":3665.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.6,"loudness":0.908781,"pitch":23.960699,"speechRate":4.796,"hasEvents":false,"sentence_source":"觉得读者越来越少 没有人读书 出版困难，可是在这个情况之下，马华文学其实是相对来说是比较蓬勃的，就是我们看到希望我们越南可以去的更远。","sentence_en":"They feel there are fewer readers, no one reads, publishing is hard. But in this situation, Malaysian Chinese literature is actually relatively thriving. We see hope that we can go further."},{"id":"436","start":3672.31,"end":3676.29,"displayStart":3672.31,"displayEnd":3676.29,"displayMid":3674.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":0.955013,"pitch":27.734604,"speechRate":6.003,"hasEvents":false,"sentence_source":"作为一个粒子 说我们有可能不仅仅去到台湾。","sentence_en":"As an example, it shows we might not only go to Taiwan."},{"id":"437","start":3676.29,"end":3688.51,"displayStart":3676.29,"displayEnd":3688.51,"displayMid":3682.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.926303,"pitch":25.272696,"speechRate":5.401,"hasEvents":false,"sentence_source":"我们也可能去到中国大陆 并且不是仅仅出版一本书这么简单，而是受到那边的读者的喜爱 跟文谈的认可肯定，原来我们可以去到这么远 所以我的这个粒子吧。","sentence_en":"We might also go to mainland China—and not just publish a book, but be loved by readers there and recognized by the literary circle. So we can go this far. That's my example."},{"id":"438","start":3688.51,"end":3691.65,"displayStart":3688.51,"displayEnd":3691.65,"displayMid":3690.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.5,"loudness":1.18872,"pitch":30.87948,"speechRate":6.387,"hasEvents":false,"sentence_source":"对于马华来说 可以释放出一个很重要的信息。","sentence_en":"For Malaysian Chinese literature, it sends a very important message."},{"id":"439","start":3691.65,"end":3694.11,"displayStart":3691.65,"displayEnd":3694.11,"displayMid":3692.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.7,"loudness":0.91228,"pitch":18.963646,"speechRate":6.098,"hasEvents":false,"sentence_source":"我们其实是比较被鼓舞的 我感觉到。","sentence_en":"We are actually quite encouraged, I feel."},{"id":"440","start":3694.55,"end":3706.89,"displayStart":3694.55,"displayEnd":3706.89,"displayMid":3700.7200000000003,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.6,"loudness":0.98788,"pitch":24.191463,"speechRate":5.448,"hasEvents":false,"sentence_source":"我觉得刘素帝最有意思的一点 也是很难的一点，他就是一个群像 他就是一个很鲜活很丰富的一个世界，我特别好奇 就是当你创作这样一个丰富的世界的时候。","sentence_en":"I think the most interesting and difficult thing about Liu Sudi is that it's an ensemble piece—a very vivid and rich world. I'm curious: when you create such a rich world,"},{"id":"441","start":3706.89,"end":3718.23,"displayStart":3706.89,"displayEnd":3718.23,"displayMid":3712.56,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.030699,"pitch":23.718237,"speechRate":5.82,"hasEvents":false,"sentence_source":"你是在脑海当中先有这样一个人物的图，他们生活的场景全部都马好了之后才开始动笔，还是动笔的时候一个一个人物自然地成长出来，是这个成长带着你走。","sentence_en":"do you first have a picture of the characters and their life scenes all set before you start writing, or do the characters naturally grow out as you write, and that growth leads you?"},{"id":"442","start":3718.23,"end":3733.61,"displayStart":3718.23,"displayEnd":3733.61,"displayMid":3725.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.958818,"pitch":26.899727,"speechRate":5.22,"hasEvents":false,"sentence_source":"这就是我刚才说的 我觉得我过去的人生的历练，我的经验面当记者的过程给我最大的养分，这一部分处理马华社会的一个人物群像这样的一个小说，我真的相信 除了我 没几个人可以写出来。","sentence_en":"This is what I just said—I believe the greatest nourishment from my past life experiences and my journey as a journalist is this: when it comes to writing a novel that portrays a group portrait of figures in Malaysian Chinese society, I truly believe that aside from me, few people could write it."},{"id":"443","start":3733.61,"end":3745.27,"displayStart":3733.61,"displayEnd":3745.27,"displayMid":3739.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Positive","score":0.7,"loudness":0.92758,"pitch":24.561157,"speechRate":5.852,"hasEvents":false,"sentence_source":"因为你知道 很清楚 我有点把握，你对马华这个华人社会的那个了解 你认识的 见过的这些人，你跟他们清谈 那些时间都不是百费的，都在这个小说里面能够派成用场。","sentence_en":"Because you know clearly—I'm somewhat confident—your understanding of Malaysian Chinese society, the people you know and have met, the time you spent talking with them isn't wasted; it all gets used in this novel."},{"id":"444","start":3745.27,"end":3752.81,"displayStart":3745.27,"displayEnd":3752.81,"displayMid":3749.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.047508,"pitch":25.546762,"speechRate":6.145,"hasEvents":false,"sentence_source":"里面的人物 一开始写的时候就知道 这会是一个群像小说，我甚至没打算 要有一个非常清晰的一个主人公。","sentence_en":"The characters in it—from the start I knew it would be an ensemble novel. I didn't even plan to have a very clear protagonist."},{"id":"445","start":3752.81,"end":3755.37,"displayStart":3752.81,"displayEnd":3755.37,"displayMid":3754.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":0.874695,"pitch":26.621708,"speechRate":5.952,"hasEvents":false,"sentence_source":"然后要沿着他的人生去写一个故事。","sentence_en":"Then to write a story along his life."},{"id":"446","start":3755.37,"end":3769.31,"displayStart":3755.37,"displayEnd":3769.31,"displayMid":3762.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Positive","score":0.6,"loudness":0.909779,"pitch":25.329962,"speechRate":5.739,"hasEvents":false,"sentence_source":"我觉得我就是要写个群像，群像对我来说首要条件是每一个人物都不能重叠，每一个人都有他自己的独特性，都是一个人物，你不能会觉得这个人跟那个人你会搞混，他们就是每一个都是不一样。","sentence_en":"I felt I just wanted to write an ensemble. For me, the first condition for an ensemble is that no character overlaps; each has their own uniqueness, each is a distinct character. You won't confuse one with another—they're all different."},{"id":"447","start":3769.31,"end":3781.23,"displayStart":3769.31,"displayEnd":3781.23,"displayMid":3775.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.017605,"pitch":23.921341,"speechRate":4.806,"hasEvents":false,"sentence_source":"这才是写群像的理由，开始的时候每一个人物其实就已经设定好了，就是我知道这个楼里面我要写到谁，就是银行一家 拉主一家 细会一家。","sentence_en":"That's the reason for writing an ensemble. At the start, each character was already set. I knew who I would write about in this building: the Yinhang family, the Lazhu family, the Xihui family."},{"id":"448","start":3781.23,"end":3788.13,"displayStart":3781.23,"displayEnd":3788.13,"displayMid":3784.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.068841,"pitch":26.320887,"speechRate":4.966,"hasEvents":false,"sentence_source":"然后一些周边的人物卖中表的，我是先弄出了一个列表 编年时一样的时间列表。","sentence_en":"For peripheral characters selling watches, I first made a timeline, like a chronological list."},{"id":"449","start":3788.13,"end":3796.65,"displayStart":3788.13,"displayEnd":3796.65,"displayMid":3792.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":0.967424,"pitch":26.101963,"speechRate":5.223,"hasEvents":false,"sentence_source":"所以不仅仅是这个主物里面的事情，包括马来西亚当时的背景，比如说南北大道终于启用的时候是哪一年。","sentence_en":"So it's not just about the main plot, but also Malaysia's background at the time, like the year the North-South Expressway finally opened."},{"id":"450","start":3796.65,"end":3800.27,"displayStart":3796.65,"displayEnd":3800.27,"displayMid":3798.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Reading and Writing Growth","sentiment_en":"Neutral","score":0,"loudness":1.008128,"pitch":26.508829,"speechRate":4.972,"hasEvents":false,"sentence_source":"那一年然后就对照到大会是那一年回来的。","sentence_en":"That year was then cross-referenced with when the conference came back."},{"id":"451","start":3800.27,"end":3803.75,"displayStart":3800.27,"displayEnd":3803.75,"displayMid":3802.01,"speaker":"Lu Yu","speakerColor":"#99 s":1.071592,"pitch":24.255081,"speechRate":5.536,"hasEvents":false,"sentence_source":"因为我的理解写长篇不是说我写一个一万字的小说，跟我写一个多少万字我乘以几倍，它不是这样一个概念，它的体量当然我是无法想象的，我只能够去尽可能的去想象。","sentence_en":"Because from my understanding, writing a novel isn't about multiplying a short story's word count. The scale is unimaginable; I can only try to imagine."},{"id":"469","start":4045.67,"end":4053.93,"displayStart":4045.67,"displayEnd":4053.93,"displayMid":4049.8,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":1.0576,"pitch":23.066694,"speechRate":7.022,"hasEvents":false,"sentence_source":"所以我知道你每次写长篇，你的身体会有一个本能的反应是，就是你只有在创作过程当中，会有那样强烈的身体反应，写完之后就好了对对对。","sentence_en":"So I know that whenever you write a novel, your body has a physical reaction—only during the process, and it stops after finishing. Yes, yes."},{"id":"470","start":4053.93,"end":4066.27,"displayStart":4053.93,"displayEnd":4066.27,"displayMid":4060.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Writer Growth and Literary Creation","sentiment_en":"Neutral","score":0,"loudness":0.974522,"pitch":25.231339,"speechRate":5.717,"hasEvents":false,"sentence_source":"我之前写第一个长篇小说的时候，自己根本不知道这个是长篇小说正后群，我不知道，第一次在英国写我的第一部长篇，告别的年代的时候，写到尾部吧，大概写了三分之二。","sentence_en":"When I wrote my first novel, I had no idea it was a novel. The first time was in England, writing 'The Age of Goodbyes.' Near the end, about two-thirds in."},{"id":"471","start":4066.27,"end":4080.95,"displayStart":4066.27,"displayEnd":4080.95,"displayMid":4073.6099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Career Choices and Life Transitions","sentiment_en":"Negative","score":-0.6,"loudness":1.01542,"pitch":26.031561,"speechRate":5.313,"hasEvents":false,"sentence_source":"到最后的时候突然间身体出了很大的状况，就是经常天旋地转，要偶兔兔到岛地不起，这种状况什么时候都可能发生，有时候你在写作的时候，你在吃饭的时候，有时候在睡觉的时候晚上睡着。","s iscovered those possibilities, I actually wanted to pursue them."},{"id":"593","start":5244.21,"end":5245.41,"displayStart":5244.21,"displayEnd":5245.41,"displayMid":5244.8099999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.7,"loudness":1.238931,"pitch":30.438023,"speechRate":5.941,"hasEvents":false,"sentence_source":"那你就去追吧。","sentence_en":"So I just went for it."},{"id":"594","start":5245.41,"end":5247.87,"displayStart":5245.41,"displayEnd":5247.87,"displayMid":5246.639999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.0212,"pitch":24.640076,"speechRate":7.075,"hasEvents":false,"sentence_source":"但是也因为没孩子也是比较容易的。","sentence_en":"But also because I had no kids, it was easier."},{"id":"595","start":5247.87,"end":5251.03,"displayStart":5247.87,"displayEnd":5251.03,"displayMid":5249.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.840506,"pitch":25.813847,"speechRate":5.212,"hasEvents":false,"sentence_source":"那跟自己的丈夫说的事情也就这样子。","sentence_en":"And that's what I told my husband."},{"id":"596","start":5251.03,"end":5256.75,"displayStart":5251.03,"displayEnd":5256.75,"displayMid":5253.889999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.830334,"pitch":24.012756,"speechRate":5.664,"hasEvents":false,"sentence_source":"我觉得自己已经留不住了，可是他没有做错什么事情，他甚至跟我说愿意等我。","sentence_en":"I felt I couldn't stay any longer, but he hadn't done anything wrong. He even said he was willing to wait for me."},{"id":"597","start":5256.75,"end":5258.25,"displayStart":5256.7 "C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.978026,"pitch":22.386036,"speechRate":5.611,"hasEvents":false,"sentence_source":"因为他们一定会阻止我这么干，我已经决定了，就是这样子，后来就是躲起来就想想，以后自己到底要干什么呢。","sentence_en":"Because they would definitely try to stop me. I had already decided, and that was that. Later, I just hid and thought about what I was going to do with my life."},{"id":"602","start":5275.23,"end":5276.25,"displayStart":5275.23,"displayEnd":5276.25,"displayMid":5275.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.077958,"pitch":26.96936,"speechRate":5.263,"hasEvents":false,"sentence_source":"那就想到说。","sentence_en":"Then I thought,"},{"id":"603","start":5276.25,"end":5284.03,"displayStart":5276.25,"displayEnd":5284.03,"displayMid":5280.139999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":0.911223,"pitch":23.541447,"speechRate":5.656,"hasEvents":false,"sentence_source":"其实我真正喜欢的就是写作 写小说，而且整个马来西亚 华文台，但可能只有我一个也许有这个条件去尝试。","sentence_en":"What I truly love is writing, writing novels. In the entire Malaysian Chinese literary scene, I might be the only one with the chance to try."},{"id":"604","start":5284.03,"end":5285.49,"displayStart":5284.03,"displayEnd":5285.49,"displayMid":5284.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":0.755396,"pitch":18.50246,"speechRate":4.795,"hasEvents":false,"sentence_source":"所以我就尝试吧。","sentence_en":"So I gave it a try."},{"id":"605","start":5285.49,"end":5291.09,"displayStart":5285.49,"displayEnd":5291.09,"displayMid":5288.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.064108,"pitch":29.394371,"speechRate":6.196,"hasEvents":false,"sentence_source":"因为那时候你具体截然一生呢，你没有家庭夫雷的，大概只是要照顾母亲而已。","sentence_en":"At that time, I had no family obligations, just my mother to take care of."},{"id":"606","start":5291.09,"end":5296.89,"displayStart":5291.09,"displayEnd":5296.89,"displayMid":5293.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":0.873704,"pitch":24.439013,"speechRate":5.172,"hasEvents":false,"sentence_source":"那想这个时候还是比较恰当的，就是没有什么负担去追求自己的理想但。","sentence_en":"It seemed like the right time, with no burdens, to pursue my dreams."},{"id":"607","start":5296.89,"end":5297.95,"displayStart":5296.89,"displayEnd":5297.95,"displayMid":5297.42,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":1.070301,"pitch":28.524948,"speechRate":3.774,"hasEvents":false,"sentence_source":"完全轻松。","sentence_en":"Completely free."},{"id":"608","start":5297.95,"end":5300.49,"displayStart":5297.95,"displayEnd":5300.49,"displayMid":5299.219999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.583014,"pitch":21.156376,"speechRate":4.858,"hasEvents":false,"sentence_source":"做了决定之后，会有恐惧感吗。","sentence_en":"After making that decision, did you feel fear?"},{"id":"609","start":5300.49,"end":5314.11,"displayStart":5300.49,"displayEnd":5314.11,"displayMid":5307.299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.894449,"pitch":25.423716,"speechRate":5.795,"hasEvents":false,"sentence_source":"那当然，就说完从一个安稳的生活里面，去到一个非常不靠谱，不稳定没有什么保障的，这样子的一个生活的状态里头，没有人可以保证你就会成为一个成功的作家，不管你花多少心力去做你。","sentence_en":"Of course. Leaving a stable life for one that's uncertain, with no security. No one can guarantee you'll become a successful writer, no matter how much effort you put in."},{"id":"610","start":5314.11,"end":5325.41,"displayStart":5314.11,"displayEnd":5325.41,"displayMid":5319.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.965325,"pitch":24.633303,"speechRate":5.133,"hasEvents":false,"sentence_source":"不见得可以得到保障，可是当时也觉得人生也就这么短了，就剩下这点时间，当然是有规划过的，想说如果自己真的要做一个专业的作家的话。","sentence_en":"There's no guarantee, but I also felt life is short, with limited time left. I had planned: if I really wanted to be a professional writer..."},{"id":"611","start":5325.41,"end":5332.07,"displayStart":5325.41,"displayEnd":5332.07,"displayMid":5328.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.7,"loudness":0.907695,"pitch":25.682537,"speechRate":5.255,"hasEvents":false,"sentence_source":"那希望自己能够成为一个更伟大的作家，就是能有更大的视野，能够现实更多的市面。","sentence_en":"Then I hoped to become a greater writer, with a broader perspective and more worldly experience."},{"id":"612","start":5332.07,"end":5344.03,"displayStart":5332.07,"displayEnd":5344.03,"displayMid":5338.049999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.943103,"pitch":26.006222,"speechRate":5.1,"hasEvents":false,"sentence_source":"我觉得不想握在马华当一个自己质满的一个马华作家，如果我一直握在那儿 我的人生观 我的世界观永远都是同一个样子，我写不出更大的东西来。","sentence_en":"I didn't want to stay in Malaysia as a self-satisfied Malaysian Chinese writer. If I stayed, my outlook on life and the world would never change, and I couldn't produce anything greater."},{"id":"613","start":5344.03,"end":5359.29,"displayStart":5344.03,"displayEnd":5359.29,"displayMid":5351.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":0.98281,"pitch":25.427267,"speechRate":5.123,"hasEvents":false,"sentence_source":"所以当时下的决心是首先要离开马来西亚，任何地方都好，就有一个拖朋友在中国大陆帮忙，就拿了工作证 到了北京来，后来又到了英国，这些都是升旗自然 拿到什么方法就去哪儿。","sentence_en":"So I decided to leave Malaysia, anywhere would do. I had a friend help me in mainland China, got a work permit, and came to Beijing. Later I went to the UK. I just went wherever I could."},{"id":"614","start":5359.29,"end":5374.05,"displayStart":5359.29,"displayEnd":5374.05,"displayMid":5366.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.8,"loudness":0.915215,"pitch":22.494514,"speechRate":5.149,"hasEvents":false,"sentence_source":"就到世界各地去闯荡一下，看看人家生活怎么过，人家关注的是什么东西，甚至去学习别的语言 到过去德国学了一年的德语，想要开拓一下自己吧，觉得自己是有其他的可能性的尽量去。","sentence_en":"So I traveled the world, saw how people lived, what they cared about, even learned other languages – I studied German in Germany for a year. I wanted to expand myself, to explore other possibilities."},{"id":"615","start":5374.05,"end":5388.77,"displayStart":5374.05,"displayEnd":5388.77,"displayMid":5381.41,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":0.876191,"pitch":22.740389,"speechRate":5.413,"hasEvents":false,"sentence_source":"开拓这种可能性，你知道我一方面钦佩你的选择，同时也理解这份选择 然后同时过去感慨，我说 我们就是事业上我非常理解 完全共情，情感上的感慨在于，如果我们欲人不疏 碰到渣男无比痛苦。","sentence_en":"Exploring those possibilities. You know, I admire your choice and also understand it. At the same time, I feel wistful. On the career side, I completely empathize. But emotionally, I reflect: if we meet the wrong person, a bad guy, it's painful."},{"id":"616","start":5388.77,"end":5399.53,"displayStart":5388.77,"displayEnd":5399.53,"displayMid":5394.15,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.03662,"pitch":25.198706,"speechRate":4.901,"hasEvents":false,"sentence_source":"但有些时候你碰到一个善良的好人，但他无法跟你一起成长，你要忍痛离开 又是一个人生很无奈的一个事情 人生常常如此。","sentence_en":"But sometimes you meet a kind, good person who can't grow with you, and you have to leave painfully. That's another helpless thing in life. Life is often like that."},{"id":"617","start":5399.53,"end":5404.03,"displayStart":5399.53,"displayEnd":5404.03,"displayMid":5401.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.812553,"pitch":22.546633,"speechRate":4.222,"hasEvents":false,"sentence_source":"我觉得是有丈夫没办法跟上来 但是不是他错。","sentence_en":"I think my husband couldn't keep up, but it wasn't his fault."},{"id":"618","start":5404.03,"end":5412.49,"displayStart":5404.03,"displayEnd":5412.49,"displayMid":5408.26,"speaker":"Li Zishu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.218218,"pitch":28.332047,"speechRate":5.437,"hasEvents":false,"sentence_source":"因为他喜欢那样的生活 大家选择的不同是喜欢的不同而已，他没错 但是如果我勉强自己留的话 那就是我痛苦。","sentence_en":"Because he liked that kind of life. It's just different choices, different preferences. He wasn't wrong, but if I forced myself to stay, I would be the one suffering."},{"id":"619","start":5412.49,"end":5420.75,"displayStart":5412.49,"displayEnd":5420.75,"displayMid":5416.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C
