    <script type="application/json" id="episode-data">{"episode":{"id":"S7E10","label":"S7E10","title":"S7E10 Lu Yu in Conversation with Wang Haolu | Walking between the set and the cradle, writing free-form shots","intro":"Wang Haolu, director, representative works: Black Mirror S7E3 'Hotel Dream'\nChen Luyu, media personality, host\n\nIn the tenth episode of the seventh season of 'Among Flowers and Words', Lu Yu steps into the world before and behind the screen with emerging director Wang Haolu. On the fourth day after giving birth, she insisted on appearing at the premiere of 'Dream Hotel', just to hear the audience fall into silence and feel the temperature of emotions rising in the darkness—that is the magic of film for her, a tremor of empathy. Life never unfolds according to plan; 'everything always comes at once,' with career peaks and parenting trivialities like a dramatic duet. Wang Haolu admits that motherhood is a sweet burden in 'deep water and scorching fire,' a contradictory mix of love and hate. The thought that 'maybe it's better to be alone' that flashes during late-night feedings is not necessarily a betrayal, but a true echo of women's complex emotions. She describes her current 'freedom' not as unrestrained, but as space carved out within the framework of responsibility, a proof of 'a unique and full life experience.' The on-set hustle and bustle of people from all walks of life allowed Wang Haolu to see a broader spectrum of human nature. She refuses to shoot 'commercial products' and insists on 'truly honest' expression. Facing the industry's pursuit of superficial 'diversity,' she calls it 'hypocritical,' believing that true understanding is far from 'just picking an actor of a different skin color.' As a 'minority within a minority,' she deeply knows the luxury and weight of having her own narrative voice. Life itself is a suspense drama, full of imagination and the unknown, and the subtle yet hard-to-articulate experiences of women can only be told by ourselves.","duration":4666,"displayDuration":4666,"audioSrc":"s7e10.m4a","guest":"Wang Haolu","host":"Lu Yu","releaseDate":"2025.6.25"},"topicDefinitions":{"0":{"label":"C0","name":"Episode Summary","color":"#FFFFFF","opacity":0.2,"firstCategory":"Episode Summary","secondCategory":"Episode Summary","keyWords":["Episode Summary","Opening","Introduction"]},"1":{"label":"C1","name":"Film creation and international directing experience","color":"#B9B4B6","opacity":0.2,"firstCategory":"Film creation and international directing experience","secondCategory":"Film Creation and International Directing Experience","keyWords":["Episode Summary","Opening","Introduction"]},"3":{"label":"C3","name":"Creative Philosophy of Film Directors","color":"#CB7281","opacity":0.2,"firstCategory":"Creative Philosophy of Film Directors","secondCategory":"Creative Philosophy of Film Directors","keyWords":["Creative Philosophy of Film Directors"]},"4":{"label":"C4","name":"Female Directors, Motherhood, and Life Stages","color":"#DFA870","opacity":0.2,"firstCategory":"Female Directors, Motherhood, and Life Stages","secondCategory":"Female Directors, Motherhood, and Life Stages","keyWords":["Female Directors","Motherhood and Life Stages"]},"5":{"label":"C5","name":"Film Industry and Cinematic Works","color":"#000000","opacity":0.2,"firstCategory":"Film Industry and Cinematic Works","secondCategory":"Film Industry and Film Works","keyWords":["Film Industry and Cinematic Works"]},"7":{"label":"C7","name":"Discussion on Film Works and Actors","color":"#387C7D","opacity":0.2,"firstCategory":"Discussion on Film Works and Actors","secondCategory":"Discussion on Film Works and Actors","keyWords":["Discussion on Film Works and Actors"]}},"sentences":[{"id":"1","start":3.97,"end":16.97,"displayStart":3.97,"displayEnd":16.97,"displayMid":10.469999999999999,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive"," nternational directing experience","sentiment_en":"Neutral","score":0,"loudness":1.145051,"pitch":24.152828,"speechRate":5.733,"hasEvents":true,"sentence_source":"嗯刚才我们说这三位女演员Aquafina还有EmmaCorrin还有HarrietWaters王昊鹭指导的梦幻酒店这一集里面的四位女主人公当中的三位的扮演者。","sentence_en":"So we just mentioned the three actresses: Awkwafina, Emma Corrin, and Harriet Walter—the portrayers of three of the four heroines in Wang Haolu's Hotel Reverie episode."},{"id":"69","start":795.22,"end":805.02,"displayStart":795.22,"displayEnd":805.02,"displayMid":800.12,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.001782,"pitch":25.51688,"speechRate":4.173,"hasEvents":true,"sentence_source":"那你刚才讲到就是英国的电影界电視界我好奇在英国电影界跟电視界中間那个壁壘清晰嗎。","sentence_en":"You were just talking about the British film and TV industry. I'm curious, is the line between film and TV clear?"},{"id":"70","start":805.02,"end":817.5,"displayStart":805.02,"displayEnd":817.5,"displayMid":811.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.906543,"pitch":14.098388,"speechRate":4.588,"hasEvents":false,"sentence_source":"清晰其实相当清晰就说如果我现在拍了梦幻酒店电影他们会觉得这是有相通的地方如果我之前只是拍Body's一集一集的连續剧。","sentence_en":"Clear, actually quite clear. If I had shot 'Hotel Reverie' as a film, they'd see some connection. But if I'd only shot 'Body's' as an episodic series..."},{"id":"71","start":817.5,"end":830.62,"displayStart":817.5,"displayEnd":830.62,"displayMid":824.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.93454,"pitch":13.27892,"speechRate":5.183,"hasEvents":false,"sentence_source":"大家不会认为我是个拍电影的导演这是完全不一样的除非你是特別特別牛的导演像佳蘭想拍ComingByYourName的那个导演就这样子很火的。","sentence_en":"People wouldn't consider me a film director. It's completely different, unless you're a really great director like the one who made 'Call Me by Your Name'—that director is very popular."},{"id":"72","start":830.62,"end":844.18,"displayStart":830.62,"displayEnd":844.18,"displayMid":837.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.919431,"pitch":16.328253,"speechRate":4.794,"hasEvents":false,"sentence_source":"所以你的电影电視无所謂你可以自己拍整个的剧集都是你做的所有的編剧啊导演啊这样那对你来说你在进入这一行之前你的兴趣你的梦想是在电影。","sentence_en":"So for you, film and TV don't matter as much; you can shoot entire series yourself, writing and directing everything. For you, before entering this field, was your interest and dream in film?"},{"id":"73","start":844.18,"end":857.28,"displayStart":844.18,"displayEnd":857.28,"displayMid":850.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":1.03029,"pitch":18.96586,"speechRate":4.886,"hasEvents":false,"sentence_source":"还是我要從电視剧开始拍起慢慢的来建立我在这个圈內的口碑跟影響力然后再进入电影我是热爱电影的我就是特別爱电影但是不能直接进入电影。","sentence_en":"Or should I start with TV series, gradually build my reputation and influence in the industry, and then move into film? I love film—I really do—but I couldn't enter film directly."},{"id":"74","start":857.28,"end":869.58,"displayStart":857.28,"displayEnd":869.58,"displayMid":863.4300000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.6,"loudness":0.877664,"pitch":17.39204,"speechRate":5.122,"hasEvents":false,"sentence_source":"我也一直在开發一些电影項目但是獨立电影非常的不景气非常不景气作为一个新人导演你如果想拍一个低成本的电影你就需要用就是这邊公共的。","sentence_en":"I've also been developing some film projects, but independent film is in a very bad state. As a new director, if you want to make a low-budget film, you need public funding."},{"id":"75","start":869.58,"end":881.58,"displayStart":869.58,"displayEnd":881.58,"displayMid":875.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.913903,"pitch":15.727763,"speechRate":4.674,"hasEvents":false,"sentence_source":"政府的播的那些支持金那些需要很多很多年才可以拿到所以我是一个真正热爱拍攝导演就是说我不是喜欢在家自己写剧本的导演。","sentence_en":"Government grants for support take many years to obtain. As a director, I truly love filming—I'm not the type who likes to just stay home and write scripts."},{"id":"76","start":881.58,"end":896.38,"displayStart":881.58,"displayEnd":896.38,"displayMid":888.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.887663,"pitch":16.938362,"speechRate":4.73,"hasEvents":false,"sentence_source":"我喜欢去拍我特別喜欢去跟演員合作我喜欢在现场去做这件事情所以我就实在是養得不行了手所以我就开始跟我緊緊说我是願意就是接一些有意思的电視項目的。","sentence_en":"I love to shoot, I really like working with actors, being on set. So I just couldn't wait anymore, and I started telling my agent that I was willing to take on interesting TV projects."},{"id":"77","start":896.38,"end":908.46,"displayStart":896.38,"displayEnd":908.46,"displayMid":902.4200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.4,"loudness":0.887542,"pitch":13.735349,"speechRate":5.638,"hasEvents":false,"sentence_source":"如果剧本有意思的话我是很願意的而且现在很多电視它其实剧本还有製作是很精良的后来我就第一部当时拍的是DoctorWho然后进入这个行业算是。","sentence_en":"If the script is interesting, I'm very willing. And nowadays many TV shows have great scripts and production. Later, my first job was shooting 'Doctor Who', and that's how I entered the industry."},{"id":"78","start":908.46,"end":918.46,"displayStart":908.46,"displayEnd":918.46,"displayMid":913.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":0.921515,"pitch":15.816212,"speechRate":6.03,"hasEvents":false,"sentence_source":"然后就拍了Body's后来拍HotelReverie所以说越来越像我真正想拍的东西可以说梦幻酒店是真正有最多的自己在里面。","sentence_en":"Then I shot 'Body's', and later 'Hotel Reverie'. So it's increasingly like what I really want to shoot. I'd say 'Hotel Reverie' has the most of myself in it."},{"id":"79","start":918.46,"end":931.94,"displayStart":918.46,"displayEnd":931.94,"displayMid":925.2,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.075922,"pitch":22.670549,"speechRate":5.46,"hasEvents":false,"sentence_source":"你知道我觉得跟英国演員合作会很有趣因为之前我看过李安导演做的一个採訪他就回憶他早期雖然第一次跟英国演員合作拍李信宇情感Sensitivity的时候。","sentence_en":"I thought working with British actors would be interesting because I saw an Ang Lee interview where he recalled his early experience with them on a film about emotional sensitivity."},{"id":"80","start":931.94,"end":944.3,"displayStart":931.94,"displayEnd":944.3,"displayMid":938.12,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.004933,"pitch":22.388618,"speechRate":5.645,"hasEvents":false,"sentence_source":"还有他明顯感到在那背后其实有一些些我先審視你看你是否合格他能感觉到是自己慢慢被接納的那种过程你有这样的一个过程嗎我觉得Harrie是有的。","sentence_en":"And he clearly felt that behind it all, there was a process where they first scrutinized you to see if you qualified. He could sense being slowly accepted. Did you experience that? I think Harrie did."},{"id":"81","start":944.3,"end":957.5,"displayStart":944.3,"displayEnd":957.5,"displayMid":950.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.0648,"pitch":21.409861,"speechRate":6.042,"hasEvents":false,"sentence_source":"Harrie他会先看你这个导演怎么样他会看你第一天但是第一天的时候我们是有点禍亂对於他来说因为是他的第一天是arrayl的最后一天所以我们要趕拍他所有的戲。","sentence_en":"Harrie would first gauge what kind of director you are on day one, but that day was chaotic for him because it was his first day and also the last day of the shoot, so we had to rush all his scenes."},{"id":"82","start":957.5,"end":970.26,"displayStart":957.5,"displayEnd":970.26,"displayMid":963.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":0.982379,"pitch":17.654999,"speechRate":7.044,"hasEvents":false,"sentence_source":"在那个ControlRoom所以没有辦法給Harry一个非常好的ControlRoom在拍攝的一个计劃所以他会觉得有些混亂过了一周以后我觉得他比較Impressed他觉得OK不錯。","sentence_en":"We couldn't give Harry a good control room setup or shooting plan, so he felt some chaos. After a week, I think he was more impressed and thought it was okay."},{"id":"83","start":970.26,"end":985.1,"displayStart":970.26,"displayEnd":985.1,"displayMid":977.6800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":0.922784,"pitch":19.16785,"speechRate":6.233,"hasEvents":false,"sentence_source":"所以我就給他發了一个短信我说非常抱歉第一天那么混亂这一周非常感謝您然后他再说了我这一周觉得你很不錯但是像Aquafina和array他们是美国演員他们都不会他们习惯了一种好像混乱的状态。","sentence_en":"So I sent him a text apologizing for the chaos on the first day and thanking him for the week. He then said he thought I was doing well, but actors like Aquafina and the others are American actors used to a chaotic environment."},{"id":"84","start":985.1,"end":997.66,"displayStart":985.1,"displayEnd":997.66,"displayMid":991.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.022138,"pitch":19.543539,"speechRate":5.377,"hasEvents":false,"sentence_source":"因为这是一个非常市场性的一个东西EmmaCorrin她好像是介于两个之间她没有像Harrie这么老牌会审视你会有一些怎么说好像拿着一点。","sentence_en":"Because it's very market-driven. Emma Corrin seemed in between—she wasn't as established as Harrie, who would scrutinize you with a bit of reservation."},{"id":"85","start":997.66,"end":1011.42,"displayStart":997.66,"displayEnd":1011.42,"displayMid":1004.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.881602,"pitch":16.713108,"speechRate":5.593,"hasEvents":false,"sentence_source":"就是有很多自己的那种对你的想法但是你能觉得她是在默默的在看你到底行不行Emma比较开放她直接上来就比较真诚但是她会也比较刻搬出身的感觉相对于美国的演员。","sentence_en":"She has her own thoughts about you, but you can sense she's silently evaluating you. Emma is more open and sincere upfront, but she also seems a bit standoffish compared to American actors."},{"id":"86","start":1011.42,"end":1023.42,"displayStart":1011.42,"displayEnd":1023.42,"displayMid":1017.42,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.072504,"pitch":24.563711,"speechRate":5.621,"hasEvents":false,"sentence_source":"这个剧集有一种电影的質感大家都说看到很多人会想到开羅子玫瑰但我反而会是有想到就是那种老片子比如像卡薩布蘭卡然后在这个黑白的那个片段当中。","sentence_en":"This series has a cinematic quality. Everyone says it reminds them of The Purple Rose of Cairo, but I actually think of old films like Casablanca, especially in the black-and-white segments."},{"id":"87","start":1023.42,"end":1034.54,"displayStart":1023.42,"displayEnd":1034.54,"displayMid":1028.98,"speaker":"Wang Haolu","speakerColor":" er":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.7,"loudness":0.945855,"pitch":15.773028,"speechRate":4.725,"hasEvents":false,"sentence_source":"她只是非常小的拍一个片段而已我觉得哇她真的是太小而且舉止投足她的声音她的姿態因为就是现实生活中艾麥克歐人是个跟这个完全不一样的人。","sentence_en":"She was just filming a very small scene. I thought, wow, she is really tiny, and her mannerisms, her voice, her posture—because in real life, Emma Corrin is a completely different person."},{"id":"91","start":1077.62,"end":1090.22,"displayStart":1077.62,"displayEnd":1090.22,"displayMid":1083.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.042898,"pitch":17.982971,"speechRate":5,"hasEvents":false,"sentence_source":"所以我们感觉是簡直就是我可能这拍攝的一个多月天天都是在跟一个不是艾麥克歐人的人在一起相處她就完全是在角色里面居然就这样活靈活现。","sentence_en":"So we felt that during the more than a month of shooting, we were spending time every day with someone who wasn't Emma Corrin. She was completely in character, vivid and alive."},{"id":"92","start":1090.22,"end":1096.46,"displayStart":1090.22,"displayEnd":1096.46,"displayMid":1093.3400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":0.90974,"pitch":21.269897,"speechRate":4.98,"hasEvents":false,"sentence_source":"但没有任何的痕跡表演的时候嗯真的很神奇因为我认识她就是但納王妃。","sentence_en":"But there's no trace of acting. It's amazing because I know her—she's Princess Diana."},{"id":"93","start":1096.46,"end":1111.04,"displayStart":1096.46,"displayEnd":1111.04,"displayMid":1103.75,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","s ate":10.708,"hasEvents":false,"sentence_source":"Charlie就是你们的主创这个Charlie Brookererer是吧。","sentence_en":"Charlie is your creator, Charlie Brooker, right?"},{"id":"97","start":1135.62,"end":1149.94,"displayStart":1135.62,"displayEnd":1149.94,"displayMid":1142.78,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.966175,"pitch":22.66748,"speechRate":5.054,"hasEvents":false,"sentence_source":"YesCharlie Brookererer他是不是对所有的细节剧本的细节台词的细节要求非常严格的那你在这样的严格的一个要求之下你个人的创作发挥的空间有多少呢。","sentence_en":"Yes, Charlie Brooker. Is he very strict with every detail—script, dialogue? Under such strict requirements, how much room do you have for personal creativity?"},{"id":"98","start":1149.94,"end":1156.34,"displayStart":1149.94,"displayEnd":1156.34,"displayMid":1153.1399999999999,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.981676,"pitch":20.46958,"speechRate":5.604,"hasEvents":false,"sentence_source":"比如说你对于选择什么样的演员你有什么样的发言权在其中没有什么发言权其实。","sentence_en":"For example, what say do you have in casting? Actually, not much."},{"id":"99","start":1156.34,"end":1169.46,"displayStart":1156.34,"displayEnd":1169.46,"displayMid":1162.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.894929,"pitch":14.093343,"speechRate":4.455,"hasEvents":false,"sentence_source":"就主创都是得查理先觉得是谁然后他会来问我的意见我如果说的OK可以然后我们再一起去跟这个演员去见面然后他得喜欢我才可以。","sentence_en":"The creator, Charlie, first decides who he wants. Then he asks my opinion. If I say okay, we meet the actor together, and he has to like me."},{"id":"100","start":1169.46,"end":1182.54,"displayStart":1169.46,"displayEnd":1182.54,"displayMid":1176,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.987632,"pitch":16.626474,"speechRate":4.764,"hasEvents":false,"sentence_source":"所以我需要表现好而且这个演员来了以后我需要让他们表演非常成功才可以是所以压力是很大的然后拍摄的时候查理是对台词要求是很严格的。","sentence_en":"So I need to perform well, and once the actor is cast, I have to make their performance successful—so there's a lot of pressure. During filming, Charlie is very strict about dialogue."},{"id":"101","start":1182.54,"end":1195.42,"displayStart":1182.54,"displayEnd":1195.42,"displayMid":1188.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.938176,"pitch":14.443508,"speechRate":5.517,"hasEvents":false,"sentence_source":"就说演员是不可以随便改字的但是Charlotte也不是一个死板的人所以拍摄的时候如果她会觉得这个台词大家讲出来的感觉不像她写的那么美妙她就会说。","sentence_en":"Actors can't change words arbitrarily. But Charlotte isn't rigid either. During shooting, if she feels the delivery doesn't match the beauty of her writing, she'll say..."},{"id":"102","start":1195.42,"end":1208.02,"displayStart":1195.42,"displayEnd":1208.02,"displayMid":1201.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.963748,"pitch":12.986313,"speechRate":4.56,"hasEvents":false,"sentence_source":"OK我们可以改一下然后演员会有一些想法但是她对视觉上调度演员她是没有任何的控制的比如说我想怎么样去build这个赛。","sentence_en":"OK, we can change it. And the actors have ideas. But she has no control over visual direction or staging—like how to build the set."},{"id":"103","start":1208.02,"end":1220.06,"displayStart":1208.02,"displayEnd":1220.06,"displayMid":1214.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.915641,"pitch":15.008368,"speechRate":5.141,"hasEvents":false,"sentence_source":"怎么样去选这些所有的这些家具他应該什么样的裝扮怎么样去演怎么样没有任何他会让导演做所有导演的东西但他作为編剧是非常嚴格的。","sentence_en":"How to choose all the furniture, what costumes, how to act—none of that. She lets the director handle all directing, but as a writer she's very strict."},{"id":"104","start":1220.06,"end":1235.1,"displayStart":1220.06,"displayEnd":1235.1,"displayMid":1227.58,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":1.086373,"pitch":23.787586,"speechRate":5.019,"hasEvents":false,"sentence_source":"所以这部戲里面的很多的这种靈感很多这种设计最后的呈现你这么多年看的一些经典老篇全部都payedoff就是能在这里面能夠很凸顯你看老篇的很多你的審美。","sentence_en":"So many inspirations and designs in this show pay off all the classic old films you've watched over the years. Your taste in old films really stands out here."},{"id":"105","start":1235.1,"end":1248.22,"displayStart":1235.1,"displayEnd":1248.22,"displayMid":1241.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":0.990823,"pitch":19.931599,"speechRate":4.472,"hasEvents":false,"sentence_source":"是其实是的我其实很喜欢特别经典的黑白的老篇而且我会觉得我是一个对审美要求还挺高的我喜欢很美的画面我不喜欢毛操的画面。","sentence_en":"Yes, actually I really love classic black-and-white films. And I think I have high aesthetic standards – I like beautiful images, not messy ones."},{"id":"106","start":1248.22,"end":1261.26,"displayStart":1248.22,"displayEnd":1261.26,"displayMid":1254.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":0.906461,"pitch":15.561817,"speechRate":5.061,"hasEvents":false,"sentence_source":"我喜欢比较干净的镜头像我非常喜欢还有戏剧客客的Rebecca蝴蝶梦内部电影是40年代的而且我觉得那个就拍的特别好当时我们在筹备的时候。","sentence_en":"I prefer clean shots. For example, I really like Hitchcock's Rebecca – that 1940 film. I think it was exceptionally well-made. When we were preparing..."},{"id":"107","start":1261.26,"end":1276.54,"displayStart":1261.26,"displayEnd":1276.54,"displayMid":1268.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.884955,"pitch":15.033195,"speechRate":5.277,"hasEvents":false,"sentence_source":"我有给阿玛去看包括当时看他们在法国南部里面的一些景我就看到多少都是在Studio拍的就是其实后面都是幕部所以有一种假的感觉所以我们一定要拍出那种年代电影假的感觉。","sentence_en":"I showed it to Ama. When I saw the scenes set in the south of France, I noticed many were shot in a studio – the backgrounds were all backdrops, so it felt fake. We had to capture that fake feel of period films."},{"id":"108","start":1276.54,"end":1289.34,"displayStart":1276.54,"displayEnd":1289.34,"displayMid":1282.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.99436,"pitch":19.962824,"speechRate":4.945,"hasEvents":false,"sentence_source":"不能让大家觉得是现代人拍了一个设定在40年代的东西而必須拍一个感觉是40年代的人拍的东西的感觉就是那个技術都是老的方法都是老的。","sentence_en":"We can't let it feel like modern people made something set in the 1940s. It has to feel like it was made by people from the 1940s – using old techniques and old methods."},{"id":"109","start":1289.34,"end":1301.7,"displayStart":1289.34,"displayEnd":1301.7,"displayMid":1295.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.884549,"pitch":19.755754,"speechRate":5.517,"hasEvents":false,"sentence_source":"一定是这样所以我们一定不能隨便以攝影机攝影机它就应該是40年代就是很大很笨重你是无法随便移动的如果要移动的话也是很慢的就是你如果移动的话。","sentence_en":"Exactly. So we couldn't just use any camera. It had to be a 1940s camera – big and heavy, not easily moved, and if you did move it, it was very slow."},{"id":"110","start":1301.7,"end":1314.7,"displayStart":1301.7,"displayEnd":1314.7,"displayMid":1308.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.911645,"pitch":20.89233,"speechRate":5.077,"hasEvents":false,"sentence_source":"那个他的动作是非常准备是很大的40年代他是很夸张的包括你如果拍一个人的特写他想包含他的特写他们会在镜头前面放一些絲襪或者放一些凡士林。","sentence_en":"The movements were very deliberate and exaggerated in the 1940s. For close-ups, they would put stockings or Vaseline on the lens."},{"id":"111","start":1314.7,"end":1329.82,"displayStart":1314.7,"displayEnd":1329.82,"displayMid":1322.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.979304,"pitch":22.066065,"speechRate":4.313,"hasEvents":false,"sentence_source":"那会让他的皮肤闪闪发光我们也都做了这些对爱买的一些处理在镜头上抹凡士林吗在镜头的绿镜会有一个玻璃上会放我们做了很多測试是繁殖領好呢。","sentence_en":"That would make the skin glow. We did all that too – applying Vaseline on the lens? On the green filter's glass? We did many tests: which mesh works better?"},{"id":"112","start":1329.82,"end":1339.62,"displayStart":1329.82,"displayEnd":1339.62,"displayMid":1334.7199999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":0.874142,"pitch":17.62368,"speechRate":5.247,"hasEvents":false,"sentence_source":"还是一些有些毛邊的玻璃好呢还是就是还有一个silkscreen就是絲綢我们做了很多这样的试驗就很有意思。","sentence_en":"Or some frosted glass? Or a silk screen? We did many tests – it was very interesting."},{"id":"113","start":1340.26,"end":1352.78,"displayStart":1340.26,"displayEnd":1352.78,"displayMid":1346.52,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":1.072256,"pitch":25.157579,"speechRate":5.88,"hasEvents":false,"sentence_source":"哇你知道我也跟英格莉包们学了一点我也非常喜欢看老天他当时跟卡里格蘭加里格蘭特拍的那个叫indiscreet吊金龜然后他演一个著名的舞臺剧的女演員。","sentence_en":"Wow, you know, I also learned a bit from Ingrid Bergman. I love watching old films. She did Indiscreet with Cary Grant, playing a famous stage actress."},{"id":"114","start":1352.78,"end":1366.16,"displayStart":1352.78,"displayEnd":1366.16,"displayMid":1359.47,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":1.048552,"pitch":27.512283,"speechRate":4.641,"hasEvents":false,"sentence_source":"它卸妆是拿那个co-cream冷霜我就从那开始我卸妆不再用卸妆油我就去买一瓶凡士林非常便宜的一瓶一大罐他们都用半年一年的那种。","sentence_en":"She used cold cream to remove makeup. That's when I stopped using makeup remover oil. I bought a big jar of Vaseline – super cheap, they used it for half a year."},{"id":"115","start":1366.16,"end":1381.32,"displayStart":1366.16,"displayEnd":1381.32,"displayMid":1373.74,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.026578,"pitch":26.090973,"speechRate":4.498,"hasEvents":false,"sentence_source":"我就是跟老牌影星学的哦这个我还不知道这个我也学到了哦有co-cream对今年对你来说是进入这个行业第六年对所以你的步子我认为卖的是很扎实。","sentence_en":"That's something I learned from old movie stars. Oh, I didn't know that – I learned something too. Cold cream, right! So this is your sixth year in the industry. I think your steps have been very solid."},{"id":"116","start":1381.32,"end":1394.23,"displayStart":1381.32,"displayEnd":1394.23,"displayMid":1387.775,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.049395,"pitch":23.828121,"speechRate":7.352,"hasEvents":false,"sentence_source":"也是相当顺利的算是很顺利了就像那个音乐之声那歌词里面唱的Imusthavedonesomethinggood就我肯定做对了一些什么我肯定做了一些什么好事你觉得你做对了一些什么呢。","sentence_en":"And quite smooth, very smooth. Like the Sound of Music lyric: 'I must have done something good' – I must have done something right. What do you think you did right?"},{"id":"117","start":1394.23,"end":1406.51,"displayStart":1394.23,"displayEnd":1406.51,"displayMid":1400.37,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.947024,"pitch":22.213844,"speechRate":3.653,"hasEvents":false,"sentence_source":"其实我现在回顾起来可能当时做的比较对的第一件事是决定去拍《怀孕的大地》那一部短片在毕业的时候。","sentence_en":"Looking back, the first thing I did right was deciding to direct the short film The Pregnant Earth when I graduated."},{"id":"118","start":1406.51,"end":1412.75,"displayStart":1406.51,"displayEnd":1412.75,"displayMid":1409.63,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.055286,"pitch":17.770454,"speechRate":4.049,"hasEvents":false,"sentence_source":"因为那部短片其实是从题材上拍下手法上都是比较特殊的。","sentence_en":"Because that short was special in both subject and technique."},{"id":"119","start":1412.75,"end":1426.23,"displayStart":1412.75,"displayEnd":1426.23,"displayMid":1419.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.963132,"pitch":20.430769,"speechRate":5.48,"hasEvents":false,"sentence_source":"就是跟一般的毕业作品都很不一样因为毕业作品特别重要那是我们毕业的时候唯一在行业能看到我们的作品是我们的入行的一个敲门砖所以我当时就一意孤行想拍一个。","sentence_en":"It was very different from typical graduation films. Graduation works are crucial – they're our industry calling card. So I insisted on making something..."},{"id":"120","start":1426.23,"end":1439.59,"displayStart":1426.23,"displayEnd":1439.59,"displayMid":1432.9099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.909724,"pitch":18.866323,"speechRate":5.051,"hasEvents":false,"sentence_source":"跟自己内心特别一致的一个东西我当时就在想当母亲这件事情就是当母亲对女性的压力然后声誉各种各样所以我就拍了一个相对来说比较近距离一个话题。","sentence_en":"That was truly aligned with my heart. I was thinking about motherhood – the pressure on women, reputation, etc. So I shot a very personal topic."},{"id":"121","start":1439.59,"end":1451.63,"displayStart":1439.59,"displayEnd":1451.63,"displayMid":1445.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":0.925081,"pitch":18.51503,"speechRate":5.248,"hasEvents":false,"sentence_source":"而且拍摄的手法也比较特别当时立刻的反响并没有那么的热就是还可以但是慢慢慢慢在行业里面其实每一部我拿到这些工作都是因为华晕的大地。","sentence_en":"And the technique was unique. The initial response wasn't huge – just okay. But gradually in the industry, every job I got was because of The Pregnant Earth."},{"id":"122","start":1451.63,"end":1465.47,"displayStart":1451.63,"displayEnd":1465.47,"displayMid":1458.5500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":0.936927,"pitch":20.046896,"speechRate":5.311,"hasEvents":false,"sentence_source":"就包括神秘博士也没有想过他们就看到这个短片觉得这个导演语中不同然后body写是就是那个制片觉得这个导演语中不同然后就见了我可能做的比较对的第一件事。","sentence_en":"Even Doctor Who – they saw the short and thought the director had a different voice. The producer thought so and met me. That was the first thing I did right."},{"id":"123","start":1465.47,"end":1477.95,"displayStart":1465.47,"displayEnd":1477.95,"displayMid":1471.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.938923,"pitch":20.281448,"speechRate":4.829,"hasEvents":false,"sentence_source":"就是拍了一个真正不为心的东西没有拍一个行货我觉得非常讽刺的是我其实是一个我自己认为并不是很适合拍电视的人因为我不会拍行货。","sentence_en":"Making something truly for the heart, not a factory product. Ironically, I don't think I'm suited for TV because I can't shoot generic content."},{"id":"124","start":1477.95,"end":1490.15,"displayStart":1477.95,"displayEnd":1490.15,"displayMid":1484.0500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.942627,"pitch":19.158846,"speechRate":5.788,"hasEvents":false,"sentence_source":"我不会像电视导演一样去了以后这边拍这个镜头那边拍这个镜头就是广角然后中景然后再进景我不大会这样去拍就是城市性的去拍就拍一个program一样。","sentence_en":"I don't shoot like a TV director – wide shot, medium, close-up – like a program assembly line."},{"id":"125","start":1490.15,"end":1503.95,"displayStart":1490.15,"displayEnd":1503.95,"displayMid":1497.0500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.906168,"pitch":17.959723,"speechRate":4.983,"hasEvents":false,"sentence_source":"我拍东西我是通过什么东西让我拍起来觉得是有感觉拍的那一瞬间让我觉得这个东西是活的是有生命力的我才会去拍我只能有这么一种直觉的拍摄的方式。","sentence_en":"I only shoot when it feels alive and vibrant in that moment. I rely on intuition."},{"id":"126","start":1503.95,"end":1516.55,"displayStart":1503.95,"displayEnd":1516.55,"displayMid":1510.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":0.958965,"pitch":19.27869,"speechRate":5.132,"hasEvents":false,"sentence_source":"可能我拍的东西跟别人确实有些不一样的地方所以那些故我的人他也是能很清楚地知道他是选了一个这样的导演所以也可能有的机会就会特别一点。","sentence_en":"Maybe my work is different, so those who want something unique know they chose a director like that, and that might bring special opportunities."},{"id":"127","start":1516.55,"end":1529.55,"displayStart":1516.55,"displayEnd":1529.55,"displayMid":1523.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.02618,"pitch":22.457527,"speechRate":5.002,"hasEvents":false,"sentence_source":"也许是这样嗯那你刚刚说怀孕的大地是你硕士毕业的作品是的那在拍这部戏的时候你还没有做妈妈但那个时候你对于很多种女性的心理你会有自己。","sentence_en":"Maybe. So you said The Pregnant Earth was your master's graduation project. You weren't a mother then, but you had your own thoughts on female psychology."},{"id":"128","start":1529.55,"end":1543.63,"displayStart":1529.55,"displayEnd":1543.63,"displayMid":1536.5900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":0.959341,"pitch":18.446203,"speechRate":4.656,"hasEvents":false,"sentence_source":"是你特别想感兴趣和想表达的一些话题嗯我当时还没有意识到后来我觉得确实是的我觉得我可能想表达的是一些女性的内心的难以诉说的一些东西。","sentence_en":"Topics you were interested in? I didn't realize then, but later I think I was expressing women's unspoken inner feelings."},{"id":"129","start":1543.63,"end":1556.19,"displayStart":1543.63,"displayEnd":1556.19,"displayMid":1549.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Negative","score":-0.3,"loudness":1.044939,"pitch":18.422346,"speechRate":4.971,"hasEvents":false,"sentence_source":"就是有可能是在睡觉前想到的一些事情但没有办法跟别人去讲但是就像一个牙齿痛一样你其实每天都会去知道有自己牙疼但是别人都看不见。","sentence_en":"Like things you think of before sleep but can't tell anyone – like a toothache you feel every day but others can't see."},{"id":"130","start":1556.19,"end":1570.27,"displayStart":1556.19,"displayEnd":1570.27,"displayMid":1563.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":0.863993,"pitch":14.443629,"speechRate":4.92,"hasEvents":false,"sentence_source":"不是这些感受我后来发现我喜欢看的所有的电影或者电视都是女主角而且都是有意思的女主角有一些争议的女主角这是我一看就想去看的这些电影电视作品。","sentence_en":"It's not these feelings. I later realized all the movies or TV shows I like have female leads, and they are interesting and controversial. That draws me to watch them."},{"id":"131","start":1570.27,"end":1578.95,"displayStart":1570.27,"displayEnd":1578.95,"displayMid":1574.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0.1,"loudness":0.885069,"pitch":16.08798,"speechRate":5.968,"hasEvents":true,"sentence_source":"我后来发现是比较我喜欢的机可的表达欲也是从这些地方来的是想知道大家有这种感觉吗因为我觉得我会编的不行了。","sentence_en":"I later found my urge to express myself also comes from these works. I wonder if others feel the same, because I feel I can't script it anymore."},{"id":"132","start":1581.51,"end":1597.45,"displayStart":1581.51,"displayEnd":1597.45,"displayMid":1589.48,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.060632,"pitch":24.664804,"speechRate":4.346,"hasEvents":false,"sentence_source":"那像你小的时候因为你是85后嘛那你成长的其实90年代是无论是中国电影还是好莱坞国际电影都是每年都会有很多无论是票房还是口碑就是艺术水准就是。","sentence_en":"When you were growing up—since you're post-85—the 1990s was a time when both Chinese cinema and Hollywood international films produced many hits every year, both in terms of box office and critical acclaim, as well as artistic standards."},{"id":"133","start":1597.45,"end":1607.65,"displayStart":1597.45,"displayEnd":1607.65,"displayMid":1602.5500000000002,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.051846,"pitch":25.208403,"speechRate":5.403,"hasEvents":false,"sentence_source":"你各个门类去评价都会有很多很好的作品所以我不知道你在你成长过程当中你去看电影的方式是在家里面还是更多去电影院。","sentence_en":"Every genre has great works. So I wonder, during your growth, did you watch movies at home or more in theaters?"},{"id":"134","start":1607.65,"end":1620.75,"displayStart":1607.65,"displayEnd":1620.75,"displayMid":1614.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.020642,"pitch":21.377083,"speechRate":5.648,"hasEvents":true,"sentence_source":"哦我记得当时小时候因为我在江苏徐州长大的我周围没有真正的商业电影院当时我记得我在大学校园里面长大有一个大会堂我记得我看过TheLionKing。","sentence_en":"Oh, I remember as a child in Xuzhou, Jiangsu, there were no commercial cinemas. I grew up on a university campus, and there was a hall where I saw The Lion King."},{"id":"135","start":1620.75,"end":1633.95,"displayStart":1620.75,"displayEnd":1633.95,"displayMid":1627.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.3,"loudness":1.059304,"pitch":20.762003,"speechRate":5.221,"hasEvents":true,"sentence_source":"然后在室里面有一个也是一个像中山堂这种一个地方我在那边看了冷山它是原生的已经是很不可思议了但是我记得有那么一个画面就是当时JudeLaw。","sentence_en":"And there was a hall like Sun Yat-sen Hall where I watched Cold Mountain. It was original, which was incredible. But I remember a scene with Jude Law."},{"id":"136","start":1633.95,"end":1647.15,"displayStart":1633.95,"displayEnd":1647.15,"displayMid":1640.5500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.059289,"pitch":23.038673,"speechRate":6.35,"hasEvents":false,"sentence_source":"然后还有NikoKidman他们终于最后见到对方然后JudeLaw是从雪地里面回来然后两个人就进入一个小屋然后结果啪就直接切换到第二天早上因为她把中间那段就全部给剪掉。","sentence_en":"Then Nicole Kidman and Jude Law finally meet. He returns from the snow, they go into a cabin, and then bam, it cuts to the next morning because they cut out the middle part."},{"id":"137","start":1647.15,"end":1659.25,"displayStart":1647.15,"displayEnd":1659.25,"displayMid":1653.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":1.099746,"pitch":26.406479,"speechRate":4.969,"hasEvents":false,"sentence_source":"然后整个会堂里面所有人都是啊一声叹息因为当时我很小我并不知道具体剪了什么但是我能感觉到这是有些进击的东西所以对我来说电影。","sentence_en":"And the whole hall let out a sigh. I was young and didn't know what was cut, but I could sense it was something bold. So for me, movies..."},{"id":"138","start":1659.25,"end":1671.85,"displayStart":1659.25,"displayEnd":1671.85,"displayMid":1665.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.002178,"pitch":20.943954,"speechRate":4.992,"hasEvents":false,"sentence_source":"其实一直有一种进击的快感就是我去看电影是一种偷偷看的感觉包括当时我记得每周六都有嘉宾有约那个是我会求我妈说能不能让我去看一看。","sentence_en":"Actually, there was always a thrill of rebelliousness. Watching movies felt like sneaking. Including every Saturday when there was a show, I would beg my mom to let me watch."},{"id":"139","start":1671.85,"end":1684.21,"displayStart":1671.85,"displayEnd":1684.21,"displayMid":1678.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.96524,"pitch":19.206074,"speechRate":5.308,"hasEvents":false,"sentence_source":"当时在国内引起一些电影都是一些比较PG的电影就是没有真正有一些进阶东西的所以我当时会买很多倒板碟都是买一些跟我年纪不是很相符的电影。","sentence_en":"Back then, movies in China were mostly PG, nothing edgy. So I bought lots of pirated DVDs of movies not suitable for my age."},{"id":"140","start":1684.21,"end":1695.29,"displayStart":1684.21,"displayEnd":1695.29,"displayMid":1689.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":0.982538,"pitch":18.24581,"speechRate":5.037,"hasEvents":false,"sentence_source":"比如说Lolita还有包括这个《杀手不太冷》各种各样的我就偷偷的去看就觉得非常刺激我就想知道到底什么是不让我看的。","sentence_en":"For example, Lolita and Léon: The Professional. I watched them secretly and felt it was very exciting. I just wanted to know what was forbidden to me."},{"id":"141","start":1695.29,"end":1708.97,"displayStart":1695.29,"displayEnd":1708.97,"displayMid":1702.13,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.971663,"pitch":24.144485,"speechRate":4.919,"hasEvents":false,"sentence_source":"到底什么是我不能理解的我小时候的困惑就是当时很多中国电影比如讲到两个人结婚了以后动房花主业一定是那个女孩对男孩说或者新郎对新娘说亲爱的。","sentence_en":"What couldn't I understand? My childhood puzzlement was that in many Chinese movies, when showing the wedding night, the girl would say to the boy or the groom to the bride, 'Dear..."},{"id":"142","start":1708.97,"end":1721.01,"displayStart":1708.97,"displayEnd":1721.01,"displayMid":1714.99,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.135526,"pitch":27.516645,"speechRate":4.678,"hasEvents":false,"sentence_source":"我们要个孩子吧然后画面花第二天然后就有孩子了所以我小时候认为这是一个非常充满了魔力的一句话直到学了生理卫生课以后。","sentence_en":"They'd say 'Let's have a child,' then the screen fades, and next day there's a child. So I thought it was a magical phrase until I had sex ed."},{"id":"143","start":1721.01,"end":1725.41,"displayStart":1721.01,"displayEnd":1725.41,"displayMid":1723.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.3,"loudness":1.160069,"pitch":28.45089,"speechRate":6.286,"hasEvents":false,"sentence_source":"你还有想象力你觉得是一个魔法是一个魔咒是一个spell。","sentence_en":"You still have imagination. You think it's a magic spell."},{"id":"144","start":1725.41,"end":1730.29,"displayStart":1725.41,"displayEnd":1730.29,"displayMid":1727.85,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":1.045956,"pitch":23.513458,"speechRate":5.47,"hasEvents":false,"sentence_source":"所以我说电影很神奇对小孩子是会有某种神奇的引导作用。","sentence_en":"So I say movies are magical. They have a guiding effect on children."},{"id":"145","start":1730.29,"end":1743.89,"displayStart":1730.29,"displayEnd":1743.89,"displayMid":1737.0900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.981926,"pitch":17.551992,"speechRate":6.262,"hasEvents":false,"sentence_source":"哎，确实是这样，我也是的，我小时候就会因为当时我看这个《杀手不太冷》嘛我会感觉到里面NellyPortman的角色还有跟ZhengReno的角色有一些情俗觉得是荆棘的一些情俗。","sentence_en":"Ah, that's true. Me too. When I watched Léon as a child, I sensed some romantic tension between Natalie Portman and Jean Reno's characters, something complicated."},{"id":"146","start":1743.89,"end":1757.61,"displayStart":1743.89,"displayEnd":1757.61,"disp 6.13,"displayStart":1823.77,"displayEnd":1836.13,"displayMid":1829.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":0.885874,"pitch":18.705486,"speechRate":5.028,"hasEvents":false,"sentence_source":"包括我很喜欢燃烧女子的肖像我就觉得这是第一次感觉到特别的女性的凝视里面拍摄所有的这些镜头很震撼嗯那你说你当年看了很多这样电影。","sentence_en":"I really liked Portrait of a Lady on Fire. It was the first time I felt a distinct female gaze. All the shots are stunning. So you said you watched many such movies back then."},{"id":"154","start":1836.13,"end":1849.97,"displayStart":1836.13,"displayEnd":1849.97,"displayMid":1843.0500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.989912,"pitch":22.074472,"speechRate":5.123,"hasEvents":false,"sentence_source":"那在你当时成长环境当中有没有什么朋友能够跟你分享这样你对于电影的热爱有的我当时有几个好朋友是喜欢的但没有我这么喜欢我是到现在开始回顾以前日记。","sentence_en":"In your upbringing, were there friends to share your love of movies? Yes, a few good friends liked it, but not as much as me. I've recently started reviewing my old diaries."},{"id":"155","start":1849.97,"end":1857.01,"displayStart":1849.97,"displayEnd":1857.01,"displayMid":1853.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.3,"loudness":0.941613,"pitch":21.889872,"speechRate":5.486,"hasEvents":false,"sentence_source":"包括以前的跟好朋友的第一次的邮件去美国之前我第一次跟别人见面我都会说起电影。","sentence_en":"And my first email with a good friend before going to the US, the first time I met someone, I would bring up movies."},{"id":"156","start":1858.41,"end":1867.61,"displayStart":1858.41,"displayEnd":1867.61,"displayMid":1863.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.991163,"pitch":21.068707,"speechRate":6.061,"hasEvents":false,"sentence_source":"所以我所有的好朋友都到现在看到梦幻酒店都想起当时小时候我多么热爱电影我才意识到我可能跟所有人在不停地说电影。","sentence_en":"So now, all my close friends, whenever they see a dream hotel, remember how much I loved movies as a kid. That's when I realized I must have been talking about films to everyone nonstop."},{"id":"157","start":1867.61,"end":1881.01,"displayStart":1867.61,"displayEnd":1881.01,"displayMid":1874.31,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.0386,"pitch":27.326178,"speechRate":5.998,"hasEvents":false,"sentence_source":"那我在想在成长过程当中你看那么多电影就你内心你应该明白你对电影是有一种无比的喜爱和渴望的但你没有他没有让你做过多的想象就你没有想象说我人生其实有很多的可能性的。","sentence_en":"I think, as you grow up watching so many movies, deep down you know you have this immense love and craving for cinema, but you never let yourself imagine—you never thought your life could have so many possibilities."},{"id":"158","start":1881.41,"end":1893.49,"displayStart":1881.41,"displayEnd":1893.49,"displayMid":1887.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.4,"loudness":0.943272,"pitch":20.348106,"speechRate":5.358,"hasEvents":false,"sentence_source":"我想了有很多可能性但从来没有想过可以做电影可能太喜欢了所以对我来说是个特别神圣的事情我觉得你是得是一个特别特别的人才可以去做电影。","sentence_en":"I thought about many possibilities, but never about making films. Maybe because I loved it too much; it felt sacred to me. I felt like you had to be someone extraordinarily special to make movies."},{"id":"159","start":1894.25,"end":1907.37,"displayStart":1894.25,"displayEnd":1907.37,"displayMid":1900.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":0.976918,"pitch":21.564396,"speechRate":5.673,"hasEvents":false,"sentence_source":"所以我当时的感觉是如果我可以有一天能去一个电影拍摄现场能去看一看我觉得就死而无憾了就特别开心但從来没有想过自己能有这个能力去做这件事情因为离得太远了。","sentence_en":"So back then, I felt that if I could one day just visit a film set and see it in person, I'd die happy. But I never imagined I could actually do it myself—it seemed too far out of reach."},{"id":"160","start":1907.37,"end":1920.05,"displayStart":1907.37,"displayEnd":1920.05,"displayMid":1913.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":0.989695,"pitch":21.511345,"speechRate":3.994,"hasEvents":false,"sentence_source":"因为我一下我生产的環境我周圍都是学物理的都是博士啊博导啊一个非常学術的一个環境而拍电影这种感觉是一个。","sentence_en":"Because my environment was all about physics—everyone around me had PhDs, were professors—a very academic atmosphere. And making a movie felt like..."},{"id":"161","start":1920.05,"end":1932.45,"displayStart":1920.05,"displayEnd":1932.45,"displayMid":1926.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":0.94618,"pitch":18.675877,"speechRate":5.291,"hasEvents":false,"sentence_source":"像玩一样的它不是一个非常嚴肅的一件事情我是一个特別爱玩的人我就特別喜欢玩我也很会玩我会就是让我们整个全班人跟我们去抓鬼去医院后面。","sentence_en":"…it was like play, not something terribly serious. I'm a person who loves to play, I really enjoy it and I'm good at it. I would get the whole class to go ghost hunting in the hospital backyard."},{"id":"162","start":1932.45,"end":1946.29,"displayStart":1932.45,"displayEnd":1946.29,"displayMid":1939.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.935081,"pitch":19.381247,"speechRate":6.196,"hasEvents":false,"sentence_source":"我会带给他讲鬼故事全班40个小孩就会跟着我一起去然后半路上20个人就会吓回去最后留下可能五六个就是我最铁的朋友做看到那个鬼就是一个敦布就之类这种事情是我小时候经常做的。","sentence_en":"I'd tell them ghost stories, and all 40 kids would follow me. Halfway there, 20 would get scared and turn back. In the end, maybe five or six of my best friends would stay, and we'd see a ghost—like a lump of cloth or something. That kind of thing was common for me as a kid."},{"id":"163","start":1946.29,"end":1959.05,"displayStart":1946.29,"displayEnd":1959.05,"displayMid":1952.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.014058,"pitch":18.886341,"speechRate":5.717,"hasEvents":false,"sentence_source":"但这现在想起来其实是一个做电影导演的一个简直的一些发生的一些事情我当时只不过从来没有意识到觉得这是一个不是一个正经的事情正经的事情是学习之类的。","sentence_en":"Looking back now, those were actually things a film director would do, but I never realized it then. I thought it wasn't a serious pursuit; serious things were like studying."},{"id":"164","start":1959.05,"end":1971.53,"displayStart":1959.05,"displayEnd":1971.53,"displayMid":1965.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.927831,"pitch":17.710199,"speechRate":5.27,"hasEvents":false,"sentence_source":"但其实现在想想看当时我包括我喜欢看漫画我会在就是季氏本的那个小飞夜上画很多东西就小人然后一動他就像動画的動起来我就喜欢做这个事情。","sentence_en":"But now I think about how I loved reading manga. I used to draw little characters on the margins of my notebooks. When you flipped the pages, they'd seem to move like animation—I loved doing that."},{"id":"165","start":1971.53,"end":1978.65,"displayStart":1971.53,"displayEnd":1978.65,"displayMid":1975.0900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.4,"loudness":1.145331,"pitch":27.917377,"speechRate":5.532,"hasEvents":false,"sentence_source":"我们小时候有幹过这种事就是在书角的那个同一个角落同一个位置你连續画各种各样動作。","sentence_en":"We did that as kids—drawing on the same corner of a book page, the same spot, a series of actions."},{"id":"166","start":1978.65,"end":1993.37,"displayStart":1978.65,"displayEnd":1993.37,"displayMid":1986.01,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.6,"loudness":1.04946,"pitch":26.636068,"speechRate":5.367,"hasEvents":false,"sentence_source":"就每个動作比之前的動作进一步然后飞快一翻他就连續的变成一个動画我们也这么幹过哈哈哈我就会幹这种事所以你看小孩的遊戲中間隔了十幾年二十年也没有什么变化还是挺像的。","sentence_en":"Each action a little further along than the last. Then you'd flip quickly and it became a continuous animation. We did that too, haha! So you see, kids' games don't change much over ten or twenty years—they're still pretty similar."},{"id":"167","start":1993.37,"end":2001.85,"displayStart":1993.37,"displayEnd":2001.85,"displayMid":1997.61,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":0.964042,"pitch":19.408049,"speechRate":5.664,"hasEvents":false,"sentence_source":"对的我觉得这个比什么iPad要好玩多了我到现在还跟我女儿做这件事她也很喜欢我还给她画这个包括漫画。","sentence_en":"Yeah, I think that's way more fun than an iPad. I still do it with my daughter, and she loves it. I draw for her, including comics."},{"id":"168","start":2001.85,"end":2014.57,"displayStart":2001.85,"displayEnd":2014.57,"displayMid":2008.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":1.086199,"pitch":21.52895,"speechRate":5.904,"hasEvents":false,"sentence_source":"所以呢以前就觉得你得装得像白领一样很严肃去工作但其实我并不是一个严肃的人就是我后来终于找到一个拍电影特别适合因为去了拍摄现场今天都是在玩这件事情。","sentence_en":"So before, I thought you had to dress like a white-collar worker and be serious about work. But actually, I'm not a serious person. Eventually, I found that making films was perfect for me because on set, everything is about playing."},{"id":"169","start":2014.57,"end":2016.73,"displayStart":2014.57,"displayEnd":2016.73,"displayMid":2015.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.851564,"pitch":19.360287,"speechRate":5.013,"hasEvents":false,"sentence_source":"我就觉得特别如鱼得水。","sentence_en":"I felt completely in my element."},{"id":"170","start":2017.93,"end":2031.49,"displayStart":2017.93,"displayEnd":2031.49,"displayMid":2024.71,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.035484,"pitch":23.499378,"speechRate":5.556,"hasEvents":false,"sentence_source":"但是你又从小就体现出作为一个导演需要有的一个特质就是很有领导力因为有一次我采访李安导演他就讲他在大学里面第一天他们也是拍学生作业他一到片场他说很奇怪。","sentence_en":"But you also showed the qualities of a director from a young age—strong leadership. Once I interviewed Ang Lee, and he said that on his first day at university, when they were shooting a student project, he arrived on set and felt something strange."},{"id":"171","start":2031.49,"end":2043.53,"displayStart":2031.49,"displayEnd":2043.53,"displayMid":2037.51,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.956392,"pitch":23.463833,"speechRate":5.521,"hasEvents":false,"sentence_source":"一到片场所有的人就会主动的都来问他然后他也就会很主动很自然的就会告诉别人你做什么你做什么然后一切就很自然这种神奇的感受你是不是也有过。","sentence_en":"Everyone on set automatically came to ask him questions. And he naturally told people what to do. Everything flowed naturally. Did you have that magical feeling too?"},{"id":"172","start":2043.53,"end":2050.21,"displayStart":2043.53,"displayEnd":2050.21,"displayMid":2046.87,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.3,"loudness":1.051723,"pitch":24.425016,"speechRate":6.447,"hasEvents":true,"sentence_source":"就像你小时候带同学带小孩去玩那种感觉一样尤其现在在生活里面所有人都问我今天应该吃什么。","sentence_en":"It's like the way you led your classmates and kids to play when you were little. Especially now, everyone in my life asks me what they should eat."},{"id":"173","start":2051.96,"end":2064.12,"displayStart":2051.96,"displayEnd":2064.12,"displayMid":2058.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Film Industry and Cinematic Works","sentiment_en":"Positive","score":0.5,"loudness":1.001,"pitch":18.10528,"speechRate":5.099,"hasEvents":true,"sentence_source":"我们在家里也是这样的现在也是比如说现在我这段时间因为修产假两个月在家里面我就会去想把我们整个房子楼上楼下这些孩子们给组织起来。","sentence_en":"At home it's the same. For instance, I'm on maternity leave for two months, so I organize the whole house—upstairs and downstairs—all the kids."},{"id":"174","start":2064.12,"end":2065.72,"displayStart":2064.12,"displayEnd":2065.72,"displayMid":2064.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":0.838568,"pitch":21.4596,"speechRate":4.59,"hasEvents":true,"sentence_source":"做一个儿童剧院。","sentence_en":"Build a children's theater."},{"id":"175","start":2066.92,"end":2079.56,"displayStart":2066.92,"displayEnd":2079.56,"displayMid":2073.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":1.046754,"pitch":21.33074,"speechRate":4.597,"hasEvents":true,"sentence_source":"因为我就没办法导演员我就想导孩子我就可以再做这种事情我就莫名其妙的生活里面总会有一堆人最后都在听我说下面应该做什么。","sentence_en":"Since I can't direct actors now, I direct children. I can still do that kind of thing. Somehow, there's always a crowd of people listening to me, waiting for me to say what we should do next."},{"id":"176","start":2079.56,"end":2092.76,"displayStart":2079.56,"displayEnd":2092.76,"displayMid":2086.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.3,"loudness":0.985854,"pitch":22.356966,"speechRate":4.854,"hasEvents":false,"sentence_source":"而且我会有时候在生活里面会因为这个很傲呢我说为什么什么都要问我呢你们就不能自己做决定了但好像就总是这样嗯你知道我是从小我就很明确。","sentence_en":"And sometimes in life, I get a bit proud of it. I'll say, 'Why do you have to ask me everything? Can't you just make your own decisions?' But it always ends up that way. You know, ever since I was a kid, I've been very clear."},{"id":"177","start":2092.76,"end":2106.36,"displayStart":2092.76,"displayEnd":2106.36,"displayMid":2099.5600000000004,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":0.968667,"pitch":21.178209,"speechRate":5.375,"hasEvents":false,"sentence_source":"我不喜欢做什么事情我就不想做什么事情我好像也很明确我比较擅长做什么事情就我属于从小我大概未来的路我比较明确所以这样的人生我觉得相对好像简单一点。","sentence_en":"I know what I don't like to do, so I just don't do it. And I've always been clear about what I'm good at. I've known roughly where my future was going since I was young. So life felt relatively simple for me."},{"id":"178","start":2106.36,"end":2112.42,"displayStart":2106.36,"displayEnd":2112.42,"displayMid":2109.3900000000003,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.035385,"pitch":29.00211,"speechRate":4.97,"hasEvents":true,"sentence_source":"那我觉得你的成长过程当中你的幸运和你的难处在于你很全面发展。","sentence_en":"I think your luck and your difficulty in growing up lie in the fact that you were well-rounded."},{"id":"179","start":2113.98,"end":2122.9,"displayStart":2113.98,"displayEnd":2122.9,"displayMid":2118.44,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.083095,"pitch":24.888037,"speechRate":6.872,"hasEvents":true,"sentence_source":"就是好像这个小孩如果没有什么短板的话那某种程度意味着你的探索时间会更长反正你走那条路都可以这个会是一个困惑吗对你来说。","sentence_en":"Like, if a child has no obvious weaknesses, then to some extent it means you need more time to explore. No matter which path you take, it's fine. Does that become a confusion for you?"},{"id":"180","start":2123.42,"end":2136.9,"displayStart":2123.42,"displayEnd":2136.9,"displayMid":2130.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.960401,"pitch":19.387865,"speechRate":5.556,"hasEvents":false,"sentence_source":"我觉得我比较大的一个问题在于我很会演就是我先生活中我也很会演我如果很讨厌一个工作我如果去面试我可以演的自己特别喜欢而且别人会很相信就是我的演技还不烂。","sentence_en":"I think one of my biggest issues is that I'm really good at acting—yes, in real life too. If I hate a job, I can go to an interview and act like I love it, and people believe me. My acting isn't bad."},{"id":"181","start":2136.9,"end":2149.14,"displayStart":2136.9,"displayEnd":2149.14,"displayMid":2143.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.023295,"pitch":21.135965,"speechRate":4.802,"hasEvents":false,"sentence_source":"所以这是一个问题你是演给谁看是演给你爸你妈看演给老师看还是要演给谁看呢我就想演给这两个面试观看我想看他能不能相信我。","sentence_en":"So it's a problem: who are you acting for? For your parents? For your teachers? For the interviewers? I just wanted to see if they would believe me."},{"id":"182","start":2149.14,"end":2161.66,"displayStart":2149.14,"displayEnd":2161.66,"displayMid":2155.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.3,"loudness":0.931281,"pitch":18.096092,"speechRate":4.837,"hasEvents":false,"sentence_source":"就只是做一个游戏而已我并不是很认真的当时做投行就是我就假装去很喜欢的去面试只是试一下但他们就相信了就真的就觉得我演得不错。","sentence_en":"It was just a game. I wasn't serious when I was in investment banking. I pretended to be enthusiastic in interviews just to try it, and they believed me—they really thought I did a good job acting."},{"id":"183","start":2161.66,"end":2174.9,"displayStart":2161.66,"displayEnd":2174.9,"displayMid":2168.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.091045,"pitch":21.935673,"speechRate":5.363,"hasEvents":false,"sentence_source":"其实我也没有演给我爸妈也没有演给自己我有一种就是其实在选电影之前是一种比较游戏人间的一种态度我不是一个特别要强我要怎么怎么样一定要最好都是全A。","sentence_en":"I wasn't acting for my parents, nor for myself. Before I chose film, my approach to life was more like playing around. I wasn't especially driven—I didn't feel I had to be the best at everything and get straight As."},{"id":"184","start":2174.9,"end":2187.94,"displayStart":2174.9,"displayEnd":2187.94,"displayMid":2181.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.4,"loudness":1.009301,"pitch":20.564495,"speechRate":5.284,"hasEvents":false,"sentence_source":"我其实不是这样的一个人我是一个特别喜欢玩的人我什么也都还相对玩的转所以我就玩玩这个玩玩那个没有特别的认真其实我是做了电影以后才特别的认真。","sentence_en":"I'm not that kind of person. I'm someone who loves to play and is pretty good at everything I try. So I played around with this and that, without being very serious. Actually, I only became serious after I started making films."},{"id":"185","start":2187.94,"end":2200.42,"displayStart":2187.94,"displayEnd":2200.42,"displayMid":2194.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.3,"loudness":1.003818,"pitch":18.53142,"speechRate":9,"hasEvents":false,"sentence_source":"之前我的好朋友同事都会说经常听到我说的一句话就是Idon'tcareIdon'tcareaboutthisIdon'tcareaboutthat他们就会说但whatdoyoucare但真正自己care是个电影就是一个爱玩的一个东西。","sentence_en":"Before that, my close friends and colleagues would often hear me say, 'I don't care, I don't care about this, I don't care about that.' They'd ask, 'But what do you care about?' What I truly cared about was film—something playful."},{"id":"186","start":2200.42,"end":2212.42,"displayStart":2200.42,"displayEnd":2212.42,"displayMid":2206.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.4,"loudness":0.877685,"pitch":15.952288,"speechRate":5.356,"hasEvents":false,"sentence_source":"但自己不敢去做一开始就觉得自己没有想过不知道怎么做这么大一个跨越其实是有段时间后来觉得自己可能玩大了就是玩累了就是在25岁的时候。","sentence_en":"But at first, I didn't dare to go for it. I just hadn't considered it, didn't know how to make such a big leap. For a while, I thought maybe I had played too much—got tired of it. That was when I was 25."},{"id":"187","start":2212.42,"end":2226.14,"displayStart":2212.42,"displayEnd":2226.14,"displayMid":2219.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.99842,"pitch":16.776619,"speechRate":4.607,"hasEvents":false,"sentence_source":"在投行觉得很不好玩因为太辛苦了我是个很乐观的人但是那段时间我就突然觉得离死亡特别的近我能感觉到这个人生一步一步下去会怎么过下去。","sentence_en":"Working in investment banking became no fun because it was too grueling. I'm an optimistic person, but during that time I suddenly felt very close to death. I could sense exactly how my life would unfold step by step."},{"id":"188","start":2226.14,"end":2238.78,"displayStart":2226.14,"displayEnd":2238.78,"displayMid":2232.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Negative","score":-0.7,"loudness":0.97014,"pitch":16.250341,"speechRate":5.601,"hasEvents":false,"sentence_source":"就是一个完全铺好的人生就是先是分析员再到经理再到副总裁再到总裁一步一步而且我觉得很可怕的是我一点都不想要任何这件事情比如说大的房子的讨的车。","sentence_en":"It was a completely predetermined life: first analyst, then manager, then vice president, then president, step by step. And what scared me was that I didn't want any of it—like a big house, a fancy car."},{"id":"189","start":2238.78,"end":2252.06,"displayStart":2238.78,"displayEnd":2252.06,"displayMid":2245.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.5,"loudness":0.947382,"pitch":20.89506,"speechRate":5.56,"hasEvents":false,"sentence_source":"所有人都在买什么名牌包名牌鞋名牌我没有任何的兴趣我发现我跟周围的这个世界特别格格不入而且我也完全不知道什么世界是适合我的那段时间我就会变得很瘦。","sentence_en":"Everyone was buying designer bags, designer shoes, designer everything. I had zero interest. I realized I was completely out of sync with the world around me, and I had no idea what world suited me. I got very thin during that period."},{"id":"190","start":2252.06,"end":2266.22,"displayStart":2252.06,"displayEnd":2266.22,"displayMid":2259.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.6,"loudness":0.958059,"pitch":20.352196,"speechRate":5.082,"hasEvents":false,"sentence_source":"而且我就觉得是如梗于后就好像话说不出来就觉得嗓子噎点什么东西有时候我会跟同事去试着去说我内心想说的东西想表达的方式大家都会看着我觉得你在说什么。","sentence_en":"I felt like something was stuck in my throat. I couldn't speak what I truly wanted to say. Sometimes I'd try to express my inner thoughts to colleagues, but they'd just look at me like, 'What are you talking about?"},{"id":"191","start":2266.22,"end":2280.82,"displayStart":2266.22,"displayEnd":2280.82,"displayMid":2273.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.5,"loudness":1.058655,"pitch":22.055447,"speechRate":5.372,"hasEvents":false,"sentence_source":"就像假面吗就像假面就像一个突然之间装不下去的女演员对就是像LeaveOnMy那个角色就突然之间什么都不想说了完全想沉默下去当时我就会想到蒙克的那个尖酱那个画。","sentence_en":"It was like the mask in 'Persona'—like an actress who suddenly can't keep up the act anymore. Just like the character in 'Persona', who suddenly stops wanting to talk, wanting to sink into silence. At that time, I thought of Munch's painting 'The Scream."},{"id":"192","start":2280.82,"end":2294.98,"displayStart":2280.82,"displayEnd":2294.98,"displayMid":2287.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.4,"loudness":0.92919,"pitch":18.989735,"speechRate":5.081,"hasEvents":false,"sentence_source":"或者我看到培根那些画看到一些表现主义的东西我会觉得内心有一种特别炙热的东西无法喷舍出来就觉得我要做一个很大的改变了因为我觉得我已经没有任何选择。","sentence_en":"Or when I saw Bacon's paintings, expressionist works, I felt something burning inside me that couldn't gush out. I felt I had to make a big change, because I had no other choice."},{"id":"193","start":2294.98,"end":2308.02,"displayStart":2294.98,"displayEnd":2308.02,"displayMid":2301.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Negative","score":-0.3,"loudness":0.972835,"pitch":18.765509,"speechRate":6.042,"hasEvents":false,"sentence_source":"因为我像您刚才说我以前就是比较全面发展觉得是可以选择的到了25岁我觉得其实我是别无选择不要觉得我可以随便玩我不能再装下去了我觉得我必须要认真地做一次选择了。","sentence_en":"Like you said earlier, I used to be well-rounded and thought I had options. But by 25, I realized I actually had no choice. I couldn't just play around anymore. I couldn't keep pretending. I felt I had to make a serious decision."},{"id":"194","start":2308.02,"end":2320.02,"displayStart":2308.02,"displayEnd":2320.02,"displayMid":2314.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.896511,"pitch":17.517321,"speechRate":5.002,"hasEvents":false,"sentence_source":"正好看了假面那段时间看了假面以后特别的触动其实假面就拯救了我我觉得当时我不知道自己是谁也没有见过任何一个像我这样的人。","sentence_en":"It was right around then that I watched 'Persona,' and it deeply moved me. In fact, 'Persona' saved me. At that time, I didn't know who I was, and I had never met anyone like me."},{"id":"195","start":2320.02,"end":2333.02,"displayStart":2320.02,"displayEnd":2333.02,"displayMid":2326.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.938857,"pitch":20.277054,"speechRate":4.36,"hasEvents":false,"sentence_source":"看了假面突然之间我就浑身冒冷汗我就会暂停然后到楼下散散步再回去再暂停不想看完然后才90分钟然后说看完时候我就觉得。","sentence_en":"Watching 'Persona,' I suddenly broke out in cold sweat. I'd pause it, go downstairs for a walk, come back, and pause again. I couldn't bear to finish it. It was only 90 minutes, but when I finished, I felt..."},{"id":"196","start":2333.02,"end":2345.98,"displayStart":2333.02,"displayEnd":2345.98,"displayMid":2339.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.911163,"pitch":23.23653,"speechRate":6.481,"hasEvents":false,"sentence_source":"我们会有一个一个人叫英马伯哥曼这个人在60年代就拍了一个我內心的所有的秘密这人怎么知道我內心所有的秘密还拍得这么淋漓盡致我從来没有告訴过任何人我內心有这些想法是这种感觉。","sentence_en":"I thought, 'Ingmar Bergman—this person made a film in the 1960s that captured all the secrets inside me. How did he know all my secrets and express them so vividly? I've never told anyone I had these thoughts.' That's how it felt."},{"id":"197","start":2345.98,"end":2360.3,"displayStart":2345.98,"displayEnd":2360.3,"displayMid":2353.1400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.987617,"pitch":20.720366,"speechRate":5.013,"hasEvents":false,"sentence_source":"但同时我就会觉得特別的勇敢了就觉得我不用再害怕了因为这个世界有別人也是这样而且我好像意识到了自己是谁自己跟自己有一个真正第一次的一个连結。","sentence_en":"But at the same time, I felt incredibly brave. I didn't have to be afraid anymore, because someone else in the world felt the same way. And it seemed like I finally realized who I was—I had my first genuine connection with myself."},{"id":"198","start":2360.3,"end":2364.22,"displayStart":2360.3,"displayEnd":2364.22,"displayMid":2362.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Negative","score":-0.5,"loudness":1.007897,"pitch":25.918753,"speechRate":5.954,"hasEvents":true,"sentence_source":"所以人在自己不喜欢这种生活状态当中是会枯萎的。","sentence_en":"So when you're in a life state you don't like, you wither."},{"id":"199","start":2364.78,"end":2379.38,"displayStart":2364.78,"displayEnd":2379.38,"displayMid":2372.08,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.018731,"pitch":23.048372,"speechRate":5.689,"hasEvents":true,"sentence_source":"就是这个生活不管在别人看来多好你在投行就是人想象投行当然可能你有你的辛苦但是赚钱会很好你辛苦点会赚钱以后你的事业会越来越好就是在别人看来你符合多少的标准一点用都没有。","sentence_en":"No matter how good life seems to others, working in investment banking—people imagine it's great, and sure, you have your hardships, but making money is good. You work
