ation and international directing experience","sentiment_en":"Positive","score":0.3,"loudness":1.038844,"pitch":22.329477,"speechRate":5.317,"hasEvents":false,"sentence_source":"英格马伯格曼的那部电影假面那其中的女主人公的扮演者我特別喜欢叫李福悟曼他在里面扮演一个女演员也是突然失声你大概你来介绍吧这部电影对你来说。","sentence_en":"Ingmar Bergman's film 'Persona'—the actress who played the lead is Liv Ullmann. I really like her. She plays an actress who suddenly loses her voice. Could you tell us about this film and its significance to you?"},{"id":"204","start":2422.09,"end":2429.41,"displayStart":2422.09,"displayEnd":2429.41,"displayMid":2425.75,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":0.921589,"pitch":19.300579,"speechRate":4.925,"hasEvents":false,"sentence_source":"太有重大的意义了把这个故事情节大概讲一下这是一个1967年的一个黑白电影。","sentence_en":"It has a huge significance. The story is basically this: it's a black-and-white film from 1967."},{"id":"205","start":2429.41,"end":2443.13,"displayStart":2429.41,"displayEnd":2443.13,"displayMid":2436.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.937428,"pitch":21.223843,"speechRate":5.2,"hasEvents":false,"sentence_source":"这个电影里面丽芙·乌曼他演一个有名的舞台剧的演员在拍摄的过程中突然之间他不说话了然后大家会以为他是不是生病了但是发现他并没有真正的病症。","sentence_en":"In the film, Liv Ullmann plays a famous stage actress who, during a performance, suddenly stops speaking. Everyone thinks she might be ill, but they realize she doesn't have any real disease."},{"id":"206","start":2443.13,"end":2457.17,"displayStart":2443.13,"displayEnd":2457.17,"displayMid":2450.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.931128,"pitch":17.5513,"speechRate":5.778,"hasEvents":false,"sentence_source":"他其实是正常的这时候影片里面就介绍有一个BBAnderson另外一个女演员演的一个护士叫Alma来照顾这位女演员叫Elizabeth两位女人就到了海边的一个小屋。","sentence_en":"She's actually normal. Then in the film, a nurse named Alma (played by Bibi Andersson) is brought in to care for the actress named Elizabeth. The two women go to a small cottage by the sea."},{"id":"207","start":2457.17,"end":2469.65,"displayStart":2457.17,"displayEnd":2469.65,"displayMid":2463.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.929769,"pitch":16.653999,"speechRate":5.728,"hasEvents":false,"sentence_source":"然后护士Alma就不停地讲话因为Elizabeth是不说话的所以整个故事就是在一个不说话的女人和一个不停说话的女人之间产生的我当时看的时候觉得。","sentence_en":"Nurse Alma keeps talking nonstop because Elizabeth doesn't speak. So the entire story unfolds between a silent woman and a woman who never stops talking. When I watched it, I thought..."},{"id":"208","start":2469.65,"end":2481.93,"displayStart":2469.65,"displayEnd":2481.93,"displayMid":2475.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.034217,"pitch":21.385696,"speechRate":5.313,"hasEvents":false,"sentence_source":"怎么只有一个人说话的电影会有这样的张力还有这么样的魔力我当时看的时候觉得我从来没有这样的感觉就是我当时觉得我没有坐在香港的沙发上。","sentence_en":"How can a movie with just one person talking have such tension and magic? When I watched it, I felt something I'd never felt before—like I wasn't sitting on my sofa in Hong Kong."},{"id":"209","start":2481.93,"end":2493.77,"displayStart":2481.93,"displayEnd":2493.77,"displayMid":2487.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.89713,"pitch":19.109825,"speechRate":6.13,"hasEvents":false,"sentence_source":"我好像去了另外一个地方我当时甚至都觉得不知道自己身体在哪里有一种就是灵魂出窍的感觉觉得好像自己在做梦像被催眠了一样这是我从来没有过的一种体验。","sentence_en":"I felt like I went somewhere else. I didn't even know where my body was—it was like an out-of-body experience, as if I was dreaming or hypnotized. I've never had that kind of experience before."},{"id":"210","start":2493.77,"end":2502.21,"displayStart":2493.77,"displayEnd":2502.21,"displayMid":2497.99,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.036115,"pitch":23.973209,"speechRate":6.321,"hasEvents":false,"sentence_source":"那你看完这部电影的就你刚才说除了灵魂出窍那种体验以外有没有像我记得就是李安那个著名的表情包就是我不是完全懂。","sentence_en":"So after watching the film, besides that out-of-body experience, did you also feel something like Ang Lee's famous meme—'I don't fully understand it'?"},{"id":"211","start":2502.21,"end":2514.73,"displayStart":2502.21,"displayEnd":2514.73,"displayMid":2508.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.939028,"pitch":17.205683,"speechRate":4.878,"hasEvents":false,"sentence_source":"但我大受震撼的那种感觉就是这样嗯我觉得这个电影好像看的时候不知道我具体看了什么我也说不出来是哪一个部分但就是觉得特别受震撼。","sentence_en":"But I was deeply shaken. That's how I felt. I think the movie—I didn't know exactly what I watched, I can't pinpoint a specific part, but I was just incredibly shaken."},{"id":"212","start":2514.73,"end":2520.65,"displayStart":2514.73,"displayEnd":2520.65,"displayMid":2517.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.6,"loudness":0.870238,"pitch":21.686119,"speechRate":4.73,"hasEvents":false,"sentence_source":"觉得好像自己变了一个人嗯而且我觉得伯格曼这个人真的太有趣。","sentence_en":"I felt like I became a different person. And I think Bergman is such an interesting person."},{"id":"213","start":2520.65,"end":2533.41,"displayStart":2520.65,"displayEnd":2533.41,"displayMid":2527.0299999999997,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Negative","score":-0.6,"loudness":1.002483,"pitch":24.805687,"speechRate":4.647,"hasEvents":false,"sentence_source":"太丰富了后来我看他的传记应该他的自传吧就他里面写他跟丽夫雾曼还有宾贝安德森他们之间故事然后看着我好难过呀我就觉得很难受。","sentence_en":"So rich. Later I read his biography—or his autobiography—where he wrote about his stories with Liv Ullmann and Bibi Andersson. Reading it made me so sad, I felt really upset."},{"id":"214","start":2533.65,"end":2546.71,"displayStart":2533.65,"displayEnd":2546.71,"displayMid":2540.1800000000003,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Negative","score":-0.7,"loudness":1.018915,"pitch":24.369934,"speechRate":6.133,"hasEvents":false,"sentence_source":"尤其那个丽芙·乌曼他们的描写她最后一次她看着她说她看着伯格曼的背影就哭了她就知道说我们的关系就是到此结束了然后她回家收拾了她的衣服都没有收拾她女儿的衣服。","sentence_en":"Especially the part about Liv Ullmann: the last time, she looked at him, watched his back as he walked away, and cried. She knew their relationship was over. Then she went home and packed only her own clothes, not even her daughter's."},{"id":"215","start":2546.97,"end":2551.33,"displayStart":2546.97,"displayEnd":2551.33,"displayMid":2549.1499999999996,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Negative","score":-0.5,"loudness":1.016705,"pitch":21.643995,"speechRate":6.236,"hasEvents":false,"sentence_source":"因为她那样就会意味着就好像真的很明确告诉你到此为止了是。","sentence_en":"Because that would mean she's clearly telling you it's over."},{"id":"216","start":2551.57,"end":2565.41,"displayStart":2551.57,"displayEnd":2565.41,"displayMid":2558.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.3,"loudness":0.945138,"pitch":19.284296,"speechRate":5.384,"hasEvents":false,"sentence_source":"我当时我见过丽芙·乌曼在现实生活中我当时在电影学校的时候我的那个我的毕业论文写的就是伯格曼的电影所以我知道那一年正好是伯格曼的诞成100周年。","sentence_en":"I met Liv Ullmann in real life. At film school, my thesis was on Bergman's films, so I knew it was his 100th birth anniversary."},{"id":"217","start":2565.41,"end":2578.21,"displayStart":2565.41,"displayEnd":2578.21,"displayMid":2571.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":1.016257,"pitch":19.841154,"speechRate":5.32,"hasEvents":false,"sentence_source":"我当时看到丽芙·乌曼后来伦敦会做一个他的回顾展的一个问答环节我就当时求了电影学校里面大大笑笑所有的老师看有没有人认识这个策展人。","sentence_en":"I saw Liv Ullmann would do a Q&A for a retrospective in London, so I asked all my film school teachers if anyone knew the curator."},{"id":"218","start":2578.21,"end":2591.37,"displayStart":2578.21,"displayEnd":2591.37,"displayMid":2584.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.922088,"pitch":20.199286,"speechRate":5.795,"hasEvents":false,"sentence_source":"我当时就以写这个论文为由想去见一下丽芙·乌曼但完全不是因为写论文我就是想见见他我到现在都记得特别深刻进去以后她就握住我的手握了15分钟的时间。","sentence_en":"I used my thesis as an excuse to meet Liv Ullmann, but it was purely because I wanted to see her. I still remember vividly: she held my hand for 15 minutes."},{"id":"219","start":2591.37,"end":2604.61,"displayStart":2591.37,"displayEnd":2604.61,"displayMid":2597.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.054226,"pitch":19.646135,"speechRate":5.156,"hasEvents":false,"sentence_source":"我就看着她的眼睛我就无法想象这是当时拍假面的LeaveAlman的那双眼睛但是她非常非常的深邃就是她看你的感觉是直视你的灵魂她非常诚实。","sentence_en":"I looked into her eyes—I couldn't believe these were the eyes from 'Persona'. But they were incredibly deep; she looked straight into your soul. She was very honest."},{"id":"220","start":2604.61,"end":2619.45,"displayStart":2604.61,"displayEnd":2619.45,"displayMid":2612.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.95988,"pitch":20.510195,"speechRate":4.61,"hasEvents":false,"sentence_source":"比如说我进去以后她就第一个就问我她说我听说你很想见我为什么直接就问我就不知道怎么回答很好的问题对非常直接我当然就一开始就说了一些套话类似。","sentence_en":"For example, the first thing she asked me was, 'I heard you wanted to see me, why?' Very direct. I didn't know how to answer, so I started with some clichés."},{"id":"221","start":2619.45,"end":2632.33,"displayStart":2619.45,"displayEnd":2632.33,"displayMid":2625.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":1.012663,"pitch":24.326313,"speechRate":5.357,"hasEvents":false,"sentence_source":"就是像我平常表演的方式就是一般我跟投行这些人表演的我会说一些东西但在LeaveOma那边就不管用因为他毕竟是演假面的女主角所以她就不为所动。","sentence_en":"The way I usually perform, like when I perform for investment bankers, I'll say certain things. But that didn't work with Liv Ullmann because she was the lead in Persona, so she was completely unmoved."},{"id":"222","start":2632.33,"end":2646.81,"displayStart":2632.33,"displayEnd":2646.81,"displayMid":2639.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":0.924555,"pitch":18.57622,"speechRate":5.11,"hasEvents":false,"sentence_source":"她就会很疑惑的看着我就是没有任何表情后来我就发现我得说一些真正的东西我就开始说了当时我看假面的那一次的感受而且当时我是第一次以这样爭執的方式去讲出来。","sentence_en":"She looked at me puzzled, with no expression. Then I realized I had to say something genuine. So I started describing my feelings when I first saw Persona, and it was the first time I expressed it in such a confrontational way."},{"id":"223","start":2646.81,"end":2659.93,"displayStart":2646.81,"displayEnd":2659.93,"displayMid":2653.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.971175,"pitch":18.481543,"speechRate":5.176,"hasEvents":false,"sentence_source":"而且他就立刻被打動了然后他就握著我的手就跟我一起聊了15分鐘的时間所以我会發现畢竟他是拍假面的女演員你任何裝任何东西他都不会吃你这套的。","sentence_en":"And she was immediately moved. She took my hand and we talked for fifteen minutes. So I realized, after all, she's the actress from Persona—she wouldn't fall for any act."},{"id":"224","start":2659.93,"end":2673.45,"displayStart":2659.93,"displayEnd":2673.45,"displayMid":2666.6899999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":0.991586,"pitch":20.834709,"speechRate":6.097,"hasEvents":false,"sentence_source":"而且他是唯一一个跟他聊天他会说是英马他会说英马怎么怎么样英马怎么怎么样而不是说博格曼怎么怎么样博格曼怎么怎么样我会一声哇他们是合作这么长时間的但是同时跟他聊天的时候。","sentence_en":"And she was the only one who, when speaking about him, would say 'Ingmar' this and 'Ingmar' that, rather than 'Bergman' this and 'Bergman' that. I thought, wow, they've worked together for so long. But while talking to her,"},{"id":"225","start":2673.45,"end":2687.69,"displayStart":2673.45,"displayEnd":2687.69,"displayMid":2680.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.930206,"pitch":18.197844,"speechRate":6.02,"hasEvents":false,"sentence_source":"他会跟我说一个事情他说你要做女导演的话你要记住一定要对很多事情说No你要一定要Fightforyourself就说你要知道Inkma之所以这么成功很多情况下是因为他是男的。","sentence_en":"She said to me: 'As a female director, you have to remember to say no to many things. You have to fight for yourself. You know, Ingmar was so successful largely because he was a man."},{"id":"226","start":2687.69,"end":2700.93,"displayStart":2687.69,"displayEnd":2700.93,"displayMid":2694.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":1.02277,"pitch":20.319672,"speechRate":5.301,"hasEvents":false,"sentence_source":"哈哈哈就突然之间就是因为我很崇拜伯哥们但是他就把这个spell给我break掉了然后他会跟我说因为他是男性所以当时很多台词其实很多人不想去念。","sentence_en":"Ha ha, so suddenly— because I admired Bergman so much, but she broke that spell. Then she told me that because he was a man, many actors at the time didn't want to deliver certain lines."},{"id":"227","start":2700.93,"end":2713.45,"displayStart":2700.93,"displayEnd":2713.45,"displayMid":2707.1899999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.888241,"pitch":19.240341,"speechRate":6.781,"hasEvents":false,"sentence_source":"像我们当时就不想去说但是YoucannotsaynotoBergman因为他是一个男的他有那么的成功但是如果你是女的的话就很多人会对你有微词但是你一定要争取自己的利益。","sentence_en":"We didn't want to say them, but you couldn't say no to Bergman because he was a man and so successful. But if you're a woman, people will criticize you, yet you must stand up for yourself."},{"id":"228","start":2713.45,"end":2726.65,"displayStart":2713.45,"displayEnd":2726.65,"displayMid":2720.05,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":0.964025,"pitch":20.150948,"speechRate":4.753,"hasEvents":false,"sentence_source":"这是我当时觉得让我很惊讶的一点而且也是让我觉得很有收获的一点是一定是他跟我说的他这段话可能你当时还没有特别完全明白他在说什么。","sentence_en":"That was something that really surprised me and taught me a lot. It was she who said it. At the time, you might not fully grasp what she meant."},{"id":"229","start":2726.65,"end":2738.65,"displayStart":2726.65,"displayEnd":2738.65,"displayMid":2732.65,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.4,"loudness":0.965194,"pitch":16.94631,"speechRate":4.927,"hasEvents":false,"sentence_source":"但是日后的工作当中你可能一定会不断的想到他曾经提醒你的这些对就是黑镜的时候我就会经常想到包括尸体的时候也会经常想到这些。","sentence_en":"But in your future work, you'll constantly think back to what she reminded you. Yes, for instance, when working on Black Mirror, I often thought of it, and also on The Corpse."},{"id":"230","start":2738.65,"end":2744.05,"displayStart":2738.65,"displayEnd":2744.05,"displayMid":2741.3500000000004,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.007365,"pitch":14.863644,"speechRate":5.283,"hasEvents":false,"sentence_source":"我觉得Liveisright他给我写了一段话在他的海报上。","sentence_en":"I think Liv is right. She wrote me a message on her poster."},{"id":"231","start":2744.05,"end":2757.65,"displayStart":2744.05,"displayEnd":2757.65,"displayMid":2750.8500000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.870365,"pitch":15.726066,"speechRate":6.103,"hasEvents":false,"sentence_source":"在婚姻生活的海报我就搁在我的书房里面我会经常会看他写的什么在那个婚姻生活的海报上他写的是DearLuluyouwilldogooddon'tforgetlovelive。","sentence_en":"I keep the poster of Scenes from a Marriage in my study. I often look at what she wrote on it. She wrote: 'Dear Lulu, you will do good. Don't forget love. Live."},{"id":"232","start":2757.65,"end":2772.35,"displayStart":2757.65,"displayEnd":2772.35,"displayMid":2765,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":1.014837,"pitch":21.871891,"speechRate":5.37,"hasEvents":false,"sentence_source":"当时他写的时候他已经80多岁所以他那个手就一直在唱所以他每一个字母都是他的唱唱唱唱写出来了我有时候会感感觉像Live这样的人或者我就想女性要想成就自己的伟大。","sentence_en":"When she wrote it, she was over 80, so her hand was trembling. Every letter was written in a trembling hand. Sometimes I feel that people like Liv, or I think: for a woman to achieve her own greatness..."},{"id":"233","start":2772.35,"end":2785.25,"displayStart":2772.35,"displayEnd":2785.25,"displayMid":2778.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.930264,"pitch":21.933254,"speechRate":5.209,"hasEvents":false,"sentence_source":"就一定不能够跟伟大的男性在一起我也经常会想这个问题是吧是的这其实是一个像我很喜欢看的一部电影就是《暗树的女儿》的LostDaughter。","sentence_en":"It must mean I can't be with a great man. I often think about this, yes. This reminds me of a film I really like, 'The Lost Daughter'."},{"id":"234","start":2785.25,"end":2797.97,"displayStart":2785.25,"displayEnd":2797.97,"displayMid":2791.6099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.933405,"pitch":17.539042,"speechRate":5.063,"hasEvents":false,"sentence_source" u","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.858419,"pitch":19.921265,"speechRate":5.093,"hasEvents":false,"sentence_source":"难道是女性真的爱孩子更多吗不知道就是我会想很多很多这样的问题那你曾经想过嗎就是我为什么要最終还是选择了这样的生活就是我本来我可以一个人特別自在瀟灑的。","sentence_en":"Is it that women truly love their children more? I don't know. I think about these questions a lot. Have you ever wondered why I ultimately chose this life? I could have been so carefree on my own."},{"id":"271","start":3230.69,"end":3243.05,"displayStart":3230.69,"displayEnd":3243.05,"displayMid":3236.87,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.040524,"pitch":23.446909,"speechRate":5.88,"hasEvents":false,"sentence_source":"即便是結婚的话兩个人的生活也可以很瀟灑自在做我的工作拍电影拍电視剧我去看电影但你这种一言选择了现在这样其实非常忙碌的給你自己夾雜了很多壓力的生活。","sentence_en":"Even if married, two people could live freely—doing my work, making films or TV, going to movies. But you chose this very busy, stressful life."},{"id":"272","start":3243.05,"end":3247.21,"displayStart":3243.05,"displayEnd":3247.21,"displayMid":3245.13,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":0.775418,"pitch":20.047943,"speechRate":4.337,"hasEvents":false,"sentence_source":"为什么是因为我其实对生命的一种好奇。","sentence_en":"Why? Because I'm actually curious about life."},{"id":"273","start":3247.21,"end":3261.29,"displayStart":3247.21,"displayEnd":3261.29,"displayMid":3254.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":1.008674,"pitch":19.085848,"speechRate":4.746,"hasEvents":false,"sentence_source":"因为我觉得也许最终一次完全创造一次一个体验就是创造一个生命的体验后来生了这个孩子以后很真实的就说当时怀孕以后觉得好奇怀孕是什么感觉。","sentence_en":"Because I think maybe ultimately it's about creating a unique experience—the experience of creating a life. After having this child, it's very real. When I was pregnant, I was curious what pregnancy felt like."},{"id":"274","start":3261.29,"end":3274.09,"displayStart":3261.29,"displayEnd":3274.09,"displayMid":3267.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.967283,"pitch":21.323721,"speechRate":5.82,"hasEvents":false,"sentence_source":"然后觉得别人也可以做也许就可以做一种不一样的妈妈可以做一种很独立的妈妈也可以做一种很酷的妈妈然后就一步一步一步陷入这个生长就是你是不知道下面会怎么样。","sentence_en":"Then I thought others could do it too, maybe I could be a different kind of mother—an independent mother, a cool mother. Then step by step, I fell into this growth. You don't know what comes next."},{"id":"275","start":3274.09,"end":3286.29,"displayStart":3274.09,"displayEnd":3286.29,"displayMid":3280.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.958715,"pitch":18.430206,"speechRate":4.836,"hasEvents":false,"sentence_source":"生了孩子以后我才发现天然园是这样我要做什么的妈妈怎么样做妈妈是一步一步跟自己的一个还有跟老公的一个妥协跟老公的一些争取。","sentence_en":"After giving birth, I realized, oh, so this is what it's like. What kind of mother do I want to be? How to be a mother is step by step—compromising with myself, negotiating with my husband."},{"id":"276","start":3286.29,"end":3299.61,"displayStart":3286.29,"displayEnd":3299.61,"displayMid":3292.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":0.811411,"pitch":17.405586,"speechRate":5.215,"hasEvents":false,"sentence_source":"还要对自己的一个争取这一步一步的一个决定所以我觉得现在想想看自己为什么会过这样的生活也许是因为自己其实是喜欢一种混乱的感觉一种不稳定的感觉。","sentence_en":"And also fighting for myself. It's a decision made step by step. So I think looking back, why I live this life might be because I actually like a sense of chaos, a sense of instability."},{"id":"277","start":3299.61,"end":3312.17,"displayStart":3299.61,"displayEnd":3312.17,"displayMid":3305.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":0.887374,"pitch":17.602247,"speechRate":4.299,"hasEvents":false,"sentence_source":"这让我觉得很刺激我觉得这给我很多灵感反而很有序一切都很有章法的感觉让我没有灵感让我觉得好像反而像死水一样。","sentence_en":"It makes me feel excited, gives me a lot of inspiration. On the contrary, a sense of order and structure gives me no inspiration and feels like stagnant water."},{"id":"278","start":3312.17,"end":3324.17,"displayStart":3312.17,"displayEnd":3324.17,"displayMid":3318.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.897265,"pitch":16.98908,"speechRate":5.453,"hasEvents":false,"sentence_source":"我觉得自由的感觉并不是自在的感觉以前我觉得很自在就说想做什么就可以做什么想干什么就干什么没有人阻拦我也没有人责任但我并不觉得很自由。","sentence_en":"I think the feeling of freedom is not the feeling of being carefree. Before, I felt carefree—I could do whatever I wanted, no one stopped me, no responsibility. But I didn't feel free."},{"id":"279","start":3324.17,"end":3338.93,"displayStart":3324.17,"displayEnd":3338.93,"displayMid":3331.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Negative","score":-0.4,"loudness":0.930772,"pitch":18.617002,"speechRate":5.518,"hasEvents":false,"sentence_source":"我反而觉得很多烦恼有很多焦虑我会经常想很多很多事情而且那些事情是我想不出答案的因为我没有这个体验没有这个经历理解不到感觉不到反而现在让我觉得做决定的时候是一瞬间的。","sentence_en":"Instead, I felt a lot of worries and anxiety. I often thought about many things without answers because I didn't have that experience or understanding. Now, making decisions feels instantaneous."},{"id":"280","start":3338.93,"end":3353.93,"displayStart":3338.93,"displayEnd":3353.93,"displayMid":3346.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.8,"loudness":0.905308,"pitch":20.102448,"speechRate":4.933,"hasEvents":false,"sentence_source":"因为首先没有很多时间其次感觉特别的饱满就是生命的体验特别饱满感觉虽然自己的事情是在加缝中做但非常的自由反而就是自由的感觉是我觉得我好像所有的男都来吧。","sentence_en":"Because first, there's not much time; second, the feeling is very full—the experience of life is very rich. Even though I do my own things in the gaps, it feels very free. The feeling of freedom is like I say yes to everything coming my way."},{"id":"281","start":3353.93,"end":3368.93,"displayStart":3353.93,"displayEnd":3368.93,"displayMid":3361.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.934032,"pitch":18.792656,"speechRate":5.4,"hasEvents":false,"sentence_source":"都迎面来我就sayyes to everything但是反而在这种的框架下我去寻找了自己的自由让我觉得特别的可贵而且觉得生命的体验特别的饱满反而也许是适合我的一种状态。","sentence_en":"Everything comes at me, and I say yes to everything. But within this framework, I find my own freedom, which I find precious. And the experience of life is very rich. Maybe this is a state that suits me."},{"id":"282","start":3368.93,"end":3372.93,"displayStart":3368.93,"displayEnd":3372.93,"displayMid":3370.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":0.707354,"pitch":15.221059,"speechRate":4.5,"hasEvents":false,"sentence_source":"我也不知道我其实是喜欢这种饱满的感觉。","sentence_en":"I don't ","start":4388.4,"end":4401.6,"displayStart":4388.4,"displayEnd":4401.6,"displayMid":4395,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":1.004927,"pitch":21.263636,"speechRate":5.374,"hasEvents":false,"sentence_source":"所以你就突然之間觉得人生变大了我当然有一种一开始有种不適感就是不知道從精英一下的到了这种怎么样跟別人去交往但后来發现这是一个非常非常好的一个。","sentence_en":"So you suddenly feel that life has expanded. Of course, at first I felt uncomfortable—not knowing how to interact with others after coming down from the elite. But later I found it's a very, very good thing."},{"id":"372","start":4401.6,"end":4414.96,"displayStart":4401.6,"displayEnd":4414.96,"displayMid":4408.280000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.7,"loudness":0.915958,"pitch":17.576921,"speechRate":4.632,"hasEvents":false,"sentence_source":"因为你如果想去做藝術你必須把自己放到能看到最廣的世界才可以我觉得就是看到越廣的世界有越廣的人生的经歷才能派出比較丰富的东西。","sentence_en":"Because if you want to do art, you must put yourself in a place where you can see the widest world. I think the broader the world you see and the broader your life experience, the richer the things you can produce."},{"id":"373","start":4414.96,"end":4424.12,"displayStart":4414.96,"displayEnd":4424.12,"displayMid":4419.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":0.810575,"pitch":16.371408,"speechRate":5.447,"hasEvents":false,"sentence_source":"里面的人物你们的感受才会比較丰富而不是在一种精英就是看到一部分的狀態每个人都会有很多的故事其实真的。","sentence_en":"Then the characters and your feelings will be richer, rather than being in an elite state where you only see a part. Everyone has many stories, really."},{"id":"374","start":4424.12,"end":4430.48,"displayStart":4424.12,"displayEnd":4430.48,"displayMid":4427.299999999999,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors, Motherhood, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.030201,"pitch":23.514645,"speechRate":4.561,"hasEvents":false,"sentence_source":"那你想像你未来的事业是在哪里好萊塢还是国內还是就在英国。","sentence_en":"So where do you imagine your future career—Hollywood, China, or just in the UK?"},{"id":"375","start":4430.48,"end":4443.28,"displayStart":4430.48,"displayEnd":4443.28,"displayMid":4436.879999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":0.904197,"pitch":17.488268,"speechRate":4.651,"hasEvents":false,"sentence_source":"我会想我想拍的东西我希望大家都可以看到我想拍现在跟中国有关的一部电影就是是用国际化的語言去拍让大家都能看到的一个电影。","sentence_en":"I want to make things that everyone can see. I want to make a film related to China now, using an international language to shoot so that everyone can watch it."},{"id":"376","start":4443.28,"end":4457.12,"displayStart":4443.28,"displayEnd":4457.12,"displayMid":4450.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0,"loudness":1.075365,"pitch":18.669678,"speechRate":4.746,"hasEvents":false,"sentence_source":"但这个可能是在国內拍我会想拍一部但是可能不是一个就是完全是国产一个电影有可能好萊塢的话我会很謹慎因为我觉得好萊塢现在跟以前还不一样。","sentence_en":"But this might be filmed in China. I want to shoot one, but it might not be a completely domestic film. As for Hollywood, I'll be cautious because I think Hollywood now is different from before."},{"id":"377","start":4457.12,"end":4469.52,"displayStart":4457.12,"displayEnd":4469.52,"displayMid":4463.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":-0.1,"loudness":1.054033,"pitch":19.898516,"speechRate":5.265,"hasEvents":false,"sentence_source":"现在是一个不是那么好的一个狀態而且美国的狀態也不是那么好所以我会在一种觀望的狀態我並不是很著急的往那邊走像比如我很喜欢沙丘那个导演。","sentence_en":"Right now it's not in a good state, and the US is not in a good state either. So I'm in a wait-and-see mode; I'm not in a hurry to go there. For example, I really like the director of Dune."},{"id":"378","start":4469.52,"end":4482.36,"displayStart":4469.52,"displayEnd":4482.36,"displayMid":4475.9400000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.909939,"pitch":15.250904,"speechRate":4.745,"hasEvents":false,"sentence_source":"他的很多作品我觉得能把这么大的像沙丘2做得我认为自己觉得拍得非常好这么大的成本拍一个很艺术的一个商业片就是是很有作者性的。","sentence_en":"Many of his works—like Dune 2, which I think is extremely well-made—he managed to shoot a very artistic commercial film with such a huge budget, and it's very authorial."},{"id":"379","start":4482.36,"end":4495.88,"displayStart":4482.36,"displayEnd":4495.88,"displayMid":4489.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.97962,"pitch":19.221731,"speechRate":4.924,"hasEvents":false,"sentence_source":"但是它是一个艺术品但是大家都能看懂我觉得沙丘二做特别牛的是他里面的剧本他的对白非常地精练就是任何一个人小孩大人任何一个说不说英语的人。","sentence_en":"But it's an artwork that everyone can understand. What I think is particularly brilliant about Dune 2 is the script—the dialogue is very concise. Any person, child, adult, or anyone who doesn't speak English..."},{"id":"380","start":4495.88,"end":4508.6,"displayStart":4495.88,"displayEnd":4508.6,"displayMid":4502.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.884532,"pitch":17.967688,"speechRate":5.286,"hasEvents":false,"sentence_source":"他都能明白他在说什么故事讲得非常清楚但是他的画面呈现又是复杂的他可以把里面的东西呈现在很有深度和广度我觉得这是一个非常不容易的一个东西。","sentence_en":"...can understand what the story is about. The storytelling is very clear, but the visual presentation is complex. He can present things with great depth and breadth. I think this is very difficult to achieve."},{"id":"381","start":4508.6,"end":4520.8,"displayStart":4508.6,"displayEnd":4520.8,"displayMid":4514.700000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.7,"loudness":0.839365,"pitch":17.577084,"speechRate":5.128,"hasEvents":false,"sentence_source":"因为我觉得毕竟电影是一个大众的一个东西所以我希望能拍出大家都可以看到的东西能都能看懂的东西而不是拍这种很小的艺术院线的东西。","sentence_en":"Because I think film is ultimately a mass medium, so I hope to make things that everyone can see and understand, rather than making small art-house cinema."},{"id":"382","start":4520.8,"end":4533.08,"displayStart":4520.8,"displayEnd":4533.08,"displayMid":4526.9400000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Neutral","score":0.2,"loudness":0.965223,"pitch":18.577082,"speechRate":5.408,"hasEvents":false,"sentence_source":"在这边也会有一些像电影公司在找我就是看他们的东西我也愿意看比如说最近那个潘读丁山的那些公司就在找我看有没有可以合作的机会那我也不排除。","sentence_en":"Over here, some film companies are reaching out to me, and I'm willing to see their stuff. For example, recently the companies for that 'Pan du Ding Shan' project contacted me to see if there's a chance to collaborate. I'm not ruling it out."},{"id":"383","start":4533.08,"end":4548.68,"displayStart":4533.08,"displayEnd":4548.68,"displayMid":4540.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Creative Philosophy of Film Directors","sentiment_en":"Positive","score":0.5,"loudness":0.848464,"pitch":18.825029,"speechRate":4.397,"hasEvents":false,"sentence_source":"我觉得愿意啊如果有很好的剧本我也愿意拍别人的东西ok期待你能够多拍一些那我想问一些关于就是跟服装相关的几个问题你参加红毯一般都会怎样着装。","sentence_en":"I think I would, if there's a great script, I'd be willing to direct someone else's work. Okay, I hope you can make more films. I'd like to ask a few questions about clothing: How do you usually dress for red carpet events?"},{"id":"384","start":4548.68,"end":4561.68,"displayStart":4548.68,"displayEnd":4561.68,"displayMid":4555.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.5,"loudness":0.928844,"pitch":19.55913,"speechRate":5.855,"hasEvents":false,"sentence_source":"我就穿其实比较舒适的但是就是比较modernchic不会穿特别大那种ceremony的那些东西会相对符合自己的性格我觉得在红毯上最重要的是那个人要像自己。","sentence_en":"I wear clothes that are comfortable but modern chic, not those big ceremonial things. It suits my personality. I think on the red carpet, the most important thing is that the person looks like themselves."},{"id":"385","start":4561.68,"end":4573.92,"displayStart":4561.68,"displayEnd":4573.92,"displayMid":4567.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0.2,"loudness":0.916029,"pitch":18.563841,"speechRate":4.676,"hasEvents":false,"sentence_source":"所以我会穿跟自己职业是有关的不会穿得自己像演员一样首先可能就相对舒适但是比较时尚的也可能会略微有些中性的一些衣服吧。","sentence_en":"So I'll wear something related to my profession, not dressing like an actor. First, it should be relatively comfortable but stylish, and maybe a bit androgynous."},{"id":"386","start":4573.92,"end":4580.32,"displayStart":4573.92,"displayEnd":4580.32,"displayMid":4577.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.87895,"pitch":16.498476,"speechRate":4.289,"hasEvents":false,"sentence_source":"不会特别的就是像小女孩这样不会那你听到严重话术这几个字。","sentence_en":"Not particularly girlish. No. So when you hear the phrase 'severe rhetoric'..."},{"id":"387","start":4580.32,"end":4585.32,"displayStart":4580.32,"displayEnd":4585.32,"displayMid":4582.82,"speaker":"Wang Haolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Neutral","score":0,"loudness":0.830773,"pitch":21.005882,"speechRate":5.6,"hasEvents":false,"sentence_source":"你脑海当中会有一个画面吗它是什么样子的你怎么理解这几个字。","sentence_en":"Do you have an image in your mind? What does it look like? How do you understand these words?"},{"id":"388","start":4585.32,"end":4598.96,"displayStart":4585.32,"displayEnd":4598.96,"displayMid":4592.139999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.95713,"pitch":16.81164,"speechRate":4.125,"hasEvents":false,"sentence_source":"我很喜欢这几个字其实我特别喜欢这个节目的名字因为我觉得这是一种女性的声音的感觉因为我觉得我们就像在严实里面开的花。","sentence_en":"I really like these words. Actually, I particularly like the name of this show because I think it's a female voice. I feel we are like flowers blooming in a harsh environment."},{"id":"389","start":4598.96,"end":4614.16,"displayStart":4598.96,"displayEnd":4614.16,"displayMid":4606.5599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film creation and international directing experience","sentiment_en":"Positive","score":0.7,"loudness":1.014098,"pitch":18.743872,"speechRate":4.163,"hasEvents":false,"sentence_source":"在一种很坚韧的一种土壤还有并不是非常友好或者非常容易的生长的环境里面但一定要把这个花给开出来我心里的画面是在有些潮湿的大严实上。","sentence_en":"In a tough soil, an environment that is not very friendly or easy to grow in, but you must make the flower bloom. In my mind, the image is on some damp, hard rocks..."},{"id":"390","start":4614.16,"end":4629.2 <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",

  }];

    window.location.href = episodeUrl(select.value);
  });

function backIcon() {

  }));

    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));

    const item = el("div", "legend-item");

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;

  play.type = "button";
  play.disabled = !hasAudio;

    if (audio.paused) audio.play();
    else audio.pause();
  });

  seek.max = String(data.episode.duration || 0);

function renderVariableControl() {

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderPanel(title, content) {

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
