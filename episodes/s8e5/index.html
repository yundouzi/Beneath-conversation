    <script type="application/json" id="episode-data">{"episode":{"id":"S8E5","label":"S8E5","title":"S8E5 Lu Yu in Conversation with Zhu Tianwen | He has returned home ashore, while I alone continue to write the words of the 'shaman'.","intro":"Zhu Tianwen, Taiwanese writer and screenwriter\nChen Luyu, media personality and host\n\nIn the fifth episode of the eighth season of 'Among the Flowers', Luyu smiles gently at Zhu Tianwen, whom she first 'met' in Sanmao's essays.\nGrowing up in a 'military dependents' village' where the sounds and sights of 35 provinces mingled, she listened intently at the dinner table, read repeatedly, and strove to imagine the other side of the strait. The soft Taiwanese tone mixed with a single 'Da' (addressing father) was a touch of nostalgia inherited from her ancestral home in Linqu, Shandong. It wasn't until 1988, when she returned to her father's hometown of Suqian, Jiangsu, that the distant sorrow was finally set aside, preserved in amber within her heart.\nRaised in a 'paper-pasted' literary family where children were left to their own devices, she embraced a life of poverty and freedom, with 'writing' as her sole faith. Her father, after finishing official duties, would write late into the night; her mother took care of the family while also working as a translator. The three Zhu sisters each pursued different literary paths, running the 'San San Journal', writing about youthful exuberance, depicting the glamorous city, and recording street scenes of yesteryear. She says that having lived through an era where everyone read and talked about books daily, it's impossible not to believe in paper or to give back to literature.\nSharing 17 film adventures with Hou Hsiao-hsien, the two polished scripts in cafes like a game of 'serve and return', embedding their cherished memories of old times in 'A Time to Live, a Time to Die' and 'A Summer at Grandpa's'. Now, 40 years later, with Hou retired due to illness, the scene of their conversations has completely changed. She takes the bus from the south of the city to Hou's home in the north, discussing scriptwriting during walks, then cries all the way back from north to south. For their final dance, 'Searching for the River God', a group of comrades still moves forward with Hou's spirit, waiting only for it to grace the silver screen.\nShe often says, 'Film belongs to the director,' and 'I' willingly fades behind 'we'. But this is not about supporting others' achievements with her efforts; rather, she has long found her own path and destination by her desk—living three lives in one day, writing the words of her 'shaman', gathering heaven and earth into pages of manuscript.\nIf 'one can only do one thing in a lifetime', for her it is 'writing'; as for the honor-laden 'films', she regards them as a 'serendipity'.","duration":5335,"displayDuration":5335,"audioSrc":"s8e5.m4a","guest":"Zhu Tianwen","host":"Lu Yu","releaseDate":"2025.12.10"},"topicDefinitions":{"0":{"label":"C0","name":"Episode Summary","color":"#FFFFFF","opacity":0.2,"firstCategory":"Episode Summary","secondCategory":"Episode Summary","keyWords":["Episode Summary","Opening","Introduction"]},"1":{"label":"C1","name":"Film Creation and Literary Writing","color":"#B9B4B6","opacity":0.2,"firstCategory":"Film Creation and Literary Writing","secondCategory":"Film Creation and Literary Writing","keyWords":["Episode Summary","Opening","Introduction"]},"2":{"label":"C2","name":"Family Relationships and Childhood Memories","color":"#CB7281","opacity":0.2,"firstCategory":"Family Relationships and Childhood Memories","secondCategory":"Family Relationships and Childhood Memories","keyWords":["Accent","Maternal grandparents","Military dependents' village","Taiwan","History of"]},"3":{"label":"C3","name":"Parental education and family upbringing","color":"#DFA870","opacity":0.2,"firstCategory":"Parental education and family upbringing","secondCategory":"Parental Education and Family Growth","keyWords":["  like many things keep falling on your heart."},{"id":"8","start":34.37,"end":45.11,"displayStart":34.37,"displayEnd":45.11,"displayMid":39.739999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.7,"loudness":0.921476,"pitch":22.807074,"speechRate":4.376,"hasEvents":false,"sentence_source":"我会觉得这个时候是好好把握住 记住每一样事情，最后我觉得就是 猴岛已经登岸了，未来的路 你还要做很多事呢。","sentence_en":"I think at this time, you should seize and remember everything. In the end, I think it's like Monkey Island has landed. On the future road, you still have many things to do."},{"id":"9","start":45.11,"end":48.79,"displayStart":45.11,"displayEnd":48.79,"displayMid":46.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.863065,"pitch":17.480152,"speechRate":3.221,"hasEvents":false,"sentence_source":"那就是开开心心地去做吧。","sentence_en":"Then just do it happily."},{"id":"10","start":51.22,"end":56.3,"displayStart":51.22,"displayEnd":56.3,"displayMid":53.76,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.950628,"pitch":23.215685,"speechRate":5.714,"hasEvents":true,"sentence_source":"因为你有自己的写作的那一方天地，像您说是巫的天地 有那个小书桌。","sentence_en":"Because you have your own world of writing, like you said, the world of 'Wu', with that little desk."},{"id":"11","start":56.3,"end":60.4,"displayStart":56.3,"displayEnd":60.4,"displayMid":58.349999999999994,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.11621,"pitch":25.112535,"speechRate":5.122,"hasEvents":false,"sentence_source":"所以当您在跟电影发生奇谕的时候，您不太介意说。","sentence_en":"So when you have a wonderful encounter with film, you don't really mind."},{"id":"12","start":60.4,"end":73.84,"displayStart":60.4,"displayEnd":73.84,"displayMid":67.12,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.052738,"pitch":20.958885,"speechRate":5.049,"hasEvents":true,"sentence_source":"那我就是编剧《此刻光荣属于我们属于导演》，但我内心我自己独立成章的底气，我的骄傲依然是不会受到任何的影响，这点好重要，就有自己的那一方，书桌太重要了。","sentence_en":"Then I am the screenwriter, 'At this moment, glory belongs to us, belongs to the director.' But in my heart, my confidence to stand independently, my pride, still won't be affected. This is very important. Having your own space, your desk, is too important."},{"id":"13","start":76.42,"end":80.68,"displayStart":76.42,"displayEnd":80.68,"displayMid":78.55000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.184842,"pitch":20.582047,"speechRate":4.45,"hasEvents":true,"sentence_source":"大家都要看书的时代，你是看过这件事的人。","sentence_en":"In an era when everyone was expected to read, you were the one who actually read."},{"id":"14","start":80.68,"end":83.2,"displayStart":80.68,"displayEnd":83.2,"displayMid":81.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.05445,"pitch":25.358368,"speechRate":5.778,"hasEvents":false,"sentence_source":"所以你是相信纸本的力量的人。","sentence_en":"So you’re someone who believes in the power of print."},{"id":"15","start":83.68,"end":86.7,"displayStart":83.68,"displayEnd":86.7,"displayMid":85.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.4,"loudness":0.96637,"pitch":21.103432,"speechRate":5.085,"hasEvents":false,"sentence_source":"我们在这个福利之上，生于那个时代。","sentence_en":"We were born into that era, benefiting from that privilege."},{"id":"16","start":86.7,"end":101.5,"displayStart":86.7,"displayEnd":101.5,"displayMid":94.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.7,"loudness":0.934381,"pitch":20.580091,"speechRate":4.054,"hasEvents":false,"sentence_source":"所以你怎么不能回馈它呢，回馈过往所吸收的，从书本而来的知识，这也是我觉得现在写作的我心里头的一个动力吧，你取之于这么大的一个湖水。","sentence_en":"So how can you not give back to it—repaying the knowledge absorbed from books in the past? This is also a driving force in my writing now: you draw from such a vast lake."},{"id":"17","start":101.5,"end":105.5,"displayStart":101.5,"displayEnd":105.5,"displayMid":103.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.91503,"pitch":20.299387,"speechRate":4.244,"hasEvents":false,"sentence_source":"你也应该要还回一些到这个湖水里头。","sentence_en":"And you should give something back to this pool."},{"id":"18","start":108.14,"end":122.42,"displayStart":108.14,"displayEnd":122.42,"displayMid":115.28,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.085072,"pitch":19.827986,"speechRate":4.375,"hasEvents":true,"sentence_source":"你有一篇小说，去节目《华丽》里面就写有一句话，印象特别深说，有一天男人用理论和制度建立的世界会倒塌，他将以嗅觉和颜色、记忆、存活从这里御重建。","sentence_en":"In one of your short stories featured on the program 'Huali,' there's a line that left a deep impression: 'One day, the world built by men with theories and systems will collapse, and he will rebuild it from here with scent, color, memory, and survival.'"},{"id":"19","start":133.13,"end":147.79,"displayStart":133.13,"displayEnd":147.79,"displayMid":140.45999999999998,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.976049,"pitch":23.98579,"speechRate":4.881,"hasEvents":true,"sentence_source":"嗨 大家好，好欢迎来到岩中花述，我今天坐早班飞机从北京到广州来见朱天文老师，我的感受特别深的一点就是作为一个读者，他和一个作者最终相见本身就是一个故事。","sentence_en":"Hi everyone, welcome to 'Words in the Rock.' I took an early flight from Beijing to Guangzhou today to meet Teacher Zhu Tianwen. What struck me most is that the moment when a reader finally meets an author is itself a story."},{"id":"20","start":147.79,"end":156.23,"displayStart":147.79,"displayEnd":156.23,"displayMid":152.01,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.898105,"pitch":20.054325,"speechRate":4.903,"hasEvents":false,"sentence_source":"我想跟大家分享一下，我是在80年代长大的小孩，我记得是82年或者83年，我刚刚上初中。","sentence_en":"I want to share something—I grew up in the 80s. I remember it was 1982 or 1983, I had just started middle school."},{"id":"21","start":156.23,"end":165.31,"displayStart":156.23,"displayEnd":165.31,"displayMid":160.76999999999998,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.848614,"pitch":25.644014,"speechRate":4.614,"hasEvents":false,"sentence_source":"那个时候班女同学流行看三毛，我在其中一本叫《梦里花落之多少》，有一篇文章叫《云在青山月在天》。","sentence_en":"At that time, girls in my class were all into Sanmao. In one of her books, 'How Many Flowers Fall in Dreams,' there was an essay titled 'Clouds in the Green Hills, Moon in the Sky."},{"id":"22","start":165.31,"end":176.13,"displayStart":165.31,"displayEnd":176.13,"displayMid":170.72,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.903082,"pitch":22.526241,"speechRate":5.044,"hasEvents":false,"sentence_source":"那篇文章我第一次看到朱天文的名字，当时三毛就写他要离开了，天文说 哎呀 他也要离开 可能见不到面了，三毛想见不见也没关系。","sentence_en":"That essay was the first time I saw the name Zhu Tianwen. Sanmao wrote that she was leaving, and Tianwen said, 'Ah, she’s leaving too—maybe we won’t meet again.' Sanmao thought it didn’t matter whether they met or not."},{"id":"23","start":176.13,"end":191.47,"displayStart":176.13,"displayEnd":191.47,"displayMid":183.8,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":0.812419,"pitch":22.122694,"speechRate":4.498,"hasEvents":false,"sentence_source":"然后朱天文说 你可是有没有心，三毛就回了一句叫《云在青山月在天》，我想 哇 这句话好深刻，你想那是82年 83年，我要事隔40年之后才跟当时了解的一位作者见面。","sentence_en":"Then Zhu Tianwen said, 'But do you have a heart?' Sanmao replied with 'Clouds in the Green Hills, Moon in the Sky.' I thought, wow, that line is so profound. Think about it—that was 1982 or 1983. It would be 40 years later before I met the author I came to know back then."},{"id":"24","start":191.47,"end":200.17,"displayStart":191.47,"displayEnd":200.17,"displayMid":195.82,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.872833,"pitch":23.547844,"speechRate":5.632,"hasEvents":true,"sentence_source":"但那时候开始我就知道了朱天文 朱天心 朱天一 朱家三姐妹，在我看上是神奇的美好的 写作之家 还有他们的三三极刊。","sentence_en":"But from then on, I learned about Zhu Tianwen, Zhu Tianxin, Zhu Tianyi—the three Zhu sisters. To me, they were a magical, beautiful writing family, along with their 'Thirty-Three' publication."},{"id":"25","start":200.77,"end":206.95,"displayStart":200.77,"displayEnd":206.95,"displayMid":203.86,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":0.808996,"pitch":20.592115,"speechRate":5.178,"hasEvents":true,"sentence_source":"然后我成了他跟猴岛电影作品的忠实的观众，再到后来我成了他文字的读者。","sentence_en":"Then I became a loyal viewer of their films with Hou Hsiao-hsien, and later, a reader of their words."},{"id":"26","start":206.95,"end":214.31,"displayStart":206.95,"displayEnd":214.31,"displayMid":210.63,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.883292,"pitch":23.805311,"speechRate":5.624,"hasEvents":false,"sentence_source":"所以从听说看到名字 到看电影 到读他的作品，分别是四十年 三十年 二十年 大概这样一个建格。","sentence_en":"So from hearing the name, to watching the films, to reading the works—that’s a span of forty, thirty, twenty years, roughly."},{"id":"27","start":214.31,"end":220.25,"displayStart":214.31,"displayEnd":220.25,"displayMid":217.28,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.020643,"pitch":24.78928,"speechRate":5.051,"hasEvents":false,"sentence_source":"所以此刻我非常的感慨 也很感动 很高兴，看到坐在我对面的朱天文老师。","sentence_en":"So right now, I’m very moved, emotional, and happy to see Teacher Zhu Tianwen sitting across from me."},{"id":"28","start":220.25,"end":223.33,"displayStart":220.25,"displayEnd":223.33,"displayMid":221.79000000000002,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.933428,"pitch":22.99048,"speechRate":6.143,"hasEvents":false,"sentence_source":"那请天文老师跟岩中花述的听众打个招呼。","sentence_en":"Please say hello to the listeners of 'Words in the Rock,' Teacher Tianwen."},{"id":"29","start":223.33,"end":227.53,"displayStart":223.33,"displayEnd":227.53,"displayMid":225.43,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.5,"loudness":0.863141,"pitch":19.702784,"speechRate":4.804,"hasEvents":false,"sentence_source":"大家好，我刚才讲那一刻的感受就觉得很神奇。","sentence_en":"Hello everyone. The feeling at that moment just now was really magical."},{"id":"30","start":227.53,"end":231.97,"displayStart":227.53,"displayEnd":231.97,"displayMid":229.75,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.787292,"pitch":19.56299,"speechRate":5.18,"hasEvents":false,"sentence_source":"因为自己其实想不到时间会跨越了这么久，我也是觉得。","sentence_en":"Because I never imagined time would span so long. I feel the same way."},{"id":"31","start":231.97,"end":236.93,"displayStart":231.97,"displayEnd":236.93,"displayMid":234.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.934841,"pitch":22.172272,"speechRate":4.435,"hasEvents":false,"sentence_source":"像我第一次来大陆是陪我父母亲，主要我父亲的探亲。","sentence_en":"The first time I came to mainland China was to accompany my parents, mainly for my father to visit relatives."},{"id":"32","start":236.93,"end":241.51,"displayStart":236.93,"displayEnd":241.51,"displayMid":239.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.862966,"pitch":17.414225,"speechRate":3.493,"hasEvents":false,"sentence_source":"那是1988年到从小我们说的老家。","sentence_en":"That was 1988, going to what we called our hometown since childhood."},{"id":"33","start":241.51,"end":248.35,"displayStart":241.51,"displayEnd":248.35,"displayMid":244.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.801217,"pitch":20.901976,"speechRate":3.655,"hasEvents":false,"sentence_source":"那就是苏北的苏千，去了南京，和南京的我的四个表哥在那边。","sentence_en":"That was Suqian in northern Jiangsu. We went to Nanjing and met my four cousins there."},{"id":"34","start":248.35,"end":252.31,"displayStart":248.35,"displayEnd":252.31,"displayMid":250.32999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.823316,"pitch":26.396439,"speechRate":5.191,"hasEvents":false,"sentence_source":"然后我们就坐了一个巴士﹐现在是京东铁路吗?","sentence_en":"Then we took a bus—was it the Beijing-Shanghai railway then?"},{"id":"35","start":252.39,"end":258.39,"displayStart":252.39,"displayEnd":258.39,"displayMid":255.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.897304,"pitch":20.932831,"speechRate":6.097,"hasEvents":false,"sentence_source":"还怎么不知道﹐现在应该有高铁了﹐有高铁了﹐当时我们是租了个小人吧﹐然后经过博阳湖。","sentence_en":"I don’t know exactly. Now there’s a high-speed rail, of course. Back then, we rented a small car and passed by Boyang Lake."},{"id":"36","start":258.39,"end":272.93,"displayStart":258.39,"displayEnd":272.93,"displayMid":265.65999999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.4,"loudness":0.810104,"pitch":17.165302,"speechRate":4.058,"hasEvents":false,"sentence_source":"这对我们来讲，我们从小是念地理﹐念中国历史，才看得到的东西﹐博阳湖，我都很难想象﹐所以就经过那边要五个小时到那个宿前﹐那是1988年。","sentence_en":"For us, we had only studied geography and Chinese history growing up, so seeing Boyang Lake was hard to imagine. It took five hours to get to Suqian. That was 1988."},{"id":"37","start":272.93,"end":287.41,"displayStart":272.93,"displayEnd":287.41,"displayMid":280.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.776205,"pitch":18.211285,"speechRate":3.177,"hasEvents":false,"sentence_source":"之后陪着我父亲从下官一致逆流而上 到了重庆成都，将一路的内趟去了一个月吧 然后到今天 哇 二零二五年了。","sentence_en":"After that, I accompanied my father upstream from Xiaguan all the way to Chongqing and Chengdu, traveling inland for about a month. And now—wow, 2025."},{"id":"38","start":287.41,"end":295.71,"displayStart":287.41,"displayEnd":295.71,"displayMid":291.56,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.871373,"pitch":24.867493,"speechRate":5.448,"hasEvents":false,"sentence_source":"好 时间真的过得好快，我记得您当时在文章里面还写 第一次回老家探亲，以为要去的是山东结，果去的是素千。","sentence_en":"Time really flies. I remember you wrote in an article that when you first went back to visit relatives, you thought you were going to Shandong, but ended up in Suqian."},{"id":"39","start":295.71,"end":302.31,"displayStart":295.71,"displayEnd":302.31,"displayMid":299.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.800447,"pitch":20.200794,"speechRate":4.394,"hasEvents":false,"sentence_source":"因为我们从小都一直以为 或者我们的身份证上都是写的山东邻区建。","sentence_en":"Because we always thought—or our IDs said—'Shandong, Linyi District'."},{"id":"40","start":302.31,"end":304.93,"displayStart":302.31,"displayEnd":304.93,"displayMid":303.62,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.738445,"pitch":27.512794,"speechRate":5.917,"hasEvents":false,"sentence_source":"宁所有的介绍后面都是山东邻居人。","sentence_en":"All your introductions are about Shandong neighbors."},{"id":"41","start":304.93,"end":308.39,"displayStart":304.93,"displayEnd":308.39,"displayMid":306.65999999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":1.24086,"pitch":25.368334,"speechRate":7.143,"hasEvents":false,"sentence_source":"但几乎是到探亲的时候我们才知道是数千。","sentence_en":"But it was only during family visits that we realized it was in the thousands."},{"id":"42","start":308.39,"end":318.37,"displayStart":308.39,"displayEnd":318.37,"displayMid":313.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.86777,"pitch":19.539827,"speechRate":3.808,"hasEvents":false,"sentence_source":"但是父亲会写邻居 我想是因为是从他的邻祖母身上所讲的，全部都是在邻居的家乡的事情。","sentence_en":"But father would write about neighbors. I think it's because everything his grandmother told him was about things in the neighbors' hometown."},{"id":"43","start":318.37,"end":325.07,"displayStart":318.37,"displayEnd":325.07,"displayMid":321.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.852859,"pitch":18.46846,"speechRate":3.881,"hasEvents":false,"sentence_source":"所以他的小说 他的所有的记忆其实是祖母跟他讲的这些故事。","sentence_en":"So his novels, all his memories, are actually these stories his grandmother told him."},{"id":"44","start":325.07,"end":331.41,"displayStart":325.07,"displayEnd":331.41,"displayMid":328.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.777685,"pitch":19.686266,"speechRate":3.654,"hasEvents":false,"sentence_source":"其实在我祖母的时候他们就跨过界线就到了苏北了。","sentence_en":"Actually, in my grandmother's time, they crossed the boundary and arrived in northern Jiangsu."},{"id":"45","start":331.41,"end":335.19,"displayStart":331.41,"displayEnd":335.19,"displayMid":3 d Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":1.006586,"pitch":25.626108,"speechRate":5.269,"hasEvents":false,"sentence_source":"因为后来我看到有一段文字我就描述很有意思，说您小时候成长的家庭环境是山东大谷，加上客家方言 在家恐梦之道。","sentence_en":"Because later I read a passage that described it wonderfully, saying that your childhood family environment was a mix of Shandong and Hakka dialects, and at home there was a unique way of life."},{"id":"50","start":356.85,"end":363.95,"displayStart":356.85,"displayEnd":363.95,"displayMid":360.4,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.872048,"pitch":21.871792,"speechRate":5.352,"hasEvents":false,"sentence_source":"然后你们家还会再学一点点日语，总之他是一个文化背景非常雜柔的一个地方，当时我们是。","sentence_en":"And your family also learned a bit of Japanese. In short, it was a place with a very blended cultural background."},{"id":"51","start":363.95,"end":369.57,"displayStart":363.95,"displayEnd":369.57,"displayMid":366.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.906563,"pitch":19.164322,"speechRate":4.27,"hasEvents":false,"sentence_source":"说三十五省，三十五省的全部都到了这么南方一个小岛上。","sentence_en":"It was said that all the people from the thirty-five provinces had come to this small southern island."},{"id":"52","start":369.57,"end":382.65,"displayStart":369.57,"displayEnd":382.65,"displayMid":376.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.833031,"pitch":22.062008,"speechRate":4.125,"hasEvents":false,"sentence_source":"所以我们又住的是所谓的眷村，眷村就大概就有四川的 有安徽省的 有湖北，湖南就是所有的三十五省各省的人都在这个眷村里。","sentence_en":"So we lived in what were called military dependents' villages. In those villages, there were people from Sichuan, Anhui, Hubei, Hunan—in short, people from all of the thirty-five provinces were in these villages."},{"id":"53","start":382.65,"end":395.23,"displayStart":382.65,"displayEnd":395.23,"displayMid":388.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Positive","score":0.4,"loudness":0.94703,"pitch":18.918484,"speechRate":3.736,"hasEvents":false,"sentence_source":"所以有所谓眷村菜，就是每个人凭着自己的家乡的记忆，到那边发明出来的想象的 他所吃过的妈妈的菜 家里的菜。","sentence_en":"So there was so-called 'dependents' village cuisine', where everyone, relying on their hometown memories, invented imagined versions of their mother's cooking."},{"id":"54","start":395.23,"end":399.83,"displayStart":395.23,"displayEnd":399.83,"displayMid":397.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.805484,"pitch":17.176176,"speechRate":4.783,"hasEvents":false,"sentence_source":"那就到了南方这样一个小岛 数级近乎的把它做出来。","sentence_en":"So on this small southern island, they managed to recreate those dishes."},{"id":"55","start":399.83,"end":406.87,"displayStart":399.83,"displayEnd":406.87,"displayMid":403.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.832033,"pitch":18.025936,"speechRate":4.727,"hasEvents":false,"sentence_source":"所以我们大概是在这样子一个五湖四海 一个大杂会 大荣儒里头长大的孩子。","sentence_en":"So we were children who grew up in this kind of diverse, mixed, melting-pot environment."},{"id":"56","start":406.87,"end":407.75,"displayStart":406.87,"displayEnd":407.75,"displayMid":407.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.283688,"pitch":3.83134,"speechRate":2.273,"hasEvents":false,"sentence_source":"其实。","sentence_en":"Actually."},{"id":"57","start":407.75,"end":419.45,"displayStart":407.75,"displayEnd":419.45,"displayMid":413.6,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.919037,"pitch":26.167368,"speechRate":5.812,"hasEvents":false,"sentence_source":"我很好奇 像您父亲那一代人 他们到了台湾 他们认为就是一个暂时离开，后来发现要离开很久 到88年才能够再回到家乡，您说他在很长一段时间内心的那种情绪。","sentence_en":"I am very curious—the generation like your father, when they came to Taiwan, they thought it was just a temporary departure. Later they found they would be away for a long time, and only in 1988 could they return to their hometown. You said, over a long period, what was the inner emotion like?"},{"id":"58","start":419.45,"end":426.69,"displayStart":419.45,"displayEnd":426.69,"displayMid":423.07,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Negative","score":-0.5,"loudness":0.735624,"pitch":21.308733,"speechRate":5.438,"hasEvents":false,"sentence_source":"会是那种焦灼的 甚至是苍黄的 悲苦的，我特别好奇他们那一代中国人的内心是怎样的。","sentence_en":"Was it that kind of anxious, even bleak and bitter? I'm especially curious about the inner world of that generation of Chinese."},{"id":"59","start":427.49,"end":431.03,"displayStart":427.49,"displayEnd":431.03,"displayMid":429.26,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.982064,"pitch":25.660225,"speechRate":4.665,"hasEvents":false,"sentence_source":"其实，如果你看童年往事里头 那是一个。","sentence_en":"Actually, if you look at 'Childhood Memories', that was a..."},{"id":"60","start":431.03,"end":433.81,"displayStart":431.03,"displayEnd":433.81,"displayMid":432.4 :5.11,"hasEvents":false,"sentence_source":"所以像我父亲他们当时来，都是一大台湾没想这么热，缅好还尽量留着，觉得说有朝一日回去的时候还用，可是到后来也都把棉袄这些都卖掉了。","sentence_en":"For example, when my father and others came, they didn't expect Taiwan to be so hot. They tried to keep their cotton-padded clothes, thinking they might use them when they went back one day. But in the end, they sold even those jackets."},{"id":"64","start":474.23,"end":488.43,"displayStart":474.23,"displayEnd":488.43,"displayMid":481.33000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.868638,"pitch":21.073254,"speechRate":4.917,"hasEvents":false,"sentence_source":"所以台湾曾经有一个时候是一个战局之地，所有的建设什么都觉得是战时的，不是一个长久的，可是当你慢慢的觉得这就是长久之地的时候，1988年在返乡探亲。","sentence_en":"So Taiwan was once a wartime settlement. All construction was considered temporary. But when you slowly came to feel that this was a permanent place, in 1988, during the visits back home..."},{"id":"65","start":488.43,"end":494.21,"displayStart":488.43,"displayEnd":494.21,"displayMid":491.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Negative","score":-0.3,"loudness":0.727821,"pitch":22.607958,"speechRate":4.498,"hasEvents":true,"sentence_source":"那次好像忽然有一个觉悟，他就说 哎呀 我在这里好像住不惯了。","sentence_en":"That time, he seemed to suddenly have a realization, and he said, 'Ah, I'm not used to living here anymore."},{"id":"66","start":494.81,"end":498.57,"displayStart":494.81,"displayEnd":498.57,"displayMid":496.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.939192,"pitch":22.72893,"speechRate":5.966,"hasEvents":false,"sentence_source":"其实在台湾住了这么久，第一个我早上就要看报纸。","sentence_en":"Actually, after living in Taiwan so long, the first thing I do in the morning is read the newspaper."},{"id":"67","start":498.57,"end":500.59,"displayStart":498.57,"displayEnd":500.59,"displayMid":499.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.705444,"pitch":18.580839,"speechRate":4.455,"hasEvents":false,"sentence_source":"我们家是订五分报纸。","sentence_en":"My family subscribes to five newspapers."},{"id":"68","start":500.59,"end":515.87,"displayStart":500.59,"displayEnd":515.87,"displayMid":508.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Negative","score":-0.5,"loudness":0.914394,"pitch":23.341833,"speechRate":4.237,"hasEvents":false,"sentence_source":"好，光是看报纸这件事情，你所知道的世界，所知道的所有日常生活发生的事情，发觉1988年后来完全都看不到了，在当时会觉得说哎呀，好像我的中老。","sentence_en":"Just from reading the paper—the world and daily events you knew—after 1988, you couldn't see them at all. At the time, I thought, 'Oh, it seems my middle age..."},{"id":"69","start":515.87,"end":525.57,"displayStart":515.87,"displayEnd":525.57,"displayMid":520.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.849249,"pitch":20.384354,"speechRate":4.227,"hasEvents":false,"sentence_source":"跟最后埋葬之地好像是我们住的台北，住的景美，这个好像变成了是一个故乡讲，那这过程是很长的。","sentence_en":"And the place I'll be buried seems to be Taipei, Jingmei, where I live. This has become like a hometown. That process was very long."},{"id":"70","start":525.57,"end":528.21,"displayStart":525.57,"displayEnd":528.21,"displayMid":526.8900000000001,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":1.049223,"pitch":29.12822 ead about our origins, that source of Chinese culture, was once a great source of creativity for us, a great place of longing."},{"id":"79","start":567.63,"end":581.69,"displayStart":567.63,"displayEnd":581.69,"displayMid":574.6600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.90146,"pitch":19.576693,"speechRate":4.17,"hasEvents":false,"sentence_source":"那到1998年来看就说，啊 你读的那是一件事情，可是现实的你来之后看到的，父亲的祖辈之地，就发觉你要生活的话，好像是两件事情了。","sentence_en":"Then by 1998, you'd think: what you read is one thing, but when you actually arrive at your father's homeland, you realize living there is another matter entirely."},{"id":"80","start":581.69,"end":585.99,"displayStart":581.69,"displayEnd":585.99,"displayMid":583.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.776152,"pitch":21.547283,"speechRate":5.346,"hasEvents":false,"sentence_source":"所以那次返乡太平是一个很大的变化朱，天文 人生好。","sentence_en":"So that return to Taiping was a huge change—Zhu, Tianwen, life is good."},{"id":"81","start":585.99,"end":599.83,"displayStart":585.99,"displayEnd":599.83,"displayMid":592.9100000000001,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.835338,"pitch":21.058538,"speechRate":5.586,"hasEvents":false,"sentence_source":"都会有那样的时刻，88年那年年是32岁，对我1956 也是好晚，因为我当时去台北我们拍过眷村，就您当时住的眷村和您后来现在住的地方离得远吗。","sentence_en":"Everyone has those moments. In '88 I was 32—for me, 1956 is also very late. When I went to Taipei, we filmed the military dependents' village. How far was the one you lived in from where you live now?"},{"id":"82","start":600.21,"end":601.45,"displayStart":600.21,"displayEnd":601.45,"displayMi ckly put up homes. That's how our childhood village was: simple houses, with doors open between neighbors."},{"id":"86","start":630.57,"end":642.17,"displayStart":630.57,"displayEnd":642.17,"displayMid":636.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.764772,"pitch":19.384901,"speechRate":5.078,"hasEvents":false,"sentence_source":"那一家跑这一家，就是直接门就进去的，可能我们跟隔壁的也不是墙，上面都是通的，包括眷村都是一个临时，要接纳这么多人盖出来的房子。","sentence_en":"You'd walk right into the next house. There weren't even real walls between us; the tops were open. The whole village was temporary housing rushed to shelter so many."},{"id":"87","start":642.17,"end":656.11,"displayStart":642.17,"displayEnd":656.11,"displayMid":649.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.783993,"pitch":21.833584,"speechRate":4.651,"hasEvents":false,"sentence_source":"所以我们从这边这样长大，到现在的话 这些东西原有的地就盖成公寓，但可能还是军券的住的，可是完全变成公寓了 大楼了，土地这么贵 你当然要往上拔高。","sentence_en":"We grew up like that. Now, those original plots have become apartment buildings—still military housing, but all high-rises. Land is so expensive, you have to build upward."},{"id":"88","start":656.11,"end":659.03,"displayStart":656.11,"displayEnd":659.03,"displayMid":657.5699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Relationships and Childhood Memories","sentiment_en":"Neutral","score":0,"loudness":0.827926,"pitch":24.291307,"speechRate":5.594,"hasEvents":false,"sentence_source":"所以跟我们当时的环境完全不一样了。","sentence_en":"So it's completely different from what we had back then."},{"id":"89","start":659.03,"end":674.21,"displayStart":659.03,"displayEnd":674.21,"displayMid":666.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clu inging","sentiment_en":"Neutral","score":0,"loudness":1.02121,"pitch":25.747974,"speechRate":6.34,"hasEvents":false,"sentence_source":"那这些当你的年纪越来越大，你就晓得其实不容易的。","sentence_en":"And as you get older, you realize this is not easy."},{"id":"143","start":1110.17,"end":1123.89,"displayStart":1110.17,"displayEnd":1123.89,"displayMid":1117.0300000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Parental education and family upbringing","sentiment_en":"Neutral","score":0,"loudness":0.915064,"pitch":22.562178,"speechRate":4.605,"hasEvents":false,"sentence_source":"因为作为父母他都希望说，培养你自己的一些能力，在主流社会里头生存下去，活得更好，可是好像我的父母亲就不大是，在这上头他就基本上放牛吃草。","sentence_en":"Because as parents, they want to cultivate your abilities to survive and thrive in mainstream society, but my parents weren't like that—they basically let us be free-range."},{"id":"144","start":1123.89,"end":1126.07,"displayStart":1123.89,"displayEnd":1126.07,"displayMid":1124.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Parental education and family upbringing","sentiment_en":"Positive","score":0.3,"loudness":0.858416,"pitch":21.424538,"speechRate":7.45,"hasEvents":true,"sentence_source":"所以我们就长出来一人一个样。","sentence_en":"So we each turned out different."},{"id":"147","start":1181.41,"end":1190.31,"displayStart":1181.41,"displayEnd":1190.31,"displayMid":1185.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.899154,"pitch":23.049572,"speechRate":2.697,"hasEvents":false,"sentence_source":"鲁豫对话朱天文，你觉得是被赋予了你写作的能力跟才华。","sentence_en":"Luyu, talking to Zhu Tianwen: Do you feel you were endowed with writing ability and talent?"},{"id":"148","start":1190.31,"end":1199.31,"displayStart":1190.31,"displayEnd":1199.31,"displayMid":1194.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.824025,"pitch":21.532681,"speechRate":3.889,"hasEvents":true,"sentence_source":"所以你就有义务把你所在的这个短暂的一生把它记录下来，变成是一个义务跟责任。","sentence_en":"So you have the obligation to record this brief life you have, turning it into a duty and responsibility."},{"id":"149","start":1199.73,"end":1208.49,"displayStart":1199.73,"displayEnd":1208.49,"displayMid":1204.1100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.836506,"pitch":22.250816,"speechRate":4.627,"hasEvents":true,"sentence_source":"所以这个的话就是我们一路慢慢的走上来，这个东西就越来越清楚了，也不是一开始就这么明白。","sentence_en":"So as we slowly moved forward, this became clearer and clearer; it wasn't clear from the start."},{"id":"150","start":1208.91,"end":1215.51,"displayStart":1208.91,"displayEnd":1215.51,"displayMid":1212.21,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.943115,"pitch":20.716419,"speechRate":5.089,"hasEvents":false,"sentence_source":"您记得您最早对于写作的兴趣是来自于，小的时候上国文课上写作文吗不是 最。","sentence_en":"Do you remember that your earliest interest in writing came from writing essays in Chinese class as a child? Actually, not the earliest."},{"id":"151","start":1215.51,"end":1229.85,"displayStart":1215.51,"displayEnd":1229.85,"displayMid":1222.6799999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.935163,"pitch":23.502031,"speechRate":4.393,"hasEvents":false,"sentence_source":"早的写作经验 我就记得是当时我们有一位叔叔我们喊他管管，他在台湾是当时的诗人 管管叔叔，我就记得当时从学校里写了一个什么东西我拿给他看。","sentence_en":"My earliest writing experience I remember was when we had an uncle we called Guan Guan, he was a poet in Taiwan at the time, Uncle Guan Guan. I remember writing something at school and showing it to him."},{"id":"152","start":1229.85,"end":1241.77,"displayStart":1229.85,"displayEnd":1241.77,"displayMid":1235.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.3,"loudness":0.853897,"pitch":21.705912,"speechRate":4.95,"hasEvents":false,"sentence_source":"他也是在我们家 因为当时他们都是还没有结婚，我父母成家的早就把这个家当成是他们的家，过年过节就一定来过 然后平常有放假什么就来。","sentence_en":"He was also at our home because at that time they weren't married yet. My parents married early and treated this home as theirs, so they would come for holidays and whenever they had time off."},{"id":"153","start":1241.77,"end":1255.51,"displayStart":1241.77,"displayEnd":1255.51,"displayMid":1248.6399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.933218,"pitch":23.738735,"speechRate":4.865,"hasEvents":false,"sentence_source":"这管管书书他就看到我再写一个什么东西就拿去看，好像写个秋天吧 可能是学校里的作文，秋天我就说 哎呀 什么封页啊，所写的所有的元素全部是我看过的。","sentence_en":"Uncle Guan Guan saw me writing something and took it to read. It seemed to be about autumn, maybe a school essay. I wrote about autumn, and he said, 'Oh, what's this? All the elements are things you've seen."},{"id":"154","start":1255.51,"end":1270.99,"displayStart":1255.51,"displayEnd":1270.99,"displayMid":1263.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.852667,"pitch":23.216396,"speechRate":5.068,"hasEvents":false,"sentence_source":"这书里的 封页红啦 之类的 写的这些，可是管管书一看就说 这封页你看过吗，我说都没有 他说 你没有看过的你就不要写，好 他说 你看像你们家出去是稻田，稻田的收割以后都一朵一朵的稻田。","sentence_en":"The book's cover is red, and such things are written on it. But when I looked at the book, I said, 'Have you seen this cover?' I said no. He said, 'If you haven't seen it, don't write about it.' Then he said, 'Look, your house faces the rice fields. After the harvest, the fields are dotted with bundles of rice stalks.'"},{"id":"155","start":1270.99,"end":1285.53,"displayStart":1270.99,"displayEnd":1285.53,"displayMid":1278.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.4,"loudness":0.90278,"pitch":19.278391,"speechRate":4.883,"hasEvents":false,"sentence_source":"那就是在你们家旁边你要写这个，这是我最早最早的写了东西之后，长辈这管管叔叔他看你他讲讲，这对我的影响也很大，我说要写你所看见的，不要写你读到的你没看见的。","sentence_en":"That is, you should write about what's around your home. This was my very first time writing something, and then Uncle Guan Guan looked at it and talked to me. It had a big impact on me. He said to write what you see, not what you've read about but haven't seen."},{"id":"156","start":1285.53,"end":1287.11,"displayStart":1285.53,"displayEnd":1287.11,"displayMid":1286.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.768163,"pitch":20.127159,"speechRate":5.839,"hasEvents":false,"sentence_source":"这是一个很重要的。","sentence_en":"That was very important."},{"id":"157","start":1287.11,"end":1296.27,"displayStart":1287.11,"displayEnd":1296.27,"displayMid":1291.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.891128,"pitch":21.581823,"speechRate":4.643,"hasEvents":false,"sentence_source":"那所以这也就是我刚刚讲的说，你的短暂的医生你既然是，被赋予了写作的才华能力，你是要欠了债的。","sentence_en":"So that's what I just said: since you've been given the talent for writing in this brief life, you owe a debt."},{"id":"158","start":1296.27,"end":1303.37,"displayStart":1296.27,"displayEnd":1303.37,"displayMid":1299.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.913746,"pitch":23.360069,"speechRate":3.913,"hasEvents":false,"sentence_source":"所以这么短暂里头，你必须跟你所存在的一个处境对话去看它。","sentence_en":"So in this short time, you must engage in dialogue with the situation you exist in, to observe it."},{"id":"159","start":1303.37,"end":1317.11,"displayStart":1303.37,"displayEnd":1317.11,"displayMid":1310.2399999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.864084,"pitch":22.355978,"speechRate":5.022,"hasEvents":false,"sentence_source":"然后去把它记下来，这个记下来好像是在你这么漫长的一个人的，有记录的这历史来，你做了一点的小拼图或一点点的东西给它贴上去，这已经是变成一个义务和责任。","sentence_en":"Then record it. This recording is like, in the long recorded history of humanity, you add a small puzzle piece or a little something to it. This has become a duty and responsibility."},{"id":"160","start":1317.11,"end":1320.83,"displayStart":1317.11,"displayEnd":1320.83,"displayMid":1318.9699999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.668103,"pitch":18.84379,"speechRate":3.763,"hasEvents":false,"sentence_source":"这是我写东西到现在的一个认知。","sentence_en":"This is my understanding up to now in writing."},{"id":"161","start":1320.83,"end":1325.53,"displayStart":1320.83,"displayEnd":1325.53,"displayMid":1323.1799999999998,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.954071,"pitch":23.051737,"speechRate":5.319,"hasEvents":false,"sentence_source":"看过您后来在文章里面写，之前写作比如说十几岁少女时期。","sentence_en":"I've seen you later write in articles that earlier writing, for example, from your teenage girlhood."},{"id":"162","start":1325.53,"end":1334.65,"displayStart":1325.53,"displayEnd":1334.65,"displayMid":1330.0900000000001,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.6,"loudness":0.912434,"pitch":24.271978,"speechRate":6.469,"hasEvents":false,"sentence_source":"那就是凭着自己写作的热情跟天分 少女的热情洋溢，到后来才慢慢感觉到像您说的，我因为有天分 我有使命感 有责任感 中间是有一个划分的。","sentence_en":"At first it was just passion and talent for writing, youthful exuberance. Only later did I gradually realize, as you said, there's a divide between talent, a sense of mission, and a sense of responsibility."},{"id":"163","start":1334.65,"end":1338.71,"displayStart":1334.65,"displayEnd":1338.71,"displayMid":1336.68,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.973456,"pitch":23.887524,"speechRate":3.704,"hasEvents":false,"sentence_source":"这个划分最明显的一个跳街吧。","sentence_en":"The clearest example of that divide is a jump across a street."},{"id":"164","start":1338.71,"end":1342.25,"displayStart":1338.71,"displayEnd":1342.25,"displayMid":1340.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.860064,"pitch":16.772732,"speechRate":4.52,"hasEvents":false,"sentence_source":"我们讲说想跨了一大街 这样上去的话。","sentence_en":"We talked about wanting to cross a major street to step up like that."},{"id":"165","start":1342.25,"end":1355.73,"displayStart":1342.25,"displayEnd":1355.73,"displayMid":1348.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.5,"loudness":0.82946,"pitch":17.837217,"speechRate":4.822,"hasEvents":false,"sentence_s e were considered difficult."},{"id":"205","start":1756.59,"end":1769.89,"displayStart":1756.59,"displayEnd":1769.89,"displayMid":1763.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.864346,"pitch":21.645382,"speechRate":4.773,"hasEvents":false,"sentence_source":"然后《沙特》的书啊 《卡喵》的书啊 这些，在一般的大学生里头 《存在主义》当时是，比较难《沙特》、《波瓦》都是大家想象中的知识分子吧，《存在主义》曾经是一个南的书。","sentence_en":"Then books by Sartre, books by Camus, these. Among average college students, existentialism was relatively difficult. Sartre, Beauvoir - they were all intellectuals in everyone's imagination. Existentialism was once a difficult subject."},{"id":"206","start":1769.89,"end":1779.35,"displayStart":1769.89,"displayEnd":1779.35,"displayMid":1774.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.872711,"pitch":20.758108,"speechRate":5.269,"hasEvents":false,"sentence_source":"那你说《文学》的书的话 那当时的旧二时代，都是我们大学生壁看的 不管是托尔斯泰的，或者是喀拉玛祝福的兄弟们。","sentence_en":"When you talk about literary books, back in the so-called Old Second Era, all us college students had to read them—whether it was Tolstoy or The Brothers Karamazov."},{"id":"207","start":1779.35,"end":1785.15,"displayStart":1779.35,"displayEnd":1785.15,"displayMid":1782.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.898745,"pitch":22.603168,"speechRate":5.066,"hasEvents":false,"sentence_source":"其实现在想起来是多么幸福的一个年代，深处那个时代 大家都要看书。","sentence_en":"Looking back now, it really feels like such a blessed time. To be living in that era, when everyone was reading."},{"id":"208","start":1785.15,"end":1790.75,"displayStart":1785.15,"displayEnd":1790.75,"displayMid":1787.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.5,"loudness":0.903828,"pitch":26.550327,"speechRate":4.472,"hasEvents":false,"sentence_source":"那以前是你很重要的知识的吸收的来源，娱乐的来源。","sentence_en":"Back then, it was your key source of knowledge and entertainment."},{"id":"209","start":1790.75,"end":1795.47,"displayStart":1790.75,"displayEnd":1795.47,"displayMid":1793.1100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.6,"loudness":0.862529,"pitch":25.316982,"speechRate":4.227,"hasEvents":false,"sentence_source":"然后是你三观的整个建立的来源 是这么多的。","sentence_en":"And it also shaped your entire worldview—it was that powerful."},{"id":"210","start":1795.47,"end":1797.85,"displayStart":1795.47,"displayEnd":1797.85,"displayMid":1796.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":0.805711,"pitch":24.688692,"speechRate":5.379,"hasEvents":false,"sentence_source":"所以我想是有个人的因素。","sentence_en":"So I think there’s a personal element to it."},{"id":"211","start":1797.85,"end":1802.73,"displayStart":1797.85,"displayEnd":1802.73,"displayMid":1800.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.5,"loudness":0.891458,"pitch":23.978106,"speechRate":4.082,"hasEvents":false,"sentence_source":"那也有那个时代的氛围 跟时代空气的福利吧。","sentence_en":"But it was also the atmosphere of the time, a gift of the era."},{"id":"212","start":1802.73,"end":1804.83,"displayStart":1802.73,"displayEnd":1804.83,"displayMid":1803.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.6,"loudness":0.813706,"pitch":22.183722,"speechRate":4.762,"hasEvents":false,"sentence_source":"那个福利就是这么的大。","sentence_en":"And that gift was enormous."},{"id":"213","start":1804.83,"end":1808.33,"displayStart":1804.83,"displayEnd":1808.33,"displayMid":1806.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.5,"loudness":1.002714,"pitch":27.065172,"speechRate":5.237,"hasEvents":false,"sentence_source":"那我们在这个福利之上 生于那个时代。","sentence_en":"We were born into that era, right on top of that gift."},{"id":"214","start":1808.33,"end":1820.89,"displayStart":1808.33,"displayEnd":1820.89,"displayMid":1814.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.7,"loudness":0.819893,"pitch":23.112688,"speechRate":3.822,"hasEvents":false,"sentence_source":"所以你怎么不能回馈它呢，回馈过往所吸收的从书本而来的知识，你到你今天 你怎么不要还回它一些，要回馈它一些。","sentence_en":"So how could you not give back? Give back the knowledge you absorbed from books. Now, today, how could you not return something? You owe it something in return."},{"id":"215","start":1820.89,"end":1836.09,"displayStart":1820.89,"displayEnd":1836.09,"displayMid":1828.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Positive","score":0.8,"loudness":0.819972,"pitch":21.839178,"speechRate":3.853,"hasEvents":false,"sentence_source":"这也是我觉得现在写作的我心里头的一个动力吧，你取之于这么大的一个湖水，你也应该要还回一些到这个湖水里头，大家都要看书的时代。","sentence_en":"This is also a motivation for me as a writer now: you take from such a vast lake, and you should give something back to this lake, in an era where everyone reads."},{"id":"216","start":1836.09,"end":1837.29,"displayStart":1836.09,"displayEnd":1837.29,"displayMid":1836.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Reading Experience and Literary Enlightenment","sentiment_en":"Neutral","score":0,"loudness":1.173187,"pitch":32.167706,"speechRate":7.339,"hasEvents":false,"sentence_source":"那你生在那个时代。","sentence_en":"You were born in that era."},{"id":"217","start":1837.29,"end":1850.67,"displayStart":1837.29,"displayEnd":1850.67,"displayMid":1843.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.7,"loudness":0.847994,"pitch":21.170614,"speechRate":4.681,"hasEvents":false,"sentence_source":"然后你从事写作，你是看过这件事的人，你看过这件事，所以你是相信纸本的力量的人，那你即便到今天不再试了，可是还是会做这件事情，因为你相信他。","sentence_en":"And then you became a writer. You witnessed it firsthand—you saw what reading did. So you believe in the power of paper. Even if today you no longer try to prove it, you still do this because you believe in it."},{"id":"218","start":1850.67,"end":1855.21,"displayStart":1850.67,"displayEnd":1855.21,"displayMid":1852.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.959283,"pitch":20.194227,"speechRate":4.988,"hasEvents":false,"sentence_source":"我，建议您在《巫园》里面写自己书写的一个小书桌。","sentence_en":"I suggest you write about the small desk in your own study, where you write, in the Witch's Garden."},{"id":"219","start":1855.21,"end":1863.09,"displayStart":1855.21,"displayEnd":1863.09,"displayMid":1859.15,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.6,"loudness":0.868023,"pitch":21.234921,"speechRate":4.315,"hasEvents":false,"sentence_source":"你说这里面有可以看到天上地下 好像古今中外，这就是巫的地方 我能够感受到您。","sentence_en":"You said that in this place you can see both heaven and earth, past and present, here and abroad. That’s the magic of it. I can feel that about you."},{"id":"220","start":1863.09,"end":1864.13,"displayStart":1863.09,"displayEnd":1864.13,"displayMid":1863.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":1.305569,"pitch":22.317808,"speechRate":6.731,"hasEvents":false,"sentence_source":"所谓的巫的地方。","sentence_en":"The so-called shamanic place."},{"id":"221","start":1864.13,"end":1873.21,"displayStart":1864.13,"displayEnd":1873.21,"displayMid":1868.67,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.890457,"pitch":16.998472,"speechRate":5.507,"hasEvents":false,"sentence_source":"场所 就是它写作就是这样一个神奇的场所，这个笔就是一个神奇的 它可以创造一切，宇宙红荒都可以在我笔下流淌出来。","sentence_en":"The place—writing is such a magical place. This pen is magical; it can create everything. The primordial chaos of the universe flows from my pen."},{"id":"222","start":1873.21,"end":1873.99,"displayStart":1873.21,"displayEnd":1873.99,"displayMid":1873.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":1.481122,"pitch":32.289219,"speechRate":5.229,"hasEvents":false,"sentence_source":"就内心会。","sentence_en":"It's in the heart."},{"id":"223","start":1873.99,"end":1874.97,"displayStart":1873.99,"displayEnd":1874.97,"displayMid":1874.48,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":1.404069,"pitch":28.521235,"speechRate":8.163,"hasEvents":false,"sentence_source":"有这样的信念嘛 只。","sentence_en":"There's this belief. Only..."},{"id":"224","start":1874.97,"end":1878.69,"displayStart":1874.97,"displayEnd":1878.69,"displayMid":1876.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.6,"loudness":0.82458,"pitch":16.836069,"speechRate":5,"hasEvents":false,"sentence_source":"要我想写，天地万物都是我笔下的，的被写题。","sentence_en":"When I want to write, all of heaven and earth become my subject."},{"id":"225","start":1878.69,"end":1893.87,"displayStart":1878.69,"displayEnd":1893.87,"displayMid":1886.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.5,"loudness":0.88726,"pitch":22.68067,"speechRate":4.371,"hasEvents":false,"sentence_source":"这当然啊，就像猴岛常常那个人家问说你拍电影，你要给人家一句话，他常常写的一句话，就是说电影要从非电影出来，那什么叫做非电影处，其实就是你的生活。","sentence_en":"Of course. Like Hou Hsiao-hsien often says—when people ask about filmmaking, he gives them one sentence: 'Film must come from non-film.' What is non-film? It's your life."},{"id":"226","start":1894.49,"end":1907.79,"displayStart":1894.49,"displayEnd":1907.79,"displayMid":1901.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.6,"loudness":0.832018,"pitch":21.626341,"speechRate":3.769,"hasEvents":false,"sentence_source":"你对人的热情，然后对你活的这个现在，你总是一直在观看它，是从这些地方来，而不是说去上电影的课，在电影里头拍电影。","sentence_en":"Your passion for people, for the present you live in—you're always observing it. It comes from these places, not from taking film classes or making films within films."},{"id":"227","start":1907.79,"end":1918.23,"displayStart":1907.79,"displayEnd":1918.23,"displayMid":1913.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.833636,"pitch":20.017149,"speechRate":5.01,"hasEvents":false,"sentence_source":"这是大侯导讲的最多的话 电影要从非电影出来，这也是说 虽然书桌是这么小的一块，你写的时候面对的就是一张纸 一张笔。","sentence_en":"This is what the great director Hou says most often: 'Film must come from non-film.' It also means that although the desk is just a small space, when you write, you face a piece of paper and a pen."},{"id":"228","start":1918.23,"end":1930.49,"displayStart":1918.23,"displayEnd":1930.49,"displayMid":1924.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.787629,"pitch":22.229223,"speechRate":4.513,"hasEvents":false,"sentence_source":"但是我也会觉得说 文学要从非文学之处来，这个意思的，否则你来源不够 或你不够用功，你的续航力的油不够的话 那是骗不了人的。","sentence_en":"But I also think literature must come from non-literary places. Otherwise, if your source is insufficient or you haven't worked hard enough—if you lack fuel—you can't fool anyone."},{"id":"229","start":1930.49,"end":1945.79,"displayStart":1930.49,"displayEnd":1945.79,"displayMid":1938.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Negative","score":-0.3,"loudness":0.812248,"pitch":21.606169,"speechRate":4.052,"hasEvents":false,"sentence_source":"可能在你下笔的那一刻 你其实是报应就来了，你可能就是一些在文学里组织文字跟文剧而已，电影里头用电影学到的一些方法，再把它排列组合再做。","sentence_en":"The moment you set pen to paper, the reckoning comes. You might just be organizing words and literary devices, or in film, using methods learned from cinema to rearrange and reproduce."},{"id":"230","start":1945.79,"end":1956.59,"displayStart":1945.79,"displayEnd":1956.59,"displayMid":1951.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.811677,"pitch":21.367619,"speechRate":5,"hasEvents":false,"sentence_source 是因为做事业是很难的。","sentence_en":"And now, I’m almost 70. Back then I was under 30. You’re the first to make me cry. You really understand people—because pursuing a career is hard."},{"id":"268","start":2242.28,"end":2257.86,"displayStart":2242.28,"displayEnd":2257.86,"displayMid":2250.07,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":1.001728,"pitch":26.91744,"speechRate":5.118,"hasEvents":false,"sentence_source":"然后你能想象当时两个年轻人大家在一起，并不知道，就是你们当时在明星咖啡馆见面，后来我们大家都不断的在就作为电影爱好者都会像传奇一样去传送的那个两位电影大师第一次见面。","sentence_en":"And you can imagine those two young people together back then, not knowing—you met at the Star Café, and later we film fans kept passing down that legendary first meeting between two great directors."},{"id":"269","start":2257.86,"end":2268.14,"displayStart":2257.86,"displayEnd":2268.14,"displayMid":2263,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.963091,"pitch":26.600462,"speechRate":5.545,"hasEvents":false,"sentence_source":"然后当时年轻的朱天文老师打扮得非常的成熟，要穿上什么西装套装穿着高跟鞋去见年轻的猴岛，就像您说的那样是两个年轻人不知道。","sentence_en":"And back then, the young Zhu Tianwen dressed very maturely, in a suit and high heels to meet the young Monkey Island. Just like you said, two young people who didn’t know."},{"id":"270","start":2268.14,"end":2273.26,"displayStart":2268.14,"displayEnd":2273.26,"displayMid":2270.7,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.7,"loudness":0.982303,"pitch":26.758024,"speechRate":4.819,"hasEvents":false,"sentence_source":"我们会从此踏上一段非常值得的难忘的人生和电影旅程。","sentence_en":"That we would embark on a truly worthwhile and unforgettable life and film journey."},{"id":"271","start":2273.74,"end":2288.38,"displayStart":2273.74,"displayEnd":2288.38,"displayMid":2281.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.904434,"pitch":23.521826,"speechRate":4.144,"hasEvents":false,"sentence_source":"对 这个旅程在我来讲刚好理想过吧，他们要把以前的两本电影书合并重新分类整理，重新再出，而且那四本他就问里头每一本的名字要我取什么。","sentence_en":"Yes, for me this journey has been ideal. They want to merge two previous film books, reclassify and reorganize them, and republish them as four volumes. He asked me to name each one."},{"id":"272","start":2288.38,"end":2299.6,"displayStart":2288.38,"displayEnd":2299.6,"displayMid":2293.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.970395,"pitch":23.562378,"speechRate":4.278,"hasEvents":false,"sentence_source":"其中有一本比较是属于说，整个写那个制作啊 各种，就像钟阿诚写的那个序里头，就涵盖了创作整个电影怎么发生的。","sentence_en":"One of them is more about the whole production process—like in Zhong Acheng’s preface, it covers how a film is created from start to finish."},{"id":"273","start":2299.6,"end":2303.58,"displayStart":2299.6,"displayEnd":2303.58,"displayMid":2301.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.937822,"pitch":23.646639,"speechRate":5.025,"hasEvents":false,"sentence_source":"然后他跑了世界各地碰到的人，就涵盖所有这些。","sentence_en":"And he traveled around the world meeting people, covering all that."},{"id":"274","start":2303.58,"end":2315.84,"displayStart":2303.58,"displayEnd":2315.84,"displayMid":2309.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.837693,"pitch":22.588682,"speechRate":4.344,"hasEvents":false,"sentence_source":"所以到我最后一篇就是，也是来之前把它写的交稿的 叫《孽隐娘》之后，大概没有人可以写这个吧 我也觉得我欠这样一篇文章。","sentence_en":"So my final piece—I finished it just before coming—is about 'The Hidden Swordswoman.' Probably no one else can write this. I felt I owed this article."},{"id":"275","start":2315.84,"end":2324.02,"displayStart":2315.84,"displayEnd":2324.02,"displayMid":2319.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.905567,"pitch":22.669415,"speechRate":4.654,"hasEvents":false,"sentence_source":"这当然是从这是20 我想《孽隐娘》之后到现在也十年了耶，十年了 2015年发片的。","sentence_en":"Of course, it’s been ten years since 'The Hidden Swordswoman'—ten years, released in 2015."},{"id":"276","start":2324.02,"end":2330.36,"displayStart":2324.02,"displayEnd":2330.36,"displayMid":2327.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.899217,"pitch":23.919731,"speechRate":5.728,"hasEvents":false,"sentence_source":"所以大家都在问这十年你们在干什么，我就觉得我好像有责任要把这个戏的说一遍。","sentence_en":"So everyone’s asking what we’ve been doing these ten years. I feel it’s my responsibility to tell the story of this play."},{"id":"277","start":2330.36,"end":2339.2,"displayStart":2330.36,"displayEnd":2339.2,"displayMid":2334.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.798968,"pitch":23.239756,"speechRate":4.301,"hasEvents":false,"sentence_source":"因为猴岛的家人已经是在2023年，是做了一次发布，就是猴岛已经退休了，从此回归家庭。","sentence_en":"Because Monkey Island’s family made an announcement in 2023: Monkey Island has retired and will focus on family from now on."},{"id":"278","start":2339.2,"end":2342.14,"displayStart":2339.2,"displayEnd":2342.14,"displayMid":2340.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.84978,"pitch":24.801533,"speechRate":5.948,"hasEvents":false,"sentence_source":"那到底是中间发生了什么是会些细节。","sentence_en":"So what happened in between? Some details."},{"id":"279","start":2342.14,"end":2345.36,"displayStart":2342.14,"displayEnd":2345.36,"displayMid":2343.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.821508,"pitch":20.672316,"speechRate":4.969,"hasEvents":false,"sentence_source":"所以我在来之前，我就把这篇写出来了。","sentence_en":"So before coming, I wrote this piece."},{"id":"280","start":2345.36,"end":2359,"displayStart":2345.36,"displayEnd":2359,"displayMid":2352.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.788518,"pitch":22.557211,"speechRate":4.399,"hasEvents":false,"sentence_source":"那是印着，台湾我们有个叫做那个电影图书馆，现在叫影视听中心，他们大明年想要出一本猴岛的专书，就是广邀那个国内外的人来写这样一本书。","sentence_en":"It will be printed. In Taiwan we have the Film Library, now called the Taiwan Film and Audiovisual Institute. Next year they want to publish a monograph on Monkey Island, inviting writers from home and abroad to contribute."},{"id":"281","start":2359,"end":2373.42,"displayStart":2359,"displayEnd":2373.42,"displayMid":2366.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.762778,"pitch":20.862011,"speechRate":3.811,"hasEvents":false,"sentence_source":"我也答应写 刚好就收在这次理想国要出的它分成四册，四册里头的这一册 我就还要我取个名字，我就取说《我与电影的奇遇与冒险》。","sentence_en":"I agreed to write, and it just fits into the four-volume set that Lixiangguo is publishing. For this volume, I had to name it, so I called it 'My Encounters and Adventures with Cinema."},{"id":"282","start":2373.42,"end":2375.84,"displayStart":2373.42,"displayEnd":2375.84,"displayMid":2374.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":0.812574,"pitch":19.56889,"speechRate":3.727,"hasEvents":false,"sentence_source":"真的是奇遇 40年了。","sentence_en":"It's truly a serendipitous encounter, 40 years on."},{"id":"283","start":2375.84,"end":2390.64,"displayStart":2375.84,"displayEnd":2390.64,"displayMid":2383.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.82172,"pitch":19.764042,"speechRate":3.595,"hasEvents":false,"sentence_source":"然后到最后写到念义梁之后，好像就是一个奇遇和冒险旅程的结束了，这结束我觉得在此之前，其余和冒险是猴岛的，在此之后。","sentence_en":"Then after writing about Nian Yiliang, it felt like the end of a serendipitous adventure. Before that, the rest and adventure belonged to Monkey Island; after that."},{"id":"284","start":2390.64,"end":2403.92,"displayStart":2390.64,"displayEnd":2403.92,"displayMid":2397.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.855597,"pitch":22.473089,"speechRate":3.991,"hasEvents":false,"sentence_source":"尤其我们大概要把猴岛没有完成的，一直进行的都紧都看了，演员什么都订的，他的援助是叫《苏兰河上》，整个拍台北市的河流渠道。","sentence_en":"Especially we want to look closely at what Monkey Island didn't finish, what was ongoing, with actors all booked. Its original title was 'On the Su-Lan River', filming Taipei's river channels."},{"id":"285","start":2403.92,"end":2414.34,"displayStart":2403.92,"displayEnd":2414.34,"displayMid":2409.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Negative","score":-0.4,"loudness":0.838496,"pitch":23.548019,"speechRate":3.839,"hasEvents":false,"sentence_source":"当然现在全部埋在马路底下跟大楼底下，孤独的寂寞的河神，也没有人知道，有些河已经变成马路。","sentence_en":"Of course now they're all buried under roads and buildings, lonely and solitary river gods, unknown to anyone. Some rivers have become roads."},{"id":"286","start":2414.34,"end":2427.44,"displayStart":2414.34,"displayEnd":2427.44,"displayMid":2420.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.814441,"pitch":21.789387,"speechRate":3.206,"hasEvents":false,"sentence_source":"那些水塘也完全无人所知，一直到一个非常愚蜘吧，又愚笨又执念那个没完的找和人，他去找这些和道。","sentence_en":"Those ponds are also completely unknown, until a very foolish—both stupid and obsessive—unending searcher goes looking for these waterways."},{"id":"287","start":2427.44,"end":2442.9,"displayStart":2427.44,"displayEnd":2442.9,"displayMid":2435.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":0.815127,"pitch":20.704901,"speechRate":4.851,"hasEvents":false,"sentence_source":"而且去踏查 一步步地去看的，他不是靠资料 靠Google 不是，他就是每天这样走上15公里去踏查，把这个河流原来是路路也没了，老的路的路民也没了，把他找出来 把他写成书。","sentence_en":"And he went on foot, step by step to see. He didn't rely on data or Google; he just walked 15 kilometers a day to survey, finding the rivers where roads were gone, old road residents gone, and wrote them into a book."},{"id":"288","start":2442.9,"end":2444.94,"displayStart":2442.9,"displayEnd":2444.94,"displayMid":2443.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.614483,"pitch":16.985104,"speechRate":3.922,"hasEvents":false,"sentence_source":"所以河神就出现了。","sentence_en":"So the river god appeared."},{"id":"289","start":2444.94,"end":2451.86,"d pletion work involves all the old crew of Monkey Island; I'm used to calling them comrades."},{"id":"293","start":2473.12,"end":2485.88,"displayStart":2473.12,"displayEnd":2485.88,"displayMid":2479.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Neutral","score":0,"loudness":0.847263,"pitch":19.661547,"speechRate":4.496,"hasEvents":false,"sentence_source":"我觉得更好的一个词是有一个记者，他就那时候看了我们的记录片，他就说是他更喜欢铜袍，就鱼子铜袍，铜袍比较没有这么写心跟杀戮。","sentence_en":"I think a better word came from a journalist who saw our documentary and said he preferred 'tongpao' (comrades-in-arms), like fish-roe tongpao, because tongpao implies less heartache and killing."},{"id":"294","start":2485.88,"end":2492.46,"displayStart":2485.88,"displayEnd":2492.46,"displayMid":2489.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.6,"loudness":0.824241,"pitch":22.474228,"speechRate":3.951,"hasEvents":false,"sentence_source":"他就说铜袍好像是导演老了没关系，以前你是怎么支撑着我们。","sentence_en":"He said tongpao seems like 'director, it's okay you're old. How did you support us before?"},{"id":"295","start":2493.1,"end":2498.94,"displayStart":2493.1,"displayEnd":2498.94,"displayMid":2496.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","score":0.7,"loudness":0.854085,"pitch":21.462914,"speechRate":4.11,"hasEvents":false,"sentence_source":"我们现在就同样的支撑着你，一起看还能拍多少就往前拍。","sentence_en":"Now we will support you the same way, let's see how much more we can shoot and just move forward."},{"id":"296","start":2498.94,"end":2510.74,"displayStart":2498.94,"displayEnd":2510.74,"displayMid":2504.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Film Creation and Literary Writing","sentiment_en":"Positive","s ence_en":"Freedom is especially precious for young boys and girls."},{"id":"533","start":4607.58,"end":4617.6,"displayStart":4607.58,"displayEnd":4617.6,"displayMid":4612.59,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.866801,"pitch":24.538908,"speechRate":6.338,"hasEvents":false,"sentence_source":"所以对您来说您成长过程当中所有的，如果希望能够拥有人生什么 自由是排在最低位的吗，我可以自由地创作 自由地生活 自由地做 我想做的一切。","sentence_en":"So for you, in your growth process, if you could have anything in life, is freedom the lowest priority? I can create freely, live freely, do everything I want."},{"id":"534","start":4617.6,"end":4619.16,"displayStart":4617.6,"displayEnd":4619.16,"displayMid":4618.38,"speaker":"Zhu Tianwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.788454,"pitch":25.301279,"speechRate":7.004,"hasEvents":false,"sentence_source":"那时也没想到排第一。","sentence_en":"At that time, I didn't even think it was the top priority."},{"id":"535","start":4619.16,"end":4622.52,"displayStart":4619.16,"displayEnd":4622.52,"displayMid":4620.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Neutral","score":0,"loudness":0.939014,"pitch":23.958258,"speechRate":4.167,"hasEvents":false,"sentence_source":"甚至我都不大有觉得 是不是自由。","sentence_en":"I didn't even really feel whether it was freedom."},{"id":"536","start":4622.52,"end":4625.04,"displayStart":4622.52,"displayEnd":4625.04,"displayMid":4623.780000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Writing Concepts and Film Expression","sentiment_en":"Positive","score":0.5,"loudness":0.927065,"pitch":26.977423,"speechRate":6.349,"hasEvents":false,"sentence_source":"因为家里就是这个样子 就完全开放了。","sentence_en":
