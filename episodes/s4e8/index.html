 that you do have choices, though each choice comes with a price you have to pay. It's about having the strength to face that when you make a choice, you do have to bear certain costs."},{"id":"287","start":1929.95,"end":1931.29,"displayStart":1929.95,"displayEnd":1931.29,"displayMid":1930.62,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.5,"loudness":0.81003,"pitch":15.419851,"speechRate":6.299,"hasEvents":false,"sentence_source":"这是我心甘情愿的。","sentence_en":"That's what I willingly accept."},{"id":"288","start":1931.29,"end":1935.33,"displayStart":1931.29,"displayEnd":1935.33,"displayMid":1933.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.6,"loudness":0.953685,"pitch":23.20783,"speechRate":6.077,"hasEvents":false,"sentence_source":"所以你开始创业那整个过程，你都带这样一种兴奋的。","sentence_en":"So throughout the whole process of starting your business, you carried that kind of excitement?"},{"id":"289","start":1935.33,"end":1945.03,"displayStart":1935.33,"displayEnd":1945.03,"displayMid":1940.1799999999998,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.6,"loudness":0.872557,"pitch":20.261488,"speechRate":5.202,"hasEvents":false,"sentence_source":"对 我就创业了头几年，就是兴奋感 淹没了一切，就是当日常里面我都很多很烦躁，很讨厌 这个不会遇到一些挫败什么的。","sentence_en":"Yes, in the first few years of entrepreneurship, excitement overwhelmed everything. Even though daily life had plenty of frustrations and annoyances, and I encountered setbacks, overall I was extremely excited."},{"id":"290","start":1945.03,"end":1947.37,"displayStart":1945.03,"displayEnd":1947.37,"displayMid":1946.1999999999998,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.7,"loudness":0.915607,"pitch":26.117804,"speechRate":4.773,"hasEvents":false,"sentence_source":"但是整体是特别兴奋的。","sentence_en":"But overall, I was especially excited."},{"id":"291","start":1947.37,"end":1956.97,"displayStart":1947.37,"displayEnd":1956.97,"displayMid":1952.17,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.898622,"pitch":25.578222,"speechRate":6.563,"hasEvents":false,"sentence_source":"所以在头几年里面，总有人问说你创业 你怎么平衡你的生活，我没有生活 我的生活全是工作，我就没有什么大事的时候，我都能三天四天不出办公室。","sentence_en":"So in those early years, people often asked, 'How do you balance your life with entrepreneurship?' I had no life—my life was all work. When there weren't major events, I could stay in the office for three or four days without leaving."},{"id":"292","start":1956.97,"end":1962.33,"displayStart":1956.97,"displayEnd":1962.33,"displayMid":1959.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.967068,"pitch":29.67771,"speechRate":6.39,"hasEvents":false,"sentence_source":"其实我觉得有时候我们也可能太高估，一定要将生活跟工作完全的分开。","sentence_en":"Actually, I think sometimes we overestimate the need to completely separate life and work."},{"id":"293","start":1962.33,"end":1963.43,"displayStart":1962.33,"displayEnd":1963.43,"displayMid":1962.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":1.022713,"pitch":26.831142,"speechRate":6.452,"hasEvents":false,"sentence_source":"对，其实没必要。","sentence_en":"Yes, it's not really necessary."},{"id":"294","start":1963.43,"end":1968.43,"displayStart":1963.43,"displayEnd":1968.43,"displayMid":1965.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.896806,"pitch":22.019123,"speechRate":6.4,"hasEvents":false,"sentence_source":"我觉得生活是有很多种形态的，可能在某一个阶段工作本身就是一种生活对。","sentence_en":"I think life has many forms. Maybe at a certain stage, work itself is a kind of life."},{"id":"295","start":1968.43,"end":1974.71,"displayStart":1968.43,"displayEnd":1974.71,"displayMid":1971.5700000000002,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.811967,"pitch":19.019926,"speechRate":5.255,"hasEvents":false,"sentence_source":"我觉得至少在我创业的头几年里面，就一定是这个状况，我的所有世界就是工作。","sentence_en":"I think at least for the first few years of my startup, it was definitely like that—my whole world was just work."},{"id":"296","start":1974.71,"end":1977.61,"displayStart":1974.71,"displayEnd":1977.61,"displayMid":1976.1599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":1.046287,"pitch":19.865559,"speechRate":7.073,"hasEvents":false,"sentence_source":"这样状态持续了就最开始的那几年的时间。","sentence_en":"That state lasted for the first few years."},{"id":"297","start":1977.61,"end":1980.87,"displayStart":1977.61,"displayEnd":1980.87,"displayMid":1979.2399999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.989517,"pitch":23.293619,"speechRate":3.374,"hasEvents":false,"sentence_source":"对，我觉得大概直到去年吧。","sentence_en":"Yeah, I think probably until last year."},{"id":"298","start":1982.91,"end":1985.29,"displayStart":1982.91,"displayEnd":1985.29,"displayMid":1984.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":1.242019,"pitch":31.139816,"speechRate":6.303,"hasEvents":true,"sentence_source":"你这个时间划分总是让我出乎意料。","sentence_en":"Your division of time always surprises me."},{"id":"299","start":1986.73,"end":1990.85,"displayStart":1986.73,"displayEnd":1990.85,"displayMid":1988.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.91588,"pitch":27.046349,"speechRate":7.25,"hasEvents":true,"sentence_source":"但你有一点就是算是某种便利，就是你的先生跟你一起算是一起创业。","sentence_en":"But you had a certain convenience: your husband started a business with you."},{"id":"300","start":1990.85,"end":1995.77,"displayStart":1990.85,"displayEnd":1995.77,"displayMid":1993.31,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.905762,"pitch":22.683702,"speechRate":4.797,"hasEvents":false,"sentence_source":"对对，随随你们恋爱婚姻和你们创业大家是同一个时期。","sentence_en":"Right, so your dating, marriage, and starting a business all happened around the same time."},{"id":"301","start":1995.77,"end":2003.23,"displayStart":1995.77,"displayEnd":2003.23,"displayMid":1999.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.79418,"pitch":18.768734,"speechRate":5.205,"hasEvents":false,"sentence_source":"所以其实你还是有你的生活 有你的工作，他们某种程度是有很大一部分程度相交在一起的。","sentence_en":"So actually you still had your life and your work, and they overlapped to a large extent."},{"id":"302","start":2003.23,"end":2005.55,"displayStart":2003.23,"displayEnd":2005.55,"displayMid":2004.3899999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.964211,"pitch":20.742571,"speechRate":7.179,"hasEvents":false,"sentence_source":"可以这么说 但我们恋爱是更早的。","sentence_en":"You could say that, but we started dating earlier."},{"id":"303","start":2005.55,"end":2007.79,"displayStart":2005.55,"displayEnd":2007.79,"displayMid":2006.67,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":1.098209,"pitch":25.26198,"speechRate":5.571,"hasEvents":false,"sentence_source":"我们是11年在一起的。","sentence_en":"We got together in 2011."},{"id":"304","start":2007.79,"end":2009.33,"displayStart":2007.79,"displayEnd":2009.33,"displayMid":2008.56,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.786073,"pitch":19.042732,"speechRate":7.042,"hasEvents":false,"sentence_source":"然后我是14年创业的。","sentence_en":"Then I started my business in 2014."},{"id":"305","start":2009.33,"end":2020.07,"displayStart":2009.33,"displayEnd":2020.07,"displayMid":2014.6999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.6,"loudness":0.851011,"pitch":19.915476,"speechRate":5.123,"hasEvents":false,"sentence_source":"虽然志同道合是如此重要，就彼此对人生的基本选择，包括我们所谓三观 包括审美，大家一起是非常非常重要，就当你说我要创业。","sentence_en":"Although having similar values is so important—agreeing on life choices, worldviews, even aesthetics—it's crucial when you say you want to start a business, the other person won't say it's too unreliable."},{"id":"306","start":2020.07,"end":2021.71,"displayStart":2020.07,"displayEnd":2021.71,"displayMid":2020.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.883976,"pitch":16.279049,"speechRate":6.098,"hasEvents":false,"sentence_source":"那人不会说太不靠谱了。","sentence_en":"I think this might be a matter of luck. If my then-boyfriend (now husband) had said starting a business is too unreliable, I probably wouldn't have chosen him."},{"id":"307","start":2021.71,"end":2030.73,"displayStart":2021.71,"displayEnd":2030.73,"displayMid":2026.22,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.5,"loudness":0.918057,"pitch":25.109219,"speechRate":6.651,"hasEvents":false,"sentence_source":"当然我觉得这个可能是个，机生戴我单身机的问题，如果我觉得我先生那时候的男朋友，如果他是说你创业太不靠谱，我应该不会选他。","sentence_en":"Of course, my husband was the only one in my life at that time who made me feel like a normal person. He believed a woman should strive to realize herself. He was almost my only and most important supporter."},{"id":"308","start":2032.15,"end":2047.91,"displayStart":2032.15,"displayEnd":2047.91,"displayMid":2040.0300000000002,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.878918,"pitch":20.541885,"speechRate":4.994,"hasEvents":false,"sentence_source":"当然我就有先生，在那个时候是我生活中唯一一个，让我觉得我是个正常人的，只有他 他就觉得一个女生你就是应该努力的实现自我的，他是那时候我生活中几乎唯一一个最重要的支持者。","sentence_en":"I think you're right. If he weren't that kind of person, you wouldn't have been with him."},{"id":"309","start":2047.91,"end":2053.57,"displayStart":2047.91,"displayEnd":2053.57,"displayMid":2050.7400000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.936071,"pitch":27.780573,"speechRate":7.422,"hasEvents":false,"sentence_source":"我觉得你说的对 就机身大单身机是，如果他不是这样的一个人的话 你阿哥不会跟他在一起。","sentence_en":"Right, because I remember when I was a university teacher—that was interesting."},{"id":"310","start":2053.57,"end":2057.77,"displayStart":2053.57,"displayEnd":2057.77,"displayMid":2055.67,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.967625,"pitch":20.606995,"speechRate":5.426,"hasEvents":false,"sentence_source":"对 因为我记得在大学做老师的时候 就这很有意思。","sentence_en":"Because after I started my business, since you're a so-called female entrepreneur."},{"id":"311","start":2057.77,"end":2061.37,"displayStart":2057.77,"displayEnd":2061.37,"displayMid":2059.5699999999997,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.758437,"pitch":17.967533,"speechRate":5,"hasEvents":false,"sentence_source":"因为我创业之后 因为你是所谓女创业者嘛。","sentence_en":"So people often ask me if I've experienced gender discrimination in the process. My real experience is that after starting my business, I never felt like I was a woman or being treated as a woman."},{"id":"312","start":2061.37,"end":2073.81,"displayStart":2061.37,"displayEnd":2073.81,"displayMid":2067.59,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Positive","score":0.5,"loudness":0.792188,"pitch":20.275225,"speechRate":5.604,"hasEvents":false,"sentence_source":"然后所以总是有人来问我说 你在这过程中有没有感受到性别歧视啊等等，我自己真实的体验是我从创业之后，我就没有觉得我是个女性或被当作一个女性来看待。","sentence_en":"Because most of the time, it's about work performance or collaboration—nobody cares about my gender. On the contrary, when I was a university teacher, that was when I felt the most gender discrimination."},{"id":"313","start":2073.81,"end":2086.89,"displayStart":2073.81,"displayEnd":2086.89,"displayMid":2080.35,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.5,"loudness":0.828587,"pitch":18.93815,"speechRate":5.807,"hasEvents":false,"sentence_source":"因为大多数时候你就是看工作成绩的，或者我们的合作呢，就是看这个合作的时候就没有人在意我的性别，反而是我在大学做老师的那段时间，是我觉得遭受性别歧视最严重的时候。","sentence_en":"When I was a university teacher, many people tried to set me up."},{"id":"314","start":2087.39,"end":2090.27,"displayStart":2087.39,"displayEnd":2090.27,"displayMid":2088.83,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":1.048333,"pitch":21.266035,"speechRate":7.792,"hasEvents":false,"sentence_source":"我在大学做老师的时候就特别多人给我介绍对象。","sentence_en":"And the reason was that I was a female university teacher."},{"id":"315","start":2090.27,"end":2093.89,"displayStart":2090.27,"displayEnd":2093.89,"displayMid":2092.08,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":1.157243,"pitch":24.805233,"speechRate":5.778,"hasEvents":false,"sentence_source":"然后介绍对象的原因就是你是大学女老师。","sentence_en":"That's particularly popular, right?"},{"id":"316","start":2093.89,"end":2095.41,"displayStart":2093.89,"displayEnd":2095.41,"displayMid":2094.6499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.621111,"pitch":20.870075,"speechRate":7.246,"hasEvents":false,"sentence_source":"这是格外受欢迎的 是吧。","sentence_en":"Right, I think there's a lot of gender implication behind it—because your job isn't busy, you can take care of children."},{"id":"317","start":2095.41,"end":2102.33,"displayStart":2095.41,"displayEnd":2102.33,"displayMid":2098.87,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.4,"loudness":0.954076,"pitch":20.281685,"speechRate":4.702,"hasEvents":false,"sentence_source":"对 我觉得这背后就有很多性别上的意味，在因为你的工作不忙，可以照顾孩子。","sentence_en":"And your child might have better educational resources, plus your Beijing residency is settled. Every day someone would try to set me up."},{"id":"318","start":2102.91,"end":2110.95,"displayStart":2102.91,"displayEnd":2110.95,"displayMid":2106.93,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.945844,"pitch":19.655937,"speechRate":5.473,"hasEvents":false,"sentence_source":"然后你的小孩也许以后教育资源还会比较好，加之你的北京户口肯定解决了，每天都有人来跟我介绍对象。","sentence_en":"And they'd usually bluntly say that the other family just wants to find a female university teacher."},{"id":"319","start":2110.95,"end":2117.09,"displayStart":2110.95,"displayEnd":2117.09,"displayMid":2114.02,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.5,"loudness":0.782492,"pitch":21.400568,"speechRate":5.049,"hasEvents":false,"sentence_source":"然后一般里面大概不加掩饰的会说，说对方家庭就是想找一个大选举老师。","sentence_en":"So I think that period was when I felt the most gender-discriminated."},{"id":"320","start":2117.09,"end":2121.95,"displayStart":2117.09,"displayEnd":2121.95,"displayMid":2119.52,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.6,"loudness":0.899183,"pitch":20.610765,"speechRate":5.843,"hasEvents":false,"sentence_source":"所以我觉得那一段时间是我，觉得我被性别启示最严重的时候。","sentence_en":"Because that wasn't me. On the contrary, after starting my business, I never had gender issues again."},{"id":"321","start":2121.95,"end":2128.65,"displayStart":2121.95,"displayEnd":2128.65,"displayMid":2125.3,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Positive","score":0.7,"loudness":0.810366,"pitch":16.734232,"speechRate":3.956,"hasEvents":false,"sentence_source":"因为这不是我 反而在创业之后 我再也没有性别上的困扰了。","sentence_en":"Entrepreneurship makes you demand a higher level of socialization in a short time."},{"id":"322","start":2128.65,"end":2132.97,"displayStart":2128.65,"displayEnd":2132.97,"displayMid":2130.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.945938,"pitch":24.314337,"speechRate":5.825,"hasEvents":false,"sentence_source":"创业会使你要求自己在短时间之内 社会化程度更高一点。","sentence_en":"Because if you're just a university teacher, dressing appropriately is enough; people don't require you to do much socializing. But entrepreneurship is different."},{"id":"323","start":2132.97,"end":2141.25,"displayStart":2132.97,"displayEnd":2141.25,"displayMid":2137.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":1.06344,"pitch":21.841913,"speechRate":5.382,"hasEvents":false,"sentence_source":"因为如果你只个大学老师的话 你就是着装 基本得体就可以了，大家不需要你去做很多的社交 但创业不同。","sentence_en":"It's different. I can share something not about appearance but about language. I remember in the early days of starting my business."},{"id":"324","start":2141.25,"end":2151.03,"displayStart":2141.25,"displayEnd":2151.03,"displayMid":2146.1400000000003,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.861033,"pitch":20.530432,"speechRate":4.294,"hasEvents":false,"sentence_source":"业不一样 我可以分享一个可能不是这种外在的，但我觉得语言上的 我记得在刚开始创业的一段时间。","sentence_en":"I realized my language was too word ate":5.831,"hasEvents":false,"sentence_source":"这个事你搞不定我搞得定 这个治疗一定是失败的，就是这个来访者有可能他会短期的觉得，我获得一些意见我好了，但这一定是假性的好。","sentence_en":"If I say 'You can't handle this, but I can,' the therapy is bound to fail. The client might briefly feel better from getting advice, but it's a false improvement."},{"id":"352","start":2352.95,"end":2360.21,"displayStart":2352.95,"displayEnd":2360.21,"displayMid":2356.58,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.5,"loudness":0.843863,"pitch":19.748232,"speechRate":5.42,"hasEvents":false,"sentence_source":"因为来访者最终获得的体验是，我不醒我要依靠一个更有力量的人，最最终就会变成个POA。","sentence_en":"Because the client's takeaway becomes, 'I can't fix myself; I need someone stronger,' which eventually leads to a pattern of dependence."},{"id":"353","start":2360.21,"end":2364.45,"displayStart":2360.21,"displayEnd":2364.45,"displayMid":2362.33,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.826123,"pitch":16.685102,"speechRate":4.39,"hasEvents":false,"sentence_source":"所以咨询其实是特别避免这样情况的发生。","sentence_en":"So counseling specifically tries to avoid that."},{"id":"354","start":2364.97,"end":2374.03,"displayStart":2364.97,"displayEnd":2374.03,"displayMid":2369.5,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.834883,"pitch":22.354073,"speechRate":4.528,"hasEvents":false,"sentence_source":"所以咨询师在某种角度上，我可能是一个比你更有经验的病人，花了更多的时间在理解我自己上面。","sentence_en":"So as a counselor, in a way, I might be a more experienced patient than you, having spent more time understanding myself."},{"id":"355","start":2374.03,"end":2379.79,"displayStart":2374.03,"displayEnd":2379.79,"displayMid":2376.91,"speaker":"Jian Lili","speakerColor":"#A29479","cluste ence_source":"然后那个时候我就突然有一个意识，他们生育的时候我在干嘛，我看不见听不见，就是这件事情就是他们在经历人生，特别这么重要的时段的时候，他根本无法进到我的眼睛里面。","sentence_en":"And then it suddenly hit me: when they were having their children, what was I doing? I was oblivious—I didn't see or hear it. They were going through such an important phase of life, and it never even entered my awareness."},{"id":"391","start":2639.71,"end":2646.07,"displayStart":2639.71,"displayEnd":2646.07,"displayMid":2642.8900000000003,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.7,"loudness":0.912093,"pitch":18.687466,"speechRate":4.306,"hasEvents":false,"sentence_source":"然后生育了之后对于我的改变就还挺大的，我就发现好喜欢小孩。","sentence_en":"After having my own child, the change was pretty big—I discovered I really love kids."},{"id":"392","start":2646.61,"end":2651.73,"displayStart":2646.61,"displayEnd":2651.73,"displayMid":2649.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.989981,"pitch":19.9981,"speechRate":5.92,"hasEvents":false,"sentence_source":"那是一个需要做决定的事情吧，就当你是想我差不多要一个孩子吧。","sentence_en":"That's something you have to decide, right? Like, 'I think it's time to have a child."},{"id":"393","start":2651.73,"end":2654.15,"displayStart":2651.73,"displayEnd":2654.15,"displayMid":2652.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.740793,"pitch":13.033565,"speechRate":5.176,"hasEvents":false,"sentence_source":"是的，是一个需要做决定的。","sentence_en":"Yes, it's a decision that needs to be made."},{"id":"394","start":2654.15,"end":2669.13,"displayStart":2654.15,"displayEnd":2669.13,"displayMid":2661.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudnes :"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":1.009941,"pitch":25.486609,"speechRate":5.313,"hasEvents":false,"sentence_source":"我觉得这个事情是到几个月之后。","sentence_en":"I think that lasted for a few months."},{"id":"415","start":2792.81,"end":2794.03,"displayStart":2792.81,"displayEnd":2794.03,"displayMid":2793.42,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.886247,"pitch":23.44738,"speechRate":6.557,"hasEvents":false,"sentence_source":"我觉得他半岁之后。","sentence_en":"After the baby turned six months old."},{"id":"416","start":2794.03,"end":2795.89,"displayStart":2794.03,"displayEnd":2795.89,"displayMid":2794.96,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.5,"loudness":0.850894,"pitch":17.238569,"speechRate":4.301,"hasEvents":false,"sentence_source":"我觉得就要认怂了。","sentence_en":"I think I had to give up."},{"id":"417","start":2796.61,"end":2801.71,"displayStart":2796.61,"displayEnd":2801.71,"displayMid":2799.16,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.4,"loudness":0.78567,"pitch":19.240919,"speechRate":5.098,"hasEvents":false,"sentence_source":"所以最近一段时间我就觉得，我只能选择非常有限的事情来做。","sentence_en":"So recently I've felt that I can only choose to do a very limited number of things."},{"id":"418","start":2801.71,"end":2813.43,"displayStart":2801.71,"displayEnd":2813.43,"displayMid":2807.5699999999997,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.6,"loudness":0.776677,"pitch":16.65126,"speechRate":5.104,"hasEvents":false,"sentence_source":"我觉得以前我是不允许我在任何实行上表现得不靠谱的，现在我就不得不，我记得就上周前两周有一些时刻我就觉得，我没发靠谱了你就算了。","sentence_en":"I used to never allow myself to be unreliable in anything. Now I have to. I remember a moment in the past week or two when I thought, 'I can't be reliable. So be it."},{"id":"419","start":2813.43,"end":2817.49,"displayStart":2813.43,"displayEnd":2817.49,"displayMid":2815.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.801714,"pitch":19.789452,"speechRate":6.685,"hasEvents":false,"sentence_source":"为什么不可以是爸爸说，这种时候我没办法永远都靠谱了。","sentence_en":"Why can't it be the dad saying, 'I can't always be reliable at times like this?"},{"id":"420","start":2817.49,"end":2820.89,"displayStart":2817.49,"displayEnd":2820.89,"displayMid":2819.1899999999996,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":1.230926,"pitch":23.508472,"speechRate":5.643,"hasEvents":true,"sentence_source":"对 我这也很想提问广大的男性听众为什么。","sentence_en":"Yes, I really want to ask the male listeners out there: why?"},{"id":"421","start":2822.29,"end":2837.89,"displayStart":2822.29,"displayEnd":2837.89,"displayMid":2830.09,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.3,"loudness":0.897343,"pitch":19.241741,"speechRate":3.782,"hasEvents":true,"sentence_source":"对 但好像我现在经验上来看 包括自己身边的朋友们，好像男性在这个阶段能够像女性一样 把更多的精力放在养育这件事，像就是特别的为少。","sentence_en":"But from my experience and that of my friends, men rarely devote as much energy to parenting as women do at this stage."},{"id":"422","start":2837.89,"end":2849.03,"displayStart":2837.89,"displayEnd":2849.03,"displayMid":2843.46,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.5,"loudness":0.96393,"pitch":19.200592,"speechRate":4.986,"hasEvents":false,"sentence_source":"我觉得跟社会的规范要求男性，就是你要有成就等等 不允许男性去在家看孩子，觉得男性好像是一个失败者等等 我觉得有很大关系。","sentence_en":"I think it has a lot to do with social norms that require men to achieve and not stay home with kids, making them feel like failures if they do."},{"id":"423","start":2849.03,"end":2853.55,"displayStart":2849.03,"displayEnd":2853.55,"displayMid":2851.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.825547,"pitch":20.727287,"speechRate":4.796,"hasEvents":false,"sentence_source":"有很多包括我们社会的文化 传统习惯 包括审美。","sentence_en":"There are many factors, including our social culture, traditional customs, and even aesthetics."},{"id":"424","start":2853.55,"end":2864.41,"displayStart":2853.55,"displayEnd":2864.41,"displayMid":2858.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":-0.1,"loudness":1.029768,"pitch":23.781002,"speechRate":5.826,"hasEvents":false,"sentence_source":"然后整个社会的支持体系 即便我没有孩子，但我总觉得好像如果我有孩子，我可能都不放心把小孩交给那个人，我不知道是不是妈妈都会有这样的。","sentence_en":"And the whole social support system—even though I don't have kids, I always feel like if I did, I might not trust that person to take care of them. I wonder if all moms feel this way."},{"id":"425","start":2864.41,"end":2876.45,"displayStart":2864.41,"displayEnd":2876.45,"displayMid":2870.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.6,"loudness":0.874803,"pitch":20.959324,"speechRate":5.618,"hasEvents":false,"sentence_source":"感觉总觉得小孩只有我照顾才会特别的妥贴周到和安全，可能就所有的这一切，总之把一个本来两个人共同完成的生育的过程，最后绝大部分任务都交给了女性。","sentence_en":"I feel like only I can take care of the child in the most thorough and safe way. So all of this ends up putting most of the tasks of childbirth and parenting, which should be shared, on women."},{"id":"426","start":2876.45,"end":2880.99,"displayStart":2876.45,"displayEnd":2880.99,"displayMid":2878.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.4,"loudness":0.921159,"pitch":24.775648,"speechRate":6.15,"hasEvents":false,"sentence_source":"然后男性不能说神隐，但总会觉得女性会更面临这样一个困境 对。","sentence_en":"And men can't exactly disappear, but women definitely face this dilemma more. Yeah."},{"id":"427","start":2881.49,"end":2889.45,"displayStart":2881.49,"displayEnd":2889.45,"displayMid":2885.47,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.3,"loudness":0.994296,"pitch":19.254055,"speechRate":6.183,"hasEvents":false,"sentence_source":"因为前一段有见有一个我一个朋友，他也是爸爸他小孩一岁半了，我记得问他什么感受，他说我感觉我就是个打酱油的。","sentence_en":"Not long ago I met a friend who is also a dad. His kid is one and a half. I asked him how he felt, and he said, 'I feel like I'm just an extra."},{"id":"428","start":2890.01,"end":2905.67,"displayStart":2890.01,"displayEnd":2905.67,"displayMid":2897.84,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.889036,"pitch":17.185421,"speechRate":4.598,"hasEvents":false,"sentence_source":"我觉得确实有这个问题就是，我也需要男性来向我证明，我把孩子给他是放心的，但我这个脑袋想出一些时刻，比如说就吐槽我先生，他其实在很多层面上做的其实已经很好了。","sentence_en":"I think there is indeed this issue: I also need men to prove to me that I can trust them with my child. But my mind comes up with moments, like complaining about my husband—he actually does very well in many aspects."},{"id":"429","start":2905.67,"end":2912.01,"displayStart":2905.67,"displayEnd":2912.01,"displayMid":2908.84,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"F 9","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.3,"loudness":0.8122,"pitch":18.294317,"speechRate":4.678,"hasEvents":false,"sentence_source":"但是我要强迫自己给，是要好得多的，我记得我在有一年学习心理治疗的时候。","sentence_en":"but forcing myself to give anyway. That was much better. I remember when I was studying psychotherapy one year,"},{"id":"476","start":3214.13,"end":3227.09,"displayStart":3214.13,"displayEnd":3227.09,"displayMid":3220.61,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.808066,"pitch":22.002821,"speechRate":3.935,"hasEvents":false,"sentence_source":"我们有一个课程是，大概是80年代英国，他们有拍一个累碎社会性实验，就是他们跟着一个小孩从他出生开始一直到三岁。","sentence_en":"there was a course about a social experiment from the 1980s in the UK. They followed a child from birth to age three."},{"id":"477","start":3227.09,"end":3235.47,"displayStart":3227.09,"displayEnd":3235.47,"displayMid":3231.2799999999997,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.877095,"pitch":19.638418,"speechRate":5.609,"hasEvents":false,"sentence_source":"大概每周会去他们家拍半个小时，就这个小孩和妈妈之间的互动，他们就追踪到成年之后这个孩子会长得怎么样。","sentence_en":"About once a week they would film half an hour of interactions between the child and their mother. Then they tracked how the child turned out as an adult."},{"id":"478","start":3235.47,"end":3243.51,"displayStart":3235.47,"displayEnd":3243.51,"displayMid":3239.49,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.6,"loudness":0.848172,"pitch":21.152683,"speechRate":5.224,"hasEvents":false,"sentence_source":"然后我记得我们在看那个视频的时候其实特别痛苦，他的婚应该是在这个小孩一岁的时候就离异了。","sentence_en":"I remember watching that video and feeling really painful. The mother got divorced when the child was around one year old."},{"id":"479","start":3243.51,"end":3249.43,"displayStart":3243.51,"displayEnd":3249.43,"displayMid":3246.4700000000003,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.7,"loudness":0.884359,"pitch":22.139866,"speechRate":6.421,"hasEvents":false,"sentence_source":"所以他在整个婴儿期间这个妈妈特别抑郁，比如说他喂孩子的时候是不看孩子的。","sentence_en":"So throughout infancy, the mother was very depressed. For example, when she fed the child, she wouldn't look at him."},{"id":"480","start":3249.43,"end":3259.73,"displayStart":3249.43,"displayEnd":3259.73,"displayMid":3254.58,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.843964,"pitch":20.401157,"speechRate":5.266,"hasEvents":false,"sentence_source":"然后孩子有的时候就是做一些特别危险的行为，妈妈是完全忽略的，还有一些我记得我们看特别难受就是，孩子其实已经不想吃了。","sentence_en":"Sometimes the child did dangerous things, and the mother completely ignored them. There was another part that was hard to watch: the child clearly didn't want to eat anymore,"},{"id":"481","start":3259.73,"end":3265.53,"displayStart":3259.73,"displayEnd":3265.53,"displayMid":3262.63,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.957345,"pitch":21.45093,"speechRate":6.002,"hasEvents":true,"sentence_source":"但是因为这个应该是妈妈还是她姥姥，在喂她的时候就一勺一勺的在C这个男孩。","sentence_en":"but the mother or grandmother kept spoon-feeding him forcefully."},{"id":"482","start":3266.17,"end":3273.13,"displayStart":3266.17,"displayEnd":3273.13,"displayMid":3269.65,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.885386,"pitch":21.374004,"speechRate":5.069,"hasEvents":true,"sentence_source":"然后我记得我们看的时候就觉得哇，这个是个太糟糕的养育环境了，就觉得这不可忍。","sentence_en":"Then I remember when we were watching it, we thought, wow, this is such a terrible parenting environment, it's unbearable."},{"id":"483","start":3273.85,"end":3277.77,"displayStart":3273.85,"displayEnd":3277.77,"displayMid":3275.81,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.899407,"pitch":21.344927,"speechRate":5.392,"hasEvents":false,"sentence_source":"但是我记得我们在讨论到底什么是差不多的妈妈。","sentence_en":"But I remember us discussing what exactly a 'good enough mother' is."},{"id":"484","start":3277.77,"end":3291.63,"displayStart":3277.77,"displayEnd":3291.63,"displayMid":3284.7,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.5,"loudness":0.87065,"pitch":19.5951,"speechRate":5.674,"hasEvents":false,"sentence_source":"我们的老师说其实这就是一个差不多的养育过程，这个妈妈尽力了，就是她在她的整个婚姻条件下，她的情绪状态下，她也给了她最好的东西，她给我们些现实的反馈，就是大概30年之后。","sentence_en":"Our teacher said that this was actually a 'good enough' parenting process. The mother did her best given her marital situation and emotional state. She gave what she could. And the feedback we got was that about 30 years later,"},{"id":"485","start":3291.63,"end":3307.23,"displayStart":3291.63,"displayEnd":3307.23,"displayMid":3299.4300000000003,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.6,"loudness":0.839241,"pitch":20.273417,"speechRate":5.047,"hasEvents":false,"sentence_source":"她们看反正这个男性应该是30多岁吧，过着就挺健康的挺好的生活，就没有出什么了不起的问题，我记这个当时对于我来讲是挺震惊，我说原来这个就是差不多了，我做妈妈之后能理解的。","sentence_en":"They saw that this male was probably in his 30s, living a healthy and good life, without any major problems. I remember this was quite shocking to me at the time. I thought, so this is about it—what I can understand after becoming a mother."},{"id":"486","start":3307.23,"end":3316.59,"displayStart":3307.23,"displayEnd":3316.59,"displayMid":3311.91,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0.1,"loudness":0.873673,"pitch":22.025021,"speechRate":5.376,"hasEvents":false,"sentence_source":"更多就是当妈妈的焦虑 其实就是爸妈如果，或你的养育环境这些成年人相对健康，就大概率养育就不会出什么大差子。","sentence_en":"more of a mother's anxiety comes from whether the parents or the adult caregivers are relatively healthy. If they are, the parenting probably won't go too wrong."},{"id":"487","start":3316.59,"end":3330.85,"displayStart":3316.59,"displayEnd":3330.85,"displayMid":3323.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.7,"loudness":0.85359,"pitch":22.176615,"speechRate":5.58,"hasEvents":false,"sentence_source":"刚才我还关注了另外一个点，这个其实跟心理分析完全没关系，就是我的专业的那个点，我就会觉得哇，此刻那个镜头它太冷静太残酷了，它没有任何的干预，它利用了这对母子的一个困境。","sentence_en":"I also noticed another point that has nothing to do with psychoanalysis but with my own profession. I thought, wow, that camera shot was so cold and cruel. There was no intervention; it exploited the dilemma of that mother and child."},{"id":"488","start":3330.85,"end":3342.69,"displayStart":3330.85,"displayEnd":3342.69,"displayMid":3336.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.6,"loudness":0.809928,"pitch":21.014259,"speechRate":5.935,"hasEvents":false,"sentence_source":"因为它拍出来是好看的，它会感染你 影响到你，我都没看我都很被打动，但那时候他那个镜头如此之冷静残酷，他没有任何的干预，他可以说小孩已经吃饱你可以不用喂了。","sentence_en":"Because it looked good on screen and affected you. Even though I wasn't watching the whole time, I was still moved. But that shot was so cold and cruel, with no intervention. They could have said, 'The child is full, you don't need to feed him anymore,"},{"id":"489","start":3342.69,"end":3344.83,"displayStart":3342.69,"displayEnd":3344.83,"displayMid":3343.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.875564,"pitch":18.026237,"speechRate":5.911,"hasEvents":false,"sentence_source":"但他喂了效果就不停的在拍。","sentence_en":"but they just kept filming."},{"id":"490","start":3345.83,"end":3360.75,"displayStart":3345.83,"displayEnd":3360.75,"displayMid":3353.29,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0.2,"loudness":0.828949,"pitch":22.243153,"speechRate":4.625,"hasEvents":false,"sentence_source":"这个很有意思的一件事情，就是心理治疗师的训练里面有一个被流传下来的叫做婴儿观察，就是如果你想要成为治疗师，尤其是精神分析是某个流派精神分析师的话。","sentence_en":"That's a really interesting thing. In psychotherapist training, there's a tradition called 'infant observation.' If you want to become a therapist, especially a psychoanalyst of a certain school,"},{"id":"491","start":3360.75,"end":3365.97,"displayStart":3360.75,"displayEnd":3365.97,"displayMid":3363.3599999999997,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.797976,"pitch":21.525455,"speechRate":5.939,"hasEvents":false,"sentence_source":"他们都会建议你去做婴儿观察，这个设置是这样的，你找一个新生儿的家庭。","sentence_en":"they recommend you do infant observation. The setup is: you find a newborn's family,"},{"id":"492","start":3365.97,"end":3376.81,"displayStart":3365.97,"displayEnd":3376.81,"displayMid":3371.39,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en" ople won’t like you."},{"id":"541","start":3732.75,"end":3746.39,"displayStart":3732.75,"displayEnd":3746.39,"displayMid":3739.5699999999997,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0.1,"loudness":0.829887,"pitch":21.24955,"speechRate":4.423,"hasEvents":false,"sentence_source":"绝大多数事情不会按照你期待的方向去行走，你无法获得你所有想要的东西，只有当你站在所谓看起来悲观的真相上面，你才能准备好向前走。","sentence_en":"Most things won’t go in the direction you expect; you can’t get everything you want. Only when you stand on the seemingly pessimistic truth can you be ready to move forward."},{"id":"542","start":3746.39,"end":3749.43,"displayStart":3746.39,"displayEnd":3749.43,"displayMid":3747.91,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.5,"loudness":0.757457,"pitch":14.217378,"speechRate":5.344,"hasEvents":false,"sentence_source":"然后你才能获得所谓积极的力量。","sentence_en":"Then you can gain what is called positive strength."},{"id":"543","start":3749.43,"end":3763.01,"displayStart":3749.43,"displayEnd":3763.01,"displayMid":3756.2200000000003,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.796523,"pitch":23.303831,"speechRate":4.856,"hasEvents":false,"sentence_source":"但是如果你就是平原上一直向阳向上升涨，这个你没有下面的泥土里面的根脉是不可能向上生长的所以，如果一个人说，玩在任何时候都特别激击 特别乐观。","sentence_en":"But if you’re just on the plain, always facing the sun and rising upward, without the roots in the soil, you can’t grow upward. So, if someone says they are always particularly positive and optimistic..."},{"id":"544","start":3763.01,"end":3765.61,"displayStart":3763.01,"displayEnd":3765.61,"displayMid":3764.3100000000004,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Ne n this since childhood."},{"id":"585","start":4089.33,"end":4102.19,"displayStart":4089.33,"displayEnd":4102.19,"displayMid":4095.7599999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.5,"loudness":0.899307,"pitch":25.659536,"speechRate":6.075,"hasEvents":false,"sentence_source":"但你知道这一点 从另外一角度去讲，他让人觉得特别自由 就是我们可能对于外在的样貌，比如我对于我长的样子 对于我的身材 包括对于服装，你可以认为他重要 但是我们认为他太过重要。","sentence_en":"But you know, from another angle, this makes you feel very free. We might think that external appearance—like my looks, my body, including clothes—can be considered important, but we think it's been made too important."},{"id":"586","start":4102.19,"end":4112.09,"displayStart":4102.19,"displayEnd":4112.09,"displayMid":4107.139999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.4,"loudness":0.905116,"pitch":21.67819,"speechRate":5.556,"hasEvents":false,"sentence_source":"他已经超出了他该有的重要性了，包括你刚才说我对于我外在样子不太在意，我现在越来越理解这一点，会觉得的确长得好看挺好的。","sentence_en":"It has exceeded its due importance. Including what you just said about me not caring much about my appearance—I now increasingly understand that, and feel that being good-looking is indeed nice."},{"id":"587","start":4112.09,"end":4119.85,"displayStart":4112.09,"displayEnd":4119.85,"displayMid":4115.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.5,"loudness":0.94919,"pitch":25.119457,"speechRate":5.928,"hasEvents":false,"sentence_source":"但是我长的没那么好看 或者我身材没那么好，他就是我人生的其中的一个小侧面，他没有那么的重要 同样着装。","sentence_en":"But if I'm not that good-looking or my body isn't that great, it's just one small aspect of my life. It's not that important, and same with clothing."},{"id":"588","start":4119.85,"end":4123.89,"displayStart":4119.85,"displayEnd":4123.89,"displa End":4162.37,"displayMid":4155.01,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.839635,"pitch":22.03005,"speechRate":5.456,"hasEvents":false,"sentence_source":"我觉得反译词是特别女性化的这，我想起来前一段有一个杂志想找我拍，七夕就希望拍我跟我先生说拍一个情侣照，我说你们的sample大概什么样，他就发给我了一个sample。","sentence_en":"I think the antonym is overly feminine. I remember a magazine recently wanted to shoot me and my husband for a couple's photoshoot for Qixi Festival. I asked what the sample looked like, and they sent me one."},{"id":"593","start":4162.37,"end":4164.77,"displayStart":4162.37,"displayEnd":4164.77,"displayMid":4163.57,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Negative","score":-0.3,"loudness":0.907416,"pitch":23.418987,"speechRate":7.759,"hasEvents":false,"sentence_source":"我说不行 这个sample太粉红泡泡了。","sentence_en":"I said no, this sample was too pink and bubbly."},{"id":"594","start":4164.77,"end":4168.49,"displayStart":4164.77,"displayEnd":4168.49,"displayMid":4166.63,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.884291,"pitch":25.603107,"speechRate":5.184,"hasEvents":false,"sentence_source":"我觉得我现在跟我先生之间是一个中年伴侣。","sentence_en":"I think my husband and I are now a middle-aged couple."},{"id":"595","start":4169.85,"end":4176.27,"displayStart":4169.85,"displayEnd":4176.27,"displayMid":4173.06,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":1.027341,"pitch":21.480165,"speechRate":6.807,"hasEvents":true,"sentence_source":"就是彼此独立有点距离的，我就给他发一张 我挺喜欢的我们俩一张合影，这样合影就是我们俩在六班。","sentence_en":"We are independent with some distance, so I sent him a photo I really like of us together, a group photo from Class Six."},{"id":"596","start":4176.27,"end":4186.43,"displayStart":4176.27,"displayEnd":4186.43,"displayMid":4181.35,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.3,"loudness":0.795909,"pitch":18.839651,"speechRate":3.642,"hasEvents":false,"sentence_source":"我觉得后重反应机对我来讲是粉红泡泡，特别带有性别属性的那些服装不是特别适合我。","sentence_en":"I think the opposite of substantial for me is pink and bubbly. Clothes with strong gender attributes don't really suit me."},{"id":"597","start":4186.43,"end":4200.49,"displayStart":4186.43,"displayEnd":4200.49,"displayMid":4193.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.7,"loudness":0.824112,"pitch":19.41724,"speechRate":4.883,"hasEvents":false,"sentence_source":"我喜欢这个表达，它所有的选择其实就是个体的，我的审美和我的倾向，它其实跟年纪跟性别都无关，就是作为女性，作为比如我这个年纪女性，我可以选择粉红泡泡。","sentence_en":"I like that expression. All choices are individual—my aesthetics and preferences have nothing to do with age or gender. As a woman, say at my age, I can choose pink and bubbly."},{"id":"598","start":4200.49,"end":4205.21,"displayStart":4200.49,"displayEnd":4205.21,"displayMid":4202.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.925771,"pitch":18.933512,"speechRate":5.215,"hasEvents":false,"sentence_source":"但是我也可以不选择，它是基于我个人的我此刻的感受。","sentence_en":"But I can also choose not to. It's based on my personal feelings at that moment."},{"id":"599","start":4205.21,"end":4212.57,"displayStart":4205.21,"displayEnd":4212.57,"displayMid":4208.889999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.6,"loudness":0.882516,"pitch":21.691622,"speechRate":6.103,"hasEvents":false,"sentence_source":"因为我此刻的审美选择 但是千万不要因为我是女性，我是这个年纪 所以我就应该是粉红或者不应该粉红。","sentence_en":"Because my aesthetic choice at this moment is just that—but don't think that because I'm a woman of this age, I should or shouldn't be pink."},{"id":"600","start":4212.57,"end":4224.01,"displayStart":4212.57,"displayEnd":4224.01,"displayMid":4218.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.6,"loudness":0.905777,"pitch":22.328033,"speechRate":5.498,"hasEvents":false,"sentence_source":"那这次跟Giada合作 他们选择 因为他们一直会愿意跟在不同的行业不同的领域，就做的比较专业 也很成功的女性 他们其实也还挺适合你的。","sentence_en":"So working with Giada this time, their choice—because they've always been willing to collaborate with professional and successful women in different industries—actually suits you quite well."},{"id":"601","start":4224.01,"end":4233.43,"displayStart":4224.01,"displayEnd":4233.43,"displayMid":4228.72,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.7,"loudness":0.870081,"pitch":21.079798,"speechRate":4.677,"hasEvents":false,"sentence_source":"对 我还挺喜欢他们的衣服 因为我觉得就是有我刚才想表达的厚重感，也很简洁 很大方 其实是很职业。","sentence_en":"Yes, I really like their clothes because they have that substantial feel I mentioned, and they're simple, elegant, and very professional."},{"id":"602","start":4233.43,"end":4249.19,"displayStart":4233.43,"displayEnd":4249.19,"displayMid":4241.3099999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.919972,"pitch":22.218983,"speechRate":4.875,"hasEvents":false,"sentence_source":"对 职业还蛮重要的 其实有时候很奇怪 你说衣服它很外在的，你说你穿什么其实都可以 但很多时候它对人的内心是有某种暗示的，就你在不同的场合 做不同的造型 打扮 穿不同的衣服。","sentence_en":"Yes, being professional is quite important. It's strange—clothes are external, you entiment_en":"Neutral","score":0,"loudness":0.919301,"pitch":20.91424,"speechRate":5.367,"hasEvents":false,"sentence_source":"我们有时候比如说做干报告的时候，经常会报告说来放着来的时候，他穿的是什么样子的，他审查是什么样的。","sentence_en":"Sometimes when we do case reports, we often note what the client was wearing when they came in, and how they presented themselves."},{"id":"607","start":4281.37,"end":4292.39,"displayStart":4281.37,"displayEnd":4292.39,"displayMid":4286.88,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.832837,"pitch":20.121599,"speechRate":5.016,"hasEvents":false,"sentence_source":"然后经过一段时间的咨询，他的穿着有什么样的变化，这个是一个特别明显的信号，有一些人是他来的时候就特别特别精致，意思不够。","sentence_en":"Then after a period of counseling, changes in their clothing are a very clear signal. Some people come in extremely polished, almost too much."},{"id":"608","start":4292.39,"end":4295.73,"displayStart":4292.39,"displayEnd":4295.73,"displayMid":4294.0599999999995,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.857668,"pitch":24.283972,"speechRate":6.169,"hasEvents":false,"sentence_source":"然后他经过一段咨询之后他能更放松一些了。","sentence_en":"Then after some sessions, they become more relaxed."},{"id":"609","start":4295.73,"end":4304.63,"displayStart":4295.73,"displayEnd":4304.63,"displayMid":4300.18,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.4,"loudness":0.829873,"pitch":16.825771,"speechRate":5.393,"hasEvents":false,"sentence_source":"所以他的穿衣也更放松一些了，更休闲一些，你觉得他整个人状态都怂怂齿一些，有一些人是来的时候特别不休编幅。","sentence_en":"So their clothing becomes more relaxed and casual; you feel they are more at ease. Some people come in very disheveled..."},{"id":"610","start":4304.63,"end":4319.15,"displayStart":4304.63,"displayEnd":4319.15,"displayMid":4311.889999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.833998,"pitch":20.059935,"speechRate":4.603,"hasEvents":false,"sentence_source":"然后当他发展出他自己的时候，你觉得这个人的穿衣上他更有自己的选择了，从心理咨询上我们也会看，人的穿衣其实很多时候是他，这个阶段生命的一个表达。","sentence_en":"Then as they develop their own identity, you see that their clothing choices become more personal. In psychological counseling, we also see that clothing is often an expression of one's life stage."},{"id":"611","start":4319.15,"end":4322.05,"displayStart":4319.15,"displayEnd":4322.05,"displayMid":4320.6,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.962458,"pitch":22.6523,"speechRate":6.667,"hasEvents":false,"sentence_source":"但也像您说的 这个表达也会反过来影响它。","sentence_en":"But as you said, this expression also influences them in return."},{"id":"612","start":4322.05,"end":4330.67,"displayStart":4322.05,"displayEnd":4330.67,"displayMid":4326.360000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.831863,"pitch":17.890123,"speechRate":4.988,"hasEvents":false,"sentence_source":"如果比如今天我们俩没有再这样一个对话的过程，你此刻会在干嘛 比如说是在公司还是会在照顾孩子。","sentence_en":"For example, if we weren't having this conversation right now, what would you be doing? Would you be at the office or taking care of your child?"},{"id":"613","start":4331.11,"end":4344.43,"displayStart":4331.11,"displayEnd":4344.43,"displayMid":4337.77,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Parenting Experiences","sentiment_en":"Neutral","score":0,"loudness":0.885481,"pitch":20.650469,"speechRate":4.88,"hasEvents":false,"sentence_source":"因为我不知道现在几点了6点20，点20 有一半的时间这个 <script type="module">

const LAYOUT = {

};

  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);

  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
