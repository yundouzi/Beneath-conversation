_en":"Hello everyone, welcome to 'Among the Flowers in the Rock.' Right now, sitting across from me is Jian Lili. Briefly introducing her, she is the founder of Simple Psychology. Lili, say hello to everyone."},{"id":"15","start":93.94,"end":95.64,"displayStart":93.94,"displayEnd":95.64,"displayMid":94.78999999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.608223,"pitch":13.414351,"speechRate":2.64,"hasEvents":false,"sentence_source":"大家好 我。","sentence_en":"Hello everyone, I..."},{"id":"16","start":95.64,"end":98.8,"displayStart":95.64,"displayEnd":98.8,"displayMid":97.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":1.048207,"pitch":22.117775,"speechRate":5.063,"hasEvents":false,"sentence_source":"先给你分享一个经历前几天我去医院。","sentence_en":"First, let me share an experience. A few days ago, I went to the hospital."},{"id":"17","start":98.8,"end":108.34,"displayStart":98.8,"displayEnd":108.34,"displayMid":103.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.863251,"pitch":19.676867,"speechRate":5.831,"hasEvents":false,"sentence_source":"然后在那个大厅里面等了医生叫号的时候，我坐的那个椅子隔了几个椅子有一个女孩，我就一直用余光看她 我知道她在注视我。","sentence_en":"While waiting in the lobby for my number to be called, there was a girl a few chairs away from me. I kept glancing at her, and I knew she was staring at me."},{"id":"18","start":108.34,"end":116.22,"displayStart":108.34,"displayEnd":116.22,"displayMid":112.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.3,"loudness":0.819574,"pitch":18.92198,"speechRate":6.017,"hasEvents":false,"sentence_source":"然后过了一会儿她大概鼓起勇气，就她隔了一个椅子坐在我旁边，说我能不能打扰你一下，我心里瞬间有点抗拒。","sentence_en":"After a while, she mustered up the courage to sit next to me, one chair away, and said, 'Can I bother you for a moment?' I felt a bit resistant instantly."},{"id":"19","start":116.22,"end":120.26,"displayStart":116.22,"displayEnd":120.26,"displayMid":118.24000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.831257,"pitch":16.994631,"speechRate":5.941,"hasEvents":false,"sentence_source":"但是她整个表现很有礼貌，而且很有分寸感 我说你怎么了。","sentence_en":"But she was very polite and had a good sense of boundaries. I said, 'What's wrong?"},{"id":"20","start":120.26,"end":122.08,"displayStart":120.26,"displayEnd":122.08,"displayMid":121.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.89276,"pitch":16.735741,"speechRate":6.044,"hasEvents":false,"sentence_source":"然后她就把口罩摘了以后。","sentence_en":"Then she took off her mask."},{"id":"21","start":122.08,"end":128.18,"displayStart":122.08,"displayEnd":128.18,"displayMid":125.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.4,"loudness":0.838328,"pitch":18.347528,"speechRate":4.754,"hasEvents":true,"sentence_source":"然后开始跟我讲大概意思就是他在看病是有抑郁的，在看医生在吃药。","sentence_en":"Then he started telling me that he was seeing a doctor for depression, taking medication."},{"id":"22","start":128.68,"end":133.92,"displayStart":128.68,"displayEnd":133.92,"displayMid":131.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.6,"loudness":0.792604,"pitch":19.264395,"speechRate":5.416,"hasEvents":true,"sentence_source":"然后总之过往有很多他特别后悔的经历无法释怀，觉得伤害了别人。","sentence_en":"Anyway, she had many past regrets she couldn't let go of, feeling she had hurt others."},{"id":"23","start":133.92,"end":137.82,"displayStart":133.92,"displayEnd":137.82,"displayMid":135.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.741808,"pitch":16.812368,"speechRate":5.986,"hasEvents":false,"sentence_source":"然后每一天感受不到生活的乐趣，偶尔会有极端想法。","sentence_en":"Then every day I can't feel the joy of life, and occasionally have extreme thoughts."},{"id":"24","start":137.82,"end":140.94,"displayStart":137.82,"displayEnd":140.94,"displayMid":139.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":1.017593,"pitch":25.93494,"speechRate":6.75,"hasEvents":false,"sentence_source":"然后我当时我有一个特别理性的声音告诉我。","sentence_en":"At that moment, a very rational voice inside me said."},{"id":"25","start":140.94,"end":148.52,"displayStart":140.94,"displayEnd":148.52,"displayMid":144.73000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0.1,"loudness":0.759748,"pitch":21.795202,"speechRate":5.673,"hasEvents":false,"sentence_source":"因为你没有专业的训练，你不要给人家说一些貌似很有用的很孤无人心的金句，但我还是安慰了他一些。","sentence_en":"Because you're not professionally trained, don't give her some seemingly useful but heartless platitudes. But I still comforted her a bit."},{"id":"26","start":148.52,"end":151.56,"displayStart":148.52,"displayEnd":151.56,"displayMid":150.04000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.575629,"pitch":14.854681,"speechRate":6.25,"hasEvents":false,"sentence_source":"然后最后我们俩就各自告别去各自看了大夫。","sentence_en":"In the end, we said goodbye and each went to see our own doctor."},{"id":"27","start":151.56,"end":158.28,"displayStart":151.56,"displayEnd":158.28,"displayMid":154.92000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.4,"loudness":0.856737,"pitch":24.096745,"speechRate":6.369,"hasEvents":false,"sentence_source":"然后那瞬间我觉得特别感慨，他虽然觉得我可能是很熟悉的一个陌生人或者很陌生的熟悉的人。","sentence_en":"At that moment, I felt deeply moved. Even though she might have seen me as a familiar stranger or a strange familiar person."},{"id":"28","start":158.28,"end":172.57999999999998,"displayStart":158.28,"displayEnd":172.57999999999998,"displayMid":165.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.839185,"pitch":22.936068,"speechRate":5.481,"hasEvents":false,"sentence_source":"但是他依然可能在一个人生到了非常关键的时刻，必须要某种发出求救的信号还是怎样，我后来也没办法完全去解读他当时的状况，当我把这一段情境跟你描述之后你会怎么样去分析他。","sentence_en":"But she was still at a critical point in life, needing to send some kind of distress signal. I couldn't fully interpret her situation later. After I describe this scenario to you, how would you analyze her?"},{"id":"29","start":172.57999999999998,"end":174.3,"displayStart":172.57999999999998,"displayEnd":174.3,"displayMid":173.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.666301,"pitch":20.534769,"speechRate":8.14,"hasEvents":false,"sentence_source":"或者去分析我们当时的那个情境。","sentence_en":"Or analyze the situation we were in."},{"id":"30","start":174.76,"end":176.28,"displayStart":174.76,"displayEnd":176.28,"displayMid":175.51999999999998,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":-0.1,"loudness":0.897858,"pitch":26.603628,"speechRate":7.246,"hasEvents":false,"sentence_source":"我觉得我可能很难分析。","sentence_en":"I think I might find it hard to analyze."},{"id":"31","start":176.28,"end":183.4,"displayStart":176.28,"displayEnd":183.4,"displayMid":179.84,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.6,"loudness":0.862478,"pitch":22.733149,"speechRate":5.312,"hasEvents":false,"sentence_source":"但是我听起来对您刚刚描述是一个熟悉的陌生人，这个距离刚刚好 给了他很大的信任感。","sentence_en":"But from what I heard, you just described a familiar stranger. That distance was just right, giving her a great sense of trust."},{"id":"32","start":183.4,"end":196.42,"displayStart":183.4,"displayEnd":196.42,"displayMid":189.91,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.783816,"pitch":19.846405,"speechRate":4.962,"hasEvents":false,"sentence_source":"因为在心理咨询的这个设置里面，咨询师和我们叫来访者之间的边界是特别重要的，我有时候会形容心理咨询在提供的是一个非常陌生的签名关系。","sentence_en":"Because in the setting of psychological counseling, the boundary between the counselor and what we call the client is very important. Sometimes I describe psychological counseling as providing a very strange signed relationship."},{"id":"33","start":196.42,"end":211.58,"displayStart":196.42,"displayEnd":211.58,"displayMid":204,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.801748,"pitch":18.023417,"speechRate":5.367,"hasEvents":false,"sentence_source":"因为我和咨询师之间我们在生活中是永远不会相见的，他也不会进入到我的生活里面，这个使得我有机会出让一些我的信任感给他，把我心底的一些真实的感受或者我认为特别羞耻的感受。","sentence_en":"Because my therapist and I will never meet in real life, and he won't enter my personal life, that gives me a chance to trust him and share my true feelings or the ones I find particularly shameful."},{"id":"34","start":211.58,"end":218.02,"displayStart":211.58,"displayEnd":218.02,"displayMid":214.8,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.759079,"pitch":16.924402,"speechRate":5.444,"hasEvents":false,"sentence_source":"或者特别不符合我自己道德标准要求的那些感受，有机会能够倾诉给这个陌生人。","sentence_en":"Or feelings that don't match my own moral standards—I get the opportunity to confide in this stranger."},{"id":"35","start":218.02,"end":222.74,"displayStart":218.02,"displayEnd":222.74,"displayMid":220.38,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.6,"loudness":0.759046,"pitch":16.317356,"speechRate":4.873,"hasEvents":false,"sentence_source":"我觉得这个距离感下好是能够帮助一个人打开自己的。","sentence_en":"I think that distance actually helps a person open up."},{"id":"36","start":222.74,"end":224.44,"displayStart":222.74,"displayEnd":224.44,"displayMid":223.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.928951,"pitch":27.848692,"speechRate":7.194,"hasEvents":false,"sentence_source":"你现在做这行做了多久。","sentence_en":"How long have you been in this field?"},{"id":"37","start":224.44,"end":230.02,"displayStart":224.44,"displayEnd":230.02,"displayMid":227.23000000000002,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.76388,"pitch":22.112446,"speechRate":3.156,"hasEvents":false,"sentence_source":"我在心里咨询这个鲁豫工作了十五年。","sentence_en":"I've worked in psychological counseling for fifteen years."},{"id":"38","start":230.02,"end":238.3,"displayStart":230.02,"displayEnd":238.3,"displayMid":234.16000000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.954601,"pitch":25.637302,"speechRate":6.603,"hasEvents":false,"sentence_source":"生活当中很多人看起来很年轻，但你问他的职场经历职场生活都蛮长的，但其实你一开始你所有的时间是比别人要早一点的。","sentence_en":"Many people look young in life, but when you ask about their work experience, it's actually quite long—it's just that they started everything earlier than others."},{"id":"39","start":238.3,"end":240.58,"displayStart":238.3,"displayEnd":240.58,"displayMid":239.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.4,"loudness":0.551144,"pitch":21.389732,"speechRate":8.479,"hasEvents":false,"sentence_source":"因为我看所有介绍就你小时候是个神童。","sentence_en":"Because from all the introductions, you were a child prodigy."},{"id":"40","start":240.58,"end":242.62,"displayStart":240.58,"displayEnd":242.62,"displayMid":241.60000000000002,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":-0.1,"loudness":1.173046,"pitch":28.01594,"speechRate":7.67,"hasEvents":false,"sentence_source":"神童应该是后来大家安心想的。","sentence_en":"Child prodigy' is probably a label others came up with later."},{"id":"41","start":242.62,"end":244.44,"displayStart":242.62,"displayEnd":244.44,"displayMid":243.53,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":1.008991,"pitch":22.420301,"speechRate":8.242,"hasEvents":false,"sentence_source":"因为我小时候从来没有神童的感受。","sentence_en":"Because I never felt like a prodigy when I was a child."},{"id":"42","start":245.48,"end":254.92,"displayStart":245.48,"displayEnd":254.92,"displayMid":250.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.781879,"pitch":18.860565,"speechRate":6.25,"hasEvents":false,"sentence_source":"我看所有关于神童的电影，他们都有一个好像共性一个特质，就类似小大人的感觉，你小时候是个小大人的感觉，就你回过头去看当时的那自己。","sentence_en":"In all the movies about prodigies, they share a trait: they seem like little adults. When you look back at yourself as a child, you felt like a little adult too."},{"id":"43","start":254.92,"end":264.64,"displayStart":254.92,"displayEnd":264.64,"displayMid":259.78,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.889051,"pitch":19.702513,"speechRate":5.123,"hasEvents":false,"sentence_source":"我就有一部分是的，但我不知道你怎么定小大人，但我能回忆起我小时候的很多时刻是，不符合我当时的生理年龄的。","sentence_en":"Part of me did, but I'm not sure how you define 'little adult.' I remember many moments in my childhood that didn't match my physical age."},{"id":"44","start":264.64,"end":266.94,"displayStart":264.64,"displayEnd":266.94,"displayMid":265.78999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.5819,"pitch":17.495541,"speechRate":5.081,"hasEvents":false,"sentence_source":"诶怎么样叫符合生理年龄。","sentence_en":"What do you mean by matching your physical age?"},{"id":"45","start":266.94,"end":276.92,"displayStart":266.94,"displayEnd":276.92,"displayMid":271.93,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.839644,"pitch":17.473845,"speechRate":4.625,"hasEvents":false,"sentence_source":"我能举一个例子，我会述起来的一个非常小的时候发生的事情，在那个时刻它表现的我就是超出了自己的年龄。","sentence_en":"Let me give an example. I recall something that happened when I was very young, where my behavior was beyond my age."},{"id":"46","start":276.92,"end":280.7,"displayStart":276.92,"displayEnd":280.7,"displayMid":278.81,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.922953,"pitch":20.076677,"speechRate":5.556,"hasEvents":false,"sentence_source":"因为我小的时候我妈花很多时间在培养我上面。","sentence_en":"Because when I was little, my mother spent a lot of time nurturing me."},{"id":"47","start":280.7,"end":287.94,"displayStart":280.7,"displayEnd":287.94,"displayMid":284.32,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.682062,"pitch":17.283365,"speechRate":5.263,"hasEvents":false,"sentence_source":"因为我很小就认次了，我应该两岁多上的幼儿园，但那个时候我已经能读信和读很多东西了。","sentence_en":"I learned to read very early—I started kindergarten at around two, and by then I could already read letters and many other things."},{"id":"48","start":287.94,"end":300.86,"displayStart":287.94,"displayEnd":300.86,"displayMid":294.4,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.3,"loudness":0.947289,"pitch":19.307766,"speechRate":5.104,"hasEvents":false,"sentence_source":"所以我在幼儿园学校里面特别容易被老师托书对待，这个图书对待呢 就是反正总是表扬我，尤其是在批评一些办理淘气的小孩的时候，就会拿我出来做比较。","sentence_en":"So in kindergarten, teachers would treat me with special favor, always praising me, especially when scolding the naughty kids—they'd compare me to them."},{"id":"49","start":300.86,"end":313.86,"displayStart":300.86,"displayEnd":313.86,"displayMid":307.36,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.4,"loudness":0.883861,"pitch":17.821753,"speechRate":5.608,"hasEvents":false,"sentence_source":"所以我好像从小对这个特别敏感，就是被表扬这件事情对我来讲，一直是一个令我非常紧张的事情，我记有一个时刻是应该上幼儿园大堡的时候，是一个下午中午懒阳阳的。","sentence_en":"So I've been especially sensitive to praise since childhood—it always made me very nervous. I remember one time in the last year of kindergarten, a lazy afternoon."},{"id":"50","start":313.86,"end":315.92,"displayStart":313.86,"displayEnd":315.92,"displayMid":314.89,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.88705,"pitch":15.350472,"speechRate":6.78,"hasEvents":false,"sentence_source":"就在排队阿姨给我们剪指甲。","sentence_en":"We were lining up for the auntie to cut our nails."},{"id":"51","start":315.92,"end":318.96,"displayStart":315.92,"displayEnd":318.96,"displayMid":317.44,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":1.030283,"pitch":20.651966,"speechRate":5.263,"hasEvents":false,"sentence_source":"然后突然应该是有一男生在调避导弹。","sentence_en":"Then suddenly a boy started causing trouble."},{"id":"52","start":318.96,"end":324.14,"displayStart":318.96,"displayEnd":324.14,"displayMid":321.54999999999995,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.859243,"pitch":17.066933,"speechRate":4.44,"hasEvents":false,"sentence_source":"然后所以那个阿姨就表扬我就说你看她考试的考双版。","sentence_en":"So the auntie praised me, saying, 'Look at her, she got double 100s on the exam."},{"id":"53","start":324.14,"end":327.96,"displayStart":324.14,"displayEnd":327.96,"displayMid":326.04999999999995,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.833318,"pitch":14.837911,"speechRate":5.759,"hasEvents":false,"sentence_source":"然后她还写书法，就是因为我那时候得了一个什么奖。","sentence_en":"And she also mentioned my calligraphy—I had won some award."},{"id":"54","start":327.96,"end":332.62,"displayStart":327.96,"displayEnd":332.62,"displayMid":330.28999999999996,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.728358,"pitch":10.681606,"speechRate":5.671,"hasEvents":false,"sentence_source":"所以把里面还挂着我的书法写的东西，但你看你们大概这一次。","sentence_en":"So the classroom had my calligraphy hanging on the wall, and she said, 'But look at you guys this time..."},{"id":"55","start":333.14,"end":342.98,"displayStart":333.14,"displayEnd":342.98,"displayMid":338.06,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.3,"loudness":0.848793,"pitch":19.791088,"speechRate":5.589,"hasEvents":false,"sentence_source":"然后我就记得我旁边的一个男生，突然表达了一句说，会写书法有什么了不起，我还会写钢笔子呢，我在跟我自己的治疗师回术记忆中。","sentence_en":"Then I remember the boy next to me suddenly said, 'So what if she can do calligraphy? I can write with a fountain pen too.' I recall this when I revisit memories with my therapist."},{"id":"56","start":342.98,"end":347.64,"displayStart":342.98,"displayEnd":347.64,"displayMid":345.31,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.828518,"pitch":20.596315,"speechRate":5.15,"hasEvents":false,"sentence_source":"我觉得这是很早的一个画面，我对那个时刻的感受并不是。","sentence_en":"I think this is an early memory, and my feeling at that moment wasn't..."},{"id":"57","start":347.64,"end":356.02,"displayStart":347.64,"displayEnd":356.02,"displayMid":351.83,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.4,"loudness":0.816037,"pitch":18.656523,"speechRate":5.745,"hasEvents":false,"sentence_source":"我觉得两三岁的小孩这时候应该被表扬了，你就天然的很高兴，被这个小朋友攻击了，你就理应我不高兴，我被攻击了。","sentence_en":"A two- or three-year-old should feel naturally happy about being praised, and when attacked by a peer, should feel upset."},{"id":"58","start":356.02,"end":364.98,"displayStart":356.02,"displayEnd":364.98,"displayMid":360.5,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.928733,"pitch":19.362789,"speechRate":5.18,"hasEvents":false,"sentence_source":"但是我记得我在描述这个时刻的时候，我后来看是非常成年人的思维，我想他来表达对我的攻击是合理的。","sentence_en":"But when I describe the memory now, I realize my reaction was very adult—I thought his attack was justified."},{"id":"59","start":364.98,"end":376.36,"displayStart":364.98,"displayEnd":376.36,"displayMid":370.67,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.883365,"pitch":16.619356,"speechRate":5.305,"hasEvents":false,"sentence_source":"然后这个就是我刚才讲的时候小大人的时刻，这个对于我来讲，在后来我会认为这是一部分的创伤，当然这创伤是可解的，虽然发生了这样的事情。","sentence_en":"That's the 'little adult' moment I mentioned. In retrospect, I think it was partly a trauma, though a solvable one."},{"id":"60","start":377.04,"end":389.18,"displayStart":377.04,"displayEnd":389.18,"displayMid":383.11,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.4,"loudness":0.824147,"pitch":17.669922,"speechRate":4.695,"hasEvents":false,"sentence_source":"如果老师或者是成年人有机会跟我讨论在这个时刻的感受，可能我就能理解的更多，但那个时候我是压抑掉了自己特别原始的那些感受。","sentence_en":"If a teacher or adult had talked with me about my feelings at that moment, I might have understood more. But back then, I suppressed my raw feelings."},{"id":"61","start":389.18,"end":392.48,"displayStart":389.18,"displayEnd":392.48,"displayMid":390.83000000000004,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.804516,"pitch":15.807461,"speechRate":6.364,"hasEvents":false,"sentence_source":"但是我做了一个特别 reasoning 的想法。","sentence_en":"Instead, I made a very reasoning thought."},{"id":"62","start":392.48,"end":404.5,"displayStart":392.48,"displayEnd":404.5,"displayMid":398.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.851295,"pitch":23.5805,"speechRate":5.494,"hasEvents":false,"sentence_source":"要从现在回过头去看，你在很早就已经展现出了你后来职业所需要的某种素质，就是你会跳出来站在一个非常客观的一个角度去分析你那此刻你的情绪。","sentence_en":"Looking back, you showed the qualities needed for your future career very early—you could step back and analyze your emotions from a very objective perspective."},{"id":"63","start":404.5,"end":407.64,"displayStart":404.5,"displayEnd":407.64,"displayMid":406.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.871547,"pitch":24.988119,"speechRate":6.84,"hasEvents":false,"sentence_source":"因为后来发现人的时候 你的很多情绪是不可靠的。","sentence_en":"Because later you realize many of your emotions are unreliable."},{"id":"64","start":407.64,"end":419.46,"displayStart":407.64,"displayEnd":419.46,"displayMid":413.54999999999995,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.856588,"pitch":19.324476,"speechRate":4.335,"hasEvents":false,"sentence_source":"当然如果从心理咨询师这个职业来讲 可能恰恰是相反的，心理咨询的工作更多的是帮助一个人来理解和了解他的情绪。","sentence_en":"Of course, from a psychological counselor's perspective, it's the opposite—the job is more about helping someone understand and get in touch with their emotions."},{"id":"65","start":419.46,"end":433.7,"displayStart":419.46,"displayEnd":433.7,"displayMid":426.58,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.855566,"pitch":18.724253,"speechRate":5.009,"hasEvents":false,"sentence_source":"我们更会把刚才我们要说这个情形 对于特别小的我来讲，是一个创伤 是因为我那时候其实是在应对创伤的时候 才取了一个策略，就是我不再去选择忽略掉自己的感受。","sentence_en":"We'd say that situation for the young me was a trauma. I adopted a coping strategy to deal with it—I chose to ignore my feelings."},{"id":"66","start":433.7,"end":442.88,"displayStart":433.7,"displayEnd":442.88,"displayMid":438.28999999999996,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.873695,"pitch":16.698063,"speechRate":5.011,"hasEvents":false,"sentence_source":"看起来好像很客观地找了一个理由 帮主要理解这件事情，但这个是成年人在社会化的时候 所必须要有的技能。","sentence_en":"It looks objective, finding a reason to understand things, but that's a skill adults must develop for socializing."},{"id":"67","start":442.88,"end":451.36,"displayStart":442.88,"displayEnd":451.36,"displayMid":447.12,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.4,"loudness":0.893929,"pitch":16.109577,"speechRate":5.493,"hasEvents":false,"sentence_source":"但是这个技能的发展应该建立在你理解自己的感受，理解自己的感受从何而来 而且允许他们出现开始的。","sentence_en":"But this skill should be built on understanding your own feelings, knowing where they come from, and allowing them to surface."},{"id":"68","start":451.36,"end":462.2,"displayStart":451.36,"displayEnd":462.2,"displayMid":456.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.839143,"pitch":20.271542,"speechRate":6.087,"hasEvents":false,"sentence_source":"你知道你刚才讲你童年的这个 关于创伤的这个记忆，我想起来 我小时候 当时我们应该是差不多二三年级，还是小学比较低年级的时候 我们那个班主任。","sentence_en":"You know, when you talked about that childhood trauma memory, it reminded me of my own. When I was in second or third grade—or maybe lower elementary—our homeroom teacher..."},{"id":"69","start":462.2,"end":466.68,"displayStart":462.2,"displayEnd":466.68,"displayMid":464.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.845976,"pitch":25.526821,"speechRate":6.027,"hasEvents":false,"sentence_source":"那有一天不知道为什么 突然让我们全班要一起攻击有一个男生。","sentence_en":"One day, for some reason, she made the whole class gang up on a boy."},{"id":"70","start":466.68,"end":471.4,"displayStart":466.68,"displayEnd":471.4,"displayMid":469.03999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.886013,"pitch":21.30685,"speechRate":5.085,"hasEvents":false,"sentence_source":"那个男生就属于是很调皮 但他也没有特别的不好的表现。","sentence_en":"He was a bit naughty but not particularly bad."},{"id":"71","start":471.4,"end":481.78,"displayStart":471.4,"displayEnd":481.78,"displayMid":476.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.96132,"pitch":22.21685,"speechRate":6.497,"hasEvents":false,"sentence_source":"那天我忘了什么是老师 让我们全班同学一起要说他 要骂一个，在我看来很让我触目惊心的 无法想象那个词，我就一个人很恐惧躲在所有人的后面 我没有说。","sentence_en":"I forget what exactly the teacher said, but she had us all criticize him, yell at him. And then she used a word that shocked me—I couldn't imagine it. I was so scared I hid behind everyone else and didn't say anything."},{"id":"72","start":481.78,"end":493.78,"displayStart":481.78,"displayEnd":493.78,"displayMid":487.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.754832,"pitch":19.140419,"speechRate":5.25,"hasEvents":false,"sentence_source":"但别同学都在说他 后来很多很多年之后，我在一个场合碰到这个人 他叫我 陈鲁豫 你还认识我吗，我就看他一个很高的一个男的 还有点装 我完全不认识。","sentence_en":"But the other kids all joined in. Many years later, I met that person at an event. He called out, 'Chen Luyu, do you still remember me?' I looked at him—a tall man, a bit chubby—and I had no idea who he was."},{"id":"73","start":493.78,"end":497.86,"displayStart":493.78,"displayEnd":497.86,"displayMid":495.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.830324,"pitch":26.315346,"speechRate":5.007,"hasEvents":false,"sentence_source":"我说抱歉 您是他说他的名字 就是那个男孩。","sentence_en":"I said, 'Sorry, you are...' and he said his name—it was that boy."},{"id":"74","start":497.86,"end":506.86,"displayStart":497.86,"displayEnd":506.86,"displayMid":502.36,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.906599,"pitch":22.451099,"speechRate":5.601,"hasEvents":false,"sentence_source":"然后你知道我瞬间什么反应吗 我想谢天谢地，他如今看起来还是个非常快乐 所谓打着引号快乐 健康的一个成年人。","sentence_en":"You know what my immediate reaction was? I thought, thank goodness, he looks like a very happy—quote-unquote 'happy'—and healthy adult now."},{"id":"75","start":506.86,"end":512.1,"displayStart":506.86,"displayEnd":512.1,"displayMid":509.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.901802,"pitch":24.407604,"speechRate":5.749,"hasEvents":false,"sentence_source":"因为我一直很怕当年那场景对他这一生都造成特别深的心理创伤。","sentence_en":"Because I had always worried that that scene a small stone had been lifted from my heart."},{"id":"80","start":535.58,"end":546.34,"displayStart":535.58,"displayEnd":546.34,"displayMid":540.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.800064,"pitch":20.28154,"speechRate":6.015,"hasEvents":false,"sentence_source":"所以我现在很理解就你说的 我们小时候某一个时刻，某一种不经意的举动或者一个场景 其实可能会成为一个孩子，在这一生的某一段会好或不好的记忆。","sentence_en":"So now I really understand what you said: a careless action or scene from childhood can become a good or bad memory for a child at some point in their life."},{"id":"81","start":546.34,"end":561,"displayStart":546.34,"displayEnd":561,"displayMid":553.6700000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.6,"loudness":0.841735,"pitch":19.621975,"speechRate":4.722,"hasEvents":false,"sentence_source":"对 我觉得这个是一定的，好消息是所有的事件，即便是看起来很疼痛的事件，不一定会带来创伤，它的先决条件就是，如果这个人在经历，比如说你刚才描述你这个同学。","sentence_en":"Yes, I think that's certain. The good news is that not all painful events necessarily lead to trauma. The prerequisite is that if the person, like your classmate you described..."},{"id":"82","start":561,"end":569,"displayStart":561,"displayEnd":569,"displayMid":565,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.890615,"pitch":19.348999,"speechRate":4.875,"hasEvents":false,"sentence_source":"如果他在这个过程中，他得到了一些其他人的支持，比如说如果班里面有同学在这个结束之后。","sentence_en":"If during that process, he got support from others, for example, if some classmates after it ended..."},{"id":"83","start":569,"end":581.72,"displayStart":569,"displayEnd":581.72,"displayMid":575.36,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.7,"loudness":0.73248,"pitch":16.547747,"speechRate":4.137,"hasEvents":false,"sentence_source":"其实又来关心他，表达对他的爱和保护，这个就能消解一部分疼痛感，就是他形成关于这件事情的记忆不是孤独的，不是绝望的。","sentence_en":"Actually, showing concern and expressing love and protection can alleviate some of the pain, allowing the person to form a memory of the event that is not lonely or hopeless."},{"id":"84","start":581.72,"end":597.1,"displayStart":581.72,"displayEnd":597.1,"displayMid":589.4100000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.8,"loudness":0.81882,"pitch":21.478565,"speechRate":5.263,"hasEvents":false,"sentence_source":"然后如果有成年人或者其他人能够有机会，在这个所谓创伤事件发生之后，能够给他更多的关注更多的帮助，甚至有的时候人们能从中获得更多的东西，更多的力量 更多的智慧 以及更多的体验。","sentence_en":"Then if there is an adult or someone else who has the opportunity to give him more attention and help after the so-called traumatic event, sometimes people can gain more from it—more strength, more wisdom, and more experience."},{"id":"85","start":597.1,"end":608.46,"displayStart":597.1,"displayEnd":608.46,"displayMid":602.78,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.4,"loudness":0.823458,"pitch":15.430108,"speechRate":5.525,"hasEvents":false,"sentence_source":"包括我自己经历的这些事情，就是后来有机会有时候讲述我自己的这些小的时候所谓被看作是神童的体验的时候，大部分人其实是很难理解的。","sentence_en":"Including my own experiences, when I later had the chance to share my childhood as a so-called prodigy, most people found it hard to understand."},{"id":"86","start":608.46,"end":620.24,"displayStart":608.46,"displayEnd":620.24,"displayMid":614.35,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.895304,"pitch":19.469522,"speechRate":5.058,"hasEvents":false,"sentence_source":"因为你看起来你获得了关注你获得了表扬，就是他怎么会形成双生呢，很多事情并不是其他人认为或者这个事看起来好像他之前好事或坏事。","sentence_en":"Because on the surface, you gained attention and praise—how could that be traumatic? Many things aren't simply good or bad as others perceive them."},{"id":"87","start":620.24,"end":626.92,"displayStart":620.24,"displayEnd":626.92,"displayMid":623.5799999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.757849,"pitch":16.604904,"speechRate":4.959,"hasEvents":false,"sentence_source":"都不一定能够决定他是否是一个对这个人来讲是个积极的事件或双生的事件。","sentence_en":"They don't necessarily determine whether an event is positive or traumatic for that person."},{"id":"88","start":626.92,"end":636.8,"displayStart":626.92,"displayEnd":636.8,"displayMid":631.8599999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0.1,"loudness":0.887825,"pitch":19.265102,"speechRate":5.654,"hasEvents":false,"sentence_source":"所以在心理咨询里面当来访者来描述今天发生了这样一件事情的时候，特别核心的就是咨询师一定会追问那他带给你什么感受。","sentence_en":"So in psychological counseling, when a client describes something that happened today, it's crucial for the counselor to ask: 'What feeling did that bring you?"},{"id":"89","start":637.16,"end":645.54,"displayStart":637.16,"displayEnd":645.54,"displayMid":641.3499999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.879949,"pitch":20.086729,"speechRate":7.254,"hasEvents":false,"sentence_source":"因为这样我们才知道我们工作的方向是什么，我没有办法通过他描述的一件事情来知道这件事情对他是积极的体验还是消极的体验。","sentence_en":"Because only then do we know the direction of our work. I can't tell from the event description alone whether it was a positive or negative experience for them."},{"id":"90","start":645.54,"end":653.98,"displayStart":645.54,"displayEnd":653.98,"displayMid":649.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.959896,"pitch":24.491209,"speechRate":6.238,"hasEvents":false,"sentence_source":"我还记得我一直到大概十年前或者几年前，比如你有时候看美剧看好莱坞电影里面，动不动这个人就要去看心理医生。","sentence_en":"I remember until about ten or a few years ago, when watching American TV or Hollywood movies, characters would constantly see a therapist."},{"id":"91","start":653.98,"end":665.74,"displayStart":653.98,"displayEnd":665.74,"displayMid":659.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.5,"loudness":0.85982,"pitch":21.916763,"speechRate":6.22,"hasEvents":false,"sentence_source":"然后动不动把他所有的现在创痛都归于他童年的某端经历，我记得我当时一边看一边会想这个有点扯，就是你所有的你都要追根溯源到某一个人某一端经历某一个场景。","sentence_en":"And they'd trace all their current pain back to some childhood experience. I used to think, 'That's a bit much'—tracing everything back to one person, one experience, one scene."},{"id":"92","start":665.74,"end":675.4,"displayStart":665.74,"displayEnd":675.4,"displayMid":670.5699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Positive","score":0.5,"loudness":0.809903,"pitch":21.306282,"speechRate":5.319,"hasEvents":true,"sentence_source":"但是你后来你明白他不仅不扯事实就是如此，但你看你的认知是会有一个变化的，它是要一个从量变到质变的一个过程。","sentence_en":"But later you realize that not only is it not nonsense, it's just how things are, but your perception will change—it's a process from quantitative to qualitative change."},{"id":"93","start":675.4,"end":678.86,"displayStart":675.4,"displayEnd":678.86,"displayMid":677.13,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.925551,"pitch":15.660527,"speechRate":5.045,"hasEvents":false,"sentence_source":"但所谓我还要再多说一根专有关的东西。","sentence_en":"But I need to add one more thing about trauma."},{"id":"94","start":678.86,"end":687.64,"displayStart":678.86,"displayEnd":687.64,"displayMid":683.25,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.6,"loudness":0.877099,"pitch":17.546534,"speechRate":5.104,"hasEvents":false,"sentence_source":"我们讲创伤的时候其实很少或者少量比例的是，就像您刚刚描述这个激烈的，比如说全班人都指着我骂我。","sentence_en":"When we talk about trauma, only a small portion involves intense events like the one you just described—the whole class pointing at me and scolding me."},{"id":"95","start":687.64,"end":696.48,"displayStart":687.64,"displayEnd":696.48,"displayMid":692.06,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Neutral","score":0,"loudness":0.729853,"pitch":17.535873,"speechRate":4.997,"hasEvents":false,"sentence_source":"我觉得这是会一个我们叫危机的事件，但大多数像我经历的那些，如果一次两次其实它无法真的构成创伤。","sentence_en":"That's what we call a crisis event. But most of my experiences, once or twice, don't actually constitute trauma."},{"id":"96","start":696.48,"end":709.92,"displayStart":696.48,"displayEnd":709.92,"displayMid":703.2,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.7,"loudness":0.800558,"pitch":18.969372,"speechRate":5.208,"hasEvents":false,"sentence_source":"但是它如果在我的生活中不断地出现，我不断地经受这样的体验，而这些体验和感受我又没有机会表达，或者没有一个成年人帮我来处理，他理解究竟在发生什么的时候。","sentence_en":"But if it keeps appearing in my life, and I keep experiencing these feelings without having a chance to express them, or without an adult to help me understand what is happening."},{"id":"97","start":709.92,"end":712.34,"displayStart":709.92,"displayEnd":712.34,"displayMid":711.13,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.5,"loudness":0.665513,"pitch":16.288712,"speechRate":4.959,"hasEvents":false,"sentence_source":"他就会形成我们所谓的创伤。","sentence_en":"They become what we call trauma."},{"id":"98","start":712.34,"end":726.86,"displayStart":712.34,"displayEnd":726.86,"displayMid":719.6,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.6,"loudness":0.827699,"pitch":18.680698,"speechRate":4.959,"hasEvents":false,"sentence_source":"因为在这个过程中我会不断地学习我怎么看待自己，怎么看待别人 怎么看待我和其他人的关系，比如说当我反复去经历这种被老师当众表扬，把我和其他人对立起来的时候。","sentence_en":"Because in this process, I constantly learn how I see myself, how I see others, and how I relate to others. For example, when I repeatedly experience being publicly praised by the teacher and set apart from classmates,"},{"id":"99","start":726.86,"end":730.74,"displayStart":726.86,"displayEnd":730.74,"displayMid":728.8,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.7,"loudness":0.775325,"pitch":18.305857,"speechRate":4.491,"hasEvents":false,"sentence_source":"我就不可避免地会觉得被表扬是危险的。","sentence_en":"I inevitably feel that being praised is dangerous."},{"id":"100","start":730.74,"end":734.18,"displayStart":730.74,"displayEnd":734.18,"displayMid":732.46,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.5,"loudness":0.888555,"pitch":21.779911,"speechRate":5.144,"hasEvents":false,"sentence_source":"然后我和其他人关系是我需要小心意义。","sentence_en":"And my relationships with others require caution."},{"id":"101","start":734.18,"end":738.16,"displayStart":734.18,"displayEnd":738.16,"displayMid":736.17,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"The profession of therapist","sentiment_en":"Negative","score":-0.6,"loudness":0.842101,"pitch":19.09701,"speechRate":5.025,"hasEvents":false,"sentence_source":"因为我要承担一部分因为老师比较带来的敌意。","sentence_en":"Because I have to bear some of the hostility caused by the teacher's favoritism."},{"id":"102","start":738.16,"end":740.8,"displayStart":738.16,"displayEnd":740.8,"displayMid":739.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.91251,"pitch":19.817554,"speechRate":6.452,"hasEvents":false,"sentence_source":"所以你看被表扬本身是没有问题的。","sentence_en":"So you see, being praised itself is not the problem."},{"id":"103","start":740.8,"end":751.48,"displayStart":740.8,"displayEnd":751.48,"displayMid":746.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.5,"loudness":0.873064,"pitch":22.244589,"speechRate":4.802,"hasEvents":false,"sentence_source":"但是被表扬之后会带来的同学对你的侧目或者某种不满，让你把被表扬和被孤立连接在了一起 这是问题的一个根源。","sentence_en":"But the sidelong glances or dissatisfaction from classmates after being praised connect being praised with being isolated—that's the root of the problem."},{"id":"104","start":751.48,"end":760.4,"displayStart":751.48,"displayEnd":760.4,"displayMid":755.94,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":-0.2,"loudness":0.829834,"pitch":19.239887,"speechRate":4.036,"hasEvents":false,"sentence_source":"我觉得对于我来讲 我就觉得我和别人不一样，但我回忆起来 因为我上学比别人早几年。","sentence_en":"For me, I always felt different from others. Looking back, it's because I started school a few years earlier."},{"id":"105","start":760.4,"end":764.58,"displayStart":760.4,"displayEnd":764.58,"displayMid":762.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.972811,"pitch":25.28558,"speechRate":5.502,"hasEvents":false,"sentence_source":"我们六岁半 七岁上学你要早几年 就差不多四岁的样子。","sentence_en":"Normally, kids start at six and a half or seven. I started at around four."},{"id":"106","start":764.58,"end":768.3,"displayStart":764.58,"displayEnd":768.3,"displayMid":766.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.925742,"pitch":22.086409,"speechRate":5.22,"hasEvents":false,"sentence_source":"对，我是四岁上的一年级 然后六岁上的四年级。","sentence_en":"Yes, I was in first grade at four, then fourth grade at six."},{"id":"107","start":768.3,"end":769.82,"displayStart":768.3,"displayEnd":769.82,"displayMid":769.06,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Neutral","score":0,"loudness":0.734976,"pitch":12.957546,"speechRate":6.579,"hasEvents":false,"sentence_source":"所以我八岁就上初中了。","sentence_en":"So I entered middle school at eight."},{"id":"108","start":769.82,"end":777.42,"displayStart":769.82,"displayEnd":777.42,"displayMid":773.62,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.4,"loudness":0.840161,"pitch":20.192408,"speechRate":5.07,"hasEvents":false,"sentence_source":"所以在我人生那头几年都比别人物理上，就肢体上要小很多，就你一看就是和别人不一样的。","sentence_en":"In those early years, I was physically much smaller than others—you could tell I was different at a glance."},{"id":"109","start":777.42,"end":784.48,"displayStart":777.42,"displayEnd":784.48,"displayMid":780.95,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.5,"loudness":0.70939,"pitch":17.870562,"speechRate":5.307,"hasEvents":false,"sentence_source":"所以它不是某一件事情，某一次你被表扬的时候不一样，而是你每天都和别人不一样。","sentence_en":"So it wasn't a single event or a single time I was praised that made me different; it was that I was different every single day."},{"id":"110","start":784.92,"end":789.18,"displayStart":784.92,"displayEnd":789.18,"displayMid":787.05,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Employment environment and gender discrimination","sentiment_en":"Negative","score":-0.7,"loudness":0.800472,"pitch":19.347153,"speechRate":4.506,"hasEvents":false,"sentence_source":"我觉得这个体验是对于我来讲是很孤独的。","sentence_en":"For me, that experience was very lonely."},{"id":"111","start":789.84,"end":792.34,"displayStart":789.84,"displayEnd":792.34,"displayMid":791.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.695622,"pitch":20.897221,"speechRate":7.459,"hasEvents":true,"sentence_source":"长大以后你跟你爸妈说过这些事情吗。","sentence_en":"Did you ever tell your parents about these things when you grew up?"},{"id":"112","start":792.34,"end":795.72,"displayStart":792.34,"displayEnd":795.72,"displayMid":794.03,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.988713,"pitch":16.765591,"speechRate":4.819,"hasEvents":false,"sentence_source":"说过 在二十多岁到三十岁这个区间内。","sentence_en":"I said, during the age range of my twenties to thirties."},{"id":"113","start":795.72,"end":800,"displayStart":795.72,"displayEnd":800,"displayMid":797.86,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLab :"Your intense conflict with your mother occurred in your twenties."},{"id":"118","start":810.96,"end":812.24,"displayStart":810.96,"displayEnd":812.24,"displayMid":811.6,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.729223,"pitch":14.649474,"speechRate":7.018,"hasEvents":false,"sentence_source":"我觉得是20多岁。","sentence_en":"I think it was my twenties."},{"id":"119","start":812.24,"end":815.58,"displayStart":812.24,"displayEnd":815.58,"displayMid":813.9100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.987638,"pitch":22.612139,"speechRate":5.66,"hasEvents":false,"sentence_source":"这个其实比班人的时间可能又会完后一点。","sentence_en":"This is actually a bit later than most people's timing."},{"id":"120","start":815.58,"end":821.46,"displayStart":815.58,"displayEnd":821.46,"displayMid":818.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.872942,"pitch":22.288151,"speechRate":4.422,"hasEvents":false,"sentence_source":"对 我一般认为可能在十几岁，就人在青春期叛逆期的那个时候。","sentence_en":"Right, I generally think it's in the teenage years, during the rebellious period of adolescence."},{"id":"121","start":821.46,"end":832.86,"displayStart":821.46,"displayEnd":832.86,"displayMid":827.1600000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.852545,"pitch":20.592243,"speechRate":4.927,"hasEvents":false,"sentence_source":"我的这部分要比普通的那个认识要晚一些，我是一直到工作之后，我记得前几年，我有一些机会去有些高中，偶尔做一些想做什么的。","sentence_en":"My rebellious phase came later than usual. I didn't go through it until after I started working. I recall a few years ago, I had opportunities to visit some high schools and occasionally gave talks."},{"id":"122","start":832.86,"end":839.22,"displayStart":832.86,"displayEnd":839.22,"displayMid":836.04,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.952537,"pitch":24.855854,"speechRate":6.487,"hasEvents":false,"sentence_source":"然后他们的妈妈们经常就很焦虑来问，我就高中这个阶段吗，就是孩子特别叛逆，我每次都跟他们说。","sentence_en":"Then their mothers would often anxiously ask me, 'Is it in high school that children are particularly rebellious?' I would tell them every time."},{"id":"123","start":839.22,"end":854.32,"displayStart":839.22,"displayEnd":854.32,"displayMid":846.77,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.7,"loudness":0.823794,"pitch":19.233158,"speechRate":4.702,"hasEvents":false,"sentence_source":"其实孩子现在的叛逆是特别好的事情，就是说明他的自我发展起来了，而且他现在跟你有冲突表达自我，第一是他其实发展得很健康，第二就是如果他在这个阶段和你叛逆。","sentence_en":"Actually, a child's rebellion now is a very good thing. It shows that his self-identity is developing. And the fact that he conflicts with you and expresses himself means, first, he is developing healthily, and second, if he rebels against you at this stage,"},{"id":"124","start":854.32,"end":863.26,"displayStart":854.32,"displayEnd":863.26,"displayMid":858.79,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":1.045696,"pitch":19.080605,"speechRate":5.257,"hasEvents":false,"sentence_source":"他的代价是小的，他如果这个阶段不给你打价的话，他就要到20多岁，他拿他的人生所有的大事情，来和你对着干。","sentence_en":"the cost is small. If he doesn't push back now, he will do so in his twenties, using all his major life choices to oppose you."},{"id":"125","start":863.26,"end":864.44,"displayStart":863.26,"displayEnd":864.44,"display 0001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0.1,"loudness":0.877457,"pitch":21.603582,"speechRate":4.458,"hasEvents":false,"sentence_source":"其实从客观上来讲是的，但甚至我也觉得，我本质上是特别认同我妈妈内在的，这是 逻辑，我是她培养起来的。","sentence_en":"Actually, objectively speaking, yes. But I also feel that deep down I really identify with my mom's logic; I was brought up by her."},{"id":"130","start":895.14,"end":899.86,"displayStart":895.14,"displayEnd":899.86,"displayMid":897.5,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":-0.2,"loudness":1.068836,"pitch":21.05337,"speechRate":4.696,"hasEvents":true,"sentence_source":"只是她内在有一些冲突的力量，到我20多岁的时候。","sentence_en":"It's just that there were some conflicting forces within her until I was in my twenties."},{"id":"131","start":899.86,"end":913.54,"displayStart":899.86,"displayEnd":913.54,"displayMid":906.7,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.869648,"pitch":16.839359,"speechRate":4.898,"hasEvents":false,"sentence_source":"我觉得她是有一些特别传统的，在她身体里面力量冒出来了，就担心我，你一定要在体制内工作，一定要遭到家人 要结婚，买房啊等等一系列的，传统的东西就出来了。","sentence_en":"I think she has some very traditional forces that emerge within her. She worries about me, saying I must work within the system, must follow family expectations, get married, buy a house, and so on. A series of traditional things come out."},{"id":"132","start":913.54,"end":920.32,"displayStart":913.54,"displayEnd":920.32,"displayMid":916.9300000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.862678,"pitch":22.804918,"speechRate":4.358,"hasEvents":false,"sentence_source":"但在此之前 在我工作之前的20年里面，他从来没有给过我这些东西。","sentence_en":"But before that, in the 20 years before I started working, she never gave me these messages."},{"id":"133","start":920.32,"end":926.14,"displayStart":920.32,"displayEnd":926.14,"displayMid":923.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.89681,"pitch":21.787769,"speechRate":6.104,"hasEvents":false,"sentence_source":"所以你会认为他对你早期的教育和后来给你，关注的某种思想是有相违背的地方。","sentence_en":"So you would think that her early education and what she later imposed on you—some ideas—are contradictory."},{"id":"134","start":926.62,"end":929.64,"displayStart":926.62,"displayEnd":929.64,"displayMid":928.13,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.993705,"pitch":17.916931,"speechRate":6.367,"hasEvents":false,"sentence_source":"我当时感受到特别强烈的就是被背叛了。","sentence_en":"What I felt very strongly at that time was betrayal."},{"id":"135","start":929.64,"end":931.44,"displayStart":929.64,"displayEnd":931.44,"displayMid":930.54,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.843201,"pitch":12.913774,"speechRate":7.643,"hasEvents":false,"sentence_source":"我觉得整个世界都背叛了我。","sentence_en":"I felt the whole world had betrayed me."},{"id":"136","start":931.44,"end":935.34,"displayStart":931.44,"displayEnd":935.34,"displayMid":933.3900000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.961193,"pitch":24.77816,"speechRate":5.966,"hasEvents":false,"sentence_source":"因为后来我去读了一些研究，就因为我是独生子女。","sentence_en":"Because later I read some research. It was because I am an only child."},{"id":"137","start":935.34,"end":947.34,"displayStart":935.34,"displayEnd":947.34,"displayMid":941.34,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.5,"loudness":0.831281,"pitch":18.822184,"speechRate":6.027,"hasEvents":false,"sentence_source":"所以家里都是把所有的资源都给你，在这时候是没有性别区分的，我在小的时候 我妈从来没告诉过我说，你以后就不用好好读书 你嫁个人就可以了，她就是希望你去奔跑。","sentence_en":"So the family gives all resources to you, without gender distinction at that time. When I was little, my mom never told me that I didn't need to study hard and could just marry someone. She wanted me to run forward."},{"id":"138","start":947.34,"end":950.3,"displayStart":947.34,"displayEnd":950.3,"displayMid":948.8199999999999,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.6,"loudness":0.865384,"pitch":19.37085,"speechRate":5.725,"hasEvents":false,"sentence_source":"她从小就跟我说 你以后是要去远方的。","sentence_en":"She told me from a young age, 'You are destined to go far away."},{"id":"139","start":950.3,"end":954.5,"displayStart":950.3,"displayEnd":954.5,"displayMid":952.4,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.906122,"pitch":18.632257,"speechRate":6.4,"hasEvents":false,"sentence_source":"因为我从小三线城市长大，我身边的人并没有什么人出国。","sentence_en":"Growing up in a small third-tier city, hardly anyone around me had been abroad."},{"id":"140","start":954.5,"end":961.32,"displayStart":954.5,"displayEnd":961.32,"displayMid":957.9100000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.828781,"pitch":20.470451,"speechRate":5.136,"hasEvents":false,"sentence_source":"但是我妈其实她是对自我有一些，她不能实现的愿望，她特别希望渴望我能够实现。","sentence_en":"But my mom had some unfulfilled wishes of her own, and she desperately hoped I could achieve them."},{"id":"141","start":961.32,"end":973.12,"displayStart":961.32,"displayEnd":973.12,"displayMid":967.22,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Positive","score":0.6,"loudness":0.80089,"pitch":19.072027,"speechRate":5.568,"hasEvents":false,"sentence_source":"因为我妈生我特别早，我能回忆起来，她小时候经常跟我讲说，你以后不用生孩子这么早，你可以多过一些你自己的人生，他甚至还会讲说你要比男孩子更强。","sentence_en":"Since she had me very young, I remember her often telling me, 'You don't have to have kids so early, you can live more of your own life.' She even said I should be stronger than boys."},{"id":"142","start":973.12,"end":983.94,"displayStart":973.12,"displayEnd":983.94,"displayMid":978.53,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.802124,"pitch":17.932121,"speechRate":5.638,"hasEvents":false,"sentence_source":"然后这个也是研究里面也这么讲，他讲独生女这一代是被复权的一代，就不管家庭有意识无意识的，都是希望你和男性一样，未来在社会上获得成就。","sentence_en":"This is also what research says—the only-daughter generation was 'empowered,' whether consciously or not, families wanted us to achieve as much as men in society."},{"id":"143","start":983.94,"end":992,"displayStart":983.94,"displayEnd":992,"displayMid":987.97,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.769303,"pitch":20.091059,"speechRate":4.963,"hasEvents":false,"sentence_source":"他甚至希望你来证明你比重男轻女的男生更强，反正我觉得我是个特别典型的这么生长起来的。","sentence_en":"She even wanted me to prove I was stronger than sexist boys. Anyway, I think I grew up as a very typical example of that."},{"id":"144","start":992,"end":1005.44,"displayStart":992,"displayEnd":1005.44,"displayMid":998.72,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.6,"loudness":0.928478,"pitch":20.692183,"speechRate":5.862,"hasEvents":false,"sentence_source":"然后结果到了20多岁的时候，有一段时间我觉得陷入一个巨大的迷茫里面，比如说当我职业发展遇到一些问题，我想知道未来还可以有什么样职业发展的时候，我去寻找长辈的意见。","sentence_en":"Then in my 20s, I fell into a huge confusion. For example, when I hit career problems and wanted advice on future paths, I turned to elders."},{"id":"145","start":1005.44,"end":1011.04,"displayStart":1005.44,"displayEnd":1011.04,"displayMid":1008.24,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.7,"loudness":0.866153,"pitch":20.636711,"speechRate":5.425,"hasEvents":false,"sentence_source":"所有人给我的意见都是，哎 要不然你先结婚，要不然你先生个孩子就好了。","sentence_en":"Everyone told me, 'Why not get married first? Or have a child, and it'll be fine."},{"id":"146","start":1011.04,"end":1021.48,"displayStart":1011.04,"displayEnd":1021.48,"displayMid":1016.26,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.909934,"pitch":19.270775,"speechRate":5.542,"hasEvents":false,"sentence_source":"所以那个时候我的感受不特制我妈妈，我当时觉得我身边的环境都被判我，有强烈的想法就是，如果最终你们希望我过的是这样的生活。","sentence_en":"So at that time, I felt—not just toward my mom—that my whole environment had betrayed me. I strongly thought, 'If this is the life you ultimately want for me..."},{"id":"147","start":1021.48,"end":1025.8,"displayStart":1021.48,"displayEnd":1025.8,"displayMid":1023.64,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.879168,"pitch":16.860239,"speechRate":5.093,"hasEvents":false,"sentence_source":"那就外伯就是你之前为什么要用这个方式来培养我。","sentence_en":"Then why did you raise me that way before?"},{"id":"148","start":1025.8,"end":1040.46,"displayStart":1025.8,"displayEnd":1040.46,"displayMid":1033.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.84589,"pitch":25.094814,"speechRate":5.161,"hasEvents":false,"sentence_source":"这其实我一直抗拒的一个方式，就是我们总是用另外一个新的一个事物来解决旧有事物的一个问题，完全是两个完全不同的结婚在我还是结婚，工作是工作或者生孩子生孩子。","sentence_en":"This is actually something I've always resisted—the idea of solving one problem with another completely different thing. Marriage is marriage, work is work, having kids is having kids."},{"id":"149","start":1040.46,"end":1049.4,"displayStart":1040.46,"displayEnd":1049.4,"displayMid":1044.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.86281,"pitch":24.966757,"speechRate":6.04,"hasEvents":false,"sentence_source":"但是我们习惯于用生孩子解决婚姻的问题用婚姻解决工作的问题，我还是觉得每一个问题你让我先单独解决我们各自独立成章。","sentence_en":"But we're used to solving marriage problems with kids, and work problems with marriage. I still think each problem should be tackled on its own—they're separate chapters."},{"id":"150","start":1049.4,"end":1059.2,"displayStart":1049.4,"displayEnd":1059.2,"displayMid":1054.3000000000002,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.4,"loudness":0.989084,"pitch":20.686481,"speechRate":4.592,"hasEvents":false,"sentence_source":"我觉得因为我妈在那个年龄阶段就会跟周围的其他人抱怨说她变了，说你变了 说我变了 跟以前完全不一样。","sentence_en":"I think my mom, at that age, would complain to others that I had changed—saying I was completely different from before."},{"id":"151","start":1059.2,"end":1074.26,"displayStart":1059.2,"displayEnd":1074.26,"displayMid":1066.73,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":-0.2,"loudness":0.854593,"pitch":19.508944,"speechRate":4.781,"hasEvents":false,"sentence_source":"但是我的体验是我一点也没变 是你的想法突然变了，事到如今比如说我现在跟我妈妈沟通的时候，我其实认为我妈妈在我20岁到30岁期间，就她没有完全的认识她自己。","sentence_en":"But in my experience, I hadn't changed at all—her expectations had suddenly shifted. Now, when I talk to my mom, I realize she didn't fully understand herself during my 20s."},{"id":"152","start":1074.26,"end":1089.2,"displayStart":1074.26,"displayEnd":1089.2,"displayMid":1081.73,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Neutral","score":0,"loudness":0.886508,"pitch":18.373905,"speechRate":4.232,"hasEvents":false,"sentence_source":"因为我的这种要去远方啊 要自立啊，就是这些愿望就是他从小特别渴望给我的，但他那时候怀抱着某种我理解，从特别现实层面上的一些限制和恐惧。","sentence_en":"Because my desire to go far away and be independent—those were exactly the wishes she desperately wanted to give me as a child. But she also held back, with realistic limitations and fears."},{"id":"153","start":1089.2,"end":1101.98,"displayStart":1089.2,"displayEnd":1101.98,"displayMid":1095.5900000000001,"speaker":"Jian Lili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family, Women, and Childbirth","sentiment_en":"Negative","score":-0.5,"loudness":0.899424,"pitch":22.652042,"speechRate":5.002,"hasEvents":false,"sentence_source":"他特别担心你未来如果没有铁放完了怎么办，如果你真的不结婚了，没有小孩什么，就是他有一些特别也在他生活里面，禁锢他的那些想法也放在我身上。","sentence_en":"She worried, 'What if you don't have a stable job? What if you never marry or have kids?' Those same thoughts that had constrained her life were placed onto me."},{"id":"154","start":1101.98,"end":1108.82,"displayStart":1101.98,"displayEnd":1108.82,"displayMid":1105.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"F  least right to complain. I felt I had no right to complain about anything."},{"id":"174","start":1232.12,"end":1237.54,"displayStart":1232.12,"displayEnd":1237.54,"displayMid":1234.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.978723,"pitch":24.988741,"speechRate":6.089,"hasEvents":false,"sentence_source":"我一直在告诉我自己，这是我们常会说的，就是你还要怎样呢，你看你已经很好了。","sentence_en":"I kept telling myself, as people often say, 'What more do you want? Look, you already have it good."},{"id":"175","start":1237.54,"end":1240.94,"displayStart":1237.54,"displayEnd":1240.94,"displayMid":1239.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.6,"loudness":0.91533,"pitch":21.211946,"speechRate":5.294,"hasEvents":false,"sentence_source":"但是我的感受就是我一定要在乎我的感受。","sentence_en":"But my feeling was that I had to value my own feelings."},{"id":"176","start":1240.94,"end":1242.76,"displayStart":1240.94,"displayEnd":1242.76,"displayMid":1241.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Neutral","score":0,"loudness":0.864583,"pitch":23.442619,"speechRate":6.41,"hasEvents":false,"sentence_source":"我们的痛苦不能去比较。","sentence_en":"Our pain cannot be compared."},{"id":"177","start":1242.76,"end":1245.84,"displayStart":1242.76,"displayEnd":1245.84,"displayMid":1244.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Emotions and Life","sentiment_en":"Positive","score":0.7,"loudness":0.791877,"pitch":18.693022,"speechRate":5.195,"hasEvents":false,"sentence_source":"对我来说它是我特别珍贵的一个感受。","sentence_en":"For me, it's a very precious feeling."},{"id":"178","start":1245.84,"end":1247.32,"displayStart":1245.84,"displayEnd":1247.32,"displayMid":1246.58,"speaker":"Lu Yu","speakerColor":"#995A91","clust
