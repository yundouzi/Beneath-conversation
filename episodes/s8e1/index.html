't know why, I felt from childhood that taking medicine and getting shots was unavoidable."},{"id":"117","start":893.9,"end":897.94,"displayStart":893.9,"displayEnd":897.94,"displayMid":895.9200000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.986983,"pitch":29.96769,"speechRate":6.59,"hasEvents":false,"sentence_source":"所以我吃药打针不是一个被动状态我是一个主动状态。","sentence_en":"So taking medicine and getting shots wasn't a passive state for me; it was active."},{"id":"118","start":897.94,"end":905.32,"displayStart":897.94,"displayEnd":905.32,"displayMid":901.6300000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":0.866152,"pitch":23.65699,"speechRate":5.691,"hasEvents":false,"sentence_source":"因为我知道我吃了药打针我身体会变好，虽然药很苦针也很痛但是我知道我必须这样我身体会变好。","sentence_en":"Because I knew that after medicine and shots, my body would get better. Even though the medicine is bitter and shots hurt, I knew I had to do it for my health."},{"id":"119","start":905.32,"end":910.38,"displayStart":905.32,"displayEnd":910.38,"displayMid":907.85,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.78111,"pitch":21.199831,"speechRate":4.15,"hasEvents":false,"sentence_source":"所以我小时候是特别勇敢的有时候是过于勇敢了。","sentence_en":"So I was especially brave as a child, sometimes too brave."},{"id":"120","start":910.38,"end":926.1,"displayStart":910.38,"displayEnd":926.1,"displayMid":918.24,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.955299,"pitch":26.917835,"speechRate":4.903," sentence_en":"I think this is really about raising girls — not material wealth but spiritual enrichment. That's why there's this idea of 'raising girls'."},{"id":"143","start":1124.82,"end":1139,"displayStart":1124.82,"displayEnd":1139,"displayMid":1131.9099999999999,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Negative","score":-0.6,"loudness":0.774308,"pitch":23.488586,"speechRate":3.864,"hasEvents":false,"sentence_source":"因为过去的很多家庭是重男轻女的，他们会抚养男孩 会穷养女孩，就是让女孩不配得感很强，这个鸡腿是弟弟的 这个鸡蛋是哥哥的。","sentence_en":"Because many families in the past valued sons over daughters. They would raise boys with abundance and girls with deprivation, creating a strong sense of unworthiness. 'This drumstick is for your brother, this egg is for your brother."},{"id":"144","start":1139,"end":1152.32,"displayStart":1139,"displayEnd":1152.32,"displayMid":1145.6599999999999,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Negative","score":-0.7,"loudness":0.899964,"pitch":24.484568,"speechRate":4.153,"hasEvents":true,"sentence_source":"就这个东西会让女孩觉得精神上非常贫穷，就是说将来会随便什么人拿一个什么东西给她，她不是缺那个东西 是缺那个得到的感觉。","sentence_en":"A negative sentence that expresses difficulty, pressure, or concern."},{"id":"145","start":1152.8,"end":1166.86,"displayStart":1152.8,"displayEnd":1166.86,"displayMid":1159.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Positive","score":0.7,"loudness":0.987569,"pitch":23.936445,"speechRate":5.679,"hasEvents":false,"sentence_source":"我觉得这点特别特别重要，你看像我们小时候上学的时候，一般老师会觉得男生的历史会很好，男生天生会对历史感兴趣，但我知道你从小你是对历史很感兴趣的，天生喜欢历史的，就是因为。","sentence_en":"I think this is extremely important. When we were in school, teachers usually thought boys would be good at history, that boys were naturally interested in history. But I know you were very interested in history from a young age, naturally liked it. Because..."},{"id":"146","start":1166.86,"end":1174.5,"displayStart":1166.86,"displayEnd":1174.5,"displayMid":1170.6799999999998,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.977118,"pitch":24.987566,"speechRate":3.927,"hasEvents":false,"sentence_source":"小时候我妈是教师嘛，我放学了会跑到学校找我妈妈，等我妈把我带回家。","sentence_en":"When I was little, my mom was a teacher. After school I'd run to school to find her and wait for her to bring me home."},{"id":"147","start":1174.5,"end":1179.68,"displayStart":1174.5,"displayEnd":1179.68,"displayMid":1177.0900000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.887569,"pitch":25.00342,"speechRate":5.792,"hasEvents":false,"sentence_source":"那么我会去的时候我妈还很忙，就把我哥他们那个学校的图书广那一头。","sentence_en":"When I got there, my mom was still busy, so she'd drop me off at the library of my brother's school."},{"id":"148","start":1179.68,"end":1182.22,"displayStart":1179.68,"displayEnd":1182.22,"displayMid":1180.95,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.742485,"pitch":18.936811,"speechRate":4.724,"hasEvents":false,"sentence_source":"然后我自己去摸手子去看书。","sentence_en":"Then I'd browse and read books by myself."},{"id":"149","start":1182.22,"end":1197.3,"displayStart":1182.22,"displayEnd":1197.3,"displayMid":1189.76,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Positive","score":0.7,"loudness":0.864894,"pitch":25.009392,"speechRate":4.576,"hasEvents":false,"sentence_source":"所以小时候大的孩子，我姐的同学，姐姐哥哥们到我家去谈那种，我会觉得你们说的我都懂，我都会 我都能搭得上话，我从来不会觉得，男孩历史怎么可能比我好呢就这种。","sentence_en":"When I was little, older children — my sister’s classmates and older brothers and sisters — would come to my home and talk. I always felt I understood what they were saying and could join the conversation; I never thought boys should naturally know history better than me."},{"id":"150","start":1197.3,"end":1200.92,"displayStart":1197.3,"displayEnd":1200.92,"displayMid":1199.1100000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.976606,"pitch":24.697414,"speechRate":4.587,"hasEvents":false,"sentence_source":"我小时候最喜欢说老实你说错了的。","sentence_en":"When I was little, my favorite thing to say was 'Teacher, you're wrong."},{"id":"151","start":1200.92,"end":1202.08,"displayStart":1200.92,"displayEnd":1202.08,"displayMid":1201.5,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.636274,"pitch":15.486376,"speechRate":5.172,"hasEvents":false,"sentence_source":"其实是历史课。","sentence_en":"Actually, it was a history class."},{"id":"152","start":1203.58,"end":1213.82,"displayStart":1203.58,"displayEnd":1213.82,"displayMid":1208.6999999999998,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.939474,"pitch":27.191063,"speechRate":4.98,"hasEvents":false,"sentence_source":"因为那个时候不知道为什么，就是所有的老师是串课的，除了组课以外的那些复课的老师，都是临时拉过来造本宣科的那种。","sentence_en":"Because back then, for some reason, all teachers were teaching subjects they weren't specialized in. Aside from the main subjects, the other teachers were just brought in temporarily to read from textbooks."},{"id":"153","start":1213.82,"end":1215.3,"displayStart":1213.82,"displayEnd":1215.3,"displayMid":1214.56,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.898179,"pitch":21.577473,"speechRate":4.054,"hasEvents":false,"sentence_source":"所以他会说错。","sentence_en":"So they would make mistakes."},{"id":"154","start":1215.3,"end":1218.64,"displayStart":1215.3,"displayEnd":1218.64,"displayMid":1216.97,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.791624,"pitch":24.720991,"speechRate":4.491,"hasEvents":false,"sentence_source":"然后我说老师你错了，老师你又错了。","sentence_en":"Then I'd say, 'Teacher, you're wrong,' and 'Teacher, you're wrong again."},{"id":"155","start":1218.64,"end":1230.74,"displayStart":1218.64,"displayEnd":1230.74,"displayMid":1224.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Negative","score":-0.5,"loudness":1.102696,"pitch":26.408291,"speechRate":5.289,"hasEvents":true,"sentence_source":"那些是很崩溃的，在上课的过程当中，被一个小孩当中指出你是错的，而且他一定是个很严重的历史的，一个客观事实的一个错误，这多大的一个事儿 你说说。","sentence_en":"That was really frustrating—being called out by a child in class for being wrong, and it was always a serious factual error in history. Think about how big a deal that is."},{"id":"156","start":1231.94,"end":1237.1,"displayStart":1231.94,"displayEnd":1237.1,"displayMid":1234.52,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.99984,"pitch":25.357521,"speechRate":6.359,"hasEvents":true,"sentence_source":"所以我说那种 现在回想我要是那个老师我也会觉得，这小孩怎么那么烦呢。","sentence_en":"So I said, looking back, if I were that teacher, I'd think, 'What an annoying kid."},{"id":"157","start":1238.48,"end":1246.42,"displayStart":1238.48,"displayEnd":1246.42,"displayMid":1242.45,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":1.104965,"pitch":28.145535,"speechRate":4.418,"hasEvents":true,"sentence_source":"所以你读的第一部关于历史的书籍是什么，是小学一年级的时候关于东州列国状。","sentence_en":"So what was the first history book you read? It was about the Eastern Zhou and the Warring States in first grade."},{"id":"158","start":1246.42,"end":1261.12,"displayStart":1246.42,"displayEnd":1261.12,"displayMid":1253.77,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.868664,"pitch":27.39259,"speechRate":3.673,"hasEvents":false,"sentence_source":"那个时候是大概就是一页图片配一个故事，就我在那里看到什么 老马屎图 老港豹风精啦，这些东西 所以我对内断小故事会比较熟。","sentence_en":"Back then, it was one picture per page with a story. I saw things like 'Old Horse Map' and 'Old Harbor Leopard Wind Spirit'—so I was familiar with those short stories."},{"id":"159","start":1261.12,"end":1265.04,"displayStart":1261.12,"displayEnd":1265.04,"displayMid":1263.08,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.82677,"pitch":24.444584,"speechRate":4.082,"hasEvents":false,"sentence_source":"也包括我家里很早就有那个上国演艺。","sentence_en":"Also, my family had 'Romance of the Three Kingdoms' early on."},{"id":"160","start":1265.04,"end":1269.84,"displayStart":1265.04,"displayEnd":1269.84,"displayMid":1267.44,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.817851,"pitch":23.656504,"speechRate":5.208,"hasEvents":false,"sentence_source":"那个时候连字都不太熟的时候，我就看红龙我们看上国演艺。","sentence_en":"Back when I wasn't even familiar with characters, I was reading 'Romance of the Three Kingdoms'."},{"id":"161","start":1269.84,"end":1285.06,"displayStart":1269.84,"displayEnd":1285.06,"displayMid":1277.4499999999998,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.805393,"pitch":24.610001,"speechRate":4.862,"hasEvents":false,"sentence_source":"所以东州列国的上国的我的故事会比较熟，而这一块呢跟我同龄的大部分的男孩肯定没我熟，而大的孩子觉得一个小女孩对这一档历史的时候，也会觉得很奇怪 也会拼命去表演。","sentence_en":"So I became very familiar with stories from the Eastern Zhou and the warring states. Most boys my age were certainly not as familiar with them as I was, and older children found it strange that a little girl knew this history so well."},{"id":"162","start":1285.06,"end":1286.96,"displayStart":1285.06,"displayEnd":1286.96,"displayMid":1286.01,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.873641,"pitch":29.137226,"speechRate":6.593,"hasEvents":false,"sentence_source":"哎呀 这个真是好难得的那种。","sentence_en":"Oh, that was really rare."},{"id":"163","start":1286.96,"end":1295.3,"displayStart":1286.96,"displayEnd":1295.3,"displayMid":1291.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.093087,"pitch":27.441137,"speechRate":4.92,"hasEvents":false,"sentence_source":"吸引你的是什么呢，是这段历史里的那些动荡那些拳谋，里面的人物是什么东西吸引你呢。","sentence_en":"What attracted you? The turmoil and schemes in that history? Or the characters? What drew you in?"},{"id":"164","start":1295.74,"end":1300.2,"displayStart":1295.74,"displayEnd":1300.2,"displayMid":1297.97,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":1.001534,"pitch":27.734568,"speechRate":4.497,"hasEvents":false,"sentence_source":"是人吧 那些人特别精彩，就一开始是个普通人。","sentence_en":"It was the people. They were so fascinating—starting as ordinary individuals."},{"id":"165","start":1300.2,"end":1306.7,"displayStart":1300.2,"displayEnd":1306.7,"displayMid":1303.45,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.8,"loudness":0.878128,"pitch":24.263845,"speechRate":5.077,"hasEvents":false,"sentence_source":"然后夸夸两下就变成了一个好厉害的人，是我们日常生活中不可能见到的这种。","sentence_en":"Then, in a flash, they became incredibly powerful—something you'd never see in everyday life."},{"id":"166","start":1306.7,"end":1319.4,"displayStart":1306.7,"displayEnd":1319.4,"displayMid":1313.0500000000002,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.850673,"pitch":26.314432,"speechRate":4.233,"hasEvents":false,"sentence_source":"因为不管是中周年国还是商国，都是不停地在出奇迹奇谋的那种，会让我觉得啊 好厉害我 这些人真的是很让人佩服 很让人向往。","sentence_en":"The conversation connects personal growth with philosophy & knowledge."},{"id":"167","start":1319.4,"end":1332.38,"displayStart":1319.4,"displayEnd":1332.38,"displayMid":1325.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.006935,"pitch":24.606108,"speechRate":4.389,"hasEvents":false,"sentence_source":"在当时的课上的语文作文里面 你有过任何类似的创作的尝试吗，试图把你曾经读到的历史当中那些内容人物写到你的作文当中去。","sentence_en":"In your Chinese composition class back then, did you ever try to incorporate characters or content from history into your essays?"},{"id":"168","start":1332.38,"end":1347.26,"displayStart":1332.38,"displayEnd":1347.26,"displayMid":1339.8200000000002,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":-0.1,"loudness":0.850878,"pitch":21.785076,"speechRate":3.997,"hasEvents":false,"sentence_source":"没有 我那时候属于不怎么认真学习的孩子，比如说我今天作文800字 我就数到800字我就写完了嘛，老师会觉得你为什么故事没写完。","sentence_en":"No, I wasn't a very diligent student. For example, if the essay required 800 words, I'd count until I reached 800 and stop. The teacher would ask why I didn't finish the story."},{"id":"169","start":1347.26,"end":1354.2,"displayStart":1347.26,"displayEnd":1354.2,"displayMid":1350.73,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":-0.1,"loudness":0.81096,"pitch":27.234005,"speechRate":3.746,"hasEvents":false,"sentence_source":"这篇中文没写完你就教了，我说八百字满了，我不是个情怀小孩。","sentence_en":"You turned in an incomplete essay? I said, 'It's 800 words—I'm done.' I wasn't a sentimental kid."},{"id":"170","start":1354.72,"end":1370.1,"displayStart":1354.72,"displayEnd":1370.1,"displayMid":1362.4099999999999,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.969302,"pitch":26.666151,"speechRate":4.926,"hasEvents":false,"sentence_source":"那个时候我是那种跑出去跟男孩子打架呀，玩泥沙呀，这种跑到石头上跑到垃圾山去打架的都很多就打仗，我一直觉得玩的时间不够，我作业就花了花了花了，就随便对付几下就完了。","sentence_en":"Back then, I was the type to go out and fight with boys, play in the mud, climb on rocks and trash heaps to have battles. I always felt there wasn't enough time to play, so I'd rush through homework carelessly."},{"id":"171","start":1370.1,"end":1379.1,"displayStart":1370.1,"displayEnd":1379.1,"displayMid":1374.6,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.898365,"pitch":24.059864,"speechRate":4.667,"hasEvents":false,"sentence_source":"所以我没有觉得我还有什么缠在那里写作业的时间，后来再大一点我就觉得我看小说的时间都不够。","sentence_en":"So I never felt I had time to linger on homework. Later, when I got older, I felt I didn't even have enough time to read novels."},{"id":"172","start":1379.1,"end":1394.62,"displayStart":1379.1,"displayEnd":1394.62,"displayMid":1386.86,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.785703,"pitch":23.108944,"speechRate":4.475,"hasEvents":false,"sentence_source":"那个时候那种金庸啊 古龙啊 梁宇森的小说开始流行，我每天看小说的时间都不够，没有特别认真地去做，而且我会觉得我就这么对付着作作物，成绩也是可以的就那种。","sentence_en":"At that time, novels by Jin Yong, Gu Long, and Liang Yusheng became popular. I didn't have enough time to read them every day. I didn't take it very seriously, and I felt that even with my casual approach, my grades were still okay."},{"id":"173","start":1394.62,"end":1402.44,"displayStart":1394.62,"displayEnd":1402.44,"displayMid":1398.53,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.716089,"pitch":22.218012,"speechRate":3.581,"hasEvents":false,"sentence_source":"我妈说我小考最差 中考还可以，大考考的最好 纯粹是在应付的那种。","sentence_en":"My mom said I did worst on small exams, okay on midterms, and best on major exams—I was just coasting."},{"id":"174","start":1402.44,"end":1413.54,"displayStart":1402.44,"displayEnd":1413.54,"displayMid":1407.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":1.094077,"pitch":24.76693,"speechRate":4.414,"hasEvents":false,"sentence_source":"因为我在为你未来的成长 在寻找脉络，你现在两个最主要的身份 作家和两会上的代表提案，给我们很大的震撼跟影响。","sentence_en":"Because I'm trying to find the thread of your growth. Your two main identities now—writer and NPC deputy with proposals—have greatly impressed and influenced us."},{"id":"175","start":1413.54,"end":1418.3,"displayStart":1413.54,"displayEnd":1418.3,"displayMid":1415.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.178965,"pitch":23.553728,"speechRate":4.832,"hasEvents":false,"sentence_source":"那我想后来作为代表提案 那个脉络我开始比较清晰了。","sentence_en":"So I think later, as a deputy with proposals, that thread became clearer."},{"id":"176","start":1418.3,"end":1427.02,"displayStart":1418.3,"displayEnd":1427.02,"displayMid":1422.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.136492,"pitch":25.670103,"speechRate":5.549,"hasEvents":false,"sentence_source":"那作为作家蒋胜男 她的脉络我再找，还没有开始能够找到特别明确的那个起点，可能要在若干年之后才开始发生。","sentence_en":"As for the writer Jiang Shengnan, I'm still looking for her thread. I haven't found a clear starting point yet; it might only emerge after several years."},{"id":"177","start":1427.02,"end":1437.3,"displayStart":1427.02,"displayEnd":1437.3,"displayMid":1432.1599999999999,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.913417,"pitch":29.636332,"speechRate":4.069,"hasEvents":false,"sentence_source":"对对 我是什么时候开始写作呢，是工作了一段时间以后 慢慢的有一点厌倦，就每天的工作一层不变。","sentence_en":"Right, right. When did I start writing? After working for a while, I gradually got a bit bored—the daily work was monotonous."},{"id":"178","start":1437.3,"end":1445.32,"displayStart":1437.3,"displayEnd":1445.32,"displayMid":1441.31,"speaker":"Jiang Shengnan","speakerColor":"#A2 "clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.84058,"pitch":25.21394,"speechRate":4.752,"hasEvents":false,"sentence_source":"所以只有我学到了最后 然后跟一批朋友开始一起写诗词，写一段诗词以后就觉得诗词的范围比较狭窄 不足以表达。","sentence_en":"So only I stuck with it to the end. Then I started writing poetry with a group of friends. After a while, we felt poetry was too narrow to express what we wanted."},{"id":"183","start":1465.6,"end":1468.36,"displayStart":1465.6,"displayEnd":1468.36,"displayMid":1466.98,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.5,"loudness":0.808107,"pitch":19.969345,"speechRate":6.159,"hasEvents":false,"sentence_source":"其实我写作的兴趣是从那个时候开始的。","sentence_en":"Actually, my interest in writing began from that point."},{"id":"184","start":1468.36,"end":1472.64,"displayStart":1468.36,"displayEnd":1472.64,"displayMid":1470.5,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.954401,"pitch":25.928188,"speechRate":5.764,"hasEvents":false,"sentence_source":"然后我们就开始写闪文 写了一段时间闪文又觉得不够。","sentence_en":"Then we started writing flash fiction. After a while, that didn't feel enough either."},{"id":"185","start":1472.64,"end":1484.62,"displayStart":1472.64,"displayEnd":1484.62,"displayMid":1478.63,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.5,"loudness":0.834714,"pitch":21.063856,"speechRate":4.174,"hasEvents":true,"sentence_source":"然后我就开始想写小说 就这么开始写，我那个时候是第一步是手写 然后我那边朋友就盯着我，每天写完了他们就拿去看。","sentence_en":"Then I started thinking about writing a novel, and that's how I began. At first, I wrote by hand. My friends would keep an eye on me, and every day after I finished writing, they'd read it."},{"id":"186","start":1509.9,"end":1514.6,"displayStart":1509.9,"displayEnd":1514.6,"displayMid":1512.25,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.778489,"pitch":25.225281,"speechRate":22.553,"hasEvents":true,"sentence_source":"鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话蒋。","sentence_en":"Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Luyu dialogue Jiang."},{"id":"187","start":1514.6,"end":1521.54,"displayStart":1514.6,"displayEnd":1521.54,"displayMid":1518.07,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.851366,"pitch":22.383354,"speechRate":5.043,"hasEvents":false,"sentence_source":"1998 年 99 年的时候，99 年的时候 那个时候已经开始有互联网了，有BBS 了。","sentence_en":"Around 1998 or 1999, the internet was already around, and there were BBS forums."},{"id":"188","start":1521.54,"end":1526.68,"displayStart":1521.54,"displayEnd":1526.68,"displayMid":1524.1100000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.78303,"pitch":29.33378,"speechRate":4.119,"hasEvents":false,"sentence_source":"因为那个时候 温州既没有出版社，也没有杂志社。","sentence_en":"Because at that time, Wenzhou had neither publishing houses nor magazine publishers."},{"id":"189","start":1526.68,"end":1542.36,"displayStart":1526.68,"displayEnd":1542.36,"displayMid":1534.52,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.4,"loudness":0.921238,"pitch":23.118477,"speechRate":4.145,"hasEvents":false,"sentence_source":"所以我们也没有途径去投稿，当时就教我学诗词的一个老师，他那个时候是一个特别时髦的老头，他很早就开始上网，他是从都是时代就开始对电脑，包括上网。","sentence_en":"So we had no way to submit our work. At that time, a teacher who taught me poetry was a particularly trendy old man. He started using the internet very early, from the dial-up era, including computers and going online."},{"id":"190","start":1542.36,"end":1553.22,"displayStart":1542.36,"displayEnd":1553.22,"displayMid":1547.79,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.84055,"pitch":21.153166,"speechRate":4.42,"hasEvents":false,"sentence_source":"他都是我们温州那个时候，几乎是第一批 然后她告诉我怎么去上网怎么去上BBS，她当时在青云书院在诗词板块。","sentence_en":"We were among the first in Wenzhou. Then she taught me how to get online and use BBS. She was on the poetry board of Qingyun Academy."},{"id":"191","start":1553.22,"end":1556.5,"displayStart":1553.22,"displayEnd":1556.5,"displayMid":1554.8600000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.904842,"pitch":19.944696,"speechRate":5.488,"hasEvents":false,"sentence_source":"所以她说那边好像有个五小板块你去写写。","sentence_en":"So she said there was a micro-fiction board there and suggested I post my work."},{"id":"192","start":1556.5,"end":1558.74,"displayStart":1556.5,"displayEnd":1558.74,"displayMid":1557.62,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.681759,"pitch":15.554228,"speechRate":7.589,"hasEvents":false,"sentence_source":"因为我那个时候第一步就是五小小说嘛。","sentence_en":"Because my first attempts were micro-fiction stories."},{"id":"193","start":1558.74,"end":1560.72,"displayStart":1558.74,"displayEnd":1560.72,"displayMid":1559.73,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.690005,"pitch":19.663567,"speechRate":6.304,"hasEvents":false,"sentence_source":"然后我就开始在那边贴文。","sentence_en":"So I started posting my writing there."},{"id":"194","start":1560.72,"end":1572.54,"displayStart":1560.72,"displayEnd":1572.54,"displayMid":1566.63,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.76984,"pitch":25.417023,"speechRate":4.484,"hasEvents":false,"sentence_source":"那个时候还没有强烈的血作欲望，是我在工作以后工作到了最后每年的总结都差不多的时候，我会想我总得留点不一样的东西。","sentence_en":"At that time, I didn't have a strong urge to create. It was only after I started working, when yearly summaries all looked the same, that I thought I should leave behind something different."},{"id":"195","start":1572.54,"end":1583.76,"displayStart":1572.54,"displayEnd":1583.76,"displayMid":1578.15,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.819696,"pitch":25.946882,"speechRate":4.153,"hasEvents":false,"sentence_source":"我那个时候还没想到能出榜 能什么 我都不敢做出万想，我就是觉得我以前读的书 我积累的东西 我想的东西。","sentence_en":"Back then, I never thought about getting published or anything. I didn't dare to have big dreams. I just felt that with all the books I'd read and things I'd accumulated, I had something to say."},{"id":"196","start":1583.76,"end":1595,"displayStart":1583.76,"displayEnd":1595,"displayMid":1589.38,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.78028,"pitch":23.166201,"speechRate":4.574,"hasEvents":false,"sentence_source":"一年两年写一本书 到时候打印出来专定层册放到我的书架上，至少我会觉得这一年两年没有白过 你开始就是这样但这一。","sentence_en":"Write a book every year or two, print it out, bind it, and put it on my bookshelf. At least I'd feel those years weren't wasted. That was my initial idea."},{"id":"197","start":1595,"end":1605.3,"displayStart":1595,"displayEnd":1605.3,"displayMid":1600.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.923378,"pitch":25.391415,"speechRate":5.34,"hasEvents":false,"sentence_source":"切都是大学以后才发生的通，常我们高中 特别是大学期间，主要是大学 因为大学我们会认为基本的生学压力解决了在我们那个年代。","sentence_en":"All of this happened after college. Usually in high school and especially college—mainly college because we felt the basic academic pressure was over in our time."},{"id":"198","start":1605.3,"end":1616.86,"displayStart":1605.3,"displayEnd":1616.86,"displayMid":1611.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.942268,"pitch":24.150496,"speechRate":5.405,"hasEvents":false,"sentence_source":"那开始要培养一些兴趣 很多人的兴趣会在大学时候真正的萌芽真正的开始发生，但整个大学四年 你都没有想到写作可能是你的表达的一个渠道。","sentence_en":"So we started to cultivate interests. For many, interests truly sprout in college. But throughout my four years of college, I never thought writing could be a channel of expression."},{"id":"199","start":1616.86,"end":1632.42,"displayStart":1616.86,"displayEnd":1632.42,"displayMid":1624.6399999999999,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.884922,"pitch":27.100861,"speechRate":4.46,"hasEvents":false,"sentence_source":"没有 我那个时候就是说都看不完 我哪有时间自己想去写，而且那个时候觉得生活是无穷的未来吧，一直到工作以后会觉得可能我的生活就是这么枯燥无聊的上班。","sentence_en":"No, I had so much to read that I didn't have time to think about writing. And back then, life felt like an infinite future. It was only after starting work that I realized life might just be this boring, monotonous routine."},{"id":"200","start":1632.42,"end":1646.32,"displayStart":1632.42,"displayEnd":1646.32,"displayMid":1639.37,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.771113,"pitch":28.727549,"speechRate":3.885,"hasEvents":false,"sentence_source":"所以我才会去写，而且呢大学时期没有什么大的事情，工作的时候你会接触到社会的行星社社的人吧，跟我过去的想象是不一样的。","sentence_en":"That's why I started writing. Also, nothing major happened in college. Once I started working, I encountered all kinds of people in society, which was different from what I'd imagined."},{"id":"201","start":1646.32,"end":1652.04,"displayStart":1646.32,"displayEnd":1652.04,"displayMid":1649.1799999999998,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.747328,"pitch":22.239779,"speechRate":4.196,"hasEvents":false,"sentence_source":"所以我就会想我积累了很多很多想说想写的东西吧你刚。","sentence_en":"So I felt I had accumulated a lot I wanted to say and write."},{"id":"202","start":1652.04,"end":1660.1,"displayStart":1652.04,"displayEnd":1660.1,"displayMid":1656.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":1.00991,"pitch":23.682138,"speechRate":4.949,"hasEvents":false,"sentence_source":"才说的无穷的未来我喜欢这个描述，你在读大学之前对于未来的想象是什么 所谓的无穷未来。","sentence_en":"You just mentioned 'infinite future.' I like that description. What was your imagination of the future before college? That so-called infinite future."},{"id":"203","start":1660.1,"end":1669.6,"displayStart":1660.1,"displayEnd":1669.6,"displayMid":1664.85,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":0.957367,"pitch":28.543501,"speechRate":4.848,"hasEvents":false,"sentence_source":"无穷的未来 我觉得我将来最大的要求就是有一个属于自己的屋子，满房间的书架 然后我天天在那里看书。","sentence_en":"Infinite future: I thought my biggest wish was to have my own room filled with bookshelves, where I could read every day."},{"id":"204","start":1669.6,"end":1681.3,"displayStart":1669.6,"displayEnd":1681.3,"displayMid":1675.4499999999998,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.807335,"pitch":26.777264,"speechRate":4.68,"hasEvents":false,"sentence_source":"然后我有空的时候出去旅游 跟朋友在一起，这就是我想象的无穷的未来，但后来工作以后你会发现会是一个很受挫的一个状态。","sentence_en":"And when I had free time, travel and hang out with friends. That was my imagined infinite future. But later, after starting work, you find it's quite a frustrating state."},{"id":"205","start":1681.3,"end":1688.32,"displayStart":1681.3,"displayEnd":1688.32,"displayMid":1684.81,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.3,"loudness":0.748643,"pitch":21.656858,"speechRate":4.558,"hasEvents":false,"sentence_source":"也就是你觉得引以致好的东西都不算什么，我作为学生我可以不搭理任何人。","sentence_en":"So you think even good things don't matter. As a student, I can ignore anyone."},{"id":"206","start":1688.32,"end":1692.1,"displayStart":1688.32,"displayEnd":1692.1,"displayMid":1690.21,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.72125,"pitch":22.013384,"speechRate":5.026,"hasEvents":false,"sentence_source":"但是你作为一个职场的人，人家会对你有要求。","sentence_en":"But as a working professional, people have expectations of you."},{"id":"207","start":1692.1,"end":1705.9,"displayStart":1692.1,"displayEnd":1705.9,"displayMid":1699,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.870717,"pitch":25.354776,"speechRate":4.32,"hasEvents":false,"sentence_source":"所以我第一步五下小时，他们会觉得小说中充满了很大的愤怒，后来我也发现绝大多数的学生，刚走入职场的头三年，一定是内心充满愤怒的。","sentence_en":"So my first step—they'd think the novel is full of anger. Later I also found that most students, in their first three years in the workplace, are definitely filled with anger."},{"id":"208","start":1705.9,"end":1711.78,"displayStart":1705.9,"displayEnd":1711.78,"displayMid":1708.8400000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.828998,"pitch":23.750114,"speechRate":3.741,"hasEvents":false,"sentence_source":"所以那个情绪初始我开始写作，这种愤怒的情绪在此。","sentence_en":"So I started writing with that initial emotion, and that anger is right there."},{"id":"209","start":1711.78,"end":1713.36,"displayStart":1711.78,"displayEnd":1713.36,"displayMid":1712.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.774527,"pitch":18.088722,"speechRate":4.605,"hasEvents":false,"sentence_source":"之前你体会过吗?","sentence_en":"Have you experienced it before?"},{"id":"210","start":1714.44,"end":1724.74,"displayStart":1714.44,"displayEnd":1724.74,"displayMid":1719.5900000000001,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.852318,"pitch":24.261484,"speechRate":4.466,"hasEvents":true,"sentence_ to face as a student stepping into society."},{"id":"214","start":1760.78,"end":1770.16,"displayStart":1760.78,"displayEnd":1770.16,"displayMid":1765.47,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.770174,"pitch":17.944874,"speechRate":3.64,"hasEvents":false,"sentence_source":"但是当时就会觉得特别愤怒 特别不解，特别无错 特别想找一个角落去发出声音来。","sentence_en":"But at the time, I felt so angry, confused, and helpless, and I just wanted to find a corner to speak out."},{"id":"215","start":1771.06,"end":1775.02,"displayStart":1771.06,"displayEnd":1775.02,"displayMid":1773.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":1.052332,"pitch":23.757008,"speechRate":5.607,"hasEvents":true,"sentence_source":"像我们这一代人 包括可能从我们开始每一代学生。","sentence_en":"For our generation—and perhaps every generation of students after us—"},{"id":"216","start":1775.02,"end":1785.36,"displayStart":1775.02,"displayEnd":1785.36,"displayMid":1780.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":1.023165,"pitch":22.077719,"speechRate":5.319,"hasEvents":false,"sentence_source":"我们走向社会的第一个特别重要的人生节点 就是高考，如果成绩好的话 选择一个大学 选择一个你心里面觉得还不错的心仪的专业。","sentence_en":"The first major life milestone when entering society is the college entrance exam. If you do well, you choose a university and a major you feel good about."},{"id":"217","start":1785.36,"end":1789.56,"displayStart":1785.36,"displayEnd":1789.56,"displayMid":1787.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":1.075587,"pitch":26.723537,"s ess","sentiment_en":"Neutral","score":0,"loudness":0.902174,"pitch":22.9065,"speechRate":4.611,"hasEvents":false,"sentence_source":"像你是一个性格在我看来很强，很勇于表达的一个女孩，但当你妈妈跟你说 可能要从现实考量 学中文 未来找工作 肯定不如学财快要稳。","sentence_en":"You seem like a very strong and outspoken girl to me. But when your mom told you to be practical—that studying Chinese wouldn't be as stable as accounting for job prospects."},{"id":"226","start":1852.6,"end":1855.62,"displayStart":1852.6,"displayEnd":1855.62,"displayMid":1854.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.062861,"pitch":23.408077,"speechRate":6.427,"hasEvents":false,"sentence_source":"那个时候你没有本能的想要抗争一下嘛。","sentence_en":"At that time, didn't you instinctively want to fight back?"},{"id":"227","start":1855.62,"end":1867.88,"displayStart":1855.62,"displayEnd":1867.88,"displayMid":1861.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":1.030435,"pitch":24.29995,"speechRate":5.777,"hasEvents":false,"sentence_source":"因为我现在回想 我当时从小我就非常抗拒来自我身边的附近对我的要求，比如说我爸妈要求我做什么 要求我学什么 我完全不能结束，我必须要按照我的想法去做。","sentence_en":"Because looking back now, since I was a kid, I've always strongly resisted demands from people close to me. For example, when my parents wanted me to do something or learn something, I absolutely couldn't accept it; I had to do it my way."},{"id":"228","start":1867.88,"end":1873.96,"displayStart":1867.88,"displayEnd":1873.96,"displayMid":1870.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.030642,"pitch":25.259186,"speechRate":5.336,"hasEvents":false,"sentence_source":"反而离我远一点的那种要求跟束缚 我会觉得 因为离我远跟我没什么关系。","sentence_en":"On the other hand, demands and restrictions from people far away from me—I felt they didn't matter because they were distant."},{"id":"229","start":1873.96,"end":1879.96,"displayStart":1873.96,"displayEnd":1879.96,"displayMid":1876.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.992155,"pitch":21.501472,"speechRate":5.935,"hasEvents":false,"sentence_source":"所以我在好奇来自英语身边最近的这种束缚跟要求，你没有本能的要反抗一下。","sentence_en":"So I'm curious—why didn't you instinctively rebel against the constraints and demands from those closest to you?"},{"id":"230","start":1880.64,"end":1882.94,"displayStart":1880.64,"displayEnd":1882.94,"displayMid":1881.79,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.876733,"pitch":23.381273,"speechRate":5.251,"hasEvents":false,"sentence_source":"我觉得她说的是有道理的。","sentence_en":"I think she makes sense."},{"id":"231","start":1882.94,"end":1885.66,"displayStart":1882.94,"displayEnd":1885.66,"displayMid":1884.3000000000002,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.670684,"pitch":33.784943,"speechRate":5.085,"hasEvents":false,"sentence_source":"因为我们读初中高中的时候。","sentence_en":"Because when we were in middle and high school."},{"id":"232","start":1885.66,"end":1894.08,"displayStart":1885.66,"displayEnd":1894.08,"displayMid":1889.87,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Wenzhou Culture and Business Traditions","sentiment_en":"Neutral","score":0,"loudness":0.788627,"pitch":24.037601,"speechRate":4.632,"hasEvents":false,"sentence_source":"那个时候是小商品经济发展的时候，温州的物价变得非常的高，就是官评工资是没办法维持的。","sentence_en":"That was when the small commodity economy was booming or them?"},{"id":"258","start":2114.22,"end":2123.6,"displayStart":2114.22,"displayEnd":2123.6,"displayMid":2118.91,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.846297,"pitch":19.880432,"speechRate":4.077,"hasEvents":false,"sentence_source":"所以我那个时候大概也是因为，我姐姐是去证写委员，她有时候要找题材我就开始去写了。","sentence_en":"Back then, probably because my sister was on the proofreading committee and sometimes needed material, I started writing."},{"id":"259","start":2123.6,"end":2126.82,"displayStart":2123.6,"displayEnd":2126.82,"displayMid":2125.21,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.89864,"pitch":24.575367,"speechRate":5.872,"hasEvents":false,"sentence_source":"那个时候我还是青年委员也是要写一些。","sentence_en":"At that time, I was also a youth committee member and had to write some things too."},{"id":"260","start":2126.82,"end":2141.22,"displayStart":2126.82,"displayEnd":2141.22,"displayMid":2134.02,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.826563,"pitch":21.192673,"speechRate":4.5,"hasEvents":false,"sentence_source":"那个时候真的是有说不完的东西吧，恰恰是因为写作，让我既要站在主角的方面去思考，也要站在别人那么深，我那时候只是看书的话完全是分闭自己的。","sentence_en":"Back then, I really had endless things to say. Writing forced me to think not only from the protagonist's perspective but also from others' deeply. When I was just reading, I was completely closed off."},{"id":"261","start":2141.22,"end":2151.18,"displayStart":2141.22,"displayEnd":2151.18,"displayMid":2146.2,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":0.862688,"pitch":24.926363,"speechRate":4.111,"hasEvents":false,"sentence_source":"反而是开始写作的时候，我能更加心平气和地去看周围的一些事情，我才会关注别人的这种情绪。","sentence_en":"It wasn't until I started writing that I could calmly observe things around me and pay attention to others' emotions."},{"id":"262","start":2151.18,"end":2157.02,"displayStart":2151.18,"displayEnd":2157.02,"displayMid":2154.1,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.709431,"pitch":20.83954,"speechRate":3.296,"hasEvents":true,"sentence_source":"然后再关注整个社会更多的其他人的状态吧。","sentence_en":"And then I started paying attention to the state of more people in society as a whole."},{"id":"263","start":2157.02,"end":2168.78,"displayStart":2157.02,"displayEnd":2168.78,"displayMid":2162.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.984409,"pitch":24.69717,"speechRate":4.62,"hasEvents":false,"sentence_source":"我很好奇 我从来没有从一个写作者的角度去想，比如说作为读者 有的人会喜欢读武侠 我喜欢读真探悬疑 有的人喜欢读严情。","sentence_en":"I'm curious—I've never thought from a writer's perspective. As a reader, some people like wuxia, some like detective mysteries, some like serious fiction."},{"id":"264","start":2168.78,"end":2176.12,"displayStart":2168.78,"displayEnd":2176.12,"displayMid":2172.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.985586,"pitch":26.225241,"speechRate":5.351,"hasEvents":true,"sentence_source":"这好像是基于个人的一种文学的审美 你会本能的摘取你喜欢的那一类的文学作品去读。","sentence_en":"It seems like a personal literary taste—you instinctively pick the kind of literature you like to read."},{"id":"265","start":2176.12,"end":2182.2,"displayStart":2176.12,"displayEnd":2182.2,"displayMid":2179.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":1.098955,"pitch":23.88624,"speechRate":5.97,"hasEvents":true,"sentence_source":"那作为一个创作者 她怎么会本能地找到最适合我最愿意去书写的那个文学类型。","sentence_en":"But as a creator, how does she instinctively find the literary genre that suits her best and she wants to write the most?"},{"id":"266","start":2182.74,"end":2188.16,"displayStart":2182.74,"displayEnd":2188.16,"displayMid":2185.45,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.871064,"pitch":27.903189,"speechRate":4.869,"hasEvents":false,"sentence_source":"因为我们读书的时候 正好是金庸梁宇森 古龙这些武侠作家。","sentence_en":"When we were studying, it was the era of Jin Yong, Liang Yusheng, Gu Long—these wuxia writers."},{"id":"267","start":2188.16,"end":2201.48,"displayStart":2188.16,"displayEnd":2201.48,"displayMid":2194.8199999999997,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.7,"loudness":0.832067,"pitch":23.048756,"speechRate":3.679,"hasEvents":false,"sentence_source":"我觉得武侠比那些年轻好看的多 他的整个世界更加顺利多彩，他的人物更加的立体吩咐 所以我一开始写也是写武侠。","sentence_en":"A representative moment about writing, literary creation, and reading."},{"id":"268","start":2201.48,"end":2214.2,"displayStart":2201.48,"displayEnd":2214.2,"displayMid":2207.84,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.85736,"pitch":25.253725,"speechRate":4.634,"hasEvents":false,"sentence_source":"鞋舞侠是因为我们过去看了很多的舞侠，就是都是写少侠跟魔头斗争的时候被魔头的女儿救了，最后少侠把魔头杀了 然后跟着女侠走了。","sentence_en":"The wuxia we read was always about a young hero fighting a demon lord, getting saved by the demon lord's daughter, then killing the demon lord and running off with the female knight."},{"id":"269","start":2214.2,"end":2217.06,"displayStart":2214.2,"displayEnd":2217.06,"displayMid":2215.63,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Negative","score":-0.3,"loudness":0.621285,"pitch":23.404142,"speechRate":5.725,"hasEvents":false,"sentence_source":"然后没人再提这个魔头的女儿去哪了。","sentence_en":"No one ever mentioned what happened to the demon lord's daughter."},{"id":"270","start":2217.16,"end":2229.6,"displayStart":2217.16,"displayEnd":2229.6,"displayMid":2223.38,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.5,"loudness":0.811648,"pitch":20.445707,"speechRate":4.701,"hasEvents":false,"sentence_source":"所以我第一小说一开篇就是少侠杀了魔头，跟着女侠在一起了 然后魔头的女儿怎么办，这个魔头的女儿后面的故事是我写的第一个故事。","sentence_en":"So my first novel starts with the hero killing the demon lord and being with the female knight—and then what about the demon lord's daughter? Her story is the first one I wrote."},{"id":"271","start":2229.6,"end":2234.68,"displayStart":2229.6,"displayEnd":2234.68,"displayMid":2232.14,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.820567,"pitch":20.948931,"speechRate":4.134,"hasEvents":false,"sentence_source":"所以我会写一些从我看过的小说的另一种方向去。","sentence_en":"So I wrote from a different angle than the novels I'd read."},{"id":"272","start":2234.68,"end":2237.64,"displayStart":2234.68,"displayEnd":2237.64,"displayMid":2236.16,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.823628,"pitch":17.413912,"speechRate":4.054,"hasEvents":false,"sentence_source":"然后我写了几年的武侠想说。","sentence_en":"Then I wrote wuxia for a few years."},{"id":"273","start":2237.64,"end":2244.46,"displayStart":2237.64,"displayEnd":2244.46,"displayMid":2241.05,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.6,"loudness":0.706596,"pitch":16.850256,"speechRate":4.839,"hasEvents":false,"sentence_source":"那么中间有一些故事不可避免的就带有历史，我自己是从小就特别喜欢历史的。","sentence_en":"Some stories inevitably involved history. I've loved history since I was a kid."},{"id":"274","start":2244.46,"end":2252.54,"displayStart":2244.46,"displayEnd":2252.54,"displayMid":2248.5,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.5,"loudness":0.879742,"pitch":24.163733,"speechRate":3.711,"hasEvents":false,"sentence_source":"因为我小时候看电视剧都是历史，像唐明华 武则天 这些又是很好看的。","sentence_en":"Because the TV shows I watched as a child were all historical, like 'Tang Ming Huang' and 'Wu Zetian'—and they were very entertaining."},{"id":"275","start":2252.54,"end":2261.86,"displayStart":2252.54,"displayEnd":2261.86,"displayMid":2257.2,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.7,"loudness":0.838175,"pitch":22.251337,"speechRate":4.79,"hasEvents":false,"sentence_source":"对于我来说就是俊男美女的都是那种眩丽多彩的，浮画到特别美的 然后中间还有历史的故事特别精彩的。","sentence_en":"The conversation connects literature & art with career & creation."},{"id":"276","start":2261.86,"end":2277.04,"displayStart":2261.86,"displayEnd":2277.04,"displayMid":2269.45,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.6,"loudness":0.782695,"pitch":18.516497,"speechRate":4.117,"hasEvents":false,"sentence_source":"其实一直想写 但是我当时会觉得我够资格写嘛 我能写好吗，一直到我写武侠小说出了好几本以后 我就有信心，我能写完一篇作品 能写完一个小说。","sentence_en":"I had always wanted to write, but I kept wondering whether I was qualified and whether I could do it well. Only after writing several martial-arts novels did I gain the confidence that I could complete a full work."},{"id":"277","start":2277.04,"end":2291.94,"displayStart":2277.04,"displayEnd":2291.94,"displayMid":2284.49,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.5,"loudness":0.805907,"pitch":20.424719,"speechRate":4.561,"hasEvents":false,"sentence_source":"而且我的小说有人看 有人买 所以我就开始写历史小说，中间其实也是物侠也写过 玄幻也写过 颜琴也写过，中间还是去各种论坛 去用各种七七八八的那种笔名写。","sentence_en":"And my novels have readers and buyers, so I started writing historical fiction. Along the way, I also wrote martial arts, fantasy, and romance novels, and I used various pen names on different forums."},{"id":"278","start":2291.94,"end":2294.54,"displayStart":2291.94,"displayEnd":2294.54,"displayMid":2293.24,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":0.831096,"pitch":19.760283,"speechRate":4.231,"hasEvents":false,"sentence_source":"各种奇怪的东西 也都写过。","sentence_en":"I also wrote all kinds of strange things."},{"id":"279","start":2294.54,"end":2306.5,"displayStart":2294.54,"displayEnd":2306.5,"displayMid":2300.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.6,"loudness":1.133798,"pitch":24.752625,"speechRate":5.714,"hasEvents":false,"sentence_source":"我记得后来你说过 你说在所有的朝代里面让你书写的话，你最爱的是宋朝 对这个，是你从上学 我们上学那时候学历史课，就形成了一种对这个朝代有特殊的爱好。","sentence_en":"I remember you once said that if you could write about any dynasty, your favorite would be the Song Dynasty. Is that something from your school days—learning history and developing a special fondness for it?"},{"id":"280","start":2306.5,"end":2311.54,"displayStart":2306.5,"displayEnd":2311.54,"displayMid":2309.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Positive","score":0.6,"loudness":1.011609,"pitch":20.257448,"speechRate":4.96,"hasEvents":false,"sentence_source":"还是后来写作以后 慢慢慢慢对宋朝有了更多的了解和喜爱。","sentence_en":"Or did you gradually come to understand and love the Song Dynasty more after you started writing?"},{"id":"281","start":2311.54,"end":2314.22,"displayStart":2311.54,"displayEnd":2314.22,"displayMid":2312.88,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Creation and Literary Reading","sentiment_en":"Neutral","score":0,"loudness":1.150918,"pitch":30.819874,"speechRate":4.132,"hasEvents":false,"sentence_source":"其实就是在读书的时候。","sentence_en":"Actually, it was during my school days."},{"id":"282","start":2314.22,"end":2325.06,"displayStart":2314.22,"displayEnd":2325.06,"displayMid":2319.64,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.865637,"pitch":23.149559,"speechRate":4.151,"hasEvents":false,"sentence_source":"因为那个时候我们就看得出来，宋代四名经济会比较发达，它不像唐代是一种盟伐或者是怎么样的一个状态。","sentence_en":"Because even then we could see that the Song Dynasty had a relatively developed economy and wasn't like the Tang Dynasty's expansionist state."},{"id":"283","start":2325.06,"end":2338.86,"displayStart":2325.06,"displayEnd":2338.86,"displayMid":2331.96,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Positive","score":0.6,"loudness":0.843522,"pitch":27.083002,"speechRate":4.13,"hasEvents":false,"sentence_source":"我们以前看宋代的那种画本，包括《清明上河图》啊，《东京梦华路》啊，这些看了以后你会发现，就是整个宋代的老百姓，市井文化还是比较开心的。","sentence_en":"When we looked at Song Dynasty illustrated books, including 'Along the River During the Qingming Festival' and 'The Eastern Capital: A Dream of Splendor,' you could see that the common people and street culture were quite cheerful."},{"id":"284","start":2338.86,"end":2352.1,"displayStart":2338.86,"displayEnd":2352.1,"displayMid":2345.48,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Positive","score":0.7,"loudness":0.799481,"pitch":22.154963,"speechRate":4.385,"hasEvents":false,"sentence_source":"包括宋代是不杀读书人、不杀文成的，我会觉得在那个时代作为一个读书人 也把作为一个普通人也把他的自由度和幸福质会比较高一点。","sentence_en":"Also, the Song Dynasty didn't kill scholars or literati. I felt that as a scholar or even an ordinary person in that era, you had a higher degree of freedom and happiness."},{"id":"285","start":2352.1,"end":2365.08,"displayStart":2352.1,"displayEnd":2365.08,"displayMid":2358.59,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.86308,"pitch":20.4582,"speechRate":4.7,"hasEvents":false,"sentence_source":"包括我写历史小说 我第一个时代就是写宋代，不是说我想写刘儿 想提刘儿方案，我第一本书就是《分八九天》 就是写刘儿的，我是想写宋代 我想写北宋。","sentence_en":"And when I wrote historical novels, my first dynasty was the Song Dynasty. Not because I wanted to write about Liu'er—my first book was 'Fen Ba Jiu Tian,' about Liu'er. I wanted to write about the Song Dynasty, specifically the Northern Song."},{"id":"286","start":2365.08,"end":2378.96,"displayStart":2365.08,"displayEnd":2378.96,"displayMid":2372.02,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.818264,"pitch":19.870705,"speechRate":4.126,"hasEvents":false,"sentence_source":"那么我就会想写谁好，正好是写太宗 珍宗 仁宗 山草，我都是先想时代再去想人物的，就包括写芈月壮 我也不是想写芈月，我是想写春秋藏国。","sentence_en":"Then I think about who to write about. I always consider the era first, then the characters—like with Taizong, Zhenzong, Renzong, Shancao. Even with The Legend of Mi Yue, I didn't set out to write about her; I wanted to write about the Spring and Autumn and Warring States period."},{"id":"287","start":2379.62,"end":2390.76,"displayStart":2379.62,"displayEnd":2390.76,"displayMid":2385.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.976206,"pitch":26.279129,"speechRate":5.97,"hasEvents":false,"sentence_source":"然后在你的作品里面你也说过，你说比如说爱情 她就是个延伸，就说到芈月壮 她最后爱没有成为她的归宿，人都是这样的，看电影 你很想看到个大团圆结局。","sentence_en":"In your works, you've said that love is just an extension. In The Legend of Mi Yue, love didn't become her final destination. People are like that—when watching a movie, you really want a happy ending."},{"id":"288","start":2390.76,"end":2392.98,"displayStart":2390.76,"displayEnd":2392.98,"displayMid":2391.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Negative","score":-0.3,"loudness":1.010099,"pitch":24.602249,"speechRate":5.911,"hasEvents":false,"sentence_source":"但是你有很怕有大团圆结局。","sentence_en":"But you're also afraid of a happy ending."},{"id":"289","start":2392.98,"end":2399.04,"displayStart":2392.98,"displayEnd":2399.04,"displayMid":2396.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Negative","score":-0.4,"loudness":1.121906,"pitch":28.689526,"speechRate":6.728,"hasEvents":false,"sentence_source":"因为你明白一旦大团圆 她就是个套路，这个跟我们内心的向往其实你明白意识不应该是那样的。","sentence_en":"Because you know that once it's a happy ending, it's a cliché. Deep down, you understand that our consciousness shouldn't be like that."},{"id":"290","start":2399.04,"end":2410.04,"displayStart":2399.04,"displayEnd":2410.04,"displayMid":2404.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.992605,"pitch":23.678677,"speechRate":5.901,"hasEvents":true,"sentence_source":"所以你在比如一些蜜月转的时候，爱情不是最后的归宿，它只是一个延伸，这一点是你从一开始创作的，就是你的一个创作审美，是你对生活就是如此看待的。","sentence_en":"So when writing something like The Legend of Mi Yue, love is not the final destination; it's just an extension. This has been your creative aesthetic from the start, how you view life."},{"id":"291","start":2410.52,"end":2412.74,"displayStart":2410.52,"displayEnd":2412.74,"displayMid":2411.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":1.138788,"pitch":32.362812,"speechRate":5.856,"hasEvents":true,"sentence_source":"我觉得，爱情从来不是一个归宿。","sentence_en":"I think love is never a destination."},{"id":"292","start":2412.74,"end":2422.26,"displayStart":2412.74,"displayEnd":2422.26,"displayMid":2417.5,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Negative","score":-0.4,"loudness":0.85361,"pitch":26.23365,"speechRate":4.832,"hasEvents":false,"sentence_source":"因为我的第一本小说《魔道风云》，就是说写《魔头的女人》，后来她也遇上了一个爱情，但最后还是一个悲剧性的结尾。","sentence_en":"My first novel, The Demonic Way—about 'The Demon's Woman'—she later encounters love, but it ends tragically."},{"id":"293","start":2422.26,"end":2434.98,"displayStart":2422.26,"displayEnd":2434.98,"displayMid":2428.62,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Positive","score":0.5,"loudness":0.799036,"pitch":24.228292,"speechRate":4.167,"hasEvents":false,"sentence_source":"我就觉得爱情其实是有过就足够了并不说一定要大团圆的结局，只要这个过程足够精彩也是好的，也包括我在写敏玥传的时候。","sentence_en":"I feel that having experienced love is enough; it doesn't have to have a happy ending. As long as the process is brilliant enough, that's good. This also applies when I wrote The Legend of Min Yue."},{"id":"294","start":2434.98,"end":2444.84,"displayStart":2434.98,"displayEnd":2444.84,"displayMid":2439.91,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.871921,"pitch":24.546944,"speechRate":5.005,"hasEvents":false,"sentence_source":"因为我先想到的是一个大时代，就是春秋战国它有很多值得写的敏玥，我在设计环节的时候不是为了给敏玥谈恋爱的。","sentence_en":"Because I first thought of a grand era—the Spring and Autumn and Warring States period, which has many aspects worth writing about. When designing the plot, it wasn't to give Min Yue a love story."},{"id":"295","start":2444.84,"end":2458.06,"displayStart":2444.84,"displayEnd":2458.06,"displayMid":2451.45,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.823485,"pitch":23.920969,"speechRate":4.716,"hasEvents":false,"sentence_source":"因为我当时在搜集资料的时候，我对吴紫虚和申包虚的故事特别感兴趣，这也是我一开始想写的故事，到写敏玥的时候我就觉得，敏玥最后是罚楚的。","sentence_en":"When I was gathering materials, I was especially interested in the story of Wu Zixu and Shen Baoxu. That was what I initially wanted to write. When writing Min Yue, I felt that she would eventually attack Chu."},{"id":"296","start":2458.06,"end":2469.54,"displayStart":2458.06,"displayEnd":2469.54,"displayMid":2463.8,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"cluste vents":false,"sentence_source":"因为你周边没有一个会赞成你的声音，包括你周边的妈妈奶奶们，她不会认为你可以这样去想，你甚至自己这样去想你就觉得很不应该。","sentence_en":"Because not a single voice around you agrees with you, including your mothers and grandmothers. They wouldn't think you could think that way, and even you yourself feel it's very wrong to think that way."},{"id":"331","start":2791.7,"end":2798.8,"displayStart":2791.7,"displayEnd":2798.8,"displayMid":2795.25,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Positive","score":0.6,"loudness":0.70834,"pitch":21.580364,"speechRate":4.51,"hasEvents":false,"sentence_source":"但是忽然间互联网上让你看到很多人都这么想，你就忽然会有不一样的感觉。","sentence_en":"But suddenly, on the internet, you see that many people think the same way, and you have a different feeling."},{"id":"332","start":2798.8,"end":2804.8,"displayStart":2798.8,"displayEnd":2804.8,"displayMid":2801.8,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Positive","score":0.5,"loudness":0.682517,"pitch":20.479324,"speechRate":4.891,"hasEvents":false,"sentence_source":"所以2000年以后互联网的发展会对很多人的女性光发生改变。","sentence_en":"So after 2000, the development of the internet changed many women's perspectives."},{"id":"333","start":2804.8,"end":2818.66,"displayStart":2804.8,"displayEnd":2818.66,"displayMid":2811.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family Education and Intimate Relationships","sentiment_en":"Neutral","score":0,"loudness":0.911939,"pitch":23.278307,"speechRate":5.716,"hasEvents":false,"sentence_source":"可能每一个稍微超越自己时代的人，特别是女性总是要做一定程度的离惊叛道的人，现在回想起来我觉得某种程度我可能也是个离境叛道的人，你觉得你当年是个离境叛道的人吗。","sentence_en":"Maybe every person who is slightly ahead of their time, especially women, has to be somewhat unconventional. Looking back now, I think to some extent I might have been an unconventional person. Do you think you were an unconventional person back then?"},{"id":"334","start":2818.66,"end":2821.8,"displayStart":2818.66,"displayEnd":2821.8,"displayMid":2820.23,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.99963,"pitch":24.064365,"speechRate":6.798,"hasEvents":false,"sentence_source":"很奇怪 我从来没有觉得我是个离境叛道的人。","sentence_en":"Strange, I never thought I was an unconventional person."},{"id":"335","start":2824.11,"end":2829.55,"displayStart":2824.11,"displayEnd":2829.55,"displayMid":2826.83,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Positive","score":0.5,"loudness":0.862277,"pitch":27.250076,"speechRate":5.023,"hasEvents":false,"sentence_source":"可能就是因为我在我的家庭里头，我爸爸妈妈不觉得我离境叛道。","sentence_en":"Maybe because in my family, my parents didn't think I was unconventional."},{"id":"336","start":2829.55,"end":2832.27,"displayStart":2829.55,"displayEnd":2832.27,"displayMid":2830.91,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Growth and Gender Concepts","sentiment_en":"Neutral","score":0,"loudness":0.728991,"pitch":24.894024,"speechRate":5.882,"hasEvents":false,"sentence_source":"所以我就不会觉得我自己离境叛道啊。","sentence_en":"So I didn't feel that I was unconventional."},{"id":"337","start":2832.27,"end":2843.51,"displayStart":2832.27,"displayEnd":2843.51,"displayMid":2837.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.983599,"pitch":24.999683,"speechRate":5.105,"hasEvents":false,"sentence_source":"那这样我们跳出来，用第三方式脚来审视，你如今看当年自己曾经走过的每一步，她一定是有超出那个年代绝大多数的常规的那个地方。","sentence_en":"So let's step back and examine from a third-person perspective. When you look at every step you took back then, there must be something that exceeded the norms of that era."},{"id":"338","start":2843.51,"end":2847.91,"displayStart":2843.51,"displayEnd":2847.91,"displayMid":2845.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.001457,"pitch":26.241009,"speechRate":5.959,"hasEvents":false,"sentence_source":"如果有超出的话可能那个就是当年的那个小小的历经判斗。","sentence_en":"If there is something exceeding, that might have been that small act of unconventionality back then."},{"id":"339","start":2847.91,"end":2853.09,"displayStart":2847.91,"displayEnd":2853.09,"displayMid":2850.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.80004,"pitch":23.00852,"speechRate":3.622,"hasEvents":false,"sentence_source":"所以，现在回想起来我是自己看自己会发现。","sentence_en":"So looking back now, when I examine myself, I realize."},{"id":"340","start":2853.09,"end":2867.19,"displayStart":2853.09,"displayEnd":2867.19,"displayMid":2860.1400000000003,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.788348,"pitch":19.631142,"speechRate":4.789,"hasEvents":false,"sentence_source":"原来我是个很历经判斗的小孩，或者是我这成长当中做了很多历经判斗的事，但我那时候可不认为自己甚至很大了，包括工作以后我都觉得我可乖了 我可懂事了。","sentence_en":"It turns out I was a pretty rebellious kid, or at least I did a lot of rebellious things growing up, but at that time I didn’t think of myself as rebellious—even after I started working, I still thought I was well-behaved and sensible."},{"id":"341","start":2867.19,"end":2881.91,"displayStart":2867.19,"displayEnd":2881.91,"displayMid":2874.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.049033,"pitch":25.9375,"speechRate":4.721,"hasEvents":true,"sentence_source":"我告诉你 我越来越发现所有的真正的叛逆就是乖着来的，让你看到的叛逆不叫叛逆，所有的真正叛逆是在不知道的过程当中，在那个水底之下按流涌动当中完成的。","sentence_en":"I increasingly feel that real rebellion often arrives through obedience. The rebellion you can see is not the real one; true rebellion happens quietly, underneath the surface, like an undercurrent."},{"id":"342","start":2881.91,"end":2894.49,"displayStart":2881.91,"displayEnd":2894.49,"displayMid":2888.2,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.943725,"pitch":25.10531,"speechRate":3.427,"hasEvents":true,"sentence_source":"因为我觉得我从小就是这样子的，比如说我吃药特别的乖 我打针特别的乖，学习混着混着也过去了。","sentence_en":"Because I think I've been like this since I was a child. For example, I take medicine very obediently, I get injections very obediently, and I muddle through my studies."},{"id":"343","start":2894.49,"end":2905.79,"displayStart":2894.49,"displayEnd":2905.79,"displayMid":2900.14,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.924297,"pitch":21.76186,"speechRate":5.487,"hasEvents":false,"sentence_source":"现在看来我两个姐姐才是乖的 我从小就让我爸妈很头痛，我在学校打架啊 我有时候作业不完成什么东西，我妈现在也提起来就是觉得你从小就不乖。","sentence_en":"Now I see that my two older sisters were the well-behaved ones. I gave my parents headaches since childhood—I would get into fights at school, sometimes not finish homework, and so on. Even now my mom brings it up, thinking I was never well-behaved as a child."},{"id":"344","start":2905.79,"end":2908.99,"displayStart":2905.79,"displayEnd":2908.99,"displayMid":2907.39,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.056448,"pitch":23.867863,"speechRate":5.735,"hasEvents":false,"sentence_source":"但是我为什么自我感觉我从小就乖呢。","sentence_en":"But why did I always feel that I was well-behaved since childhood?"},{"id":"345","start":2908.99,"end":2917.37,"displayStart":2908.99,"displayEnd":2917.37,"displayMid":2913.18,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.731966,"pitch":21.791332,"speechRate":4.207,"hasEvents":true,"sentence_source":"因为家里没有否定你 父母没有否定你，你就不会觉得自己不乖，其他人对我又不重要。","sentence_en":"Because my family never denied me—my parents never denied me—so I never felt like I was naughty. Other people’s opinions didn’t matter to me."},{"id":"346","start":2917.89,"end":2928.39,"displayStart":2917.89,"displayEnd":2928.39,"displayMid":2923.14,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.7,"loudness":0.790701,"pitch":24.876486,"speechRate":4.571,"hasEvents":true,"sentence_source":"其实是在一个比较有爱的环境下，你不会否定自己 你没有那种不配得感啊，比如说包括我说追求事业和爱情的时候。","sentence_en":"Actually, growing up in a loving environment, you don’t deny yourself—you don’t have that sense of unworthiness. For example, when it came to pursuing my career and love life..."},{"id":"347","start":2928.39,"end":2932.19,"displayStart":2928.39,"displayEnd":2932.19,"displayMid":2930.29,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Positive","score":0.8,"loudness":0.894309,"pitch":26.394283,"speechRate":5.789,"hasEvents":false,"sentence_source":"我觉得我妈什么时候都会赞成肯定追求事业更重要。","sentence_en":"I felt that my mom would always agree and affirm that pursuing a career is more important."},{"id":"348","start":2932.19,"end":2934.85,"displayStart":2932.19,"displayEnd":2934.85,"displayMid":2933.52,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.839775,"pitch":28.426073,"speechRate":5.639,"hasEvents":true,"sentence_source":"所以我从来没有觉得我在里面判断。","sentence_en":"So I never felt that I had to make a choice between them."},{"id":"349","start":2935.37,"end":2950.07,"displayStart":2935.37,"displayEnd":2950.07,"displayMid":2942.7200000000003,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.898664,"pitch":28.803743,"speechRate":5.121,"hasEvents":true,"sentence_source":"但是实际上我最大的一个东西就是，长大以后才发现世界跟我想象的不一样，每个人的家庭并不像我们家的家庭一样，每个人的相反跟我爸妈其实不一样，包括我周边朋友或者亲友。","sentence_en":"But actually, the biggest thing for me was that after growing up, I realized the world is not what I imagined. Not every family is like mine, and not everyone thinks or acts like my parents, including my friends and relatives."},{"id":"350","start":2950.07,"end":2960.91,"displayStart":2950.07,"displayEnd":2960.91,"displayMid":2955.49,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.802627,"pitch":21.978024,"speechRate":4.613,"hasEvents":false,"sentence_source":"判断一些丈夫要阻止其实追求事业的，我会觉得 她为什么要这样子，我是当时觉得特别不理解的，现在想一想 几千年以来。","sentence_en":"When I saw husbands trying to stop their wives from pursuing careers, I would think, 'Why would she let that happen?' I really didn’t understand back then. Now that I think about it, for thousands of years..."},{"id":"351","start":2960.91,"end":2976.15,"displayStart":2960.91,"displayEnd":2976.15,"displayMid":2968.5299999999997,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","c ,"sentiment_en":"Neutral","score":0,"loudness":0.672861,"pitch":16.354511,"speechRate":4.802,"hasEvents":false,"sentence_source":"就像我写烟云台就是写小烟一样推进改革，反对的是他两个姐姐，而且这两个姐姐跟他感情非常好，就是这样子。","sentence_en":"Like in my novel 'Yanyuntai,' the protagonist Xiao Yan pushes for reforms and faces opposition from his two sisters, with whom he has a very close relationship. That's how it is."},{"id":"461","start":3957.4,"end":3965.78,"displayStart":3957.4,"displayEnd":3965.78,"displayMid":3961.59,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.773556,"pitch":19.387814,"speechRate":4.837,"hasEvents":false,"sentence_source":"我觉得有时候最大的人是那种反对的生意，可能不在你的敌人身上，可能是在你最亲的亲人身上。","sentence_en":"I think sometimes the biggest opposition doesn't come from your enemies, but from your dearest family."},{"id":"462","start":3965.78,"end":3978.66,"displayStart":3965.78,"displayEnd":3978.66,"displayMid":3972.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.97933,"pitch":19.772247,"speechRate":4.872,"hasEvents":false,"sentence_source":"那当你在写烟云台 就是这种要推进改革 遭到了阻碍的那个时候，你个人在现实生活当中 你在推进什么提案，这是有这个现实跟创作并行的时候吗。","sentence_en":"So when you were writing 'Yanyuntai,' with the reforms facing obstacles, were you personally pushing any proposals in real life? Was reality and creation happening in parallel?"},{"id":"463","start":3978.66,"end":3982.12,"displayStart":3978.66,"displayEnd":3982.12,"displayMid":3980.39,"speaker":"Jiang Shengnan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Growth Experience and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.694346,"pitch":30.234238,"speechRate":3.39,"hasEvents":false,"sentence_source":"有啊 我在写烟云台的时候。","sentence_en":"Yes, when I was writing 'Yanyuntai."},{"id":"46
