    <script type="application/json" id="episode-data">{"episode":{"id":"S5E1","label":"S5E1","title":"S5E1 Lu Yu in Conversation with Zhan Qingyun | Believing in day-to-day efforts is what Ginsburg taught me.","intro":"Zhan Qingyun, Harvard Law School Doctor of Law, practicing lawyer; Chen Luyu, media personality, host.\n\n\"Roses in the Rocks\" Season 5 continues the conversation about women.\nThis season, we have a small change: each guest no longer comes alone but brings books, paintings, films, or plays they love or that have deeply influenced them. Together with Lu Yu, they explore their life experiences and attitudes through these works. The first guest is young lawyer Zhan Qingyun, and the three books she brings reflect different stages of her understanding of law and personal pursuits in her life so far.\nAs a child, her imagination of law came from the protagonist Jennifer in \"The Angry Angel,\" who single-handedly turned the tide and sought justice. After entering Harvard Law School, the \"notorious\" Ruth Bader Ginsburg, who pursued gender equality in all stages of her life and social roles, became a new role model. When she became a \"cog\" repeating daily labor at a big law firm, Yoshii Shinobu's \"Tokyo 8 Square Meters\" inspired a more relaxed yet enjoyable lifestyle.\nZhan Qingyun says, the further you go, the more you wonder if you can go a little further. When you look back, you realize you've already come so far.\nFactory towns, Guizhou county towns, Hong Kong, the United States, Japan—these geographical coordinates may not define growth, but setting out again always brings new challenges. Now, Zhan Qingyun knows that the curiosity of a Gemini has been satisfied once more, and perhaps it's time to set off again.","duration":4914,"displayDuration":4914,"audioSrc":"s5e1.m4a","guest":"Zhan Qingyun","host":"Lu Yu","releaseDate":"2024.3.12"},"topicDefinitions":{"0":{"label":"C0","name":"Episode Summary","color":"#FFFFFF","opacity":0.2,"firstCategory": ource":"但是我读法学院的时候 别说照顾孩子和丈夫了，我就觉得照顾我自己都非常勉强。","sentence_en":"But when I was in law school, forget taking care of kids or a husband — I could barely take care of myself."},{"id":"84","start":625.9,"end":633.94,"displayStart":625.9,"displayEnd":633.94,"displayMid":629.9200000000001,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Negative","score":-0.3,"loudness":0.749858,"pitch":26.735056,"speechRate":5.846,"hasEvents":false,"sentence_source":"你知道这一点深有同感，我别说什么要照顾孩子什么家庭，如果我多养一只猫或多养一盆花 我都觉得我难以起急。","sentence_en":"I totally relate to that. Forget kids or family — if I had to take care of an extra cat or plant, I'd feel overwhelmed."},{"id":"85","start":633.94,"end":648.38,"displayStart":633.94,"displayEnd":648.38,"displayMid":641.1600000000001,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Neutral","score":0,"loudness":0.763527,"pitch":25.18045,"speechRate":5.2,"hasEvents":false,"sentence_source":"所以我也是在看金斯伯格的书和记录片的时候 我想 天呐，他是两个孩子后，来我突然想他们那个年代的女性，特别是很多美国女性 还让某种共性，他们要把一切的艰难给你藏起来。","sentence_en":"So when I read Ginsburg's books and documentaries, I thought, 'Wow, she had two kids.' Then I realized that women of her era, especially many American women, shared a trait: they hid all their struggles."},{"id":"86","start":648.38,"end":658.24,"displayStart":648.38,"displayEnd":658.24,"displayMid":653.31,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Neutral","score":0,"loudness":0.769788,"pitch":25.74564,"speechRate":5.632,"hasEvents":false,"sentence_source":"好像这属于他们那个时代女性的某种对自己的审美要求，就是我所有的努力我尽可能让你看不到，我努力的让我自己显得毫不费力。","sentence_en":"It seemed like a certain aesthetic ideal: they made sure you couldn't see their effort, striving to appear effortless."},{"id":"87","start":658.24,"end":669.8,"displayStart":658.24,"displayEnd":669.8,"displayM rage in our era. Standing still when everyone else moves can sometimes require a lot of courage."},{"id":"200","start":1515.6,"end":1520.62,"displayStart":1515.6,"displayEnd":1520.62,"displayMid":1518.11,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Positive","score":0.7,"loudness":0.752519,"pitch":20.935055,"speechRate":6.494,"hasEvents":false,"sentence_source":"所以那一刻我还就想到了RBG 我说，他其实就是这样子的一个女性啊。","sentence_en":"So at that moment I thought of RBG and said, she is actually that kind of woman."},{"id":"201","start":1521.64,"end":1534.8,"displayStart":1521.64,"displayEnd":1534.8,"displayMid":1528.22,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Positive","score":0.6,"loudness":0.694196,"pitch":22.926352,"speechRate":4.331,"hasEvents":false,"sentence_source":"是 所以他也说他自己的幸运来自于，他做律师的70年代是那个女权运动的年代，包括他说他做教授的时候被他身后的年轻一代人感动。","sentence_en":"Yes. So she also said her luck came from the fact that the 1970s when she was a lawyer was the era of the feminist movement, and she said she was moved by the younger generation behind her when she was a professor."},{"id":"202","start":1534.8,"end":1539.6,"displayStart":1534.8,"displayEnd":1539.6,"displayMid":1537.1999999999998,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Positive","score":0.7,"loudness":0.569918,"pitch":22.093075,"speechRate":5.658,"hasEvents":false,"sentence_source":"他觉得时代到了我们要坚定的往前走，他确实取得了很多成功。","sentence_en":"He felt that the time had come for us to resolutely move forward, and he indeed achieved a lot of success."},{"id":"203","start":1539.6,"end":1549.08,"displayStart":1539.6,"displayEnd":1549.08,"displayMid":1544.34,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Ginsburg Related","sentiment_en":"Negative","score":-0 at allowed a kid to be independent."},{"id":"266","start":2020.2,"end":2033.46,"displayStart":2020.2,"displayEnd":2033.46,"displayMid":2026.83,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Neutral","score":0,"loudness":0.768583,"pitch":25.908056,"speechRate":4.552,"hasEvents":false,"sentence_source":"这个故事其实是因为北大在贵州招生有专业限制，我当时就想去学北大学考古但是他们没有给我这个专业，与此同时香港中文大学打电话说。","sentence_en":"The story is that Peking University had major restrictions for Guizhou admissions. I wanted to study archaeology there, but they didn't offer that major. At the same time, the Chinese University of Hong Kong called."},{"id":"267","start":2033.46,"end":2039,"displayStart":2033.46,"displayEnd":2039,"displayMid":2036.23,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Positive","score":0.7,"loudness":0.743664,"pitch":23.125557,"speechRate":4.332,"hasEvents":false,"sentence_source":"不仅给我50万还给我自由的选择的权利，你想去北大学。","sentence_en":"They offered me not only a full scholarship but also the freedom to choose my major. I wanted to go to Peking University to study."},{"id":"268","start":2039,"end":2044.04,"displayStart":2039,"displayEnd":2044.04,"displayMid":2041.52,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Neutral","score":0,"loudness":0.674322,"pitch":22.103716,"speechRate":4.365,"hasEvents":false,"sentence_source":"考古 对，你当时因为什么原因会对考古产生了兴趣就。","sentence_en":"Archaeology, right? What sparked your interest in archaeology back then?"},{"id":"269","start":2044.04,"end":2046.2,"displayStart":2044.04,"displayEnd":2046.2,"displayMid":2045.12,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Neut d math class. When I first went to Hong Kong, I couldn't understand the teacher's English lectures."},{"id":"324","start":2422.64,"end":2426.1,"displayStart":2422.64,"displayEnd":2426.1,"displayMid":2424.37,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Positive","score":0.8,"loudness":0.695441,"pitch":25.848894,"speechRate":6.131,"hasEvents":false,"sentence_source":"但是我都觉得我很有自信，是因为我觉得没有关系。","sentence_en":"But I still felt very confident because I thought it didn't matter."},{"id":"325","start":2426.1,"end":2439.6,"displayStart":2426.1,"displayEnd":2439.6,"displayMid":2432.85,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.700634,"pitch":22.453928,"speechRate":5.204,"hasEvents":false,"sentence_source":"因为过往的经验告诉我慢慢就会好的，你只要是一直努力 一直努力 就会好的，不要因为一开始觉得被别人远远地甩在后面，就放弃相信自己 就放弃努力 那就永远不会好。","sentence_en":"Because past experience told me that it would get better slowly. As long as you keep working hard, it will get better. Don't give up on yourself or stop trying just because you feel left far behind at first—then it will never get better."},{"id":"326","start":2440.28,"end":2443.1,"displayStart":2440.28,"displayEnd":2443.1,"displayMid":2441.69,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Positive","score":0.7,"loudness":0.791323,"pitch":23.59631,"speechRate":5.882,"hasEvents":false,"sentence_source":"这种信心 这种信念感一直伴随着你。","sentence_en":"This confidence, this sense of belief, has always accompanied you."},{"id":"327","start":2443.1,"end":2448.52,"displayStart":2443.1,"displayEnd":2448.52,"displayMid":2445.81,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Positive","score":0.6,"loudness":0.605994,"pitch":22.365643,"speechRate":4.47,"hasEvents":false,"sentence_source":"对 我就是一个非常相信下漫功夫的人，又接回金斯伯格。","sentence_en":"Yes, I am someone who truly believes in putting in steady effort. Plus, bringing it back to Ginsburg."},{"id":"328","start":2448.52,"end":2459.96,"displayStart":2448.52,"displayEnd":2459.96,"displayMid":2454.24,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Neutral","score":0,"loudness":0.699157,"pitch":24.324598,"speechRate":4.737,"hasEvents":false,"sentence_source":"对 我就相信没有什么事情是可以一下子成功的，我从来就不是在人群中一下子就能耀眼的，一下子就能学习好啊还是被人注意到。","sentence_en":"Yes, I believe nothing can succeed overnight. I was never someone who could instantly shine in a crowd, instantly excel at studies, or be noticed."},{"id":"329","start":2459.96,"end":2464.88,"displayStart":2459.96,"displayEnd":2464.88,"displayMid":2462.42,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Academic experience and personal growth","sentiment_en":"Positive","score":0.7,"loudness":0.642852,"pitch":19.415049,"speechRate":3.708,"hasEvents":false,"sentence_source":"但是你得相信慢慢努力会好的，你还记得你。","sentence_en":"But you have to believe that with steady effort, things will get better. Do you remember..."},{"id":"330","start":2464.88,"end":2473.82,"displayStart":2464.88,"displayEnd":2473.82,"displayMid":2469.3500000000004,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"State changes in different periods","sentiment_en":"Neutral","score":0,"loudness":0.841352,"pitch":25.055376,"speechRate":5.164,"hasEvents":false,"sentence_source":"到香港第一天，香港那个城市带给你的那种感受吗，和你同年和你当年看电影啊，听歌呀那种想象是一样的吗。","sentence_en":"On your first day in Hong Kong, the feeling the city gave you—was it the same as the imagination from watching movies and listening to songs back then n for surgery."},{"id":"529","start":3888.56,"end":3902.74,"displayStart":3888.56,"displayEnd":3902.74,"displayMid":3895.6499999999996,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.7,"loudness":0.712897,"pitch":25.788902,"speechRate":5.237,"hasEvents":false,"sentence_source":"然后我们去向日本的海关申诉说 这也是一种人道主义 然后帮他们拿到签证，还有我最近在做的一个法律援助是帮助一个从阿富汗逃出来的女性律师去申请美国的难民签证。","sentence_en":"We appealed to Japanese customs, arguing it was a humanitarian matter, and helped them get visas. Another recent pro bono case is helping a female lawyer who fled Afghanistan apply for a U.S. refugee visa."},{"id":"530","start":3902.74,"end":3918.3,"displayStart":3902.74,"displayEnd":3918.3,"displayMid":3910.52,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Neutral","score":0,"loudness":0.65391,"pitch":21.469469,"speechRate":4.992,"hasEvents":false,"sentence_source":"因为如果他回到阿富汗的话 他就会被打击报复 就是这是一些很小的事情，就对我们来说 他只是律所给你一个空间说 你可以去做一些你想要做的法律援助，可是它是不進入你的業績的。","sentence_en":"Because if he returns to Afghanistan, he will face retaliation. These are small things to us; the law firm just gives you a space to do some legal aid you want, but it doesn't count toward your performance."},{"id":"531","start":3918.3,"end":3933.28,"displayStart":3918.3,"displayEnd":3933.28,"displayMid":3925.79,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.724878,"pitch":24.406002,"speechRate":5.268,"hasEvents":false,"sentence_source":"而且也不賺錢嘛 很明顯，可是做這些事情的時候，我有切實的感受到說，啊 我幫到了他，當那個主人帶著狗狗來了，然後他的狗狗手術成功，他現在每一個節日，他還會給我寄那個狗狗的理性片。","sentence_en":"And obviously it doesn't pay well. But when I do these things, I genuinely feel like I've helped someone. When the owner brought the dog, the surgery was successful, and n Neutral","score":0,"loudness":0.721565,"pitch":22.546902,"speechRate":4.645,"hasEvents":false,"sentence_source":"很有趣的問題 就是這個跟大家經常問變首的問題是很像的嘛，就當你要去站在一個你不認同的立場的時候 你怎麼自處，我覺得辯論不是讓人變得更加極化 更加刻薄的。","sentence_en":"That's a very interesting question—it's similar to the one people often ask about debate: when you have to argue a position you don't agree with, how do you handle yourself? I think debate isn't supposed to make people more polarized or meaner."},{"id":"548","start":4049.06,"end":4060.78,"displayStart":4049.06,"displayEnd":4060.78,"displayMid":4054.92,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.6,"loudness":0.703541,"pitch":22.299103,"speechRate":5.324,"hasEvents":false,"sentence_source":"辯論應該是讓人變得更加包容，就是你恰恰知道有很多事情是可以辯論的，然後你也願意去聽對方說什麼，而我們每個人都扮演自己的角色就可以了。","sentence_en":"Debate should make people more open-minded. You know that many things are debatable, and you're willing to listen to the other side. We each just play our role."},{"id":"549","start":4060.78,"end":4072.74,"displayStart":4060.78,"displayEnd":4072.74,"displayMid":4066.76,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Neutral","score":0,"loudness":0.667449,"pitch":21.118891,"speechRate":4.878,"hasEvents":false,"sentence_source":"我们不是法官 我不去决定说谁更有道理，我只是去呈现说这一边可以讲出什么道理，同样的道理 我觉得做律师就是我们不是上帝 不是法官。","sentence_en":"We're not judges; I don't decide who's more reasonable. I just present what arguments can be made on this side. Similarly, as lawyers, we are not God or judges."},{"id":"550","start":4072.74,"end":4081.8,"displayStart":4072.74,"displayEnd":4081.8,"displayMid":4077.27,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Neutral","score":0,"loudness":0.739021,"pitch":23.175419,"speechRate":4.635,"hasEvents":false,"sentence_source":"我们只是在一个我们人类目前能设计的比较好的，公平的实现的形式 就是各自去陈述自己的立场。","sentence_en":"We're just part of a relatively good and fair system that humans have designed: each side states its position."},{"id":"551","start":4083.34,"end":4097.16,"displayStart":4083.34,"displayEnd":4097.16,"displayMid":4090.25,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Negative","score":-0.4,"loudness":0.634203,"pitch":21.505573,"speechRate":4.342,"hasEvents":true,"sentence_source":"但是就像我刚才跟你讲的 我觉得我开始触及到了一些，这些真的有动摇我内心信念的东西的时候了，比如说前两天我就跟阿鹏我好朋友分享说。","sentence_en":"But as I just told you, I feel like I've started to touch on some things that really shake my inner beliefs. For example, a couple of days ago, I shared with my good friend Apeng that..."},{"id":"552","start":4097.16,"end":4105.42,"displayStart":4097.16,"displayEnd":4105.42,"displayMid":4101.29,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Negative","score":-0.7,"loudness":0.775451,"pitch":24.615824,"speechRate":4.979,"hasEvents":false,"sentence_source":"我们最近有一个案子是一个人他就自杀了，他自杀以后能留下一封遗书，他就说他遭到了职场霸凌。","sentence_en":"We recently had a case where a person committed suicide. He left a note saying he had been bullied at work."},{"id":"553","start":4105.42,"end":4112.08,"displayStart":4105.42,"displayEnd":4112.08,"displayMid":4108.75,"speaker":"Zhan Qingyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Neutral","score":0,"loudness":0.631057,"pitch":21.483643,"speechRate":5.65,"hasEvents":false,"sentence_source":"然后他的家属就拿着这封遗书起诉了这个公司，我就跟阿鹏说最近有这么一个案子。","sentence_en":"Then his family used that note to sue the company. I told Apeng about this case."},{"id":"554","start":4112.08,"end":4120.38,"displayStart":4112.08,"displayEnd":4120.38,"displayMid":4116.23,"speaker":"Zhan Qingyun","speakerColor":"#A ly envy others."},{"id":"569","start":4223.91,"end":4227.97,"displayStart":4223.91,"displayEnd":4227.97,"displayMid":4225.9400000000005,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.7,"loudness":0.789536,"pitch":25.398737,"speechRate":5.911,"hasEvents":false,"sentence_source":"慕别人的，但我觉得你的状态我很羡慕为什么就是很自由。","sentence_en":"But I envy your state—why? Because it's very free."},{"id":"570","start":4227.97,"end":4234.43,"displayStart":4227.97,"displayEnd":4234.43,"displayMid":4231.200000000001,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.5,"loudness":0.834782,"pitch":24.187824,"speechRate":3.876,"hasEvents":true,"sentence_source":"然后我是不太喜欢看起来特别费劲的，就是一切他都很自然。","sentence_en":"And I don't like things that look particularly strenuous; everything should come naturally."},{"id":"571","start":4234.43,"end":4243.35,"displayStart":4234.43,"displayEnd":4243.35,"displayMid":4238.89,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.6,"loudness":0.713935,"pitch":23.641563,"speechRate":5.238,"hasEvents":true,"sentence_source":"然后你看起来不是很费劲 你没有强求一切 他很自然的发生，你很舒服的活着 但是这个舒服不是很极致的。","sentence_en":"And you don't seem to be struggling. You don't force anything; it all happens naturally. You live comfortably, but not in an extreme luxury way."},{"id":"572","start":4243.35,"end":4255.81,"displayStart":4243.35,"displayEnd":4255.81,"displayMid":4249.58,"speaker":"SPEAKER_02","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work-related experience","sentiment_en":"Positive","score":0.5,"loudness":0.719508,"pitch":21.693813,"speechRate":5.768,"hasEvents":false,"sentence_source":"那种穷奢极欲的那种奢华的不是 他就是很自然的，还有一点我就会觉得你是让我觉得有些小羡慕的地方，就你是一个不太焦虑的人 还是你的焦虑是在我们看不见的地方。","s :"Jiang Shengnan"},{"slug":"s8e2","label":"S8E2","guest":"Chen Hui"},{"slug":"s8e3","label":"S8E3","guest":"Zhashiyi Re"},{"slug":"s8e4","label":"S8E4","guest":"Li Zishu"},{"slug":"s8e5","label":"S8E5","guest":"Zhu Tianwen"},{"slug":"s8e6","label":"S8E6","guest":"Niaoniao"},{"slug":"s8e7","label":"S8E7","guest":"Li Yinhe"},{"slug":"s8e8","label":"S8E8","guest":"Zhang Hong"},{"slug":"s8e9","label":"S8E9","guest":"Li Rui"},{"slug":"s9e1","label":"S9E1","guest":"Zhang Zanying"},{"slug":"s9e2","label":"S9E2","guest":"Zhang Nuo"},{"slug":"s9e3","label":"S9E3","guest":"Cai Gao"},{"slug":"s9e4","label":"S9E4","guest":"Meng Man"}]}}</script>
<script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
