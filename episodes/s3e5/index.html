,"score":0,"loudness":0.984409,"pitch":19.447727,"speechRate":4.542,"hasEvents":false,"sentence_source":"是的 对你说的很对好多人都觉得策展人好像挺有权利的，比如说他可以选择哪个艺术家进展览，他可以去想一个展览的主题去把它策划呈现出来。","sentence_en":"Yes, you're right. Many people think curators have power—they choose which artists to include, think of a theme, and plan the exhibition."},{"id":"34","start":247.83,"end":252.43,"displayStart":247.83,"displayEnd":252.43,"displayMid":250.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.5,"loudness":0.901793,"pitch":24.495348,"speechRate":5.435,"hasEvents":false,"sentence_source":"但我真的自己做了这个之后我就觉得这个职业特别的卑微。","sentence_en":"But after doing it myself, I find this profession very humble."},{"id":"35","start":252.43,"end":268.03,"displayStart":252.43,"displayEnd":268.03,"displayMid":260.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.4,"loudness":0.859912,"pitch":19.984621,"speechRate":4.872,"hasEvents":false,"sentence_source":"然后也是非常搬砖的一个职业挺辛苦的，辛苦指的是什么呢，辛苦比如说你有大量的沟通，不光是要跟艺术家沟通，你还要跟 你要落地的场地 也就是空间 有可能是美术馆 有可能是画廊。","sentence_en":"And it's a very laborious job. Hard work means a lot of communication—not just with artists, but also with the venue, which could be a museum or gallery."},{"id":"36","start":268.03,"end":274.39,"displayStart":268.03,"displayEnd":274.39,"displayMid":271.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.875509,"pitch":19.556911,"speechRate":4.452,"hasEvents":false,"sentence_source":"也可能是一个非公益的商业的一个空间 你要把它想办法去落地。","sentence_en":"It could also be a non-public commercial space; you have to figure out how to make it happen."},{"id":"37","start":274.39,"end":285.01,"displayStart":274.39,"displayEnd":285.01,"displayMid":279.7,"speaker":"Lu Yu 这个世界发生很少的连接。","sentence_en":"I've always envied artists or art-related jobs because I think artists work alone—facing my manuscript, my score, my canvas—I can complete my work with minimal connection to the world."},{"id":"41","start":319.69,"end":327.91,"displayStart":319.69,"displayEnd":327.91,"displayMid":323.8,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.840753,"pitch":21.005152,"speechRate":4.501,"hasEvents":false,"sentence_source":"我觉得非常干净 不拖泥带水，但你这么说 我瞬间就有点犹豫了，原来有这么多瑣碎的细节。","sentence_en":"I think it's very clean and straightforward. But hearing you say that, I hesitate—there are so many tedious details."},{"id":"42","start":327.91,"end":330.41,"displayStart":327.91,"displayEnd":330.41,"displayMid":329.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":1.095826,"pitch":29.141397,"speechRate":5.95,"hasEvents":false,"sentence_source":"对 因为你刚才说的是艺术家吗。","sentence_en":"Yes, because you were just talking about artists."},{"id":"43","start":330.41,"end":339.91,"displayStart":330.41,"displayEnd":339.91,"displayMid":335.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.4,"loudness":0.87882,"pitch":21.747839,"speechRate":4.632,"hasEvents":false,"sentence_source":"我觉得艺术家之所以，它可以那么纯粹的去终于自己的那个世界，就是因为有很多人其实都在为他们服务。","sentence_en":"I think artists can be so pure and devoted to their own world because many people are serving them."},{"id":"44","start":339.91,"end":345.97,"displayStart":339.91,"displayEnd":345.97,"displayMid":342.94000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.968111,"pitch":19.401871,"speechRate":4.003,"hasEvents":false,"sentence_source":"我觉得比如说像美术馆呀 画廊，还有他的代理商 测展人。","sentence_en":"For example, museums, galleries, agents, curators."},{"id":"45","start":345.97,"end":351.03,"displayStart":345.97,"displayEnd":351.03,"displayMid":348.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.4,"loudness":0.894005,"pitch":17.619774,"speechRate":5.731,"hasEvents":false,"sentence_source":"其实我觉得很多时候，大家都是为支持艺术家更好地去创作在服务的。","sentence_en":"Actually, I think most of the time, everyone is serving to support artists in creating better work."},{"id":"46","start":351.03,"end":352.77,"displayStart":351.03,"displayEnd":352.77,"displayMid":351.9,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.847276,"pitch":23.984251,"speechRate":6.369,"hasEvents":false,"sentence_source":"你是其中一个环节其实。","sentence_en":"You are one link in that chain."},{"id":"47","start":352.77,"end":365.79,"displayStart":352.77,"displayEnd":365.79,"displayMid":359.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.859019,"pitch":19.962677,"speechRate":5.453,"hasEvents":false,"sentence_source":"对 我觉得这个职业需要很强的一个服务精神，这个还是你要克服自己的那种自恋，就是比如说你过去自己写写东西 做自媒体，你是有很多小自恋在里面的 你可以自我讨罪。","sentence_en":"Yes, I think this job requires a strong service spirit. You have to overcome your own narcissism—like when you used to write or do self-media, there was a lot of self-love; you could indulge yourself."},{"id":"48","start":365.79,"end":368.25,"displayStart":365.79,"displayEnd":368.25,"displayMid":367.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.838378,"pitch":19.565647,"speechRate":5.285,"hasEvents":false,"sentence_source":"因为你也不需要向别人交代嘛。","sentence_en":"Because you don't need to answer to anyone."},{"id":"49","start":368.25,"end":373.39,"displayStart":368.25,"displayEnd":373.39,"displayMid":370.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.952925,"pitch":21.205229,"speechRate":5.167,"hasEvents":false,"sentence_source":"但是你要去做测展人 很长的时候，你就是要为艺术家服务。","sentence_en":"But being a curator, most of the time, you serve the artists."},{"id":"50","start":373.39,"end":388.49,"displayStart":373.39,"displayEnd":388.49,"displayMid":380.94,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.979034,"pitch":25.439196,"speechRate":4.485,"hasEvents":false,"sentence_source":"但这个行业还有一个很有魅力的地方，就假若你有特别好的眼光，就是你会演石英雄的话，你可以把一个还在萌芽当中，刚刚开始然然升起的一个星星，你先发现它。","sentence_en":"But this industry also has a charming aspect: if you have great vision, like a talent scout, you can discover a budding star before it rises."},{"id":"51","start":388.49,"end":399.93,"displayStart":388.49,"displayEnd":399.93,"displayMid":394.21000000000004,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.6,"loudness":0.94566,"pitch":22.997635,"speechRate":5.866,"hasEvents":false,"sentence_source":"然后将它一手，缔造成一个可能某一个领域的一个星星，这样二十年代三十年代那个Girl to Stine，很多人说如果没有它的话，可能就没有必加索。","sentence_en":"Then you single-handedly turn it into a star in some field. Like in the 1920s-30s, Gertrude Stein—many say without her, there might be no Picasso."},{"id":"52","start":399.93,"end":403.65,"displayStart":399.93,"displayEnd":403.65,"displayMid":401.78999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field", n":"Positive","score":0.6,"loudness":1.239221,"pitch":33.733917,"speechRate":6.579,"hasEvents":false,"sentence_source":"那时候那种内心的得意。","sentence_en":"That inner smugness."},{"id":"64","start":493.71,"end":504.15,"displayStart":493.71,"displayEnd":504.15,"displayMid":498.92999999999995,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.7,"loudness":1.170906,"pitch":23.149998,"speechRate":4.789,"hasEvents":false,"sentence_source":"那时候很有成就感，我特别能够理解人，的确有的时候，是可以超越一己私利，我只是为了看到别人身上的，某些闪光的地方。","sentence_en":"At that moment, there's a great sense of achievement. I can really understand that sometimes you can transcend self-interest, just to see the shining points in others."},{"id":"65","start":504.15,"end":514.27,"displayStart":504.15,"displayEnd":514.27,"displayMid":509.21,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.5,"loudness":0.911144,"pitch":21.38936,"speechRate":4.941,"hasEvents":false,"sentence_source":"那一刻还是很有成就感，你是一直以来，是一个很幸运的一个人，就你一路在需要有机会的时候，你都是可以有机会的人吗。","sentence_en":"That moment is still fulfilling. Have you always been a lucky person who gets opportunities when you need them?"},{"id":"66","start":514.27,"end":515.41,"displayStart":514.27,"displayEnd":515.41,"displayMid":514.8399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.744714,"pitch":13.991805,"speechRate":4.386,"hasEvents":false,"sentence_source":"我觉得不是。","sentence_en":"I don't think so."},{"id":"67","start":515.41,"end":521.97,"displayStart":515.41,"displayEnd":521.97,"displayMid":518.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.905434,"pitch":20.725286,"speechRate":4.421,"hasEvents":false,"sentence_source":"我觉得我是一个曲线救国的人怎么讲，比如说我现在去做到这个测展。","sentence_en":"I think I'm someone who achieves goals indirectly. For example, now I'm working as a curator."},{"id":"68","start":521.97,"end":530.21,"displayStart":521.97,"displayEnd":530.21,"displayMid":526.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.846981,"pitch":20.256468,"speechRate":5.097,"hasEvents":false,"sentence_source":"我觉得我是因为做了大量的尝试，不断的在这种自不量力，在这种动手中去认识到自己，好像能做这个。","sentence_en":"I think it's because I've made many attempts, constantly overestimating myself, and through doing I realized I seem to be able to do this."},{"id":"69","start":530.21,"end":534.75,"displayStart":530.21,"displayEnd":534.75,"displayMid":532.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.79664,"pitch":23.123592,"speechRate":5.286,"hasEvents":false,"sentence_source":"但是那个又做不到，就是我没有一个那么清晰的一个路线。","sentence_en":"But that thing I couldn't do. I didn't have a clear path."},{"id":"70","start":534.75,"end":544.03,"displayStart":534.75,"displayEnd":544.03,"displayMid":539.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.80577,"pitch":19.037035,"speechRate":5.065,"hasEvents":false,"sentence_source":"我觉得那些幸运的人，他们是在很小的时候就知道自己要做什么 成为谁，他就不用像我这样就是像无头仓营一样。","sentence_en":"I think lucky people know from a young age what they want to do and who to become. They don't have to be like a headless fly like me."},{"id":"71","start":544.03,"end":551.63,"displayStart":544.03,"displayEnd":551.63,"displayMid":547.8299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.854891,"pitch":18.830399," 织者。","sentence_en":"Because I started interviewing artists and understanding the contemporary art system—forums, small events—I could participate and become an organizer."},{"id":"76","start":578.49,"end":592.93,"displayStart":578.49,"displayEnd":592.93,"displayMid":585.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.835378,"pitch":20.748968,"speechRate":5.538,"hasEvents":false,"sentence_source":"我觉得他跟我的很多的之前的工作经历一些积累，非常的有用的，就是我这些经历是可以指向做测展的这样一个工作，并且呢他要求的这个专业更高，我就是对这种专业性我特别的迷恋。","sentence_en":"I think it's very useful in connection with my previous work experience. My experiences point toward being a curator, and it requires higher professionalism. I'm especially obsessed with that professionalism."},{"id":"77","start":592.93,"end":598.97,"displayStart":592.93,"displayEnd":598.97,"displayMid":595.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.5,"loudness":0.812837,"pitch":16.688181,"speechRate":4.305,"hasEvents":false,"sentence_source":"我就特怕自己没有专业吧 所以我就觉得这个职业我挺喜欢的。","sentence_en":"I'm afraid of not having a specialty, so I really like this job."},{"id":"78","start":598.97,"end":613.89,"displayStart":598.97,"displayEnd":613.89,"displayMid":606.4300000000001,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.988158,"pitch":24.030443,"speechRate":5.267,"hasEvents":false,"sentence_source":"因为我也接触了一些画家 然后一些艺术圈的人，我就发现这个岭域是一个非常看重你的出处的一个行业，它的门槛非常高 因为有这个门槛在 所以它就决定你必须要你大学学的是什么。","sentence_en":"Because I've contacted some painters and art insiders, I've found this field values your background a lot. The bar is very high, so it determines what you must have studied in college."},{"id":"79","start":613.89,"end":619.87,"displayStart":613.89,"displayEnd":619.87,"displayMid":616.88,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.975409,"pitch":18.543976,"speechRate":4.804,"hasEvents":false,"sentence_source":"或者你后来你留学的时候 你又学过什么 就这一切是必不可少的。","sentence_en":"Or when you studied abroad later, what else did you learn? All of this is essential."},{"id":"80","start":619.87,"end":631.31,"displayStart":619.87,"displayEnd":631.31,"displayMid":625.5899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.9719,"pitch":21.446749,"speechRate":4.863,"hasEvents":false,"sentence_source":"是的 甚至有的时候有的人会觉得从事艺术的人你必须得一时无忧，我记得以前就有人在社交媒体上这样子批评我说我做这个事情。","sentence_en":"Yes, sometimes people think that you have to be carefree to be an artist. I remember someone on social media criticized me for doing this."},{"id":"81","start":631.31,"end":645.39,"displayStart":631.31,"displayEnd":645.39,"displayMid":638.3499999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.6,"loudness":0.864145,"pitch":18.999262,"speechRate":5.533,"hasEvents":false,"sentence_source":"但是我好像没有那么强的一个资本在后面支持，可是做艺术难道不是也是可以你比如说你很喜爱，你可以做其中的一个环节，不是每个人都要变成大藏家都要有很强的这样一个资本。","sentence_en":"But I don't seem to have strong financial backing behind me. Still, isn't it possible to be involved in art because you love it? Not everyone has to become a big collector with a lot of capital."},{"id":"82","start":645.39,"end":649.39,"displayStart":645.39,"displayEnd":649.39,"displayMid":647.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":0.935007,"pitch":20.253265,"speechRate":5.433,"hasEvents":false,"sentence_source":"去支持你去买作品才能得到跟艺术家的一个联系。","sentence_en":"You don't need to buy artworks to connect with artists."},{"id":"83","start":649.39,"end":662.89,"displayStart":649.39,"displayEnd":662.89,"displayMid":656.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.834937,"pitch":18.226664,"speechRate":5.185,"hasEvents":false,"sentence_source":"我觉得介入艺术有很多种方式，哪怕我只是因为喜欢艺术，我去读一个艺术史 去读一个艺术批评，去学一下剑赏，我能在这个期中得到很多很纯粹的快乐，我看得懂一幅画。","sentence_en":"I think there are many ways to engage with art. Even if I just love art, I can study art history, art criticism, learn to appreciate it—and in doing so, find pure joy. I can understand a painting."},{"id":"84","start":662.89,"end":664.79,"displayStart":662.89,"displayEnd":664.79,"displayMid":663.8399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.7,"loudness":0.841366,"pitch":21.896406,"speechRate":5.93,"hasEvents":false,"sentence_source":"我觉得那个也是很珍贵的。","sentence_en":"I think that is also very precious."},{"id":"85","start":664.79,"end":668.89,"displayStart":664.79,"displayEnd":668.89,"displayMid":666.8399999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.5,"loudness":1.01884,"pitch":26.109512,"speechRate":5.149,"hasEvents":false,"sentence_source":"哎 跟我分享，一刻你站在比如某一幅明画之前。","sentence_en":"Hey, share with me—a moment when you stood in front of a painting."},{"id":"86","start":668.89,"end":671.55,"displayStart":668.89,"displayEnd":671.55,"displayMid":670.22,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Positive","score":0.6,"loudness":0.73515,"pitch":19.762489,"speechRate":4.511,"hasEvents":false,"sentence_source":"那瞬间灵魂出窍的感觉比如。","sentence_en":"That feeling of your soul leaving your body, for instance."},{"id":"87","start":671.55,"end":679.47,"displayStart":671.55,"displayEnd":679.47,"displayMid":675.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.92716,"pitch":21.630562,"speechRate":4.545,"hasEvents":false,"sentence_source":"说那个在泰特的当代美术馆里面，他有一个罗斯科 马克莱斯科的那个自己单独一个厅。","sentence_en":"At Tate Modern, there's a Rothko—Mark Rothko's own separate room."},{"id":"88","start":679.47,"end":684.19,"displayStart":679.47,"displayEnd":684.19,"displayMid":681.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.826788,"pitch":19.552364,"speechRate":4.237,"hasEvents":false,"sentence_source":"那个厅的光线是要比其他的一些展厅更暗一些。","sentence_en":"The lighting in that room is dimmer than in other galleries."},{"id":"89","start":684.19,"end":696.15,"displayStart":684.19,"displayEnd":696.15,"displayMid":690.1700000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.793063,"pitch":19.708311,"speechRate":5.435,"hasEvents":false,"sentence_source":"然后就放了三张他的大作品，我就坐在那个作品前 我觉得我可以做很久，他的那张作品就是像一种有一种吸引力能把你吸进去，它是一个很抽象的一个状态。","sentence_en":"They have three of his large works there. I sat in front of them and felt I could stay for a long time. His work has a kind of magnetism that pulls you in; it's a very abstract state."},{"id":"90","start":696.15,"end":699.69,"displayStart":696.15,"displayEnd":699.69,"displayMid":697.9200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.812402,"pitch":20.358913,"speechRate":4.802,"hasEvents":false,"sentence_source":"没有一个具体的食物让你去一直盯着看。","sentence_en":"There's no specific object to stare at."},{"id": wn to this age, and the most fundamental questions of life are unsolvable."},{"id":"95","start":731.23,"end":745.83,"displayStart":731.23,"displayEnd":745.83,"displayMid":738.53,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.933255,"pitch":24.231054,"speechRate":5.102,"hasEvents":false,"sentence_source":"对 我觉得有时候在一幅伟大的艺术作品面前，人瞬间 你就会被莫名的感动的热泪影哗，就他给你情绪的某一种宣泄口，就是因为他给你很多的想象的空间，就他承载你所有的情绪。","sentence_en":"Yes, I think sometimes in front of a great work of art, you can be suddenly moved to tears. It gives you an outlet for emotions, because it offers so much space for imagination and holds all your feelings."},{"id":"96","start":745.83,"end":749.37,"displayStart":745.83,"displayEnd":749.37,"displayMid":747.6,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.144108,"pitch":24.954517,"speechRate":6.373,"hasEvents":false,"sentence_source":"就那一刻你会发现，哦 原来艺术伟大就在于这里对。","sentence_en":"In that moment, you realize, oh, so this is where the greatness of art lies."},{"id":"97","start":749.37,"end":757.29,"displayStart":749.37,"displayEnd":757.29,"displayMid":753.3299999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.966817,"pitch":26.340069,"speechRate":4.545,"hasEvents":false,"sentence_source":"所以那 我不知道你在英国是多长时间，就那段时间是让你能够，短时间之内非常浓缩的。","sentence_en":"So, I don't know how long you were in the UK, but that period allowed you to, in a very short time, intensively..."},{"id":"98","start":757.29,"end":761.33,"displayStart":757.29,"displayEnd":761.33,"displayMid":759.31,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en" asn't as articulate as you. I had some issues from using a pacifier too much, so my pronunciation wasn't great."},{"id":"155","start":1168.09,"end":1173.85,"displayStart":1168.09,"displayEnd":1173.85,"displayMid":1170.9699999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.889533,"pitch":16.90831,"speechRate":4.34,"hasEvents":false,"sentence_source":"然后就是花了很长时间去调整吧，后来做编辑就还是好一些。","sentence_en":"I spent a long time adjusting. Later, working as an editor helped."},{"id":"156","start":1173.85,"end":1178.31,"displayStart":1173.85,"displayEnd":1178.31,"displayMid":1176.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.956232,"pitch":22.087288,"speechRate":5.381,"hasEvents":false,"sentence_source":"但是做编辑你做一个时尚杂志你接触的人，他还是很窄的。","sentence_en":"But as an editor at a fashion magazine, the people you interact with are still limited."},{"id":"157","start":1178.31,"end":1190.01,"displayStart":1178.31,"displayEnd":1190.01,"displayMid":1184.1599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.964766,"pitch":22.775324,"speechRate":5.029,"hasEvents":false,"sentence_source":"那你真的要做策展了 你开始接触的人就是那方方面面的，你必须要去面对不同的人，他怎么去理解你要表达这个东西 你要去换你的画术。","sentence_en":"When you actually become a curator, you start dealing with all kinds of people. You have to face different people and adapt your language so they understand what you want to express."},{"id":"158","start":1190.01,"end":1191.13,"displayStart":1190.01,"displayEnd":1191.13,"displayMid":1190.5700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.9 Events":false,"sentence_source":"我觉得你是可以做策展人的那，种快乐它不是即时的，它不会 你今天有一个很好的灵感，你立刻就觉得 我太开心了，我怎么那么聪明 我好棒 就不行啊。","sentence_en":"I think being a curator—that kind of joy isn't instant. You don't have a great idea today and immediately feel ecstatic like, 'I'm so smart, I'm awesome.' It doesn't work that way."},{"id":"163","start":1224.07,"end":1231.49,"displayStart":1224.07,"displayEnd":1231.49,"displayMid":1227.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":1.120588,"pitch":27.594603,"speechRate":5.795,"hasEvents":false,"sentence_source":"因为你有一个灵感，你要想怎么去让它落地 怎么落实，说服场地 艺术家都愿意去支持你把这个事情实现。","sentence_en":"Because when you have an idea, you have to figure out how to make it happen, how to implement it, and convince the venue and artists to support you in realizing it."},{"id":"164","start":1231.49,"end":1232.77,"displayStart":1231.49,"displayEnd":1232.77,"displayMid":1232.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0.1,"loudness":1.111808,"pitch":25.700468,"speechRate":5.469,"hasEvents":false,"sentence_source":"那我先有点明白。","sentence_en":"Now I kind of understand."},{"id":"165","start":1232.77,"end":1234.07,"displayStart":1232.77,"displayEnd":1234.07,"displayMid":1233.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":1.290151,"pitch":23.942867,"speechRate":5.385,"hasEvents":false,"sentence_source":"因为我看那个假。","sentence_en":"Because I read that 'Hypothetical'."},{"id":"166","start":1234.07,"end":1246.19,"displayStart":1234.07,"displayEnd":1246.19,"displayMid":1240.13,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0.1,"loudness":0.91757,"pitch":18.127995,"speechRate":4.868,"hasEvents":false,"sentence_source":"张科的那个书 假想里面，他就写到 他说他特别羡慕作家，作家就是我有一支笔 一张纸 我有灵感，我随时就写下来 他就可以是一篇散文 一篇小说。","sentence_en":"In Zhang Ke's book 'Hypothetical', he wrote that he envies writers. A writer has a pen and paper; with inspiration, they can write anytime—a prose or a novel."},{"id":"167","start":1246.19,"end":1248.33,"displayStart":1246.19,"displayEnd":1248.33,"displayMid":1247.26,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":1.081764,"pitch":20.380819,"speechRate":5.607,"hasEvents":false,"sentence_source":"但是导演就是我有一个想法。","sentence_en":"But a director has an idea."},{"id":"168","start":1248.33,"end":1261.83,"displayStart":1248.33,"displayEnd":1261.83,"displayMid":1255.08,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.928359,"pitch":21.706284,"speechRate":5.176,"hasEvents":false,"sentence_source":"然后我要开始先写剧本，我要先去找各种各样的投资人，哎 我有这么一个本子，你要不要投资我们来拍电影，当你这个想法从你有的那一刻，到你开始真的电影能够投拍。","sentence_en":"Then they start writing the script, finding various investors, saying, 'I have this script, would you invest in making a film?' From the moment you have the idea to when the film actually gets financed..."},{"id":"169","start":1261.83,"end":1262.95,"displayStart":1261.83,"displayEnd":1262.95,"displayMid":1262.3899999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work Experience","sentiment_en":"Neutral","score":0,"loudness":1.321775,"pitch":25.612856,"speechRate":4.464,"hasEvents":false,"sentence_source":"然后开始拍。","sentence_en":"...and then start shooting."},{"id":"170","start":1262.95,"end":1278.59,"displayStart":1262.95,"displayEnd":1278.59,"displayMid":1270.77,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.909151,"pitch":22.053076,"speechRate":4.859,"hasEvents":false,"sentence_source":"然后做完后期到真正跟大家见面那一刻，中间已经过去了漫长的时间，一年两年甚至若干年，这个过程其实有点像你们做测展人，从你那个内心微微一动有灵感开始，到你真的大功告成。","sentence_en":"From finishing the post-production to actually presenting it to everyone, a long time passes—one year, two years, or even several years. This process is a bit like being a curator, from that initial spark of inspiration to the final success."},{"id":"171","start":1278.59,"end":1281.53,"displayStart":1278.59,"displayEnd":1281.53,"displayMid":1280.06,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.3,"loudness":0.709068,"pitch":13.712637,"speechRate":5.102,"hasEvents":false,"sentence_source":"就是一个挺艰难的漫长的过程而且。","sentence_en":"It's a tough, lengthy process."},{"id":"172","start":1281.53,"end":1290.35,"displayStart":1281.53,"displayEnd":1290.35,"displayMid":1285.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.4,"loudness":0.819348,"pitch":20.295477,"speechRate":4.307,"hasEvents":false,"sentence_source":"整个过程你是挺孤独的，就是别人不知道你中间发生了什么，你为什么要换场地要换作品。","sentence_en":"The whole process is quite lonely. Others don't know what happened in between, why you changed the venue or the artworks."},{"id":"173","start":1290.35,"end":1292.95,"displayStart":1290.35,"displayEnd":1292.95,"displayMid":1291.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.3,"loudness":1.131425,"pitch":29.49823,"speechRate":5.417,"hasEvents":false,"sentence_source":"然后又有些什么资金上的压力。","sentence_en":"And then there's financial pressure."},{"id":"174","start":1292.95,"end":1302.99,"displayStart":1292.95,"displayEnd":1302.99,"displayMid":1297.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":-0.1,"loudness":0.883083,"pitch":18.326258,"speechRate":4.582,"hasEvents":false,"sentence_source":"因为每个人都在给你提要求，这个艺术家说能不能有一些材料的制作费，我要去帮他去想办法去问一下主办方。","sentence_en":"Because everyone makes demands. One artist asks for material production fees, and I have to figure out how to ask the organizers."},{"id":"175","start":1302.99,"end":1315.53,"displayStart":1302.99,"displayEnd":1315.53,"displayMid":1309.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.4,"loudness":0.948815,"pitch":23.251135,"speechRate":5.141,"hasEvents":false,"sentence_source":"然后那个艺术家就是要求我的这个作品，要有一些什么特殊的运输，就是每天都要去解决这些问题，本来我是可以把手机这样一关，上午就很轻松地看书。","sentence_en":"Another artist requires special transportation for their work. So I deal with these issues daily. Originally, I could just turn off my phone and read a book in the morning."},{"id":"176","start":1315.53,"end":1321.69,"displayStart":1315.53,"displayEnd":1321.69,"displayMid":1318.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.3,"loudness":0.864405,"pitch":17.426512,"speechRate":5.032,"hasEvents":false,"sentence_source":"但一旦进入了真实的要开始落地的这个过程里面，我就是还不敢不看手机。","sentence_en":"But once it gets into the actual implementation phase, I dare not ignore my phone."},{"id":"177","start":1321.69,"end":1326.97,"displayStart":1321.69,"displayEnd":1326.97,"displayMid":1324.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.3,"loudness":0.865415,"pitch":19.93387,"speechRate":6.061,"hasEvents":false,"sentence_source":"因为你老是不回复，可能别人在等你的消息，我有很怕就是给别人添这种麻烦。","sentence_en":"Because if I don't reply, others might be waiting for my message. I'm afraid of being a burden."},{"id":"178","start":1326.97,"end":1336.69,"displayStart":1326.97,"displayEnd":1336.69,"displayMid":1331.83,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.5,"loudness":0.769267,"pitch":18.400898,"speechRate":4.901,"hasEvents":false,"sentence_source":"哇 这部分的工作其实我特别不喜欢的对，应该也是你比较抗拒的其中一部分吧，就你需要克服自己某种障碍你的。","sentence_en":"Wow, this part of the work I really dislike. It must be one of the things you resist too, needing to overcome some kind of obstacle."},{"id":"179","start":1336.69,"end":1343.23,"displayStart":1336.69,"displayEnd":1343.23,"displayMid":1339.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Negative","score":-0.5,"loudness":1.020023,"pitch":21.389202,"speechRate":5.046,"hasEvents":true,"sentence_source":"意识也会自我打架，就想我明明可以活得挺轻松的，我为什么要让自己受这些苦。","sentence_en":"Consciousness also fights with itself, thinking, 'I could live so easily, why am I putting myself through this suffering?'"},{"id":"180","start":1344.23,"end":1353.77,"displayStart":1344.23,"displayEnd":1353.77,"displayMid":1349,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Negative","score":-0.4,"loudness":0.894069,"pitch":19.978008,"speechRate":4.976,"hasEvents":true,"sentence_source":"但是等你全部熬过去了就像跑马了松，有一段你会非常的痛苦，就是你会觉得我为什么不在家里面吃西瓜吹空调。","sentence_en":"But when you get through it all, like running a marathon, there's a period of intense pain where you think, 'Why am I not at home eating watermelon and enjoying the air conditioning?'"},{"id":"181","start":1354.21,"end":1360.57,"displayStart":1354.21,"displayEnd":1360.57,"displayMid":1357.3899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":0.960744,"pitch":24.157953,"speechRate":4.862,"hasEvents":true,"sentence_source":"但是就是你熬过去了到最后那一刻的时候，好像那个多巴胺就开始分泌。","sentence_en":"But when you finally get through it and reach the last moment, it's like dopamine starts kicking in."},{"id":"182","start":1360.57,"end":1362.09,"displayStart":1360.57,"displayEnd":1362.09,"displayMid":1361.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Positive","score":0.6,"loudness":0.905984,"pitch":21.259542,"speechRate":6.207,"hasEvents":false,"sentence_source":"然后还觉得挺快乐的。","sentence_en":"And you feel quite happy."},{"id":"183","start":1362.09,"end":1363.05,"displayStart":1362.09,"displayEnd":1363.05,"displayMid":1362.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":1.094683,"pitch":24.212255,"speechRate":5.333,"hasEvents":false,"sentence_source":"所以作为。","sentence_en":"So as a curator, when do you feel joy?"},{"id":"184","start":1363.05,"end":1369.85,"displayStart":1363.05,"displayEnd":1369.85,"displayMid":1366.4499999999998,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0.1,"loudness":0.920549,"pitch":21.07704,"speechRate":5.527,"hasEvents":false,"sentence_source":"测诊人你的快乐是在哪一刻，比如说马拉松选手他冲过终点的那时候，他就已经很快乐了。","sentence_en":"Where is your joy as a curator? For example, a marathon runner is happy as soon as they cross the finish line."},{"id":"185","start":1369.85,"end":1379.81,"displayStart":1369.85,"displayEnd":1379.81,"displayMid":1374.83,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0.1,"loudness":0.931373,"pitch":22.899227,"speechRate":5.071,"hasEvents":false,"sentence_source":"那你的是当你的那个展览开幕那一天，还是当你的展览过去一两天，业界有一些相关的评论出现的那一刻 在什么时候哇。","sentence_en":"So is it on the opening day of your exhibition, or a day or two later when industry reviews come out? When is it?"},{"id":"186","start":1379.95,"end":1395.09,"displayStart":1379.95,"displayEnd":1395.09,"displayMid":1387.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.3,"loudness":0.984222,"pitch":22.503979,"speechRate":5.326,"hasEvents":false,"sentence_source":"这个问题特别的好 我自己想过，就是开幕的时候 你也不快乐 开幕的时候你超紧张，你就怕有地方做的没做好 怕出问题，比如说我有时候开幕之前到了现场，发现一个作品的那个电线露在外面了。","sentence_en":"That's a great question. I've thought about it. On opening day, you're not happy—you're super nervous, afraid something isn't done right. For example, sometimes before the opening I arrive and find a piece's wire exposed."},{"id":"187","start":1395.09,"end":1402.25,"displayStart":1395.09,"displayEnd":1402.25,"displayMid":1398.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.989545,"pitch":21.119717,"speechRate":5.056,"hasEvents":false,"sentence_source":"我当时就觉得好抓狂啊，快开幕了 发现美术馆的工作人员把蛋糕推进了那个厂馆里面。","sentence_en":"I'd be freaking out. Just before opening, I see the museum staff wheeling a cake into the gallery."},{"id":"188","start":1402.25,"end":1413.49,"displayStart":1402.25,"displayEnd":1413.49,"displayMid":1407.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.952073,"pitch":21.897552,"speechRate":5.004,"hasEvents":false,"sentence_source":"然后人家是好意 但你又觉得这肯定不行 对吧 又不是办婚礼一事，就是你都是在抓狂之中 真正的快乐就是开幕了以后 你看到观众进来。","sentence_en":"It's well-intentioned, but you know it's not right—it's not a wedding. You're in a frenzy. The real joy is after the opening, when you see visitors come in."},{"id":"189","start":1413.49,"end":1421.77,"displayStart":1413.49,"displayEnd":1421.77,"displayMid":1417.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Positive","score":0.6,"loudness":0.934687,"pitch":21.878658,"speechRate":5.683,"hasEvents":false,"sentence_source":"然后呢 你默默地观察 看他们特别喜欢那些作品一直盯着看，或者是一直在那里拍那个作品 然后还跟朋友讨论。","sentence_en":"Then you quietly observe them really liking the works, staring at them, taking photos, and discussing with friends."},{"id":"190","start":1421.77,"end":1430.73,"displayStart":1421.77,"displayEnd":1430.73,"displayMid":1426.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.867377,"pitch":19.11731,"speechRate":5.357,"hasEvents":false,"sentence_source":"那个时候你真的好开心 你觉得你的那些想法实现出来了，并且大家真的是被那个作品迷住了 还在那里有一所思考。","sentence_en":"At that moment, you're truly happy. You feel your ideas have come to life, and people are captivated by the work and even reflect on it."},{"id":"191","start":1430.73,"end":1432.71,"displayStart":1430.73,"displayEnd":1432.71,"displayMid":1431.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Positive","score":0.7,"loudness":0.813305,"pitch":15.772305,"speechRate":4.7,"hasEvents":false,"sentence_source":"那个是很有成就感的。","sentence_en":"That gives you a great sense of achievement."},{"id":"192","start":1432.71,"end":1437.71,"displayStart":1432.71,"displayEnd":1437.71,"displayMid":1435.21,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0.1,"loudness":0.999182,"pitch":20.589743,"speechRate":4.588,"hasEvents":false,"sentence_source":"那像这样的时刻你会每次你做的展览你都会感受到。","sentence_en":"Do you feel this with every exhibition you do?"},{"id":"193","start":1437.71,"end":1451.33,"displayStart":1437.71,"displayEnd":1451.33,"displayMid":1444.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Positive","score":0.5,"loudness":0.861243,"pitch":18.807251,"speechRate":4.914,"hasEvents":false,"sentence_source":"对 就是那时候你会觉得以前的那些特别痛苦的那个阶段就不足一提了吧，你觉得跟很多人一起成长，像我这种独生子女小的时候都是很孤独的，老非所在家里。","sentence_en":"Yes. At that time, you feel the previous painful stages are insignificant. You feel you're growing with many people. As an only child, I was often lonely at home."},{"id":"194","start":1451.33,"end":1466.13,"displayStart":1451.33,"displayEnd":1466.13,"displayMid":1458.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Positive","score":0.6,"loudness":0.929618,"pitch":19.958151,"speechRate":4.932,"hasEvents":false,"sentence_source":"我觉得好像做这个事情跟一些朋友们在一起是可以共同的成长，就是他们也在变好有更多的机会，你自己就是也实现了你专业上的这样一个愿望吧，你肯定你作为一个测染人。","sentence_en":"I think doing this with some friends allows us to grow together. They improve and get more opportunities, and you also fulfill your professional aspirations. As a curator, you definitely..."},{"id":"195","start":1466.13,"end":1478.25,"displayStart":1466.13,"displayEnd":1478.25,"displayMid":1472.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Positive","score":0.7,"loudness":0.83225,"pitch":19.533133,"speechRate":6.216,"hasEvents":false,"sentence_source":"你希望自己是有机会可以做一些与众不同的展览，你不能只说你帮助了别人，别人也给了你机会，让你去实现了自己的这种职业上的一些理想对，这真的是一个互相成就的一个过程。","sentence_en":"You hope to have the chance to do something different with exhibitions. You can't just say you helped others; they also gave you opportunities to realize your career ideals. It's truly a mutual achievement process."},{"id":"196","start":1478.25,"end":1480.03,"displayStart":1478.25,"displayEnd":1480.03,"displayMid":1479.1399999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.864199,"pitch":22.572901,"speechRate":4.23,"hasEvents":false,"sentence_source":"嗯 我现在发现啊。","sentence_en":"Hmm, I'm realizing now."},{"id":"197","start":1480.03,"end":1486.61,"displayStart":1480.03,"displayEnd":1486.61,"displayMid":1483.32,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.885451,"pitch":22.151999,"speechRate":4.913,"hasEvents":false,"sentence_source":"我们每个人其实都是以某种方式在成长的不同阶段，有着某种叛逆跟反叛。","sentence_en":"Each of us, in some way, has a certain rebellion or defiance at different stages of growth."},{"id":"198","start":1486.61,"end":1489.75,"displayStart":1486.61,"displayEnd":1489.75,"displayMid":1488.1799999999998,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.909391,"pitch":17.816887,"speechRate":4.459,"hasEvents":true,"sentence_source":"对你来说 你的叛逆方式就是艺术。","sentence_en":"For you, your way of rebellion is art."},{"id":"199","start":1490.59,"end":1493.27,"displayStart":1490.59,"displayEnd":1493.27,"displayMid":1491.9299999999998,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":1.029536,"pitch":22.410257,"speechRate":6.855,"hasEvents":true,"sentence_source":"因为你一定是小时候是乖乖的那种小孩。","sentence_en":"Because you must have been that well-behaved kid when you were young."},{"id":"200","start":1493.27,"end":1495.05,"displayStart":1493.27,"displayEnd":1495.05,"displayMid":1494.1599999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.977229,"pitch":22.752773,"speechRate":4.667,"hasEvents":false,"sentence_source":"对，因为我觉得你。","sentence_en":"Yes, because I think your analysis makes sense."},{"id":"201","start":1495.05,"end":1508.63,"displayStart":1495.05,"displayEnd":1508.63,"displayMid":1501.8400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.8582,"pitch":18.810514,"speechRate":4.713,"hasEvents":false,"sentence_source":"这个分析有道理，就是艺术本身每一次的流派的出现，每一个新的艺术家的出现，它往往都是对已有的 既有的犯事的一个挑战和反叛，比如说像我做测染人。","sentence_en":"That analysis makes sense. Art itself—every new movement, every new artist—often challenges and rebels against existing conventions. For example, me being a curator."},{"id":"202","start":1508.63,"end":1519.31,"displayStart":1508.63,"displayEnd":1519.31,"displayMid":1513.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.4,"loudness":0.909044,"pitch":18.726282,"speechRate":5.792,"hasEvents":false,"sentence_source":"这个可能就是对我小时候很洒脱的那种状态的压抑的一个能量的一个释放吧，就我觉得人都需要找到这么一个出口，只是不同的那个表现形式。","sentence_en":"This might be a release of the energy suppressed from my carefree childhood state. I think everyone needs to find an outlet, just in different forms."},{"id":"203","start":1519.31,"end":1533.55,"displayStart":1519.31,"displayEnd":1533.55,"displayMid":1526.4299999999998,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.4,"loudness":0.925912,"pitch":24.975645,"speechRate":5.056,"hasEvents":false,"sentence_source":"我觉得艺术有时候真的以你想象不到的方式存在着，我昨天看到一个照片 老照片吧 算是，后来我觉得太逗了 你知道05年在西安兵马泳，曾经抓到过一个德国留学生应该是。","sentence_en":"I think art sometimes exists in ways you can't imagine. Yesterday I saw an old photo. I found it hilarious. You know, in 2005 at the Terracotta Warriors in Xi'an, they caught a German exchange student."},{"id":"204","start":1533.55,"end":1535.89,"displayStart":1533.55,"displayEnd":1535.89,"displayMid":1534.72,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.867889,"pitch":22.608358,"speechRate":5.556,"hasEvents":false,"sentence_source":"他就是穿着兵马泳的那个衣服。","sentence_en":"He was wearing a Terracotta Warrior costume."},{"id":"205","start":1535.89,"end":1542.41,"displayStart":1535.89,"displayEnd":1542.41,"displayMid":1539.15,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.802326,"pitch":21.827541,"speechRate":5.368,"hasEvents":false,"sentence_source":"然后脸上都抹上土 假扮成兵马泳，以那个行为艺术的方式就站在那个兵马泳的坑里。","sentence_en":"They smeared mud on their faces, disguised themselves as terracotta warriors, and stood in the pit as a performance art piece."},{"id":"206","start":1542.41,"end":1546.81,"displayStart":1542.41,"displayEnd":1546.81,"displayMid":1544.6100000000001,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":1.157963,"pitch":29.111509,"speechRate":5.195,"hasEvents":false,"sentence_source":"然后是那个兵马泳的保安，就突然发现这里面有个人。","sentence_en":"Then the terracotta warrior security guard suddenly noticed someone in the pit."},{"id":"207","start":1546.81,"end":1554.45,"displayStart":1546.81,"displayEnd":1554.45,"displayMid":1550.63,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":0.954744,"pitch":25.135342,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后特别逗的是你能从那个镜头里面看到那个保安去到坑里面找的时候，从他面前走过都没有发现。","sentence_en":"The funny part is, you can see from the footage that when the guard went into the pit to search, he walked right past him without noticing."},{"id":"208","start":1554.45,"end":1559.43,"displayStart":1554.45,"displayEnd":1559.43,"displayMid":1556.94,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.984546,"pitch":27.383406,"speechRate":6.197,"hasEvents":false,"sentence_source":"然后当他们面对这个人的时候，依然不能够确定这是个人还是兵马泳。","sentence_en":"Even when they stood face to face with this person, they still couldn't tell if it was a human or a terracotta warrior."},{"id":"209","start":1559.43,"end":1562.19,"displayStart":1559.43,"displayEnd":1562.19,"displayMid":1560.81,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.985415,"pitch":25.600529,"speechRate":6.695,"hasEvents":false,"sentence_source":"然后他就是依然保持那个战力的状态。","sentence_en":"He kept standing still, maintaining the same pose."},{"id":"210","start":1562.19,"end":1573.55,"displayStart":1562.19,"displayEnd":1573.55,"displayMid":1567.87,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":0.862592,"pitch":19.091217,"speechRate":4.049,"hasEvents":false,"sentence_source":"因为他是行为艺术嘛都不动，最后特别滑稽是好几个保安把他给抬出去，他依然全身僵直的保持兵马泳的样子。","sentence_en":"Since it was performance art, he didn't move. In the end, it was hilarious — several guards carried him out, and he remained completely rigid, still in his terracotta warrior pose."},{"id":"211","start":1573.55,"end":1577.43,"displayStart":1573.55,"displayEnd":1577.43,"displayMid":1575.49,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.6,"loudness":1.077137,"pitch":22.070549,"speechRate":5.155,"hasEvents":false,"sentence_source":"然后即便到了派出所 她始终是那个状态 太逗了。","sentence_en":"Even at the police station, she stayed in that state. It was so funny."},{"id":"212","start":1577.43,"end":1585.51,"displayStart":1577.43,"displayEnd":1585.51,"displayMid":1581.47,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":0.887707,"pitch":25.145714,"speechRate":4.703,"hasEvents":false,"sentence_source":"因为她有一段那个录像 然后最后那个画外音说，经过说服教育 她终于脱掉了兵马泳的服装。","sentence_en":"She had a video, and at the end the voiceover said, after persuasion and education, she finally took off the terracotta warrior costume."},{"id":"213","start":1587.07,"end":1601.17,"displayStart":1587.07,"displayEnd":1601.17,"displayMid":1594.12,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":1.046651,"pitch":22.291353,"speechRate":4.699,"hasEvents":false,"sentence_source":"就是很淘气对吧 就是人有的事，她不是淘气，她是非常严肃认真的在丛式的她心目当中认为的行为艺术，总之她完成了这样一个 我觉得很搞笑的一个行为艺术。","sentence_en":"It's mischievous, right? But she wasn't being naughty — she was very serious about what she considered performance art. Anyway, she completed this performance that I find really funny."},{"id":"214","start":1602.09,"end":1617.97,"displayStart":1602.09,"displayEnd":1617.97,"displayMid":1610.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":0.998796,"pitch":22.501375,"speechRate":4.802,"hasEvents":false,"sentence_source":"我每次就是看到奈良美智画的那些小孩 我就会想到你，就是是挺像的，是吗 我不是只是说他的那个图像像啊，我就觉得他们的内心世界跟你很像，表面看上去也是特别的乖巧 很可爱。","sentence_en":"Every time I see those kids painted by Yoshitomo Nara, I think of you—they really resemble you, right? I don't just mean the image; I feel their inner world is very similar to yours. On the surface, they look especially well-behaved and cute."},{"id":"215","start":1617.97,"end":1623.07,"displayStart":1617.97,"displayEnd":1623.07,"displayMid":1620.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":1.007367,"pitch":25.641893,"speechRate":5.544,"hasEvents":false,"sentence_source":"但是内心你看他老是有点不屑，就是对于成人世界的很多的东西。","sentence_en":"But inside, you can see she's a bit disdainful of many things in the adult world."},{"id":"216","start":1623.07,"end":1624.59,"displayStart":1623.07,"displayEnd":1624.59,"displayMid":1623.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0.1,"loudness":1.112779,"pitch":24.235069,"speechRate":6.584,"hasEvents":false,"sentence_source":"我觉得也有点像你。","sentence_en":"I think it's a bit like you too."},{"id":"217","start":1624.59,"end":1638.81,"displayStart":1624.59,"displayEnd":1638.81,"displayMid":1631.6999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.4,"loudness":0.953757,"pitch":20.43944,"speechRate":5.148,"hasEvents":true,"sentence_source":"所以有的时候你看艺术的一些那种表达，他是能够跟某一个朋友或者是你身上的东西，你会觉得很契合，这个是你觉得有意思的地方，有一些表达你是在日常中很难去形容的。","sentence_en":"Sometimes, when you see certain artistic expressions, they can resonate with something in you or a friend. That's what makes it interesting — some expressions are hard to describe in everyday life."},{"id":"218","start":1638.81,"end":1643.21,"displayStart":1638.81,"displayEnd":1643.21,"displayMid":1641.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.5,"loudness":0.962056,"pitch":25.604118,"speechRate":6.718,"hasEvents":true,"sentence_source":"但是刚好那个艺术家做出来了，你觉得那就是他或者那就是我。","sentence_en":"But then that artist created it, and you feel that's him or that's me."},{"id":"219","start":1643.21,"end":1656.21,"displayStart":1643.21,"displayEnd":1656.21,"displayMid":1649.71,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Positive","score":0.6,"loudness":0.841268,"pitch":23.371943,"speechRate":4.415,"hasEvents":false,"sentence_source":"对 而且艺术越来越教会我们，就是你要去学会欣赏你不了解，甚至你不喜欢的东西我觉得，这是艺术教会我，让我最受益迫身的一个地方。","sentence_en":"Yes, and art has taught us more and more to learn to appreciate things we don't understand or even dislike. I think that's the most beneficial lesson art has given me."},{"id":"220","start":1656.21,"end":1663.25,"displayStart":1656.21,"displayEnd":1663.25,"displayMid":1659.73,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.744279,"pitch":21.730516,"speechRate":4.545,"hasEvents":false,"sentence_source":"你因为测展过程当中 比如说钱的问题啊 种种瑣碎的问题 比如说你 你哭过吗。","sentence_en":"Have you ever cried during the curation process because of issues like money or other trivial matters?"},{"id":"221","start":1663.25,"end":1676.43,"displayStart":1663.25,"displayEnd":1676.43,"displayMid":1669.8400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.4,"loudness":0.963439,"pitch":23.387035,"speechRate":4.713,"hasEvents":false,"sentence_source":"我上一次的那个展览 就是我到了现场 在做一个影像的那个作品的调配的时候，我特别震惊 就是我觉得啊 美术馆竟然没有自己的大的那个屏幕。","sentence_en":"At my last exhibition, when I arrived to set up a video piece, I was shocked — I couldn't believe the gallery didn't have its own large screen."},{"id":"222","start":1676.43,"end":1687.43,"displayStart":1676.43,"displayEnd":1687.43,"displayMid":1681.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.3,"loudness":0.95443,"pitch":20.151234,"speechRate":4.909,"hasEvents":false,"sentence_source":"然后他们就是放了一个小电视给我 我说这个肯定不行 这个效果差太远了，我一定要租一个大的那个LED显示屏来放这个影像。","sentence_en":"They just gave me a small TV. I said that's definitely not going to work, the effect is far too poor. I must rent a large LED screen for the video."},{"id":"223","start":1687.43,"end":1701.63,"displayStart":1687.43,"displayEnd":1701.63,"displayMid":1694.5300000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":1.00356,"pitch":23.530375,"speechRate":5.044,"hasEvents":false,"sentence_source":"但是那个时候的所有的经费已经用完了，刚好呢 我就收到了馆长助理给我发的消息，他就问说 朱老师晚上馆长请大家吃饭就觉得大家辛苦了，想问问你喜欢喝什么酒。","sentence_en":"But by then all the budget was used up. Just then, I got a message from the curator's assistant asking: 'Teacher Zhu, the curator is treating everyone to dinner tonight for your hard work. Could you tell us what wine you'd like?"},{"id":"224","start":1701.63,"end":1704.51,"displayStart":1701.63,"displayEnd":1704.51,"displayMid":1703.0700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.844813,"pitch":14.68334,"speechRate":4.514,"hasEvents":false,"sentence_source":"然后就给我了两个选择 我一看。","sentence_en":"Then they gave me two options. I took a look."},{"id":"225","start":1704.51,"end":1709.59,"displayStart":1704.51,"displayEnd":1709.59,"displayMid":1707.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.3," _source":"那她性别是一个问题吗 性别会使你占某种优势或者某种略施，还是她要跟人不是一个问题我。","sentence_en":"So, is gender an issue? Does it give you an advantage or disadvantage, or is it not a problem at all?"},{"id":"230","start":1734.66,"end":1746.44,"displayStart":1734.66,"displayEnd":1746.44,"displayMid":1740.5500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.891949,"pitch":22.28503,"speechRate":4.876,"hasEvents":false,"sentence_source":"现在觉得已经好很多了吧，可能女性测染人少是不是因为这个工作还是有时候挺需要体力的，比如说你那儿不展好几天你要盯在那儿。","sentence_en":"I think it's gotten much better now. Maybe there are fewer female curators because the job sometimes requires physical stamina — for example, during an exhibition setup you have to be there for days."},{"id":"231","start":1746.44,"end":1759.2,"displayStart":1746.44,"displayEnd":1759.2,"displayMid":1752.8200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":-0.1,"loudness":0.907585,"pitch":21.269783,"speechRate":5.643,"hasEvents":false,"sentence_source":"然后又是要操心的事情特别的多，但我现在看到真的女测染人越来越多了，唯一要警惕的就是我很怕别人觉得女测染人就只能做这些东西，比如说我做一个女性议题的展览。","sentence_en":"And there are so many things to worry about. But I see more and more female curators now. The only thing to be cautious about is that I'm afraid people might think female curators can only do certain things — for instance, if I organize an exhibition on women's issues."},{"id":"232","start":1759.2,"end":1774.68,"displayStart":1759.2,"displayEnd":1774.68,"displayMid":1766.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.3,"loudness":0.866759,"pitch":15.218731,"speechRate":4.457,"hasEvents":false,"sentence_source":"可能有的人就会说你看女测染人就老搞这些，他是不是搞不了别的，我也是在反思 我要警惕，就是你不能让因为自己的这样一个追求，自己在这个领域一直想要去挖掘。","sentence_en":"Some peop aker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.862585,"pitch":18.626162,"speechRate":5.037,"hasEvents":false,"sentence_source":"明还是有这种偏见在里面吗，你是从什么时候开始还是你从很小，就是一直有这样很强烈的一些女性主义色彩的一些思想，比如你可能从小你读的书，你受到的影响。","sentence_en":"Is there still such bias? When did you start—or have you always had strong feminist ideas since you were little, like from the books you read or the influences you had?"},{"id":"254","start":1891.68,"end":1896.9,"displayStart":1891.68,"displayEnd":1896.9,"displayMid":1894.29,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Negative","score":-0.4,"loudness":0.899746,"pitch":20.744448,"speechRate":4.598,"hasEvents":false,"sentence_source":"你的那些来自生活当中的榜样，都会给你这样的一些歧视。","sentence_en":"The role models in your life also gave you such discrimination."},{"id":"255","start":1896.9,"end":1907.76,"displayStart":1896.9,"displayEnd":1907.76,"displayMid":1902.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Feminism in the Art Field","sentiment_en":"Neutral","score":0,"loudness":0.920847,"pitch":21.661247,"speechRate":5.405,"hasEvents":false,"sentence_source":"我觉得我小的时候是有这种性别意识，也是因为是不是我是一个山东人，就是山东女性可能我们那个环境还是比较偏大男子主义的吧。","sentence_en":"I think I had this gender awareness when I was young, probably because I'm from Shandong. The environment there tends to be quite macho for women."},{"id":"256","start":1907.76,"end":1909.92,"displayStart":1907.76,"displayEnd":1909.92,"displayMid":1908.8400000000001,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Neutral","score":0,"loudness":1.217118,"pitch":23.969378,"speechRate":7.295,"hasEvents":false,"sentence_source":"在你的家庭里面就是这样吗。","sentence_en":"Is it like that in your family?"},{"id":"257","start":1910.52,"end":1914.82,"displayStart":1910.52,"displayEnd":1914.82,"displayMid":1912.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Positive","score":0.6,"loudness":0.904925,"pitch":15.953943,"speechRate":5.349,"hasEvents":false,"sentence_source":"我的家庭就还好 我爸妈还比较支持我去做想做的事情。","sentence_en":"My family is fine. My parents are quite supportive of me doing what I want."},{"id":"258","start":1914.82,"end":1922.74,"displayStart":1914.82,"displayEnd":1922.74,"displayMid":1918.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Neutral","score":0,"loudness":0.855603,"pitch":18.305767,"speechRate":5.682,"hasEvents":false,"sentence_source":"但是整个的那个社会环境 那个主流的气氛，比如说上小学的时候 我记得我跟我班几个女孩特别喜欢踢足球。","sentence_en":"But the overall social environment and mainstream atmosphere—for example, in elementary school, I remember a few girls in my class and I really liked playing soccer."},{"id":"259","start":1923.14,"end":1936.86,"displayStart":1923.14,"displayEnd":1936.86,"displayMid":1930,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Negative","score":-0.6,"loudness":0.934809,"pitch":22.224632,"speechRate":5.647,"hasEvents":false,"sentence_source":"然后就还被班主任给说了一顿 我们那个女班主任就觉得这都是男生做的事情，你们几个女孩子就是应该多做一些比如说女孩喜欢的运动，她就觉得这太野了 这种我就特别的不开心吧。","sentence_en":"Then I got scolded by the homeroom teacher. Our female teacher thought those were things for boys, and we girls should do more activities like girls' sports. She thought it was too wild, and I was really unhappy about that."},{"id":"260","start":1936.86,"end":1941.28,"displayStart":1936.86,"displayEnd":1941.28,"displayMid":1939.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Negative","score":-0.3,"loudness":0.976619,"pitch":19.175051,"speechRate":5.43,"hasEvents":false,"sentence_source":"因为他就会比较喜欢那些什么跳跳舞 穿着花裙子的女孩。","sentence_en":"Because they preferred girls who dance or wear flowery dresses."},{"id":"261","start":1941.28,"end":1950.58,"displayStart":1941.28,"displayEnd":1950.58,"displayMid":1945.9299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Women and Only Children","sentiment_en":"Positive","score":0.5,"loudness":0.939419,"pitch":16.781656,"speechRate":5.743,"hasEvents":false,"sentence_source":"那时候我就开始有点叛逆了 我就觉得穿球鞋特帅 简短发也很帅，就是你从小到大这个成长过程中有很多对于女性的偏见。","sentence_en":"That's when I started to rebel a bit. I thought sneakers were cool, and short hair was cool too. Throughout your upbringing, there were many prejudices against women."},{"id":"262","start":1950.58,"end":1954.12,"displayStart":1950.58,"displayEnd":1954.12,"displayMid":1952.35,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life Circumstances and Environmental Perception","sentiment_en":"Positive","score":0.6,"loudness":0.959229,"pitch":22.553932,"speechRate":5.199,"hasEvents":false,"sentence_source":"那这点我的确可能我觉得我还挺幸运的。","sentence_en":"On this point, I think I've been quite lucky."},{"id":"263","start":1954.12,"end":1959.56,"displayStart":1954.12,"displayEnd":1959.56,"displayMid":1956.84,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life Circumstances and Environmental Perception","sentiment_en":"Neutral","score":0,"loudness":0.870137,"pitch":22.127176,"speechRate":4.621,"hasEvents":false,"sentence_source":"因为我从初中开始 我初中我们学校是个男女混校实验中学。","sentence_en":"Because starting from middle school, my school was a co-ed experimental middle school."},{"id":"264","start":1959.56,"end":1962.26,"displayStart":1959.56,"displayEnd":1962.26,"displayMid":1960.9099999999999,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life Circumstances and Environmental Perception","sentiment_en":"Neutral","score":0,"loudness":0.748746,"pitch":23.840042,"speechRate":3.704,"hasEvents":false,"sentence_source":"但是我们班是女生班就。","sentence_en":"But our class was an all-girls class."},{"id":"265","start":1962.26,"end":1972.84,"displayStart":1962.26,"displayEnd":1972.84,"displayMid":1967.55,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life Circumstances and Environmental Perception","sentiment_en":"Positive","score":0.7,"loudness":0.986674,"pitch":25.491653,"speechRate":5.766,"hasEvents":false,"sentence_source":"那时候这样的一个女生班的一个环境反而让我会觉得，啊 我们好特别呀，就他对于一个女孩子来说是一个非常健康的一个提醒，就你会依照你特别。","sentence_en":"At that time, being in an all-girls class made me feel, 'Ah, we're so special.' It was a very healthy reminder for a girl—you learn to embrace your uniqueness."},{"id":"266","start":1972.84,"end":1978.96,"displayStart":1972.84,"displayEnd":1978.96,"displayMid":1975.9,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life Circumstances and Environmental Perception","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.916431,"pitch":19.65378,"speechRate":5.18,"hasEvents":false,"sentence_source":"而这种特别是让你走路的时候脖子都是扬起的，你是很自豪的，啊 我好羡慕。","sentence_en":"And that uniqueness made you walk with your head held high, feeling proud. Ah, I envy that."},{"id":"267","start":1978.96,"end":1981.66,"displayStart":1978.96,"displayEnd":1981.66,"displayMid":1980.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.857522,"pitch":20.170586,"speechRate":5.926,"hasEvents":false,"sentence_source":"你这个感觉啊，就是怎么会觉得很特别。","sentence_en":"That feeling—how did you feel so special?"},{"id":"268","start":1981.66,"end":1985.24,"displayStart":1981.66,"displayEnd":1985.24,"displayMid":1983.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.922771,"pitch":21.061264,"speechRate":5.307,"hasEvents":false,"sentence_source":"因为我中学读的是理科实验班，女生特别的少。","sentence_en":"Because I was in a science experimental class in high school, with very few girls."},{"id":"269","start":1985.24,"end":1989.38,"displayStart":1985.24,"displayEnd":1989.38,"displayMid":1987.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Negative","score":-0.4,"loudness":0.758031,"pitch":20.663719,"speechRate":6.039,"hasEvents":false,"sentence_source":"我觉得我那时候就駝背，駝背我现在想想就是因为不自信嘛。","sentence_en":"I think I used to slouch. Looking back, it was because of insecurity."},{"id":"270","start":1989.38,"end":2000.68,"displayStart":1989.38,"displayEnd":2000.68,"displayMid":1995.0300000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Negative","score":-0.6,"loudness":0.84748,"pitch":21.236643,"speechRate":5.319,"hasEvents":false,"sentence_source":"因为老师也经常会说觉得你们女孩学这种术理化，别看现在学的好 以后肯定都是男生学的好，老有一种就是觉得好像自己那种自我怀疑中。","sentence_en":"Teachers often said things like, 'You girls study science, but don't get too confident—boys will eventually do better.' That kind of talk left me in constant self-doubt."},{"id":"271","start":2000.68,"end":2006,"displayStart":2000.68,"displayEnd":2006,"displayMid":2003.3400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Positive","score":0.5,"loudness":0.793278,"pitch":17.435471,"speechRate":6.015,"hasEvents":false,"sentence_source":"但因为很想证明自己 所以你们那种是什么样的一个状态，就觉得自己很自信。","sentence_en":"But because I desperately wanted to prove myself, what was that state like? I felt very confident."},{"id":"272","start":2006,"end":2016.54,"displayStart":2006,"displayEnd":2016.54,"displayMid":2011.27,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Positive","score":0.6,"loudness":0.877369,"pitch":23.725319,"speechRate":4.08,"hasEvents":false,"sentence_source":"我真的现在觉得我就是很幸运 我们学校在76年之前是女校，等于是76年之后就变成男女混合学校。","sentence_en":"I really feel I was lucky. Our school was a girls' school before 1976, and then became co-ed after that."},{"id":"273","start":2016.54,"end":2023.58,"displayStart":2016.54,"displayEnd":2023.58,"displayMid":2020.06,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Neutral","score":0,"loudness":0.976357,"pitch":26.618822,"speechRate":6.392,"hasEvents":false,"sentence_source":"然后我们那是变成男女混校之后的唯一的一届女生班，就是因为整个学校六个年级就你们一个班都是女生。","sentence_en":"And our class was the only all-girls class after it became co-ed. Because in the whole school with six grades, only our class was all girls."},{"id":"274","start":2023.58,"end":2028.88,"displayStart":2023.58,"displayEnd":2028.88,"displayMid":2026.23,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Neutral","score":0,"loudness":0.879589,"pitch":22.434072,"speechRate":5.293,"hasEvents":false,"sentence_source":"我们会觉得比如说你做客间操的时候，全校的人就会多看你们一眼。","sentence_en":"We felt that, for example, when you did the exercise break, the whole school would give you a second look."},{"id":"275","start":2028.88,"end":2032.14,"displayStart":2028.88,"displayEnd":2032.14,"displayMid":2030.5100000000002,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Neutral","score":0,"loudness":1.180527,"pitch":29.958757,"speechRate":6.452,"hasEvents":false,"sentence_source":"然后我们班又为了觉得这样你们都看我们。","sentence_en":"Then our class, to make sure everyone looked at us,"},{"id":"276","start":2032.14,"end":2037.88,"displayStart":2032.14,"displayEnd":2037.88,"displayMid":2035.0100000000002,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Positive","score":0.7,"loudness":0.952499,"pitch":24.7516,"speechRate":5.531,"hasEvents":false,"sentence_source":"我们那么不一样 我们专门去做了一套班服，哇 你想那个年代我们是八几年。","sentence_en":"We were so different—we specially made a set of class uniforms. Wow, think about that era, it was the 80s."},{"id":"277","start":2037.88,"end":2051.14,"displayStart":2037.88,"displayEnd":2051.14,"displayMid":2044.51,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Positive","score":0.6,"loudness":0.916659,"pitch":23.982353,"speechRate":6.096,"hasEvents":false,"sentence_source":"那时候还没有什么校服班服的概念 我们班做一套班服，你不是觉得我不一样吗 那我就不一样到底给你看，让你无法忽视我的存在，不知道为什么当时我们班里小女孩就有这样的一种想法。","sentence_en":"Back then, there was no concept of school uniforms or class uniforms. Our class made a set of class uniforms. If you think I'm different, then I'll show you just how different I am, so you can't ignore my existence. I don't know why we little girls had that kind of thought back then."},{"id":"278","start":2051.14,"end":2063.4,"displayStart":2051.14,"displayEnd":2063.4,"displayMid":2057.27,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Background","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.914237,"pitch":23.116207,"speechRate":4.929,"hasEvents":false,"sentence_source":"然后我们就每一个人每次上客间操的时候，就都是那种头抬的高高 就内心是很雀跃的，就明白所有人的目光都看着我们，你会为此而感到骄傲。","sentence_en":"Then every time we did the exercise break, we held our heads high, feeling elated inside, knowing everyone's eyes were on us. You felt proud of that."},{"id":"279","start":2063.4,"end":2064.98,"displayStart":2063.4,"displayEnd":2064.98,"displayMid":2064.19,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Educational Back :"Positive","score":0.7,"loudness":0.936595,"pitch":16.544016,"speechRate":4.916,"hasEvents":false,"sentence_source":"你看你就是这样一个 你自己是反叛的，就你外表看起来是乖乖的 不显山露水的，但其实你一直做着你想做的事，也没有谁能够改变你的想法，这其实就是一种反叛 我觉得这还挺好的。","sentence_en":"You see, you're like that—you're rebellious yourself. On the outside, you seem obedient and unassuming, but you've always done what you wanted, and no one can change your mind. That's a form of rebellion, and I think it's pretty good."},{"id":"304","start":2214.08,"end":2220.4,"displayStart":2214.08,"displayEnd":2220.4,"displayMid":2217.24,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.864695,"pitch":20.099201,"speechRate":5.222,"hasEvents":false,"sentence_source":"那在你成长过程当中 你有某种像样板一样的人物吗，你的榜样 对你是有激励的。","sentence_en":"Did you have a role model growing up, someone who inspired you?"},{"id":"305","start":2220.4,"end":2226.42,"displayStart":2220.4,"displayEnd":2226.42,"displayMid":2223.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.827147,"pitch":18.707832,"speechRate":4.77,"hasEvents":false,"sentence_source":"不同的阶段 我觉得都会有，就像我刚才讲 那我对我这个身份的困惑。","sentence_en":"At different stages, I think so. As I said, I was confused about my identity."},{"id":"306","start":2226.42,"end":2228.36,"displayStart":2226.42,"displayEnd":2228.36,"displayMid":2227.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and Rebellion","sentiment_en":"Neutral","score":0,"loudness":0.953483,"pitch":24.34412,"speechRate":6.186,"hasEvents":false,"sentence_source":"因为我感兴趣的事情太多了。","sentence_en":"Because I'm interested in too many things."},{"id":"307","start":2228.36,"end":2242.98,"displayStart":2228.36,"displayEnd":2242.98,"displayMid":2235.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clust ocess emotions. I think back to when I was young,"},{"id":"378","start":2767.28,"end":2782.88,"displayStart":2767.28,"displayEnd":2782.88,"displayMid":2775.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.797034,"pitch":20.591639,"speechRate":4.679,"hasEvents":false,"sentence_source":"那么多的情绪 多愁伤感，就那些是真的是纯粹的情绪，现在真的事情来了，你是来不及处理情绪，你只能把它放在一边 先去做，可能最后都做完了 面对完了，也许你还有点那种力气。","sentence_en":"so many emotions, so sentimental—those were pure emotions. Now when real things come, you don't have time to process emotions; you just put them aside and act first. Maybe after everything is done and faced,"},{"id":"379","start":2782.88,"end":2788.52,"displayStart":2782.88,"displayEnd":2788.52,"displayMid":2785.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Negative","score":-0.5,"loudness":0.780894,"pitch":22.886362,"speechRate":4.787,"hasEvents":false,"sentence_source":"也许你完全就已经精疲利益，就没有时间精力再去面对你的情绪。","sentence_en":"if you still have some energy left, or maybe you're completely exhausted, you don't have the time or energy to deal with your emotions anymore."},{"id":"380","start":2788.52,"end":2791.78,"displayStart":2788.52,"displayEnd":2791.78,"displayMid":2790.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Neutral","score":0,"loudness":0.782215,"pitch":16.001736,"speechRate":5.828,"hasEvents":false,"sentence_source":"所以我觉得现在自己的这个情绪越来越少了。","sentence_en":"So I feel like I have fewer and fewer emotions now."},{"id":"381","start":2791.78,"end":2802.6,"displayStart":2791.78,"displayEnd":2802.6,"displayMid":2797.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Positive","score":0.4,"loudness":0.880648,"pitch":20.285669,"speechRate":5.674,"hasEvents":false,"sentence_source":"那现在疫情过去之后 你还跟父母住在一起吗，最近爸妈还在跟我住在一起，我现在就觉得希望能跟他们多相处吧，就是我们家以前的人不太表达。","sentence_en":"Now that the pandemic is over, do you still live with your parents? Recently, my parents are still living with me. I feel like I want to spend more time with them. In our family, we didn't express much before."},{"id":"382","start":2802.6,"end":2812.22,"displayStart":2802.6,"displayEnd":2812.22,"displayMid":2807.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Recent Work Content - Milan Exhibition","sentiment_en":"Positive","score":0.5,"loudness":0.810838,"pitch":17.02985,"speechRate":4.782,"hasEvents":false,"sentence_source":"我现在就有的时候想换一个方式柔和的表达一些，我对他们的一些感情或者通过拥抱以前也是很少去拥抱的。","sentence_en":"Now sometimes I want to express my feelings in a softer way, maybe through hugs—we rarely hugged before."},{"id":"383","start":2812.22,"end":2825.9,"displayStart":2812.22,"displayEnd":2825.9,"displayMid":2819.06,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Feelings as a Host","sentiment_en":"Positive","score":0.7,"loudness":0.868791,"pitch":21.176315,"speechRate":4.226,"hasEvents":false,"sentence_source":"哎 我觉得年纪带给人的好的地方，就是你的确会开始感受到生命当中的很多的善意和爱，以前你是不屑于的 或者你根本来不及去感受。","sentence_en":"I think the good thing about aging is that you really start to feel a lot of kindness and love in life. Before, you either dismissed it or didn't have time to feel it."},{"id":"384","start":2825.9,"end":2833.04,"displayStart":2825.9,"displayEnd":2833.04,"displayMid":2829.4700000000003,"speaker":"Zhu Yujie","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Feelings as a Host","sentiment_en":"Positive","score":0.5,"loudness":0.947849,"pitch":24.646738,"speechRate":5.469,"hasEvents":false,"sentence_source":"然后你现在会发现 哦 这个如此之珍贵，有时候想到这些内心会突然涌出一种莫名的酸楚。","sentence_en":"And now you realize, 'Oh, this is so
