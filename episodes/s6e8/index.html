timent_en":"Positive","score":0.6,"loudness":0.832291,"pitch":28.206257,"speechRate":6.66,"hasEvents":true,"sentence_source":"然后哎呀 我就不知道为什么，我就觉得这个是我对于我专业能力的一个大的肯定。","sentence_en":"Then, oh, I don’t know why, I felt like this was a huge validation of my professional skills."},{"id":"397","start":2645.93,"end":2653.79,"displayStart":2645.93,"displayEnd":2653.79,"displayMid":2649.8599999999997,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.762301,"pitch":24.790098,"speechRate":6.542,"hasEvents":false,"sentence_source":"因为我觉得做单口演员从一开始我站上台，我就是想讲大家没有想到的东西，但如果大家都在聊这个吧 我就不想聊了。","sentence_en":"Because when I first stepped on stage as a stand-up comedian, I wanted to say things nobody thought of. But if everyone was talking about something, I didn’t want to talk about it."},{"id":"398","start":2653.79,"end":2665.79,"displayStart":2653.79,"displayEnd":2665.79,"displayMid":2659.79,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.5,"loudness":0.821366,"pitch":24.744856,"speechRate":5.988,"hasEvents":false,"sentence_source":"那必然就会导致你有点逆流而行，我是觉得这是我自己特别 我觉得最有意思的地方，早期你可能就在线下讲，大家觉得 哦 确实我平时都在想这个，哎 我今天来这个小剧场。","sentence_en":"That inevitably makes you swim against the current. I think that’s what I find most interesting. Early on, when you perform offline, people think, ‘Oh, I actually think about this all the time. Hey, I came to this small theater today.’"},{"id":"399","start":2665.79,"end":2668.93,"displayStart":2665.79,"displayEnd":2668.93,"displayMid":2667.3599999999997,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.82884,"pitch":26.970337,"speechRate":7.643,"hasEvents":false,"sentence_source":"这个人居然提出了这个想法，好有意思啊 他就会很喜欢你。","sentence_en":"‘This person actually came up with this idea—so interesting!’ Then they really like you."},{"id":"400","start":2668.93,"end":2678.97,"displayStart":2668.93,"displayEnd":2678.97,"displayMid":2673.95,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.4,"loudness":0.762856,"pitch":26.439278,"speechRate":6.173,"hasEvents":false,"sentence_source":"但是 等它更大规模地传播的时候 你没有在大家这个流里面的时候，就是一定会有人来批判你 你为什么不往这个方向想 为什么不往这个方向做。","sentence_en":"But when it spreads on a larger scale and you’re not part of the mainstream, there will definitely be people criticizing you: ‘Why don’t you think this way? Why don’t you do it this way?’"},{"id":"401","start":2678.97,"end":2685.15,"displayStart":2678.97,"displayEnd":2685.15,"displayMid":2682.06,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.718606,"pitch":23.366261,"speechRate":5.178,"hasEvents":false,"sentence_source":"但我一直都觉得是 自己就单口喜剧 比较让人着迷的地方 就是我可以不一样。","sentence_en":"But I’ve always thought that what makes stand-up comedy fascinating is that I can be different."},{"id":"402","start":2685.15,"end":2687.53,"displayStart":2685.15,"displayEnd":2687.53,"displayMid":2686.34,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.895098,"pitch":27.724855,"speechRate":6.682,"hasEvents":false,"sentence_source":"但是现在 反正你不一样 一定有代价。","sentence_en":"But now, being different definitely has a cost."},{"id":"403","start":2687.53,"end":2701.15,"displayStart":2687.53,"displayEnd":2701.15,"displayMid":2694.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.8,"loudness":0.97637,"pitch":25.337879,"speechRate":5.318,"hasEvents":false,"sentence_source":"是 包括我都特别明显 我几年前听你讲月经的段子，和我今年听讲月经段子 我的表现就完全不同今天，我是完全可以 就我特别放松 特别自然的 完全的去接住他 我讲的好对。","sentence_en":"Yeah, including me—it’s really obvious. When I heard you tell period jokes a few years ago versus this year, my reaction was completely different. Now I can fully, naturally, and easily go along with it—‘That’s so right!’"},{"id":"404","start":2701.15,"end":2711.99,"displayStart":2701.15,"displayEnd":2711.99,"displayMid":2706.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0.1,"loudness":0.943721,"pitch":20.697487,"speechRate":5.904,"hasEvents":false,"sentence_source":"但当年我记得我是有一些些 不知所措 会觉得 哇 这个是可以的啊 这个是可以讲的，原来这个是可以讲的 你要知道 就我个人来说 我对我很明显的不同所以。","sentence_en":"But back then, I remember being a bit at a loss: ‘Wow, is this okay? Can you say that? Oh, so you can say that.’ You know, personally, I felt a clear difference in myself."},{"id":"405","start":2711.99,"end":2719.67,"displayStart":2711.99,"displayEnd":2719.67,"displayMid":2715.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.916742,"pitch":21.474653,"speechRate":6.109,"hasEvents":false,"sentence_source":"能够想到这个环境来接你所有的段子的时候 每个人的反应是会因为时间的不同而会呈现出完全不同的状态。","sentence_en":"When you can imagine that the environment will catch all your jokes, everyone’s reaction changes completely depending on the time."},{"id":"406","start":2720.45,"end":2732.55,"displayStart":2720.45,"displayEnd":2732.55,"displayMid":2726.5,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.757249,"pitch":24.942648,"speechRate":5.702,"hasEvents":false,"sentence_source":"我希望大家觉得把喜剧演员当做喜剧演员看，我真的觉得我自己在台上说的所有的点，只代表我今天此时此刻这个笑点要这么出，我一点都没有那个自恋和那个能力。","sentence_en":"I hope people see comedians as comedians. I truly believe that everything I say on stage only represents how I want to land the joke at that moment. I have no narcissism or ability to do more."},{"id":"407","start":2732.55,"end":2742.67,"displayStart":2732.55,"displayEnd":2742.67,"displayMid":2737.61,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.3,"loudness":0.666207,"pitch":23.960571,"speechRate":5.435,"hasEvents":false,"sentence_source":"觉得我可以给你什么什么人生的建议啊 指导啊，怎么一点都没有 我没有这个能力，我的人生都活得抓着脑塞的，也是每天稀里糊涂的。","sentence_en":"To give life advice or guidance—none at all. I don’t have that ability. My own life is a mess, and I muddle through every day."},{"id":"408","start":2742.67,"end":2752.21,"displayStart":2742.67,"displayEnd":2752.21,"displayMid":2747.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.098675,"pitch":22.729015,"speechRate":6.289,"hasEvents":false,"sentence_source":"稍微给听众解释一下，怕大家如果没有完全追喜剧这段单口记的话，会有点懵 刚才为什么，我跟小鹿讲到这些 她会有觉得很多的焦虑 很多的困惑。","sentence_en":"Just to explain to the audience: if you haven’t been following this stand-up comedy series closely, you might be confused about why I said those things just now. When I talked with Xiaolu, she had a lot of anxiety and confusion."},{"id":"409","start":2752.21,"end":2762.99,"displayStart":2752.21,"displayEnd":2762.99,"displayMid":2757.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.013794,"pitch":23.154335,"speechRate":5.516,"hasEvents":false,"sentence_source":"因为她这次拿了那个亚军 然后成绩特别好，就是反馈非常好 但同时也会有一些别的声音，就觉得她对于讲婚礼 讲婚姻 讲生活当中很多段子。","sentence_en":"Because she got second place this time and did really well—great feedback—but there were also other voices. Some people felt that her jokes about weddings, marriage, and daily life..."},{"id":"410","start":2762.99,"end":2776.67,"displayStart":2762.99,"displayEnd":2776.67,"displayMid":2769.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.4,"loudness":0.940923,"pitch":18.259056,"speechRate":4.605,"hasEvents":false,"sentence_source":"会跟很多观众的感受不同 大家会产生各种各样的解读，就这种解读引发的一些负面的声音 可能会对她有一些困扰，大概是这么一个过程 但是这种困扰。","sentence_en":"...differed from many audience members’ experiences, leading to various interpretations. Those negative interpretations might bother her. That’s roughly the situation."},{"id":"411","start":2776.67,"end":2780.87,"displayStart":2776.67,"displayEnd":2780.87,"displayMid":2778.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.98479,"pitch":18.944971,"speechRate":6.946,"hasEvents":false,"sentence_source":"是不是每一个喜剧演员都会有的一个你们的工作常态是你们的日常。","sentence_en":"Is that kind of trouble a normal part of every comedian’s work? Is it your daily routine?"},{"id":"412","start":2780.87,"end":2794.11,"displayStart":2780.87,"displayEnd":2794.11,"displayMid":2787.49,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":-0.1,"loudness":0.897896,"pitch":22.974812,"speechRate":4.834,"hasEvents":false,"sentence_source":"是的 所以好多人都已经卸载了社交软件，我其实也挺想卸载的 但是我觉得还是不能卸载，就是现在比如说我看到一些给我的留言什么的，我也会回忆部分。","sentence_en":"Yes, that’s why many people have uninstalled social media. I kind of want to uninstall it too, but I feel I can’t. Now, when I see some comments left for me, I also reflect on some of them."},{"id":"413","start":2794.11,"end":2804.95,"displayStart":2794.11,"displayEnd":2804.95,"displayMid":2799.5299999999997,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.913336,"pitch":25.310575,"speechRate":5.416,"hasEvents":false,"sentence_source":"因为我觉得其实人家人能在茫茫人海中，他喜欢你 而且有这个时间经历跑到网上来跟你说一句，他对你的喜欢还写那么多话 非常不容易。","sentence_en":"Because I think it’s not easy for someone to pick you out in the vast crowd, like you, and take the time to come online and tell you they like you, writing so much. It’s really hard."},{"id":"414","start":2804.95,"end":2807.13,"displayStart":2804.95,"displayEnd":2807.13,"displayMid":2806.04,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.73803,"pitch":28.45575,"speechRate":9.023,"hasEvents":false,"sentence_source":"因为我从来没有对任何人做过这样的事情。","sentence_en":"I’ve never done anything like that for anyone."},{"id":"415","start":2807.13,"end":2815.67,"displayStart":2807.13,"displayEnd":2815.67,"displayMid":2811.4,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.5,"loudness":0.775127,"pitch":23.972588,"speechRate":5.035,"hasEvents":false,"sentence_source":"然后我就觉得在这个时代 爱比恨难多了，恨一个人太容易了，骂别人 给别人造成伤害 是非常容易的事情。","sentence_en":"And I feel that in this era, love is much harder than hate. It’s too easy to hate someone—to curse them, to hurt them."},{"id":"416","start":2815.67,"end":2823.49,"displayStart":2815.67,"displayEnd":2823.49,"displayMid":2819.58,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.808019,"pitch":25.077917,"speechRate":4.821,"hasEvents":false,"sentence_source":"但是你要去爱一个东西 爱一件人，他需要的时间 精力 智力，一切东西都是成指数级增长的。","sentence_en":"But to love something, to love someone, requires time, energy, intelligence—everything increases exponentially."},{"id":"417","start":2823.49,"end":2829.27,"displayStart":2823.49,"displayEnd":2829.27,"displayMid":2826.38,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.8,"loudness":0.807719,"pitch":23.924257,"speechRate":4.819,"hasEvents":false,"sentence_source":"所以如果有人他选择喜欢我，我就是应该就抱以最大的感谢的。","sentence_en":"So if someone chooses to like me, I should be extremely grateful."},{"id":"418","start":2830.51,"end":2837.87,"displayStart":2830.51,"displayEnd":2837.87,"displayMid":2834.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.88682,"pitch":22.524395,"speechRate":5.356,"hasEvents":false,"sentence_source":"你知道像我这几年的改变，就越来越迟到我自己是一个女性，这是一个成长 慢慢的改变过程。","sentence_en":"You know, over the past few years, I’ve become more and more aware that I am a woman. It’s a gradual process of growth and change."},{"id":"419","start":2837.87,"end":2849.79,"displayStart":2837.87,"displayEnd":2849.79,"displayMid":2843.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.960735,"pitch":21.059233,"speechRate":6.535,"hasEvents":false,"sentence_source":"所以很多人也在说作为一个表达者 作为一个单口喜剧演员，你需不需要是一个观念上非常先进的人才可以 才更好，你怎么看 你觉得你自己是一个观念上非常先进的一个人吗。","sentence_en":"So many people ask: as an expresser and a stand-up comedian, do you need to be very progressive in your views to be better? What do you think? Do you see yourself as very progressive?"},{"id":"420","start":2849.79,"end":2863.13,"displayStart":2849.79,"displayEnd":2863.13,"displayMid":2856.46,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.689987,"pitch":24.218246,"speechRate":5.259,"hasEvents":false,"sentence_source":"你先进对应的就是保守落后，我的一个感觉是喜剧舞台上应该多元，我是什么样的人 我就说什么样的类型的段子，觉得每一个种类都有不同的人 在发出不同的声音。","sentence_en":"‘Progressive’ corresponds to ‘conservative’ or ‘backward.’ My feeling is that the comedy stage should be diverse. I am who I am, and I tell the kind of jokes that match me. Every category has different people speaking different voices."},{"id":"421","start":2863.51,"end":2872.73,"displayStart":2863.51,"displayEnd":2872.73,"displayMid":2868.12,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.783721,"pitch":22.104317,"speechRate":6.041,"hasEvents":false,"sentence_source":"我觉得我的真诚就是我现在的人生阶段在发生什么 我在做什么 我就会去表达什么，这是我对舞台的真诚 我无法跳跃我的人生阶段。","sentence_en":"I think my sincerity is that whatever stage of life I’m in, whatever I’m doing, I express that. That’s my sincerity to the stage. I can’t skip stages of my life."},{"id":"422","start":2872.73,"end":2883.81,"displayStart":2872.73,"displayEnd":2883.81,"displayMid":2878.27,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0.1,"loudness":0.718422,"pitch":22.275377,"speechRate":7.013,"hasEvents":true,"sentence_source":"我的认知目前就是这样 我在这个阶段会这么说 可能过两年我的认知变了 我就会去说别的，这也是我觉得大家千万不要相信我在舞台上说的任何话 我都只是在说笑话 笑话不算话。","sentence_en":"My current understanding is like this. I’ll say it at this stage. Maybe in two years, my understanding will change, and I’ll say something else. That’s why I think everyone should never believe anything I say on stage. I’m just telling jokes—jokes don’t count as truth."},{"id":"423","start":2885.67,"end":2891.63,"displayStart":2885.67,"displayEnd":2891.63,"displayMid":2888.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.865822,"pitch":27.96764,"speechRate":6.806,"hasEvents":true,"sentence_source":"因为，我真的觉得我的想法一直在变 我每次听岩中花述的时候 我的感觉 哇 比如说听张春姐姐。","sentence_en":"Because, honestly, my thoughts keep changing. Every time I listen to ‘Blossoms in the Rock,’ I feel, wow—like when I hear Sister Zhang Chun..."},{"id":"424","start":2891.63,"end":2896.25,"displayStart":2891.63,"displayEnd":2896.25,"displayMid":2893.94,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.5,"loudness":0.7553,"pitch":26.763569,"speechRate":6.067,"hasEvents":false,"sentence_source":"然后那个马威威姐姐 你们在对谈的时候 你们思想之间那个碰撞。","sentence_en":"...and Sister Ma Weiwei, when you talk, the collision of your ideas..."},{"id":"425","start":2896.25,"end":2905.05,"displayStart":2896.25,"displayEnd":2905.05,"displayMid":2900.65,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":-0.1,"loudness":0.711256,"pitch":25.063192,"speechRate":6.023,"hasEvents":false,"sentence_source":"我觉得你们已经超越了某个阶段 你们的价值观什么的好像趋于比较稳定，但我还没有到那个阶段 我有时候听岩中花述的时候。","sentence_en":"I feel you’ve already surpassed a certain stage. Your values seem more stable. But I haven’t reached that stage yet. Sometimes when I listen to ‘Blossoms in the Rock,’"},{"id":"426","start":2905.05,"end":2917.29,"displayStart":2905.05,"displayEnd":2917.29,"displayMid":2911.17,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.720803,"pitch":23.670082,"speechRate":5.392,"hasEvents":false,"sentence_source":"我觉得这些姐姐们对我来说有点像一个我的精神上的小姨和姑姑，他们超越了很多东西 他们经历了很多东西，他们来这里告诉大家一个怕比较坚定的东西了。","sentence_en":"I feel these older sisters are like my spiritual aunts. They’ve transcended a lot, they’ve been through a lot, and they come here to tell everyone something relatively firm."},{"id":"427","start":2917.29,"end":2923.59,"displayStart":2917.29,"displayEnd":2923.59,"displayMid":2920.44,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.3,"loudness":0.728767,"pitch":22.942074,"speechRate":5.653,"hasEvents":false,"sentence_source":"但我现在 我看了一下 我可能是岩中花述来的人里面，目前算没有那么成熟的一个。","sentence_en":"But me now—I think I’m currently one of the less mature ones among the guests on ‘Blossoms in the Rock.’"},{"id":"428","start":2923.59,"end":2937.01,"displayStart":2923.59,"displayEnd":2937.01,"displayMid":2930.3,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.731489,"pitch":23.553841,"speechRate":5.862,"hasEvents":false,"sentence_source":"我觉得我的想法 我的一切观念都极其它不稳定，一直在变化 我现在的想法 跟我以前想法也不一样了，我以后的想法 跟我现在的也不一样，我一点都不坚定自己的想法 我只坚定我的笑点。","sentence_en":"I think my thoughts and all my concepts are extremely unstable, always changing. My current thoughts are different from before, and my future thoughts will be different from now. I’m not firm in my own ideas—I’m only firm about my punchlines."},{"id":"429","start":2937.01,"end":2944.39,"displayStart":2937.01,"displayEnd":2944.39,"displayMid":2940.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.99455,"pitch":24.788004,"speechRate":7.185,"hasEvents":false,"sentence_source":"人都是这样的 人一定是在不同的阶段 会有不同的表达，如果你是真诚表达的话 因为人是在每时每刻都在变化的。","sentence_en":"That’s how people are. At different stages, people express different things. If you’re expressing sincerely, it’s because people change every moment."},{"id":"430","start":2944.39,"end":2951.99,"displayStart":2944.39,"displayEnd":2951.99,"displayMid":2948.1899999999996,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.4,"loudness":0.853837,"pitch":24.940004,"speechRate":6.213,"hasEvents":false,"sentence_source":"对 除非你以此为商品 你就必须稳定这个商品，我以前比如讲的很多段子 我现在回看头皮发麻 我觉得不能那么讲。","sentence_en":"Yeah, unless you’re selling it as a product, then you have to keep it stable. When I look back at some jokes I told before, my scalp tingles—I can’t believe I said that."},{"id":"431","start":2951.99,"end":2957.03,"displayStart":2951.99,"displayEnd":2957.03,"displayMid":2954.51,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":-0.1,"loudness":0.868108,"pitch":26.529945,"speechRate":6.424,"hasEvents":false,"sentence_source":"但是那就是过去的我 我没有办法 我也无法超越5年前10年前的自己。","sentence_en":"But that was the past me. I can’t help it. I can’t surpass myself from five or ten years ago."},{"id":"432","start":2957.03,"end":2959.37,"displayStart":2957.03,"displayEnd":2959.37,"displayMid":2958.2,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.655683,"pitch":23.234764,"speechRate":4.95,"hasEvents":false,"sentence_source":"那时候我就只能那么讲。","sentence_en":"At that time, I could only say it that way."},{"id":"433","start":2959.37,"end":2963.57,"displayStart":2959.37,"displayEnd":2963.57,"displayMid":2961.4700000000003,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.5,"loudness":0.827527,"pitch":24.28089,"speechRate":7.115,"hasEvents":false,"sentence_source":"那可能10年之后 我现在觉得我的这些想法也非常愚蠢 特别傻。","sentence_en":"Maybe ten years from now, I’ll think my current ideas are also very foolish and stupid."},{"id":"434","start":2963.57,"end":2973.87,"displayStart":2963.57,"displayEnd":2973.87,"displayMid":2968.7200000000003,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.783015,"pitch":24.633423,"speechRate":6.142,"hasEvents":false,"sentence_source":"但是我觉得我回看的时候 可能觉得笑点还挺不错的，我的人生就是一直不断地进步 我真的是就是那种，极其觉得我在台上最大的价值就是我的笑点。","sentence_en":"But when I look back, I might think the punchlines were pretty good. My life is just constant progress. I’m the type who truly feels that my biggest value on stage is my punchlines."},{"id":"435","start":2974.45,"end":2985.19,"displayStart":2974.45,"displayEnd":2985.19,"displayMid":2979.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.8,"loudness":0.956722,"pitch":20.558817,"speechRate":6.307,"hasEvents":true,"sentence_source":"那你现在觉得好笑这点是不是已经给女性也增添魅力了，你知道这是我这几年的一个改变，我这几年就是因为通过你们，我会觉得不管对于谁好笑都是加分项。","sentence_en":"So do you now think that being funny adds charm to women too? You know, this has been a change for me in recent years. Through you all, I've come to feel that being funny is a plus for anyone."},{"id":"436","start":2985.19,"end":2991.97,"displayStart":2985.19,"displayEnd":2991.97,"displayMid":2988.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.986207,"pitch":19.732773,"speechRate":6.159,"hasEvents":false,"sentence_source":"小时候你会认为好笑是跟男性连在一起的，现在你会觉得好笑女性也是有魅力的，而且是性感的。","sentence_en":"When I was young, I thought being funny was connected to being male. Now I think being funny is also charming and even sexy for women."},{"id":"437","start":2991.97,"end":2997.87,"displayStart":2991.97,"displayEnd":2997.87,"displayMid":2994.92,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.981993,"pitch":30.100765,"speechRate":7.72,"hasEvents":false,"sentence_source":"因为我无法作为一个男性来看这个世界，我就是一个女性，我每次看到其他女戏剧演员大家好笑的时候。","sentence_en":"Because I can’t see the world as a man. I am a woman. Every time I see other female comedians and the audience laughs,"},{"id":"438","start":2997.87,"end":2998.97,"displayStart":2997.87,"displayEnd":2998.97,"displayMid":2998.42,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Positive","score":0.8,"loudness":1.071041,"pitch":33.987053,"speechRate":6.542,"hasEvents":false,"sentence_source":"我觉得哇 有魅力。","sentence_en":"I think, ‘Wow, that’s attractive.’"},{"id":"439","start":2999.57,"end":3009.39,"displayStart":2999.57,"displayEnd":3009.39,"displayMid":3004.48,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.85124,"pitch":27.382452,"speechRate":5.295,"hasEvents":false,"sentence_source":"对 她就是魅力，他就是作为一个 我经常就是看人啊什么的去超越性别，我不怎么会经常 这也是可能会我不符合潮流的一个点。","sentence_en":"Yeah, she’s attractive. I often look at people beyond gender. That’s probably another way I don’t follow the trend."},{"id":"440","start":3009.39,"end":3019.55,"displayStart":3009.39,"displayEnd":3019.55,"displayMid":3014.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Positive","score":0.5,"loudness":1.022892,"pitch":21.308239,"speechRate":6.399,"hasEvents":false,"sentence_source":"这是个阶段 你会过去这个阶段的，相信我因为我只有点像你什么，但我的确我也经历过你这个阶段，会因为这我的先进，就我可以超越性别看待很多问题。","sentence_en":"It’s a phase. You’ll get past it, trust me—because I’m a bit like you. But I really have been through this phase. Because of my progressiveness, I could see many things beyond gender."},{"id":"441","start":3019.55,"end":3026.93,"displayStart":3019.55,"displayEnd":3026.93,"displayMid":3023.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":1.05275,"pitch":21.884762,"speechRate":5.925,"hasEvents":true,"sentence_source":"但最终你会变成一个完全通过女性视角去看待这个世界的一个人，但这都需要时间 他就是个过程。","sentence_en":"But eventually you’ll become someone who sees the world completely through a female perspective. It takes time—it’s just a process."},{"id":"442","start":3027.61,"end":3030.45,"displayStart":3027.61,"displayEnd":3030.45,"displayMid":3029.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.6,"loudness":0.877923,"pitch":22.152765,"speechRate":5.634,"hasEvents":true,"sentence_source":"所以你也不用去担心和审视批判自己。","sentence_en":"So you don’t need to worry or judge and criticize yourself."},{"id":"443","start":3031.09,"end":3045.14,"displayStart":3031.09,"displayEnd":3045.14,"displayMid":3038.115,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.7,"loudness":0.861075,"pitch":24.759226,"speechRate":5.174,"hasEvents":true,"sentence_source":"我觉得我只能接纳我这个阶段，就现在这个阶段我的比如说我看到女生这么好笑的时候，就是那种就是一个人的魅力在我想那个形容到底是什么，就是感觉人类进化的领端。","sentence_en":"I think I can only accept myself at this stage. For example, when I see a woman who is so funny, I wonder what the description of that charm really is. It feels like the leading edge of human evolution."},{"id":"444","start":3045.9,"end":3050.98,"displayStart":3045.9,"displayEnd":3050.98,"displayMid":3048.44,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":0.990657,"pitch":27.483953,"speechRate":6.439,"hasEvents":true,"sentence_source":"就是因为动物是不会发笑的嘛，就是笑是一个非常一个非常典型的人类行为。","sentence_en":"Because animals don’t laugh. Laughter is a very typical human behavior."},{"id":"445","start":3050.98,"end":3055.1,"displayStart":3050.98,"displayEnd":3055.1,"displayMid":3053.04,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.6,"loudness":0.973719,"pitch":25.621683,"speechRate":5.612,"hasEvents":true,"sentence_source":"我觉得一个人让别人发笑这件事情，他就是太人类了。","sentence_en":"I think making people laugh is just so human."},{"id":"446","start":3056.48,"end":3058.16,"displayStart":3056.48,"displayEnd":3058.16,"displayMid":3057.3199999999997,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":0.73013,"pitch":24.61356,"speechRate":3.012,"hasEvents":true,"sentence_source":"什么形容搞。","sentence_en":"What kind of description is that?"},{"id":"447","start":3058.16,"end":3062.08,"displayStart":3058.16,"displayEnd":3062.08,"displayMid":3060.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Positive","score":0.7,"loudness":0.994233,"pitch":22.277721,"speechRate":4.592,"hasEvents":false,"sentence_source":"笑 让别人笑 事件非常高贵的事情 也很难是。","sentence_en":"Laughter—making others laugh—is a very noble thing, and it’s also difficult."},{"id":"448","start":3062.08,"end":3074.38,"displayStart":3062.08,"displayEnd":3074.38,"displayMid":3068.23,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.802545,"pitch":24.455961,"speechRate":6.341,"hasEvents":false,"sentence_source":"你刚刚说的这个点 我也想起来，就是我觉得是不是起居不同的类型吗，比如说在台上让人笑有很多种方式，像这种它也是它竭尽所能 非常真诚的一个方式，后来想想我为什么不太想自嘲啊。","sentence_en":"What you just said reminds me—could it be about different types of routines? Like, there are many ways to make people laugh on stage, and this is one that's sincere and goes all out. Later I thought about why I'm not so into self-deprecation anymore."},{"id":"449","start":3074.38,"end":3086.66,"displayStart":3074.38,"displayEnd":3086.66,"displayMid":3080.52,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":-0.1,"loudness":0.772832,"pitch":23.340921,"speechRate":5.7,"hasEvents":false,"sentence_source":"然后通过这个方式来让人发笑，第一是早期我也会自嘲啊什么，但我觉得我过了用这种方式让人发笑的阶段，第二是 我好像不太喜欢做一个女性在台上过多的贬低自己。","sentence_en":"And using that to get laughs—first, I used to do self-deprecation early on, but I feel like I've moved past that phase. Second, I just don't like putting myself down too much on stage as a woman."},{"id":"450","start":3086.66,"end":3096.42,"displayStart":3086.66,"displayEnd":3096.42,"displayMid":3091.54,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Negative","score":-0.5,"loudness":0.866157,"pitch":27.198923,"speechRate":6.51,"hasEvents":false,"sentence_source":"就可能因为以往的这些作品里 你经常 哪怕是像我们说的那时候，小评里面有女性角色 但是女性角色也经常在里面扮演一个更被嘲笑 嘲弄的对象。","sentence_en":"Maybe because in past works, even back then, female characters often played the role of being laughed at or mocked."},{"id":"451","start":3096.42,"end":3104.22,"displayStart":3096.42,"displayEnd":3104.22,"displayMid"  and Television","sentiment_en":"Positive","score":0.5,"loudness":0.903003,"pitch":21.669201,"speechRate":5.626,"hasEvents":false,"sentence_source":"年前我曾经特别喜欢的一个演员就是 Jamie Lee Curtis，就是他近些年最为大家所熟悉的影片就是《顺席全宇宙》，他凭借里面那个美国税务人员的那个角色。","sentence_en":"Years ago, an actor I really liked was Jamie Lee Curtis. She's best known recently for *Everything Everywhere All at Once*, playing that IRS agent role."},{"id":"466","start":3212.88,"end":3224.66,"displayStart":3212.88,"displayEnd":3224.66,"displayMid":3218.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.884197,"pitch":19.171703,"speechRate":5.348,"hasEvents":false,"sentence_source":"后来拿到那年奥斯卡最佳女配，他年轻的时候是以身材著称的一个挺性感的女演员，身材非常非常美，他后来几年前有一次给Vogue杂志拍组大片。","sentence_en":"She won the Best Supporting Actress Oscar that year. She was known for her figure as a young actress—very sexy, beautiful body. Then a few years ago, she did a big photoshoot for Vogue magazine."},{"id":"467","start":3224.66,"end":3234.44,"displayStart":3224.66,"displayEnd":3234.44,"displayMid":3229.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.99732,"pitch":23.860943,"speechRate":4.908,"hasEvents":false,"sentence_source":"就是完全以一个中年女性可能最常有的样子见人，她说我后来因为年纪变大了以后，不想再把很多时间画在健身上。","sentence_en":"She presented herself as a middle-aged woman might typically look. She said she didn't want to spend so much time working out anymore as she got older,"},{"id":"468","start":3234.44,"end":3236.22,"displayStart":3234.44,"displayEnd":3236.22,"displayMid":3235.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.005553,"pitch":25.326139,"speechRate":6.897,"hasEvents":false,"sentence_source":"所以慢慢身材有一些走样。","sentence_en":"So her body changed a bit."},{"id":"469","start":3236.22,"end":3247.6,"displayStart":3236.22,"displayEnd":3247.6,"displayMid":3241.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.8,"loudness":0.876149,"pitch":22.533382,"speechRate":5.272,"hasEvents":false,"sentence_source":"然后那次那组大片给我的震撼非常直达，你会觉得她给很多女性带来的感受就是，你也可以突破身材对你的束缚，你也可以变得没有那么的焦虑。","sentence_en":"That photoshoot really struck me. I feel like what she gave to many women was: you can break free from the constraints of your body, and you don't have to be so anxious."},{"id":"470","start":3247.6,"end":3257.64,"displayStart":3247.6,"displayEnd":3257.64,"displayMid":3252.62,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":0.897304,"pitch":25.674803,"speechRate":6.168,"hasEvents":false,"sentence_source":"对 我感觉就是大家都在一个走向跟自由的过程当中，就是看走到哪儿嘛，比如说刚刚我们聊那个，我现在的认知啊什么的一些意识，它就在这个阶段。","sentence_en":"Yeah, I feel like everyone is on a journey toward freedom—it's just a matter of how far you've gone. Like what we were just talking about, my current mindset and awareness are at this stage."},{"id":"471","start":3257.64,"end":3264.14,"displayStart":3257.64,"displayEnd":3264.14,"displayMid":3260.89,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.6,"loudness":0.852282,"pitch":26.719326,"speechRate":7.631,"hasEvents":false,"sentence_source":"那我下一个阶段是什么，我也不知道 但是我会努力的走向下一个阶段，但在每一个阶段我就接纳 我现在就这个阶段。","sentence_en":"As for the next stage, I don't know, but I'll work toward it. But at each stage, I accept myself where I am."},{"id":"472","start":3264.68,"end":3274.52,"displayStart":3264.68,"displayEnd":3274.52,"displayMid":3269.6,"speaker":"Lu Yu","s ":1.082651,"pitch":21.266884,"speechRate":5.4,"hasEvents":false,"sentence_source":"就跟他们会更接受一个男人更高 女孩矮一点，男的稍微大一点 女孩小一点，人们相对认为这是一个常态 那其余就是非常态。","sentence_en":"Just like they're more accepting of a taller man and a shorter woman, or the man being slightly older and the woman younger. People see that as normal, and anything else is abnormal."},{"id":"593","start":4056.4,"end":4062.88,"displayStart":4056.4,"displayEnd":4062.88,"displayMid":4059.6400000000003,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.943887,"pitch":27.552156,"speechRate":4.835,"hasEvents":false,"sentence_source":"对 但我感觉这个所谓常态跟现在的新常态正在一个新老交替的过程中。","sentence_en":"Yeah, but I feel this so-called normal and the new normal are in a transition from old to new."},{"id":"594","start":4062.88,"end":4067.42,"displayStart":4062.88,"displayEnd":4067.42,"displayMid":4065.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.869742,"pitch":25.267303,"speechRate":5.286,"hasEvents":false,"sentence_source":"慢慢的一个转换的过程当中 我们处于这样的一个转折期。","sentence_en":"It's a gradual shift—we're in such a turning period."},{"id":"595","start":4067.42,"end":4078.76,"displayStart":4067.42,"displayEnd":4078.76,"displayMid":4073.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":1.096024,"pitch":22.890793,"speechRate":4.586,"hasEvents":false,"sentence_source":"对 尴尬期 我是觉得我们还是 如果有生活上的美满非常之好，不用为了事业完全放弃自己的情感 但是事业该努力还是要努力。","sentence_en":"Right, an awkward phase. I think we should still—if we can have a happy life, that's great. Don't completely give up your emotions for your career, but you should still work hard on your career."},{"id":"596","start":4078.76,"end": ion and performance expression","color":"#B9B4B6","opacity":0.2,"firstCategory":"Comedy creation and performance expression","secondCategory":"Comedy creation and performance expression","keyWords":["Episode Summary","Opening","Introduction"],"sentence_count":248,"duration":1598.6999999999998,"duration_formatted":"26:39","proportion":0.34867211473661475,"representative_sentences_en":["Because of your offensiveness, you try to use comedy to defuse it, but people don't accept your comedy. Now I'm already at a point where I can feel it myself: often something pops into my head, and immediately my second thought is, 'This is going to get me roasted.'","But lately, I've noticed a terrifying trend: people don't take jokes as jokes anymore. I feel that this makes jokes less and less funny. Yeah, there's a huge castration of comedy creation."]},{"cluster":2,"label":"C2","name":"Humor creation and growth experience","color":"#CB7281","opacity":0.2,"firstCategory":"Humor creation and growth experience","secondCategory":"Humor Creation and Growth Experience","keyWords":["Make People Laugh","Funny","Laugh at Others","Several","Read Extracurricular Books"],"sentence_count":71,"duration":430.49999999999955,"duration_formatted":"7:10","proportion":0.09389087720905268,"representative_sentences_en":["Then a while ago, I started using Feixin, where you can send group messages for free. I persisted for almost two years, sending a daily internet joke to my classmates who were my Feixin friends.","During my upbringing, crosstalk was extremely popular. I listened to all of it, and I even bought books that printed crosstalk scripts. I bought a crosstalk album by Jiang Kun, I think—'Koukou Tuoxie'."]},{"cluster":3,"label":"C3","name":"Women in Comedy and Female Expression","color":"#DFA870","opacity":0.2,"firstCategory":"Women in Comedy and Female Expression","secondCategory":"Women in Comedy and Female Expression","keyWords":["Dialogue with Deer","Yunnan","Tom and Jerry","Mandarin","Their {"slug":"s7e8","label":"S7E8","guest":"Zhai Yongming"},{"slug":"s7e9","label":"S7E9","guest":"Xiaopa"},{"slug":"s7e10","label":"S7E10","guest":"Wang Haolu"},{"slug":"s8e1","label":"S8E1","guest":"Jiang Shengnan"},{"slug":"s8e2","label":"S8E2","guest":"Chen Hui"},{"slug":"s8e3","label":"S8E3","guest":"Zhashiyi Re"},{"slug":"s8e4","label":"S8E4","guest":"Li Zishu"},{"slug":"s8e5","label":"S8E5","guest":"Zhu Tianwen"},{"slug":"s8e6","label":"S8E6","guest":"Niaoniao"},{"slug":"s8e7","label":"S8E7","guest":"Li Yinhe"},{"slug":"s8e8","label":"S8E8","guest":"Zhang Hong"},{"slug":"s8e9","label":"S8E9","guest":"Li Rui"},{"slug":"s9e1","label":"S9E1","guest":"Zhang Zanying"},{"slug":"s9e2","label":"S9E2","guest":"Zhang Nuo"},{"slug":"s9e3","label":"S9E3","guest":"Cai Gao"},{"slug":"s9e4","label":"S9E4","guest":"Meng Man"}]}}</script>
<script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
