nt. I don't know if you've experienced that change."},{"id":"39","start":267.27,"end":279.85,"displayStart":267.27,"displayEnd":279.85,"displayMid":273.56,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.966298,"pitch":28.033798,"speechRate":6.316,"hasEvents":false,"sentence_source":"我觉得这个节目对我不会有那么大的改变，当年奇葩说的时候是会有那个改变，而且那时候改变它是一下子你会有点失调，你不知道该怎么面对别人，比如说我在奇葩说的时候一直穿西装。","sentence_en":"I think this show won't change me that much. Back in the 'Qi Pa Shuo' days, there was a change, and at that time it was sudden—you feel a bit off balance, you don't know how to face others. For example, on 'Qi Pa Shuo', I always wore a suit."},{"id":"40","start":279.85,"end":284.31,"displayStart":279.85,"displayEnd":284.31,"displayMid":282.08000000000004,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.007833,"pitch":24.748287,"speechRate":5.83,"hasEvents":false,"sentence_source":"然后在台上是那个风格，我其实是一个平时生活里经常乱说话。","sentence_en":"And on stage I had that style. Actually, in daily life I often talk nonsense."},{"id":"41","start":284.31,"end":285.75,"displayStart":284.31,"displayEnd":285.75,"displayMid":285.03,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.949389,"pitch":25.4447,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后大笑什么的人。","sentence_en":"And laugh loudly, that kind of person."},{"id":"42","start":285.75,"end":295.15,"displayStart":285.75,"displayEnd":295.15,"displayMid":290.45,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Negative","score":-0.3,"loudness":1.077615,"pitch":33.394577,"speechRate":6.448,"hasEvents":false,"sentence_source":"但是一旦遇到观众说爱小鹿你好，我就会本能的就是你尿尿尿就弯这个腰，我也不知道我就觉得这个也很奇怪，又会推开我和观众之间的距离。","sentence_en":"But whenever a fan says 'Hello, Xiao Lu', I instinctively bow like this. I don't know why, I think it's weird too, and it pushes distance between me and the audience."},{"id":"43","start":295.15,"end":306.83,"displayStart":295.15,"displayEnd":306.83,"displayMid":300.99,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":1.003543,"pitch":30.046165,"speechRate":6.625,"hasEvents":false,"sentence_source":"但是我就有点不知道该怎么跟他们接触，但现在我好像就好一些，但这是一个成长的过程，就现在比如说别人跟我的互动，我就很热情 然后他跟我合影 我也会抱着他合影什么的。","sentence_en":"But I was a bit unsure how to interact with them. Now I seem to be better. It's a growth process. For example, now when someone interacts with me, I'm very warm. If they want a photo, I'll even hug them."},{"id":"44","start":306.83,"end":314.23,"displayStart":306.83,"displayEnd":314.23,"displayMid":310.53,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.7,"loudness":1.030021,"pitch":28.959738,"speechRate":6.58,"hasEvents":false,"sentence_source":"因为我觉得 我跟他可能这辈子就见这一次，如果他很喜欢我 然后他还表达出来了，我会特别希望他知道我很感谢他。","sentence_en":"Because I think we might only meet this once in our lives. If they really like me and they express it, I especially want them to know I'm grateful."},{"id":"45","start":314.23,"end":323.93,"displayStart":314.23,"displayEnd":323.93,"displayMid":319.08000000000004,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.992582,"pitch":27.689932,"speechRate":5.576,"hasEvents":false,"sentence_source":"所以我现在这个互动我就很自然，但以前比如说第一次被更多人知道的时候，我就会有那种 看起来以前那些老艺人都是弯着腰。","sentence_en":"So now my interactions are very natural. But before, when I first became known to more people, I felt like those old-time performers who always bowed."},{"id":"46","start":323.93,"end":325.93,"displayStart":323.93,"displayEnd":325.93,"displayMid":324.93,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.516215,"pitch":33.157688,"speechRate":5,"hasEvents":false,"sentence_source":"然后就是感恩感恩那样。","sentence_en":"And it was all 'grateful, grateful' like that."},{"id":"47","start":325.93,"end":328.57,"displayStart":325.93,"displayEnd":328.57,"displayMid":327.25,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":0.962967,"pitch":28.413813,"speechRate":5.303,"hasEvents":false,"sentence_source":"我觉得这是我学习到的一个对的。","sentence_en":"I think that's a correct thing I learned."},{"id":"48","start":328.57,"end":330.19,"displayStart":328.57,"displayEnd":330.19,"displayMid":329.38,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.4,"loudness":0.992778,"pitch":33.14484,"speechRate":6.36,"hasEvents":false,"sentence_source":"对待别人尊重的方式。","sentence_en":"A way to treat others with respect."},{"id":"49","start":330.19,"end":338.21,"displayStart":330.19,"displayEnd":338.21,"displayMid":334.2,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.934576,"pitch":28.103487,"speechRate":6.234,"hasEvents":false,"sentence_source":"但是其实我后来意识到，大家希望喜剧演员给她的是亲切，像我之前有次在飞机上有个空姐见到我，空姐一般都很端庄嘛。","sentence_en":"But actually I later realized that people want comedians to give them warmth. Like once on a plane, a flight attendant saw me. Flight attendants are usually very dignified."},{"id":"50","start":338.21,"end":346.33,"displayStart":338.21,"displayEnd":346.33,"displayMid":342.27,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.5,"loudness":0.981514,"pitch":28.081299,"speechRate":5.584,"hasEvents":false,"sentence_source":"然后那空姐她也见到我，你感觉我激发了她那个内心搞笑的那个部分啊，她一看到我她就 诶诶诶，你是那个。","sentence_en":"And when she saw me, you could feel I triggered the funny part inside her. She went, 'Hey hey hey, you're that..."},{"id":"51","start":346.33,"end":352.01,"displayStart":346.33,"displayEnd":352.01,"displayMid":349.16999999999996,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.077589,"pitch":34.192829,"speechRate":5.282,"hasEvents":false,"sentence_source":"然后我下去 哦你刚才不是还，F你是您好，刚刚她一下子就变成这个样子。","sentence_en":"Then I said, 'Oh, weren't you just...' and she went from polite 'Hello' to that in an instant."},{"id":"52","start":352.01,"end":360.07,"displayStart":352.01,"displayEnd":360.07,"displayMid":356.03999999999996,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":1.050207,"pitch":28.985994,"speechRate":6.281,"hasEvents":false,"sentence_source":"然后就觉得哇好可爱啊，就是她一下子会觉得像我跟她是很近的朋友，就跟在一起搞笑的姐妹那种，她会展现出这一面来。","sentence_en":"And I thought, 'Wow, so cute.' She suddenly felt like we were close friends, like sisters joking around. She showed that side of her."},{"id":"53","start":360.07,"end":367.35,"displayStart":360.07,"displayEnd":367.35,"displayMid":363.71000000000004,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.129869,"pitch":27.412046,"speechRate":5.474,"hasEvents":false,"sentence_source":"然后我就慢慢觉得 其实他希望的是 我就像他朋友一样对待，而不是展现出我对他的那个感谢。","sentence_en":"Then I gradually realized that what they really want is for me to treat them like a friend, rather than showing my gratitude."},{"id":"54","start":367.35,"end":379.25,"displayStart":367.35,"displayEnd":379.25,"displayMid":373.3,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.030849,"pitch":27.873354,"speechRate":5.882,"hasEvents":false,"sentence_source":"所以我就这些东西都一直在不断的变化学习，之前也拧吧 像我七八说之后 有一段时间决定去上学嘛，去读了一个那个MBA 我也是在那我也不知道该怎么跟别人接触。","sentence_en":"So I've been constantly changing and learning. Before, it was awkward. After 'Qi Ba Shuo', I decided to go back to school and got an MBA. At that time, I also didn't know how to interact with others."},{"id":"55","start":379.25,"end":392.03,"displayStart":379.25,"displayEnd":392.03,"displayMid":385.64,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.048903,"pitch":27.717562,"speechRate":6.15,"hasEvents":false,"sentence_source":"因为我觉得别人认识的我是视频里的那个我，我也不知道生活里的我是否是别人期待的，比如说我平时是一个穿衣服什么的都比较简单的人，我也不太会在物质上面花太多的钱什么的。","sentence_en":"Because I felt that people knew the me from the videos. I didn't know if the real-life me was what others expected. For example, I usually dress very simply, and I don't spend much money on material things."},{"id":"56","start":392.03,"end":397.49,"displayStart":392.03,"displayEnd":397.49,"displayMid":394.76,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.978824,"pitch":25.842693,"speechRate":6.331,"hasEvents":false,"sentence_source":"然后比如说班上的人，确实他们本身也是，可能相对来说经济条件比较好的一群人。","sentence_en":"And the people in my class were indeed a group with relatively better financial conditions."},{"id":"57","start":397.49,"end":408.17,"displayStart":397.49,"displayEnd":408.17,"displayMid":402.83000000000004,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.4,"loudness":0.941156,"pitch":25.307388,"speechRate":5.84,"hasEvents":false,"sentence_source":"然后我当时一开始我就快觉得哎呀天哪，我感觉就是好像跟哪都没接上，班上的人都知道啊，他是那个奇葩说的那个变手，他们知道的就是这个标签。","sentence_en":"At first I was like, 'Oh my god, I feel like I don't fit in anywhere.' Everyone in class knew, 'He's that debater from Qi Pa Shuo.' That's all they knew—that label."},{"id":"58","start":408.17,"end":413.03,"displayStart":408.17,"displayEnd":413.03,"displayMid":410.6,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.827235,"pitch":29.942736,"speechRate":7.613,"hasEvents":false,"sentence_source":"但是我要怎么去跟别人接触，让他们知道我生活里是个什么样的人，就是永远都素面朝天。","sentence_en":"But how was I supposed to interact with them and let them know what I'm like in real life—that I'm always bare-faced with no makeup."},{"id":"59","start":413.03,"end":422.65,"displayStart":413.03,"displayEnd":422.65,"displayMid":417.84,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.5,"loudness":0.960187,"pitch":25.525961,"speechRate":5.346,"hasEvents":false,"sentence_source":"然后也不怎么过多的在意外形啊外表啊什么的，这是一个当时是一个非常艰难的时期，就是我要从好像有一些人认识我了。","sentence_en":"And I don't care much about appearance or looks. That was a very difficult period. I had to go from being somewhat recognized..."},{"id":"60","start":422.65,"end":431.99,"displayStart":422.65,"displayEnd":431.99,"displayMid":427.32,"speaker":"Xiaolu","speak  no one would say, 'Xiao Lu, do you want to come study an MBA?"},{"id":"71","start":505.83,"end":511.47,"displayStart":505.83,"displayEnd":511.47,"displayMid":508.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.026134,"pitch":22.369499,"speechRate":7.04,"hasEvents":false,"sentence_source":"如果不是因为我在媒体的领域做到一些所谓成绩的话，别人也不会说你要不要来读一NBA。","sentence_en":"If it weren't for my achievements in the media field, others wouldn't say, 'Do you want to come study an MBA?"},{"id":"72","start":511.47,"end":525.35,"displayStart":511.47,"displayEnd":525.35,"displayMid":518.4100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.927183,"pitch":21.82551,"speechRate":5.692,"hasEvents":false,"sentence_source":"所以有时候为什么人要所谓世俗意义上的成功，就是因为真的成功会从一个成功给你带到下一个可能性，这我不知道是公平还是不公平，但有时候你想想你会有一些感慨，不是因为我有多好。","sentence_en":"So sometimes why people pursue so-called worldly success is because success truly leads you from one success to the next possibility. I don't know if that's fair or unfair, but sometimes when you think about it, you feel something. It's not because I'm that great."},{"id":"73","start":525.35,"end":527.95,"displayStart":525.35,"displayEnd":527.95,"displayMid":526.6500000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.157557,"pitch":26.601002,"speechRate":5.361,"hasEvents":false,"sentence_source":"只是因为你之前有了一个成功。","sentence_en":"It's just because you had a success before."},{"id":"74","start":527.95,"end":530.07,"displayStart":527.95,"displayEnd":530.07,"displayMid":529.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.855192,"pitch":25.874109,"speechRate":6.357,"hasEvents":false,"sentence_source":"所以人们会再给你更多的机会。","sentence_en":"So people give you more opportunities."},{"id":"75","start":530.07,"end":535.99,"displayStart":530.07,"displayEnd":535.99,"displayMid":533.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.022597,"pitch":26.274366,"speechRate":5.903,"hasEvents":false,"sentence_source":"因为那时候我还比较小，你不会去想我该不该好，像内心会觉得 我很努力 我应该。","sentence_en":"Because I was still young back then, I didn't think about whether I deserved it. In my heart, I felt, 'I worked hard, I deserve it."},{"id":"76","start":535.99,"end":550.31,"displayStart":535.99,"displayEnd":550.31,"displayMid":543.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Negative","score":-0.4,"loudness":1.040145,"pitch":22.110317,"speechRate":4.785,"hasEvents":false,"sentence_source":"但是事后 我如今在回想 你会觉得 凭什么你就，会感慨 有些时候 好像世俗意义上的成功，就可以把这一切都变得非常的合理，我内心会有一些 第一就是感慨第二会虚。","sentence_en":"But looking back now, you think, 'Why me?' You feel sometimes that worldly success can make everything seem very reasonable. In my heart, first I feel amazed, and second I feel empty."},{"id":"77","start":550.31,"end":556.01,"displayStart":550.31,"displayEnd":556.01,"displayMid":553.16,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.837372,"pitch":22.852232,"speechRate":5.439,"hasEvents":false,"sentence_source":"我当时也是有这个心理 我就是会有一些觉得，真的吗 我去上这个 我凭什么。","sentence_en":"I had that same feeling too. I would think, 'Really? I'm attending this? What makes me qualified?"},{"id":"78","start":556.39,"end":569.71,"displayStart":556.39,"displayEnd":569.71,"displayMid":563.05,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.868459,"pitch":24.754902,"speechRate":5.255,"hasEvents":false,"sentence_source":"但是 行吧 机会来都来了 那还是抓住吧 是这种心理，内心还是有那种细腻的觉得 哇 这一切合理吗，我只是因为好笑 我就可以去做NBA，我就觉得这个事情中间毫无逻辑。","sentence_en":"But okay, since the opportunity's already here, I might as well take it—that's the mindset. Still, deep down, there's this nagging sense of, 'Wow, does any of this make sense? Just because I think it's funny, I get to go to the NBA? There's no logic in this."},{"id":"79","start":569.71,"end":575.85,"displayStart":569.71,"displayEnd":575.85,"displayMid":572.78,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.744123,"pitch":24.879,"speechRate":5.941,"hasEvents":false,"sentence_source":"但确实好像就是你说的那个，它是因为一个世俗意义上的成功，导向了你有更多的机会。","sentence_en":"But it really is like you said: it's because of worldly success that you end up with more opportunities."},{"id":"80","start":576.39,"end":582.65,"displayStart":576.39,"displayEnd":582.65,"displayMid":579.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.186229,"pitch":25.024792,"speechRate":5.546,"hasEvents":false,"sentence_source":"你刚说了一个词 特别关键 好笑，你说啊 好笑就可以这样吗，好笑就可以为所欲为。","sentence_en":"You just said a word that's especially key: 'funny.' You said, 'Can being funny really do that? Can being funny let you do whatever you want?"},{"id":"81","start":584.73,"end":595.67,"displayStart":584.73,"displayEnd":595.67,"displayMid":590.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.7,"loudness":1.040503,"pitch":21.80024,"speechRate":4.713,"hasEvents":false,"sentence_source":"这点我好像从来没有想过，有一天好笑，他不仅是一个非常可贵的品质和优点，而且他会成为一个能够带来赚钱的一个手艺。","sentence_en":"I've never thought about it this way before—that one day, being funny could be not just a rare quality and strength, but also a skill that can make you money."},{"id":"82","start":596.61,"end":603.97,"displayStart":596.61,"displayEnd":603.97,"displayMid":600.29,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":0.985947,"pitch":26.226948,"speechRate":5.497,"hasEvents":false,"sentence_source":"是足异意义上的成功，本来你说好笑跟成功好奇怪的一个，感觉好笑是一个非常幼稚的一个词。","sentence_en":"It's a kind of worldly success. At first, 'funny' and 'success' feel like a really odd pair. 'Funny' sounds like such a childish word."},{"id":"83","start":603.97,"end":608.25,"displayStart":603.97,"displayEnd":608.25,"displayMid":606.11,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.019896,"pitch":27.37112,"speechRate":4.673,"hasEvents":false,"sentence_source":"然后成功又是一个非常成熟，非常大人世界的词。","sentence_en":"And then 'success' is a very mature, very grown-up word."},{"id":"84","start":608.25,"end":610.45,"displayStart":608.25,"displayEnd":610.45,"displayMid":609.35,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Positive","score":0.5,"loudness":0.778805,"pitch":29.813297,"speechRate":7.547,"hasEvents":false,"sentence_source":"然后这两个事情他居然能连到一块了。","sentence_en":"And yet, these two things ended up connecting."},{"id":"85","start":610.45,"end":618.81,"displayStart":610.45,"displayEnd":618.81,"displayMid":614.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentime e_en":"When I was little, growing up in the countryside, I felt there was no chance. I didn't start reading extracurricular books until college. Before college, I always thought reading extracurricular books was a waste of time."},{"id":"93","start":668.61,"end":674.89,"displayStart":668.61,"displayEnd":674.89,"displayMid":671.75,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.5,"loudness":0.95852,"pitch":29.172285,"speechRate":5.724,"hasEvents":false,"sentence_source":"真的 就是我们那儿的教育就是你只有分数 是唯一的衡量标准 其他的一切都不重要。","sentence_en":"Seriously, where I grew up, the only measure was your grades. Nothing else mattered."},{"id":"94","start":674.89,"end":682.07,"displayStart":674.89,"displayEnd":682.07,"displayMid":678.48,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.069404,"pitch":26.174829,"speechRate":5.887,"hasEvents":false,"sentence_source":"所以我就是内化这种东西的人 就是我要实现父母或者是老师眼中的那个你是一个优秀的孩子。","sentence_en":"So I internalized that: I had to be the 'good kid' in my parents' or teachers' eyes."},{"id":"95","start":682.07,"end":687.29,"displayStart":682.07,"displayEnd":687.29,"displayMid":684.6800000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.3,"loudness":0.856997,"pitch":25.345062,"speechRate":6.911,"hasEvents":false,"sentence_source":"因为读书对我要说已经很费劲了 所以我都没有怎么看过课外书 是大学开始看的。","sentence_en":"Reading already took a lot of effort for me, so I barely read any extracurricular books until college."},{"id":"96","start":687.29,"end":699.63,"displayStart":687.29,"displayEnd":699.63,"displayMid":693.46,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.4,"loudness":0.971507,"pitch":24.179106,"speechRate":5.259,"hasEvents":false,"sentence_source":"然后像你刚刚说的小的时候 这些东西我更是都没有接触过 但是我是意识到自己对于好笑的这种渴望或者崇拜，小时候我们村里像我哥是一个好笑的人。","sentence_en":"And things like you just mentioned? I never had exposure to them as a kid. But I did realize my desire or admiration for being funny. Back in my village, my brother was a funny person."},{"id":"97","start":699.63,"end":709.17,"displayStart":699.63,"displayEnd":709.17,"displayMid":704.4,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.5,"loudness":1.091514,"pitch":29.764338,"speechRate":6.025,"hasEvents":false,"sentence_source":"然后还有那种表哥也是好笑，表哥的爸爸 白白之类的，他们几个人都是那种会在生活中，不经意一点点小的事情，他们会说一句好笑的话。","sentence_en":"And there was also a cousin of mine who was funny, and his dad, and some others. They'd all make a funny comment about some small thing in life casually."},{"id":"98","start":709.17,"end":714.81,"displayStart":709.17,"displayEnd":714.81,"displayMid":711.99,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.7,"loudness":1.137515,"pitch":32.836098,"speechRate":7.801,"hasEvents":false,"sentence_source":"然后我觉得旁边就是，每天都是一个跟屁虫的样子吗，跟着他们 然后他们说这句话，我就觉得好开心 好好笑。","sentence_en":"I was just like a little shadow following them around every day. When they said something, I'd feel so happy and amused."},{"id":"99","start":714.81,"end":716.81,"displayStart":714.81,"displayEnd":716.81,"displayMid":715.81,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.000177,"pitch":22.693977,"speechRate":5.5,"hasEvents":false,"sentence_source":"但是我又说不出来你知道。","sentence_en":"But I couldn't really express it, you know?"},{"id":"100","start":716.81,"end":730.09,"displayStart":716.81,"displayEnd":730.09,"displayMid":723.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":1.037838,"pitch":22.061558,"speechRate":5.708,"hasEvents":false,"sentence_source":"在中国喜剧是分地域性的比如，说我们北方的人，主要是被东北这一块的喜剧报北京，听英向省所统治然后，广东香港那边又是猪三角他们体系内的就是跟语言特别紧密的连在一起。","sentence_en":"In China, comedy is regional. For example, northerners are mainly influenced by the comedy from the northeast, like Beijing's Ying Xiangsheng. In Guangdong and Hong Kong, it's the Pearl River Delta style—tied closely to language."},{"id":"101","start":730.09,"end":736.73,"displayStart":730.09,"displayEnd":736.73,"displayMid":733.4100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":1.015213,"pitch":21.548298,"speechRate":6.056,"hasEvents":false,"sentence_source":"我不太了解在云南的那个地方你们的喜剧氛围是主要被中国比如北方南方哪一部分的所影响。","sentence_en":"I don't really know in Yunnan, what region's comedy atmosphere influenced your area—northern, southern, or something else?"},{"id":"102","start":736.73,"end":738.53,"displayStart":736.73,"displayEnd":738.53,"displayMid":737.63,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":0.787249,"pitch":29.023233,"speechRate":7.895,"hasEvents":false,"sentence_source":"我们应该也是被东北统治了。","sentence_en":"We were probably under the influence of the northeast too."},{"id":"103","start":739.05,"end":749.67,"displayStart":739.05,"displayEnd":749.67,"displayMid":744.3599999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.4,"loudness":1.037665,"pitch":27.226393,"speechRate":4.708,"hasEvents":false,"sentence_source":"对东，北无缘佛街，就是我小时候唯一记得的本土好笑的东西就是有人把那个猫和老鼠翻译成云南普通话，怎么说的当时。","sentence_en":"Yeah, the northeast's humor was everywhere. The only locally funny thing I remember from my childhood was someone dubbing 'Tom and Jerry' into Yunnan Mandarin. How did they do it back then?"},{"id":"104","start":749.67,"end":762.39,"displayStart":749.67,"displayEnd":762.39,"displayMid":756.03,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.5,"loudness":1.046897,"pitch":27.687944,"speechRate":3.931,"hasEvents":true,"sentence_source":"大洋鱼小米渣 猫和老鼠 猫把它的名字取成大洋鱼，洋鱼是云南花里面的土豆 对 小米渣，小米渣应该是有点像那种玉米 对。","sentence_en":"Da Yang Yu, Xiao Mi Zha. 'Tom and Jerry'—the cat named itself Da Yang Yu. Yang Yu is a potato from Yunnan cuisine. Yes, Xiao Mi Zha. Xiao Mi Zha is somewhat like corn. Yes."},{"id":"105","start":763.81,"end":777.85,"displayStart":763.81,"displayEnd":777.85,"displayMid":770.8299999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.7,"loudness":1.093789,"pitch":29.758547,"speechRate":5.698,"hasEvents":true,"sentence_source":"原来它不是无声的那种动画片吗，它把它们配音 就是它们在这个过程中碎碎念，两个人争斗 然后一切人物关系，它们都把它说出来了 整个云南人应该都在看那个，就很好笑 那是我第一次意识到。","sentence_en":"So it's not a silent cartoon—they dubbed it, with all the muttering during the process, the two fighting, and all the character relationships spelled out. The whole of Yunnan must have been watching it; it was hilarious. That was the first time I realized."},{"id":"106","start":777.85,"end":791.85,"displayStart":777.85,"displayEnd":791.85,"displayMid":784.85,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.8,"loudness":0.942968,"pitch":26.5387,"speechRate":5.286,"hasEvents":false,"sentence_source":"原来我们云南也有自己的这种喜剧的氛围，就是通过他们叫什么马谱 马该普通话，他们就用这个普通话来演绎毛河老鼠，小时候你就觉得哇塞 我们都云南方言也可以有这种喜剧。","sentence_en":"It turns out Yunnan also has its own comedic atmosphere. Through what they call Mapu, Magai Putonghua, they use this Mandarin to perform 'Mao He Lao Shu'. When I was a child, I thought, wow, even our Yunnan dialect can have this kind of comedy."},{"id":"107","start":791.85,"end":794.15,"displayStart":791.85,"displayEnd":794.15,"displayMid":793,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":1.265841,"pitch":31.504381,"speechRate":9.639,"hasEvents":false,"sentence_source":"对 因为那个毛河老鼠本名叫Tom & Jerry。","sentence_en":"Right, because the original name was 'Tom & Jerry."},{"id":"108","start":794.59,"end":797.61,"displayStart":794.59,"displayEnd":797.61,"displayMid":796.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":1.253233,"pitch":26.91865,"speechRate":5.027,"hasEvents":false,"sentence_source":"所以你判断是大土豆和小玉米粘。","sentence_en":"So you'd say 'Big Potato and Little Corn Sticky' or something."},{"id":"109","start":797.61,"end":800.43,"displayStart":797.61,"displayEnd":800.43,"displayMid":799.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":0.986214,"pitch":27.090034,"speechRate":5.674,"hasEvents":false,"sentence_source":"对对对，因为以往我们觉得好笑的东西。","sentence_en":"Yeah, just like that. Because back then, what we thought was funny"},{"id":"110","start":800.43,"end":804.65,"displayStart":800.43,"displayEnd":804.65,"displayMid":802.54,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.5,"loudness":0.953047,"pitch":25.522612,"speechRate":5.924,"hasEvents":false,"sentence_source":"就是像春晚小品啊 赵本山老师 宋丹丹老师，他们的那些作品。","sentence_en":"was stuff like the Spring Festival Gala sketches from Zhao Benshan and Song Dandan."},{"id":"111","start":804.65,"end":808.93,"displayStart":804.65,"displayEnd":808.93,"displayMid":806.79,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.5,"loudness":1.036408,"pitch":25.126751,"speechRate":5.569,"hasEvents":false,"sentence_source":"所以小的时候因为对于成为一个好笑的人有那种向往。","sentence_en":"So as a kid, I had this longing to become a funny person."},{"id":"112","start":808.93,"end":810.89,"displayStart":808.93,"displayEnd":810.89,"displayMid":809.91,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.3,"loudness":1.048166,"pitch":29.182953,"speechRate":6.897,"hasEvents":false,"sentence_source":"但是你又没有什么创造能力。","sentence_en":"But I didn't have any creative ability."},{"id":"113","start":810.89,"end":813.05,"displayStart":810.89,"displayEnd":813.05,"displayMid":811.97,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.138505,"pitch":29.216803,"speechRate":8,"hasEvents":false,"sentence_source":"所以那时候我记得我看了这些小品。","sentence_en":"So I remember watching those sketches"},{"id":"114","start":813.05,"end":816.47,"displayStart":813.05,"displayEnd":816.47,"displayMid":814.76,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.851325,"pitch":22.985249,"speechRate":5.263,"hasEvents":false,"sentence_source":"然后我在班上模仿坐在我那个小客桌里面。","sentence_en":"and imitating them in class, sitting at my little desk."},{"id":"115","start":816.47,"end":819.33,"displayStart":816.47,"displayEnd":819.33,"displayMid":817.9000000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.064172,"pitch":28.055721,"speechRate":7.067,"hasEvents":false,"sentence_source":"然后周围好几个人来跟我聊天的时候我就模仿。","sentence_en":"And when a few people came over to chat, I'd act them out."},{"id":"116","start":819.33,"end":821.05,"displayStart":819.33,"displayEnd":821.05,"displayMid":820.19,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.005829,"pitch":27.147728,"speechRate":7.869,"hasEvents":false,"sentence_source":"然后就做一下很怪蛋的表情。","sentence_en":"I'd make some goofy expressions."},{"id":"117","start":821.05,"end":823.91,"displayStart":821.05,"displayEnd":823.91,"displayMid":822.48,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.8,"loudness":0.81525,"pitch":27.816221,"speechRate":6.294,"hasEvents":false,"sentence_source":"然后他们就笑我就觉得好开心鲁豫你知道。","sentence_en":"And they'd laugh, and I felt so happy, you know, Lu Yu?"},{"id":"118","start":823.91,"end":831.65,"displayStart":823.91,"displayEnd":831.65,"displayMid":827.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Gender Concepts and Educational Growth","sentiment_en":"Neutral","score":0,"loudness":1.202286,"pitch":24.861212,"speechRate":6.343,"hasEvents":false,"sentence_source":"我小时候，我现在想到当然是因为那个年代的整体的氛围，你会明显的感受到男孩跟女孩，受欢迎的标准是不同的。","sentence_en":"Looking back now, I think it was the overall atmosphere of that era. You could clearly feel that the standards for being popular were different for boys and girls."},{"id":"119","start":831.65,"end":844.97,"displayStart":831.65,"displayEnd":844.97,"displayMid":838.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Gender Concepts and Educational Growth","sentiment_en":"Neutral","score":0,"loudness":1.00575,"pitch":20.147903,"speechRate":5.2,"hasEvents":false,"sentence_source":"对 男孩班里面学习好的会很受欢迎最，调皮那个老师也会莫名的很喜欢他，女孩一般是乖巧学习好或者好看老师会喜欢，太调表但女孩老师是不喜欢的，好看还得成绩。","sentence_en":"Yes, in boys' classes, the ones who studied well were very popular, and the troublemaker would inexplicably be liked by the teacher. For girls, teachers usually liked those who were well-behaved, good-looking, or had good grades. But a girl who was too mischievous wasn't liked by the teacher; she had to be good-looking and have good grades."},{"id":"120","start":844.97,"end":858.75,"displayStart":844.97,"displayEnd":858.75,"displayMid":851.86,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Gender Concepts and Educational Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.871637,"pitch":26.688244,"speechRate":5.85,"hasEvents":false,"sentence_source":"好女孩子，小的时候我记得班上如果女孩子你成绩不好，你还漂亮同时你还爱打班的话，也会遭遇一些不管是来自同学还是来自老师的那种，一定程度上的霸凌吧，就会觉得你为什么不好好学习。","sentence_en":"Good girl. When I was little, I remember that if a girl in class didn't do well in school, was pretty, and also liked to cause trouble, she would face some level of bullying from classmates or teachers. They'd ask why she didn't study hard."},{"id":"121","start":858.75,"end":861.35,"displayStart":858.75,"displayEnd":861.35,"displayMid":860.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Gender Concepts and Educational Growth","sentiment_en":"Neutral","score":0,"loudness":1.054404,"pitch":20.639641,"speechRate":5.532,"hasEvents":false,"sentence_source":"你是被归于哪一类的女孩我是。","sentence_en":"Which category of girl did you fall into?"},{"id":"122","start":861.35,"end":866.25,"displayStart":861.35,"displayEnd":866.25,"d ral","score":0,"loudness":1.010413,"pitch":25.896093,"speechRate":5.894,"hasEvents":false,"sentence_source":"所以我只能靠勤奋来补，就是我得大量的花费时间在同样一件事情上。","sentence_en":"So I had to make up for it with diligence—I had to spend a lot more time on the same thing."},{"id":"131","start":900.29,"end":905.93,"displayStart":900.29,"displayEnd":905.93,"displayMid":903.1099999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":0.98667,"pitch":24.155792,"speechRate":5.976,"hasEvents":false,"sentence_source":"然后我才能达到一个还不错的结果，最核心的问题还是我的注意力持续分散。","sentence_en":"And then I could achieve a decent result. The core problem is my constant lack of focus."},{"id":"132","start":905.93,"end":912.45,"displayStart":905.93,"displayEnd":912.45,"displayMid":909.19,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Positive","score":0.5,"loudness":1.136191,"pitch":28.437162,"speechRate":6.531,"hasEvents":false,"sentence_source":"那这个对于做喜剧来说是好的，就是你比如说很多喜剧上别人所谓的灵感，就是你是怎么想到的。","sentence_en":"But that's actually good for comedy, isn't it? For example, a lot of what people call 'inspiration' in comedy—like, where did you think of that?"},{"id":"133","start":912.45,"end":914.51,"displayStart":912.45,"displayEnd":914.51,"displayMid":913.48,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":0.792413,"pitch":23.845882,"speechRate":9.709,"hasEvents":false,"sentence_source":"其实我也不知道我怎么想到的，比如你到这个点。","sentence_en":"I honestly don't know how I think of it either. You just get to that point."},{"id":"134","start":914.51,"end":916.33,"displayStart":914.51,"displayEnd":916.33,"displayMid":915.4200000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":0.744922,"pitch":25.840345,"speechRate":7.67,"hasEvents":false,"sentence_source":"然后你就蹦出去想到了那个点。","sentence_en":"Then you jump out and hit on that point."},{"id":"135","start":916.33,"end":922.31,"displayStart":916.33,"displayEnd":922.31,"displayMid":919.3199999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Negative","score":-0.4,"loudness":1.007794,"pitch":27.369249,"speechRate":7.507,"hasEvents":false,"sentence_source":"那我在学习的时候就是你到这个点，你又蹦出去 你不该蹦出去，但你总蹦出去 所以我就会学的很辛苦。","sentence_en":"When I was studying, you'd hit a point and then jump out. You weren't supposed to jump out, but you always did, so it made learning very hard for me."},{"id":"136","start":922.31,"end":936.15,"displayStart":922.31,"displayEnd":936.15,"displayMid":929.23,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Positive","score":0.6,"loudness":0.961468,"pitch":26.968576,"speechRate":5.948,"hasEvents":false,"sentence_source":"但是现在做喜剧的话 可能就我选了一个还是比较适合我这种注意力分散，思维过于活跃的这种工作吧，就比如说我发现我记段子是真的记得好如果，说记一篇演讲稿我是不行 但是记段子我是。","sentence_en":"But now doing comedy, I guess I chose a job that suits my scattered attention and overactive mind. For example, I found that I'm really good at memorizing jokes. If you ask me to memorize a speech, I can't, but jokes I can."},{"id":"137","start":936.15,"end":945.57,"displayStart":936.15,"displayEnd":945.57,"displayMid":940.86,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Positive","score":0.5,"loudness":0.972527,"pitch":27.386656,"speechRate":5.839,"hasEvents":false,"sentence_source":"就很神奇对 我好像记段子是我唯一记得好的地方，其他时候颠三倒四的每天 就段子的话比如我当天写的，我只要记着关键词我上去。","sentence_en":"It's amazing. It seems like jokes are the only thing I remember well. Other times I'm all over the place every day. But with jokes, like ones I write that day, I just need to remember key words and I can go on stage."},{"id":"138","start":945.57,"end":948.95,"displayStart":945.57,"displayEnd":948.95,"displayMid":947.26,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":0.959519,"pitch":25.046978,"speechRate":6.213,"hasEvents":false,"sentence_source":"因为确实就是自己知道讲述这个段子的这个方式。","sentence_en":"Because I truly know the way to tell that joke."},{"id":"139","start":948.95,"end":951.25,"displayStart":948.95,"displayEnd":951.25,"displayMid":950.1,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Positive","score":0.4,"loudness":0.979459,"pitch":26.479029,"speechRate":5.647,"hasEvents":true,"sentence_source":"所以带插不离的也会都OK。","sentence_en":"So even with some improvisation, it's okay."},{"id":"140","start":951.75,"end":958.93,"displayStart":951.75,"displayEnd":958.93,"displayMid":955.3399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.093357,"pitch":23.464111,"speechRate":6.217,"hasEvents":true,"sentence_source":"现在想想假设，如果在你上学那时候你就已经听到了脱口秀，在那个时候会给你有一些什么震撼吗。","sentence_en":"Now think about it: if you had heard stand-up comedy back in your school days, would it have had any impact on you back then?"},{"id":"141","start":958.93,"end":970.53,"displayStart":958.93,"displayEnd":970.53,"displayMid":964.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.952932,"pitch":21.698334,"speechRate":5.524,"hasEvents":false,"sentence_source":"因为那时候你成长过程当中你只是听过，像是你听过，也听得少，小品看过，但那些的震撼都不足以向后来听到了爱伦秀里面，他的那种表达是完全不同的。","sentence_en":"Because during your growing up, you had only heard a little, watched some skits, but the impact of those wasn't enough compared to later hearing Ellen's show. His expression was completely different."},{"id":"142","start":970.53,"end":982.09,"displayStart":970.53,"displayEnd":982.09,"displayMid":976.31,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.933283,"pitch":24.120516,"speechRate":4.265,"hasEvents":false,"sentence_source":"因为我小的时候对于，比如说喜剧的这个认知，就感觉好像是滑稽那个方向的，就是一个人要在台上很傻 他得倒霉受挫。","sentence_en":"Because when I was little, my understanding of comedy was that it was about being silly, like someone on stage acting stupid, having bad luck and suffering."},{"id":"143","start":982.09,"end":988.25,"displayStart":982.09,"displayEnd":988.25,"displayMid":985.1700000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.891617,"pitch":23.024977,"speechRate":3.247,"hasEvents":false,"sentence_source":"等于是通过观众嘲笑台上的人来引发笑声但是。","sentence_en":"It was like making the audience laugh by laughing at the person on stage, but..."},{"id":"144","start":988.25,"end":1001.11,"displayStart":988.25,"displayEnd":1001.11,"displayMid":994.6800000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.7,"loudness":0.92423,"pitch":24.453163,"speechRate":5.728,"hasEvents":false,"sentence_source":"我觉得就是脱口秀这件事情，像我看到Ellen秀的时候，我的一个比较震撼的点是，人可以不在台上作为被嘲笑的对象而逗笑别人，他可以作为一个聪明的人来逗笑别人。","sentence_en":"I think with stand-up comedy, like when I saw Ellen's show, one thing that struck me was that a person doesn't have to be the object of ridicule to make others laugh. They can be a smart person who makes others laugh."},{"id":"145","start":1001.11,"end":1011.17,"displayStart":1001.11,"displayEnd":1011.17,"displayMid":1006.14,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.6,"loudness":0.821418,"pitch":25.075485,"speechRate":5.276,"hasEvents":false,"sentence_source":"这是我会希望自己是这样一个表演状态，反正我自己比较欣赏的脱口秀演员，他在台上都不是以一个傻子的状态来逗笑别人的。","sentence_en":"That's the kind of performance state I'd want for myself. The stand-up comedians I admire are never acting stupid on stage to get laughs."},{"id":"146","start":1011.17,"end":1016.59,"displayStart":1011.17,"displayEnd":1016.59,"displayMid":1013.88,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.5,"loudness":0.890608,"pitch":22.576616,"speechRate":5.535,"hasEvents":false,"sentence_source":"至少在这件事情上 我是比大家想得更多一点 更奇怪一点 可能更深一点。","sentence_en":"At least in this regard, I think a bit more than others, a bit stranger, maybe a bit deeper."},{"id":"147","start":1016.59,"end":1019.29,"displayStart":1016.59,"displayEnd":1019.29,"displayMid":1017.94,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Positive","score":0.6,"loudness":0.840062,"pitch":24.53208,"speechRate":6.827,"hasEvents":false,"sentence_source":"然后又说出来一个好笑的东西 逗大家笑。","sentence_en":"And then I say something funny to make everyone laugh."},{"id":"148","start":1019.29,"end":1023.55,"displayStart":1019.29,"displayEnd":1023.55,"displayMid":1021.42,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Neutral","score":0,"loudness":1.00113,"pitch":18.099634,"speechRate":5.982,"hasEvents":false,"sentence_source":"那你，会觉得喜剧是分性别的吗 喜剧演员是分性别的吗。","sentence_en":"So, do you think comedy is .67,"displayEnd":1269.67,"displayMid":1267.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Female Characters in Film and Television","sentiment_en":"Negative","score":-0.5,"loudness":0.891507,"pitch":18.350681,"speechRate":5.888,"hasEvents":false,"sentence_source":"所以你无从去发展你所谓的特长，你甚至也不知道这可能是一个特长。","sentence_en":"So you had no way to develop that so-called talent; you didn't even know it could be a talent."},{"id":"187","start":1269.67,"end":1271.11,"displayStart":1269.67,"displayEnd":1271.11,"displayMid":1270.3899999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.740457,"pitch":22.464449,"speechRate":4.286,"hasEvents":false,"sentence_source":"所以就没发展。","sentence_en":"So I didn't develop it."},{"id":"188","start":1271.11,"end":1284.87,"displayStart":1271.11,"displayEnd":1284.87,"displayMid":1277.9899999999998,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.5,"loudness":1.05982,"pitch":25.748348,"speechRate":5.82,"hasEvents":false,"sentence_source":"对，所以我当时就好好读书，我想起来一个事 这个事当时还被别人嘲笑，我在大三的时候 我之前有个小本子，一个蓝色的小本子 我在上面寄了很多笑话，就是我觉得好笑的东西 我觉得他好珍贵啊。","sentence_en":"Yeah, so I just focused on studying. I remember something that got mocked back then. When I was a junior, I had a little blue notebook where I collected a lot of jokes—things I found funny. I thought it was precious."},{"id":"189","start":1284.87,"end":1286.85,"displayStart":1284.87,"displayEnd":1286.85,"displayMid":1285.86,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.926823,"pitch":25.836597,"speechRate":6.761,"hasEvents":false,"sentence_source":"我就会拿这些手写把抄下来。","sentence_en":"I would hand-copy them all down."},{"id":"190","start":1286.85,"end":1300.47,"displayStart":1286.85,"displayEnd":1300.47,"displayMid":1293.6599999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.4,"loudness":0.874956,"pitch":24.789127,"speechRate":5.285,"hasEvents":false,"sentence_source":"然后之前有一段时间开始用那个什么飞信，飞行就是你又可以不花钱的群发信息的时候，我坚持了快两年吧，每天跟我们班上的同学就是我的飞行好友，发一个网络段子。","sentence_en":"Then a while ago, I started using Feixin, where you can send group messages for free. I persisted for almost two years, sending a daily internet joke to my classmates who were my Feixin friends."},{"id":"191","start":1300.47,"end":1309.61,"displayStart":1300.47,"displayEnd":1309.61,"displayMid":1305.04,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.5,"loudness":0.876827,"pitch":26.04043,"speechRate":5.755,"hasEvents":false,"sentence_source":"然后我们班还有几个男生以为我暗恋他，他以为我是每天单独给他发的，但其实我就是完全公益的想要逗笑，所有我认识的人。","sentence_en":"Then a few guys in my class thought I had a crush on them—they thought I was sending jokes just to them—but I was just trying to make everyone I knew laugh, purely out of goodwill."},{"id":"192","start":1310.01,"end":1318.75,"displayStart":1310.01,"displayEnd":1318.75,"displayMid":1314.38,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Positive","score":0.6,"loudness":0.856791,"pitch":27.394238,"speechRate":7.32,"hasEvents":false,"sentence_source":"因为我就是很希望让别人开心，就很莫名其妙 因为这个事情没有什么回报，但我就是每天自己给自己订个KPI，我要给所有我认识的人发一个笑话。","sentence_en":"Because I really wanted to make others happy. It was weird—no reward—but I set myself a daily KPI: send a joke to everyone I knew."},{"id":"193","start":1318.75,"end":1321.25,"displayStart":1318.75,"displayEnd":1321.25,"displayMid":1320,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Women in Comedy and Female Expression","sentiment_en":"Neutral","score":0,"loudness":1.202208,"pitch":21.709814,"speechRate":7.246,"hasEvents":false,"sentence_source":"所以你被词需要上网找这样的笑话。","sentence_en":"So you had to search online for these jokes."},{"id":"194","start":1321.25,"end":1323.51,"displayStart":1321.25,"displayEnd":1323.51,"displayMid":1322.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":1.084298,"pitch":25.349455,"speechRate":5.752,"hasEvents":false,"sentence_source":"对还，得筛啊 你得找一个好笑的。","sentence_en":"Yeah, and I had to filter—find a good one."},{"id":"195","start":1323.51,"end":1332.21,"displayStart":1323.51,"displayEnd":1332.21,"displayMid":1327.8600000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.4,"loudness":0.877307,"pitch":27.251179,"speechRate":6.651,"hasEvents":false,"sentence_source":"但这个东西有个好处，就是我坚持给这么多人发，有一些人他就每天他好开心啊，谢谢你给我发这个，但后来我发太多了 他也就不回我了。","sentence_en":"But there was one upside: some people were really happy every day and thanked me. But later, after too many, they stopped replying."},{"id":"196","start":1332.21,"end":1345.45,"displayStart":1332.21,"displayEnd":1345.45,"displayMid":1338.83,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.02215,"pitch":29.054955,"speechRate":6.065,"hasEvents":false,"sentence_source":"但是一个人他都现在还很感谢我，他都现在他都是就是每一次逢年过节，他都一定会给我发信息，他就说小鹿 谢谢你在我，就是要考某一个重要考试的期间，我每天收到的那个笑话我都很开心。","sentence_en":"But one person still thanks me to this day. Every holiday, he messages me and says, 'Xiao Lu, thank you. During my important exam prep, I looked forward to your joke every day."},{"id":"197","start":1345.45,"end":1351.77,"displayStart":1345.45,"displayEnd":1351.77,"displayMid":1348.6100000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Positive","score":0.6,"loudness":1.00606,"pitch":23.335882,"speechRate":5.696,"hasEvents":false,"sentence_source":"感觉有人在关心我，他一直在很感谢我这件事情，这也是刚刚这个灵心的积极想起来了。","sentence_en":"He felt cared for. He's always grateful for that. That just came to mind from Lingxin's positivity comment."},{"id":"198","start":1353.73,"end":1356.31,"displayStart":1353.73,"displayEnd":1356.31,"displayMid":1355.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.306565,"pitch":27.729616,"speechRate":5.039,"hasEvents":true,"sentence_source":"所以其实还是有准备这么说是。","sentence_en":"So actually, there was some preparation, you could say."},{"id":"199","start":1357.23,"end":1362.47,"displayStart":1357.23,"displayEnd":1362.47,"displayMid":1359.85,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.14251,"pitch":32.625549,"speechRate":5.369,"hasEvents":true,"sentence_source":"是 而且我有一个印象，我当时拿那个蓝色的小本子，抄了那么多笑话。","sentence_en":"Yes, and I recall that blue notebook full of jokes."},{"id":"200","start":1362.47,"end":1372.03,"displayStart":1362.47,"displayEnd":1372.03,"displayMid":1367.25,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.00696,"pitch":31.040758,"speechRate":7.478,"hasEvents":false,"sentence_source":"然后有一次搬上举行什么活动，我本来也觉得搬上是个小透明嘛，我当时就觉得 哎呀，大家都要表演一个什么节目，我当时也不知道哪来的勇气，我说我给你们念几个笑话吧。","sentence_en":"Then once there was a class event. I was pretty invisible in class, and when everyone had to perform, I don't know where I got the courage, but I said, 'Let me read you some jokes."},{"id":"201","start":1372.03,"end":1376.15,"displayStart":1372.03,"displayEnd":1376.15,"displayMid":1374.0900000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.980477,"pitch":30.506409,"speechRate":7.134,"hasEvents":false,"sentence_source":"我就拿着我的蓝色小本子打开，没有前言没有后语的开始给别人念。","sentence_en":"I opened my blue notebook and started reading jokes with no introduction or context."},{"id":"202","start":1376.15,"end":1384.93,"displayStart":1376.15,"displayEnd":1384.93,"displayMid":1380.54,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.7,"loudness":1.015288,"pitch":30.845158,"speechRate":4.345,"hasEvents":false,"sentence_source":"然后从头梁到尾 好恐怖啊 那可能是我人生中第一次冷场，我拿着那个小本子念完 没有发音。","sentence_en":"Then I went through it from start to finish. It was so terrifying. That might have been the first time I experienced an awkward silence in my life. I read through that little notebook without any expression."},{"id":"203","start":1384.93,"end":1387.49,"displayStart":1384.93,"displayEnd":1387.49,"displayMid":1386.21,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.6,"loudness":0.985433,"pitch":30.918634,"speechRate":5.497,"hasEvents":false,"sentence_source":"然后一群人面无表情地看着你。","sentence_en":"Then a bunch of people just stared at me expressionless."},{"id":"204","start":1387.49,"end":1390.95,"displayStart":1387.49,"displayEnd":1390.95,"displayMid":1389.22,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.5,"loudness":1.10794,"pitch":29.041187,"speechRate":5.491,"hasEvents":false,"sentence_source":"那个眼神就是然后呢 没有然后了 已经结束了。","sentence_en":"That look was like, 'And then? No then. It's over."},{"id":"205","start":1390.95,"end":1393.03,"displayStart":1390.95,"displayEnd":1393.03,"displayMid":1391.99,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.934254,"pitch":35.147301,"speechRate":4.38,"hasEvents":false,"sentence_source":"然后我就是呢 下一个。","sentence_en":"Then I just said, 'Next one."},{"id":"206","start":1393.55,"end":1394.91,"displayStart":1393.55,"displayEnd":1394.91,"displayMid":1394.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":1.05203,"pitch":27.634876,"speechRate":4.494,"hasEvents":false,"sentence_source":"你念了多久呢。","sentence_en":"How many did you read?"},{"id":"207","start":1394.91,"end":1397.41,"displayStart":1394.91,"displayEnd":1397.41,"displayMid":1396.16,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.6,"loudness":1.068829,"pitch":36.738602,"speechRate":5.817,"hasEvents":false,"sentence_source":"我念了四五个 我就心念崩塌了。","sentence_en":"I read four or five, then I mentally collapsed."},{"id":"208","start":1397.41,"end":1400.07,"displayStart":1397.41,"displayEnd":1400.07,"displayMid":1398.74,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.4,"loudness":1.270477,"pitch":35.446651,"speechRate":6.015,"hasEvents":true,"sentence_source":"然后我就说 没有了 其实还有好几百个。","sentence_en":"Then I said, 'No, there are actually hundreds more.'"},{"id":"209","start":1401.27,"end": isplayEnd":1423.65,"displayMid":1422.49,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.936619,"pitch":28.249853,"speechRate":6.4,"hasEvents":false,"sentence_source":"对，我现在觉得我们作为观众。","sentence_en":"Yeah, now I think we as an audience—"},{"id":"214","start":1423.65,"end":1434.39,"displayStart":1423.65,"displayEnd":1434.39,"displayMid":1429.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.970952,"pitch":24.819715,"speechRate":5.811,"hasEvents":false,"sentence_source":"我们也是在慢慢的学习跟成长，你把我放在一个完全陌生的一个喜剧领域里面，哪怕给我再好的喜剧 我也是会懵的，我一时半会进入不了那个角色的。","sentence_en":"We're also learning and growing. Put me in a completely unfamiliar comedy setting, even with great material, I'd be confused. I can't get into that role instantly."},{"id":"215","start":1434.39,"end":1444.05,"displayStart":1434.39,"displayEnd":1444.05,"displayMid":1439.22,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Neutral","score":0,"loudness":0.928435,"pitch":25.245205,"speechRate":5.216,"hasEvents":false,"sentence_source":"对对喜剧它很敏感其实，就一点点哪里出了点问题 它就一句话或者一个气口一下就毁掉了，就是那个气氛它就毁掉了。","sentence_en":"Yes, comedy is very sensitive. One little issue—a wrong word or breath—and the whole atmosphere is ruined."},{"id":"216","start":1444.05,"end":1448.47,"displayStart":1444.05,"displayEnd":1448.47,"displayMid":1446.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Female Age, Identity, and Life Stages","sentiment_en":"Neutral","score":0,"loudness":1.174199,"pitch":25.141771,"speechRate":6.089,"hasEvents":false,"sentence_source":"那如果那一次现场你同学笑了，它会给你增添某种莫名的心情。","sentence_en":"If your classmates had laughed that time, it would have given you .446335,"speechRate":6.823,"hasEvents":false,"sentence_source":"然后一个一个念出来 一点反应都没有。","sentence_en":"Then you read them out one by one, and get zero reaction."},{"id":"221","start":1469.53,"end":1477.69,"displayStart":1469.53,"displayEnd":1477.69,"displayMid":1473.6100000000001,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Humor creation and growth experience","sentiment_en":"Negative","score":-0.6,"loudness":1.004234,"pitch":29.724066,"speechRate":5.392,"hasEvents":false,"sentence_source":"然后 最难受的时候 我还记得我有一个 我们班班长 特别善良的一个女生，她就强行挤出来一些微笑 看着我。","sentence_en":"And the worst part—I remember our class monitor, a really kind girl, forcing a smile and looking at me."},{"id":"222","start":1477.69,"end":1493.17,"displayStart":1477.69,"displayEnd":1493.17,"displayMid":1485.43,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Negative","score":-0.7,"loudness":0.982956,"pitch":29.878733,"speechRate":4.788,"hasEvents":false,"sentence_source":"然后她就是 你知道她很期望 她能坚持笑下去，你就可以给她一个很好的个没有，努力地笑着 到最后 直到她笑容消失，我说没有段子 我就走了，我已经忘了我那天后来是怎么度过的。","sentence_en":"And then she—you know she really hoped she could keep smiling—you could give her a good one, nothing. She kept smiling until her smile faded. I said I had no jokes and left. I've already forgotten how I spent the rest of that day."},{"id":"223","start":1493.17,"end":1495.23,"displayStart":1493.17,"displayEnd":1495.23,"displayMid":1494.2,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":1.045311,"pitch":28.168615,"speechRate":6.824,"hasEvents":false,"sentence_source":"我可能又去学习考研的东西了。","sentence_en":"I probably went back to studying for the graduate exam."},{"id":"224","start":1495.23,"end":1496.79,"displayStart":1495.23,"displayEnd":1496.79,"displayMid":1496.01,"speaker":"Xiaolu","speakerColor":"# rt":1505.59,"end":1512.33,"displayStart":1505.59,"displayEnd":1512.33,"displayMid":1508.96,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":0.802481,"pitch":22.264257,"speechRate":5.498,"hasEvents":false,"sentence_source":"是我可能大三的时候的事了，大三代造我人生第一次开放麦，岩二 四年，这四年发生了什么。","sentence_en":"It was in my junior year—my first open mic in junior year. Then second year of grad school? Four years. What happened in those four years?"},{"id":"230","start":1512.71,"end":1516.93,"displayStart":1512.71,"displayEnd":1516.93,"displayMid":1514.8200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":1.253235,"pitch":27.139624,"speechRate":6.22,"hasEvents":false,"sentence_source":"就人会有一个从量变到质变的过程，把你对于喜剧的这种追求。","sentence_en":"There's a process from quantity to quality in your pursuit of comedy."},{"id":"231","start":1516.93,"end":1521.77,"displayStart":1516.93,"displayEnd":1521.77,"displayMid":1519.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":1.108501,"pitch":21.813808,"speechRate":4.752,"hasEvents":true,"sentence_source":"其实等于是从生活当中，真正去从一个想法到付出实践。","sentence_en":"It's like moving from an idea in life to actually putting it into practice."},{"id":"232","start":1523.77,"end":1535.71,"displayStart":1523.77,"displayEnd":1535.71,"displayMid":1529.74,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Neutral","score":0,"loudness":1.024497,"pitch":27.409882,"speechRate":5.239,"hasEvents":true,"sentence_source":"我大三后来就是考研司法考试 然后开始考虑自己的未来眼，二的时候我是因为觉得人生就要到那个选择点了，我当时跟我的闺蜜一起在准备考博嘛。","sentence_en":"After junior year, I prepared for the graduate entrance exam and judicial exam, then started thinking about my future. By my second year of grad school, I felt life was at a turning point. My best friend and I were preparing for the PhD entrance exam."},{"id":"233","start":1535.71,"end":1547.03,"displayStart":1535.71,"displayEnd":1547.03,"displayMid":1541.37,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Negative","score":-0.4,"loudness":0.820324,"pitch":25.609125,"speechRate":6.574,"hasEvents":false,"sentence_source":"但我明显意识到自己是对于做学术这件事情，我能力是非常不足的，在我考博的过程当中我发现了居然有脱口秀这回事，我当时就觉得我得去试一试，我没有什么更多的机会了。","sentence_en":"But I clearly realized I wasn't cut out for academia. During my PhD prep, I discovered stand-up comedy. I felt I had to try it—I didn't have many more chances."},{"id":"234","start":1547.03,"end":1551.97,"displayStart":1547.03,"displayEnd":1551.97,"displayMid":1549.5,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Negative","score":-0.5,"loudness":1.030132,"pitch":28.601341,"speechRate":6.674,"hasEvents":false,"sentence_source":"我必须要在现在一无所有的时候赶紧做出选择，不然之后代价就太大了。","sentence_en":"I had to make a choice when I had nothing, or the cost later would be too high."},{"id":"235","start":1551.97,"end":1561.55,"displayStart":1551.97,"displayEnd":1561.55,"displayMid":1556.76,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Mental state and career growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.829454,"pitch":27.465141,"speechRate":6.116,"hasEvents":false,"sentence_source":"然后我真的记得我当时有那种在宿舍里躺着，就是躺着然后想说我到底要干嘛呀，就是青春好痛苦啊，人为什么在这个年龄段要这么痛苦。","sentence_en":"And I really remember lying in the dormitory, thinking, 'What am I supposed to do?' Youth is so painful. Why do people have to suffer so much at this age?"},{"id":"236","start":1561.55,"end":1563.29,"displayStart":1561.55,"displayEnd":1563.29,"displayMid":1562.42,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.5,"loudness":0.695399,"pitch":27.698425,"speechRate":5.917,"hasEvents":true,"sentence_source":"然后又没有任何的指引。","sentence_en":"And I had no guidance."},{"id":"237","start":1563.29,"end":1574.49,"displayStart":1563.29,"displayEnd":1574.49,"displayMid":1568.8899999999999,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.7,"loudness":0.929364,"pitch":31.700674,"speechRate":6.579,"hasEvents":true,"sentence_source":"所以每一条路都得你自己去探索，哪怕有人给我一点点建议的没有，什么都没有，你就躺在那个宿舍里，想我为什么每天这么不快乐，为什么别人可以看着美剧就快乐一天。","sentence_en":"So every path had to be explored alone. Not even a little advice—nothing. I'd lie in my dorm, wondering why I was so unhappy every day, while others could be happy just watching a TV show."},{"id":"238","start":1574.49,"end":1579.15,"displayStart":1574.49,"displayEnd":1579.15,"displayMid":1576.8200000000002,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Negative","score":-0.5,"loudness":1.003255,"pitch":26.225695,"speechRate":5.365,"hasEvents":false,"sentence_source":"而我就没有办法做到这件事情，就在这样挣扎了快半年之后。","sentence_en":"But I couldn't do that. After struggling like that for almost half a year..."},{"id":"239","start":1579.15,"end":1581.15,"displayStart":1579.15,"displayEnd":1581.15,"displayMid":1580.15,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.5,"loudness":0.816808,"pitch":26.64716,"speechRate":7,"hasEvents":false,"sentence_source":"我觉得我需要去给自己一个机会。","sentence_en":"I feel like I need to give myself a chance."},{"id":"240","start":1581.15,"end":1586.85,"displayStart":1581.15,"displayEnd":1586.85,"displayMid":1584,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.4,"loudness":0.967993,"pitch":24.912643,"speechRate":5.771,"hasEvents":false,"sentence_source":"所以后来我就在网上查，看到了有一个北京的俊乐部，他是在教怎么写段子的。","sentence_en":"So later I searched online and found a Beijing comedy club that teaches how to write jokes."},{"id":"241","start":1586.85,"end":1591.03,"displayStart":1586.85,"displayEnd":1591.03,"displayMid":1588.94,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.7,"loudness":0.760327,"pitch":20.572313,"speechRate":5.815,"hasEvents":false,"sentence_source":"然后我就决定我要去，我要给自己最后一次机会试一试。","sentence_en":"Then I decided to go, to give myself one last chance to try."},{"id":"242","start":1591.03,"end":1600.13,"displayStart":1591.03,"displayEnd":1600.13,"displayMid":1595.58,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.915821,"pitch":23.089586,"speechRate":5.165,"hasEvents":false,"sentence_source":"然后后来我就坐了40多个小时的绿皮火车，来了北京学写段子，一个月内吧就开始上开放麦了，开放麦还没记住。","sentence_en":"Then I took a 40-hour green train to Beijing to learn sketch writing, and within a month I started doing open mics, though I still couldn't remember my lines."},{"id":"243","start":1600.13,"end":1605.35,"displayStart":1600.13,"displayEnd":1605.35,"displayMid":1602.74,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.899019,"pitch":27.853241,"speechRate":7.129,"hasEvents":false,"sentence_source":"然后也是拿着纸上去念的，但发现因为说简单段子，观众很容易理解的 观众还是都会笑。","sentence_en":"I went on stage with my notes, but found that since my jokes were simple and easy to understand, the audience still laughed."},{"id":"244","start":1605.35,"end":1606.79,"displayStart":1605.35,"displayEnd":1606.79,"displayMid":1606.07,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.8,"loudness":0.55244,"pitch":18.665434,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后就挺有信心的。","sentence_en":"So I gained some confidence."},{"id":"245","start":1606.79,"end":1613.11,"displayStart":1606.79,"displayEnd":1613.11,"displayMid":1609.9499999999998,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.873775,"pitch":23.768356,"speechRate":5.892,"hasEvents":false,"sentence_source":"然后那时候呢 市场却是门槛也很低，我过几天就接了一次商业 叫什么，美女脱口秀专场。","sentence_en":"And back then, the bar was low. A few days later, I got a commercial gig called something like 'Beautiful Women Stand-up Special'."},{"id":"246","start":1614.39,"end":1625.85,"displayStart":1614.39,"displayEnd":1625.85,"displayMid":1620.12,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Positive","score":0.6,"loudness":0.983527,"pitch":27.398724,"speechRate":5.59,"hasEvents":true,"sentence_source":"然后我们大概9个演员吧，前面4个 后面4个脱口秀演员讲断子，中间还有一个女生跳舞，就一切吧 你感觉她就很喜剧，她又在你的情理之中 又在意料之外。","sentence_en":"We had about nine performers: four at the start, four more doing stand-up, and a girl dancing in between. It was all very comedic — it made sense yet was unexpected."},{"id":"247","start":1626.21,"end":1636.83,"displayStart":1626.21,"displayEnd":1636.83,"displayMid":1631.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression"," 的时候吧 你肯定是 一开始写的段子也比较空，也跟自己没有什么太大关系 因为你也没那个能力去挖掘自己真实的一切。","sentence_en":"So I don't overthink it. Of course, I have a feeling. For example, when you first start on stage, your early jokes are quite empty, not really about yourself, because you don't have the ability to dig into your truth yet."},{"id":"335","start":2293.35,"end":2298.55,"displayStart":2293.35,"displayEnd":2298.55,"displayMid":2295.95,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.951385,"pitch":27.700298,"speechRate":5.538,"hasEvents":false,"sentence_source":"但是 随着你在台上越来越多 你的内容是一定要有足够的支撑的。","sentence_en":"But as you perform more, your content needs enough substance."},{"id":"336","start":2298.55,"end":2302.05,"displayStart":2298.55,"displayEnd":2302.05,"displayMid":2300.3,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.820825,"pitch":26.647762,"speechRate":5.455,"hasEvents":false,"sentence_source":"那你的挖掘肯定会开始向内 向自己的人生。","sentence_en":"So your digging will inevitably turn inward, toward your own life."},{"id":"337","start":2302.05,"end":2315.65,"displayStart":2302.05,"displayEnd":2315.65,"displayMid":2308.8500000000004,"speaker":"Xiaolu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Comedy creation and performance expression","sentiment_en":"Neutral","score":0,"loudness":0.904248,"pitch":25.388739,"speechRate":5.735,"hasEvents":false,"sentence_source":"但是其实我觉得作为一个几句演员，反而我是那种我不觉得我的想法有多对，我甚至不觉得它是对的，我也不觉得别人该学习，我这些挖掘都是为了出现笑点，都是为了在台上大家觉得好笑。","sentence_en":"But as a comedian, I'm the type who doesn't think my ideas are especially correct, I don't even think they're right, and I don't think others should learn from them. I dig into myself just to create punchlines, to make people laugh on stage."},{"id":"338","start"
