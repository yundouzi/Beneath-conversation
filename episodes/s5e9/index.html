r":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.4,"loudness":0.715234,"pitch":23.854845,"speechRate":5.048,"hasEvents":false,"sentence_source":"我们每天都会流眼泪我后来发现是因为这个紫外线，晒得过于强烈了，就是我们的眼睛是肿的然后眼睛是肿脏会流眼泪的每天。","sentence_en":"We cried every day. I later realized it was due to the intense UV rays—our eyes were swollen, and that made them tear up daily."},{"id":"129","start":901.22,"end":903.92,"displayStart":901.22,"displayEnd":903.92,"displayMid":902.5699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.820773,"pitch":26.685394,"speechRate":6.757,"hasEvents":false,"sentence_source":"所以我们基本上说话都是瞇着眼睛。","sentence_en":"So we basically talked with our eyes squinted."},{"id":"130","start":903.92,"end":910.48,"displayStart":903.92,"displayEnd":910.48,"displayMid":907.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.849832,"pitch":22.920193,"speechRate":5.973,"hasEvents":false,"sentence_source":"那你就明白为什么那边的人说话总是这样瞇着眼睛皱着眉头了，是因为紫外线太强烈了。","sentence_en":"Now you understand why people there always talk with squinted eyes and furrowed brows—it's because of the strong UV rays."},{"id":"131","start":910.48,"end":923.26,"displayStart":910.48,"displayEnd":923.26,"displayMid":916.87,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.906492,"pitch":21.844885,"speechRate":6.433,"hasEvents":false,"sentence_source":"其实你刚才讲你说他开小卖部的那个地方，不是下部场 就是原来开小卖部那个地方，你说更打动你 就是你会想，人们为什么要生活在这样的地方，当然人们可以生活在这样的地方，这也是我在看。","sentence_en":"Actually, you just mentioned the place where he ran the small shop—not the lower field, but the original shop location. You said it struck you more, making you wonder why out it."},{"id":"135","start":957.16,"end":963.54,"displayStart":957.16,"displayEnd":963.54,"displayMid":960.3499999999999,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.7,"loudness":0.907207,"pitch":23.722528,"speechRate":5.388,"hasEvents":false,"sentence_source":"因为有些生活的细节会让我觉得会很气内，比如说你们就洗澡那场戏 特别打动我。","sentence_en":"Because certain life details make me feel a bit choked up. For instance, the bathing scene really struck me."},{"id":"136","start":963.54,"end":970,"displayStart":963.54,"displayEnd":970,"displayMid":966.77,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.796957,"pitch":20.937578,"speechRate":6.316,"hasEvents":false,"sentence_source":"因为想到我小时候，我妈带着我去大早堂洗澡的那些场景，后来我在想 天呐 他们撒洗那么干净。","sentence_en":"It reminded me of when I was a kid and my mom took me to a public bathhouse. Later I thought, gosh, they washed themselves so clean."},{"id":"137","start":970,"end":973.86,"displayStart":970,"displayEnd":973.86,"displayMid":971.9300000000001,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.3,"loudness":0.680189,"pitch":24.255352,"speechRate":4.663,"hasEvents":false,"sentence_source":"但是回城的路上被风和土一吹 不用脏了吗。","sentence_en":"But on the way back to town, once the wind and dust hit you, wouldn't you get dirty again?"},{"id":"138","start":973.86,"end":978.36,"displayStart":973.86,"displayEnd":978.36,"displayMid":976.11,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.6,"loudness":0.842116,"pitch":27.094494,"speechRate":5.839,"hasEvents":true,"sentence_source":"然后那瞬间 我作为观众 你知道我完全带入了，我特别沮丧。","sentence_en":"And in that moment, as a viewer, I completely related, and I felt so frustrated."},{"id":"139","start":979,"end":988.28,"displayStart":979,"displayEnd":988.28,"displayMid":983.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.6,"loudness":0.907353,"pitch":23.388208,"speechRate":5.088,"hasEvents":false,"sentence_source":"我觉得他去洗澡是一个特别美好的仪式感啊，你明知道回来都是要沉土飞扬的，一张嘴就是沙子 一嘴的沙子。","sentence_en":"I think taking a bath is such a beautiful ritual. You know full well that on the way back, you'll be covered in dust, and opening your mouth will fill it with sand."},{"id":"140","start":988.28,"end":990.16,"displayStart":988.28,"displayEnd":990.16,"displayMid":989.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Positive","score":0.5,"loudness":0.982304,"pitch":29.339785,"speechRate":6.916,"hasEvents":false,"sentence_source":"但是你还是要有这个仪式感。","sentence_en":"But you still want that ritual."},{"id":"141","start":990.16,"end":996.08,"displayStart":990.16,"displayEnd":996.08,"displayMid":993.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.797805,"pitch":23.53001,"speechRate":5.068,"hasEvents":false,"sentence_source":"因为三个人洗得香喷喷的 多开心啊，就觉得自己那一刻是这个政治上最。","sentence_en":"Because the three of us, all fragrant and clean, were so happy. In that moment, we felt like the most beautiful women in the world."},{"id":"142","start":996.08,"end":996.9,"displayStart":996.08,"displayEnd":996.9,"displayMid":996.49,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Positive","score":0.7,"loudness":0.843234,"pitch":19.864559,"speechRate":5.229,"hasEvents":false,"sentence_source":"美的女人。","sentence_en":"Beautiful women."},{"id r":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.800208,"pitch":21.477629,"speechRate":4.329,"hasEvents":false,"sentence_source":"其实早堂子里面有最后有一个很有意思的镜头，导演没有放进去，就是我们三个人洗完了澡之后。","sentence_en":"Actually, there was a very interesting shot in the bathhouse scene that the director didn't include. After the three of us finished bathing..."},{"id":"148","start":1028.84,"end":1037.6,"displayStart":1028.84,"displayEnd":1037.6,"displayMid":1033.2199999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.776018,"pitch":22.541145,"speechRate":5.479,"hasEvents":false,"sentence_source":"我们三个人谁都没戴毛巾，我就问李文秀 你为什么不戴，李文秀说 你说你戴了 所以我就没戴，我说你不是说你戴了吗。","sentence_en":"None of us had brought a towel. I asked Li Wenxiu, 'Why didn't you bring one?' She said, 'You said you brought one, so I didn't.' I replied, 'Didn't you say you were bringing one?"},{"id":"149","start":1037.6,"end":1039.74,"displayStart":1037.6,"displayEnd":1039.74,"displayMid":1038.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.811476,"pitch":23.555054,"speechRate":6.701,"hasEvents":false,"sentence_source":"那奶奶你更不得指望她戴毛巾。","sentence_en":"And we certainly couldn't count on Grandma to bring a towel."},{"id":"150","start":1039.74,"end":1041.66,"displayStart":1039.74,"displayEnd":1041.66,"displayMid":1040.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.895639,"pitch":28.288427,"speechRate":6.25,"hasEvents":false,"sentence_source":"我们三个都没戴毛巾 怎么办。","sentence_en":"None of us had towels. What to do?"},{"id":"151","start":1042.16,"end":1050.28,"displayStart":1042.16,"displayEnd":1050.28,"displayMid":1046.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.854556,"pitch":22.631397,"speechRate":4.827,"hasEvents":false,"sentence_source":"我们三个就站在那个暖气片，标上三个人站成一排，抱着胳膊 后背对着镜头，就这样把自己烤干。","sentence_en":"So the three of us stood in front of the radiator, lined up, arms crossed, backs to the camera, drying ourselves like that."},{"id":"152","start":1050.28,"end":1053.84,"displayStart":1050.28,"displayEnd":1053.84,"displayMid":1052.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.869509,"pitch":25.208885,"speechRate":5.056,"hasEvents":false,"sentence_source":"那个是 其实那个是这场戏的最后一个镜头。","sentence_en":"Actually, that was the last shot of this scene."},{"id":"153","start":1053.84,"end":1066.66,"displayStart":1053.84,"displayEnd":1066.66,"displayMid":1060.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.8,"loudness":0.784487,"pitch":19.84753,"speechRate":4.577,"hasEvents":false,"sentence_source":"但是因为她原来是一场正戏，后来导演很巧妙地把她剪成了一个片头，剪成了应该是第三集的片头，我是在电影院看到这个片头很感动。","sentence_en":"But originally it was a main scene. Later, the director cleverly cut it into an opening sequence—probably for the third episode. I saw it in the cinema and was deeply moved."},{"id":"154","start":1066.66,"end":1076.96,"displayStart":1066.66,"displayEnd":1076.96,"displayMid":1071.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.755493,"pitch":21.982561,"speechRate":4.369,"hasEvents":false,"sentence_source":"因为我觉得她本来是一场正戏，是我们拍了整整一天的，耗费了大量的工作人员精力，和很多的群众演员拍的。","sentence_en":"Because I felt it was originally a full scene that we shot for an entire day, consuming a lot of crew effort and many extras."},{"id":"155","start":1076.96,"end":1085.98,"displayStart":1076.96,"displayEnd":1085.98,"displayMid":1081.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.7,"loudness":0.754788,"pitch":20.616404,"speechRate":4.408,"hasEvents":false,"sentence_source":"但是她只剪做了短短的十几秒钟，放在一个片头 但是她又那么美，我就觉得是很值得的当时。","sentence_en":"But they cut it down to just a dozen seconds for an opening sequence, yet it was so beautiful. I felt it was totally worth it at the time."},{"id":"156","start":1086.38,"end":1097.2,"displayStart":1086.38,"displayEnd":1097.2,"displayMid":1091.79,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.844599,"pitch":23.646557,"speechRate":5.459,"hasEvents":false,"sentence_source":"你会在这个扮演这个人物的过程当中，你会在想 张凤侠她那么能干，她为什么要留在这个地方呢，她带着妈妈可以到城里面，也能够活得不错。","sentence_en":"While playing this character, you wonder: Zhang Fengxia is so capable, why does she stay here? She could take her mother to the city and live well."},{"id":"157","start":1097.2,"end":1111,"displayStart":1097.2,"displayEnd":1111,"displayMid":1104.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.821561,"pitch":20.9083,"speechRate":5.021,"hasEvents":false,"sentence_source":"我在拍戏的时候，我跟哈萨克副导演关系特别好，我就认她，她有个妹妹 她的妹妹才八岁，你知道她妹妹是怎么长大的吗，她们家是在伊黎那边的，他们在牧场里面。","sentence_en":"During filming, I got really close with the Kazakh assistant director. I considered her a friend. She has a younger sister who is only eight. Do you know how her sister grew up? Her family is near Yili, on a ranch."},{"id":"158","start":1111,"end":1121.82,"displayStart":1111,"displayEnd":1121.82,"displayMid":1116.4099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.863678,"pitch":21.751354,"speechRate":4.384,"hasEvents":false,"sentence_source":"她妹妹大概一两岁的时候，她爸爸妈妈就从别的地方运来，很多的沙子堆在家门口，把她妹妹扔进去，就这样玩一天。","sentence_en":"When her sister was about one or two, her parents brought sand from elsewhere, piled it in front of the house, and tossed the little girl in. She would play there all day."},{"id":"159","start":1121.82,"end":1127.42,"displayStart":1121.82,"displayEnd":1127.42,"displayMid":1124.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.714505,"pitch":20.045479,"speechRate":5.442,"hasEvents":false,"sentence_source":"然后玩到晚上把她妹妹像尼侯一样，给她拎出来洗个澡 换一件衣服。","sentence_en":"Then in the evening, they'd pick her out like a little mud doll, give her a bath, and change her clothes."},{"id":"160","start":1127.42,"end":1131.18,"displayStart":1127.42,"displayEnd":1131.18,"displayMid":1129.3000000000002,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.951305,"pitch":21.62936,"speechRate":4.787,"hasEvents":false,"sentence_source":"妹妹有一次上学在学校被老师留的特别晚。","sentence_en":"One time, her sister was kept after school by the teacher until very late."},{"id":"161","start":1131.18,"end":1135.06,"displayStart":1131.18,"displayEnd":1135.06,"displayMid":1133.12,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.934511,"pitch":16.200775,"speechRate":4.645,"hasEvents":false,"sentence_source":"然后她着急了是骑着马，去学校找老师的。","sentence_en":"So the assistant director got worried and rode a horse to the school to find the teacher."},{"id":"162","start":1135.06,"end":1149.91,"displayStart":1135.06,"displayEnd":1149.91,"displayMid":1142.4850000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.731832,"pitch":20.95488,"speechRate":3.638,"hasEvents":false,"sentence_source":"我听完这个我就觉得天呐，这才是童年 你知道吗，就是一个小孩儿，他不是在游戏机，也不是在电脑前，电视机前，他是在沙子里面。","sentence_en":"After hearing that, I thought, wow, that's what childhood really is, you know? A kid isn't in front of a game console, computer, or TV. He's playing in the sand."},{"id":"163","start":1149.91,"end":1155.51,"displayStart":1149.91,"displayEnd":1155.51,"displayMid":1152.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.7,"loudness":0.775275,"pitch":23.37702,"speechRate":4.57,"hasEvents":false,"sentence_source":"跟牛 羊 马，他们玩一天长大的小孩儿，你说这孩子能不着状吗。","sentence_en":"Growing up playing with cows, sheep, and horses all day—how could that child not be lively?"},{"id":"164","start":1155.51,"end":1169.95,"displayStart":1155.51,"displayEnd":1169.95,"displayMid":1162.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.8,"loudness":0.7647,"pitch":23.427221,"speechRate":4.477,"hasEvents":true,"sentence_source":"那个地方很大，你到了那个地方，你就会知道人是很渺小的，到处都很宽阔，没有太多可以让你想不开的事情，每天吃饭的时候哈萨克演员都带着东布拉。","sentence_en":"That place is vast. When you go there, you realize how small humans are. Everywhere is wide open, nothing to brood over. At every meal, the Kazakh actors would bring a dombra."},{"id":"165","start":1169.95,"end":1185.83,"displayStart":1169.95,"displayEnd":1185.83,"displayMid":1177.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.6,"loudness":0.787884,"pitch":21.645975,"speechRate":4.282,"hasEvents":false,"sentence_source":"每个人都能弹东布拉都能唱，我后来也问过他们，他们说其实我们是愿意留在这里的，是不太想要跑到大城市里面去的，我在快拍摄结束的时候去参观了那个边防站。","senten ":1481.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.7,"loudness":0.773645,"pitch":21.64897,"speechRate":5.134,"hasEvents":false,"sentence_source":"我们一起问过 因为我们每个人一直，每天都处于一种兴奋中 我们就问那个哈萨克演员说，你们觉得我们什么时候这个 这个热度能过去，他们说啊可能到杀青的时候吧。","sentence_en":"We asked together—because we were all in a state of excitement every day—we asked the Kazakh actor, 'When do you think this excitement will wear off for us?' He said, 'Maybe by the time filming wraps."},{"id":"205","start":1487.93,"end":1501.19,"displayStart":1487.93,"displayEnd":1501.19,"displayMid":1494.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.6,"loudness":0.718567,"pitch":19.279745,"speechRate":4.782,"hasEvents":false,"sentence_source":"但是恰恰就是到杀青的时候 我们都没有，完全不能冷静下来 还是不能冷静下来，很长时间其实都不能冷静下来，这个冷静是答应好的 你一直没有办法。","sentence_en":"But right when we wrapped, neither of us could calm down at all, and we couldn't calm down for a long time. We had promised to stay calm, but we just couldn't."},{"id":"206","start":1501.19,"end":1510.51,"displayStart":1501.19,"displayEnd":1510.51,"displayMid":1505.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.4,"loudness":0.706061,"pitch":16.457588,"speechRate":4.237,"hasEvents":false,"sentence_source":"从那个环境里面脱离出来，就是以至于沙清以后我回到了上海，很长时间都不太适应整个上海。","sentence_en":"After leaving that environment, when I returned to Shanghai after wrapping, I had a hard time adjusting to Shanghai for a long time."},{"id":"207","start":1510.64,"end":1520.26,"displayStart":1510.64,"displayEnd":1520.26,"displayMid":1515.45,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.873469,"pitch":20.786726,"speechRate":4.906,"hasEvents":false,"sentence_source":"这是过往的拍完一个戏 拍完一个电影之后，偶尔也会有的感受吗，还是只是这一次拍阿勒泰特别好像难以走出来。","sentence_en":"Is this a feeling you sometimes have after finishing a drama or movie before? Or is it just this time with 'Altay' that it's especially hard to let go?"},{"id":"208","start":1520.26,"end":1524.24,"displayStart":1520.26,"displayEnd":1524.24,"displayMid":1522.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.5,"loudness":0.97177,"pitch":18.681526,"speechRate":4.348,"hasEvents":false,"sentence_source":"是 我觉得是阿勒泰这个环境特别。","sentence_en":"Yes, I think it's the environment of 'Altay' that's special."},{"id":"209","start":1524.24,"end":1529.4,"displayStart":1524.24,"displayEnd":1529.4,"displayMid":1526.8200000000002,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Neutral","score":0,"loudness":0.950118,"pitch":27.223803,"speechRate":6.535,"hasEvents":false,"sentence_source":"那你每一次拍完戏之后在沙清的那个过程当中，你会有一些什么特别的仪式吗。","sentence_en":"After you finish a drama, during the wrapping process, do you have any special rituals?"},{"id":"210","start":1529.4,"end":1534.9,"displayStart":1529.4,"displayEnd":1534.9,"displayMid":1532.15,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Neutral","score":0,"loudness":0.878969,"pitch":22.493368,"speechRate":6,"hasEvents":false,"sentence_source":"因为我知道不同的演员他会有自己的方法，跟那个角色 跟那段生活好像告别了。","sentence_en":"Because I know different actors have their own ways of saying goodbye to the character and that period of life."},{"id":"211","start":1534.9,"end":1549.34,"displayStart":1534.9,"displayEnd":1549.34,"displayMid":1542.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Neutral","score":0,"loudness":0.814571,"pitch":24.87693,"speechRate":5.082,"hasEvents":false,"sentence_source":"没有 因为我发现，有的时候有的戏你觉得很难的，觉得这个戏真的会很苦很苦，拍的时候都会跟自己说，天呐 我杀青的那天我会多开心，我20多岁的时候就有过这样的经历。","sentence_en":"No. Because I find that sometimes there are dramas that you think are really tough and miserable. While filming you tell yourself, 'God, how happy I'll be on the wrap day.' I had that experience in my twenties."},{"id":"212","start":1549.34,"end":1555.84,"displayStart":1549.34,"displayEnd":1555.84,"displayMid":1552.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Neutral","score":0,"loudness":0.860076,"pitch":25.676382,"speechRate":5.882,"hasEvents":false,"sentence_source":"结果拍了好几个月以后，突然那天杀青了，我记得有一次 有一部戏就是这样，我杀青那天。","sentence_en":"But after filming for months, suddenly the wrap day came. I remember one time with a drama, on my wrap day..."},{"id":"213","start":1555.84,"end":1558.54,"displayStart":1555.84,"displayEnd":1558.54,"displayMid":1557.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Negative","score":-0.3,"loudness":0.905254,"pitch":26.606138,"speechRate":5.792,"hasEvents":false,"sentence_source":"然后我还在一口井旁边摔了个马趴。","sentence_en":"And I even fell flat on my face next to a well."},{"id":"214","start":1558.54,"end":1570.8,"displayStart":1558.54,"displayEnd":1570.8,"displayMid":1564.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Negative","score":-0.5,"loudness":0.750051,"pitch":23.117435,"speechRate":4.894,"hasEvents":false,"sentence_source":"然后满脸都是泥，你浑身狼狈的不得了 然后杀青就回去了，一点点兴奋感都没有，后来我就发现往往就是这样，你会以为我杀青的时候我有多快乐。","sentence_en":"My face was covered in mud, I was a complete mess, and then I just went home after wrap. I felt no excitement at all. Later I realized it's often like that—you think you'll be so happy when you wrap."},{"id":"215","start":1570.8,"end":1575.42,"displayStart":1570.8,"displayEnd":1575.42,"displayMid":1573.1100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Negative","score":-0.6,"loudness":0.815697,"pitch":21.387415,"speechRate":4.005,"hasEvents":false,"sentence_source":"然后你会发现越到现在这种快乐会越少。","sentence_en":"And the more recent, the less that kind of happiness there is."},{"id":"216","start":1575.42,"end":1588.24,"displayStart":1575.42,"displayEnd":1588.24,"displayMid":1581.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Positive","score":0.6,"loudness":0.741522,"pitch":18.88047,"speechRate":4.555,"hasEvents":true,"sentence_source":"因为实际上你的快乐是源于你觉得这个戏太苦了 太累了 你想逃离，当你不觉得是苦和累的时候 你是不会有逃离的心态的，你只有舍不得。","sentence_en":"Because actually your happiness comes from feeling that the drama was too hard and tiring, and you want to escape. When you don't feel it's hard and tiring, you don't have the mindset to escape; you only feel reluctant to leave."},{"id":"218","start":1618.22,"end":1620.2,"displayStart":1618.22,"displayEnd":1620.2,"displayMid":1619.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.932005,"pitch":22.785828,"speechRate":6.027,"hasEvents":false,"sentence_source":"你想的差距是非常遥远的。","sentence_en":"The difference between what you imagine and reality is huge."},{"id":"219","start":1620.2,"end":1623.6,"displayStart":1620.2,"displayEnd":1623.6,"displayMid":1621.9,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.913885,"pitch":23.187387,"speechRate":4.444,"hasEvents":false,"sentence_source":"但是每一次扮演一个角色结束了。","sentence_en":"But every time you finish playing a role..."},{"id":"220","start":1623.6,"end":1625.1,"displayStart":1623.6,"displayEnd":1625.1,"displayMid":1624.35,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.977578,"pitch":30.929976,"speechRate":6.667,"hasEvents":false,"sentence_source":"那段生活告一段落之后。","sentence_en":"after that period of life comes to an end..."},{"id":"221","start":1625.1,"end":1632.34,"displayStart":1625.1,"displayEnd":1632.34,"displayMid":1628.7199999999998,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.745054,"pitch":25.290243,"speechRate":5.386,"hasEvents":false,"sentence_source":"那个人物那个角色会有一些什么东西，在一段时间之内留在你的生活和你的身体当中吗。","sentence_en":"Does that character leave something behind in your life and body for a period of time?"},{"id":"222","start":1632.34,"end":1642.36,"displayStart":1632.34,"displayEnd":1642.36,"displayMid":1637.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.4,"loudness":0.873062,"pitch":23.386368,"speechRate":4.791,"hasEvents":false,"sentence_source":"有一个角色我当时杀青的时候挺长时间，有一种走不出角色的感觉就是那个电影找到你，是因为那个其实那个人。","sentence_en":"There was a role where I felt I couldn't get out of it for a long time after wrapping. That was the movie 'Lost, Found'. Actually, that character was really far from me."},{"id":"223","start":1642.36,"end":1651.46,"displayStart":1642.36,"displayEnd":1651.46,"displayMid":1646.9099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.659366,"pitch":18.268942,"speechRate":4.176,"hasEvents":false,"sentence_source":"那个角色真的离我非常遥远，我现在把每一个角色创造的过程，会看作一个是走进它的过程。","sentence_en":"That character was really far away from me. Now I see the process of creating each role as a process of stepping into it."},{"id":"224","start":1651.46,"end":1658.5,"displayStart":1651.46,"displayEnd":1658.5,"displayMid":1654.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.718227,"pitch":17.487534,"speechRate":3.782,"hasEvents":false,"sentence_source":"那个角色要花比较多的精力去走进那个人物，从外形上到心里。","sentence_en":"That role required a lot of effort to step into the character, from appearance to inner self."},{"id":"225","start":1658.5,"end":1672.72,"displayStart":1658.5,"displayEnd":1672.72,"displayMid":1665.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.5,"loudness":0.745218,"pitch":19.07534,"speechRate":4.569,"hasEvents":false,"sentence_source":"所以当你离开那个人物的时候，过程也会更加漫长，而且那个角色杀青的时候，就是群聚的结尾是跳到了江里，是没有告别的，它是一个没有告别的角色。","sentence_en":"So when you leave that character, the process is longer. And when that role wrapped, the final scene was jumping into a river. There was no goodbye—it was a role without a farewell."},{"id":"226","start":1672.72,"end":1686.14,"displayStart":1672.72,"displayEnd":1686.14,"displayMid":1679.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Negative","score":-0.4,"loudness":0.656143,"pitch":19.747227,"speechRate":4.108,"hasEvents":false,"sentence_source":"跟那个角色告别过程相对来说比较痛苦，我当时直接去了乌镇戏剧节，就直接过去在那边待了三四天，在一个如梦如幻的世界里面。","sentence_en":"The process of saying goodbye to that character was relatively painful. I went straight to the Wuzhen Theatre Festival and stayed there for three or four days, in a dreamlike world."},{"id":"227","start":1686.14,"end":1698.14,"displayStart":1686.14,"displayEnd":1698.14,"displayMid":1692.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.713836,"pitch":17.24873,"speechRate":4.289,"hasEvents":false,"sentence_source":"慢慢的跟那个角色抽离出来告别，我是觉得告别这个东西很重要，不然就像一盘没有下完的棋一样，就总是营绕在你的心里。","sentence_en":"Slowly I detached from that character and said goodbye. I think saying goodbye is really important; otherwise, it's like an unfinished game of chess that keeps lingering in your heart."},{"id":"228","start":1698.86,"end":1714.62,"displayStart":1698.86,"displayEnd":1714.62,"displayMid":1706.7399999999998,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Positive","score":0.7,"loudness":0.866617,"pitch":24.434746,"speechRate":5.277,"hasEvents":false,"sentence_source":"你知道那天我看了一个帖子就说，他说 我觉得马伊琍是中生代女演员里最会挑剧本的，他的意思就是你这几年几乎每一部戏都是非常棒的，后来我在想 其实所有的偶然背后一定是有必然的。","sentence_en":"You know, the other day I saw a post saying that Ma Yili is the best at choosing scripts among the middle-aged actresses. It meant that almost every drama she's been in over the past few years has been excellent. Later I thought, behind all coincidences, there must be inevitability."},{"id":"229","start":1714.62,"end":1716.96,"displayStart":1714.62,"displayEnd":1716.96,"displayMid":1715.79,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":1.067864,"pitch":26.612776,"speechRate":7.24,"hasEvents":false,"sentence_source":"就这里面一定是有他的一些偶然性吗。","sentence_en":"Is there necessarily some element of chance in this?"},{"id":"230","start":1716.96,"end":1724.96,"displayStart":1716.96,"displayEnd":1724.96,"displayMid":1720.96,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":0.856972,"pitch":22.856443,"speechRate":5.488,"hasEvents":false,"sentence_source":"因为一部戏成与不成 仅靠演员个人的努力，作用是不大的 他需要整个剧本好，不仅一个演员好 大家都好。","sentence_en":"Because whether a drama succeeds or not, relying solely on an actor's personal effort is not enough. It needs the whole script to be good, and not just one actor but everyone to be good."},{"id":"231","start":1724.96,"end":1726.92,"displayStart":1724.96,"displayEnd":1726.92,"displayMid":1725.94,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":0.949034,"pitch":27.291162,"speechRate":5.42,"hasEvents":false,"sentence_source":"那这个概率其实很低的。","sentence_en":"That probability is actually very low."},{"id":"232","start":1726.92,"end":1740.8,"displayStart":1726.92,"displayEnd":1740.8,"displayMid":1733.8600000000001,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Positive","score":0.6,"loudness":0.780418,"pitch":23.710812,"speechRate":5.102,"hasEvents":false,"sentence_source":"所以我总觉得在你的这个成功的，所谓偶然背后又有某种必然，说明你选的角色，你始终意以观之你有一个标准，这个标准是横定不动的，它不会因为一些比如说明和粒。","sentence_en":"So I always feel that behind your so-called success, there is some inevitability. It shows that the roles you choose always adhere to a standard, a standard that remains constant and won't change due to some factors."},{"id":"233","start":1740.8,"end":1743.36,"displayStart":1740.8,"displayEnd":1743.36,"displayMid":1742.08,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":0.86542,"pitch":19.940825,"speechRate":5.859,"hasEvents":false,"sentence_source":"就是我们说比较虚的东西被它左右。","sentence_en":"That's what we call being swayed by intangible things."},{"id":"234","start":1743.36,"end":1745.78,"displayStart":1743.36,"displayEnd":1745.78,"displayMid":1744.57,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":0.743555,"pitch":20.072132,"speechRate":6.289,"hasEvents":false,"sentence_source":"那你的这个横定的标准一直是什么。","sentence_en":"So what has always been your consistent standard?"},{"id":"235","start":1745.78,"end":1757.36,"displayStart":1745.78,"displayEnd":1757.36,"displayMid":1751.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.762879,"pitch":21.776495,"speechRate":5.482,"hasEvents":false,"sentence_source":"我一直在想，我会选一个剧本的原因，都是因为这个剧本好看，这个所谓的好看是站在什么角度呢，不是站在那个演员的角度，站在一个读者的角度。","sentence_en":"I've been thinking: The reason I choose a script is always because it's a good read. And what perspective is this 'good read' from? Not from an actor's perspective, but from a reader's perspective."},{"id":"236","start":1757.36,"end":1760.62,"displayStart":1757.36,"displayEnd":1760.62,"displayMid":1758.9899999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.907318,"pitch":23.362156,"speechRate":5.911,"hasEvents":false,"sentence_source":"其实我每一次看剧本都像看一本小说一样。","sentence_en":"Actually, every time I read a script, it's like reading a novel."},{"id":"237","start":1760.62,"end":1776.46,"displayStart":1760.62,"displayEnd":1776.46,"displayMid":1768.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Positive","score":0.6,"loudness":0.736682,"pitch":20.367083,"speechRate":5.053,"hasEvents":false,"sentence_source":"然后我通常看一个剧本的开头，我就会知道这个剧本好或不好，真的履世不爽，你看一个剧本的开头，看一个剧本的第一集，你就知道这位编剧的水平如何，你也知道这整个戏的气质是什么样的。","sentence_en":"Usually, I can tell whether a script is good or bad just by reading its beginning. It's always true. By reading the beginning of a script, the first episode, you can gauge the screenwriter's skill and the overall tone of the drama."},{"id":"238","start":1776.46,"end":1778.12,"displayStart":1776.46,"displayEnd":1778.12,"displayMid":1777.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.804556,"pitch":21.681507,"speechRate":5.634,"hasEvents":false,"sentence_source":"不需要往后多看了。","sentence_en":"I don't need to read much further."},{"id":"239","start":1778.12,"end":1786.98,"displayStart":1778.12,"displayEnd":1786.98,"displayMid":1782.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Positive","score":0.5,"loudness":0.803806,"pitch":19.414505,"speechRate":5.003,"hasEvents":false,"sentence_source":"因为一个好的编剧，它一定在一开头就会牢牢地吸引着你，这个好 它还不是，是我为什么说以读者的角度。","sentence_en":"Because a good screenwriter will firmly grab your attention from the very beginning. This 'good' is not just that—that's why I say from a reader's perspective."},{"id":"240","start":1786.98,"end":1789.12,"displayStart":1786.98,"displayEnd":1789.12,"displayMid":1788.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.830408,"pitch":19.233355,"speechRate":6.516,"hasEvents":false,"sentence_source":"因为如果只是一个角色写的好。","sentence_en":"Because if only one character is well-written..."},{"id":"241","start":1789.12,"end":1795.88,"displayStart":1789.12,"displayEnd":1795.88,"displayMid":1792.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Positive","score":0.6,"loudness":0.654121,"pitch":17.130003,"speechRate":3.907,"hasEvents":false,"sentence_source":"那这本小说它不叫好，它必须是 众人物都好，哪怕是配角也得好。","sentence_en":"then that novel isn't considered good. It has to be that all characters are good, even the supporting characters."},{"id":"242","start":1795.88,"end":1808,"displayStart":1795.88,"displayEnd":1808,"displayMid":1801.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.718075,"pitch":19.61434,"speechRate":4.632,"hasEvents":false,"sentence_source":"所以对我来说我的评判标准就是，像一个读者一样的去读一本小说，这个小说好不好看，这个故事好不好看，这就是我唯一选择的标准。","sentence_en":"So for me, my criterion is to read it like a reader reading a novel—whether the novel is engaging, whether the story is engaging. That's my only selection standard."},{"id":"243","start":1808.64,"end":1822.98,"displayStart":1808.64,"displayEnd":1822.98,"displayMid":1815.81,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Negative","score":-0.3,"loudness":0.866844,"pitch":25.637449,"speechRate":5.212,"hasEvents":false,"sentence_source":"但你知道阅读剧本是一种能力，比如说像我平常会看很多书，我看小说 看三文 但是我也看过剧本，我发现 我看剧本的时候 我没有办法，可能像一个演员那样产生该有的那个想象。","sentence_en":"But you know, reading scripts is a skill. For example, I usually read a lot of books—novels, essays—but I've also read scripts. I find that when I read a script, I can't generate the imagination that an actor might have."},{"id":"244","start":1822.98,"end":1831.4,"displayStart":1822.98,"displayEnd":1831.4,"displayMid":1827.19,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Positive","score":0.5,"loudness":0.918292,"pitch":25.37528,"speechRate":6.163,"hasEvents":false,"sentence_source":"就像你说的 我看那个开头，我就已经知道这个戏整体的气质会是怎样的，这个人物会不会给我带来很多的 可以创作的空间。","sentence_en":"Just like you said, when I see the beginning, I already know what the overall vibe of the drama will be, and whether the character will give me a lot of room for creativity."},{"id":"245","start":1831.4,"end":1840.36,"displayStart":1831.4,"displayEnd":1840.36,"displayMid":1835.88,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.780555,"pitch":25.604988,"speechRate":5.692,"hasEvents":false,"sentence_source":"那你在阅读这些剧本的时候，跟你在阅读那个小说时候 状态是一样的吗，你的脑海中会出现画面 会出现声音 甚至会有气味。","sentence_en":"So when you read these scripts, is your state the same as when you read a novel? Do images, sounds, and even smells appear in your mind?"},{"id":"246","start":1840.36,"end":1847.84,"displayStart":1840.36,"displayEnd":1847.84,"displayMid":1844.1,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Neutral","score":0,"loudness":0.738472,"pitch":20.857304,"speechRate":3.209,"hasEvents":false,"sentence_source":"对，你知道记忆力有几种方式吗 有的人是声音 有的是数字。","sentence_en":"Yes. Do you know there are different ways of memorizing? Some people use sound, some use numbers."},{"id":"247","start":1847.84,"end":1858.78,"displayStart":1847.84,"displayEnd":1858.78,"displayMid":1853.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Positive","score":0.6,"loudness":0.768095,"pitch":25.285797,"speechRate":5.325,"hasEvents":false,"sentence_source":"我看过一个研究就是讲用画面记忆的人是记忆力最强的，我就是那个用画面记忆的人 我看到的所有文字在我的脑海里全部都会是画面。","sentence_en":"I once saw a study that says people who memorize with images have the strongest memory. I'm that type—all the text I see turns into images in my mind."},{"id":"248","start":1858.78,"end":1873,"displayStart":1858.78,"displayEnd":1873,"displayMid":1865.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Negative","score":-0.5,"loudness":0.840279,"pitch":19.04505,"speechRate":4.223,"hasEvents":false,"sentence_source":"就很神奇的 所以我为什么我是很害怕看任何恐怖小说 悬疑小说的，我接的戏如果是悬疑的犯罪题材的，我特别不能晚上看 因为我会非常害怕。","sentence_en":"It's amazing. That's why I'm very afraid of reading horror or suspense novels. If the drama I take is a suspense crime genre, I especially can't read it at night because I get very scared."},{"id":"249","start":1873,"end":1880.6,"displayStart":1873,"displayEnd":1880.6,"displayMid":1876.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Screenwriter and Script","sentiment_en":"Negative","score":-0.4,"loudness":0.881449,"pitch":21.837444,"speechRate":4.798,"hasEvents":false,"sentence_source":"哪怕这个小说 这个剧本的那个悬疑不那么强，我都会做脑好里全部都是真实的画面。","sentence_en":"Even if the suspense in the novel or script isn't that strong, my mind will be filled with vivid images."},{"id":"250","start":1880.6,"end":1893,"displayStart":1880.6,"displayEnd":1893,"displayMid":1886.8,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Positive","score":0.7,"loudness":0.987637,"pitch":24.944431,"speechRate":5.785,"hasEvents":false,"sentence_source":"哎 那我记得去年我们俩微信的时候，后来我翻了一下 当时咱俩互相就说看什么书，后来我说哎 我说那个阿勒泰动物场特别好，你说哎呀 太巧了 我就正好要拍那个阿勒泰。","sentence_en":"Hey, I remember when we chatted on WeChat last year, I later checked the history. We were talking about what books we were reading. Then I said, 'Hey, that book \"Altay Animal Farm\" is really good.' And you said, 'Oh, what a coincidence, I'm going to film \"Altay\"."},{"id":"251","start":1893,"end":1900.72,"displayStart":1893,"displayEnd":1900.72,"displayMid":1896.8600000000001,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Related to 'My Altay'","sentiment_en":"Neutral","score":0,"loudness":0.884574,"pitch":21.955505,"speechRate":4.534,"hasEvents":false,"sentence_source":"那我在想 你在接触这个人物的时候，你是先看了李娟的援助，还是你先看到的是剧本。","sentence_en":"So I'm wondering, when you approached this character, did you read Li Juan's original work first, or did you see the script first?"},{"id":"252","start":1900.7 pitch":20.578985,"speechRate":5.089,"hasEvents":false,"sentence_source":"就是我小的时候我一直觉得我很开心一点，我一直我印象里我妈妈是个非常健康，也非常暗美的一个女人的存在，她是一个很强的 很稳定的核心。","sentence_en":"When I was little, I always felt very happy about one thing: in my memory, my mother was a very healthy and also very graceful woman. She was a strong, stable core."},{"id":"328","start":2475.34,"end":2482.1,"displayStart":2475.34,"displayEnd":2482.1,"displayMid":2478.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.6,"loudness":0.862397,"pitch":23.823072,"speechRate":4.819,"hasEvents":false,"sentence_source":"然后我妈就是一直传递着一种很坚定的力量，就是有没有钱都没有关系。","sentence_en":"And my mother always conveyed a kind of steady strength: that whether you have money or not doesn't matter."},{"id":"329","start":2482.1,"end":2497.1,"displayStart":2482.1,"displayEnd":2497.1,"displayMid":2489.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.5,"loudness":0.79727,"pitch":19.602114,"speechRate":4.8,"hasEvents":false,"sentence_source":"因为我们家条件是不好的，就有钱跟没钱 跟你过得幸福不幸福，快乐不快乐是两码事儿，就这一点它是一直很明确的能让我感受得到的东西，我也觉得我妈妈对爱美这一部分。","sentence_en":"Because my family's financial situation wasn't good. Having money or not has nothing to do with whether you live happily or joyfully. This was something she always made very clear to me, and I also feel that my mother had a certain attitude towards beauty."},{"id":"330","start":2497.1,"end":2506.18,"displayStart":2497.1,"displayEnd":2506.18,"displayMid":2501.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.6,"loudness":0.803182,"pitch":18.944258,"speechRate":4.878,"hasEvents":false,"sentence_source":"我后来就发现原来美是需要你用生活的智慧达到的，而不是你有钱就能创造的美这一部分是需要智慧的。","sentence_en":"I later realized that beauty requires wisdom from life to achieve, not just money. Creating beauty requires wisdom."},{"id":"331","start":2506.18,"end":2515.22,"displayStart":2506.18,"displayEnd":2515.22,"displayMid":2510.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.7,"loudness":0.767,"pitch":15.433846,"speechRate":4.188,"hasEvents":false,"sentence_source":"所以我在跟自己的孩子的过程中，我也会去想到这些东西，我也希望能给到孩子这部分。","sentence_en":"So in raising my own child, I also think about these things, and I hope to pass this on to my child."},{"id":"332","start":2515.22,"end":2522.28,"displayStart":2515.22,"displayEnd":2522.28,"displayMid":2518.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.8,"loudness":0.750066,"pitch":17.73823,"speechRate":4.701,"hasEvents":false,"sentence_source":"因为我所有回想起来我妈妈的那部分都是非常健康 阳光的 稳定的 美好的。","sentence_en":"Because everything I recall about my mother is very healthy, sunny, stable, and beautiful."},{"id":"333","start":2522.28,"end":2528.2,"displayStart":2522.28,"displayEnd":2528.2,"displayMid":2525.24,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Career Development of Actresses","sentiment_en":"Neutral","score":0,"loudness":0.961357,"pitch":27.183222,"speechRate":5.029,"hasEvents":false,"sentence_source":"这种稳定的内核 你觉得是与生俱来的 还是可以后天去培养的。","sentence_en":"This kind of stable core—do you think it's innate or can be cultivated later?"},{"id":"334","start":2528.2,"end":2535.56,"displayStart":2528.2,"displayEnd":2535.56,"displayMid":2531.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.836127,"pitch":20.554506,"speechRate":5.397,"hasEvents":false,"sentence_source":"我觉得是与生俱来的 我觉得是我妈妈从她的妈妈那里得到的 就是我外婆那里得到的。","sentence_en":"I think it's innate. I think my mother got it from y","sentiment_en":"Positive","score":0.7,"loudness":0.793915,"pitch":19.536812,"speechRate":4.328,"hasEvents":false,"sentence_source":"所以我喜欢的是一个女性，无论她是怎样的一个身份、社会角色还是在家庭中的角色，妈妈只是她面对李文秀的时候的角色，她对她的婆婆的时候她是一个儿媳妇。","sentence_en":"So what I like is a woman, no matter her identity, social role, or family role. Mother is just her role when facing Li Wenxiu; when facing her mother-in-law, she is a daughter-in-law."},{"id":"344","start":2588.24,"end":2590.56,"displayStart":2588.24,"displayEnd":2590.56,"displayMid":2589.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.6,"loudness":0.876624,"pitch":19.203434,"speechRate":4.31,"hasEvents":false,"sentence_source":"但张凤侠始终是她自己。","sentence_en":"But Zhang Fengxia is always herself."},{"id":"345","start":2590.56,"end":2601.84,"displayStart":2590.56,"displayEnd":2601.84,"displayMid":2596.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.8,"loudness":0.773539,"pitch":18.543346,"speechRate":4.965,"hasEvents":false,"sentence_source":"所以她才能对女儿说出那番话，就是我生下你来不是为了让你服务别人的，你就像那个花和草和树木在这个草原上就这么待着也挺好。","sentence_en":"That's why she could say those words to her daughter: 'I gave birth to you not so that you could serve others. You can just be like those flowers, grass, and trees on this grassland—it's fine to just exist."},{"id":"346","start":2601.84,"end":2609.68,"displayStart":2601.84,"displayEnd":2609.68,"displayMid":2605.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Positive","score":0.7,"loudness":0.775256,"pitch":17.487957,"speechRate":3.932,"hasEvents":false,"sentence_source":"我觉得张凤侠的说的这个话就是我会对我孩子说的，完全就是我的想法。","sentence_en":"I think what Zhang Fengxia said is exactly what I would say to my child—it's completely my thoughts."},{"id":"347","start":2610.39 entence_source":"属于自己的名字很重要。","sentence_en":"Having a name of one's own is very important."},{"id":"355","start":2661.95,"end":2670.93,"displayStart":2661.95,"displayEnd":2670.93,"displayMid":2666.4399999999996,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":0.876638,"pitch":22.471085,"speechRate":5.111,"hasEvents":true,"sentence_source":"然后我记得我之前读《世之玉河》和《树木西林》他们俩一起，有一些他们之间的一些采访的一些对谈有一些记录。","sentence_en":"Then I remember earlier I read 'Shi Zhi Yu He' and 'Shu Mu Xi Lin' together; there are some records of interviews and conversations between them."},{"id":"356","start":2670.93,"end":2686.35,"displayStart":2670.93,"displayEnd":2686.35,"displayMid":2678.64,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":1.003149,"pitch":23.640099,"speechRate":4.734,"hasEvents":false,"sentence_source":"然后当时那本书还是要活在日常里啊，树木西林就讲他觉得做演员特别重要的几个技能必须要具备的，他说一个要学会怎么样摔倒，还有一个要学会怎么样一边吃饭一边讲话。","sentence_en":"And then that book said to live in the everyday. Kiichi Nakai said that there are several particularly important skills an actor must have. He said one is learning how to fall, and another is learning how to eat while talking."},{"id":"357","start":2686.35,"end":2688.39,"displayStart":2686.35,"displayEnd":2688.39,"displayMid":2687.37,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":1.027563,"pitch":25.679838,"speechRate":7.471,"hasEvents":false,"sentence_source":"然后我会觉得他是这样解读的。","sentence_en":"And I thought that's how he interpreted it."},{"id":"358","start":2688.39,"end":2700.99,"displayStart":2688.39,"displayEnd":2700.99,"displayMid":2694.6899999999996,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":0.907873,"pitch":23.589121,"speechRate":5.259,"hasEvents":false,"sentence_source":"那对于你来说 你觉得做一个演员最需要具备的是什么，比如说你对于生活特别敏锐的那种感受的能力，你的很强的共情能力 很强的想象力还是一些什么。","sentence_en":"For you, what do you think is the most essential quality for being an actor? For example, a particularly keen ability to sense life, strong empathy, strong imagination, or something else?"},{"id":"359","start":2700.99,"end":2709.47,"displayStart":2700.99,"displayEnd":2709.47,"displayMid":2705.2299999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Positive","score":0.5,"loudness":0.831134,"pitch":22.374102,"speechRate":3.661,"hasEvents":false,"sentence_source":"我觉得是很强的共情能力，就是不论站在谁的角度都能够深刻地感受到。","sentence_en":"I think it's strong empathy—that is, being able to deeply feel from anyone's perspective."},{"id":"360","start":2709.47,"end":2717.01,"displayStart":2709.47,"displayEnd":2717.01,"displayMid":2713.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":0.771215,"pitch":20.36071,"speechRate":4.244,"hasEvents":false,"sentence_source":"那个人此时此刻当下的感受，这样你才能在表演的过程中自己能有那个体会。","sentence_en":"That person's feelings in the moment, so that during performance you can experience that yourself."},{"id":"361","start":2717.01,"end":2723.73,"displayStart":2717.01,"displayEnd":2723.73,"displayMid":2720.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":0.785786,"pitch":14.568963,"speechRate":4.018,"hasEvents":false,"sentence_source":"因为演员一开始有的时候是不太懂怎样把一些情绪表达出来的。","sentence_en":"Because sometimes at the beginning, actors don't quite understand how to express certain emotions."},{"id":"362","start":2723.73,"end":2726.29,"displayStart":2723.73,"displayEnd":2726.29,"displayMid":2725.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Neutral","score":0,"loudness":0.630467,"pitch":12.075938,"speechRate":3.906,"hasEvents":false,"sentence_source":"对特别年轻的演员来说。","sentence_en":"Especially for very young actors."},{"id":"363","start":2726.29,"end":2737.67,"displayStart":2726.29,"displayEnd":2737.67,"displayMid":2731.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.86163,"pitch":18.518145,"speechRate":4.991,"hasEvents":false,"sentence_source":"然后后来我就用了一办法就是我去理解这个演员此刻的潜台词，就是他内心想的是什么东西，当我没有这个足够的表现能力的时候。","sentence_en":"Then later I used a method: I would try to understand the character's subtext at that moment—what is going on in his mind. When I didn't have sufficient expressive ability,"},{"id":"364","start":2737.67,"end":2745.33,"displayStart":2737.67,"displayEnd":2745.33,"displayMid":2741.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.7489,"pitch":19.422224,"speechRate":4.183,"hasEvents":false,"sentence_source":"我在演的时候我心里自己会默念这些东西，会默念他此时此刻的感受是什么。","sentence_en":"When I'm performing, I silently repeat these things to myself, what he feels at that moment."},{"id":"365","start":2745.33,"end":2755.65,"displayStart":2745.33,"displayEnd":2755.65,"displayMid":2750.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.793493,"pitch":19.590322,"speechRate":4.536,"hasEvents":false,"sentence_source":"然后当你心里是这么在感受这个东西的时候，你的脸 你的面部自然而然会呈现出于，只想匹配的状态和表情。","sentence_en":"Then when you're feeling this internally, your face will naturally present the matching state and expression."},{"id":"366","start":2755.65,"end":2769.33,"displayStart":2755.65,"displayEnd":2769.33,"displayMid":2762.49,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.885094,"pitch":20.46254,"speechRate":5.265,"hasEvents":false,"sentence_source":"那平常你看别人的戏，看其他的别人演的电影的时候，会有这样的一个时刻 你会想，哇 他演得好好啊不会的，最近一次发生是在看什么电影的时候，或者看哪一部剧的时候。","sentence_en":"Do you ever have a moment when watching others' performances or films where you think, 'Wow, they acted so well?' Not really? When was the last time that happened—watching a movie or a series?"},{"id":"367","start":2769.33,"end":2784.95,"displayStart":2769.33,"displayEnd":2784.95,"displayMid":2777.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.876763,"pitch":22.295107,"speechRate":4.033,"hasEvents":false,"sentence_source":"最近一次发生是我在电影院里，第二遍看坠落的审判的时候，我当时就是看到那段，他第一次在法庭上陈述，他与丈夫对于孩子有不同的想法的时候。","sentence_en":"The last time was in the cinema, watching 'Anatomy of a Fall' for the second time. I was watching that scene where he makes his first statement in court about having different views from his husband regarding their child."},{"id":"368","start":2784.95,"end":2787.19,"displayStart":2784.95,"displayEnd":2787.19,"displayMid":2786.0699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":1.139637,"pitch":23.235624,"speechRate":4.911,"hasEvents":false,"sentence_source":"他说他的孩子虽然是弱势。","sentence_en":"He said that although his child is vulnerable,"},{"id":"369","start":2787.19,"end":2791.25,"displayStart":2787.19,"displayEnd":2791.25,"displayMid":2789.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":0.874924,"pitch":14.337099,"speechRate":4.439,"hasEvents":false,"sentence_source":"但是他不希望让孩子知道自己是有缺陷的。","sentence_en":"he doesn't want the child to know that he has a flaw."},{"id":"370","start":2791.25,"end":2796.23,"displayStart":2791.25,"displayEnd":2796.23,"displayMid":2793.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Neutral","score":0,"loudness":1.025601,"pitch":23.548119,"speechRate":6.181,"hasEvents":false,"sentence_source":"因为他将来一生都将与之相伴，他希望孩子知道自己是一个正常人。","sentence_en":"Because he will spend his whole life with it, he wants the child to know that he is a normal person."},{"id":"371","start":2796.23,"end":2805.15,"displayStart":2796.23,"displayEnd":2805.15,"displayMid":2800.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.834129,"pitch":19.762571,"speechRate":5.748,"hasEvents":false,"sentence_source":"所以他作为一个母亲，他是不会用一个不正常的心态，去看待自己的儿子的，我当时看到那一段的时候 我非常非常感动。","sentence_en":"So as a mother, she wouldn't view her son with an abnormal mindset. When I saw that scene, I was deeply moved."},{"id":"372","start":2805.89,"end":2820.53,"displayStart":2805.89,"displayEnd":2820.53,"displayMid":2813.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.711518,"pitch":16.197495,"speechRate":5.368,"hasEvents":false,"sentence_source":"我觉得她所要表达的都是我想要表达的东西，就是一个母亲如果不能把自己的孩子当成一个正常人看，还有谁会把你的孩子当成正常人看，我当时看她那段表演的时候我觉得特别特别好。","sentence_en":"I think everything she wanted to express is exactly what I want to express: if a mother doesn't see her own child as a normal person, who else will? When I watched her performance in that scene, I thought it was exceptionally good."},{"id":"373","start":2820.53,"end":2824.15,"displayStart":2820.53,"displayEnd":2824.15,"displayMid":2822.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Feminism and Family","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.815288,"pitch":18.54352,"speechRate":5.373,"hasEvents":false,"sentence_source":"因为她整个非常的自然 我觉得演得太好了。","sentence_en":"Because she was so natural throughout, I thought the acting was superb."},{"id":"374","start":2824.15,"end":2835.67,"displayStart":2824.15,"displayEnd":2835.67,"displayMid":2829.91,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Positive","score":0.7,"loudness":0.899384,"pitch":26.72929,"speechRate":4.935,"hasEvents":false,"sentence_source":"对 这个惠乐真的很棒，我是先看了《坠落的审判》，后来又看她演的那个《利益区域》，哇 他在里面演那个德国军官的妻子，整个人的身形走路。","sentence_en":"Yes, Sandra Hüller is really amazing. I first saw Anatomy of a Fall, and later watched her in The Zone of Interest. Wow, she plays the German officer's wife, the way she carries herself and walks..."},{"id":"375","start":2835.67,"end":2847.83,"displayStart":2835.67,"displayEnd":2847.83,"displayMid":2841.75,"speaker":"Ma Yili","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Directors and Their Films","sentiment_en":"Positive","score":0.8,"loudness":0.837914,"pitch":25.390234,"speechRate":5.76,"hasEvents":false,"sentence_source":"他走路的姿势你就觉得太符合那个年代的一个德国女人，就这个演员真的很了不起，他的所有的表演又特别的当代，就没有给到你那么的那么的够那么的过那么的猛。","sentence_en":"Her walking posture just perfectly fits a German woman of that era. This actress is truly remarkable. All her performances are so contemporary, without being too much, too overdone, or too intense."},{"id":"376","start":2847.83,"end":2850.73,"displayStart":2847.83,"displayEnd":2850.73,"displayMid":2849.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Character expression and personal life","sentiment_en":"Positive","score":0.6,"loudness":0
