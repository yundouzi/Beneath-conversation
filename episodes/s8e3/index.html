你妈妈有吗，你们宅子里别的人都有都有 我。","sentence_en":"Do you think your sister has this ability? Your mother? Others in your household? They all do. I—"},{"id":"397","start":3025.92,"end":3029.92,"displayStart":3025.92,"displayEnd":3029.92,"displayMid":3027.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.013324,"pitch":25.4044,"speechRate":4.756,"hasEvents":false,"sentence_source":"觉得都有，就是我先离开宅子里，再回去之后才。","sentence_en":"I think they all do. It's only after I left the household and returned later that—"},{"id":"398","start":3029.92,"end":3032,"displayStart":3029.92,"displayEnd":3032,"displayMid":3030.96,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.6,"loudness":0.970521,"pitch":20.606884,"speechRate":4.327,"hasEvents":false,"sentence_source":"发现这个东西很宝贵。","sentence_en":"I realized this thing is precious."},{"id":"399","start":3032,"end":3033.76,"displayStart":3032,"displayEnd":3033.76,"displayMid":3032.88,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.718884,"pitch":17.816383,"speechRate":3.977,"hasEvents":false,"sentence_source":"然后是大家都有。","sentence_en":"And then I realized everyone has it."},{"id":"400","start":3033.76,"end":3036.98,"displayStart":3033.76,"displayEnd":3036.98,"displayMid":3035.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":1.121153,"pitch":30.744392,"speechRate":5.036,"hasEvents":false,"sentence_source":"在这里的人虽然说死得很随意吧。","sentence_en":"People here may die casually, but—"},{"id":"401","start":3036.98,"end":3040.04,"displayStart":3036.98,"displayEnd":3040.04,"displayMid":3038.51,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.6,"loudness":0.873588,"pitch":28.194359,"speechRate":5.585,"hasEvents":false,"sentence_source":"可是大家在活的时候是活得很认真的。","sentence_en":"But when they are alive, they live very seriously."},{"id":"402","start":3040.04,"end":3048.8,"displayStart":3040.04,"displayEnd":3048.8,"displayMid":3044.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.933725,"pitch":19.362068,"speechRate":4.657,"hasEvents":false,"sentence_source":"我们好像有一条准则就是不管遇到任何事情吧，先活下去再说，活是最重要的事情，活压倒一切。","sentence_en":"We seem to have a principle: no matter what happens, survive first. Living is the most important thing; living trumps everything."},{"id":"403","start":3048.8,"end":3059.98,"displayStart":3048.8,"displayEnd":3059.98,"displayMid":3054.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.035689,"pitch":21.009459,"speechRate":4.114,"hasEvents":false,"sentence_source":"所以就跟那个弗荣正台词说的一样，活下去像生狗一样的对，这个也是我的一个人生准则，在我很多次惊恐发作。","sentence_en":"So just like that line from the movie, 'Live like a beast,' right? That's also my life principle. Many times when I had panic attacks—"},{"id":"404","start":3059.98,"end":3067.18,"displayStart":3059.98,"displayEnd":3067.18,"displayMid":3063.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.975436,"pitch":20.028542,"speechRate":5.862,"hasEvents":false,"sentence_source":"我觉得我坚持不下去了，我要放弃了，我就会想到这句话 我就说先活下去，哪怕你像胜口一样的活下去。","sentence_en":"I felt I couldn't hold on, I wanted to give up. Then I would think of that line and tell myself to survive first, even if you live like a beast."},{"id":"405","start":3067.18,"end":3079.64,"displayStart":3067.18,"displayEnd":3079.64,"displayMid":3073.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.7,"loudness":0.850582,"pitch":21.521204,"speechRate":5.297,"hasEvents":false,"sentence_source":"然后就发现 活下去以后第二天醒来就一切都不一样了，在这里的人也都是这样的 大家都有一种这样的精神，不管你的人生今天过得再糟糕也好 你先活下去吧。","sentence_en":"And then I found that after surviving, everything is different when you wake up the next day. People here are like that too—everyone has that spirit. No matter how bad your life is today, just survive first."},{"id":"406","start":3079.64,"end":3089.42,"displayStart":3079.64,"displayEnd":3089.42,"displayMid":3084.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.028513,"pitch":25.237169,"speechRate":4.734,"hasEvents":false,"sentence_source":"除了老人 老人他可能实在是觉得 我活到这年纪我够了，我没有什么想再去探索的事情 我已经活得厌倦了。","sentence_en":"Except for the elderly. They might genuinely feel that they've lived enough, nothing left to explore, they've grown tired of living."},{"id":"407","start":3089.42,"end":3093.02,"displayStart":3089.42,"displayEnd":3093.02,"displayMid":3091.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.614606,"pitch":16.231165,"speechRate":4.578,"hasEvents":false,"sentence_source":"然后他们就会残忍又平静地走向死亡。","sentence_en":"Then they will walk towards death, cruel and calm."},{"id":"408","start":3093.8,"end":3098.02,"displayStart":3093.8,"displayEnd":3098.02,"displayMid":3095.91,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.731574,"pitch":23.44405,"speechRate":4.91,"hasEvents":false,"sentence_source":"你刚才说惊恐症 你第一次惊恐症发作是多大?","sentence_en":"You just mentioned panic disorder. How old were you when you had your first panic attack?"},{"id":"409","start":3098.32,"end":3103.72,"displayStart":3098.32,"displayEnd":3103.72,"displayMid":3101.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.86496,"pitch":25.698072,"speechRate":3.724,"hasEvents":false,"sentence_source":"其实我完全不知道我有些症状可能就是惊恐症。","sentence_en":"Actually, I had no idea some of my symptoms were panic disorder."},{"id":"410","start":3103.72,"end":3110.28,"displayStart":3103.72,"displayEnd":3110.28,"displayMid":3107,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.862684,"pitch":22.683039,"speechRate":5.335,"hasEvents":false,"sentence_source":"所以我已经很难去追数了，我真正知道它是惊恐症是2021年在深圳的时候发作。","sentence_en":"So it's hard to trace back. I only realized it was panic disorder when I had an episode in Shenzhen in 2021."},{"id":"411","start":3110.28,"end":3118.9,"displayStart":3110.28,"displayEnd":3118.9,"displayMid":3114.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.841771,"pitch":15.848441,"speechRate":4.524,"hasEvents":false,"sentence_source":"然后深圳的医生告诉我这是惊恐症，可是我之前也有过很多次手脚发麻、喘不过气这样的时刻。","sentence_en":"Then a doctor in Shenzhen told me it was panic disorder, but I had experienced numbness in my limbs and shortness of breath many times before."},{"id":"412","start":3118.9,"end":3129.56,"displayStart":3118.9,"displayEnd":3129.56,"displayMid":3124.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.797885,"pitch":22.178263,"speechRate":4.597,"hasEvents":false,"sentence_source":"所以我根本就想不起来了它第一次到底是什么时候我就，把2021年作为我金恐镇的元年，金恐元年之2021年。","sentence_en":"So I can't remember when the first one was. I just treat 2021 as the first year of my panic disorder era, Year One of Panic: 2021."},{"id":"413","start":3129.56,"end":3132.78,"displayStart":3129.56,"displayEnd":3132.78,"displayMid":3131.17,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.930935,"pitch":29.788561,"speechRate":5.348,"hasEvents":false,"sentence_source":"你说里面讲金恐镇跟抑郁症的区别。","sentence_en":"You talked about the difference between panic disorder and depression."},{"id":"414","start":3132.78,"end":3144.26,"displayStart":3132.78,"displayEnd":3144.26,"displayMid":3138.5200000000004,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.5,"loudness":0.940434,"pitch":23.459082,"speechRate":5.139,"hasEvents":false,"sentence_source":"我觉得这个对我去理解它帮助还挺大的，你说抑郁症比如说起不来床，抑郁症是不想起来 缺少那个动力，但金恐症是根本起不来 没有这个能力。","sentence_en":"I think that really helped me understand it. You said with depression, you can't get out of bed because you don't want to—you lack motivation. But with panic disorder, you physically can't get up—you don't have the ability."},{"id":"415","start":3144.26,"end":3152.5,"displayStart":3144.26,"displayEnd":3152.5,"displayMid":3148.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.866575,"pitch":24.696337,"speechRate":3.614,"hasEvents":false,"sentence_source":"对 因为首先它最明显的特征是 心动过速，就是心跳会非常非常非常快。","sentence_en":"Right. First, the most obvious symptom is tachycardia—your heart beats extremely fast."},{"id":"416","start":3152.5,"end":3165.94,"displayStart":3152.5,"displayEnd":3165.94,"displayMid":3159.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.918712,"pitch":21.655643,"speechRate":3.881,"hasEvents":false,"sentence_source":"然后就是你的四肢会发麻、无力、成肌爪状抽出，再者就是你的头皮和后背的肌肉会非常的将痛，它是生理上的 让你起不来床。","sentence_en":"Then your limbs go numb and weak, your hands cramp into claw-like positions. Also, the muscles in your scalp and back ache terribly. It's physical—it prevents you from getting out of bed."},{"id":"417","start":3165.94,"end":3171.32,"displayStart":3165.94,"displayEnd":3171.32,"displayMid":3168.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.960415,"pitch":20.970631,"speechRate":5.103,"hasEvents":false,"sentence_source":"也吃不下东西 大小便也总是有问题，要么就是太多 要么就没有。","sentence_en":"You can't eat, and you have bowel and bladder issues—either too much or none at all."},{"id":"418","start":3172.08,"end":3187.18,"displayStart":3172.08,"displayEnd":3187.18,"displayMid":3179.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.895236,"pitch":23.478745,"speechRate":4.636,"hasEvents":false,"sentence_source":"所以后来我跟一个有意欲的朋友我们两个就聊天嘛他，就说他是不想起来，他就没有那个动力去起来，他都不想去拉开那个窗帘，我说我好渴望起来，我好想到外面去走一。","sentence_en":"So later I talked to a friend with depression. He said he didn't want to get up—he had no motivation, didn't even want to open the curtains. I said I desperately wanted to get up, wanted to go outside for a walk."},{"id":"419","start":3187.18,"end":3192.24,"displayStart":3187.18,"displayEnd":3192.24,"displayMid":3189.71,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.861143,"pitch":19.55937,"speechRate":5.751,"hasEvents":false,"sentence_source":"但是我没有力气起来，我才意识到这也是两种完全不一样的疾病。","sentence_en":"But I had no strength to get up. That's when I realized they are two completely different illnesses."},{"id":"420","start":3192.24,"end":3196.86,"displayStart":3192.24,"displayEnd":3196.86,"displayMid":3194.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.904392,"pitch":24.649008,"speechRate":5.195,"hasEvents":false,"sentence_source":"我也是跟他聊天了以后我才知道的，我之前一直以为。","sentence_en":"I only found that out after talking to him. Before that, I always thought..."},{"id":"421","start":3196.86,"end":3198.04,"displayStart":3196.86,"displayEnd":3198.04,"displayMid":3197.45,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.970605,"pitch":22.064835,"speechRate":5.085,"hasEvents":false,"sentence_source":"惊恐的起不来。","sentence_en":"Panic-related inability to get up..."},{"id":"422","start":3198.04,"end":3198.96,"displayStart":3198.04,"displayEnd":3198.96,"displayMid":3198.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.041875,"pitch":26.538853,"speechRate":5.435,"hasEvents":false,"sentence_source":"床的症状跟。","sentence_en":"...and bed-bound symptoms from..."},{"id":"423","start":3198.96,"end":3209.66,"displayStart":3198.96,"displayEnd":3209.66,"displayMid":3204.31,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.771534,"pitch":20.395132,"speechRate":5.421,"hasEvents":false,"sentence_source":"意欲的应该是差不多的，哦 原来完全不大一样，惊恐症还是有生的渴望的，只是后来发现要活下去的话，我得承受太多身体的痛苦，有点看不住。","sentence_en":"...depression were similar. Oh, they're completely different. With panic disorder, you still have a desire to live. It's just that later you realize to keep living, you have to endure so much physical pain that it's hard to bear."},{"id":"424","start":3209.66,"end":3220.36,"displayStart":3209.66,"displayEnd":3220.36,"displayMid":3215.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.858615,"pitch":24.736544,"speechRate":5.027,"hasEvents":false,"sentence_source":"我觉得惊恐的痛苦是这样的，就是它会让你以为你已经好了，比如我今天状态还不错，我以为啊我已经好了，肯定不会再犯了。","sentence_en":"I think the pain of panic disorder is that it makes you think you've recovered. For example, if I feel okay today, I think, 'I'm better, it won't happen again for sure."},{"id":"425","start":3220.36,"end":3234.46,"displayStart":3220.36,"displayEnd":3234.46,"displayMid":3227.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.988668,"pitch":22.866564,"speechRate":5.411,"hasEvents":false,"sentence_source":"然后你就很正常的生活，很开心的跟朋友聊天啊，吃饭啊看电视啊，某一个瞬间它突然又来了，一切又回到原点，你做的所有的努力都白费，你永远不知道他什么时候会来，这是最可怕的。","sentence_en":"Then you live normally, chat happily with friends, eat, watch TV. Suddenly, in an instant, it comes back. Everything returns to square one. All your efforts are wasted. You never know when it will strike—that's the scariest part."},{"id":"426","start":3234.46,"end":3245.08,"displayStart":3234.46,"displayEnd":3 rt":3256.16,"end":3258.24,"displayStart":3256.16,"displayEnd":3258.24,"displayMid":3257.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Disease Healing and Attitude Towards Life","sentiment_en":"Neutral","score":0,"loudness":0.919322,"pitch":21.505249,"speechRate":5.747,"hasEvents":false,"sentence_source":"那会还没有跟潜伏离婚。","sentence_en":"At that time, I hadn't divorced my ex-husband yet."},{"id":"431","start":3258.24,"end":3260.34,"displayStart":3258.24,"displayEnd":3260.34,"displayMid":3259.29,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Disease Healing and Attitude Towards Life","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.765003,"pitch":20.168575,"speechRate":7.008,"hasEvents":false,"sentence_source":"我就跟潜夫说我坚持不下去了。","sentence_en":"I told my ex-husband I couldn't go on."},{"id":"432","start":3260.34,"end":3265.52,"displayStart":3260.34,"displayEnd":3265.52,"displayMid":3262.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Disease Healing and Attitude Towards Life","sentiment_en":"Neutral","score":0,"loudness":0.97143,"pitch":23.168482,"speechRate":6.638,"hasEvents":false,"sentence_source":"他很聪明，他马上就意识到了，我说的坚持不下去是哪种坚持不下去就是我。","sentence_en":"He was smart. He immediately understood what kind of 'couldn't go on' I meant—as in, I couldn't keep living."},{"id":"433","start":3265.52,"end":3267.08,"displayStart":3265.52,"displayEnd":3267.08,"displayMid":3266.3,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Disease Healing and Attitude Towards Life","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.865521,"pitch":17.874323,"speechRate":7.051,"hasEvents":false,"sentence_source":"已经很想从那儿挑下去了。","sentence_en":"I really wanted to jump from there."},{"id":"434","start":3267.86,"end":3281.92,"displayStart":3267.86,"displayEnd":3281.92,"displayMid":3274.89000000 ues. I felt like I had gotten revenge on them. I loved sharing on my social media the nice places I went to,"},{"id":"535","start":4016.78,"end":4032.28,"displayStart":4016.78,"displayEnd":4032.28,"displayMid":4024.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.7,"loudness":1.015855,"pitch":24.926329,"speechRate":3.68,"hasEvents":false,"sentence_source":"吃的好东西，住的好房子，24小时的管家，咱都不叫物业，咱叫管家哇，又是什么，去美容院洗脸，做脸去体检，都是VIP专人服务体检什么的。","sentence_en":"The good food I ate, the nice houses I lived in, the 24-hour butler — we didn't call it property management, we called it butler service. And going to beauty salons for facials, medical checkups with VIP personal service."},{"id":"536","start":4032.28,"end":4037.38,"displayStart":4032.28,"displayEnd":4037.38,"displayMid":4034.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.049895,"pitch":27.177462,"speechRate":4.579,"hasEvents":true,"sentence_source":"我还在豆瓣上分享说，这两年导腾房子我学会了什么。","sentence_en":"I even shared on Douban what I learned from renovating houses over these two years."},{"id":"537","start":4042.02,"end":4045.98,"displayStart":4042.02,"displayEnd":4045.98,"displayMid":4044,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":1.018446,"pitch":32.832813,"speechRate":4.469,"hasEvents":true,"sentence_source":"但是在那半年里就是这样的 好膨胀啊。","sentence_en":"But that was how it was during that half year — so full of pride."},{"id":"538","start":4045.98,"end":4058.24,"displayStart":4045.98,"displayEnd":4058.24,"displayMid":4052.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.750918,"pitch":20.821249,"speechRate":4.512,"hasEvents":false,"sentence_source":"然后就渐渐的那骨子热情过去了以后，你就发现不对劲了，你在依靠另外一个人生活，就不是你以前熟悉的模式，这个事情非常不对劲。","sentence_en":"Then gradually, after that initial passion faded, you realized something was off—you were depending on someone else to live, which wasn't the pattern you were used to, and that felt deeply wrong."},{"id":"539","start":4058.24,"end":4072.64,"displayStart":4058.24,"displayEnd":4072.64,"displayMid":4065.4399999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.912169,"pitch":23.128368,"speechRate":5.444,"hasEvents":false,"sentence_source":"那种不安感就又回到身体里来了，我很少有事情是有个什么节点，让你意识到某件事情很少很少的，就唯独有这一件事，这件事情那个节点我一直记得很清楚，我到美容院去做脸光子弄敷。","sentence_en":"That unease came back into my body. I rarely have a specific moment where I realize something, almost never, but with this one thing, I remember that moment very clearly—I went to a beauty salon for a facial with IPL."},{"id":"540","start":4072.64,"end":4077.02,"displayStart":4072.64,"displayEnd":4077.02,"displayMid":4074.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.81573,"pitch":28.072733,"speechRate":6.09,"hasEvents":false,"sentence_source":"然后不是做光子之前，他要先给你上那个凝胶还是什么东西。","sentence_en":"Before the IPL, they apply some gel or something first."},{"id":"541","start":4077.02,"end":4086.96,"displayStart":4077.02,"displayEnd":4086.96,"displayMid":4081.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.958574,"pitch":24.876577,"speechRate":4.893,"hasEvents":false,"sentence_source":"那个小女孩很年轻比我年纪小多了，她就站在给我上，上的时候她就给我把哪里弄疼了一点 2,"displayStart":5640.96,"displayEnd":5642.12,"displayMid":5641.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.007768,"pitch":27.502378,"speechRate":6.034,"hasEvents":false,"sentence_source":"然后我就在那看。","sentence_en":"So I just watched."},{"id":"768","start":5642.12,"end":5649.1,"displayStart":5642.12,"displayEnd":5649.1,"displayMid":5645.610000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.7,"loudness":0.994,"pitch":26.600719,"speechRate":6.017,"hasEvents":false,"sentence_source":"然后我也不怕跟人家打招呼什么的，我最喜欢《芝加哥南区》的一点，就是每个人一听到音乐就开始滤动。","sentence_en":"And I'm not afraid to greet people or anything. What I love most about 'South Side Chicago' is that everyone starts swaying as soon as they hear music."},{"id":"769","start":5649.1,"end":5651.84,"displayStart":5649.1,"displayEnd":5651.84,"displayMid":5650.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":1.053332,"pitch":29.13994,"speechRate":5.169,"hasEvents":false,"sentence_source":"然后我们就滤动，中间也不说话。","sentence_en":"Then we swayed without saying a word."},{"id":"770","start":5651.84,"end":5653.44,"displayStart":5651.84,"displayEnd":5653.44,"displayMid":5652.639999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.6,"loudness":0.721591,"pitch":33.549538,"speechRate":5.625,"hasEvents":false,"sentence_source":"我们就滤动滤动滤动。","sentence_en":"We just kept swaying and swaying."},{"id":"771","start":5653.44,"end":5659.08,"displayStart":5653.44,"displayEnd":5659.08,"displayMid":5656.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"c  Life Choices","sentiment_en":"Positive","score":0.7,"loudness":0.86645,"pitch":23.517727,"speechRate":5.774,"hasEvents":true,"sentence_source":"所以我觉得我在学校里面还是被压抑的，太厉害了都不好意思滤动、不好意思舞蹈，现在又重新解放的天性。","sentence_en":"So I feel like I was really suppressed in school—too embarrassed to sway or dance. Now I've liberated my natural instincts again."},{"id":"776","start":5678.92,"end":5682.86,"displayStart":5678.92,"displayEnd":5682.86,"displayMid":5680.889999999999,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Migration Experiences and Life Choices","sentiment_en":"Neutral","score":0.2,"loudness":0.725335,"pitch":18.473309,"speechRate":4.061,"hasEvents":false,"sentence_source":"我也少数民族，我是回族我知道你知道。","sentence_en":"I'm also from an ethnic minority. I'm Hui, and I know you know."},{"id":"777","start":5682.86,"end":5684.44,"displayStart":5682.86,"displayEnd":5684.44,"displayMid":5683.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":0.86016,"pitch":24.50992,"speechRate":4.43,"hasEvents":true,"sentence_source":"可是做了功课的。","sentence_en":"But I did my homework."},{"id":"778","start":5684.94,"end":5695.9,"displayStart":5684.94,"displayEnd":5695.9,"displayMid":5690.42,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0.1,"loudness":0.921985,"pitch":23.070587,"speechRate":5.059,"hasEvents":true,"sentence_source":"但我小时候其实也不太跟别人讲，我是回族为什么，就是小孩是希望跟别人是一样的，小时候不会认为少数是酷的，我喜欢作为少数。","sentence_en":"But when I was a kid, I didn't really tell people I was Hui. Why? Because kids want to be the same as others. When you're young, you don't think being a minority is cool. I like being a minority."},{"id":"779","start":5695.9,"end":5707.44,"displayStart":5695.9,"displayEnd":5707.44,"displayMid":5701.67,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.86981,"pitch":21.13324,"speechRate":5.071,"hasEvents":false,"sentence_source":"但不是弱势，我是少数而不弱势的话，我会觉得它很酷，但小孩不会觉得，小孩你会希望有从众和大多数人是一样的，那大多数同样都是汉族。","sentence_en":"But not a weak minority. If I'm a minority but not weak, I think it's cool. But kids don't think that. Kids want to conform and be like the majority, which is Han."},{"id":"780","start":5707.9,"end":5713.2,"displayStart":5707.9,"displayEnd":5713.2,"displayMid":5710.549999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0.2,"loudness":0.867593,"pitch":28.715174,"speechRate":5.333,"hasEvents":false,"sentence_source":"我想说一个题外话，你知道如果叫我形容你，我会怎么形容吗?嗯，你说。","sentence_en":"Let me go off on a tangent. You know how I would describe you? Mm, go ahead."},{"id":"781","start":5713.5,"end":5715.7,"displayStart":5713.5,"displayEnd":5715.7,"displayMid":5714.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.931767,"pitch":28.944407,"speechRate":5.057,"hasEvents":false,"sentence_source":"我觉得你像一个玻璃娃娃。","sentence_en":"I think you're like a glass doll."},{"id":"782","start":5716.12,"end":5718.72,"displayStart":5716.12,"displayEnd":5718.72,"displayMid":5717.42,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Negative","score":-0.3,"loudness":0.960583,"pitch":26.234165,"speechRate":5.372,"hasEvents":false,"sentence_source":"好脆弱，感觉很容易就摔破了呀。","sentence_en":"So fragile, like it could break easily."},{"id":"783","start":5718.72,"end":5723.86,"displayStart":5718.72,"displayEnd":5723.86,"displayMid":5721.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0.1,"loudness":1.250371,"pitch":31.628649,"speechRate":2.753,"hasEvents":false,"sentence_source":"诶 对吧 你要说很脆弱吧 我就知道。","sentence_en":"Yeah, right? If you say fragile, I knew it."},{"id":"784","start":5723.86,"end":5728.94,"displayStart":5723.86,"displayEnd":5728.94,"displayMid":5726.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.031492,"pitch":25.880219,"speechRate":4.134,"hasEvents":false,"sentence_source":"但是玻璃娃娃有实心的，实心的玻璃娃娃很难摔破。","sentence_en":"But there are solid glass dolls, and solid ones are hard to break."},{"id":"785","start":5728.94,"end":5744.62,"displayStart":5728.94,"displayEnd":5744.62,"displayMid":5736.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.6,"loudness":0.987874,"pitch":27.267172,"speechRate":4.994,"hasEvents":false,"sentence_source":"嗯，我以前就有一个实心的玻璃娃娃，实心的玻璃娃娃摔不破吗，摔不破 它不仅摔不破，如果它是掉在木底板上的话，它甚至还能来回的弹几下，你就是这样的一个玻璃娃娃，看起来好像很脆弱。","sentence_en":"I used to have a solid glass doll. Can a solid glass doll break? No, it can't. Not only does it not break, but if it falls on a wooden floor, it even bounces a few times. You are just like that glass doll, seemingly fragile."},{"id":"786","start":5744.62,"end":5750.8,"displayStart":5744.62,"displayEnd":5750.8,"displayMid":5747.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.7,"loudness":0.886683,"pitch":24.33601,"speechRate":5.987,"hasEvents":false,"sentence_source":"但是其实你根本摔不破，你要是那个条件允许的话，你还起来谈几下 这就是我对你的印象。","sentence_en":"But actually you can't break at all. If conditions allow, you'll bounce back. That's my impre ion","sentiment_en":"Positive","score":0.5,"loudness":0.906141,"pitch":19.741678,"speechRate":4.967,"hasEvents":false,"sentence_source":"就是我喜欢这个男孩子 我想要跟他更进一步，我可以把我的腰带送给他。","sentence_en":"That is, if I like a boy and want to get closer to him, I can give him my belt."},{"id":"858","start":6280.54,"end":6281.92,"displayStart":6280.54,"displayEnd":6281.92,"displayMid":6281.23,"speaker":"SPEAKER_00","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.324133,"pitch":18.945997,"speechRate":2.174,"hasEvents":false,"sentence_source":"嗯 就是。","sentence_en":"Mm-hmm, exactly."},{"id":"859","start":6281.92,"end":6294.02,"displayStart":6281.92,"displayEnd":6294.02,"displayMid":6287.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.6,"loudness":0.995358,"pitch":26.336058,"speechRate":5.124,"hasEvents":false,"sentence_source":"很好玩吧 就是这个表心意的过程，是女生主动 我觉得这个好像在其他，至少是我现在目前有限的接触到的里面，好像是没有一个是这样女性来主导的。","sentence_en":"Interesting, right? The process of expressing feelings is initiated by the girl. I think in other cultures, at least from my limited exposure, I haven't seen one where women take the lead like this."},{"id":"860","start":6294.02,"end":6297.9,"displayStart":6294.02,"displayEnd":6297.9,"displayMid":6295.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.894781,"pitch":27.619268,"speechRate":5.882,"hasEvents":false,"sentence_source":"如果说那个男生也喜欢他 他就把这个腰带收下来。","sentence_en":"If the boy also likes her, he accepts the belt."},{"id":"861","start":6297.9,"end":6306.86,"displayStart":6297.9,"displayEnd":6306.86,"displayMid":6302.379999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Mino   wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
