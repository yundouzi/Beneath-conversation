":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.870475,"pitch":24.31922,"speechRate":4.428,"hasEvents":false,"sentence_source":"比如我举一个例子，我看到鲁豫老师，可能有汉语的形容词的话，就会说一个什么什么样的鲁豫老师。","sentence_en":"For example, if I see Lu Yu, in Chinese you'd use adjectives to say 'a certain kind of Lu Yu."},{"id":"53","start":396.21,"end":404.17,"displayStart":396.21,"displayEnd":404.17,"displayMid":400.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.985222,"pitch":24.37771,"speechRate":5.737,"hasEvents":false,"sentence_source":"但是遗话它就没有这样的一个概念，更多的是去表达我是一个什么样的感受，就是会说我看那种鲁豫老师。","sentence_en":"But Yihua doesn't have that concept. It's more about expressing how you feel—like 'I see that kind of Lu Yu."},{"id":"54","start":404.17,"end":411.95,"displayStart":404.17,"displayEnd":411.95,"displayMid":408.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":0.952539,"pitch":22.267851,"speechRate":4.502,"hasEvents":false,"sentence_source":"然后他对我笑我觉得很开心，就更注重于表达自己的感受，而不是去描绘对方的形象。","sentence_en":"Then when she smiles at me, I feel happy. It focuses more on expressing your own feelings than describing the other person's image."},{"id":"55","start":411.95,"end":418.29,"displayStart":411.95,"displayEnd":418.29,"displayMid":415.12,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.6,"loudness":1.03363,"pitch":21.842049,"speechRate":4.938,"hasEvents":false,"sentence_source":"那比如说我此刻看到小扎，我的感受你是一个交小的、可爱的、活泼的。","sentence_en":"So right now, seeing Xiao Zha, my feeling is that you are small, cute, and lively."},{"id":"56","start":418.29,"end":422 都没有把它当成一个非常严肃的说，可能会影响孩子的一生的这样的一个事情来处理。","sentence_en":"So neither I nor my parents treated it as something extremely serious that could affect a child's whole life."},{"id":"109","start":804.95,"end":814.81,"displayStart":804.95,"displayEnd":814.81,"displayMid":809.88,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.934624,"pitch":27.682535,"speechRate":6.116,"hasEvents":false,"sentence_source":"你为什么会这么说呢 因为在我的想象当中 你从小生活的那个债子里面，人应该并不多 至少没有像北京的一个很大的小区里面那么多人。","sentence_en":"Why do you say that? In my imagination, the village you grew up in didn't have many people—at least not as many as a large residential area in Beijing."},{"id":"110","start":814.81,"end":827.91,"displayStart":814.81,"displayEnd":827.91,"displayMid":821.3599999999999,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.921347,"pitch":26.134558,"speechRate":5.649,"hasEvents":false,"sentence_source":"那从概率上来说 一个小孩不可能在自己生活的一个很小的债子里面，会见过那么多的 比如说失明的或者失聪的或者身体有某种残障的人，从概率来就不可能会有那么多呀。","sentence_en":"Statistically, a child in a small village couldn't have seen so many blind, deaf, or disabled people—it's improbable to have that many."},{"id":"111","start":827.91,"end":843.65,"displayStart":827.91,"displayEnd":843.65,"displayMid":835.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.93791,"pitch":23.115046,"speechRate":4.638,"hasEvents":false,"sentence_source":"因为我们比如说你的身体受伤了以后，下一时的反应不是说去大医院里面去求助，而是自己去弄点草药啊或者是随便包扎一下就好了，就像我在书里写到说我妈妈她去砍柴。","sentence_en":"For example, when we get injured, our instinct isn't to go to a big hospital for help, but to find some herbs or just bandage it casually. Like I wrote in my book about my mother going to chop firewood."},{"id":"112","start":843.65,"end":858.45,"displayStart":843.65,"displayEnd":858.45,"displayMid":851.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.930103,"pitch":24.710743,"speechRate":5.338,"hasEvents":false,"sentence_source":"然后砍到她的膝盖骨头都露出来了嘛，但大家都没有说去要缝针啊或者是要去医院处理一下，就医院这个事情对我们来说是已经非常遥远的事情，就像以前美国对我来说是个很遥远的事情。","sentence_en":"Then her knee was cut so deep the bone was exposed, but no one mentioned stitches or going to the hospital. For us, hospitals were a distant thing, like America used to be for me."},{"id":"113","start":858.45,"end":863.79,"displayStart":858.45,"displayEnd":863.79,"displayMid":861.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.843409,"pitch":22.209291,"speechRate":5.431,"hasEvents":false,"sentence_source":"陈璐玉老师对我来说是个很遥远的事情，就完全没有这个概念的存在。","sentence_en":"Teacher Chen Luyu was also a distant concept—I had no idea about her at all."},{"id":"114","start":863.79,"end":874.47,"displayStart":863.79,"displayEnd":874.47,"displayMid":869.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.84325,"pitch":19.307531,"speechRate":4.143,"hasEvents":false,"sentence_source":"所以我们村这里什么眼睛瞎掉的呀，耳朵听不到的人还挺多的，就各种各样的意外，起码我知道的就有三个。","sentence_en":"So in our village, there were quite a few blind or deaf people from various accidents—at least three that I know of."},{"id":"115","start":875.67,"end":878.17,"displayStart":875.67,"displayEnd":878.17,"displayMid":876.92,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.840516,"pitch":24.579693,"speechRate":6.757,"hasEvents":false,"sentence_source":"你们寨子有多少人就在你小的时候。","sentence_en":"How many people were in your village when you were little?"},{"id":"116","start":878.63,"end":888.75,"displayStart":878.63,"displayEnd":888.75,"displayMid":883.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.860736,"pitch":19.048153,"speechRate":4.335,"hasEvents":false,"sentence_source":"小的时候很少，就一百人不到吧，所有登记在册的人，具体真的生活在宅子里面的人 应该就是四五十个人。","sentence_en":"Very few, less than a hundred. Of all the registered people, the ones actually living in the village were probably forty or fifty."},{"id":"117","start":888.75,"end":894.85,"displayStart":888.75,"displayEnd":894.85,"displayMid":891.8,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Neutral","score":0,"loudness":0.825072,"pitch":25.181829,"speechRate":4.758,"hasEvents":true,"sentence_source":"那离你们宅子最近的医院 可以称得上是医院的地方要有多远呃。","sentence_en":"How far was the nearest hospital, a place that could be called a hospital, from your village?"},{"id":"118","start":895.73,"end":904.19,"displayStart":895.73,"displayEnd":904.19,"displayMid":899.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Neutral","score":0,"loudness":0.840075,"pitch":22.04278,"speechRate":3.791,"hasEvents":true,"sentence_source":"乡卫生院 如果是现在开车是45分钟左右，如果是当时开车的话 那就难讲了。","sentence_en":"The township health center—driving now takes about 45 minutes, but back then, it's hard to say."},{"id":"119","start":904.19,"end":917.01,"displayStart":904.19,"displayEnd":917.01,"displayMid":910.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Neutral","score":0,"loudness":0.812217,"pitch":19.838942,"speechRate":4.562,"hasEvents":false,"sentence_source":"因为我们当时还没有同可以车型的公路，我姐姐是87年生人，她去读乡镇初中的时候就是走路去，从家里出发是四个半小时走到学校里。","sentence_en":"Because we didn't have a road suitable for cars. My sister was born in '87, and when she went to middle school in town, she walked—four and a half hours from home to school."},{"id":"120","start":917.01,"end":922.85,"displayStart":917.01,"displayEnd":922.85,"displayMid":919.9300000000001,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.931506,"pitch":28.083752,"speechRate":4.464,"hasEvents":false,"sentence_source":"所以我看你书里面描绘的生活场景，的确我只能够是去想象。","sentence_en":"So when I read the life scenes you described in your book, I can only imagine them."},{"id":"121","start":922.85,"end":932.27,"displayStart":922.85,"displayEnd":932.27,"displayMid":927.56,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":0.94857,"pitch":23.275309,"speechRate":4.671,"hasEvents":false,"sentence_source":"因为像你说的对你们来说，牛呀马呀鸡呀，就是你从小的玩伴，好像生活中的一员，是你的伙伴从小就是如此。","sentence_en":"As you said, for you, cows, horses, chickens were childhood companions, like part of the family, always have been."},{"id":"122","start":932.77,"end":940.11,"displayStart":932.77,"displayEnd":940.11,"displayMid":936.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.895815,"pitch":25.923025,"speechRate":4.408,"hasEvents":false,"sentence_source":"甚至有一段时间我睡觉的地方，旁边就是牛卷 闻着那个牛的排泄物的味道水。","sentence_en":"For a while, I slept right next to the cowshed, smelling the manure."},{"id":"123","start":940.11,"end":944.49,"displayStart":940.11,"displayEnd":944.49,"displayMid":942.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.772598,"pitch":22.659193,"speechRate":5.463,"hasEvents":false,"sentence_source":"但是与此同时又你能感觉到那个牛一直在你的旁边吗。","sentence_en":"But at the same time, could you feel the cow always beside you?"},{"id":"124","start":944.49,"end":949.41,"displayStart":944.49,"displayEnd":949.41,"displayMid":946.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.7,"loudness":0.735588,"pitch":23.643087,"speechRate":4.682,"hasEvents":false,"sentence_source":"我们家的牛是母牛 很温柔、很温和 我特别喜欢母牛。","sentence_en":"Our cow was a gentle, mild female. I really liked her."},{"id":"125","start":949.87,"end":958.93,"displayStart":949.87,"displayEnd":958.93,"displayMid":954.4,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.991505,"pitch":27.952801,"speechRate":6.054,"hasEvents":false,"sentence_source":"因为我看你说一边写，就你小的时候没有自来水、没有公路，当然也没有医生 用电也很不方便，有时候会用没有灯 但你是90年生。","sentence_en":"Because from what you wrote, when you were little, there was no running water, no roads, no doctors, electricity was unreliable, sometimes no lights—but you were born in 1990."},{"id":"126","start":958.93,"end":964.53,"displayStart":958.93,"displayEnd":964.53,"displayMid":961.73,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.978774,"pitch":25.954876,"speechRate":5.571,"hasEvents":false,"sentence_source":"所以这一切其实发生在90年代至少中期之前，你生活的环境都是这样的。","sentence_en":"So all this happened at least before the mid-90s, that was your living environment."},{"id":"127","start":964.53,"end":977.85,"displayStar g, and he can drive too. It's beyond my imagination. I wonder where he learned to drive, and how I learned."},{"id":"135","start":1020.13,"end":1027.57,"displayStart":1020.13,"displayEnd":1027.57,"displayMid":1023.8499999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.973114,"pitch":25.214956,"speechRate":5.376,"hasEvents":false,"sentence_source":"他就是怎么学的开车，我是怎么学的开车，他用一个破面包车，甚至那个车都不是他的，他跟边界的。","sentence_en":"How he learned to drive? The same way I did. He used a beat-up minivan that wasn't even his—he borrowed it from a neighbor."},{"id":"136","start":1027.57,"end":1035.91,"displayStart":1027.57,"displayEnd":1035.91,"displayMid":1031.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.096807,"pitch":26.058727,"speechRate":4.576,"hasEvents":false,"sentence_source":"然后他就告诉我车的原理，这边是油门，这边是刹车，总之你轻轻踩油门，重重踩刹车就好了。","sentence_en":"Then he explained the basics: this is the gas, this is the brake. Just press the gas gently and brake hard."},{"id":"137","start":1035.91,"end":1051.35,"displayStart":1035.91,"displayEnd":1051.35,"displayMid":1043.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":0.990571,"pitch":24.269545,"speechRate":4.858,"hasEvents":false,"sentence_source":"然后他就坐在我的旁边，就这样教我，在那个山路上，我一回想，哇塞，老爹你到底在干什么，他也是这样学会了，他的朋友就跟他教我一样，这边是油门，这边是刹车，轻轻踩油门，重重踩刹车。","sentence_en":"Then he sat beside me and taught me like that on that mountain road. Looking back, I'm like, 'Dad, what were you doing?' And he learned the same way—his friend taught him just like he taught me: gas here, brake here, gently on gas, hard on brake."},{"id":"138","start":1051.35,"end":1052.93,"displayStart":1051.35,"displ d Language Learning","sentiment_en":"Neutral","score":0,"loudness":0.85461,"pitch":18.899889,"speechRate":4.513,"hasEvents":false,"sentence_source":"然后我们又再继续走，走到我肚子饿了，我爸给我买了一个包子，差不多是一点多，才去到能看耳朵的地方，就他有那个设备，可以伸进去看耳朵里到底有什么。","sentence_en":"Then we kept walking until I got hungry. My dad bought me a steamed bun. Around one o'clock, we finally reached a place that could examine ears with a device."},{"id":"159","start":1183.25,"end":1185.79,"displayStart":1183.25,"displayEnd":1185.79,"displayMid":1184.52,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.000356,"pitch":23.323599,"speechRate":3.937,"hasEvents":false,"sentence_source":"我的时间的概念很混乱。","sentence_en":"My sense of time is very confused."},{"id":"160","start":1185.79,"end":1187.97,"displayStart":1185.79,"displayEnd":1187.97,"displayMid":1186.88,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.818284,"pitch":22.301228,"speechRate":4.587,"hasEvents":false,"sentence_source":"所以我就总是会回忆到。","sentence_en":"So I always recall things."},{"id":"161","start":1187.97,"end":1193.73,"displayStart":1187.97,"displayEnd":1193.73,"displayMid":1190.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.906991,"pitch":27.388193,"speechRate":5.357,"hasEvents":false,"sentence_source":"时候发生了什么事件，来进行时间的毛点，这个问题我到现在都没有克服。","sentence_en":"I use events as anchors for time, but I still haven't overcome this issue."},{"id":"162","start":1193.73,"end":1199.23,"displayStart":1193.73,"displayEnd":1199.23,"displayMid":1196.48,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psycho ou think dark skin is trendy these days?"},{"id":"189","start":1369.27,"end":1379.45,"displayStart":1369.27,"displayEnd":1379.45,"displayMid":1374.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.838567,"pitch":25.605438,"speechRate":4.741,"hasEvents":false,"sentence_source":"我不知道，我就是觉得访下书啊什么的，忽在脸上不太舒服，我就完全不弄这个，就八月份我把做手术我回去了一趟嘛。","sentence_en":"I don't know. I just feel like putting on sunscreen or whatever on my face is uncomfortable, so I don't do it at all. In August I went back for my surgery."},{"id":"190","start":1379.45,"end":1385.81,"displayStart":1379.45,"displayEnd":1385.81,"displayMid":1382.63,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.052974,"pitch":25.565685,"speechRate":4.491,"hasEvents":false,"sentence_source":"一下飞机我说哇塞我好黑啊，人群中国最黑还是能留意到这种区别。","sentence_en":"As soon as I got off the plane, I said, 'Wow, I'm so dark.' Even among the crowd in China, I'm the darkest, and I can still notice the difference."},{"id":"191","start":1385.81,"end":1389.73,"displayStart":1385.81,"displayEnd":1389.73,"displayMid":1387.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.9608,"pitch":26.795578,"speechRate":5.626,"hasEvents":false,"sentence_source":"但是真正在成长过程中不太会去在意这个事情。","sentence_en":"But during the actual growing up, I didn't really care about it."},{"id":"192","start":1390.21,"end":1392.49,"displayStart":1390.21,"displayEnd":1392.49,"displayMid":1391.35,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.023317,"pitch":29.964752,"speechRate":6.147,"hasEvents":false,"sentence_source":"你知道小孩却在成长过程当中。","sentence_en":"You know, children during their growth—"},{"id":"193","start":1392.49,"end":1404.49,"displayStart":1392.49,"displayEnd":1404.49,"displayMid":1398.49,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.867436,"pitch":24.026224,"speechRate":4.764,"hasEvents":false,"sentence_source":"对于生活环境的好与坏，所谓的平或富 它其实没有任何的概念，只要让我始终生活在这个环境里，只要没有对比 我其实没有任何的感觉。","sentence_en":"They have no concept of good or bad living conditions, so-called poor or rich. As long as I always lived in that environment, without comparison, I actually had no feelings at all."},{"id":"194","start":1405.05,"end":1410.15,"displayStart":1405.05,"displayEnd":1410.15,"displayMid":1407.6,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.168234,"pitch":29.348867,"speechRate":5.69,"hasEvents":false,"sentence_source":"但是小孩是缠的 那小孩的缠在你成长过程当中能够得到满足吗。","sentence_en":"But kids get cravings. Can those cravings be satisfied during your growth?"},{"id":"195","start":1410.15,"end":1425.85,"displayStart":1410.15,"displayEnd":1425.85,"displayMid":1418,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.2,"loudness":1.022115,"pitch":24.892914,"speechRate":4.54,"hasEvents":false,"sentence_source":"不能 缠呀 想吃东西，没去汉族学校的时候 感觉还好，反正你缠嘛 你缠你就缠 你见过的东西，你不会去缠没见过的东西 你最多就是缠一点，隔壁邻居家的桃子呀、梨呀什么的。","sentence_en":"No, I craved! I wanted food. Before I went to Han school, it felt okay. Anyway, you crave, you just crave for things you've seen. You won't crave for things you've never seen. At most, you'd crave a little bit for the neighbor's peaches or pears."},{"id":"196","start":1425.85,"end":1435.19,"displayStart":1425.85,"displayEnd":1435.19,"displayMid":1430.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":1.061753,"pitch":26.456703,"speechRate":5.034,"hasEvents":false,"sentence_source":"馋大米饭 我很爱吃大米饭 到现在都是因为我们那会儿还要浇工粮，你好不容易种出来的骨子只够浇工粮的。","sentence_en":"I craved steamed rice. I love steamed rice, still do, because back then we had to contribute grain as tax. The rice we worked so hard to grow was barely enough to pay the tax."},{"id":"197","start":1435.19,"end":1441.25,"displayStart":1435.19,"displayEnd":1441.25,"displayMid":1438.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.2,"loudness":0.911861,"pitch":22.718918,"speechRate":4.561,"hasEvents":false,"sentence_source":"所以你的大米是没有纯粹的大米饭吃 你得跟别的东西混在一起。","sentence_en":"So your rice isn't just plain rice; you have to mix it with other things."},{"id":"198","start":1441.25,"end":1455.73,"displayStart":1441.25,"displayEnd":1455.73,"displayMid":1448.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.949365,"pitch":25.088873,"speechRate":4.396,"hasEvents":true,"sentence_source":"所以我觉得特别渴望只有大米的米饭，感觉一天到晚一睁眼睛就是想吃东西，去了汉族学校以后 哎呀完蛋了，什么吃的都有 人家都是去买那个大辣片。","sentence_en":"So I really craved plain rice; I felt like eating all day long. After going to a Han school, oh no, there was all kinds of food, everyone went to buy those spicy gluten sheets."},{"id":"199","start":1456.29,"end":1470.61,"displayStart":1456.29,"displayEnd":1470.61,"displayMid":1463.4499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.935511,"pitch":23.119801,"speechRate":4.189,"hasEvents":true,"sentence_source":"还有什么麻辣土豆片 肉包子油条，哇 铲呀 每天睁开眼睛就是铲，啥也吃不上 就是忍着，有回我姐剪了两毛钱，终于说买个肉包子 我们俩分享一下。","sentence_en":"Also spicy potato chips, meat buns, fried dough sticks. Wow, every day I'd wake up and just scavenge, but couldn't get anything to eat, just endured. Once my sister cut out two cents from her money, and finally said let's buy a meat bun and share it."},{"id":"200","start":1470.61,"end":1474.49,"displayStart":1470.61,"displayEnd":1474.49,"displayMid":1472.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.976263,"pitch":23.913849,"speechRate":4.897,"hasEvents":false,"sentence_source":"然后就跟电视里演的是的，太激动了 掉地上了。","sentence_en":"Then just like in TV shows, we were so excited it dropped on the ground."},{"id":"201","start":1474.49,"end":1485.35,"displayStart":1474.49,"displayEnd":1485.35,"displayMid":1479.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.971244,"pitch":25.49386,"speechRate":5.14,"hasEvents":false,"sentence_source":"我们两个看着那个肉包子就在想，到底剪还是不剪 剪还是不剪，最终缠战胜了一切 然后就捡起来，快速地搬成两半 一人塞一半进嘴里。","sentence_en":"We both stared at the meat bun, thinking, should we pick it up or not? In the end, hunger won, so we picked it up, quickly tore it in half, and each stuffed half into our mouths."},{"id":"202","start":1485.35,"end":1490.65,"displayStart":1485.35,"displayEnd":1490.65,"displayMid":1488,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.938459,"pitch":21.800518,"speechRate":4.717,"hasEvents":false,"sentence_source":"然后就回校失去了，第一次吃上肉包子 结果里面有葱 真难吃。","sentence_en":"Then we went back to school, first time eating a meat bun, but it had green onions in it, really tasted bad."},{"id":"203","start":1490.65,"end":1497.69,"displayStart":1490.65,"displayEnd":1497.69,"displayMid":1494.17,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.039122,"pitch":23.455616,"speechRate":5.833,"hasEvents":false,"sentence_source":"因为我小时候 你像我是70年代，70年代的好处在于 中国人还没有富起来，大家都差不多。","sentence_en":"Because when I was a kid, I'm from the 70s. The good thing about the 70s was that Chinese people hadn't gotten rich yet, everyone was more or less the same."},{"id":"204","start":1497.69,"end":1511.35,"displayStart":1497.69,"displayEnd":1511.35,"displayMid":1504.52,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.908731,"pitch":22.755436,"speechRate":5.49,"hasEvents":false,"sentence_source":"所以没有什么特别贫穷和富裕的感受，当然因为当时我生活在上海和北京大城市，肯定比当时的中国农村要好很多，但我只在城市里面 大家其实也都差不多，我唯一有印象的是上海。","sentence_en":"So I didn't have strong feelings about poverty or wealth. Of course, I lived in big cities like Shanghai and Beijing, which were much better than rural China at the time, but within the city, everyone was similar. The only thing I remember is Shanghai."},{"id":"205","start":1511.35,"end":1518.29,"displayStart":1511.35,"displayEnd":1518.29,"displayMid":1514.82,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.913149,"pitch":23.650232,"speechRate":4.966,"hasEvents":false,"sentence_source":"因为从上海他那个时期开始 上海是会分成有钱人住的地方和没钱人住的地方。","sentence_en":"Because starting from that period, Shanghai was divided into places where rich people lived and places where poor people lived."},{"id":"206","start":1518.29,"end":1526.25,"displayStart":1518.29,"displayEnd":1526.25,"displayMid":1522.27,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.944099,"pitch":25.720175,"speechRate":4.488,"hasEvents":false,"sentence_source":"所以小孩你又隐约感到 这个世界还是会是有人穷有人富的，你莫名的会向往有钱。","sentence_en":"So as a child, you vaguely sense that some people are poor and some are rich, and you inexplicably yearn for wealth."},{"id":"207","start":1526.25,"end":1536.29,"displayStart":1526.25,"displayEnd":1536.29,"displayMid":1531.27,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.003051,"pitch":25.909197,"speechRate":5.959,"hasEvents":false,"sentence_source":"那我不知道对于你来说 当你进到县城或者到更大地方去上学，能够感受到物质丰富的世界是怎样的时候，你对于这个贫富你有什么感受。","sentence_en":"For you, when you went to the county seat or bigger places for school and experienced a materially rich world, what were your feelings about wealth and poverty?"},{"id":"208","start":1536.29,"end":1544.35,"displayStart":1536.29,"displayEnd":1544.35,"displayMid":1540.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.77703,"pitch":23.5354,"speechRate":4.808,"hasEvents":false,"sentence_source":"第一反应就是不公平，就是为什么，凭什么说别人可以过这样的日子，我没在过这样的日子。","sentence_en":"My first reaction was unfairness. Why? Why could others live that kind of life while I couldn't?"},{"id":"209","start":1544.35,"end":1546.69,"displayStart":1544.35,"displayEnd":1546.69,"displayMid":1545.52,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.150496,"pitch":26.946911,"speechRate":5.66,"hasEvents":false,"sentence_source":"那咱们不是都是一个线的吗。","sentence_en":"Aren't we all the same?"},{"id":"210","start":1547.23,"end":1549.87,"displayStart":1547.23,"displayEnd":1549.87,"displayMid":1548.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.01115,"pitch":27.114975,"speechRate":3.409,"hasEvents":false,"sentence_source":"就是因为出生的原因。","sentence_en":"Just because of where I was born."},{"id":"211","start":1549.87,"end":1564.33,"displayStart":1549.87,"displayEnd":1564.33,"displayMid":1557.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Strongly Negative","score":-0.7,"loudness":0.792629,"pitch":19.805878,"speechRate":4.357,"hasEvents":false,"sentence_source":"我们之间就这么这么大的差距，很不公平，非常想不通，有过很长很长的时间，十几年吧都在想，下一个念头就是，我也要过这样的日子 我也要过这样的生活。","sentence_en":"Such a huge gap between us, so unfair, I couldn't understand for a very long time, maybe over ten years. Then my next thought was, I want to live that kind of life too."},{"id":"212","start":1564.33,"end":1575.01,"displayStart":1564.33,"displayEnd":1575.01,"displayMid":1569.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.928047,"pitch":21.238497,"speechRate":3.797,"hasEvents":false,"sentence_source":"我也想要冬天可以穿羽绒服 想吃什么可以去吃，尤其是第一次谈恋爱了以后 带男朋友回村里嘛。","sentence_en":"I also wanted to wear a down jacket in winter and eat whatever I wanted. Especially after my first relationship, I brought my boyfriend back to my village."},{"id":"213","start":1575.01,"end":1589.79,"displayStart":1575.01,"displayEnd":1589.79,"displayMid":1582.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.887357,"pitch":23.230553,"speechRate":5.218,"hasEvents":false,"sentence_source":"因为郭忠秋姐她说的是想到你们老家去玩一下，我完全不知道这是什么概念 第一次谈恋爱，我就说 哎行她去我们老家玩很欢迎你，我就跟家里人说了这个事情，他们也很认真的准备了。","sentence_en":"Because Sister Guo Zhongqiu said she wanted to visit my hometown. I had no idea what that meant, first relationship, so I said, sure, you're welcome to visit my hometown. I told my family, and they prepared very seriously."},{"id":"214","start":1589.79,"end":1592.63,"displayStart":1589.79,"displayEnd":1592.63,"displayMid":1591.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.831059,"pitch":25.618797,"speechRate":5.128,"hasEvents":false,"sentence_source":"把家里面最新的什么床单啊什么。","sentence_en":"They put out the newest sheets and things."},{"id":"215","start":1592.63,"end":1595.35,"displayStart":1592.63,"displayEnd":1595.35,"displayMid":1593.99,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.676481,"pitch":18.996296,"speechRate":5.169,"hasEvents":false,"sentence_source":"我们都没用过的给它铺上之类。","sentence_en":"Even ones we hadn't used, they laid them out."},{"id":"216","start":1595.35,"end":1604.93,"displayStart":1595.35,"displayEnd":1604.93,"displayMid":1600.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":1.021301,"pitch":27.133801,"speechRate":3.806,"hasEvents":false,"sentence_source":"结果它开车开到半道上，脸色越来越凝重，整个人越来越沉默，我就心想 哎呀 完了 黄了。","sentence_en":"But as we drove, her face grew more and more solemn, she became quieter, and I thought, oh no, it's over."},{"id":"217","start":1604.93,"end":1606.63,"displayStart":1604.93,"displayEnd":1606.63,"displayMid":1605.7800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.161332,"pitch":32.638451,"speechRate":5.694,"hasEvents":false,"sentence_source":"然后去到寨子里头。","sentence_en":"Then we arrived at the village."},{"id":"218","start":1606.63,"end":1619.31,"displayStart":1606.63,"displayEnd":1619.31,"displayMid":1612.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.889419,"pitch":18.646282,"speechRate":5.085,"hasEvents":false,"sentence_source":"对于大家的欢迎，它也是一个很抗拒的一个状态，我就特别后悔，我就说 为什么要带这个什么都不知道的人，来到寨子里面来伤害我的父母来伤害我的族人。","sentence_en":"It was also very resistant to everyone's welcome. I deeply regretted it and said, why did I bring this person who knows nothing into the village to hurt my parents and my people?"},{"id":"219","start":1619.31,"end":1633.45,"displayStart":1619.31,"displayEnd":1633.45,"displayMid":1626.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.893125,"pitch":21.230629,"speechRate":4.588,"hasEvents":false,"sentence_source":"当时非常的伤心 也还是觉得 凭什么呀，我又没有说我是一个坏人，我也没有坑蒙拐骗，我从来不说谎话 为什么呢，就是为什么要让我来面对这样的一个情况。","sentence_en":"I was very sad and still thought, why? I'm not a bad person, I don't cheat or lie, I never lie. Why do I have to face this situation?"},{"id":"220","start":1633.45,"end":1636.09,"displayStart":1633.45,"displayEnd":1636.09,"displayMid":1634.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.629235,"pitch":15.626,"speechRate":6.061,"hasEvents":false,"sentence_source":"那别人为什么就不 Name":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":0.927804,"pitch":21.288927,"speechRate":4.726,"hasEvents":false,"sentence_source":"然后我爸他不知道什么是惊恐障碍，他就上抖音搜索了一下，他说 那是不是意味着我们感到害怕的东西，你是比我们比如说大十倍的恐惧、大十倍的害怕，我说你可以这样理解。","sentence_en":"Then my dad didn't know what panic disorder was, so he looked it up on Douyin. He said, 'Does that mean what we're afraid of, you feel ten times more fear than we do?' I said you could see it that way."},{"id":"264","start":1938.61,"end":1943.03,"displayStart":1938.61,"displayEnd":1943.03,"displayMid":1940.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.77786,"pitch":17.895334,"speechRate":5.11,"hasEvents":false,"sentence_source":"然后他对时他就很难过，他就说爸爸觉得很对不起你。","sentence_en":"And then he was really sad, and he said, 'Dad feels so sorry for you."},{"id":"265","start":1943.03,"end":1954.57,"displayStart":1943.03,"displayEnd":1954.57,"displayMid":1948.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.800991,"pitch":18.868446,"speechRate":4.806,"hasEvents":false,"sentence_source":"因为当你跟我说你很害怕挖泪、缠处这类的时候，爸爸就轻轻的这样就放过去了，而没有跟着你一起来探究这个问题来解决这个问题。","sentence_en":"Because when you told me you were scared of things like crying and being trapped, I just brushed it off instead of exploring the issue with you and solving it."},{"id":"266","start":1954.57,"end":1960.75,"displayStart":1954.57,"displayEnd":1960.75,"displayMid":1957.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Positive","score":0.7,"loudness":0.97948,"pitch":19.944681,"speechRate":5.133,"hasEvents":false,"sentence_source":"然后我就想 哇塞 我爸已经六十多岁了，他会去这样的思考已经很好了。","sentence_en":"And then I thought, wow, my dad is already in his sixties, and he can think like that. That's great."},{"id":"267","start":1961.53,"end":1965.57,"displayStart":1961.53,"displayEnd":1965.57,"displayMid":1963.55,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.78432,"pitch":24.086035,"speechRate":4.509,"hasEvents":false,"sentence_source":"你爸妈也都能够听懂汉话，也都会讲汉话。","sentence_en":"Your parents can understand Mandarin and speak it too."},{"id":"268","start":1965.57,"end":1974.63,"displayStart":1965.57,"displayEnd":1974.63,"displayMid":1970.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.897967,"pitch":21.49473,"speechRate":4.797,"hasEvents":false,"sentence_source":"我妈妈有一点困难，她也不是说听不懂吧，她就是很难理解比较复杂的东西，就能用一话来给她去描述。","sentence_en":"My mom has a bit of trouble. It's not that she can't understand, but she has difficulty with complex things. I can describe it to her in simple terms."},{"id":"269","start":1974.63,"end":1981.81,"displayStart":1974.63,"displayEnd":1981.81,"displayMid":1978.22,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.988385,"pitch":26.302065,"speechRate":5.5,"hasEvents":false,"sentence_source":"我小时候对于遗族最多的了解就是接近遗族，就是小时候看电影叫阿诗玛你有看过吗。","sentence_en":"As a child, my understanding of the Yi people mostly came from the movie Ashima. Have you seen it?"},{"id":"270","start":1981.81,"end":1988.09,"displayStart":1981.81,"displayEnd":1988.09,"displayMid":1984.9499999999998,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.061651,"pitch":26.115042,"speechRate":4.617,"hasEvents":false,"sentence_source":"嗯，阿诗玛其实是萨尼族，但后来我查薩尼族是属于遗族的一个分支。","sentence_en":"Well, Ashima is actually Sani, but later I found out Sani is a branch of the Yi."},{"id":"271","start":1988.09,"end":1993.67,"displayStart":1988.09,"displayEnd":1993.67,"displayMid":1990.88,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.007631,"pitch":25.497282,"speechRate":5.197,"hasEvents":false,"sentence_source":"所以也是算是遗族的，阿诗玛是我对于遗族好像是唯一的全部的了解。","sentence_en":"So it's still considered Yi. Ashima was pretty much my only and complete understanding of the Yi."},{"id":"272","start":1993.67,"end":2000.47,"displayStart":1993.67,"displayEnd":2000.47,"displayMid":1997.0700000000002,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.6,"loudness":1.062021,"pitch":26.536863,"speechRate":5.14,"hasEvents":false,"sentence_source":"因为在电影里面阿诗玛太漂亮了，她喜欢的小黑哥也很帅，而且风景那么的迷人。","sentence_en":"Because in the movie, Ashima was so beautiful, the guy she liked, Little Black Brother, was also handsome, and the scenery was so enchanting."},{"id":"273","start":2000.47,"end":2012.87,"displayStart":2000.47,"displayEnd":2012.87,"displayMid":2006.67,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.924258,"pitch":25.265957,"speechRate":4.525,"hasEvents":false,"sentence_source":"所以从小我们看待比如说遗族，或者中国很多少数民族生活是完全把它浪漫化，想象的无比之美好，就所有的地方都山青水秀、智南美女。","sentence_en":"So from a young age, we romanticized the Yi and many other ethnic minorities in China, imagining their lives as incredibly beautiful, with green mountains and clear waters, and handsome men and beautiful women everywhere."},{"id":"274","start":2012.87,"end":2017.11,"displayStart":2012.87,"displayEnd":2017.11,"displayMid":2014.9899999999998,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.4,"loudness":1.001778,"pitch":24.800999,"speechRate":5.44,"hasEvents":true,"sentence_source":"生活当中不用讲话都彼此唱山歌来对山歌那种的。","sentence_en":"In daily life, they don't need to talk; they just sing mountain songs to each other."},{"id":"275","start":2017.83,"end":2022.13,"displayStart":2017.83,"displayEnd":2022.13,"displayMid":2019.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.13533,"pitch":30.062824,"speechRate":4.932,"hasEvents":true,"sentence_source":"对 城市人对农村就是会有一种田园目割的想象。","sentence_en":"Right, city people tend to have a pastoral fantasy about the countryside."},{"id":"276","start":2022.35,"end":2036.69,"displayStart":2022.35,"displayEnd":2036.69,"displayMid":2029.52,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Negative","score":-0.5,"loudness":0.923967,"pitch":24.964317,"speechRate":5.505,"hasEvents":false,"sentence_source":"总觉得之所以我在城市里面生活如此之不自由，压力这么大、这么焦虑，就是因为我没有一个田园可以归隐，一旦我能够归隐田园能够到山区里面，我也能够一切从此世界就是充满爱与和平。","sentence_en":"They always think that the reason they're so unfree, stressed, and anxious in the city is because they don't have a pastoral retreat. Once they can retreat to the countryside, the world will be full of love and peace."},{"id":"277","start":2037.21,"end":2040.71,"displayStart":2037.21,"displayEnd":2040.71,"displayMid":2038.96,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.899034,"pitch":26.506643,"speechRate":5.596,"hasEvents":false,"sentence_source":"就人总是会对远方充满完全不切实际的想象。","sentence_en":"People always have completely unrealistic imaginations about faraway places."},{"id":"278","start":2040.71,"end":2050.05,"displayStart":2040.71,"displayEnd":2050.05,"displayMid":2045.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Negative","score":-0.4,"loudness":1.101477,"pitch":28.750292,"speechRate":4.571,"hasEvents":false,"sentence_source":"结果到了田园以后发现种菜又先堆粉肥，闻到鸡肥的那一刻就投回了蠢事，这是我对蠢事人的想象。","sentence_en":"But when they arrive at the countryside, they find they have to pile up compost first, and the moment they smell chicken manure, they realize their foolishness—that's how I imagine foolish people."},{"id":"279","start":2050.05,"end":2052.51,"displayStart":2050.05,"displayEnd":2052.51,"displayMid":2051.28,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":1.03943,"pitch":25.381395,"speechRate":5.882,"hasEvents":false,"sentence_source":"真的 就是我们想象浪漫的远方。","sentence_en":"Really, it's just the romantic faraway places we imagine."},{"id":"280","start":2052.51,"end":2066.93,"displayStart":2052.51,"displayEnd":2066.93,"displayMid":2059.7200000000003,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":0.891209,"pitch":24.016182,"speechRate":5.132,"hasEvents":false,"sentence_source":"其实就是你小时候非常真实的其实很艰难的生活，还好就你在成长过程当中，你只是你真实的度过了一天天艰难，但你自己意识不到那是艰难，这算是一种是个Blessing。","sentence_en":"It's actually the very real, difficult life you had as a child. Fortunately, as you grew up, you just lived through those hard days without realizing they were hard—that's a kind of blessing."},{"id":"281","start":2066.93,"end":2072.65,"displayStart":2066.93,"displayEnd":2072.65,"displayMid":2069.79,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Positive","score":0.5,"loudness":0.98717,"pitch":24.204866,"speechRate":6.089,"hasEvents":false,"sentence_source":"对孩子来说其实有时候不知道、不了解，真正是保护了这个孩子反，而是一种保护。","sentence_en":"For a child, sometimes not knowing or understanding actually protects them—it's a form of protection."},{"id":"282","start":2072.65,"end":2087.51,"displayStart":2072.65,"displayEnd":2087.51,"displayMid":2080.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.901335,"pitch":24.392092,"speechRate":5.107,"hasEvents":false,"sentence_source":"因为在最需要纯真的那几年里面，你就是真的在过一种很纯真的生活，也没有任何比较，也没有学业上的压力，你就只要唯一有个目标，就是活下去就可以了，你只要活着不要死就行了。","sentence_en":"Because during those years when innocence is most needed, you were truly living an innocent life, without any comparisons or academic pressure. Your only goal was to survive—just stay alive."},{"id":"283","start":2088.1,"end":2097.54,"displayStart":2088.1,"displayEnd":2097.54,"displayMid":2092.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.6,"loudness":1.009633,"pitch":27.404188,"speechRate":5.376,"hasEvents":false,"sentence_source":"做小孩那段时间，我是真的觉得很快乐，哪怕我现在回忆起来说，有那么多的疼痛啊，真正字面意义上的疼痛，这儿摔断了。","sentence_en":"When I was a child, I really felt happy. Even though I now recall so much pain—literal, physical pain—like breaking something here."},{"id":"284","start":2097.54,"end":2102.96,"displayStart":2097.54,"displayEnd":2102.96,"displayMid":2100.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.877747,"pitch":21.127995,"speechRate":4.567,"hasEvents":false,"sentence_source":"那儿摔破了的疼痛，吃饭的短缺呀 冬天没有暖和的衣服穿。","sentence_en":"Pain from falls there, food shortages, no warm clothes in winter."},{"id":"285","start":2102.96,"end":2115.28,"displayStart":2102.96,"displayEnd":2115.28,"displayMid":2109.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.6,"loudness":0.955399,"pitch":22.964291,"speechRate":4.182,"hasEvents":false,"sentence_source":"但是你回去起来那段时间不会去想到这些生活的苦的困的东西，你想到的日很快乐很幸福的事情 想到的都是牛啊马呀。","sentence_en":"But when you look back, you don't think about those hardships; you think about happy, joyful things—like cows and horses."},{"id":"286","start":2115.28,"end":2127.08,"displayStart":2115.28,"displayEnd":2127.08,"displayMid":2121.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.91982,"pitch":24.923218,"speechRate":4.153,"hasEvents":false,"sentence_source":"那会我们家附近很多刺猬的 刺猬红鼠狼，我曾经揪住过一只小小的小 就是我跟我爸爸去山里面的时候遇到的一只小。","sentence_en":"Back then, there were many hedgehogs and weasels near our home. I once caught a tiny one—when I went into the mountains with my dad, I encountered a small one."},{"id":"287","start":2127.08,"end":2131.74,"displayStart":2127.08,"displayEnd":2131.74,"displayMid":2129.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.036641,"pitch":23.214027,"speechRate":5.18,"hasEvents":false,"sentence_source":"然后他是翅膀受伤，他就落在地上了，失去了补食的能力。","sentence_en":"It had a wing injury, so it fell to the ground and lost its ability to hunt."},{"id":"288","start":2131.74,"end":2147.44,"displayStart":2131.74,"displayEnd":2147.44,"displayMid":2139.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.97743,"pitch":23.64983,"speechRate":4.426,"hasEvents":false,"sentence_source":"我们给他带回家以后，为他包扎伤口，为他吃东西，他什么都不吃，他就光吃那个水煮土豆，给他弄成土豆泥，吃完以后他就在屋里只挖乱角，就很像一个烟嗓的男人在说话。","sentence_en":"After we brought him home, we bandaged his wounds and tried to feed him, but he wouldn't eat anything except boiled potatoes mashed into a puree. After eating, he would just scratch around the room, sounding like a man with a smoker's voice."},{"id":"289","start":2147.44,"end":2161.14,"displayStart":2147.44,"displayEnd":2161.14,"displayMid":2154.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.000845,"pitch":24.444281,"speechRate":4.613,"hasEvents":false,"sentence_source":"然后给他救好了以后，把他放飞的那天，他就是站在我的手臂上，他要飞，他就双脚一蹬飞走了，好吧 给我留下一个疤 它把我的手肉给抓穿了一个贯穿伤。","sentence_en":"After I healed it, on the day I set it free, it stood on my arm, ready to fly. It pushed off with its feet and flew away—well, it left me a scar. It pierced my flesh, a through-and-through wound."},{"id":"290","start":2161.14,"end":2167.8,"displayStart":2161.14,"displayEnd":2167.8,"displayMid":2164.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.02916,"pitch":29.441917,"speechRate":4.956,"hasEvents":true,"sentence_source":"到现在还有疤 我心想啊 你这家伙怎么回事 我好心好意救你 你给我留个疤。","sentence_en":"I still have the scar. I thought, 'What's the matter with you? I kindly saved you, and you leave me a scar."},{"id":"291","start":2167.8,"end":2181.1,"displayStart":2167.8,"displayEnd":2181.1,"displayMid":2174.45,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.995872,"pitch":27.013796,"speechRate":4.666,"hasEvents":true,"sentence_source":"天呐 小扎 你看你随便说了几个伤，放在我们日常的生活环境里面 都是父母简直要死的那种，真的 生活场景真的太不同了 人生真的是太不同了。","sentence_en":"Oh my, little Zha, you casually mention a few injuries—in our daily life environment, parents would be devastated. Truly, living situations are so different, lives are so different."},{"id":"292","start":2181.1,"end":2187.86,"displayStart":2181.1,"displayEnd":2187.86,"displayMid":2184.48,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.963961,"pitch":24.190039,"speechRate":5.201,"hasEvents":false,"sentence_source":"人出生在什么样的环境里面 完全就是一个偶然，命运的开始是如此之天差地别。","sentence_en":"What environment a person is born into is completely random. The starting point of fate is so vastly different."},{"id":"293","start":2187.86,"end":2196,"displayStart":2187.86,"displayEnd":2196,"displayMid":2191.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.946901,"pitch":24.527308,"speechRate":4.906,"hasEvents":false,"sentence_source":"对呀 就莫名其妙你就生长在这个地方，最残忍的是你得去到别的地方去跟别人见面，这是最残。","sentence_en":"Yes, you just inexplicably grow up in this place. The cruelest part is that you have to go elsewhere to meet others—that's the cruelest."},{"id":"294","start":2196,"end":2208.79,"displayStart":2196,"displayEnd":2208.79,"displayMid":2202.395,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.5,"loudness":0.819257,"pitch":22.778221,"speechRate":5.571,"hasEvents":false,"sentence_source":"忍的地方，但我还是会为你高兴，虽然你中间经历过一段时间，就是因为你走到了一个新的环境里面，有了比较有比较带来的痛苦，这段时间这种成长的振痛我觉得它很艰难。","sentence_en":"But I'm still happy for you. Even though you went through a period—because you entered a new environment and had comparisons—comparisons brought pain. This growing pain during that time was very difficult."},{"id":"295","start":2208.79,"end":2222.23,"displayStart":2208.79,"displayEnd":2222.23,"displayMid":2215.51,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.7,"loudness":0.852835,"pitch":23.870184,"speechRate":5.432,"hasEvents":false,"sentence_source":"但是因为你度过这个艰难以后，你在不同的生活场景里面 你有了很丰富的体验，你能够看到更多的世界 我认为是值得的，我总觉得一个人应该能够看到更广的天 更宽的天空。","sentence_en":"But because you got through that difficulty, you've gained rich experiences in different life settings, and you can see more of the world. I think it's worth it. I always feel a person should be able to see a broader sky."},{"id":"296","start":2222.23,"end":2224.51,"displayStart":2222.23,"displayEnd":2224.51,"displayMid":2223.37,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.6,"loudness":0.838456,"pitch":21.095865,"speechRate":5.263,"hasEvents":false,"sentence_source":"我觉得人应该有这样的自由。","sentence_en":"I think people should have this freedom."},{"id":"297","start":2224.51,"end":2227.77,"displayStart":2224.51,"displayEnd":2227.77,"displayMid":2226.1400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.615561,"pitch":20.685062,"speechRate":5.828,"hasEvents":false,"sentence_source":"现在甚至都不去想说他值不值得这个事情就。","sentence_en":"Now I don't even think about whether it's worth it anymore."},{"id":"298","start":2227.77,"end":2229.01,"displayStart":2227.77,"displayEnd":2229.01,"displayMid":2228.3900000000003,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illne "hasEvents":false,"sentence_source":"你知道小渣有时候语言和文字还真的很不一样，我看你这本书我是债子一长大的女孩，但和你此刻跟我讲我被冲击到那种状态完全不同，我读的时候是很平静的。","sentence_en":"You know, Xiaozha, spoken language and written words are really different. When I read your book 'I Am a Girl Who Grew Up with Debt', I was calm. But hearing you talk now, I'm struck—it's a completely different state."},{"id":"303","start":2256.53,"end":2263.43,"displayStart":2256.53,"displayEnd":2263.43,"displayMid":2259.98,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.040324,"pitch":27.020166,"speechRate":5.259,"hasEvents":false,"sentence_source":"我都不认为是个很大的事，但当你刚才跟我讲苗树的骨子在你的耳朵里面发芽长大。","sentence_en":"I didn't think it was a big deal, but when you just told me about the seedling's seed sprouting and growing in your ear."},{"id":"304","start":2263.43,"end":2277.71,"displayStart":2263.43,"displayEnd":2277.71,"displayMid":2270.5699999999997,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.952075,"pitch":25.625673,"speechRate":4.703,"hasEvents":false,"sentence_source":"然后那个削把你胳膊上的肉带走造成贯穿伤，我才发现你的生活远比我在文字里读到的惊险的多，你要知道你书里面还有一些细节，还是我在采访里面看到的。","sentence_en":"That cut took the flesh off your arm and caused a penetrating wound. That's when I realized your life was far more thrilling than what I'd read in your writing. You know, there are details in your book that I only saw in interviews."},{"id":"305","start":2277.71,"end":2280.93,"displayStart":2277.71,"displayEnd":2280.93,"displayMid":2279.3199999999997,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.897343,"pitch":25.31093,"speechRate":5.892,"hasEvents":false,"sentence_source":"你就提到一句说你爷爷他其实是自杀死的。","sentence_en":"You only mentioned one line: that your grandfather actually died by suicide."},{"id":"306","start":2280.93,"end":2283.35,"displayStart":2280.93,"displayEnd":2283.35,"displayMid":2282.14,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.812122,"pitch":22.088524,"speechRate":5.858,"hasEvents":false,"sentence_source":"是的，就这几个字我就被震撼到了。","sentence_en":"Yes, just those few words shook me."},{"id":"307","start":2283.35,"end":2292.05,"displayStart":2283.35,"displayEnd":2292.05,"displayMid":2287.7,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.878021,"pitch":26.691717,"speechRate":4.565,"hasEvents":false,"sentence_source":"因为我们很少会去关注到，比如说农村、山村里面老人的自杀的比率，后来我知道他也不低的。","sentence_en":"Because we rarely pay attention to, for example, the suicide rate among the elderly in rural and mountain villages. Later I learned it's not low."},{"id":"308","start":2292.05,"end":2297.51,"displayStart":2292.05,"displayEnd":2297.51,"displayMid":2294.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.826058,"pitch":25.137718,"speechRate":4.396,"hasEvents":false,"sentence_source":"很多老人到了七八十岁，他就自己就到山上去上调了天呐。","sentence_en":"Many elderly people, when they reach seventy or eighty, go up to the mountains and hang themselves. Oh my god."},{"id":"309","start":2297.51,"end":2312.11,"displayStart":2297.51,"displayEnd":2312.11,"displayMid":2304.8100000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.982713,"pitch":23.565388,"speechRate":4.726,"hasEvents":false,"sentence_source":"我们旁边有个汉族村子，我去汉族小学上课的时候会路过那个村子，他们有个习惯就是老人在哪里死的，他会要去那里弄一个仪式嘛，经常看到有人就到山上去搞仪式。","sentence_en":"There's a Han Chinese village nearby. When I went to teach at a Han elementary school, I would pass through that village. They have a custom: where an old person died, they hold a ritual there. I often saw people going up to the mountain to perform rituals."},{"id":"310","start":2312.11,"end":2314.63,"displayStart":2312.11,"displayEnd":2314.63,"displayMid":2313.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.930922,"pitch":18.152281,"speechRate":5.031,"hasEvents":false,"sentence_source":"就是老人是在山上去吊死的。","sentence_en":"That is, the old person had hanged themselves in the mountains."},{"id":"311","start":2314.63,"end":2319.61,"displayStart":2314.63,"displayEnd":2319.61,"displayMid":2317.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.076967,"pitch":26.441864,"speechRate":5.491,"hasEvents":false,"sentence_source":"然后我也因为留意到了这个事情嘛，我就去读了农民自杀研究。","sentence_en":"And because I noticed this, I went and read research on farmer suicides."},{"id":"312","start":2319.61,"end":2327.73,"displayStart":2319.61,"displayEnd":2327.73,"displayMid":2323.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.841672,"pitch":16.628498,"speechRate":3.941,"hasEvents":false,"sentence_source":"然后今年年初的时候写了一个小说，去探讨这个事情，就说老人自杀呀什么的。","sentence_en":"Then at the beginning of this year, I wrote a novel to explore this topic—elderly suicide and so on."},{"id":"313","start":2327.73,"end":2329.19,"displayStart":2327.73,"displayEnd":2329.19,"displayMid":2328.46,"sp  Growth","sentiment_en":"Neutral","score":0,"loudness":0.947213,"pitch":20.621981,"speechRate":5.083,"hasEvents":false,"sentence_source":"因为家里的条件很差 就是每一个小孩都很听话，我指的这个每一个小孩 不仅是我跟我姐姐，还有就是我的叔叔们，四叔叔 他想给家里多挣一点钱。","sentence_en":"Because the family conditions were very poor, every child was very obedient. By every child, I mean not just me and my sister, but also my uncles. Fourth Uncle wanted to earn more money for the family."},{"id":"325","start":2410.03,"end":2412.13,"displayStart":2410.03,"displayEnd":2412.13,"displayMid":2411.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.62094,"pitch":14.800728,"speechRate":5.238,"hasEvents":false,"sentence_source":"然后他就去跟别人去打工。","sentence_en":"So he went to work as a migrant laborer with others."},{"id":"326","start":2412.13,"end":2412.95,"displayStart":2412.13,"displayEnd":2412.95,"displayMid":2412.54,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.569509,"pitch":6.863016,"speechRate":2.614,"hasEvents":false,"sentence_source":"跑车。","sentence_en":"He drove a truck."},{"id":"327","start":2412.95,"end":2428.25,"displayStart":2412.95,"displayEnd":2428.25,"displayMid":2420.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.990843,"pitch":23.90732,"speechRate":4.721,"hasEvents":false,"sentence_source":"然后出车祸就去世了，我跟我姐我们俩放学走在回家里路上，人家说你们俩还在这呀，你叔叔都死了你们还不去看，他在镇上的卫生院里面，我姐就带着我几乎都不是走而是跑。","sentence_en":"Then he died in a car accident. My sister and I were walking home from school. Someone said, 'You two are still here? Your uncle is dead, why aren't you going to see him? He's at the town clinic.' My sister led me, and we were almost running, not walking."},{"id":"328","start":2428.25,"end":2435.79,"displayStart":2428.25,"displayEnd":2435.79,"displayMid":2432.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.824636,"pitch":15.960979,"speechRate":3.581,"hasEvents":false,"sentence_source":"跑到卫生院里面去看，看到我叔叔因为车祸嘛，他的肠子就留下来。","sentence_en":"We ran to the clinic and saw my uncle—because of the car accident, his intestines were spilling out."},{"id":"329","start":2435.79,"end":2437.07,"displayStart":2435.79,"displayEnd":2437.07,"displayMid":2436.4300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Neutral","score":0,"loudness":0.843044,"pitch":24.787592,"speechRate":5.858,"hasEvents":false,"sentence_source":"那个医生就在那。","sentence_en":"That doctor was right there."},{"id":"330","start":2437.07,"end":2438.81,"displayStart":2437.07,"displayEnd":2438.81,"displayMid":2437.94,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Negative","score":-0.5,"loudness":0.81584,"pitch":17.825863,"speechRate":5.172,"hasEvents":false,"sentence_source":"里做一些无畏的抢救。","sentence_en":"Performing futile rescue efforts."},{"id":"331","start":2438.81,"end":2452.85,"displayStart":2438.81,"displayEnd":2452.85,"displayMid":2445.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.95043,"pitch":21.076712,"speechRate":3.876,"hasEvents":false,"sentence_source":"后来把叔叔暗藏了以后养家的责任更重了以后，我的小五叔我们家最小的一个叔叔只比我姐姐大七岁，他就像我们的哥哥一样。","sentence_en":"Later, after my uncle was hidden away, the burden of supporting the family grew heavier. Our youngest uncle, only seven years older than my sister, was like a brother to us."},{"id":"332","start":2452.85,"end":2467.05,"displayStart":2452.85,"displayEnd":2467.05,"displayMid":2459.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.960054,"pitch":24.18615,"speechRate":4.5,"hasEvents":false,"sentence_source":"当时他为了贴补家用他就想了一个办法，他上学那个地方就跟马戏团似的，他有那种类似于现在的快乐向前冲那样的，谁能过完这个关谁就能拿到奖品。","sentence_en":"At that time, to supplement the family income, he came up with an idea. His school was like a circus, with something similar to today's 'Happy Go Forward' — whoever completed the obstacle course would get a prize."},{"id":"333","start":2467.05,"end":2482.69,"displayStart":2467.05,"displayEnd":2482.69,"displayMid":2474.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.863,"pitch":21.112595,"speechRate":4.433,"hasEvents":false,"sentence_source":"他的那个关卡是用木板钉出一个框来，你要用你的身体去撞那个框，第一关比较简单、薄薄的木片，他就一关一关这样堵下去，堵到好像第三关还有第四关吧，就不行了。","sentence_en":"His obstacle was a frame made of wooden planks. You had to crash into it with your body. The first level was easy, just thin wood chips. He went through level after level, but by the third or fourth level, he couldn't make it."},{"id":"334","start":2482.69,"end":2495.61,"displayStart":2482.69,"displayEnd":2495.61,"displayMid":2489.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.762231,"pitch":15.996117,"speechRate":5.035,"hasEvents":false,"sentence_source":"因为他胳膊这边整个破掉了嗯，印象很深刻，这样七毛钱回来，交给我爸爸，我爸就说你从哪来的钱，他就说你别管反正是我赚的钱，爸就把那个七毛钱收在家里。","sentence_en":"Because his entire arm was broken. It left a deep impression. He came back with seven cents and handed it to my dad. Dad asked where he got the money, and he said, 'Don't ask, it's mine.' Dad kept that seven cents at home."},{"id":"335","start":2495.61,"end":2496.81,"displayStart":2495.61,"displayEnd":2496.81,"displayMid":2496.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Neutral","score":0,"loudness":1.364456,"pitch":28.04833,"speechRate":8.219,"hasEvents":false,"sentence_source":"然后晚上睡觉的时候。","sentence_en":"Then when we went to bed at night."},{"id":"336","start":2496.81,"end":2502.33,"displayStart":2496.81,"displayEnd":2502.33,"displayMid":2499.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Education and Language Learning","sentiment_en":"Negative","score":-0.5,"loudness":0.780374,"pitch":17.71965,"speechRate":5.311,"hasEvents":false,"sentence_source":"因为我跟我小时候跟我姐姐是睡一个床，我就看到她的胳膊就都破了。","sentence_en":"Because when I was little, I shared a bed with my sister, and I saw her arm was all broken."},{"id":"337","start":2502.33,"end":2507.65,"displayStart":2502.33,"displayEnd":2507.65,"displayMid":2504.99,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Relations and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.948848,"pitch":28.612152,"speechRate":4.808,"hasEvents":false,"sentence_source":"然后我姐姐就问她说，你这个胳膊怎么破成这样，你去干嘛了。","sentence_en":"Then my sister asked her, 'How did your arm get so broken? What were you doing?"},{"id":"338","start":2507.65,"end":2510.39,"displayStart":2507.65,"displayEnd":2510.39,"displayMid":2509.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.777566,"pitch":23.752945,"speechRate":6.049,"hasEvents":false,"sentence_source":"就说我给你们讲了，你们不要跟你爸说。","sentence_en":"She said, 'I'll tell you, but don't tell Dad."},{"id":"339","start":2510.39,"end":2512.11,"displayStart":2510.39,"displayEnd":2512.11,"disp 三五成群的约着去吃正经饭，证警犯就是可能点菜啊 大家AA这样吃。","sentence_en":"There were subtle differences, like at lunchtime—I didn't have a meal card. They'd go in groups to eat a proper meal, ordering dishes and splitting the bill."},{"id":"364","start":2727.85,"end":2742.59,"displayStart":2727.85,"displayEnd":2742.59,"displayMid":2735.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.974303,"pitch":22.019083,"speechRate":5.143,"hasEvents":false,"sentence_source":"但是我没有办法 不仅仅是经济的原因，你从心理上就觉得吃饭吃这个证警犯是一个很浪费的行为，证警犯是要重大日子才能吃的，下管子炒菜这个事情是要重大日子才能吃的。","sentence_en":"But I couldn't join, not just for financial reasons. Psychologically, I felt that eating a proper meal was wasteful—that kind of restaurant food was only for special occasions."},{"id":"365","start":2742.59,"end":2756.19,"displayStart":2742.59,"displayEnd":2756.19,"displayMid":2749.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.958182,"pitch":23.882444,"speechRate":5.738,"hasEvents":false,"sentence_source":"然后我也很快地就意识到了这一点，就是我的自卑不仅仅是因为可能我的条件没有他们那么好，我无法去治证警犯，我的自卑正是在于我认为这个镇警犯是要在某某条件下才可以吃的。","sentence_en":"And I quickly realized that my insecurity wasn't just because my conditions weren't as good as theirs and I couldn't afford a proper meal. It was precisely because I believed that a proper meal was only for certain circumstances."},{"id":"366","start":2756.19,"end":2771.61,"displayStart":2756.19,"displayEnd":2771.61,"displayMid":2763.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.923864,"pitch":19.60605,"speechRate":5.143,"hasEvents":false,"sentence_source":"但是它是得日常就是去吃这个镇警犯，我知道这个落差需要很长一段的时间我才能弥补过来，并不是说我挣到 at in the 1990s, there were still places in China with that lifestyle. They just can't make that connection."},{"id":"381","start":2895.91,"end":2908.17,"displayStart":2895.91,"displayEnd":2908.17,"displayMid":2902.04,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.890369,"pitch":25.272749,"speechRate":4.894,"hasEvents":false,"sentence_source":"还真不是他们傲慢或者说内心缺少情感，就是完全超出他们的认知了一惊，我见证过一个我觉得最荒诞的一个场景，我在好像2000年的时候。","sentence_en":"It's not that they are arrogant or lack emotion; it's just completely beyond their comprehension. I witnessed what I think is the most absurd scene, around 2000."},{"id":"382","start":2908.59,"end":2913.49,"displayStart":2908.59,"displayEnd":2913.49,"displayMid":2911.04,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.802932,"pitch":27.885448,"speechRate":3.967,"hasEvents":false,"sentence_source":"我曾经跟中国残疾人艺术团去美国寻回演出。","sentence_en":"I once went to the US for tour performances with the China Disabled People's Performing Art Troupe."},{"id":"383","start":2913.49,"end":2923.49,"displayStart":2913.49,"displayEnd":2923.49,"displayMid":2918.49,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Positive","score":0.7,"loudness":0.872405,"pitch":22.603432,"speechRate":5.277,"hasEvents":false,"sentence_source":"那中国残疾艺术团是特别棒的一个艺术团，我指的棒就是他们的艺术水准是一个专业的水准，无论唱歌、跳舞、乐器都非常棒。","sentence_en":"That troupe is amazing—I mean their artistic level is professional, whether singing, dancing, or playing instruments, all excellent."},{"id":"384","start":2923.49,"end":2931.97,"displayStart":2923.49,"displayEnd":2931.97,"displayMid":2927.7299999999996,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.833711,"pitch":20.263023,"speechRate":4.245,"hasEvents":true,"sentence_source":"然后呢这个团里面就是除了领导和导演以外，健全人就是我是主持人 我帮他们去报幕。","sentence_en":"In the troupe, aside from leaders and directors, the only able-bodied person was me, serving as the host to announce the programs."},{"id":"385","start":2931.97,"end":2936.75,"displayStart":2931.97,"displayEnd":2936.75,"displayMid":2934.3599999999997,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.034255,"pitch":27.938631,"speechRate":3.294,"hasEvents":true,"sentence_source":"那里面有盲人、有龙人、有资产人士。","sentence_en":"There were blind people, deaf people, and people with physical disabilities."},{"id":"386","start":2936.75,"end":2949.75,"displayStart":2936.75,"displayEnd":2949.75,"displayMid":2943.25,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.937384,"pitch":28.603859,"speechRate":5.433,"hasEvents":false,"sentence_source":"那坐飞机的时候他们把一个盲人和一个龙人安排坐在一起，我在旁边我能够看到 那个龙人就不断的想跟那个盲人交流，他就不断的坐着手语 但那是个盲人他看不到。","sentence_en":"On the plane, they arranged for a blind person and a deaf person to sit together. I could see beside them that the deaf person kept trying to communicate with the blind person, signing continuously, but the blind person couldn't see."},{"id":"387","start":2949.75,"end":2962.88,"displayStart":2949.75,"displayEnd":2962.88,"displayMid":2956.315,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.842975,"pitch":23.760698,"speechRate":5.059,"hasEvents":false,"sentence_source":"可是用手语是龙人唯一会的交流的方法，我当时就是我觉得这是个非常荒诞的语谋又很心酸，这可能是唯一的所有一个体感 就是听人我是不懂龙人的世界的。","sentence_en":"But sign language was the only way the deaf person could communicate. I thought it was an absurd and poignant scene. It might be the only insight—hearing people don't understand the world of the deaf."},{"id":"388","start":2962.88,"end":2966.1,"displayStart":2962.88,"displayEnd":2966.1,"displayMid":2964.49,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.95892,"pitch":28.678724,"speechRate":5.923,"hasEvents":false,"sentence_source":"我看得见我也完全无法理解盲人的世界。","sentence_en":"Even though I can see, I completely cannot understand the world of the blind."},{"id":"389","start":2966.1,"end":2969.04,"displayStart":2966.1,"displayEnd":2969.04,"displayMid":2967.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.025684,"pitch":31.083981,"speechRate":6.198,"hasEvents":false,"sentence_source":"就是男人永远无法理解女人的世界。","sentence_en":"It's like men can never understand women's world."},{"id":"390","start":2969.04,"end":2970.16,"displayStart":2969.04,"displayEnd":2970.16,"displayMid":2969.6,"speaker":"Zhashiyi Re","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Physical Illness and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.642611,"pitch":19.539454,"speechRate":3.571,"hasEvents":false,"sentence_source":"我觉得是。","sentence_en":"I think so."},{"id":"391","start":2971.7,"end":2976.12,"displayStart":2971.7,"displayEnd":2976.12,"displayMid":2973.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Ethnic Minority Culture and Identity","sentiment_en":"Neutral","score":0,"loudness":0.883013,"pitch":24.271072,"speechRate":4.751,"hasEvents":false,"sentence_source":
