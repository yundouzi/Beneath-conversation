ng psychological fortitude of a journalist and war correspondent—calm and composed in a crisis."},{"id":"466","start":3825.79,"end":3829.05,"displayStart":3825.79,"displayEnd":3829.05,"displayMid":3827.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.782521,"pitch":17.722229,"speechRate":4.908,"hasEvents":true,"sentence_source":"那做的想办法嘛 要被抓走不就糟糕了。","sentence_en":"I had to figure something out. If I got taken away, things would be bad."},{"id":"467","start":3829.83,"end":3843.53,"displayStart":3829.83,"displayEnd":3843.53,"displayMid":3836.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.886032,"pitch":16.252834,"speechRate":4.599,"hasEvents":true,"sentence_source":"其实也害怕 那种情况下五位杂陈又羞愤，又感觉自己没地儿钻的 又感觉被警察转，还要太怕吧 以前也没遇到过这种情况，我就没跟警察这样打过交道。","sentence_en":"Actually, I was scared too. Under those circumstances, I felt a mix of emotions: humiliated, angry, wanting to disappear, and feeling trapped by the police. And I was terrified. I had never experienced anything like that before—I'd never had such an encounter with the police."},{"id":"468","start":3843.53,"end":3855.53,"displayStart":3843.53,"displayEnd":3855.53,"displayMid":3849.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.840575,"pitch":14.438053,"speechRate":5.857,"hasEvents":false,"sentence_source":"那次影响很深刻 后来我就出去，我都穿好戴好头衣 因为知道我是个外国记者，我也不想因为这个给我自己的工作带来太多的麻烦，我是尊敬手法的 我尊重你们的法律。","sentence_en":"That experience left a deep impression. After that, whenever I went out, I dressed properly and wore my headscarf, because I knew I was a foreign journalist. I didn't want to cause trouble for my work. I respect the law—I respect your laws."},{"id":"469","start":3855.53,"end":3858.97,"displayStart":3855.53,"displayEnd":3858.97,"displayMid":3857.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.781356,"pitch":14.01449,"speechRate":4.36,"hasEvents":false,"sentence_source":"但是我也想在这里好好地工作这个。","sentence_en":"But I also want to work here well."},{"id":"470","start":3858.97,"end":3871.47,"displayStart":3858.97,"displayEnd":3871.47,"displayMid":3865.22,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.020013,"pitch":21.27132,"speechRate":4.56,"hasEvents":false,"sentence_source":"让我想起好几年以前有一阵特别流行的，有一个伊朗伊法国籍的女作家女导演叫马赞沙塔币，他写的那个《我在伊朗长大 黑白》的一个绘本。","sentence_en":"It reminds me of a popular thing from years ago: an Iranian-French writer and director, Marjane Satrapi, and her graphic novel 'Persepolis' (the black and white one)."},{"id":"471","start":3871.47,"end":3883.61,"displayStart":3871.47,"displayEnd":3883.61,"displayMid":3877.54,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.997583,"pitch":23.288834,"speechRate":5.936,"hasEvents":false,"sentence_source":"我觉得就特别像那样的一些场景，他里面有一段就写他去看他的一个男同学，他那个男同学伊斯兰革命期间吧，被炸断双腿后来坐在那个轮椅上，我记念男孩当时那个讲话。","sentence_en":"I think it's just like those scenes. There's a part where she visits a male classmate. During the Islamic Revolution, he lost both legs in a bombing and was in a wheelchair. I remember what that boy said."},{"id":"472","start":3883.61,"end":3887.21,"displayStart":3883.61,"displayEnd":3887.21,"displayMid":3885.41,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.002262,"pitch":24.445784,"speechRate":5.833,"hasEvents":false,"sentence_source":"我那个时候看就看过去了，后来最近我又重新想到。","sentence_en":"I just glossed over it at the time, but recently I thought of it again."},{"id":"473","start":3887.21,"end":3892.23,"displayStart":3887.21,"displayEnd":3892.23,"displayMid":3889.7200000000003,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.018591,"pitch":26.754065,"speechRate":5.912,"hasEvents":false,"sentence_source":"我觉得那男孩说的特别准，他大概历史说 只有当灾难还能承受的时候。","sentence_en":"I think what that boy said was spot on. He said roughly that only when the disaster is still bearable..."},{"id":"474","start":3892.23,"end":3899.89,"displayStart":3892.23,"displayEnd":3899.89,"displayMid":3896.06,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.997562,"pitch":22.859385,"speechRate":4.83,"hasEvents":false,"sentence_source":"我们才会自愿自异 一旦超越了这个界限，忍受无法忍受的痛苦的唯一方法就是一笑之知。","sentence_en":"we would willingly accept it. But once it passes that limit, the only way to endure unbearable pain is to laugh it off."},{"id":"475","start":3899.89,"end":3902.69,"displayStart":3899.89,"displayEnd":3902.69,"displayMid":3901.29,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.785789,"pitch":18.485741,"speechRate":4.286,"hasEvents":false,"sentence_source":"对，其实是这样 说得非常真切。","sentence_en":"Yes, that's exactly right. Very true words."},{"id":"476","start":3902.69,"end":3917.55,"displayStart":3902.69,"displayEnd":3917.55,"displayMid":3910.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.795291,"pitch":21.612101,"speechRate":4.038,"hasEvents":false,"sentence_source":"伊朗就是这样的情况，我经常想 这个民族到底为什么要这么多的灾难，动荡 痛苦 挣扎 分离 都会在他们身上，而且是一代一代人传 一年一年的恶化。","sentence_en":"Iran is exactly like that. I often wonder why this nation has to suffer so many disasters, turmoil, pain, struggle, and separation, all heaped upon them, passing from generation to generation, worsening year after year."},{"id":"477","start":3917.55,"end":3930.27,"displayStart":3917.55,"displayEnd":3930.27,"displayMid":3923.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.79925,"pitch":21.189476,"speechRate":4.221,"hasEvents":false,"sentence_source":"每一个人的个体﹐他所经历的故事都让人感到心碎，这种痛苦他不是因为经济痛苦，他是所经历的这些年的悲欢离合，人的无奈。","sentence_en":"Every individual's story is heartbreaking. This pain isn't economic; it's the sorrows and joys of all these years, the separations and reunions, human helplessness."},{"id":"478","start":3930.27,"end":3943.33,"displayStart":3930.27,"displayEnd":3943.33,"displayMid":3936.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.865349,"pitch":20.8367,"speechRate":5.207,"hasEvents":false,"sentence_source":"我的一个朋友在走的时候我流了很多眼泪，每当我想到他的时候，心里就非常难过，他就像我的妹妹一样，也是给我们一起合作的，就是我们记者站帮忙翻译的小姑娘。","sentence_en":"When a friend of mine left, I shed many tears. Whenever I think of her, I feel very sad. She was like a younger sister to me. She also worked with us, a young girl who helped with translation at our press bureau."},{"id":"479","start":3943.33,"end":3952.73,"displayStart":3943.33,"displayEnd":3952.73,"displayMid":3948.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.845283,"pitch":18.773676,"speechRate":4.454,"hasEvents":false,"sentence_source":"他的爸爸是革命前在美国，反正就是有一个美国护照，你算是美国人吧，他母亲在伊朗 他和他弟弟。","sentence_en":"Her father was in the US before the revolution. He had a US passport, so he was essentially American. Her mother was in Iran with her and her younger brother."},{"id":"480","start":3952.73,"end":3955.93,"displayStart":3952.73,"displayEnd":3955.93,"displayMid":3954.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.793215,"pitch":19.964754,"speechRate":5.475,"hasEvents":false,"sentence_source":"然后他爸爸经常从美国废回来这样团聚。","sentence_en":"Then her father would often fly back from the US for family reunions."},{"id":"481","start":3955.93,"end":3960.97,"displayStart":3955.93,"displayEnd":3960.97,"displayMid":3958.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.853658,"pitch":23.504229,"speechRate":4.365,"hasEvents":false,"sentence_source":"其实那时候他们也是可以申请，就一直在申请去美国。","sentence_en":"Actually, they could have applied then. They had been applying to go to the US."},{"id":"482","start":3960.97,"end":3962.59,"displayStart":3960.97,"displayEnd":3962.59,"displayMid":3961.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.684168,"pitch":18.323988,"speechRate":5.556,"hasEvents":false,"sentence_source":"因为他父亲是美国人。","sentence_en":"Because her father was American."},{"id":"483","start":3962.59,"end":3976.59,"displayStart":3962.59,"displayEnd":3976.59,"displayMid":3969.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.5,"loudness":0.865238,"pitch":17.884127,"speechRate":5.031,"hasEvents":false,"sentence_source":"但是因为一个程序非常慢，我不知道什么原因，他母亲就被拒了，他也被拒过，当时他们的最大的冤枉，就是一起跟父亲团聚去美国，他也不喜欢医劳 因为太多的经济不好。","sentence_en":"But because a process was very slow, for some unknown reason, his mother was rejected, and he was rejected too. At that time, their biggest grievance was wanting to reunite with the father in the US. He also didn't like Iran because of the bad economy."},{"id":"484","start":3976.59,"end":3980.29,"displayStart":3976.59,"displayEnd":3980.29,"displayMid":3978.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.94056,"pitch":20.379467,"speechRate":3.514,"hasEvents":true,"sentence_source":"社会压迫 限制 看不到未来等等。","sentence_en":"Social oppression, restrictions, no future, etc."},{"id":"485","start":3981.15,"end":3990.63,"displayStart":3981.15,"displayEnd":3990.63,"displayMid":3985.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.833316,"pitch":19.79417,"speechRate":4.641,"hasEvents":true,"sentence_source":"但是前年 前年也就这个时候，他母亲突然得了肠癌去世，美国在阿连球阿布扎比的使馆，就通知他可以面试。","sentence_en":"But the year before last, around this time, his mother suddenly died of colon cancer. The US embassy in Abu Dhabi then notified him to come for an interview."},{"id":"486","start":3990.63,"end":4004.55,"displayStart":3990.63,"displayEnd":4004.55,"displayMid":3997.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.6,"loudness":0.797084,"pitch":16.796465,"speechRate":5.316,"hasEvents":false,"sentence_source":"然后给他了他们家的签证，说你们可以去美国了，当时我就问他 我说那你什么时候走，他说我不想走了 我为什么要走，我的妈妈都已经去世了，他已经不想去美国了，他觉得伊朗最好。","sentence_en":"Then they gave him and his family visas, saying you can go to the US. At that time, I asked him, 'When are you leaving?' He said, 'I don't want to go. Why should I? My mother has passed away.' He no longer wanted to go to the US; he thought Iran was best."},{"id":"487","start":4004.55,"end":4019.55,"displayStart":4004.55,"displayEnd":4019.55,"displayMid":4012.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.4,"loudness":0.826626,"pitch":16.162548,"speechRate":5.369,"hasEvents":false,"sentence_source":"他就想留在伊朗，我一直在追问，我说你不是一直都很想走吗，你说你走的时候，你连头都不会回，你就讨厌到这个地步，甚至因为美国剧签，他还想办法通过各种方式，包括申请加拿大，申请别的地方。","sentence_en":"He wanted to stay in Iran. I kept asking, 'Didn't you always want to leave? You said you wouldn't even look back when you left, you hated it that much.' Even because of the US visa ban, he tried various ways, including applying for Canada and other places."},{"id":"488","start":4019.55,"end":4034.07,"displayStart":4019.55,"displayEnd":4034.07,"displayMid":4026.8100000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.5,"loudness":0.827713,"pitch":14.246325,"speechRate":4.477,"hasEvents":false,"sentence_source":"他要想离开这里，但他母亲在那年去世之后，去年他就不想走了，一直不肯走，后来我们大家都劝他你走吧，还有小孩子这种，他的父亲也就80多岁了还在美国。","sentence_en":"He had wanted to leave here, but after his mother died that year, last year he didn't want to leave. He kept refusing. Later, we all urged him to go, saying there were the kids too, and his father was over 80 and still in the US."},{"id":"489","start":4034.07,"end":4047.37,"displayStart":4034.07,"displayEnd":4047.37,"displayMid":4040.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.848703,"pitch":16.974012,"speechRate":5.188,"hasEvents":false,"sentence_source":"弟弟也去了美国 你在这边也没有亲人了，你走吧 后来他就哭着 流着眼泪走的，为什么我要讲这个故事呢，是因为我觉得这种痛苦是磊家的，包括他的母亲也是琉璃世所。","sentence_en":"His brother had also gone to the US. 'You have no family left here. Just go.' So he left, crying, with tears streaming down his face. Why am I telling this story? Because I feel this kind of pain is like that of many families, including his mother, who was also displaced."},{"id":"490","start":4047.37,"end":4052.31,"displayStart":4047.37,"displayEnd":4052.31,"displayMid":4049.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.882118,"pitch":17.985119,"speechRate":4.858,"hasEvents":false,"sentence_source":"他母亲是在伊拉克的伊朗人，在伊拉克因为实业派有很多。","sentence_en":"His mother was an Iranian in Iraq. In Iraq, there were many Shia."},{"id":"491","start":4052.31,"end":4066.77,"displayStart":4052.31,"displayEnd":4066.77,"displayMid":4059.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.900799,"pitch":21.049871,"speechRate":4.841,"hasEvents":false,"sentence_source":"但是当时萨达姆对伊朗发动侵略两一战争，就好把好多好多的伊朗人赶回到了伊朗，他的母亲家琴都在那﹐但因为他的航生问题很小﹐就被装到卡车上扔到了伊朗的边境。","sentence_en":"But when Saddam launched the Iran-Iraq war, they drove many Iranians back to Iran. His mother's family was there, but because she was very young, she was put on a truck and dumped at the Iranian border."},{"id":"492","start":4066.77,"end":4078.51,"displayStart":4066.77,"displayEnd":4078.51,"displayMid":4072.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.5,"loudness":0.815218,"pitch":19.711479,"speechRate":4.94,"hasEvents":false,"sentence_source":"举木无钦﹐那一代人想办法活了下来﹐后来他母亲跟他父亲结婚也是面临这种很多的分离，实际上是他母亲在照顾他和弟弟﹐他父亲经常不在。","sentence_en":"Orphaned and destitute, that generation found ways to survive. Later, when his mother married his father, they also faced many separations. In fact, his mother raised him and his brother, while his father was often away."},{"id":"493","start":4078.51,"end":4087.37,"displayStart":4078.51,"displayEnd":4087.37,"displayMid":4082.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.4,"loudness":0.911432,"pitch":24.68326,"speechRate":4.627,"hasEvents":false,"sentence_source":"但他母亲对他们来说很重要﹐他母亲也是很可怜的一个人，他因为是在伊拉克长大 伊朗跟伊拉克。","sentence_en":"But his mother was very important to them. She was also a pitiful person. Because he grew up in Iraq and Iran, between two countries."},{"id":"494","start":4087.37,"end":4102.37,"displayStart":4087.37,"displayEnd":4102.37,"displayMid":4094.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.903538,"pitch":17.356762,"speechRate":5.267,"hasEvents":false,"sentence_source":"所以很多人说他说的不是博斯语 不存证什么的，就叫他阿拉伯人，阿拉伯人在伊朗就是有点瞧不上那个感觉，没什么文化这种 有点鄙视，他回伊拉克 别人就说你是伊朗人，他永远是一个外来者。","sentence_en":"So many people said he didn't speak proper Persian, had no proof, etc., and called him an Arab. In Iran, there's a bit of disdain for Arabs, seen as uncultured. When he went back to Iraq, others would say he was Iranian. He was always an outsider."},{"id":"495","start":4102.37,"end":4105.69,"displayStart":4102.37,"displayEnd":4105.69,"displayMid":4104.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Positive","score":0.4,"loudness":0.760129,"pitch":17.994106,"speechRate":6.627,"hasEvents":false,"sentence_source":"他在这里 他最亲的就这两个孩子，尤其是我那个朋友。","sentence_en":"Here, the closest people to him were these two children, especially my friend."},{"id":"496","start":4105.69,"end":4118.69,"displayStart":4105.69,"displayEnd":4118.69,"displayMid":4112.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.843917,"pitch":18.361183,"speechRate":5.615,"hasEvents":false,"sentence_source":"然后他母亲就这样去世也没有能够去美国，也没有办法跟他父亲同居，他跟我说 我真的不想离开，我已经失去一个母亲，我现在又要去失去一个母亲，就是她的祖国，这就是她的根。","sentence_en":"Then his mother passed away like that, never able to go to the US, never able to live with his father. He told me, 'I really don't want to leave. I've already lost one mother, and now I'm about to lose another—her homeland, that's her root."},{"id":"497","start":4119.15,"end":4120.81,"displayStart":4119.15,"displayEnd":4120.81,"displayMid":4119.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Artistic Creation and Cultural Expression","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.990504,"pitch":23.731749,"speechRate":5.863,"hasEvents":false,"sentence_source":"等于是她把连根拔起。","sentence_en":"It's like she was uprooted."},{"id":"498","start":4120.81,"end":4135.39,"displayStart":4120.81,"displayEnd":4135.39,"displayMid":4128.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.757763,"pitch":16.316467,"speechRate":4.938,"hasEvents":false,"sentence_source":"然后又重新到一个新的地方去，虽然那里有她的父亲，有她的弟弟，哎呀 我真每当想到这儿，心里就太难过，她又真的是双重的别离，又是离开自己的国家，自己的故土，自己的朋友。","sentence_en":"Then she goes to a new place. Even though her father and brother are there, ah, every time I think of this, it breaks my heart. She truly experiences a double departure—leaving her country, her homeland, her friends."},{"id":"499","start":4135.39,"end":4149.75,"displayStart":4135.39,"displayEnd":4149.75,"displayMid":4142.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.811722,"pitch":19.781481,"speechRate":4.178,"hasEvents":false,"sentence_source":"然后又是离去亲人，这种她不是一个人，是看到太多这样的故事，太多的分离，一代接一代 这么多年来 没有中断过，有人也等团聚 他们的团聚是什么。","sentence_en":"And then leaving loved ones again. She's not alone; I've seen too many such stories, too much separation, generation after generation, unbroken for years. Some wait for reunion—but what is their reunion?"},{"id":"500","start":4149.75,"end":4163.03,"displayStart":4149.75,"displayEnd":4163.03,"displayMid":4156.389999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.5,"loudness":0.909789,"pitch":14.324349,"speechRate":4.669,"hasEvents":false,"sentence_source":"我们设计师 大哥在加拿大，二哥在荷兰 就他和他妈 他爸 他们在这儿，他哥就很想回 但是每次回来这边都打仗，去年12月战争 他哥跑回来 跑回来以后。","sentence_en":"Our designer: his eldest brother in Canada, second brother in the Netherlands, while he and his mom and dad are here. His brothers really want to come back, but every time they return, there's war. Last December, during the war, his brother fled back. After he came back,"},{"id":"501","start":4163.03,"end":4173.33,"displayStart":4163.03,"displayEnd":4173.33,"displayMid":4168.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.938463,"pitch":17.622372,"speechRate":4.709,"hasEvents":false,"sentence_source":"又打仗 他哥又吓死 然后就要飞要走，又没有航班 就是折腾，今年他又想回 然后又打仗，就是这种反反复复 斩斩转转。","sentence_en":"War broke out again, his brother got terrified and wanted to fly out, but there were no flights—such a hassle. This year he wanted to come back again, and then war again—it's this constant back and forth, twists and turns."},{"id":"502","start":4173.33,"end":4188.85,"displayStart":4173.33,"displayEnd":4188.85,"displayMid":4181.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.4,"loudness":0.939584,"pitch":18.550528,"speechRate":4.797,"hasEvents":false,"sentence_source":"那边人担心 这边人也想念家人，前几年美国和伊朗的关系都不好嘛，就我看到好多的朋友，就是跟他们家人 比如说伊朗新年，或者深丹节 因为西方方假，他们都约在土耳其 迪拜碰面。","sentence_en":"People there worry, and people here miss their families. In recent years, US-Iran relations have been bad, so I've seen many friends meeting their families, for example during Iranian New Year or Yalda Night, because of Western holidays, they arrange to meet in Turkey or Dubai."},{"id":"503","start":4188.85,"end":4190.49,"displayStart":4188.85,"displayEnd":4190.49,"displayMid":4189.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Neutral","score":0,"loudness":0.97589,"pitch":21.733458,"speechRate":4.878,"hasEvents":false,"sentence_source":"就家人从世界各地。","sentence_en":"So family members from all over the world."},{"id":"504","start":4190.49,"end":4203.05,"displayStart":4190.49,"displayEnd":4203.05,"displayMid":4196.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.5,"loudness":0.830323,"pitch":19.789703,"speechRate":4.697,"hasEvents":false,"sentence_source":"然后伊朗这边家人也到迪拜 土耳其，就相聚几天，就是你没有办法想象一家人在一起有多难，他们又是多么热爱自己的家庭 讲到种种这种情况。","sentence_en":"Then family from Iran go to Dubai, Turkey, just to gather for a few days. You can't imagine how hard it is for a family to be together, and how much they love their family. Talking about all these situations,"},{"id":"505","start":4203.05,"end":4217.61,"displayStart":4203.05,"displayEnd":4217.61,"displayMid":4210.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family Separation and War Trauma","sentiment_en":"Negative","score":-0.6,"loudness":0.879113,"pitch":17.274237,"speechRate":4.125,"hasEvents":false,"sentence_source":"我就觉得这种痛苦是来家的 不仅是分离，还有战争之下的矛盾 迷茫 无奈，还有想办法好好过日子 把日子过体面的这种努力，真的是太值得诉说了。","sentence_en":"I feel this pain comes from the family—not just separation, but also the conflict, confusion, helplessness under war, and the effort to live well and maintain dignity. It's truly worth telling."},{"id":"506","start":4218.47,"end":4226.13,"displayStart":4218.47,"displayEnd":4226.13,"displayMid":4222.3,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.6,"loudness":0.967046,"pitch":24.87155,"speechRate":5.537,"hasEvents":false,"sentence_source":"对你来说感觉真的就是你像是上天给你这个使命，就是2005年到伊朗 到德黑兰 你就要呆下来。","sentence_en":"For you, it feels like you were given this mission from heaven—to go to Iran in 2005, to Tehran, and stay there."},{"id":"507","start":4226.13,"end":4231.15,"displayStart":4226.13,"displayEnd":4231.15,"displayMid":4228.639999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.5,"loudness":0.861272,"pitch":23.135231,"speechRate":5.657,"hasEvents":false,"sentence_source":"然后有一天你的使命就是记录这个民族这二十多年的慢慢的改变。","sentence_en":"And then one day, your mission became to document this nation's slow changes over these twenty-plus years."},{"id":"508","start":4231.15,"end":4238.59,"displayStart":4231.15,"displayEnd":4238.59,"displayMid":4234.87,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.837826,"pitch":21.802267,"speechRate":5.511,"hasEvents":true,"sentence_source":"然后你看你刚才在讲说那个人他为什么不走，如果是你此刻你的职业如果不是记者的话 你会走吧。","sentence_en":"And you see, you were just talking about why that person didn't leave. If your job weren't being a journalist right now, would you leave?"},{"id":"509","start":4239.25,"end":4243.47,"displayStart":4239.25,"displayEnd":4243.47,"displayMid":4241.360000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.852092,"pitch":15.442927,"speechRate":4.502,"hasEvents":true,"sentence_source":"我会走 也许我会走 因为我是记者 但你说不准。","sentence_en":"I would leave. Maybe I would leave. Because I'm a journalist, but you never know."},{"id":"510","start":4243.47,"end":4247.23,"displayStart":4243.47,"displayEnd":4247.23,"displayMid":4245.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.977588,"pitch":19.668936,"speechRate":6.522,"hasEvents":false,"sentence_source":"因为我太喜欢伊朗 我想留在这儿 我想看伊朗会成什么样。","sentence_en":"Because I love Iran too much. I want to stay here and see what Iran becomes."},{"id":"511","start":4247.23,"end":4254.43,"displayStart":4247.23,"displayEnd":4254.43,"displayMid":4250.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.3,"loudness":0.933189,"pitch":16.182812,"speechRate":5.078,"hasEvents":false,"sentence_source":"但是因为我的孩子 我的家人都在中国 现在在这种情况下，我肯定是选择跟家人在一起。","sentence_en":"But because my child and my family are all in China, under these circumstances, I would definitely choose to be with family."},{"id":"512","start":4254.43,"end":4263.23,"displayStart":4254.43,"displayEnd":4263.23,"displayMid":4258.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.804595,"pitch":18.961937,"speechRate":4.545,"hasEvents":false,"sentence_source":"但是我是记者 我觉得这个我应该把它记录下来，我记录的不仅是一个战争 战争的叙事太宏大了。","sentence_en":"But I'm a journalist. I feel I should record this. What I'm recording is not just a war—the narrative of war is too grand."},{"id":"513","start":4263.23,"end":4266.73,"displayStart":4263.23,"displayEnd":4266.73,"displayMid":4264.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.020537,"pitch":20.671499,"speechRate":6.811,"hasEvents":false,"sentence_source":"我们只能说今天打了哪里 明天就像我今天连线一样。","sentence_en":"We can only say where the bombing happened today, and tomorrow it's like my live connection today."},{"id":"514","start":4266.73,"end":4278.69,"displayStart":4266.73,"displayEnd":4278.69,"displayMid":4272.709999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.885938,"pitch":19.3027,"speechRate":4.264,"hasEvents":false,"sentence_source":"我们只说今天是什么样的反应 今天是什么情况，军方的表示 但是在现实生活当中，我接触的人 了解的事情 看到的那些故事。","sentence_en":"We only talk about today's reactions, today's situation, what the military says. But in real life, the people I meet, the things I learn, the stories I see—"},{"id":"515","start":4278.69,"end":4292.83,"displayStart":4278.69,"displayEnd":4292.83,"displayMid":4285.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.6,"loudness":0.873982,"pitch":17.552551,"speechRate":4.809,"hasEvents":false,"sentence_source":"我觉得都应该记录下来 这是小人物的故事，他们在战争当中 普通人的这种无奈挣扎，他们所承受的痛苦 我们是无法想象的，无法把它记下来 同时我也在未记我自己。","sentence_en":"I think they all should be recorded. These are stories of ordinary people—their helpless struggles in war, the pain they endure that we can't imagine. I can't fully record it, and at the same time, I'm also recording myself."},{"id":"516","start":4292.83,"end":4302.39,"displayStart":4292.83,"displayEnd":4302.39,"displayMid":4297.610000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.5,"loudness":0.851211,"pitch":17.242775,"speechRate":5.439,"hasEvents":false,"sentence_source":"就像我说 我写下这时候 我其实也在写下我自己的那种痛苦和焦虑，写下我看到的心碎的那一刻 我也觉得对自己是一种安慰。","sentence_en":"As I said, when I write this down, I'm actually writing down my own pain and anxiety. Writing down the heartbreaking moments I've seen also feels like a comfort to myself."},{"id":"517","start":4302.39,"end":4313.35,"displayStart":4302.39,"displayEnd":4313.35,"displayMid":4307.870000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.859456,"pitch":19.723372,"speechRate":4.745,"hasEvents":false,"sentence_source":"但是你如果说只说痛苦 好像也很无力，但我更想说的是 他们这个民族真的是不屈不能，在任何压力之下 她依然保持她的体面。","sentence_en":"But if you only talk about pain, it seems powerless. What I want to say more is that this people are truly indomitable. Under any pressure, they still maintain their dignity."},{"id":"518","start":4313.35,"end":4328.03,"displayStart":4313.35,"displayEnd":4328.03,"displayMid":4320.6900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.827209,"pitch":18.187887,"speechRate":4.632,"hasEvents":false,"sentence_source":"尊严 传统 文化 珍爱自己的家庭 珍爱自己的国家，这个我想把它多的说下来 我想记住下来，让更多人了解 而且我觉得这个也是种力量，就是以后我们在遇到困境当中。","sentence_en":"Dignity, tradition, culture, cherishing their family, cherishing their country—I want to talk more about this, remember it, let more people know. And I think this is also a kind of strength, for when we face difficulties in the future."},{"id":"519","start":4328.03,"end":4332.41,"displayStart":4328.03,"displayEnd":4332.41,"displayMid":4330.219999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.841289,"pitch":16.219656,"speechRate":5.251,"hasEvents":false,"sentence_source":"我们想到这些人对我来说也是种力量 极权 也是种学习。","sentence_en":"Thinking of these people gives me strength too—it's also a lesson in resilience."},{"id":"520","start":4332.41,"end":4337.55,"displayStart":4332.41,"displayEnd":4337.55,"displayMid":4334.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.99905,"pitch":24.501972,"speechRate":3.85,"hasEvents":true,"sentence_source":"那，像我们在国内对伊朗的了解其实相当少的。","sentence_en":"Well, back in China, our understanding of Iran is actually quite limited."},{"id":"521","start":4337.55,"end":4349.11,"displayStart":4337.55,"displayEnd":4349.11,"displayMid":4343.33,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.928573,"pitch":24.092747,"speechRate":5.696,"hasEvents":true,"sentence_source":"可能我们对伊朗的很多文化上的了解，来自于比如说一些电影，什么叫《邪字一次别离》，就像我们中国所了解这些伊朗文化，在伊朗民众当中是真正的主流吗。","sentence_en":"Maybe much of our cultural understanding of Iran comes from films like 'A Separation.' Is what we in China know about Iranian culture truly mainstream among Iranians?"},{"id":"522","start":4349.11,"end":4361.03,"displayStart":4349.11,"displayEnd":4361.03,"displayMid":4355.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Neutral","score":0,"loudness":0.884549,"pitch":18.846813,"speechRate":5.318,"hasEvents":false,"sentence_source":"伊朗文化是多远的 很难说哪个是主流，就好比跟你说 鲁豫你知道吗，我认识的朋友 爸爸是非常西方的家庭，就是抽烟喝酒一点都不宗教 非常稀释的。","sentence_en":"Iranian culture is diverse; it's hard to say what's mainstream. For example, you know Lu Yu? A friend of mine's father came from a very Westernized family—smoking, drinking, not religious at all, very secular."},{"id":"523","start":4361.03,"end":4366.35,"displayStart":4361.03,"displayEnd":4366.35,"displayMid":4363.6900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Neutral","score":0,"loudness":0.907944,"pitch":21.070614,"speechRate":5.226,"hasEvents":false,"sentence_source":"然后妈妈是一个非常传统的家庭，穿着黑袍的那种祈祷的家庭。","sentence_en":"And the mother was from a very traditional family, the kind that wears chadors and prays."},{"id":"524","start":4366.35,"end":4374.75,"displayStart":4366.35,"displayEnd":4374.75,"displayMid":4370.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.3,"loudness":0.867211,"pitch":19.526257,"speechRate":4.565,"hasEvents":false,"sentence_source":"然后他们就能在一起生活，这个是伊朗的一个常态，就是多元的 就说小鞋子这种也是一方面。","sentence_en":"And they could live together. That's normal in Iran—it's diverse. Even movies like 'Children of Heaven' are just one aspect."},{"id":"525","start":4374.75,"end":4390.69,"displayStart":4374.75,"displayEnd":4390.69,"displayMid":4382.719999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Neutral","score":0,"loudness":0.891465,"pitch":23.503912,"speechRate":4.329,"hasEvents":false,"sentence_source":"但是大部分的时候我看到的是不同的层次，而且伊朗的社会它是不同阶层的，就是有钱人 中产阶级 还有农村这种偏远的，还有中小城市 大家的生活也都是不太一样的。","sentence_en":"But most of the time, I see different layers, and Iranian society is made up of different classes—the wealthy, the middle class, rural and remote areas, and small and medium-sized cities—where people's lives are quite different."},{"id":"526","start":4390.69,"end":4393.43,"displayStart":4390.69,"displayEnd":4393.43,"displayMid":4392.0599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.823499,"pitch":22.744009,"speechRate":4.409,"hasEvents":true,"sentence_source":"你很难用一个主流去形容。","sentence_en":"It's hard to describe it with a single mainstream."},{"id":"527","start":4394.11,"end":4406.73,"displayStart":4394.11,"displayEnd":4406.73,"displayMid":4400.42,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.109382,"pitch":26.769747,"speechRate":4.957,"hasEvents":true,"sentence_source":"比如说像我们知道的被伊朗政府已经严禁它拍摄，严禁它创作的那个导演叫贾法·帕纳西，像这样的人在比如说伊朗喜欢电影的观众还会关注他吗。","sentence_en":"For example, the director Jafar Panahi, who has been banned from filming and creating by the Iranian government—do movie-loving audiences in Iran still follow him?"},{"id":"528","start":4406.73,"end":4419.69,"displayStart":4406.73,"displayEnd":4419.69,"displayMid":4413.209999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.897632,"pitch":21.385683,"speechRate":4.913,"hasEvents":true,"sentence_source":"当然 他很受欢迎 我也喜欢他 我也是他的粉丝，伊朗人说干就干 真真实，就我们想想 哎拍个电影是不是要做很多事情呢，准备呀 筹备呀什么的 真没有。","sentence_en":"Of course he's very popular. I like him too, I'm his fan. Iranians are very direct and real. You might think making a film requires a lot of preparation, but no, not really."},{"id":"529","start":4419.69,"end":4432.69,"displayStart":4419.69,"displayEnd":4432.69,"displayMid":4426.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.4,"loudness":0.952893,"pitch":21.106623,"speechRate":5.615,"hasEvents":false,"sentence_source":"我真见过就是有伊朗朋友说我要拍电影，他就拍個腦袋跟他几个表弟兄弟，他们就去借个摄像机去拍，我当时就觉得在开玩笑，他们说你要不要来做客串，我都觉得拍人脑袋做事。","sentence_en":"I've actually seen it: an Iranian friend said he wanted to make a film, so he just slapped his forehead and called his cousins and brothers, went to borrow a camera and started shooting. I thought it was a joke. They asked if I wanted to be an extra. I thought they were just winging it."},{"id":"530","start":4432.69,"end":4443.97,"displayStart":4432.69,"displayEnd":4443.97,"displayMid":4438.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.88751,"pitch":23.237057,"speechRate":5.851,"hasEvents":false,"sentence_source":"但是他们真的就把电影拍成了，还拍得着讲，让我感觉这个伊朗人的这种艺术表现能力真的太强，就怕他心里看他就做一个出租车司机，挨个摄像头 他就到处拍。","sentence_en":"But they actually made the film, and it was quite good. It made me realize how strong Iranians' artistic expression is. For example, he just became a taxi driver, put a camera everywhere, and filmed."},{"id":"531","start":4443.97,"end":4458.27,"displayStart":4443.97,"displayEnd":4458.27,"displayMid":4451.120000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.845883,"pitch":19.872955,"speechRate":5.524,"hasEvents":false,"sentence_source":"然后他就拍出来，他展现的就是真实的生活，包括小偷 包括民众，包括他坐车的不同的人的这种讲述，我都是真实的 我觉得真实是最感动的，为什么我觉得伊朗的电影这么的有名，大家这么爱看。","sentence_en":"Then he made a film showing real life—thieves, ordinary people, different passengers' stories. It was all real. I think authenticity is the most touching thing. That's why Iranian cinema is so famous and loved."},{"id":"532","start":4458.27,"end":4472.71,"displayStart":4458.27,"displayEnd":4472.71,"displayMid":4465.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.878058,"pitch":25.902239,"speechRate":4.848,"hasEvents":false,"sentence_source":"因为确实伊朗的这个社会它是个多元的，它很多的真实的情况下，就是人它所经历的东西它是不一样的，伊朗是个精神世界 它更注重的是精神，就是每个人他谈论的东西。","sentence_en":"Because Iranian society is truly diverse. In many real situations, people's experiences differ. Iran has a spiritual world—it focuses more on the spiritual. Everyone talks about deeper things."},{"id":"533","start":4472.71,"end":4478.87,"displayStart":4472.71,"displayEnd":4478.87,"displayMid":4475.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.853907,"pitch":21.468721,"speechRate":5.025,"hasEvents":false,"sentence_source":"不仅是他讲他自己那点所事，还有他的面临的这种困境当中的一种选择。","sentence_en":"Not just their own little stories, but also their choices in the face of difficulties."},{"id":"534","start":4478.87,"end":4481.09,"displayStart":4478.87,"displayEnd":4481.09,"displayMid":4479.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.956881,"pitch":22.615837,"speechRate":4.728,"hasEvents":false,"sentence_source":"我们看到一次别离 对吧。","sentence_en":"We saw 'A Separation,' right?"},{"id":"535","start":4481.09,"end":4490.41,"displayStart":4481.09,"displayEnd":4490.41,"displayMid":4485.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.919157,"pitch":22.367088,"speechRate":5.687,"hasEvents":false,"sentence_source":"那个一次别离也派得非常非常的好，就是讲了一对夫妇他们要移民的要移民，不能移民因为他有父亲在这里，他必须要留在这里。","sentence_en":"That film was very well made. It's about a couple wanting to emigrate, but the husband can't because his father is there; he has to stay."},{"id":"536","start":4490.41,"end":4492.85,"displayStart":4490.41,"displayEnd":4492.85,"displayMid":4491.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName
