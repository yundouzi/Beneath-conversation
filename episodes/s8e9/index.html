心。","sentence_en":"We should understand them. And this kind of national pride and self-respect—maintaining their cultural traditions even in difficult times, still loving their country—"},{"id":"564","start":4725.35,"end":4734.37,"displayStart":4725.35,"displayEnd":4734.37,"displayMid":4729.860000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.7,"loudness":0.841013,"pitch":20.488764,"speechRate":4.989,"hasEvents":false,"sentence_source":"我觉得是值得尊重，也是值得我们学习的，生活当中的这种力量，保持自己的体面和尊严，让我也是值得去学习。","sentence_en":"I think it is worthy of respect and also worth learning from. This kind of strength in life—maintaining one's decency and dignity—is something I should learn from as well."},{"id":"565","start":4734.37,"end":4735.63,"displayStart":4734.37,"displayEnd":4735.63,"displayMid":4735,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.186809,"pitch":32.177017,"speechRate":7.583,"hasEvents":false,"sentence_source":"对 因为我们做记者。","sentence_en":"Yes, because we are journalists."},{"id":"566","start":4735.63,"end":4746.27,"displayStart":4735.63,"displayEnd":4746.27,"displayMid":4740.950000000001,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.5,"loudness":0.924071,"pitch":22.726721,"speechRate":4.934,"hasEvents":false,"sentence_source":"我们习惯我们去报导新闻，有一天你自己成为新闻 至少最初你会特别惶恐，你会觉得这不是我们工作介绍里面说你需要做的。","sentence_en":"We are used to reporting the news. When one day you become the news yourself, at least initially you feel very panicked. You think this is not what your job description says you should do."},{"id":"567","start":4746.27,"end":4758.23,"displayStart":4746.27,"displayEnd":4758.23,"displayMid":4752.25,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0.1,"loudness":0.931096,"pitch":21.657303,"speechRate":5.592,"hasEvents":false,"sentence_source":"但是现在就是如此 当你成为一个被关注的一个中心的时候，好像这也成为你的部分责任，除了报道战争以外 可能你也要让你自己能够更多的出现在前面。","sentence_en":"But now it is what it is. When you become a center of attention, it seems to become part of your responsibility. Besides reporting on the war, you may also need to put yourself out there more."},{"id":"568","start":4758.23,"end":4770.81,"displayStart":4758.23,"displayEnd":4770.81,"displayMid":4764.52,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.8,"loudness":0.963349,"pitch":23.079762,"speechRate":5.476,"hasEvents":false,"sentence_source":"你有时候会不会觉得看自己 就看这过去20年你会觉得特别幸运，就幸运你在命运推着你往前走的时候 你没有去挣扎去反抗，你顺着命运 他给你的劲你往前走。","sentence_en":"Do you sometimes feel, looking back at the past 20 years, that you've been especially lucky? Lucky that when fate pushed you forward, you didn't struggle or resist. You went with the flow, following the direction fate gave you."},{"id":"569","start":4770.81,"end":4781.11,"displayStart":4770.81,"displayEnd":4781.11,"displayMid":4775.96,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.7,"loudness":0.939439,"pitch":23.528423,"speechRate":6.62,"hasEvents":true,"sentence_source":"命运把你放到哪儿 让你去学波斯语 你就去学波斯语，让你去上海 你就去上海 让你去伊朗 你就来伊朗，你会不会觉得很幸运 就眉不你 听从了命运的召唤跟安排。","sentence_en":"Fate put you where you are: it made you learn Persian, so you learned it; it sent you to Shanghai, so you went; it sent you to Iran, so you came. Don't you feel lucky that you followed fate's call and arrangement?"},{"id":"570","start":4781.57,"end":4784.81,"displayStart":4781.57,"displayEnd":4784.81,"displayMid":4783.1900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.853428,"pitch":21.258007,"speechRate":6.646,"hasEvents":false,"sentence_source":"我觉得我是跟着内心走吧 就是有时候也是徬徨的。","sentence_en":"I think I just follow my heart. But sometimes I also feel lost."},{"id":"571","start":4784.81,"end":4796.59,"displayStart":4784.81,"displayEnd":4796.59,"displayMid":4790.700000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":0.872577,"pitch":20.117453,"speechRate":5.857,"hasEvents":false,"sentence_source":"因为看不到路 我大概知道我喜欢什么 我想要什么，包括我就到中学当老师 其实也不是我很想去当老师，好像那就先走吧 但你要说那个经验给我带来的也挺有意思的。","sentence_en":"Because I can't see the road clearly. I roughly know what I like and what I want. Including when I went to teach at a middle school—actually, it wasn't that I really wanted to be a teacher. It was like, 'Let's go for now.' But that experience brought me something interesting."},{"id":"572","start":4796.59,"end":4809.55,"displayStart":4796.59,"displayEnd":4809.55,"displayMid":4803.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.940664,"pitch":19.757896,"speechRate":5.338,"hasEvents":false,"sentence_source":"就是在公众场合怎么把课复杂的事情，用很简单的话句把事情说清楚，这也是一种锻炼，就是每一个这种经验总是会给我一些帮助完善我，不要我去德黑兰大学度博士。","sentence_en":"It taught me how to explain complex things in simple words in public—that's a kind of training. Every experience like that helps me improve. It also led me to pursue a PhD at the University of Tehran."},{"id":"573","start":4809.55,"end":4816.91,"displayStart":4809.55,"displayEnd":4816.91,"displayMid":4813.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.882074,"pitch":18.499722,"speechRate":5.978,"hasEvents":false,"sentence_source":"现在好像这个也没有什么实质性的帮助，比如说好多人博士完，他就要去研究所 或者怎么样出书，我都没有。","sentence_en":"Now it seems there's no real help either, like many PhDs go to research institutes or publish books, but I don't have that."},{"id":"574","start":4816.91,"end":4830.61,"displayStart":4816.91,"displayEnd":4830.61,"displayMid":4823.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.93549,"pitch":20.64687,"speechRate":5.328,"hasEvents":false,"sentence_source":"但是我觉得也是给一个很有意思的经验，在大学里都认识的同学 朋友，还要对整个事情的了解，多多少少 你在生活中经历的每一件事，最终都是一种财富 都会无情当中会帮助你。","sentence_en":"But I think it's also a very interesting experience—friends and classmates at university, understanding the whole thing. Every experience in life eventually becomes a kind of wealth and will help you in unexpected ways."},{"id":"575","start":4830.61,"end":4835.35,"displayStart":4830.61,"displayEnd":4835.35,"displayMid":4832.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.001644,"pitch":21.104931,"speechRate":7.209,"hasEvents":false,"sentence_source":"昨天我跟我妈说 哎呀 我妈我要鲁豫采访我，我好激动呀 因为我妈也喜欢你。","sentence_en":"Yesterday I told my mom, 'Mom, I'm being interviewed by Lu Yu, I'm so excited!' because my mom likes you too."},{"id":"576","start":4835.35,"end":4842.51,"displayStart":4835.35,"displayEnd":4842.51,"displayMid":4838.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.805695,"pitch":21.399349,"speechRate":5.866,"hasEvents":false,"sentence_source":"我们经常在看节目这么多年，我说我有一天我都没有想到我居然被鲁豫采访，后来我妈就说 嗯 挺好的。","sentence_en":"We've been watching your show for years. I never thought I'd be interviewed by Lu Yu one day. My mom said, 'That's nice."},{"id":"577","start":4842.51,"end":4846.23,"displayStart":4842.51,"displayEnd":4846.23,"displayMid":4844.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":1.06405,"pitch":28.818365,"speechRate":4.839,"hasEvents":false,"sentence_source":"然后还跟我说 你就做自己就好啦，别想太多。","sentence_en":"Then she told me, 'Just be yourself, don't overthink it."},{"id":"578","start":4846.23,"end":4851.09,"displayStart":4846.23,"displayEnd":4851.09,"displayMid":4848.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.8,"loudness":0.851706,"pitch":25.399673,"speechRate":5.761,"hasEvents":false,"sentence_source":"然后我觉得我妈就是特别的明智，确实是做自己 跟着自己的声音走。","sentence_en":"And I think my mom is really wise—just be yourself and follow your own voice."},{"id":"579","start":4851.09,"end":4856.11,"displayStart":4851.09,"displayEnd":4856.11,"displayMid":4853.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.7446,"pitch":11.695273,"speechRate":5.777,"hasEvents":false,"sentence_source":"所以在这种惶恐的当中 我就不停地告诉自己，就说你就做自己就好了。","sentence_en":"So in that anxiety, I kept telling myself, just be yourself."},{"id":"580","start":4856.11,"end":4858.99,"displayStart":4856.11,"displayEnd":4858.99,"displayMid":4857.549999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.873852,"pitch":15.474489,"speechRate":6.25,"hasEvents":false,"sentence_source":"你刚才也讲 你说你有些时候是徬徨的。","sentence_en":"You just mentioned that sometimes you feel lost."},{"id":"581","start":4858.99,"end":4861.17,"displayStart":4858.99,"displayEnd":4861.17,"displayMid":4860.08,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.8533,"pitch":16.275631,"speechRate":8.357,"hasEvents":false,"sentence_source":"那你会觉得你在哪个阶段是徬徨的。","sentence_en":"When do you feel lost?"},{"id":"582","start":4861.17,"end":4872.73,"displayStart":4861.17,"displayEnd":4872.73,"displayMid":4866.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.835931,"pitch":19.230314,"speechRate":4.848,"hasEvents":false,"sentence_source":"嗯 看不到路吧 也不知道自己喜欢什么，在做记者之前 我也尝试过啊，就读研究生啊 或者是当老师啊，当时不确定 不知道自己要做什么。","sentence_en":"Yeah, when I can't see the road ahead and don't know what I like. Before becoming a journalist, I tried things like grad school or teaching. At that time, I wasn't sure what I wanted to do."},{"id":"583","start":4872.73,"end":4877.91,"displayStart":4872.73,"displayEnd":4877.91,"displayMid":4875.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.94292,"pitch":20.703169,"speechRate":6.125,"hasEvents":false,"sentence_source":"但是我老觉得这个好像不是我喜欢的，包括刚工作啊 还有我们刚结婚。","sentence_en":"But I always felt it wasn't what I liked, including when I just started working or when we just got married."},{"id":"584","start":4877.91,"end":4892.87,"displayStart":4877.91,"displayEnd":4892.87,"displayMid":4885.389999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.897031,"pitch":18.205162,"speechRate":5.013,"hasEvents":false,"sentence_source":"我们也是出房子 什么也没有，就说好像说要买房了 安定啊什么的，当时也是有这种压力的 也看不到头的，把我这个工作上这种不失音啊 多方面吧，另一手是徬徨的 但后来我开始发现。","sentence_en":"We had nothing—no house, no stability. There was pressure to buy a house and settle down. At that time, it felt endless, work was off, many things. On one hand, I was lost, but later I started to realize."},{"id":"585","start":4892.87,"end":4901.81,"displayStart":4892.87,"displayEnd":4901.81,"displayMid":4897.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.927969,"pitch":24.070089,"speechRate":5.034,"hasEvents":false,"sentence_source":"我自己喜欢做的事我就不徬徨了，而且我在伊朗待了这么多年 20年，我越来越认识到这个不是说我在伊朗。","sentence_en":"Once I found what I like doing, I stopped feeling lost. After living in Iran for so many years, 20 years, I've come to realize it's not just about being in Iran."},{"id":"586","start":4901.81,"end":4915.97,"displayStart":4901.81,"displayEnd":4915.97,"displayMid":4908.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.8,"loudness":0.872738,"pitch":23.820057,"speechRate":4.59,"hasEvents":false,"sentence_source":"然后我做自己喜欢的做的事，这个工作是在帮助我成长，我在伊朗看到的一切，他们会让我更坚定，更认识到人性的可贵，认识到你在困难的时候，你该去怎么做。","sentence_en":"Doing what I love helps me grow. Everything I see in Iran makes me more determined and aware of the preciousness of human nature—how to act in difficult times."},{"id":"587","start":4915.97,"end":4921.17,"displayStart":4915.97,"displayEnd":4921.17,"displayMid":4918.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.954645,"pitch":21.319107,"speechRate":4.423,"hasEvents":false,"sentence_source":"我看伊朗其实他们也在告诉我，给我的人生更多的经验。","sentence_en":"Iran is also teaching me, giving me more life experience."},{"id":"588","start":4921.17,"end":4923.87,"displayStart":4921.17,"displayEnd":4923.87,"displayMid":4922.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.7,"loudness":0.858482,"pitch":16.235138,"speechRate":5.437,"hasEvents":false,"sentence_source":"所以更加的坚定，这也是一种财富。","sentence_en":"So I'm more determined. That's also a kind of wealth."},{"id":"589","start":4923.87,"end":4932.27,"displayStart":4923.87,"displayEnd":4932.27,"displayMid":4928.07,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.846162,"pitch":22.099527,"speechRate":4.896,"hasEvents":false,"sentence_source":"可能人在成长的过程当中，初期都会是徬徨，就当你找到自己真正想走一条路之前，会徬徨很多时候。","sentence_en":"Maybe in the process of growing up, early on, everyone feels lost. Before finding the path you truly want, you'll often be lost."},{"id":"590","start":4932.27,"end":4943.63,"displayStart":4932.27,"displayEnd":4943.63,"displayMid":4937.950000000001,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.910124,"pitch":21.022873,"speechRate":5.898,"hasEvents":false,"sentence_source":"那如何走过一段徬徨，就是被动的等待吗，还是相信你内心会出现一个更加清晰的声音，把你引到你真正想走的那个路上去，但如果那个声音一直不出现该怎么办?","sentence_en":"So how do you get through that lost period? Is it just passively waiting, or trusting that a clearer voice inside will guide you to the path you truly want? But what if that voice never comes?"},{"id":"591","start":4943.79,"end":4944.69,"displayStart":4943.79,"displayEnd":4944.69,"displayMid":4944.24,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.170304,"pitch":24.11817,"speechRate":5.952,"hasEvents":false,"sentence_source":"要等待多久?","sentence_en":"How long do you wait?"},{"id":"592","start":4944.85,"end":4947.47,"displayStart":4944.85,"displayEnd":4947.47,"displayMid":4946.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.866853,"pitch":14.767287,"speechRate":5.447,"hasEvents":false,"sentence_source":"就是做好眼下的事吧，我也不知道。","sentence_en":"Just do the best with what's in front of you. I don't know either."},{"id":"593","start":4947.47,"end":4953.27,"displayStart":4947.47,"displayEnd":4953.27,"displayMid":4950.370000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.905842,"pitch":19.006344,"speechRate":5.695,"hasEvents":false,"sentence_source":"那个时候我也没觉得自己将来是什么，就是很迷茫的状态，就像你说的开不到路。","sentence_en":"At that time, I didn't think I'd become anything. I was very confused, just like you said, couldn't see the road."},{"id":"594","start":4953.27,"end":4959.07,"displayStart":4953.27,"displayEnd":4959.07,"displayMid":4956.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":0.894235,"pitch":17.103878,"speechRate":5.115,"hasEvents":false,"sentence_source":"然后也觉得不是我喜欢的，但我首先得把眼前做好吧，该做的我就做好。","sentence_en":"I also felt it wasn't what I liked, but I had to do what was in front of me first. I did what needed to be done."},{"id":"595","start":4959.07,"end":4961.69,"displayStart":4959.07,"displayEnd":4961.69,"displayMid":4960.379999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.835063,"pitch":14.534859,"speechRate":5,"hasEvents":false,"sentence_source":"但是我还是始终保持好奇心。","sentence_en":"But I always stayed curious."},{"id":"596","start":4961.69,"end":4967.57,"displayStart":4961.69,"displayEnd":4967.57,"displayMid":4964.629999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.867027,"pitch":18.169821,"speechRate":6.529,"hasEvents":false,"sentence_source":"我觉得我是幸运的，就是我能找到我自己喜欢做的事，但好比说我要找不到自己喜欢做的事。","sentence_en":"I think I'm lucky to have found what I love doing. But what if I hadn't found it?"},{"id":"597","start":4967.57,"end":4979.29,"displayStart":4967.57,"displayEnd":4979.29,"displayMid":4973.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.958336,"pitch":18.701876,"speechRate":5.887,"hasEvents":false,"sentence_source":"那会不会还有其他好玩的事儿，我更喜欢 也说不准，我对什么事情都很好奇，就好比说我到一个地方去，我就特别想了解他们的语言，虽然我到阿拉伯去敘利亚 阿利比亚。","sentence_en":"Maybe there would be other fun things I'd like more—you never know. I'm curious about everything. For example, when I go somewhere, I really want to learn their language, like when I went to Syria or Libya in Arabia."},{"id":"598","start":4979.29,"end":4990.13,"displayStart":4979.29,"displayEnd":4990.13,"displayMid":4984.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.012578,"pitch":20.566063,"speechRate":6.259,"hasEvents":false,"sentence_source":"我就很困惑 我为什么不学阿拉伯语，我就很想知道他们怎么想，我怎么想知道那种迫切的想法，比如说我在敘利亚 我特别喜欢敘利亚，我真的就想在敘利亚待下去。","sentence_en":"I was really puzzled about why I didn't learn Arabic. I wanted to know what they thought, that urgent desire. For example, in Syria, I loved it so much, I truly wanted to stay there."},{"id":"599","start":4990.13,"end":4995.43,"displayStart":4990.13,"displayEnd":4995.43,"displayMid":4992.780000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.87026,"pitch":23.012079,"speechRate":4.906,"hasEvents":false,"sentence_source":"就是那种情况 或许不是光在伊朗吧，就是你先做好自己的事情。","sentence_en":"It's like that situation—maybe not just in Iran. You first take care of your own things."},{"id":"600","start":4995.43,"end":5009.67,"displayStart":4995.43,"displayEnd":5009.67,"displayMid":5002.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.86537,"pitch":17.823685,"speechRate":5.197,"hasEvents":false,"sentence_source":"然后你突然自己 这个地方喜欢，你就会勇敢的去追求，这个是根据自己的内心，总而言之 我觉得因为在你看不清的时候，很多的徬徨是自然的，但要勇敢 勇敢的去听自己内心的声音。","sentence_en":"Then suddenly you find you like a place, and you bravely pursue it. It's based on your heart. In short, when you can't see clearly, much hesitation is natural, but be brave—bravely listen to your inner voice."},{"id":"601","start":5009.67,"end":5014.15,"displayStart":5009.67,"displayEnd":5014.15,"displayMid":5011.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.900093,"pitch":17.730753,"speechRate":5.58,"hasEvents":false,"sentence_source":"当你发现这个地方我喜欢，你就会勇敢的去做 而不是想太多。","sentence_en":"When you discover you like a place, you act bravely instead of overthinking."},{"id":"602","start":5014.75,"end":5022.17,"displayStart":5014.75,"displayEnd":5022.17,"displayMid":5018.46,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":1.027629,"pitch":23.39362,"speechRate":6.158,"hasEvents":true,"sentence_source":"你看一个人在一个城市生活时间，厂理后这个城市会有一部分长成自己的血脉，像你出生的地方 中国西北。","sentence_en":"You see, when a person lives in a city for a long time, part of that city becomes part of their blood, like your birthplace in Northwest China."},{"id":"603","start":5050.89,"end":5052.15,"displayStart":5050.89,"displayEnd":5052.15,"displayMid":5051.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Neutral","score":0,"loudness":0.785388,"pitch":18.472206,"speechRate":68.254,"hasEvents":false,"sentence_source":"上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海﹑上海�。","sentence_en":"Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai, Shanghai."},{"id":"604","start":5052.15,"end":5055.09,"displayStart":5052.15,"displayEnd":5055.09,"displayMid":5053.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Positive","score":0.5,"loudness":0.943768,"pitch":20.156004,"speechRate":6.427,"hasEvents":false,"sentence_source":"我就会听到那边的晚岛声 而且挺好听的。","sentence_en":"I would hear the evening call to prayer there, and it sounded nice."},{"id":"605","start":5055.09,"end":5068.29,"displayStart":5055.09,"displayEnd":5068.29,"displayMid":5061.6900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Positive","score":0.7,"loudness":0.920062,"pitch":19.276915,"speechRate":5.051,"hasEvents":true,"sentence_source":"那时候宁夏迎川还没有很高的楼，我就会望过去 远处是一片什么形容呢，就是长河落日园的感觉 很美，到现在我也喜欢那个小城市，这个是给我的一种铺垫吧。","sentence_en":"At that time, Yinchuan in Ningxia didn't have tall buildings. I would look into the distance—how to describe it? It felt like 'a long river with a round setting sun'—very beautiful. I still like that small city. That was a kind of foundation for me."},{"id":"606","start":5068.29,"end":5078.99,"displayStart":5068.29,"displayEnd":5078.99,"displayMid":5073.639999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Positive","score":0.6,"loudness":0.914033,"pitch":22.455931,"speechRate":4.993,"hasEvents":true,"sentence_source":"也就可能明明当中就是让我选择了不思于，后来我在上海看到的是江南的这种晚约的气质，我特别喜欢上海的雨 我喜欢雨天。","sentence_en":"Maybe it was fate that made me choose not to overthink. Later, in Shanghai, I saw the Jiangnan evening charm. I particularly love Shanghai's rain—I love rainy days."},{"id":"607","start":5078.99,"end":5092.61,"displayStart":5078.99,"displayEnd":5092.61,"displayMid":5085.799999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Positive","score":0.7,"loudness":0.932007,"pitch":18.794996,"speechRate":4.772,"hasEvents":false,"sentence_source":"因为我们在西北看不到太多，而且我的同学他们是上海人，上海人的精致 可爱 这种家庭的氛围，让我感觉到真正的烟火气，我在上海也看到大都市的这种繁华。","sentence_en":"Because in the northwest we don't see much of that. And my classmates were Shanghainese—their refinement, cuteness, and family atmosphere made me feel true daily life. In Shanghai, I also saw the hustle and bustle of a big city."},{"id":"608","start":5092.61,"end":5106.27,"displayStart":5092.61,"displayEnd":5106.27,"displayMid":5099.4400000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.805226,"pitch":18.958412,"speechRate":4.392,"hasEvents":false,"sentence_source":"西方的国际化 精致感，比如说我觉得伊朗人和上海有点像，就是这种精致 这种烟火气，但又不太一样，可能这边就是跟西方一点，或者是跟美式一些。","sentence_en":"Western international sophistication. For example, I think Iranians are a bit like Shanghai—this kind of sophistication and hustle and bustle, but also somewhat different. Maybe here it's more Western, or more American-style."},{"id":"609","start":5106.27,"end":5114.99,"displayStart":5106.27,"displayEnd":5114.99,"displayMid":5110.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Positive","score":0.6,"loudness":0.801589,"pitch":15.337249,"speechRate":3.899,"hasEvents":false,"sentence_source":"上海是有这种小家子过日子的烟火气，经济 晚约 还重视生活，这些都是很好的底子。","sentence_en":"Shanghai has this kind of cozy, daily-life atmosphere—economically, graceful, and valuing life. These are all good foundations."},{"id":"610","start":5114.99,"end":5129.93,"displayStart":5114.99,"displayEnd":5129.93,"displayMid":5122.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.949539,"pitch":17.682436,"speechRate":5.394,"hasEvents":false,"sentence_source":"我觉得上海也是我的故乡，我这次经过上海没有停留，就在机场出机场的时候，我就闻到了潮湿的味道，我就觉得好怀念呀，就给我在上海同学发来，我说真的好怀念上海，真希望有一天回来看一看。","sentence_en":"I think Shanghai is also my hometown. This time I passed through Shanghai without stopping. When I left the airport, I smelled the humid air, and I felt so nostalgic. I sent a message to my classmates in Shanghai, saying I really miss Shanghai and hope to come back and see it one day."},{"id":"611","start":5129.93,"end":5131.11,"displayStart":5129.93,"displayEnd":5131.11,"displayMid":5130.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Neutral","score":0,"loudness":0.92371,"pitch":16.927082,"speechRate":4.237,"hasEvents":false,"sentence_source":"北京也给我。","sentence_en":"Beijing also gave me that."},{"id":"612","start":5131.11,"end":5140.45,"displayStart":5131.11,"displayEnd":5140.45,"displayMid":5135.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.893952,"pitch":18.605268,"speechRate":5.139,"hasEvents":false,"sentence_source":"因为我北京研究生三年我在北大度过，我在北大校园，也是我非常怀念美好的时光，包括我在北大处扩宽了我的眼界。","sentence_en":"Because I spent my three years of graduate school in Beijing at Peking University. The campus at PKU is a time I miss dearly—it broadened my horizons."},{"id":"613","start":5140.45,"end":5156.15,"displayStart":5140.45,"displayEnd":5156.15,"displayMid":5148.299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.915356,"pitch":20.688183,"speechRate":4.333,"hasEvents":false,"sentence_source":"那个时候我在北大听了很多人的讲座，听到不同的人的故事，不同人的声音也是给我一个很大的启发，后来在伊朗的更不一样了，这二十年是我人生性格沉淀的时候。","sentence_en":"At that time, I attended many lectures at PKU, hearing stories and voices of different people, which greatly inspired me. Later, in Iran, it was even more different. These twenty years have been a time of character refinement for me."},{"id":"614","start":5156.15,"end":5166.13,"displayStart":5156.15,"displayEnd":5166.13,"displayMid":5161.139999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.92414,"pitch":18.630295,"speechRate":4.208,"hasEvents":false,"sentence_source":"这二十年当中我目睹的是伊朗的动荡，起起伏伏和谈谈了二十年，达成协议撕毁，2009年的学生的。","sentence_en":"In these twenty years, I witnessed Iran's turmoil, ups and downs, and negotiations for twenty years—agreements made and torn up, the 2009 student protests."},{"id":"615","start":5166.13,"end":5171.13,"displayStart":5166.13,"displayEnd":5171.13,"displayMid":5168.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":0.918785,"pitch":18.407784,"speechRate":5.247,"hasEvents":false,"sentence_source":"因为选票民众的这种起义，也是给我的一种政治教育 政治启发。","sentence_en":"The uprising over the election results was also a political education and inspiration for me."},{"id":"616","start":5171.13,"end":5177.87,"displayStart":5171.13,"displayEnd":5177.87,"displayMid":5174.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.881944,"pitch":19.375898,"speechRate":5.638,"hasEvents":false,"sentence_source":"因为这些我想知道什么是政治，什么是国际关系，我又去读国际关系的博士，这一系列的东西。","sentence_en":"Because of these, I wanted to understand what politics and international relations are. So I went to pursue a PhD in international relations—a series of things like that."},{"id":"617","start":5177.87,"end":5182.89,"displayStart":5177.87,"displayEnd":5182.89,"displayMid":5180.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.847575,"pitch":19.113667,"speechRate":5.578,"hasEvents":false,"sentence_source":"我觉得都是在推动我去想了解，我现在还有保持非常强烈的好执行。","sentence_en":"I feel all of this pushed me to want to understand. I still maintain a strong curiosity."},{"id":"618","start":5182.89,"end":5193.67,"displayStart":5182.89,"displayEnd":5193.67,"displayMid":5188.280000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.938547,"pitch":23.276949,"speechRate":5.102,"hasEvents":false,"sentence_source":"因为我觉得我还没有完全了解这个世界，了解伊朗，它在不断的扩展我的视野，就是我没觉得我自己，就是好像现在是中年了要怎么样。","sentence_en":"Because I feel I haven't fully understood the world or Iran yet. It keeps expanding my horizons. I don't feel like I'm middle-aged now and should be a certain way."},{"id":"619","start":5193.67,"end":5206.73,"displayStart":5193.67,"displayEnd":5206.73,"displayMid":5200.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.895462,"pitch":21.151157,"speechRate":4.865,"hasEvents":false,"sentence_source":"我觉得我现在还挺有想法的，想做很多事 想去报道很多人 想去很多的地方，这就是让我的世界无限的扩大，另外伊朗确实这么多年 我让我更了解人性吧。","sentence_en":"I feel I still have a lot of ideas—I want to do many things, report on many people, go to many places. This is letting my world expand infinitely. Also, Iran has indeed made me understand human nature better over these years."},{"id":"620","start":5206.73,"end":5214.49,"displayStart":5206.73,"displayEnd":5214.49,"displayMid":5210.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.91892,"pitch":20.573685,"speechRate":4.835,"hasEvents":false,"sentence_source":"我以前是好奇心很重的一个人，但我其实情商上面我没有那么高，不太明白话中的意思。","sentence_en":"I used to be a very curious person, but I wasn't that high in emotional intelligence—I didn't really understand the meaning behind words."},{"id":"621","start":5214.49,"end":5229.67,"displayStart":5214.49,"displayEnd":5229.67,"displayMid":5222.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.98367,"pitch":21.672701,"speechRate":4.788,"hasEvents":false,"sentence_source":"但是在这待了这么长时间，伊朗人他们不是一个非常直接的人，他们说话 表情流露，后来我就慢慢的观察，我才意识到很多东西是不需要言语的，你需要从他们的言语当中。","sentence_en":"But after staying here so long, Iranians are not very direct people. They speak with expressions. Later, I slowly observed and realized that many things don't need words—you need to read between their words."},{"id":"622","start":5229.67,"end":5237.31,"displayStart":5229.67,"displayEnd":5237.31,"displayMid":5233.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.901399,"pitch":21.111563,"speechRate":3.665,"hasEvents":false,"sentence_source":"去体会那种复杂的情绪，这也让我内心对人性有更多的观察和思考。","sentence_en":"To feel those complex emotions. This also gave me more observation and reflection on human nature."},{"id":"623","start":5237.31,"end":5252.55,"displayStart":5237.31,"displayEnd":5252.55,"displayMid":5244.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.89437,"pitch":17.59506,"speechRate":4.528,"hasEvents":false,"sentence_source":"我觉得人生就是这样吧，不仅是我们自己，我也看到别人他们那种纠结 痛苦 挣扎 复杂，也想办法过好日子，这就才是人生，在看到这么多以后，我也不会为一些小事情生气。","sentence_en":"I think life is like this—not just us. I also see others' entanglements, pain, struggles, complexity. They also find ways to live well. That's what life is. After seeing so much, I don't get angry over small things."},{"id":"624","start":5252.55,"end":5255.93,"displayStart":5252.55,"displayEnd":5255.93,"displayMid":5254.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.840788,"pitch":18.583803,"speechRate":5.03,"hasEvents":false,"sentence_source":"我很急性子年轻的时候，我先生是慢性子。","sentence_en":"I was very impatient when I was young. My husband is patient."},{"id":"625","start":5255.93,"end":5258.07,"displayStart":5255.93,"displayEnd":5258.07,"displayMid":5257,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.963013,"pitch":12.19801,"speechRate":6.075,"hasEvents":false,"sentence_source":"我们俩经常吵架为这些小事情。","sentence_en":"We often quarrel over these little things."},{"id":"626","start":5258.07,"end":5263.25,"displayStart":5258.07,"displayEnd":5263.25,"displayMid":5260.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.913678,"pitch":18.890551,"speechRate":4.247,"hasEvents":false,"sentence_source":"但是后来经过这些事以后，我就对人有了更多的了解。","sentence_en":"But after going through these experiences, I gained a better understanding of people."},{"id":"627","start":5263.25,"end":5263.97,"displayStart":5263.25,"displayEnd":5263.97,"displayMid":5263.610000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":1.005443,"pitch":19.632215,"speechRate":6.944,"hasEvents":false,"sentence_source":"对世界可能。","sentence_en":"And of the world, maybe."},{"id":"628","start":5263.97,"end":5278.25,"displayStart":5263.97,"displayEnd":5278.25,"displayMid":5271.110000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.6,"loudness":0.853628,"pitch":15.841863,"speechRate":4.692,"hasEvents":false,"sentence_source":"我觉得人总是要经历过这些猛撞，挫折 痛苦 低谷，但它也会有高果，就像我在伊朗看到的这些，还有包括在战争看到的，我始终相信就是，除了生死其他事都不是大事。","sentence_en":"I think people always have to go through collisions, setbacks, pain, and low points, but there are also highs. Like what I saw in Iran and in war, I've always believed that except for life and death, nothing else is a big deal."},{"id":"629","start":5278.25,"end":5292.75,"displayStart":5278.25,"displayEnd":5292.75,"displayMid":5285.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.885824,"pitch":19.206863,"speechRate":4.552,"hasEvents":false,"sentence_source":"其他事都是小事，不要为这种小事生其烦 人生当中很多人生死不由命，瞬间就没了 一撞楼没了 人呆的家里瞬间就没，车子开过 瞬间就没 四十多个降临在那开会。","sentence_en":"Everything else is trivial. Don't get upset over small things. In life, many people die unpredictably, gone in an instant—a building collapses, gone; at home, gone in a flash; a car passes by, gone; forty-plus people meeting there are blown up."},{"id":"630","start":5292.75,"end":5297.37,"displayStart":5292.75,"displayEnd":5297.37,"displayMid":5295.0599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Negative","score":-0.6,"loudness":0.872302,"pitch":17.300013,"speechRate":3.463,"hasEvents":false,"sentence_source":"人就炸没了 这就是人生的不可预测吧。","sentence_en":"People are blown away. That's the unpredictability of life."},{"id":"631","start":5297.37,"end":5304.65,"displayStart":5297.37,"displayEnd":5304.65,"displayMid":5301.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.5,"loudness":1.05589,"pitch":17.335127,"speechRate":5.614,"hasEvents":false,"sentence_source":"所以我觉得还是需要去讲述它，另外记住 也是告知我自己这些事都不是大事，除了生死都是小事。","sentence_en":"So I think it's necessary to tell it, and also to remember—to remind myself that these things are not big deals. Except for life and death, everything is minor."},{"id":"632","start":5304.65,"end":5309.35,"displayStart":5304.65,"displayEnd":5309.35,"displayMid":5307,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.978223,"pitch":25.425604,"speechRate":6.707,"hasEvents":false,"sentence_source":"你说除了生死别都不是大事，你知道这种话我们日常生活中也会讲。","sentence_en":"You say that except for life and death, nothing else matters. You know, we also say that in daily life."},{"id":"633","start":5309.35,"end":5315.23,"displayStart":5309.35,"displayEnd":5315.23,"displayMid":5312.29,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.5,"loudness":0.964859,"pitch":22.018709,"speechRate":4.659,"hasEvents":false,"sentence_source":"但是当你此刻在德黑兰跟我讲的时候，它的重量真的是不一样的。","sentence_en":"But when you say it to me here in Tehran right now, its weight is truly different."},{"id":"634","start":5315.23,"end":5325.25,"displayStart":5315.23,"displayEnd":5325.25,"displayMid":5320.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":0.838739,"pitch":22.283779,"speechRate":6.154,"hasEvents":false,"sentence_source":"是的 真死不由命，在伊朗真的不知道下一分钟发生什么，不是战争哦 就是说平常的时候也是这样，伊朗人经常说哎呀 我们不知道明天会发生什么。","sentence_en":"Yes, death truly doesn't follow fate. In Iran, you really don't know what will happen the next minute. Not just in war—in normal times too. Iranians often say, 'Alas, we don't know what tomorrow will bring."},{"id":"635","start":5325.25,"end":5326.89,"displayStart":5325.25,"displayEnd":5326.89,"displayMid":5326.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.815501,"pitch":20.959183,"speechRate":7.029,"hasEvents":false,"sentence_source":"所以就是今朝有酒今朝醉。","sentence_en":"So it's about living for the moment."},{"id":"636","start":5326.89,"end":5329.09,"displayStart":5326.89,"displayEnd":5329.09,"displayMid":5327.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.5,"loudness":0.885685,"pitch":21.929474,"speechRate":5.455,"hasEvents":false,"sentence_source":"今天好好过吧 过好今天再说。","sentence_en":"Just live today well; let's live today well first."},{"id":"637","start":5329.09,"end":5330.81,"displayStart":5329.09,"displayEnd":5330.81,"displayMid":5329.950000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.880126,"pitch":21.19586,"speechRate":5.814,"hasEvents":false,"sentence_source":"因为它不确定性太强了。","sentence_en":"Because the uncertainty is too strong."},{"id":"638","start":5330.81,"end":5344.11,"displayStart":5330.81,"displayEnd":5344.11,"displayMid":5337.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Negative","score":-0.4,"loudness":0.840437,"pitch":22.121592,"speechRate":5.94,"hasEvents":false,"sentence_source":"因为它有个动荡太多了 40多年，它跟美国和以色列那种对立，还有国内的这种动荡，就是老百姓 包括官员 他也不知道明天会发生什么，这种不确定性就导致他们现在只能就及时行乐的形态。","sentence_en":"Because there's been so much turmoil for over 40 years—its conflicts with the U.S. and Israel, plus domestic unrest. Ordinary people, even officials, don't know what will happen tomorrow. This uncertainty leads them to adopt a carpe diem mentality."},{"id":"639","start":5344.11,"end":5353.13,"displayStart":5344.11,"displayEnd":5353.13,"displayMid":5348.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.903149,"pitch":24.394011,"speechRate":4.839,"hasEvents":false,"sentence_source":"在经历了这么多动荡之后 有这种非常安宁的生活，就觉得特别的幸福 又何必为那些小烦恼而生气呢。","sentence_en":"After experiencing so much turmoil, having such a peaceful life feels especially happy. Why get angry over those small annoyances?"},{"id":"640","start":5353.13,"end":5366.87,"displayStart":5353.13,"displayEnd":5366.87,"displayMid":5360,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.6,"loudness":0.991597,"pitch":24.244562,"speechRate":5.677,"hasEvents":false,"sentence_source":"因为真的 你所有的事情都需要比较，通过比较 你会发现有一些事是如此不值一提，我也能感受到你在德黑兰县尽可能把你生活还是如常的过着，比如说此刻我能看到你家里面特别的干净。","sentence_en":"Because really, you need comparison for everything. Through comparison, you realize some things are so insignificant. I can also feel that you're trying to live your life as normally as possible here in Tehran. For example, right now I can see your home is very clean."},{"id":"641","start":5366.87,"end":5368.97,"displayStart":5366.87,"displayEnd":5368.97,"displayMid":5367.92,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.991488,"pitch":22.370672,"speechRate":6.19,"hasEvents":false,"sentence_source":"你是依然每天在自己做打扫吗。","sentence_en":"Do you still clean it yourself every day?"},{"id":"642","start":5368.97,"end":5383.09,"displayStart":5368.97,"displayEnd":5383.09,"displayMid":5376.030000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":0.90044,"pitch":19.322029,"speechRate":5.121,"hasEvents":false,"sentence_source":"没有 其实没时间，定期会有清洁工到我们家来打扫一下，之前 前十天他不出现都跑回老家了，但现在因为快过年要工作嘛 收入，他又跑回来 所以就定期到我们家来打扫一下。","sentence_en":"No, actually I don't have time. A cleaner comes regularly. Earlier, for ten days he didn't show up—went back to his hometown. But now, because the New Year is coming and he needs to work for income, he came back, so he cleans our place periodically."},{"id":"643","start":5383.09,"end":5385.09,"displayStart":5383.09,"displayEnd":5385.09,"displayMid":5384.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.4,"loudness":0.834276,"pitch":17.105585,"speechRate":5,"hasEvents":false,"sentence_source":"其实日子是要过下去的。","sentence_en":"Actually, life has to go on."},{"id":"644","start":5385.09,"end":5397.09,"displayStart":5385.09,"displayEnd":5397.09,"displayMid":5391.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.5,"loudness":0.964102,"pitch":17.242508,"speechRate":4.866,"hasEvents":false,"sentence_source":"我们家就是 其实是我先生郑凯他的布置，他喜欢把家也收拾得很好和温馨，经常买一些他喜欢的东西摆上，我是没有这个心思 也没有时间。","sentence_en":"Our home—actually it's my husband Zheng Kai's arrangement. He likes to keep the home tidy and cozy, often buying things he likes to put out. I don't have the mind or the time."},{"id":"645","start":5397.09,"end":5404.69,"displayStart":5397.09,"displayEnd":5404.69,"displayMid":5400.889999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.138009,"pitch":23.14636,"speechRate":4.605,"hasEvents":false,"sentence_source":"啊 我介绍一下3月20号对中国人来说是春风，3月20号是伊朗人的厨西开摘节。","sentence_en":"Ah, let me explain: March 20th for Chinese is the Spring Equinox. March 20th is Iranians' Chaharshanbe Suri festival."},{"id":"646","start":5404.69,"end":5409.71,"displayStart":5404.69,"displayEnd":5409.71,"displayMid":5407.2,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.927529,"pitch":20.116655,"speechRate":4.183,"hasEvents":false,"sentence_source":"然后刚讲到那个叫奴鲁姿节 对吧，就是3月21号。","sentence_en":"And then you just mentioned the festival called Nowruz, right? That's March 21st."},{"id":"647","start":5409.71,"end":5417.21,"displayStart":5409.71,"displayEnd":5417.21,"displayMid":5413.46,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":1.049524,"pitch":24.347635,"speechRate":5.579,"hasEvents":true,"sentence_source":"所以你看有些时候，就是这样的一些巧合的一些时间节点，你会发现啊 无论怎样 生活依然在继续。","sentence_en":"So you see, sometimes with such coincidences of timing, you realize that no matter what, life still goes on."},{"id":"648","start":5417.71,"end":5429.33,"displayStart":5417.71,"displayEnd":5429.33,"displayMid":5423.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.6,"loudness":0.849722,"pitch":20.489643,"speechRate":5.762,"hasEvents":true,"sentence_source":"千载难逢 开摘节对伊斯兰的信徒来说是很重要的节日，就是他们的过年 然后努力直接对伊朗人说也很重要，是传统的波斯的新年 所以真的是我在这待20年。","sentence_en":"A once-in-a-lifetime coincidence. Chaharshanbe Suri is an important festival for Islamic believers—it's their New Year. And Nowruz is also important for Iranians—it's the traditional Persian New Year. So really, I've been here 20 years."},{"id":"649","start":5429.33,"end":5443.29,"displayStart":5429.33,"displayEnd":5443.29,"displayMid":5436.3099999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Negative","score":-0.6,"loudness":0.869865,"pitch":19.419365,"speechRate":5.139,"hasEvents":false,"sentence_source":"我第一次碰到这样的一个节日 双节同时过 初期过开摘，努力直接过伊朗的传统新年 这是一个多么好的年份呀，人们多么期待呀 都是喜气哑哑的 但是没想到就战争打响了。","sentence_en":"This is the first time I've encountered such a festival—two holidays coinciding: first Chaharshanbe Suri, then Nowruz, the traditional Iranian New Year. What a good year it was! People were so expectant, all joyful. But unexpectedly, war broke out."},{"id":"650","start":5443.69,"end":5446.93,"displayStart":5443.69,"displayEnd":5446.93,"displayMid":5445.3099999999995,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":1.173719,"pitch":21.38229,"speechRate":6.656,"hasEvents":false,"sentence_source":"开摘节对我来说是个从小就很熟悉的一个词汇。","sentence_en":"Opening Harvest Festival is a term I've been familiar with since childhood."},{"id":"651","start":5446.93,"end":5459.25,"displayStart":5446.93,"displayEnd":5459.25,"displayMid":5453.09,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.4,"loudness":0.93442,"pitch":20.108963,"speechRate":5.276,"hasEvents":false,"sentence_source":"因为我父亲是回族 会讲开摘节 国尔邦节，我就知道那是他们就信仰的可能一部分，你们发现人如果在这样时刻还有一些信仰，能够坚持自己特别传统的生活。","sentence_en":"Because my father is Hui and would talk about Opening Harvest Festival and Eid al-Adha, I knew that was part of their faith. You notice that if people still have faith in such times and can hold onto their very traditional lives."},{"id":"652","start":5459.25,"end":5462.01,"displayStart":5459.25,"displayEnd":5462.01,"displayMid":5460.63,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Neutral","score":0,"loudness":1.107005,"pitch":18.666052,"speechRate":3.986,"hasEvents":false,"sentence_source":"其实就是对抗这种不确定。","sentence_en":"It's essentially a way to counter this uncertainty."},{"id":"653","start":5462.01,"end":5471.63,"displayStart":5462.01,"displayEnd":5471.63,"displayMid":5466.82,"speaker":"Li Rui","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Iranian History, Culture, and National Identity","sentiment_en":"Positive","score":0.6,"loudness":1.02866,"pitch":20.751188,"speechRate":5.821,"hasEvents":false,"sentence_source":"对抗残酷对抗战争一个特别好的一个方式，就无论怎样我让一切尽可能的如常，普通人就是我们唯一的反抗，最小单位的反抗方式好像。","sentence_en":"It's a particularly good way to confront cruelty and war—by keeping everything as normal as possible. Ordinary people are our only resistance, the smallest unit of resistance it seems."},{"id":"654","start":5471.63,"end":5483.45,"displayStart":5471.63,"displayEnd":5483.45,"displayMid":5477.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.6,"loudness":0.834736,"pitch":18.047428,"speechRate":5.328,"hasEvents":false,"sentence_source":"我觉得这不仅是宗教信仰吧 包括开摘节 包括他们那个奴隆子节，这是他内心的一种热爱 对生活 对传统的热爱，不仅是开摘节 我奴隆子节我还要过。","sentence_en":"I think this is not just religious faith—including Opening Harvest Festival and their Nowruz festival. It's a love within the heart, a love for life and tradition. Not just Opening Harvest Festival, I also celebrate Nowruz."},{"id":"655","start":5483.45,"end":5490.89,"displayStart":5483.45,"displayEnd":5490.89,"displayMid":5487.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.856468,"pitch":17.897001,"speechRate":5.227,"hasEvents":false,"sentence_source":"哪怕你炮弹打过来 我还是要把家里装饰的一心迎接新年的到来，这个我觉得是人性的力量。","sentence_en":"Even if shells are falling, I still decorate the house wholeheartedly to welcome the new year. I think this is the power of humanity."},{"id":"656","start":5491.34,"end":5494.96,"displayStart":5491.34,"displayEnd":5494.96,"displayMid":5493.15,"speaker":"Li Rui","speakerColor":"#A29479","cluster":10,"clusterLabel":"C10","clusterName":"Artistic Creation and Cultural Expression","sentiment_en":"Neutral","score":0,"loudness":0.96725,"pitch":26.314703,"speechRate":5.74,"hasEvents":false,"sentence_source":"我现在能看到你背后你们家挂着有一幅书法。","sentence_en":"I can see a calligraphy piece hanging behind you in your home."},{"id":"657","start":5494 I didn't want you to give it to me because I know painting is hard work for you. She said, 'No need, you like her and I like her too. She represents the beauty of Iran,' and gave it to me. I hung it on the wall. Not long after, I heard she had passed away. I went to her garden again to see it."},{"id":"664","start":5553.56,"end":5556.12,"displayStart":5553.56,"displayEnd":5556.12,"displayMid":5554.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Artistic Creation and Cultural Expression","sentiment_en":"Neutral","score":0,"loudness":1.15003,"pitch":11.972596,"speechRate":6.682,"hasEvents":false,"sentence_source":"就在塔志历史广场 那块有一个小店。","sentence_en":"Near Tajrish Historical Square, there's a small shop."},{"id":"665","start":5556.12,"end":5561.94,"displayStart":5556.12,"displayEnd":5561.94,"displayMid":5559.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Artistic Creation and Cultural Expression","sentiment_en":"Negative","score":-0.3,"loudness":0.846683,"pitch":13.504987,"speechRate":4.467,"hasEvents":false,"sentence_source":"那块已经关掉了，就是无限称王 所以我看到他就会想起他真好。","sentence_en":"That part has been shut down, it's 'Infinite King' or something, so whenever I see him, I think of how great he was."},{"id":"666","start":5561.94,"end":5576.8,"displayStart":5561.94,"displayEnd":5576.8,"displayMid":5569.37,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":1.039874,"pitch":24.002342,"speechRate":4.702,"hasEvents":false,"sentence_source":"我希望我有机会能够再去伊朗，战争肯定会结束 我知道伊朗有全世界，除了西方可能欧美国家以外，最大的最好的现当代化的收藏，就是伊朗末代皇后 法拉赫皇后。","sentence_en":"I hope I get the chance to go to Iran again. The war will end eventually. I know Iran has the largest and best collection of modern and contemporary art outside the West—owned by the last queen, Farah Pahlavi."},{"id":"667","start":5576.8,"end":5583.58,"displayStart":5576.8,"displayEnd":5583.58,"displayMid":5580.1900000000005,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.987851,"pitch":21.87163,"speechRate":5.465,"hasEvents":false,"sentence_source":"他当时请摩摩 请苏福比琴，大家都会帮他去收藏的，他说我们买不起你们西方的古代艺术。","sentence_en":"Back then, he hired experts like 'Momo' and Sotheby's to help him collect. He said, 'We can't afford your ancient Western art."},{"id":"668","start":5583.58,"end":5596.78,"displayStart":5583.58,"displayEnd":5596.78,"displayMid":5590.18,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.941182,"pitch":23.231983,"speechRate":5.515,"hasEvents":false,"sentence_source":"但是我们可以买你们西方的现当代艺术，他真的 现在伊朗有全世界最牛的现当代艺术，都是什么罗斯科德库宁 什么甲科梅地培根，哇 说特别特别棒 我期待有一天我能够去看。","sentence_en":"But we can buy your modern and contemporary art. And now Iran has the world's best collection—Rothko, de Kooning, Giacometti, Bacon. Amazing. I can't wait to see it one day."},{"id":"669","start":5596.78,"end":5603.74,"displayStart":5596.78,"displayEnd":5603.74,"displayMid":5600.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":1.009261,"pitch":23.288593,"speechRate":5.891,"hasEvents":false,"sentence_source":"当时太匆匆了 而且伊朗现在变化很大，我相信战争之后它会变得更好，但你更好的时候你再来看它。","sentence_en":"I was in a hurry then, and Iran has changed a lot. I believe it will be even better after the war. Come see it when it's improved."},{"id":"670","start":5603.74,"end":5616.72,"displayStart":5603.74,"displayEnd":5616.72,"displayMid":5610.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":1.081148,"pitch":20.941208,"speechRate":5.09,"hasEvents":false,"sentence_source":"那时候我希望所有的库藏都能拿出来让大家看，我偶尔也看一看 现在艺术馆是法勒河王后姆，他亲自布置 亲自买的那些画，都非常的漂亮 世界是绝一无二的。","sentence_en":"I hope that then all the collections will be open to the public. I sometimes look—now the museum is named after Queen Farah. She personally arranged and bought those paintings. They're beautiful, truly one of a kind."},{"id":"671","start":5616.72,"end":5630.26,"displayStart":5616.72,"displayEnd":5630.26,"displayMid":5623.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":1.014677,"pitch":20.0858,"speechRate":4.968,"hasEvents":false,"sentence_source":"除了这些话 你还可以看到很多伊朗的这些没有开发的文明遗址，包括塔庙 因为我学古代东方文明 我就说那两千多年，伊拉克有塔庙 但被伊拉克战争给炸掉了。","sentence_en":"Besides that, you can see many undeveloped historical sites in Iran, including ziggurats. I studied ancient Eastern civilizations, so I know that Iraq had ziggurats too, but they were destroyed in the Iraq war."},{"id":"672","start":5630.26,"end":5643.88,"displayStart":5630.26,"displayEnd":5643.88,"displayMid":5637.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.4,"loudness":0.998582,"pitch":19.086939,"speechRate":4.98,"hasEvents":false,"sentence_source":"现在在伊朗境内靠近胡志斯坦和伊拉克的边境，就有一个非常好塔庙 是由德国人开发上世纪30年代，展现了两个文明流域当时的一个著名的一个文明的几点。","sentence_en":"Now, near Khuzestan and the Iraq border in Iran, there's a great ziggurat excavated by Germans in the 1930s. It shows aspects of a famous civilization from two river valleys."},{"id":"673","start":5643.88,"end":5657.16,"displayStart":5643.88,"displayEnd":5657.16,"displayMid":5650.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.985277,"pitch":19.424309,"speechRate":5.723,"hasEvents":false,"sentence_source":"因为古代东方没有三个，一个是它的唐庙还有一个是滚印，还有一个写信文字 这三个特征，但我们在伊拉克已经很难看到这样完整的唐庙，只有伊朗还有一个，崔建宁下次来一定来看看。","sentence_en":"Ancient Eastern civilization had three hallmarks: ziggurats, cylinder seals, and cuneiform writing. In Iraq, it's hard to find a complete ziggurat now, but Iran still has one. You must come see it next time."},{"id":"674","start":5657.16,"end":5668.54,"displayStart":5657.16,"displayEnd":5668.54,"displayMid":5662.85,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.888949,"pitch":20.821516,"speechRate":4.745,"hasEvents":false,"sentence_source":"一定会再去的，期待那天能够很快的到来，我会继续在这边追你的报导，包括文字报导，你所有的报导我们在这边都是在关注在看到。","sentence_en":"I'll definitely go again. I hope that day comes soon. I'll keep following your reports, including your written articles. We're all following and watching your coverage."},{"id":"675","start":5668.54,"end":5672.84,"displayStart":5668.54,"displayEnd":5672.84,"displayMid":5670.6900000000005,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.976384,"pitch":24.224987,"speechRate":6.294,"hasEvents":false,"sentence_source":"当你知道你的报导是被人看到 被人关注的时候 就不会有孤独感。","sentence_en":"When you know your reports are being seen and followed, you don't feel lonely."},{"id":"676","start":5672.84,"end":5684.46,"displayStart":5672.84,"displayEnd":5684.46,"displayMid":5678.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.4,"loudness":1.00715,"pitch":18.241802,"speechRate":5.061,"hasEvents":false,"sentence_source":"对 而且是高兴 因为很多人跟我一起分享，也有人马上骂我 你是什么西方的宣传啊，或者什么 你是这边伊朗政府的宣传卢 就有好多人这样说。","sentence_en":"Yes, and it's a joy because many share it with me. But some people immediately scold me, saying I'm Western propaganda or Iranian government propaganda. Many say that."},{"id":"677","start":5684.46,"end":5688.74,"displayStart":5684.46,"displayEnd":5688.74,"displayMid":5686.6,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.234224,"pitch":23.001043,"speechRate":5.607,"hasEvents":false,"sentence_source":"所以必然会有一个宣传是吗 不管给谁 必须给一个人宣传。","sentence_en":"So there must be some kind of promotion, right? To whomever, it has to be for someone."},{"id":"678","start":5688.74,"end":5689.9,"displayStart":5688.74,"displayEnd":5689.9,"displayMid":5689.32,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.040088,"pitch":28.966866,"speechRate":1.724,"hasEvents":false,"sentence_source":"对但。","sentence_en":"Yes, but..."},{"id":"679","start":5689.9,"end":5705.5,"displayStart":5689.9,"displayEnd":5705.5,"displayMid":5697.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.94191,"pitch":23.085375,"speechRate":5.128,"hasEvents":false,"sentence_source":"我为什么要宣传呢 我记录这些 我只是记录这个真实的一面，我眼中看到的 也许你觉得这个并不全面并不客观，确实我也不能保证它是全面客观，毕竟我一个人看 伊朗那么大 有9000万人口。","sentence_en":"Why do I need to promote? I’m just documenting what I see—the real side. Maybe you think it’s not comprehensive or objective. I can’t guarantee it is, because I’m only one person. Iran is huge, with 90 million people."},{"id":"680","start":5705.5,"end":5708.36,"displayStart":5705.5,"displayEnd":5708.36,"displayMid":5706.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.809448,"pitch":10.674788,"speechRate":5.594,"hasEvents":false,"sentence_source":"我也不可能所有的事情都能够报道到。","sentence_en":"I can’t cover everything."},{"id":"681","start":5708.36,"end":5717.22,"displayStart":5708.36,"displayEnd":5717.22,"displayMid":5712.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.85806,"pitch":17.824579,"speechRate":5.236,"hasEvents":false,"sentence_source":"但是我只是提出一个角度 我更关注的就是，眼下伊朗所经历的困境和每一个普通人，我见到的那些人的挣扎。","sentence_en":"But I’m just offering one perspective. What I focus on is the current struggles Iran faces and the ordinary people I meet, their struggles."},{"id":"682","start":5717.22,"end":5721.36,"displayStart":5717.22,"displayEnd":5721.36,"displayMid":5719.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.915084,"pitch":23.037386,"speechRate":5.355,"hasEvents":false,"sentence_source":"我觉得你们喜欢我 特别高兴 因为也是我喜欢的。","sentence_en":"I’m really happy you like me—because I like you too."},{"id":"683","start":5721.36,"end":5724.76,"displayStart":5721.36,"displayEnd":5724.76,"displayMid":5723.0599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.825101,"pitch":19.28998,"speechRate":5.863,"hasEvents":false,"sentence_source":"所以你说你给看了给我很大的鼓励 谢谢你。","sentence_en":"So, you said sharing this gave me a lot of encouragement. Thank you."},{"id":"684","start":5725.18,"end":5735.88,"displayStart":5725.18,"displayEnd":5735.88,"displayMid":5730.530000000001,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.924385,"pitch":23.040094,"speechRate":5.234,"hasEvents":true,"sentence_source":"你也给了我很大的鼓励 我觉得我们做的工作非常有意义，只是我们在战争一个又一个历史性的时刻，我特别希望你工作 生活保证安全。","sentence_en":"You’ve given me a lot of encouragement too. I think our work is very meaningful. But we’re experiencing historic moments one after another. I really hope you stay safe in your work and life."},{"id":"685","start":5736.56,"end":5739.7,"displayStart":5736.56,"displayEnd":5739.7,"displayMid":5738.13,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.968383,"pitch":24.552423,"speechRate":5.085,"hasEvents":true,"sentence_source":"然后一定要保证自己内心的平衡吧。","sentence_en":"And make sure to keep your inner balance."},{"id":"686","start":5739.7,"end":5751.76,"displayStart":5739.7,"displayEnd":5751.76,"displayMid":5745.73,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.065006,"pitch":23.918842,"speechRate":6.109,"hasEvents":false,"sentence_source":"因为对我们来说可能我们保持自己的那个 sanity，就是我们情绪要稳定 一切要正常才能够更好的工作，但你看记者就是这样的 因为我们很易感，才能够做好这个工作。","sentence_en":"For us, maintaining our sanity—keeping our emotions stable and everything normal—helps us work better. But as journalists, we are highly sensitive, and that’s what makes us good at this job."},{"id":"687","start":5751.76,"end":5759.1,"displayStart":5751.76,"displayEnd":5759.1,"displayMid":5755.43,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.03002,"pitch":25.824335,"speechRate":5.041,"hasEvents":false,"sentence_source":"可是易感的人又很容易被周围的环境，别人的冷暖疼痛 脂底内心也会被它影响 会被伤到。","sentence_en":"Yet sensitive people can easily be affected by their surroundings—by others’ pain, warmth, and coldness. It touches our hearts and can hurt us."},{"id":"688","start":5759.1,"end":5763.68,"displayStart":5759.1,"displayEnd":5763.68,"displayMid":5761.39,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.850757,"pitch":23.161615,"speechRate":4.949,"hasEvents":false,"sentence_source":"所以很矛盾 就是尽可能地保护好自己工作中的状态。","sentence_en":"So it’s contradictory. We have to protect our work state as much as possible."},{"id":"689","start":5763.68,"end":5768.62,"displayStart":5763.68,"displayEnd":5768.62,"displayMid":5766.15,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.083306,"pitch":26.437477,"speechRate":5.339,"hasEvents":false,"sentence_source":"因为我看一下你的工作的时间 你的工作量是非常可怕的。","sentence_en":"Looking at your work schedule, your workload is terrifying."},{"id":"690","start":5768.62,"end":5779.06,"displayStart":5768.62,"displayEnd":5779.06,"displayMid":5773.84,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.942598,"pitch":21.482292,"speechRate":4.861,"hasEvents":false,"sentence_source":"因为你的创作能力又很旺盛，你每次写的文字 我觉得得有几千字吧，感觉是信守年来的那种样子，就是提忙的 我就有说写。","sentence_en":"Your creative output is so strong. Every time you write, it must be thousands of words. It feels like you’re always busy, so you just write as you speak."},{"id":"691","start":5779.16,"end":5793.8,"displayStart":5779.16,"displayEnd":5793.8,"displayMid":5786.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.92243,"pitch":19.608896,"speechRate":5.417,"hasEvents":false,"sentence_source":"写着就睡着了，就是 我怕我自己忘了 我还把它录起来，录下来 这样我能写下来 不然我就会忘掉，毕竟年纪也到了嘛 有时候就是忘东忘西的，为什么会坚持把它写下来 其实就像我跟你虚说一样。","sentence_en":"And I fall asleep while writing. I’m afraid I’ll forget, so I record it. Then I can transcribe it, otherwise I’d lose it. I’m getting older, you know—I forget things left and right. Why do I insist on writing it down? Actually, like I told you when we talked..."},{"id":"692","start":5793.8,"end":5797.74,"displayStart":5793.8,"displayEnd":5797.74,"displayMid":5795.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.914613,"pitch":21.910831,"speechRate":4.485,"hasEvents":false,"sentence_source":"虚说的时候是有想哭 也就想落泪的冲动。","sentence_en":"When we talk, I feel like crying, like tears are about to fall."},{"id":"693","start":5797.74,"end":5807.8,"displayStart":5797.74,"displayEnd":5807.8,"displayMid":5802.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.898452,"pitch":18.757832,"speechRate":4.871,"hasEvents":false,"sentence_source":"但是也是一种誓然的 某种意义上你也是我的心意一生，就是我们在交流的过程中 也是在亲戚的过程，服务自己的过程。","sentence_en":"But it’s also a kind of release. In a way, you are my confidant. As we communicate, we heal—we serve ourselves."},{"id":"694","start":5808.58,"end":5821.98,"displayStart":5808.58,"displayEnd":5821.98,"displayMid":5815.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.964845,"pitch":18.106745,"speechRate":4.776,"hasEvents":false,"sentence_source":"其实写也是一样的，就是我把它写下来 这一天我所经历的，窗商也好 看到的惨识也好 听到的那些话也好，又让我背 又让我洗 就像你说我们是非常感兴的吧。","sentence_en":"Writing is the same. I jot down what I experienced that day—the injuries I saw, the tragedies, the words I heard. They weigh on me and cleanse me at the same time. Just like you said, we are very empathetic."},{"id":"695","start":5821.98,"end":5828.32,"displayStart":5821.98,"displayEnd":5828.32,"displayMid":5825.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.987677,"pitch":23.13662,"speechRate":4.89,"hasEvents":false,"sentence_source":"我们就要去体会到别人的这种悲伤 离合，同时我要想办法在理性的去报道。","sentence_en":"We have to feel others’ sorrow and separation, while also staying rational in our reporting."},{"id":"696","start":5828.32,"end":5830.82,"displayStart":5828.32,"displayEnd":5830.82,"displayMid":5829.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.818057,"pitch":17.520599,"speechRate":4.4,"hasEvents":false,"sentence_source":"其实是每一天也是很难的。","sentence_en":"Every day is tough."},{"id":"697","start":5830.82,"end":5845.96,"displayStart":5830.82,"displayEnd":5845.96,"displayMid":5838.389999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.934716,"pitch":26.330612,"speechRate":4.985,"hasEvents":false,"sentence_source":"你的工作非常有意义 被很多人看到，我看到你在出租车上的报道，可能是你家天台上的报道，还有那天有爆炸的时候，你躲在你们家卫生间，你认为最重的那根横凉下面的那个瞬间。","sentence_en":"Your work is very meaningful and seen by many. I saw your report from a taxi, maybe from the rooftop of your home. And on that day of explosions, when you hid in your bathroom, under what you thought was the sturdiest beam—that moment."},{"id":"698","start":5845.96,"end":5851.86,"displayStart":5845.96,"displayEnd":5851.86,"displayMid":5848.91,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.907138,"pitch":21.646997,"speechRate":3.072,"hasEvents":false,"sentence_source":"作为同行我内心无比的尊敬，表达敬意谢谢。","sentence_en":"As a colleague, I feel immense respect. I express my respect and thanks."},{"id":"699","start":5851.86,"end":5855,"displayStart":5851.86,"displayEnd":5855,"displayMid":5853.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.249654,"pitch":28.014107,"speechRate":6.164,"hasEvents":false,"sentence_source":"我相信如果鲁豫是你在的话，你也会这么做。","sentence_en":"I believe if Luyu were you, you would do the same."},{"id":"700","start":5855,"end":5865,"displayStart":5855,"displayEnd":5865,"displayMid":5860,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.964851,"pitch":16.17137,"speechRate":6.283,"hasEvents":false,"sentence_source":"我觉得我自己也没有太勇敢，只是尽自己的职责吧 尽自己的本分，我相信我们有很多优秀的记者，如果他们现在在这，可能做的还比我要好更勇敢。","sentence_en":"I don’t think I’m that brave. I’m just doing my duty, fulfilling my responsibility. I believe there are many excellent journalists who, if they were here, might do even better and be braver than me."},{"id":"701","start":5865,"end":5868.9,"displayStart":5865,"displayEnd":5868.9,"displayMid":5866.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.027269,"pitch":24.754183,"speechRate":6.525,"hasEvents":false,"sentence_source":"但是我觉得就是你到这个份上你就必须做这样的事情。","sentence_en":"But I think when you’re in that position, you have to do such things."},{"id":"702","start":5868.9,"end":5872.52,"displayStart":5868.9,"displayEnd":5872.52,"displayMid":5870.71,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.922442,"pitch":26.385489,"speechRate":6.906,"hasEvents":false,"sentence_source":"我非常认同你说的，我也相信如果我在那个地方我也不会怂。","sentence_en":"I totally agree with you. I also believe that if I were there, I wouldn't back down either."},{"id":"703","start":5872.52,"end":5884.8,"displayStart":5872.52,"displayEnd":5884.8,"displayMid":5878.66,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.052158,"pitch":28.541893,"speechRate":5.643,"hasEvents":false,"sentence_source":"但是我想跟各位传达的就是，为什么是李睿因为她曾经在有一年她就学了波斯语，哪怕波斯语在当时她完全不知道是什么，哪怕波斯语当时不是最热门的那个专业。","sentence_en":"But what I want to convey to everyone is why it was Li Rui. Because one year, she chose to study Persian, even though she had no idea what it was at the time, and even though Persian wasn't the most popular major."},{"id":"704","start":5884.8,"end":5893.26,"displayStart":5884.8,"displayEnd":5893.26,"displayMid":5889.030000000001,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":1.030169,"pitch":28.458036,"speechRate":5.201,"hasEvents":false,"sentence_source":"所以永远不要听别人讲什么文科不流行了，什么某一个专业不时髦了，你就跟着你自己内心的那个感觉走。","sentence_en":"So never listen to others saying humanities are out of fashion, or a certain major isn't trendy. Just follow what your heart tells you."},{"id":"705","start":5893.26,"end":5906.42,"displayStart":5893.26,"displayEnd":5906.42,"displayMid":5899.84,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.987097,"pitch":27.622194,"speechRate":5.471,"hasEvents":false,"sentence_source":"然后你会走到一个你该走的那个方向，尤其现在你不要被那个AI吓倒，当李睿走到伊朗老百姓当中，人们会感动说这样一个来自外国的一个女性，一个女记者她会我的语言。","sentence_en":"Then you'll find the direction you're meant to go. Especially now, don't be intimidated by AI. When Li Rui goes among ordinary Iranians, they are moved that a foreign woman, a female journalist, can speak their language."},{"id":"706","start
