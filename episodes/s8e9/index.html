":0.981001,"pitch":24.045347,"speechRate":5.728,"hasEvents":false,"sentence_source":"但是作为记者的那个李睿，他内心又处于一种职业的亢奋，好像不眠不休 我干净十足，这种割裂状态是不是就容易产生我们说的PTSD是有。","sentence_en":"But as a journalist, Li Rui is professionally excited—seemingly tireless and full of energy. Isn't this fragmented state likely to cause what we call PTSD? Yes."},{"id":"174","start":1298.15,"end":1301.83,"displayStart":1298.15,"displayEnd":1301.83,"displayMid":1299.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":1.160491,"pitch":24.376335,"speechRate":5.187,"hasEvents":false,"sentence_source":"的时候我会晚上睡不着觉 听到外面的声音。","sentence_en":"Sometimes I can't sleep at night, hearing sounds outside."},{"id":"175","start":1301.83,"end":1317.05,"displayStart":1301.83,"displayEnd":1317.05,"displayMid":1309.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.971915,"pitch":19.488699,"speechRate":5.197,"hasEvents":false,"sentence_source":"因为我们有时候出去采访非常紧张的，不确定性太大 有好几次差点跟导弹 袭击擦身而过，另外看到太多的惨事 我在这里生活了20年，我没有觉得自己是一个外人，这里就像是我的第二故乡。","sentence_en":"Because we go out for interviews in very tense situations, with huge uncertainty. Several times we narrowly missed missile attacks. Also, I've seen too many tragedies. I've lived here for 20 years and don't feel like an outsider; this is like my second home."},{"id":"176","start":1317.05,"end":1324.93,"displayStart":1317.05,"displayEnd":1324.93,"displayMid":1320.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.927679,"pitch":18.707609,"speechRate":4.822,"hasEvents":false,"sentence_source":"我每次看到这边我喜欢的地方被炸，听到的人们给我讲的各种惨事，我就会觉得心意很难过。","sentence_en":"Every time I see places I love here bombed, or hear people tell me about all kinds of horrors, I feel heartbroken."},{"id":"177","start":1324.93,"end":1330.55,"displayStart":1324.93,"displayEnd":1330.55,"displayMid":1327.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.90763,"pitch":19.649006,"speechRate":5.694,"hasEvents":false,"sentence_source":"所以不仅是这一次 上一次12日战争的时候，我没有觉得我自己有PTSD。","sentence_en":"So it's not just this time. During the previous 12-day war, I didn't think I had PTSD."},{"id":"178","start":1330.55,"end":1336.41,"displayStart":1330.55,"displayEnd":1336.41,"displayMid":1333.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.049473,"pitch":21.896828,"speechRate":4.266,"hasEvents":false,"sentence_source":"但是我的一个前同事 也是凤凰的，他看到了我新加写的日志。","sentence_en":"But a former colleague of mine, also from Phoenix, saw my log I wrote recently."},{"id":"179","start":1336.41,"end":1343.53,"displayStart":1336.41,"displayEnd":1343.53,"displayMid":1339.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.940128,"pitch":15.981196,"speechRate":5.056,"hasEvents":false,"sentence_source":"因为他以前也去朝鲜采访过，也有点问题，像我这样睡不着，或者是情绪比较激动 老想哭。","sentence_en":"Because he had also been on assignment in North Korea, and had some issues too—like me, unable to sleep, or getting emotional and wanting to cry."},{"id":"180","start":1343.53,"end":1353.63,"displayStart":1343.53,"displayEnd":1353.63,"displayMid":1348.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":0.916238,"pitch":14.766885,"speechRate":5.347,"hasEvents":false,"sentence_source":"所以他跟我说 你最好找一个人帮你书导一下，他就给我介绍了心理咨询，我就跟他联系 讲了讲我现在的心情，或者他帮我书导一下。","sentence_en":"So he told me I should find someone to help guide me. He then introduced me to a psychological counselor. I contacted him and talked about my current feelings, and he helped guide me."},{"id":"181","start":1353.63,"end":1361.29,"displayStart":1353.63,"displayEnd":1361.29,"displayMid":1357.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.962343,"pitch":21.625881,"speechRate":3.786,"hasEvents":false,"sentence_source":"我觉得还挺有用的，这一次也是会有点板上悲伤 焦虑，还有一种无奈感。","sentence_en":"I found it quite helpful. This time I also feel a bit of sadness, anxiety, and a sense of helplessness."},{"id":"182","start":1361.29,"end":1368.37,"displayStart":1361.29,"displayEnd":1368.37,"displayMid":1364.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.919875,"pitch":15.449279,"speechRate":4.619,"hasEvents":false,"sentence_source":"所以晚上我会开始写日志，写日志的目的也是把这些事情我想记录下来。","sentence_en":"So at night I start writing a log. The purpose is to record these things."},{"id":"183","start":1368.37,"end":1379.39,"displayStart":1368.37,"displayEnd":1379.39,"displayMid":1373.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.021427,"pitch":22.491524,"speechRate":4.57,"hasEvents":false,"sentence_source":"因为我觉得这些普通人的悲欢 离合 内心挣扎，我没有办法用镜头去讲述，两分钟的新闻根本就没有把所有的全貌说清楚。","sentence_en":"Because I feel that the joys and sorrows, separations and reunions, and inner struggles of ordinary people cannot be captured by my camera; a two-minute news report simply cannot tell the whole story."},{"id":"184","start":1379.39,"end":1385.69,"displayStart":1379.39,"displayEnd":1385.69,"displayMid":1382.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.022393,"pitch":13.905954,"speechRate":6.065,"hasEvents":false,"sentence_source":"所以想把它记下来，另一个我觉得也是对我自己的一种安慰，当我把这些东西写下来的时候。","sentence_en":"So I want to record it. Also, I think it's a comfort to myself when I write these things down."},{"id":"185","start":1385.69,"end":1387.63,"displayStart":1385.69,"displayEnd":1387.63,"displayMid":1386.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.879626,"pitch":15.491859,"speechRate":5.155,"hasEvents":false,"sentence_source":"其实也是在鼓励我自己。","sentence_en":"It's also encouraging myself."},{"id":"186","start":1389.01,"end":1402.79,"displayStart":1389.01,"displayEnd":1402.79,"displayMid":1395.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.811336,"pitch":19.711496,"speechRate":4.354,"hasEvents":false,"sentence_source":"你，最近这次战争爆发以来 哭的词数多吗 掉过眼泪吗，掉过 有时候诉说的时候 就会动不动的想哭吧，我是觉得 我不是因为害怕哭 我是因为心痛哭。","sentence_en":"You, since this war broke out, have you cried often? Shed tears? Yes, sometimes when I talk about it, I can't help but want to cry. I feel I don't cry out of fear, but out of heartache."},{"id":"187","start":1402.79,"end":1407.57,"displayStart":1402.79,"displayEnd":1407.57,"displayMid":1405.1799999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.80027,"pitch":19.32819,"speechRate":4.184,"hasEvents":false,"sentence_source":"我在古列斯坦宫看到那个情景 就是让我很难过。","sentence_en":"The scene I saw at Golestan Palace really saddened me."},{"id":"188","start":1407.57,"end":1420.45,"displayStart":1407.57,"displayEnd":1420.45,"displayMid":1414.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.6,"loudness":0.816858,"pitch":19.66975,"speechRate":4.27,"hasEvents":false,"sentence_source":"因为我去过很多次 我很喜欢那里 美丽的古列斯坦宫，他是古博斯的建筑 其中有个特征叫奥运，奥运就是装饰 房顶是那种小的玻璃片。","sentence_en":"Because I've been there many times; I love that place, the beautiful Golestan Palace. It's a Qajar-era building with a feature called 'Ovan'—decorations made of small glass pieces on the ceiling."},{"id":"189","start":1420.45,"end":1435.93,"displayStart":1420.45,"displayEnd":1435.93,"displayMid":1428.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.851846,"pitch":15.898602,"speechRate":4.328,"hasEvents":false,"sentence_source":"无数个镜片 拼成的这种墙面和房顶，你进去就觉得特别的璀璨辉煌 晃眼睛，每一个玻璃怎么切怎么贴 这是花出很多心血，200多年 他一直在那里 但这一次战争。","sentence_en":"Countless mirror pieces form the walls and ceiling; when you enter, it's dazzling and brilliant. Each piece cut and placed with so much effort. For over 200 years it stood there, but this war..."},{"id":"190","start":1435.93,"end":1441.41,"displayStart":1435.93,"displayEnd":1441.41,"displayMid":1438.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.932906,"pitch":15.913053,"speechRate":4.927,"hasEvents":false,"sentence_source":"他的镜面全部倒塌了 就是全掉下了，他不是被炸 而是旁边的被炸。","sentence_en":"All the mirrors collapsed, fell down. It wasn't directly bombed, but the blast from nearby."},{"id":"191","start":1441.41,"end":1444.03,"displayStart":1441.41,"displayEnd":1444.03,"displayMid":1442.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.786022,"pitch":11.968405,"speechRate":4.962,"hasEvents":false,"sentence_source":"然后他被剥击 剥地都掉了一滴。","sentence_en":"Then it was impacted, and pieces kept falling."},{"id":"192","start":1444.65,"end":1447.31,"displayStart":1444.65,"displayEnd":1447.31,"displayMid":1445.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.061255,"pitch":18.659088,"speechRate":4.511,"hasEvents":false,"sentence_source":"那个感觉太难过了 变丑陋了。","sentence_en":"That feeling was so sad; it became ugly."},{"id":"193","start":1447.31,"end":1460.35,"displayStart":1447.31,"displayEnd":1460.35,"displayMid":1453.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.839764,"pitch":19.267616,"speechRate":4.272,"hasEvents":false,"sentence_source":"所以我就当时有点难过的想哭，还有就是有的时候在交流的时候，平常也来不及想 但是跟你交流的时候，就会有一种悲伤无奈的感觉。","sentence_en":"So at that moment I felt like crying from sadness. Also, sometimes when talking, I usually don't have time to think, but when communicating with you, a feeling of sorrow and helplessness arises."},{"id":"194","start":1460.35,"end":1467.55,"displayStart":1460.35,"displayEnd":1467.55,"displayMid":1463.9499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.866443,"pitch":22.989763,"speechRate":4.397,"hasEvents":false,"sentence_source":"会涌上心头 说不上的难过，又很无助 也很无奈，我也不知道自己能做些什么。","sentence_en":"It wells up in my heart—an indescribable sadness, helpless and powerless. I don't know what I can do."},{"id":"195","start":1467.55,"end":1476.25,"displayStart":1467.55,"displayEnd":1476.25,"displayMid":1471.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.985904,"pitch":20.162476,"speechRate":4.483,"hasEvents":false,"sentence_source":"但是看到这些产士会让我觉得为什么非要发动战争呢，无论什么理由 什么方式 或者是什么人。","sentence_en":"But seeing these things makes me think, why must we start a war? No matter the reason, the method, or who is involved."},{"id":"196","start":1476.25,"end":1491.39,"displayStart":1476.25,"displayEnd":1491.39,"displayMid":1483.8200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.814677,"pitch":21.635458,"speechRate":4.491,"hasEvents":false,"sentence_source":"我觉得都不应该 因为他毁灭的不是一个政权 我觉得，他带来更多的是伤痛 不仅是这个国家文明的这种摧残损坏，还有就是对于老百姓 普通人 即使你的家没有被炸。","sentence_en":"I think it shouldn't happen, because it doesn't destroy just a regime; it brings more pain—not only devastation to the country's civilization, but also to ordinary people. Even if your home isn't bombed,"},{"id":"197","start":1491.39,"end":1504.89,"displayStart":1491.39,"displayEnd":1504.89,"displayMid":1498.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.852136,"pitch":19.060141,"speechRate":4.889,"hasEvents":false,"sentence_source":"即使你的亲人没有被炸死 你天天在这种炮火当中，不确定感 孩子害怕会哭，你也天天在这样的惊吓当中，不知道明天会什么 这是一种创伤，如果说我有PDSD。","sentence_en":"Even if your loved ones aren't killed, you live daily amid gunfire and bombs, with uncertainty. Children cry in fear, and you're in constant shock, not knowing what tomorrow holds. This is trauma. If I have PTSD,"},{"id":"198","start":1504.89,"end":1517.25,"displayStart":1504.89,"displayEnd":1517.25,"displayMid":1511.0700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.971787,"pitch":16.334696,"speechRate":5.016,"hasEvents":true,"sentence_source":"我觉得现在整个德黑来人都有PDSD，我昨天楼下的小孩 17、18岁，在那打篮球 太闷了 在家待着没事，他打我当时就以为是轰炸开始了，声音很大。","sentence_en":"I think now everyone in Tehran has PTSD. Yesterday, a kid downstairs, about 17 or 18, was playing basketball—bored, stuck at home. When he dribbled loudly, I immediately thought a bombing had started."},{"id":"199","start":1517.73,"end":1533.43,"displayStart":1517.73,"displayEnd":1533.43,"displayMid":1525.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.826772,"pitch":19.233915,"speechRate":5.038,"hasEvents":true,"sentence_source":"然后我把我自己吓到 但我没有说话，后来我听到有邻居者忍不住打，打开窗户 大骂，就说受不了了 快停下，就稍微有点这种摩托车经过啊 就引擎很高了，你都会心就惊了一下 就觉得是不是轰炸。","sentence_en":"I scared myself but said nothing. Later I heard a neighbor couldn't take it, opened the window and yelled, 'I can't stand it, stop!' Even a motorcycle with a loud engine makes you jump, thinking it's a bombing."},{"id":"200","start":1533.43,"end":1537.31,"displayStart":1533.43,"displayEnd":1537.31,"displayMid":1535.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.701371,"pitch":13.774339,"speechRate":5.433,"hasEvents":false,"sentence_source":"这种惊吓不是我个人 我觉得大部分人都是这样的。","sentence_en":"This fear isn't just me; I think most people feel the same."},{"id":"201","start":1537.31,"end":1548.57,"displayStart":1537.31,"displayEnd":1548.57,"displayMid":1542.94,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.921067,"pitch":22.590988,"speechRate":6.199,"hasEvents":false,"sentence_source":"我建议你在你的那个日记里面你写过，你说一些战争最可恶的点，就是它把人对于规则的一些信念给打碎了，比如你刚才讲的 我们认为你不应该炸这个人类共同的。","sentence_en":"I recall you wrote in your diary that one of the most detestable things about war is that it shatters people's belief in rules. For example, you just mentioned we thought you shouldn't bomb humanity's shared"},{"id":"202","start":1548.57,"end":1552.17,"displayStart":1548.57,"displayEnd":1552.17,"displayMid":1550.37,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.946075,"pitch":24.473825,"speechRate":6.667,"hasEvents":false,"sentence_source":"一些历史文化的遗迹 但你炸了，就本来我们有的一些规则。","sentence_en":"historical and cultural heritage sites, but you bombed them. We had rules."},{"id":"203","start":1552.17,"end":1553.83,"displayStart":1552.17,"displayEnd":1553.83,"displayMid":1553,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.87896,"pitch":26.377106,"speechRate":8.434,"hasEvents":true,"sentence_source":"我们相信它无论怎样不会被打破。","sentence_en":"We believed they would never be broken."},{"id":"204","start":1554.33,"end":1557.11,"displayStart":1554.33,"displayEnd":1557.11,"displayMid":1555.7199999999998,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":1.02299,"pitch":22.414303,"speechRate":6.641,"hasEvents":true,"sentence_source":"但是这种高科技时代战争会打破这一切。","sentence_en":"But war in this high-tech era breaks all that."},{"id":"205","start":1557.11,"end":1560.67,"displayStart":1557.11,"displayEnd":1560.67,"displayMid":1558.8899999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.867693,"pitch":19.00326,"speechRate":4.213,"hasEvents":false,"sentence_source":"是的，因为好多人在讲两一战争8年。","sentence_en":"Yes, because many people talk about the eight-year Iran-Iraq war."},{"id":"206","start":1560.67,"end":1570.21,"displayStart":1560.67,"displayEnd":1570.21,"displayMid":1565.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.996429,"pitch":28.416695,"speechRate":6.291,"hasEvents":false,"sentence_source":"但那个时候两一战争8年 它是个常规性武器，实际上听他们说 德黑兰刚干水一两年可能有轰炸，后来就没有 大部分人都是还正常的生活。","sentence_en":"But that war used conventional weapons. Actually, I heard that Tehran was bombed only in the first year or two, then it stopped, and most people lived normally."},{"id":"207","start":1570.21,"end":1584.97,"displayStart":1570.21,"displayEnd":1584.97,"displayMid":1577.5900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.914838,"pitch":17.809738,"speechRate":4.946,"hasEvents":false,"sentence_source":"主要是在前线 就是人和人之间的这种肉薄或者是枪战这样，有战场的 现在没有战场 就是不提的在这导弹，而这个导弹的威力很大 你看不到敌人，但你的危险永远在你的头顶上。","sentence_en":"It was mainly on the frontlines—hand-to-hand combat or gunfights. There was a battlefield. Now there's no battlefield, just constant missiles. The missiles are powerful. You can't see the enemy, but danger is always overhead."},{"id":"208","start":1584.97,"end":1586.87,"displayStart":1584.97,"displayEnd":1586.87,"displayMid":1585.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":1.122431,"pitch":23.306507,"speechRate":7.237,"hasEvents":false,"sentence_source":"你不知道它什么时候落下。","sentence_en":"You never know when it will fall."},{"id":"209","start":1586.87,"end":1601.95,"displayStart":1586.87,"displayEnd":1601.95,"displayMid":1594.4099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.863773,"pitch":22.238251,"speechRate":4.642,"hasEvents":false,"sentence_source":"我觉得这个其实是很要命的，就是你很难入睡，每天听到这样这边那边，而且德黑兰这边炸到他们都不报地名了，只是说西部 北部 东部遭到轰炸，你也不知道这是什么地方。","sentence_en":"I think that's really deadly—you can't fall asleep, hearing it every day all around. In Tehran, they don't even report the locations anymore, just saying west, north, east are bombed, and you have no idea where that is."},{"id":"210","start":1601.95,"end":1615.99,"displayStart":1601.95,"displayEnd":1615.99,"displayMid":1608.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.957527,"pitch":18.820051,"speechRate":5.199,"hasEvents":false,"sentence_source":"到底出现了什么事情，为什么要炸 都不知道，这种情况下唯一能做就是，大家互相打电话 听到炸声，你那边怎么样 大不大还好吧，只能就是这种互相交流下信息，是在模糊的状态下。","sentence_en":"You don't know what's happening or why they're bombing. In this situation, all you can do is call each other when you hear the blasts—'How is it over there? Big or small? You okay?' Just exchanging information in a haze."},{"id":"211","start":1615.99,"end":1631.57,"displayStart":1615.99,"displayEnd":1631.57,"displayMid":1623.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.886853,"pitch":18.879049,"speechRate":5.135,"hasEvents":false,"sentence_source":"在等待一个不确定的未来，而且这个战争似乎也不能够马上就结束，到底会怎么样也不知道，这就是我觉得现在的普通心态，就是不确定，也不知道自己下一刻还活着还是死了，昨天我还有点难过。","sentence_en":"Waiting for an uncertain future, and the war doesn't seem to end soon. No one knows what will happen. That's the common mentality now—uncertainty, not knowing if you'll be alive in the next moment. Yesterday I felt a bit sad."},{"id":"212","start":1631.57,"end":1646.79,"displayStart":1631.57,"displayEnd":1646.79,"displayMid":1639.1799999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.86815,"pitch":16.699005,"speechRate":4.599,"hasEvents":false,"sentence_source":"就是我们外交夫人找我，给我打电话主托我，说如果我不在了，你帮我照顾我的女儿，她的小女儿，我听到那话心里好难过的，我说不要说这样的话，大家都会没事 就会安慰它。","sentence_en":"The diplomat's wife called and entrusted me: 'If I'm gone, take care of my daughter, my little girl.' I felt so sad hearing that. I said, 'Don't say that, everyone will be fine,' trying to comfort her."},{"id":"213","start":1646.79,"end":1650.41,"displayStart":1646.79,"displayEnd":1650.41,"displayMid":1648.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.734881,"pitch":13.36125,"speechRate":3.591,"hasEvents":false,"sentence_source":"但我又会觉得酸楚吧 这种感觉。","sentence_en":"But I still feel a pang of sorrow."},{"id":"214","start":1650.41,"end":1664.77,"displayStart":1650.41,"displayEnd":1664.77,"displayMid":1657.5900000000001,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.954778,"pitch":23.603235,"speechRate":5.35,"hasEvents":false,"sentence_source":"但你知道在这样一切背后，人们还在生活，就这就让你一方面看到希望，但同时特别伤感的地方，比如我看你在，就是最新这篇日记里面，你就写你说你半夜里面十二点，听到外帮的一声。","sentence_en":"But behind all this, people still live their lives. That gives you hope, but also deep sadness. For example, in your latest diary entry, you wrote that at midnight you heard a loud bang outside."},{"id":"215","start":1664.77,"end":1666.61,"displayStart":1664.77,"displayEnd":1666.61,"displayMid":1665.69,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.002548,"pitch":20.13924,"speechRate":6.522,"hasEvents":false,"sentence_source":"打开窗看了看 什么也没看到。","sentence_en":"Opened the window, looked out, saw nothing."},{"id":"216","start":1666.61,"end":1667.99,"displayStart":1666.61,"displayEnd":1667.99,"displayMid":1667.3,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.950115,"pitch":17.604685,"speechRate":6.167,"hasEvents":false,"sentence_source":"然后又接着睡了。","sentence_en":"Then went back to sleep."},{"id":"217","start":1667.99,"end":1678.53,"displayStart":1667.99,"displayEnd":1678.53,"displayMid":1673.26,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.93279,"pitch":23.74157,"speechRate":5.703,"hasEvents":false,"sentence_source":"然后说居然还能点了外卖，他还能点到烤鸡 战争第十四天，我说这一切 你上匪夷所思，一方面你明白 在战乱地方，总会有人在某些时刻正常生活。","sentence_en":"Then you said you even ordered takeout—roast chicken, on the 14th day of war. I said it's incredible. On one hand, you understand that in war zones, people sometimes live normally."},{"id":"218","start":1678.93,"end":1687.23,"displayStart":1678.93,"displayEnd":1687.23,"displayMid":1683.08,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":1.057823,"pitch":25.418116,"speechRate":5.576,"hasEvents":false,"sentence_source":"但是能够正常生活到还能够点外卖点烤鸡，这个就太讽刺了，一方面正常让你心安，但同时又带了巨大的讽刺。","sentence_en":"But to live normally enough to order roast chicken takeout—that's too ironic. Normality brings comfort, yet also immense irony."},{"id":"219","start":1687.23,"end":1688.57,"displayStart":1687.23,"displayEnd":1688.57,"displayMid":1687.9,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.340855,"pitch":8.881313,"speechRate":2.985,"hasEvents":false,"sentence_source":"是的 而且。","sentence_en":"Yes, and..."},{"id":"220","start":1688.57,"end":1689.71,"displayStart":1688.57,"displayEnd":1689.71,"displayMid":1689.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.064522,"pitch":21.281305,"speechRate":7.895,"hasEvents":false,"sentence_source":"我觉得这是一个常态。","sentence_en":"I think this is the norm."},{"id":"221","start":1689.71,"end":1694.09,"displayStart":1689.71,"displayEnd":1694.09,"displayMid":1691.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.939548,"pitch":16.883472,"speechRate":4.795,"hasEvents":false,"sentence_source":"我们想象中战争就是冰黄马乱，大家到处逃难这种。","sentence_en":"We imagine war as chaos, with everyone fleeing."},{"id":"222","start":1694.09,"end":1707.55,"displayStart":1694.09,"displayEnd":1707.55,"displayMid":1700.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.931552,"pitch":19.163603,"speechRate":5.03,"hasEvents":false,"sentence_source":"但是你会发现尤其银耳人他们很爱自己的生活，就好比说 家里都是干干净净的，擦玻璃 听到导弹响 继续擦，屋子里总是弄得很干净，伊朗人很爱干净 这个是普遍的。","sentence_en":"But you'll notice that Iranians especially love their lives. Their homes are spotless—they wash the windows, hear a missile, and keep washing. They keep their homes clean. Iranians are generally very tidy."},{"id":"223","start":1707.55,"end":1721.01,"displayStart":1707.55,"displayEnd":1721.01,"displayMid":1714.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":1.06353,"pitch":19.242294,"speechRate":4.492,"hasEvents":false,"sentence_source":"他们会想办法做好吃的饭，全家人会在一起，平常儿女们在外面结婚了 住在外头，到了打仗的时候 都会一起相守，吃蛋糕 吃干果，就这样说说笑笑。","sentence_en":"They find ways to cook good food, the whole family stays together. Usually children marry and live elsewhere, but in wartime, they come together, eating cake and nuts, laughing and chatting."},{"id":"224","start":1721.01,"end":1734.95,"displayStart":1721.01,"displayEnd":1734.95,"displayMid":1727.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.935161,"pitch":19.808207,"speechRate":4.735,"hasEvents":false,"sentence_source":"没有人再说 你看外面多可怕 战争，就算是有空障 大家也是在一起，这个我觉得是难能可贵的，这才是文明的基因，它落实在每个普通人的身上，在遇到困难的时候。","sentence_en":"No one says, 'Look how scary it is outside.' Even with air raids, they're together. I think that's precious—that's the gene of civilization, embodied in every ordinary person in hard times."},{"id":"225","start":1734.95,"end":1749.59,"displayStart":1734.95,"displayEnd":1749.59,"displayMid":1742.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.883571,"pitch":18.120831,"speechRate":5.191,"hasEvents":false,"sentence_source":"他们真的就是依旧保持生活的尊严和体面，在最困难我的房间还是要干净的，就我们说一声慕斯，跟他岳母说你别查玻璃了，整天导弹洗过来到处都是灰，他岳母不肯，一定要把玻璃擦开。","sentence_en":"They truly maintain dignity and decency in life. Even in the toughest times, they keep their room clean. I told our Iranian mother, 'Don't wipe the windows, missiles bring dust everywhere,' but she insisted on wiping them clean."},{"id":"226","start":1749.59,"end":1763.95,"displayStart":1749.59,"displayEnd":1763.95,"displayMid":1756.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.998363,"pitch":19.685284,"speechRate":5.362,"hasEvents":false,"sentence_source":"尤其现在快到新年了，大家要把房子要扫房，像中国一样要摆上漂亮的漆色眼星桌，我放了鲜花 还有很多过年的仪式，他们都会遵从 不会放弃，我也有点怀疑 我后来我还问我们的伊朗妈妈。","sentence_en":"Especially with New Year approaching, everyone must clean the house, like in China, set up a beautiful Haft-sin table. I placed fresh flowers and other rituals; they follow them all, never giving up. I was a bit doubtful, so I asked our Iranian mother."},{"id":"227","start":1763.95,"end":1776.59,"displayStart":1763.95,"displayEnd":1776.59,"displayMid":1770.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.859445,"pitch":14.847394,"speechRate":5.222,"hasEvents":false,"sentence_source":"我说这病患马乱的 又是打仗 又经济不好，大家都躲在家里 还有人过年吗，伊朗妈妈跟我说 一定会的，她农卢子杰 2000多年来，蒙古当时侵略伊朗 占领了伊朗。","sentence_en":"I said, 'With the chaos, war, and bad economy, everyone's hiding at home—will anyone still celebrate the New Year?' She said, 'Absolutely.' Nowruz has been celebrated for over 2,000 years. When Mongols invaded and occupied Iran, we still celebrated."},{"id":"228","start":1776.59,"end":1785.89,"displayStart":1776.59,"displayEnd":1785.89,"displayMid":1781.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.019495,"pitch":18.310747,"speechRate":5.815,"hasEvents":false,"sentence_source":"她说我们也过 阿勒布人来了 占领了我们也过，她给我讲一个故事 就是说当时好像投了一个伊朗的称，好多人死 还有一个人活着。","sentence_en":"She said even when Arabs came and occupied, we still celebrated. She told a story about when a city in Iran was bombed, many died, but one person survived."},{"id":"229","start":1785.89,"end":1800.95,"displayStart":1785.89,"displayEnd":1800.95,"displayMid":1793.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.92603,"pitch":16.969898,"speechRate":5.113,"hasEvents":false,"sentence_source":"然后那时候也政治新年 他还怎能跳舞，别人都觉得他是疯子 他说不是 他还是在过年 农路子杰，这个农路子杰是伊朗的传统 伊朗的文化的根 伊朗的文明的底，他说农路子杰是伊朗的春风。","sentence_en":"It was New Year, and he was dancing. Others thought he was crazy, but he said no, he's celebrating Nowruz. Nowruz is the root of Iranian tradition, culture, and civilization—the spring breeze of Iran."},{"id":"230","start":1800.95,"end":1815.43,"displayStart":1800.95,"displayEnd":1815.43,"displayMid":1808.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.864175,"pitch":19.279457,"speechRate":4.903,"hasEvents":false,"sentence_source":"就是告别过去迎来春天 迎来未来 迎来新的一年，这对伊朗人说是非常重要的，这个是他们的文化的基因，我每次听到这些话 我都心潮澎湃，哎呀 这也是一个什么样的民族啊。","sentence_en":"It means saying goodbye to the past and welcoming spring, the future, the new year. It's crucial for Iranians—a cultural gene. Every time I hear this, I'm deeply moved. What a nation this is!"},{"id":"231","start":1815.43,"end":1819.61,"displayStart":1815.43,"displayEnd":1819.61,"displayMid":1817.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":0.991574,"pitch":23.963816,"speechRate":5.204,"hasEvents":false,"sentence_source":"经历了这么多的战乱，两千多年来 咱们经常被侵略。","sentence_en":"Having endured so much turmoil, invaded countless times over 2,000 years."},{"id":"232","start":1819.61,"end":1821.07,"displayStart":1819.61,"displayEnd":1821.07,"displayMid":1820.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.879002,"pitch":22.477629,"speechRate":5.479,"hasEvents":false,"sentence_source":"但是文明永远不倒。","sentence_en":"But civilization never falls."},{"id":"233","start":1821.07,"end":1828.63,"displayStart":1821.07,"displayEnd":1828.63,"displayMid":1824.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":1.010656,"pitch":19.536692,"speechRate":5.391,"hasEvents":false,"sentence_source":"我觉得之所以不倒，就是因为他们在每个人的身上，伊朗人在 伊朗的文明就在，这句话真的是这样。","sentence_en":"I think the reason it doesn't fall is because it's in every person; as long as Iranians exist, Iranian civilization exists. That's really true."},{"id":"234","start":1829.21,"end":1840.87,"displayStart":1829.21,"displayEnd":1840.87,"displayMid":1835.04,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.976623,"pitch":24.372847,"speechRate":5.852,"hasEvents":false,"sentence_source":"其实无论是从工作职业角度，还是从个人生活的角度，我能够理解你为什么在伊朗，就像你最近这篇日志里面，你写到从你同事的角度，你说你要写出一个人走在自己。","sentence_en":"Actually, whether from a professional or personal perspective, I can understand why you're in Iran. In your recent journal, you wrote from your colleague's perspective about writing about a person walking alone in their hometown."},{"id":"235","start":1840.87,"end":1854.09,"displayStart":1840.87,"displayEnd":1854.09,"displayMid":1847.48,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":0.953276,"pitch":22.055157,"speechRate":5.522,"hasEvents":false,"sentence_source":"从小长大的地方看着它变成废虚的心情，你要把这种心情写出来，我一下就对着，我想如果此刻这事是发生在我生活的周围，是北京长安区，我一下子感同身世，我明白你作为记者。","sentence_en":"You want to capture the feeling of watching the place you grew up turn into ruins. I immediately connected with that. I thought if this were happening in my own surroundings, in Beijing's Chang'an district, I would feel the same. I understand you as a journalist."},{"id":"236","start":1854.09,"end":1858.57,"displayStart":1854.09,"displayEnd":1858.57,"displayMid":1856.33,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.026272,"pitch":23.17695,"speechRate":6.696,"hasEvents":false,"sentence_source":"作为一个生活在伊朗已经超过20年了，这样一个人你为什么会在那儿。","sentence_en":"As someone who has lived in Iran for over 20 years, why are you there?"},{"id":"237","start":1858.57,"end":1861.99,"displayStart":1858.57,"displayEnd":1861.99,"displayMid":1860.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.087296,"pitch":18.401186,"speechRate":6.14,"hasEvents":false,"sentence_source":"对 我2005年来到这里的，我就一直在这里待着。","sentence_en":"Yes, I arrived here in 2005 and have been here ever since."},{"id":"238","start":1861.99,"end":1871.59,"displayStart":1861.99,"displayEnd":1871.59,"displayMid":1866.79,"speaker":"Li Rui","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Urban Life and Cross-Cultural Experience","sentiment_en":"Neutral","score":0,"loudness":1.088198,"pitch":22.216925,"speechRate":5.467,"hasEvents":false,"sentence_source":"所以从和你的家乡，你说是一个西北城市，到上海 到德黑兰，这三个城市那绝对德黑兰是你这一生，和生活时间最长的城市。","sentence_en":"So from your hometown—a northwestern city—to Shanghai, to Tehran, among these three cities, Tehran is definitely where you've spent the longest time in your life."},{"id":"239","start":1871.59,"end":1879.81,"displayStart":1871.59,"displayEnd":1879.81,"displayMid":1875.6999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.966023,"pitch":19.324368,"speechRate":4.789,"hasEvents":true,"sentence_source":"对 我现在回去有时候会有点陌生感，很奇怪 到了中国我就很想伊朗，我在伊朗我又很想中国。","sentence_en":"Yeah, now when I go back, I sometimes feel a bit of strangeness. It's strange: when I'm in China, I miss Iran; when I'm in Iran, I miss China."},{"id":"240","start":1880.25,"end":1883.49,"displayStart":1880.25,"displayEnd":1883.49,"displayMid":1881.87,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.7,"loudness":0.897716,"pitch":27.236322,"speechRate":5.825,"hasEvents":true,"sentence_source":"我觉得你这一路非常的有意思也很有意义。","sentence_en":"I think your journey has been very interesting and meaningful."},{"id":"241","start":1883.49,"end":1897.17,"displayStart":1883.49,"displayEnd":1897.17,"displayMid":1890.33,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.990561,"pitch":21.430298,"speechRate":5.848,"hasEvents":false,"sentence_source":"其实你的每一步你都是意想不到的，像你说的 没有一个记者在成为占地记者，之前他会想到我是占地记者，除了那些主动要求去前线的，比如说罗伯特卡帕 他主动去前线，他是个主动的占地记者。","sentence_en":"Actually, every step you took was unexpected. As you said, no journalist becomes a war correspondent by planning it, except those who volunteer for the frontlines, like Robert Capa—he volunteered, he was an active war correspondent."},{"id":"242","start":1897.17,"end":1904.59,"displayStart":1897.17,"displayEnd":1904.59,"displayMid":1900.88,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.045557,"pitch":23.782253,"speechRate":5.718,"hasEvents":false,"sentence_source":"大部分记者只要不是被派往前线的话，只是他所在的地方成为战争影响的地方，他成为战争记者。","sentence_en":"Most journalists, if not sent to the frontlines, become war correspondents only because the place they are in becomes affected by war."},{"id":"243","start":1904.59,"end":1910.99,"displayStart":1904.59,"displayEnd":1910.99,"displayMid":1907.79,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.914668,"pitch":20.503111,"speechRate":6.505,"hasEvents":false,"sentence_source":"所以你这一路无论是成为记者，还是成为战地记者，你都是在意想不到当中被推到这个位置的。","sentence_en":"So throughout your journey, whether becoming a journalist or a war correspondent, you were pushed into that position unexpectedly."},{"id":"244","start":1910.99,"end":1919.47,"displayStart":1910.99,"displayEnd":1919.47,"displayMid":1915.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.4,"loudness":0.941525,"pitch":18.53384,"speechRate":4.913,"hasEvents":false,"sentence_source":"对 真的有一天战争到来的时候，你会觉得战争促不及防，可能二十年来人们一直在想像有这么一天。","sentence_en":"Yes, when war actually comes, it catches you off guard. Maybe people had imagined this day for twenty years."},{"id":"245","start":1919.47,"end":1932.77,"displayStart":1919.47,"displayEnd":1932.77,"displayMid":1926.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.936492,"pitch":23.522799,"speechRate":5.414,"hasEvents":false,"sentence_source":"但是都觉得不太可能一直没有发生，但真的发生了你就会觉得人立马就僵住了，就是我见证了这个战争打响那一刻，真的就是一个下子我就呆住了，我都不敢相信战争开始了。","sentence_en":"But they thought it was unlikely and it never happened. When it did, I froze instantly. I witnessed the moment the war started—I was completely stunned, I couldn't believe it had begun."},{"id":"246","start":1933.27,"end":1943.81,"displayStart":1933.27,"displayEnd":1943.81,"displayMid":1938.54,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.989155,"pitch":22.145763,"speechRate":6.788,"hasEvents":false,"sentence_source":"我2000年的时候去过德黑兰，去过伊斯法汉，我记得当时我们的导游特别骄傲地，跟我们说了一句，说我们这儿著名的艳语叫，伊斯法汉 is half the world。","sentence_en":"In 2000, I went to Tehran and Isfahan. I remember our guide proudly telling us that a famous saying here is 'Isfahan is half the world."},{"id":"247","start":1943.81,"end":1948.23,"displayStart":1943.81,"displayEnd":1948.23,"displayMid":1946.02,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":1.11082,"pitch":24.152725,"speechRate":5.569,"hasEvents":false,"sentence_source":"伊斯法汉是世界的一半，我说哇你们这个艳语好有气势。","sentence_en":"Isfahan is half the world,' I said, 'Wow, that saying is so impressive."},{"id":"248","start":1948.23,"end":1959.87,"displayStart":1948.23,"displayEnd":1959.87,"displayMid":1954.05,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.5,"loudness":1.00344,"pitch":22.554075,"speechRate":5.471,"hasEvents":false,"sentence_source":"所以后来我听到新闻里面说，伊斯法汉当地很多人在一些，就是名胜著名的文物地标前面，写上一个巨大的标志说不要炸这里，好像有些地方还受到损毁。","sentence_en":"So later, I heard in the news that many locals in Isfahan wrote huge signs in front of famous landmarks saying 'Don't bomb here,' and some places were still damaged."},{"id":"249","start":1959.87,"end":1962.87,"displayStart":1959.87,"displayEnd":1962.87,"displayMid":1961.37,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.960776,"pitch":25.948214,"speechRate":7.859,"hasEvents":false,"sentence_source":"像我这个远方的人听了内心都非常的痛苦觉得。","sentence_en":"Even as an outsider far away, I felt great pain hearing this."},{"id":"250","start":1962.87,"end":1969.57,"displayStart":1962.87,"displayEnd":1969.57,"displayMid":1966.2199999999998,"speaker ","sentence_en":"Persian isn't small—it has over 100 million speakers, just not widely used. In 1997, choosing it wasn't popular; it was quite unconventional."},{"id":"261","start":2065.11,"end":2069.93,"displayStart":2065.11,"displayEnd":2069.93,"displayMid":2067.52,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.020627,"pitch":24.84622,"speechRate":5.983,"hasEvents":false,"sentence_source":"因为你在那时候不可能遇见到有一天，你的福尔西将是这么的有用。","sentence_en":"Back then, I couldn't have foreseen that Farsi would become this useful."},{"id":"262","start":2069.93,"end":2073.89,"displayStart":2069.93,"displayEnd":2073.89,"displayMid":2071.91,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.192763,"pitch":26.393702,"speechRate":6.319,"hasEvents":false,"sentence_source":"那当初是一个什么样的意外的场景之下选择了福尔西。","sentence_en":"So, what unexpected circumstances led to your choice of Farsi?"},{"id":"263","start":2073.89,"end":2089.35,"displayStart":2073.89,"displayEnd":2089.35,"displayMid":2081.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.011493,"pitch":18.043795,"speechRate":4.615,"hasEvents":false,"sentence_source":"我是在宁夏迎川出生的，我父母都是知青 他们也是外地过来的，我在那里长大 后来高考的时候我英语还比较好，老实说你就先提前报个外语专业，我就报上海外卫大学。","sentence_en":"I was born in Yinchuan, Ningxia. My parents were educated youth who moved there. I grew up there, and when I took the college entrance exam, my English was good. Honestly, I thought I'd just apply for a foreign language major, so I chose Shanghai International Studies University."},{"id":"264","start":2089.35,"end":2103.71,"displayStart":2089.35,"displayEnd":2103.71,"displayMid":2096.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.3,"loudness":0.901694,"pitch":19.76251,"speechRate":5.014,"hasEvents":false,"sentence_source":"宁夏那边的每四年上外会在那里招生，我那年正好比较幸运，只有两个专业 一个阿拉伯语专业，一个波斯语专业，而且我那年1997年，是第一次波斯语专业招生 我是第一届。","sentence_en":"Every four years, SISU recruited in Ningxia. That year I was lucky—only two majors were offered: Arabic and Persian. 1997 was the first year they admitted Persian majors; I was in the first cohort."},{"id":"265","start":2103.71,"end":2109.65,"displayStart":2103.71,"displayEnd":2109.65,"displayMid":2106.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.922206,"pitch":20.849697,"speechRate":5.724,"hasEvents":false,"sentence_source":"我当时在选的时候，我也不知道什么叫波斯语，我都不知道波斯语是哪个国家说的。","sentence_en":"When choosing, I had no idea what Persian was or which country spoke it."},{"id":"266","start":2109.65,"end":2115.55,"displayStart":2109.65,"displayEnd":2115.55,"displayMid":2112.6000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.950041,"pitch":18.690302,"speechRate":5.202,"hasEvents":false,"sentence_source":"但是我就觉得很好奇，我想 哎 阿拉伯语我听过，我在宁夏长大 我经常听。","sentence_en":"But I was curious. I'd heard of Arabic—growing up in Ningxia, I often heard it."},{"id":"267","start":2115.55,"end":2130.53,"displayStart":2115.55,"displayEnd":2130.53,"displayMid":2123.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.970768,"pitch":18.641573,"speechRate":5.34,"hasEvents":false,"sentence_source":"但是我不知道什么叫波斯语，我就给爆了，我妈都不知道，直到支援书之下来，她才知道我爆的是这个波斯语专业，后来我还专门去查了一下，我记得特有意思，就那天我在家里看报纸看到有一条说。","sentence_en":"But I didn't know what Persian was, so I just signed up. My mom didn't know until the admission letter came. Later, I looked it up. I remember something funny: I was reading the newspaper at home and saw an article."},{"id":"268","start":2130.53,"end":2144.73,"displayStart":2130.53,"displayEnd":2144.73,"displayMid":2137.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.912437,"pitch":15.61895,"speechRate":4.437,"hasEvents":false,"sentence_source":"1997年伊朗的总统哈塔米访问中国，而且跟中国签订了一个修建地铁的项目，请中国公司帮伊朗修地铁，我看到这么一个消息，后来我又去厨书馆查。","sentence_en":"It said Iran's President Khatami visited China in 1997 and signed a subway construction project, hiring Chinese companies. I saw that and later went to the library to check."},{"id":"269","start":2144.73,"end":2156.17,"displayStart":2144.73,"displayEnd":2156.17,"displayMid":2150.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.7,"loudness":0.973687,"pitch":17.061512,"speechRate":5.07,"hasEvents":false,"sentence_source":"我才知道阿波斯里是伊朗人说的，以前他们叫波斯蒂 我现在叫伊朗，就是我这样一个概念，物打物壮地考进去了，后来我很喜欢 我真的很喜欢。","sentence_en":"That's how I learned that Persian is spoken in Iran—formerly Persia, now Iran. So I stumbled into it, but later I really loved it."},{"id":"270","start":2156.17,"end":2165.03,"displayStart":2156.17,"displayEnd":2165.03,"displayMid":2160.6000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.6,"loudness":1.095361,"pitch":17.338993,"speechRate":5.931,"hasEvents":false,"sentence_source":"我们的外教对我们也就像自己的孩子一样，经常请我们到他们家当时的专家楼，叫我们外教外教夫人 还有他们两个孩子。","sentence_en":"Our foreign teacher treated us like his own children, often inviting us to their apartment in the expert building—him, his wife, and their two kids."},{"id":"271","start":2165.03,"end":2180.73,"displayStart":2165.03,"displayEnd":2180.73,"displayMid":2172.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":1.007684,"pitch":19.189058,"speechRate":4.777,"hasEvents":false,"sentence_source":"我们全班同学13个人，到他们家去吃伊朗饭和美好的回忆，后来我毕业的时候，我就考到了北京大学东语系，我在那里读研究生，研究生毕业我有想回上海，同学帮我介绍另一个学校。","sentence_en":"All 13 classmates in our class went to his home for Iranian food and wonderful memories. Later, when I graduated, I was admitted to the Department of East Asian Languages at Peking University, where I studied for my master's. After graduating, I wanted to return to Shanghai, and a classmate helped introduce me to another school."},{"id":"272","start":2180.73,"end":2193.39,"displayStart":2180.73,"displayEnd":2193.39,"displayMid":2187.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.023091,"pitch":19.072876,"speechRate":5.916,"hasEvents":false,"sentence_source":"在那里正好有个国际部在那里当了两年半，他们那个历史老师，后来我也不是特别喜欢，我就辞职了，辞职正好这个上外当时有交换老师，中国要派出一个老师在那边，叫中文这边。","sentence_en":"I worked at the international department for two and a half years, but I didn't like the history teacher there, so I quit. Around the same time, SISU was looking for exchange teachers—China sends a teacher to teach Chinese there."},{"id":"273","start":2193.39,"end":2198.29,"displayStart":2193.39,"displayEnd":2198.29,"displayMid":2195.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.05346,"pitch":19.254951,"speechRate":6.25,"hasEvents":false,"sentence_source":"伊朗要派出一个老师叫波斯语，当时那个波斯语的老师真的是很有限。","sentence_en":"Iran sends a Persian teacher, and back then, Persian teachers were really scarce."},{"id":"274","start":2198.29,"end":2213.63,"displayStart":2198.29,"displayEnd":2213.63,"displayMid":2205.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.98072,"pitch":18.067019,"speechRate":5.02,"hasEvents":false,"sentence_source":"所以呢我同学推荐，我就后来又去了上外，他们跟我签约的，我就是去了伊朗的莎伊本石地大学，当时是伊朗的第二高等院校，在那里叫波斯语，他们当时摘北石地大学跟上外是有签了合同。","sentence_en":"So a classmate recommended me, and I went back to SISU. They signed a contract with me, and I went to Shahid Beheshti University, then Iran's second top university, to teach Persian. They had an agreement with SISU."},{"id":"275","start":2213.63,"end":2216.69,"displayStart":2213.63,"displayEnd":2216.69,"displayMid":2215.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.083863,"pitch":14.867917,"speechRate":6.209,"hasEvents":false,"sentence_source":"而且他们好像是第一个开设中文专业的学校。","sentence_en":"And they were probably the first to offer a Chinese major."},{"id":"276","start":2216.69,"end":2229.99,"displayStart":2216.69,"displayEnd":2229.99,"displayMid":2223.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":1.023487,"pitch":15.328102,"speechRate":5.148,"hasEvents":false,"sentence_source":"所以我就在那里当了一年的交换老师，就在2005年 正好咱们台就说想要开仗就建仗，正好碰到钟老师李先生他们在那里，我就很幸运地打扰了凤凰 就是这样。","sentence_en":"So I was an exchange teacher there for a year. In 2005, Phoenix TV was planning to launch a channel, and I happened to meet Teacher Zhong and Mr. Li there. I was lucky anguage Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.133509,"pitch":28.802126,"speechRate":6.525,"hasEvents":false,"sentence_source":"然后讲到一个人 跟一个语言 跟一个事业的缘分。","sentence_en":"Then there's the connection between a person, a language, and a career."},{"id":"281","start":2257.69,"end":2267.65,"displayStart":2257.69,"displayEnd":2267.65,"displayMid":2262.67,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.4,"loudness":0.932983,"pitch":25.505611,"speechRate":5.723,"hasEvents":false,"sentence_source":"我觉得就是妙不可言，你看79年 我后来就想 你是79年出生的，你看79年对于伊朗来说是一个非常关键的一个历史转折的一个年份。","sentence_en":"I find it incredible. You were born in '79, which was a pivotal turning point for Iran."},{"id":"282","start":2267.65,"end":2278.89,"displayStart":2267.65,"displayEnd":2278.89,"displayMid":2273.27,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.4,"loudness":1.013918,"pitch":24.225622,"speechRate":5.961,"hasEvents":false,"sentence_source":"我觉得哎呀 就是有时候你要去找一些关联性，明明之中 好像历史就是剧本已经帮你写旧了嗯对这些，你后来自己回想你会不会觉得有一些小小的神奇的地方在。","sentence_en":"Sometimes you look for connections—it's like history has already written the script for you. When you look back, don't you find it a bit magical?"},{"id":"283","start":2278.89,"end":2282.43,"displayStart":2278.89,"displayEnd":2282.43,"displayMid":2280.66,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.3,"loudness":0.901933,"pitch":18.971334,"speechRate":5.65,"hasEvents":false,"sentence_source":"好像你总是应该去学这个语言 去来到这片土地。","sentence_en":"As if you were destined to learn this language and come to this land."},{"id":"284","start":2282.43,"end":2295.87,"displayStart":2282.43,"displayEnd":2295.87,"displayMid":2289.1499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.904134,"pitch":25.776114,"speechRate":5.356,"hasEvents":false,"sentence_source":"嗯 我觉得是明明之中吧 可能是缘分，1979年 这边伊斯兰革命报发现伊斯兰共和国，我那年出生 等于说我跟它是同理人，而且那一年中国和伊朗完全走了不同的方向。","sentence_en":"Yeah, I think it's fate. In 1979, the Islamic Revolution established the Islamic Republic. I was born that year, so we're the same age. And that year, China and Iran went in completely different directions."},{"id":"285","start":2295.87,"end":2300.69,"displayStart":2295.87,"displayEnd":2300.69,"displayMid":2298.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.889608,"pitch":19.354355,"speechRate":4.772,"hasEvents":false,"sentence_source":"中国当时是实行的改革开放，从1979年我就误读着。","sentence_en":"At that time, China was implementing reform and opening up. Since 1979, I’ve been interpreting it that way."},{"id":"286","start":2300.69,"end":2307.17,"displayStart":2300.69,"displayEnd":2307.17,"displayMid":2303.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.7,"loudness":0.937163,"pitch":20.045824,"speechRate":4.784,"hasEvents":false,"sentence_source":"我们生活上也经历了很大的变化，生活有大幅的改善，有希望 有更好的未来。","sentence_en":"Our lives have also undergone great changes, with significant improvements, hope, and a better future."},{"id":"287","start":2307.17,"end":2321.47,"displayStart":2307.17,"displayEnd":2321.47,"displayMid":2314.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.982083,"pitch":24.148371,"speechRate":5.073,"hasEvents":false,"sentence_source":"但是伊朗它又是从这种国王时代的，清美的 非常世俗化的，社会一下子变成了一个传统的，就等于是一个宗教教法学家治国的，一个原教主义国家，两个国家就这样擦身而过。","sentence_en":"But Iran, on the other hand, went from a king's era—pro-American, very secular—to suddenly becoming a traditional country ruled by religious jurists, a fundamentalist state. The two countries just passed each other by."},{"id":"288","start":2321.47,"end":2325.81,"displayStart":2321.47,"displayEnd":2325.81,"displayMid":2323.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.900956,"pitch":22.608028,"speechRate":5.069,"hasEvents":false,"sentence_source":"中国就像左手它这样右转，就这种最大一个十字路口。","sentence_en":"China is like turning left at the biggest crossroads, while doing so on the right."},{"id":"289","start":2325.81,"end":2328.29,"displayStart":2325.81,"displayEnd":2328.29,"displayMid":2327.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.006809,"pitch":26.653072,"speechRate":5.242,"hasEvents":false,"sentence_source":"然后我作为中国人 我来到伊朗。","sentence_en":"Then, as a Chinese person, I came to Iran."},{"id":"290","start":2328.29,"end":2329.89,"displayStart":2328.29,"displayEnd":2329.89,"displayMid":2329.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.898939,"pitch":30.151106,"speechRate":5.625,"hasEvents":false,"sentence_source":"我们之前有两千多年。","sentence_en":"We had over two thousand years of history before that."},{"id":"291","start":2329.89,"end":2336.63,"displayStart":2329.89,"displayEnd":2336.63,"displayMid":2333.26,"speaker":"Lu ite profession. Every time I went out with a camera to interview, I felt incredibly excited. I wanted to write all these stories down."},{"id":"313","start":2494.93,"end":2499.15,"displayStart":2494.93,"displayEnd":2499.15,"displayMid":2497.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.895095,"pitch":19.567141,"speechRate":5.45,"hasEvents":false,"sentence_source":"我想知道那些人的内心的故事 这是我最喜欢做的事情。","sentence_en":"I want to know the inner stories of those people—that's what I love most."},{"id":"314","start":2499.15,"end":2504.11,"displayStart":2499.15,"displayEnd":2504.11,"displayMid":2501.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.966225,"pitch":27.118519,"speechRate":4.637,"hasEvents":false,"sentence_source":"所以，你看 人这一生好像你最终就会跟自己的热爱相遇。","sentence_en":"So you see, in this life, you eventually meet your passion."},{"id":"315","start":2504.11,"end":2515.69,"displayStart":2504.11,"displayEnd":2515.69,"displayMid":2509.9,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":1.009868,"pitch":25.991571,"speechRate":5.699,"hasEvents":false,"sentence_source":"你为了跟这个热爱相遇之前 你要做很多专业上的准备，而且你像你要从你的家乡到上海 然后最后到德黑兰，你终于才能够跟这个相遇遇上 隔了这么多年之后。","sentence_en":"Before meeting that passion, you need to make a lot of professional preparations. And you have to go from your hometown to Shanghai, and finally to Tehran, before you finally meet it after all these years."},{"id":"316","start":2515.69,"end":2527.99,"displayStart":2515.69,"displayEnd":2527.99,"displayMid":2521.84,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_
