_source":"因为接下来我们录制的两个小时如果中间不被打断，没有任何意外的事情发生，就说明此刻在李睿所居住的德黑兰的周边他目光所及。","sentence_en":"Because if the next two hours of recording proceed without interruption or incident, that means around Li Rui's neighborhood in Tehran, as far as he can see..."},{"id":"25","start":160.9,"end":171.7,"displayStart":160.9,"displayEnd":171.7,"displayMid":166.3,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.0183,"pitch":23.198647,"speechRate":4.63,"hasEvents":false,"sentence_source":"他能够听到的没有发生任何爆炸没有任何惊天动地的声响，意味着今后两个小时他周边的小环境是相对平和而安全的。","sentence_en":"...and hear, there have been no explosions or earth-shattering sounds, meaning the immediate environment around him is relatively calm and safe for the next two hours."},{"id":"26","start":171.7,"end":176.62,"displayStart":171.7,"displayEnd":176.62,"displayMid":174.16,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.913564,"pitch":21.361567,"speechRate":4.521,"hasEvents":false,"sentence_source":"所以我内心也有一些忐忑祈祷，一切都非常的顺利。","sentence_en":"So I'm a bit nervous and pray that everything goes smoothly."},{"id":"27","start":176.62,"end":183.8,"displayStart":176.62,"displayEnd":183.8,"displayMid":180.21,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":1.102069,"pitch":25.940495,"speechRate":5.199,"hasEvents":false,"sentence_source":"那过去一段时间我打开了久违的电视，在追李睿每天有的新闻联线，也追她的战地日记。","sentence_en":"Lately, I turned on the TV for the first time in a while, following Li Rui's daily news broadcasts and her war diaries."},{"id":"28","start":183.8,"end":189.16,"displayStart":183.8,"displayEnd":189.16,"displayMid":186.48000000000002,"speaker":"Li Rui","speakerColor":"#A29479","clus ":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.909311,"pitch":23.004272,"speechRate":4.894,"hasEvents":false,"sentence_source":"我也非常非常的荣幸，能够有我的前同事同行，以为这么出色的女性，你最近做的工作太棒了，真的非常非常棒，而且你知道你每次你出现在屏幕上，你的声音特别的温柔。","sentence_en":"I'm truly honored too, to have my former colleague and such an outstanding woman. Your recent work has been amazing—really, really great. And you know, every time you appear on screen, your voice is so gentle."},{"id":"33","start":219.32,"end":230.86,"displayStart":219.32,"displayEnd":230.86,"displayMid":225.09,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.862385,"pitch":22.242695,"speechRate":4.679,"hasEvents":true,"sentence_source":"淡定 不着急 不慌张，让我作为一个观众，一边在看这样的局势，但同时我的内心是安定的，谢谢你透过屏幕，带给我这种莫名的安定感。","sentence_en":"Calm, unhurried, not panicked. As a viewer, watching this situation, I feel at ease inside. Thank you for bringing me that strange sense of calm through the screen."},{"id":"34","start":231.26,"end":232.4,"displayStart":231.26,"displayEnd":232.4,"displayMid":231.82999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.243708,"pitch":24.786072,"speechRate":7.778,"hasEvents":false,"sentence_source":"因为我们是记者。","sentence_en":"Because we're journalists."},{"id":"35","start":232.4,"end":246.82,"displayStart":232.4,"displayEnd":246.82,"displayMid":239.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0.1,"loudness":0.975459,"pitch":22.679602,"speechRate":5.479,"hasEvents":false,"sentence_source":"我们一直都是在做自己的本分，虽然伊朗现在遇到了战士，但我一直没觉得自己就是战士记者，我就是一个记者 我只是很喜欢伊朗，我就在这里待 从来没有想过，有一天会受到这么多人的关注。","sentence_en":"We've always just been doing our job. Even though Iran is now facing conflict, I never thought of myself as a war reporter. I'm just a journalist who really likes Iran, so I stayed here. I never imagined I'd get so much attention one day."},{"id":"36","start":246.82,"end":251.92,"displayStart":246.82,"displayEnd":251.92,"displayMid":249.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.6,"loudness":0.925284,"pitch":16.864807,"speechRate":5.49,"hasEvents":true,"sentence_source":"不过如果大家能喜欢我的报道，喜欢我写的东西 我就觉得特别高兴。","sentence_en":"But if people enjoy my reports and what I write, I'm really happy."},{"id":"37","start":252.44,"end":257.06,"displayStart":252.44,"displayEnd":257.06,"displayMid":254.75,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":-0.1,"loudness":0.869512,"pitch":28.336245,"speechRate":6.539,"hasEvents":true,"sentence_source":"你知道此刻我从画面当中看到你家里的这个场景，我会觉得很不真实。","sentence_en":"You know, right now seeing your home through the screen feels surreal to me."},{"id":"38","start":257.06,"end":264.06,"displayStart":257.06,"displayEnd":264.06,"displayMid":260.56,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.7,"loudness":0.923909,"pitch":21.620953,"speechRate":5.429,"hasEvents":false,"sentence_source":"因为你家里从我这看很干净，有很多中式的元素，家里布置得非常的舒服 是个非常舒服的家。","sentence_en":"From my view, your home looks very clean, with many Chinese elements. It's decorated very comfortably—a really cozy home."},{"id":"39","start":264.06,"end":265.82,"displayStart":264.06,"displayEnd":265.82,"displayMid":264.94,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.4,"loudness":0.993305,"pitch":23.627813,"speechRate":5.114,"hasEvents":false,"sentence_source":"那这个家它是安静的。","sentence_en":"And this home is quiet."},{"id":"40","start":265.82,"end":278.56,"displayStart":265.82,"displayEnd":278.56,"displayMid":272.19,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.944208,"pitch":24.330959,"speechRate":5.98,"hasEvents":false,"sentence_source":"但是我明白你家里的墙外边 随时有可能发生什么，是和这个宁静完全相反，就这是非常超现实的一个感觉，可能你身处其中 你身处那个暴风 咒语，最中心的地方 反而有一种怪异的平静。","sentence_en":"But I understand that just outside your walls, anything could happen at any moment—the complete opposite of this peace. That's such a surreal feeling. Maybe when you're in the eye of the storm, the very center, there's a strange calm."},{"id":"41","start":278.56,"end":284.42,"displayStart":278.56,"displayEnd":284.42,"displayMid":281.49,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":0.873369,"pitch":16.636263,"speechRate":5.629,"hasEvents":false,"sentence_source":"你可能自己还感受不到此刻 我感受的那种，就是诡异的感觉 那种神奇的感觉。","sentence_en":"You might not feel it yourself right now, but I feel that eerie, magical sensation."},{"id":"42","start":284.42,"end":286.58,"displayStart":284.42,"displayEnd":286.58,"displayMid":285.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.4,"loudness":0.500145,"pitch":10.996752,"speechRate":3.406,"hasEvents":false,"sentence_source":"你说挺对的 真的。","sentence_en":"You're right, really."},{"id":"43","start":286.58,"end":295.88,"displayStart":286.58,"displayEnd":295.88,"displayMid":291.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.81189,"pitch":19.659513,"speechRate":4.409,"hasEvents":false,"sentence_source":"我觉得这种灾难之下就是平静，安静地让你都能听到心跳，我记得战争打响那一刻 2月28号那天。","sentence_en":"I think under such disaster, there is calm—so quiet you can hear your own heartbeat. I remember the moment the war started, on February 28th."},{"id":"44","start":295.88,"end":311.68,"displayStart":295.88,"displayEnd":311.68,"displayMid":303.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.855701,"pitch":16.089842,"speechRate":4.873,"hasEvents":false,"sentence_source":"因为大家都在战争打史 大家都开始往回走，非常多 就车队一吋吋往前走，但你听到喇叭声 特别的安静，大家都默默无语的沉默当中，你看那马路桩 大家都是命运马拉车一点一点的往前开。","sentence_en":"As the war began, everyone started heading back. There were so many cars, moving inch by inch. But you couldn't hear horns—it was incredibly quiet. Everyone was silent, and as you looked at the traffic, it felt like fate was pulling the carriage forward bit by bit."},{"id":"45","start":311.68,"end":326.32,"displayStart":311.68,"displayEnd":326.32,"displayMid":319,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.886406,"pitch":17.296783,"speechRate":4.372,"hasEvents":false,"sentence_source":"没有人爱喇叭，这种安静当时就让我震撼到了，还有一次安静也让我印象深刻，就是2021年的沃克兰最低时间，当时我在现场 我在现场我就听不到声音。","sentence_en":"No one honked. That silence struck me deeply. Another time I remember vividly was during the lowest point of the pandemic in 2021. I was there and I couldn't hear a sound."},{"id":"46","start":326.32,"end":342.28,"displayStart":326.32,"displayEnd":342.28,"displayMid":334.29999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.812402,"pitch":19.896019,"speechRate":4.887,"hasEvents":false,"sentence_source":"我只听到风吹的声音，就那种迹进到 连心跳都能听到，我再想 为什么这种灾难之间这么迹进呢，就像你说可能是风暴中的风暴眼吧，这种感觉，但实际上我们这刚才还听到了，BOOM的一声。","sentence_en":"I only heard the sound of the wind, so quiet that even my heartbeat could be heard. I wondered why this disaster was so quiet, like you said, maybe it's the eye of the storm. But actually, we just heard a BOOM."},{"id":"47","start":342.28,"end":354.36,"displayStart":342.28,"displayEnd":354.36,"displayMid":348.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.857903,"pitch":18.288244,"speechRate":4.621,"hasEvents":false,"sentence_source":"日日夜夜的黑蓝都在遭到轰炸，大大小小已经在两个星期过去，都有一点习惯的感觉 刚听到会紧张，现在听到不大 好像也远 就这样。","sentence_en":"Day and night, bombs were falling. After two weeks, large and small explosions became almost routine. At first you'd tense up, but then even when you heard them, it felt distant. Like that."},{"id":"48","start":354.36,"end":359.02,"displayStart":354.36,"displayEnd":359.02,"displayMid":356.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.773236,"pitch":19.349758,"speechRate":6.019,"hasEvents":false,"sentence_source":"听一下就过去了 战争到最后好像大家也就开始慢慢的习惯了。","sentence_en":"You'd hear it and it would pass. Eventually, people start getting used to it."},{"id":"49","start":359.02,"end":370.9,"displayStart":359.02,"displayEnd":370.9,"displayMid":364.96,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.965475,"pitch":25.739737,"speechRate":5.394,"hasEvents":false,"sentence_source":"你知道看你和大家可能很多人想象当中的，战地记者或战地女记者不一样，你知道又是一个很巧的一个时间线，我记得2011年你去过叙利亚报道。","sentence_en":"You know, seeing you is different from how many people might imagine a war correspondent, especially a female one. It's also a strange coincidence in time—I remember you went to Syria to report in 2011."},{"id":"50","start":370.9,"end":386.64,"displayStart":370.9,"displayEnd":386.64,"displayMid":378.77,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":-0.1,"loudness":1.034561,"pitch":23.450726,"speechRate":4.682,"hasEvents":false,"sentence_source":"对同，样的 应该就是2012年，你记得那个美国女记者叫马利克尔文吗，她是2012年在叙利亚霍尔姆斯，她是之前01年零几年在斯里兰卡，被当时一次炮击 左眼炸伤以后。","sentence_en":"Similarly, it should be 2012. Do you remember the American female journalist Marie Colvin? She was in Homs, Syria in 2012. She was in Sri Lanka in the early 2000s and was injured in her left eye by shelling."},{"id":"51","start":386.64,"end":400.8,"displayStart":386.64,"displayEnd":400.8,"displayMid":393.72,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.5,"loudness":0.925834,"pitch":21.839756,"speechRate":5.449,"hasEvents":false,"sentence_source":"她就一直带着像一个海盗一样，把眼睛蒙住一块黑布，之后她2012年是在叙利亚霍尔姆斯，也是炮击去世了，甚至有一些怪的那种形象，是特别符合大家刻板印象当中的一个占地记者。","sentence_en":"She always wore a black patch over one eye, like a pirate. Later, in 2012, she died in Homs, Syria, from shelling. That kind of image fits the stereotype of a war correspondent."},{"id":"52","start":400.8,"end":405.82,"displayStart":400.8,"displayEnd":405.82,"displayMid":403.31,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.034095,"pitch":25.982603,"speechRate":5.964,"hasEvents":false,"sentence_source":"但你看你每次出现 你就是一种非常，当然因为在伊朗必须要带投金。","sentence_en":"But every time you appear, you're very—well, of course, you have to wear a headscarf in Iran."},{"id":"53","start":405.82,"end":410.54,"displayStart":405.82,"displayEnd":410.54,"displayMid":408.18,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.904873,"pitch":22.705221,"speechRate":5.72,"hasEvents":false,"sentence_source":"所以你的出现就是安静的，就像可能当地的一个女性的形象一样。","sentence_en":"So your presence is quiet, almost like a local woman's image."},{"id":"54","start":410.54,"end":417.38,"displayStart":410.54,"displayEnd":417.38,"displayMid":413.96000000000004,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.979868,"pitch":21.231422,"speechRate":5.317,"hasEvents":false,"sentence_source":"所以你自己被推到这个位置上，你到什么时候才意识到说，我此刻是一个战地记者。","sentence_en":"When did you realize you were being pushed into this role and thought, 'Now I'm a war correspondent'?"},{"id":"55","start":417.38,"end":419.22,"displayStart":417.38,"displayEnd":419.22,"displayMid":418.3,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.173833,"pitch":20.100777,"speechRate":6.27,"hasEvents":true,"sentence_source":"那种真是体感什么时候。","sentence_en":"That kind of sensation, when was it?"},{"id":"56","start":419.87,"end":433.53,"displayStart":419.87,"displayEnd":433.53,"displayMid":426.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.946323,"pitch":19.508303,"speechRate":4.783,"hasEvents":true,"sentence_source":"我现在我还都没适应战地记者这个说法，战地记者到底是什么样的呢，我看过其他的媒体战地记者，带着防弹背心 带着安全帽 出镜，外面是这种炮火的一天。","sentence_en":"I still haven't gotten used to the term 'war correspondent'. What is a war correspondent like? I've seen others from the media, wearing bulletproof vests and helmets on camera, with gunfire outside."},{"id":"57","start":433.53,"end":449.43,"displayStart":433.53,"displayEnd":449.43,"displayMid":441.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":-0.1,"loudness":0.874162,"pitch":22.479719,"speechRate":4.75,"hasEvents":false,"sentence_source":"但是我始终不能够把我自己的形象跟那个联系在一起，我去那些地方 虽然危险 但是我觉得还好 还可以报道，真的危险了 我才知道 真的很危险，可能还是更多情况是无知者无畏吧。","sentence_en":"But I still can't associate my own image with that. When I go to those places, though dangerous, I feel it's okay, I can still report. Only when it's truly dangerous do I realize it's really dangerous. Maybe it's still mostly ignorance being bold."},{"id":"58","start":449.43,"end":452.15,"displayStart":449.43,"displayEnd":452.15,"displayMid":450.78999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":1.013772,"pitch":24.629124,"speechRate":6.4,"hasEvents":false,"sentence_source":"我们有一次采访的时候 快到那个地方。","sentence_en":"Once during an interview, we were approaching that place."},{"id":"59","start":452.15,"end":462.05,"displayStart":452.15,"displayEnd":462.05,"displayMid":457.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.841018,"pitch":21.140568,"speechRate":4.747,"hasEvents":false,"sentence_source":"然后就是空隙嘛 两边都冒起燕地就开的，我才知道 好危险 我们在进一步可能就被炸到，有时候就是侥幸 就是幸运。","sentence_en":"Then during a lull, smoke rose from both sides. I realized how dangerous it was—if we had gone further, we might have been bombed. Sometimes it's just sheer luck."},{"id":"60","start":462.05,"end":472.15,"displayStart":462.05,"displayEnd":472.15,"displayMid":467.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.807666,"pitch":21.203047,"speechRate":5.149,"hasEvents":false,"sentence_source":"但是我在想 我真的是在这种炮弹当中，我能够站在那里 今天报道，我自己还没有一个这种的经历吧，就是很多时候是擦肩而过。","sentence_en":"But I wonder, am I really amid shells, able to stand here and report today? I haven't had such an experience—often it's just a close call."},{"id":"61","start":472.15,"end":476.99,"displayStart":472.15,"displayEnd":476.99,"displayMid":474.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.849679,"pitch":13.87854,"speechRate":4.752,"hasEvents":false,"sentence_source":"然后意识到 哦 刚才真的好险啊，还有这种就是炮弹响了。","sentence_en":"Then realizing how perilous it was, and then shells explode."},{"id":"62","start":476.99,"end":490.63,"displayStart":476.99,"displayEnd":490.63,"displayMid":483.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.882917,"pitch":19.94733,"speechRate":5.279,"hasEvents":false,"sentence_source":"然后我们把腿就跑 很狼狈的拿摔，大家就拼命往车里跑 多半是这种情况，但我想说这种生活的常态吧，我是没有办法因为战争嘛 我就在前面，但我更愿意对个记者的身份来讲。","sentence_en":"Then we'd turn and run, scrambling clumsily, everyone dashing to the car—that's mostly the case. But this is the norm of life. Because of the war, I have to be upfront, but I prefer to speak as a journalist."},{"id":"63","start":490.63,"end":506.25,"displayStart":490.63,"displayEnd":506.25,"displayMid":498.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.791741,"pitch":18.195004,"speechRate":5.057,"hasEvents":false,"sentence_source":"因为我真的是觉得记者很重要的一个就是记录，记录你眼前的不仅是炸弹 炮弹 记录眼前所有的一切吧，包括人们的反应 还原当时的情况，但你要说你看到的是客观 真实的吗，我也不能保证。","sentence_en":"Because I truly believe a journalist's key role is to record—not just bombs, but everything in front, including people's reactions, to reconstruct the scene. But can you say what you see is objective? I can't guarantee."},{"id":"64","start":506.25,"end":512.93,"displayStart":506.25,"displayEnd":512.93,"displayMid":509.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.72272,"pitch":13.714416,"speechRate":4.648,"hasEvents":false,"sentence_source":"因为我看到只是从我的眼睛里看到的，它是全面的吗 不是，它只是我的角度。","sentence_en":"Because what I see is only from my eyes. Is it comprehensive? No, it's just my perspective."},{"id":"65","start":512.93,"end":527.25,"displayStart":512.93,"displayEnd":527.25,"displayMid":520.0899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.80908,"pitch":16.316576,"speechRate":5.291,"hasEvents":false,"sentence_source":"因为看事情我们要从很多的角度去看，我只能提供从我的眼睛里看到的那些尽量真实的情况，作为一个记者 我是非常幸运的 虽然是危险，但我能够赶到这样的历史的时刻去见证它。","sentence_en":"Because to understand things we need many perspectives. I can only offer what I see as truthfully as possible. As a journalist, I'm very lucky—dangerous as it is, I can witness such historical moments."},{"id":"66","start":527.25,"end":529.71,"displayStart":527.25,"displayEnd":529.71,"displayMid":528.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.903634,"pitch":21.17182,"speechRate":5.276,"hasEvents":false,"sentence_source":"看着伊朗的未来会怎么走。","sentence_en":"Watching how Iran's future will unfold."},{"id":"67","start":529.71,"end":533.97,"displayStart":529.71,"displayEnd":533.97,"displayMid":531.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.768101,"pitch":17.234228,"speechRate":5.164,"hasEvents":false,"sentence_source":"我觉得真的很感激 有这样一个机会让我能站在这里。","sentence_en":"I feel truly grateful to have this opportunity to stand here."},{"id":"68","start":533.97,"end":540.55,"displayStart":533.97,"displayEnd":540.55,"displayMid":537.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.892882,"pitch":18.970114,"speechRate":5.6,"hasEvents":false,"sentence_source":"所以我要更要把这些东西要记录下来，而且我觉得伊朗会好的 它现在是最难的时候。","sentence_en":"So I must record these things even more. And I believe Iran will be fine—it's at its hardest now."},{"id":"69","start":540.55,"end":542.95,"displayStart":540.55,"displayEnd":542.95,"displayMid":541.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.874681,"pitch":20.893631,"speechRate":6.25,"hasEvents":false,"sentence_source":"所以我们先把这个难的时候记下来。","sentence_en":"So let's first record this difficult time."},{"id":"70","start":542.95,"end":544.21,"displayStart":542.95,"displayEnd":544.21,"displayMid":543.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":0.915911,"pitch":19.105268,"speechRate":9.009,"hasEvents":false,"sentence_source":"我们以后跟他好的时候。","sentence_en":"Later, when it gets better..."},{"id":"71","start":544.21,"end":547.05,"displayStart":544.21,"displayEnd":547.05,"displayMid":545.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterN 9.83,"displayEnd":573.13,"displayMid":571.48,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.5,"loudness":0.752103,"pitch":14.406607,"speechRate":4.242,"hasEvents":false,"sentence_source":"我可以穷尽一切努力，他说是对的。","sentence_en":"I can exhaust every effort. He is right."},{"id":"76","start":573.13,"end":578.11,"displayStart":573.13,"displayEnd":578.11,"displayMid":575.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.98927,"pitch":20.639389,"speechRate":6.543,"hasEvents":false,"sentence_source":"就好比说你要做报道的时候，你要是不去现场，你怎么做报道在家里做的。","sentence_en":"For example, when reporting, if you don't go to the scene, how can you report from home?"},{"id":"77","start":578.11,"end":583.31,"displayStart":578.11,"displayEnd":583.31,"displayMid":580.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Positive","score":0.5,"loudness":0.729593,"pitch":15.409107,"speechRate":4.938,"hasEvents":false,"sentence_source":"那也不行，一定要去现场，能够去现场，我绝对不会在家里担。","sentence_en":"That won't work. You must go to the scene. If I can go, I definitely won't stay home."},{"id":"78","start":583.31,"end":597.73,"displayStart":583.31,"displayEnd":597.73,"displayMid":590.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.759403,"pitch":19.220789,"speechRate":5.293,"hasEvents":false,"sentence_source":"但是你要做风险的评估，你明明知道那个地方在轰炸，你还要到前面去，一方面给别人造成困扰，包括我们的设计师，他也会冒风险，你要做一个完全的评估，你觉得还可以，可以去就去。","sentence_en":"But you need to assess the risk. If you know that place is being bombed, going forward will trouble others, including our designer who also takes risks. Do a full assessment. If you think it's okay, then go."},{"id":"79","start":597.73,"end":610.73,"displayStart":597.73,"displayEnd":610.73,"displayMid":604.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.4,"loudness":0.811687,"pitch":16.38941,"speechRate":5.263,"hasEvents":false,"sentence_source":"而且也不是猫状的，网状势不仅要把自己陷入困境，而且会给别人带了麻烦，今年1月份那个反政府抗议，所有的媒体是不可以拍的上街，你要去拍就掉下你的紫照。","sentence_en":"And it's not about being reckless. Doing so not only traps yourself but also brings trouble to others. During the anti-government protests this January, all media were banned from filming on the streets. If you film, they'll confiscate your credentials."},{"id":"80","start":610.73,"end":613.59,"displayStart":610.73,"displayEnd":613.59,"displayMid":612.1600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.5,"loudness":0.89828,"pitch":16.996729,"speechRate":5.594,"hasEvents":false,"sentence_source":"而且当间谍处理什么的 警告的很厉害。","sentence_en":"And they'll treat you as a spy, with severe warnings."},{"id":"81","start":613.59,"end":621.59,"displayStart":613.59,"displayEnd":621.59,"displayMid":617.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.826819,"pitch":18.917645,"speechRate":4.875,"hasEvents":false,"sentence_source":"那我们这边有很多记者100多家媒体，包括美联社 路透社 法新社，他们都在 没有人去拍。","sentence_en":"We have over 100 journalists from media outlets like AP, Reuters, AFP, and they were all there, but no one filmed it."},{"id":"82","start":621.59,"end":625.11,"displayStart":621.59,"displayEnd":625.11,"displayMid":623.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.931404,"pitch":22.598291,"speechRate":5.398,"hasEvents":false,"sentence_source":"但是这个画面谁流传 就是民众他们自己拍了。","sentence_en":"But this footage was leaked by the public themselves—they filmed it."},{"id":"83","start":625.11,"end":627.31,"displayStart":625.11,"displayEnd":627.31,"displayMid":626.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.703263,"pitch":15.224061,"speechRate":6.364,"hasEvents":false,"sentence_source":"然后传到社交平台 然后媒体一用。","sentence_en":"Then it was posted on social media, and the media used it."},{"id":"84","start":627.31,"end":641.91,"displayStart":627.31,"displayEnd":641.91,"displayMid":634.6099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Negative","score":-0.4,"loudness":0.826351,"pitch":19.278074,"speechRate":5.11,"hasEvents":false,"sentence_source":"但是就是有一个外国记者他们去拍了，拍了以后到现在他还在监狱里头，记者站全部查封 设议室也在监狱里，我就觉得不能说他这样做不对，他有自己的信仰 他觉得他要去报道。","sentence_en":"But there was one foreign journalist who did film it, and he's still in prison now—their bureau was shut down, and the office is in jail. I can't say he was wrong; he has his own beliefs and felt he had to report."},{"id":"85","start":641.91,"end":644.45,"displayStart":641.91,"displayEnd":644.45,"displayMid":643.1800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.848082,"pitch":21.278597,"speechRate":5.714,"hasEvents":false,"sentence_source":"但是如果是我 我可能不会去做。","sentence_en":"But if it were me, I probably wouldn't do it."},{"id":"86","start":644.45,"end":646.55,"displayStart":644.45,"displayEnd":646.55,"displayMid":645.5,"speaker":"Lu Yu", yStart":668.53,"displayEnd":677.29,"displayMid":672.91,"speaker":"Li Rui","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female journalists and professional identity","sentiment_en":"Neutral","score":0,"loudness":0.923343,"pitch":21.457359,"speechRate":5.524,"hasEvents":false,"sentence_source":"但是我们因为作为同行 我就有些话我敢跟你聊，比如说你真的在这样特别危险的情况当中，你有做过最坏的打算吗。","sentence_en":"But as colleagues, I can be open with you. For example, in such dangerous situations, have you ever prepared for the worst?"},{"id":"91","start":678.93,"end":687.17,"displayStart":678.93,"displayEnd":687.17,"displayMid":683.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.743994,"pitch":16.049604,"speechRate":4.612,"hasEvents":false,"sentence_source":"其实你说不上打算吧，有时候就是天天游命吧，没有办法预测会发生什么 下一秒 明天是什么。","sentence_en":"It's not really preparation. Sometimes you just live day to day. You can't predict what will happen next second or tomorrow."},{"id":"92","start":687.17,"end":690.09,"displayStart":687.17,"displayEnd":690.09,"displayMid":688.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.999902,"pitch":21.370028,"speechRate":5.858,"hasEvents":false,"sentence_source":"我们在记者战我觉得是比较安全。","sentence_en":"I think our correspondent station is relatively safe."},{"id":"93","start":690.09,"end":693.35,"displayStart":690.09,"displayEnd":693.35,"displayMid":691.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.868823,"pitch":23.515829,"speechRate":5.846,"hasEvents":false,"sentence_source":"因为我确定他还不会随便炸民居只要扔导弹。","sentence_en":"Because I'm sure they won't randomly bomb residential areas with missiles."},{"id" u drive, you don't know where you'll pass, and missile attacks are silent. You imagine a missile coming."},{"id":"98","start":722.57,"end":728.47,"displayStart":722.57,"displayEnd":728.47,"displayMid":725.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":0.899379,"pitch":20.732557,"speechRate":4.915,"hasEvents":false,"sentence_source":"然后有防空预警 大家逃 根本没有，在伊朗没有这样的情况，它是无声的。","sentence_en":"Then air raid sirens go off, everyone runs—but no, that doesn't happen in Iran. It's silent."},{"id":"99","start":728.47,"end":734.27,"displayStart":728.47,"displayEnd":734.27,"displayMid":731.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.732459,"pitch":16.118551,"speechRate":5.07,"hasEvents":false,"sentence_source":"然后就一个导弹过来，有时候你会听到很多战机的声音，就是温温作响。","sentence_en":"Then a missile comes. Sometimes you hear many fighter jets, a rumbling sound."},{"id":"100","start":734.27,"end":739.11,"displayStart":734.27,"displayEnd":739.11,"displayMid":736.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.766857,"pitch":14.385635,"speechRate":4.752,"hasEvents":false,"sentence_source":"那种声音才让人恐怖 猫骨悚，然而不知道它会争到哪里。","sentence_en":"That sound is terrifying and spine-chilling, and you don't know where it will hit."},{"id":"101","start":739.11,"end":749.49,"displayStart":739.11,"displayEnd":749.49,"displayMid":744.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.7,"loudness":0.838545,"pitch":16.921492,"speechRate":5.397,"hasEvents":false,"sentence_source":"那种声音是很大的低空的 飞校着 然后盘旋正在你脑底上这样转，这个其实是很吓人 而且我觉得这经营他们那个导弹的威力非常大。","sentence_en":"That sound is loud, low-flying, circling right above your head. It's really scary, and I think their missiles are extremely powerful."},{"id":"102","start":749.49,"end":763.23,"displayStart":749.49,"displayEnd":763.23,"displayMid":756.36,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.817637,"pitch":21.620043,"speechRate":5.469,"hasEvents":false,"sentence_source":"可以说是巨型导弹 我不知道是什么导弹 我也不太懂这个军事，但他那个导弹扔过去 你觉得地是在摇的 像地震一样，玻璃是这种温温的在想 这种威力之下 如果你要经过那个地方。","sentence_en":"They're giant missiles—I don't know what kind, I'm not a military expert. But when a missile hits, the ground shakes like an earthquake, glass vibrates. Under that kind of force, if you pass through that area..."},{"id":"103","start":763.23,"end":769.33,"displayStart":763.23,"displayEnd":769.33,"displayMid":766.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.732137,"pitch":13.018599,"speechRate":4.59,"hasEvents":false,"sentence_source":"毫无疑问你的车肯定是会被翻到很远的，人活着不活着就不知道了。","sentence_en":"No doubt your car would be flipped far away, and you wouldn't know if you'd survive."},{"id":"104","start":769.33,"end":777.25,"displayStart":769.33,"displayEnd":777.25,"displayMid":773.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.863079,"pitch":14.401603,"speechRate":5.429,"hasEvents":false,"sentence_source":"我们在拍的时候就看到一辆车就在废墟旁边，扭曲变形场在哪儿 自己也死了，就是被冲击波冲击过去的。","sentence_en":"While filming, we saw a car next to the rubble, twisted and crushed, with the driver dead—blown away by the shockwave."},{"id":"105","start":777.25,"end":779.83,"displayStart":777.25,"displayEnd":779.83,"displayMid":778.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":1.060655,"pitch":19.909233,"speechRate":5.963,"hasEvents":false,"sentence_source":"所以这个骑士路上是蛮危险的。","sentence_en":"So the road is quite dangerous."},{"id":"106","start":779.83,"end":783.15,"displayStart":779.83,"displayEnd":783.15,"displayMid":781.49,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.924973,"pitch":21.759371,"speechRate":4.127,"hasEvents":false,"sentence_source":"天呐 战争的罪恶简直无法言说。","sentence_en":"Oh my God, the evil of war is beyond words."},{"id":"107","start":783.15,"end":794.47,"displayStart":783.15,"displayEnd":794.47,"displayMid":788.81,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.911889,"pitch":21.643095,"speechRate":5.909,"hasEvents":false,"sentence_source":"因为我照我看你的战地日记里面，你写你们一家人在疫情最严重的时候，大使馆的车第二天就要来接了，你们还是决定不分开，但这一次你还是把孩子送回去了。","sentence_en":"From reading your war diary, I saw that during the peak of the pandemic, you chose not to separate your family even when the embassy car was coming the next day. But this time, you still sent your child back."},{"id":"108","start":794.47,"end":800.17,"displayStart":794.47,"displayEnd":800.17,"displayMid":797.3199999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.995708,"pitch":21.206017,"speechRate":5.639,"hasEvents":false,"sentence_source":"所以对你来说在你心里层面，你做了评估 就这次的危险是远远超出疫情。","sentence_en":"So on a psychological level, you assessed that this danger far exceeded the pandemic."},{"id":"109","start":800.17,"end":807.05,"displayStart":800.17,"displayEnd":807.05,"displayMid":803.6099999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":1.037523,"pitch":21.942146,"speechRate":6.431,"hasEvents":false,"sentence_source":"所以一家人必须要分离你，做了一个非常难以做的，就是作为母亲和作为职业女性之间的一个选择。","sentence_en":"So the family had to separate, and you made a very difficult choice between being a mother and a career woman."},{"id":"110","start":807.05,"end":809.11,"displayStart":807.05,"displayEnd":809.11,"displayMid":808.0799999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":1.215546,"pitch":23.508232,"speechRate":6.162,"hasEvents":false,"sentence_source":"主要是我去年上一日战争。","sentence_en":"Mainly, I went through the war last year."},{"id":"111","start":809.11,"end":817.17,"displayStart":809.11,"displayEnd":817.17,"displayMid":813.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.903566,"pitch":14.43589,"speechRate":4.591,"hasEvents":false,"sentence_source":"我们孩子在这儿受到了惊吓，而且走的时候 逃难过程中，机遇太突然了 安排的也比较仓促。","sentence_en":"Our child was frightened here, and when leaving during the evacuation, it was too sudden and poorly arranged."},{"id":"112","start":817.17,"end":823.95,"displayStart":817.17,"displayEnd":823.95,"displayMid":820.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":0.873358,"pitch":14.126288,"speechRate":5.015,"hasEvents":false,"sentence_source":"所以他们就坐大巴20几个小时到土库曼斯坦边境，在那里也没有热水河也等着。","sentence_en":"So they took a bus for over 20 hours to the Turkmenistan border, where there was no hot water, and they just waited."},{"id":"113","start":823.95,"end":827.11,"displayStart":823.95,"displayEnd":827.11,"displayMid":825.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.90186,"pitch":16.446318,"speechRate":5.696,"hasEvents":false,"sentence_source":"因为边境走人太多 又等了20多个小时吧。","sentence_en":"Because there were too many people at the border, they waited another 20-plus hours."},{"id":"114","start":827.11,"end":840.15,"displayStart":827.11,"displayEnd":840.15,"displayMid":833.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.897284,"pitch":16.135332,"speechRate":4.922,"hasEvents":false,"sentence_source":"那段时间是失恋的，后来我听我先生讲 他带着孩子走，晚上就睡在非常简陋的地上 孩子很冷，你说衣粉不够 也没有热水，就是我听到这些 就会让我太难过。","sentence_en":"That time was heartbreaking. Later, my husband told me how he took the child and they slept on a very simple floor. The child was cold, there wasn't enough clothing, and no hot water. Hearing this makes me very sad."},{"id":"115","start":840.15,"end":844.17,"displayStart":840.15,"displayEnd":844.17,"displayMid":842.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.3,"loudness":0.794234,"pitch":16.674038,"speechRate":3.234,"hasEvents":false,"sentence_source":"我觉得我可以在这儿经受这些。","sentence_en":"I feel I can endure this here."},{"id":"116","start":844.17,"end":846.43,"displayStart":844.17,"displayEnd":846.43,"displayMid":845.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.6,"loudness":0.857923,"pitch":23.27891,"speechRate":6.637,"hasEvents":false,"sentence_source":"因为我喜欢这份工作 我愿意在伊朗。","sentence_en":"Because I love this job, I am willing to stay in Iran."},{"id":"117","start":846.43,"end":857.81,"displayStart":846.43,"displayEnd":857.81,"displayMid":852.1199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.879616,"pitch":19.549274,"speechRate":4.649,"hasEvents":false,"sentence_source":"那是我的工作，但我的孩子为了我受这些苦难，包括害怕 惊惧 让他们的生命出于危险，我作为一个妈妈 我没有办法原谅我自己。","sentence_en":"That is my work, but my child suffers these hardships for me, including fear and terror, putting their life at risk. As a mother, I cannot forgive myself."},{"id":"118","start":857.81,"end":872.51,"displayStart":857.81,"displayEnd":872.51,"displayMid":865.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.862764,"pitch":18.213837,"speechRate":5.238,"hasEvents":false,"sentence_source":"所以我这次非常坚决 包括我先说哎呀，还是一家人待在一起吧，我就说这次绝对不一样，这次战争是初死战争，十二战争它只是一次在美国打核试试，这次他们是要整个政权 他要留存下来。","sentence_en":"So I was very firm this time. I first said, 'Ah, let's stay together as a family,' but then I said this time is completely different. This war is a life-and-death war. The previous war was just a nuclear test by the US? No, this time they are fighting for the entire regime's survival."},{"id":"119","start":872.51,"end":876.87,"displayStart":872.51,"displayEnd":876.87,"displayMid":874.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.838204,"pitch":14.210936,"speechRate":4.128,"hasEvents":false,"sentence_source":"生死之战 往死里打，谁把谁打 趴下这种感觉。","sentence_en":"A fight to the death, hitting until one side is completely down."},{"id":"120","start":876.87,"end":887.97,"displayStart":876.87,"displayEnd":887.97,"displayMid":882.4200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.6,"loudness":0.829109,"pitch":18.14879,"speechRate":4.713,"hasEvents":false,"sentence_source":"所以这次的战争是不死不休的，绝对不是你想象 而这次还是加上美国头号的军事强国，再对伊朗打 它现在已经战争就过去。","sentence_en":"So this war is relentless, definitely not what you imagine. And this time, added to that is the US, the top military power, fighting Iran. The war is already underway."},{"id":"121","start":887.97,"end":903.89,"displayStart":887.97,"displayEnd":903.89,"displayMid":895.9300000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.839432,"pitch":18.247618,"speechRate":5.174,"hasEvents":false,"sentence_source":"我觉得整个伊朗都在轰炸 人们都在说，不知道什么时候 不知道哪里安全 逃到这儿 这儿被炸，逃到那儿 那儿被炸 就是到这样有个情况，千疮百孔吧 你去看那采访的地方，真的是一条街被炸成平地所以。","sentence_en":"I think the whole of Iran is under bombardment. People are saying they don't know when or where it's safe. They flee here, it's bombed; they flee there, it's bombed. It's riddled with holes. If you look at the places being interviewed, a whole street is flattened."},{"id":"122","start":903.89,"end":912.17,"displayStart":903.89,"displayEnd":912.17,"displayMid":908.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.4,"loudness":0.822331,"pitch":19.500471,"speechRate":5.754,"hasEvents":false,"sentence_source":"我觉得我自己的决策是对的 还怎么回去，至少我能够放手干吧 不然我真的没有办法放手干 我会很担心很担心。","sentence_en":"I think my decision was right. How could I go back? At least I can focus on my work; otherwise, I really couldn't let go, I would be extremely worried."},{"id":"123","start":912.17,"end":918.39,"displayStart":912.17,"displayEnd":918.39,"displayMid":915.28,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.916071,"pitch":23.668823,"speechRate":5.724,"hasEvents":false,"sentence_source":"那所以现在你是一个人在德黑兰 你先生跟孩子在国内对，这种孤独感会不会很深。","sentence_en":"So now you are alone in Tehran, with your husband and child back home. Is that loneliness very deep?"},{"id":"124","start":918.39,"end":931.41,"displayStart":918.39,"displayEnd":931.41,"displayMid":924.9,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.3,"loudness":1.014005,"pitch":23.971628,"speechRate":5.684,"hasEvents":false,"sentence_source":"因为在战争当中 其实整个德黑兰 整个伊朗是被，算是某种程度孤立在世界之外 因为你处于战争当中，你又是在德黑兰 你其实是一个外国记者，你有独自一个人 跟家人又是隔开的。","sentence_en":"Because during war, the whole of Tehran and Iran are somewhat isolated from the world. You are in Tehran, a foreign journalist, alone and separated from your family."},{"id":"125","start":931.41,"end":940.75,"displayStart":931.41,"displayEnd":940.75,"displayMid":936.0799999999999,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":1.032763,"pitch":23.84281,"speechRate":5.157,"hasEvents":false,"sentence_source":"所以你几重意义上的被隔开，这种孤独感会因为战争期间采访报道很忙碌，而有所消解还是挺致命的有些时候。","sentence_en":"So you are isolated on multiple levels. Does the busyness of reporting during war alleviate that loneliness, or is it still quite devastating sometimes?"},{"id":"126","start":940.75,"end":942.29,"displayStart":940.75,"displayEnd":942.29,"displayMid":941.52,"speaker":"Li Rui","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.813811,"pitch":14.050992,"speechRate":4.396,"hasEvents":true,"sentence_source":"其实是太忙了。","sentence_en":"Actually, I'm too busy."},{"id":"127","start":942.29,"end":943.07,"displayStart":942.29,"displayEnd":943.07,"displayMid":942.6800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":1.244543,"pitch":26.397579,"speechRate":5.97,"hasEvents":true,"sentence_source":"顾不上还。","sentence_en":"Can't even keep up."},{"id":"128","start":943.07,"end":946.87,"displayStart":943.07,"displayEnd":946.87,"displayMid":944.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":1.045896,"pitch":26.63961,"speechRate":4.713,"hasEvents":true,"sentence_source":"对 顾不上，就有时候忙到偶尔打个电话。","sentence_en":"Yes, can't keep up. Sometimes so busy that I only make a quick call."},{"id":"129","start":946.87,"end":949.73,"displayStart":946.87,"displayEnd":949.73,"displayMid":948.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":1.249245,"pitch":24.416756,"speechRate":5.944,"hasEvents":false,"sentence_source":"然后你忙好着呢 都好着呢 好吧 那就这样。","sentence_en":"And then you say: 'Busy, but fine. Everything's fine. Okay, that's it."},{"id":"130","start":949.73,"end":957.77,"displayStart":949.73,"displayEnd":957.77,"displayMid":953.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":0.948462,"pitch":18.000134,"speechRate":5.685,"hasEvents":false,"sentence_source":"因为太忙了 你出连线还要报导，除了报导我还要写日志，还要处理一些别的事，比如说帮一些朋友联络之类的。","sentence_en":"Because I'm too busy. I have to go live, report, write a diary, and handle other things like helping friends with contacts."},{"id":"131","start":957.77,"end":961.69,"displayStart":957.77,"displayEnd":961.69,"displayMid":959.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Neutral","score":0,"loudness":1.074535,"pitch":17.760296,"speechRate":6.171,"hasEvents":false,"sentence_source":"所以就事情排不上那种，每天晚上都来不及想就睡着。","sentence_en":"So there's no time for everything. Every night I fall asleep before I can even think."},{"id":"132","start":961.69,"end":975.13,"displayStart":961.69,"displayEnd":975.13,"displayMid":968.4100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.4,"loudness":0.840519,"pitch":20.125916,"speechRate":4.836,"hasEvents":false,"sentence_source":"但是确实非常小孩子们，每天我跟先生说 让我看看孩子们，他们在干什么 让我看一眼 就这样，结果他们通常的时候就是在玩游戏，基本上就 妈妈 你好 我忙着呢。","sentence_en":"But they are really very little kids. Every day I tell my husband, let me see the kids, what they're up to, just a quick look—and most of the time they're just playing games. Basically, 'Hi Mom, I'm busy."},{"id":"133","start":975.13,"end":985.93,"displayStart":975.13,"displayEnd":985.93,"displayMid":980.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.5,"loudness":0.850279,"pitch":15.616262,"speechRate":4.509,"hasEvents":true,"sentence_source":"再见 就这样 但是看到他们我还是挺高兴的，就觉得很想他们 真的希望战争赶紧结束，回去看看他们 还有看看我妈妈。","sentence_en":"Bye, that's it. But I'm still happy to see them; I really miss them. I truly hope the war ends soon so I can go back and see them and my mom."},{"id":"134","start":985.93,"end":1000.49,"displayStart":985.93,"displayEnd":1000.49,"displayMid":993.21,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.988998,"pitch":25.24209,"speechRate":5.252,"hasEvents":true,"sentence_source":"你知道我非常高兴和欣慰地看到一点，就是作为我们女性同行之间，能够看到有人在忙碌的，而且是一种非常超现实的一种工作状态，同时还能够拥有一个非常世俗的一个生活这。","sentence_en":"You know, I'm really happy and relieved to see that among us female colleagues, there are those who are busy with a very surreal work state while still maintaining a very worldly life."},{"id":"135","start":1000.49,"end":1012.31,"displayStart":1000.49,"displayEnd":1012.31,"displayMid":1006.4,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.98923,"pitch":23.613722,"speechRate":6.131,"hasEvents":false,"sentence_source":"其实挺难能可贵的，只不过这个世俗生活被战争打断了，否则的话你其实同时都可以在你的掌控当中，这非常难能可贵，我特别欣慰 作为一个女性同好，我看到这点非常欣慰。","sentence_en":"That's actually quite rare. It's just that this worldly life has been interrupted by the war; otherwise, you could actually have it all under control. That's really commendable. As a fellow woman, I'm very relieved to see this."},{"id":"136","start":1012.31,"end":1015.69,"displayStart":1012.31,"displayEnd":1015.69,"displayMid":1014,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.654243,"pitch":18.471037,"speechRate":4.9,"hasEvents":false,"sentence_source":"生活是第一位的 我觉得，工作也很重要。","sentence_en":"Life comes first, I think. Work is also important."},{"id":"137","start":1015.69,"end":1027.63,"displayStart":1015.69,"displayEnd":1027.63,"displayMid":1021.6600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.855878,"pitch":20.368149,"speechRate":5.93,"hasEvents":false,"sentence_source":"但是如果没有生活垫底，工作也是很苍白的，这所以我能够在这也要感谢我的先生，感谢我们家里人他们支持我，如果不是他们在这 我一个人在这我也没有办法待20年。","sentence_en":"But without life as a foundation, work feels very empty. So I have to thank my husband and my family for their support. If it weren't for them, I couldn't have stayed here for 20 years alone."},{"id":"138","start":1027.63,"end":1029.71,"displayStart":1027.63,"displayEnd":1029.71,"displayMid":1028.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.3,"loudness":1.006313,"pitch":25.971436,"speechRate":7.602,"hasEvents":false,"sentence_source":"这是因为他们也喜欢待在这里。","sentence_en":"It's also because they enjoy being here."},{"id":"139","start":1029.71,"end":1033.31,"displayStart":1029.71,"displayEnd":1033.31,"displayMid":1031.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.6,"loudness":0.742134,"pitch":19.914316,"speechRate":7.778,"hasEvents":false,"sentence_source":"我们在这里觉得我们自己就是在这里生活的，这里就是我们的故乡。","sentence_en":"We feel like we are living here; this is our home."},{"id":"140","start":1033.31,"end":1047.41,"displayStart":1033.31,"displayEnd":1047.41,"displayMid":1040.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.860129,"pitch":20.025444,"speechRate":5.39,"hasEvents":false,"sentence_source":"所以我们才能扎根下来，我每一天过的也很快活，我在外面做我喜欢做的事 做我喜欢的工作和报道，我回到家还是这样温暖的家庭，这才是我的真正的后盾，如果我没有这样坚实的基础。","sentence_en":"That's why we can put down roots. I live happily every day. Outside, I do what I love—my work and reporting—and when I come home, I have such a warm family. That's my real support. Without this solid foundation,"},{"id":"141","start":1047.41,"end":1049.21,"displayStart":1047.41,"displayEnd":1049.21,"displayMid":1048.31,"speaker":"Lu Yu","speakerColor": ,"clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.890936,"pitch":16.637627,"speechRate":5.548,"hasEvents":false,"sentence_source":"所以我们经常会在一起讨论伊朗现在未来的局势，而且我们也觉得是一种互补的性格，我比较急 他比较骂 伊朗人够骂，他比伊朗人还骂 伊朗人都受不了他。","sentence_en":"So we often discuss Iran's current and future situation. I also think we have complementary personalities: I'm more impatient, he's very slow—Iranians are slow, but he's even slower than Iranians, even Iranians can't stand him."},{"id":"150","start":1094.11,"end":1098.79,"displayStart":1094.11,"displayEnd":1098.79,"displayMid":1096.4499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.912154,"pitch":19.259874,"speechRate":5.269,"hasEvents":false,"sentence_source":"但是他呢 就是比较稳重，做事情他会想很多 做很多铺垫。","sentence_en":"But he's more steady; he thinks a lot and prepares well before doing things."},{"id":"151","start":1098.79,"end":1108.59,"displayStart":1098.79,"displayEnd":1108.59,"displayMid":1103.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":0.896622,"pitch":17.038544,"speechRate":5.306,"hasEvents":false,"sentence_source":"所以很多细致的活 就包括我们因为他学理工的嘛，器材啊 电脑啊 包括软件啊什么 他都把那个搞好，这一方面我其实真的不行。","sentence_en":"So he handles many detailed tasks—since he studied engineering, he sets up all the equipment, computers, software, everything. I'm really not good at that."},{"id":"152","start":1108.59,"end":1114.43,"displayStart":1108.59,"displayEnd":1114.43,"displayMid":1111.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.897151,"pitch":18.499886,"speechRate":5.308,"hasEvents":false,"sentence_source":"所以我还挺感激他的 如果没有他的帮助，我想我的工作也不会这么的顺利。","sentence_en":"So I'm quite grateful to him. Without his help, I don't think my work would have gone so smoothly."},{"id":"153","start":1114.91,"end":1129.69,"displayStart":1114.91,"displayEnd":1129.69,"displayMid":1122.3000000000002,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.927961,"pitch":22.678566,"speechRate":5.107,"hasEvents":false,"sentence_source":"真好呀 一个成功女性的背后也有一个男士在支撑，哦 这种表述再让我觉得耳目一新了，我看到过你的那个 之前的日记里面，你讲到过孩子出生的时候 因为在伊朗的很多医院里面。","sentence_en":"That's really nice—behind a successful woman, there's also a man supporting her. Oh, this kind of expression feels refreshing to me. I've seen in your earlier diary that when you gave birth, because in many Iranian hospitals,"},{"id":"154","start":1129.69,"end":1134.83,"displayStart":1129.69,"displayEnd":1134.83,"displayMid":1132.26,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.959638,"pitch":20.673735,"speechRate":5.55,"hasEvents":false,"sentence_source":"就是男的病人是有男性的家属照料，女性病人只能有女性家属照料。","sentence_en":"male patients are cared for by male family members, and female patients only by female family members."},{"id":"155","start":1134.83,"end":1137.91,"displayStart":1134.83,"displayEnd":1137.91,"displayMid":1136.37,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.045978,"pitch":22.41441,"speechRate":6.645,"hasEvents":false,"sentence_source":"所以起你生孩子睁开眼第一眼，看到不是你老公。","sentence_en":"So when you gave birth, the first person you saw when you opened your eyes wasn't your husband."},{"id":"156","start":1137.91,"end":1140.49,"displayStart":1137.91,"displayEnd":1140.49,"displayMid":1139.2,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.813889,"pitch":21.027075,"speechRate":7.364,"hasEvents":false,"sentence_source":"因为他不能过去照顾你，是你伊朗这边的朋友。","sentence_en":"Because he couldn't be there to take care of you—it was your Iranian friends."},{"id":"157","start":1140.49,"end":1149.39,"displayStart":1140.49,"displayEnd":1149.39,"displayMid":1144.94,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.955749,"pitch":22.608974,"speechRate":6.043,"hasEvents":false,"sentence_source":"所以你看这种特殊的生活场景，可能会把两个人，反而就你们共同面对这个世界，两人关系为因子变得更加紧密，也很好 我觉得。","sentence_en":"So you see, such a unique life scenario can actually bring two people closer as you face the world together, strengthening your bond. I think that's nice."},{"id":"158","start":1149.57,"end":1165.55,"displayStart":1149.57,"displayEnd":1165.55,"displayMid":1157.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.865296,"pitch":19.200596,"speechRate":5.008,"hasEvents":false,"sentence_source":"而且我想这件事，我说也是觉得挺有意思，伊朗这边孩子出生了，妈妈不能带走，要爸往前自你才可以出院带走这个孩子，我当时因为我老大在这生 老二在这生，先生要照顾老大 我就自己说我叫车。","sentence_en":"And I think about this matter, it's quite interesting. In Iran, when a child is born, the mother cannot take it home; the father must come forward before you can be discharged with the child. At that time, since my eldest was born here and my second was also born here, my husband had to take care of the eldest, so I said I would call a cab myself."},{"id":"159","start":1165.55,"end":1176.95,"displayStart":1165.55,"displayEnd":1176.95,"displayMid":1171.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.789454,"pitch":18.865191,"speechRate":5.453,"hasEvents":false,"sentence_source":"我带着小孩子回去 还有一老妈妈的陪着我，结果那医院就不让我走，说必须你先生来签字才可以走，我当时就很生气 孩子是我生的，我为什么不能带走。","sentence_en":"I went back with my child and an elderly mother accompanying me, but the hospital wouldn't let me leave, saying my husband must come to sign. I was furious—I gave birth to the child, why couldn't I take him?"},{"id":"160","start":1177.55,"end":1184.75,"displayStart":1177.55,"displayEnd":1184.75,"displayMid":1181.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.933306,"pitch":20.214716,"speechRate":5.417,"hasEvents":false,"sentence_source":"然后他让我先生必须来，就感觉到受侮辱的感觉，后来我先生来了签字就回去了，一个小插曲吧。","sentence_en":"Then they insisted my husband come, which felt humiliating. Later he came, signed, and we left. Just a little episode."},{"id":"161","start":1184.75,"end":1198.79,"displayStart":1184.75,"displayEnd":1198.79,"displayMid":1191.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.93537,"pitch":21.464851,"speechRate":4.95,"hasEvents":false,"sentence_source":"但是我觉得两个人在这边互相帮助，当然更多的是因为有朋友 有这个伊朗妈妈，他们伊朗的干妈 干爸 我们的孩子出生的时候，我真的很感动 就是从进到医院到生下来。","sentence_en":"But I think we help each other here, and more importantly, we have friends—this Iranian mother, their godmother and godfather. When our child was born, I was truly moved, from entering the hospital to delivery."},{"id":"162","start":1198.79,"end":1214.35,"displayStart":1198.79,"displayEnd":1214.35,"displayMid":1206.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.884813,"pitch":16.432701,"speechRate":5.013,"hasEvents":false,"sentence_source":"一直到医院住院 他就彻也不休的在照顾我和孩子，当生的时候 他们也在旁边，不时的就来看一下照顾孩子打疫苗，我也没有经验 都是他们在帮我教我，怎么照顾这个孩子 我那个伊朗的干妈。","sentence_en":"She stayed up day and night in the hospital caring for me and the baby. During the birth, they were there, checking in, helping with vaccinations. I had no experience, so they taught me how to care for the child—my Iranian godmother."},{"id":"163","start":1214.35,"end":1226.65,"displayStart":1214.35,"displayEnd":1226.65,"displayMid":1220.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.897666,"pitch":19.527536,"speechRate":5.203,"hasEvents":false,"sentence_source":"他没有孙子 他女儿还没有生孩子，当我看到你的孩子那一刻 超我笑的那一刻 政坛已经看着我，我才有一种有孙子的感觉 就是我们没有觉得自己是中国人。","sentence_en":"She had no grandchildren; her daughter hadn't had children yet. When I saw your child smile at me, I felt like I had a grandchild. We never felt like I was Chinese and they were Iranian."},{"id":"164","start":1226.65,"end":1238.07,"displayStart":1226.65,"displayEnd":1238.07,"displayMid":1232.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.813688,"pitch":20.712484,"speechRate":5.353,"hasEvents":false,"sentence_source":"他们是伊朗人 我们就是一个外来的 我们一直觉得他们就是亲人，他们也把我当亲人对待 这种心灵上的真诚和交流，心和心是在一起的感觉 特别好。","sentence_en":"They're Iranian, we're outsiders, but we've always felt they are family, and they treat me like family too. That sincere connection and communication—feeling our hearts together—is especially wonderful."},{"id":"165","start":1238.07,"end":1242.25,"displayStart":1238.07,"displayEnd":1242.25,"displayMid":1240.1599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.667221,"pitch":16.700869,"speechRate":5.06,"hasEvents":false,"sentence_source":"所以我一直没觉得我自己在这儿是孤独的 无助的。","sentence_en":"So I've never felt lonely or helpless here."},{"id":"166","start":1242.25,"end":1245.73,"displayStart":1242.25,"displayEnd":1245.73,"displayMid":1243.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.860809,"pitch":23.330971,"speechRate":5.263,"hasEvents":false,"sentence_source":"因为我始终旁边有这些人 他们在关心我。","sentence_en":"Because I always have these people around me who care for me."},{"id":"167","start":1245.73,"end":1250.71,"displayStart":1245.73,"displayEnd":1250.71,"displayMid":1248.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0.1,"loudness":0.985884,"pitch":21.144182,"speechRate":5.178,"hasEvents":false,"sentence_source":"我们就像亲人一样 虽然我自己的妈妈，她不在这里 在中国。","sentence_en":"We're like family, even though my own mother is not here; she's in China."},{"id":"168","start":1250.71,"end":1264.33,"displayStart":1250.71,"displayEnd":1264.33,"displayMid":1257.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.7,"loudness":0.955247,"pitch":17.887655,"speechRate":4.145,"hasEvents":false,"sentence_source":"但是我在这里也有像妈妈一样的，外交夫人 还有这样的伊朗干妈 干爸，还有像姊妹一样的伊朗的好朋友，会经常打电话 每天会问你好吗。","sentence_en":"But here I also have a mother-like figure—a diplomat's wife, and my Iranian godmother and godfather, and Iranian friends who are like sisters. They call often, asking every day how I'm doing."},{"id":"169","start":1264.33,"end":1267.69,"displayStart":1264.33,"displayEnd":1267.69,"displayMid":1266.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.042816,"pitch":2
