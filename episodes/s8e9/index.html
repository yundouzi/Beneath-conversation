ly in a very conflicted state."},{"id":"320","start":2547.49,"end":2553.33,"displayStart":2547.49,"displayEnd":2553.33,"displayMid":2550.41,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.024064,"pitch":25.334446,"speechRate":5.137,"hasEvents":false,"sentence_source":"那种拧吧我跟你分享你可能感受，就是你不习惯当我劈上那个黑纱之后。","sentence_en":"Let me share that conflicted feeling with you—you might relate. It's like when I put on that black veil and wasn't used to it."},{"id":"321","start":2553.33,"end":2564.67,"displayStart":2553.33,"displayEnd":2564.67,"displayMid":2559,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.924353,"pitch":21.360649,"speechRate":5.379,"hasEvents":false,"sentence_source":"因为我不习惯我会踩住，每一次站起来我都会要摔倒，由于身体上的不习惯会带来心理上的那种焦躁，就随随地要跟人干仗的感觉，很多次我忘了带。","sentence_en":"Because I wasn't used to it, I would step on it and almost fall every time I stood up. That physical discomfort brought psychological anxiety—a feeling of wanting to pick a fight everywhere. Many times I forgot to bring it."},{"id":"322","start":2564.67,"end":2573.47,"displayStart":2564.67,"displayEnd":2573.47,"displayMid":2569.0699999999997,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.911433,"pitch":24.411407,"speechRate":5.909,"hasEvents":false,"sentence_source":"然后就会有人过来说你要把那个头纱带上的时候，我会压制住内心一种意志不住的火，你会发现哦这是由身体的不是带来的。","sentence_en":"Then someone would come and tell me to put on the headscarf, and I would suppress a fire I couldn't control inside. You realize, oh, this is caused by physical discomfort."},{"id":"323","start":2573.47,"end":2577.21,"displayStart":2573.47,"displayEnd":2577.21,"displayMid":2575.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.831117,"pitch":19.004793,"speechRate":6.344,"hasEvents":false,"sentence_source":"我觉得这并不是你一个人的感受，很多人都是这样。","sentence_en":"I think this isn't just your feeling—many people feel the same."},{"id":"324","start":2577.21,"end":2591.03,"displayStart":2577.21,"displayEnd":2591.03,"displayMid":2584.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":0.919601,"pitch":15.546595,"speechRate":5.405,"hasEvents":false,"sentence_source":"其实我有时候也会觉得被冒犯，尤其有人跟我说你戴好头巾，包括现在因为伊朗经过不断的女性的抗争，她已经不太管这个女性的头巾的问题了，就是好多女性可以不戴头巾了。","sentence_en":"Actually, sometimes I also feel offended, especially when someone tells you to wear your headscarf properly. But now, because of continuous women's protests in Iran, they don't enforce the headscarf rule as strictly anymore—many women can go without it."},{"id":"325","start":2591.03,"end":2592.87,"displayStart":2591.03,"displayEnd":2592.87,"displayMid":2591.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Positive","score":0.5,"loudness":0.994873,"pitch":18.911537,"speechRate":7.407,"hasEvents":false,"sentence_source":"所以下次来你可以不戴头巾。","sentence_en":"So next time you come, you can go without a headscarf."},{"id":"326","start":2592.87,"end":2601.03,"displayStart":2592.87,"displayEnd":2601.03,"displayMid":2596.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.941257,"pitch":20.72646,"speechRate":5.313,"hasEvents":false,"sentence_source":"但是就算这种情况下我在外交部，我戴着头巾，只是我穿了个裙子夏天 我很热，她就先我裙子短露出腿。","sentence_en":"But even in that situation, I was at the Ministry of Foreign Affairs, wearing a headscarf. I had on a skirt because it was summer and I was hot, but she pointed out that my skirt was short and showed my legs."},{"id":"327","start":2601.03,"end":2608.07,"displayStart":2601.03,"displayEnd":2608.07,"displayMid":2604.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.854209,"pitch":20.431139,"speechRate":4.83,"hasEvents":false,"sentence_source":"然后不让我进门，我当时就有一种被羞辱的感觉，很强烈的这种被羞辱，脸上很无光。","sentence_en":"And then she wouldn't let me in. At that moment, I felt humiliated—a very strong sense of humiliation, losing face."},{"id":"328","start":2608.07,"end":2614.57,"displayStart":2608.07,"displayEnd":2614.57,"displayMid":2611.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":1.033752,"pitch":22.638155,"speechRate":4.688,"hasEvents":false,"sentence_source":"但是怎么办呢没办法，我只能想办法去附近的商店转一转，看有没有袜子。","sentence_en":"But what could I do? There was no choice. I had to find a way—go to a nearby shop and look for socks."},{"id":"329","start":2614.57,"end":2618.45,"displayStart":2614.57,"displayEnd":2618.45,"displayMid":2616.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.81361,"pitch":18.888519,"speechRate":5.155,"hasEvents":false,"sentence_source":"然后我就穿上一个很厚的袜子，消防原用的袜子。","sentence_en":"So I put on a very thick pair of socks, the kind used by firefighters."},{"id":"330","start":2618.45,"end":2624.07,"displayStart":2618.45,"displayEnd":2624.07,"displayMid":2621.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.794631,"pitch":17.100925,"speechRate":4.804,"hasEvents":false,"sentence_source":"然后我就进去了，但并不是我觉得抗拒，我只能说好吧，你们这么想。","sentence_en":"Then I went in. But it's not that I resisted; I just said, 'Fine, if that's what you think."},{"id":"331","start":2624.07,"end":2625.11,"displayStart":2624.07,"displayEnd":2625.11,"displayMid":2624.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.032741,"pitch":31.563538,"speechRate":5.769,"hasEvents":false,"sentence_source":"那我还要工作。","sentence_en":"I still had work to do."},{"id":"332","start":2625.11,"end":2627.65,"displayStart":2625.11,"displayEnd":2627.65,"displayMid":2626.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.030843,"pitch":27.898016,"speechRate":5.512,"hasEvents":false,"sentence_source":"那我就想办法去，我虽然觉得羞辱。","sentence_en":"So I found a way to get in, even though I felt humiliated."},{"id":"333","start":2627.65,"end":2635.63,"displayStart":2627.65,"displayEnd":2635.63,"displayMid":2631.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.930532,"pitch":19.146,"speechRate":4.261,"hasEvents":false,"sentence_source":"但是我能理解他们希望，或者有些人他觉得，这是他们的一种权威 让我们去服从他。","sentence_en":"But I can understand that they—or some people—think this is their authority for us to obey."},{"id":"334","start":2635.63,"end":2649.13,"displayStart":2635.63,"displayEnd":2649.13,"displayMid":2642.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":0.905304,"pitch":18.301476,"speechRate":4.963,"hasEvents":false,"sentence_source":"因为我的工作 我必须要这样做 包括戴口金，这也不是我的信仰 但是我其实觉得有点遗憾的，这20年 我为什么经常会发现，我好像不太了解伊朗 这块我没有想过。","sentence_en":"Because of my work, I had to do this, including wearing a headscarf. It's not my belief, but I actually feel a bit regretful. Over these 20 years, why do I often feel that I don't really understand Iran? I hadn't thought about that part."},{"id":"335","start":2649.13,"end":2656.41,"displayStart":2649.13,"displayEnd":2656.41,"displayMid":2652.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.779444,"pitch":18.171646,"speechRate":5.22,"hasEvents":false,"sentence_source":"我记得会这么反响 因为我觉得我们跟他们，完全是处在一个不同的世界 我们是快速发展的。","sentence_en":"I remember it would get such a reaction because I felt we were in a completely different world—we were developing rapidly."},{"id":"336","start":2656.41,"end":2670.85,"displayStart":2656.41,"displayEnd":2670.85,"displayMid":2663.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.906895,"pitch":20.773283,"speechRate":4.641,"hasEvents":false,"sentence_source":"我们是与西方 与世界是沟通的，这个国家一直是被孤立的，它的人民是非常传统的，他们是一个精神世界，你跟伊朗人谈论的时候，他们很多 一个是他们热爱家庭。","sentence_en":"We were connected to the West and the world, while this country had always been isolated, its people very traditional, living in a spiritual world. When you talk to Iranians, one thing is their love for family."},{"id":"337","start":2670.85,"end":2686.17,"displayStart":2670.85,"displayEnd":2686.17,"displayMid":2678.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.936172,"pitch":19.088741,"speechRate":4.912,"hasEvents":false,"sentence_source":"还有就是你随便跟一个司机讲话，他跟你念诗歌 朗朗上口，他们热爱生活 生活当中到处都是美，你在德海兰仔细看，每个房子的门和窗是不一样的，伊朗人的家里再使家属私宾到农村。","sentence_en":"Also, if you talk to any driver, he'll recite poetry fluently. They love life—beauty is everywhere. In Tehran, if you look closely, every house has different doors and windows. Iranian families, even when hosting guests, will take them to the countryside."},{"id":"338","start":2686.17,"end":2700.71,"displayStart":2686.17,"displayEnd":2700.71,"displayMid":2693.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.8,"loudness":0.903376,"pitch":15.854586,"speechRate":4.746,"hasEvents":false,"sentence_source":"你看他摆的餐具都是非常好看的，墙上都是五颜六色的 非常好看的手工是自己编的，再不记外面这段野花装的家里头 也是深去昂然的，饭也是极好看的 米饭你记得吧。","sentence_en":"Look at the tableware he arranged—it's all very beautiful. The walls are colorful, and the handmade crafts are woven by themselves. Even the wildflowers outside are placed in the house, bringing vitality. The food is also beautifully presented. Remember the rice?"},{"id":"339","start":2700.71,"end":2715.51,"displayStart":2700.71,"displayEnd":2715.51,"displayMid":2708.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.979118,"pitch":18.87682,"speechRate":4.89,"hasEvents":false,"sentence_source":"金黄色的藏红花的米饭 然后配上配菜，放点沙拉 果冻蛋糕 你就觉得是一种美的享受，你不要说它好不好吃 先说好看不好看，他们就是很重视这些东西 重视他们的传统节日。","sentence_en":"Saffron-tinted golden rice with side dishes, a bit of salad, jelly cake—you feel it's a visual pleasure. Don't say whether it's tasty, first say if it's beautiful. They really value these things, their traditional festivals."},{"id":"340","start":2715.51,"end":2729.27,"displayStart":2715.51,"displayEnd":2729.27,"displayMid":2722.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.876958,"pitch":18.852268,"speechRate":4.193,"hasEvents":false,"sentence_source":"重视家庭 这种家庭不是自己的妻子 孩子这种小的核心，是一个大的家族 甚至是一个街区或者一个村庄，这样都视为家庭 甚至是一个族群。","sentence_en":"They value family—not just the nuclear family of wife and children, but a large clan, even a neighborhood or a village. All of that is considered family, even an ethnic group."},{"id":"341","start":2729.27,"end":2743.91,"displayStart":2729.27,"displayEnd":2743.91,"displayMid":2736.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.878732,"pitch":22.868532,"speechRate":4.986,"hasEvents":false,"sentence_source":"所以我们在了解他们的时候 我们就很难理解，比如说 我昨天跟一个教授讲话，你看到我写的是这 他完全可以去中国，他有签交 他们今年已经在学校让他去，中国当外交 他不肯去。","sentence_en":"So when we try to understand them, it's hard. For example, yesterday I spoke with a professor. You see what I wrote—he could totally go to China. He has a visa, his school even arranged for him to go this year to be a diplomat in China, but he refused."},{"id":"342","start":2743.91,"end":2748.63,"displayStart":2743.91,"displayEnd":2748.63,"displayMid":2746.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.968271,"pitch":20.660172,"speechRate":4.873,"hasEvents":false,"sentence_source":"我说你现在可以走啊 虽然没有飞机直飞，你可以到边境。","sentence_en":"I said, 'You can leave now. Even though there are no direct flights, you can go to the border."},{"id":"343","start":2748.63,"end":2762.13,"displayStart":2748.63,"displayEnd":2762.13,"displayMid":2755.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.915575,"pitch":17.558449,"speechRate":5.367,"hasEvents":false,"sentence_source":"然后你从边境可以转机到亚美尼亚阿赛北疆，再转机去中国，完全长通，你还可以带着你的孩子妻子去，他说你知道的我们伊朗人的家，不是一个小概念，它是一个非常大的概念。","sentence_en":"Then from the border you can take a connecting flight to Armenia or Azerbaijan, then to China—it's completely open. You can even take your wife and children.' He said, 'You know, for us Iranians, home is not a small concept. It's a very big concept."},{"id":"344","start":2762.13,"end":2766.83,"displayStart":2762.13,"displayEnd":2766.83,"displayMid":2764.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.6,"loudness":1.008202,"pitch":21.363045,"speechRate":5.519,"hasEvents":false,"sentence_source":"他说他去年12日战争，他在中国 他和家人，他说他太难受了。","sentence_en":"He said during the war last December, he was in China with his family, and he felt terrible."},{"id":"345","start":2766.83,"end":2778.39,"displayStart":2766.83,"displayEnd":2778.39,"displayMid":2772.6099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.931315,"pitch":16.064703,"speechRate":5.038,"hasEvents":false,"sentence_source":"所以他决定还是要跟他们的家里人，搭在一起，这让我感觉到非常的感动，而且我对伊朗人充满了敬意，我在这样危险的时刻大家都想着逃。","sentence_en":"So he decided he had to stay with his family. That really moved me, and I have great respect for Iranians. At such a dangerous time, everyone thinks of fleeing."},{"id":"346","start":2778.39,"end":2790.89,"displayStart":2778.39,"displayEnd":2790.89,"displayMid":2784.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.931271,"pitch":17.567036,"speechRate":5.288,"hasEvents":false,"sentence_source":"但是要逃也是要一起走，不会自己就跑掉，甚至外面的人跑到迪拜，跑到其他就正好是留在那里的人，会千方设法地从各种飞飞到边境再飞回来，就是到家人身边。","sentence_en":"But if they flee, they flee together—they never go alone. Even those outside who ran to Dubai or elsewhere, those who stayed behind will do everything possible to fly to the border and then fly back, just to be with their families."},{"id":"347","start":2790.89,"end":2805.83,"displayStart":2790.89,"displayEnd":2805.83,"displayMid":2798.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.917475,"pitch":18.451851,"speechRate":5.245,"hasEvents":false,"sentence_source":"所以伊朗人是重重亲情的，就是每当我了解他们内心世界的时候，我一方面是尊敬，一方面我是感到畅惘，还有就是我不了解他们，我每次跟伊朗人接触我都感觉我好像又发现了新的东西。","sentence_en":"So Iranians are deeply family-oriented. Whenever I understand their inner world, I feel both respect and confusion. Also, I don't fully understand them; every time I interact with Iranians, I feel like I've discovered something new."},{"id":"348","start":2805.83,"end":2821.73,"displayStart":2805.83,"displayEnd":2821.73,"displayMid":2813.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.943412,"pitch":19.588701,"speechRate":4.403,"hasEvents":false,"sentence_source":"所以这是不断的在累积的，你一个刚刚来的 不懂语言的游客，他只能看到一个小方面，但他的文化是丰富的，他的社会是多元的，他又传统又现代，他又世俗又宗教 各种矛盾。","sentence_en":"So it's constantly accumulating. A tourist who just arrived and doesn't understand the language can only see a small aspect. But its culture is rich, its society is diverse. It's both traditional and modern, both secular and religious, full of contradictions."},{"id":"349","start":2821.73,"end":2827.79,"displayStart":2821.73,"displayEnd":2827.79,"displayMid":2824.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.852959,"pitch":19.783657,"speechRate":4.95,"hasEvents":false,"sentence_source":"但是他都能够在这个地方体现，他就像个万花桶一样，从哪看他都不一样。","sentence_en":"But he can embody all of that. He's like a kaleidoscope—no matter how you look at him, he's different."},{"id":"350","start":2827.79,"end":2833.77,"displayStart":2827.79,"displayEnd":2833.77,"displayMid":2830.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.962103,"pitch":23.994783,"speechRate":5.646,"hasEvents":false,"sentence_source":"所以外面的人看他确实是不太了解，我到现在20年 我也不敢说我很了解伊朗。","sentence_en":"So outsiders really don't understand him. Even after twenty years, I still can't say I know Iran well."},{"id":"351","start":2833.77,"end":2843.97,"displayStart":2833.77,"displayEnd":2843.97,"displayMid":2838.87,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.6,"loudness":0.976568,"pitch":26.449308,"speechRate":5.882,"hasEvents":false,"sentence_source":"记得一下 非常深，我当时2000年 我离开伊朗的时候，我很难过 因为我跟我的团队，一起相处了一个月之后 我要回香港，有一些离别的仇恤在那。","sentence_en":"I remember it very vividly. When I left Iran in 2000, I was very sad because after spending a month with my team, I had to return to Hong Kong. There was some melancholy of parting."},{"id":"352","start":2843.97,"end":2855.11,"displayStart":2843.97,"displayEnd":2855.11,"displayMid":2849.54,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.3,"loudness":0.907876,"pitch":24.579222,"speechRate":5.925,"hasEvents":false,"sentence_source":"然后我一个人在机场转呢，很落寞 有一个伊朗的女孩，她在等飞机 她过来拍拍我说，我给你看一些照片，她又打开了她的包 拿出一些照片，她说这是我们生活当中。","sentence_en":"Then I was walking alone in the airport, feeling lonely. An Iranian girl waiting for her flight came over, tapped me, and said, 'Let me show you some photos.' She opened her bag and took out pictures. She said, 'These are from our daily life."},{"id":"353","start":2855.11,"end":2867.17,"displayStart":2855.11,"displayEnd":2867.17,"displayMid":2861.1400000000003,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.8,"loudness":1.048671,"pitch":25.503841,"speechRate":5.435,"hasEvents":false,"sentence_source":"我们在私底下 在家里面办服装秀的照片，他说你要不要看 但是你不能跟别人讲，哇 那时候我很震惊，我想哦 原来在那些黑沙之下有另外一种五颜六色的生活。","sentence_en":"Photos of our private fashion shows at home. Do you want to see? But you can't tell anyone.' Wow, I was shocked. I thought, 'So underneath those black veils, there's another colorful life."},{"id":"354","start":2867.17,"end":2873.89,"displayStart":2867.17,"displayEnd":2873.89,"displayMid":2870.5299999999997,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.4,"loudness":1.133845,"pitch":23.299116,"speechRate":7.512,"hasEvents":false,"sentence_source":"那是2000年 可能现在完全已经改变了，但那个时候他相信我这样一个来自外国的陌生人觉得跟我讲是安全的。","sentence_en":"That was 2000—maybe everything has changed now. But at that time, she trusted me, a foreign stranger, and felt it was safe to tell me."},{"id":"355","start":2873.89,"end":2885.51,"displayStart":2873.89,"displayEnd":2885.51,"displayMid":2879.7,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.948357,"pitch":22.54587,"speechRate":5.666,"hasEvents":false,"sentence_source":"那场景象非常深 我知道哦 所有的你看到的世界，它的背后还有另外一个可能更真实的 更丰富的 更鲜活的样子，是你不知道的对的，伊朗就像一个木布一样。","sentence_en":"That scene left a deep impression. I realized that behind the world we see, there's another, perhaps more real, richer, more vivid side that you don't know. Iran is like a piece of cloth."},{"id":"356","start":2885.51,"end":2899.79,"displayStart":2885.51,"displayEnd":2899.79,"displayMid":2892.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.880172,"pitch":19.594456,"speechRate":5.504,"hasEvents":false,"sentence_source":"我们从外面人看 它是一个木布的，遮住的 但你要到这个家里，你把目不打开 伊朗的市民生活，它是非常自由的 非常热爱生活的，甚至超过你的想象的那种，他们在家里开party 很自由。","sentence_en":"From the outside, it's a cloth, covering things. But if you go into that home and lift the cloth, Iranian civic life is very free, full of love for life—even beyond your imagination. They have parties at home, very freely."},{"id":"357","start":2899.79,"end":2909.97,"displayStart":2899.79,"displayEnd":2909.97,"displayMid":2904.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.933694,"pitch":16.326277,"speechRate":5.01,"hasEvents":false,"sentence_source":"一起喝茶 也喜欢跳舞，非常喜欢跳舞 有点音乐就喜欢跳舞，是这样的 但是你外面看都是，好像黑袍鼓鼓 大家都很严肃 很传统。","sentence_en":"They drink tea together, love to dance—they love dancing so much, any music gets them moving. That's how it is. But from the outside, it's all black robes, everyone looking serious and traditional."},{"id":"358","start":2909.97,"end":2922.15,"displayStart":2909.97,"displayEnd":2922.15,"displayMid":2916.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.836157,"pitch":18.61117,"speechRate":5.702,"hasEvents":true,"sentence_source":"其实也是不一样，而且我觉得它政府跟民众，它是像一个平行体一样 互不干涉，就是你上面随便你做什么，老百姓下面随便做什么，好像大家都甚至有点对着干的感觉。","sentence_en":"Actually, it's different. And I think the government and the people are like two parallel entities, non-interfering. Whatever you do up there, the people down below do whatever they want. It almost feels like they are working against each other."},{"id":"359","start":2923.15,"end":2927.01,"displayStart":2923.15,"displayEnd":2927.01,"displayMid":2925.08,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.974378,"pitch":28.115978,"speechRate":6.98,"hasEvents":true,"sentence_source":"嗯 我都想知道，你是融入那个环境当中，你花了那段时间。","sentence_en":"Well, I want to know, how did you integrate into that environment? How long did it take you?"},{"id":"360","start":2927.39,"end":2929.71,"displayStart":2927.39,"displayEnd":2929.71,"displayMid":2928.55,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":1.045903,"pitch":24.687004,"speechRate":6.205,"hasEvents":false,"sentence_source":"因为会他们的语言帮助太大了。","sentence_en":"Because knowing their language helps a lot."},{"id":"361","start":2929.71,"end":2937.23,"displayStart":2929.71,"displayEnd":2937.23,"displayMid":2933.4700000000003,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.036624,"pitch":24.589029,"speechRate":6.334,"hasEvents":false,"sentence_source":"但是因为一个学外语的人明白，英语以外的其他的语言都相当难，Forsy特别难，这个学习的过程花了你多久。","sentence_en":"But as someone who studies foreign languages knows, languages other than English are quite difficult. Farsi is especially hard. How long did the learning process take you?"},{"id":"362","start":2937.23,"end":2938.89,"displayStart":2937.23,"displayEnd":2938.89,"displayMid":2938.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.762266,"pitch":25.263134,"speechRate":4.563,"hasEvents":false,"sentence_source":"波斯语四年嘛。","sentence_en":"It took four years for Persian."},{"id":"363","start":2938.89,"end":2946.15,"displayStart":2938.89,"displayEnd":2946.15,"displayMid":2942.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.924909,"pitch":24.148315,"speechRate":6.926,"hasEvents":false,"sentence_source":"但是我后来英修生也都觉得，不是这个专业，后来好多也忘了，我记得我刚来医老师，我第一天当导机场，我刚想说波斯语。","sentence_en":"But later, even the English majors felt that since it wasn't their specialty, they forgot a lot. I remember when I first came to Iran, on my first day as a tour guide, I was about to speak Persian."},{"id":"364","start":2946.15,"end":2959.81,"displayStart":2946.15,"displayEnd":2959.81,"displayMid":2952.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":0.863476,"pitch":19.833412,"speechRate":5.564,"hasEvents":false,"sentence_source":"所以我就开始 诶 这个词怎么说 给忘了，后来我们还好 就是因为你有基础嘛 很快就跟上了，而且在那个环境里 更重要的是 我感谢我们外教一家，我外教外教夫人 我在学校 他们就来看我。","sentence_en":"So I started... um, how do you say this word? I forgot. Later, we were fine because I had a foundation and quickly caught up. And in that environment, more importantly, I thank my foreign teacher and his wife—they came to see me at school."},{"id":"365","start":2959.81,"end":2974.71,"displayStart":2959.81,"displayEnd":2974.71,"displayMid":2967.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.6,"loudness":0.868491,"pitch":16.773384,"speechRate":5.217,"hasEvents":false,"sentence_source":"我当时在大学宿舍 每个星期 我教完书以后，在星期日了 我外教也在那教书，一个学校 莎莉别实体大学 他就在那等我，我就跟他一起回家 就在那度周末待两三天，假期基本就在他们家里待。","sentence_en":"At that time, I was in the university dormitory. After finishing teaching each week on Sunday, my foreign teacher was also teaching at the same school—Shariati University. He would wait for me, and I would go home with him to spend the weekend there for two or three days. During holidays, I basically stayed at their home."},{"id":"366","start":2974.71,"end":2978.57,"displayStart":2974.71,"displayEnd":2978.57,"displayMid":2976.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.6,"loudness":0.906011,"pitch":19.835209,"speechRate":7.357,"hasEvents":false,"sentence_source":"我还觉得挺开心的，而且在他们那个伊朗人家也学博士语非常宽。","sentence_en":"I felt quite happy, and in that Iranian family, I also learned Persian widely."},{"id":"367","start":2978.57,"end":2982.95,"displayStart":2978.57,"displayEnd":2982.95,"displayMid":2980.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":0.765837,"pitch":21.348406,"speechRate":5.251,"hasEvents":false,"sentence_source":"因为你们一起吃 一起玩 一起出去，每天不停在讲博士语。","sentence_en":"Because we ate together, played together, went out together, and kept speaking Persian every day."},{"id":"368","start":2982.95,"end":2985.43,"displayStart":2982.95,"displayEnd":2985.43,"displayMid":2984.1899999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.6,"loudness":0.818153,"pitch":21.763268,"speechRate":6.135,"hasEvents":false,"sentence_source":"所以我一个月以后我就非常自如了。","sentence_en":"So after one month, I became very fluent."},{"id":"369","start":2985.91,"end":2990.23,"displayStart":2985.91,"displayEnd":2990.23,"displayMid":2988.0699999999997,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.90189,"pitch":20.204784,"speechRate":5.211,"hasEvents":false,"sentence_source":"那你现在日常生活当中讲中文多还是讲博士语多。","sentence_en":"In your daily life now, do you speak more Chinese or more Persian?"},{"id":"370","start":2991.09,"end":2996.87,"displayStart":2991.09,"displayEnd":2996.87,"displayMid":2993.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.971153,"pitch":21.616802,"speechRate":5.709,"hasEvents":true,"sentence_source":"因为有时候我跟中文说说我开始讲博士语，就有点想不起来中国这个词怎么说。","sentence_en":"Because sometimes when I'm speaking Chinese, I start speaking Persian and then I can't remember how to say a Chinese word."},{"id":"371","start":2996.87,"end":2999.11,"displayStart":2996.87,"displayEnd":2999.11,"displayMid":2997.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.857727,"pitch":19.989452,"speechRate":4.911,"hasEvents":false,"sentence_source":"但是也没觉得自己有多好。","sentence_en":"But I don't think I'm that great."},{"id":"372","start":2999.11,"end":3008.89,"displayStart":2999.11,"displayEnd":3008.89,"displayMid":3004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.84078,"pitch":17.718163,"speechRate":5.112,"hasEvents":false,"sentence_source":"因为博士语实在太不大精神了，你会普通的博士语，你还要会伊朗的这种书面语 很讲究每个词，我也没到那个很好的地步。","sentence_en":"Because Persian is really demanding. You need to know not only colloquial Persian but also the formal written language, which is very particular about every word. I haven't reached that high level."},{"id":"373","start":3008.89,"end":3016.91,"displayStart":3008.89,"displayEnd":3016.91,"displayMid":3012.8999999999996,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.023405,"pitch":24.138334,"speechRate":5.86,"hasEvents":false,"sentence_source":"还记得你当时刚刚踏上伊朗的时候，除了可能语言 你需要再有一个翻新的过程以外，让你比较难以适应的是什么。","sentence_en":"Do you remember when you first set foot in Iran, besides the language, what was difficult to adapt to? You went through an adjustment process."},{"id":"374","start":3016.91,"end":3030.89,"displayStart":3016.91,"displayEnd":3030.89,"displayMid":3023.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.959998,"pitch":21.574068,"speechRate":4.49,"hasEvents":false,"sentence_source":"难以适应的 我觉得还是，我分不清楚 这种分不清楚是，不知道分寸在哪里，记得我刚来的时候 在学校的宿舍，下面有个专门修电脑中心的一个管理人员。","sentence_en":"What was hard to adapt to? I think it was not being able to tell—this not being able to tell where the boundaries are. I remember when I first arrived, in the school dormitory, there was a manager from the computer repair center downstairs."},{"id":"375","start":3030.89,"end":3033.35,"displayStart":3030.89,"displayEnd":3033.35,"displayMid":3032.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.5,"loudness":1.076644,"pitch":23.211666,"speechRate":4.348,"hasEvents":false,"sentence_source":"他就非常热情 说欢迎你。","sentence_en":"He was very warm and said, 'Welcome."},{"id":"376","start":3033.35,"end":3036.73,"displayStart":3033.35,"displayEnd":3036.73,"displayMid":3035.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.4,"loudness":1.086893,"pitch":23.14209,"speechRate":5.324,"hasEvents":false,"sentence_source":"然后我太太我们一块去公园可以烧烤。","sentence_en":"Then he said my wife and I could go to the park for a barbecue."},{"id":"377","start":3036.73,"end":3052.51,"displayStart":3036.73,"displayEnd":3052.51,"displayMid":3044.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.019103,"pitch":18.215254,"speechRate":5.006,"hasEvents":false,"sentence_source":"我们有国家公园非常漂亮，我就心以为真了，第二天正好我也没课，我就心冲冲地准备好，就下来了，我就见到他 我说我们可以走了吧，他说去哪呀，我说你昨天不是说去国家公园吗，他就有点尴尬。","sentence_en":"We have a national park, very beautiful. I took it seriously. The next day I had no classes, so I excitedly prepared and went downstairs. I saw him and said, 'Can we go?' He said, 'Where?' I said, 'Didn't you say yesterday we'd go to the national park?' He looked a bit embarrassed."},{"id":"378","start":3052.51,"end":3064.07,"displayStart":3052.51,"displayEnd":3064.07,"displayMid":3058.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.924141,"pitch":17.18379,"speechRate":4.941,"hasEvents":false,"sentence_source":"他说今天还没有准备好，我说有一天我们可以一起去，就当时我就得不太好意思，我也有点尴尬，我说没关系 后来我们就再也没有怎么出酒。","sentence_en":"He said he wasn't ready today. I said, 'We can go together one day.' Then I felt a bit embarrassed, and I was also awkward. I said, 'It's okay.' After that, we never really went out much."},{"id":"379","start":3064.07,"end":3069.03,"displayStart":3064.07,"displayEnd":3069.03,"displayMid":3066.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.9975,"pitch":24.807497,"speechRate":4.104,"hasEvents":false,"sentence_source":"我是对伊朗人很客套 他对外来人非常的热情。","sentence_en":"Iranians are very polite and extremely warm toward outsiders."},{"id":"380","start":3069.03,"end":3083.33,"displayStart":3069.03,"displayEnd":3083.33,"displayMid":3076.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.885177,"pitch":20.554005,"speechRate":3.986,"hasEvents":false,"sentence_source":"但是你也分不清楚其中的分寸在哪里，不仅是我 把我先生刚来 他也比较疏呆子气吧，比较信以为真 他坐出租车 然后出租车司机就不要钱。","sentence_en":"But you can't tell where the boundaries are. Not just me—my husband when he first came was also a bit naive and took things literally. He took a taxi, and the driver didn't want to take money."},{"id":"381","start":3083.33,"end":3090.09,"displayStart":3083.33,"displayEnd":3090.09,"displayMid":3086.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.910788,"pitch":20.972803,"speechRate":5.03,"hasEvents":false,"sentence_source":"他就非要给他钱 出租车司机还是不要钱，说你是我的客人 其实这是伊朗人的客气。","sentence_en":"He insisted on paying, but the driver still refused, saying 'You are my guest.' Actually, it's Iranian politeness."},{"id":"382","start":3090.09,"end":3094.01,"displayStart":3090.09,"displayEnd":3094.01,"displayMid":3092.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.879938,"pitch":16.184341,"speechRate":4.592,"hasEvents":false,"sentence_source":"然后他推举了三次 他就不给钱了 他就走了。","sentence_en":"Then after refusing three times, he stopped insisting and left."},{"id":"383","start":3094.01,"end":3097.61,"displayStart":3094.01,"displayEnd":3097.61,"displayMid":3095.8100000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":1.053631,"pitch":26.082121,"speechRate":6.182,"hasEvents":true,"sentence_source":"然后出自车司机就跟他后面说 钱呀 你得给我钱。","sentence_en":"Then the driver behind him said, 'Money, you have to give me money.'"},{"id":"384","start":3099.23,"end":3113.27,"displayStart":3099.23,"displayEnd":3113.27,"displayMid":3106.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.943247,"pitch":23.820971,"speechRate":4.527,"hasEvents":true,"sentence_source":"所以刚开始是拿你不了分寸 因为我们比较新时嘛，我也不知道他说的是真的心 喜欢你 邀请你 还是怎么样，但你后来慢慢接触 你大概知道分寸在哪里。","sentence_en":"So at first, I couldn't gauge the boundaries because we were new. I didn't know if he truly liked me and was sincerely inviting me or what. But later, as you interact more, you roughly learn where the boundaries are."},{"id":"385","start":3113.27,"end":3122.99,"displayStart":3113.27,"displayEnd":3122.99,"displayMid":3118.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.871763,"pitch":22.918285,"speechRate":5.824,"hasEvents":false,"sentence_source":"我接触的很多伊朗人 包括经常去中国做生意，我认识一个人 他去中国做20年生意，他去中国次数比我多多了 几乎每一个月都去中国。","sentence_en":"Many Iranians I've met, including those who frequently do business in China. I know one person who has been doing business in China for 20 years—he has been to China many more times than I have, almost every month."},{"id":"386","start":3123.45,"end":3130.49,"displayStart":3123.45,"displayEnd":3130.49,"displayMid":3126.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.894395,"pitch":24.344244,"speechRate":5.04,"hasEvents":false,"sentence_source":"但是他跟我讲中国的时候 他对中国人了解，我都惊呆了 我觉得他根本就不了解中国。","sentence_en":"But when he talked to me about China and his understanding of Chinese people, I was shocked. I felt he didn't understand China at all."},{"id":"387","start":3130.49,"end":3139.11,"displayStart":3130.49,"displayEnd":3139.11,"displayMid":3134.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.914287,"pitch":19.106813,"speechRate":4.756,"hasEvents":false,"sentence_source":"但是当我跟他争论的时候，他就会觉得有点被冒犯的感觉，就有点不太开心，后来我还在想这个事情。","sentence_en":"But when I argued with him, he felt a bit offended and became unhappy. Later, I kept thinking about this."},{"id":"388","start":3139.11,"end":3155.09,"displayStart":3139.11,"displayEnd":3155.09,"displayMid":3147.1000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.959296,"pitch":20.809658,"speechRate":4.881,"hasEvents":false,"sentence_source":"我觉得有些人他们就算是去了很多次中国，看了很多的世界 但他内心是不开放的，内心是分泌的 跟他接触的 或者他比较信赖的，还是他周边的人 他的家人 他的兄弟姐妹 或者这个整个家族。","sentence_en":"I think some people, even if they have been to China many times and seen a lot of the world, are not open-minded inside. They are closed off, and the people they interact with or trust are still those around them—their family, siblings, or the whole clan."},{"id":"389","start":3155.09,"end":3168.55,"displayStart":3155.09,"displayEnd":3168.55,"displayMid":3161.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.935048,"pitch":18.484709,"speechRate":4.978,"hasEvents":false,"sentence_source":"比如伊朗土耳其人 他们很能经商啊，很多人都特别有钱 在土耳其人也这样很大的一部分，土耳其人就是这种非常传统的 家族做生意的，就是爸爸 伯伯 自己的兄弟。","sentence_en":"For example, Iranians and Turks are very good at business. Many are very wealthy. A large part of Turks are like that—very traditional family businesses: father, uncle, own brothers."},{"id":"390","start":3168.55,"end":3171.61,"displayStart":3168.55,"displayEnd":3171.61,"displayMid":3170.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":0.782766,"pitch":16.246674,"speechRate" ience","sentiment_en":"Positive","score":0.4,"loudness":1.008089,"pitch":26.940317,"speechRate":6.098,"hasEvents":false,"sentence_source":"那才是一个真正的开始。","sentence_en":"That's the real beginning."},{"id":"399","start":3210.43,"end":3215.77,"displayStart":3210.43,"displayEnd":3215.77,"displayMid":3213.1,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Positive","score":0.6,"loudness":0.777915,"pitch":21.977882,"speechRate":5.056,"hasEvents":false,"sentence_source":"所以对你来说其实语言就是敲门砖 帮你进到这个门，如于得水吧。","sentence_en":"So for you, language is the key that opens the door, making you feel at home."},{"id":"400","start":3215.77,"end":3217.09,"displayStart":3215.77,"displayEnd":3217.09,"displayMid":3216.4300000000003,"speaker":"Li Rui","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Persian Language Learning and Educational Experience","sentiment_en":"Neutral","score":0,"loudness":1.041502,"pitch":32.739483,"speechRate":8.654,"hasEvents":false,"sentence_source":"因为你会语言的时候。","sentence_en":"Because when you speak the language,"},{"id":"401","start":3217.09,"end":3232.85,"displayStart":3217.09,"displayEnd":3232.85,"displayMid":3224.9700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Iranian Society and Culture Observation","sentiment_en":"Positive","score":0.7,"loudness":0.909285,"pitch":20.730412,"speechRate":4.949,"hasEvents":false,"sentence_source":"他会很开心，伊朗人这么爱自己的文化，他听到一个外国人能讲他们的语言 就觉得挺高兴，首先这个我就得分 我又比较喜欢打听 听他们说，经常这样子亲听交流 时间长了 大家就成了朋友了。","sentence_en":"He would be very happy that Iranians love their culture so much, and hearing a foreigner speak their language makes him feel delighted. First of all, I get points for that, and I also like to ask questions and listen to them. Through frequent conversations like this, over time we became friends."},{"id":"402","start":3232.85,"end":3247.87,"displayS hought they lived in the desert. She felt offended and said, 'Of course we have natural gas."},{"id":"413","start":3314.33,"end":3316.57,"displayStart":3314.33,"displayEnd":3316.57,"displayMid":3315.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.822878,"pitch":18.602829,"speechRate":6.696,"hasEvents":false,"sentence_source":"我们世界上天然气最多的国家之一。","sentence_en":"We are one of the countries with the most natural gas in the world."},{"id":"414","start":3316.57,"end":3331.81,"displayStart":3316.57,"displayEnd":3331.81,"displayMid":3324.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.4,"loudness":0.911883,"pitch":21.160057,"speechRate":5.184,"hasEvents":false,"sentence_source":"我觉得还是外界西方吧，可能是比较媒体对他们渲染，觉得是一个落后的跟伊拉克、阿富汗差不多这种国家，但实际上伊朗人他们觉得他们是波斯民族，他们的文明远远超过于这个地区的国家。","sentence_en":"I think it's the outside world, especially the West, perhaps the media portrayal, that makes people think it's a backward country similar to Iraq or Afghanistan. But in reality, Iranians see themselves as Persians, and their civilization far surpasses other countries in the region."},{"id":"415","start":3331.81,"end":3336.93,"displayStart":3331.81,"displayEnd":3336.93,"displayMid":3334.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.830801,"pitch":15.93195,"speechRate":4.508,"hasEvents":false,"sentence_source":"他们始终有一种孤傲的感觉，非常骄傲为自己的文化。","sentence_en":"They always have a sense of proud aloofness, very proud of their culture."},{"id":"416","start":3336.93,"end":3351.13,"displayStart":3336.93,"displayEnd":3351.13,"displayMid":3344.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.903231,"pitch":21.872675,"speechRate":4.718,"hasEvents":false,"sentence_source":"所以这个基点我觉得就在伊朗的女性身上，伊朗的女性真的很勇敢，比男的要勇敢，如果说男的是让我们感觉在外面是骄傲不遜的，或者是伊朗男的非常坚韧 任性。","sentence_en":"So I think this foundation lies in Iranian women. Iranian women are truly brave, braver than men. If men come across as arrogant or proud on the surface, or Iranian men are very tough and stubborn."},{"id":"417","start":3351.13,"end":3365.07,"displayStart":3351.13,"displayEnd":3365.07,"displayMid":3358.1000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.904175,"pitch":16.480745,"speechRate":4.591,"hasEvents":false,"sentence_source":"我觉得女的真正的像波斯 传说中 壁画中的母狮子，他为了自己的孩子能够付出一切，跟敌人去抗争 为了自己的孩子自己的未来，不屈不挠 我们采访过很多。","sentence_en":"I think women are like lionesses in Persian legends—they give everything for their children, fight enemies, and never give up. We've interviewed many."},{"id":"418","start":3365.07,"end":3376.31,"displayStart":3365.07,"displayEnd":3376.31,"displayMid":3370.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.8,"loudness":0.899065,"pitch":17.795837,"speechRate":5.068,"hasEvents":false,"sentence_source":"我们做过好几期伊朗的女性节目 记者在报告，其中讲到为了去看足球比赛，你看伊朗女孩子就把自己自焚了，就我们叫《蓝色女孩不路够》。","sentence_en":"We have done several episodes on Iranian women's programs, with reporters reporting. One story was about Iranian girls who set themselves on fire just to watch a football match. We called it 'The Blue Girl Doesn't Go Far Enough.'"},{"id":"419","start":3376.31,"end":3390.79,"displayStart":3376.31,"displayEnd":3390.79,"displayMid":3383.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.96022,"pitch":21.484564,"speechRate":4.64,"hasEvents":false,"sentence_source":"因为他自焚了引起了国际社会的谴责，在这种压力下才允许女性去看足球赛，就在那个时刻，好多女性去，有一个女孩子跟我讲，她在那就听到了排山倒海的欢呼声。","sentence_en":"Because she set herself on fire, drawing international condemnation, women were finally allowed to watch football matches. At that moment, many women went. A girl told me she heard thunderous cheers there."},{"id":"420","start":3390.79,"end":3405.53,"displayStart":3390.79,"displayEnd":3405.53,"displayMid":3398.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.6,"loudness":0.897845,"pitch":19.31962,"speechRate":4.953,"hasEvents":false,"sentence_source":"她当时热泪形狂，她就是一个女孩子把自己自焚，还有好多人他们就不断的抗争，把自己装扮成男的，我就要去看足球赛，就是在不断的推动这个社会往前走，还有那个阿弥尼事件。","sentence_en":"She was in tears. That girl self-immolated, and many others kept resisting, disguising as men to watch football. They kept pushing society forward. Then there was the Amini incident."},{"id":"421","start":3405.53,"end":3414.61,"displayStart":3405.53,"displayEnd":3414.61,"displayMid":3410.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.5,"loudness":1.038493,"pitch":22.689215,"speechRate":5.495,"hasEvents":false,"sentence_source":"那个我觉得也是指责一说的，我身边的好多人 因为镇压呀，他们就跑到街上天天去街上，有一天我的外教夫人来看我。","sentence_en":"That incident also drew criticism. Many around me took to the streets every day due to repression. One day, my foreign teacher's wife came to see me."},{"id":"422","start":3414.61,"end":3427.09,"displayStart":3414.61,"displayEnd":3427.09,"displayMid":3420.8500000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.979238,"pitch":21.550623,"speechRate":6.215,"hasEvents":false,"sentence_source":"因为她的孩子都在国外嘛，就她和外教两个老两口，她也都60块70岁了，坐了一会儿她装心吧，我走了 我要去试一偷看一看，试中心 我说您干嘛去，她说我看哪里有抗议，我就去参加抗议。","sentence_en":"Since her children were abroad, it was just her and her husband, both in their sixties or seventies. After a while, she said, 'I'm going to see where the protests are and join them."},{"id":"423","start":3427.09,"end":3442.89,"displayStart":3427.09,"displayEnd":3442.89,"displayMid":3434.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.980684,"pitch":20.666031,"speechRate":4.81,"hasEvents":false,"sentence_source":"我都惊呆了，我说您也要去抗议，她说我要保护那些女孩子，为什么这些孩子去抗争，他们就会被打，我要去保护他们 要打应该是我们打，当时我就觉得伊朗的女性 无论是小姑娘还是老人。","sentence_en":"I was stunned. I said, 'You're going to protest too?' She said, 'I want to protect those girls. Why should they be beaten for resisting? If someone has to be beaten, it should be us.' At that moment, I felt Iranian women, whether young or old,"},{"id":"424","start":3442.89,"end":3452.91,"displayStart":3442.89,"displayEnd":3452.91,"displayMid":3447.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.897248,"pitch":19.546162,"speechRate":4.391,"hasEvents":false,"sentence_source":"他们真的很勇敢 很爱过，就是在他们不断的抗争之中，就看到伊朗的社会 它一点一点的在开放，一点的解封。","sentence_en":"are truly brave and love their country. Through their continuous struggle, you can see Iranian society gradually opening up and lifting restrictions."},{"id":"425","start":3452.91,"end":3462.37,"displayStart":3452.91,"displayEnd":3462.37,"displayMid":3457.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.875041,"pitch":19.073154,"speechRate":4.875,"hasEvents":false,"sentence_source":"我觉得这都是他们的抗争带来的，我记得我采访的歌唱演员 内道，我深深的记得 他是个家庭主服 家庭也非常好。","sentence_en":"I think all this is due to their struggle. I remember interviewing a singer, Neda. I deeply remember she was a housewife with a great family."},{"id":"426","start":3462.37,"end":3476.55,"displayStart":3462.37,"displayEnd":3476.55,"displayMid":3469.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.988883,"pitch":19.365913,"speechRate":5.145,"hasEvents":false,"sentence_source":"但是他就喜欢唱歌，他就去上课 上课是一家伙来的，伊亚米尼亚的歌剧老师 也是歌唱老师，他第一个在伊朗教歌唱的老师，共和国建国之后，他说他最大的愿望就站在舞台上。","sentence_en":"But she loved singing, so she took lessons. The teacher, an Armenian opera and singing instructor, was the first to teach singing in Iran after the founding of the Republic. He said his greatest wish was to stand on stage,"},{"id":"427","start":3476.55,"end":3481.83,"displayStart":3476.55,"displayEnd":3481.83,"displayMid":3479.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":1.021829,"pitch":20.374081,"speechRate":5.871,"hasEvents":false,"sentence_source":"让所有人听到他的歌声，他说也希望我的女儿也站在那，让所有人听到歌声。","sentence_en":"so that everyone could hear his voice. He also said he hoped his daughter could stand there too, letting everyone hear her voice."},{"id":"428","start":3481.83,"end":3490.59,"displayStart":3481.83,"displayEnd":3490.59,"displayMid":3486.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.5,"loudness":0.92859,"pitch":17.72266,"speechRate":5.671,"hasEvents":false,"sentence_source":"因为在这个宗教体制下，女性是不可以唱歌跳舞的，做公共唱歌，如果唱歌也是要合唱，不能让大家听到他一个人的声音。","sentence_en":"Because under this religious system, women are not allowed to sing or dance publicly. If they sing, it must be in a choir; they cannot let anyone hear their individual voice."},{"id":"429", ，她说 我们就像一个植物，你就是把我们泥土封了 撞上水泥土。","sentence_en":"Then she said, 'Why impossible?' She said, 'We're like plants. You sealed our soil and covered it with concrete."},{"id":"433","start":3520.95,"end":3523.19,"displayStart":3520.95,"displayEnd":3523.19,"displayMid":3522.0699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.889511,"pitch":16.990448,"speechRate":5.804,"hasEvents":false,"sentence_source":"我们也想办法会找到各种分析。","sentence_en":"We will also find various ways to analyze."},{"id":"434","start":3523.19,"end":3526.15,"displayStart":3523.19,"displayEnd":3526.15,"displayMid":3524.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.881391,"pitch":18.322794,"speechRate":5.068,"hasEvents":false,"sentence_source":"我们去生长 啊 那话讲的怎么那么好。","sentence_en":"We grow. Ah, how well said that was."},{"id":"435","start":3526.15,"end":3540.85,"displayStart":3526.15,"displayEnd":3540.85,"displayMid":3533.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.6,"loudness":0.936717,"pitch":18.815025,"speechRate":5.164,"hasEvents":false,"sentence_source":"那是十几年前 我采访过它，后来 最近就是十二日战争之后，伊朗社会出现了松动，政府也不想让民众太多的创伤，也在鼓励一些文艺活动，就那个时候 我第一次看到了伊朗的歌剧演出。","sentence_en":"I interviewed her over a decade ago. Later, after the 12-day war, Iranian society loosened up. The government didn't want to cause too much trauma, so it encouraged cultural activities. That's when I first saw an Iranian opera performance."},{"id":"436","start":3540.85,"end":3552.07,"displayStart":3540.85,"displayEnd":3552.07,"displayMid":3546.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":0.89525,"pitch":18.773899,"speechRate":5.437,"hasEvents":false,"sentence_source":"唱《茶花女》，我站在那个台下看 也是一个很简陋，不让他们到国家的剧院去演出，他们就在一个普通的剧院，也是那个亚美尼亚老师的学生在那儿唱歌。","sentence_en":"They performed 'La Traviata.' I stood below the stage. It was very crude; they weren't allowed to perform at the national theater, so they used an ordinary theater. The students of that Armenian teacher were singing."},{"id":"437","start":3552.07,"end":3559.73,"displayStart":3552.07,"displayEnd":3559.73,"displayMid":3555.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.831408,"pitch":18.182224,"speechRate":5.614,"hasEvents":false,"sentence_source":"哎呀 唱得怎么那么好 我在下面都有讲哭的感觉，就是因为这十几年来 我看到了他们的抗争 他们的希望。","sentence_en":"Ah, they sang so well. I almost cried down there, because over these years I've seen their struggle and their hope."},{"id":"438","start":3559.73,"end":3572.67,"displayStart":3559.73,"displayEnd":3572.67,"displayMid":3566.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.925786,"pitch":18.397305,"speechRate":5.641,"hasEvents":false,"sentence_source":"所以那天真的实现了 我给你乃到 我之前采访的那个人给他发了一条信，我说 以前我采访你的时候 你跟我说我不相信，我甚至怀疑这天会不会实现 但我没想到这么快就实现了。","sentence_en":"So that day it really came true. I sent a message to the person I interviewed before, saying, 'When I interviewed you, you said you didn't believe it. I even doubted if this day would come, but I didn't expect it to happen so quickly."},{"id":"439","start":3572.67,"end":3581.35,"displayStart":3572.67,"displayEnd":3581.35,"displayMid":3577.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.7,"loudness":0.905131,"pitch":18.875063,"speechRate":5.069,"hasEvents":false,"sentence_source":"虽然这上面不是你在唱 但是我觉得有一天我真的可以在国家剧院，我听到你在那里唱 我就是这样的感觉。","sentence_en":"Even though it's not you singing up there, I feel that one day I'll truly be at the national theater hearing you sing. That's how I feel."},{"id":"440","start":3581.35,"end":3596.69,"displayStart":3581.35,"displayEnd":3596.69,"displayMid":3589.02,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.953297,"pitch":22.113914,"speechRate":4.812,"hasEvents":false,"sentence_source":"哪 好感动 你把我说哭了，的确 你刚才讲 你会发现一个国家 一个社会 一个民族 它的复杂性，一方面 你看到你身边 你能够看到的 女性世界放的是自由的 在家里面是有极高地位的。","sentence_en":"Wow, so touching. You made me cry. Indeed, as you said, you discover the complexity of a country, a society, a nation. On one hand, you see around you that the female world appears free, with high status at home."},{"id":"441","start":3596.69,"end":3611.31,"displayStart":3596.69,"displayEnd":3611.31,"displayMid":3604,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.6,"loudness":1.012601,"pitch":22.893965,"speechRate":5.54,"hasEvents":false,"sentence_source":"然后同时 你自己也感受过 包括阿弥尼 阿弥尼世界给大家回述一下 应该是2022年 我记得，一个叫阿弥尼的女孩 她就是因为在公开场合带投金带得不够标准，被当时的风济警察就给拦下。","sentence_en":"Yet at the same time, you've experienced it yourself, including Mahsa Amini. Let me recap for everyone: it should be 2022, I remember. A girl named Mahsa Amini was stopped by the morality police because she didn't wear her headscarf properly in public."},{"id":"442","start":3611.31,"end":3626.75,"displayStart":3611.31,"displayEnd":3626.75,"displayMid":3619.0299999999997,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Negative","score":-0.7,"loudness":0.940239,"pitch":21.205605,"speechRate":4.987,"hasEvents":false,"sentence_source":"然后在拘禁期间 阿弥尼死了，让阿弥尼的死就点燃了当时伊朗很多女性的怒火，还有很多进步人士的怒火，算是一个导火所 一个转折点，之后对于女性着装的要求就不像以前那么的严格。","sentence_en":"During detention, Amini died. Her death ignited the anger of many Iranian women and progressives. It was a trigger, a turning point. After that, the requirements for women's attire became less strict than before."},{"id":"443","start":3626.75,"end":3630.87,"displayStart":3626.75,"displayEnd":3630.87,"displayMid":3628.81,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Positive","score":0.5,"loudness":0.857727,"pitch":20.218161,"speechRate":6.283,"hasEvents":false,"sentence_source":"等于给女性很多一个呼吸的空间，这是一个叫阿弥尼事件。","sentence_en":"This gave women more breathing room. This is the Mahsa Amini incident."},{"id":"444","start":3630.87,"end":3636.53,"displayStart":3630.87,"displayEnd":3636.53,"displayMid":3633.7,"speaker":"Li Rui","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Iranian Women and Social Life","sentiment_en":"Neutral","score":0,"loudness":1.054531,"pitch":21.907787,"speechRate":5.639,"hasEvents":false,"sentence_source":"然后刚才你讲到你说你曾经也被警察麻烦过，是什么时候 因为什么事啊。","sentence_en":"So you mentioned earlier that you were also troubled by the police before. When and why was that?"},{"id":"445","start":3636.53,"end":3649.19,"displayStart":3636.53,"displayEnd":3649.19,"displayMid":3642.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.878978,"pitch":18.63479,"speechRate":4.804,"hasEvents":false,"sentence_source":"我记得是2007年还是刚来当记者不到一年多吧，摘月的时候晚上 我突然一个同事让我帮他买东西，我就出去了 我当时穿的长裙 也穿的长袍。","sentence_en":"I remember it was 2007, less than a year after I started working as a journalist. It was during Ramadan, at night. A colleague suddenly asked me to buy something for him, so I went out. I was wearing a long skirt and a robe."},{"id":"446","start":3649.19,"end":3655.73,"displayStart":3649.19,"displayEnd":3655.73,"displayMid":3652.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.879288,"pitch":20.341736,"speechRate":5.38,"hasEvents":false,"sentence_source":"也戴着头巾 戴着我穿那双凉鞋没有穿袜子，但那个裙子也是到脚踝 我觉得没有问题。","sentence_en":"I was also wearing a headscarf and sandals without socks. But the skirt went down to my ankles, so I thought it was fine."},{"id":"447","start":3655.73,"end":3668.69,"displayStart":3655.73,"displayEnd":3668.69,"displayMid":3662.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.845775,"pitch":18.86824,"speechRate":5.506,"hasEvents":false,"sentence_source":"因为摘月那个时候 风气警察管着烟 不能够随便穿，不然会被抓 我也知道，但我自己在镜子里打亮了自己觉得也没有什么问题，我就去了 而且我就在旁边一个商店去买东西。","sentence_en":"Because during Ramadan, the police were strict about clothing—you couldn't dress casually, otherwise you'd get arrested. I knew that, but I checked myself in the mirror and thought I looked fine, so I went. I was just going to a nearby shop to buy something."},{"id":"448","start":3668.69,"end":3674.97,"displayStart":3668.69,"displayEnd":3674.97,"displayMid":3671.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.978989,"pitch":23.044577,"speechRate":6.121,"hasEvents":false,"sentence_source":"结果呢 我进了旁边一个小商场 两层楼很小的，我就进去了 然后到二了 我进了店里头我挑。","sentence_en":"So I went into a small two-story mall nearby. I went in, went up to the second floor, and entered a store to browse."},{"id":"449","start":3674.97,"end":3688.65,"displayStart":3674.97,"displayEnd":3688.65,"displayMid":3681.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.92244,"pitch":19.493074,"speechRate":5.336,"hasEvents":false,"sentence_source":"然后就看到警察跟在我身后 一个小护驱的警察，他说 你跟我走 我就呆了 我说 为什么跟你走，他说 你看看你自己 没有穿袜子，我说 太热了 我而且我家就在旁边买东西 我就回去了。","sentence_en":"Then I saw a police officer following me—a young patrol officer. He said, 'Come with me.' I was stunned and asked why. He said, 'Look at yourself, you're not wearing socks.' I said, 'It's too hot, and my home is nearby; I'm just shopping and will go back soon."},{"id":"450","start":3688.65,"end":3701.25,"displayStart":3688.65,"displayEnd":3701.25,"displayMid":3694.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.80876,"pitch":16.84556,"speechRate":5.726,"hasEvents":false,"sentence_source":"他说 不紧 你必须跟我走 我就很生气，我说 我是中国人 你为什么要抓我，我说你要抓我 你得首先问问，中国政府通不通 中国释怀你得通，我说我还是记者 还说少说话 跟我们走。","sentence_en":"He said, 'No, you have to come with me.' I got really angry and said, 'I am Chinese. Why are you arresting me? If you want to arrest me, you should first ask if the Chinese government approves. I am also a journalist.' He said, 'Stop talking and come with us."},{"id":"451","start":3701.25,"end":3707.99,"displayStart":3701.25,"displayEnd":3707.99,"displayMid":3704.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.871826,"pitch":14.308619,"speechRate":6.061,"hasEvents":false,"sentence_source":"不然我叫两个女警 然后她就对讲机说的什么，就有两个女警 上来了 穿长袍，他们跟在我旁边。","sentence_en":"Otherwise, he said he'd call two female officers. Then he said something into his radio, and two female officers in robes came up and stood beside me."},{"id":"452","start":3707.99,"end":3710.91,"displayStart":3707.99,"displayEnd":3710.91,"displayMid":3709.45,"speaker":"Li Rui","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.964998,"pitch":27.351904,"speechRate":4.586,"hasEvents":false,"sentence_source":"我当时就觉得特别的受侮辱气。","sentence_en":"At that moment, I felt extremely humiliated and angry."},{"id":"453","start":3710.91,"end":3720.47,"displayStart":3710.91,"displayEnd":3720.47,"displayMid":3715.6899999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.845172,"pitch":18.554239,"speechRate":4.006,"hasEvents":false,"sentence_source":"氛又害怕 被羞辱的感觉，浑身都在抖 手都抖得很厉害，气到真的要崩发的感觉 崩发 火山崩发。","sentence_en":"And scared—feeling humiliated. My whole body was shaking, my hands were trembling badly. I was so angry I felt like I was going to explode, like a volcano erupting."},{"id":"454","start":3720.47,"end":3731.33,"displayStart":3720.47,"displayEnd":3731.33,"displayMid":3725.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.941632,"pitch":20.105015,"speechRate":5.672,"hasEvents":false,"sentence_source":"但是看他们那么凶 我要不走，我估计他们要把我嫁走，我也看到商场上有的女的不走，他们就真的把他就四角朝天抬起来带走，我也不想当那个地步。","sentence_en":"But since they were so aggressive, if I didn't go, I figured they would drag me away. I had seen women in the mall who refused to go, and they were literally picked up by four corners and carried away. I didn't want to end up like that."},{"id":"455","start":3731.33,"end":3744.97,"displayStart":3731.33,"displayEnd":3744.97,"displayMid":3738.1499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.928813,"pitch":18.358538,"speechRate":5.517,"hasEvents":false,"sentence_source":"那我就投降 我就跟他们走，走的时候他要到下楼踢瘦，就看对面有一个阿里的店，他们就是我的朋友嘛，老去 他们也认识，他妻子我也认识，也是中国人 我们都是很好的朋友，他妻子不在。","sentence_en":"So I gave in and went with them. As we were going downstairs, I saw Ali's shop across the way. They were my friends—I went there often and they knew me. I also knew his wife, who is Chinese; we were good friends. His wife wasn't there."},{"id":"456","start":3744.97,"end":3760.97,"displayStart":3744.97,"displayEnd":3760.97,"displayMid":3752.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Positive","score":0.6,"loudness":0.892675,"pitch":16.029192,"speechRate":5,"hasEvents":false,"sentence_source":"啊 老阿里在那店里头开店，还有两个雇员的开服装店，我就趁警察不注意就碰一下就钻进去，迅雷不及 银耳之事 穿进去我就跑，阿里快救我 我说快给我找裤子 找袜子，他们就赶紧给我 让雇员帮我。","sentence_en":"Old Ali was running a clothing store there with two employees. I took the chance when the police weren't looking, bumped into it, and slipped in. Quick as lightning, I dashed in and ran. 'Ali, save me!' I said, 'Quick, find me pants and socks!' They hurriedly helped me, telling the employees to assist."},{"id":"457","start":3760.97,"end":3775.49,"displayStart":3760.97,"displayEnd":3775.49,"displayMid":3768.2299999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.84856,"pitch":16.469826,"speechRate":4.959,"hasEvents":false,"sentence_source":"我就在里头穿 因为在里头服装店，警察也不能进去 不方便 他就站在门口，很气氛 我就穿着长裤袜子 我就出来了，我就看着他 他就好像被触犯到了，我感觉他那个眼睛都冒火了。","sentence_en":"I went inside the clothing store to change. The police couldn't go in because it was inappropriate, so he stood at the door. Furious, I put on pants and socks and came out. I looked at him, and he seemed offended—I felt his eyes blazing with anger."},{"id":"458","start":3775.49,"end":3777.39,"displayStart":3775.49,"displayEnd":3777.39,"displayMid":3776.4399999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"War Experience and Psychological Journey","sentiment_en":"Negative","score":-0.4,"loudness":1.120559,"pitch":23.192719,"speechRate":6.143,"hasEvents":false,"sentence_source":"好像很生气那个样子。","sentence_en":"He looked really angry."},{"id":"459","start":3777.39,"end":3787.85,"displayStart":3777.39,"displayEnd":3787.85,"displayMid":3782.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Neutral","score":0,"loudness":0.902563,"pitch":16.170805,"speechRate":5.58,"hasEvents":false,"sentence_source":"我们就这样互相盯着对方，阿里就跑上来打原厂说 你看那个外国人他也不容易，就算了吧 装了半天好话，后来警察看看我就算了 他们就走了。","sentence_en":"We stared at each other like that. Then Ali came up to smooth things over, saying, 'Look, the foreigner isn't having an easy time. Let it go.' He pleaded for a while. Eventually, the police looked at me and let it go; they left."},{"id":"460","start":3787.85,"end":3798.67,"displayStart":3787.85,"displayEnd":3798.67,"displayMid":3793.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.992647,"pitch":22.330744,"speechRate":4.892,"hasEvents":false,"sentence_source":"那是我这一次 当时没有带手机，而且我那时候就一个人在这 我找谁啊，他们把我抓进去 还要家人担保 交罚金才能带出去。","sentence_en":"That was that one time. I didn't have my phone with me, and I was alone there. Who could I call? If they took me in, I would need a family member to vouch for me and pay a fine to get out."},{"id":"461","start":3798.67,"end":3807.29,"displayStart":3798.67,"displayEnd":3807.29,"displayMid":3802.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"War Correspondent and Career Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.93612,"pitch":19.237389,"speechRate":5.45,"hasEvents":true,"sentence_source":"那我要是被抓进去 谁找我呀 我找谁呢，也没人把我能够带出去 当时我就想的蛮多的，我就真就不能被他们带走。","senten
