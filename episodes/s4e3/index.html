tral","score":0,"loudness":0.832148,"pitch":22.686398,"speechRate":3.784,"hasEvents":false,"sentence_source":"其实我们家我觉得声音倒比较少。","sentence_en":"Actually, I think in my family, there wasn't much of that audio content."},{"id":"79","start":500.1,"end":515.14,"displayStart":500.1,"displayEnd":515.14,"displayMid":507.62,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.83697,"pitch":18.36985,"speechRate":4.336,"hasEvents":false,"sentence_source":"但是我的那个最早的历史的启蒙倒不来自这儿，来自什么呢 来自一些我觉得我上应该是小学高年级，开始看的一些很有意思的晚清到明国的那些揭露小说。","sentence_en":"But my earliest history enlightenment came from somewhere else—it came from some very interesting exposé novels from the late Qing to the Republican era that I started reading probably in upper elementary school."},{"id":"80","start":515.14,"end":519.82,"displayStart":515.14,"displayEnd":519.82,"displayMid":517.48,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.757943,"pitch":19.434072,"speechRate":3.632,"hasEvents":false,"sentence_source":"比如说20年目睹之怪现状 官场现行记。","sentence_en":"For example, \"Strange Things Witnessed in the Past Twenty Years\" and \"The Bureaucrats Exposed."},{"id":"81","start":519.82,"end":534.28,"displayStart":519.82,"displayEnd":534.28,"displayMid":527.05,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.735267,"pitch":14.665388,"speechRate":3.32,"hasEvents":false,"sentence_source":"然后再接下来就是高洋，洋进入中国，他讲那个词习 还有胡雪颜，我现在回想我最初的历史的启蒙就来自于这些东西。","sentence_en":"Then there was Gao Yang, who brought the study of the Qing dynasty into China. He talked about terms like 'xi' and Hu Xueyan. Looking back, my first exposure to history came from things like that."},{"id":"82","start":534.28,"end":539.8,"displayStart":534.28,"displayEnd":539.8,"displayMid":537.04,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.847472,"pitch":15.270466,"speechRate":4.891,"hasEvents":false,"sentence_source":"比如说高阳的小说是依托于历史，他还是讲故事 他是文学的创作。","sentence_en":"For example, Gao Yang's novels are grounded in history, but he tells stories—they're literary creations."},{"id":"83","start":539.8,"end":547.16,"displayStart":539.8,"displayEnd":547.16,"displayMid":543.48,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.7,"loudness":0.699524,"pitch":17.029633,"speechRate":2.989,"hasEvents":false,"sentence_source":"但是高阳有很深厚的修养，就是对旧传统的知识修养。","sentence_en":"But Gao Yang had deep knowledge of traditional culture and old systems."},{"id":"84","start":547.16,"end":561.52,"displayStart":547.16,"displayEnd":561.52,"displayMid":554.3399999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.776199,"pitch":17.262609,"speechRate":3.657,"hasEvents":false,"sentence_source":"所以他在小说里边，他就有很多的人庭事故的东西，还有他也提到一些属于当时制度的东西，比如说大臣的奏折上到皇帝那儿。","sentence_en":"So in his novels, he includes many anecdotes about people and events, as well as details about institutional practices of the time, like how a minister's memorial would reach the emperor."},{"id":"85","start":561.52,"end":572.28,"displayStart":561.52,"displayEnd":572.28,"displayMid":566.9,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.744963,"pitch":19.767731,"speechRate":4.213,"hasEvents":false,"sentence_source":"皇帝就有一个发布发的问题，就是皇帝可以做出一个选择是说留中布发，留中布发就是只有他看到 皇帝看到。","sentence_en":"The emperor had a choice: he could 'retain without issuing'—meaning only the emperor saw it."},{"id":"86","start":572.28,"end":577.34,"displayStart":572.28,"displayEnd":577.34,"displayMid":574.81,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.7792,"pitch":17.364584,"speechRate":3.755,"hasEvents":false,"sentence_source":"然后皇帝就留在宫里边，他并不把他批示一下。","sentence_en":"He would keep it in the palace without annotating it."},{"id":"87","start":577.34,"end":581.8,"displayStart":577.34,"displayEnd":581.8,"displayMid":579.5699999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.826435,"pitch":15.996876,"speechRate":4.484,"hasEvents":false,"sentence_source":"然后下发给军机处或者是哪个部门，他就留中了。","sentence_en":"Then he wouldn't send it to the Grand Council or any department—he'd just keep it."},{"id":"88","start":581.8,"end":596.36,"displayStart":581.8,"displayEnd":596.36,"displayMid":589.0799999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.719213,"pitch":15.847988,"speechRate":4.841,"hasEvents":false,"sentence_source":"那这件事情外庭其实就不知道，我后来学历史以后 比如说宋代 其实也有刘中的问题，就是刘中其实涉及宫中和外庭之间的这个信息沟通的问题，以及皇帝的控制的问题。","sentence_en":"The outer court would never know. Later, when I studied history, I realized that in the Song dynasty, there was also a similar practice of retaining documents, which involved communication between the inner court and outer court and the emperor's control."},{"id":"89","start":596.36,"end":610.78,"displayStart":596.36,"displayEnd":610.78,"displayMid":603.5699999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.733549,"pitch":14.835666,"speechRate":4.092,"hasEvents":false,"sentence_source":"我最初这个词 我在高扬的小说里面看到这个词，就是高扬的小说里面有特别多的这种需要介绍一下的词，再比如说他写到皇帝逃到了热河去。","sentence_en":"I first encountered that term in Gao Yang's novel. His novels have many such terms that need explanation. For instance, he wrote about the emperor fleeing to Rehe."},{"id":"90","start":610.78,"end":626.2,"displayStart":610.78,"displayEnd":626.2,"displayMid":618.49,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.767676,"pitch":19.117367,"speechRate":3.632,"hasEvents":false,"sentence_source":"那个叫木篮丘贤 我其实当时就写那个字，我很多年都读成木篮丘敌 就是我小时候读书因为快，就是这么胡论的跳过去 那个字大致一看。","sentence_en":"That was called 'Mulan Qiuxian'—I actually wrote it down, and for years I misread it as 'Mulan Qiudi' because I read quickly as a child and just skimmed over the characters."},{"id":"91","start":626.2,"end":632.5,"displayStart":626.2,"displayEnd":632.5,"displayMid":629.35,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.821465,"pitch":20.56905,"speechRate":3.968,"hasEvents":false,"sentence_source":"木篮丘敌读了很多年 后来终于意识到那是个错字木篮丘贤。","sentence_en":"I read 'Mulan Qiudi' for many years before finally realizing it was a mistake—it was 'Mulan Qiuxian'."},{"id":"92","start":632.5,"end":639.16,"displayStart":632.5,"displayEnd":639.16,"displayMid":635.8299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.86782,"pitch":20.425766,"speechRate":5.653,"hasEvents":false,"sentence_source":"所以你在阅读的时候你是完全能够理解那些生辟的名词或者制度背后的它意思是什么。","sentence_en":"So when you read, you can fully understand the meaning behind those obscure terms or systems."},{"id":"93","start":639.16,"end":647.66,"displayStart":639.16,"displayEnd":647.66,"displayMid":643.41,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.90289,"pitch":20.063633,"speechRate":4.872,"hasEvents":false,"sentence_source":"但说实在的 我今天我们俩做这讲的时候，已经是一个资深的历史学者，再回过头去看那个小姑娘。","sentence_en":"But honestly, now that we're recording this, I'm a seasoned historian, and I look back at that young girl."},{"id":"94","start":647.66,"end":654.58,"displayStart":647.66,"displayEnd":654.58,"displayMid":651.12,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.689141,"pitch":17.616056,"speechRate":4.191,"hasEvents":false,"sentence_source":"那个小姑娘当年读的时候，第一 你看字会读错 对吧，而且会一错很多年。","sentence_en":"That girl back then, first, she'd misread characters, and she'd keep making the same mistakes for years."},{"id":"95","start":654.58,"end":668.38,"displayStart":654.58,"displayEnd":668.38,"displayMid":661.48,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.7,"loudness":0.756504,"pitch":16.650568,"speechRate":3.696,"hasEvents":false,"sentence_source":"然后第二呢 其实是胡论着就觉得有趣，就觉得那个世界跟我们现在的这个世界，它是不一样的，而我对那个世界充满了好奇。","sentence_en":"Second, she just found it fascinating—she felt that world was different from ours, and she was full of curiosity about it."},{"id":"96","start":668.38,"end":683.92,"displayStart":668.38,"displayEnd":683.92,"displayMid":676.15,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.8,"loudness":0.795698,"pitch":13.574269,"speechRate":3.925,"hasEvents":fa nything extraordinary."},{"id":"199","start":1466.1,"end":1470.08,"displayStart":1466.1,"displayEnd":1470.08,"displayMid":1468.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.7,"loudness":0.894375,"pitch":23.130501,"speechRate":6.827,"hasEvents":false,"sentence_source":"但是咱们这代人相信的是 世上本没有路 走的人多了也变成了路。","sentence_en":"But our generation believes: there is no road in the world; when many people walk it, it becomes a road."},{"id":"200","start":1470.08,"end":1477.9,"displayStart":1470.08,"displayEnd":1477.9,"displayMid":1473.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.744835,"pitch":21.011908,"speechRate":6.393,"hasEvents":false,"sentence_source":"所以我们总觉得 你走没有人走的路 好像挺对的，鲁迅先生都这么讲的嘛 就某种程度我们其实是按着这样的一个方式。","sentence_en":"So we always think it's right to take a path no one has taken. Mr. Lu Xun said that too. To some extent, we actually follow this way."},{"id":"201","start":1477.9,"end":1489.04,"displayStart":1477.9,"displayEnd":1489.04,"displayMid":1483.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.8,"loudness":0.809839,"pitch":18.542648,"speechRate":6.278,"hasEvents":false,"sentence_source":"在走着我们的人生之路 但其实就是做自己喜欢的事情还是挺快乐的一件事情，比如学历史 那个快乐的来自于什么地方，就找到某一些你之前从来没有发现过的细节。","sentence_en":"We walk our life path this way. Actually, doing what you love is quite joyful. For example, studying history—where does that joy come from? It comes from finding details you never discovered before."},{"id":"202","start":1489.04,"end":1496.38,"displayStart":1489.04,"displayEnd":1496.38,"displayMid":1492.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.9,"loudness":0.81555,"pitch":19.541828,"speechRate":5.313,"hasEvents":false,"sentence_source":"找到一些能够证明某一些你一直在好奇的未知的事情，就那个时刻是最愉快 最有意思的时刻。","sentence_en":"Finding something that can prove some unknown things you've always been curious about—that moment is the most pleasant and interesting."},{"id":"203","start":1496.38,"end":1499.6,"displayStart":1496.38,"displayEnd":1499.6,"displayMid":1497.99,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.684158,"pitch":16.327103,"speechRate":4.969,"hasEvents":false,"sentence_source":"其实我个人觉得 比如说我是学历史的。","sentence_en":"Personally, I think—for instance, I studied history."},{"id":"204","start":1499.6,"end":1507.94,"displayStart":1499.6,"displayEnd":1507.94,"displayMid":1503.77,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.821829,"pitch":13.90359,"speechRate":4.436,"hasEvents":false,"sentence_source":"然后某人是学化学的 某人是学物理的，一个物理学家 跟一个历史学家 我觉得没什么两样。","sentence_en":"And someone studies chemistry, someone studies physics. I think a physicist and a historian are not that different."},{"id":"205","start":1507.94,"end":1522.36,"displayStart":1507.94,"displayEnd":1522.36,"displayMid":1515.15,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.758199,"pitch":13.856705,"speechRate":4.23,"hasEvents":false,"sentence_source":"因为我们都是在进行知识的探究，是对未知世界的探讨，它那个未知世界是属于自然的，我这个未知世界是属于人类过去的，我这个说法可能比较大。","sentence_en":"Because we're both exploring knowledge, investigating the unknown. His unknown world belongs to nature, mine belongs to humanity's past. That might sound grandiose."},{"id":"206","start":1522.36,"end":1536.16,"displayStart":1522.36,"displayEnd":1536.16,"displayMid":1529.26,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.731283,"pitch":16.135355,"speechRate":4.565,"hasEvents":false,"sentence_source":"但是我从内心深处是就这么认为的，就是说我们是代表人类和族群，去探究有关族群过去的知识的，就等于你类似于一个 比如说吧，这是一篇未知的世界。","sentence_en":"But deep down, I truly believe we represent humanity and our community in exploring knowledge about our past. It's like you're in an unknown world."},{"id":"207","start":1536.72,"end":1543.74,"displayStart":1536.72,"displayEnd":1543.74,"displayMid":1540.23,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.7,"loudness":0.79577,"pitch":14.265113,"speechRate":3.989,"hasEvents":false,"sentence_source":"然后我就是其中的这个探险者，我会找到新的东西 我会有新的发现。","sentence_en":"I am that explorer, finding new things, making new discoveries."},{"id":"208","start":1543.74,"end":1553.84,"displayStart":1543.74,"displayEnd":1553.84,"displayMid":1548.79,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.791874,"pitch":15.589698,"speechRate":3.267,"hasEvents":false,"sentence_source":"然后我再转头出来 跟大家分享我的发现，就是这种独自探索的苦衷之乐 做研究。","sentence_en":"Then I turn around and share my findings with everyone. That's the bittersweet joy of solitary exploration—doing research."},{"id":"209","start":1553.84,"end":1567.48,"displayStart":1553.84,"displayEnd":1567.48,"displayMid":1560.6599999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.799687,"pitch":18.405439,"speechRate":4.545,"hasEvents":false,"sentence_source":"其实是一件很孤单的事 你看我坐那儿一动不动，但实际上你也可以把我脑补成一个，在一个有关过去的黑暗的森林里边，头上带着探照灯 去找个伙伴。","sentence_en":"It's actually a lonely thing. You see me sitting there motionless, but you can imagine me in a dark forest of the past, wearing a headlamp, searching for something."},{"id":"210","start":1567.48,"end":1577.74,"displayStart":1567.48,"displayEnd":1577.74,"displayMid":1572.6100000000001,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.753101,"pitch":16.785046,"speechRate":3.899,"hasEvents":false,"sentence_source":"对 在找 然后到处的敲敲敲 看看有没有路，看看能不能找到形状 就照亮一些东西，就是我要去发现。","sentence_en":"Yeah, searching, tapping everywhere to see if there's a path, if I can find shapes, illuminating things—that's what I need to discover."},{"id":"211","start":1577.74,"end":1591.26,"displayStart":1577.74,"displayEnd":1591.26,"displayMid":1584.5,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.8,"loudness":0.790141,"pitch":14.783961,"speechRate":4.142,"hasEvents":false,"sentence_source":"就是这种对于亲知识的探索 发现 以及产视分享，就这个乐趣 对我来说这是一个最大的乐趣，我举个例子吧 比如说我写大宋之变的时候。","sentence_en":"This kind of exploration, discovery, and sharing of knowledge—that joy is the greatest for me. Let me give an example: when I wrote 'The Transformation of the Song Dynasty."},{"id":"212","start":1591.26,"end":1600.54,"displayStart":1591.26,"displayEnd":1600.54,"displayMid":1595.9,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Negative","score":-0.6,"loudness":0.687373,"pitch":14.213904,"speechRate":4.095,"hasEvents":false,"sentence_source":"我中间有一次要去美国有一个旅行，我特别怕坐飞机，我每次坐飞机都坐着要吊起来的准备。","sentence_en":"Once during that time, I had to travel to the US. I'm terrified of flying; every time I fly, I brace myself as if I'm about to crash."},{"id":"213","start":1600.54,"end":1614.74,"displayStart":1600.54,"displayEnd":1614.74,"displayMid":1607.6399999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Negative","score":-0.7,"loudness":0.782253,"pitch":19.78034,"speechRate":4.437,"hasEvents":false,"sentence_source":"然后那天那个飞机不如就这样，像一个拖拉机在不平的路上走，我当时就在想，如果我要挂了怎么办呢，我就开始一件一件盘算，我父母有我妹妹妹夫照顾。","sentence_en":"That day, the plane was like a tractor on a bumpy road. I thought, 'What if I die?' So I started thinking it through one by one: my parents have my younger sister and her husband to take care of them."},{"id":"214","start":1614.74,"end":1616.14,"displayStart":1614.74,"displayEnd":1616.14,"displayMid":1615.44,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.728046,"pitch":14.942436,"speechRate":3.953,"hasEvents":false,"sentence_source":"然后我儿子。","sentence_en":"Then my son."},{"id":"215","start":1616.14,"end":1619.4,"displayStart":1616.14,"displayEnd":1619.4,"displayMid":1617.77,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.914281,"pitch":17.534843,"speechRate":6.372,"hasEvents":false,"sentence_source":"但是其实我儿子那个时候也接近18岁了。","sentence_en":"But actually, my son was almost 18 by then."},{"id":"216","start":1619.4,"end":1626.62,"displayStart":1619.4,"displayEnd":1626.62,"displayMid":1623.01,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Positive","score":0.5,"loudness":0.751564,"pitch":12.80482,"speechRate":3.878,"hasEvents":false,"sentence_source":"我觉得我死了可能他会很快地成熟，我相信他的生命的韧性和质量。","sentence_en":"I think if I died, he might mature quickly. I believe in the resilience and quality of his life."},{"id":"217","start":1626.62,"end":1628.66,"displayStart":1626.62,"displayEnd":1628.66,"displayMid":1627.6399999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.609561,"pitch":12.063984,"speechRate":4.412,"hasEvents":false,"sentence_source":"所以我觉得 我想了想。","sentence_en":"So I thought about it."},{"id":"218","start":1628.66,"end":1634.14,"displayStart":1628.66,"displayEnd":1634.14,"displayMid":1631.4,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Negative","score":-0.6,"loudness":0.689574,"pitch":12.34997,"speechRate":5.214,"hasEvents":false,"sentence_source":"那只有一件事是最遗憾的，就是我当时写大宋之编，就差一个结尾了。","sentence_en":"The only thing I regret is that when I was writing 'The Great Song Chronicles,' I was just one ending short."},{"id":"219","start":1634.14,"end":1636.5,"displayStart":1634.14,"displayEnd":1636.5,"displayMid":1635.3200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Negative","score":-0.5,"loudness":0.768115,"pitch":21.307201,"speechRate":6.17,"hasEvents":false,"sentence_source":"如果我就这个飞机要掉下来。","sentence_en":"If this plane were to go down,"},{"id":"220","start":1636.5,"end":1641.04,"displayStart":1636.5,"displayEnd":1641.04,"displayMid":1638.77,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.780688,"pitch":16.047564,"speechRate":4.839,"hasEvents":false,"sentence_source":"那就没有这本书了，就是我不是说我一定比别人好。","sentence_en":"then this book wouldn't exist. It's not that I'm saying I'm necessarily better than others."},{"id":"221","start":1641.04,"end": ll subsequent narratives and records, no matter what form they take, are subjective. Researchers essentially look through records that carry varying degrees and forms of subjectivity."},{"id":"244","start":1817.36,"end":1826.6,"displayStart":1817.36,"displayEnd":1826.6,"displayMid":1821.98,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.810017,"pitch":15.900488,"speechRate":3.966,"hasEvents":false,"sentence_source":"去接近真相，去拿掉他的主观律径 你接触到的他们彼此双方是一个互相矛盾的 对吧。","sentence_en":"To approach the truth, to strip away their subjective biases. The two sides you encounter contradict each other, right?"},{"id":"245","start":1826.6,"end":1837.6,"displayStart":1826.6,"displayEnd":1837.6,"displayMid":1832.1,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.3,"loudness":0.762287,"pitch":17.890715,"speechRate":4.636,"hasEvents":false,"sentence_source":"其实我们历史学者干的就是这个事 把这个矛盾的东西放到一块来对，甚至可能比如说你只接触到了两方 完全对立的两方。","sentence_en":"That's exactly what we historians do — we put these contradictory things together to compare. Sometimes you might only have two completely opposing sides."},{"id":"246","start":1837.6,"end":1843.74,"displayStart":1837.6,"displayEnd":1843.74,"displayMid":1840.67,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.649177,"pitch":18.454969,"speechRate":4.235,"hasEvents":false,"sentence_source":"那可能还有一些旁观者 一些旁证的东西 我们都把它拿来对上。","sentence_en":"And there might also be some bystanders, some collateral evidence — we bring that in too to match up."},{"id":"247","start":1843.74,"end":1848.42,"displayStart":1843.74,"displayEnd":1848.42,"displayMid":1846.08,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4 ence_en":"That later historians today..."},{"id":"251","start":1878.2,"end":1883.44,"displayStart":1878.2,"displayEnd":1883.44,"displayMid":1880.8200000000002,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.745161,"pitch":16.398434,"speechRate":3.459,"hasEvents":false,"sentence_source":"其实比当时的记录者更有可能接近真相。","sentence_en":"Are actually more likely to get closer to the truth than the original recorders."},{"id":"252","start":1883.44,"end":1888.38,"displayStart":1883.44,"displayEnd":1888.38,"displayMid":1885.91,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.766816,"pitch":16.618303,"speechRate":4.656,"hasEvents":false,"sentence_source":"然后一直到今天的这种现代范氏之下的历史学者出来。","sentence_en":"And then up to today, under this modern paradigm, historians emerge."},{"id":"253","start":1888.38,"end":1902.42,"displayStart":1888.38,"displayEnd":1902.42,"displayMid":1895.4,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.732245,"pitch":14.354137,"speechRate":3.989,"hasEvents":false,"sentence_source":"我觉得到最后其实我们就是一层一层的律经翻回去，能够接近真相，我最近就是在看一本很有趣的书，爱朗诺的《财女之类》，他写李清照的。","sentence_en":"I think in the end, we just peel back layers upon layers to get closer to the truth. I've been reading a very interesting book recently — 'Wealthy Women and Such' by Ronald Egan, about Li Qingzhao."},{"id":"254","start":1902.42,"end":1907.5,"displayStart":1902.42,"displayEnd":1907.5,"displayMid":1904.96,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.862812,"pitch":12.292439,"speechRate":6.25,"hasEvents":false,"sentence_source":"其中有个特别好玩的事情 我觉得，就是说这个李清照最近有没有改加过。","sentence_en":"There's one particularly amusing thing: the issue of whether Li Qingzhao remarried."},{"id":"255","start":1907.5,"end":1915.8,"displayStart":1907.5,"displayEnd":1915.8,"displayMid":1911.65,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.78002,"pitch":14.983701,"speechRate":4.819,"hasEvents":false,"sentence_source":"其实他在南宋的时候 他自己改加过这件事情，他自己不否认 他还感谢帮助了他的赵明成的亲戚。","sentence_en":"Actually, during the Southern Song, she herself remarried. She didn't deny it and even thanked the relative of Zhao Mingcheng who helped her."},{"id":"256","start":1915.8,"end":1931.6,"displayStart":1915.8,"displayEnd":1931.6,"displayMid":1923.6999999999998,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.752512,"pitch":18.234285,"speechRate":4.487,"hasEvents":false,"sentence_source":"然后呢 南宋的那些笔记当时人的言谈之中，也提到他改加 就在南宋李清照改加不成问题，李清照改加何时成为问题 到了明清的时候，就是他的这种伦理观念发生了变化。","sentence_en":"Then, in the informal notes and conversations of the Southern Song period, it was mentioned that Li Qingzhao's remarriage was not an issue. When did Li Qingzhao's remarriage become a problem? It was during the Ming and Qing dynasties, when ethical concepts changed."},{"id":"257","start":1931.6,"end":1943.44,"displayStart":1931.6,"displayEnd":1943.44,"displayMid":1937.52,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.659168,"pitch":14.855942,"speechRate":4.73,"hasEvents":false,"sentence_source":"就是说明朝人就面临着一个巨大的困难，李清兆这么有才华 然后他竟然改嫁过，而他们的时代认为女性改嫁就是一个特别了得的事了。","sentence_en":"So Ming dynasty people faced a huge dilemma: Li Qingzhao was so talented, yet she had remarried. In their era, a woman remarrying was a huge deal."},{"id":"258","start":1943.44,"end":1956.82,"displayStart":1943.44,"displayEnd":1956.82,"displayMid":1950.13,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.752954,"pitch":18.771202,"speechRate":4.681,"hasEvents":false,"sentence_source":"所以他们有一个选择要么就干脆连才华都否认，可是这个才华又否认不掉 于是怎么样呢，就只能去否认 他改嫁过，就出现了一个否定李清兆再嫁运动。","sentence_en":"So they had a choice: either deny her talent outright. But they couldn't really deny that talent, so what did they do? They could only deny that she remarryed. Thus arose a movement to deny Li Qingzhao's remarriage."},{"id":"259","start":1956.82,"end":1963.12,"displayStart":1956.82,"displayEnd":1963.12,"displayMid":1959.9699999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":1.056225,"pitch":24.033401,"speechRate":6.046,"hasEvents":false,"sentence_source":"所以基于他们那个年代的新的审美和伦理道德的各种观念，把之前的历史做了某种修饰。","sentence_en":"So based on the aesthetic and ethical views of their time, they modified earlier history."},{"id":"260","start":1963.12,"end":1977.88,"displayStart":1963.12,"displayEnd":1977.88,"displayMid":1970.5,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.753427,"pitch":18.754662,"speechRate":4.336,"hasEvents":false,"sentence_source":"他们就开始就否认，就是他们一个是对史料进行歪曲性的解读，还有一个就是以理夺之，这个理就很有意思，这个理其实就有一个我觉得是古清最大的差别。","sentence_en":"They began to deny it. One method was to distort historical sources, and another was to use 'reason' to overrule. That 'reason' is very interesting — I think it reveals the biggest difference between ancient and modern times."},{"id":"261","start":1977.88,"end":1992,"displayStart":1977.88,"displayEnd":1992,"displayMid":1984.94,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.742469,"pitch":22.177942,"speechRate":3.895,"hasEvents":false,"sentence_source":"或不同时代最大的差别，以理夺之那个理究竟是什么，他们那个理是说像李清照这么一个伟大的女词人，怎么能够是一个载教之父呢。","sentence_en":"Or the biggest difference between eras: what exactly is this 'reason' they used? Their 'reason' said: how could a great poet like Li Qingzhao be a remarried woman?"},{"id":"262","start":1992,"end":1994.62,"displayStart":1992,"displayEnd":1994.62,"displayMid":1993.31,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Negative","score":-0.3,"loudness":0.568119,"pitch":17.598425,"speechRate":3.817,"hasEvents":false,"sentence_source":"所以他绝对不可能载教。","sentence_en":"So she absolutely could not have remarried."},{"id":"263","start":1994.62,"end":2009.66,"displayStart":1994.62,"displayEnd":2009.66,"displayMid":2002.1399999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Negative","score":-0.4,"loudness":0.794897,"pitch":21.019377,"speechRate":4.107,"hasEvents":false,"sentence_source":"那些说他载教过的人都是什么，后巫闲愿，就是李清超是一个闲愿，后来又说他是个真愿毛线，这完全就是处于他们的异乡情愿，他们都是很真诚的。","sentence_en":"Those who said she remarried were dismissed as 'slanderers' — saying Li Qingzhao was a 'loose woman' or a 'shrew' — completely out of their own wishful thinking. And they were sincere."},{"id":"264","start":2009.66,"end":2016.94,"displayStart":2009.66,"displayEnd":2016.94,"displayMid":2013.3000000000002,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.828308,"pitch":18.674364,"speechRate":4.258,"hasEvents":false,"sentence_source":"就像你那两个当事人一样，很真诚的在说呀，但事实上，但我觉得我做的工作。","sentence_en":"Like those two parties you mentioned — they were sincere in what they said. But in fact, the work I do..."},{"id":"265","start":2016.94,"end":2031.2,"displayStart":2016.94,"displayEnd":2031.2,"displayMid":2024.0700000000002,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.4,"loudness":0.693294,"pitch":14.539522,"speechRate":4.278,"hasEvents":false,"sentence_source":"其实跟侦探差不多，就是把他们两个不能让他们对峙，但最起码我们就要把他们说过的话，而且除了他说过的话以外，还有一个这个人是个什么身份。","sentence_en":"Is pretty much like a detective. We can't let them confront each other, but at least we look at what they said, and besides what they said, also what identity they had."},{"id":"266","start":2031.2,"end":2039.7,"displayStart":2031.2,"displayEnd":2039.7,"displayMid":2035.45,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.713986,"pitch":15.574065,"speechRate":4,"hasEvents":false,"sentence_source":"他在这个事件中所处的地位是什么，他为什么要这样说，你就是一层一层的波波波。","sentence_en":"What position they held in this event, why they spoke that way — you just peel layer by layer."},{"id":"267","start":2039.7,"end":2047.84,"displayStart":2039.7,"displayEnd":2047.84,"displayMid":2043.77,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.677745,"pitch":17.452003,"speechRate":4.791,"hasEvents":false,"sentence_source":"然后把互相局与互相矛盾的东西对起来，你就慢慢慢慢就比出来了，这就是我历史学者干的事。","sentence_en":"Then you match up mutually restraining and contradictory things, and slowly you work it out. That's what we historians do."},{"id":"268","start":2047.84,"end":2061,"displayStart":2047.84,"displayEnd":2061,"displayMid":2054.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.870961,"pitch":22.724573,"speechRate":4.863,"hasEvents":false,"sentence_source":"所以我发现后来如果了解历史的话，除了读正史以外，你读很多所谓补充史，或比如我读文学史 艺术史，都能够从中读到那个年代，不仅是衣食著行很多细节。","sentence_en":"So I've found that if you want to understand history, besides reading official history, reading so-called supplementary history — like literary history or art history — you can learn about that era, not just details of clothing, food, housing, and travel."},{"id":"269","start":2061,"end":2072.3,"displayStart":2061,"displayEnd":2072.3,"displayMid":2066.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.875731,"pitch":23.840036,"speechRate":5.664,"hasEvents":false,"sentence_source":"还能够了解那个年代的很多关键的人物关键的事件，最近我读的本很有意思的一个科幻小说，他刚刚拿到今年的余国奖的科幻小说的最佳短中篇小说奖。","sentence_en":"But also key figures and key events of that time. Recently I read a very interesting sci-fi novel that just won this year's Hugo Award for Best Short Novella."},{"id":"270","start":2072.3,"end":2080.5,"displayStart":2072.3,"displayEnd":2080.5,"displayMid":2076.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.4,"loudness":0.926426,"pitch":24.280682,"speechRate":5.432,"hasEvents":false,"sentence_source":"那个小说叫《时空画师》，他正好讲到王熙梦画千里江山图还是，我吞意知道王熙梦当时画的时候只有18岁。","sentence_en":"It's called 'The Space-Time Painter'. It happens to talk about Wang Ximeng painting 'A Thousand Li of Rivers and Mountains'. I vaguely knew that Wang Ximeng was only 18 when he painted it."},{"id":"271","start":2080.5,"end":2084.98,"displayStart":2080.5,"displayEnd":2084.98,"displayMid":2082.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.939796,"pitch":25.362471,"speechRate":5.841,"hasEvents":false,"sentence_source":"但是王熙梦18岁画完千里江山图之后好像手作就是绝唱。","sentence_en":"But after painting that at 18, it seemed that was his last masterpiece."},{"id":"272","start":2085.38,"end":2100.86,"displayStart":2085.38,"displayEnd":2100.86,"displayMid":2093.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.899797,"pitch":24.499544,"speechRate":5.145,"hasEvents":true,"sentence_source":"那最神奇的一点是王熙梦很年轻就进了当时的那个宫廷的那个画院，他是没有什么时间断可以去保揽祖国的美好河山，但千里江山图里面画的那些景点都真实存在 而且是遍布中国各地。","sentence_en":"The most amazing thing is that Wang Ximeng entered the court painting academy at a very young age. He didn't have much time to travel and appreciate the beautiful landscapes of the motherland, but the scenic spots depicted in 'A Thousand Li of Rivers and Mountains' actually exist and are scattered across China."},{"id":"273","start":2100.86,"end":2111.42,"displayStart":2100.86,"displayEnd":2111.42,"displayMid":2106.1400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.4,"loudness":0.850061,"pitch":21.896904,"speechRate":5.958,"hasEvents":false,"sentence_source":"那这个作家就说 哎 我当时就突然开始产生了幻想，说 那王熙孟什么时候与什么样的方式去游览祖国的河山，如果没有游览的话 他怎么画出来的。","sentence_en":"So the author said, 'Ah, I suddenly started imagining: when and how did Wang Ximeng travel the country's landscapes? If he didn't travel, how could he paint them?"},{"id":"274","start":2111.42,"end":2125.62,"displayStart":2111.42,"displayEnd":2125.62,"displayMid":2118.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.842859,"pitch":20.083666,"speechRate":5.35,"hasEvents":false,"sentence_source":"他说历史和文学在这种以某种神奇的方式产生连接，就是幻想就成了一种科幻，他有一种科幻的方式去表达，他熙孟当中王熙孟的这个千里江山图，就作为这个一个他的灵感的来源。","sentence_en":"He said history and literature connect in a magical way. That fantasy became sci-fi, and he expressed it in a sci-fi way, using Wang Ximeng's painting as a source of inspiration."},{"id":"275","start":2125.62,"end":2130.56,"displayStart":2125.62,"displayEnd":2130.56,"displayMid":2128.09,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.614401,"pitch":18.225815,"speechRate":3.644,"hasEvents":false,"sentence_source":"但我觉得 这种读法 当然可以作为一种读法。","sentence_en":"But I think this is certainly a valid way to read it."},{"id":"276","start":2130.56,"end":2144.02,"displayStart":2130.56,"displayEnd":2144.02,"displayMid":2137.29,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Negative","score":-0.3,"loudness":0.76056,"pitch":17.041262,"speechRate":3.715,"hasEvents":false,"sentence_source":"但是也有一种危险，比如说 您刚才说的这个作者，他认为王熙孟一定画的是他看到过的山村，只有看到过才能画出来 对吧。","sentence_en":"But there's also a danger. For example, that author you mentioned thinks Wang Ximeng must have painted what he saw — you have to see it to paint it, right?"},{"id":"277","start":2144.02,"end":2151.72,"displayStart":2144.02,"displayEnd":2151.72,"displayMid":2147.87,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.811102,"pitch":14.210069,"speechRate":4.026,"hasEvents":false,"sentence_source":"其实未必，比如说 我们读李清照的那词 像什么 至否至否 硬是绿肥红瘦 对吗。","sentence_en":"Actually, not necessarily. For example, when we read Li Qingzhao's line 'Is it? Is it? Actually the green is plump and the red is thin,' right?"},{"id":"278","start":2151.72,"end":2166.46,"displayStart":2151.72,"displayEnd":2166.46,"displayMid":2159.09,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.836447,"pitch":14.256872,"speechRate":3.597,"hasEvents":false,"sentence_source":"我们往往会理解成 这是李清照，他的一段生活场景 但实际上李清照的这首词其实是画写的，唐代的诗人韩沃的一首诗的后四句。","sentence_en":"We often interpret that as a scene from Li Qingzhao's life. But in fact, this poem was actually describing a painting — the last four lines of a poem by Tang dynasty poet Han Wo."},{"id":"279","start":2167.18,"end":2181.6,"displayStart":2167.18,"displayEnd":2181.6,"displayMid":2174.39,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.695169,"pitch":13.335855,"speechRate":3.638,"hasEvents":false,"sentence_source":"有时候其实阅读也能够成为写作的知识来源，肯定也能够成为画作的来源 并不一定非得是亲身经历，我同意 真的是这样的。","sentence_en":"Sometimes reading can be a source of knowledge for writing, and definitely for painting too — it doesn't have to be personal experience. I agree, that's really true."},{"id":"280","start":2181.6,"end":2195.04,"displayStart":2181.6,"displayEnd":2195.04,"displayMid":2188.3199999999997,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.773836,"pitch":17.488661,"speechRate":4.305,"hasEvents":true,"sentence_source":"其实接信历史的方式有非常多种，不必一定要读历史书，包括我觉得像最近正在热印的一个电影，《长安三万里》 书很多成年人看的内流满面。","sentence_en":"Actually, there are many ways to connect with history; you don't have to read history books. For example, a recent blockbuster film, 'Chang'an: 30,000 Miles' — many adults were moved to tears."},{"id":"281","start":2195.74,"end":2200.32,"displayStart":2195.74,"displayEnd":2200.32,"displayMid":2198.0299999999997,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The W "Positive","score":0.6,"loudness":0.708503,"pitch":17.469086,"speechRate":3.779,"hasEvents":false,"sentence_source":"那这个朋友又何尝不是你被俗世日渐消磨的那个你的一个氧气瓶，一个可以补充能量的对象呢。","sentence_en":"Then isn't that friend like an oxygen tank for the you being worn down by the mundane world, a source of energy replenishment?"},{"id":"297","start":2313.99,"end":2325.79,"displayStart":2313.99,"displayEnd":2325.79,"displayMid":2319.89,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.685665,"pitch":12.359301,"speechRate":4.226,"hasEvents":false,"sentence_source":"所以就这样的一个礼拜 我觉得它完全符合我的想象在，政治上 在人生选择上是狐狸糊涂的，但就是才华横移啊 没办法。","sentence_en":"So, for a week like this, I think it completely matched my imagination—politically and in life choices, it was confused like a fox, but the talent was just overwhelming, no way around it."},{"id":"298","start":2325.79,"end":2332.03,"displayStart":2325.79,"displayEnd":2332.03,"displayMid":2328.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.817977,"pitch":19.876598,"speechRate":4.934,"hasEvents":false,"sentence_source":"符合大家对于才子的所有的想象，我前一阵去看了一个画家的一个画展。","sentence_en":"It fits everyone's image of a gifted scholar. I recently visited an exhibition by a painter."},{"id":"299","start":2332.03,"end":2338.55,"displayStart":2332.03,"displayEnd":2338.55,"displayMid":2335.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.5,"loudness":0.816191,"pitch":20.241756,"speechRate":5.581,"hasEvents":false,"sentence_source":"然后他是把很多古代的一些名家的一些画作，以他的方式重新做了一些表达很有意思。","sentence_en":"He reinterpreted many ancient masterpieces in his own way, which was very interesting."},{"id":"300","start":2338.55,"end":2344.63,"displayStart":2338.55,"displayEnd":2344.63,"displayMid":2341.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.92003,"pitch":19.987047,"speechRate":6.414,"hasEvents":false,"sentence_source":"然后我当然就会发现，以这样的角度切入历史，是我可能借鉴历史的一个方法，我特别喜欢这样。","sentence_en":"Then I naturally realized that approaching history from this angle is a method I might use to learn from history, and I really like it."},{"id":"301","start":2344.63,"end":2357.73,"displayStart":2344.63,"displayEnd":2357.73,"displayMid":2351.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.860694,"pitch":21.66227,"speechRate":5.267,"hasEvents":false,"sentence_source":"然后他让我想到有一个画家叫李唐，唐也是跨越北宋南宋的一个画家，后来我当时就想，如果你看他在北宋末期画的话，和他进入南宋之后画的话，他表达状态一定不同。","sentence_en":"It reminded me of a painter named Li Tang, who also lived through the Northern and Southern Song dynasties. I thought that if you look at his paintings from the end of the Northern Song compared to those after he entered the Southern Song, the emotions he expressed must have been different."},{"id":"302","start":2357.73,"end":2370.43,"displayStart":2357.73,"displayEnd":2370.43,"displayMid":2364.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.872207,"pitch":24.32028,"speechRate":5.591,"hasEvents":false,"sentence_source":"因为后来我看到描述他说，他到了那个南度的时候，他已经是耳顺之年，就是我们会认为你那样一个年纪的人，你到了一个新的地方，新的朝代你内心，你能产生新的归属感吗。","sentence_en":"Because later I read that when he moved south, he was already sixty—so at that age, going to a new place with a new dynasty, could you really develop a new sense of belonging?"},{"id":"303","start":2370.43,"end":2373.49,"displayStart":2370.43,"displayEnd":2373.49,"displayMid":2371.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Negative","score":-0.3,"loudness":0.976489,"pitch":27.857155,"speechRate":4.678,"hasEvents":false,"sentence_source":"你肯定内心对于旧有的家乡。","sentence_en":"You must have felt a longing for your old hometown."},{"id":"304","start":2373.49,"end":2377.77,"displayStart":2373.49,"displayEnd":2377.77,"displayMid":2375.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Negative","score":-0.4,"loudness":0.841189,"pitch":23.101669,"speechRate":4.673,"hasEvents":true,"sentence_source":"对于旧有的生活方式，是故国充满了那种低思乡。","sentence_en":"For the old way of life, it's a nostalgia for the homeland, filled with a kind of melancholy."},{"id":"305","start":2378.25,"end":2385.91,"displayStart":2378.25,"displayEnd":2385.91,"displayMid":2382.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Negative","score":-0.4,"loudness":0.808399,"pitch":22.319948,"speechRate":5.125,"hasEvents":true,"sentence_source":"然后各种眷恋 内心的苦闷 就所有的一切，最终会附着你的笔端，当你画家以你的作品呈现的话。","sentence_en":"All that nostalgia and inner bitterness would eventually show through your brush. When a painter presents it through their work,"},{"id":"306","start":2385.91,"end":2400.19,"displayStart":2385.91,"displayEnd":2400.19,"displayMid":2393.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.4,"loudness":0.806864,"pitch":22.375481,"speechRate":5.112,"hasEvents":false,"sentence_source":"我们作为读者 作为观众一定能够感受到，你此刻笔触是表达完全不同的情绪，我会觉得就是可能我们后人会通过这样的方式，就一个画家还在北宋跟南宋不同画作表达的风格。","sentence_en":"we as readers and viewers can definitely feel that the strokes express completely different emotions. I think later generations can, through this kind of contrast  think that includes knowledge, wisdom, and also the way history asks questions and thinks, because history is essentially a discipline of reflection—we constantly ask questions from the present about the past."},{"id":"375","start":2932.87,"end":2941.69,"displayStart":2932.87,"displayEnd":2941.69,"displayMid":2937.2799999999997,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.678524,"pitch":14.498316,"speechRate":4.195,"hasEvents":false,"sentence_source":"我们给出自己的答案，当然这个工作其实也可以这样分工，比如有人专门做创造性的工作。","sentence_en":"We give our own answers. Of course, this work can be divided: some specialize in creative work."},{"id":"376","start":2941.69,"end":2953.55,"displayStart":2941.69,"displayEnd":2953.55,"displayMid":2947.62,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.668376,"pitch":13.848722,"speechRate":4.553,"hasEvents":false,"sentence_source":"然后中间有人做转化面向大众的普及工作，我比较特殊的地方，可能我一个人不同的工种我都做过，我面向大众讲的会比较多一点。","sentence_en":"Then some do the work of translating for public popularization. What's special about me is that I've done all these different roles, and I've spoken more to the public."},{"id":"377","start":2953.55,"end":2958.39,"displayStart":2953.55,"displayEnd":2958.39,"displayMid":2955.9700000000003,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.727993,"pitch":13.152068,"speechRate":3.512,"hasEvents":false,"sentence_source":"主要是从大概2012年百家奖坛开始。","sentence_en":"Mainly starting from the 'Lecture Room' program around 2012."},{"id":"378","start":2958.39,"end":2963.29,"displayStart":2958.39,"displayEnd":2963.29,"displayMid":2960.84,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"c :2991.1099999999997,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Negative","score":-0.3,"loudness":0.739981,"pitch":14.07297,"speechRate":3.436,"hasEvents":false,"sentence_source":"所以其实你会担心影响到你的评价，原因就是对公众讲是一回事 浅出是一回事。","sentence_en":"So you worry it might affect your evaluation, because speaking to the public is one thing—making it accessible—"},{"id":"383","start":2995.93,"end":3005.01,"displayStart":2995.93,"displayEnd":3005.01,"displayMid":3000.4700000000003,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.75227,"pitch":13.510029,"speechRate":4.075,"hasEvents":false,"sentence_source":"然后你的专业其实是靠你深入的那部分东西，两个产出是不同方向的产出 都需要花时间。","sentence_en":"But your expertise relies on deep work. The two outputs go in different directions and both take time."},{"id":"384","start":3005.01,"end":3017.37,"displayStart":3005.01,"displayEnd":3017.37,"displayMid":3011.19,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.4,"loudness":0.76951,"pitch":16.579697,"speechRate":4.207,"hasEvents":false,"sentence_source":"但是不能放在一起用 你在学书上更云和产出，可以作为向外书出的基础，同时你对公众的这个接触其实也会反补到你的学术。","sentence_en":"But they can't be used interchangeably. Your academic output can be a basis for external communication, and public engagement can feed back into your scholarship."},{"id":"385","start":3017.37,"end":3029.95,"displayStart":3017.37,"displayEnd":3029.95,"displayMid":3023.66,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.750082,"pitch":16.023899,"speechRate":5.008,"hasEvents":false,"sentence_source":"但是你不能拿你对对外的这个东西拿去评指称，这是坚决不可能的，但我当时之所以同意出来其实一个很重要的原因，就是当时一个编辑跟我说的是说。","sentence_en":"But you can't use that external work for academic evaluations; that's absolutely impossible. But the main reason I agreed back then was that an editor said to me."},{"id":"386","start":3029.95,"end":3040.93,"displayStart":3029.95,"displayEnd":3040.93,"displayMid":3035.4399999999996,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.728989,"pitch":13.049963,"speechRate":5.009,"hasEvents":false,"sentence_source":"知识是要分享的 这是我一贯的主张，就是我认为其实历史学是有一个对外的功能的，至于这个功能有不由我来做 我其实是有犹豫的。","sentence_en":"Knowledge is meant to be shared'—that's always been my belief. I think history has an external function. But whether I should be the one to do it, I was hesitant."},{"id":"387","start":3040.93,"end":3053.59,"displayStart":3040.93,"displayEnd":3053.59,"displayMid":3047.26,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.666826,"pitch":13.210733,"speechRate":3.676,"hasEvents":false,"sentence_source":"可是既然这个机会给到了 所以也可以来做的，我有能力做到既是靠谱的 又是有趣的，既然我能做 那何乐而不为。","sentence_en":"But since this opportunity came, I could do it. I'm capable of making it both reliable and interesting. Since I can do it, why not?"},{"id":"388","start":3053.59,"end":3069.01,"displayStart":3053.59,"displayEnd":3069.01,"displayMid":3061.3,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.7,"loudness":0.783672,"pitch":14.874725,"speechRate":4.669,"hasEvents":false,"sentence_source":"后来我答应出来的时候 跟我的两位前辈老师，颜布克老师 还有邓小南老师 其实都是去征寻过的然后我，记得邓老师说的一个话很鼓舞我，他是说那个平台上应该有我们的人。","sentence_en":"Later, when I agreed, I consulted two senior teachers: Professor Yan Buke and Professor Deng Xiaonan. I remember Deng said something encouraging usterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.7,"loudness":0.728629,"pitch":16.460922,"speechRate":3.331,"hasEvents":false,"sentence_source":"因为我想告诉你的就是清平月，包括孟华露 包括长安三万里，这些制作者的努力让我看到了新一代的创作者。","sentence_en":"Because what I want to tell you is that 'Serenade of Peaceful Joy,' including 'Meng Hua Lu' and 'Chang'an Three Thousand Miles,' the efforts of these producers show me a new generation of creators."},{"id":"415","start":3270.41,"end":3282.59,"displayStart":3270.41,"displayEnd":3282.59,"displayMid":3276.5,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Positive","score":0.6,"loudness":0.725069,"pitch":15.100114,"speechRate":3.978,"hasEvents":false,"sentence_source":"这些创作者不同于传统的那种戏曲的边缘者，他们有一种通过现代的手段，科学的方法来获取有关过去知识的能力。","sentence_en":"These creators are different from the traditional margins of opera. They have the ability to acquire knowledge about the past through modern means and scientific methods."},{"id":"416","start":3282.59,"end":3295.03,"displayStart":3282.59,"displayEnd":3295.03,"displayMid":3288.8100000000004,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.8,"loudness":0.664687,"pitch":17.080105,"speechRate":4.217,"hasEvents":false,"sentence_source":"包括读研究的著作 也包括读古人留下来的文字，获取知识 并且以一种现代人喜文乐见的方式输出，他们这个能力是令人赞美。","sentence_en":"Including reading research works and ancient texts, acquiring knowledge, and delivering it in a way that modern people enjoy. This ability is admirable."},{"id":"417","start":3295.03,"end":3310.51,"displayStart":3295.03,"displayEnd":3310.51,"displayMid":3302.7700000000004,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.7,"loudness":0.67966,"pitch":20.141108,"speechRate":4.218,"hasEvents":false,"sentence_source":"而且这里头的进步 你看比如说孟华露的进步吧，孟华露的那个宦官 他是入内都知，这你不读书哪来呀 这是编剧读书读出来的呀，要不然简单的就是大内总管。","sentence_en":"And here's the progress—take Meng Hualu's progress, for example. Meng Hualu's eunuch is titled 'Ru Nei Du Zhi.' You wouldn't know that without reading books; it's something the scriptwriter learned from reading. Otherwise, they would simply call him 'Chief Eunuch of the Inner Palace.'"},{"id":"418","start":3310.51,"end":3312.59,"displayStart":3310.51,"displayEnd":3312.59,"displayMid":3311.55,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.872521,"pitch":26.069807,"speechRate":6.266,"hasEvents":false,"sentence_source":"这不是人民群众喜文乐见吗。","sentence_en":"Isn't that what the masses love to see?"},{"id":"419","start":3312.59,"end":3316.33,"displayStart":3312.59,"displayEnd":3316.33,"displayMid":3314.46,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Views on History and the World","sentiment_en":"Neutral","score":0,"loudness":0.846194,"pitch":17.85062,"speechRate":3.209,"hasEvents":false,"sentence_source":"然后还有那男主是黄城副市。","sentence_en":"And the male lead is Huang Chengfu?"},{"id":"420","start":3316.33,"end":3322.79,"displayStart":3316.33,"displayEnd":3322.79,"displayMid":3319.56,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.834263,"pitch":18.516338,"speechRate":5.723,"hasEvents":false,"sentence_source":"我们喜闻乐见的称呼是什么，玉灵军之类的可能会用这样的，或者御前侍卫投领之类的。","sentence_en":"What do we like to call them? 'Yu Ling Jun' or something like that, or 'Imperial Guard Commander'?"},{"id":"421","start":3322.79,"end":3325.93,"displayStart":3322.79,"displayEnd":3325.93,"displayMid":3324.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.858475,"pitch":23.110964,"speechRate":6.601,"hasEvents":false,"sentence_source":"所以他的很多细节就说明他们做了足够的功课。","sentence_en":"So many details show they did enough homework."},{"id":"422","start":3325.93,"end":3337.67,"displayStart":3325.93,"displayEnd":3337.67,"displayMid":3331.8,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Positive","score":0.7,"loudness":0.742068,"pitch":16.934319,"speechRate":4.14,"hasEvents":false,"sentence_source":"然后还有我觉得像清平岳更让我感到惊讶，清平岳的编剧是学一处深，他这个剧里头我觉得有点特别了不起的地方。","sentence_en":"Then I think 'Serenade of Peaceful Joy' surprised me even more. The screenwriter studied deeply in this area, and there's something particularly remarkable about this show."},{"id":"423","start":3337.67,"end":3352.97,"displayStart":3337.67,"displayEnd":3352.97,"displayMid":3345.3199999999997,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Negative","score":-0.3,"loudness":0.705168,"pitch":16.329399,"speechRate":3.613,"hasEvents":false,"sentence_source":"我们传统的这个不管是传统的比如说舞台剧，还有电视剧里边朝堂都是个特别简单的概念，有一个永远是高高在上的 但会糊涂的。","sentence_en":"In traditional stage plays and TV dramas, the imperial court is often a very simple concept: there's always a ruler on high but somewhat confused."},{"id":"424","start":3352.97,"end":3358.69,"displayStart":3352.97,"displayEnd":3358.69,"displayMid":3355.83,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"The Work of Historical Research","sentiment_en":"Negative","score":-0.4,"loudness":0.694823,"pitch":19.190744,"speechRate":5.097,"hasEvents":false,"sentence_source":"可是不会犯错的 不会真的，所有错误不会的 由他当的皇帝 他会被迷惑。","sentence_en":"But he doesn't really make mistakes—all mistakes are due to being misled, 9997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.3,"loudness":0.865828,"pitch":21.119789,"speechRate":5.469,"hasEvents":true,"sentence_source":"之前没有想过 但如今在这个阶段我回看，尤其在我们这个时期大家在讲女性主义，讲女性的很多的话题说 我回看我们的来路，会发现我们这一代女性是不容易的。","sentence_en":"I hadn't thought about it before, but now at this stage, looking back, especially in our time when everyone is talking about feminism and many topics about women, I look back at our journey and realize that women of our generation have not had it easy."},{"id":"524","start":4075.5,"end":4079.12,"displayStart":4075.5,"displayEnd":4079.12,"displayMid":4077.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Positive","score":0.6,"loudness":0.842411,"pitch":20.036758,"speechRate":6.515,"hasEvents":true,"sentence_source":"我们还是做出了很多我们这一代人该有的贡献。","sentence_en":"We have indeed made many contributions that our generation should make."},{"id":"525","start":4079.12,"end":4089.92,"displayStart":4079.12,"displayEnd":4089.92,"displayMid":4084.52,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.3,"loudness":0.647729,"pitch":17.198677,"speechRate":4.259,"hasEvents":false,"sentence_source":"真的是不容易的 比如说我们已经是在女性被解放以后了，去中国的女性是被解放的 就我们的那个女性的解放。","sentence_en":"It's really not easy. For example, we are already after women's liberation. Chinese women are liberated—our women's liberation."},{"id":"526","start":4089.92,"end":4102.7,"displayStart":4089.92,"displayEnd":4102.7,"displayMid":4096.3099999999995,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.4,"loudness":0.720983,"pitch":15.112375,"speechRate":4.695,"hasEvents":false,"sentence_source":"其实是一个被给到 被赐予的这样的一个状态，是民族的解放 带动了女性的解放，不是女性自己争来的，所谓被解放其实就是我们允许出来工作了。","sentence_en":"Actually, it's a state of being given or bestowed. It was national liberation that drove women's liberation, not something women fought for themselves. So-called liberation just meant we were allowed to go out to work."},{"id":"527","start":4102.7,"end":4109.24,"displayStart":4102.7,"displayEnd":4109.24,"displayMid":4105.969999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Positive","score":0.4,"loudness":0.651783,"pitch":16.428299,"speechRate":4.022,"hasEvents":false,"sentence_source":"对吧 你不需要再做家庭妇女，你可以找工作 你可以经济上独立。","sentence_en":"Right? You no longer have to be a housewife; you can find a job and be financially independent."},{"id":"528","start":4109.24,"end":4122.96,"displayStart":4109.24,"displayEnd":4122.96,"displayMid":4116.1,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.5,"loudness":0.786484,"pitch":18.413294,"speechRate":3.061,"hasEvents":false,"sentence_source":"但是事实上 你比如说大人聊天的时候会聊说，假设谁家特别脏，人家就会说那家的媳妇或闺女特别懒。","sentence_en":"But in fact, when adults talk, if someone's house is particularly dirty, they'll say the wife or daughter is lazy."},{"id":"529","start":4122.96,"end":4130.1,"displayStart":4122.96,"displayEnd":4130.1,"displayMid":4126.530000000001,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.5,"loudness":0.776164,"pitch":23.334496,"speechRate":4.211,"hasEvents":false,"sentence_source":"她不会说 为什么不说那家的老爷们特别懒呢，没有 就是我们出来工作了。","sentence_en":"They won't say—why don't they say the man of the house is lazy? No, it's just that we go out to work."},{"id":"530","start":4130.1,"end":4143.44,"displayStart":4130.1,"displayEnd":4143.44,"displayMid":4136.77,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Negative","score":-0.4,"loudness":0.756532,"pitch":16.293123,"speechRate":4.573,"hasEvents":false,"sentence_source":"但是我们的教育告诉我们说 把家收拾好，照顾好家里的每一个人 就做嫌妻做凉母，仍然是你分内的事情，但后来其实我受到的一个最大的一个提醒。","sentence_en":"But our education told us to keep the house tidy, take care of everyone at home—to be a good wife and mother—is still your duty. But then I received a biggest reminder."},{"id":"531","start":4143.44,"end":4159.26,"displayStart":4143.44,"displayEnd":4159.26,"displayMid":4151.35,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Neutral","score":0,"loudness":0.734198,"pitch":15.711492,"speechRate":4.245,"hasEvents":false,"sentence_source":"我有一段时间是给美国的一个文艺学院，我给他们上课 比如说我就讲中国，我上字号的在讲 中国女性地位的提高，比如说我们前面举第一代的像娟生和子军 对吧。","sentence_en":"For a while, I taught at an American liberal arts college. For example, I lectured on China, specifically on the improvement of women's status in China, like the first generation of Juansheng and Zijun, right?"},{"id":"532","start":4159.26,"end":4167.28,"displayStart":4159.26,"displayEnd":4167.28,"displayMid":4163.27,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Negative","score":-0.5,"loudness":0.779243,"pitch":15.658446,"speechRate":5.296,"hasEvents":false,"sentence_source":"那就是一个很失败的子军虽然逃离了封建旧家庭，可是没有工作 所以不得不回溜溜的又回去了失败。","sentence_en":"That is a very failed example: although she escaped from the feudal old family, she had no job and had to slink back home, failing."},{"id":"533","start":4167.28,"end":4172.9,"displayStart":4167.28,"displayEnd":4172.9,"displayMid":4170.09,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Conversations with the Previous Generation","sentiment_en":"Neutral","score":0,"loudness":0.761227,"pitch":20.363882,"speechRate":5.023,"hasEvents":false,"sentence_source":"然后下面一个电影就是那里双双农村的，出来当妇女队长来干活。","sentence_en":"Then the next movie is about a rural woman named Shuangshuang who becomes a women's team leader to work."},{"id":"534","start":4172.9,"end":4182.2,"displayStart":4172.9,"displayEnd":4182.2,"displayMid":4177.549999999999,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.810832,"pitch":18.08659,"speechRate":4.839,"hasEvents":false,"sentence_source":"但是呢 我刚好用的那个镜头，就那个是李双双在赶面，她出去做妇女队长，但他们家这个做饭这事 希望还似她。","sentence_en":"But the scene I used is Li Shuangshuang making noodles. She goes out to be the women's team leader, but the cooking at home is still expected of her."},{"id":"535","start":4182.2,"end":4183.92,"displayStart":4182.2,"displayEnd":4183.92,"displayMid":4183.0599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.835772,"pitch":26.001291,"speechRate":5.988,"hasEvents":false,"sentence_source":"对 然后希望就会抱怨她。","sentence_en":"Yes, and then her husband complains about her."},{"id":"536","start":4184.12,"end":4197.94,"displayStart":4184.12,"displayEnd":4197.94,"displayMid":4191.03,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.768055,"pitch":19.252972,"speechRate":4.705,"hasEvents":true,"sentence_source":"然后这个时候 我的美国的学生，她就说 老师 谁做饭呢，他们家里有袭机吗，他们家里有电瓶箱吗，他们家里头有个电饭宝吗，我当时就傻了 我心想 这也是问题吗。","sentence_en":"Then at that moment, my American student said, 'Teacher, who does the cooking? Do they have a plane at home? Do they have an electric box? Do they have a rice cooker?' I was stunned and thought, 'Is this even a question?'"},{"id":"537","start":4198.48,"end":4208.58,"displayStart":4198.48,"displayEnd":4208.58,"displayMid":4203.53,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.703988,"pitch":19.466497,"speechRate":4.885,"hasEvents":false,"sentence_source":"但我被问傻了之后 我回过头就想 这真是问题，就是没有这些家电的帮助，而所有这些家务约定属成仍然在女性的身上。","sentence_en":"But after being stumped by the question, I thought back and realized this is really a problem. Without the help of these home appliances, all these household chores are still on women's shoulders."},{"id":"538","start":4208.58,"end":4216.54,"displayStart":4208.58,"displayEnd":4216.54,"displayMid":4212.5599999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.894579,"pitch":26.833403,"speechRate":5.528,"hasEvents":false,"sentence_source":"你看那个年代女性典礼双双，包括女理发师张瑞芳王丹凤，他们演的独立女性，正托家庭的束缚 要出来工作。","sentence_en":"You see, in that era, female characters like Shuangshuang, including the film 'The Woman Barber' with Zhang Ruifang and Wang Danfeng, played independent women who wanted to break free from family constraints and go out to work."},{"id":"539","start":4217.38,"end":4227.06,"displayStart":4217.38,"displayEnd":4227.06,"displayMid":4222.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.868445,"pitch":21.14485,"speechRate":4.959,"hasEvents":false,"sentence_source":"但是我的前提是我把家里面都照顾得很好，这样才能够最终换得老公的支持，去完成我一个独立女性的家庭以外的。","sentence_en":"But my premise was that I had to take good care of the home to finally earn my husband's support to pursue an independent woman's goals outside the family."},{"id":"540","start":4227.06,"end":4241.2,"displayStart":4227.06,"displayEnd":4241.2,"displayMid":4234.13,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.771077,"pitch":16.363489,"speechRate":5.174,"hasEvents":false,"sentence_source":"事业追求，就原来我们只要做嫌弃两母就OK了，现在不行 你现在得双肩调，就每一个在社会上工作的女性其实都是双肩调的，就是我觉得这个事后来慢慢你意识到这不公平啊。","sentence_en":"Career pursuit. Previously we just had to be a good wife and mother, that was OK. Now it's not enough; you have to shoulder double burdens. Every woman working in society actually has double burdens. I think later you gradually realize this is unfair."},{"id":"541","start":4241.2,"end":4250.02,"displayStart":4241.2,"displayEnd":4250.02,"displayMid":4245.610000000001,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.709124,"pitch":14.727242,"speechRate":4.6,"hasEvents":false,"sentence_source":"我有时候你知道我会怎么想吗，我在想 我上学的时候去老师家里吃饭，有一个闲会的师母在做饭。","sentence_en":"You know what I sometimes think? When I was in school, I went to a teacher's house for dinner, and there was a leisurely teacher's wife cooking."},{"id":"542","start":4250.02,"end":4252.02,"displayStart":4250.02,"displayEnd":4252.02,"displayMid":4251.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Positive","score":0.3,"loudness":0.917825,"pitch":27.524237,"speechRate":4.457,"hasEvents":false,"sentence_source":"我也想要一个师母。","sentence_en":"I want a shimu too."},{"id":"543","start":4252.02,"end":4256.44,"displayStart":4252.02,"displayEnd":4256.44,"displayMid":4254.23,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Positive","score":0.3,"loudness":0.985608,"pitch":23.006323,"speechRate":5.436,"hasEvents":true,"sentence_source":"就是我作为一个老师，我也觉得我家里应该配备一个师母。","sentence_en":"As a teacher, I also feel that my home should be equipped with a 'teacher's wife.'"},{"id":"544","start":4257.5,"end":4262.28,"displayStart":4257.5,"displayEnd":4262.28,"displayMid":4259.889999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":1.211827,"pitch":25.010317,"speechRate":4.184,"hasEvents":true,"sentence_source":"你忘了 你就是师母本母那，可是我又是老师本事。","sentence_en":"You forgot, you are the master's wife herself, but I am the master's ability."},{"id":"545","start":4263.3,"end":4269.84,"displayStart":4263.3,"displayEnd":4269.84,"displayMid":4266.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.054818,"pitch":23.167198,"speechRate":5.255,"hasEvents":false,"sentence_source":"所以这个时代女性就是我们是老师本师又是师母本母，只要求你具备这两个角色。","sentence_en":"So in this era, women are both the professional teacher and the homemaker wife; we are required to play both roles."},{"id":"546","start":4269.84,"end":4283.6,"displayStart":4269.84,"displayEnd":4283.6,"displayMid":4276.72,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Family and Growth","sentiment_en":"Positive","score":0.5,"loudness":0.62583,"pitch":13.888239,"speechRate":5.741,"hasEvents":true,"sentence_source":"是很难的，我第二个角色我就不做了，我连我自己都是吃食堂的，我以前就会跟我儿子说 我说你要理解，你妈妈是一个业余的妈妈，就是做饭对我来说是个业余的事情，但我现在觉得立直气壮的。","sentence_en":"It's very hard. I decided not to do the second role anymore. I even eat in the cafeteria myself. I used to tell my son, 'You have to understand, your mom is an amateur mom.' Cooking is an amateur thing for me. But now I feel perfectly justified."},{"id":"547","start":4283.98,"end":4285.34,"displayStart":4283.98,"displayEnd":4285.34,"displayMid":4284.66,"speaker":"Zhao Dongmei","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Women and Gender Liberation","sentiment_en":"Neutral","score":0,"loudness":0.790285,"pitch":26.075916,"speechRate":6.278,"hasEvents":tr
