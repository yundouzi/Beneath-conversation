,"hasEvents":true,"sentence_source":"鲁豫，所以如果那个时代没有突然发生一个变化的话，按常理您肯定就是一路唱通直到大学，如果当时一直就是这样非常自然的正常的完成您的学业的话。","sentence_en":"Lu Yu, so if that era hadn't suddenly changed, under normal circumstances you would have sailed straight through to university, if you had just naturally and normally completed your studies."},{"id":"182","start":1351.99,"end":1357.83,"displayStart":1351.99,"displayEnd":1357.83,"displayMid":1354.9099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.975131,"pitch":22.970608,"speechRate":5.651,"hasEvents":false,"sentence_source":"您觉得您大概率还会学您后来的专业吗，还是您觉得您的兴趣可能是有改变的。","sentence_en":"Do you think you'd most likely have studied the same major later, or do you think your interests might have changed?"},{"id":"183","start":1357.83,"end":1368.79,"displayStart":1357.83,"displayEnd":1368.79,"displayMid":1363.31,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.889611,"pitch":21.737755,"speechRate":4.208,"hasEvents":true,"sentence_source":"我觉得这个很难预测，就是文理我也没有明显的特别喜欢文，还是特别喜欢理，太小了 那时候初一你哪知道啊。","sentence_en":"I think it's hard to predict—I didn't have a clear preference for humanities or sciences; I was too young, just in junior high, how could I know?"},{"id":"184","start":1368.79,"end":1376.79,"displayStart":1368.79,"displayEnd":1376.79,"displayMid":1372.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.997402,"pitch":21.364229,"speechRate":4.885,"hasEvents":true,"sentence_source":"那您会怎么样形容那个时候的银河，她肯定是好学生 是听话的 还是叛逆的 还是怎样的。","sentence_en":"How would you describe yourself back then? Were you definitely a good student, obedient, or rebellious, or what?"},{"id":"185","start":1376.79,"end":1384.47,"displayStart":1376.79,"displayEnd":1384.47,"displayMid":1380.63,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.86326,"pitch":22.360165,"speechRate":4.624,"hasEvents":false,"sentence_source":"一点也不叛逆吧 我就觉得一直是，关于女啊 好学生啊之类的 也就是这个样子。","sentence_en":"Not rebellious at all, I think I've always been—just a good student, that's pretty much it."},{"id":"186","start":1385.15,"end":1388.77,"displayStart":1385.15,"displayEnd":1388.77,"displayMid":1386.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.996938,"pitch":24.544214,"speechRate":6.78,"hasEvents":false,"sentence_source":"我觉得每个年代少男少女本质没有什么不同 我想象。","sentence_en":"I think teenagers' nature hasn't been much different across generations, I imagine."},{"id":"187","start":1388.77,"end":1397.31,"displayStart":1388.77,"displayEnd":1397.31,"displayMid":1393.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.967884,"pitch":22.191202,"speechRate":5.399,"hasEvents":false,"sentence_source":"那大家想象的就是小孩子到十几岁总会经历一个所谓青春叛逆期，只不过来得早或者晚嘛 早不叛逆晚叛逆。","sentence_en":"People imagine that kids in their teens always go through a so-called adolescent rebellious phase, just early or late—if not early, then late."},{"id":"188","start":1397.31,"end":1400.07,"displayStart":1397.31,"displayEnd":1400.07,"displayMid":1398.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.898823,"pitch":22.743523,"speechRate":6.557,"hasEvents":false,"sentence_source":"那您后来经历过这个所谓的青春叛逆期吗。","sentence_en":"So did you later experience that so-called adolescent rebellious phase?"},{"id":"189","start":1400.07,"end":1415.95,"displayStart":1400.07,"displayEnd":1415.95,"displayMid":1408.01,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.925457,"pitch":21.479221,"speechRate":3.7,"hasEvents":false,"sentence_source":"我觉得是这样 就是现在的年轻人，他青春叛逆期是内发的，他自己到了一定的岁数以后 他就开始叛逆了，这个 我姐姐有一次给我讲他的小孩。","sentence_en":"I think it's like this: today's young people have an internal rebellious phase. When they reach a certain age, they start to rebel. My sister once told me about her child."},{"id":"190","start":1415.95,"end":1430.97,"displayStart":1415.95,"displayEnd":1430.97,"displayMid":1423.46,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.877241,"pitch":22.846863,"speechRate":4.461,"hasEvents":false,"sentence_source":"叛逆到什么程度 就是你跟他说，你躺下 他就马上就坐起来，你要是跟他说 你坐起来 他马上就躺下，就叛逆到这种程度，这种内发的那种 好像人人都有这么一个时期。","sentence_en":"Rebellious to the point where if you tell him to lie down, he'll sit up immediately; if you tell him to sit up, he'll lie down—that kind of internal rebelliousness. It seems everyone has such a phase."},{"id":"191","start":1430.97,"end":1445.35,"displayStart":1430.97,"displayEnd":1445.35,"displayMid":1438.1599999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.869062,"pitch":23.130966,"speechRate":3.887,"hasEvents":false,"sentence_source":"可是我觉得 我上《十大女福》的时候是14岁，正是应该是青春叛逆期的时候，可是我没有经历这个内发的这种叛逆期，而是外力推动的。","sentence_en":"But I think when I entered the Top Girls' School at 14, which should be the adolescent rebellious phase, I didn't experience that internal rebellion—instead, it was externally driven."},{"id":"192","start":1445.35,"end":1458.35,"displayStart":1445.35,"displayEnd":1458.35,"displayMid":1451.85,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.94775,"pitch":24.024633,"speechRate":3.984,"hasEvents":false,"sentence_source":"就是说 当时他们这些年轻人是，当他长大了 他怀疑固定的主流的价值观的时候，她开始逆反了 而我们正好在15岁的时候。","sentence_en":"That is, when those young people grew up and doubted fixed mainstream values, they started to rebel. But we, at age 15..."},{"id":"193","start":1458.35,"end":1473.11,"displayStart":1458.35,"displayEnd":1473.11,"displayMid":1465.73,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.884451,"pitch":25.590542,"speechRate":3.93,"hasEvents":false,"sentence_source":"我们的经历是主流价值观已经完全被推翻 被否定了，这个到底应该是用什么价值观来生活，是你要靠自己去找 所以我说是我是外力推动的。","sentence_en":"Our experience was that mainstream values were already completely overturned and denied. What values should we live by? We had to find out ourselves. So I say it was externally driven."},{"id":"194","start":1473.11,"end":1476.81,"displayStart":1473.11,"displayEnd":1476.81,"displayMid":1474.96,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.3,"loudness":0.8756,"pitch":25.10804,"speechRate":5.579,"hasEvents":false,"sentence_source":"就是不要我自己对这个主流价值观烦得不得了。","sentence_en":"It wasn't that I myself was extremely fed up with mainstream values."},{"id":"195","start":1476.81,"end":1490.95,"displayStart":1476.81,"displayEnd":1490.95,"displayMid":1483.88,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Negative","score":-0.4,"loudness":0.93295,"pitch":26.047651,"speechRate":4.314,"hasEvents":false,"sentence_source":"然后我去判一逆 我去造反 不是这个，就是外面整个价值都已经混乱了，到底什么是好 什么是坏 什么生活道路，人生观 什么这些世界观 全都被颠覆了。","sentence_en":"Then I rebel? No, it was that the entire external value system was in chaos. What is good, what is bad, what path to take, outlook on life, worldview—all were overturned."},{"id":"196","start":1490.95,"end":1503.43,"displayStart":1490.95,"displayEnd":1503.43,"displayMid":1497.19,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.894624,"pitch":25.875416,"speechRate":4.167,"hasEvents":false,"sentence_source":"所以到底你这辈子要怎么过，你要有什么样的三观 什么样的人生观，什么样的价值观 什么样的世界观，都得靠你自己去摸索了。","sentence_en":"So how to live your life, what three outlooks (worldview, life outlook, values) to have—you had to figure out on your own."},{"id":"197","start":1503.43,"end":1508.97,"displayStart":1503.43,"displayEnd":1508.97,"displayMid":1506.2,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.747859,"pitch":20.550621,"speechRate":4.699,"hasEvents":false,"sentence_source":"所以它就不是叛逆 而是在我那个岁数是摸索，就自己去找了。","sentence_en":"So it wasn't rebellion; at that age it was exploration—finding out for myself."},{"id":"198","start":1508.97,"end":1519.53,"displayStart":1508.97,"displayEnd":1519.53,"displayMid":1514.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.949824,"pitch":25.56168,"speechRate":5.094,"hasEvents":true,"sentence_source":"那这样的一个年轻的一个小孩，他需要在一个非常纷乱的一个社会当中，去摸索自己的道路，他内心的信念感来自哪呢?","sentence_en":"So such a young kid, needing to find his own path in a very chaotic society—where did his inner sense of belief come from?"},{"id":"199","start":1519.79,"end":1526.23,"displayStart":1519.79,"displayEnd":1526.23,"displayMid":1523.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.928543,"pitch":23.757641,"speechRate":5.466,"hasEvents":false,"sentence_source":"他会因此而变得内心很混乱，找不到方向，我很好奇你那时候的心理状态是怎样的。","sentence_en":"Would he become confused inside, losing direction? I'm curious about your psychological state back then."},{"id":"200","start":1526.23,"end":1541.89,"displayStart":1526.23,"displayEnd":1541.89,"displayMid":1534.06,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.942883,"pitch":22.493366,"speechRate":3.756,"hasEvents":false,"sentence_source":"其实那时候还没有什么思考能力，也就是跟着比如说大家都17岁的时候，去内蒙兵团了，当时我觉得是被社会推动的并不是你自觉的选择。","sentence_en":"Actually, I didn't have much ability to think at that time. I just followed along—when everyone was 17, they went to the Inner Mongolia Production and Construction Corps. Back then, I felt it was pushed by society, not a conscious choice."},{"id":"201","start":1541.89,"end":1553.77,"displayStart":1541.89,"displayEnd":1553.77,"displayMid":1547.83,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.4,"loudness":0.888987,"pitch":23.412657,"speechRate":3.283,"hasEvents":false,"sentence_source":"但是当时就会想努力工作 要做一个好人，要现身边疆 现身我们那个时候内蒙兵团叫囤肯树边。","sentence_en":"Back then, I just wanted to work hard, be a good person, and dedicate myself to the frontier—what we called 'tun ken shu bian' in the Inner Mongolia Corps."},{"id":"202","start":1553.77,"end":1568.55,"displayStart":1553.77,"displayEnd":1568.55,"displayMid":1561.1599999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.88871,"pitch":22.514616,"speechRate":3.721,"hasEvents":false,"sentence_source":"自己在中地然后还保卫边疆 就是为革命事业现身，这就是当时的一个想法吧，我记得当时在火车站上一列车的知青，刚一开车的时候。","sentence_en":"Being stationed there and guarding the frontier meant dedicating to the revolutionary cause. That was my thought. I remember at the train station, as soon as the train with all the educated youth started moving..."},{"id":"203","start":1568.55,"end":1583.57,"displayStart":1568.55,"displayEnd":1583.57,"displayMid":1576.06,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":0.812315,"pitch":22.455553,"speechRate":4.328,"hasEvents":false,"sentence_source":"哇一下就全都哭了，我当时还挺泛愣的 我一点都没哭，我心里想的，这个不是我要争取去的地方吗，我还心里可以说挺想往的，我为了去内蒙兵团 我还写了血书。","sentence_en":"Wow, everyone burst into tears. I was stunned—I didn't cry at all. I thought, isn't this what I fought for? I was actually looking forward to it. I even wrote a blood letter to join the Inner Mongolia Corps."},{"id":"204","start":1583.57,"end":1589.01,"displayStart":1583.57,"displayEnd":1589.01,"displayMid":1586.29,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.5,"loudness":0.79535,"pitch":21.892155,"speechRate":4.044,"hasEvents":false,"sentence_source":"这是我这一生唯一的一次写血书，要求去内蒙兵团的。","sentence_en":"This was the only time in my life I wrote a blood letter, requesting to go to the Inner Mongolia Corps."},{"id":"205","start":1589.01,"end":1597.19,"displayStart":1589.01,"displayEnd":1597.19,"displayMid":1593.1,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.90797,"pitch":25.229519,"speechRate":4.765,"hasEvents":false,"sentence_source":"所以大家都哭 我心里还很纳闷，我说有什么可哭的吗，就是我好不容易争取到的一个机会。","sentence_en":"So everyone was crying, and I was puzzled. I said, what is there to cry about? This was a hard-won opportunity for me."},{"id":"206","start":1598.09,"end":1613.03,"displayStart":1598.09,"displayEnd":1613.03,"displayMid":1605.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.975498,"pitch":23.359419,"speechRate":4.284,"hasEvents":true,"sentence_source":"说到这儿我就有好奇点太多了，首先写《雪书》这个事儿，影视剧当中看到过，都是把识指咬破，我好奇您当时也是咬破识指吗，应当不是咬的 应该是拿刀拉的吧。","sentence_en":"Speaking of this, I have too many curiosities. First, about writing the 'blood letter'—I've seen it in movies and TV shows where they bite their finger to draw blood. I'm curious, did you also bite your finger back then? It probably wasn't a bite; it must have been cut with a knife."},{"id":"207","start":1615.55,"end":1621.63,"displayStart":1615.55,"displayEnd":1621.63,"displayMid":1618.5900000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.850913,"pitch":24.384235,"speechRate":5.133,"hasEvents":true,"sentence_source":"去咬的话我不记得有这个动作，一定是拿刀拉的，拿刀拉的写了一个《雪书》。","sentence_en":"I don't remember biting myself. It must have been cut with a knife to write a blood letter."},{"id":"208","start":1621.63,"end":1630.91,"displayStart":1621.63,"displayEnd":1630.91,"displayMid":1626.27,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.919262,"pitch":22.226871,"speechRate":3.93,"hasEvents":false,"sentence_source":"因为当时这个兵团它是比插队好的 你知道吧，它所要求的资格要比一般的插队高一些。","sentence_en":"Because at that time, the Corps was better than being sent to the countryside. Its requirements were higher than ordinary rural assignments."},{"id":"209","start":1630.91,"end":1639.53,"displayStart":1630.91,"displayEnd":1639.53,"displayMid":1635.22,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.894195,"pitch":20.918724,"speechRate":4.292,"hasEvents":false,"sentence_source":"所以我就特别努力的才能争取到去，如果是这种兵团的话 是不是生活条件，会相对好一点。","sentence_en":"So I worked especially hard to get in. If it's this kind of Corps, wouldn't the living conditions be relatively better?"},{"id":"210","start":1639.53,"end":1642.75,"displayStart":1639.53,"displayEnd":1642.75,"displayMid":1641.1399999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.846505,"pitch":21.529915,"speechRate":4.034,"hasEvents":false,"sentence_source":"对对对 劳动是比插队更重的。","sentence_en":"Yes, yes, yes. The labor was heavier than in the countryside."},{"id":"211","start":1642.75,"end":1644.61,"displayStart":1642.75,"displayEnd":1644.61,"displayMid":1643.6799999999998,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Positive","score":0.3,"loudness":0.995777,"pitch":20.988548,"speechRate":3.67,"hasEvents":false,"sentence_source":"但是它吃得饱。","sentence_en":"But you got enough to eat."},{"id":"212","start":1644.61,"end":1652.85,"displayStart":1644.61,"displayEnd":1652.85,"displayMid":1648.73,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.869786,"pitch":23.820206,"speechRate":3.277,"hasEvents":false,"sentence_source":"那个公分也是好 比如说一个公分才几分钱，冰团是实行军艺制的。","sentence_en":"The work points were good too—like, one work point was only a few cents, but the Corps had a military system."},{"id":"213","start":1652.85,"end":1656.37,"displayStart":1652.85,"displayEnd":1656.37,"displayMid":1654.61,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.008486,"pitch":28.823854,"speechRate":4.769,"hasEvents":false,"sentence_source":"我们像军人一样 等于没有领帐冒汇。","sentence_en":"We were like soldiers—no salary or allowances."},{"id":"214","start":1656.37,"end":1667.37,"displayStart":1656.37,"displayEnd":1667.37,"displayMid":1661.87,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.865126,"pitch":22.564693,"speechRate":3.455,"hasEvents":false,"sentence_source":"但是 她是每个月发津贴费的，每个月男生发6块钱的津贴，女生是6.7毛5 我记得 为什么呢。","sentence_en":"But we got a monthly allowance. Boys got 6 yuan, girls got 6.75—I remember that. Why?"},{"id":"215","start":1667.37,"end":1671.77,"displayStart":1667.37,"displayEnd":1671.77,"displayMid":1669.57,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.02971,"pitch":27.84902,"speechRate":5.516,"hasEvents":false,"sentence_source":"那些7毛5是卫生费，因为女生月金需要买一些。","sentence_en":"That 0.75 was for hygiene expenses, because girls needed to buy supplies for menstruation."},{"id":"216","start":1671.77,"end":1674.13,"displayStart":1671.77,"displayEnd":1674.13,"displayMid":1672.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.884421,"pitch":24.129217,"speechRate":1.695,"hasEvents":false,"sentence_source":"用品而且。","sentence_en":"Supplies, and."},{"id":"217","start":1674.63,"end":1684.91,"displayStart":1674.63,"displayEnd":1684.91,"displayMid":1679.77,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Positive","score":0.5,"loudness":0.891067,"pitch":24.05258,"speechRate":4.669,"hasEvents":false,"sentence_source":"粮食定量是每个月45斤，这个东西应该比插队要好我觉得，我的身体后来还不错，可能也有那段时间底子打得不错。","sentence_en":"Food ration was 45 jin per month. I think that was better than in the countryside. My health later was pretty good, maybe because I built a good foundation during that time."},{"id":"218","start":1684.91,"end":1690.69,"displayStart":1684.91,"displayEnd":1690.69,"displayMid":1687.8000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.100482,"pitch":28.609495,"speechRate":5.451,"hasEvents":false,"sentence_source":"那每个月如果您来 币价来月金的时候，该干农活 该干重活还是要干吗。","sentence_en":"So every month, when you had your period, did you still have to do farm work and heavy labor?"},{"id":"219","start":1690.69,"end":1695.53,"displayStart":1690.69,"displayEnd":1695.53,"displayMid":1693.1100000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.901028,"pitch":22.570181,"speechRate":4.74,"hasEvents":false,"sentence_source":"对 那个时候没有说要，这个东西你就可以休假 没有。","sentence_en":"Yes, at that time there was no saying you could take leave for that. No."},{"id":"220","start":1695.53,"end":1707.51,"displayStart":1695.53,"displayEnd":1707.51,"displayMid":1701.52,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.828325,"pitch":21.083858,"speechRate":4.378,"hasEvents":false,"sentence_source":"但是可能比如说要下凉水啊什么之类的，应该能照顾一下，我不记得因为这个生理期给你什么，女孩可以不去下地什么的。","sentence_en":"But maybe, like, if you had to go into cold water or something, they might show some consideration. I don't remember them giving any special treatment for menstruation, like girls not having to go to the fields."},{"id":"221","start":1707.51,"end":1711.63,"displayStart":1707.51,"displayEnd":1711.63,"displayMid":1709.5700000000002,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Negative","score":-0.3,"loudness":1.129806,"pitch":26.352234,"speechRate":5.025,"hasEvents":false,"sentence_source":"干活儿你说劳动量这个东西实在是非常非常大。","sentence_en":"Working—you say the labor intensity was really, really high."},{"id":"222","start":1711.63,"end":1716.79,"displayStart":1711.63,"displayEnd":1716.79,"displayMid":1714.21,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.914041,"pitch":25.464184,"speechRate":3.664,"hasEvents":false,"sentence_source":"我们就是修河堤，男生把大泥巴缠到框里。","sentence_en":"We were repairing river embankments. The boys would load large clumps of mud into baskets."},{"id":"223","start":1716.79,"end":1719.77,"displayStart":1716.79,"displayEnd":1719.77,"displayMid":1718.28,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.827664,"pitch":21.550249,"speechRate":3.356,"hasEvents":false,"sentence_source":"然后女生把它往岸上挑。","sentence_en":"Then the girls would carry them to the shore."},{"id":"224","start":1719.77,"end":1722.47,"displayStart":1719.77,"displayEnd":1722.47,"displayMid":1721.12,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":0.800387,"pitch":27.354082,"speechRate":5.185,"hasEvents":false,"sentence_source":"那一旦怎么也得有100多斤吧。","sentence_en":"Each load must have been over 100 jin."},{"id":"225","start":1722.47,"end":1724.75,"displayStart":1722.47,"displayEnd":1724.75,"displayMid":1723.6100000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.217864,"pitch":31.528276,"speechRate":5.867,"hasEvents":false,"sentence_source":"所以，后来您说是不是因为。","sentence_en":"So, later you said, is it because..."},{"id":"226","start":1724.75,"end":1732.27,"displayStart":1724.75,"displayEnd":1732.27,"displayMid":1728.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.073233,"pitch":27.89991,"speechRate":4.654,"hasEvents":false,"sentence_source":"您当时在内蒙兵团，你们的生活却相对还是比起，在其他地方的知情可能更辛苦一点。","sentence_en":"You were in the Inner Mongolia Corps at that time, but your life was relatively harder compared to educated youth in other places."},{"id":"227","start":1732.27,"end":1745.45,"displayStart":1732.27,"displayEnd":1745.45,"displayMid":1738.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.055691,"pitch":23.225122,"speechRate":4.766,"hasEvents":false,"sentence_source":"所以在内蒙查过队或者参加过兵团的人后来写小说的非常少，只有狼图腾 还有老鬼的那个血色黄昏，说但云南之清就写了很多嘛 包王小波什么的。","sentence_en":"So very few people who served in Inner Mongolia production teams or military corps later wrote novels—only Wolf Totem and Old Ghost's Blood Red Dusk. But in Yunnan, many wrote, including Wang Xiaobo."},{"id":"228","start":1745.45,"end":1750.35,"displayStart":1745.45,"displayEnd":1750.35,"displayMid":1747.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood memories","sentiment_en":"Neutral","score":0,"loudness":1.06027,"pitch":23.750547,"speechRate":6.292,"hasEvents":false,"sentence_source":"那您觉得是因为跟这个您在内蒙还是相对更艰苦一点那个环境我。","sentence_en":"So do you think it's because the environment in Inner Mongolia was relatively tougher?"},{"id drinking poison to quench thirst—desperation. I remember the frenzy of reading because I was so starved."},{"id":"248","start":1913.73,"end":1926.97,"displayStart":1913.73,"displayEnd":1926.97,"displayMid":1920.35,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.5,"loudness":0.846227,"pitch":22.110748,"speechRate":3.735,"hasEvents":false,"sentence_source":"就是整个在文化的沙漠和物质的，实在的沙漠上呆了三年以后，你想想人能够即可到什么程度，完全是这个镜头在看书。","sentence_en":"After three years in a cultural and physical desert, imagine how desperate one can get—that was exactly how I devoured books."},{"id":"249","start":1926.97,"end":1942.59,"displayStart":1926.97,"displayEnd":1942.59,"displayMid":1934.78,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":0.659802,"pitch":21.861193,"speechRate":4.38,"hasEvents":false,"sentence_source":"后来我这个读书笔记还出了一本书，很多年以前吧 出了这本我小时候写的读书笔记，叫做《我的心灵阅读》，大概十几年以前吧 出的这个，包括《1984》 包括《卖田守望者》。","sentence_en":"Later, those reading notes were published as a book many years ago, called My Spiritual Reading, from my childhood. It includes 1984 and The Catcher in the Rye."},{"id":"250","start":1942.59,"end":1947.95,"displayStart":1942.59,"displayEnd":1947.95,"displayMid":1945.27,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.768893,"pitch":22.431955,"speechRate":3.358,"hasEvents":false,"sentence_source":"《德尔拉斯的新阶级》，还有好多类似的文学书。","sentence_en":"Djilas' The New Class, and many similar literary works."},{"id":"251","start":1947.95,"end":1961.01,"displayStart":1947.95,"displayEnd":1961.01,"displayMid":1954.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.7,"loudness":1.027791,"pitch":26.321106,"speechRate":5.784,"hasEvents":false,"sentence_source":"我记得后来您还在书里面写，就当时读那个鱼果的《九三年》，说读到了那个阶级斗争，还有人心中的那种善恶之争，就读的也是泪流满面的，包括说对您人生伦理形成比较重大影响的。","sentence_en":"I remember you later wrote that when reading Hugo's Ninety-Three, you saw class struggle and the battle between good and evil, and were moved to tears. It also heavily shaped your personal ethics."},{"id":"252","start":1961.01,"end":1963.75,"displayStart":1961.01,"displayEnd":1963.75,"displayMid":1962.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.856888,"pitch":20.064718,"speechRate":5.839,"hasEvents":false,"sentence_source":"我记得您说的是《刹尼雪司机》的怎么办。","sentence_en":"I remember you mentioned Chernyshevsky's What Is to Be Done?"},{"id":"253","start":1963.75,"end":1978.27,"displayStart":1963.75,"displayEnd":1978.27,"displayMid":1971.01,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.86592,"pitch":22.780182,"speechRate":3.65,"hasEvents":false,"sentence_source":"我觉得这段读书有两个意义对我来说，一个就是说正是在摸索这个人生观，世界观这个时机，而这段时间读书呢 她就给你打开了。","sentence_en":"I think this period of reading had two meanings for me. One is that it came at a time when I was exploring my outlook on life and the world, and reading opened that up."},{"id":"254","start":1978.27,"end":1990.63,"displayStart":1978.27,"displayEnd":1990.63,"displayMid":1984.45,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.874332,"pitch":22.050077,"speechRate":3.803,"hasEvents":false,"sentence_source":"数了一些正确的人生观 世界观和价值观的一个契机，另外还有一个是审美 就是你从那个时候能够有一个审美力。","sentence_en":"It provided a chance to form correct views on life, the world, and values. The other was aesthetics – from then on, I developed a sense of aesthetic judgment."},{"id":"255","start":1990.63,"end":2003.99,"displayStart":1990.63,"displayEnd":2003.99,"displayMid":1997.31,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.84531,"pitch":21.545111,"speechRate":3.817,"hasEvents":false,"sentence_source":"我记得穆辛他说没有审美力是绝症 知识也救不了，这是穆辛的原话 审美力是什么，就是这本书是好书还是坏书 你能够分辨。","sentence_en":"I remember Mu Xin saying that lacking aesthetic judgment is an incurable disease, and knowledge can't save you. That's his exact words. What is aesthetic judgment? It's being able to tell whether a book is good or bad."},{"id":"256","start":2003.99,"end":2009.19,"displayStart":2003.99,"displayEnd":2009.19,"displayMid":2006.5900000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.9976,"pitch":23.134151,"speechRate":5,"hasEvents":false,"sentence_source":"比如这个电影是个好电影还是个烂电影，你能够把它分辨出来。","sentence_en":"For instance, you can tell whether a movie is good or bad."},{"id":"257","start":2009.19,"end":2020.09,"displayStart":2009.19,"displayEnd":2020.09,"displayMid":2014.6399999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.865164,"pitch":21.196033,"speechRate":4.404,"hasEvents":false,"sentence_source":"然后你能够欣赏到那个好电影和好书里头的那个美，这是沈美丽 沈美丽这个东西我觉得，就是那段读书给我带来的。","sentence_en":"And then you can appreciate the beauty in good movies and good books. This aesthetic judgment – I think that's what that reading period brought me."},{"id":"258","start":2020.09,"end":2033.99,"displayStart":2020.09,"displayEnd":2033.99,"displayMid":2027.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.038095,"pitch":25.608936,"speechRate":5.022,"hasEvents":false,"sentence_source":"一方面从书中您得到了这种早期的沈美丽，打下了非常好的一个基础，但同时对于一个年轻女孩来说，她所处的世界此刻会有种割裂感吧，就一个是文学当中的世界。","sentence_en":"On one hand, you got this early aesthetic sense from books, which laid a very good foundation. But at the same time, for a young girl, the world she was in felt fragmented – one being the world in literature."},{"id":"259","start":2033.99,"end":2043.79,"displayStart":2033.99,"displayEnd":2043.79,"displayMid":2038.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":1.016567,"pitch":25.481815,"speechRate":5,"hasEvents":false,"sentence_source":"另外一个是现实生活当中世界，你无论是当时在内蒙后来到山西，都那么辛苦的劳作，这两个世界的反差感如此之巨大。","sentence_en":"And the other was the real world. Whether in Inner Mongolia or later in Shanxi, the labor was so hard. The contrast between these two worlds was enormous."},{"id":"260","start":2043.79,"end":2046.35,"displayStart":2043.79,"displayEnd":2046.35,"displayMid":2045.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.92109,"pitch":18.729736,"speechRate":4.688,"hasEvents":false,"sentence_source":"那对你当时的影响是什么呢。","sentence_en":"What was the impact on you at that time?"},{"id":"261","start":2046.35,"end":2052.53,"displayStart":2046.35,"displayEnd":2052.53,"displayMid":2049.44,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.934334,"pitch":25.923237,"speechRate":4.659,"hasEvents":false,"sentence_source":"这个两个世界的分裂，就是让我觉得我所处的是一个现实世界。","sentence_en":"The split between these two worlds made me feel that I was living in a real world."},{"id":"262","start":2052.53,"end":2065.89,"displayStart":2052.53,"displayEnd":2065.89,"displayMid":2059.21,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.924718,"pitch":22.349321,"speechRate":3.743,"hasEvents":false,"sentence_source":"那些好书世界名著里头的世界，是理想的世界，这确实是两个完全不同的世界，她对我最大的影响应当是一个彻底的思考。","sentence_en":"The world in those great books and classics was an ideal world. They were indeed two completely different worlds. The biggest influence on me was a thorough reflection."},{"id":"263","start":2065.89,"end":2072.57,"displayStart":2065.89,"displayEnd":2072.57,"displayMid":2069.23,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.91067,"pitch":22.768709,"speechRate":4.848,"hasEvents":false,"sentence_source":"就是这个世界到底是什么样的，我在这个中间我应该怎么样来看这个世界。","sentence_en":"That is, what is this world really like? And how should I view the world from where I stand?"},{"id":"264","start":2072.57,"end":2086.71,"displayStart":2072.57,"displayEnd":2086.71,"displayMid":2079.6400000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.789478,"pitch":21.193016,"speechRate":3.536,"hasEvents":false,"sentence_source":"然后最终达到参透这样的一个境界吧，她对我理解这个人生的意义啊，都是特别特别有帮助的，我的所谓参透 什么叫参透。","sentence_en":"And eventually reaching a state of thorough understanding. It was especially helpful for me to understand the meaning of life. My so-called 'thorough understanding' – what does it mean?"},{"id":"265","start":2086.71,"end":2090.65,"displayStart":2086.71,"displayEnd":2090.65,"displayMid":2088.6800000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.4,"loudness":0.861552,"pitch":24.565506,"speechRate":4.626,"hasEvents":false,"sentence_source":"就是认识到生命在宫关上是没有意义的。","sentence_en":"It is to realize that life, on a macro level, is meaningless."},{"id":"266","start":2090.65,"end":2095.65,"displayStart":2090.65,"displayEnd":2095.65,"displayMid":2093.15,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.760566,"pitch":23.332689,"speechRate":4.731,"hasEvents":false,"sentence_source":"但是 微观上你可以自负意义，这就是我的所谓的参透。","sentence_en":"But on a micro level, you can assign meaning to it yourself. That is my so-called thorough understanding."},{"id":"267","start":2095.65,"end":2110.29,"displayStart":2095.65,"displayEnd":2110.29,"displayMid":2102.9700000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.868867,"pitch":22.716463,"speechRate":3.962,"hasEvents":false,"sentence_source":"因为从宏观上说 一个生命，你想象有那么多的天体，想象一下在空中飘来飘去的，一个小小的地球 上面有一个小小的我，这个像个小蚂蚁一样。","sentence_en":"Because from a macro perspective, imagine all the celestial bodies, and Earth floating in space, with a tiny me on it, like an ant."},{"id":"268","start":2110.29,"end":2120.75,"displayStart":2110.29,"displayEnd":2120.75,"displayMid":2115.52,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.879917,"pitch":23.44861,"speechRate":4.876,"hasEvents":false,"sentence_source":"我看到有一个哲学家在讲说，人生就是一个家常版的浮游，它这个浮游就是那种水上爬来爬去的小虫子，就是招生目死的嘛。","sentence_en":"I saw a philosopher saying that life is like a common mayfly – that little insect that crawls on water, born in the morning and dead by evening."},{"id":"269","start":2120.75,"end":2136.63,"displayStart":2120.75,"displayEnd":2136.63,"displayMid":2128.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.830308,"pitch":20.135138,"speechRate":4.093,"hasEvents":false,"sentence_source":"那人生呢，它不过就是加长版，就是加长它有三万多天，它也比这个服务也没长多少，它怎么可能有意义呢，它不可能有任何的意义，在从宇宙上这种宏观上来看。","sentence_en":"Life is just an extended version—it's only about 30,000 days long, not much longer than this service. How could it have meaning? It can't have any meaning from a cosmic, macro perspective."},{"id":"270","start":2136.63,"end":2138.75,"displayStart":2136.63,"displayEnd":2138.75,"displayMid":2137.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.9537,"pitch":25.68187,"speechRate":3.846,"hasEvents":false,"sentence_source":"那么从微观上呢。","sentence_en":"Then from a micro perspective?"},{"id":"271","start":2138.75,"end":2148.91,"displayStart":2138.75,"displayEnd":2148.91,"displayMid":2143.83,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.84755,"pitch":21.807962,"speechRate":4.595,"hasEvents":false,"sentence_source":"我们其实是可以为它自负意义的，就是你自己来给自己确定一下，我这生要追求什么，什么东西对我是有意义的。","sentence_en":"We can actually assign meaning to it – you decide for yourself what you want to pursue in life, what is meaningful to you."},{"id":"272","start":2148.91,"end":2153.99,"displayStart":2148.91,"displayEnd":2153.99,"displayMid":2151.45,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.839228,"pitch":19.87993,"speechRate":4.413,"hasEvents":false,"sentence_source":"对我周边的人是有意义的，这就是我对人生的参透吧。","sentence_en":"And what is meaningful to those around me. That is my understanding of life."},{"id":"273","start":2154.65,"end":2164.29,"displayStart":2154.65,"displayEnd":2164.29,"displayMid":2159.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.5,"loudness":0.985156,"pitch":26.484474,"speechRate":5.475,"hasEvents":false,"sentence_source":"那那时候 您想到未来，内心会充满了迷茫跟困惑吗，就是我未来是要往哪个方向去，我会一直在这里吗，我会一直做这些农活。","sentence_en":"Back then, when you thought about the future, were you filled with confusion and uncertainty? Like, where am I headed? Will I stay here forever? Will I keep doing farm work?"},{"id":"274","start":2164.29,"end":2167.17,"displayStart":2164.29,"displayEnd":2167.17,"displayMid":2165.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.80663,"pitch":21.274363,"speechRate":3.472,"hasEvents":false,"sentence_source":"然后偷偷读书吗当时还。","sentence_en":"And secretly reading books on the side?"},{"id":"275","start":2167.17,"end":2180.25,"displayStart":2167.17,"displayEnd":2180.25,"displayMid":2173.71,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.5,"loudness":0.901044,"pitch":22.186573,"speechRate":3.67,"hasEvents":false,"sentence_source":"真是有过这样的想法，说如果一辈子都在这儿 在农村，当时还真的想到有这种可能性了，我记得王小波也说过一句话。","sentence_en":"I really had that thought – if I were stuck here in the countryside for life. I actually considered that possibility. I remember Wang Xiaobo also said something."},{"id":"276","start":2180.25,"end":2195.27,"displayStart":2180.25,"displayEnd":2195.27,"displayMid":2187.76,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.4,"loudness":0.906214,"pitch":22.897015,"speechRate":4.342,"hasEvents":false,"sentence_source":"说的我们这一代人跟上一代跟下一代，最大的不同就是我们曾经经历过绝望，就是你们都没有，后来这个社会就发展得很正常了，老一辈人他们在那闹革命啊。","sentence_en":"He said the biggest difference between our generation and the previous and next ones is that we have experienced despair – something you all haven't. Later, society developed normally. The older generation was busy with revolutions."},{"id":"277","start":2195.27,"end":2206.11,"displayStart":2195.27,"displayEnd":2206.11,"displayMid":2200.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.5,"loudness":0.858598,"pitch":23.938486,"speechRate":4.428,"hasEvents":false,"sentence_source":"一会解放全中国啊，他们也没有这种困境，而我们这一辈人如果你想象一下，当时就在农村一辈子就那么过下去的话。","sentence_en":"Liberating all of China – they didn't face this predicament. But if you imagine our generation stuck in the countryside forever like that –"},{"id":"278","start":2206.11,"end":2221.27,"displayStart":2206.11,"displayEnd":2221.27,"displayMid":2213.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":0.890692,"pitch":22.919214,"speechRate":4.222,"hasEvents":false,"sentence_source":"那是很绝望的，就好在后来没多久就开始上大学了 恢复大学了，等于从66年开始停课大学取消以后，到73年的时候就恢复了，大家就又又不那么绝望了。","sentence_en":"That would have been very despairing. Fortunately, not long after, universities reopened. From 1966 when classes stopped and universities were cancelled, by 1973 they resumed. Then people weren't so desperate anymore."},{"id":"279","start":2221.27,"end":2225.11,"displayStart":2221.27,"displayEnd":2225.11,"displayMid":2223.19,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.814696,"pitch":25.431919,"speechRate":4.167,"hasEvents":false,"sentence_source":"后来我不是也切上了共同兵大学了吗。","sentence_en":"Later, I also got into that joint military-civilian university, didn't I?"},{"id":"280","start":2225.67,"end":2238.53,"displayStart":2225.67,"displayEnd":2238.53,"displayMid":2232.1000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.7,"loudness":1.120639,"pitch":24.710819,"speechRate":5.008,"hasEvents":false,"sentence_source":"但您看哈 如果从后来您的各种介绍，就银河的人生从74年上大学开始，感觉是开了挂了，就我们现在人话说叫开了挂了，就开始一往无前 然后所有的履历。","sentence_en":"But you see, from your later accounts, your life since starting university in 1974 seems like it was on a roll—as we say nowadays—unstoppable, and then all your achievements."},{"id":"281","start":2238.53,"end":2250.15,"displayStart":2238.53,"displayEnd":2250.15,"displayMid":2244.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":1.021126,"pitch":25.046932,"speechRate":4.905,"hasEvents":false,"sentence_source":"让如今的年轻人看 就会觉得 哇 很羡慕，你看山西大学读历史 然后之后什么《光明日报》 《国务院》，现在小孩看是需要考功 都需要一路考过来的。","sentence_en":"When young people see it, they'd be envious: studying history at Shanxi University, then roles at Guangming Daily and the State Council. Nowadays, kids see that it requires passing exams all along the way."},{"id":"282","start":2250.15,"end":2254.45,"displayStart":2250.15,"displayEnd":2254.45,"displayMid":2252.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":1.063307,"pitch":25.010828,"speechRate":6,"hasEvents":false,"sentence_source":"您自己觉得是从74年开始 您的人生就走上了康庄大的。","sentence_en":"Do you yourself feel that from 1974 onward, your life took a bright path?"},{"id":"283","start":2256.17,"end":2263.63,"displayStart":2256.17,"displayEnd":2263.63,"displayMid":2259.9,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.7,"loudness":0.945016,"pitch":20.570896,"speechRate":4.826,"hasEvents":false,"sentence_source":"我觉得74年的这个上大学是非常非常重要的 一个转折点，毕竟你可以成天读书了嘛。","sentence_en":"I think starting university in 1974 was a very important turning point—after all, I could read all day."},{"id":"284","start":2263.63,"end":2273.41,"displayStart":2263.63,"displayEnd":2273.41,"displayMid":2268.52,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.910175,"pitch":23.603523,"speechRate":4.397,"hasEvents":false,"sentence_source":"我觉得当时读书跟现在的孩子们可能不一样，就是又是人那种如今四刻，把所有的时间都分配的满满的。","sentence_en":"I think studying then was different from today's kids—there was that hunger for knowledge, and I filled every moment."},{"id":"285","start":2273.41,"end":2277.67,"displayStart":2273.41,"displayEnd":2277.67,"displayMid":2275.54,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.990039,"pitch":23.830179,"speechRate":3.521,"hasEvents":false,"sentence_source":"然后自学当时把所有的书单列下来。","sentence_en":"Then for self-study, I listed all the books."},{"id":"286","start":2277.67,"end":2285.59,"displayStart":2277.67,"displayEnd":2285.59,"displayMid":2281.63,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":0.891914,"pitch":24.899433,"speechRate":4.167,"hasEvents":false,"sentence_source":"然后自己去拼命地看，我记得当时在大学还谈恋爱来着，爱上一个人是我的初恋。","sentence_en":"Then I read them frantically. I remember I also had a romance in college—I fell in love, my first love."},{"id":"287","start":2285.59,"end":2300.07,"displayStart":2285.59,"displayEnd":2300.07,"displayMid":2292.83,"speaker":"Li Yinhe", 会学是取消了的。","sentence_en":"Because China was going to restore sociology—it had been abolished in 1953 during the departmental reorganization."},{"id":"302","start":2420.73,"end":2433.53,"displayStart":2420.73,"displayEnd":2433.53,"displayMid":2427.13,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.889388,"pitch":22.62142,"speechRate":4.247,"hasEvents":false,"sentence_source":"然后是从1979年中央决定恢复社会学，废校通 她等于是咱们中国社会学的第一把手，最重要的人 她就组织社会学的讲习班。","sentence_en":"Then in 1979, the central government decided to restore sociology. Fei Xiaotong—he was the leading figure in Chinese sociology, the most important—he organized sociology workshops."},{"id":"303","start":2433.53,"end":2443.33,"displayStart":2433.53,"displayEnd":2443.33,"displayMid":2438.4300000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.942716,"pitch":21.488342,"speechRate":3.776,"hasEvents":false,"sentence_source":"当时就是请了我后来的，匹斯堡大学社会学系的系主任和一个教授过来，就在讲习班讲习。","sentence_en":"They invited my future department chair from the University of Pittsburgh and a professor to conduct the workshop."},{"id":"304","start":2443.33,"end":2450.01,"displayStart":2443.33,"displayEnd":2450.01,"displayMid":2446.67,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.5,"loudness":0.933913,"pitch":22.265253,"speechRate":4.491,"hasEvents":false,"sentence_source":"那个班大概有个四五十人，后来大家都把这次夏季讲习班叫做黄埔一期。","sentence_en":"There were about 40-50 people in that class, and later everyone called this summer workshop 'Whampoa Phase One."},{"id":"305","start":2450.01,"end":2456.11,"displayStart":2450.01,"displayEnd":2456.11,"displayMid":2453.0600000000004,"speaker":"Li Yinhe"," stdoc in the humanities. Later, why did I transfer from Peking University to the Chinese Academy of Social Sciences?"},{"id":"342","start":2759.37,"end":2771.57,"displayStart":2759.37,"displayEnd":2771.57,"displayMid":2765.4700000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.4,"loudness":0.876515,"pitch":22.221748,"speechRate":4.59,"hasEvents":false,"sentence_source":"因为我不喜欢教书，教书这个东西好像我口才不太好，再一个呢 就是太重复了，你要是开一门课 你要是讲个三年，你不是都说一样的话呀。","sentence_en":"Because I didn't like teaching. I'm not a good speaker, and it's too repetitive. If you teach a course for three years, you're just saying the same thing."},{"id":"343","start":2771.57,"end":2786.53,"displayStart":2771.57,"displayEnd":2786.53,"displayMid":2779.05,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.7,"loudness":0.883826,"pitch":22.258478,"speechRate":4.087,"hasEvents":true,"sentence_source":"然后我不喜欢 我就调到社科院，调到社科院去搞研究了，在这之后就是整整二十年，在社科院待了二十年，后来我统计了一下，我出了好多的专注啊。","sentence_en":"I didn't like it, so I transferred to CASS to do research. Then I stayed at CASS for twenty years. Later I counted and I published many monographs."},{"id":"344","start":2787.11,"end":2794.17,"displayStart":2787.11,"displayEnd":2794.17,"displayMid":2790.6400000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.8,"loudness":0.984867,"pitch":25.740953,"speechRate":4.116,"hasEvents":true,"sentence_source":"因为正好这也是我喜欢做的嘛，一共搞了十八项研究 写了十八本专注。","sentence_en":"Because this is what I like. I completed 18 research projects and wrote 18 monographs."},{"id":"345","start":2794.17,"end":2805.55,"displayStart":2794.17,"displayEnd":2805.55,"displayMid":2799.86,"speaker":"Li Yinhe","spea ociety."},{"id":"349","start":2824.79,"end":2827.43,"displayStart":2824.79,"displayEnd":2827.43,"displayMid":2826.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":1.292157,"pitch":23.911282,"speechRate":5.83,"hasEvents":false,"sentence_source":"那现在看来这些都是您的初衷。","sentence_en":"Now it seems those were your original intentions."},{"id":"350","start":2827.91,"end":2843.09,"displayStart":2827.91,"displayEnd":2843.09,"displayMid":2835.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.940366,"pitch":23.605001,"speechRate":4.234,"hasEvents":false,"sentence_source":"可以这么说 就是说这个好奇心，我是从福科那儿学来的 你看福科那么大的学问家，好多人都是觉得他和马克思齐名的，如果你要说19世纪 那就是马克思。","sentence_en":"You could say that. Curiosity—I learned that from Foucault. He's such a great scholar, many consider him on par with Marx. If you talk about the 19th century, it's Marx."},{"id":"351","start":2843.09,"end":2847.49,"displayStart":2843.09,"displayEnd":2847.49,"displayMid":2845.29,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.87267,"pitch":22.104694,"speechRate":4.545,"hasEvents":false,"sentence_source":"你要说20世纪就是福科，他的学问做得太棒了。","sentence_en":"For the 20th century, it's Foucault. His scholarship is outstanding."},{"id":"352","start":2847.49,"end":2855.09,"displayStart":2847.49,"displayEnd":2855.09,"displayMid":2851.29,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.803946,"pitch":24.463472,"speechRate":4.868,"hasEvents":false,"sentence_source":"然后呢 记者问她那你研究的动力是什么呢，她说就是好奇心 她首先提出来的就是好奇心。","sentence_en":"Then a reporter asked her what drives her research. She said it's curiosity. She mentioned curiosity first."},{"id":"353","start":2855.09,"end":2870.29,"displayStart":2855.09,"displayEnd":2870.29,"displayMid":2862.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.6,"loudness":0.969326,"pitch":23.892445,"speechRate":4.329,"hasEvents":false,"sentence_source":"所以我就觉得这个是特别特别有意思的事情，她为什么去分那么多中古时代的各种档案啊什么的，她研究那些就是好奇心嘛，她想知道那个时候是什么样的。","sentence_en":"So I find this very interesting. Why did she go through so many medieval archives? It's curiosity. She wanted to know what that time was like."},{"id":"354","start":2870.29,"end":2873.57,"displayStart":2870.29,"displayEnd":2873.57,"displayMid":2871.9300000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.5,"loudness":0.95179,"pitch":22.818686,"speechRate":5.624,"hasEvents":false,"sentence_source":"我觉得在我的研究里头也是好奇心啊。","sentence_en":"I think in my research, it's also curiosity."},{"id":"355","start":2873.57,"end":2887.43,"displayStart":2873.57,"displayEnd":2887.43,"displayMid":2880.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.950941,"pitch":22.807301,"speechRate":4.524,"hasEvents":false,"sentence_source":"我觉得也是成为我的一个研究的动力，就想了解事情到底是什么样的 为什么会这样，还有就是对社会学本身的兴趣，这个社会学它也确实是我的兴趣。","sentence_en":"It's also a driving force for my research. I want to understand what things really are and why they are that way, plus my interest in sociology itself. Sociology is truly my interest."},{"id":"356","start":2887.43,"end":2891.27,"displayStart":2887.43,"displayEnd":2891.27,"displayMid":2889.35,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.971912,"pitch":23.705093,"speechRate":4.427,"hasEvents":false,"sentence_source":"我前面也讲了就是我怎么样去兴趣伯伯。","sentence_en":"I mentioned earlier how I became so interested."},{"id":"357","start":2891.27,"end":2904.77,"displayStart":2891.27,"displayEnd":2904.77,"displayMid":2898.02,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.997055,"pitch":26.829149,"speechRate":3.704,"hasEvents":false,"sentence_source":"对这个事有点越越欲视的那种感觉，这里面也有一些原因为什么形成这种兴趣，就是当时上大学的时候已经22岁了吧。","sentence_en":"I have a kind of eager feeling about this. There are some reasons why this interest formed—I was already 22 when I started college."},{"id":"358","start":2904.77,"end":2909.45,"displayStart":2904.77,"displayEnd":2909.45,"displayMid":2907.1099999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.3,"loudness":0.786444,"pitch":24.541424,"speechRate":4.06,"hasEvents":false,"sentence_source":"也不是在那儿农村待了五年嘛 都是体力劳动。","sentence_en":"And I had spent five years in the countryside doing manual labor."},{"id":"359","start":2909.45,"end":2919.69,"displayStart":2909.45,"displayEnd":2919.69,"displayMid":2914.5699999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.843356,"pitch":23.836252,"speechRate":4.297,"hasEvents":false,"sentence_source":"然后那时候学理工就晚了 就是我并不是说我原来就很不喜欢理工，我才过来 学理工的你必须得从特别小。","sentence_en":"By then it was too late to study science and engineering. It's not that I disliked it before, but you have to start very young."},{"id":"360","start":2919.69,"end":2926.67,"displayStart":2919.69,"displayEnd":2926.67,"displayMid":2923.1800000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.3,"loudness":0.912106,"pitch":28.240763,"speechRate":4.298,"hasEvents":false,"sentence_source":"你像我们那个初一上完了就停课了以后 但我连物理和化学我都没学过。","sentence_en":"For instance, after finishing first year of junior high, classes stopped. I never even studied physics or chemistry."},{"id":"361","start":2926.67,"end":2939.57,"displayStart":2926.67,"displayEnd":2939.57,"displayMid":2933.12,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.872454,"pitch":25.33868,"speechRate":4.314,"hasEvents":false,"sentence_source":"所以我觉得学理工是晚了 真是一个原因，再一个呢 为什么喜欢说过去，我的朋友圈当时大家全世界的青少年，他们最关心的都是恋爱。","sentence_en":"So I think it was indeed too late for science. Another reason I like talking about the past: in my circle of friends, teenagers worldwide were most concerned about romance."},{"id":"362","start":2939.57,"end":2946.43,"displayStart":2939.57,"displayEnd":2946.43,"displayMid":2943,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.5,"loudness":0.870847,"pitch":22.722572,"speechRate":4.641,"hasEvents":false,"sentence_source":"可是我们这一代青年在关心的什么，我就是一直特别喜欢的和佩服的一个。","sentence_en":"But what did our generation care about? There's someone I've always really liked and admired."},{"id":"363","start":2946.43,"end":2960.67,"displayStart":2946.43,"displayEnd":2960.67,"displayMid":2953.55,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.6,"loudness":0.81614,"pitch":22.65719,"s s succeed and others fail."},{"id":"367","start":2994.15,"end":2997.33,"displayStart":2994.15,"displayEnd":2997.33,"displayMid":2995.74,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.783162,"pitch":23.561129,"speechRate":5.181,"hasEvents":false,"sentence_source":"这都是我们年轻时候最关注的问题。","sentence_en":"These were the issues we cared about most when we were young."},{"id":"368","start":2997.33,"end":3013.01,"displayStart":2997.33,"displayEnd":3013.01,"displayMid":3005.17,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.839622,"pitch":23.258371,"speechRate":4.215,"hasEvents":false,"sentence_source":"所以比较喜欢这个社会学，这是第二个原因，另外当然还有就是，研究的动力在于改变社会的愿望了，帮助他们发声啊，改变了一些他们的生存处境啊，什么之类的。","sentence_en":"So I developed a preference for sociology—that's the second reason. Also, the motivation for research comes from a desire to change society, to give them a voice, to improve their living conditions, and so on."},{"id":"369","start":3013.01,"end":3029.07,"displayStart":3013.01,"displayEnd":3029.07,"displayMid":3021.04,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.827793,"pitch":21.692585,"speechRate":4.629,"hasEvents":true,"sentence_source":"而且呢 你比如我在美国学习的时候，你可以看到这个研究化的专注，就是在图书馆上好几个书架，在中国一本都没有，我要是做了的话 我马上就填空白，你说这是不是给我一个特。","sentence_en":"Moreover, when I was studying in the US, I could see the focus on research. There were several bookshelves full of books on a topic, but not a single one in China. If I did it, I would fill the gap immediately. Isn't that a special opportunity?"},{"id":"370","start":3029.07,"end":3030.41,"displayStart":3029.07,"displayEnd":3030.41,"disp 0.5,"loudness":0.959434,"pitch":22.508457,"speechRate":5.136,"hasEvents":false,"sentence_source":"呀 而且您看您一直就是追寻的社会学家三个原则嘛 我记得是追求真相 独立思考。","sentence_en":"And you've always adhered to the three principles of sociologists: pursuit of truth, independent thinking."},{"id":"378","start":3087.29,"end":3097.15,"displayStart":3087.29,"displayEnd":3097.15,"displayMid":3092.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.6,"loudness":1.042951,"pitch":23.411848,"speechRate":4.881,"hasEvents":false,"sentence_source":"还有一个是不要轻易的下道德层面的判断 就您一直是见醒着这些原则 在我看来 贯穿您的生活 贯穿您的研究。","sentence_en":"And the third is not to make moral judgments lightly. You've been mindful of these principles throughout your life and research."},{"id":"379","start":3097.15,"end":3112.37,"displayStart":3097.15,"displayEnd":3112.37,"displayMid":3104.76,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.6,"loudness":0.86972,"pitch":23.755537,"speechRate":3.614,"hasEvents":false,"sentence_source":"对 这个三原则 我觉得我是非常看重的，就是你整个在这个研究的过程中，首先 你就是要追求真相，福克在说好奇心的时候 不也是说吗。","sentence_en":"Yes, I value these three principles highly. Throughout the research process, first you pursue the truth. As Fukuyama said about curiosity, isn't it about wanting to see the truth?"},{"id":"380","start":3112.37,"end":3116.07,"displayStart":3112.37,"displayEnd":3116.07,"displayMid":3114.2200000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.960268,"pitch":23.803627,"speechRate":4.83,"hasEvents":false,"sentence_source":"就是想看看这个事情的真相到底是什么。","sentence_en":"It's just wanting to see what the truth really is."},{"id":"381","start":3116.07,"end":3131.47,"displayStart":3116.07,"displayEnd":3131.47,"displayMid":3123.77,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.952096,"pitch":24.052671,"speechRate":3.447,"hasEvents":false,"sentence_source":"那么你就是通过做实地的调查 访谈 问卷 定性的调查，深谈 个人生活史 这些东西都是在追求真相，实际上这个社会学在做什么呢。","sentence_en":"So you do fieldwork, interviews, surveys, qualitative research, in-depth conversations, personal life histories—all to pursue the truth. What is sociology actually doing?"},{"id":"382","start":3131.47,"end":3135.47,"displayStart":3131.47,"displayEnd":3135.47,"displayMid":3133.47,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":1.080287,"pitch":23.986769,"speechRate":5.607,"hasEvents":false,"sentence_source":"就是两件事 一个是研究是什么 一个是研究为什么。","sentence_en":"It's two things: one is studying 'what,' and the other is studying 'why."},{"id":"383","start":3135.47,"end":3146.79,"displayStart":3135.47,"displayEnd":3146.79,"displayMid":3141.13,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.833188,"pitch":22.192265,"speechRate":3.71,"hasEvents":false,"sentence_source":"所以我觉得这个就是我的研究的一个基本的想法，就是你找到这么一个题目以后 你要研究它的状态。","sentence_en":"So I think this is the basic idea of my research: once you find a topic, you need to study its state."},{"id":"384","start":3146.79,"end":3153.37,"displayStart":3146.79,"displayEnd":3153.37,"displayMid":3150.08,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.848555,"pitch":19.972429,"speechRate":4.711,"hasEvents":false,"sentence_source":"它究竟是什么 你比如说这个少数群体它的生存状态是什么，为什么会这样?","sentence_en":"What exactly is it? For example, what is the living condition of this minority group, and why is it like that?"},{"id":"385","start":3153.79,"end":3169.35,"displayStart":3153.79,"displayEnd":3169.35,"displayMid":3161.5699999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.5,"loudness":0.890007,"pitch":23.900488,"speechRate":3.871,"hasEvents":true,"sentence_source":"这就是我们要追求真相这个原则，另外一个独立思考 我觉得就是说，她要敢于质疑传统的观念 要质疑标准答案，不是说每个事情都有标准答案的。","sentence_en":"This is the principle of pursuing truth. Another is independent thinking: she must dare to question traditional ideas and standard answers. Not everything has a standard answer."},{"id":"386","start":3169.35,"end":3178.03,"displayStart":3169.35,"displayEnd":3178.03,"displayMid":3173.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.884558,"pitch":22.633505,"speechRate":4.318,"hasEvents":true,"sentence_source":"所有的研究都要经过自己的独立思考，另外不要轻易地对你的调查对象做道德评判。","sentence_en":"All research requires independent thinking. Also, don't easily make moral judgments about your research subjects."},{"id":"387","start":3178.03,"end":3189.29,"displayStart":3178.03,"displayEnd":3189.29,"displayMid":3183.66,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.934292,"pitch":24.549662,"speechRate":4.44,"hasEvents":false,"sentence_source":"因为道德评判这个事儿 是牧师的事儿，牧师会告诉你 这样做是坏的 这样做是好的，这是他们的事儿 那我们搞社会研究的。","sentence_en":"Because moral judgment is the job of priests. Priests tell you this is bad, that is good. That's their job. We do social research."},{"id":"388","start":3189.29,"end":3193.17,"displayStart":3189.29,"disp
