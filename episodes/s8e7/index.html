    <script type="application/json" id="episode-data">{"episode":{"id":"S8E7","label":"S8E7","title":"S8E7 Lu Yu in Conversation with Li Yinhe | From 'San Fan' to 'Galaxy', she stepped out of her era.","intro":"Li Yinhe, sociologist; Chen Luyu, media personality, host.\n\nIn the seventh episode of the eighth season of 'Flowers in the Rocks', Luyu and Li Yinhe, in the context of the 'New Era', look back at how an individual was repeatedly pushed around by the times and how she gradually stood firm. In her childhood, she was called 'San Fan'—a genderless, impersonal name, like a stamp of the era, embedding the individual directly into the collective narrative. Her junior high school education was interrupted, and she followed the wave of educated youth into the Inner Mongolia Production and Construction Corps, then moved to a village in Shanxi. Amid the long and repetitive labor, she began to realize that the existing value system was failing, and answers no longer came from any authority. As a pioneer of feminism in China, her gender awareness did not come from theory but from her family. When her mother talked about love, she neither complained nor felt sorry for herself. Facing her partner's emotional fluctuations, she described her state as merely 'a morning walk'. In such an atmosphere, she naturally accepted gender equality: children could take the mother's surname, women did not need to be recorded in the family genealogy, and she maintained independence in both economy and emotions. After universities resumed enrollment, she was like a fully wound clock, filling her time tightly with reading and free thinking. In 1979, Fei Xiaotong hosted a sociology seminar, and she first truly encountered the study of 'how people live'. She designed her own questionnaires, used her work unit's introduction letter to conduct community surveys, and was the first to taste the joy of fieldwork. At that moment, she saw clearly the career she would devote her life to. She pursued love and beauty throughout her life. She met Wang Xiaobo through 'The Green Mermaid', and they confirmed each other through literature and thought. Their relationship has been repeatedly written about, but it was always built on equality and appreciation. Twenty-eight years later, she still reminds him in her dreams to take care of his heart—a relationship that needs no farewell. She says that life, on a cosmic scale, is as brief as a mayfly and has no macro meaning; but on a micro level, people can set their own standards: physical comfort and spiritual pleasure. If one can also gain love and beauty in the process, that is enough.","duration":5078,"displayDuration":5078,"audioSrc":"s8e7.m4a","guest":"Li Yinhe","host":"Lu Yu","releaseDate":"2025.12.31"},"topicDefinitions":{"0":{"label":"C0","name":"Episode Summary","color":"#FFFFFF","opacity":0.2,"firstCategory":"Episode Summary","secondCategory":"Episode Summary","keyWords":["Episode Summary","Opening","Introduction"]},"1":{"label":"C1","name":"Writing, literature, and works","color":"#B9B4B6","opacity":0.2,"firstCategory":"Writing, literature, and works","secondCategory":"Writing, literature, and works","keyWords":["Episode Summary","Opening","Introduction"]},"2":{"label":"C2","name":"Family and childhood memories","color":"#CB7281","opacity":0.2,"firstCategory":"Family and childhood memories","secondCategory":"Family and Childhood Memories","keyWords":["Not at all","Vague","His father","Remembers quite clearly","Seeing some people"]},"3":{"label":"C3","name":"Female Growth and Sociological Research","color":"#DFA870","opacity":0.2,"firstCategory":"Female Growth and Sociological Research","secondCategory":"Female Growth and Sociological Research","keyWords":["Dialogue","Express","Among Them","Father's Experience","Father Tells"]},"4":{"label":"C4","name":"History, Era, and Culture","color":"#000000","opacity":0.2,"firstCategory":"History, Era, and Culture","secondCategory":"History, Era, and Culture","keyWords":["world","Meaning","Women","Life","Freedom"]},"5":{"label":"C5","name":"Family Values and Female Roles","color":"#387C7D","opacity":0.2,"firstCategory":"Family Values and Female Roles","secondCategory":"Family Values and Female Roles","keyWords":["Marriage","Parents","Women","Two Older Sisters","Family Environment"]},"6":{"label":"C6","name":"Intimate Relationships and Career Development","color":"#7CFDFF","opacity":0.2,"firstCategory":"Intimate Relationships and Career Development","secondCategory":"Intimate Relationships and Career Development","keyWords":["Self-Confidence","Self-Confidence","Role Models for Women","Feelings","Friends"]},"7":{"label":"C7","name":"Sociological Research and Independent Thinking","color":"#995A91","opacity":0.2,"firstCategory":"Sociological Research and Independent Thinking","secondCategory":"Sociological Research and Independent Thinking","keyWords":["Curiosity","Sociology","Moral Judgment","Motivation for Research","Easily"]}},"sentences":[{"id":"1","start":3.82,"end":7.88,"displayStart":3.82,"displayEnd":7.88,"displayMid":5.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":1.147366,"pitch":16.977728,"speechRate":3.448,"hasEvents":false,"sentence_source":"我们谈论艺术，借由对话走近自己。","sentence_en":"We talk about art, getting closer to ourselves through dialogue."},{"id":"2","start":8.28,"end":13.72,"displayStart":8.28,"displayEnd":13.72,"displayMid":11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.080013,"pitch":18.843531,"speechRate":4.428,"hasEvents":false,"sentence_source":"我们也谈论女性，让她们的声音和光亮穿越眉戒，抵达心灵。","sentence_en":"We also talk about women, letting their voices and light cross boundaries and reach the heart."},{"id":"3","start":14.1,"end":17.28,"displayStart":14.1,"displayEnd":17.28,"displayMid":15.690000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.096288,"pitch":15.370148,"speechRate":2.536,"hasEvents":true,"sentence_source":"欢迎收听《岩中花述》。","sentence_en":"Welcome to 'Yan Zhong Hua Shu'."},{"id":"4","start":18.69,"end":29.63,"displayStart":18.69,"displayEnd":29.63,"displayMid":24.16,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.04856,"pitch":23.412205,"speechRate":3.942,"hasEvents":true,"sentence_source":"人生和社会就像是一个大舞台，就是人们在这个舞台上的上演这种悲欢离合呀，生生死死的这些活距。","sentence_en":"Life and society are like a big stage, where people perform dramas of joys and sorrows, life and death."},{"id":"5","start":32.12,"end":35.62,"displayStart":32.12,"displayEnd":35.62,"displayMid":33.87,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.963149,"pitch":23.884741,"speechRate":4.695,"hasEvents":false,"sentence_source":"真正的改变需要好多好多人的力量。","sentence_en":"Real change requires the strength of many, many people."},{"id":"6","start":35.62,"end":50,"displayStart":35.62,"displayEnd":50,"displayMid":42.81,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Negative","score":-0.4,"loudness":0.957524,"pitch":22.572529,"speechRate":4.156,"hasEvents":false,"sentence_source":"有的时候是社会变迁，整个社会的人的生活方式全都变了，这里面有一群人的什么处境呢，才能稍稍的有所改变，个人我觉得真的没有什么力量。","sentence_en":"Sometimes it's social change; the entire lifestyle of society changes. Only then can the situation of a group of people slightly improve. Individually, I think we really have no power."},{"id":"7","start":50,"end":53.56,"displayStart":50,"displayEnd":53.56,"displayMid":51.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","cluste nt years."},{"id":"11","start":87.07,"end":90.87,"displayStart":87.07,"displayEnd":90.87,"displayMid":88.97,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":-0.1,"loudness":0.856781,"pitch":22.021988,"speechRate":3.226,"hasEvents":false,"sentence_source":"因为毕竟已经28年了吧哈。","sentence_en":"It's been 28 years, after all."},{"id":"12","start":93.4,"end":101.44,"displayStart":93.4,"displayEnd":101.44,"displayMid":97.42,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.188538,"pitch":22.926382,"speechRate":4.975,"hasEvents":false,"sentence_source":"佛大学有一个统计，就生命力第一旺盛的阶段，是60岁到70岁，第二望胜的是70岁到80岁。","sentence_en":"Harvard University has a statistic: the most vigorous stage of life is 60 to 70, followed by 70 to 80."},{"id":"13","start":101.44,"end":103.36,"displayStart":101.44,"displayEnd":103.36,"displayMid":102.4,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.240882,"pitch":21.336443,"speechRate":2.618,"hasEvents":false,"sentence_source":"然后第三是。","sentence_en":"And third is..."},{"id":"14","start":103.36,"end":106.76,"displayStart":103.36,"displayEnd":106.76,"displayMid":105.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.275392,"pitch":22.129873,"speechRate":5,"hasEvents":false,"sentence_source":"50岁到60岁，这对我来说是天大喜讯。","sentence_en":"50 to 60. That's great news for me."},{"id":"15","start":106.76,"end":115.08,"displayStart":106.76,"displayEnd":115.08,"displayMid":110.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.7,"loudness":1.202157,"pitch":24.249624, out."},{"id":"24","start":164.97,"end":175.27,"displayStart":164.97,"displayEnd":175.27,"displayMid":170.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.881229,"pitch":24.397123,"speechRate":4.976,"hasEvents":false,"sentence_source":"那段故事甚至已经超越了本身成为我们的文学和我们公众记忆的一部分，非常的美好 其实我之前采访过一次李银河老师。","sentence_en":"That story has even transcended itself to become part of our literature and public memory. It's very beautiful. Actually, I interviewed Professor Li Yinhe once before."},{"id":"25","start":175.27,"end":186.97,"displayStart":175.27,"displayEnd":186.97,"displayMid":181.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0.1,"loudness":0.969465,"pitch":22.846571,"speechRate":5.365,"hasEvents":false,"sentence_source":"那是很多年前 当时李老师还住在北京一个有八十年代风格的公寓里面，之后我也参与过一次王小波先生的纪念活动 那当时李银河老师也是嘉宾。","sentence_en":"That was many years ago, when Professor Li still lived in an apartment in Beijing with an 80s style. Later, I also participated in a memorial event for Wang Xiaobo, and Professor Li Yinhe was also a guest."},{"id":"26","start":186.97,"end":195.95,"displayStart":186.97,"displayEnd":195.95,"displayMid":191.45999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.6,"loudness":1.00279,"pitch":23.937767,"speechRate":4.677,"hasEvents":false,"sentence_source":"但我总有一种感觉 这是我跟李银河老师在完全新的状态当中，甚至是在一个新的时代下的一场对话。","sentence_en":"But I always feel that this is a conversation between me and Professor Li Yinhe in a completely new state, even in a new era."},{"id":"27","start":195.95,"end":202.53,"displayStart":195.95,"displayEnd":202.53,"displayMid":199.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.946269,"pitch":22.385387,"speechRate":5.471,"hasEvents":false,"sentence_source":"所以今天非常高兴能够再次请到老师，首先呢 要请老师跟大家打个招呼。","sentence_en":"So I'm very happy to have the professor with us again today. First, I'd like to ask you to say hello to everyone."},{"id":"28","start":202.53,"end":202.85,"displayStart":202.53,"displayEnd":202.85,"displayMid":202.69,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.4,"loudness":1.692163,"pitch":28.211069,"speechRate":15.625,"hasEvents":false,"sentence_source":"银河 大家好。","sentence_en":"Yinhe: Hello everyone."},{"id":"29","start":202.85,"end":210.75,"displayStart":202.85,"displayEnd":210.75,"displayMid":206.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.979279,"pitch":24.133465,"speechRate":5.148,"hasEvents":false,"sentence_source":"我是，听到了老师的声音非常非常的高兴，您的声音这么多年一直都没有变李老师。","sentence_en":"I'm... hearing your voice makes me very, very happy. Your voice hasn't changed at all over the years, Professor Li."},{"id":"30","start":210.75,"end":217.11,"displayStart":210.75,"displayEnd":217.11,"displayMid":213.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0.2,"loudness":1.081573,"pitch":26.311544,"speechRate":6.031,"hasEvents":false,"sentence_source":"我觉得声音特别能够表达一个人的状态，您能够简单介绍一下您最近的一种生活状态吗。","sentence_en":"I think voice can really express a person's state. Could you briefly introduce how you've been living recently?"},{"id":"31","start":217.11,"end":222.07,"displayStart":217.11,"displayEnd":222.07,"displayMid":219.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":" :23.321991,"speechRate":4.792,"hasEvents":false,"sentence_source":"其实这句话我以前看到过，但我发现人到一定年龄的时候，他才能够完成那个质本，您说人到了四十岁，他就踏上了一条，像是通往终点的一个直通车，我是最近又看到这句话。","sentence_en":"Actually, I've seen this sentence before, but I found that only when people reach a certain age can they complete that essence. You said that when a person reaches forty, they step onto a direct train to the end. I recently saw this sentence again."},{"id":"53","start":337.59000000000003,"end":346.63,"displayStart":337.59000000000003,"displayEnd":346.63,"displayMid":342.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.4,"loudness":0.865737,"pitch":22.488142,"speechRate":5.269,"hasEvents":false,"sentence_source":"我突然一下觉得 内心有一个地方被戳中了，我再想的确 好像我也已经踏上了通往终点的直通车，就是很有感慨。","sentence_en":"I felt something strike a chord inside me. I thought, yes, I've already boarded the express train to the end. It really got to me."},{"id":"54","start":346.63,"end":356.97,"displayStart":346.63,"displayEnd":356.97,"displayMid":351.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":1.011499,"pitch":24.646734,"speechRate":5.969,"hasEvents":false,"sentence_source":"那我不知道您现在会回忆以前的岁月吗，比如说小的时候的岁月，在这个阶段您是会经常想起，还是会因为过往有一些遥远了，反而好像记忆模糊了。","sentence_en":"Do you ever look back on the past, like your childhood? Do you often think about it, or does it seem so far away that your memories are blurry?"},{"id":"55","start":357.55,"end":359.57,"displayStart":357.55,"displayEnd":359.57,"displayMid":358.56,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":1.068078,"pitch":30.020323,"speechRate":5.656,"hasEvents":true,"sentence_source":"反正我这个人记事比较晚。","sentence_en":"Well, my memory starts pretty late."},{"id" n? Kids today wouldn't know what 'Sanfan' means. I've vaguely heard of terms like 'Sanfan Wufan'."},{"id":"60","start":393.73,"end":401.47,"displayStart":393.73,"displayEnd":401.47,"displayMid":397.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0.2,"loudness":1.043447,"pitch":23.789118,"speechRate":5.738,"hasEvents":true,"sentence_source":"那我总觉得她的有意思在于是那个时代的一个写照，这是不是很像我们现代的一个人起名叫反腐。","sentence_en":"I think its beauty lies in being a snapshot of that era. Isn't it like someone today being named 'Anti-Corruption'?"},{"id":"61","start":402.87,"end":404.65,"displayStart":402.87,"displayEnd":404.65,"displayMid":403.76,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.3,"loudness":0.663218,"pitch":24.282545,"speechRate":2.817,"hasEvents":true,"sentence_source":"对对对有这。","sentence_en":"Exactly, that's right."},{"id":"62","start":404.65,"end":405.65,"displayStart":404.65,"displayEnd":405.65,"displayMid":405.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.888376,"pitch":27.246128,"speechRate":3,"hasEvents":false,"sentence_source":"意思 是。","sentence_en":"Exactly."},{"id":"63","start":405.65,"end":408.67,"displayStart":405.65,"displayEnd":408.67,"displayMid":407.15999999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":1.108115,"pitch":29.237331,"speechRate":4.636,"hasEvents":false,"sentence_source":"就是实际上是当时的一个运动嘛。","sentence_en":"It was actually a movement back then."},{"id":"64","start":408.67,"end":415.13,"displayStart":408.67,"displayEnd":415.13,"displayMid":411.9,"speaker" :437.45,"displayMid":433.94,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0.1,"loudness":0.989626,"pitch":19.986952,"speechRate":3.734,"hasEvents":false,"sentence_source":"对 她们可能没太考虑，一个小女孩叫三反 会不会将来很麻烦。","sentence_en":"Right, they probably didn't consider whether calling a little girl 'Sanfan' would cause trouble later."},{"id":"69","start":437.45,"end":451.47,"displayStart":437.45,"displayEnd":451.47,"displayMid":444.46000000000004,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0.1,"loudness":0.858021,"pitch":23.544207,"speechRate":4.269,"hasEvents":false,"sentence_source":"因为正好我不是出生1952吗，当时是三反运动 反贪污 反浪费 反对官僚主义，我记得我学的第一首儿歌就是，反贪污 反浪费 官僚主义 我反对。","sentence_en":"I was born in 1952, during the Three Antis campaign: anti-corruption, anti-waste, anti-bureaucracy. The first nursery rhyme I learned was 'Anti-corruption, anti-waste, anti-bureaucracy, I oppose them."},{"id":"70","start":451.47,"end":458.53,"displayStart":451.47,"displayEnd":458.53,"displayMid":455,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.968524,"pitch":24.541725,"speechRate":3.116,"hasEvents":false,"sentence_source":"这就是叫三反的原因，而且呢 我这个名字只叫到七岁。","sentence_en":"That's why I was called Sanfan, and I only went by that name until I was seven."},{"id":"71","start":458.53,"end":473.09,"displayStart":458.53,"displayEnd":473.09,"displayMid":465.80999999999995,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0.1,"loudness":0.879535,"pitch":21.642038,"speechRate":4.409,"hasEvents":false,"sentence_source":"然后上小学就改了 这个三反就成了小名了，结果呢 一上学我发现就我们那年级，有好几个叫三反的，我记得特庆州有一个叫蒋三反的，还有一个叫陈三反的。","sentence_en":"Then I changed it when I started elementary school, so Sanfan became my nickname. It turned out there were several kids named Sanfan in my grade—I remember one from Teqingzhou called Jiang Sanfan, and another called Chen Sanfan."},{"id":"72","start":473.09,"end":475.91,"displayStart":473.09,"displayEnd":475.91,"displayMid":474.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.759761,"pitch":22.469513,"speechRate":4.908,"hasEvents":false,"sentence_source":"然后这只是我的一个小名了。","sentence_en":"So it was just my nickname."},{"id":"73","start":475.91,"end":481.51,"displayStart":475.91,"displayEnd":481.51,"displayMid":478.71000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.919989,"pitch":22.041618,"speechRate":5.214,"hasEvents":false,"sentence_source":"那李银河的这个银河 是银河系的意思，还是她有什么其他的意思吗?","sentence_en":"Does Li Yinhe's 'Yinhe' mean the Milky Way, or does it have some other meaning?"},{"id":"74","start":481.51,"end":484.79,"displayStart":481.51,"displayEnd":484.79,"displayMid":483.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":1.515892,"pitch":29.311646,"speechRate":6.071,"hasEvents":false,"sentence_source":"她是表达了上一代人对您的什么样的希望?","sentence_en":"What kind of hope did the previous generation express for you through that name?"},{"id":"75","start":485.43,"end":489.15,"displayStart":485.43,"displayEnd":489.15,"displayMid":487.28999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0.1,"loudness":0.938972, cule,' I started dating Xiaobo."},{"id":"84","start":537.55,"end":551.33,"displayStart":537.55,"displayEnd":551.33,"displayMid":544.44,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.3,"loudness":0.9319,"pitch":24.421778,"speechRate":3.595,"hasEvents":false,"sentence_source":"然后小波为什么叫小波，就是当时他妈妈希望他爸爸的遭遇是一个小小的波兰，不要是什么惊涛害浪 所以他叫王小波。","sentence_en":"Why is he called Xiaobo? His mother hoped his father's ordeal would be a small ripple, not a stormy wave. So he was named Wang Xiaobo."},{"id":"85","start":551.33,"end":555.23,"displayStart":551.33,"displayEnd":555.23,"displayMid":553.28,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.97473,"pitch":23.440283,"speechRate":4.615,"hasEvents":false,"sentence_source":"然后他跟我谈恋爱以后 就知道我叫三反了。","sentence_en":"After we started dating, he found out I was called Sanfan."},{"id":"86","start":555.23,"end":560.85,"displayStart":555.23,"displayEnd":560.85,"displayMid":558.04,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.3,"loudness":0.786352,"pitch":15.698424,"speechRate":3.915,"hasEvents":true,"sentence_source":"然后小波一次就跟我说 哎呀 你的小名怎么这么难听。","sentence_en":"One time Xiaobo said to me, 'Your nickname is so ugly."},{"id":"87","start":562.13,"end":563.31,"displayStart":562.13,"displayEnd":563.31,"displayMid":562.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":1.433577,"pitch":31.398472,"speechRate":1.724,"hasEvents":true,"sentence_source":"李银。","sentence_en":"Li Yin."},{"id":"88","start":563.31,"end":568.93,"displayStart":563.31,"displayEnd":568 2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.6,"loudness":0.990033,"pitch":26.207357,"speechRate":6.28,"hasEvents":false,"sentence_source":"然后他也不是期待 完全没有灾难，他只是期待一个小小的波浪刚，才这个瞬间还是挺让我出动。","sentence_en":"And he wasn't hoping for no disaster at all, just a small ripple. That moment just now really touched me."},{"id":"92","start":614.81,"end":617.87,"displayStart":614.81,"displayEnd":617.87,"displayMid":616.3399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.4,"loudness":0.916939,"pitch":24.266634,"speechRate":7.216,"hasEvents":false,"sentence_source":"我觉得你们经历过那个年代是有太艰难的地方的。","sentence_en":"I think you people who lived through that era had it really hard."},{"id":"93","start":617.87,"end":623.13,"displayStart":617.87,"displayEnd":623.13,"displayMid":620.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":1.112282,"pitch":21.040621,"speechRate":7.122,"hasEvents":false,"sentence_source":"但是个小孩子那时候感受不到这种艰难，你叫三反的时候感受不到三反带给你的感受。","sentence_en":"But as a child, you don't feel that hardship. When you were called Sanfan, you didn't feel what it meant."},{"id":"94","start":623.13,"end":630.99,"displayStart":623.13,"displayEnd":630.99,"displayMid":627.06,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.880976,"pitch":24.90184,"speechRate":4.326,"hasEvents":false,"sentence_source":"对啊 我从来没觉得难听过，可是小婆连想到他们家的遭遇的话，就会觉得很难听了。","sentence_en":"Right, I never thought it sounded bad. But Xiaobo, thinking of his family's suffering, found it terrible."},{"id":"95","start":630.99,"end":635.49,"displayStart":630.99,"displayEnd":635.49,"displayMid":633.24,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.8,"loudness":0.839217,"pitch":23.099806,"speechRate":4.667,"hasEvents":false,"sentence_source":"嗯，然后我觉得你妈妈真的是一个非常超前的女性。","sentence_en":"Yeah, and I think your mother was a really forward-thinking woman."},{"id":"96","start":635.49,"end":645.49,"displayStart":635.49,"displayEnd":645.49,"displayMid":640.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":1.01808,"pitch":26.819866,"speechRate":5.796,"hasEvents":false,"sentence_source":"当然因为后来我们都知道您是跟着妈妈的性，就家里面有孩子跟妈妈性 有孩子跟爸爸性，我就在那个年代算是相当超前的一件事吧。","sentence_en":"Of course, because later we all knew that you took your mother's surname. In a family, some children take the mother's surname and some take the father's. That was quite ahead of its time for that era."},{"id":"97","start":645.49,"end":648.87,"displayStart":645.49,"displayEnd":648.87,"displayMid":647.1800000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.6,"loudness":0.854063,"pitch":13.945972,"speechRate":3.443,"hasEvents":false,"sentence_source":"对对对 是 这事是很超前的。","sentence_en":"Yes, yes, that was really ahead of its time."},{"id":"98","start":648.87,"end":657.15,"displayStart":648.87,"displayEnd":657.15,"displayMid":653.01,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.886088,"pitch":20.943439,"speechRate":4.288,"hasEvents":false,"sentence_source":"我们家四个孩子 两个姐姐一个哥哥，两个姐姐是随父姓的，我和哥哥是随母姓的。","sentence_en":"There are four children in my family: two older sisters, one older brother, and me. My two sisters took our father's surname, while my brother and I took our mother's surname."},{"id":"99","start":657.15,"end":668.71,"displayStart":657.15,"displayEnd":668.71,"displayMid":662.9300000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.3,"loudness":0.948366,"pitch":23.694342,"speechRate":4.618,"hasEvents":false,"sentence_source":"其实你说按照 比如父权制的那个排序，儿子是必须跟父姓姓的吧，哎 我哥哥就是姓的母亲姓，就是这个东西应当说是相当糟糕。","sentence_en":"Actually, according to the patriarchal order, sons should take the father's surname, right? But my brother took our mother's surname. That was really quite unusual."},{"id":"100","start":668.71,"end":681.13,"displayStart":668.71,"displayEnd":681.13,"displayMid":674.9200000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.7,"loudness":0.947695,"pitch":22.251989,"speechRate":3.704,"hasEvents":false,"sentence_source":"也就是因为爸爸妈妈都是那种男女平等的人呗，他们就是这观念，男权志的那个习俗对他们的影响是非常少的。","sentence_en":"It's because my parents were both believers in gender equality. That concept had very little influence from patriarchal customs on them."},{"id":"101","start":681.13,"end":691.45,"displayStart":681.13,"displayEnd":691.45,"displayMid":686.29,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.862949,"pitch":25.718027,"speechRate":4.619,"hasEvents":false,"sentence_source":"所以他们才不在意，反正这个冠明这个事儿 我觉得有意思在哪儿，就有一次我上这个马来西亚去 有一个学术交流。","sentence_en":"So they didn't care about it. Anyway, what I find interesting about this naming thing is that once I went to Malaysia for an academic exchange."},{"id":"102","start":691.45,"end":702.07,"displayStart":691.45,"displayEnd":702.07,"displayMid":696.76,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.949694,"pitch":25.218319,"speechRate":4.331,"hasEvents":false,"sentence_source":"当时正好不是怎么就说起冠性权这个事儿来了，就是说 到底应该姓爸爸姓还是姓妈妈姓是吧，我就讲了我自己。","sentence_en":"At that time, we just happened to talk about the right to surname—whether a child should take the father's or mother's surname—and I used myself as an example."},{"id":"103","start":702.07,"end":714.07,"displayStart":702.07,"displayEnd":714.07,"displayMid":708.07,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.911108,"pitch":24.658838,"speechRate":3.583,"hasEvents":false,"sentence_source":"其实整个你看全世界 欧美 一个女的 你要结婚的话 你要关夫姓的，在中国呢 这一点还真是跟他们不一样。","sentence_en":"Actually, look around the world: in Europe and America, when a woman gets married, she takes her husband's surname. In China, it's quite different."},{"id":"104","start":714.07,"end":727.75,"displayStart":714.07,"displayEnd":727.75,"displayMid":720.9100000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.743006,"pitch":22.387165,"speechRate":4.351,"hasEvents":false,"sentence_source":"以前你看香港有什么 陈芳安生什么之类的，她也是惯了夫姓的 那后来我们大陆改的就是，一个女的她结婚以后完全是保留自己的姓名的。","sentence_en":"In the past, in Hong Kong, you had names like 'Chan Fong On Sang', where the woman took her husband's surname. But later in mainland China, a woman keeps her own name after marriage."},{"id":"105","start":727.75,"end":734.85,"displayStart":727.75,"displayEnd":734.85,"displayMid":731.3,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.4,"loudness":0.734455,"pitch":23.701397,"speechRate":2.958,"hasEvents":false,"sentence_source":"这点比传统中国 比西欧 北美 南权的色彩更淡一些。","sentence_en":"This makes China less patriarchal than traditional China, Western Europe, and North America."},{"id":"106","start":734.85,"end":737.39,"displayStart":734.85,"displayEnd":737.39,"displayMid":736.12,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.514061,"pitch":21.220301,"speechRate":4.724,"hasEvents":false,"sentence_source":"我觉得挺有意思的这个事儿。","sentence_en":"I find this quite interesting."},{"id":"107","start":737.39,"end":750.15,"displayStart":737.39,"displayEnd":750.15,"displayMid":743.77,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.6,"loudness":0.966143,"pitch":27.16538,"speechRate":4.545,"hasEvents":false,"sentence_source":"然后我在那儿交流的时候，我就举了我自己的例子 底下的人就特别热烈讨论的，就说对呀他们原来没注意到，这个关心权这个问题是个问题。","sentence_en":"Then during the exchange, I gave my own example, and the audience started a heated discussion, saying, 'Yes, they hadn't realized that this issue of surname rights is indeed a problem."},{"id":"108","start":750.15,"end":765.63,"displayStart":750.15,"displayEnd":765.63,"displayMid":757.89,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.3,"loudness":0.920079,"pitch":23.437037,"speechRate":3.488,"hasEvents":false,"sentence_source":"而且这个事儿它特别的是一种标志性的改变，你比如说我们过去在南泉的这个习俗底下，女人的性命她是不入祠堂的，不上家谱的。","sentence_en":"Moreover, this is a symbolic change. For example, in the past under patriarchal customs, women's names were not allowed in ancestral halls or family genealogies."},{"id":"109","start":765.63,"end":777.79,"displayStart":765.63,"displayEnd":777.79,"displayMid":771.71,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.4,"loudness":0.909174,"pitch":23.167965,"speechRate":4.194,"hasEvents":false,"sentence_source":"就是你要去看南方有一些宗族比较讲究，比较传统比较深厚的地方，她是要去家谱，你在看那个家谱上全是男的，女的上不去。","sentence_en":"If you go to some places in southern China where clans are very traditional and deep-rooted, when you look at the genealogy, it's all men; women cannot be included."},{"id":"110","start":777.79,"end":793.61,"displayStart":777.79,"displayEnd":793.61,"displayMid":785.7,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.980773,"pitch":24.771387,"speechRate":4.189,"hasEvents":false,"sentence_source":"听说最近有的地方就是为一些特别有成就的女人破个例，就说 这女的大企业家呀 大科学家呀 什么就让她上个足补吧，就把她名字写进去 但是按照老规矩的话。","sentence_en":"I heard that recently, some places make exceptions for particularly accomplished women. For example, a female entrepreneur or scientist might be allowed to have her feet bound, and her name would be recorded. But according to tradition..."},{"id":"111","start":793.61,"end":798.51,"displayStart":793.61,"displayEnd":798.51,"displayMid":796.06,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.5,"loudness":0.839218,"pitch":24.332827,"speechRate":4.082,"hasEvents":false,"sentence_source":"女人的名字根本就不能进祠堂的 不能上家谱了。","sentence_en":"Women's names were simply not allowed in ancestral halls or on genealogies."},{"id":"112","start":798.95,"end":813.91,"displayStart":798.95,"displayEnd":813.91,"displayMid":806.4300000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.939928,"pitch":25.868593,"speechRate":4.547,"hasEvents":false,"sentence_source":"但是我觉得比较有意思的一个事儿就是，现在这个叙家谱的习俗已经退朝了，除了就是比如广东啊 江西啊 福建啊 什么，有些地方还有祠堂啊 这种文化还比较优远。","sentence_en":"But what I find interesting is that the custom of maintaining genealogies has now faded away, except in places like Guangdong, Jiangxi, Fujian, etc., where some areas still have ancestral halls and this culture is more enduring."},{"id":"113","start":813.91,"end":821.09,"displayStart":813.91,"displayEnd":821.09,"displayMid":817.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.953317,"pitch":23.911476,"speechRate":4.875,"hasEvents":false,"sentence_source":"NP比较深厚的那个地方，基本上大家都不管这档子事了，就是整个退出历史舞台了。","sentence_en":"In places where that culture was deeply rooted, basically no one cares about it anymore; it has completely exited the historical stage."},{"id":"114","start":821.09,"end":834.37,"displayStart":821.09,"displayEnd":834.37,"displayMid":827.73,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.4,"loudness":0.920196,"pitch":25.415867,"speechRate":4.142,"hasEvents":false,"sentence_source":"我觉得这就有点像伏地抽薪了，就是说你那儿还在那儿争，到底这女的能不能进足谱呢，她得到什么样的成就，才能进入南泉的足谱呢。","sentence_en":"I think this is like cutting off the fuel from under the cauldron. In other words, while people are still arguing about whether women can enter the genealogy and what achievements they need to be included in the patriarchal genealogy."},{"id":"115","start":834.37,"end":839.37,"displayStart":834.37,"displayEnd":839.37,"displayMid":836.87,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.768969,"pitch":24.71944,"speechRate":4.6,"hasEvents":false,"sentence_source":"然后呢 突然间大家都根本就不理足谱这个事了是不是。","sentence_en":"And then suddenly, everyone just stops caring about genealogies altogether."},{"id":"116","start":839.37,"end":849.51,"displayStart":839.37,"displayEnd":849.51,"displayMid":844.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.860374,"pitch":24.763859,"speechRate":5.424,"hasEvents":false,"sentence_source":"就伏地抽薪了嘛，您这么一说 我还记得我当时96年去香港工作，注意到刚刚您讲的 就香港很多这种女性，她名字前面灌了一个复兴。","sentence_en":"So it's like cutting off the fuel. When you mention that, I remember when I went to work in Hong Kong in 1996, I noticed what you just said—many women in Hong Kong had a husband's surname prefixed to their names."},{"id":"117","start":849.51,"end":861.35,"displayStart":849.51,"displayEnd":861.35,"displayMid":855.4300000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Negative","score":-0.3,"loudness":0.868273,"pitch":25.544922,"speechRate":5.152,"hasEvents":false,"sentence_source":"然后什么叶刘书怡 陈芳安生 我第一次听到，她对我震撼极大，第一 因为这样的名字的构成 她太心影了，她又不是复兴，你明白她是为什么这么构成的。","sentence_en":"And names like 'Yip Lau Shu-yi' and 'Chan Fong On Sang'—I heard them for the first time and was greatly shocked. First, because the composition of such names was very striking; it wasn't just adding a husband's surname, you understand why they were composed that way."},{"id":"118","start":861.35,"end":874.87,"displayStart":861.35,"displayEnd":874.87,"displayMid":868.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Negative","score":-0.4,"loudness":1.010231,"pitch":25.548241,"speechRate":4.586,"hasEvents":false,"sentence_source":"但是因为像我们70后这一代，就是生在红旗下 长在新社会，就你没有接受过这一切，她在我看是带有以前旧朝色彩的，又传统又一些旧，你会觉得天呐。","sentence_en":"But because our generation born in the 1970s grew up under the red flag and in the new society, we never experienced this. To me, such names carried a flavor of the old dynasty—traditional and somewhat outdated. You'd think, 'Oh my God."},{ tep towards gender equality."},{"id":"123","start":899.59,"end":904.05,"displayStart":899.59,"displayEnd":904.05,"displayMid":901.8199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.6,"loudness":1.118218,"pitch":25.267406,"speechRate":4.663,"hasEvents":true,"sentence_source":"那在我们看来就是不用关夫性这是一个进步。","sentence_en":"From our perspective, it's a progress regardless of gender."},{"id":"124","start":904.05,"end":908.57,"displayStart":904.05,"displayEnd":908.57,"displayMid":906.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.7,"loudness":1.137096,"pitch":24.897057,"speechRate":5.549,"hasEvents":false,"sentence_source":"那您家当年又更超前，就直接有两个孩子就跟妈妈姓了。","sentence_en":"Your family was even more ahead of its time, with two children taking their mother's surname."},{"id":"125","start":908.57,"end":922.29,"displayStart":908.57,"displayEnd":922.29,"displayMid":915.4300000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":1.002138,"pitch":25.748301,"speechRate":5.293,"hasEvents":false,"sentence_source":"那我觉得这样的家庭环境它一定是而如木然，就是在不知不觉当中对一个小孩的性格的养成，甚至他未来走什么样的路，可能就已经很早打下了一个你看不到的一个基础。","sentence_en":"I think such a family environment subtly shapes a child's personality and even their future path, laying an invisible foundation early on."},{"id":"126","start":922.29,"end":929.77,"displayStart":922.29,"displayEnd":929.77,"displayMid":926.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":1.101689,"pitch":24.920372,"speechRate":5.738,"hasEvents":false,"sentence_source":"您现在回想 这个家庭环境是不是影响了您，包括后来的一些性别意识啊 您做您所从事的这个专业。","sentence_en":"Looking back, do you think this family environment influenced you, including your later gender awareness and your chosen profession?"},{"id":"127","start":929.77,"end":944.79,"displayStart":929.77,"displayEnd":944.79,"displayMid":937.28,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.911884,"pitch":23.980774,"speechRate":3.733,"hasEvents":false,"sentence_source":"对 我觉得应当是有影响的，就是说 后来我喜欢研究这个社会变迁啊，习俗的变迁啊 社会上的各种问题啊 思潮啊，这些我觉得是有影响的。","sentence_en":"Yes, I think it did. Later, I enjoyed studying social changes, customs changes, various social issues, and trends—I believe all of that was influenced."},{"id":"128","start":944.79,"end":949.23,"displayStart":944.79,"displayEnd":949.23,"displayMid":947.01,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":1.064757,"pitch":26.80974,"speechRate":3.97,"hasEvents":false,"sentence_source":"另外你比如说 是不是因为爱而结婚啊。","sentence_en":"Another example: whether to marry for love."},{"id":"129","start":949.23,"end":954.87,"displayStart":949.23,"displayEnd":954.87,"displayMid":952.05,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.4,"loudness":0.95576,"pitch":23.910189,"speechRate":5.667,"hasEvents":false,"sentence_source":"我觉得这个对我的生活也是有影响的，就是从小就感觉到如果要是没有爱。","sentence_en":"I think this also affected my life—I felt from a young age that if there's no love,"},{"id":"130","start":954.87,"end":966.75,"displayStart":954.87,"displayEnd":966.75,"displayMid":960.81,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.848997,"pitch":21.018747,"speechRate":4.051,"hasEvents":fal layEnd":1042.29,"displayMid":1038.1999999999998,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.947623,"pitch":24.160084,"speechRate":4.277,"hasEvents":false,"sentence_source":"我记得当时也是有一些很偶然的机会，有的时候我不会去专门的问妈妈这些事。","sentence_en":"I remember there were some very casual opportunities. Sometimes I wouldn't deliberately ask my mother about these things."},{"id":"143","start":1042.29,"end":1054.01,"displayStart":1042.29,"displayEnd":1054.01,"displayMid":1048.15,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.939251,"pitch":23.577789,"speechRate":3.584,"hasEvents":false,"sentence_source":"但是有一次我跟她一块参加报社的一个上北戴河休假的一个活动，就是她坐在车前头 我坐在车后头。","sentence_en":"But once we were on a newspaper office trip to Beidaihe for vacation; she sat in the front of the car, and I sat in the back."},{"id":"144","start":1054.01,"end":1059.19,"displayStart":1054.01,"displayEnd":1059.19,"displayMid":1056.6,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":1.023724,"pitch":21.899717,"speechRate":4.132,"hasEvents":false,"sentence_source":"我妈妈是很活跃的人 在那儿前面是高弹扩论的。","sentence_en":"My mother was very outgoing; up there she was talking loudly and expansively."},{"id":"145","start":1059.19,"end":1063.27,"displayStart":1059.19,"displayEnd":1063.27,"displayMid":1061.23,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.72963,"pitch":22.387348,"speechRate":4.902,"hasEvents":false,"sentence_source":"因为周围都是她的同事嘛 我不是站在车后部吗。","sentence_en":"Since everyone around were her colleagues, and I was standing in the back of the car."},{"id":"146","start":1063.27,"end":1074.13,"displayStart":1063.27,"displayEnd":1074.13,"displayMid":1068.7,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.3,"loudness":0.766775,"pitch":17.977648,"speechRate":4.297,"hasEvents":false,"sentence_source":"然后有一个小伙子就说 哎 这女的吧，厉害啊 说的她老公可是狗花的啊，我当时因为她们不知道我是她的女儿啊。","sentence_en":"Then a young guy said, 'Hey, this woman is something. They say her husband is a dog flower.' I didn't know they didn't realize I was her daughter."},{"id":"147","start":1074.13,"end":1082.53,"displayStart":1074.13,"displayEnd":1082.53,"displayMid":1078.33,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.5,"loudness":0.900567,"pitch":21.932632,"speechRate":4.762,"hasEvents":false,"sentence_source":"所以就这么议论来着，后来我吓一跳啊 我才从这儿 我知道说，爸爸是这样的人啊 我一直不知道啊。","sentence_en":"So they were talking about it, and I was shocked. Only then did I realize, my father is that kind of person. I never knew."},{"id":"148","start":1082.53,"end":1084.81,"displayStart":1082.53,"displayEnd":1084.81,"displayMid":1083.67,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.850855,"pitch":25.456242,"speechRate":4.975,"hasEvents":false,"sentence_source":"然后后来我就问过妈妈。","sentence_en":"Then later I asked my mother."},{"id":"149","start":1084.81,"end":1086.51,"displayStart":1084.81,"displayEnd":1086.51,"displayMid":1085.6599999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.777709,"pitch":20.231661,"speechRate":6.116,"hasEvents":false,"sentence_source":"所以妈妈才说的那句话。","sentence_en":"That's why my mother said that."},{"id":"150","start":1086.51,"end":1101.77,"displayStart":1086.51,"displayEnd":1101.77,"displayMid":1094.1399999999999,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.02389,"pitch":20.99159,"speechRate":4.29,"hasEvents":false,"sentence_source":"其实爸爸他没有真的去搞什么，她就是喜欢有的时候把报社最漂亮的几个女记者，让他们在家里来喝喝茶呀 聊天啊什么之类的，好像可能有那么点暧昧吧。","sentence_en":"Actually, my dad didn't really do anything. He just liked to invite the prettiest female reporters from the newspaper office to his home for tea and chat sometimes. There might have been a bit of ambiguity."},{"id":"151","start":1101.77,"end":1110.19,"displayStart":1101.77,"displayEnd":1110.19,"displayMid":1105.98,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Positive","score":0.6,"loudness":0.78949,"pitch":20.146418,"speechRate":4.988,"hasEvents":false,"sentence_source":"我说你听到这些事儿 你知道这些事儿吗，你啥感觉呀，她说我就像在清晨散步的这种感觉 没什么感觉。","sentence_en":"I said, when you heard these things, did you know about them? How did you feel? She said it felt like taking a morning walk—nothing much."},{"id":"152","start":1110.19,"end":1124.95,"displayStart":1110.19,"displayEnd":1124.95,"displayMid":1117.5700000000002,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.845414,"pitch":21.782658,"speechRate":4.097,"hasEvents":false,"sentence_source":"我觉得这个里头有充分的自信，这个里头有她自己，她并不是说靠着这个男人，她有她自己的事业 有她自己的底气 对 她有这样的底气，她也不是。","sentence_en":"I think within that there's great confidence, her own self. She doesn't rely on that man; she has her own career, her own foundation. Yes, she has that foundation, and she's not—"},{"id":"153","start":1124.95,"end":1129.41,"displayStart":1124.95,"displayEnd":1129.41,"displayMid":1127.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Positive","score":0.7,"loudness":1.023649,"pitch":21.401495,"speechRate":4.724,"hasEvents":false,"sentence_source":"依赖她活着的，她还有一点 她在情感上也非常独立。","sentence_en":"dependent on him to live. Also, she's very emotionally independent."},{"id":"154","start":1129.41,"end":1142.41,"displayStart":1129.41,"displayEnd":1142.41,"displayMid":1135.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.022123,"pitch":23.64426,"speechRate":5.251,"hasEvents":false,"sentence_source":"因为您看 其实很多女性她也在事业上 经济上是独立的，但在情感上依然是非常的依赖，您妈妈这一点 我觉得身为女性真的挺酷的，我可以爱你 我也可以不爱你。","sentence_en":"You see, many women are financially and career-independent, but still emotionally very dependent. Your mother, on this point, I think as a woman, it's really cool: I can love you, or I can not love you."},{"id":"155","start":1142.41,"end":1144.51,"displayStart":1142.41,"displayEnd":1144.51,"displayMid":1143.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Positive","score":0.6,"loudness":0.977674,"pitch":20.832788,"speechRate":4.478,"hasEvents":false,"sentence_source":"对 她不是那么在意的。","sentence_en":"Yes, she wasn't that bothered."},{"id":"156","start":1144.51,"end":1152.91,"displayStart":1144.51,"displayEnd":1152.91,"displayMid":1148.71,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.7,"loudness":0.953104,"pitch":25.82074,"speechRate":5.135,"hasEvents":false,"sentence_source":"她不是那么像就是妇女那样，哎呀 你这个老公要是跑了就哭天抢地啊，痛不欲生啊 她绝对不会这样。","sentence_en":"She wasn't like some women who would wail and feel devastated if their husband ran off. She would never be like that."},{"id":"157","start":1152.91,"end":1156.17,"displayStart":1152.91,"displayEnd":1156.17,"displayMid":1154.54,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.884356,"pitch":20.679115,"speechRate":4.075,"hasEvents":false,"sentence_source":"所以她才有这句 清晨散步嘛。","sentence_en":"So that's why she said that about the morning walk."},{"id":"158","start":1156.17,"end":1160.39,"displayStart":1156.17,"displayEnd":1160.39,"displayMid":1158.2800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.887008,"pitch":25.299166,"speechRate":6.233,"hasEvents":false,"sentence_source":"那像您从性格上来说，您觉得您更像妈妈还是更像爸爸。","sentence_en":"So personality-wise, do you think you're more like your mother or your father?"},{"id":"159","start":1160.39,"end":1165.33,"displayStart":1160.39,"displayEnd":1165.33,"displayMid":1162.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":1.093828,"pitch":20.838558,"speechRate":6.017,"hasEvents":true,"sentence_source":"因为我总想 家里面最小的那个孩子，她一般是被爸妈就保护得最好的。","sentence_en":"Because I always think the youngest child is usually the most protected by parents."},{"id":"160","start":1165.81,"end":1169.85,"displayStart":1165.81,"displayEnd":1169.85,"displayMid":1167.83,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.4,"loudness":0.906152,"pitch":24.70293,"speechRate":4.211,"hasEvents":true,"sentence_source":"对 她们应该说是好像比较喜欢我的吧。","sentence_en":"Right, I guess they seemed to like me more."},{"id":"161","start":1170.29,"end":1173.55,"display ts":false,"sentence_source":"完全是军队的那种编织 她们就都去了 去的很远。","sentence_en":"It was fully military. They all went, very far away."},{"id":"169","start":1232.85,"end":1246.89,"displayStart":1232.85,"displayEnd":1246.89,"displayMid":1239.87,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.4,"loudness":0.880867,"pitch":21.451239,"speechRate":3.75,"hasEvents":false,"sentence_source":"其实我大姐后来很后悔的 我大姐后来都五六十了，突然跟我说 她们在军工都是学无限电 什么都是理工，她说 我应该是学文的。","sentence_en":"Actually, my eldest sister later regretted it. When she was in her fifties or sixties, she suddenly told me that in military engineering they all studied radio, all STEM. She said she should have studied liberal arts."},{"id":"170","start":1247.17,"end":1258.77,"displayStart":1247.17,"displayEnd":1258.77,"displayMid":1252.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.5,"loudness":0.896181,"pitch":25.641874,"speechRate":4.743,"hasEvents":false,"sentence_source":"可是一辈子都过去了，但她们那一代人 有她们那一代人的幸运，就是她们在求学阶段 她们的教育没有因为环境的变化，而被中断 是啊。","sentence_en":"But a lifetime has passed. That generation had its luck—their education wasn't interrupted by changing circumstances. Yes."},{"id":"171","start":1258.77,"end":1268.23,"displayStart":1258.77,"displayEnd":1268.23,"displayMid":1263.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Negative","score":-0.3,"loudness":0.973737,"pitch":26.825891,"speechRate":4.514,"hasEvents":false,"sentence_source":"我是初二开始中断的，我就上完了初一 然后就中断了 学校就散了 就停课了，如果不中断 你也是学爸爸。","sentence_en":"My education was interrupted starting from eighth grade. I finished seventh grade, then it stopped. The school disbanded, classes were suspended. If it hadn't stopped, you would also study like
