"392","start":3216.77,"end":3228.83,"displayStart":3216.77,"displayEnd":3228.83,"displayMid":3222.8,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.99,"pitch":23.550426,"speechRate":4.509,"hasEvents":false,"sentence_source":"这个事是我亲耳听费劳说的，就是有一次费劳到所里，她是美国一段时间就约见所有的研究生，我不是她博士后吗 也在那听她讲。","sentence_en":"I heard this from Fei Lao myself. Once she came to the institute, she was in the US for a while and met all the graduate students. I was her postdoc, so I listened too."},{"id":"393","start":3228.83,"end":3243.67,"displayStart":3228.83,"displayEnd":3243.67,"displayMid":3236.25,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.944771,"pitch":24.705471,"speechRate":3.706,"hasEvents":false,"sentence_source":"然后那次她就讲社会学要出故事，这是她原话的意思，就是人生和社会就像是一个大舞台，人们在这个舞台上就上演这种悲欢离合呀。","sentence_en":"That time she said sociology should produce stories. Her original meaning is that life and society are like a big stage where people perform joys and sorrows."},{"id":"394","start":3243.67,"end":3246.11,"displayStart":3243.67,"displayEnd":3246.11,"displayMid":3244.8900000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.929107,"pitch":21.637074,"speechRate":3.689,"hasEvents":false,"sentence_source":"生生死死的这些活距。","sentence_en":"These dramas of life and death."},{"id":"395","start":3246.11,"end":3261.33,"displayStart":3246.11,"displayEnd":3261.33,"displayMid":3253.7200000000003,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.913217,"pitch":22.610283,"speechRate":4.008,"hasEvents":false,"sentence_source":"那我们社会学要做什么呢，就是来讲这些人的故事，我理解废老说这个意思，就是社会学不应当只是出这个统计数字，只搞这个大规模的定量的调查。","sentence_en":"So what should sociology do? It is to tell these people's stories. I understand Fei Lao's meaning: sociology should not just produce statistics or do large-scale quantitative surveys."},{"id":"396","start":3261.33,"end":3268.07,"displayStart":3261.33,"displayEnd":3268.07,"displayMid":3264.7,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.869031,"pitch":22.093134,"speechRate":3.116,"hasEvents":false,"sentence_source":"还要关注活生生的人间戏剧，这样你才能出故事吗?","sentence_en":"We also need to pay attention to the vivid human dramas. Only then can you produce stories, right?"},{"id":"397","start":3268.35,"end":3269.29,"displayStart":3268.35,"displayEnd":3269.29,"displayMid":3268.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Intimate Relationships and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.89792,"pitch":24.437101,"speechRate":8.333,"hasEvents":false,"sentence_source":"她就是这个意思。","sentence_en":"That's what she meant."},{"id":"398","start":3269.73,"end":3276.81,"displayStart":3269.73,"displayEnd":3276.81,"displayMid":3273.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.894441,"pitch":25.118979,"speechRate":4.9,"hasEvents":false,"sentence_source":"那李老师您很早就做过，关于农村女性 婚姻结构方面，还有性别权力的一些研究。","sentence_en":"Then Teacher Li, you did research on rural women, marriage structure, and gender power a long time ago."},{"id":"399","start":3276.81,"end":3284.79,"displayStart":3276.81,"displayEnd":3284.79,"displayMid":3280.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.933135,"pitch":23.883709,"speechRate":5.514,"hasEvents":true,"sentence_source":"那当年您第一次进入农村，做这些调查的时候，有没有观察到哪些现象，在那个时候是完全超出您的认知的?","sentence_en":"When you first entered the countryside to do these investigations, did you observe any phenomena that were completely beyond your understanding at that time?"},{"id":"400","start":3285.21,"end":3299.27,"displayStart":3285.21,"displayEnd":3299.27,"displayMid":3292.24,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.890736,"pitch":25.158321,"speechRate":3.37,"hasEvents":true,"sentence_source":"第一次到农村做调查的时候，有一次 多年前 我有一个浙江鱼瑶的学生，带我到他的小村子里去调查农民生育观念。","sentence_en":"When I first went to the countryside for research, many years ago, a student from Zhejiang Yuyao took me to his small village to investigate farmers' reproductive attitudes."},{"id":"401","start":3299.27,"end":3314.41,"displayStart":3299.27,"displayEnd":3314.41,"displayMid":3306.84,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Neutral","score":0,"loudness":0.943596,"pitch":23.770651,"speechRate":4.227,"hasEvents":false,"sentence_source":"当时感觉到非常震惊的婚姻现象，就是那种碾压式的家庭本位，当时吧 就是八九十年代，浙江那边农民已经付出来了，大家都在盖那两层小楼啊 什么之类的。","sentence_en":"At that time, I was shocked by the marriage phenomenon of overwhelming family centrism. It was the 80s and 90s, farmers in Zhejiang had already become wealthy, everyone was building two-story houses and so on."},{"id":"402","start":3314.41,"end":3317.93,"displayStart":3314.41,"displayEnd":3317.93,"displayMid":3316.17,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.884853,"pitch":19.545431,"speechRate":5.114,"hasEvents":false,"sentence_source":"家家户户 大家比较的集中地住在一个地方。","sentence_en":"Every household, they lived relatively concentrated in one area."},{"id":"403","start":3317.93,"end":3331.75,"displayStart":3317.93,"displayEnd":3331.75,"displayMid":3324.84,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.4,"loudness":0.952548,"pitch":21.642588,"speechRate":4.197,"hasEvents":false,"sentence_source":"然后呢 就是在村子的BR上 有一位老人家，就在那儿 一个人行之影单的 住在一个小房子里头，他给村里开果园的 他也没有结婚 也没有生育。","sentence_en":"Then, at the edge of the village, there was an elderly man living alone in a small house. He worked as a fruit orchard keeper for the village, never married, and had no children."},{"id":"404","start":3331.75,"end":3341.51,"displayStart":3331.75,"displayEnd":3341.51,"displayMid":3336.63,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.936399,"pitch":20.332769,"speechRate":3.689,"hasEvents":false,"sentence_source":"就是成为全村人的这种怜悯的对象吧，甚至都觉得这个人的人生真是很失败 很欺惨的。","sentence_en":"He became an object of pity for the whole village. Everyone felt his life was really a failure and miserable."},{"id":"405","start":3341.51,"end":3355.31,"displayStart":3341.51,"displayEnd":3355.31,"displayMid":3348.41,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.6,"loudness":0.932895,"pitch":20.493153,"speechRate":4.341,"hasEvents":false,"sentence_source":"因为所有的人 大家都是一种模式，轰轰火火的 高高兴兴的，这个我记得访问到一对夫妇，我调查生育嘛 然后她特别喜笑言开的，在跟我讲说的。","sentence_en":"Because everyone followed the same pattern, bustling and happy. I remember interviewing a couple. Since I was surveying fertility, the wife was particularly cheerful and talked to me."},{"id":"406","start":3355.31,"end":3362.85,"displayStart":3355.31,"displayEnd":3362.85,"displayMid":3359.08,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.85039,"pitch":22.590273,"speechRate":3.919,"hasEvents":false,"sentence_source":"我们家就是先开花后结果，是怎么着呢 她先生了个女孩，又生了个男孩。","sentence_en":"Our family is 'bloom first, then bear fruit.' How? She first had a girl, then a boy."},{"id":"407","start":3362.85,"end":3374.21,"displayStart":3362.85,"displayEnd":3374.21,"displayMid":3368.5299999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.5,"loudness":0.856306,"pitch":19.241951,"speechRate":3.345,"hasEvents":false,"sentence_source":"然后她就叫先开花后结果，觉得自己的人生啊 特别的圆满，可是你看那个单身的老人就特惨。","sentence_en":"So she called it 'bloom first, then bear fruit,' feeling her life was especially complete. But look at that single old man, so miserable."},{"id":"408","start":3374.21,"end":3383.19,"displayStart":3374.21,"displayEnd":3383.19,"displayMid":3378.7,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.6,"loudness":0.84517,"pitch":21.543293,"speechRate":4.687,"hasEvents":false,"sentence_source":"我觉得这个给我印象还挺深的，就说你在一个村子里你要是没结成婚，没有生个一儿半女 然后就很惨。","sentence_en":"I was really struck by how tragic it is in a village if you never marry or have children."},{"id":"409","start":3383.19,"end":3387.29,"displayStart":3383.19,"displayEnd":3387.29,"displayMid":3385.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.982619,"pitch":29.887011,"speechRate":6.109,"hasEvents":false,"sentence_source":"那当年的那些研究对象如果放到今天的这个环境当中。","sentence_en":"If those research subjects from back then were placed in today's environment,"},{"id":"410","start":3387.29,"end":3396.79,"displayStart":3387.29,"displayEnd":3396.79,"displayMid":3392.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.838889,"pitch":23.847853,"speechRate":5.263,"hasEvents":false,"sentence_source":"因为它整个结构困境可能也发生了一些根本性的变化吗，或者说哪些困境其实好像并没有随着时间的流逝而发生改变。","sentence_en":"has the whole structural dilemma fundamentally changed, or have some difficulties remained unchanged over time?"},{"id":"411","start":3396.79,"end":3412.23,"displayStart":3396.79,"displayEnd":3412.23,"displayMid":3404.51,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.4,"loudness":0.946783,"pitch":26.404217,"speechRate":4.132,"hasEvents":false,"sentence_source":"我觉得要是高度概括地说，比如说女性她对家庭经济的贡献已经达到三分之一，就是比如男的挣的钱还是多一点，女的呢 慢慢的 有的就能达到一半了。","sentence_en":"To summarize broadly: women's contribution to household income has reached a third—men still earn more, but gradually some women earn up to half."},{"id":"412","start":3412.23,"end":3416.81,"displayStart":3412.23,"displayEnd":3416.81,"displayMid":3414.52,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.6,"loudness":0.907326,"pitch":24.867931,"speechRate":4.739,"hasEvents":false,"sentence_source":"甚至有个别的能够超过一半，就她比男的还能挣。","sentence_en":"Some even exceed half, out-earning men."},{"id":"413","start":3416.81,"end":3422.73,"displayStart":3416.81,"displayEnd":3422.73,"displayMid":3419.77,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.897041,"pitch":25.614857,"speechRate":4.782,"hasEvents":false,"sentence_source":"我觉得这是挺大的变化，农村的妇女的收入这方面变化还是挺大的。","sentence_en":"I think that's a significant change—rural women's income has really improved."},{"id":"414","start":3422.73,"end":3438.31,"displayStart":3422.73,"displayEnd":3438.31,"displayMid":3430.52,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.5,"loudness":0.934589,"pitch":23.624352,"speechRate":4.247,"hasEvents":false,"sentence_source":"我觉得没有真正发生变化的，你比如说有一些现象 采礼结婚的时候还是要几十万 几十万的采礼的，这个东西政府三令五身 说不需要采礼 这个东西是没办法的。","sentence_en":"I think nothing has really changed. For instance, bride price still requires hundreds of thousands of yuan at weddings. The government repeatedly emphasizes that bride price is unnecessary, but there's no way to change it."},{"id":"415","start":3438.31,"end":3451.29,"displayStart":3438.31,"displayEnd":3451.29,"displayMid":3444.8,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Negative","score":-0.4,"loudness":0.999553,"pitch":25.429436,"speechRate":4.843,"hasEvents":false,"sentence_source":"习俗这个东西你不能靠证令把它改变的，就是说虽然你发什么红头文件好招啊 大家都不要要采礼啊，可是你要是不给采礼的话你就取不上媳妇儿。","sentence_en":"You can't change customs by decree. Even if official documents say not to demand bride price, if you don't pay it, you can't get a wife."},{"id":"416","start":3451.29,"end":3459.71,"displayStart":3451.29,"displayEnd":3459.71,"displayMid":3455.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.968732,"pitch":24.256561,"speechRate":3.745,"hasEvents":false,"sentence_source":"这个还是一个现状 我觉得这个东西真正的要改变 恐怕要等城市化之后。","sentence_en":"That's still the reality. I think real change will probably have to wait until after urbanization."},{"id":"417","start":3459.71,"end":3473.85,"displayStart":3459.71,"displayEnd":3473.85,"displayMid":3466.7799999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0.1,"loudness":0.849379,"pitch":21.197025,"speechRate":4.123,"hasEvents":true,"sentence_source":"这个才离才会慢慢的退去 它的前提就是男女双方都是有独立的经济收入的，到那个时候那个结合就是城市化整个这个风俗才会随着变。","sentence_en":"Only then will this gradually fade. Its prerequisite is that both men and women have independent incomes. Only then will marriage and urbanization change the customs."},{"id":"418","start":3473.85,"end":3483.15,"displayStart":3473.85,"displayEnd":3483.15,"displayMid":3478.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.950485,"pitch":25.295666,"speechRate":5.257,"hasEvents":true,"sentence_source":"那您现在肯定也关注到就很多年轻的女孩，他们一谈到婚姻 至少肯定是 哪怕是暂时的 但她一定在有一个阶段。","sentence_en":"Now you must have noticed that many young women, when it comes to marriage—at least for a certain period, even if temporary—"},{"id":"419","start":3483.15,"end":3496.73,"displayStart":3483.15,"displayEnd":3496.73,"displayMid":3489.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.886949,"pitch":20.361055,"speechRate":4.566,"hasEvents":false,"sentence_source":"她对婚姻的表述是拒绝 谨慎可能是一个比较相对还理性的一个表达，更多的人就会说 拒绝 那你要从社会学角度怎么样去理解如今的这种转变这里。","sentence_en":"they express rejection. Cautious is a relatively rational expression; more just say 'reject.' How do you understand this shift from a sociological perspective?"},{"id":"420","start":3496.73,"end":3506.41,"displayStart":3496.73,"displayEnd":3506.41,"displayMid":3501.5699999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0.1,"loudness":0.935476,"pitch":21.315056,"speechRate":4.132,"hasEvents":false,"sentence_source":"面有一个最大的改变 从社会学的角度看，就是对于女性来说 结婚的刚须消失了 她只是一种选择。","sentence_en":"The biggest change from a sociological perspective is that for women, marriage is no longer a necessity—it's just a choice."},{"id":"421","start":3506.41,"end":3517.33,"displayStart":3506.41,"displayEnd":3517.33,"displayMid":3511.87,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.868478,"pitch":21.509621,"speechRate":3.755,"hasEvents":false,"sentence_source":"就是在传统的社会里 对于女性来说 婚姻她是有钢须的，她婚姻是钢须 因为那个时候男主外女主内。","sentence_en":"In traditional society, marriage was a necessity for women. It was necessary because men worked outside, women stayed home."},{"id":"422","start":3517.33,"end":3528.33,"displayStart":3517.33,"displayEnd":3528.33,"displayMid":3522.83,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.872856,"pitch":23.187153,"speechRate":4.297,"hasEvents":false,"sentence_source":"你如果女的 你不去嫁个人的话 你没地儿吃饭 所以说她是钢须，另外她还是养老钢须 就是结婚也是养老的钢须。","sentence_en":"If you didn't marry, you had no means to eat. So it was a necessity. Also, it was a necessity for old-age support—marriage ensured you'd be taken care of."},{"id":"423","start":3528.33,"end":3541.75,"displayStart":3528.33,"displayEnd":3541.75,"displayMid":3535.04,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.846204,"pitch":21.750055,"speechRate":4.024,"hasEvents":false,"sentence_source":"因为在农业社会 你老了 人丧失劳动力以后 你是没有生活来源的，你必须得有子女养儿房老 是吧，而你要是想有个儿子你就得结婚。","sentence_en":"Because in agricultural society, when you got old and lost your labor capacity, you had no income. You had to have children to support you in old age. And to have a son, you had to marry."},{"id":"424","start":3541.75,"end":3549.31,"displayStart":3541.75,"displayEnd":3549.31,"displayMid":3545.5299999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.784876,"pitch":18.598673,"speechRate":3.968,"hasEvents":false,"sentence_source":"这都是在乡土的社会里头这个钢须，就是一个女的她是必须得结个婚的。","sentence_en":"All these were necessities in rural society—a woman had to get married."},{"id":"425","start":3549.31,"end":3562.41,"displayStart":3549.31,"displayEnd":3562.41,"displayMid":3555.8599999999997,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.953367,"pitch":24.555332,"speechRate":4.249,"hasEvents":false,"sentence_source":"那么在现代的社会呢 就不是钢须了，她是个有好多女的 有自己的收入，自己有退休金 养老金 能够自己养老，她也不要靠男人来吃饭。","sentence_en":"But in modern society, it's not a necessity. Many women have their own income, pensions, and can support themselves in old age. They don't need to rely on a man for food."},{"id":"426","start":3562.41,"end":3571.85,"displayStart":3562.41,"displayEnd":3571.85,"displayMid":3567.13,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Positive","score":0.5,"loudness":0.87514,"pitch":24.392273,"speechRate":4.878,"hasEvents":false,"sentence_source":"也不一定要靠子女来给她养老，这样你就多了一个选择了，你可以结婚 你可以选择不结婚，这是一个大的背景。","sentence_en":"Nor do they have to rely on children for old-age support. So you have an additional choice: you can marry or not. That's the big background."},{"id":"427","start":3571.85,"end":3586.73,"displayStart":3571.85,"displayEnd":3586.73,"displayMid":3579.29,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.924543,"pitch":23.060627,"speechRate":4.443,"hasEvents":false,"sentence_source":"我觉得第二个呢，就是说随着这种社会的变迁，以后人们的价值观就改变了，用社会学的术语来说，就是从家庭本位 向个人本位改变了，这个家庭本位是什么呢。","sentence_en":"Second, as society changes, people's values shift. In sociological terms, it's a shift from family-centered to individual-centered. What is family-centered?"},{"id":"428","start":3586.73,"end":3598.61,"displayStart":3586.73,"displayEnd":3598.61,"displayMid":3592.67,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":1.047354,"pitch":22.481976,"speechRate":4.036,"hasEvents":false,"sentence_source":"就是把家庭的价值 家庭生活呀，传宗接待呀 这一套东西放在第一位，这个个人的享受啊 什么感情啊 什么这些东西。","sentence_en":"It means putting family values, family life, and passing on the family line first, while personal enjoyment and emotions are secondary."},{"id":"429","start":3598.61,"end":3603.21,"displayStart":3598.61,"displayEnd":3603.21,"displayMid":3600.91,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Values and Female Roles","sentiment_en":"Neutral","score":0,"loudness":0.890849,"pitch":18.984783,"speechRate":4.735,"hasEvents":false,"sentence_source":"放第二位 这叫家庭本位 这个社会价值观 价值取向。","sentence_en":"That's second place—that's family-centered. That's the social value orientation."},{"id":"430","start":3603.21,"end":3615.63,"displayStart":3603.21,"displayEnd":3615.63,"displayMid":3609.42,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.961528,"pitch":24.457035,"speechRate":4.562,"hasEvents":false,"sentence_source":"然后呢 个人本位呢 就是把个人 我这一辈子到底要干点什么呀，我怎么来享受我的生命啊 我怎么自我实现呀，你把这个放在第一位了。","sentence_en":"Individual-centered means putting individual: what do I want to do in my life, how do I enjoy it, how do I self-actualize—putting that first."},{"id":"431","start":3615.63,"end":3624.59,"displayStart":3615.63,"displayEnd":3624.59,"displayMi terName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":1.029482,"pitch":24.735426,"speechRate":5.14,"hasEvents":false,"sentence_source":"我们以这个作为标准 那您觉得您当时想的做到了多少。","sentence_en":"Using that as a standard, how much do you think you achieved what you envisioned?"},{"id":"523","start":4375.98,"end":4385.42,"displayStart":4375.98,"displayEnd":4385.42,"displayMid":4380.7,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":-0.2,"loudness":0.94644,"pitch":24.525105,"speechRate":3.499,"hasEvents":false,"sentence_source":"有点少年轻狂吧 改变社会这个东西，总的来说 个人能改变的 真的是微乎其微。","sentence_en":"A bit of youthful arrogance, changing society. Overall, an individual can change very little."},{"id":"524","start":4386.14,"end":4399.82,"displayStart":4386.14,"displayEnd":4399.82,"displayMid":4392.98,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Positive","score":0.5,"loudness":0.925439,"pitch":24.347353,"speechRate":3.919,"hasEvents":false,"sentence_source":"通过我的社会学研究 只能说在我利索能及的方面做了一点点事吧，主要是帮助弱势群体发出声音，略微的改善了他们的处境。","sentence_en":"Through my sociology research, I can only say I did a little in areas within my ability, mainly helping the vulnerable speak up, slightly improving their situation."},{"id":"525","start":4399.82,"end":4415.74,"displayStart":4399.82,"displayEnd":4415.74,"displayMid":4407.78,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.907665,"pitch":22.756577,"speechRate":3.643,"hasEvents":false,"sentence_source":"也真的不能说有什么改变，就是真正的改变需要好多好多人的力量，有的时候是社会变迁，整个社会结构，整个社会的人的生活方式全都变了。","sentence_en":"I can't really say there's been any change. Real change requires the power of many people. Sometimes it's social change, the entire social structure, the lifestyle of everyone in society has changed."},{"id":"526","start":4415.74,"end":4425.5,"displayStart":4415.74,"displayEnd":4425.5,"displayMid":4420.62,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":-0.2,"loudness":0.866866,"pitch":24.220026,"speechRate":4.493,"hasEvents":false,"sentence_source":"这个时候呢，某一个这里面有一群人的什么处境呢，才能稍稍的有所改变，个人我觉得真的没有什么力量。","sentence_en":"At that point, only the situation of a certain group within can be slightly changed. As an individual, I really have little power."},{"id":"527","start":4425.5,"end":4429.2,"displayStart":4425.5,"displayEnd":4429.2,"displayMid":4427.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Sociological Research and Independent Thinking","sentiment_en":"Neutral","score":0,"loudness":0.942643,"pitch":26.99111,"speechRate":5.045,"hasEvents":false,"sentence_source":"那这些会让您有时候质疑生命的意义吗?","sentence_en":"Does this ever make you question the meaning of life?"},{"id":"528","start":4429.56,"end":4443.54,"displayStart":4429.56,"displayEnd":4443.54,"displayMid":4436.55,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.899372,"pitch":25.257053,"speechRate":4.569,"hasEvents":false,"sentence_source":"我觉得生命的意义应该不在这儿，不是说如果我的一生改变了社会 我就有意义了，没有改变社会 我的生命就没意义了，我对生命的意义的看法还是那个。","sentence_en":"I think the meaning of life isn't there. It's not that if I change society, my life has meaning, and if I don't, it's meaningless. My view on the meaning of life is still the same."},{"id":"529","start":4443.54,"end":4458.22,"displayStart":4443.54,"displayEnd":4458.22,"displayMid":4450.88,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.871004,"pitch":21.453829,"speechRate":4.292,"hasEvents":false,"sentence_source":"就是宏观上它是不可能有意义的，你就想想宇宙 你再想想地球，你再想想 你像一个小蚂蚁一样 爬来爬去，国家几万天就消失不见 这怎么可能有任何意义。","sentence_en":"On a macro level, it's impossible to have meaning. Think of the universe, the earth, yourself like a little ant crawling around, a nation disappears in tens of thousands of days—how can there be any meaning?"},{"id":"530","start":4458.22,"end":4464.78,"displayStart":4458.22,"displayEnd":4464.78,"displayMid":4461.5,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.816632,"pitch":23.805347,"speechRate":4.235,"hasEvents":false,"sentence_source":"然后呢 微观上你要自负意义，微观上给自己的这个生命自负意义。","sentence_en":"Then on a micro level, you must take responsibility for meaning. On a micro level, give your own life meaning."},{"id":"531","start":4464.78,"end":4471.94,"displayStart":4464.78,"displayEnd":4471.94,"displayMid":4468.36,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.820439,"pitch":21.303116,"speechRate":4.388,"hasEvents":false,"sentence_source":"那我现在我的给自己的标准就是两条，身体的舒适和精神的愉悦 就这两条。","sentence_en":"Now my standard for myself is two things: physical comfort and spiritual joy."},{"id":"532","start":4471.94,"end":4475.46,"displayStart":4471.94,"displayEnd":4475.46,"displayMid":4473.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Female Growth and Sociological Research","sentiment_en":"Positive","score":0.7,"loudness":0.94873,"pitch":23.850681,"speechRate":5.405,"hasEvents":false,"sentence_source":"我现在才懂得李老师 这是非常高的标准。","sentence_en":"Now I understand, Teacher Li, that is a very high standard."},{"id":"533","start":4475.46,"end":4482.5,"displayStart":4475.46,"displayEnd":4482.5,"display asure from this aesthetic experience."},{"id":"541","start":4541.66,"end":4543.88,"displayStart":4541.66,"displayEnd":4543.88,"displayMid":4542.77,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.795122,"pitch":24.497139,"speechRate":6.566,"hasEvents":false,"sentence_source":"我觉得这两条就是生命的意义。","sentence_en":"I think these two things are the meaning of life."},{"id":"542","start":4544.32,"end":4553.9,"displayStart":4544.32,"displayEnd":4553.9,"displayMid":4549.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.948804,"pitch":23.447748,"speechRate":5.291,"hasEvents":false,"sentence_source":"那李老师像您这样在我们看来智慧女性，就是可能比我们很多更年轻一代更参透生命的所谓意义嘛，或者生命的无意义。","sentence_en":"Professor Li, to us you seem like a wise woman who has perhaps grasped the so-called meaning of life—or its meaninglessness—more deeply than our younger generation."},{"id":"543","start":4553.9,"end":4569.36,"displayStart":4553.9,"displayEnd":4569.36,"displayMid":4561.629999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.035493,"pitch":25.683695,"speechRate":5.191,"hasEvents":false,"sentence_source":"那即便如您您对于岁月这样一天天飞快的流逝，是在某个阶段会不会开始对变老有一些些恐惧，或者说恐惧这个词可能太大了，但比如说是头发白的那个时候，还是比如说觉得视力不如以前了。","sentence_en":"Even so, do you ever start to feel some fear about aging as the years fly by? Maybe 'fear' is too strong a word, but things like when your hair turns white or your vision isn't what it used to be?"},{"id":"544","start":4569.36,"end":4576.06,"displayStart":4569.36,"displayEnd":4576.06,"displayMid":4572.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudn t thought or anxiety into 'How should I dress to look prettier?' I never thought about that."},{"id":"580","start":4835.12,"end":4848.42,"displayStart":4835.12,"displayEnd":4848.42,"displayMid":4841.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":1.042107,"pitch":23.096285,"speechRate":5.309,"hasEvents":false,"sentence_source":"这个我以前认为是一种缺失 现在我觉得是一种自由，你要知道《辅美艺》这个词是这几年，很多 特别是女性大家都会谈的一个议题嘛，您会怎么看待《辅美艺》这个话题。","sentence_en":"I used to see that as a lack, but now I see it as freedom. You know, 'Fu Mei Yi' is a topic many, especially women, discuss these days. How do you view this topic?"},{"id":"581","start":4848.42,"end":4854.8,"displayStart":4848.42,"displayEnd":4854.8,"displayMid":4851.610000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.93151,"pitch":22.765644,"speechRate":4.754,"hasEvents":false,"sentence_source":"这个《辅美艺》啊 跟你说实话，我是在你这个访谈里头 头一次听说这个词。","sentence_en":"To be honest, this is the first time I've heard the term 'Fu Mei Yi' in this interview with you."},{"id":"582","start":4854.8,"end":4870.64,"displayStart":4854.8,"displayEnd":4870.64,"displayMid":4862.72,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.9136,"pitch":22.531206,"speechRate":3.598,"hasEvents":false,"sentence_source":"但是我觉得对服务美艺这个话题 我是这么想的，第一点 从女权角度 最早西方的女权运动是抵制选美的，他们那时候给一个山羊带上一个。","sentence_en":"But regarding the topic of beautification, here's what I think. First, from a feminist perspective, the early Western feminist movement opposed beauty pageants. They once put a crown on a goat..."},{"id":"583","start":4870.64,"end":4873.88,"displayStart":4870.64,"displayEnd":4873.88,"displayMid":4872.26,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.91716,"pitch":25.041876,"speechRate":4.012,"hasEvents":false,"sentence_source":"就是那个世界小姐的那个皇冠。","sentence_en":"That is, the Miss World crown."},{"id":"584","start":4873.88,"end":4878.3,"displayStart":4873.88,"displayEnd":4878.3,"displayMid":4876.09,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.972301,"pitch":24.896471,"speechRate":4.072,"hasEvents":false,"sentence_source":"然后就是嘲笑这个事儿 烧乳罩什么之类的。","sentence_en":"Then they mocked the event, burned bras, things like that."},{"id":"585","start":4878.3,"end":4890.76,"displayStart":4878.3,"displayEnd":4890.76,"displayMid":4884.530000000001,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.841752,"pitch":23.8529,"speechRate":4.262,"hasEvents":false,"sentence_source":"然后呢 无独有偶 咱们中国八十年代在好多地方经济全美以后，中国互联发了一个声明是反对选美的，我想他们是从妇女被误化。","sentence_en":"Then, coincidentally, in the 1980s in China, after many places became economically well-off, the Chinese Women's Federation issued a statement opposing beauty pageants. I think they saw it as objectifying women."},{"id":"586","start":4890.76,"end":4901,"displayStart":4890.76,"displayEnd":4901,"displayMid":4895.88,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.902384,"pitch":25.24087,"speechRate":3.711,"hasEvents":false,"sentence_source":"就说好像女的就必须得打扮得漂漂亮亮的，被男人来平头品足 这个从女性的角度是不对的。","sentence_en":"That is, the idea that women must dress up prettily to be judged by men—from a female perspective, that's wrong."},{"id":"587","start":4901,"end":4911.98,"displayStart":4901,"displayEnd":4911.98,"displayMid":4906.49,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.870231,"pitch":21.450489,"speechRate":4.508,"hasEvents":false,"sentence_source":"然后互联所谓才发这个通知啊，就说全国不要搞选美，这个是一个历史的态度，就是对选美这个事 它是抵制的这个态度。","sentence_en":"So the Women's Federation issued that notice saying the country should not hold beauty pageants. That was a historical stance—it was a resistant attitude toward pageants."},{"id":"588","start":4911.98,"end":4926.58,"displayStart":4911.98,"displayEnd":4926.58,"displayMid":4919.28,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.917648,"pitch":25.982428,"speechRate":3.861,"hasEvents":false,"sentence_source":"然后呢 我想到的第二条呢，就是我们怎么样能够满足这个男女平等啊，不是说女性就要打扮得漂漂亮亮的，让男人来选啊 宁式啊 观赏啊。","sentence_en":"Then the second point I thought of is how we can achieve gender equality. It's not that women should dress up pretty for men to select, appraise, and gaze upon."},{"id":"589","start":4926.58,"end":4942.06,"displayStart":4926.58,"displayEnd":4942.06,"displayMid":4934.32,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.826088,"pitch":24.44404,"speechRate":4.174,"hasEvents":false,"sentence_source":"那么我们有一个解决办法就是，不仅要选女性的美 而且要选男性的美，换句话说 不仅女人要服美艺 男人也应当服美艺，这样就男女平等了 这是一个立场。","sentence_en":"So one solution is to not only judge women's beauty but also men's beauty. In other words, not only women but men should also practice beautification. That would achieve gender equality—that's one stance."},{"id":"590","start":4942.06,"end":4955.2,"displayStart":4942.06,"displayEnd":4955.2,"displayMid":4948.63,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.914389,"pitch":25.072813,"speechRate":4.13,"hasEvents":false,"sentence_source":"你看 男性化妆品现在也卖得非常火呀，你看那个服装袖里头也有男性的服装袖 是吧，就是说 这个不是男性单方面的来审女性的美。","sentence_en":"Look, men's cosmetics are selling very well now, and there are also men's fashion shows, right? So it's not just men unilaterally judging women's beauty."},{"id":"591","start":4955.2,"end":4969.32,"displayStart":4955.2,"displayEnd":4969.32,"displayMid":4962.26,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.829238,"pitch":23.365513,"speechRate":4.178,"hasEvents":false,"sentence_source":"然后女性也要来享用 欣赏男性的美，这是一个方案 我觉得最终的解决方案是什么呢，应当是就是在符美意这个事情上，要建立美的多元化标准。","sentence_en":"Women should also enjoy and appreciate male beauty. That's one approach. I think the ultimate solution is to establish diverse standards of beauty when it comes to conforming to beauty ideals."},{"id":"592","start":4969.32,"end":4984.68,"displayStart":4969.32,"displayEnd":4984.68,"displayMid":4977,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.859588,"pitch":21.350134,"speechRate":4.43,"hasEvents":false,"sentence_source":"就是瘦也可以是美的 胖也可以是美的，年轻可以是美的 年长同样可以是美的，这样我们在外表上的这个选择空间就大得很多了，而且你可以打扮 你也可以不打扮。","sentence_en":"Thin can be beautiful, fat can be beautiful; youth can be beautiful, age can be beautiful too. That way, we have much more freedom in appearance—you can dress up or not."},{"id":"593","start":4984.68,"end":4995.02,"displayStart":4984.68,"displayEnd":4995.02,"displayMid":4989.85,"speaker":"Li Yinhe","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.829517,"pitch":22.815351,"speechRate":4.002,"hasEvents":false,"sentence_source":"你可以追求某种风格 也可以完全不在意，而并不会因此被贬低，就说你这人怎么完全跟不上时代啊。","senten <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
