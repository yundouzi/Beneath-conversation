    <script type="application/json" id="episode-data">{"episode":{"id":"S8E8","label":"S8E8","title":"S8E8 Lu Yu in Conversation with Zhang Hong | Sunflower on the ice rink, day after day, growing wildly towards the light.","intro":"Zhang Hong, 'the fastest woman in the world'\nChen Luyu, media personality, host\n\nYan Zhong Hua Shu has reached its eighth season. In this spiritual garden for girls, we have sown 3 million different seeds together, sharing nutrients, exchanging wishes, and growing individually under the same sunlight.\nHost Luyu describes her 2025 as running, almost flying. As the new spring is about to descend upon the earth, she briefly stops, looks back, and shares the gems she has collected this year with all the Yan Zhong Hua—\nHer voice has always accompanied listeners, and 'this is a two-way street; my show has warmed you, and I have received even more warmth in return';\nAt the book signing in Chengdu, she firmly looked at 1,000 girls, 'Rather than saying I hugged 1,000 girls, it's more like I was hugged by 1,000 girls';\nSomeone told her that a pilot lost in a no-man's land saw a light in the distance, 'That little light in the valley is Yan Zhong Hua, and she also thought that the sisters she met in the human world are Yan Zhong Hua';\n......\nShe says, 'I hope I have the honor to keep working, keep making shows, and keep accompanying everyone'; she says, 'It is our shared spiritual garden, and I want to bring one different flower after another into this garden.' In the eighth episode of the eighth season of Yan Zhong Hua Shu, Luyu brings a sunflower that grows on the ice rink.\nAt age 7, Zhang Hong started practicing skating in a park near her home. At that time, she didn't know she would spend 23 years skating, heading down a one-way street with no turning back.\nCountless times she skated alone in the dark, wind whistling past her ears, blades cutting into the ice. She lowered her body again and again, fixing her eyes on the faint light ahead. Speed skating never gives luck; you have to push yourself to the limit repeatedly, waiting for the old body to slowly give way to a new life after tearing and rebuilding. Between winning championships and injuries, training and recovery alternated, marking the days. She finally completed her last race relying on one main leg.\nAfter that, the ice rink retreated from daily life to memory. She brought the endurance inherited from competition into another unfamiliar field—a broader international arena. Language, rules, order—everything had to start from scratch. It was a more difficult adaptation than dense schedules and piercing pain. No timing, no teammates, no finish line, only repeated self-questioning: Besides skating, am I really good for nothing? Can I live a different life?\nAt age 7, she wrote in her diary, 'I can't run anymore, but I have to persevere.' Years later, this sentence still echoes in her life.\nSuch a 'sunflower growing on the ice rink,' roots in the cold, body facing the light. Even when the snowstorm is fierce, she never stops skating.","duration":5343,"displayDuration":5343,"audioSrc":"s8e8.m4a","guest":"Zhang Hong","host":"Lu Yu","releaseDate":"2026.2.11"},"topicDefinitions":{"1":{"label":"C1","name":"Artistic aesthetics and life insights","color":"#FFFFFF","opacity":0.2,"firstCategory":"Artistic aesthetics and life insights","secondCategory":"Artistic Aesthetics and Life Insights","keyWords":["Artistic aesthetics and life insights","Artistic Aesthetics","Life Insights"]},"2":{"label":"C2","name":"Female Growth and Champion Mindset","color":"#B9B4B6","opacity":0.2,"firstCategory":"Female Growth and Champion Mindset","secondCategory":"Female Growth and Champion Mindset","keyWords":["Hongbing Field","Kui Rifu","Rikuiri","Zhang Hongbing","Talk with Zhang Hong"]},"3":{"label":"C3","name":"Athlete Growth and Olympic Experience","color":"#CB7281","opacity":0.2,"firstCategory":"Athlete Growth and Olympic Experience","secondCategory":"Athlete Gr result."},{"id":"148","start":1202.13,"end":1214.59,"displayStart":1202.13,"displayEnd":1214.59,"displayMid":1208.3600000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.879977,"pitch":20.89045,"speechRate":4.896,"hasEvents":false,"sentence_source":"所以一直到所期 我觉得是 所有的包括技术、起跑、弯道 真的是练了上万次，上万次的这种反复 让你对1000米的项目从第一米开始到1000米。","sentence_en":"So until Sochi, I think everything—technique, start, curves—I practiced tens of thousands of times. That repetition made me understand every meter of the 1000m, from the first to the last."},{"id":"149","start":1214.59,"end":1219.45,"displayStart":1214.59,"displayEnd":1219.45,"displayMid":1217.02,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.792452,"pitch":20.059389,"speechRate":5.983,"hasEvents":false,"sentence_source":"你都知道怎么滑 滑冰中的每一米 每一步登冰 每一秒我要去控制它。","sentence_en":"I knew how to skate every meter, every push, every second I had to control."},{"id":"150","start":1219.45,"end":1229.85,"displayStart":1219.45,"displayEnd":1229.85,"displayMid":1224.65,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.83075,"pitch":19.777121,"speechRate":5.728,"hasEvents":false,"sentence_source":"因为速度滑冰的长关有12000平米的冰面 它跟填进场是一样的，里边有上万的观众 我进到场地里的时候我什么都听不到 全是欢呼声。","sentence_en":"Because the speed skating rink has 12,000 square meters of ice, just like a track and field stadium. There are thousands of spectators, but when I step into the rink, I can't hear anything—it's all cheers."},{"id":"151","start":1229.85,"end":1241.49,"displayStart":1229.85,"displayEnd":1241.49,"displayMid":1235.67,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.957057,"pitch":22.063833,"speechRate":6.166,"hasEvents":false,"sentence_source":"但是当我站在起跑线 听到裁判喊go to star的时候 这个时候全场是安静的，他发枪之后 观众才可以再次再喊，可是在他发枪之后 我就开始进到了我的境界里。","sentence_en":"But when I stood at the starting line and heard the referee say 'Go to start,' the whole arena was silent. Only after the gun went off could the audience cheer again. But once the gun fired, I entered my own zone."},{"id":"152","start":1241.49,"end":1254.49,"displayStart":1241.49,"displayEnd":1254.49,"displayMid":1247.99,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.832012,"pitch":20.230064,"speechRate":5.712,"hasEvents":false,"sentence_source":"那个时候 在我的那一刻里 只有我的冰刀 我的队友和我的教练，我听不见任何观众的呼喊声 我都把他们屏蔽掉了，我能感觉到我的呼吸 我甚至能感觉到我的手指头摆壁 摆到哪儿。","sentence_en":"At that moment, all I could see were my skates, my teammates, and my coach. I couldn't hear the crowd at all—I blocked them out. I could feel my breathing, and even my fingertips as they swung past my sides."},{"id":"153","start":1254.49,"end":1261.79,"displayStart":1254.49,"displayEnd":1261.79,"displayMid":1258.1399999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.914874,"pitch":22.761444,"speechRate":6.696,"hasEvents":false,"sentence_source":"我的腿灯冰灯到哪儿 我感觉我的冰刀和我的身体，还有冰面连为一线的那种感觉 一直到冲过重点线那一刹那。","sentence_en":"I could feel where my leg and skate landed, and the sensation of my blade, my body, and the ice becoming one single line—all the way until I crossed the finish line."},{"id":"154","start":1261.79,"end":1269.99,"displayStart":1261.79,"displayEnd":1269.99,"displayMid":1265.8899999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.848761,"pitch":20.663141,"speechRate":6.691,"hasEvents":false,"sentence_source":"然后所有的画用声就刷一下都回来了，就是那种感觉可能在我23年的运动生压力只有那么两三次，但我很幸运在锁器我做到了。","sentence_en":"Then all the noise rushed back in an instant. That feeling only happened maybe two or three times in my 23-year athletic career, but I'm lucky I achieved it at that moment."},{"id":"155","start":1269.99,"end":1277.55,"displayStart":1269.99,"displayEnd":1277.55,"displayMid":1273.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Artistic aesthetics and life insights","sentiment_en":"Neutral","score":0.1,"loudness":1.070426,"pitch":26.70376,"speechRate":4.414,"hasEvents":false,"sentence_source":"感觉就很像电影里面那个镜头就是只有你是清晰的，周围的画面都是模糊的。","sentence_en":"It felt like a movie scene—only you are sharp, and everything around you is blurry."},{"id":"156","start":1277.55,"end":1280.75,"displayStart":1277.55,"displayEnd":1280.75,"displayMid":1279.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Artistic aesthetics and life insights","sentiment_en":"Neutral","score":0,"loudness":1.15054,"pitch":28.188713,"speechRate":5.449,"hasEvents":false,"sentence_source":"然后所有的景物人飞速地向你身后闪去。","sentence_en":"And all the people and scenery blur past you at high speed."},{"id":"157","start":1280.75,"end":1292.29,"displayStart":1280.75,"displayEnd":1292.29,"displayMid":1286.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Artistic aesthetics and life insights","sentiment_en":"Neutral","score":0.1,"loudness":1.042257,"pitch":24.856323,"speechRate":5.326,"hasEvents":false,"sentence_source":"然后能看到那个主人公非常坚定地专注地拼命地再往前滑，就那种感觉我脑海中都有画面了，你有隐隐的渴望过那枚金牌吗，有的时候是这样的。","sentence_en":"You can see the protagonist fiercely focused, pushing forward with all their might. I can even picture that in my mind. Did you secretly long for that gold medal? Sometimes, yes."},{"id":"158","start":1292.29,"end":1302.39,"displayStart":1292.29,"displayEnd":1302.39,"displayMid":1297.3400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Artistic aesthetics and life insights","sentiment_en":"Neutral","score":-0.1,"loudness":1.071065,"pitch":23.536621,"speechRate":5.556,"hasEvents":false,"sentence_source":"我们在心里面其实你会梦想那个最大的最远的那个梦想，但对自己在当下都未必敢承认，你怕好像离他太远了甚至怕把他吓跑了会有。","sentence_en":"Deep down, we dream the biggest, most far-off dream, but we might not even dare admit it to ourselves at the moment. You're afraid it's too far away, or even that you might scare it off."},{"id":"159","start":1302.39,"end":1308.33,"displayStart":1302.39,"displayEnd":1308.33,"displayMid":1305.3600000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Neutral","score":0.1,"loudness":0.931847,"pitch":22.462967,"speechRate":5.684,"hasEvents":false,"sentence_source":"那其实我现在也有在跟别人在分享，我说运动员是一个最高维的职业为什么。","sentence_en":"Actually, I now tell others that being an athlete is the highest-level profession. Why?"},{"id":"160","start":1308.33,"end":1322.23,"displayStart":1308.33,"displayEnd":1322.23,"displayMid":1315.28,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Neutral","score":0,"loudness":0.840604,"pitch":22.333912,"speechRate":5.108,"hasEvents":false,"sentence_source":"因为第二跟最后一名没有区别，就是这么现实，在我14岁的时候，我坐在电视前看了2002年的延护成东奥会的直播那个，时候是杨洋姐为东欧代表团拿了第一块金牌。","sentence_en":"Because second place and last place are no different—that's how real it is. When I was 14, I sat in front of the TV watching the 2002 Winter Olympics. That was when Yang Yang won China's first gold medal."},{"id":"161","start":1322.23,"end":1334.41,"displayStart":1322.23,"displayEnd":1334.41,"displayMid":1328.3200000000002,"speaker":" up in speed skating, I realized I was only about twenty-something people away from being a world champion."},{"id":"165","start":1347.69,"end":1358.79,"displayStart":1347.69,"displayEnd":1358.79,"displayMid":1353.24,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.8,"loudness":0.815857,"pitch":22.168179,"speechRate":4.362,"hasEvents":true,"sentence_source":"那个时候我就开始对奥运金牌对世界冠军有了更加强烈和清晰的这种目标跟期待，每一位选手我相信他们都想赢。","sentence_en":"From then on, my goal and expectation for Olympic gold and world championships became much stronger and clearer. Every athlete, I believe, wants to win."},{"id":"166","start":1358.79,"end":1360.75,"displayStart":1358.79,"displayEnd":1360.75,"displayMid":1359.77,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":1.063778,"pitch":26.348944,"speechRate":8.525,"hasEvents":true,"sentence_source":"所以在我们内心我们是渴望赢。","sentence_en":"So deep down, we crave victory."},{"id":"167","start":1360.75,"end":1370.29,"displayStart":1360.75,"displayEnd":1370.29,"displayMid":1365.52,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.766779,"pitch":19.424391,"speechRate":5.346,"hasEvents":false,"sentence_source":"但是我觉得速度哈冰它是一个跟自己比赛的项目，你必须要上百次上千次的去站上自己，你才有可能在比赛中去站上对手。","sentence_en":"But I think speed skating is a sport where you compete with yourself. You have to overcome yourself hundreds or thousands of times before you can beat your opponents in a race."},{"id":"168","start":1370.29,"end":1379.49,"displayStart":1370.29,"displayEnd":1379.49,"displayMid":1374.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Ex y top 36 in the country, you'd get eight dishes. If you made top eight, you'd get twelve dishes."},{"id":"188","start":1482.37,"end":1487.87,"displayStart":1482.37,"displayEnd":1487.87,"displayMid":1485.12,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.862252,"pitch":23.181406,"speechRate":5.451,"hasEvents":false,"sentence_source":"因为在那么小的一个年龄里面 你就知道什么是竞争 什么是不尽责退。","sentence_en":"Because at such a young age, you learn what competition is and what it means to fall behind if you don't keep up."},{"id":"189","start":1487.87,"end":1493.15,"displayStart":1487.87,"displayEnd":1493.15,"displayMid":1490.51,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.927512,"pitch":22.363924,"speechRate":6.567,"hasEvents":false,"sentence_source":"那在你的寝室里面 我们可能有4个人 6个人，每一年都有退役的转业的回家的。","sentence_en":"In your dorm, there might be four or six people. Every year, some retire, change careers, or go home."},{"id":"190","start":1493.15,"end":1496.23,"displayStart":1493.15,"displayEnd":1496.23,"displayMid":1494.69,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":1.004563,"pitch":24.512398,"speechRate":5.753,"hasEvents":false,"sentence_source":"那你能留下的永远都是能坚持到最后的。","sentence_en":"Those who stay are always the ones who persist to the end."},{"id":"191","start":1496.23,"end":1501.63,"displayStart":1496.23,"displayEnd":1501.63,"displayMid":1498.93,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.798969,"pitch":22.123146,"speechRate":6.767,"hasEvents":false,"sentence_source":"所以我觉得在这种环境里面 你已经习惯了，透气的时候 我认为我的团队就是我的家人。","sentence_en":"So I think in this environment, you get used to it. In my downtime, I consider my team my family."},{"id":"192","start":1501.63,"end":1503.77,"displayStart":1501.63,"displayEnd":1503.77,"displayMid":1502.7,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.012467,"pitch":22.679947,"speechRate":6.593,"hasEvents":false,"sentence_source":"其实我们在场上是竞争对手。","sentence_en":"Actually, on the field, we are competitors."},{"id":"193","start":1503.77,"end":1507.41,"displayStart":1503.77,"displayEnd":1507.41,"displayMid":1505.5900000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.891512,"pitch":22.232395,"speechRate":5.908,"hasEvents":false,"sentence_source":"但是平时在生活里面 我们24个小时待在一起。","sentence_en":"But in daily life, we spend 24 hours together."},{"id":"194","start":1507.41,"end":1510.77,"displayStart":1507.41,"displayEnd":1510.77,"displayMid":1509.0900000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.932995,"pitch":23.220419,"speechRate":6.791,"hasEvents":false,"sentence_source":"我们在待在一起的时间比家人多的多的多的多。","sentence_en":"We spend far more time together than with our families."},{"id":"195","start":1510.77,"end":1524.09,"displayStart":1510.77,"displayEnd":1524.09,"displayMid":1517.4299999999998,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.887282,"pitch":21.164091,"speechRate":5.405,"hasEvents":false,"sentence_source":"所以我觉得这种环境 你可能在场上大家看着是很残酷的，第一只有一名 可是在运动队里每一天的生活中，有教练、队友 还有按摩室整个领队，他们会为这整个队的成绩去努力。","sentence_en":"So I think this environment may seem harsh to outsiders—only one first place—but in the team's daily life, coaches, teammates, and even the massage room staff and team leaders all work hard for the team's results."},{"id":"196","start":1524.09,"end":1529.31,"displayStart":1524.09,"displayEnd":1529.31,"displayMid":1526.6999999999998,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.884838,"pitch":23.972929,"speechRate":6.64,"hasEvents":false,"sentence_source":"你是会很感动的 然后你会觉得你自己有责任，但当的去在这场比赛中去比得好。","sentence_en":"You get really moved, and you feel a sense of responsibility to perform well in the competition."},{"id":"197","start":1529.31,"end":1539.41,"displayStart":1529.31,"displayEnd":1539.41,"displayMid":1534.3600000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.899435,"pitch":23.843716,"speechRate":6.132,"hasEvents":false,"sentence_source":"其实我现在很怀念 就是因为速度还没场地，刚才我也说了很大 每一次比完赛的时候 风非常的快，你能看见风声 然后全场所有的观众会给你致意。","sentence_en":"Actually, I miss it a lot. Because of the speed and the venue—as I said, it's huge—every time after a competition, the wind is so fast, you can see the wind, and the entire audience pays tribute to you."},{"id":"198","start":1539.41,"end":1544.49,"displayStart":1539.41,"displayEnd":1544.49,"displayMid":1541.95,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.8,"loudness":0.800863,"pitch":20.50839,"speechRate":5.755,"hasEvents":false,"sentence_source":"会给你着手、会给你鼓掌，无论你是输是赢，他们都会很尊重你那一刻。","sentence_en":"They wave to you, applaud you. Whether you win or lose, they respect you in that moment."},{"id":"199","start":1544.57,"end":1555.19,"displayStart":1544.57,"displayEnd":1555.19,"displayMid":1549.88,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.81242,"pitch":21.541334,"speechRate":5.179,"hasEvents":false,"sentence_source":"但是我发现当我退役之后，放下冰刀的那一刻期，我就再也没有这样的机会，能面向全世界的粉丝去质疑，去向他们白手这样的机会了。","sentence_en":"But I found that after I retired, the moment I put down my skates, I never had that chance again to face fans all over the world, to greet them, to wave to them."},{"id":"200","start":1555.31,"end":1557.97,"displayStart":1555.31,"displayEnd":1557.97,"displayMid":1556.6399999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.873056,"pitch":21.902037,"speechRate":6.166,"hasEvents":false,"sentence_source":"所以还是很怀念腾丁当运动员的时刻。","sentence_en":"So I really miss the time when I was an athlete."},{"id":"201","start":1558.87,"end":1565.91,"displayStart":1558.87,"displayEnd":1565.91,"displayMid":1562.3899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Retirement transition and career development","sentiment_en":"Neutral","score":0,"loudness":1.207138,"pitch":27.613842,"speechRate":4.846,"hasEvents":true,"sentence_source":"我发现每一个天才运动员在他小时候，身边一定有一个非常热爱运动的爸或妈。","sentence_en":"I've noticed that every gifted athlete had a parent who was really into sports when they were young."},{"id":"202","start":1565.91,"end":1581.61,"displayStart":1565.91,"displayEnd":1581.61,"displayMid":1573.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Retirement transition and career development","sentiment_en":"Neutral","score":0,"loudness":1.084347,"pitch":24.218273,"speechRate":4.713,"hasEvents":false,"sentence_source":"我采访过那么多的运动员 几乎都会讲述相同的童年场景，就是天蒙蒙亮当爸的或当妈的 员，我当时想都没想 我就觉得 华冰多好呀 不用考试了。","sentence_en":"Because figure skating meant giving up most studies to become a pro. Without a second thought, I thought: figure skating is great, no exams!"},{"id":"284","start":2000.83,"end":2004.23,"displayStart":2000.83,"displayEnd":2004.23,"displayMid":2002.53,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Positive","score":0.4,"loudness":1.173379,"pitch":29.860701,"speechRate":7.607,"hasEvents":false,"sentence_source":"因为那个时候 我在全国少年的比赛 我是能拿到前八名的。","sentence_en":"Because back then, I could place in the top eight at national junior competitions."},{"id":"285","start":2004.23,"end":2006.95,"displayStart":2004.23,"displayEnd":2006.95,"displayMid":2005.5900000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.06075,"pitch":26.807791,"speechRate":6.733,"hasEvents":false,"sentence_source":"那我在班纪里可能也就是中上等的水平。","sentence_en":"But in my class, I was probably just above average."},{"id":"286","start":2006.95,"end":2013.97,"displayStart":2006.95,"displayEnd":2013.97,"displayMid":2010.46,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.3,"loudness":1.042127,"pitch":26.360441,"speechRate":5.527,"hasEvents":false,"sentence_source":"我们班可能有六七十人 那我的考试最多也就是二十多名，我说 那这个跟全国比 那算什么。","sentence_en":"Our class had 60-70 students, I ranked around 20th. Compared to national rankings, that's nothing."},{"id":"287","start":2013.97,"end":2026.81,"displayStart":2013.97,"displayEnd":2026.81,"displayMid":2020.3899999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.888915, ive them to you?"},{"id":"299","start":2089.41,"end":2098.49,"displayStart":2089.41,"displayEnd":2098.49,"displayMid":2093.95,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.878175,"pitch":22.644943,"speechRate":6.671,"hasEvents":true,"sentence_source":"刚进队的时候 你没有成绩的时候 你是什么都没有的，刚才餐厅我只是说了一部分，刚进队你要吃四个菜 但是你的装备都是取决于你的成绩。","sentence_en":"When you first join with no results, you have nothing. I only partly mentioned the cafeteria. You get four dishes, but your gear depends on your results."},{"id":"300","start":2098.49,"end":2103.97,"displayStart":2098.49,"displayEnd":2103.97,"displayMid":2101.2299999999996,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Neutral","score":0,"loudness":0.908733,"pitch":22.434011,"speechRate":5.859,"hasEvents":true,"sentence_source":"当你能拿到全国冬云会或者是全国大型比赛的资格的时候，队里才会给。","sentence_en":"Only when you qualify for the National Winter Games or major national competitions will the team provide them."},{"id":"301","start":2103.97,"end":2104.79,"displayStart":2103.97,"displayEnd":2104.79,"displayMid":2104.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Youth growth and competitive pressure","sentiment_en":"Neutral","score":0,"loudness":0.634643,"pitch":19.767797,"speechRate":4.878,"hasEvents":false,"sentence_source":"你发装备。","sentence_en":"They issue equipment."},{"id":"302","start":2104.79,"end":2105.83,"displayStart":2104.79,"displayEnd":2105.83,"displayMid":2105.31,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Youth growth and competitive pressure","sentiment_en":"Negative","score":-0.6,"loudness":0.635557,"pitch":24.41468,"speechRate":4.545,"hasEvents":false,"sentence_source":"很残酷的。","sentence_en":"It's very harsh."},{"id":"303 art":2207.67,"displayEnd":2221.33,"displayMid":2214.5,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.819175,"pitch":22.658781,"speechRate":4.978,"hasEvents":false,"sentence_source":"我其实认为最现在的这个社会来讲确实是个好事情，运动场上可以让他们至少去学会，怎么让去有尊严的输和去面对失败，并不是去学怎么去赢 而是认真地去面对。","sentence_en":"I actually think in today's society, it is a good thing. On the sports field, they can at least learn how to lose with dignity and face failure. It's not about learning how to win, but about facing it seriously."},{"id":"323","start":2221.33,"end":2227.63,"displayStart":2221.33,"displayEnd":2227.63,"displayMid":2224.48,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.815176,"pitch":23.157064,"speechRate":6.326,"hasEvents":false,"sentence_source":"正确地面对失败 我觉得这个是人生中的毕竟之路吧，无论是各行各业都是要有这样的体验的。","sentence_en":"Facing failure correctly. I think this is an inevitable path in life. No matter the profession, one needs this experience."},{"id":"324","start":2227.63,"end":2235.53,"displayStart":2227.63,"displayEnd":2235.53,"displayMid":2231.58,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.992276,"pitch":22.310331,"speechRate":5.729,"hasEvents":false,"sentence_source":"对你来说 你什么时候第一次学会面对失败，第一次面对失败的时候 就是有几次机会我没有能选到国家队。","sentence_en":"For you, when did you first learn to face failure? The first time I faced failure was when I had several opportunities but didn't get selected for the national team."},{"id":"325","start":2235.53,"end":2237.73,"displayStart":2235.53,"displayEnd":2237.73,"displayMid":2236.63,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Neutral","score":0,"loudness":1.140706,"pitch":27.58061,"speechRate":7.008,"hasEvents":false,"sentence_source":"我们都参加了一个很大的集训。","sentence_en":"We all participated in a large training camp."},{"id":"326","start":2237.73,"end":2240.83,"displayStart":2237.73,"displayEnd":2240.83,"displayMid":2239.2799999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.895583,"pitch":20.938204,"speechRate":6.129,"hasEvents":false,"sentence_source":"但是只有少部分的人去被选到国家青年队了。","sentence_en":"But only a few people were selected for the national youth team."},{"id":"327","start":2240.83,"end":2250.11,"displayStart":2240.83,"displayEnd":2250.11,"displayMid":2245.4700000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.880545,"pitch":20.974321,"speechRate":6.263,"hasEvents":false,"sentence_source":"那个时候是我第一次梦想破灭，但最后呢 其实我是知道它并不是因为我表现不好，是因为当时我们哈尔滨适队的一个教练，他刚刚接手女队。","sentence_en":"That was the first time my dream was shattered. But in the end, I actually knew it wasn't because I performed poorly. It was because a coach from our Harbin team had just taken over the women's team."},{"id":"328","start":2250.11,"end":2262.79,"displayStart":2250.11,"displayEnd":2262.79,"displayMid":2256.45,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Neutral","score":0,"loudness":0.869599,"pitch":21.649035,"speechRate":6.258,"hasEvents":false,"sentence_source":"然后那个时候因为新老交替嘛，就是老队员退役了，我是当时华冰的这个成绩最好的，他希望我能留下来去带下一批的年轻队员，是他没同意让我上国家队，这个事情是我很多年之后知道的。","sentence_en":"Back then, due to the transition between generations, the veterans retired. I was the best performer on the Chinese short track team at that time. He 的这种大强度的训练，加上韩教那时候打我们打你们，打我们 她真的打了我一年多，她那个时候每天训练要拿着两个东西，一个是秤 一个是冰球杆，这冰球杆可能大家不了解的。","sentence_en":"After over a year of intense training, plus the Korean coach hitting us—she really hit me for over a year. She'd bring two things to training every day: a scale and a hockey stick. Maybe you don't know about hockey sticks."},{"id":"337","start":2301.77,"end":2303.75,"displayStart":2301.77,"displayEnd":2303.75,"displayMid":2302.76,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.825776,"pitch":21.801258,"speechRate":7.576,"hasEvents":false,"sentence_source":"可能就是这个像石木都脱不赶一样。","sentence_en":"Maybe it's like a solid wood stick—not comparable."},{"id":"338","start":2303.75,"end":2306.37,"displayStart":2303.75,"displayEnd":2306.37,"displayMid":2305.06,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.990092,"pitch":25.328478,"speechRate":7.771,"hasEvents":false,"sentence_source":"因为最早的冰球杆是石木的 现在是碳纤维的。","sentence_en":"Because the earliest hockey sticks were made of solid wood, now they're carbon fiber."},{"id":"339","start":2306.37,"end":2312.23,"displayStart":2306.37,"displayEnd":2312.23,"displayMid":2309.3,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.949991,"pitch":22.845192,"speechRate":5.634,"hasEvents":true,"sentence_source":"那他干嘛用呢 他让我们减肥，他说这个韩国的队员长距离都很好 你必须得瘦。","sentence_en":"What did he use it for? He made us lose weight. He said Korean skaters are good at long distances, so you have to be thin."},{"id":"340","start":2312.69,"end":2313.99,"displayStart":2312.69,"displayEnd":2313.99,"displayMid":2313.34,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.185069,"pitch":28.711958,"speechRate":8.23,"hasEvents":true,"sentence_source":"所以呢 他就每天拿着秤。","sentence_en":"So he carried a scale every day."},{"id":"341","start":2313.99,"end":2316.19,"displayStart":2313.99,"displayEnd":2316.19,"displayMid":2315.09,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.017842,"pitch":25.394262,"speechRate":6.818,"hasEvents":false,"sentence_source":"然后那个时候男生处处训练的时候。","sentence_en":"And when the boys were training,"},{"id":"342","start":2316.19,"end":2328.81,"displayStart":2316.19,"displayEnd":2328.81,"displayMid":2322.5,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.8203,"pitch":23.027771,"speechRate":6.022,"hasEvents":false,"sentence_source":"我们女生要比男生更提早 一个小时出来，在哈尔滨的夏天 大腿上缠着保鲜膜 腰上 然后包括手臂上，外面还要穿着羽绒服 先跑一个8000米，男孩训练的时候 我们正常训练 男孩走了。","sentence_en":"We girls had to come out an hour earlier than the boys. In the summer in Harbin, we wrapped plastic wrap around our thighs, waist, and arms, then put on down jackets, and ran 8,000 meters first. While the boys trained, we trained normally. After the boys left,"},{"id":"343","start":2328.81,"end":2331.41,"displayStart":2328.81,"displayEnd":2331.41,"displayMid":2330.1099999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.673562,"pitch":17.197485,"speechRate":7.08,"hasEvents":false,"sentence_source":"你还要再穿着羽绒服 再跑8000米。","sentence_en":"We had to put the down jackets back on and run another 8,000 meters."},{"id":"344","start":2331.41,"end":2336.53,"displayStart":2331.41,"displayEnd":2336.53,"displayMid":2333.9700000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.909924,"pitch":22.450626,"speechRate":5.794,"hasEvents":false,"sentence_source":"那个时候从早上5点半练到晚上10点多，就是我们几个重点的女生。","sentence_en":"Back then we trained from 5:30 AM to over 10 PM—just a few of us key female skaters."},{"id":"345","start":2336.53,"end":2351.29,"displayStart":2336.53,"displayEnd":2351.29,"displayMid":2343.91,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.807917,"pitch":20.258808,"speechRate":5.618,"hasEvents":false,"sentence_source":"然后她要求你今天脱水的状态，腰这个蹭的体重，跟她第二天早上来的时候是一样的，这个时候你还有两顿饭没有吃，而且你整个人是脱水的状态，如果你胖了，好 那就冰修膏就用上了，她是真的打。","sentence_en":"She demanded that you be dehydrated, and your weight—this measured by the scale—must match her check the next morning. By then you'd skipped two meals and were dehydrated. If you'd gained weight, then the hockey stick came out. She really hit."},{"id":"346","start":2351.29,"end":2363.11,"displayStart":2351.29,"displayEnd":2363.11,"displayMid":2357.2,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.869631,"pitch":20.851086,"speechRate":5.194,"hasEvents":false,"sentence_source":"就是我基本上三天不爱打，第四天肯定会早刀来打，给我打的就每天都在这个哭啊，害怕呀 不敢吃东西的这个状态，大约得有半年的时间我不懂。","sentence_en":"Basically, if I didn't get hit for three days, on the fourth day the blade would come for me. I was crying every day, scared, afraid to eat. This lasted about half a year—I didn't understand."},{"id":"347","start":2363.11,"end":2371.83,"displayStart":2363.11,"displayEnd":2371.83,"displayMid":2367.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.985878,"pitch":25.456446,"speechRate":5.046,"hasEvents":true,"sentence_source":"他这个打是一种仪式性的、象征性的，说，你胖了啊 我拿这个球杆拍你一下，还是会让你觉得很疼的、真的。","sentence_en":"His hitting was ritualistic, symbolic. He'd say 'You gained weight' and tap you with the stick—but it still hurt. Really."},{"id":"348","start":2372.45,"end":2385.11,"displayStart":2372.45,"displayEnd":2385.11,"displayMid":2378.7799999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.904959,"pitch":23.156567,"speechRate":6.031,"hasEvents":true,"sentence_source":"举个例子吧，就是在冰上 我们四个女生，没有按她的标准滑下来，她就让我们聚在那儿，用冰球杆去打你的屁股，她有一下就打在了我的队友的大腿上，就是打歪了，她当时跪在这个冰上。","sentence_en":"For example, on the ice, four of us girls didn't skate up to her standard. She made us gather and hit our butts with the hockey stick. One time she hit my teammate's thigh—missed the target. That teammate was kneeling on the ice."},{"id":"349","start":2385.11,"end":2393.15,"displayStart":2385.11,"displayEnd":2393.15,"displayMid":2389.13,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.963801,"pitch":19.952658,"speechRate":4.103,"hasEvents":false,"sentence_source":"她的大腿后侧，大概有两个手掌这么大，紫黑的40天才下去，天呐 这是体罚呀。","sentence_en":"On the back of her thigh, there was a bruise the size of two palms, purple-black, and it took 40 days to fade. Gosh, that was corporal punishment."},{"id":"350","start":2393.15,"end":2399.91,"displayStart":2393.15,"displayEnd":2399.91,"displayMid":2396.5299999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.756854,"pitch":20.703165,"speechRate":5.952,"hasEvents":false,"sentence_source":"是的 但是当时我们是50多个人 最后坚持着就剩10个人，他真的打 在那个时候我是不理解的。","sentence_en":"Yes, but back then we started with over 50 people, and only 10 persisted. He really hit—at that time I didn't understand."},{"id":"351","start":2399.91,"end":2404.51,"displayStart":2399.91,"displayEnd":2404.51,"displayMid":2402.21,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.896679,"pitch":23.582163,"speechRate":5.834,"hasEvents":false,"sentence_source":"因为就是打人嘛 他肯定是一种不合规的这种训练方法手段。","sentence_en":"Because hitting people is definitely an irregular training method."},{"id":"352","start":2404.51,"end":2416.55,"displayStart":2404.51,"displayEnd":2416.55,"displayMid":2410.53,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.86245,"pitch":20.793596,"speechRate":6.038,"hasEvents":false,"sentence_source":"但是现在我能理解是因为他只有一年半的时间，他必须在你最短的时间内把你们的能力练上来，才有可能去跟国家队的或者跟其他的选手去抗衡，他是真的打 所以我才害怕。","sentence_en":"But now I understand: he only had a year and a half. He had to build our abilities in the shortest time possible, so we could compete with national team members or other skaters. He really hit, so I was scared."},{"id":"353","start":2416.55,"end":2427.53,"displayStart":2416.55,"displayEnd":2427.53,"displayMid":2422.04,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.837703,"pitch":21.555868,"speechRate":5.792,"hasEvents":false,"sentence_source":"所以我才会往死了减肥 有的时候一天只喝着水吃一个鸡蛋，我连粥都不敢喝 就是因为会胖，最后我发现我的身体开始出现了问题 别人起诉我跟不上。","sentence_en":"So I dieted desperately, sometimes just water and one egg a day, afraid even of porridge because it would make me fat. Eventually, my body broke down—I couldn't keep up with others."},{"id":"354","start":2427.53,"end":2438.07,"displayStart":2427.53,"displayEnd":2438.07,"displayMid":2432.8,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.868026,"pitch":20.567387,"speechRate":6.357,"hasEvents":false,"sentence_source":"别人跑步我也跟不上 但那个时候并没有很好的科学的跟踪，比如说胜利生化的指标检测 当我发现的时候已经晚了，就是我最长的时间有11个月没有胜利周期。","sentence_en":"I couldn't keep up running either, but there was no scientific monitoring then, like blood tests. When I found out, it was too late—I had no period for 11 months at most."},{"id":"355","start":2438.55,"end":2450.91,"displayStart":2438.55,"displayEnd":2450.91,"displayMid":2444.73,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.7,"loudness":0.98041,"pitch":23.751854,"speechRate":5.453,"hasEvents":false,"sentence_source":"然后我父母带了我去看了所有的医院 中医西医，终于就说这个孩子长期的营养不良和受惊吓，导致他失去的比如说这个胜利周期或者其他的一些女性特征。","sentence_en":"Then my parents took me to every hospital, both Chinese and Western medicine. Finally they said long-term malnutrition and stress caused me to lose things like my menstrual cycle and other female characteristics."},{"id":"356","start":2450.91,"end":2463.11,"displayStart":2450.91,"displayEnd":2463.11,"displayMid":2457.01,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.90228,"pitch":21.602072,"speechRate":6.15,"hasEvents":false,"sentence_source":"那我们也不知道他什么时候能好，可能他一辈子就这个样子了，西伊呢说正常就是人的有11项胜利指标，比如有什么什么血红蛋白白细胞这个大家都知道，我11项低于长人。","sentence_en":"They didn't know when I'd recover, maybe forever. Western medicine said normal people have 11 physiological indicators—like hemoglobin, white blood cells, everyone knows. All 11 of mine were below normal."},{"id":"357","start":2463.11,"end":2467.23,"displayStart":2463.11,"displayEnd":2467.23,"displayMid":2465.17,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.865428,"pitch":22.841866,"speechRate":5.45,"hasEvents":false,"sentence_source":"然后就要打激素，激素是这个运动员最不能用的。","sentence_en":"Then I needed hormone injections, but hormones are the last thing an athlete should use."},{"id":"358","start":2467.23,"end":2469.11,"displayStart":2467.23,"displayEnd":2469.11,"displayMid":2468.17,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.880335,"pitch":27.346632,"speechRate":6.452,"hasEvents":false,"sentence_source":"因为他是性分剂的一种对呀。","sentence_en":"Because it's a type of doping, right."},{"id":"359","start":2469.11,"end":2475.37,"displayStart":2469.11,"displayEnd":2475.37,"displayMid":2472.24,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.883066,"pitch":26.21596,"speechRate":5.431,"hasEvents":false,"sentence_source":"所以呢我妈妈就说咱别练了，他说:\"我希望你能当一个正常人，也不要去拿什么冠军。","sentence_en":"So my mom said, 'Let's stop training. I want you to be a normal person, not a champion."},{"id":"360","start":2475.45,"end":2479.49,"displayStart":2475.45,"displayEnd":2479.49,"displayMid":2477.47,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.903575,"pitch":27.173351,"speechRate":7.178,"hasEvents":true,"sentence_source":"那些东西就是咱们可以都放弃了，但是我希望你能做一个正常的女孩。","sentence_en":"We can give all that up, but I hope you can be a normal girl."},{"id":"361","start":2480.17,"end":2487.83,"displayStart":2480.17,"displayEnd":2487.83,"displayMid":2484,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.939455,"pitch":26.614105,"speechRate":6.716,"hasEvents":true,"sentence_source":"但是就在那个时候，就是我还穿着没有放假的时候，在家跳绳，在锻炼，我恨自己，就是为什么我没有能达到韩教的这个要求。","sentence_en":"But at that moment, while I was still on break, jumping rope at home to exercise, I hated myself for not meeting Coach Han's requirements."},{"id":"362","start":2488.37,"end":2496.59,"displayStart":2488.37,"displayEnd":2496.59,"displayMid":2492.48,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.927398,"pitch":23.439411,"speechRate":6.467,"hasEvents":true,"sentence_source":"然后呢，第二年韩教走了那一刻，后来我也没有接受很好的治疗，因为没有好的治疗方式，所以那个时候我就跟我妈妈说我不治了。","sentence_en":"Then the next year, when the Korean coach left, I didn't get good treatment because there was no good method. So I told my mom I wouldn't treat it anymore."},{"id":"363","start":2496.59,"end":2499.05,"displayStart":2496.59,"displayEnd":2499.05,"displayMid":2497.82,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.904851,"pitch":24.888321,"speechRate":5.652,"hasEvents":false,"sentence_source":"他就是因为不让我吃我生的病。","sentence_en":"It was because he didn't let me eat that I got sick."},{"id":"364","start":2499.05,"end":2500.63,"displayStart":2499.05,"displayEnd":2500.63,"displayMid":2499.84,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Positive","score":0.3,"loudness":0.901436,"pitch":14.284877,"speechRate":4.43,"hasEvents":false,"sentence_source":"那我就吃回来嘛。","sentence_en":"So I'll eat my way back."},{"id":"365","start":2500.63,"end":2507.07,"displayStart":2500.63,"displayEnd":2507.07,"displayMid":2503.8500000000004,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Neutral","score":0,"loudness":0.801418,"pitch":25.052326,"speechRate":6.645,"hasEvents":false,"sentence_source":"所以在放假那一个月我胖了三十斤，就是如果让一个正常人在一个月胖了三十斤，他是胖不上的。","sentence_en":"So in that one month off, I gained 15 kg. A normal person can't gain that much in a month."},{"id":"366","start":2507.07,"end":2515.11,"displayStart":2507.07,"displayEnd":2515.11,"displayMid":2511.09,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.844006,"pitch":23.281363,"speechRate":6.335,"hasEvents":false,"sentence_source":"那个时候我妈妈每天给我做一锅粥或者一锅面条，我能一直把它吃 我吃不饱的，就是我每天能一直吃东西 我吃不饱的。","sentence_en":"Back then, my mom made a pot of porridge or noodles every day. I could eat it all but never feel full—I could eat constantly and never be satisfied."},{"id":"367","start":2515.11,"end":2518.39,"displayStart":2515.11,"displayEnd":2518.39,"displayMid":2516.75,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.896786,"pitch":28.628422,"speechRate":6.159,"hasEvents":false,"sentence_source":"因为那个时候就身体里是严重严重缺营养的。","sentence_en":"Because my body was severely malnourished."},{"id":"368","start":2518.39,"end":2529.35,"displayStart":2518.39,"displayEnd":2529.35,"displayMid":2523.87,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.75366,"pitch":21.037313,"speechRate":5.676,"hasEvents":false,"sentence_source":"然后后来导致了我有可能四五年的时间，我有两个事情是让我很抗拒的，一个是谁说 比如说张虹这吃苹果减肥，我就专门不吃苹果就吃那个胖的。","sentence_en":"Later, for maybe four or five years, there were two things I strongly resisted. One: if anyone said, like, 'Zhang Hong lost weight by eating apples,' I'd deliberately not eat apples and eat what makes you fat."},{"id":"369","start":2529.35,"end":2540.23,"displayStart":2529.35,"displayEnd":2540.23,"displayMid":2534.79,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.790356,"pitch":21.881001,"speechRate":6.352,"hasEvents":false,"sentence_source":"谁要说减肥这两个字 就是不可能在我身上再发生了，就成今我为这个减肥 我挨了那么多次打 挨了那么多次罚，有的时候我恨不得给喊叫跪下 他还让我继续去训练。","sentence_en":"If anyone mentioned 'diet,' it could never happen to me again. Because of dieting, I was hit and punished so many times. Sometimes I'd get down on my knees and plead, but he still made me train."},{"id":"370","start":2540.63,"end":2552.73,"displayStart":2540.63,"displayEnd":2552.73,"displayMid":2546.6800000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.881336,"pitch":24.501272,"speechRate":6.163,"hasEvents":false,"sentence_source":"第二个就是打 后来改相就是我队友有的时候跟我开玩笑，他会碰我一下肩膀 这是很正常的会拽一下胳膊，就谁碰我 我会非常抗拒，就是那个时候我基本上从头到脚都被他打过。","sentence_en":"Second was physical contact. Later, even when teammates joked and touched my shoulder or arm, I'd feel very resistant. Because back then, I was beaten all over by him."},{"id":"371","start":2552.73,"end":2568.17,"displayStart":2552.73,"displayEnd":2568.17,"displayMid":2560.45,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Family Support and Athletic Growth","sentiment_en":"Positive","score":0.5,"loudness":0.802041,"pitch":20.857916,"speechRate":5.159,"hasEvents":false,"sentence_ ingle lap is something that no bag or fancy outfit can replace."},{"id":"434","start":2975.21,"end":2980.67,"displayStart":2975.21,"displayEnd":2980.67,"displayMid":2977.94,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.788803,"pitch":19.873001,"speechRate":6.22,"hasEvents":false,"sentence_source":"我会在训练日记中写上 今天我花了36秒积极，是我历史上花的最快的一次。","sentence_en":"I'll write in my training log that today I took 36 seconds to be active, the fastest I've ever done."},{"id":"435","start":2980.67,"end":2992.65,"displayStart":2980.67,"displayEnd":2992.65,"displayMid":2986.66,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.755292,"pitch":18.841837,"speechRate":5.342,"hasEvents":false,"sentence_source":"我觉得这种喜悦、这种存在感，不是在比赛中去赢别人，而是你去超越自己的这种成就感，是非常有价值和非常值得的，每四年一次奥运会、每一年一次试景赛。","sentence_en":"I feel this joy, this sense of presence, isn't about beating others in competition, but the achievement of surpassing yourself. It's very valuable and worthwhile. Every four years there's the Olympics, every year a test event."},{"id":"436","start":2992.65,"end":2997.53,"displayStart":2992.65,"displayEnd":2997.53,"displayMid":2995.09,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.866285,"pitch":23.854012,"speechRate":5.738,"hasEvents":false,"sentence_source":"然后每四年一次全国冬云会，它是非常有节奏、有周期性的这种生活。","sentence_en":"Then every four years there's the National Winter Games. It's a very rhythmic, cyclical life."},{"id":"437","start":2997.53,"end":3006.57,"displayStart":2997.53,"displayEnd":3006.57,"displayMid":3002.05,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.879605,"pitch":28.969341,"speechRate":6.202,"hasEvents":false,"sentence_source":"所以你不会感觉到枯燥，你总是在有目标，可能是明天要练力量了，你有一个目标，后天要练速度的你有目标 他每天都很有目标感。","sentence_en":"So you never feel bored. You always have a goal. Maybe tomorrow you train strength—you have a goal. The day after, you train speed—you have a goal. Every day feels purposeful."},{"id":"438","start":3006.57,"end":3016.81,"displayStart":3006.57,"displayEnd":3016.81,"displayMid":3011.69,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.869532,"pitch":23.979177,"speechRate":6.406,"hasEvents":false,"sentence_source":"我觉得这个是让我当运动员的时候 很幸福的事情 就是每天都有盼头，不像我退役了之后 可能一直在学习啊 前三年也很迷茫 就是不知道我在为了什么。","sentence_en":"I think this is what made me happy as an athlete—having something to look forward to every day. Unlike after I retired, when I kept studying and felt lost for the first three years, not knowing what I was working for."},{"id":"439","start":3016.81,"end":3023.33,"displayStart":3016.81,"displayEnd":3023.33,"displayMid":3020.0699999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.877039,"pitch":23.539259,"speechRate":7.102,"hasEvents":false,"sentence_source":"但是我觉得当运动员的时候 你是每天都会知道你为了什么，尤其当你踏上国家队那一刻 你就更有目标。","sentence_en":"But as an athlete, you know every day what you're working for. Especially the moment you step onto the national team, you have even more purpose."},{"id":"440","start":3023.33,"end":3028.55,"displayStart":3023.33,"displayEnd":3028.55,"displayMid":3025.94,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0 egative","score":-0.4,"loudness":1.015864,"pitch":27.162872,"speechRate":5.908,"hasEvents":false,"sentence_source":"他其实非常非常像当下很多人的困境，想卖出一步又不敢，万一呢?","sentence_en":"It's really, really similar to the dilemma many people face today—wanting to take a step forward but not daring to. What if?"},{"id":"456","start":3121.69,"end":3122.97,"displayStart":3121.69,"displayEnd":3122.97,"displayMid":3122.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.519951,"pitch":19.605753,"speechRate":3.937,"hasEvents":false,"sentence_source":"是，当时我们。","sentence_en":"Yes, back then we"},{"id":"457","start":3122.97,"end":3127.41,"displayStart":3122.97,"displayEnd":3127.41,"displayMid":3125.1899999999996,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.830307,"pitch":24.879894,"speechRate":5.349,"hasEvents":false,"sentence_source":"改向的时候，我们会要在高速公路上骑自行车去滑轮滑。","sentence_en":"when we switched disciplines, we would ride bicycles on the highway to practice roller skating."},{"id":"458","start":3127.81,"end":3130.01,"displayStart":3127.81,"displayEnd":3130.01,"displayMid":3128.91,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.854201,"pitch":29.30801,"speechRate":8.443,"hasEvents":false,"sentence_source":"那个时候我们是一个人跟着一个人的。","sentence_en":"At that time, we followed one after another."},{"id":"459","start":3130.33,"end":3134.31,"displayStart":3130.33,"displayEnd":3134.31,"displayMid":3132.3199999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":1.04006,"pitch":28.322353,"sp t let me in, I don't even have a chance to choose. The road ahead is daunting."},{"id":"471","start":3198.05,"end":3210.65,"displayStart":3198.05,"displayEnd":3210.65,"displayMid":3204.3500000000004,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.4,"loudness":0.826562,"pitch":23.090136,"speechRate":5.317,"hasEvents":false,"sentence_source":"去创造机会了 比如说我后来学英语吧，我从30岁推计开始学英语 基本上从零开始，我当时真的鲁豫节 我非常的纠结，我说为什么要让我干这个活 上小学上中学。","sentence_en":"Create opportunities. For example, I started learning English at around 30, basically from scratch. I was really torn: why did I have to do this? In elementary and middle school..."},{"id":"472","start":3210.65,"end":3212.87,"displayStart":3210.65,"displayEnd":3212.87,"displayMid":3211.76,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.5,"loudness":0.760746,"pitch":27.34996,"speechRate":6.757,"hasEvents":false,"sentence_source":"我最不愿意学的一堂课就是英语课。","sentence_en":"The class I least wanted to take was English."},{"id":"473","start":3212.87,"end":3215.65,"displayStart":3212.87,"displayEnd":3215.65,"displayMid":3214.26,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.8926,"pitch":27.527391,"speechRate":8.678,"hasEvents":false,"sentence_source":"因为那个时候我每天要训练 我没有时间去备英语。","sentence_en":"Because at that time I had to train every day, I had no time to prepare for English."},{"id":"474","start":3215.65,"end":3218.85,"displayStart":3215.65,"displayEnd":3218.85,"displayMid":3217.25,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":1.071734,"pitch":26.036922,"speechRate":7.059,"hasEvents":false,"sentence_source":"但是其他的这个小朋友 他们都是课外班学完之后。","sentence_en":"But other kids learned it in after-school classes."},{"id":"475","start":3218.85,"end":3222.33,"displayStart":3218.85,"displayEnd":3222.33,"displayMid":3220.59,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.877286,"pitch":25.806942,"speechRate":7.773,"hasEvents":false,"sentence_source":"然后在课堂上 我们那一个英语老师一堂课要讲五节课的内容。","sentence_en":"And in class, our English teacher would cover five lessons' worth of content in one class."},{"id":"476","start":3222.33,"end":3233.87,"displayStart":3222.33,"displayEnd":3233.87,"displayMid":3228.1,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.843643,"pitch":23.729172,"speechRate":6.595,"hasEvents":false,"sentence_source":"但是我是没有补课外班的 所以我英语跟不上，从那个时候讲 我说我就要生活在中国 不想出国怎么样的，后来当把这个任务交给我的时候 我意识到了英语是必须要去说好的事情。","sentence_en":"But I didn't take extra classes, so I couldn't keep up. From then on, I said I would live in China, didn't want to go abroad. Later when this task was given to me, I realized English was something I had to speak well."},{"id":"477","start":3233.87,"end":3243.47,"displayStart":3233.87,"displayEnd":3243.47,"displayMid":3238.67,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.809553,"pitch":22.603722,"speechRate":6.852,"hasEvents":false,"sentence_source":"我开始学英语 我30岁的时候坐在这个教室里跟15岁、18岁，就考中考和高考的孩子们一起学英语，每天回家的时候 你想想我做了20年的运动员。","sentence_en":"I started learning English at 30, sitting in a classroom with 15- and 18-year-olds preparing for high school and college entrance exams. When I wen 叫出来 但是所有的发音、语法、拼读我基本上都是从零开始学的。","sentence_en":"Basically I could only say 'my name is Zhang Hong', nothing else. I could recite ABCD, but all pronunciation, grammar, and phonics I learned from scratch."},{"id":"482","start":3267.01,"end":3274.25,"displayStart":3267.01,"displayEnd":3274.25,"displayMid":3270.63,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.5,"loudness":0.769513,"pitch":22.170181,"speechRate":6.916,"hasEvents":false,"sentence_source":"然后我是一个一个一个单词去应记下来的，15岁的孩子可以一天被100个50个 我可能一天只能被10个单词。","sentence_en":"Then I memorized words one by one. 15-year-olds could memorize 100 or 50 words a day; I could only memorize 10 a day."},{"id":"483","start":3274.25,"end":3286.75,"displayStart":3274.25,"displayEnd":3286.75,"displayMid":3280.5,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.3,"loudness":0.807258,"pitch":23.019835,"speechRate":5.608,"hasEvents":false,"sentence_source":"因为我没有学习这个过程，但最后我发现就这个事情如果你不去说你不去做就没有人能做好了，我就逼着自己学，我说做梦的时候被国教委会员问问题，被自己憋醒。","sentence_en":"Because I never went through the learning process. But in the end, I found that if you don't speak and don't do it, no one can do it for you. So I forced myself to learn. I said, 'In my dreams, I was asked questions by the International Skating Federation officials and woke myself up because I couldn't answer."},{"id":"484","start":3286.75,"end":3292.21,"displayStart":3286.75,"displayEnd":3292.21,"displayMid":3289.48,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.848292,"pitch":26.5651,"speechRate":6.044,"hasEvents":false,"sentence_source":"就是这个问题我回答不上来，然后呢，我也会经常看着国教委会给我们发的文件。","sentence_en":"I couldn't answer that question. Also, I would often look at the documents sent to us by the International Skating Federation."},{"id":"485","start":3292.21,"end":3298.59,"displayStart":3292.21,"displayEnd":3298.59,"displayMid":3295.4,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.4,"loudness":0.930979,"pitch":23.294052,"speechRate":6.981,"hasEvents":false,"sentence_source":"因为我看不懂，然后我就看睡着了，睡着我就起来再接着看，就是在那样的环境里面，逼着自己大概三年吧。","sentence_en":"Because I couldn't understand, I'd fall asleep watching, then wake up and keep watching. In that environment, I pushed myself for about three years."},{"id":"486","start":3298.59,"end":3300.93,"displayStart":3298.59,"displayEnd":3300.93,"displayMid":3299.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":1.320126,"pitch":29.831518,"speechRate":6.731,"hasEvents":false,"sentence_source":"对你来说学英语跟华冰哪个更难?","sentence_en":"Which is harder for you: learning English or Hua Bing?"},{"id":"487","start":3301.31,"end":3303.33,"displayStart":3301.31,"displayEnd":3303.33,"displayMid":3302.3199999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Positive","score":0.6,"loudness":0.951954,"pitch":22.814098,"speechRate":5.464,"hasEvents":true,"sentence_source":"哎呀，这是个好问题，哈哈。","sentence_en":"Ah, that's a good question, haha."},{"id":"488","start":3305.16,"end":3307.66,"displayStart":3305.16,"displayEnd":3307.66,"displayMid":3306.41,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.950787,"pitch":24.374054,"speechRate":7.658,"hasEvents":false,"sentence_source":"我觉得这两个事情呢，一个是给自己做的。","sentence_en":"I feel that of these two, one is for yourself."},{"id":"489","start":3307.66,"end":3314.48,"displayStart":3307.66,"displayEnd":3314.48,"displayMid":3311.0699999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Positive","score":0.3,"loudness":0.926093,"pitch":21.95549,"speechRate":4.508,"hasEvents":false,"sentence_source":"因为华冰是你自己要去征战赛场，要去面对赛场 面对对手这么一个事情。","sentence_en":"Because in Hua Bing, you go to compete, to face the arena and your opponents."},{"id":"490","start":3314.48,"end":3327.14,"displayStart":3314.48,"displayEnd":3327.14,"displayMid":3320.81,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Positive","score":0.5,"loudness":0.757293,"pitch":20.975056,"speechRate":5.094,"hasEvents":false,"sentence_source":"但是学英语不是为你自己学，而是为了你的工作 为了中国运动员，为了全球的运动员 为了对得起这八年的国教委会员去学，学英语是你无论如何都要学的。","sentence_en":"But learning English isn't for yourself; it's for your work, for Chinese athletes, for global athletes, to live up to eight years as a member of the national committee. It's something you have to learn no matter what."},{"id":"491","start":3327.14,"end":3330.2,"displayStart":3327.14,"displayEnd":3330.2,"displayMid":3328.67,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.3,"loudness":0.746325,"pitch":24.596853,"speechRate":7.05,"hasEvents":false,"sentence_source":"所以我一直用这种压力来逼着自己学的英语。","sentence_en":"So I've always used that pressure to force myself to learn English."},{"id":"492","start":3330.2,"end":3332.94,"displayStart":3330.2,"displayEnd":3332.94,"displayMid":3331.5699999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educati
