tence_en":"It could be a limp."},{"id":"560","start":3807.98,"end":3814.76,"displayStart":3807.98,"displayEnd":3814.76,"displayMid":3811.37,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.688579,"pitch":20.86153,"speechRate":4.13,"hasEvents":false,"sentence_source":"因为冬天的时候我的右膝、以下、小腿、感知已经很差了，什么叫感知差?","sentence_en":"Because in winter, the sensation in my right knee and below, my calf, is already very poor. What does poor sensation mean?"},{"id":"561","start":3814.86,"end":3817.4,"displayStart":3814.86,"displayEnd":3817.4,"displayMid":3816.13,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.875699,"pitch":24.677795,"speechRate":6.299,"hasEvents":false,"sentence_source":"可能我会经常用我的右脚踢我的左脚。","sentence_en":"I often kick my left foot with my right foot."},{"id":"562","start":3817.4,"end":3821.38,"displayStart":3817.4,"displayEnd":3821.38,"displayMid":3819.3900000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.845345,"pitch":19.809139,"speechRate":5.305,"hasEvents":false,"sentence_source":"然后右脚会经常踩石头上，我就是靠感觉获胜的。","sentence_en":"And my right foot often steps on stones. I win by feel."},{"id":"563","start":3821.38,"end":3831.3,"displayStart":3821.38,"displayEnd":3831.3,"displayMid":3826.34,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.80798,"pitch":19.340418,"speechRate":6.687,"hasEvents":false,"sentence_source":"因为我们冰刀和冰鞋它是有距离的，可以上下左右串动的，它串一个头肤丝的距离我懂得感觉到，这是我状态最好的时候，但这个时候我的脚都经常会踢石头。","sentence_en":"Because there's a gap between the blade and the boot that allows movement in all directions. I can feel even a hair's width of movement—that's when I'm at my best, but then my foot often kicks stones."},{"id":"564","start":3831.3,"end":3837.84,"displayStart":3831.3,"displayEnd":3837.84,"displayMid":3834.57,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.816331,"pitch":23.275345,"speechRate":4.926,"hasEvents":false,"sentence_source":"最严重的有几次在训练的时候做起跑训练，我会左腿踢到右腿上去摔倒。","sentence_en":"At worst, during start practice, I'll kick my right leg with my left and fall."},{"id":"565","start":3837.84,"end":3840.4,"displayStart":3837.84,"displayEnd":3840.4,"displayMid":3839.12,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.842255,"pitch":23.039574,"speechRate":5.647,"hasEvents":false,"sentence_source":"然后把我的脚踝踢得全是血。","sentence_en":"And my ankle ends up covered in blood."},{"id":"566","start":3840.4,"end":3842.66,"displayStart":3840.4,"displayEnd":3842.66,"displayMid":3841.5299999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.625751,"pitch":17.851397,"speechRate":5.467,"hasEvents":false,"sentence_source":"因为它冰刀嘛踢到脚踝上了。","sentence_en":"Because the blade hits my ankle."},{"id":"567","start":3842.66,"end":3844.48,"displayStart":3842.66,"displayEnd":3844.48,"displayMid":3843.5699999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.944658,"pitch":20.984985,"speechRate":6.742,"hasEvents":false,"sentence_source":"然后我就爬起来站着急着跑。","sentence_en":"So I got up, stood, and hurriedly started running."},{"id":"568","start":3844.48,"end":3847.18,"displayStart":3844.48,"displayEnd":3847.18,"displayMid":3845.83,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.953042,"pitch":26.605516,"speechRate":7.661,"hasEvents":false,"sentence_source":"那个时候我的教练后的队员他们结束训练了。","sentence_en":"At that time, my coach and the other team members had finished training."},{"id":"569","start":3847.18,"end":3851,"displayStart":3847.18,"displayEnd":3851,"displayMid":3849.09,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.627165,"pitch":21.068979,"speechRate":4.974,"hasEvents":false,"sentence_source":"然后在冰场外面看着我 很无语，没有人敢劝我。","sentence_en":"They watched me from outside the rink, speechless; no one dared to advise me."},{"id":"570","start":3851,"end":3853.9,"displayStart":3851,"displayEnd":3853.9,"displayMid":3852.45,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.841475,"pitch":21.504642,"speechRate":7.092,"hasEvents":false,"sentence_source":"那个时候也没有人能劝动我，就说张虹你别跑了。","sentence_en":"Back then, no one could persuade me; they just said, 'Zhang Hong, stop running."},{"id":"571","start":3853.9,"end":3858.62,"displayStart":3853.9,"displayEnd":3858.62,"displayMid":3856.26,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.713329,"pitch":24.527269,"speechRate":6.356,"hasEvents":false,"sentence_source":"然后我就一直在跑一直在跑，你的右脚稳定性不好，就是你一落刀的时候。","sentence_en":"And I just kept running and running. Your right foot isn't stable when you land the blade."},{"id":"572","start":3858.62,"end":3864.58,"displayStart":3858.62,"displayEnd":3864.58,"displayMid":3861.6,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.722492,"pitch":23.981232,"speechRate":6.207,"hasEvents":false,"sentence_source":"因为冰刀的刀刃非常窄，它有轻微的一个晃动，就会导致你左腿收腿的时候的方向变了。","sentence_en":"Because the blade edge is very narrow, even a slight wobble changes the direction when you retract your left leg."},{"id":"573","start":3864.58,"end":3876.3,"displayStart":3864.58,"displayEnd":3876.3,"displayMid":3870.44,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.762755,"pitch":21.122343,"speechRate":5.328,"hasEvents":false,"sentence_source":"所以就导致你左腿一收回来就踢到你的右怀上，我那个时候在想 我双云冠军就像你是画家，你连笔都不能拿 我还有什么脸面去面对我的一双冰刀。","sentence_en":"So every time I pulled my left leg back, it would kick my right ankle. I thought, I'm a double world champion—like a painter who can't even hold a brush. How could I face my skates?"},{"id":"574","start":3876.3,"end":3889.02,"displayStart":3876.3,"displayEnd":3889.02,"displayMid":3882.66,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.764924,"pitch":19.998735,"speechRate":6.374,"hasEvents":false,"sentence_source":"所以我就不服气 我就再跑再跑 然后下来我就跟我的对翼发脾气，我说为什么你治不好我的膝盖 但其实我心里比谁都知道，就算是神医也治不好我的膝盖 所以最后也是我自己选择建设下来。","sentence_en":"So I refused to accept it and kept running. Then I got off and vented at my teammate, asking why they couldn't fix my knee. But deep down I knew—even a miracle doctor couldn't heal it. So in the end, I chose to stop on my own."},{"id":"575","start":3889.02,"end":3893.92,"displayStart":3889.02,"displayEnd":3893.92,"displayMid":3891.4700000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.771061,"pitch":24.51055,"speechRate":6.875,"hasEvents":false,"sentence_source":"因为那个时候我的教练 潜一梦话要跟我说，我说如果你不比了 我没有人会怪你。","sentence_en":"At that time, my coach Qian Yimeng said to me, 'If you stop competing, no one will blame you."},{"id":"576","start":3893.92,"end":3899.58,"displayStart":3893.92,"displayEnd":3899.58,"displayMid":3896.75,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.860386,"pitch":24.05574,"speechRate":5.682,"hasEvents":false,"sentence_source":"但是那个时候 我知道我快30岁了，第二季奥运会 可能也会是我的终点。","sentence_en":"But I knew I was almost 30, and the second Olympics might be my last."},{"id":"577","start":3899.58,"end":3905.6,"displayStart":3899.58,"displayEnd":3905.6,"displayMid":3902.59,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.794685,"pitch":20.102501,"speechRate":6.673,"hasEvents":false,"sentence_source":"所以我愿意去付出 只要我还能站着 只要我还能走，我就愿意去尝试我的第二季奥运会。","sentence_en":"So I was willing to push through—as long as I could stand and walk, I'd try for my second Olympics."},{"id":"578","start":3905.6,"end":3913.48,"displayStart":3905.6,"displayEnd":3913.48,"displayMid":3909.54,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.780609,"pitch":20.753975,"speechRate":5.398,"hasEvents":false,"sentence_source":"其实经过四战世界盃的努力吧，我最后到平仓的时候 虽然拿到了两个项目的资格，为我自己 也为中国。","sentence_en":"After four World Cup competitions, by the time I reached Pyeongchang, I had secured qualifications for two events—for myself and for China."},{"id":"579","start":3913.48,"end":3921.12,"displayStart":3913.48,"displayEnd":3921.12,"displayMid":3917.3,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.779405,"pitch":19.055431,"speechRate":6.414,"hasEvents":false,"sentence_source":"但是那个时候 我的两个膝盖都种得像个馒头一样，我不敢告诉我的对移 我也不敢告诉我的交连，我怕领导会把我换掉。","sentence_en":"But then both my knees were swollen like steamed buns. I didn't dare tell my teammate or my coach—I was afraid the officials would replace me."},{"id":"580","start":3921.12,"end":3926.94,"displayStart":3921.12,"displayEnd":3926.94,"displayMid":3924.0299999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.978689,"pitch":23.711269,"speechRate":5.753,"hasEvents":true,"sentence_source":"所以在第二次这个奥运的时候真的承受了巨大的压力站到奥运赛场上。","sentence_en":"So at my second Olympics, I stood on the ice under immense pressure."},{"id":"581","start":3927.56,"end":3931.8,"displayStart":3927.56,"displayEnd":3931.8,"displayMid":3929.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.96487,"pitch":29.336535,"speechRate":6.378,"hasEvents":true,"sentence_source":"所以你们运动员 尤其你们这些顶尖运动员真的是非人类吗。","sentence_en":"So are you athletes—especially top athletes—really inhuman?"},{"id":"582","start":3931.8,"end":3938.02,"displayStart":3931.8,"displayEnd":3938.02,"displayMid":3934.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.958187,"pitch":27.103193,"speechRate":5.281,"hasEvents":false,"sentence_source":"因为通常我们身体有一点点伤痛，它都不是我交气 我没有办法正常的运动。","sentence_en":"Because normally, if we have even a little pain, it's unbearable—I can't exercise normally."},{"id":"583","start":3938.02,"end":3948.32,"displayStart":3938.02,"displayEnd":3948.32,"displayMid":3943.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.957287,"pitch":25.254023,"speechRate":5.203,"hasEvents":false,"sentence_source":"我们说疼到钻心 你的脚可能招不了地，我的膝盖弯不了，但你不仅要正常的运动 你还要抄水平的发挥，你还要在冰上封制电测。","sentence_en":"We say the pain is excruciating—your foot can't touch the ground, your knee won't bend. But you not only have to move normally, you need to perform at a superhuman level and race at top speed on ice."},{"id":"584","start":3948.32,"end":3952.82,"displayStart":3948.32,"displayEnd":3952.82,"displayMid":3950.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.734572,"pitch":19.395805,"speechRate":4.667,"hasEvents":false,"sentence_source":"那你怎么去抵抗那些疼痛 打疯病，什么药都打不了。","sentence_en":"How do you fight that pain? Painkillers? Nothing works."},{"id":"585","start":3952.96,"end":3967.24,"displayStart":3952.96,"displayEnd":3967.24,"displayMid":3960.1,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.6,"loudness":0.752729,"pitch":22.026567,"speechRate":5.546,"hasEvents":false,"sentence_source":"因为你越打 它会造成你的伤越严重，它是骨头的问题 它不是肌肉疼痛 你会挺住，华冰需要90度的 你蹲到90度的时候 它两个骨头碰撞 它会打软，就一下就会跪在这个冰场上 非常的危险。","sentence_en":"Because the more you use them, the worse the injury gets. It's a bone issue, not muscle pain. You have to endure it. In speed skating, you need a 90-degree squat. At that angle, the bones collide, your leg gives way, and you suddenly fall to your knees on the ice—very dangerous."},{"id":"586","start":3967.24,"end":3972.04,"displayStart":3967.24,"displayEnd":3972.04,"displayMid":3969.64,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.5,"loudness":0.784882,"pitch":20.408075,"speechRate":4.162,"hasEvents":false,"sentence_source":"所以 我觉得那种意志品质也是因为奥林匹克。","sentence_en":"So I think that kind of willpower comes from the Olympics."},{"id":"587","start":3972.04,"end":3981.6,"displayStart":3972.04,"displayEnd":3981.6,"displayMid":3976.8199999999997,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.5,"loudness":0.815487,"pitch":22.82654,"speechRate":5.822,"hasEvents":false,"sentence_source":"因为我有那个目标 直到那一年的2月份我要去比赛，我是一个脾气非常好的人之前，但那个时候我每天都很焦躁 然后每天都发货。","sentence_en":"Because I had that goal—I was going to compete in February that year. I used to have a very good temper, but back then I was irritable every day and lost my temper constantly."},{"id":"588","start":3981.6,"end":3993.18,"displayStart":3981.6,"displayEnd":3993.18,"displayMid":3987.39,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.5,"loudness":0.687132,"pitch":21.649826,"speechRate":5.655,"hasEvents":false,"sentence_source":"但是我告诉自己 我的运动生涯在倒数，我从七岁开始从事的项目 那时候已经22年多了，我多划一天冰 就是少划一天冰，以后就没有机会站在这个冰场上了。","sentence_en":"But I told myself my career was counting down. I started skating at seven, and by then it had been over 22 years. Every day I skated was one less day. I would never have another chance to stand on this ice."},{"id":"589","start":3993.18,"end":3994.94,"displayStart":3993.18,"displayEnd":3994.94,"displayMid":3994.06,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Neutral","score":0,"loudness":0.958823,"pitch":26.730818,"speechRate":8.054,"hasEvents":false,"sentence_source":"所以我就是靠这种自我安慰。","sentence_en":"So I relied on that kind of self-comfort."},{"id":"590","start":3994.94,"end":4004.48,"displayStart":3994.94,"displayEnd":4004.48,"displayMid":3999.71,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Positive","score":0.4,"loudness":0.795024,"pitch":23.947983,"speechRate":5.451,"hasEvents":false,"sentence_source":"其实我教练之前说过说张虹 适合当服务员，不适合当运动员 因为我总是在乐，不管是跟我的团队 跟我的教练 我每天总是在乐。","sentence_en":"Actually, my coach once said I was more suited to be a waitress than an athlete because I was always smiling—with my team, with my coach, always smiling."},{"id":"591","start":4004.94,"end":4014.54,"displayStart":4004.94,"displayEnd":4014.54,"displayMid":4009.74,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.730846,"pitch":20.971184,"speechRate":5.594,"hasEvents":false,"sentence_source":"其实我的内心比谁都着急，但是我还是会自己安慰自己，就是去对得起你曾经那个选择，对得起你从事了23年的这项运动吧。","sentence_en":"But inside, I was more anxious than anyone. Still, I comforted myself: just be worthy of the choice you made, worthy of the sport you've dedicated 23 years to."},{"id":"592","start":4015.1,"end":4020.46,"displayStart":4015.1,"displayEnd":4020.46,"displayMid":4017.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.93704,"pitch":23.057775,"speechRate":7.598,"hasEvents":false,"sentence_source":"因为我也很热爱自己工作，所以我特别明白你说那种就是我多划一天就少划一天的感觉。","sentence_en":"Because I love my work too, I really understand what you mean by feeling that every extra day of rowing is one day less."},{"id":"593","start":4020.88,"end":4026.76,"displayStart":4020.88,"displayEnd":4026.76,"displayMid":4023.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":1.097938,"pitch":27.864965,"speechRate":6.293,"hasEvents":false,"sentence_source":"因为我觉得运动员这个职业非常残酷，但他为什么激动人心，在于他把一切美好都农缩了。","sentence_en":"I think being an athlete is a brutal profession, but why it's thrilling is because it condenses all the beautiful things."},{"id":"594","start":4027.12,"end":4032.48,"displayStart":4027.12,"displayEnd":4032.48,"displayMid":4029.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.015987,"pitch":23.654917,"speechRate":6.379,"hasEvents":false,"sentence_source":"比如说像我们做这行，我的身体状态如果好，观众愿意看的话你可以做到60、70。","sentence_en":"For example, in my line of work, if I'm in good shape and the audience wants to watch, I can keep going until 60 or 70."},{"id":"595","start":4033.1,"end":4040.34,"displayStart":4033.1,"displayEnd":4040.34,"displayMid":4036.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.989543,"pitch":27.069725,"speechRate":5.076,"hasEvents":false,"sentence_source":"但运动员我再天赋一饼 我划到30、35，他总是在一个相对年轻时候就已经结束了。","sentence_en":"But athletes, even with talent, row until 30 or 35, and it always ends relatively young."},{"id":"596","start":4040.34,"end":4041.7,"displayStart":4040.34,"displayEnd":4041.7,"displayMid":4041.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Neutral","score":0,"loudness":0.925658,"pitch":21.498096,"speechRate":5.882,"hasEvents":false,"sentence_source":"所以一切都被浓缩。","sentence_en":"So everything is condensed."},{"id":"597","start":4042.6,"end":4050.42,"displayStart":4042.6,"displayEnd":4050.42,"displayMid":4046.51,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.7,"loudness":0.723456,"pitch":20.826782,"speechRate":4.348,"hasEvents":true,"sentence_source":"是的 很残酷其实，我站在这个平常的赛场上，还没有划 我就已经很欣慰了 我很开心。","sentence_en":"Yes, it's brutal. Standing on this ordinary track before even starting, I already feel relieved and happy."},{"id":"598","start":4050.42,"end":4057.52,"displayStart":4050.42,"displayEnd":4057.52,"displayMid":4053.9700000000003,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.5,"loudness":0.788186,"pitch":21.98707,"speechRate":6.719,"hasEvents":false,"sentence_source":"因为我知道我站在这我就赢了，我用一条腿我不可能划过别人两条腿，最后我也没有能拿到这两个项目的前八名。","sentence_en":"Because I know just being here means I've won. With one leg, I can't out-row someone with two, and I didn't make the top eight in either event."},{"id":"599","start":4057.52,"end":4062.02,"displayStart":4057.52,"displayEnd":4062.02,"displayMid":4059.77,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Artistic aesthetics and life insights","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.810388,"pitch":22.215353,"speechRate":6.88,"hasEvents":false,"sentence_source":"但是我觉得我给我的奥运，给我的运动生涯划上了一个圆满的句号。","sentence_en":"But I feel I've drawn a perfect conclusion to my Olympics and my athletic career."},{"id":"600","start":4062.02,"end":4063.08,"displayStart":4062.02,"displayEnd":4063.08,"displayMid":4062.55,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.683153,"pitch":17.542385,"speechRate":5.66,"hasEvents":false,"sentence_source":"所以你是没有。","sentence_en":"So you have no regrets."},{"id":"601","start":4063.08,"end":4067.48,"displayStart":4063.08,"displayEnd":4067.48,"displayMid":4065.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.915834,"pitch":23.061569,"speechRate":5,"hasEvents":false,"sentence_source":"任何遗憾的，如果那天没有能够去品尝、没有能够比赛。","sentence_en":"If I hadn't been able to taste it, hadn't been able to compete that day..."},{"id":"602","start":4067.48,"end":4069.04,"displayStart":4067.48,"displayEnd":4069.04,"displayMid":4068.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.148274,"pitch":22.373268,"speechRate":9.187,"hasEvents":false,"sentence_source":"因为腿的原因、因为膝盖的原因。","sentence_en":"Because of my leg, because of my knee."},{"id":"603","start":4069.04,"end":4070.24,"displayStart":4069.04,"displayEnd":4070.24,"displayMid":4069.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.6,"loudness":0.898402,"pitch":14.066507,"speechRate":6.667,"hasEvents":false,"sentence_source":"那会是巨大的遗憾。","sentence_en":"That would have been a huge regret."},{"id":"604","start":4070.24,"end":4072.16,"displayStart":4070.24,"displayEnd":4072.16,"displayMid":4071.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.7,"loudness":0.809481,"pitch":26.144995,"speechRate":6.309,"hasEvents":false,"sentence_source":"那一定会是我一辈子巨。","sentence_en":"That would definitely be a huge regret for life."},{"id":"605","start":4072.16,"end":4083.04,"displayStart":4072.16,"displayEnd":4083.04,"displayMid":4077.6,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.5,"loudness":0.873677,"pitch":19.317263,"speechRate":4.687,"hasEvents":false,"sentence_source":"大的遗憾一定会是，第二届冬奥会让我意识到了，什么是站上自己，三十岁的年龄，也是在一般人刚刚开始自己的事业的时候。","sentence_en":"The second Winter Olympics made me realize what it means to stand by yourself. At age 30, when most people are just starting their careers."},{"id":"606","start":4083.04,"end":4096.06,"displayStart":4083.04,"displayEnd":4096.06,"displayMid":4089.55,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.6,"loudness":0.875159,"pitch":23.716448,"speechRate":5.499,"hasEvents":false,"sentence_source":"那个时候我曾经被多次的怀疑，我记得在刚刚结束那一年，我去深圳做一个活动，很开心 因为深圳在那个公园里很美，我非常想跑步 因为我怀念我当运动员的出汗的感觉。","sentence_en":"Back then, I was doubted many times. I remember right after that year ended, I went to Shenzhen for an event. It was nice—the park there was beautiful, and I really wanted to run because I missed the feeling of sweating as an athlete."},{"id":"607","start":4096.06,"end":4109.58,"displayStart":4096.06,"displayEnd":4109.58,"displayMid":4102.82,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.802375,"pitch":19.790558,"speechRate":5.82,"hasEvents":false,"sentence_source":"我跑了不到五分钟 我的膝盖就再也跑不了了，就是它那种疼 是你根本坚持不了的疼，我站在那个公园里面 没有人 看着天，我以为那个时候我告别赛场了，不知道我就去做什么 我就流泪了。","sentence_en":"I ran for less than five minutes before my knee couldn't go on. The pain was unbearable. I stood in that empty park, looking at the sky, thinking I had left the arena and had no idea what to do next. I started crying."},{"id":"608","start":4109.58,"end":4112.9,"displayStart":4109.58,"displayEnd":4112.9,"displayMid":4111.24,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.6,"loudness":0.775617,"pitch":22.784113,"speechRate":6.72,"hasEvents":true,"sentence_source":"那个是我当运动员唯一流的一次类 就是退役之后。","sentence_en":"That was the only time I cried as an athlete—after retiring."},{"id":"609","start":4112.9,"end":4117.28,"displayStart":4112.9,"displayEnd":4117.28,"displayMid":4115.09,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.761049,"pitch":24.244896,"speechRate":6.46,"hasEvents":true,"sentence_source":"那我曾经是奥运冠军 我现在连跑步都不能，我到底能做什么。","sentence_en":"I used to be an Olympic champion, and now I couldn't even run. What could I possibly do?"},{"id":"610","start":4117.28,"end":4130.94,"displayStart":4117.28,"displayEnd":4130.94,"displayMid":4124.11,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Negative","score":-0.6,"loudness":0.847623,"pitch":24.082226,"speechRate":5.936,"hasEvents":false,"sentence_source":"那个时候也有人质疑我说张虹你除了华冰你什么都不会，我当时听进去了我反思我真的什么都不会，我那个时候当委员给了我巨大的心理压力，我前三年当委员是每一天都在给入我压力。","sentence_en":"Back then, someone questioned me, 'Zhang Hong, you can't do anything but skate.' I took that to heart and reflected—I really couldn't do anything. Being a committee member gave me immense psychological pressure. For the first three years, every day added to that burden."},{"id":"611","start":4130.94,"end":4132.58,"displayStart":4130.94,"displayEnd":4132.58,"displayMid":4131.76,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Female Growth and Champion Mindset","sentiment_en":"Negative","score":-0.4,"loudness":0.612785,"pitch":19.439144,"speechRate":4.43,"hasEvents":false,"sentence o English classes and attended events, busy every day but lost my goal. Before, I knew I was going to win the championship — a very straightforward goal."},{"id":"619","start":4195.3,"end":4204.48,"displayStart":4195.3,"displayEnd":4204.48,"displayMid":4199.889999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.786947,"pitch":23.206234,"speechRate":5.556,"hasEvents":false,"sentence_source":"但是现在我就 我到底要干嘛，享受生活吗 我怎么享受，我怎么去当一名老师 怎么去当委员，怎么去面对我的生活 真的很迷茫。","sentence_en":"But now, what am I supposed to do? Enjoy life? How? How do I become a teacher, a committee member, face my life? I’m really lost."},{"id":"620","start":4204.48,"end":4209.56,"displayStart":4204.48,"displayEnd":4209.56,"displayMid":4207.02,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.698877,"pitch":26.275953,"speechRate":7.653,"hasEvents":false,"sentence_source":"我觉得这也是每一位运动员退一后，无论是中国运动员还是全球运动员都会有的迷茫起。","sentence_en":"I think this is the confusion every athlete faces after retiring, whether Chinese or from anywhere in the world."},{"id":"621","start":4210.06,"end":4215.88,"displayStart":4210.06,"displayEnd":4215.88,"displayMid":4212.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.886472,"pitch":22.211008,"speechRate":6.162,"hasEvents":false,"sentence_source":"我虽然不是运动员，但我能共情你这一点，就是悠闲的生活对我来说并不是一种享受。","sentence_en":"I’m not an athlete, but I empathize with you — a leisurely life isn’t enjoyable for me either."},{"id":"622","start":4216.34,"end":4224.14,"displayStart":4216.34,"displayEnd":4224.14,"displayMid":4220.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","c ayMid":4246.6900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.206729,"pitch":31.520969,"speechRate":6.16,"hasEvents":false,"sentence_source":"但对你来说我觉得你们顶级运动员。","sentence_en":"But for you top athletes, I think..."},{"id":"627","start":4248.06,"end":4259.18,"displayStart":4248.06,"displayEnd":4259.18,"displayMid":4253.620000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.771433,"pitch":24.695004,"speechRate":3.777,"hasEvents":false,"sentence_source":"对抗恐惧的能力特别强，你们处理疼痛、伤痛、绝望、恐惧、失败，你们一定会比我们普通人会更懂得如何去。","sentence_en":"You have a strong ability to confront fear. You deal with pain, injury, despair, fear, failure — you definitely know better than ordinary people how to..."},{"id":"628","start":4259.18,"end":4272.96,"displayStart":4259.18,"displayEnd":4272.96,"displayMid":4266.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.911396,"pitch":22.098406,"speechRate":5.733,"hasEvents":false,"sentence_source":"更这所有这些负面情绪相处 好像更能够掌控它因为你每天都在和这些情绪相处，你知道这两天我特别感动 特别不敢刷的一个视频 就是美国的攀岩选手Alex 他不是徒手爬101大厦。","sentence_en":"Get along with all these negative emotions, seem to control them better because you face them every day. You know, these days I’m especially moved by a video I hardly dare to watch — American rock climber Alex, the one who free soloed the 101 building."},{"id":"629","start":4272.96,"end":4286.44,"displayStart":4272.96,"displayEnd":4286.44,"displayMid":4279.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.920787,"pitch":22.735731,"speechRate":5.119,"hasEvents":false,"sentence_source":"那视频每次我点进去腿发软 然后腿传不敢看 但他有个采访我看了以后我特别感动 有人问他关于恐惧，他说其实恐惧就是众多的人的感受感觉之一，就跟你饿了一样。","sentence_en":"Every time I open that video, my legs go weak and I can't watch. But I saw an interview with him that really moved me. Someone asked him about fear. He said fear is just one of many human feelings, like hunger."},{"id":"630","start":4286.44,"end":4299.94,"displayStart":4286.44,"displayEnd":4299.94,"displayMid":4293.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.854673,"pitch":23.454617,"speechRate":6.108,"hasEvents":false,"sentence_source":"他说但是你饿了以后你不会特别恐惧，说我饿了我该怎么办，你饿了你吃东西就好了，他说恐惧一样，你面对他处理他就好了，他说只是我们对于恐惧格外的恐惧，是因为我们很少去面对恐惧。","sentence_en":"He said when you're hungry, you don't panic — you just eat. Same with fear: face it and handle it. He said we're only extra afraid of fear because we rarely confront it."},{"id":"631","start":4299.94,"end":4307.28,"displayStart":4299.94,"displayEnd":4307.28,"displayMid":4303.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.969431,"pitch":26.685335,"speechRate":5.171,"hasEvents":false,"sentence_source":"我听了以后我觉得很有道理，我想你们运动员就是会有更多的机会去直面压力直面恐惧。","sentence_en":"I thought that made a lot of sense. I think you athletes have more opportunities to face pressure and fear directly."},{"id":"632","start":4307.28,"end":4309.48,"displayStart":4307.28,"displayEnd":4309.48,"displayMid":4308.379999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":0.948744,"pitch":20.91254,"speechRate":7.588,"hasEvents":false,"sentence_source":"所以你们这方面的能力是超强的。","sentence_en":"So your ability in this area is extraordinary."},{"id":"633","start":4309.9,"end":4311.24,"displayStart":4309.9,"displayEnd":4311.24,"displayMid":4310.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.114501,"pitch":29.840784,"speechRate":6.422,"hasEvents":false,"sentence_source":"对于我个人来说。","sentence_en":"For me personally,"},{"id":"634","start":4311.36,"end":4315.92,"displayStart":4311.36,"displayEnd":4315.92,"displayMid":4313.639999999999,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.74069,"pitch":21.443705,"speechRate":4.605,"hasEvents":true,"sentence_source":"我是很喜欢把自己一直处于在一个很艰难的阶段。","sentence_en":"I really like to keep myself in a difficult stage."},{"id":"635","start":4316.34,"end":4328.52,"displayStart":4316.34,"displayEnd":4328.52,"displayMid":4322.43,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.813216,"pitch":25.770521,"speechRate":6.202,"hasEvents":true,"sentence_source":"因为当运动员的时候，当你去度过瓶颈期的时候，就是每一天那种折磨才会有最后那个胜利，包括薛英宇，然后我总结下来之后，如果你过得很舒服就证明着那你肯定没有进步了。","sentence_en":"Because as an athlete, when you get through a plateau, it's the daily torment that leads to victory — Xue Yingyu included. I concluded that if you feel too comfortable, it means you're not improving."},{"id":"636","start":4328.52,"end":4340.5,"displayStart":4328.52,"displayEnd":4340.5,"displayMid":4334.51,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":0.85421,"pitch":20.847603,"speechRate":6.311,"hasEvents":false,"sentence_source":"你是一个没有目标的人，当你一直有目标的时候，你就会去寻找困难去做，让自己处于在困难的阶段里，最后才会有那个超越自己的一个过程，很多人都喜欢让自己在舒适圈里生活。","sentence_en":"If you have no goal, you stay comfortable. But when you have a goal, you seek difficulties, put yourself in tough phases, and only then can you surpass yourself. Many people prefer to stay in their comfort zone."},{"id":"637","start":4340.5,"end":4342.82,"displayStart":4340.5,"displayEnd":4342.82,"displayMid":4341.66,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":0.723457,"pitch":17.959,"speechRate":5.172,"hasEvents":false,"sentence_source":"哎呀 就是我能掌控的人和事。","sentence_en":"Ah, things and people I can control."},{"id":"638","start":4342.82,"end":4357.22,"displayStart":4342.82,"displayEnd":4357.22,"displayMid":4350.02,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.848754,"pitch":22.866093,"speechRate":5.625,"hasEvents":false,"sentence_source":"但是我觉得作为一个运动员我们喜欢挑战，就是总去挑战你自己不擅长的领域，不擅长的事情，但总结下来呢，你会发现去尝试了不同的挑战，突破了它，你让人生变得更加精彩，更有价值和更有意义。","sentence_en":"But I think as athletes, we love challenges — always challenging ourselves in areas we're not good at. In the end, you find that trying different challenges and breaking through makes life more exciting, valuable, and meaningful."},{"id":"639","start":4357.22,"end":4359.14,"displayStart":4357.22,"displayEnd":4359.14,"displayMid":4358.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.4,"loudness":1.326415,"pitch":28.848129,"speechRate":7.261,"hasEvents":false,"sentence_source":"我觉得人生有时候很奇妙。","sentence_en":"I think life is sometimes wonderful."},{"id":"640","start":4359.14,"end":4363.08,"displayStart":4359.14,"displayEnd":4363.08,"displayMid":4361.110000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"cluster ing coach to train for the town team, and then almost taken by a modeling agency to be a model. Finally, I switched from short track speed skating to speed skating. In short track, people thought my height was a disadvantage."},{"id":"644","start":4394.78,"end":4397.52,"displayStart":4394.78,"displayEnd":4397.52,"displayMid":4396.15,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Negative","score":-0.3,"loudness":1.020121,"pitch":26.608906,"speechRate":6.883,"hasEvents":false,"sentence_source":"因为我的身高太高没有办法去配合接力。","sentence_en":"Because my height was too tall to fit into the relay."},{"id":"645","start":4397.52,"end":4401.56,"displayStart":4397.52,"displayEnd":4401.56,"displayMid":4399.540000000001,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":1.00547,"pitch":26.956463,"speechRate":6.188,"hasEvents":false,"sentence_source":"所以没被选择国家队，后来到了苏都华冰身高又变成了优势。","sentence_en":"So I wasn't selected for the national team. Later, in speed skating, my height became an advantage."},{"id":"646","start":4401.56,"end":4410.7,"displayStart":4401.56,"displayEnd":4410.7,"displayMid":4406.13,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.823136,"pitch":20.674511,"speechRate":5.142,"hasEvents":true,"sentence_source":"所以我觉得这一切的一切不能说是命运安排好的，是你不断的尝试去挑战新的环境，才能找到最适合你的圈子吧。","sentence_en":"So I think all of this isn't simply fate—it's about constantly trying and challenging new environments to find the circle that suits you best."},{"id":"647","start":4411.1,"end":4425,"displayStart":4411.1,"displayEnd":4425,"displayMid":4418.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Neutral","score":0,"loudness":0.979465,"pitch":25.764078,"speechRate":5.748,"hasEvents":true,"sentence_source":"所以你看这一点特别有警示作用，你说身高的标准，放到一个领域它就太高，放到另外一个领域你有不够高，放到一个对的地方你有正正好好，莫特心态认为你应该多高才够资格做一个抄磨。","sentence_en":"So you see, this is quite telling. The standard of height—in one field it's too tall, in another it's not tall enough, but in the right place it's just right. It's not about what height you should be to qualify as a supermodel."},{"id":"648","start":4452.36,"end":4456.3,"displayStart":4452.36,"displayEnd":4456.3,"displayMid":4454.33,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.4,"loudness":1.035704,"pitch":29.282429,"speechRate":7.143,"hasEvents":false,"sentence_source":"我当时就是很差异 我那个时候连哈尔滨试冠军都没有拿过。","sentence_en":"I was really surprised. At that time, I hadn't even won a Harbin city championship."},{"id":"649","start":4456.3,"end":4458.96,"displayStart":4456.3,"displayEnd":4458.96,"displayMid":4457.63,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.5,"loudness":1.133382,"pitch":27.787775,"speechRate":8.463,"hasEvents":true,"sentence_source":"然后我妈妈就有一个让我拿试界冠军的梦想。","sentence_en":"Then my mother had a dream for me to win a world championship."},{"id":"650","start":4461.72,"end":4474.12,"displayStart":4461.72,"displayEnd":4474.12,"displayMid":4467.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.6,"loudness":1.036624,"pitch":25.496321,"speechRate":4.939,"hasEvents":true,"sentence_source":"我一直觉得老天不能让任何一个人浪费他的天分，就他总要在你某一些分岔路口，你可能要往错误的方向走的时候，给你设置个障碍 把你再拽回来。","sentence_en":"I've always believed that God doesn't let anyone waste their talent. At some crossroads, when you might go in the wrong direction, He sets up an obstacle to pull you back."},{"id":"651","start":4474.12,"end":4485.52,"displayStart":4474.12,"displayEnd":4485.52,"displayMid":4479.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Neutral","score":0,"loudness":0.940257,"pitch":24.522978,"speechRate":6.352,"hasEvents":false,"sentence_source":"如果你真的你1米76了 你可能真的就尝试去做模特，当然有可能你成为一个不错的模特，但少了一个奥运冠军，诶 你会觉得世界超魔和奥运冠军哪个更吸引你在此刻。","sentence_en":"If you were really 1.76m tall, you might have tried to be a model. Of course, you could have become a decent model, but then you'd miss out on being an Olympic champion. Hey, which one do you think is more attractive to you at this moment—world supermodel or Olympic champion?"},{"id":"652","start":4485.52,"end":4486.96,"displayStart":4485.52,"displayEnd":4486.96,"displayMid":4486.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Positive","score":0.8,"loudness":0.57108,"pitch":20.880449,"speechRate":5.556,"hasEvents":false,"sentence_source":"那肯定是奥运冠军。","sentence_en":"Definitely the Olympic champion."},{"id":"653","start":4486.96,"end":4494.18,"displayStart":4486.96,"displayEnd":4494.18,"displayMid":4490.57,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Competitive Sports and Olympic Spirit","sentiment_en":"Negative","score":-0.4,"loudness":1.046309,"pitch":24.011938,"speechRate":5.891,"hasEvents":false,"sentence_source":"如果我在短道苏华去了国家队，可能一两年我也成为不了重点队员，可能退一下来也就不练了。","sentence_en":"If I had made it to the national team in short track, maybe I wouldn't have become a key player in a year or two. I might have just quit."},{"id":"654","start":4494.18,"end":4497.18,"displayStart":4494.18,"displayEnd":4497.18,"displayMid":4495.68,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":4,"cluste 学英语。","sentence_en":"Actually, most of my reading happened after retirement. I really like reading books by athletes. First, to understand the thoughts and growth experiences of athletes worldwide; second, to improve my English."},{"id":"658","start":4528.32,"end":4539.04,"displayStart":4528.32,"displayEnd":4539.04,"displayMid":4533.68,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational Experience and Lifelong Learning","sentiment_en":"Positive","score":0.6,"loudness":0.87881,"pitch":20.30258,"speechRate":5.706,"hasEvents":false,"sentence_source":"所以我大多数都会看一些资转，或者是运动员的这些采访 当然是英文采访，我会感同身受 因为所有的运员都会有一个共同的经历嘛 或多或少。","sentence_en":"So I mostly watch some documentaries or athlete interviews—English interviews, of course. I can relate because all athletes share common experiences, more or less."},{"id":"659","start":4539.04,"end":4546.94,"displayStart":4539.04,"displayEnd":4546.94,"displayMid":4542.99,"speaker":"Zhang Hong","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Neutral","score":0,"loudness":1.034044,"pitch":26.049126,"speechRate":5.968,"hasEvents":false,"sentence_source":"然后又让我能了解他们的项目 所以有的时候 比如说我会看《帅教宝爸爸》这种电影，虽然是在印度的这样一个。","sentence_en":"And it also lets me learn about their sports. Sometimes, for example, I watch movies like 'Dangal', even though it's set in India."},{"id":"660","start":4546.94,"end":4551.68,"displayStart":4546.94,"displayEnd":4551.68,"displayMid":4549.3099999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Athlete Growth and Olympic Experience","sentiment_en":"Positive","score":0.7,"loudness":0.741127,"pitch":21.345564,"speechRate":5.274,"hasEvents":false,"sentence_source":"故事 但是我看了三次我都流泪了，你都看到哪个地方会流泪。","sentence_en":"I've watched it three times and I cried every time. Where do you cry?"},{"id":"661","start":4551.68,"end":4562.9,"displayStart":4551.68,"displayEnd" lug":"s7e6","label":"S7E6","guest":"Qian Jianan"},{"slug":"s7e7","label":"S7E7","guest":"Lao Dongyan"},{"slug":"s7e8","label":"S7E8","guest":"Zhai Yongming"},{"slug":"s7e9","label":"S7E9","guest":"Xiaopa"},{"slug":"s7e10","label":"S7E10","guest":"Wang Haolu"},{"slug":"s8e1","label":"S8E1","guest":"Jiang Shengnan"},{"slug":"s8e2","label":"S8E2","guest":"Chen Hui"},{"slug":"s8e3","label":"S8E3","guest":"Zhashiyi Re"},{"slug":"s8e4","label":"S8E4","guest":"Li Zishu"},{"slug":"s8e5","label":"S8E5","guest":"Zhu Tianwen"},{"slug":"s8e6","label":"S8E6","guest":"Niaoniao"},{"slug":"s8e7","label":"S8E7","guest":"Li Yinhe"},{"slug":"s8e8","label":"S8E8","guest":"Zhang Hong"},{"slug":"s8e9","label":"S8E9","guest":"Li Rui"},{"slug":"s9e1","label":"S9E1","guest":"Zhang Zanying"},{"slug":"s9e2","label":"S9E2","guest":"Zhang Nuo"},{"slug":"s9e3","label":"S9E3","guest":"Cai Gao"},{"slug":"s9e4","label":"S9E4","guest":"Meng Man"}]}}</script>
<script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
