yMid":755.01,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.6,"loudness":0.837213,"pitch":19.488626,"speechRate":4.786,"hasEvents":false,"sentence_source":"我觉得还是很有起发性的好，神奇 真的很神奇。","sentence_en":"I think it's very inspiring. Amazing, truly amazing."},{"id":"104","start":757.17,"end":763.07,"displayStart":757.17,"displayEnd":763.07,"displayMid":760.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.5,"loudness":1.053208,"pitch":24.113163,"speechRate":5.137,"hasEvents":false,"sentence_source":"那你在德国期间就出了这样，非常便捷能够感受到很多的艺术的氛围。","sentence_en":"So during your time in Germany, you were able to easily experience a lot of artistic atmosphere."},{"id":"105","start":763.07,"end":768.67,"displayStart":763.07,"displayEnd":768.67,"displayMid":765.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Neutral","score":0,"loudness":0.977644,"pitch":19.026836,"speechRate":5,"hasEvents":false,"sentence_source":"然后看到很多的艺术大家的作品之外，在哲学方面 你做了哪些思考。","sentence_en":"Besides seeing works by many great artists, what philosophical thoughts did you have?"},{"id":"106","start":770.07,"end":784.27,"displayStart":770.07,"displayEnd":784.27,"displayMid":777.1700000000001,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0.1,"loudness":0.849923,"pitch":22.783958,"speechRate":4.565,"hasEvents":true,"sentence_source":"这是个很好的问题，我是觉得哲学一个是知道很多道理，知道很多的逻辑的变化的方式，但最后还是要去回到自己的生活和生命当中去，就是人如何行动吧。","sentence_en":"That's a great question. I think philosophy involves knowing many truths and understanding various logical transformations, but ultimately, it has to return to one's own life and existence—how to act as a person."},{"id":"107","start":784.27,"end":786.45,"displayStart":784.27,"displayEnd":786.45,"displayMid":785.36,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0,"loudness":0.99764,"pitch":18.395628,"speechRate":6.154,"hasEvents":false,"sentence_source":"重要的不单单是理解世界吧。","sentence_en":"It's not just about understanding the world."},{"id":"108","start":786.45,"end":787.93,"displayStart":786.45,"displayEnd":787.93,"displayMid":787.19,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Positive","score":0.3,"loudness":0.921463,"pitch":19.306116,"speechRate":5.263,"hasEvents":false,"sentence_source":"然后是改变世界。","sentence_en":"But also changing it."},{"id":"109","start":787.93,"end":791.65,"displayStart":787.93,"displayEnd":791.65,"displayMid":789.79,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0,"loudness":0.72125,"pitch":16.273169,"speechRate":4.57,"hasEvents":false,"sentence_source":"那至少在第一步，不单单是如何理解自我。","sentence_en":"At least in the first step, it's not just about understanding oneself."},{"id":"110","start":791.65,"end":793.83,"displayStart":791.65,"displayEnd":793.83,"displayMid":792.74,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Positive","score":0.3,"loudness":0.705567,"pitch":16.097759,"speechRate":4.38,"hasEvents":false,"sentence_source":"然后是如何改变自我。","sentence_en":"But about changing oneself."},{"id":"111","start":793.83,"end":794.83,"displayStart":793.83,"displayEnd":794.83,"displayMid":794.33,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Positive","score":0.4,"loudness":0.872708,"pitch":21.642927,"speechRate":5.682,"hasEvents":false,"sentence_source":"然后去行动。","sentence_en":"And then taking action."},{"id":"112","start":794.83,"end":797.35,"displayStart":794.83,"displayEnd":797.35,"displayMid":796.09,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0.1,"loudness":0.709607,"pitch":17.939545,"speechRate":5.856,"hasEvents":false,"sentence_source":"我觉得写作是我的某一种行动。","sentence_en":"I think writing is a kind of action for me."},{"id":"113","start":797.35,"end":811.77,"displayStart":797.35,"displayEnd":811.77,"displayMid":804.56,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.4,"loudness":0.765769,"pitch":17.417908,"speechRate":4.966,"hasEvents":false,"sentence_source":"我觉得某种意义上我在文章中也写的，哲学是给人不同的镜片去看这个世界，他会知道这个世界有这样的看法和那样的看法，但最后其实是参与到建设这个世界当中。","sentence_en":"In a way, as I've written in my articles, philosophy gives people different lenses to see the world. They learn there are various perspectives, but ultimately, it's about participating in building the world."},{"id":"114","start":811.77,"end":822.87,"displayStart":811.77,"displayEnd":822.87,"displayMid":817.3199999999999,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Neutral","score":0.1,"loudness":0.750879,"pitch":18.359098,"speechRate":5.073,"hasEvents":false,"sentence_source":"我觉得整个的学习过程是了解有这么多精彩的和优秀的头脑，他这样分析和建设过世界，而最后我要做什么其实是最重要的问题。","sentence_en":"I think the whole learning process is about understanding how many brilliant minds have analyzed and built the world, and ultimately, the most important question is what I am going to do."},{"id":"115","start":823.39,"end":825.73,"displayStart":823.39,"displayEnd":825.73,"displayMid":824.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.932606,"pitch":23.048502,"speechRate":5.701,"hasEvents":false,"sentence_source":"写作是你一直在做的一件事。","sentence_en":"Writing is something you've always been doing."},{"id":"116","start":825.73,"end":829.81,"displayStart":825.73,"displayEnd":829.81,"displayMid":827.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.937676,"pitch":18.939207,"speechRate":4.167,"hasEvents":false,"sentence_source":"对，然后奇岚也有作品在国内出版发行过。","sentence_en":"Yes, and Qilan has also had works published in China."},{"id":"117","start":829.81,"end":843.43,"displayStart":829.81,"displayEnd":843.43,"displayMid":836.6199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.5,"loudness":1.033862,"pitch":21.907436,"speechRate":4.772,"hasEvents":false,"sentence_source":"那我这几天算是胡伦敦早的看了两本，一个是那个姐姐教我们的词，还有一个是我愿生命从容 对吧对对对，这两本大家可以去看一下，我更喜欢我愿生命从容。","sentence_en":"So these past few days, I've read two books in London: one is 'The Words My Sister Taught Me,' and the other is 'I Wish Life to Be Leisurely'—yes, right, right. You can check both out. I prefer 'I Wish Life to Be Leisurely.'"},{"id":"118","start":843.43,"end":856.81,"displayStart":843.43,"displayEnd":856.81,"displayMid":850.1199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.6,"loudness":0.985062,"pitch":22.433044,"speechRate":5.579,"hasEvents":false,"sentence_source":"那里面有一篇特别有意思，就写歌词这个角度特别好，我特别喜欢，就是我们一般会写我在，比如像梁超伟在欧洲的在巴黎，在维尼斯在什么广场去喂歌词，后来我们在哪里喂歌词。","sentence_en":"There's a really interesting piece in it—the angle of writing about pigeons is great, I especially like it. Usually we write 'I am in'—like Tony Leung in Europe, in Paris, in Venice, feeding pigeons in some square, and later where we feed pigeons."},{"id":"119","start":856.81,"end":868.53,"displayStart":856.81,"displayEnd":868.53,"displayMid":862.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.5,"loudness":0.944383,"pitch":23.825943,"speechRate":4.745,"hasEvents":false,"sentence_source":"但奇兰这篇写的是从歌词的角度，他的节目叫歌词的旅行日记，就讲不同的广场歌词对于为他们的那些游客的那种态度那种观察。","sentence_en":"But Qilan wrote this from the perspective of lyrics. His show is called 'Lyrics Travel Diary,' discussing how different square lyrics reflect attitudes and observations toward the tourists."},{"id":"120","start":868.53,"end":882.09,"displayStart":868.53,"displayEnd":882.09,"displayMid":875.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.6,"loudness":0.915102,"pitch":20.824995,"speechRate":5.383,"hasEvents":false,"sentence_source":"角度就很特别 这本诗我也会强烈的推荐给大家去看一下，就是你在德国求学期间这样的一些写作你要主动的去做，是不是要有某种表达 还是当时你有一些比如说写作的约稿。","sentence_en":"The angle is very unique. I strongly recommend this poetry book. Regarding your writing during your studies in Germany, did you take the initiative to express something, or were you asked to write, like commissions?"},{"id":"121","start":882.09,"end":884.91,"displayStart":882.09,"displayEnd":884.91,"displayMid":883.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.973966,"pitch":18.799931,"speechRate":7.224,"hasEvents":false,"sentence_source":"那些写作是在一种什么样的情况之下完成的。","sentence_en":"Under what circumstances were those writings completed?"},{"id":"122","start":885.35,"end":890.89,"displayStart":885.35,"displayEnd":890.89,"displayMid":888.12,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.5,"loudness":0.945546,"pitch":19.28244,"speechRate":5.235,"hasEvents":false,"sentence_source":"我觉得在这一点要感谢时代 就是当时正好赶上了国内杂志的黄金期。","sentence_en":"I think I have to thank the era — it was the golden age of domestic magazines."},{"id":"123","start":891.31,"end":896.27,"displayStart":891.31,"displayEnd":896.27,"displayMid":893.79,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.953297,"pitch":22.200569,"speechRate":5.901,"hasEvents":false,"sentence_source":"然后因为在大学时代是给一些杂志写人物专访 所以认识很多编辑。","sentence_en":"Back in college, I wrote personality profiles for some magazines, so I knew many editors."},{"id":"124","start":896.27,"end":901.15,"displayStart":896.27,"displayEnd":901.15,"displayMid":898.71,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.85822,"pitch":20.940186,"speechRate":5.424,"hasEvents":false,"sentence_source":"然后他们在我去了德国之后就向我约稿有一些专栏要写。","sentence_en":"After I went to Germany, they commissioned me to write columns."},{"id":"125","start":901.15,"end":905.65,"displayStart":901.15,"displayEnd":905.65,"displayMid":903.4,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":0.906084,"pitch":24.326897,"speechRate":6.467,"hasEvents":false,"sentence_source":"然后我觉得那个时候是因为国内对国外发生些什么特别好奇的。","sentence_en":"I think people back home were very curious about what was happening abroad."},{"id":"126","start":905.65,"end":911.75,"displayStart":905.65,"displayEnd":911.75,"displayMid":908.7,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.4,"loudness":0.780228,"pitch":20.477192,"speechRate":4.292,"hasEvents":false,"sentence_source":"所以正好我身在那里 所以就能够去做很多的旅行 工作 思考。","sentence_en":"So being there allowed me to travel, work, and think a lot."},{"id":"127","start":911.75,"end":915.39,"displayStart":911.75,"displayEnd":915.39,"displayMid":913.5699999999999,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.5,"loudness":0.772067,"pitch":12.665751,"speechRate":6.319,"hasEvents":false,"sentence_source":"然后写的也能很顺利地发表出来 赚点稿费 正好去旅行。","sentence_en":"My writing got published smoothly, and I earned some fees to fund my travels."},{"id":"128","start":915.39,"end":917.93,"displayStart":915.39,"displayEnd":917.93,"displayMid":916.66,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.5,"loudness":0.881597,"pitch":16.364635,"speechRate":6.349,"hasEvents":true,"sentence_source":"我觉得完成了一个很好的内循环。","sentence_en":"I feel like I completed a good internal cycle."},{"id":"129","start":920.51,"end":933.31,"displayStart":920.51,"displayEnd":933.31,"displayMid":926.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Positive","score":0.4,"loudness":1.07183,"pitch":22.091064,"speechRate":5.271,"hasEvents":true,"sentence_source":"因为所有这些写作的这些经验的积累对于，奇兰现在的艺术测长工作其实我觉得帮助是蛮大的，他当年的写作还有一部分 就是当年知新姐姐那部分我也挺好奇。","sentence_en":"All this accumulated writing experience has been quite helpful for Qilan's current work in art curation. I'm also curious about another part of her writing back then—the part related to Zhixin Jiejie."},{"id":"130","start":933.31,"end":945.41,"displayStart":933.31,"displayEnd":945.41,"displayMid":939.3599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"From Writing to Curating","sentiment_en":"Neutral","score":0,"loudness":1.048269,"pitch":25.017309,"speechRate":5.781,"hasEvents":false,"sentence_source":"因为当时我们都是看女友这本杂志的，在那个时候在女友杂志有一个奇兰开了一个专栏，就是年轻的女孩 可能很多都是学生吧，会有一些关于人生的困惑 学业的困惑。","sentence_en":"We all read the magazine 'Girlfriend' back then. Qilan had a column in it for young girls, mostly students, who had life and academic confusion."},{"id":"131","start":945.41,"end":948.11,"displayStart":945.41,"displayEnd":948.11,"displayMid":946.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Reflections on Time","sentiment_en":"Neutral","score":0,"loudness":0.755056,"pitch":16.936178,"speechRate":5.185,"hasEvents":false,"sentence_source":"会寄到编辑部寄给这个知新姐姐。","sentence_en":"They would mail their letters to the editor, addressed to Sister Zhixin."},{"id":"132","start":948.11,"end":950.25,"displayStart":948.11,"displayEnd":950.25,"displayMid":949.1800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Reflections on Time","sentiment_en":"Neutral","score":0,"loudness":0.910714,"pitch":17.316719,"speechRate":6.075,"hasEvents":false,"sentence_source":"那个时候去你自己也蛮年轻的。","sentence_en":"You were quite young yourself back then."},{"id":"133","start":950.25,"end":951.53,"displayStart":950.25,"displayEnd":951.53,"displayMid":950.89,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Reflections on Time","sentiment_en":"Neutral","score":0,"loudness":1.08179,"pitch":11.383406,"speechRate":5.085,"hasEvents":false,"sentence_source":"是的 二十来岁。","sentence_en":"Yes, in my twenties."},{"id":"134","start":951.53,"end":966.07,"displayStart":951.53,"displayEnd":966.07,"displayMid":958.8,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.7,"loudness":0.861411,"pitch":22.88562,"speechRate":5.365,"hasEvents":f "},{"id":"142","start":1014.65,"end":1024.27,"displayStart":1014.65,"displayEnd":1024.27,"displayMid":1019.46,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Positive","score":0.4,"loudness":0.778683,"pitch":19.584347,"speechRate":5.03,"hasEvents":false,"sentence_source":"但是那个时候可能人在成长过程当中，的确需要外面有一个声音对他说，不要怕 现在只是暂时的 将来会更好的。","sentence_en":"But when growing up, people sometimes need an external voice to say, 'Don't be afraid; this is temporary, things will get better."},{"id":"143","start":1024.27,"end":1025.99,"displayStart":1024.27,"displayEnd":1025.99,"displayMid":1025.13,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0,"loudness":0.891958,"pitch":19.137262,"speechRate":5.461,"hasEvents":false,"sentence_source":"其实是这种确认吧。","sentence_en":"It's that kind of reassurance."},{"id":"144","start":1026.57,"end":1029.67,"displayStart":1026.57,"displayEnd":1029.67,"displayMid":1028.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0,"loudness":1.033517,"pitch":21.993502,"speechRate":5.674,"hasEvents":false,"sentence_source":"因为我之前也写过一本类似这样的书。","sentence_en":"I've written a similar book before."},{"id":"145","start":1029.67,"end":1042.53,"displayStart":1029.67,"displayEnd":1042.53,"displayMid":1036.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Growth and life","sentiment_en":"Neutral","score":0.1,"loudness":0.963247,"pitch":24.150658,"speechRate":4.709,"hasEvents":false,"sentence_source":"然后我的一个感受就是我会发现，不管在什么年代，人们的困惑其实都是相同的是是，这点我会觉得，你当你了解这一点之后，一方面你会很感慨。","sentence_en":"And I find that regardless of the era, people's confusions are essentially the same. Once you realize that, on one hand you feel deeply moved."},{"id":"146","start":1042.53,"end":1057.91,"displayStar  exhibitions","sentiment_en":"Positive","score":0.7,"loudness":0.908342,"pitch":18.002485,"speechRate":4.618,"hasEvents":false,"sentence_source":"因为那个我觉得人生嘛 就是应该和这些 你觉得你爱的人和是在一起。","sentence_en":"Because, I think life is about being with those people and things you love."},{"id":"318","start":2255.68,"end":2271,"displayStart":2255.68,"displayEnd":2271,"displayMid":2263.34,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.6,"loudness":0.731008,"pitch":15.808943,"speechRate":4.373,"hasEvents":false,"sentence_source":"然后最近一次被打动其实是在香港就是张晓刚老师的一个展览叫施重，他同期是在龙美术馆有一个展览叫浮游，整个香港巴塞尔期间特别热闹 所有人都很兴奋。","sentence_en":"And the most recent time I was moved was actually in Hong Kong at an exhibition by Zhang Xiaogang called 'Shizhong'. At the same time, he had an exhibition at the Long Museum called 'Floating'. The whole Art Basel Hong Kong period was very lively, everyone was excited."},{"id":"319","start":2271,"end":2274.26,"displayStart":2271,"displayEnd":2274.26,"displayMid":2272.63,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.7,"loudness":0.762542,"pitch":13.756451,"speechRate":5.521,"hasEvents":false,"sentence_source":"也说明艺术市场复苏了当然是很好的事情。","sentence_en":"It also shows that the art market is recovering, which is of course a good thing."},{"id":"320","start":2274.26,"end":2283.32,"displayStart":2274.26,"displayEnd":2283.32,"displayMid":2278.79,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Negative","score":-0.4,"loudness":0.676116,"pitch":17.022551,"speechRate":4.084,"hasEvents":false,"sentence_source":"但是呢在整个香港就是巴塞尔期间你会觉得，过去三年到底留下什么痕迹了找不太到的。","sentence_en":"But during the whole Art Basel period in Hong Kong, you felt that you couldn't really find what traces the past three years had left."},{"id":"321","start":2283.32,"end":2289.96,"displayStart":2283.32,"displayEnd":2289.96,"displayMid":2286.6400000000003,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Neutral","score":0,"loudness":0.827778,"pitch":19.782564,"speechRate":5.229,"hasEvents":false,"sentence_source":"但是呢 在张小刚老师的这个展览当中，他还在认真的回应 他那个作品叫《失踪》。","sentence_en":"But in Zhang Xiaogang's exhibition, he was still earnestly responding. His work is called 'Missing'."},{"id":"322","start":2289.96,"end":2297.78,"displayStart":2289.96,"displayEnd":2297.78,"displayMid":2293.87,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.6,"loudness":0.84424,"pitch":16.555771,"speechRate":4.348,"hasEvents":false,"sentence_source":"然后画了一些人飘在空中，我能感受到他很真诚的把自己的这些感受借助下来了。","sentence_en":"And he painted some people floating in the air. I could feel that he sincerely captured his feelings."},{"id":"323","start":2297.78,"end":2311.82,"displayStart":2297.78,"displayEnd":2311.82,"displayMid":2304.8,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.7,"loudness":0.762317,"pitch":16.803253,"speechRate":4.349,"hasEvents":false,"sentence_source":"然后也想交脱出去 那是一个让我感动的瞬间，虽然当时看不出上人很多 大家都在社交 聊天 很忙，但在那个地方我觉得 那还是有艺术家在真诚的。","sentence_en":"And he also wanted to entrust it. That was a moment that moved me. Although at the time there were many people, everyone was socializing, chatting, busy, but in that place I felt that there were still artists being sincere."},{"id":"324","start":2311.82,"end":2321.34,"displayStart":2311.82,"displayEnd":2321.34,"displayMid":2316.58,"speaker":"Shen Qilan", ted suicide when she was young."},{"id":"328","start":2341.26,"end":2348.96,"displayStart":2341.26,"displayEnd":2348.96,"displayMid":2345.11,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Discussion related to art works","sentiment_en":"Negative","score":-0.3,"loudness":0.854719,"pitch":17.122335,"speechRate":5.284,"hasEvents":false,"sentence_source":"所以他会觉得生命当中有一个缺口，他想去把那些他爱的人，就是像抢救一样的去把它记录下来。","sentence_en":"So she felt there was a void in life. She wanted to rescue, so to speak, the people she loved by recording them."},{"id":"329","start":2348.96,"end":2352.96,"displayStart":2348.96,"displayEnd":2352.96,"displayMid":2350.96,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Discussion related to art works","sentiment_en":"Negative","score":-0.4,"loudness":0.906447,"pitch":19.477907,"speechRate":4.574,"hasEvents":false,"sentence_source":"然后他等于也是流浪在城市边缘社会边缘。","sentence_en":"And she also wandered on the margins of the city and society."},{"id":"330","start":2352.96,"end":2361.6,"displayStart":2352.96,"displayEnd":2361.6,"displayMid":2357.2799999999997,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Discussion related to art works","sentiment_en":"Neutral","score":0,"loudness":0.737645,"pitch":17.777956,"speechRate":4.167,"hasEvents":false,"sentence_source":"然后记录了当时最早一批算是美国的西皮吧，以及同性恋群体以及那些其实很有才华。","sentence_en":"And she recorded the earliest batches of American hippies, and the LGBT community, and those who were actually very talented."},{"id":"331","start":2361.6,"end":2368.04,"displayStart":2361.6,"displayEnd":2368.04,"displayMid":2364.8199999999997,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Discussion related to art works","sentiment_en":"Positive","score":0.7,"loudness":0.685147,"pitch":19.678957,"speechRate":5.511,"hasEvents":false,"sentence_source":"但是不被社会接受的人，在这过程当中你会发现那些 ntexts, it shines brilliantly. This has nothing to do with the artist's original life, but the work has its own new life."},{"id":"360","start":2616.72,"end":2621.36,"displayStart":2616.72,"displayEnd":2621.36,"displayMid":2619.04,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.6,"loudness":0.769774,"pitch":20.607174,"speechRate":5.172,"hasEvents":false,"sentence_source":"所以对我来说开心的地方就在于，有时候挖掘到一些作品。","sentence_en":"So for me, the joy lies in sometimes discovering some works."},{"id":"361","start":2621.36,"end":2634.7,"displayStart":2621.36,"displayEnd":2634.7,"displayMid":2628.0299999999997,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.79438,"pitch":18.596493,"speechRate":5.211,"hasEvents":false,"sentence_source":"那它能够重新产生光芒 那很开心，当然我也希望能够在这个时代当中，帮助一些艺术家也去发光，让更多的人认识到一些可能不太被人认知，但其实特别好的艺术家。","sentence_en":"And they can shine again, which makes me happy. Of course, I also hope to help some artists shine in this era, so that more people can recognize artists who might not be well-known but are truly excellent."},{"id":"362","start":2634.7,"end":2642.24,"displayStart":2634.7,"displayEnd":2642.24,"displayMid":2638.47,"speaker":"Shen Qilan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.8,"loudness":0.891904,"pitch":18.417728,"speechRate":5.042,"hasEvents":false,"sentence_source":"比如说我特别特别喜欢梁少基老师他，就是在上海当代艺术博物馆，《残我我残》那个展览。","sentence_en":"For example, I really like Teacher Liang Shaoji, especially the exhibition 'Cripple Me I Cripple' at the Shanghai Contemporary Art Museum."},{"id":"363","start":2642.24,"end":2646,"displayStart":2642.24,"displayEnd":2646,"displayMid":2644.12,"spe ated to contemporary art exhibitions","sentiment_en":"Positive","score":0.5,"loudness":0.894918,"pitch":24.061945,"speechRate":4.326,"hasEvents":false,"sentence_source":"然后两边就是书架，书架上面就真实的摆放着那些很古老的点击，有一些点击他都已经已经有一些斑驳。","sentence_en":"On both sides were bookshelves with real ancient books, some of them already mottled."},{"id":"539","start":3828.11,"end":3837.55,"displayStart":3828.11,"displayEnd":3837.55,"displayMid":3832.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Positive","score":0.5,"loudness":0.904735,"pitch":20.720602,"speechRate":4.873,"hasEvents":false,"sentence_source":"然后那个书业都已经有一些泛黄或者是被虫子钉咬掉一些些，但就很真实的在那里触手可及 当然我没有敢碰。","sentence_en":"The pages were yellowed or bitten by insects, but they were right there within reach—of course I didn't dare touch them."},{"id":"540","start":3837.55,"end":3852.39,"displayStart":3837.55,"displayEnd":3852.39,"displayMid":3844.9700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.973791,"pitch":23.724718,"speechRate":4.839,"hasEvents":true,"sentence_source":"然后整个的文化氛围还有每个角落都有可能有的历史的氛围感，很被震慑到 关键是每个角落你随便一站 随便拿手机拍，就是一个有着超强电影感的氛围感的一个大片。","sentence_en":"The entire cultural atmosphere and the historical ambiance in every corner are deeply striking. The key is that wherever you stand and snap a photo with your phone, it becomes a cinematic masterpiece."},{"id":"541","start":3853.03,"end":3859.73,"displayStart":3853.03,"displayEnd":3859.73,"displayMid":3856.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Thoughts related to contemporary art exhibitions","sentiment_en":"Negative","score":-0.5,"loudness":0.986876,"pitch":23.338884,"speechRate":4.933,"hasEvents":true,"sentence_source":"然后那天因为我要参加那个活动，就百年不遇穿一双高跟鞋，我的脚简直疼死了。","   app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
