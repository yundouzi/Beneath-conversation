34,"hasEvents":false,"sentence_source":"对 人家那个。","sentence_en":"Yeah, that's it."},{"id":"41","start":268.98,"end":272.2,"displayStart":268.98,"displayEnd":272.2,"displayMid":270.59000000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":1.087411,"pitch":29.612228,"speechRate":7.559,"hasEvents":false,"sentence_source":"相声里不就是一天到晚要调侃我们宁波人和苏州人的吗。","sentence_en":"In cross talk, they're always making fun of us Ningbo people and Suzhou people."},{"id":"42","start":272.2,"end":275.6,"displayStart":272.2,"displayEnd":275.6,"displayMid":273.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Negative","score":-0.3,"loudness":1.453203,"pitch":31.086422,"speechRate":7.5,"hasEvents":false,"sentence_source":"所以宁愿听那个苏州男人吵架，也不愿意听宁波女人说话。","sentence_en":"They'd rather hear Suzhou men argue than listen to a Ningbo woman talk."},{"id":"43","start":276.1,"end":278.52,"displayStart":276.1,"displayEnd":278.52,"displayMid":277.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Negative","score":-0.2,"loudness":1.197295,"pitch":22.14995,"speechRate":6.236,"hasEvents":false,"sentence_source":"所以你今天就是忍受我了基本上。","sentence_en":"So today you're basically putting up with me."},{"id":"44","start":279.06,"end":293.06,"displayStart":279.06,"displayEnd":293.06,"displayMid":286.06,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Positive","score":0.3,"loudness":0.984295,"pitch":22.507082,"speechRate":5,"hasEvents":false,"sentence_source":"没有 因为我自己语述是快的，我发现其实一个人语述快是因为他的思想脑子里面赚的，想法是快的是多的，你小时候有没有语言跟不上脑子的那个时候，会呀 就是但很多。","sentence_en":"No, because I speak quickly. I've found that speaking fast is because your mind is spinning, your thoughts are fast and abundant. When you were a child, did you ever have a time when your speech couldn't keep up with your thoughts? Yes, that happened a lot."},{"id":"45","start":293.06,"end":294.6,"displayStart":293.06,"displayEnd":294.6,"displayMid":293.83000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":1.292186,"pitch":28.495804,"speechRate":5.844,"hasEvents":false,"sentence_source":"时候其实也是有问题。","sentence_en":"But it can be a problem sometimes."},{"id":"46","start":294.6,"end":295.98,"displayStart":294.6,"displayEnd":295.98,"displayMid":295.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":1.215938,"pitch":25.308338,"speechRate":7.246,"hasEvents":false,"sentence_source":"因为我自己是做老师的。","sentence_en":"Since I'm a teacher myself,"},{"id":"47","start":295.98,"end":303.96,"displayStart":295.98,"displayEnd":303.96,"displayMid":299.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Negative","score":-0.3,"loudness":1.026107,"pitch":26.080639,"speechRate":7.345,"hasEvents":false,"sentence_source":"然后我好几次就是有时候比如说第一次给学生上课，总会有学生上来跟我说 当时阿老师逆上的课，我一句话都没听到或者说没听清等等。","sentence_en":"several times when I first teach a class, students come up and say, 'Teacher A, I didn't catch a word you said in your lecture."},{"id":"48","start":303.96,"end":305.36,"displayStart":303.96,"displayEnd":305.36,"displayMid":304.65999999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Negative","score":-0.5,"loudness":0.794039,"pitch":18.258692,"speechRate":5.714,"hasEvents":false,"sentence_source":"然后我就会很沮丧。","sentence_en":"And I get really frustrated."},{"id":"49","start":305.36,"end":308.56,"displayStart":305.36,"displayEnd":308.56, :"Neutral","score":0,"loudness":0.961059,"pitch":21.248728,"speechRate":6.4,"hasEvents":false,"sentence_source":"讲善话比较多 因为我老公也说上海话。","sentence_en":"do you now primarily speak Shanghai or Ningbo at home?"},{"id":"58","start":355.98,"end":358.96,"displayStart":355.98,"displayEnd":358.96,"displayMid":357.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":1.135405,"pitch":21.586197,"speechRate":4.392,"hasEvents":false,"sentence_source":"但是 平时讲话还普通话为主吧。","sentence_en":"More Shanghai, because my husband also speaks Shanghai dialect."},{"id":"59","start":358.96,"end":360.78,"displayStart":358.96,"displayEnd":360.78,"displayMid":359.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.993446,"pitch":22.71343,"speechRate":6.648,"hasEvents":false,"sentence_source":"因为学生基本上讲普通话的。","sentence_en":"But usually we speak Mandarin."},{"id":"60","start":360.78,"end":362.8,"displayStart":360.78,"displayEnd":362.8,"displayMid":361.78999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.759877,"pitch":26.24086,"speechRate":7.426,"hasEvents":false,"sentence_source":"因为我自己在大学里没有离开过嘛。","sentence_en":"Most of my students speak Mandarin."},{"id":"61","start":362.8,"end":367.84,"displayStart":362.8,"displayEnd":367.84,"displayMid":365.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.719383,"pitch":21.016228,"speechRate":5.952,"hasEvents":false,"sentence_source":"所以跟学生交往比较多 所以以普通话为主的我，孩子也不太会讲上海话。","sentence_en":"Since I've always stayed at the university,"},{"id":"62","start":367.84,"end":369.88,"displayStart":367.84,"displayEnd":369.88,"displayMid" ts has fundamentally changed. I used to be quite a purist about pronunciation."},{"id":"70","start":415.26,"end":423.88,"displayStart":415.26,"displayEnd":423.88,"displayMid":419.57,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.923892,"pitch":27.870459,"speechRate":6.973,"hasEvents":false,"sentence_source":"因为学英语好像都是这样，就是我们会比较在意自己的英语的发音，你是偏美音还是偏英语，你是不是尽可能的郑宗，当然英语都不是我们的母语。","sentence_en":"Because when learning English, we tend to care a lot about our pronunciation—whether you lean toward American or British English, whether you try to be as authentic as possible. Of course, English isn't our native language."},{"id":"71","start":423.88,"end":425.22,"displayStart":423.88,"displayEnd":425.22,"displayMid":424.55,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.710336,"pitch":22.673372,"speechRate":8.209,"hasEvents":false,"sentence_source":"所以我们肯定会有口音的。","sentence_en":"So we definitely have accents."},{"id":"72","start":425.22,"end":432.08,"displayStart":425.22,"displayEnd":432.08,"displayMid":428.65,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.789997,"pitch":25.877048,"speechRate":5.329,"hasEvents":false,"sentence_source":"然后这几年因为你只看英语每句的话，你会发现里面的人却讲着不同口音的英语。","sentence_en":"And in recent years, if you just watch English movies, you'll find people speaking English with different accents."},{"id":"73","start":432.08,"end":432.9,"displayStart":432.08,"displayEnd":432.9,"displayMid":432.49,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":1.114892,"pitch":30.267738,"speechRate":6.154,"hasEvents":false,"sentence_source":"那肯定您。","sentence_en":"That's for sure."},{"id":"74","start":432.9,"end":441.04,"displayStart":432.9,"displayEnd":441.04,"displayMid":436.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.962922,"pitch":27.150068,"speechRate":5.7,"hasEvents":false,"sentence_source":"尤其看那个像权力的游戏里面，就是说每一个地方的人都讲的不同的英文，而且他特意要做成不同方言的英文。","sentence_en":"Especially in shows like Game of Thrones, people from different regions speak English in different accents, and they intentionally make it like different dialects."},{"id":"75","start":441.04,"end":444.1,"displayStart":441.04,"displayEnd":444.1,"displayMid":442.57000000000005,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.923274,"pitch":27.596375,"speechRate":3.571,"hasEvents":false,"sentence_source":"是的 所以我就再次认定。","sentence_en":"Yes, so I confirmed once again."},{"id":"76","start":444.1,"end":458.76,"displayStart":444.1,"displayEnd":458.76,"displayMid":451.43,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Neutral","score":0,"loudness":0.892426,"pitch":23.8283,"speechRate":5.048,"hasEvents":false,"sentence_source":"其实所谓的标准的语音，只是我们后天认为的都不是约定俗成的，就是它会某种程度被某些人决定了，这个就是标准的口音 然后我们会接受，但其实我现在越来越认为不同的方言。","sentence_en":"In fact, so-called standard pronunciation is not something we naturally agree on; it's determined to some extent by certain people. This becomes the standard accent, and we accept it. But now I increasingly believe that different dialects..."},{"id":"77","start":458.76,"end":462.84,"displayStart":458.76,"displayEnd":462.84,"displayMid":460.79999999999995,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Positive","score":0.5,"loudness":0.654622,"pitch":17.631523,"speechRate":4.657,"hasEvents":false,"sentence_source":"不同的口音都有它自己存在特别重要的意义。","sentence_en":"Different accents have their own significant meaning for existence."},{"id":"78","start":462.84,"end":472.28,"displayStart":462.84,"displayEnd":472.28,"displayMid":467.55999999999995,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Accents and dialects","sentiment_en":"Positive","score":0.6,"loudness":0.909501,"pitch":25.288513,"speechRate":6.858,"hasEvents":false,"sentence_source":"所以我现在觉得我要是讲英语的话，我的确就应该让人能够听出来，我是来自比如中国某个地区，有自己很独特的一个标记，这是很重要的 我先发现。","sentence_en":"So now I think when I speak English, I should let people hear that I'm from a certain region in China, with my own unique marker. That's what I first discovered is very important."},{"id":"79","start":472.28,"end":474.14,"displayStart":472.28,"displayEnd":474.14,"displayMid":473.21,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Previous paintings","sentiment_en":"Positive","score":0.6,"loudness":0.820478,"pitch":30.456171,"speechRate":6.997,"hasEvents":false,"sentence_source":"对，你说的是这个我特别赞同。","sentence_en":"Yes, I totally agree with what you said."},{"id":"80","start":474.14,"end":484.36,"displayStart":474.14,"displayEnd":484.36,"displayMid":479.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Positive","score":0.4,"loudness":0.970018,"pitch":29.018015,"speechRate":7.045,"hasEvents":false,"sentence_source":"就之前就是我们跟干亚老师聊天的时候还说，干亚老师他有一个比较激进的一个说法，当然他这个话说的有点戏削了，他说我们这种人，他说英文如果说得太好的话丢脸的呀。","sentence_en":"Earlier when we were chatting with Teacher Gan Ya, he had a somewhat radical opinion, though he said it in a joking way. He said people like us would be embarrassed if we spoke English too well."},{"id":"81","start":484.36,"end":489.54,"displayStart":484.36,"displayEnd":489.54,"displayMid":486.95000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.080747,"pitch":33.296707,"speechRate":7.895,"hasEvents":false,"sentence_source":"意思就是你不要说得太标准，不要搞得自己很像伦敦枪啊，他说的或者是纽约枪很正宗一样的。","sentence_en":"Meaning you shouldn't speak too standard, like you're from London or New York."},{"id":"82","start":489.54,"end":492.4,"displayStart":489.54,"displayEnd":492.4,"displayMid":490.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Positive","score":0.5,"loudness":0.999522,"pitch":32.715427,"speechRate":8.381,"hasEvents":false,"sentence_source":"所以我现在我自己说英文，我要流露出那种宁波口音。","sentence_en":"So now when I speak English, I let my Ningbo accent come through."},{"id":"83","start":492.4,"end":498.26,"displayStart":492.4,"displayEnd":498.26,"displayMid":495.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Positive","score":0.6,"loudness":0.90469,"pitch":28.171442,"speechRate":6.485,"hasEvents":false,"sentence_source":"我觉得还蛮好玩的，这种一方面当然是因为就是年纪大了，可能那种对云的控制能力就弱了。","sentence_en":"I think it's fun. On one hand, of course, as I get older, my control over sounds weakens."},{"id":"84","start":498.26,"end":504.24,"displayStart":498.26,"displayEnd":504.24,"displayMid":501.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Positive","score":0.7,"loudness":0.940066,"pitch":27.402031,"speechRate":6.385,"hasEvents":false,"sentence_source":"但是流露出一些宁波枪我觉得还挺好的，就是他告诉我自己的来路，也告诉对方我的来路。","sentence_en":"But letting out some Ningbo accent is actually nice—it tells others where I come from, and it also reminds me of my own roots."},{"id":"85","start":504.6,"end":513.46,"displayStart":504.6,"displayEnd":513.46,"displayMid":509.03000000000003,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.034567,"pitch":24.79287,"speechRate":5.412,"hasEvents":false,"sentence_source":"对 因为我记得当时，麦当娜跟那个Guy Richie 盖里奇，恋爱后来结婚，他比我很长一段时间生活在伦敦嘛。","sentence_en":"Yes, because I remember Madonna and Guy Ritchie dated and later got married. She lived in London for quite a long time."},{"id":"86","start":513.46,"end":521.92,"displayStart":513.46,"displayEnd":521.92,"displayMid":517.69,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.894226,"pitch":25.79294,"speechRate":5.674,"hasEvents":false,"sentence_source":"然后人就是这样，你在一个环境里面生活长了，你的语音一定会受当地影响的，他也不是刻意说装，但他回到美国之后。","sentence_en":"And that's how people are. If you live in an environment long enough, your accent will be influenced. She didn't deliberately pretend, but after returning to the US..."},{"id":"87","start":521.92,"end":527.72,"displayStart":521.92,"displayEnd":527.72,"displayMid":524.8199999999999,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.892009,"pitch":22.303177,"speechRate":4.483,"hasEvents":false,"sentence_source":"然后美国人发现，麦当娜讲话居然有了英国口音，就各种嘲笑他。","sentence_en":"Then Americans found that Madonna spoke with a British accent, and they made fun of her."},{"id":"88","start":527.72,"end":536.26,"displayStart":527.72,"displayEnd":536.26,"displayMid":531.99,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.051203,"pitch":26.625782,"speechRate":5.269,"hasEvents":false,"sentence_source":"所以你会发现其实，一个人你的某种语音，你的某种语音的呈现，还是会好像代表你的审美，代表你的某种选择。","sentence_en":"So you realize that the way you present your accent actually represents your aesthetics and your choices."},{"id":"89","start":536.8,"end":540.84,"displayStart":536.8,"displayEnd":540.84,"displayMid":538.8199999999999,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.984984,"pitch":21.343245,"speechRate":7.037,"hasEvents":false,"sentence_source":"所以我现在就是对语音方面，刚才讲到我会有这样的一个看法。","sentence_en":"So now regarding accents, as I said earlier, this is my view."},{"id":"90","start":540.84,"end":543.22,"displayStart":540.84,"displayEnd":543.22,"displayMid":542.03,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.860354,"pitch":24.506561,"speechRate":5.286,"hasEvents":false,"sentence_source":"然后毛尖就是你的本名是吧。","sentence_en":"And Mao Jian is your real name, right?"},{"id":"91","start":543.22,"end":545.7,"displayStart":543.22,"displayEnd":545.7,"displayMid":544.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.014596,"pitch":31.318392,"speechRate":5.652,"hasEvents":false,"sentence_source":"对 这是初登前就取好的证明了。","sentence_en":"Yes, it was chosen before I debuted. That's proof."},{"id":"92","start":545.7,"end":553.68,"displayStart":545.7,"displayEnd":553.68,"displayMid":549.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.97166,"pitch":26.637451,"speechRate":5.514,"hasEvents":false,"sentence_source":"因为我是跟我外公性的，就是我妈妈家和我小一家都住在外公家的，就是我外公生了两个女儿，我妈我姨嘛。","sentence_en":"Because I took my grandfather's surname. My mother's family and my aunt's family all lived with my grandfather. He had two daughters: my mother and my aunt."},{"id":"93","start":553.68,"end":555.62,"displayStart":553.68,"displayEnd":555.62,"displayMid":554.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.090202,"pitch":30.686235,"speechRate":4.531,"hasEvents":false,"sentence_source":"然后就没有男的。","sentence_en":"There were no sons."},{"id":"94","start":555.62,"end":558.04,"displayStart":555.62,"displayEnd":558.04,"displayMid":556.8299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":1.159878,"pitch":30.517218,"speechRate":6.048,"hasEvents":false,"sentence_source":"然后呢我妈又生了我姐又生女的。","sentence_en":"Then my mother had my sister and then another girl."},{"id":"95","start":558.04,"end":560.46,"displayStart":558.04,"displayEnd":560.46,"displayMid":559.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.947296,"pitch":31.999092,"speechRate":7.438,"hasEvents":false,"sentence_source":"所以外公就特别希望就是有一个孩子性谋。","sentence_en":"So my grandfather really wanted one child to carry on his surname."},{"id":"96","start":560.46,"end":562.8,"displayStart":560.46,"displayEnd":562.8,"displayMid":561.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.880658,"pitch":26.035164,"speechRate":5.556,"hasEvents":false,"sentence_source":"所以就说在我出生前就说好了。","sentence_en":"It was decided before I was born."},{"id":"97","start":562.8,"end":567.04,"displayStart":562.8,"displayEnd":567.04,"displayMid":564.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family Experience","sentiment_en":"Neutral","score":0,"loudness":0.887479,"pitch":23.518299,"speechRate":6.604,"hasEvents":false,"sentence_source":"然后我爸反正也无所谓，就是说第二个生出来的孩子就跟我外公性。","sentence_en":"My father didn't mind, so the second child would take my grandfather's surname."},{"id":"98","start":567.04,"end":568.76,"displayStart":567.04 oned. I still remember that The Count of Monte Cristo was rationed."},{"id":"144","start":798.04,"end":804.64,"displayStart":798.04,"displayEnd":804.64,"displayMid":801.3399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Positive","score":0.6,"loudness":0.850519,"pitch":26.903414,"speechRate":7.015,"hasEvents":false,"sentence_source":"然后到我们家的那天 哎呀简直是太隆重了，很多人都来看，好像那个基督三伯爵是一个什么西式珍宝一样的。","sentence_en":"Then on the day he arrived at our house, it was so grand—so many people came to see him, as if that Count of Monte Cristo were some kind of Western treasure."},{"id":"145","start":804.64,"end":809.2,"displayStart":804.64,"displayEnd":809.2,"displayMid":806.9200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Negative","score":-0.4,"loudness":0.814683,"pitch":22.500908,"speechRate":6.36,"hasEvents":false,"sentence_source":"然后这个书也不后来就是被传来传去传来传去的借，到后来也借丢了。","sentence_en":"Then the book was passed around and borrowed so many times that eventually it got lost."},{"id":"146","start":809.2,"end":814.88,"displayStart":809.2,"displayEnd":814.88,"displayMid":812.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.982466,"pitch":26.069054,"speechRate":5.441,"hasEvents":false,"sentence_source":"但是一般意义上来说，就是我还算是能接触到比较多书籍的一个人吧。","sentence_en":"But generally speaking, I was someone who had access to quite a lot of books."},{"id":"147","start":814.88,"end":816.96,"displayStart":814.88,"displayEnd":816.96,"displayMid":815.9200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Positive","score":0.4,"loudness":0.917047,"pitch":18.022141,"speechRate":5.288,"hasEvents":false,"sentence_source":"然后或者说比较爱书籍的。","sentence_en":"Or rather, ol. Lu Guang wrote reportage; he wrote 'Chinese Girls'—I don't know if you remember—about the Chinese women's volleyball team."},{"id":"160","start":887,"end":889.44,"displayStart":887,"displayEnd":889.44,"displayMid":888.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Previous paintings","sentiment_en":"Neutral","score":0,"loudness":1.055664,"pitch":26.643913,"speechRate":5.328,"hasEvents":false,"sentence_source":"排说啥都因为是通过电视看的。","sentence_en":"We watched the volleyball games on TV."},{"id":"161","start":889.44,"end":891.18,"displayStart":889.44,"displayEnd":891.18,"displayMid":890.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Previous paintings","sentiment_en":"Positive","score":0.7,"loudness":0.884967,"pitch":26.038918,"speechRate":7.471,"hasEvents":false,"sentence_source":"那时候真的很激励激励我们的。","sentence_en":"It really inspired us back then."},{"id":"162","start":891.18,"end":895.4,"displayStart":891.18,"displayEnd":895.4,"displayMid":893.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.929626,"pitch":26.68598,"speechRate":6.25,"hasEvents":false,"sentence_source":"但是我没有看报告文学，我那时候收获杂志也看 主要看小说。","sentence_en":"But I wasn't reading reportage then. I read 'Harvest' magazine too, mostly the fiction."},{"id":"163","start":895.4,"end":903.88,"displayStart":895.4,"displayEnd":903.88,"displayMid":899.64,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.895168,"pitch":22.844185,"speechRate":5.896,"hasEvents":false,"sentence_source":"对 她当时是国家体委体系的一个官员，也是很自身记者，她有写那个《中国女排》《中国姑娘》，后来很多的电视剧影视剧的改编。","sentence_en":"Right, she was an official in the National Sports Commission and also a journalist. She wrote 'Chinese Women's Volleyball' and 'Chinese Girls,' which later inspired m ng","sentiment_en":"Neutral","score":0,"loudness":0.833165,"pitch":23.306707,"speechRate":5.13,"hasEvents":false,"sentence_source":"我还记得那时候老是让我们每个年龄段都会老是让你写一下什么，就是我的理想或者说新年愿往之诸如此类的东西，但我记得我有一次真的是去写了一个作家。","sentence_en":"I still remember how back then, at every age, they'd always make you write something like 'My Dream' or 'New Year's Wish' or stuff like that. But I recall one time when I actually wrote 'writer."},{"id":"172","start":972.9,"end":978,"displayStart":972.9,"displayEnd":978,"displayMid":975.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Negative","score":-0.5,"loudness":0.950341,"pitch":27.64484,"speechRate":5.72,"hasEvents":false,"sentence_source":"我想以后成为一个作家就很羞愧的，就说马上被同学嘲笑了你知道吗。","sentence_en":"I wanted to become a writer, but I felt so embarrassed—my classmates immediately made fun of me, you know?"},{"id":"173","start":978,"end":981.32,"displayStart":978,"displayEnd":981.32,"displayMid":979.6600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.970096,"pitch":33.388569,"speechRate":7.396,"hasEvents":false,"sentence_source":"因为那个时候作家是有光环的，他觉得你这么一个普通人。","sentence_en":"Back then, writers had an aura, and they thought, 'Someone ordinary like you?"},{"id":"174","start":981.32,"end":985.66,"displayStart":981.32,"displayEnd":985.66,"displayMid":983.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Negative","score":-0.4,"loudness":1.015267,"pitch":28.229017,"speechRate":4.301,"hasEvents":false,"sentence_source":"然后就只有个男生，就是用那种非常可笑的。","sentence_en":"Only one guy, in this really ridiculous tone,"},{"id":"175","start":985.66,"end":998.28,"displayStart":985.66,"displayEnd":998.28,"displayMid":991.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Negative","score":-0.6,"loudness":1.022969,"pitch":31.773521,"speechRate":5.626,"hasEvents":false,"sentence_source":"然后也很奇怪的去说，哇 他要成为作家，哇 下次我觉得自己好丢脸，就觉得就是说也不好说，是来不及他们想吃天鹅炉，好像你的一种，就是内心的愿望被那种，失踪了那种感觉。","sentence_en":"and weirdly said, 'Wow, he wants to be a writer.' I felt so humiliated—I couldn't even say it, like a toad lusting after a swan; it felt as if my inner wish had been shot down."},{"id":"176","start":998.28,"end":1003.72,"displayStart":998.28,"displayEnd":1003.72,"displayMid":1001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.945658,"pitch":26.638628,"speechRate":5.331,"hasEvents":false,"sentence_source":"所以也没有说要成为作家，到时候我们在，我现在还记得我们初中时候。","sentence_en":"So I never said I wanted to become a writer. Then later, I still remember in junior high,"},{"id":"177","start":1003.72,"end":1006.82,"displayStart":1003.72,"displayEnd":1006.82,"displayMid":1005.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Positive","score":0.5,"loudness":0.661242,"pitch":17.299444,"speechRate":4.878,"hasEvents":false,"sentence_source":"我们一起办了一个文学期刊叫《野草》。","sentence_en":"we started a literary journal together called 'Wild Grass."},{"id":"178","start":1007.38,"end":1010.02,"displayStart":1007.38,"displayEnd":1010.02,"displayMid":1008.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.82416,"pitch":25.023802,"speechRate":6.501,"hasEvents":false,"sentence_source":"然后呢 用取的是鲁迅的那个《野草》的名字。","sentence_en":"We took the name from Lu Xun's 'Wild Grass."},{"id":"179","start":1010.02,"end":1015.04,"displayStart":1010.02,"displayEnd":1015.04,"displayMid":1012.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.887316,"pitch":25.98373,"speechRate":6.674,"hasEvents":false,"sentence_source":"那时候也 也兴大夫的说 也人也蛮朴实的，就是说给全中国很多作家写的信了。","sentence_en":"Back then we were quite sincere and simple—we wrote letters to many writers across China."},{"id":"180","start":1015.04,"end":1024.18,"displayStart":1015.04,"displayEnd":1024.18,"displayMid":1019.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.776311,"pitch":19.122972,"speechRate":6.108,"hasEvents":false,"sentence_source":"然后也没有地址的 写什么什么作写说，我记得还给王阿姨写过信，两小生那时候挺有名的 给他们写过信，但没有一个人给我们回信的。","sentence_en":"Without an address, just writing 'To so-and-so author.' I remember writing to Wang Anyi, and also to 'Two Little Students' who were famous then. But no one ever replied."},{"id":"181","start":1024.18,"end":1026.96,"displayStart":1024.18,"displayEnd":1026.96,"displayMid":1025.5700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.954401,"pitch":28.50087,"speechRate":7.737,"hasEvents":false,"sentence_source":"但是呢 我们没有回信的说实在的也是意料中的。","sentence_en":"But honestly, we expected no reply."},{"id":"182","start":1026.96,"end":1036.96,"displayStart":1026.96,"displayEnd":1036.96,"displayMid":1031.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.734685,"pitch":22.352585,"speechRate":5.984,"hasEvents":false,"sentence_source":"但是那种好像 就是给他们写信本身已经是一种好像天大的梦想了，就这些都是很虚的东西，没有真正的一个说我要长大要干什么什么什么的。","sentence_en":"Yet just writing those letters felt like an enormous dream; it was all very abstract, not a real plan like 'I'll do this when I grow up."},{"id":"183","start":1036.96,"end":1046.66,"displayStart":1036.96,"displayEnd":1046.66,"displayMid":1041.81,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.785713,"pitch":24.517651,"speechRate":6.155,"hasEvents":false,"sentence_source":"那就是促使你有这样一个作家梦想的，有没有一个具体的人还是一个作家的群像，只是因为你读了很多的书，但不会是因为具体的某一个偶像。","sentence_en":"So what sparked that writer dream—was it a specific person or an image of writers in general? Just because you read a lot, but not because of one idol?"},{"id":"184","start":1047.26,"end":1050.08,"displayStart":1047.26,"displayEnd":1050.08,"displayMid":1048.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.891901,"pitch":28.798658,"speechRate":5.293,"hasEvents":false,"sentence_source":"就是读了很多书也没有什么具体。","sentence_en":"Yeah, just reading a lot, nothing specific."},{"id":"185","start":1050.08,"end":1055.06,"displayStart":1050.08,"displayEnd":1055.06,"displayMid":1052.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Positive","score":0.6,"loudness":0.838766,"pitch":26.279797,"speechRate":6.079,"hasEvents":false,"sentence_source":"那时候说我的文学的真正的要说起门的，或者说给我巨大影响的是金庸。","sentence_en":"Back then, when it comes to really opening the door to literature or having a huge influence on me, it was Jin Yong."},{"id":"186","start":1055.06,"end":1064.44,"displayStart":1055.06,"displayEnd":1064.44,"displayMid":1059.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.842366,"pitch":24.02137,"speechRate":4.478,"hasEvents":false,"sentence_source":"但是因为武侠小说在那个时候，还并不是说进入殿堂的，金庸要进入文学课堂 其实是1988年之后。","sentence_en":"But wuxia novels weren't considered highbrow back then; Jin Yong only entered literature classes after 1988."},{"id":"187","start":1064.44,"end":1074.64,"displayStart":1064.44,"displayEnd":1074.64,"displayMid":1069.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.782301,"pitch":22.94146,"speechRate":5,"hasEvents":false,"sentence_source":"我们在初中时候 或者说甚至更小一点的时候，去看金庸 多少代的一点点，看进书 或者说看父母不要你看得输的这种愿望的。","sentence_en":"In junior high or even earlier, reading Jin Yong came with a bit of guilt—like sneaking in forbidden books that your parents didn't want you to read."},{"id":"188","start":1074.64,"end":1085.34,"displayStart":1074.64,"displayEnd":1085.34,"displayMid":1079.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.844135,"pitch":21.707525,"speechRate":4.726,"hasEvents":false,"sentence_source":"我们那时候给金庸 无论是射雕也好，还是射药江湖也好 还是后来的天龙八博，都是给他包上中学语文 数学辅导书这样的。","sentence_en":"We'd wrap his books—whether 'Legend of the Condor Heroes,' 'Return of the Condor Heroes,' or later 'Demi-Gods and Semi-Devils'—in covers of middle school Chinese or math textbooks."},{"id":"189","start":1085.34,"end":1091.12,"displayStart":1085.34,"displayEnd":1091.12,"displayMid":1088.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.733569,"pitch":18.390892,"speechRate":5.546,"hasEvents":false,"sentence_source":"然后拿出来看，他们好像和余果还不是一个等级的，老师也不支持你看金庸的。","sentence_en":"Then take them out to read. He wasn't on the same level as the other authors, and teachers didn't support you reading Jin Yong."},{"id":"190","start":1091.12,"end":1093.76,"displayStart":1091.12,"displayEnd":1093.76,"displayMid":1092.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.835369,"pitch":28.099424,"speechRate":6.019,"hasEvents":false,"sentence_source":"所以成为金庸不是我们的梦想。","sentence_en":"So becoming Jin Yong wasn't our dream."},{"id":"191","start":1093.76,"end":1099.1,"displayStart":1093.76,"displayEnd":1099.1,"displayMid":1096.4299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.678084,"pitch":22.931046,"speechRate":5.618,"hasEvents":false,"sentence_source":"但是我们又非常深刻地受金庸的影响，就是这么一个很奇怪的一个状态。","sentence_en":"But we were still deeply influenced by him—a very odd state of affairs."},{"id":"192","start":1099.1,"end":1101.3,"displayStart":1099.1,"displayEnd":1101.3,"displayMid":1100.1999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.789698,"pitch":21.490009,"speechRate":5.455,"hasEvents":false,"sentence_source":"所以就文学的这个序列里面。","sentence_en":"So in the literary canon,"},{"id":"193","start":1101.3,"end":1105.08,"displayStart":1101.3,"displayEnd":1105.08,"displayMid":1103.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.740357,"pitch":20.494427,"speechRate":5.322,"hasEvents":false,"sentence_source":"我们更多的受就是收获上的很多作家的影响。","sentence_en":"we were more influenced by many authors from Harvest magazine."},{"id":"194","start":1105.08,"end":1108.7,"displayStart":1105.08,"displayEnd":1108.7,"displayMid":1106.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.87065,"pitch":21.215977,"speechRate":4.255,"hasEvents":false,"sentence_source":"那时候王安逸 莫言 余华 包括后来的。","sentence_en":"Like Wang Anyi, Mo Yan, Yu Hua, and later,"},{"id":"195","start":1108.7,"end":1112.94,"displayStart":1108.7,"displayEnd":1112.94,"displayMid":1110.8200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","s ch and colorful cultural and artistic life, right?"},{"id":"236","start":1317.94,"end":1324.5,"displayStart":1317.94,"displayEnd":1324.5,"displayMid":1321.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.91934,"pitch":26.66608,"speechRate":5.057,"hasEvents":false,"sentence_source":"是 因为华世大一直是上海的那个文艺中心嘛，作家也多 关东是在一个作家群嘛。","sentence_en":"Yes, because Huashi University was always Shanghai's cultural center. There were many writers, like a cluster of writers in Guandong."},{"id":"237","start":1324.5,"end":1336.62,"displayStart":1324.5,"displayEnd":1336.62,"displayMid":1330.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Positive","score":0.5,"loudness":0.660481,"pitch":22.020033,"speechRate":5.363,"hasEvents":false,"sentence_source":"所以请来的作家非常多 会在广场上朗诵啊，我就还记得给我们上写作课的那个老师凤凛，他在台上那个一边朗诵自己的诗稿，一边把自己的诗稿往台下扔了。","sentence_en":"So many writers were invited; they would recite poems on the square. I remember our writing teacher, Feng Lin, reciting his poems on stage and tossing them into the crowd."},{"id":"238","start":1336.62,"end":1348.94,"displayStart":1336.62,"displayEnd":1348.94,"displayMid":1342.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Childhood Reading","sentiment_en":"Neutral","score":0,"loudness":0.719273,"pitch":21.412941,"speechRate":5.682,"hasEvents":false,"sentence_source":"然后真的就是说有女孩子为了抢他的诗稿，都差点走光了，在那个时候 华斯大尔的最美的女孩，都是跟世人走的，有非常漂亮的姑娘，嫁那一代的 然后跟着世人去导了亲孩。","sentence_en":"And girls almost flashed themselves trying to grab his poems. Back then, the most beautiful girls at Huashi University were with poets—very pretty girls married poets and followed them to the Qinghai-Tibet Plateau."},{"id":"239","start":1348.94,"end":1350.44,"displayStart":1348.94,"displayEnd":1350.44,"displayMid":1349.69,"speaker":"Lu Yu","speakerColor":"#995A91","c s on Basic Education","sentiment_en":"Neutral","score":0,"loudness":0.961181,"pitch":22.481413,"speechRate":5.119,"hasEvents":false,"sentence_source":"或者说他说他只有到了58岁那一年，他才真正从青春期里面跋涉出来。","sentence_en":"Or he said that only at 58 did he truly emerge from adolescence."},{"id":"251","start":1435.82,"end":1442.12,"displayStart":1435.82,"displayEnd":1442.12,"displayMid":1438.9699999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Neutral","score":0,"loudness":0.837528,"pitch":27.697569,"speechRate":6.825,"hasEvents":false,"sentence_source":"我觉得我自己好像一直也是在这个青春期里面沉沉浮浮，就跟我们华世大的整个校园气氛是有关系的。","sentence_en":"I feel like I've been floating through this adolescence, and it's related to the whole atmosphere at Huashi University."},{"id":"252","start":1442.94,"end":1452.18,"displayStart":1442.94,"displayEnd":1452.18,"displayMid":1447.56,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Positive","score":0.4,"loudness":0.902061,"pitch":24.343897,"speechRate":4.454,"hasEvents":false,"sentence_source":"但你这么说 我觉得我也还处于一个漫长的青春期的状态里面，这不是一个挺奢侈的状态 我觉得。","sentence_en":"But hearing you say that, I think I'm still in a prolonged adolescence. It's a pretty luxurious state, I think."},{"id":"253","start":1452.18,"end":1463.16,"displayStart":1452.18,"displayEnd":1463.16,"displayMid":1457.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Neutral","score":0,"loudness":0.953482,"pitch":26.51144,"speechRate":4.918,"hasEvents":false,"sentence_source":"很奢侈的，但我现在我有点改变 比如说我年轻的时候，或者我小的时候 比如说我跟我妈的那种，是有很多美学上的争执就是摩擦的。","sentence_en":"It's very luxurious. But now I've changed a bit. For example, when I was young or little, my mom and I had many aesthetic disagreements and frictions."},{"id":"254","start":1463.16,"end":1470.48,"displayStart":1463.16,"displa ":5.593,"hasEvents":false,"sentence_source":"我其实有点说不清楚，但我觉得我有时候看到我妈，她在城市里偷偷的养了两个鸡，她给鸡按摩 然后把给鸡的食物做得非常好，我真的觉得我真的没有那么懂她。","sentence_en":"I'm not sure how to put it, but sometimes I see my mom secretly raising two chickens in the city. She massages them and makes their food really well. I really feel I don't understand her that well."},{"id":"312","start":1837.86,"end":1846.22,"displayStart":1837.86,"displayEnd":1846.22,"displayMid":1842.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Strongly Negative","score":-0.7,"loudness":0.689466,"pitch":23.752926,"speechRate":5.622,"hasEvents":false,"sentence_source":"她有她自己可能非常丰富的内心生活，但这个内心生活我其实已经走不进她了，这个其实里面有一种绝望的东西。","sentence_en":"She probably has a very rich inner life, but I can no longer enter that inner life. There's something desperate about it."},{"id":"313","start":1846.6,"end":1857.34,"displayStart":1846.6,"displayEnd":1857.34,"displayMid":1851.9699999999998,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Negative","score":-0.3,"loudness":0.655784,"pitch":22.965214,"speechRate":5.218,"hasEvents":false,"sentence_source":"你说这种绝望的感觉我特别理解，就是我们其实人与人之间的关系从一开始养成之后，你是无法改变的 比如说我们跟我们的父母的。","sentence_en":"I totally understand that feeling of despair. The relationship between people, once formed from the beginning, is impossible to change—like with our parents."},{"id":"314","start":1857.34,"end":1871.6,"displayStart":1857.34,"displayEnd":1871.6,"displayMid":1864.4699999999998,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Views on Basic Education","sentiment_en":"Negative","score":-0.5,"loudness":0.65084,"pitch":21.280054,"speechRate":4.927,"hasEvents":false,"sentence_source":"我们互相之间我们互动的模式就是如此，你到后来你想打破它是无法打破的，这点就特别的很遗憾 你会发现哪怕是有，深刻的血脉存在 它都无法打破已经既定的东西。","sentence_en":"Our interaction pattern is just like that. Late 63.54,"displayEnd":3476.76,"displayMid":3470.15,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.5,"loudness":0.984498,"pitch":27.89992,"speechRate":5.9,"hasEvents":false,"sentence_source":"我那天看了一篇文章 然后你当然就讲到，你说怎么样去定义一个假期，你说如果这个假期只有一天的话 就很像是罗马假日，七天像段卑山 然后一个月的话可能，好像那个以我的名字呼唤你。","sentence_en":"I read an article the other day where you talked about how to define a holiday. You said if it's just one day, it's like 'Roman Holiday'; seven days like 'Brokeback Mountain'; one month maybe like 'Call Me by Your Name'."},{"id":"571","start":3476.76,"end":3490.88,"displayStart":3476.76,"displayEnd":3490.88,"displayMid":3483.82,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.7,"loudness":0.84178,"pitch":24.549034,"speechRate":4.419,"hasEvents":false,"sentence_source":"然后我当时会觉得 我说 这个很妙，就这是你一直以来的你的一个习惯，这个特点你是如何去养成的，就是从貌似很多不相干的，分番复杂的信息当中。","sentence_en":"And I thought, that's brilliant. This is a habit of yours. How did you develop this trait of finding such a clear, unique angle from seemingly many unrelated, complex pieces of information?"},{"id":"572","start":3490.88,"end":3494.46,"displayStart":3490.88,"displayEnd":3494.46,"displayMid":3492.67,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.6,"loudness":0.701074,"pitch":17.917187,"speechRate":5.997,"hasEvents":false,"sentence_source":"找到这样一个特别明确的，又很独特的一个角度。","sentence_en":"Finding such a clear and unique angle."},{"id":"573","start":3495.1,"end":3506.18,"displayStart":3495.1,"displayEnd":3506.18,"displayMid":3500.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.2,"loudness":0.806128,"pitch":27.335173,"speechRate":6.187,"hasEvents":false,"sentence_source":"我也不好说，你当然这么说 我也挺高兴的，就好像是我的一个特点似的，但我其实 主要我觉得受制于，我一些影片也好 做电影研究也好，我没有受过特别规范的训练。","sentence_en":"I can't say for sure. Of course, I'm glad you say that, as if it's a trait of mine. But actually, I think it's mainly due to the fact that I've never had formal training, whether in making films or doing film studies."},{"id":"574","start":3506.18,"end":3508.04,"displayStart":3506.18,"displayEnd":3508.04,"displayMid":3507.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0,"loudness":0.791502,"pitch":27.321692,"speechRate":5.914,"hasEvents":false,"sentence_source":"因为我本科读的是英文的。","sentence_en":"Because my undergraduate degree was in English."},{"id":"575","start":3508.04,"end":3512.64,"displayStart":3508.04,"displayEnd":3512.64,"displayMid":3510.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0,"loudness":0.799159,"pitch":26.435587,"speechRate":5.652,"hasEvents":false,"sentence_source":"然后研究生读的是中国现代的，后来那个博士读的是人文学的。","sentence_en":"Then my master's was in Modern Chinese, and later my PhD was in Humanities."},{"id":"576","start":3512.64,"end":3518.04,"displayStart":3512.64,"displayEnd":3518.04,"displayMid":3515.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":-0.1,"loudness":0.786418,"pitch":26.945614,"speechRate":5.421,"hasEvents":false,"sentence_source":"所以我其实一直没有做过正宗的电影学，或者说电影方面的训练的。","sentence_en":"So I've actually never had proper training in film studies or filmmaking."},{"id":"577","start":3518.04,"end":3526.44,"displayStart":3518.04,"displayEnd":3526.44,"displayMid":3522.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.2,"loudness":0.856837,"pitch":24.54196,"speechRate":4.291,"hasEvents":false,"sentence_source":"所以我的视角相对来说是比较贴普通观众的，但因为我又自己确实看了非常多的电影。","sentence_en":"So my perspective is relatively close to that of an average audience, but I have also watched a lot of movies myself."},{"id":"578","start":3526.44,"end":3531.38,"displayStart":3526.44,"displayEnd":3531.38,"displayMid":3528.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.5,"loudness":0.702631,"pitch":22.53496,"speechRate":6.68,"hasEvents":false,"sentence_source":"但是自己把自己培养成了一个，就是说至少有研究生理论水准的一个写作者吧。","sentence_en":"But I've cultivated myself into a writer with at least a graduate-level theoretical understanding."},{"id":"579","start":3531.38,"end":3535.72,"displayStart":3531.38,"displayEnd":3535.72,"displayMid":3533.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.1,"loudness":0.817765,"pitch":24.078783,"speechRate":4.151,"hasEvents":false,"sentence_source":"那我又会脱离掉一个就是太过于平常的。","sentence_en":"And that helps me avoid being too ordinary."},{"id":"580","start":3535.72,"end":3546.08,"displayStart":3535.72,"displayEnd":3546.08,"displayMid":3540.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.4,"loudness":0.776659,"pitch":25.229269,"speechRate":5.985,"hasEvents":false,"sentence_source":"所以我相对来说觉得我的一个自我的一个愿望说，写作中不要有习气，不要一天天到晚搞得好像论什么论什么一样的，就是用习文论建的方式来写作。","sentence_en":"So I feel my personal desire is to avoid clichés in my writing—not constantly trying to sound like an academic treatise, but writing in a more accessible style."},{"id":"581","start":3546.08,"end":3551.94,"displayStart":3546.08,"displayEnd":3551.94,"displayMid":3549.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Negative","score":-0.3,"loudness":0.886141,"pitch":23.959661,"speechRate":4.471,"hasEvents":false,"sentence_source":"然后呢 我觉得就是整个电影评论，理论那个我觉得速度太慢了。","sentence_en":"And I think that for film criticism in general, the theoretical approach is too slow."},{"id":"582","start":3551.94,"end":3563.6,"displayStart":3551.94,"displayEnd":3563.6,"displayMid":3557.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.2,"loudness":0.707368,"pitch":22.108818,"speechRate":4.934,"hasEvents":false,"sentence_source":"因为我整体会觉得就是未来整个美学，都是会在速度上求就是增足高下的，你看我文章或者说别人看我文章，经常会觉得我就是不太累。","sentence_en":"Because I believe the future of aesthetics will be about speed—increasing the pace. When people read my articles, they often feel they're not tiring."},{"id":"583","start":3563.6,"end":3572.76,"displayStart":3563.6,"displayEnd":3572.76,"displayMid":3568.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.1,"loudness":0.713477,"pitch":19.243618,"speechRate":5.24,"hasEvents":false,"sentence_source":"那我觉得是因为就是我写文章追求一个速度的，我因为专栏出生的 我大量的时间再写专栏，专栏经常是1000字。","sentence_en":"I think that's because I aim for speed in my writing. I come from writing columns, which are often 1000 words."},{"id":"584","start":3572.76,"end":3581.36,"displayStart":3572.76,"displayEnd":3581.36,"displayMid":3577.0600000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0,"loudness":0.749983,"pitch":22.377771,"speechRate":6.163,"hasEvents":false,"sentence_source":"那1000字里面如果你要就是在多多转转，再说点盈率的话 做高点排比的话，就是一个事情还没说清楚这个专栏就要结束了。","sentence_en":"In 1000 words, if you wander around, add some fluff, or use fancy parallelism, you'll end the column without making your point clear."},{"id":"585","start":3581.36,"end":3587.66,"displayStart":3581.36,"displayEnd":3587.66,"displayMid":3584.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.4,"loudness":0.64493,"pitch":21.038853,"speechRate":5.821,"hasEvents":false,"sentence_source":"所以我就尽量会在相对短的篇幅内，把更多的信息量放进去 或者说更多的观点放进去。","sentence_en":"So I try to pack more information or more viewpoints into a relatively short space."},{"id":"586","start":3587.66,"end":3596.94,"displayStart":3587.66,"displayEnd":3596.94,"displayMid":3592.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.5,"loudness":0.542232,"pitch":17.89805,"speechRate":4.978,"hasEvents":false,"sentence_source":"那我自己觉得就是我可能做的比较好的地方是，一方面就是说视角比较低，就像小金那个视角就是离地50米。","sentence_en":"I think what I do well is, on one hand, keeping a low perspective—like a camera angle 50 meters off the ground."},{"id":"587","start":3596.94,"end":3598.26,"displayStart":3596.94,"displayEnd":3598.26,"displayMid":3597.6000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0,"loudness":0.581703,"pitch":19.952106,"speechRate":5.303,"hasEvents":false,"sentence_source":"然后45度朝上。","sentence_en":"And then tilted 45 degrees upward."},{"id":"588","start":3598.26,"end":3604.34,"displayStart":3598.26,"displayEnd":3604.34,"displayMid":3601.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.4,"loudness":0.648725,"pitch":20.14356,"speechRate":5.797,"hasEvents":false,"sentence_source":"然后呢一方面就是我追求一个速度，观众在厌烦我之前把所有的观点已经输出去。","sentence_en":"On the other hand, I pursue speed—getting all my points across before the audience gets bored."},{"id":"589","start":3604.34,"end":3607.56,"displayStart":3604.34,"displayEnd":3607.56,"displayMid":3605.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Neutral","score":0.1,"loudness":0.487194,"pitch":10.748647,"speechRate":4.473,"hasEvents":false,"sentence_source":"我觉得这是我的一个写作方式吧。","sentence_en":"I think that's my writing style."},{"id":"590","start":3607.56,"end":3610.6,"displayStart":3607.56,"displayEnd":3610.6,"displayMid":3609.08,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.5,"loudness":0.768664,"pitch":20.713232,"speechRate":4.959,"hasEvents":false,"sentence_source":"所以我觉得这个一定不要小看熟练。","sentence_en":"So I believe we shouldn't underestimate skillfulness."},{"id":"591","start":3610.6,"end":3616.24,"displayStart":3610.6,"displayEnd":3616.24,"displayMid":3613.42,"speaker":"Mao Jian","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Differences between academic background and work","sentiment_en":"Positive","score":0.4,"loudness":0.833467,"pitch":24.131332,"speechRate":6.383,"hasEvents":false,"sentence_source":"我们老觉得熟练以后是不是就熟练公众了，就好像缺乏某种灵魂还真的不能小看熟练。","sentence_en":"We often think being skilled means being mechanical or lacking soul, but skillfulness is truly not to be underestimated."},{"id":"592","start":3616.78,"end":3623.1,"displayStart":3616.78,"displayEnd":3623.1,"display
