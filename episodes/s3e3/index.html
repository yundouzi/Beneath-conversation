"displayEnd":87.39,"displayMid":85.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":0.867521,"pitch":20.509356,"speechRate":3.922,"hasEvents":false,"sentence_source":"今天彭兆君女士她代表的是拍卖行业。","sentence_en":"Today, Ms. Peng Zhaojun represents the auction industry."},{"id":"16","start":87.39,"end":100.05,"displayStart":87.39,"displayEnd":100.05,"displayMid":93.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":1.147857,"pitch":23.368225,"speechRate":5.312,"hasEvents":false,"sentence_source":"对于这个行业每次我跟我拍卖公司的一些朋友，大家聊天开玩笑就会说，哎呀你们这个行业多轻松啊，每年一个春拍一个秋拍然后就没事了，但其实这是笑谈啊。","sentence_en":"About this industry, whenever I chat and joke with friends from auction companies, they say, 'Oh, your industry is so easy—just a spring auction and a fall auction each year, and then nothing else.' But that's just a joke."},{"id":"17","start":100.05,"end":114.77,"displayStart":100.05,"displayEnd":114.77,"displayMid":107.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":0.880737,"pitch":21.261906,"speechRate":4.757,"hasEvents":false,"sentence_source":"我们都明白拍卖行业的工作有点像是一个莫比乌斯环，这个行业的工作可能包括但不仅限于以下，你要找拍品 找卖家，你要搜集信息 整理资料，印成特别精美的画册。","sentence_en":"We all understand that working in the auction industry is like a Möbius strip. The job may include, but is not limited to, finding items and sellers, gathering information, organizing materials, and printing exquisite catalogs."},{"id":"18","start":114.77,"end":121.59,"displayStart":114.77,"displayEnd":121.59,"displayMid":118.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":1.136059,"pitch":21.829859,"speechRate":2.933,"hasEvents":false,"sentence_source":"在招商 再布展 再寻展 再预展 再拍卖 再收获交钱。","sentence_en":"It involves soliciting consignments, setting up exhibitions, sourcing works, previews, auctions, and then collecting payments."},{"id":"19","start":121.59,"end":125.81,"displayStart":121.59,"displayEnd":125.81,"displayMid":123.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":0.933,"pitch":19.840351,"speechRate":3.791,"hasEvents":false,"sentence_source":"然后再开始新一轮的寻找卖家和拍品。","sentence_en":"Then starts a new round of seeking sellers and lots."},{"id":"20","start":125.81,"end":134.41,"displayStart":125.81,"displayEnd":134.41,"displayMid":130.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Positive","score":0.4,"loudness":1.024956,"pitch":25.830267,"speechRate":5.586,"hasEvents":false,"sentence_source":"那此刻呢坐在我对面的就是彭兆君女士，她呢应该是永乐文化的联合创始人董事CEO，您先跟大家打个招呼。","sentence_en":"Now sitting across from me is Ms. Peng Zhaojun, co-founder, director, and CEO of Yongle Culture. Please say hello to everyone."},{"id":"21","start":134.41,"end":138.47,"displayStart":134.41,"displayEnd":138.47,"displayMid":136.44,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Positive","score":0.4,"loudness":1.134834,"pitch":22.836185,"speechRate":4.45,"hasEvents":false,"sentence_source":"大家好 我是永乐拍卖永乐文化的彭兆君。","sentence_en":"Hello everyone, I'm Peng Zhaojun from Yongle Auction and Yongle Culture."},{"id":"22","start":138.47,"end":149.01,"displayStart":138.47,"displayEnd":149.01,"displayMid":143.74,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.000911,"p er":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":0.795938,"pitch":20.331051,"speechRate":6.383,"hasEvents":false,"sentence_source":"那么挂在我办公室这幅作品呢，这是他的封面作品。","sentence_en":"The painting hanging in my office is the cover piece of that exhibition."},{"id":"27","start":173.07,"end":176.01,"displayStart":173.07,"displayEnd":176.01,"displayMid":174.54,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Positive","score":0.5,"loudness":1.013294,"pitch":19.606409,"speechRate":5.1,"hasEvents":false,"sentence_source":"然后我挑了三幅作品我最喜欢的。","sentence_en":"I selected three pieces that I liked the most."},{"id":"28","start":176.01,"end":184.37,"displayStart":176.01,"displayEnd":184.37,"displayMid":180.19,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Positive","score":0.6,"loudness":0.860908,"pitch":12.983529,"speechRate":4.958,"hasEvents":false,"sentence_source":"因为当时有很多客人也很喜欢嘛，我首选这一幅其他的优先的让给客人，最后我就买到了这幅作品。","sentence_en":"Since many guests also liked them, I gave priority to this one and let the others go to guests. In the end, I acquired this piece."},{"id":"29","start":184.37,"end":195.15,"displayStart":184.37,"displayEnd":195.15,"displayMid":189.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Industry Status and Work Logic","sentiment_en":"Neutral","score":0,"loudness":1.06959,"pitch":21.487909,"speechRate":4.638,"hasEvents":false,"sentence_source":"喜欢艺术品 收藏艺术品是来到永乐之后开始的，还是其实这个种子之前就已经是在你的生活土壤当中已经播种下来了。","sentence_en":"Did your love for art and collecting begin after joining Yongle, or was that seed already planted in your life before?"},{"id":"30","start":195.73,"end":202.91,"displayStart":195.73,"displayEnd":202.91,"displayMid":199.32,"speaker":"Peng Zhaojun","speakerColor":"#A tence_source":"对于我们那个时候来讲 我认为尤其是广大的农村很确尚美学教育。","sentence_en":"For our time, I think there was a lack of aesthetic education, especially in the vast rural areas."},{"id":"35","start":218.01,"end":227.67,"displayStart":218.01,"displayEnd":227.67,"displayMid":222.83999999999997,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.940341,"pitch":17.164951,"speechRate":4.678,"hasEvents":false,"sentence_source":"其实我在接触这个行业之前 对这方面了解是很少的，没有近距离接触过 我最早的接触是在我上一份的工作。","sentence_en":"Actually, before entering this industry, I knew very little about it and had never been up close. My earliest exposure was in my previous job."},{"id":"36","start":228.25,"end":243.65,"displayStart":228.25,"displayEnd":243.65,"displayMid":235.95,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.6,"loudness":0.893136,"pitch":16.373835,"speechRate":4.526,"hasEvents":false,"sentence_source":"我也是在这个长廊里面 一看到这个艺术品的展示 我就很喜欢，跟一般都做财务的 对这个感受还不太一样，我进这个行业的时候 很多财务的人 他可能感受到的是数字。","sentence_en":"In this corridor, as soon as I saw the art display, I really liked it. It was different from how most finance people feel. When I entered the industry, many finance professionals might focus on the numbers."},{"id":"37","start":243.65,"end":254.93,"displayStart":243.65,"displayEnd":254.93,"displayMid":249.29000000000002,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.849862,"pitch":15.069334,"speechRate":4.708,"hasEvents":false,"sentence_source":"这副作品多少钱 可能我第一感觉的时候 感受的是艺术家，有哪些艺术家的作品 非常被市场认可和喜欢 有哪些艺术家的作品。","sentence_en":"While others might first ask 'How much is this piece?', my first feeling is about the artist—which artists' works are well-recognized and liked by the market, and which artists' works..."},{"id":"38","start":254.93,"end":260.03,"displayStart":254.93,"displayEnd":260.03,"displayMid":257.48,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.959951,"pitch":16.339855,"speechRate":4.921,"hasEvents":false,"sentence_source":"它也是哪个不同的消费群聚集喜欢 我会从这些方面去感受。","sentence_en":"...and which different consumer groups are drawn to them. I experience it from these perspectives."},{"id":"39","start":260.03,"end":263.33,"displayStart":260.03,"displayEnd":263.33,"displayMid":261.67999999999995,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.5,"loudness":0.713064,"pitch":15.896157,"speechRate":6.173,"hasEvents":false,"sentence_source":"所以我自己觉得我进入这个行业还是比较快的。","sentence_en":"So I feel I entered this industry relatively quickly."},{"id":"40","start":263.33,"end":267.75,"displayStart":263.33,"displayEnd":267.75,"displayMid":265.53999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.987103,"pitch":22.84116,"speechRate":5.509,"hasEvents":false,"sentence_source":"因为我个人一直在同一个领域工作 没有换过跑道的人。","sentence_en":"Because I personally had always worked in the same field and never switched tracks."},{"id":"41","start":267.75,"end":277.11,"displayStart":267.75,"displayEnd":277.11,"displayMid":272.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":0.984599,"pitch":21.805828,"speechRate":4.713,"hasEvents":false,"sentence_source":"所以我个人对于换过跑道而且每一次转换都很自如很成功的人我其实还很好奇很钦佩因为是不容易的。","sentence_en":"So I'm actually very curious and admire those who have y—I am very persistent. When working in finance, I passed all the required exams with good results each time."},{"id":"62","start":397.33,"end":409.41,"displayStart":397.33,"displayEnd":409.41,"displayMid":403.37,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.6,"loudness":0.837307,"pitch":15.155116,"speechRate":5.25,"hasEvents":false,"sentence_source":"还能够非常很快地就通过这个考试，全国统一的考试，从最初的会计员的考试，助理会计师的考试 会计师的考试，高级会计师的考试 注册会计师的考试。","sentence_en":"I could pass these exams quickly—national unified exams, from entry-level accountant, assistant accountant, accountant, senior accountant, to certified public accountant."},{"id":"63","start":409.41,"end":415.45,"displayStart":409.41,"displayEnd":415.45,"displayMid":412.43,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.5,"loudness":0.825521,"pitch":13.936887,"speechRate":5.464,"hasEvents":false,"sentence_source":"做车税务师的考试 还有包括做车评估师的考试，我曾经还考过法律资格的考试。","sentence_en":"I also took exams for tax agent and appraiser, and even a legal qualification exam."},{"id":"64","start":415.45,"end":423.47,"displayStart":415.45,"displayEnd":423.47,"displayMid":419.46000000000004,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Negative","score":-0.3,"loudness":1.14287,"pitch":22.434122,"speechRate":3.781,"hasEvents":false,"sentence_source":"那所有这些考，试之前的准备工作，你都是在 编工作 编复习 还编带孩子。","sentence_en":"For all these exams, I had to juggle work, study, and taking care of my child."},{"id":"65","start":423.47,"end":425.61,"displayStart":423.47,"displayEnd":425.61,"displayMid":424.54,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Negative","score":-0.4,"loudness":1.040837,"pitch":15.161907,"spee 放，就那一瞬间，我现在回想起来，我还是内心是很感动的。","sentence_en":"You feel like her gaze is fixed on you, speaking volumes, as if she truly understands you. In that instant, all your emotions, including your grievances, seem to find release. Even now, looking back, I still feel deeply moved inside."},{"id":"168","start":1185.55,"end":1187.19,"displayStart":1185.55,"displayEnd":1187.19,"displayMid":1186.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.982335,"pitch":22.215895,"speechRate":6.593,"hasEvents":false,"sentence_source":"在最后我就特别平静。","sentence_en":"In the end, I was very calm."},{"id":"169","start":1187.19,"end":1191.01,"displayStart":1187.19,"displayEnd":1191.01,"displayMid":1189.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":0.950932,"pitch":15.109724,"speechRate":4.974,"hasEvents":false,"sentence_source":"然后就看着她眼睛，就跟在一起笑，就是这样的。","sentence_en":"Then I looked into her eyes and smiled with her. That's how it was."},{"id":"170","start":1191.01,"end":1199.01,"displayStart":1191.01,"displayEnd":1199.01,"displayMid":1195.01,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":1.101386,"pitch":20.946119,"speechRate":4.875,"hasEvents":false,"sentence_source":"每个人看着她都在，觉得对着自己笑，就看了他眼睛 非常的享受的那种感觉，还有我觉得人在一。","sentence_en":"Everyone who looks at her feels she is smiling at them. When you look into her eyes, it's a very enjoyable feeling. Also, I think when a person is in front of"},{"id":"171","start":1199.01,"end":1209.89,"displayStart":1199.01,"displayEnd":1209.89,"displayMid":1204.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sen ence_source":"我特别喜欢了解一副艺术品它背后的所经历的故事，而不仅仅是它从多少钱变成多少钱的数字的一个过程，像旧市主这幅画我觉得特别有意思，你想它早年它应该跟济纲碑的经历差不多。","sentence_en":"I especially like to learn the story behind an artwork, not just the numbers of how much it went from and to. For example, Salvator Mundi — I find it very interesting. In its early years, it probably went through a similar experience as the Chicken Cup."},{"id":"179","start":1265.31,"end":1270.85,"displayStart":1265.31,"displayEnd":1270.85,"displayMid":1268.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Art auction market","sentiment_en":"Neutral","score":0,"loudness":1.013547,"pitch":24.267282,"speechRate":5.298,"hasEvents":false,"sentence_source":"就从上个世纪50年代被人发现当时也就可能45英镑就买下来。","sentence_en":"It was discovered in the 1950s and bought for maybe just 45 pounds."},{"id":"180","start":1270.85,"end":1282.49,"displayStart":1270.85,"displayEnd":1282.49,"displayMid":1276.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Art auction market","sentiment_en":"Neutral","score":0.1,"loudness":0.96373,"pitch":24.895985,"speechRate":5.657,"hasEvents":false,"sentence_source":"然后一直到2005年也才10，000英镑左右，但直到了2011年有专家就鉴定说这是达芬奇真迹，跟隆纳利沙同一时期 瞬间被沙特的王子买了以后。","sentence_en":"Then until 2005, it was only about 10,000 pounds. But in 2011, experts authenticated it as a genuine da Vinci from the same period as the Mona Lisa, and it was instantly bought by a Saudi prince."},{"id":"181","start":1282.49,"end":1287.07,"displayStart":1282.49,"displayEnd":1287.07,"displayMid":1284.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Art auction market","sentiment_en":"Neutral","score":0,"loudness":0.964436,"pitch":19.862022,"speechRate":5.459,"hasEvents":false,"sentence_source":"我了解是在阿布扎比展出过 但是 鲁豫工具说是拒绝展出的。","sentence_en":"I understand it was exhibited in Abu Dhabi, but the Louvre is said to have refused to exhibit it."},{"id":"182","start":1287.07,"end":1296.79,"dis ore":0,"loudness":1.003395,"pitch":16.249763,"speechRate":5.115,"hasEvents":true,"sentence_source":"专家群体说 他们大家比较客观，就是说不同群体都会有了 都会有人喜欢。","sentence_en":"The expert community says they are objective — that is, different groups will have people who like them."},{"id":"186","start":1321.27,"end":1326.57,"displayStart":1321.27,"displayEnd":1326.57,"displayMid":1323.92,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.5,"loudness":0.924026,"pitch":17.359457,"speechRate":5.477,"hasEvents":false,"sentence_source":"然后我们要做一些多元的厂次，作品要丰富化 我觉得这个是有道理的。","sentence_en":"Then we need to hold diverse auctions with rich selections. I think this makes sense."},{"id":"187","start":1326.57,"end":1337.93,"displayStart":1326.57,"displayEnd":1337.93,"displayMid":1332.25,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0.1,"loudness":0.867561,"pitch":17.026335,"speechRate":5.724,"hasEvents":false,"sentence_source":"但是我心里还是会打疑问 后来我邀请了很多，就是说年轻的朋友来看的时候，我说你们看完之后要告诉我你们喜欢哪些作品，有好几个人就说喜欢这副作品。","sentence_en":"But I still had doubts in my heart. Later, I invited many young friends to come and see. I said, 'After you've seen them, tell me which works you like.' Several people said they liked this work."},{"id":"188","start":1337.93,"end":1342.25,"displayStart":1337.93,"displayEnd":1342.25,"displayMid":1340.0900000000001,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":0.854316,"pitch":18.493059,"speechRate":5.06,"hasEvents":false,"sentence_source":"我就问他们喜欢什么他们就说都欢乐呀这个场面。","sentence_en":"I asked what they liked, and they said it's all about the joy of the scene."},{"id":"189","start":1342.25,"end":1344.67,"displayStart":1342.25,"displayEnd":1344 e. Many people liked his work, and there was another piece like that."},{"id":"193","start":1373.69,"end":1380.19,"displayStart":1373.69,"displayEnd":1380.19,"displayMid":1376.94,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0.1,"loudness":0.767198,"pitch":13.113447,"speechRate":5.568,"hasEvents":false,"sentence_source":"当时放在那 我说这种会有人要 我真的这么想啊，但他就是有人喜欢的 还有很多人喜欢。","sentence_en":"I thought at the time, 'Would anyone buy this?' But it turned out people did like it—many people."},{"id":"194","start":1380.19,"end":1387.07,"displayStart":1380.19,"displayEnd":1387.07,"displayMid":1383.63,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":0.842419,"pitch":15.513345,"speechRate":6.313,"hasEvents":false,"sentence_source":"所以这个艺术这个东西 就是魅力就在这里 每个人看他的点都不一样，美绝对没有一个标准 这就是。","sentence_en":"That's the charm of art—everyone sees it differently. There's no absolute standard for beauty."},{"id":"195","start":1387.07,"end":1397.67,"displayStart":1387.07,"displayEnd":1397.67,"displayMid":1392.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0.2,"loudness":0.883097,"pitch":19.949701,"speechRate":5.429,"hasEvents":false,"sentence_source":"我们这个行业的魅力，也是我们这个行业其实是难点所在，没错 这个行业首先就要求每一个从业者，你要有特别包容的开阔的心胸和视野。","sentence_en":"That's the charm of our industry, and also its difficulty. It demands that every practitioner have an exceptionally open mind and broad perspective."},{"id":"196","start":1397.67,"end":1404.75,"displayStart":1397.67,"displayEnd":1404.75,"displayMid":1401.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.6,"loudness":1.111403,"pitch":23.250923,"speechRate":4.608,"hasEvents":false,"sentence_source":"然后这个行业也会使你变得更加的包容，有开放的视野 你们发现各花入各演。","sentence_en":"And this industry makes you more inclusive and open-minded—you find that different people have different tastes."},{"id":"197","start":1404.75,"end":1408.53,"displayStart":1404.75,"displayEnd":1408.53,"displayMid":1406.6399999999999,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0.2,"loudness":0.928456,"pitch":25.571199,"speechRate":5.03,"hasEvents":false,"sentence_source":"但同时你们还承担着很重要的引领作用。","sentence_en":"But at the same time, you also play a crucial guiding role."},{"id":"198","start":1408.53,"end":1424.05,"displayStart":1408.53,"displayEnd":1424.05,"displayMid":1416.29,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0.1,"loudness":0.909471,"pitch":15.971956,"speechRate":4.675,"hasEvents":false,"sentence_source":"我们做这个行业的从业者，就是你刚才说的多元和包容，你就不能完全以自己的喜好来引领这个市场，一定要看长家群体的喜好是怎么样，还有就是真正的不能简单只是喜好。","sentence_en":"As professionals in this industry, as you mentioned, diversity and inclusiveness are key. You can't lead the market solely by your own preferences. You must consider what collector groups like, and truly avoid being simplistic in your tastes."},{"id":"199","start":1424.05,"end":1432.79,"displayStart":1424.05,"displayEnd":1432.79,"displayMid":1428.42,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.703821,"pitch":9.12849,"speechRate":5.402,"hasEvents":false,"sentence_source":"它的价值在哪里，还是核心的东西还是要价值，很多人喜欢，它就有它自己的价值所在，你只有自己喜欢那是不行。","sentence_en":"Where does its value lie? At its core, it's still about value. If many people like it, it has its own worth—just liking it yourself isn't enough."},{"id":"200","start":1432.79,"end":1446.83,"displayStart":1432.79,"displayEnd":1446.83,"displayMid":1439.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Positive","score":0.7,"loudness":0.99428,"pitch":23.111189,"speechRate":4.907,"hasEvents":false,"sentence_source":"所以我们就是从外面的人看拍卖行来说，特别迷人的一个场景就是拍卖现场，最近我们国内有很多女拍卖师是特别红的，就是网红女拍卖师，每一个人都是很雅致。","sentence_en":"From an outsider's view, the most fascinating scene at an auction house is the auction floor. Recently, many female auctioneers in China have become very popular—they're stylish and elegant."},{"id":"201","start":1446.83,"end":1450.43,"displayStart":1446.83,"displayEnd":1450.43,"displayMid":1448.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Positive","score":0.8,"loudness":0.899766,"pitch":24.587366,"speechRate":4.722,"hasEvents":false,"sentence_source":"然后赏心悦目 用那么的专业那么的干练。","sentence_en":"They're pleasing to the eye, so professional and capable."},{"id":"202","start":1450.43,"end":1455.99,"displayStart":1450.43,"displayEnd":1455.99,"displayMid":1453.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0.1,"loudness":0.87783,"pitch":21.505386,"speechRate":4.676,"hasEvents":false,"sentence_source":"然后我也去参加过几次现场拍卖感受过，就人在其中是很容易。","sentence_en":"I've attended several live auctions myself, and it's easy to"},{"id":"203","start":1455.99,"end":1458.09,"displayStart":1455.99,"displayEnd":1458.09,"displayMid":1457.04,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.865045,"pitch":18.813463,"speechRate":4.286,"hasEvents":false,"sentence_source":"被现场气氛带着走的。","sentence_en":"get carried away by the atmosphere."},{"id":"204","start":1458.09,"end":1470.01,"displayStart":1458.09,"displayEnd":1470.01,"displayMid":1464.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0.1,"loudness":0.962177,"pitch":19.374994,"speechRate":4.614,"hasEvents":false,"sentence_source":"刚你也讲过就你参与的拍卖你会紧张，除此以外现场还有哪些我们所看不到的玄机，看不到的硝烟 给我们介绍一下，你就是说对拍卖。","sentence_en":"You just mentioned that you get nervous during auctions you participate in. Besides that, what other hidden dynamics or unseen battles happen on site? Tell us about what's not visible to the audience."},{"id":"205","start":1470.01,"end":1473.41,"displayStart":1470.01,"displayEnd":1473.41,"displayMid":1471.71,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.832398,"pitch":16.460266,"speechRate":4.167,"hasEvents":false,"sentence_source":"师 其实对拍卖师的要求是很高的。","sentence_en":"Actually, the requirements for auctioneers are very high."},{"id":"206","start":1473.41,"end":1480.39,"displayStart":1473.41,"displayEnd":1480.39,"displayMid":1476.9,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Positive","score":0.7,"loudness":1.010959,"pitch":16.777481,"speechRate":4.669,"hasEvents":false,"sentence_source":"我们看到的可能就是说，哎呀 他一看给我们的感觉是很优雅，很自信 他很懂。","sentence_en":"What we see is that they appear elegant, confident, and knowledgeable."},{"id":"207","start":1480.39,"end":1485.79,"displayStart":1480.39,"displayEnd":1485.79,"displayMid":1483.0900000000001,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.880446,"pitch":13.843512,"speechRate":5.019,"hasEvents":false,"sentence_source":"因为这么多的作品 他要了解，他在拍前都有一个简单的讲解过程。","sentence_en":"They need to know all these works, and they give a brief introduction before bidding."},{"id":"208","start":1485.79,"end":1500.73,"displayStart":1485.79,"displayEnd":1500.73,"displayMid":1493.26,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":-0.1,"loudness":0.828867,"pitch":14.37537,"speechRate":5.363,"hasEvents":false,"sentence_source":"那看不到了一面，就是说他们背后要付出很多，首先体力上就不是一般人能受得了的，有的拍卖是现在有时候连续四五个小时在他的，你看他不停地在讲 不停地在讲 对吧，他又不能喝太多的水。","sentence_en":"What you don't see is the immense effort behind the scenes. First, the physical stamina—some auctions last four or five hours straight. They talk continuously, can't drink too much water."},{"id":"209","start":1500.73,"end":1510.63,"displayStart":1500.73,"displayEnd":1510.63,"displayMid":1505.68,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":-0.1,"loudness":0.907817,"pitch":14.913024,"speechRate":4.919,"hasEvents":false,"sentence_source":"还要保持优雅的体态，还有不能出错 下面那么多人看 谁在举谁在举怎么样 谁先谁后都不能错的 那错的是不行的。","sentence_en":"They must maintain an elegant posture and make no mistakes—with so many people watching, they can't misjudge who raised a paddle first or make any errors."},{"id":"210","start":1510.63,"end":1516.65,"displayStart":1510.63,"displayEnd":1516.65,"displayMid":1513.64,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.811887,"pitch":15.908475,"speechRate":6.298,"hasEvents":false,"sentence_source":"就是最后到底是哪一个牌子举到了 还有牌号 这些都不能错 因为一件作品不能太长时间。","sentence_en":"Which paddle was raised first, the bidder number—none of that can be wrong, because a single lot can't take too long."},{"id":"211","start":1516.65,"end":1525.45,"displayStart":151 playMid":1884.48,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":1.064667,"pitch":21.481466,"speechRate":5.829,"hasEvents":false,"sentence_source":"他就会觉得就多一万块钱就多几千块钱，就是你说用欧元来讲他也觉得他肯定是几千几千这样来的嘛，他就总会想我可能再加一千就是我的了再加一千那就加起来了嘛。","sentence_en":"She felt that extra 10,000 euros was just a few thousand more. In euros, each step is a few thousand, so she kept thinking, 'Maybe if I add one more thousand, it's mine.' Then one more thousand adds up."},{"id":"260","start":1890.57,"end":1897.49,"displayStart":1890.57,"displayEnd":1897.49,"displayMid":1894.03,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":1.136162,"pitch":22.032778,"speechRate":6.368,"hasEvents":false,"sentence_source":"他加了一千的走人家又加一千他又想那我再加一千，他当时想到了紫森的一千 他很少想到那个总额。","sentence_en":"Each time she only thought about that next thousand, not the total."},{"id":"261","start":1897.49,"end":1898.97,"displayStart":1897.49,"displayEnd":1898.97,"displayMid":1898.23,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":0.716378,"pitch":15.977831,"speechRate":6.757,"hasEvents":false,"sentence_source":"我们很多客户都是这样。","sentence_en":"Many of our clients are like that."},{"id":"262","start":1898.97,"end":1901.49,"displayStart":1898.97,"displayEnd":1901.49,"displayMid":1900.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Anecdotes from the Auction House","sentiment_en":"Neutral","score":0,"loudness":1.374716,"pitch":30.418163,"speechRate":7.944,"hasEvents":false,"sentence_source":"当时我跟我那朋友 还有另外两个女朋友。","sentence_en":"At the time, I was with my friend and two other girlfriends."},{"id":"263","start":1901.49,"end":190 479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.5,"loudness":0.882413,"pitch":13.414968,"speechRate":5.914,"hasEvents":false,"sentence_source":"然后我们就会请这些老师来跟我们一起研究，开研讨会 然后就挖掘他的学术价值，挖掘好了。","sentence_en":"Then we invite these experts to study with us, hold seminars, and explore its academic value. Once that's done,"},{"id":"325","start":2288.45,"end":2295.95,"displayStart":2288.45,"displayEnd":2295.95,"displayMid":2292.2,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.7,"loudness":0.869632,"pitch":14.315189,"speechRate":5.2,"hasEvents":false,"sentence_source":"然后再去研讨 让每一个地方 让厂家都买的满意 买的放心 这个它的价值就得到最大后的发挥。","sentence_en":"we discuss further so that every party—every manufacturer—feels satisfied and assured. That's how its value is maximized."},{"id":"326","start":2295.95,"end":2307.53,"displayStart":2295.95,"displayEnd":2307.53,"displayMid":2301.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.6,"loudness":1.04197,"pitch":21.95973,"speechRate":4.922,"hasEvents":false,"sentence_source":"我会特别相信伊丽莎白泰勒他的一句名言 因为他生前有那么多美丽的珠宝嘛，他去世之后 他所有的一切不都也都会来拍卖 然后做慈善。","sentence_en":"I really believe in Elizabeth Taylor's famous saying. She had so many beautiful jewels in her lifetime, and after she passed away, all of them were auctioned for charity."},{"id":"327","start":2307.53,"end":2312.89,"displayStart":2307.53,"displayEnd":2312.89,"displayMid":2310.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Neutral","score":0,"loudness":0.931015,"pitch":21.786186,"speechRate":6.343,"hasEvents":false,"sentence_source":"他就讲他说 哎呀 我们对于这么多美丽的艺术珠宝来说 我们怎么能够拥有他们呢。","sentence_en":"She said, 'For all these beautiful art jewels, how can we claim to own them?"},{"id":"328","start":2312.89,"end":2325.69,"displayStart":2312.89,"displayEnd":2325.69,"displayMid":2319.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.7,"loudness":0.905407,"pitch":19.764181,"speechRate":4.994,"hasEvents":false,"sentence_source":"我们都是暂时的保管者 我觉得这句话对我触动特别大，就是所有这些美 你不仅用价值去衡量它 而且其实你即便买到它 你拥有它 你只是暂时的保管者。","sentence_en":"We are just temporary custodians. That quote really struck me—it's not just about measuring beauty by value; even if you buy it and own it, you're only a temporary keeper."},{"id":"329","start":2325.69,"end":2333.59,"displayStart":2325.69,"displayEnd":2333.59,"displayMid":2329.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Neutral","score":0,"loudness":1.109458,"pitch":20.213026,"speechRate":5.502,"hasEvents":false,"sentence_source":"你未来依然要传到其他人的手中 或者有一天要回到社会 这是所有的艺术品有价值保 必有的一个路径。","sentence_en":"Eventually, it will pass to others or return to society. That's the inevitable path for all valuable artworks."},{"id":"330","start":2333.59,"end":2347.09,"displayStart":2333.59,"displayEnd":2347.09,"displayMid":2340.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Positive","score":0.8,"loudness":1.105704,"pitch":20.703989,"speechRate":5.241,"hasEvents":false,"sentence_source":"所以这么一想我内，心就瞬间逝然了，但我就觉得你看所有的拍卖行业带给我们的感受 就是这样，就他背后的很多这样活涩生香的故事，让我觉得无比之相网 没有意思。","sentence_en":"When I think about it that way, I instantly feel at ease. The auction industry gives us that feeling—behind it are so many vivid stories that I find incredibly fascinating and enjoyable."},{"id":"331","start":2347.09,"end":2351.13,"displayStart":2347.09,"displayEnd":2351.13,"displayMid":2349.11,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en": e":4.084,"hasEvents":false,"sentence_source":"但是做到从容很难，要经历吧我觉得，看你经历的故事，经历的事情让你逐漆的从现在可能说这个新鲜花爆炸的时代，让自己去体会去感受那份从容一个。","sentence_en":"But being composed is hard. I think it comes with experience—the stories you go through gradually teach you to feel and appreciate that composure in this age of exploding novelty."},{"id":"363","start":2579.55,"end":2589.17,"displayStart":2579.55,"displayEnd":2589.17,"displayMid":2584.36,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.6,"loudness":0.99618,"pitch":15.843383,"speechRate":4.678,"hasEvents":false,"sentence_source":"是从容还有呢，舍掉一些东西吧 我觉得 成熟是舍弃一些东西，舍弃 放弃 这也很重要 有舍才有得懂分寸敬畏 我。","sentence_en":"It's about composure, and letting go of some things. Maturity is about giving up things. Letting go is important—you have to lose to gain, know boundaries, and have reverence."},{"id":"364","start":2589.17,"end":2601.05,"displayStart":2589.17,"displayEnd":2601.05,"displayMid":2595.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Positive","score":0.7,"loudness":0.891093,"pitch":18.359993,"speechRate":4.882,"hasEvents":false,"sentence_source":"非常认同，控制自己的情绪 控制自己的欲望，我特别赞同你刚才说这些目前，在你的工作状态当中 你们的压力这种节奏 你会有焦虑的时候吗。","sentence_en":"Absolutely. Controlling your emotions and desires. I really agree with what you just said. In your current work, with all that pressure and pace, do you ever feel anxious?"},{"id":"365","start":2601.05,"end":2604.41,"displayStart":2601.05,"displayEnd":2604.41,"displayMid":2602.73,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The working conditions of artists","sentiment_en":"Neutral","score":0,"loudness":0.744906,"pitch":14.096878,"speechRate":5.655,"hasEvents":false,"sentence_source":"自己可能感受不到焦虑 但是实际上肯定会有。","sentence_en":"You might not feel it, but it's definitely 1.598562,"speechRate":5.502,"hasEvents":false,"sentence_source":"我们一般的魔咒偏见就是一个女人她事业很成功，她生活一定会有某种缺憾 自己一定不是个太会过日子的人 未必，完全取决于你自己的把握 你自己想要过成什么样的生活，不要面具的我就在。","sentence_en":"A common curse or prejudice is that a woman who is very successful in her career must have some deficiency in life—she can't be good at living. Not necessarily. It all depends on how you manage it and what kind of life you want. I don't wear a mask."},{"id":"414","start":2899.11,"end":2903.39,"displayStart":2899.11,"displayEnd":2903.39,"displayMid":2901.25,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Neutral","score":0,"loudness":0.700978,"pitch":16.207756,"speechRate":5.607,"hasEvents":false,"sentence_source":"忙 我走出这个办公室就是生活状态，我不正统员工加班的。","sentence_en":"Busy as I am, when I leave the office, that's my life state. I don't force my employees to work overtime."},{"id":"415","start":2903.39,"end":2905.33,"displayStart":2903.39,"displayEnd":2905.33,"displayMid":2904.3599999999997,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Negative","score":-0.4,"loudness":1.010279,"pitch":30.082195,"speechRate":7.738,"hasEvents":false,"sentence_source":"我觉得你加班有的是魔用程度。","sentence_en":"I think overtime shows some degree of inefficiency."},{"id":"416","start":2905.33,"end":2906.47,"displayStart":2905.33,"displayEnd":2906.47,"displayMid":2905.8999999999996,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Work is an artist","sentiment_en":"Negative","score":-0.6,"loudness":0.574129,"pitch":25.616259,"speechRate":8.969,"hasEvents":true,"sentence_source":"我觉得你的能力有问题。","sentence_en":"I think there's an issue with your ability."},{"id":"417","start":2908.11,"end":2919.85,"displayStart":2908.11,"displayEnd":2919.85,"displayMid":2913.98,"speaker":"Peng Zhaojun","speakerColor":"#A29479","cluster":1,"clusterLabel" ":"s7e9","label":"S7E9","guest":"Xiaopa"},{"slug":"s7e10","label":"S7E10","guest":"Wang Haolu"},{"slug":"s8e1","label":"S8E1","guest":"Jiang Shengnan"},{"slug":"s8e2","label":"S8E2","guest":"Chen Hui"},{"slug":"s8e3","label":"S8E3","guest":"Zhashiyi Re"},{"slug":"s8e4","label":"S8E4","guest":"Li Zishu"},{"slug":"s8e5","label":"S8E5","guest":"Zhu Tianwen"},{"slug":"s8e6","label":"S8E6","guest":"Niaoniao"},{"slug":"s8e7","label":"S8E7","guest":"Li Yinhe"},{"slug":"s8e8","label":"S8E8","guest":"Zhang Hong"},{"slug":"s8e9","label":"S8E9","guest":"Li Rui"},{"slug":"s9e1","label":"S9E1","guest":"Zhang Zanying"},{"slug":"s9e2","label":"S9E2","guest":"Zhang Nuo"},{"slug":"s9e3","label":"S9E3","guest":"Cai Gao"},{"slug":"s9e4","label":"S9E4","guest":"Meng Man"}]}}</script>
<script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
