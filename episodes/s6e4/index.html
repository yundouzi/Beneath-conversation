就是现在的通用语言，这种lingual franca，使用不同语言的人都能够用这种语言。","sentence_en":"To a large extent, in science and social sciences, English has become the lingua franca. People from different languages can use it."},{"id":"378","start":2534.15,"end":2539.21,"displayStart":2534.15,"displayEnd":2539.21,"displayMid":2536.6800000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.7,"loudness":0.803384,"pitch":21.070698,"speechRate":5.534,"hasEvents":false,"sentence_source":"去进行这种知识的生产和交流，是非常有意义很有价值的一件事情。","sentence_en":"To produce and exchange knowledge—this is very meaningful and valuable."},{"id":"379","start":2539.21,"end":2544.89,"displayStart":2539.21,"displayEnd":2544.89,"displayMid":2542.05,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":0.836035,"pitch":28.306581,"speechRate":4.93,"hasEvents":false,"sentence_source":"但是是为什么英语成为了这个语言，就是因为英国的殖民帝国主义。","sentence_en":"But why did English become this language? Because of British colonial imperialism."},{"id":"380","start":2544.89,"end":2546.45,"displayStart":2544.89,"displayEnd":2546.45,"displayMid":2545.67,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":1.119063,"pitch":35.144646,"speechRate":5.769,"hasEvents":false,"sentence_source":"因为美国的文化霸权。","sentence_en":"Because of American cultural hegemony."},{"id":"381","start":2546.45,"end":2561.25,"displayStart":2546.45,"displayEnd":2561.25,"displayMid":2553.85,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Cross-Cultural Understanding and Social Coexistence","sentiment_en":"Negative","score":-0.6,"loudness":0.800407,"pitch":25.748829,"speechRate":4.122,"hasEvents":false,"sentence_source":"所以是我们这些非英语母语的人，在承担着我们有一个用英语来作为世界公用语的这样子的成本，像我们从初中的时候就开始费尽了力去学艺们。","sentence_en":"So it's us non-native English speakers who bear the cost of using English as a global lingua franca. We've been struggling to learn it since middle school."},{"id":"382","start":2561.25,"end":2568.55,"displayStart":2561.25,"displayEnd":2568.55,"displayMid":2564.9,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":0.944769,"pitch":27.036514,"speechRate":5.483,"hasEvents":false,"sentence_source":"在我们的日常生活中没有任何的价值的一个语言，学了那么多年才可以用英文来表达我们自己。","sentence_en":"A language that has no value in our daily lives; we study it for years just to express ourselves in English."},{"id":"383","start":2568.55,"end":2571.37,"displayStart":2568.55,"displayEnd":2571.37,"displayMid":2569.96,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.6,"loudness":0.7139,"pitch":19.38027,"speechRate":4.965,"hasEvents":false,"sentence_source":"所以我觉得是他们应该感谢我们。","sentence_en":"So I think they should thank us."},{"id":"384","start":2571.37,"end":2577.77,"displayStart":2571.37,"displayEnd":2577.77,"displayMid":2574.5699999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.866894,"pitch":24.494373,"speechRate":6.425,"hasEvents":false,"sentence_source":"所以我现在觉得我真的一点都不自卑，就是我现在能够把英语写的这么好的用英文来发论文。","sentence_en":"So now I don't feel inferior at all. I can write English well enough to publish papers."},{"id":"385","start":2577.77,"end":2589.55,"displayStart":2577.77,"displayEnd":2589.55,"displayMid":2583.66,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.6,"loudness":0.85848,"pitch":21.963165,"speechRate":5.068,"hasEvents":false,"sentence_source":"然后其他的英语为母语的这些研究者，他们完全不用付出任何的语言上的努力，就已经站在了那里 可以听懂我在说什么，他们应该感谢我们。","sentence_en":"Other native-English-speaking researchers stand there without any language effort, able to understand me. They should thank us."},{"id":"386","start":2589.55,"end":2591.97,"displayStart":2589.55,"displayEnd":2591.97,"displayMid":2590.76,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.5,"loudness":1.103388,"pitch":29.501411,"speechRate":7.075,"hasEvents":false,"sentence_source":"所以我现在已经对我不完美的英语。","sentence_en":"So now I'm at peace with my imperfect English."},{"id":"387","start":2591.97,"end":2606.69,"displayStart":2591.97,"displayEnd":2606.69,"displayMid":2599.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.7,"loudness":0.933341,"pitch":23.053699,"speechRate":5.2,"hasEvents":false,"sentence_source":"一点都不自卑了，你知道这是我这几年特别特别大的改变，我不知道一个小孩他对于英语或者对于某种所谓标准发音，标准表达的崇拜是来自于什么地方，我作为一个英语专业的学生。","sentence_en":"I'm not at all self-conscious anymore. You know, this has been a huge change for me in recent years. I don't know where a child's admiration for English or for so-called standard pronunciation and expression comes from. As an English major..."},{"id":"388","start":2606.69,"end":2615.27,"displayStart":2606.69,"displayEnd":2615.27,"displayMid":2610.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.4,"loudness":0.891751,"pitch":22.214746,"speechRate":4.662,"hasEvents":false,"sentence_source":"我对英语发音的标准表达至精准，有一种迷一样的坚信，甚至是一种我觉得很不正确的一种崇拜。","sentence_en":"I had a mysterious, almost blind belief in standard pronunciation and precision—even an unhealthy worship."},{"id":"389","start":2615.27,"end":2629.03,"displayStart":2615.27,"displayEnd":2629.03,"displayMid":2622.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.7,"loudness":0.943179,"pitch":21.881849,"speechRate":5.305,"hasEvents":false,"sentence_source":"但是这种观点我近几年有了特别大的改变，就像你说的我是中国人，我的英语就应该带有某种中国的口音，这是应该的，还有一点我听你先生的播放我特别赞同，他说他是福建人。","sentence_en":"But I've changed a lot in recent years. Like you said, I'm Chinese, so my English should have a Chinese accent—that's natural. And I also agree with what your husband said in the podcast: he's from Fujian."},{"id":"390","start":2629.03,"end":2630.85,"displayStart":2629.03,"displayEnd":2630.85,"displayMid":2629.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.886147,"pitch":19.729059,"speechRate":6.044,"hasEvents":false,"sentence_source":"我为什么要讲标准普通话。","sentence_en":"Why should I speak standard Mandarin?"},{"id":"391","start":2630.85,"end":2634.85,"displayStart":2630.85,"displayEnd":2634.85,"displayMid":2632.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.948796,"pitch":25.457262,"speechRate":5.315,"hasEvents":true,"sentence_source":"我觉得一样的意思 这个标准是我们人为定的。","sentence_en":"I think it's the same meaning—this standard is artificially set by us."},{"id":"392","start":2634.85,"end":2646.07,"displayStart":2634.85,"displayEnd":2646.07,"displayMid":2640.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.6,"loudness":0.990196,"pitch":23.512356,"speechRate":5.877,"hasEvents":true,"sentence_source":"所以我不想把这个标准加住在我自己的身上，语言我表达清楚 你能够get到我在说什么，我已经完成了一个语言要传递的一个最最基本的一个要求。","sentence_en":"So I don't want to impose that standard on myself. If I express myself clearly and you can get what I'm saying, I've already fulfilled the most basic requirement of language transmission."},{"id":"393","start":2646.07,"end":2656.03,"displayStart":2646.07,"displayEnd":2656.03,"displayMid":2651.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.7,"loudness":0.929466,"pitch":25.62108,"speechRate":4.904,"hasEvents":false,"sentence_source":"我这几年越来越希望人们能够听到你发音之后知道，你来自于哪里 这个对我的某种身份认同特别重要我太同。","sentence_en":"In recent years, I increasingly hope that when people hear my accent, they can know where I come from. This is particularly important for my sense of identity. I totally agree."},{"id":"394","start":2656.03,"end":2662.59,"displayStart":2656.03,"displayEnd":2662.59,"displayMid":2659.3100000000004,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":1.139261,"pitch":26.568987,"speechRate":5.793,"hasEvents":false,"sentence_source":"意你说的了 就是为什么我们会崇拜某一种发音，不知道 对 他其实背后是有一种价值高下的。","sentence_en":"Yes, what you said—why we worship a certain pronunciation. I don't know, but there's actually a value hierarchy behind it."},{"id":"395","start":2662.59,"end":2676.67,"displayStart":2662.59,"displayEnd":2676.67,"displayMid":2669.63,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.841932,"pitch":21.227926,"speechRate":5.716,"hasEvents":false,"sentence_source":"我们觉得可能标准的英语口音或者是说美语口音是好的， "speechRate":6.306,"hasEvents":false,"sentence_source":"然后他们总是相信自己的第六感。","sentence_en":"And they always trust their sixth sense."},{"id":"464","start":3104.39,"end":3105.53,"displayStart":3104.39,"displayEnd":3105.53,"displayMid":3104.96,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.3,"loudness":1.003184,"pitch":28.628237,"speechRate":7.018,"hasEvents":false,"sentence_source":"其实没有什么根据。","sentence_en":"But there's no real basis for that."},{"id":"465","start":3105.53,"end":3120.83,"displayStart":3105.53,"displayEnd":3120.83,"displayMid":3113.1800000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Female Characters and Gender Scripts in Film and Television","sentiment_en":"Negative","score":-0.5,"loudness":0.821701,"pitch":21.928684,"speechRate":4.967,"hasEvents":false,"sentence_source":"所以他们说的话就不可信，就说仅仅因为一个人的社会身份而去降低他的正词的这种价值，Frieker就把它叫做正言的不正义，他大概一方面在这个就是现在米兔的这个时代。","sentence_en":"So what they say is not credible. Just because of a person's social identity, the value of their testimony is reduced. Fricker calls this testimonial injustice. This is especially relevant in the era of Me Too."},{"id":"466","start":3120.83,"end":3122.99,"displayStart":3120.83,"displayEnd":3122.99,"displayMid":3121.91,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.985956,"pitch":21.219221,"speechRate":4.167,"hasEvents":false,"sentence_source":"他是非常有针对性的。","sentence_en":"It's very targeted."},{"id":"467","start":3122.99,"end":3136.83,"displayStart":3122.99,"displayEnd":3136.83,"displayMid":3129.91,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":0.85537,"pitch":23.808592,"speechRate":5.275,"hasEvents":false,"sentence_source":"因为其实在整个米兔的这个运动当中，一个持续的问题就是我们为什么要相信这些女人，在米兔运动发生之前绝大多数时候，女性对于性侵犯的这种正词都是不被认真对待的。","sentence_en":"In the #MeToo movement, a persistent question was why we should believe these women. Before #MeToo, women's testimonies of sexual assault were mostly not taken seriously."},{"id":"468","start":3136.83,"end":3138.17,"displayStart":3136.83,"displayEnd":3138.17,"displayMid":3137.5,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.7,"loudness":0.83125,"pitch":26.096781,"speechRate":5.97,"hasEvents":false,"sentence_source":"去报警也没人相信。","sentence_en":"If they reported it to the police, no one believed them."},{"id":"469","start":3138.17,"end":3144.93,"displayStart":3138.17,"displayEnd":3144.93,"displayMid":3141.55,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.5,"loudness":0.858637,"pitch":19.081715,"speechRate":4.142,"hasEvents":false,"sentence_source":"然后目前的这个运动，他在一定程度上是慢慢的让大家开始去反思。","sentence_en":"And this movement has slowly made people start to reflect."},{"id":"470","start":3144.93,"end":3151.19,"displayStart":3144.93,"displayEnd":3151.19,"displayMid":3148.06,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.4,"loudness":0.837893,"pitch":18.205404,"speechRate":4.313,"hasEvents":false,"sentence_source":"我们是不是应该给女性的证词，更多的快乐体就是他们的可信度。","sentence_en":"Should we give women's testimonies more credibility?"},{"id":"471","start":3151.19,"end":3154.87,"displayStart":3151.19,"displayEnd":3154.87,"displayMid":3153.0299999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.860492,"pitch":23.063881,"speechRate":4.62,"hasEvents":false,"sentence_source":"但是我觉得他对这个正严不正义的分析。","sentence_en":"But I think her analysis of testimonial injustice."},{"id":"472","start":3154.87,"end":3157.57,"displayStart":3154.87,"displayEnd":3157.57,"displayMid":3156.2200000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.87748,"pitch":16.491957,"speechRate":4.074,"hasEvents":false,"sentence_source":"对我影响最大的不是这种。","sentence_en":"What affected me most wasn't this kind."},{"id":"473","start":3157.57,"end":3173.27,"displayStart":3157.57,"displayEnd":3173.27,"displayMid":3165.42,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":0.808863,"pitch":21.800686,"speechRate":4.395,"hasEvents":false,"sentence_source":"对我而言他的讨论影响最大的是，他讲到是这种系统的正严不正义，他会破坏掉我们的作为一个认知主体的信心和兴趣，就是我从小长大的环境期间我有讲到这一点。","sentence_en":"What impacted me most was her discussion of how systemic testimonial injustice undermines our confidence and interest as knowing subjects. I grew up in an environment where I experienced this."},{"id":"474","start":3173.27,"end":3181.41,"displayStart":3173.27,"displayEnd":3181.41,"displayMid":3177.34,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":0.822542,"pitch":17.582941,"speechRate":4.177,"hasEvents":false,"sentence_source":"女性其实是不被鼓励去思考社会，思考历史 思考政治 思考经济这些特别大的问题。","sentence_en":"Women are actually not encouraged to think about big issues like society, history, politics, or economics."},{"id":"475","start":3181.41,"end":3187.37,"displayStart":3181.41,"displayEnd":3187.37,"displayMid":3184.39,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.859451,"pitch":24.633923,"speechRate":5.369,"hasEvents":false,"sentence_source":"我们小的时候家里吃饭是分为两桌，男人坐一桌，男人坐一桌在讨论国际政治。","sentence_en":"When I was little, at family dinners, the men sat at one table discussing international politics."},{"id":"476","start":3187.37,"end":3189.89,"displayStart":3187.37,"displayEnd":3189.89,"displayMid":3188.63,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.356523,"pitch":28.815191,"speechRate":4.365,"hasEvents":false,"sentence_source":"然后女人和孩子坐在一桌。","sentence_en":"And the women and children sat at another table."},{"id":"477","start":3189.89,"end":3193.33,"displayStart":3189.89,"displayEnd":3193.33,"displayMid":3191.6099999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.276222,"pitch":21.97826,"speechRate":5.233,"hasEvents":false,"sentence_source":"然后聊一聊饭有没有吃好衣服有没有穿卵。","sentence_en":"They talked about whether the food was good, whether clothes were worn properly."},{"id":"478","start":3193.33,"end":3204.57,"displayStart":3193.33,"displayEnd":3204.57,"displayMid":3198.95,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":1.000227,"pitch":21.547026,"speechRate":5.338,"hasEvents":false,"sentence_source":"然后再，调一些家常理短的小的细碎的事儿，我小时候我就会觉得，我对男人那一做谈论的问题挺感兴趣的，虽然我现在知道其实他们什么都不懂。","sentence_en":"And then some trivial household matters. As a child, I was interested in what the men were discussing, even though now I know they didn't really know much."},{"id":"479","start":3205.15,"end":3211.11,"displayStart":3205.15,"displayEnd":3211.11,"displayMid":3208.13,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":0.946584,"pitch":23.569437,"speechRate":4.296,"hasEvents":false,"sentence_source":"但是他们的那种自信，就是这是我该来谈的，这是我可以谈的。","sentence_en":"But their confidence—this is what I should talk about, this is what I can talk about."},{"id":"480","start":3211.11,"end":3218.59,"displayStart":3211.11,"displayEnd":3218.59,"displayMid":3214.8500000000004,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":0.971987,"pitch":27.789047,"speechRate":5.195,"hasEvents":false,"sentence_source":"那是我小时候，就是我就眼睛张很大去看着他们，我就会觉得，我好像不属于，虽然说我也想谈。","sentence_en":"When I was little, I would stare at them wide-eyed and feel like I didn't belong, even though I wanted to join the conversation."},{"id":"481","start":3218.59,"end":3230.89,"displayStart":3218.59,"displayEnd":3230.89,"displayMid":3224.74,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":0.848471,"pitch":24.421249,"speechRate":5.9,"hasEvents":true,"sentence_source":"其实你在学校也会不断的接受到跟我信息，就是政治经济历史这些大事不是你应该关注的，他其实慢慢的会对很多很多的女性都会产生，他们要不要对这些东西感兴趣。","sentence_en":"Actually, at school you constantly receive messages that big topics like politics, economics, and history are not for you. This slowly makes many women question whether they should be interested in these things."},{"id":"482","start":3231.33,"end":3244.63,"displayStart":3231.33,"displayEnd":3244.63,"displayMid":3237.98,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.7,"loudness":0.809392,"pitch":25.951424,"speechRate":5.103,"hasEvents":true,"sentence_source":"他们有没有能力对这些东西产生自己的看法，而女性她一旦从这些公共领域，从这些重大问题中退出之后，这个世界和这个制度的设计，她就不会是为我们服务的。","sentence_en":"Whether they have the ability to form their own opinions. Once women withdraw from public spheres and these major issues, the world and its systems are not designed for us."},{"id":"483","start":3244.63,"end":3249.73,"displayStart":3244.63,"displayEnd":3249.73,"displayMid":3247.1800000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.890194,"pitch":26.72262,"speechRate":5.23,"hasEvents":false,"sentence_source":"所以我觉得她在讲这个正言不正义的时候，讲到这种系统性。","sentence_en":"So I think when she talks about testimonial injustice, she addresses this systemic aspect."},{"id":"484","start":3249.73,"end":3264.95,"displayStart":3249.73,"displayEnd":3264.95,"displayMid":3257.34,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.887781,"pitch":27.233387,"speechRate":4.599,"hasEvents":false,"sentence_source":"然后我这种窃声的体验 我就会觉得实在是太对了，就是我们有时候要真的并不是一件事情上我会不会被相信，而是我作为一个人 我有没有权利 有没有资格 有没有兴趣。","sentence_en":"And my own quiet experience made me feel this is so true. Sometimes it's not about whether I'll be believed on a specific matter, but whether as a person I have the right, qualification, and interest."},{"id":"485","start":3264.95,"end":3270.03,"displayStart":3264.95,"displayEnd":3270.03,"displayMid":3267.49,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.6,"loudness":0.688993,"pitch":15.671947,"speechRate":3.269,"hasEvents":false,"sentence_source":"被鼓励 被触动 去对某一些东西感兴趣。 的不正义是我们从一开始聊的时候就都涉及到的，就比方说关于男生在追求女生的时候 其实他们的很多行为在现在看来都是性骚扰。","sentence_en":"Actually, hermeneutical injustice has been involved from the start. For example, when men pursue women, many of their actions are now seen as sexual harassment."},{"id":"490","start":3299.51,"end":3312.79,"displayStart":3299.51,"displayEnd":3312.79,"displayMid":3306.15,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":0.919357,"pitch":19.405018,"speechRate":5.572,"hasEvents":false,"sentence_source":"但是在我们当时的那种认知的这些资源下面 我们都只会把它理解成一种，他们的这种追求的方式，而且像鲁豫老师说的，可能是当时特别被鼓励的，甚至被浪漫化的一种追求方式。","sentence_en":"But with the cognitive resources we had at the time, we only understood it as a way of pursuing someone, and as Teacher Luyu said, it was perhaps especially encouraged or even romanticized."},{"id":"491","start":3312.79,"end":3326.25,"displayStart":3312.79,"displayEnd":3326.25,"displayMid":3319.52,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.944243,"pitch":22.838272,"speechRate":4.143,"hasEvents":false,"sentence_source":"这就是全市的不正义的这种现象，他的意思就是说，在我们的主流的认知支援当中，缺乏某一些认知的词汇，或者框架去恰当地去描述。","sentence_en":"This is the phenomenon of hermeneutical injustice. It means that our mainstream cognitive resources lack certain concepts or frameworks to properly describe."},{"id":"492","start":3326.25,"end":3327.69,"displayStart":3326.25,"displayEnd":3327.69,"displayMid":3326.9700000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.649387,"pitch":20.834738,"speechRate":4.861,"hasEvents":false,"sentence_source":"我们真正的经历。","sentence_en":"Our actual experiences."},{"id":"493","start":3327.69,"end":3330.45,"display   if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
