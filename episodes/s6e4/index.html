,"displayEnd":53.59,"displayMid":47.53,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":-0.1,"loudness":0.920324,"pitch":24.930244,"speechRate":5.446,"hasEvents":false,"sentence_source":"然后你也就是有自己的事业，这是很多人对全部拥有的一种想象，但你想我拥有了记有孩子又有事业的这种生活，我就没有拥有，就是没有孩子只有事业的生活。","sentence_en":"And you have your own career—that's how many people imagine having it all. But if I have a life with both children and a career, I don't have a life with only a career and no children."},{"id":"10","start":53.59,"end":58.89,"displayStart":53.59,"displayEnd":58.89,"displayMid":56.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.292454,"pitch":29.652166,"speechRate":6.038,"hasEvents":false,"sentence_source":"就我不知道我如果没有孩子只有事业，我的事业是怎么样的，这个就非常哲学。","sentence_en":"I wonder what my career would be like without kids—it’s very philosophical."},{"id":"11","start":58.89,"end":62.47,"displayStart":58.89,"displayEnd":62.47,"displayMid":60.68,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":-0.2,"loudness":0.945555,"pitch":28.76038,"speechRate":4.469,"hasEvents":false,"sentence_source":"对对，所以我觉得全部拥有是一种迷思。","sentence_en":"Yeah, so I think having it all is a myth."},{"id":"12","start":62.47,"end":73.41,"displayStart":62.47,"displayEnd":73.41,"displayMid":67.94,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Negative","score":-0.4,"loudness":0.844538,"pitch":21.454597,"speechRate":5.302,"hasEvents":true,"sentence_source":"所以每一个选择当人生的猛异点亮起来的时候，它都意味着其他的很多无数种可能性都灭掉了，没有哪一个是所谓的全部的选择全部拥有。","sentence_en":"So every choice, when it lights up one path in life, extinguishes countless other possibilities—there’s no single choice that means having everything."},{"id":"13","start":77.1,"end":85.74,"displayStart":77.1,"displayEnd":85.74,"displayMid":81.41999999999999,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Negative","score":-0.5,"loudness":0.847307,"pitch":25.257483,"speechRate":5.787,"hasEvents":false,"sentence_source":"我以前因为读书非常的慢，我就会觉得我是不是笨，这开始我听到有阅读障碍症的时候，我就说原来我不是笨我只是有病。","sentence_en":"I used to read very slowly, and thought I was stupid, but when I first heard about dyslexia, I realized I wasn’t stupid—I just had a condition."},{"id":"14","start":85.74,"end":87.53999999999999,"displayStart":85.74,"displayEnd":87.53999999999999,"displayMid":86.63999999999999,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.914613,"pitch":21.950932,"speechRate":5,"hasEvents":false,"sentence_source":"然后觉得这是种进步。","sentence_en":"And that felt like progress."},{"id":"15","start":87.53999999999999,"end":96.62,"displayStart":87.53999999999999,"displayEnd":96.62,"displayMid":92.08,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.966276,"pitch":28.368793,"speechRate":6.054,"hasEvents":false,"sentence_source":"然后现在有了神经多元这种理解，就是去除你对阅读中心主义的这样的一种执念之后，我现在发现我都不是不有病，我只是不一样。","sentence_en":"Now with the concept of neurodiversity, letting go of the obsession with a reading-centered mindset, I find I’m not even sick—I’m just different."},{"id":"16","start":99.86,"end":101.42,"displayStart":99.86,"displayEnd":101.42,"displayMid":100.64,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.847834,"pitch":24.081858,"speechRate":5.536,"hasEvents":false,"sentence_source":"在这样的一个世界。","sentence_en":"In this world,"},{"id":"17","start":101.42,"end _en":"Because before that, at least for our generation—only children with supportive parents—it was a natural assumption to finish college."},{"id":"67","start":476.29,"end":477.67,"displayStart":476.29,"displayEnd":477.67,"displayMid":476.98,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.764549,"pitch":24.608675,"speechRate":7.246,"hasEvents":false,"sentence_source":"不管男女好像都是这样。","sentence_en":"It seemed the same for both men and women."},{"id":"68","start":477.67,"end":490.25,"displayStart":477.67,"displayEnd":490.25,"displayMid":483.96000000000004,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":1.005551,"pitch":25.345375,"speechRate":5.008,"hasEvents":false,"sentence_source":"但是当你大学一毕业之后好像就是女人结婚生孩子的那个坎，就一下子成为了所有的三姑六婆他们的对你所有关注的重心，当然你也得要有一份工作。","sentence_en":"But after graduation, suddenly getting married and having kids became the focus of all the aunties and relatives. Of course, you also need to have a job."},{"id":"69","start":490.25,"end":499.73,"displayStart":490.25,"displayEnd":499.73,"displayMid":494.99,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":-0.1,"loudness":0.982509,"pitch":21.555819,"speechRate":5.696,"hasEvents":false,"sentence_source":"然后我觉得我其实当时就开始就会感受到来自别人的压力，但我其实当时我就觉得我不是特别的在意，我没有想好我要不要孩子。","sentence_en":"I started feeling pressure from others then, but I wasn’t really bothered. I hadn’t decided if I wanted children."},{"id":"70","start":499.73,"end":509.49,"displayStart":499.73,"displayEnd":509.49,"displayMid":504.61,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.5,"loudness":1.101881,"pitch":25.530699,"speechRate":5.328,"hasEvents":false,"sentence_source":"但是我没有想好要不要孩子的原因，就像我当时就觉得人类有很多的这种存在危机，我不知道人类会会什么时候自己玩玩掉。","sentence_en":"The reason I hesitated was that I felt there were so many existential crises—I didn’t know when humanity might destroy itself."},{"id":"71","start":509.49,"end":514.43,"displayStart":509.49,"displayEnd":514.43,"displayMid":511.96,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.5,"loudness":1.133164,"pitch":26.992022,"speechRate":6.883,"hasEvents":false,"sentence_source":"然后我觉得我也不知道你带一个生命到这个世界上，他完全没有控制权他来不来。","sentence_en":"And I didn’t know if I had the right to bring a life into this world who has no control over coming here."},{"id":"72","start":514.43,"end":519.75,"displayStart":514.43,"displayEnd":519.75,"displayMid":517.0899999999999,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":1.015393,"pitch":21.269016,"speechRate":4.95,"hasEvents":false,"sentence_source":"然后他来了他就会经历很多也在他的掌控之外的这些事件。","sentence_en":"Once here, that life will go through many events beyond its control."},{"id":"73","start":519.75,"end":520.71,"displayStart":519.75,"displayEnd":520.71,"displayMid":520.23,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.31316,"pitch":27.175621,"speechRate":6.25,"hasEvents":false,"sentence_source":"然后他的人生。","sentence_en":"And its life."},{"id":"74","start":520.71,"end":524.19,"displayStart":520.71,"displayEnd":524.19,"displayMid":522.45,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":0.881649,"pitch":23.586847,"speechRate":6.897,"hasEvents":false,"sentence_source":"所以我就觉得我不知道我有没有这个权利来做这件事情。","sentence_en":"So I felt uncertain whether I had the right to do that."},{"id":"75","start":524.73,"end":532.89,"displayStart":524.73,"displayEnd":532.89,"displayMid":528.81,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":-0.1,"loudness":1.028074,"pitch":24.487297,"speechRate":6.922,"hasEvents":false,"sentence_source":"所以我当时其实对要不要生孩子是非常犹豫的，我也没有觉得我一定要抗讽，就是一定要符合这个当时我已经感受到了的那种时刻表。","sentence_en":"At that time, I was very torn about having children. I didn’t feel I had to rebel or conform to the timetable I was already sensing."},{"id":"76","start":532.89,"end":538.09,"displayStart":532.89,"displayEnd":538.09,"displayMid":535.49,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.4,"loudness":0.891055,"pitch":19.557659,"speechRate":5,"hasEvents":false,"sentence_source":"所以我觉得我决定不遵循一个非常标准的时刻表是比较早的。","sentence_en":"So I think I decided early on not to follow a very standard timeline."},{"id":"77","start":538.09,"end":542.41,"displayStart":538.09,"displayEnd":542.41,"displayMid":540.25,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":0.946822,"pitch":23.586039,"speechRate":5.048,"hasEvents":false,"sentence_source":"但是其实你不遵循一个时刻表，你后来会有的焦虑。","sentence_en":"But actually, if you don't follow a timeline, you'll later have anxiety."},{"id":"78","start":542.41,"end":550.41,"displayStart":542.41,"displayEnd":550.41,"displayMid":546.41,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":-0.2,"loudness":0.908239,"pitch":22.05127,"speechRate":6,"hasEvents":false,"sentence_source":"那也不是你当时一旦决定了你不遵循，你就不会有这种焦虑的，就你不遵循不是不遵循 你也可能有一个任性的时刻。","sentence_en":"It's not like once you decide not to follow it, you won't have that anxiety. Not following doesn't mean you won't have moments of rebellion."},{"id":"79","start":550.41,"end":557.11,"displayStart":550.41,"displayEnd":557.11,"displayMid":553.76,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":1.009639,"pitch":25.512405,"speechRate":5.795,"hasEvents":false,"sentence_source":"但是你在不断的面临别的人他们对你的期待的时候，你偶尔就是那些焦虑是会冒出来的。","sentence_en":"But when you constantly face others' expectations, those anxieties occasionally resurface."},{"id":"80","start":557.11,"end":567.19,"displayStart":557.11,"displayEnd":567.19,"displayMid":562.1500000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.5,"loudness":0.913978,"pitch":19.997913,"speechRate":5.754,"hasEvents":false,"sentence_source":"所以它是一个会不断的 你需要自己强化，你为什么不需要去遵循这个时刻表，你需要给自己一个很强大的心理后盾，你才能够持续去坚持的。","sentence_en":"So it's something you constantly need to reinforce—why you don't need to follow that timeline, and you need a strong psychological support to keep persisting."},{"id":"81","start":567.19,"end":578.69,"displayStart":567.19,"displayEnd":578.69,"displayMid":572.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.059726,"pitch":23.999777,"speechRate":5.072,"hasEvents":false,"sentence_source":"在年轻的时候 我们可能对于人生的想象，有些时候也是基于我们在那个时刻崇拜的偶像，他们的生活方式会带给我们巨大的某种影响。","sentence_en":"When we're young, our imagination of life is sometimes based on the idols we admire at that time, and their lifestyles can greatly influence us."},{"id":"82","start":578.69,"end":585.59,"displayStart":578.69,"displayEnd":585.59,"displayMid":582.1400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Neutral","score":0,"loudness":1.054044,"pitch":23.737471,"speechRate":6.159,"hasEvents":false,"sentence_source":"所以那个时候我不知道你心目当中崇拜的女性的偶像，他们的生活方式有没有极大的影响到你。","sentence_en":"So back then, I don't know if the female idols you admired greatly influenced your lifestyle."},{"id":"83","start":585.59,"end":587.03,"displayStart":585.59,"displayEnd":587.03,"displayMid":586.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.73794,"pitch":18.473852,"speechRate":4.167,"hasEvents":false,"sentence_source":"我觉得我好像。","sentence_en":"I think I was..."},{"id":"84","start":587.03,"end":596.15,"displayStart":587.03,"displayEnd":596.15,"displayMid":591.5899999999999,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.3,"loudness":1.039901,"pitch":19.598885,"speechRate":4.386,"hasEvents":false,"sentence_source":"在很长很长的时间内，我其实没有什么能给我打鸡血的女性的偶像，就是我小的时候是长在镇上。","sentence_en":"For a very long time, I actually had no female idol that inspired me. I grew up in a small town."},{"id":"85","start":596.15,"end":602.41,"displayStart":596.15,"displayEnd":602.41,"displayMid":599.28,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":1.00055,"pitch":21.96982,"speechRate":5.965,"hasEvents":false,"sentence_source":"然后当我上小学的时候，我妈妈跟我说她说镇上的小学，你走过去就是非常的坑坑挖挖。","sentence_en":"Then when I started elementary school, my mom told me that the town's elementary school had very bumpy roads to walk."},{"id":"86","start":602.41,"end":605.39,"displayStart":602.41,"displayEnd":605.39,"displayMid":603.9,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.5,"loudness":0.951395,"pitch":20.432394,"speechRate":5.369,"hasEvents":false,"sentence_source":"然后教室里没有非常像样的桌子椅子。","sentence_en":"And the classroom didn't have decent desks and chairs."},{"id":"87","start":605.39,"end":609.21,"displayStart":605.39,"displayEnd":609.21,"displayMid":607.3,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":0.884647,"pitch":21.24704,"speechRate":5.236,"hasEvents":false,"sentence_source":"然后老师可能也不一定能够带给你很好的教育。","sentence_en":"And the teachers might not provide a good education."},{"id":"88","start":609.21,"end":612.77,"displayStart":609.21,"displayEnd":612.77,"displayMid":610.99,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.5,"loudness":0.945608,"pitch":16.452873,"speechRate":4.213,"hasEvents":false,"sentence_source":"所以他就坚持要送我到县上去读书。","sentence_en":"So she insisted on sending me to study in the county."},{"id":"89","start":612.77,"end":617.27,"displayStart":612.77,"displayEnd":617.27,"displayMid":615.02,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.074424,"pitch":19.362398,"speechRate":5.778,"hasEvents":false,"sentence_source":"然后所以我从早上6点多就开始做，从镇上到县上的这个巴士。","sentence_en":"So I took the bus from the town to the county starting at around 6 in the morning."},{"id":"90","start":617.27,"end":619.57,"displayStart":617.27,"displayEnd":619.57,"displayMid":618.4200000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.964196,"pitch":16.798197,"speechRate":6.522,"hasEvents":false,"sentence_source":"然后所以我小学是在县里面读过的。","sentence_en":"So I attended elementary school in the county."},{"id":"91","start":619.57,"end":623.99,"displayStart":619.57,"displayEnd":623.99,"displayMid":621.78,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.025501,"pitch":21.40308,"speechRate":6.342,"hasEvents":false,"sentence_source":"然后到了上高中的时候，我又从县上到了一个三线城市，当时在宜滨。","sentence_en":"Then when I got to high school, I moved from the county to a third-tier city, Yibin at that time."},{"id":"92","start":623.99,"end":638.69,"displayStart":623.99,"displayEnd":638.69,"displayMid":631.34,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.6,"loudness":0.895061,"pitch":19.236202,"speechRate":4.504,"hasEvents":false,"sentence_source":"所以就是我小时候能够看到的女性的形象是很少很少的，我做某种意义上我的妈妈和外婆他们就是我的女性楷模，就我觉得我妈妈是一个非常神奇的一个人。","sentence_en":"So when I was young, I saw very few female role models. In a sense, my mother and grandmother were my female role models. I think my mom is an amazing person."},{"id":"93","start":638.69,"end":644.73,"displayStart":638.69,"displayEnd":644.73,"displayMid":641.71,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.930639,"pitch":20.236305,"speechRate":5.927,"hasEvents":false,"sentence_source":"我从小你看我虽然长在这样这样子的三线城市，它是一个相对比较封闭的一个环境。","sentence_en":"You see, although I grew up in such a third-tier city, a relatively closed environment,"},{"id":"94","start":644.73,"end":654.19,"displayStart":644.73,"displayEnd":654.19,"displayMid":649.46,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.87457,"pitch":20.804064,"speechRate":5.332,"hasEvents":false,"sentence_source":"其实当时我跟我的很多同龄的朋友聊天的时候，我都会发现他们的家教跟我的家教是非常不一样的，家里的规讯很多。","sentence_en":"Actually, when I chatted with many friends of the same age, I found their family education was very different from mine, with many family rules."},{"id":"95","start":654.19,"end":664.33,"displayStart":654.19,"displayEnd":664.33,"displayMid":659.26,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.998717,"pitch":21.021263,"speechRate":6.213,"hasEvents":false,"sentence_source":"然后对女孩子期待非常非常多，但我不知道为什么我爸妈从小给了我极大的自由，就是我选择我自己想要去的学校，他们会给我提供信息 然后给我鼓励。","sentence_en":"And there were many expectations for girls, but I don't know why my parents gave me great freedom from a young age. When I chose the school I wanted to go to, they would provide information and encouragement."},{"id":"96","start":664.33,"end":668.09,"displayStart":664.33,"displayEnd":668.09,"displayMid":666.21,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.917509,"pitch":20.697289,"speechRate":4.521,"hasEvents":false,"sentence_source":"然后我当时有很长的这种写日记的习惯。","sentence_en":"And I had a long habit of keeping a diary."},{"id":"97","start":668.09,"end":671.95,"displayStart":668.09,"displayEnd":671.95,"displayMid":670.02,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.6,"loudness":1.13025,"pitch":24.476091,"speechRate":7.622,"hasEvents":false,"sentence_source":"但是我有很大的安全感，就是我的日记可以放在家里的任何一个角落。","sentence_en":"But I felt very secure, because my diary could be placed in any corner of the house."},{"id":"98","start":671.95,"end":673.19,"displayStart":671.95,"displayEnd":673.19,"displayMid":672.57,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.327457,"pitch":30.790831,"speechRate":9.649,"hasEvents":false,"sentence_source":"其实我不知道他们看没看。","sentence_en":"Actually, I don't know if they read it."},{"id":"99","start":673.19,"end":678.33,"displayStart":673.19,"displayEnd":678.33,"displayMid":675.76,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.5,"loudness":1.022174,"pitch":23.330269,"speechRate":6.226,"hasEvents":false,"sentence_source":"但是虽然我觉得非常崇拜的，就是如果他们看了，他们可以做到资自不提的话。","sentence_en":"But what I admire is that even if they read it, they could pretend they never saw it."},{"id":"100","start":678.33,"end":685.95,"displayStart":678.33,"displayEnd":685.95,"displayMid":682.1400000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.7,"loudness":0.992735,"pitch":22.640099,"speechRate":4.856,"hasEvents":false,"sentence_source":"我觉得这是需要很大的定理的，就是他看到我成长的那个过程，他总是充满了耐心和忍耐。","sentence_en":"I think that requires great self-discipline. In watching me grow up, she always showed patience and tolerance."},{"id":"101","start":685.95,"end":690.81,"displayStart":685.95,"displayEnd":690.81,"displayMid":688.38,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":" ":"her ideal university."},{"id":"106","start":700.33,"end":702.63,"displayStart":700.33,"displayEnd":702.63,"displayMid":701.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.806325,"pitch":22.540943,"speechRate":7.391,"hasEvents":false,"sentence_source":"所以他最后高中毕业之后，他就去了工厂。","sentence_en":"So after graduating high school, she went to work in a factory."},{"id":"107","start":702.63,"end":705.45,"displayStart":702.63,"displayEnd":705.45,"displayMid":704.04,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.3,"loudness":1.215397,"pitch":25.225788,"speechRate":4.948,"hasEvents":false,"sentence_source":"但他一直是一个文学爱好者。","sentence_en":"But she always loved literature."},{"id":"108","start":705.45,"end":707.85,"displayStart":705.45,"displayEnd":707.85,"displayMid":706.6500000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.3,"loudness":1.025576,"pitch":21.859602,"speechRate":5.417,"hasEvents":false,"sentence_source":"所以他当时在自修文学的本课。","sentence_en":"So she was self-studying an undergraduate degree in literature."},{"id":"109","start":707.85,"end":715.05,"displayStart":707.85,"displayEnd":715.05,"displayMid":711.45,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.4,"loudness":1.069935,"pitch":25.239079,"speechRate":5.568,"hasEvents":false,"sentence_source":"所以我家里有很多很多的小说，他当时就会跟我讲什么，就是世界名作系列里面的，像《红语黑》。","sentence_en":"So we had many novels at home. She would tell me about world classics like 'The Red and the Black'."},{"id":"110","start":715.05,"end":718.17,"displ n Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.4,"loudness":1.018552,"pitch":23.015055,"speechRate":6.824,"hasEvents":false,"sentence_source":"所以他并不是我想要过的生活。","sentence_en":"So that wasn't the life I wanted."},{"id":"118","start":771.33,"end":774.35,"displayStart":771.33,"displayEnd":774.35,"displayMid":772.84,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.5,"loudness":0.860386,"pitch":19.643019,"speechRate":5.629,"hasEvents":false,"sentence_source":"但是我其实看不到真正的不一样的选择。","sentence_en":"But actually, I didn't see any truly different choices."},{"id":"119","start":774.35,"end":775.95,"displayStart":774.35,"displayEnd":775.95,"displayMid":775.1500000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Female Characters and Gender Scripts in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.944358,"pitch":15.745541,"speechRate":6.25,"hasEvents":false,"sentence_source":"但是我只是觉得 他是我。","sentence_en":"But I just felt she was my"},{"id":"120","start":775.95,"end":784.03,"displayStart":775.95,"displayEnd":784.03,"displayMid":779.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Female Characters and Gender Scripts in Film and Television","sentiment_en":"Neutral","score":0,"loudness":0.818248,"pitch":16.811457,"speechRate":5.446,"hasEvents":false,"sentence_source":"重进的一个人 他是我相信的一个人，他对你后来成长过程当中 你性格的养成 有些什么样的印象，就我生活。","sentence_en":"important person, someone I trust. What kind of impression did she have on your later growth and character development? In my life,"},{"id":"121","start":784.03,"end":789.33,"displayStart":784.03,"displayEnd":789.33,"displayMid":786.6800000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":5,"cluste 53.47,"displayStart":838.87,"displayEnd":853.47,"displayMid":846.1700000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.845455,"pitch":23.990715,"speechRate":4.932,"hasEvents":false,"sentence_source":"所以我觉得有一种绝望，就是我觉得在关于我作为一个女人的命运这一点上，我当时会觉得我想不到别的可能性，这跟当时的那个意识形态的宣传，就是说女人要顶半遍天啊。","sentence_en":"So I felt a kind of despair. Regarding my fate as a woman, I couldn't imagine any other possibility. This was despite the propaganda at the time that 'women hold up half the sky."},{"id":"129","start":853.47,"end":854.93,"displayStart":853.47,"displayEnd":854.93,"displayMid":854.2,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Neutral","score":0,"loudness":0.964907,"pitch":26.607288,"speechRate":6.849,"hasEvents":false,"sentence_source":"然后是男是女都一样啊。","sentence_en":"And that men and women are the same."},{"id":"130","start":854.93,"end":865.15,"displayStart":854.93,"displayEnd":865.15,"displayMid":860.04,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Negative","score":-0.5,"loudness":0.86732,"pitch":20.723263,"speechRate":5.9,"hasEvents":false,"sentence_source":"所以我有一种就是在头脑里面的一种错位，我不知道怎么把这两个东西，放在一起很难把他们就是好像是有一棍圆中的东西把它给解释起来。","sentence_en":"So I had a mental disconnect. I didn't know how to reconcile these two things, to make them fit into a single, coherent explanation."},{"id":"131","start":865.15,"end":874.95,"displayStart":865.15,"displayEnd":874.95,"displayMid":870.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.974236,"pitch":20.025993,"speechRate":6.429,"hasEvents":true,"sentence_source":"我们都是渴望更大的舞台去见外面的世界吗，你觉得你真正开始跟整个世界产生特别紧密的连接，好像成为这个世界的一部分是从大学时候开始的吗。","sentence_en":"We all yearn for a bigger stage to see the outside world. Do you think your real, close connection with the world, feeling like you're part of it, started in college?"},{"id":"132","start":875.49,"end":879.43,"displayStart":875.49,"displayEnd":879.43,"displayMid":877.46,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.818001,"pitch":24.243488,"speechRate":4.124,"hasEvents":true,"sentence_source":"我觉得我在读大学的时候非常的懵懂。","sentence_en":"I think I was very naive during college."},{"id":"133","start":879.43,"end":894.33,"displayStart":879.43,"displayEnd":894.33,"displayMid":886.88,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.871943,"pitch":24.504948,"speechRate":5.195,"hasEvents":false,"sentence_source":"我觉得我其实一直都有一个很强的自我意识，就是我是一个心思特别特别多的人，就是想法特别特别多的人，一方面我会在交流当中获得很多很多的乐趣，但另一方面其实我又很纠结。","sentence_en":"I think I've always had a strong self-awareness — I'm a person with a lot of thoughts, a lot of ideas. On one hand, I get a lot of joy from communicating, but on the other hand, I'm very conflicted."},{"id":"134","start":894.33,"end":900.59,"displayStart":894.33,"displayEnd":900.59,"displayMid":897.46,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.6,"loudness":1.075942,"pitch":22.730995,"speechRate":5.431,"hasEvents":false,"sentence_source":"我愿意花很多时间就跟我自己在一起，就非常非常的舒适，我想想什么就想想什么。","sentence_en":"I'm willing to spend a lot of time alone with myself, very comfortable, just thinking about whatever I want."},{"id":"135","start":900.59,"end":909.49,"displayStart":900.59,"displayEnd":909.49,"displayMid":905.04,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.033781,"pitch":25.867472,"speechRate":6.292,"hasEvents":false,"sentence_source":"然后我可能也没在做什么，就走走逛逛什么的，就过很多的这样的时间，我读大学的时候很多时间都是这样子过的，我当时是在武汉大学。","sentence_en":"And I might not be doing anything specific, just walking around, spending a lot of time that way. I spent a lot of my college years like that. I was at Wuhan University."},{"id":"136","start":909.49,"end":912.11,"displayStart":909.49,"displayEnd":912.11,"displayMid":910.8,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.886496,"pitch":29.737913,"speechRate":6.87,"hasEvents":false,"sentence_source":"然后武汉大学里面有座很大的山叫洛加山。","sentence_en":"Wuhan University has a big mountain called Luojia Mountain."},{"id":"137","start":912.11,"end":919.23,"displayStart":912.11,"displayEnd":919.23,"displayMid":915.6700000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":1.0121,"pitch":27.440861,"speechRate":5.922,"hasEvents":false,"sentence_source":"然后我其实在那里的四年，我有很多的时间是一个人在洛加山上走，我不是那种会忽缝好友的人。","sentence_en":"During my four years there, I spent a lot of time walking alone on Luojia Mountain. I'm not the type to hang out with friends."},{"id":"138","start":919.23,"end":923.73,"displayStart":919.23,"displayEnd":923.73,"displayMid":921.48,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.997571,"pitch":32.983688,"speechRate":6.2,"hasEvents":false,"sentence_source":"然后洛加山是非常非常的冷屁的，我就会在上面一圈一圈的转圈。","sentence_en":"Luojia Mountain was very quiet and secluded, and I would just walk in circles up there."},{"id":"139","start":923.73,"end":934.65,"displayStart":923.73,"displayEnd":934.65,"displayMid":929.19,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.4,"loudness":0.979772,"pitch":22.90696,"speechRate":4.634,"hasEvents":false,"sentence_source":"其实我现在想不起来我在想什么，我的大学生活非常的奢侈，就是要么在图书馆看闲出，要么在洛加山上漫无目的的走路。","sentence_en":"Actually, I can't remember what I was thinking about now. My college life was very indulgent — either reading for leisure in the library or aimlessly walking on Luojia Mountain."},{"id":"140","start":934.65,"end":946.43,"displayStart":934.65,"displayEnd":946.43,"displayMid":940.54,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.933912,"pitch":26.008839,"speechRate":5.847,"hasEvents":false,"sentence_source":"就是我其实没有觉得我跟世界有什么样的很强的这种联系，就好像总有一天这个世界等着我去做什么，就某种意义上我好像有一种隐隐约约的野心，我想要做什么。","sentence_en":"I didn't feel a strong connection with the world. It's as if the world was waiting for me to do something. In a way, I had a vague ambition, wanting to do something."},{"id":"141","start":946.43,"end":956.19,"displayStart":946.43,"displayEnd":956.19,"displayMid":951.31,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.874895,"pitch":21.798487,"speechRate":5.738,"hasEvents":false,"sentence_source":"但是我其实不知道我想要做什么，我不知道我跟这个世界的真正的联系是什么，我一直都很喜欢文化类的东西，就是哲学文学啊什么的。","sentence_en":"But I didn't actually know what I wanted to do. I didn't know my real connection to the world. I've always liked cultural things — philosophy, literature, and so on."},{"id":"142","start":956.19,"end":965.23,"displayStart":956.19,"displayEnd":96 ,"speechRate":5.056,"hasEvents":true,"sentence_source":"你到了北大读哲学那个时候，你所在哲学专业里面你学到的那些知识，你阅读那些书记 有没有在那时候已经开始帮你，从哲学的角度去思考你作为一个年轻女性所经历的这一切。","sentence_en":"When you went to Peking University to study philosophy, did the knowledge you learned in the philosophy department, the books you read, already start helping you think philosophically about everything you experienced as a young woman?"},{"id":"242","start":1550.51,"end":1551.99,"displayStart":1550.51,"displayEnd":1551.99,"displayMid":1551.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.01282,"pitch":27.051207,"speechRate":5.405,"hasEvents":false,"sentence_source":"那时候哲学对我还。","sentence_en":"Philosophy wasn't any help to me then."},{"id":"243","start":1551.99,"end":1566.13,"displayStart":1551.99,"displayEnd":1566.13,"displayMid":1559.06,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.3,"loudness":0.9191,"pitch":23.825983,"speechRate":5.516,"hasEvents":false,"sentence_source":"没有任何的帮助，去北大读哲学的时候，我对哲学的想象 哲学是没有性别的，就是你如果是一个理智的人的话，你所想象的 你所理解的这个世界，他应该是一样的 我当时没有很强的性别意识。","sentence_en":"When I went to Peking University for philosophy, my imagination of philosophy was that it has no gender. If you are a rational person, the world you imagine and understand should be the same. I didn't have a strong gender awareness back then."},{"id":"244","start":1566.13,"end":1570.95,"displayStart":1566.13,"displayEnd":1570.95,"displayMid":1568.54,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":0.837149,"pitch":20.044369,"speechRate":3.734,"hasEvents":false,"sentence_source":"然后其实哲学是一个非常艳女的一个传统。","sentence_en":"And actually, philosophy is a very misogynistic tradition."},{"id":"245","start":1570.95,"end":1578.09,"displayStart":1570.95,"displayEnd":1578.09,"displayMid":1574.52,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":1.156865,"pitch":26.817156,"speechRate":7.086,"hasEvents":false,"sentence_source":"因为你读的 几乎你读的所有的哲学家都是男的，就比方说你读泥采 或者说那你要去看你的女人，你就戴上你的鞭子吧。","sentence_en":"Because almost all the philosophers you read are men. For example, when you read Nietzsche, or if you go to women, take your whip."},{"id":"246","start":1578.09,"end":1581.79,"displayStart":1578.09,"displayEnd":1581.79,"displayMid":1579.94,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.800273,"pitch":26.031401,"speechRate":4.979,"hasEvents":false,"sentence_source":"然后当时就是非常流行 你比方说过评的书。","sentence_en":"And back then, books like Schopenhauer's were very popular."},{"id":"247","start":1581.79,"end":1590.37,"displayStart":1581.79,"displayEnd":1590.37,"displayMid":1586.08,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.7,"loudness":1.035153,"pitch":28.111712,"speechRate":6.294,"hasEvents":false,"sentence_source":"然后他的一句名言就是 女人学哲学就是既折磨哲学又折磨女人，他真的说了这话吗，他真的说过这句话 就是他不应该去学哲学的。","sentence_en":"One of his famous sayings is: 'A woman who studies philosophy torments both philosophy and herself.' Did he really say that? He really said that women should not study philosophy."},{"id":"248","start":1590.37,"end":1592.23,"displayStart":1590.37,"displayEnd":1592.23,"displayMid":1591.3,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.069934,"pitch":30.792431,"speechRate":8.929,"hasEvents":false,"sentence_source":"所以我当时在北大哲学历史的时候。","sentence_en":"So when I was in the philosophy history program at Peking University,"},{"id":"249","start":1592.23,"end":1604.35,"displayStart":1592.23,"displayEnd":1604.35,"displayMid":1598.29,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":0.885829,"pitch":25.122644,"speechRate":5.207,"hasEvents":false,"sentence_source":"我们读的书也都是非常大部头的哲学经典著作，尽管你从佛拉图亚书得到康德尼采，就是你看到的都是男人的视角，而且其实在学校你会明显感受得到。","sentence_en":"the books we read were also thick classic philosophical works. From Plato to Kant to Nietzsche, you only saw male perspectives, and you could clearly feel it at school."},{"id":"250","start":1604.35,"end":1609.23,"displayStart":1604.35,"displayEnd":1609.23,"displayMid":1606.79,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.3,"loudness":0.963064,"pitch":23.959414,"speechRate":5.832,"hasEvents":false,"sentence_source":"男同学的那种对他们所学到的所谓的他们的哲学功底这种自信。","sentence_en":"Male classmates had this confidence in their so-called philosophical foundation."},{"id":"251","start":1609.23,"end":1618.43,"displayStart":1609.23,"displayEnd":1618.43,"displayMid":1613.83,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":0.897481,"pitch":19.373041,"speechRate":5.217,"hasEvents":false,"sentence_source":"然后他们的哲学表达他们在课堂上的那种，坎坎而坎的那种底气是女生没有的，一方面本身女生的数量就要少很多。","sentence_en":"Their philosophical expression, the confidence they had in class, was something female students lacked. On one hand, there were far fewer female students."},{"id":"252","start":1618.43,"end":1623.23,"displayStart":1618.43,"displayEnd":1623.23,"displayMid":1620.83,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.4,"loudness":0.970253,"pitch":29.502892,"speechRate":7.325,"hasEvents":false,"sentence_source":"那一方面我觉得大家对女生的期待也是，她可能长远是不会走哲学这条道路的。","sentence_en":"On the other hand, I think people's expectations for female students were that they probably wouldn't pursue philosophy in the long run."},{"id":"253","start":1623.23,"end":1630.33,"displayStart":1623.23,"displayEnd":1630.33,"displayMid":1626.78,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":0.943629,"pitch":19.936123,"speechRate":4.906,"hasEvents":false,"sentence_source":"因为你看 整个哲学系可能三十多个老师，你能够数得出来的女老师 可能就是两个。","sentence_en":"Because look, the entire philosophy department might have over thirty teachers, and you could count the female teachers on one hand—maybe two."},{"id":"254","start":1630.33,"end":1640.39,"displayStart":1630.33,"displayEnd":1640.39,"displayMid":1635.3600000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":0.806148,"pitch":20.681866,"speechRate":4.226,"hasEvents":false,"sentence_source":"所以其实你能够看到的就是，女性在哲学的这个知识 创造的这个体系下的位置，是几乎不存在的。","sentence_en":"So what you could see was that women's position in the knowledge-creation system of philosophy was almost non-existent."},{"id":"255","start":1640.39,"end":1645.27,"displayStart":1640.39,"displayEnd":1645.27,"displayMid":1642.83,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.3,"loudness":0.956161,"pitch":26.47357,"speechRate":6.459,"hasEvents":true,"sentence_source":"所以你唯一能够安慰自己，你也可以做哲学的 就是去相信哲学没有蓝女。","sentence_en":"So the only way you could comfort yourself that you could also do philosophy was to believe that philosophy has no male or female."},{"id":"256","start":1645.27,"end":1651.25,"displayStart":1645.27,"displayEnd":1651.25,"displayMid":1648.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.07101,"pitch":24.535942,"speechRate":5.234,"hasEvents":true,"sentence_source":"但你在北大读哲学那时候 你在你的专业里边 你身为一个少数性别。","sentence_en":"But when you were studying philosophy at Peking University, you were a gender minority in your field."},{"id":"257","start":1651.25,"end":1666.73,"displayStart":1651.25,"displayEnd":1666.73,"displayMid":1658.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Neutral","score":0,"loudness":0.938223,"pitch":22.167608,"speechRate":4.974,"hasEvents":true,"sentence_source":"因为就这么几个女孩子 这种少数人群的这种感觉会带给你一种，让你好像在某种困境当中 你会感受到自己是弱势一方，会有无力感 还是会因为我是少数 反而会觉得我代表了某种特别。","sentence_en":"Because there are only a few girls, this feeling of being a minority brings you a sense of being in some kind of predicament, where you feel like the weaker side, powerless. Or, because you are a minority, you feel like you represent something special."},{"id":"258","start":1667.39,"end":1668.93,"displayStart":1667.39,"displayEnd":1668.93,"displayMid":1668.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":1.022409,"pitch":17.57778,"speechRate":6.294,"hasEvents":true,"sentence_source":"我知道我是少数 但是。","sentence_en":"I knew I was in the minority, but"},{"id":"259","start":1668.93,"end":1679.37,"displayStart":1668.93,"displayEnd":1679.37,"displayMid":1674.15,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.915579,"pitch":23.325645,"speechRate":5.077,"hasEvents":false,"sentence_source":"这件事情对我而言不重要 就是我当时没有太系统的去思考这个问题，我只有一种直觉 就是女生的音量比男生的音量要小很多。","sentence_en":"that didn't matter to me. I didn't think about it systematically back then. I only had an intuition that female voices were much quieter than male voices."},{"id":"260","start":1679.37,"end":1692.87,"displayStart":1679.37,"displayEnd":1692.87,"displayMid":1686.12,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.4,"loudness":0.876174,"pitch":20.887995,"speechRate":4.395,"hasEvents":false,"sentence_source":"然后女生去读博的数量 到他们之后成为老师 同为哲学教授的概率，它好像是有一层一层的被塞掉 就是你进入研究生 你就可能已经只有20%。","sentence_en":"The number of women pursuing PhDs, and then becoming teachers, the probability of becoming a philosophy professor, seemed to be filtered layer by layer. By the time you entered graduate school, there might be only 20% women."},{"id":"261","start":1692.87,"end":1701.13,"displayStart":1692.87,"displayEnd":1701.13,"displayMid":1697,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.3,"loudness":0.954434,"pitch":22.869701,"speechRate":5.257,"hasEvents":false,"sentence_source":"那你再进入博士 然后再进入哲学的教授这个序列 那他的比例会越来越少，我当时会有这种直观的感觉。","sentence_en":"Then when you entered the PhD program and the philosophy professor track, the proportion got smaller and smaller. I had that intuitive feeling."},{"id":"262","start":1701.13,"end":1716.49,"displayStart":1701.13,"displayEnd":1716.49,"displayMid":1708.81,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.906122,"pitch":22.25341,"speechRate":4.822,"hasEvents":false,"sentence_source":"但是我总觉得我会不会是幸存者，或者是说我会不会是一个就是侥幸的，会成为那比方说最后30分之1的那样子的一个人，你会看见什么，真的是跟你的整个信念体系相关的。","sentence_en":"But I always thought, would I be a survivor? Or maybe I would be the one who gets lucky and becomes that one in thirty? What you see is really tied to your entire belief system."},{"id":"263","start":1716.49,"end":1719.33,"displayStart":1716.49,"displayEnd":1719.33,"displayMid":1717.9099999999999,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.828502,"pitch":23.808256,"speechRate":6.084,"hasEvents":false,"sentence_source":"如果你当时觉得哲学是没有性别的话。","sentence_en":"If you thought philosophy had no gender back then,"},{"id":"264","start":1719.33,"end":1726.81,"displayStart":1719.33,"displayEnd":1726.81,"displayMid":1723.07,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.3,"loudness":0.793844,"pitch":19.350639,"speechRate":5.643,"hasEvents":false,"sentence_source":"那你就会觉得现在你所看到的，一切的这个性别上面的这个，就是对男性的倾斜，他都只是一个巧合。","sentence_en":"then you would think that everything you saw in terms of gender bias toward men was just a coincidence."},{"id":"265","start":1726.81,"end":1738.65,"displayStart":1726.81,"displayEnd":1738.65,"displayMid":1732.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":1.057383,"pitch":22.781565,"speechRate":5.591,"hasEvents":false,"sentence_source":"你找我有时候我们作为门外汉 我们会觉得 哇 哲学很神奇，我想啊 有时候我对人生很多的问题 思考不清楚 钻牛脚尖，就是因为我欠缺很多哲学的理论跟常识。","sentence_en":"Sometimes I think, as an outsider, philosophy seems amazing. I think, sometimes I get stuck on life's problems and overthink them because I lack philosophical theory and common sense."},{"id":"266","start":1738.65,"end":1750.23,"displayStart":1738.65,"displayEnd":1750.23,"displayMid":1744.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.977816,"pitch":22.804636,"speechRate":5.013,"hasEvents":false,"sentence_source":"那我在想 那作为一个哲学专业的学生 你哲学专业的一个学者，他会帮你在人生当中好像解开你很多的困惑，或对你的人生有很多的帮助吗。","sentence_en":"So I wonder, as a philosophy student and scholar, did it help you untangle many of life's confusions or help you in life?"},{"id":"267","start":1750.23,"end":1754.77,"displayStart":1750.23,"displayEnd":1754.77,"displayMid":1752.5,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.824394,"pitch":28.066193,"speechRate":5.122,"hasEvents":false,"sentence_source":"就学哲学生会被问的最多的就是 人生的意义是什么。","sentence_en":"The most common question philosophy students get asked is: 'What is the meaning of life?"},{"id":"268","start":1754.77,"end":1758.61,"displayStart":1754.77,"displayEnd":1758.61,"displayMid":1756.69,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.830869,"pitch":20.290104,"speechRate":4.427,"hasEvents":false,"sentence_source":"然后一个具体的选择 你应该去怎么去做。","sentence_en":"And then, how should you make a specific choice?"},{"id":"269","start":1758.61,"end":1770.99,"displayStart":1758.61,"displayEnd":1770.99,"displayMid":1764.8,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.3,"loudness":0.849979,"pitch":22.121649,"speechRate":4.847,"hasEvents":false,"sentence_source":"我觉得其实哲学它很少对我有很多的直接的这种关照，我在我自己的人生中大的决定 不要不要回国，要不要又要出去 或者是我意外怀孕的时候。","sentence_en":"I think philosophy rarely gave me direct guidance on that. In my major life decisions—whether to return to China, whether to leave again, or when I had an accidental pregnancy—"},{"id":"270","start":1770.99,"end":1774.91,"displayStart":1770.99,"displayEnd":1774.91,"displayMid":1772.95,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.918917,"pitch":21.017162,"speechRate":7.365,"hasEvents":false,"sentence_source":"我是不是要把孩子生下来 我觉得我好像其实都不是这样做的。","sentence_en":"whether to have the child—I don't think I made those decisions that way."},{"id":"271","start":1774.91,"end":1788.73,"displayStart":1774.91,"displayEnd":1788.73,"displayMid":1781.8200000000002,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.938431,"pitch":19.026064,"speechRate":5.39,"hasEvents":false,"sentence_source":"其实我更多的好像是有一种 哪一个理由是我不能拒绝的理由，而不是说综合起来什么理由是最强的理由应该去做什么，就比方说其实也许当我在读研究生的时候忽然意外怀孕。","sentence_en":"Actually, I think it was more about which reason I couldn't say no to, rather than which reason was the strongest and what I should do. For example, when I accidentally became pregnant during grad school,"},{"id":"272","start":1788.73,"end":1794.03,"displayStart":1788.73,"displayEnd":1794.03,"displayMid":1791.38,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Negative","score":-0.5,"loudness":0.872219,"pitch":19.522869,"speechRate":5.66,"hasEvents":false,"sentence_source":"也许真的最恰当的事情是多抬，我现在都觉得也许最理智的事情是多抬。","sentence_en":"maybe the most appropriate thing would have been to abort. Even now, I think the most rational thing would have been to abort."},{"id":"273","start":1794.0 _en":"I feel I don't have everything. In the ordinary sense of having it all, especially maybe wanting to be both a mother..."},{"id":"284","start":1886.25,"end":1888.51,"displayStart":1886.25,"displayEnd":1888.51,"displayMid":1887.38,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.859836,"pitch":22.500753,"speechRate":7.08,"hasEvents":false,"sentence_source":"然后你也有一个比较完整的一个家庭。","sentence_en":"And having a complete family."},{"id":"285","start":1888.51,"end":1892.03,"displayStart":1888.51,"displayEnd":1892.03,"displayMid":1890.27,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.864577,"pitch":18.089617,"speechRate":4.545,"hasEvents":false,"sentence_source":"然后呢你就是有自己的事业，这是很多。","sentence_en":"And then you have your own career, which is something many people imagine."},{"id":"286","start":1892.03,"end":1894.33,"displayStart":1892.03,"displayEnd":1894.33,"displayMid":1893.1799999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.727695,"pitch":21.846209,"speechRate":5.217,"hasEvents":false,"sentence_source":"人对全部拥有的一种想象但。","sentence_en":"An imagination of having it all."},{"id":"287","start":1894.33,"end":1900.87,"displayStart":1894.33,"displayEnd":1900.87,"displayMid":1897.6,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.985967,"pitch":24.966686,"speechRate":5.505,"hasEvents":false,"sentence_source":"你想 我拥有了既有孩子又有事业的生活，我就没有拥有 就是没有孩子只有事业的生活。","sentence_en":"You think, if I have a life with both children and a career, then I don't have the hat can be chosen or worth choosing, I shouldn't use others' lives as a benchmark."},{"id":"303","start":2010.43,"end":2023.53,"displayStart":2010.43,"displayEnd":2023.53,"displayMid":2016.98,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Positive","score":0.5,"loudness":1.00898,"pitch":24.685581,"speechRate":4.835,"hasEvents":false,"sentence_source":"怎么叫做完成我这张答卷的标准答案，我不应该就想如果说我是一个没有孩子的学者，我已经写了多少本书，我也不应该就想我是一个没有事业的妈妈。","sentence_en":"What counts as the standard answer to complete my own exam paper? I shouldn't think, 'If I were a scholar without children, how many books would I have written?' Nor should I think, 'If I were a mother without a career, how much love could I give my child?"},{"id":"304","start":2023.53,"end":2032.19,"displayStart":2023.53,"displayEnd":2032.19,"displayMid":2027.8600000000001,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Motherhood, Career, and Women's Freedom","sentiment_en":"Neutral","score":0,"loudness":0.939172,"pitch":22.83024,"speechRate":4.388,"hasEvents":false,"sentence_source":"我对我的孩子能够有多少的爱，我能让他每一顿吃得有多么的心满意足，让他的衣服多干净。","sentence_en":"How satisfied can I make him with every meal? How clean can I keep his clothes?"},{"id":"305","start":2032.19,"end":2035.67,"displayStart":2032.19,"displayEnd":2035.67,"displayMid":2033.93,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.959616,"pitch":22.488495,"speechRate":4.885,"hasEvents":false,"sentence_source":"然后他的兴趣爱好发展得有多么的全面。","sentence_en":"And how comprehensively can I develop his interests and hobbies?"},{"id":"306","start":2037.51,"end":2040.85,"displayStart":2037.51,"displayEnd":2040.85,"displayMid":2039.1799999999998,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":1.247077,"pitch":32.264591,"speechRate":3.636,"hasEvents":false,"sentence_source":"你明明不可能去做那份问卷。","sentence_en":"You clearly cannot fill out that questionnaire."},{"id":"307","start":2040.85,"end":2048.13,"displayStart":2040.85,"displayEnd":2048.13,"displayMid":2044.49,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.4,"loudness":0.883814,"pitch":26.791597,"speechRate":4.396,"hasEvents":false,"sentence_source":"然后你非要以那份问卷的标准答案来去印造你自己的这份问卷，你就必输啊。","sentence_en":"Yet you insist on using the standard answers from that questionnaire to shape your own—you're bound to lose."},{"id":"308","start":2048.13,"end":2052.51,"displayStart":2048.13,"displayEnd":2052.51,"displayMid":2050.32,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Stepping Out of Comfort Zone and Life Exploration","sentiment_en":"Positive","score":0.5,"loudness":0.90796,"pitch":30.14542,"speechRate":5.804,"hasEvents":false,"sentence_source":"但是如果说我说我这份问卷，它也是一个值得去做的问卷。","sentence_en":"But if I say that this questionnaire of mine is also one worth doing,"},{"id":"309","start":2052.51,"end":2056.45,"displayStart":2052.51,"displayEnd":2056.45,"displayMid":2054.48,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.849025,"pitch":21.088198,"speechRate":4.315,"hasEvents":false,"sentence_source":"那我只能想象我这份问卷的答案是什么。","sentence_en":"Then I can only imagine what the answers to my questionnaire are."},{"id":"310","start":2056.45,"end":2059.79,"displayStart":2056.45,"displayEnd":2059.79,"displayMid":2058.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.3,"loudness":0.966932,"pitch":23.377909,"speechRate":3.892,"hasEvents":false,"sentence_source":"总之我觉得都是不容易都很难。","sentence_en":"Anyway, I think none of it is easy; it's all very hard."},{"id":"311","start":2059.79,"end":2063.21,"displayStart":2059.79,"displayEnd":2063.21,"displayMid":2061.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.823205,"pitch":22.434658,"speechRate":5.848,"hasEvents":false,"sentence_source":"因为我最近听了你跟你先生的不少的那个播客。","sentence_en":"Because I've been listening to a lot of your podcasts with your husband lately."},{"id":"312","start":2063.21,"end":2078.97,"displayStart":2063.21,"displayEnd":2078.97,"displayMid":2071.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.913991,"pitch":20.85611,"speechRate":4.759,"hasEvents":false,"sentence_source":"然后我突然意识到一点，我发现每个人都有某种的学习障碍，我发现我跟你正好相反，我完全不能够靠听来吸收任何的信息 学习，我必须要付诸道文字，我必须要亲自去看 看那个文字。","sentence_en":"Then I suddenly realized that everyone has some kind of learning disability. I found that I am the exact opposite of you: I cannot absorb any information or learn by listening at all. I must rely on text; I have to personally read the words."},{"id":"313","start":2078.97,"end":2091.31,"displayStart":2078.97,"displayEnd":2091.31,"displayMid":2085.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.5,"loudness":1.019248,"pitch":23.843111,"speechRate":6.098,"hasEvents":false,"sentence_source":"然后自己可能一边看还要一边做简单的某些记录，这个是我吸收的过程，我突然就豁然开朗了，明天讲到你有阅读障碍吗，后来我想我可能是有某种听力方面的那种注意力的欠缺。","sentence_en":"And while listening, I'd take simple notes—that's how I absorb things. Suddenly it clicked: you mentioned dyslexia tomorrow, and I thought maybe I have some kind of auditory attention deficit."},{"id":"314","start":2092.37,"end":2106.07,"displayStart":2092.37,"displayEnd":2106.07,"displayMid":2099.2200000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":1.047107,"pitch":25.422703,"speechRate":5.375,"hasEvents":true,"sentence_source":"你跟我先生非常想 她说她从来上课其实学不到什么东西的，我就是 对 因为她听不进去，小时候你也会说听不进去是不是骂人的话，但你现在还发现有的人是真的听不进去的。","sentence_en":"You and my husband really think she never learns anything in class. That's me—exactly. Because she can't take it in. As a kid, you'd say 'can't take it in' as an insult, but now you realize some people genuinely can't."},{"id":"315","start":2106.07,"end":2118.33,"displayStart":2106.07,"displayEnd":2118.33,"displayMid":2112.2,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.914135,"pitch":25.772099,"speechRate":5.717,"hasEvents":false,"sentence_source":"所以我现在觉得可能就是阅读障碍证这个词的产生是因为有阅读中心主义，就是说阅读中心主义它预设了人最好的学习方式，或者人标准的学习方式是阅读。","sentence_en":"So now I think the term 'dyslexia' exists because of 'read-centrism'—it assumes the best or standard way to learn is through reading."},{"id":"316","start":2118.33,"end":2127.75,"displayStart":2118.33,"displayEnd":2127.75,"displayMid":2123.04,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.928001,"pitch":23.522951,"speechRate":5.843,"hasEvents":false,"sentence_source":"所以当你阅读慢 你不是通过主要用阅读的方式，或者阅读不是你只有效率的方式来学习的时候，它就会认为这是一种障碍症。","sentence_en":"So when you read slowly, or reading isn't your primary or efficient learning method, it gets labeled as a disorder."},{"id":"317","start":2127.75,"end":2139.63,"displayStart":2127.75,"displayEnd":2139.63,"displayMid":2133.69,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.874272,"pitch":22.051184,"speechRate":6.229,"hasEvents":false,"sentence_source":"因为就比方说像你刚才说你的这种情况，或者是像我先生那种情况，它没有一个独特的词，就是专门去使用那样子的一种状态，它是因为我们预设了又一种对人生的一种标准答案。","sentence_en":"Like your situation or my husband's—there isn't a specific term for that state, because we've preset a standard answer for life."},{"id":"318","start":2139.63,"end":2141.81,"displayStart":2139.63,"displayEnd":2141.81,"displayMid":2140.7200000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.961371,"pitch":14.131976,"speechRate":7.339,"hasEvents":false,"sentence_source":"就是说你如果是一个好的学习者的话。","sentence_en":"That is, if you're a good learner,"},{"id":"319","start":2141.81,"end":2147.07,"displayStart":2141.81,"displayEnd":2147.07,"displayMid":2144.44,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":0.795505,"pitch":23.516672,"speechRate":5.894,"hasEvents":false,"sentence_source":"那你一定是一个好的阅读者，人就是它的整个构造是非常非常地不一样的。","sentence_en":"you must be a good reader. But people's whole structure is incredibly different."},{"id":"320","start":2147.07,"end":2152.87,"displayStart":2147.07,"displayEnd":2152.87,"displayMid":2149.9700000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.3,"loudness":0.904668,"pitch":22.614756,"speechRate":4.488,"hasEvents":false,"sentence_source":"所以你要的不是把有神经多缘的人按照一个模板去规讯它。","sentence_en":"So what you need isn't to mold neurodivergent people into one template"},{"id":"321","start":2152.87,"end":2166.71,"displayStart":2152.87,"displayEnd":2166.71,"displayMid":2159.79,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.7,"loudness":0.808165,"pitch":20.810684,"speechRate":4.118,"hasEvents":false,"sentence_source":"然后让它以同一个模板来成为人才，而是按照以它能够很舒适的可以任意生长的一种自然的方式去学习，去成为它应该成为的那个人才。","sentence_en":"and make them talents by that same template, but to let them grow naturally in a way that's comfortable for them, becoming who they should be."},{"id":"322","start":2166.71,"end":2168.91,"displayStart":2166.71,"displayEnd":2168.91,"displayMid":2167.81,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.4,"loudness":0.775924,"pitch":26.607897,"speechRate":5.685,"hasEvents":false,"sentence_source":"我以前因为读书非常的慢。","sentence_en":"I used to read very slowly,"},{"id":"323","start":2168.91,"end":2176.29,"displayStart":2168.91,"displayEnd":2176.29,"displayMid":2172.6,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Negative","score":-0.5,"loudness":0.804241,"pitch":18.521959,"speechRate":5.42,"hasEvents":false,"sentence_source":"所以我就会觉得我是不是笨，最开始我听到有阅读障碍症的时候就说原来我不是笨我只是有病。","sentence_en":"so I thought I was stupid. When I first heard about dyslexia, I thought, 'I'm not stupid, I just have a disorder."},{"id":"324","start":2176.29,"end":2178.11,"displayStart":2176.29,"displayEnd":2178.11,"displayMid":2177.2,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.6,"loudness":0.886824,"pitch":16.299442,"speechRate":4.945,"hasEvents":false,"sentence_source":"然后觉得这是种进步。","sentence_en":"And that felt like progress."},{"id":"325","start":2178.11,"end":2187.95,"displayStart":2178.11,"displayEnd":2187.95,"displayMid":2183.0299999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.8,"loudness":0.881469,"pitch":26.560879,"speechRate":5.879,"hasEvents":false,"sentence_source":"然后现在有了就是神经多元这种理解，就是去除你对阅读中心主义的这样的一种执念之后，我现在发现我都不是不有病，我只是不一样。","sentence_en":"Now with this neurodiversity understanding—letting go of that read-centrist obsession—I realize I don't have a disorder, I'm just different."},{"id":"326","start":2187.95,"end":2197.35,"displayStart":2187.95,"displayEnd":2197.35,"displayMid":2192.6499999999996,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.911553,"pitch":19.830769,"speechRate":6.611,"hasEvents":false,"sentence_source":"对 那你为什么一定要把比方说，人类的大多数人他可能是在阅读上是强于他的听力的，你把他作为一个标准答案了，你就会觉得你自己是有病。","sentence_en":"Yeah, so if you take that most people are stronger at reading than listening as the standard, you'll think there's something wrong with you."},{"id":"327","start":2197.35,"end":2199.61,"displayStart":2197.35,"displayEnd":2199.61,"displayMid":2198.48,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.906404,"pitch":32.730835,"speechRate":7.046,"hasEvents":false,"sentence_source":"但是你如果觉得没有标准答案。","sentence_en":"But if you think there's no standard answer,"},{"id":"328","start":2199.61,"end":2204.07,"displayStart":2199.61,"displayEnd":2204.07,"displayMid":2201.84,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Positive","score":0.7,"loudness":0.812388,"pitch":21.495811,"speechRate":6.865,"hasEvents":false,"sentence_source":"那你就是按照自己的方式去恰当的生长，恰当的学习就可以了，我记得我。","sentence_en":"then you just grow and learn in your own way. I remember"},{"id":"329","start":2204.07,"end":2209.93,"displayStart":2204.07,"displayEnd":2209.93,"displayMid":2207,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Neutral","score":0,"loudness":0.912076,"pitch":24.640705,"speechRate":4.949,"hasEvents":false,"sentence_source":"第一次听到阅读障碍，当时他们举的例子是说，汤姆克鲁斯有阅读障碍。","sentence_en":"the first time I heard about dyslexia, they gave the example of Tom Cruise having it."},{"id":"330","start":2209.93,"end":2222.65,"displayStart":2209.93,"displayEnd":2222.65,"displayMid":2216.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.6,"loudness":1.028097,"pitch":21.190145,"speechRate":5.975,"hasEvents":false,"sentence_source":"然后好几个好莱坞明星都有阅读障碍，他们读剧本就自己看其实很难，他们需要别人给他念，我就想 天呐好莱坞明星真的好矫情啊，不想读就不想读还弄过什么阅读障碍好高级这个词。","sentence_en":"Then several Hollywood stars with dyslexia—they'd have trouble reading scripts on their own and needed someone to read to them. I thought, 'God, Hollywood stars are so pretentious—if they don't want to read, just say so, instead of coming up with this fancy term dyslexia."},{"id":"331","start":2222.65,"end":2228.83,"displayStart":2222.65,"displayEnd":2228.83,"displayMid":2225.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Epistemic Injustice and Women's Situation","sentiment_en":"Negative","score":-0.5,"loudness":1.126655,"pitch":24.290199,"speechRate":5.34,"hasEvents":false,"sentence_source":"就是你想那都已经很晚期了，就完全不了解你无法去想象还有这样的事情存在。","sentence_en":"I mean, that was my late-stage ignorance—I just couldn't imagine such a thing exist r":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.4,"loudness":1.15326,"pitch":27.011538,"speechRate":5.696,"hasEvents":false,"sentence_source":"我觉得我跟英语的关系非常的纠结，也经历了很多很多的过程。","sentence_en":"I think my relationship with English is very complicated and has gone through many processes."},{"id":"356","start":2374.19,"end":2386.05,"displayStart":2374.19,"displayEnd":2386.05,"displayMid":2380.12,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.973065,"pitch":22.817949,"speechRate":4.055,"hasEvents":false,"sentence_source":"我觉得我到现在为止，我的英文也不是完美的，而且它非常有偏向性，就是我的学术英文远远好于我的日常英文。","sentence_en":"I think my English still isn't perfect, and it's very skewed—my academic English is far better than my everyday English."},{"id":"357","start":2386.05,"end":2390.13,"displayStart":2386.05,"displayEnd":2390.13,"displayMid":2388.09,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.912032,"pitch":31.732025,"speechRate":5.815,"hasEvents":false,"sentence_source":"然后我觉得我用英文和用中文的时候，感觉非常不一样。","sentence_en":"And I feel very different when I use English versus Chinese."},{"id":"358","start":2390.13,"end":2393.23,"displayStart":2390.13,"displayEnd":2393.23,"displayMid":2391.6800000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.643187,"pitch":23.908533,"speechRate":4.839,"hasEvents":false,"sentence_source":"因为毕竟中文是你从小长大的语言。","sentence_en":"After all, Chinese is the language you grew up with."},{"id":"359","start":2393.23,"end":2397.57,"displayStart":2393.23,"displayEnd":2397.57,"displayMid":2395.4,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.887483,"pitch":20.018951,"speechRate":3.226,"hasEvents":false,"sentence_source":"然后你说这些话，你的对谈的背景。","sentence_en":"And when you speak, the background of the conversation."},{"id":"360","start":2397.57,"end":2406.41,"displayStart":2397.57,"displayEnd":2406.41,"displayMid":2401.99,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.79999,"pitch":22.135094,"speechRate":5.204,"hasEvents":false,"sentence_source":"然后对谈人对你的各种各样的期待，它对你是有很深入骨髓的，跟这个语言和这个文化联系起来的，有些暗示的。","sentence_en":"And the expectations of the person you're talking to have deep, bone-level implications tied to the language and culture."},{"id":"361","start":2406.41,"end":2421.03,"displayStart":2406.41,"displayEnd":2421.03,"displayMid":2413.7200000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":0.794968,"pitch":22.625708,"speechRate":5.116,"hasEvents":false,"sentence_source":"所以其实我经常觉得我在用中文的时候，尤其是我在对比我年长的人，男性什么的时候，我会自然不自然的，会更加的不那么自信，会更加的谦悲，会有取悦感，就是我很难控制自己。","sentence_en":"So I often feel that when I use Chinese, especially with older people or men, I unconsciously become less confident, more humble, and have a desire to please—I can hardly control it."},{"id":"362","start":2421.03,"end":2436.45,"displayStart":2421.03,"displayEnd":2436.45,"displayMid":2428.74,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.6,"loudness":0.885181,"pitch":25.026501,"speechRate":5.108,"hasEvents":false,"sentence_source":"但是我在用英文的时候，都是在一个比较职业化的一个场景去，讨论学术问题，我会比较自信，而且我没有那么多的，背后的礼仪，就是谁应该要更加谦逊，而且英文它也没有什么 宁啊什么的。","sentence_en":"But when I use English, it's usually in a professional setting, discussing academic issues. I feel more confident, and there isn't as much underlying etiquette about who should be more humble. Also, English doesn't have those honorifics like 'ning' or anything."},{"id":"363","start":2436.45,"end":2441.43,"displayStart":2436.45,"displayEnd":2441.43,"displayMid":2438.9399999999996,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.3,"loudness":0.939279,"pitch":24.295944,"speechRate":5.221,"hasEvents":false,"sentence_source":"就像我回到中文世界 我经常对用宁还是不用宁，我就嚼不过来。","sentence_en":"Like when I go back to the Chinese world, I often struggle with whether to use 'nin' (formal you) or not—I can't figure it out."},{"id":"364","start":2442.09,"end":2449.51,"displayStart":2442.09,"displayEnd":2449.51,"displayMid":2445.8,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Positive","score":0.5,"loudness":0.975504,"pitch":23.671076,"speechRate":5.765,"hasEvents":false,"sentence_source":"所以我觉得这两个语言在我使用的时候，好像我的那个人格都非常的不一样，就很有意思的一种感觉。","sentence_en":"So I feel like my personality is very different when I use these two languages—it's a really interesting feeling."},{"id":"365","start":2449.51,"end":2456.35,"displayStart":2449.51,"displayEnd":2456.35,"displayMid":2452.9300000000003,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":0.789031,"pitch":23.991541,"speechRate":4.741,"hasEvents":false,"sentence_source":"然后以前我会因为我的英文有一些口音，以前其实这点是会让我觉得自卑的。","sentence_en":"In the past, I used to feel insecure about my English accent."},{"id":"366","start":2456.35,"end":2467.69,"displayStart":2456.35,"displayEnd":2467.69,"displayMid":2462.02,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Positive","score":0.6,"loudness":0.924292,"pitch":24.019262,"speechRate":5.403,"hasEvents":false,"sentence_source":"但是我觉得我现在也有一个就是怎么说呢，革命性的变化，就我不知道你有没有听说一本书，可能是近两年在美国出的《KC Pack Home》。","sentence_en":"But I've had what I'd call a revolutionary change. I don't know if you've heard of a book published recently in the US, 'Minor Feelings'."},{"id":"367","start":2467.69,"end":2469.87,"displayStart":2467.69,"displayEnd":2469.87,"displayMid":2468.7799999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Reading, Learning, and Knowledge Acquisition","sentiment_en":"Neutral","score":0,"loudness":1.036296,"pitch":17.420792,"speechRate":5.991,"hasEvents":false,"sentence_source":"那本书的名字叫做《少数派感受。","sentence_en":"The book is called 'Minor Feelings'."},{"id":"368","start":2469.87,"end":2470.59,"displayStart":2469.87,"displayEnd":2470.59,"displayMid":2470.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.172915,"pitch":10.8247,"speechRate":1.389,"hasEvents":false,"sentence_source":"》。","sentence_en":"."},{"id":"369","start":2470.59,"end":2472.23,"displayStart":2470.59,"displayEnd":2472.23,"displayMid":2471.41,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":1.28069,"pitch":16.802259,"speechRate":6.02,"hasEvents":false,"sentence_source":"它是一个含义美国人。","sentence_en":"It's by a Korean American author."},{"id":"370","start":2472.23,"end":2478.49,"displayStart":2472.23,"displayEnd":2478.49,"displayMid":2475.3599999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":1.078488,"pitch":22.125738,"speechRate":5.212,"hasEvents":false,"sentence_source":"然后它也是从小长大在英文，可能有妈妈的英文，也是语法错误 无限多的这种。","sentence_en":"She also grew up with English that maybe had grammar errors from her mother."},{"id":"371","start":2478.49,"end":2491.07,"displayStart":2478.49,"displayEnd":2491.07,"displayMid":2484.7799999999997,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.951922,"pitch":21.51211,"speechRate":4.473,"hasEvents":false,"sentence_source":"然后它的那个书里面有一句话，让我感触特别特别的深，就它说糟糕的英语，曾经是一种词乳的来源，但现在我自豪的说，它是我的传统。","sentence_en":"There's one sentence in that book that deeply moved me: 'Bad English was once a source of shame, but now I proudly say it's my heritage."},{"id":"372","start":2491.07,"end":2504.31,"displayStart":2491.07,"displayEnd":2504.31,"displayMid":2497.69,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Negative","score":-0.5,"loudness":0.800884,"pitch":20.940823,"speechRate":4.285,"hasEvents":false,"sentence_source":"他者话英语 就是不是一个英语为母语的人去说英语，让人听到编织在英语中的帝国主义权利，把英语切开 让他黑暗的历史滑落出来。","sentence_en":"Other-tongued English'—when non-native speakers speak English, it exposes the imperial power woven into English, cutting it open and letting its dark history spill out."},{"id":"373","start":2504.31,"end":2505.69,"displayStart":2504.31,"displayEnd":2505.69,"displayMid":2505,"speaker":"Yuan Yuan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Language, Confidence, and Academic Expression","sentiment_en":"Neutral","score":0,"loudness":0.941057,"pitch":30.881199,"spe
