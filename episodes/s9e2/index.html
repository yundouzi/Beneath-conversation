赛车手吗。","sentence_en":"When he was very young, he didn't know what they were and would play with them as toys. When he got older, I told him, 'These are your grandpa's, these are mommy's trophies, and some race photos.' Sometimes he would ask me, 'Mom, are you really a racer?"},{"id":"38","start":331.8,"end":344.18,"displayStart":331.8,"displayEnd":344.18,"displayMid":337.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":1.054085,"pitch":21.850489,"speechRate":4.746,"hasEvents":false,"sentence_source":"中间其实没有机会让他看到我真正参加比赛，军队猛的时候，是他能够看到妈妈在冲一些非常高的沙坡，骑一些刀锋过一些难度很高的障碍。","sentence_en":"Actually, there was no chance for him to see me compete. During the rally raid, he could see mommy charging up very high sand dunes, riding knife edges, and crossing difficult obstacles."},{"id":"39","start":344.18,"end":351.86,"displayStart":344.18,"displayEnd":351.86,"displayMid":348.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.000596,"pitch":20.039003,"speechRate":5.688,"hasEvents":false,"sentence_source":"那么他会觉得 哇 原来我妈妈这么厉害，这是他最直观的感受，这也是我最希望他能够看到我不同的一面。","sentence_en":"Then he would think, 'Wow, my mom is this amazing!' That was his most direct impression, and that's exactly the different side of me I most wanted him to see."},{"id":"40","start":351.86,"end":355.22,"displayStart":351.86,"displayEnd":355.22,"displayMid":353.54,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.861511,"pitch":27.156143,"speechRate":5.872,"hasEvents":false,"sentence_source":"那在这一次之前你有多久没碰过赛车了。","sentence_en":"Before this, how long had it been since you last drove a race car?"},{"id":"41","start":355.22,"end":357.04,"displayStart":355.22,"displayEnd":357.04,"displayMid":356.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.803994,"pitch":13.032416,"speechRate":2.747,"hasEvents":false,"sentence_source":"至少有八年。","sentence_en":"At least eight years."},{"id":"42","start":357.04,"end":362.44,"displayStart":357.04,"displayEnd":362.44,"displayMid":359.74,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.933366,"pitch":27.24831,"speechRate":5.611,"hasEvents":false,"sentence_source":"所以开赛车这件事情，他是不会因为时间长了没开而变得手生了吗?","sentence_en":"So for driving a race car, does the skill not get rusty even after a long time without driving?"},{"id":"43","start":362.76,"end":373.58,"displayStart":362.76,"displayEnd":373.58,"displayMid":368.16999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Positive","score":0.6,"loudness":1.004927,"pitch":20.547644,"speechRate":5.288,"hasEvents":false,"sentence_source":"不会 我觉得这个应该是变成了一种肌肉记忆，不同的赛车如果让我来开可能15秒钟，最多一分钟我就完全找到这种感觉了，心跳会加速。","sentence_en":"No, I think it becomes muscle memory. If I were to drive a different race car, I'd find that feeling within 15 seconds, at most a minute. My heartbeat would speed up."},{"id":"44","start":373.58,"end":376.78,"displayStart":373.58,"displayEnd":376.78,"displayMid":375.17999999999995,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Positive","score":0.5,"loudness":0.906524,"pitch":16.987671,"speechRate":5.329,"hasEvents":false,"sentence_source":"但是一旦车轮转起来那种感觉就回来了。","sentence_en":"But once the wheels start turning, that feeling comes back."},{"id":"45","start":376.78,"end":385.88,"displayStart":376.78,"displayEnd":385.88,"displayMid":381.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.944978,"pitch":17.393675,"speechRate":5.405,"hasEvents":true,"sentence_source":"那种底气和自信，就是你能够感觉到你在掌控这台赛车，好像突然间回到了我以前，感觉自己好像年轻了很多岁一样。","sentence_en":"That sense of confidence—you feel in control of the race car. It's like suddenly I'm back to my old self, feeling many years younger."},{"id":"46","start":386.66,"end":393.62,"displayStart":386.66,"displayEnd":393.62,"displayMid":390.14,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.963731,"pitch":23.457899,"speechRate":4.885,"hasEvents":true,"sentence_source":"这八年你碰到跟赛车相关的新闻，体育赛事的转播或者电影，你会不会刻意的躲开。","sentence_en":"In these eight years, when you encounter racing news, sports event broadcasts, or movies, would you deliberately avoid them?"},{"id":"47","start":394.06,"end":409.16,"displayStart":394.06,"displayEnd":409.16,"displayMid":401.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":1.080913,"pitch":20.694571,"speechRate":4.73,"hasEvents":true,"sentence_source":"开始我是会躲开的，我会故意屏蔽掉一些消息，还有群里发的比如说像世界拉力锦标赛的一些片段，赛车圈里面的朋友给我发来的新闻，包括一些邀请，我都会刻意的去回避。","sentence_en":"At first, I did. I'd actively block out messages—clips from the World Rally Championship in group chats, news from racing friends, even invitations—I'd deliberately stay away."},{"id":"48","start":409.16,"end":423.22,"displayStart":409.16,"displayEnd":423.22,"displayMid":416.19000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.927342,"pitch":19.623575,"speechRate":4.836,"hasEvents":false,"sentence_source":"因为我从开始决定不再参加比赛之后，我是有一种挫败感的，就是我觉得我好像自身的一些原因或者是时代的变化，导致我不如从前了 我不能像以前那样如鱼得水。","sentence_en":"After I decided to stop competing, I felt a sense of failure. Like it was my own fault or times had changed, and I wasn't as good as before—I couldn't handle it like I used to."},{"id":"49","start":423.22,"end":436.6,"displayStart":423.22,"displayEnd":436.6,"displayMid":429.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.6,"loudness":0.959993,"pitch":18.434332,"speechRate":5.01,"hasEvents":false,"sentence_source":"我到了28岁、27岁 我要结婚 我要生子，孩子出生之后 可能我不是说母性特别强那种女人一开始，觉得啊 我怎么突然间有了个孩子 带着她 我什么都不能做。","sentence_en":"At 27 or 28, I got married, had a child. After the baby came, I wasn't the super maternal type at first. I thought, 'How did I suddenly have a kid? I can't do anything with her."},{"id":"50","start":436.6,"end":450.82,"displayStart":436.6,"displayEnd":450.82,"displayMid":443.71000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.916079,"pitch":16.843145,"speechRate":5.204,"hasEvents":false,"sentence_source":"我想去参加比赛 我想去自由地跑 我去不了，现实会把我拉回来，我就会有一种气泪或者是一种刻意的逃避，我不愿再听这些消息，好像这些消息跟我没关系，如果我看了就会刺痛我。","sentence_en":"I wanted to compete, to run freely, but I couldn't. Reality pulled me back, so I felt frustrated and deliberately avoided it. I didn't want to hear that news—it felt irrelevant, and if I saw it, it stung."},{"id":"51","start":450.82,"end":453.24,"displayStart":450.82,"displayEnd":453.24,"displayMid":452.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.209056,"pitch":20.0154,"speechRate":6.619,"hasEvents":false,"sentence_source":"让我很难受 我想去 但是我去不了。","sentence_en":"It hurt. I wanted to go, but I couldn't."},{"id":"52","start":453.24,"end":457.34,"displayStart":453.24,"displayEnd":457.34,"displayMid":455.28999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.4,"loudness":0.863625,"pitch":17.324608,"speechRate":4.657,"hasEvents":false,"sentence_source":"所以说头几年我是会刻意的去回避这些消息。","sentence_en":"So for the first few years, I deliberately avoided that stuff."},{"id":"53","start":457.34,"end":458.88,"displayStart":457.34,"displayEnd":458.88,"displayMid":458.11,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.883902,"pitch":26.299734,"speechRate":6.061,"hasEvents":false,"sentence_source":"这其实挺矛盾的。","sentence_en":"It's pretty contradictory."},{"id":"54","start":458.88,"end":465.68,"displayStart":458.88,"displayEnd":465.68,"displayMid":462.28,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.771033,"pitch":23.28443,"speechRate":6.138,"hasEvents":false,"sentence_source":"因为是你主动做出这个选择，但当你做出这个选择之后，你就不甘心这个选择，人好像就是这样矛盾。","sentence_en":"Because you made the choice yourself, but after making it, you resent it. People are just contradictory like that."},{"id":"55","start":465.68,"end":481.12,"displayStart":465.68,"displayEnd":481.12,"displayMid":473.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Positive","score":0.6,"loudness":0.915952,"pitch":17.221485,"speechRate":4.793,"hasEvents":false,"sentence_source":"对 是到后面就好了，首先你要接受这个现实，他也是我以前里面非常宝贵的一些经验，还有非常精彩的故事，可以把它埋在心底，将来等到孩子长大了，可以讲给他们听，你体内关于赛。","sentence_en":"Yeah, it got better later. First, you have to accept it. Those are precious experiences and great stories from my past—I can bury them deep, and when my kids grow up, I'll tell them. Inside me, racing..."},{"id":"56","start":481.12,"end":482.58,"displayStart":481.12,"displayEnd":482.58,"displayMid":481.85,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.903224,"pitch":27.152779,"speechRate":5,"hasEvents":false,"sentence_source":"车相关的记忆。","sentence_en":"Memories related to racing."},{"id":"57","start":482.58,"end":485.4,"displayStart":482.58,"displayEnd":485.4,"displayMid":483.99,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":1.143925,"pitch":27.726206,"speechRate":7.615,"hasEvents":false,"sentence_source":"那个热爱其实一直埋在身体很深的那个地方。","sentence_en":"That passion has always been buried deep inside me."},{"id":"58","start":485.4,"end":498.32,"displayStart":485.4,"displayEnd":498.32,"displayMid":491.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.06005,"pitch":20.806923,"speechRate":4.882,"hasEvents":false,"sentence_source":"对 甚至后面看到一些精彩的片段，国内的 国外的比赛，一些漂亮的过湾，我心里依然会心头一颤，好像我在里面开一样，特别的激动 身上线素就起来了。","sentence_en":"Yeah, even later, when I see exciting clips—domestic or international races, beautiful turns—my heart skips a beat. It's like I'm driving myself. I get so excited I get goosebumps."},{"id":"59","start":498.32,"end":505,"displayStart":498.32,"displayEnd":505,"displayMid":501.65999999999997,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dre Start":958.78,"displayEnd":960.58,"displayMid":959.6800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.03537,"pitch":20.724291,"speechRate":5.587,"hasEvents":false,"sentence_source":"因为它被方向盘卡住了。","sentence_en":"Because he was pinned by the steering wheel."},{"id":"129","start":960.58,"end":973.8,"displayStart":960.58,"displayEnd":973.8,"displayMid":967.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.042361,"pitch":22.274612,"speechRate":5.382,"hasEvents":false,"sentence_source":"我们三个人就从前挡风玻璃里面飞出去了，大概飞了十几米，就在飞出去那一瞬间，我的膝盖上的肉被那些碎掉的玻璃划开了，当时我甩出去之后 我就一瞬间站起来了。","sentence_en":"We three flew out the windshield about ten meters. As I flew out, the glass sliced open my knee. When I was thrown out, I stood up immediately."},{"id":"130","start":973.8,"end":988.42,"displayStart":973.8,"displayEnd":988.42,"displayMid":981.1099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Strongly Negative","score":-0.95,"loudness":0.917369,"pitch":15.885686,"speechRate":5.071,"hasEvents":false,"sentence_source":"往我的腿上看 发现我的腿露着白骨，里面的一层一层的肉都看得很清楚，又往其他方向看，就看到我的伯伯还有我的姨父都躺在地上，我自己身上白色的裙子上面全都是红色的。","sentence_en":"I looked down at my leg and saw my bone exposed, the layers of flesh clearly visible. Then I looked around and saw my uncle and my brother-in-law lying on the ground. My white dress was covered in red."},{"id":"131","start":988.42,"end":1002.24,"displayStart":988.42,"displayEnd":1002.24,"displayMid":995.3299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.951876,"pitch":20.483387,"speechRate":5.179,"hasEvents":false,"sentence_source":"身上全部的血都是从头上留下来的，看什么东西都是红色的，附近也没有城镇，后来就有一对不认识的夫妻，看到了我们发生车祸了，就把我拉到车上，当时我妈妈在后左左。","sentence_en":"All the blood on my body was from my head. Everything looked red. There were no towns nearby. Then a strange couple saw the accident and pulled me into their car. My mom was in the back seat."},{"id":"132","start":1002.24,"end":1010.76,"displayStart":1002.24,"displayEnd":1010.76,"displayMid":1006.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.06533,"pitch":20.13369,"speechRate":5.751,"hasEvents":false,"sentence_source":"她还以为有人这个时候要抢孩子，她就疯狂地跑下来，追这个夫妻开的三轮摩托车，追上之后就把我妈妈也放到车上说。","sentence_en":"She thought someone was trying to snatch a child, so she ran down frantically, chased the couple's three-wheeled motorcycle. When she caught up, they put her in the car and said,"},{"id":"133","start":1010.76,"end":1012.62,"displayStart":1010.76,"displayEnd":1012.62,"displayMid":1011.69,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.963794,"pitch":20.884197,"speechRate":5.914,"hasEvents":false,"sentence_source":"我们这附近有一个卫生院。","sentence_en":"There's a clinic near here."},{"id":"134","start":1012.62,"end":1026.38,"displayStart":1012.62,"displayEnd":1026.38,"displayMid":1019.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.960869,"pitch":20.082832,"speechRate":5.16,"hasEvents":false,"sentence_source":"我们知道在哪儿 然后先救孩子，后来就把我和我妈妈送到卫生院，当时那个卫生院的条件很简陋，它只有一个缝针的弯头针和那种透明的线，没有麻药 我就坐在医院的床上。","sentence_en":"We know where it is. Let's save the child first.' Then they took me and my mom to the clinic. It was very basic—only a curved needle for stitching and transparent thread. No anesthesia. I sat on the hospital bed."},{"id":"135","start":1026.38,"end":1037.38,"displayStart":1026.38,"displayEnd":1037.38,"displayMid":1031.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.833043,"pitch":14.800517,"speechRate":4.493,"hasEvents":false,"sentence_source":"看着它拿着镊子 加着针头帮我缝针，就是生缝 没有麻药，全程我都是自己在看着 很惊醒，头上也缝了四针嘛 有一个伤疤。","sentence_en":"I watched them use tweezers to hold the needle and stitch me up—raw stitching, no anesthesia. I watched the whole thing, very alert. I also got four stitches on my head, leaving a scar."},{"id":"136","start":1037.38,"end":1045.6,"displayStart":1037.38,"displayEnd":1045.6,"displayMid":1041.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.95494,"pitch":19.687052,"speechRate":5.528,"hasEvents":false,"sentence_source":"那个事情其实后来给我心里造成的阴影也是非常大的，很多年我也会经常做梦或者是想到飞出去的一瞬间。","sentence_en":"That incident left a huge psychological shadow on me. For many years, I often dreamed or thought about the moment I flew out."},{"id":"137","start":1045.6,"end":1058.64,"displayStart":1045.6,"displayEnd":1058.64,"displayMid":1052.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.7,"loudness":0.984205,"pitch":18.828873,"speechRate":5.459,"hasEvents":false,"sentence_source":"但是后来因为我自己会开车以后慢慢慢慢我克服了这个心理阴影，到十几岁的时候我就想我一定要学会开车，我要把车开好，我不希望我身边的人再出现这样的事情。","sentence_en":"But later, after I learned to drive, I gradually overcame that shadow. By my teens, I thought I must learn to drive and drive well. I didn't want people around me to go through something like that."},{"id":"138","start":1058.64,"end":1062.6,"displayStart":1058.64,"displayEnd":1062.6,"displayMid":1060.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":0.778273,"pitch":11.684949,"speechRate":4.293,"hasEvents":false,"sentence_source":"我一定要把车开得很熟练 保证很安全感。","sentence_en":"I had to drive very proficiently to feel secure."},{"id":"139","start":1062.6,"end":1070.5,"displayStart":1062.6,"displayEnd":1070.5,"displayMid":1066.55,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.7,"loudness":0.981742,"pitch":23.236929,"speechRate":5.57,"hasEvents":true,"sentence_source":"觉那是老天给你一次的小小的尝试，给你一次警醒和一个试验，你通过了这个试验 那么小的孩子 那么淡定。","sentence_en":"I feel it was a small test from heaven—a warning and a trial. You passed that trial. Such a young child, so calm."},{"id":"140","start":1070.88,"end":1076.92,"displayStart":1070.88,"displayEnd":1076.92,"displayMid":1073.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.045753,"pitch":24.192154,"speechRate":5.912,"hasEvents":true,"sentence_source":"而且我事后还能把这些事情叙述得很细致，就是发生了什么事情 可能大家都是蒙的。","sentence_en":"And afterward, I could recount the details very clearly. Everyone else was probably in shock."},{"id":"141","start":1076.92,"end":1086.2,"displayStart":1076.92,"displayEnd":1086.2,"displayMid":1081.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.923862,"pitch":19.00238,"speechRate":5.055,"hasEvents":false,"sentence_source":"但是我一个孩子 当警察叔叔来找我的时候，我还能把这些事情叙述得很到位，听说你是一摸方向盘就会开车了。","sentence_en":"But me, a child, when the police came to ask me, I could still describe it accurately. I heard that as soon as you touched the steering wheel, you could drive."},{"id":"142","start":1086.2,"end":1100.58,"displayStart":1086.2,"displayEnd":1100.58,"displayMid":1093.3899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.996913,"pitch":17.881485,"speechRate":5.219,"hasEvents":false,"sentence_source":"对 那个时候大概13、14岁吧，家里面有两台车 然后我父亲出差了，当时放学回来早嘛 有时候觉得无聊，看到一进门的鞋架上挂了一串钥匙，我就想 我不了 我是不是可以做点事情。","sentence_en":"Yeah, I was about 13 or 14. We had two cars at home, and my dad was on a business trip. I came home early from school and sometimes felt bored. I saw a set of keys hanging on the shoe rack by the door. I thought, 'I'm bored, maybe I can do something."},{"id":"143","start":1100.58,"end":1108.86,"displayStart":1100.58,"displayEnd":1108.86,"displayMid":1104.7199999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.024515,"pitch":17.302183,"speechRate":4.831,"hasEvents":false,"sentence_source":"我就拿着这个钥匙下去找到那台车，我就开了 当时个子还小一点，我就拿了一个靠垫垫在座椅上。","sentence_en":"So I took the keys, went down, found the car, and drove it. I was still a bit short, so I used a cushion on the seat."},{"id":"144","start":1108.86,"end":1123.04,"displayStart":1108.86,"displayEnd":1123.04,"displayMid":1115.9499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":1.022124,"pitch":17.86688,"speechRate":5.112,"hasEvents":false,"sentence_source":"因为我经常看我爸 那时候还都是手动挡车，挂挡的时候要踩离合 怎么做怎么做 我见的太多了，我就回忆那些动作照着去做 结果真的把车开走了，后面几天 每天开着车上学。","sentence_en":"Because I often watched my dad—cars were all manual then, shifting required pressing the clutch, all that. I had seen it so many times. I recalled those actions and copied them, and I actually drove the car away. For the next few days, I drove to school every day."},{"id":"145","start":1123.04,"end":1129.66,"displayStart":1123.04,"displayEnd":1129.66,"displayMid":1126.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.941342,"pitch":17.914858,"speechRate":5.891,"hasEvents":false,"sentence_source":"到学校门口大概两三百米的时候，我把车藏在路边去上学去了，放学之后我又自己开着车回家。","sentence_en":"When I was about two or three hundred meters from the school gate, I hid the car by the roadside and went to class. After school, I drove myself home."},{"id":"146","start":1129.66,"end":1136.78,"displayStart":1129.66,"displayEnd":1136.78,"displayMid":1133.22,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.967429,"pitch":24.161465,"speechRate":6.07,"hasEvents":false,"sentence_source":"你没有被人发现，包括被路上的警察发现，这是个小女孩在开车，哪怕你十三四岁可能个已经很高了。","sentence_en":"You weren't discovered, not even by police on the road—that a little girl was driving. Even at thirteen or fourteen, you might have been tall."},{"id":"147","start":1136.78,"end":1139.68,"displayStart":1136.78,"displayEnd":1139.68,"displayMid":1138.23,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.838282,"pitch":23.319221,"speechRate":6.597,"hasEvents":false,"sentence_source":"但是没有人看到这个人很可疑，可能不够年纪。","sentence_en":"But no one saw this person as suspicious, maybe because she was underage."},{"id":"148","start":1139.68,"end":1144.74,"displayStart":1139.68,"displayEnd":1144.74,"displayMid":1142.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.994213,"pitch":19.053078,"speechRate":4.743,"hasEvents":false,"sentence_source":"没有 因为当时大街上汽车都很少，也没有见过有警察叔叔。","sentence_en":"No, because there were very few cars on the streets back then, and I never saw any police off ，你被选上了，他说你有机会调离这里，到市区去拿行的总部工作，我说领导您别给我开玩笑，他说我没给你开玩笑，我真的掉过去了。","sentence_en":"our supervisor said, 'Hey, you got selected. You have a chance to transfer out of here and work at the head office in the city.' I said, 'Boss, don't joke with me.' He said he wasn't joking. I actually got transferred."},{"id":"199","start":1528.98,"end":1533.52,"displayStart":1528.98,"displayEnd":1533.52,"displayMid":1531.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Career Experience and Life Choices","sentiment_en":"Positive","score":0.6,"loudness":0.927319,"pitch":21.541607,"speechRate":5.386,"hasEvents":false,"sentence_source":"我就在广州市区租了一套房子，不用很辛苦的走来走去。","sentence_en":"I rented an apartment in downtown Guangzhou, and I didn't have to run around so much anymore."},{"id":"200","start":1533.52,"end":1537.08,"displayStart":1533.52,"displayEnd":1537.08,"displayMid":1535.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Career Experience and Life Choices","sentiment_en":"Positive","score":0.5,"loudness":0.846867,"pitch":18.321426,"speechRate":4.213,"hasEvents":false,"sentence_source":"其实我也挺珍惜我当时的那份工作。","sentence_en":"Actually, I really valued that job at the time."},{"id":"201","start":1537.08,"end":1539.64,"displayStart":1537.08,"displayEnd":1539.64,"displayMid":1538.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Career Experience and Life Choices","sentiment_en":"Positive","score":0.6,"loudness":0.875015,"pitch":15.248652,"speechRate":5.906,"hasEvents":false,"sentence_source":"因为再也不用像在机场那么辛苦了。","sentence_en":"Because I no longer had to work as hard as I did at the airport."},{"id":"202","start":1539.64,"end":1553.1,"displayStart":1539.64,"displayEnd":1553.1,"displayMid":1546.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Strongly Positive","sco ":18.67417,"speechRate":4.731,"hasEvents":false,"sentence_source":"那我本身就比较人高马大，胳膊也比较有力量，我跑起来可能会好很多，包括换轮胎什么的。","sentence_en":"But I'm tall and strong, with good arm strength, so I can manage much better, even with changing tires."},{"id":"241","start":1881.4,"end":1883.36,"displayStart":1881.4,"displayEnd":1883.36,"displayMid":1882.38,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.834718,"pitch":18.677769,"speechRate":7.046,"hasEvents":false,"sentence_source":"都跟男生差不多没有什么区别。","sentence_en":"No different from guys, pretty much the same."},{"id":"242","start":1883.36,"end":1888.34,"displayStart":1883.36,"displayEnd":1888.34,"displayMid":1885.85,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.139338,"pitch":22.030067,"speechRate":5.145,"hasEvents":false,"sentence_source":"所以在你看来大家都是赛车手，前面男赛车手和女赛车手。","sentence_en":"So in your view, everyone is a racer, whether male or female."},{"id":"243","start":1888.34,"end":1904.08,"displayStart":1888.34,"displayEnd":1904.08,"displayMid":1896.21,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.031632,"pitch":20.651747,"speechRate":4.956,"hasEvents":false,"sentence_source":"其实本质都是赛车手，但我记得那时候从我有印象开始，只要看到在赛车场上出现女孩，基本都是着装是一致的，很谨慎的 很漂亮的赛车服，基本都是长发 大长腿，拍照的时候姿势都是手插腰。","sentence_en":"In essence, they are all racers, but I remember from my earliest impressions, whenever I saw a girl on the racetrack, they were almost always dressed consistently: very neat and beautiful racing suits, mostly with long hair and long legs, posing with hands on hips for photos."},{"id":"244","start":1904.08,"end":1919.58,"displayStart":1904.08,"displayEnd":1919.58,"displayMid" 手，有机会聊天的时候 都会跟我讲。","sentence_en":"Because my father and some very experienced older drivers, when we get a chance to talk, always tell me:"},{"id":"248","start":1934.38,"end":1942.6,"displayStart":1934.38,"displayEnd":1942.6,"displayMid":1938.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Positive","score":0.6,"loudness":0.930471,"pitch":18.423822,"speechRate":4.841,"hasEvents":false,"sentence_source":"我们比赛只是为了享受过程 并不是为了拿成绩，你能全程参加完比赛 才是给你最大的收获。","sentence_en":"We race just to enjoy the process, not for results. Completing the whole race is the biggest reward."},{"id":"249","start":1942.6,"end":1956.86,"displayStart":1942.6,"displayEnd":1956.86,"displayMid":1949.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Positive","score":0.7,"loudness":0.945589,"pitch":19.999922,"speechRate":4.69,"hasEvents":false,"sentence_source":"所以当时一开始我就没想着我要拿什么名次，你必须要完整地感受这个比赛的过程，发车仪式的时候 媒体啊 摄像机啊 闪光灯，观众会特别的多 气氛特别的高。","sentence_en":"So from the start, I never thought about what place I would get. You have to fully experience the process. At the start ceremony, there are media, cameras, flashbulbs, lots of spectators, the atmosphere is electric."},{"id":"250","start":1956.86,"end":1959.04,"displayStart":1956.86,"displayEnd":1959.04,"displayMid":1957.9499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Positive","score":0.6,"loudness":0.908478,"pitch":19.336689,"speechRate":4.587,"hasEvents":false,"sentence_source":"大家都在欢呼 都在拍你。","sentence_en":"Everyone is cheering and photographing you."},{"id":"251","start":1959.04,"end":1970.92,"displayStart":1959.04,"displayEnd":1970.92,"displayMid":1964.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.5,"loudness":1.060826,"pitch":17.658281,"speechRate":4.561,"hasEvents":false,"sentence_source":"但是上收车台的时候 车至少会少掉一半，比如说车坏了 撞车了 退赛了，能参加收车仪式的车才是坚持到最后的，才是收获最大的。","sentence_en":"But when you get to the finish ceremony, at least half the cars are gone—broken, crashed, retired. The cars that make it to the finish ceremony are the ones that stuck it out to the end, and they're the ones who gain the most."},{"id":"252","start":1970.92,"end":1975.58,"displayStart":1970.92,"displayEnd":1975.58,"displayMid":1973.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Neutral","score":0,"loudness":0.861342,"pitch":17.610468,"speechRate":5.077,"hasEvents":false,"sentence_source":"所以说我在收车台上我觉得摆姿势也好，树大木纸也好。","sentence_en":"So whether I was posing or giving a thumbs up on the podium,"},{"id":"253","start":1975.58,"end":1978.18,"displayStart":1975.58,"displayEnd":1978.18,"displayMid":1976.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.7,"loudness":1.04604,"pitch":18.219521,"speechRate":5.295,"hasEvents":false,"sentence_source":"那个才是含尽量非常高的时刻。","sentence_en":"that was the moment with the highest value."},{"id":"254","start":1978.18,"end":1980.62,"displayStart":1978.18,"displayEnd":1980.62,"displayMid":1979.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.8,"loudness":0.987479,"pitch":15.589845,"speechRate":6.236,"hasEvents":false,"sentence_source":"那个才是我特别享受的一个过程。","sentence_en":"That was the process I particularly enjoyed."},{"id":"255","start":1980.62,"end":1982.52,"displayStart":1980.62,"displayEnd":1982.52,"displayMid":1981.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.8,"loudness":0.896395,"pitch":19.777674,"speechRate":5.351,"hasEvents":false,"sentence_source":"那几年是很快乐的。","sentence_en":"Those years were very happy."},{"id":"256","start":1982.52,"end":1988.12,"displayStart":1982.52,"displayEnd":1988.12,"displayMid":1985.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Neutral","score":0,"loudness":0.886624,"pitch":18.389612,"speechRate":3.656,"hasEvents":false,"sentence_source":"对 非常充实，能赚到钱吗，很少 投入的会更多一些。","sentence_en":"Yeah, very fulfilling. Could I make money? Hardly—I invested more."},{"id":"257","start":1988.12,"end":1992.54,"displayStart":1988.12,"displayEnd":1992.54,"displayMid":1990.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.5,"loudness":1.220008,"pitch":21.860182,"speechRate":4.589,"hasEvents":false,"sentence_source":"但是可能也激发了我想去做点生意，挣一些钱。","sentence_en":"But maybe it also sparked my desire to do some business and earn money."},{"id":"258","start":1992.54,"end":2005.74,"displayStart":1992.54,"displayEnd":2005.74,"displayMid":1999.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Motorsports and Event Operations","sentiment_en":"Positive","score":0.6,"loudness":0.973084,"pitch":19.551933,"speechRate":4.552,"hasEvents":false,"sentence_source":"然后自己去训练自己的动力，我会去做一些汽车配件，赛车配件，做一些二手整车 脚劲脑之 想尽办法，怎么能挣一些钱 然后我改台我自己的练习车。","sentence_en":"Then, to motivate my own training, I’d deal in car parts, racing parts, and used cars, racking my brains for any way to make some cash so I could modify my practice car."},{"id":"259","start":2005.74,"end":2008.96,"displayStart":2005.74,"displayEnd":2008.96,"displayMid":2007.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName": 2311.72,"displayStart":2303.28,"displayEnd":2311.72,"displayMid":2307.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":0.934269,"pitch":18.149754,"speechRate":5.288,"hasEvents":false,"sentence_source":"因为很多时候如果你达不到，要扯手的这个理想的状态 匹配的话，很多时候你会很难受，就是节奏完全不对。","sentence_en":"Because many times if you can't match the ideal state that the lead driver wants, it's very frustrating—the rhythm is completely off."},{"id":"301","start":2312.14,"end":2327.26,"displayStart":2312.14,"displayEnd":2327.26,"displayMid":2319.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.6,"loudness":0.919046,"pitch":17.335127,"speechRate":4.773,"hasEvents":false,"sentence_source":"但是我又想参与 又想跑好，又害怕跑不好，后面我就想 我的意义何在呢，我不能够把我想要发挥的东西发挥出来，不敢大胆的去做，就会有很多矛盾的地方，后来到合约结束之后。","sentence_en":"But I still want to participate and do well, yet I'm afraid of failing. Later I thought, what's the point? I can't express what I want; I dare not be bold. There are many contradictions. Then after the contract ended,"},{"id":"302","start":2327.26,"end":2332.02,"displayStart":2327.26,"displayEnd":2332.02,"displayMid":2329.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.84253,"pitch":17.505888,"speechRate":5.462,"hasEvents":false,"sentence_source":"我自己又去一个人的名义，或者是跟其他团队参加了一些比赛。","sentence_en":"I joined some races on my own or with other teams."},{"id":"303","start":2332.54,"end":2347.46,"displayStart":2332.54,"displayEnd":2347.46,"displayMid":2340,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Positive","score":0.7,"loudness":1.014479,"pitch":23 C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.900904,"pitch":18.113655,"speechRate":5.082,"hasEvents":false,"sentence_source":"对 当时我们连微信都没有，最早的时候都是QQ联系，包括现在的一些曝光都没有 非常少。","sentence_en":"Right, back then we didn't even have WeChat. We used QQ. There was very little exposure."},{"id":"308","start":2363.14,"end":2369.44,"displayStart":2363.14,"displayEnd":2369.44,"displayMid":2366.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.97799,"pitch":21.734577,"speechRate":6.309,"hasEvents":false,"sentence_source":"我们每到一个比赛的地方都会有很多人看，觉得 哎呀 竟然还有女生 大家都会觉得很稀罕。","sentence_en":"Every competition we went to, many would watch, surprised to see a girl. Everyone thought it was rare."},{"id":"309","start":2369.44,"end":2383.92,"displayStart":2369.44,"displayEnd":2383.92,"displayMid":2376.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Positive","score":0.4,"loudness":0.916167,"pitch":20.546947,"speechRate":5.565,"hasEvents":false,"sentence_source":"那个时候也都是觉得很好奇吧，哎 怎么会有女生去参加这些比赛，知道的人也并不多，当别人说 哎 居然还有女生在开赛车，你听到以后你心里感觉是小小的得意，一开始有一点 到后来就习惯了。","sentence_en":"People were curious—how could a girl compete? Not many knew. When someone said, 'Wow, a girl racer,' I felt a small sense of pride. At first, then I got used to it."},{"id":"310","start":2383.92,"end":2386.84,"displayStart":2383.92,"displayEnd":2386.84,"displayMid":2385.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Neutral","score":0,"loudness":1.061239,"pitch":18.260376,"speechRate":5.993,"hasEvents":false,"sentence_source":"会有人拿着手机怼着你拍 也就习惯了。","sentence_en":"People would shove their phones in your face to film. I got used to it."},{"id":"311","start":2 abel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Negative","score":-0.7,"loudness":0.764736,"pitch":18.544565,"speechRate":5.063,"hasEvents":false,"sentence_source":"那恐惧可能会陪伴你很久 驱之不去的。","sentence_en":"That fear might accompany you for a long time, hard to shake."},{"id":"316","start":2405.42,"end":2409.8,"displayStart":2405.42,"displayEnd":2409.8,"displayMid":2407.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.006724,"pitch":20.774057,"speechRate":5.366,"hasEvents":false,"sentence_source":"是 因为我太在意那场比赛 就是我把它看得非常重要。","sentence_en":"Yes, because I cared too much about that race—I saw it as extremely important."},{"id":"317","start":2409.8,"end":2415.7,"displayStart":2409.8,"displayEnd":2415.7,"displayMid":2412.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.027954,"pitch":21.815651,"speechRate":5.614,"hasEvents":false,"sentence_source":"那是哪一年的比赛，应该是07年的雅泰拉利赛，每年都会有一场雅泰拉利赛。","sentence_en":"Which year was that race? It should be the 2007 Yatai Rally. There is a Yatai Rally every year."},{"id":"318","start":2415.7,"end":2421.82,"displayStart":2415.7,"displayEnd":2421.82,"displayMid":2418.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.010875,"pitch":16.95225,"speechRate":5.392,"hasEvents":false,"sentence_source":"然后他的级别会比平时的要高一些，会有一些国外的赛车手一起过来参加比赛。","sentence_en":"The level is higher than usual, with some foreign racers coming to compete."},{"id":"319","start":2421.82,"end":2436.78,"displayStart":2421.82,"displayEnd":2436.78,"displayMid":2429.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.941375,"pitch":17.700672,"speechRate":5.231,"hasEvents":false,"sentence_source":"那韩金亮肯定也是不一样的，路也是难度非常高的，路况包括比赛的地方也都是挑战非常高的一个地方，我记得我的成绩还可以在我们的小组来说，后来因为我们每场比赛都有金国杯。","sentence_en":"Of course, Han Jinliang was different too. The roads were extremely difficult, and the conditions and venue were very challenging. I remember my performance was okay in our group. Later, because every race had a Gold National Cup,"},{"id":"320","start":2436.78,"end":2449.38,"displayStart":2436.78,"displayEnd":2449.38,"displayMid":2443.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":1.003144,"pitch":18.774305,"speechRate":4.683,"hasEvents":false,"sentence_source":"金国杯就是专门为女车手设立的奖杯，每一场比赛超过三台女子车组，这个金国杯就有效，就能出现，我记得那一年亚太应该是有五六个女车组。","sentence_en":"The Gold National Cup is a trophy specifically for female racers. If a race has more than three women's teams, the cup is valid and awarded. I recall that year in the Asia-Pacific, there were probably five or six women's teams."},{"id":"321","start":2449.38,"end":2463.22,"displayStart":2449.38,"displayEnd":2463.22,"displayMid":2456.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.992573,"pitch":18.681372,"speechRate":5.32,"hasEvents":false,"sentence_source":"因为她的路况特别不好，第一天第二天退赛的车很多，到我在第三天的时候，马上还有两个赛段就可以结束比赛了，记得车队那边告诉我一个信息，就说哎，现在所有的女车手。","sentence_en":"Because the road conditions were especially bad, many cars retired on the first and second days. On the third day, when I had just two stages left, the team told me: 'Hey, all the female racers,"},{"id":"322","start":2463.22,"end":2467.82,"displayStart":2463.22,"displayEnd":2467.82,"displayMid":2465.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Neutral","score":0,"loudness":0.908606,"pitch":16.965582,"speechRate":4.724,"hasEvents":false,"sentence_source":"除了你以外，已经全部退赛了，各种原因，说你稳住跑。","sentence_en":"Except for you, have all retired for various reasons.' They said, 'Just drive steady."},{"id":"323","start":2467.82,"end":2475.16,"displayStart":2467.82,"displayEnd":2475.16,"displayMid":2471.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Female Racers and Career Development","sentiment_en":"Positive","score":0.5,"loudness":0.90341,"pitch":15.581674,"speechRate":5.041,"hasEvents":false,"sentence_source":"我们能拿到一个稳稳的金国杯，车队那边给我的信息是这样的，我的领航告诉我这个消息。","sentence_en":"We can secure the Gold National Cup. That's what the team told me. My co-driver relayed this news."},{"id":"324","start":2475.16,"end":2488.76,"displayStart":2475.16,"displayEnd":2488.76,"displayMid":2481.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.854078,"pitch":13.936613,"speechRate":5.052,"hasEvents":false,"sentence_source":"我们马上就要已经54321开始进入这个赛段了，当时我就想，我不想只是拿一个经过备，我就跑得非常放得开，越跑越上头，我就想我一定要拿一个小组的名次后。","sentence_en":"We were about to start the countdown: 5, 4, 3, 2, 1, entering this stage. At that moment, I thought, I don't just want to finish; I drove very freely, getting more and more into it. I was determined to get a podium finish in my group."},{"id":"325","start":2488.76,"end":2490.9,"displayStart":2488.76,"displayEnd":2490.9,"displayMid":2489.83,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Neutral","score":0,"loudness":1.179649,"pitch":26.363605,"speechRate":4.206,"hasEvents":false,"sentence_source":"来就在盘山的一个左。","sentence_en":"Then, on a mountain road, a left turn."},{"id":"326","start":2490.9,"end":2494.58,"displayStart":2490.9,"displayEnd":2494.58,"displayMid":2492.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Neutral","score":0,"loudness":1.030229,"pitch":20.106512,"speechRate":3.533,"hasEvents":false,"sentence_source":"五的弯道，左边是山，右边是悬崖。","sentence_en":"A '5' turn, with a mountain on the left and a cliff on the right."},{"id":"327","start":2494.58,"end":2507.9,"displayStart":2494.58,"displayEnd":2507.9,"displayMid":2501.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Negative","score":-0.6,"loudness":0.915572,"pitch":17.386227,"speechRate":5.004,"hasEvents":false,"sentence_source":"因为我跑得太上头了，越跑节奏越快，就击到了一个点，速度太快了，收不住了 我的右后轮首先划到了悬崖边，后来整个车身拉不回来的情况下，跟着一起掉下去了。","sentence_en":"Because I was too into it, my pace got faster and faster until I hit a point where I was going too fast and couldn't slow down. My right rear wheel first slid to the edge of the cliff, and then, unable to pull the car back, the whole thing followed and fell off."},{"id":"328","start":2507.9,"end":2518.9,"displayStart":2507.9,"displayEnd":2518.9,"displayMid":2513.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Neutral","score":0,"loudness":0.966438,"pitch":19.497593,"speechRate":4.894,"hasEvents":false,"sentence_source":"那个悬崖是直上直下的，大概有七八米的样子，它属于一个垂直的状态，下面是45度的像腰粗一样的竹子，全部是斜插在山上。","sentence_en":"That cliff was sheer, about seven or eight meters, completely vertical. Below, there were bamboo trees as thick as a waist, slanting at 45 degrees all over the mountain."},{"id":"329","start":2518.9,"end":2532.02,"displayStart":2518.9,"displayEnd":2532.02,"displayMid":2525.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.85347,"pitch":16.745283,"speechRate":5.414,"hasEvents":false,"sentence_source":"我们的车滚下来之后，在那个竹林上大概翻了六个半轨，最后卡在那个竹子上面，没有继续往下掉，我第一反应万念俱回，就是我觉得 完了 完了 什么都没有 什么都拿不到。","sentence_en":"After our car rolled down, it flipped about six and a half rolls on the bamboo grove and finally got stuck in the bamboo, not falling further. My first reaction was utter despair, thinking 'It's over, it's over, nothing to gain."},{"id":"330","start":2532.02,"end":2536.54,"displayStart":2532.02,"displayEnd":2536.54,"displayMid":2534.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Neutral","score":0,"loudness":0.938636,"pitch":18.885782,"speechRate":5.088,"hasEvents":false,"sentence_source":"我的领航第一句话就是 我数了我们六个半鬼 回到宾馆。","sentence_en":"My co-driver's first words were: 'I counted six and a half rolls. Back at the hotel."},{"id":"331","start":2536.54,"end":2549.28,"displayStart":2536.54,"displayEnd":2549.28,"displayMid":2542.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Negative","score":-0.7,"loudness":0.836409,"pitch":17.182388,"speechRate":4.868,"hasEvents":false,"sentence_source":"因为多处的软组织磋商 就在宾馆躺了两天 几乎不能动，没有皮外伤 我就睁着眼睛反思了两天，我在回想这件事情 我觉得我真的想找个地缝钻进去。","sentence_en":"Because of multiple soft tissue injuries, I lay in the hotel for two days, barely able to move. No external wounds. I just lay there staring at the ceiling, reflecting. I felt like I wanted the ground to swallow me up."},{"id":"332","start":2549.28,"end":2552.8,"displayStart":2549.28,"displayEnd":2552.8,"displayMid":2551.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.879493,"pitch":15.941592,"speechRate":6.07,"hasEvents":false,"sentence_source":"我好像在这个世界上呆不下去了 就是那种感觉。","sentence_en":"I felt like I couldn't go on in this world anymore. That was the feeling."},{"id":"333","start":2552.8,"end":2562.94,"displayStart":2552.8,"displayEnd":2562.94,"displayMid":2557.87,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.934285,"pitch":25.423794,"speechRate":5.043,"hasEvents":false,"sentence_source":"你会觉得无言以对 但在我看来 这是一个，这个当然受伤 酿大事故很危险 让人有劫后余生的感觉，但那不应该是个应用时。","sentence_en":"You'd be speechless, but to me, this—of course getting hurt in a big accident is dangerous and gives you that survival feeling—but that's not the moment to dwell."},{"id":"334","start":2562.94,"end":2565.22,"displayStart":2562.94,"displayEnd":2565.22,"displayMid":2564.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.4,"loudness":0.787573,"pitch":21.68626,"speechRate":5.263,"hasEvents":false,"sentence_source":"刻吗 他怎么会是无言以对呢。","sentence_en":"A moment? How could he be speechless?"},{"id":"335","start":2565.22,"end":2579.06,"displayStart":2565.22,"displayEnd":2579.06,"displayMid":2572.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.01323,"pitch":20.444843,"speechRate":4.841,"hasEvents":false,"sentence_source":"那次比赛其实我父亲悄悄地去到了现场 我不知道，他在维修区附近找了一家宾馆 他在默默地关注，翻了车以后我才知道他来了 后来我两天可以起来活动的时候。","sentence_en":"In that race, my father quietly went to the scene without me knowing. He found a hotel near the pits and watched silently. I only found out he came after the crash. Later, when I could get up and move after two days,"},{"id":"336","start":2579.06,"end":2585.58,"displayStart":2579.06,"displayEnd":2585.58,"displayMid":2582.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Positive","score":0.6,"loudness":0.995032,"pitch":20.881767,"speechRate":5.061,"hasEvents":false,"sentence_source":"我爸爸就过来跟我说了几句话 他说你不要灰心，作为车手来说 翻车是很正常的。","sentence_en":"My father came over and said a few words. He said, don't lose heart. For a driver, rolling a car is normal."},{"id":"337","start":2585.58,"end":2594,"displayStart":2585.58,"displayEnd":2594,"displayMid":2589.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Positive","score":0.7,"loudness":0.873925,"pitch":17.682182,"speechRate":5.226,"hasEvents":false,"sentence_source":"因为你想突破自己 所以你才会有这种情况发生，突破自己是好事 所以说你不要把这个事过多的放在心上。","sentence_en":"Because you want to push yourself, that's why it happened. Pushing yourself is a good thing, so don't dwell on it too much."},{"id":"338","start":2594,"end":2608.98,"displayStart":2594,"displayEnd":2608.98,"displayMid":2601.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.8,"loudness":0.922165,"pitch":16.416218,"speechRate":5.007,"hasEvents":false,"sentence_source":"然后说完 他就背着他的双肩包 转身走了，就是我看着他的背影 我感觉我特别对不起他，让他很失望 本来一次很好的机会没有把握住，包括车队对我寄予的希望 我也没有好好把握住。","sentence_en":"Then after he said that, he turned around and walked away with his backpack. Watching his back, I felt so sorry for him, that I had let him down. I had missed a great opportunity, and I had also failed to live up to the team's expectations of me."},{"id":"339","start":2608.98,"end":2623.12,"displayStart":2608.98,"displayEnd":2623.12,"displayMid":2616.05,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.859531,"pitch":21.742399,"speechRate":5.56,"hasEvents":false,"sentence_source":"但那不是一个生死时刻吗 在我看来，而且你车被竹子卡住之后，你的第一反应是，糟糕 我什么都得不到了，而不是说 天呐，好像我差点离死亡那么近，没有一种长出一口气，我还活着的感觉。","sentence_en":"But wasn't that a life-or-death moment? To me, and when your car got stuck on bamboo, your first reaction was 'Oh no, I won't get anything,' not 'Oh my god, I almost died,' and no sigh of relief that you're alive."},{"id":"340","start":2623.12,"end":2627.54,"displayStart":2623.12,"displayEnd":2627.54,"displayMid":2625.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.045775,"pitch":21.871407,"speechRate":5.656,"hasEvents":false,"sentence_source":"很危险的一个事故吗，在我看来它不危险，可能在所有人看来。","sentence_en":"A very dangerous accident? To me it wasn't dangerous. Maybe to everyone else."},{"id":"341","start":2627.54,"end":2633,"displayStart":2627.54,"displayEnd":2633,"displayMid":2630.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.057631,"pitch":24.112728,"speechRate":6.777,"hasEvents":false,"sentence_source":"那场比赛 我的翻车是最严重的，作为会的工作人员也会问我，哎 你们人有没有事，我说没事。","sentence_en":"In that race, my roll was the worst. Even the staff asked me, 'Hey, are you okay?' I said I'm fine."},{"id":"342","start":2633,"end":2647.54,"displayStart":2633,"displayEnd":2647.54,"displayMid":2640.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.924756,"pitch":20.388145,"speechRate":5.261,"hasEvents":false,"sentence_source":"因为翻车的一瞬间，你的身体就好像麻木了一样，你感觉不到任何疼痛，也感觉不到任何不舒服，到事后慢慢慢慢地当身体平静下来，你才会有感觉，比如说脖子前胸后背不舒服腰不舒服。","sentence_en":"Because at the moment of the roll, your body goes numb. You feel no pain or discomfort. Only later, slowly, when your body calms down, do you feel it—like neck, chest, back, waist discomfort."},{"id":"343","start":2647.54,"end":2650.5,"displayStart":2647.54,"displayEnd":2650.5,"displayMid":2649.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.761962,"pitch":14.477247,"speechRate":6.137,"hasEvents":false,"sentence_source":"才会有这种感觉，当时是没有任何感觉的。","sentence_en":"Only then do you feel it. At the time, there was no feeling at all."},{"id":"344","start":2650.5,"end":2654.78,"displayStart":2650.5,"displayEnd":2654.78,"displayMid":2652.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.941591,"pitch":20.576801,"speechRate":4.932,"hasEvents":false,"sentence_source":"那不是一个其实很危险的情况，别人看来很危险。","sentence_en":"It wasn't really a dangerous situation, though others saw it as dangerous."},{"id":"345","start":2654.78,"end":2657.9,"displayStart":2654.78,"displayEnd":2657.9,"displayMid":2656.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.96014,"pitch":20.865995,"speechRate":6.397,"hasEvents":false,"sentence_source":"因为竹子没有插进车里，没有插进我们的身体。","sentence_en":"Because the bamboo didn't go into the car, didn't go into our bodies."},{"id":"346","start":2657.9,"end":2663.52,"displayStart":2657.9,"displayEnd":2663.52,"displayMid":2660.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.983666,"pitch":21.221336,"speechRate":6.015,"hasEvents":false,"sentence_source":"但是我当时就没有感觉到任何的危险，至少我们停住了，虽然我们翻下了悬崖。","sentence_en":"But I didn't feel any danger at the time. At least we stopped, even though we rolled off the cliff."},{"id":"347","start":2663.52,"end":2670.88,"displayStart":2663.52,"displayEnd":2670.88,"displayMid":2667.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":0.875115,"pitch":21.196192,"speechRate":5.163,"hasEvents":false,"sentence_source":"但是我们停在了一片竹林上面天呐，但那件事在你心里埋下了一个伏笔，或者是一个阴影 对。","sentence_en":"But we stopped on a bamboo grove. My god. But that incident left a seed, or a shadow, in your heart. Yes."},{"id":"348","start":2670.88,"end":2679.5,"displayStart":2670.88,"displayEnd":2679.5,"displayMid":2675.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.7,"loudness":0.867427,"pitch":20.368555,"speechRate":5.119,"hasEvents":false,"sentence_source":"那个恐惧是一直伴随着你的吗，人总是会后怕吗，很多年 不是后怕，我会梦魇，会梦到我翻车的瞬间无数次。","sentence_en":"Does that fear always stay with you? People always feel delayed fear? Many years - not after-fear. I had nightmares, dreaming of the moment I rolled over countless times."},{"id":"349","start":2679.5,"end":2680.52,"displayStart":2679.5,"displayEnd":2680.52,"displayMid":2680.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":0.730599,"pitch":14.670171,"speechRate":5.882,"hasEvents":false,"sentence_source":"然后我会惊醒。","sentence_en":"And then I would jolt awake."},{"id":"350","start":2680.52,"end":2684.46,"displayStart":2680.52,"displayEnd":2684.46,"displayMid":2682.49,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.807819,"pitch":29.267067,"speechRate":6.77,"hasEvents":false,"sentence_source":"那在梦中这个翻车的过程，像是电影当中的慢动作一样吗。","sentence_en":"In the dream, that rolling process, is it like a slow-motion scene in a movie?"},{"id":"351","start":2684.46,"end":2690.86,"displayStart":2684.46,"displayEnd":2690.86,"displayMid":2687.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.826568,"pitch":18.58584,"speechRate":5.032,"hasEvents":false,"sentence_source":"对 你会把它拆解成一个慢动作，翻车的时候可能就是两分钟，一分钟的样子。","sentence_en":"Yes. You break it down into slow motion. The roll itself might be two minutes, one minute."},{"id":"352","start":2690.86,"end":2693.56,"displayStart":2690.86,"displayEnd":2693.56,"displayMid":2692.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.875333,"pitch":22.385218,"speechRate":5.907,"hasEvents":false,"sentence_source":"但是你会把它拆解成无数个瞬间。","sentence_en":"But you break it down into countless moments."},{"id":"353","start":2693.56,"end":2706.52,"displayStart":2693.56,"displayEnd":2706.52,"displayMid":2700.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Negative","score":-0.6,"loudness":0.97223,"pitch":18.469975,"speechRate":5.594,"hasEvents":false,"sentence_source":"那些慢动作就深深的扎在我心里面，一直会去用眼睛专注于我翻了几个骨，我的什么东西飘起来了 甩出去了，我大概是在一个什么样的位置，都会是非常漫长的一个拆解过程。","sentence_en":"Those slow motions are deeply stuck in my mind. I keep focusing on how many rolls I did, what floated up and flew out, roughly what position I was in - it's a very long process of breaking down."},{"id":"354","start":2706.52,"end":2707.9,"displayStart":2706.52,"displayEnd":2707.9,"displayMid":2707.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":0.713809,"pitch":15.35867,"speechRate":6.364,"hasEvents":false,"sentence_source":"然后你就惊醒了。","sentence_en":"And then you jolt awake."},{"id":"355","start":2707.9,"end":2722.9,"displayStart":2707.9,"displayEnd":2722.9,"displayMid":2715.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.7,"loudness":0.978256,"pitch":19.525179,"speechRate":5.238,"hasEvents":false,"sentence_source":"那个事情好像成了一道过不去的红沟一样，事后我也想过，我怎么样能够调整自己的心态，把这个心理阴影给消灭掉但是，后面所有跑的比赛当中，我再也没有机会去改变我之前这种状态。","sentence_en":"That incident became like an uncrossable trench. Afterward, I thought about how to adjust my mindset and eliminate this psychological shadow. But in all the races after that, I never had a chance to change my previous state."},{"id":"356","start":2722.9,"end":2735.36,"displayStart":2722.9,"displayEnd":2735.36,"displayMid":2729.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.8,"loudness":0.940889,"pitch":18.67153,"speechRate":5.17,"hasEvents":false,"sentence_source":"想要赢回来一次，或者是想要自己把这个事情给跨过去，再也没有机会了，是因为总是会害怕同样事儿再发生，第一是害怕 会有担心 会有很多的心理负担。","sentence_en":"To win one back, or to get over it - there was never a chance. Because I was always afraid the same thing would happen again. First, fear, worry, a lot of psychological burden."},{"id":"357","start":2735.36,"end":2740.2,"displayStart":2735.36,"displayEnd":2740.2,"displayMid":2737.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":1.019031,"pitch":19.048239,"speechRate":5.424,"hasEvents":false,"sentence_source":"因为我没有按照车队给我的指示 没有按照要求 达到目的。","sentence_en":"Because I didn't follow the team's instructions or meet the requirements to achieve the goal."},{"id":"358","start":2740.2,"end":2752.6,"displayStart":2740.2,"displayEnd":2752.6,"displayMid":2746.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.7,"loudness":0.895169,"pitch":18.676456,"speechRate":4.836,"hasEvents":false,"sentence_source":"所以说我是很内疚 他们对我也是会有一些意见，到后面我真的很担心 担心车再出问题，担心我再把车碰坏了 撞坏了 担心车队再怎么怎么样了。","sentence_en":"So I felt guilty, and they had some opinions about me. Later, I was really worried—worried the car would have problems again, worried I'd damage or crash it again, worried about what would happen to the team."},{"id":"359","start":2752.6,"end":2754.76,"displayStart":2752.6,"displayEnd":2754.76,"displayMid":2753.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.5,"loudness":0.799408,"pitch":15.569663,"speechRate":6.944,"hasEvents":false,"sentence_source":"然后就会有很多的心理负担你知道。","sentence_en":"And then there was a lot of psychological burden, you know."},{"id":"360","start":2754.76,"end":2766.2,"displayStart":2754.76,"displayEnd":2766.2,"displayMid":2760.48,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.968218,"pitch":23.759281,"speechRate":5.594,"hasEvents":false,"sentence_source":"这一点是我们不从事赛车 想不到的，我会认为这车出事故了 在空中翻了好几圈，天呐 泄天泄地被竹子挡住 人没事 一点事都没有，我认为人没事 只有是全部。","sentence_en":"This is something you wouldn't think of if you weren't in racing. I thought: the car had an accident, flipped several times in the air, and was miraculously stopped by bamboo—no injuries at all. I thought being unharmed was everything."},{"id":"361","start":2766.2,"end":2769.86,"displayStart":2766.2,"displayEnd":2769.86,"displayMid":2768.0299999999997,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.075691,"pitch":22.921412,"speechRate":4.918,"hasEvents":false,"sentence_source":"但我没有想到在人没事之余 车也不能有事。","sentence_en":"But I didn't realize that besides being unharmed, the car also had to be okay."},{"id":"362","start":2769.86,"end":2777.4,"displayStart":2769.86,"displayEnd":2777.4,"displayMid":2773.63,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.007364,"pitch":22.618401,"speechRate":5.496,"hasEvents":false,"sentence_source":"因为车是你们宝贵的财富 为数不多的财富，如果车坏了 可能意味着 车队会损失掉很多未来的机会。","sentence_en":"Because the car is your precious asset, one of the few. If it's damaged, it might mean the team loses many future opportunities."},{"id":"363","start":2777.4,"end":2778.14,"displayStart":2777.4,"displayEnd":2778.14,"displayMid":2777.77,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":1.375465,"pitch":31.252268,"speechRate":7.813,"hasEvents":false,"sentence_source":"对别人可能。","sentence_en":"To others, maybe."},{"id":"364","start":2778.14,"end":2778.76,"displayStart":2778.14,"displayEnd":2778.76,"displayMid":2778.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Negative","score":-0.4,"loudness":1.033269,"pitch":21.540489,"speechRate":6.452,"hasEvents":false,"sentence_source":"也不公平。","sentence_en":"It's also unfair."},{"id":"365","start":2778.76,"end":2790.86,"displayStart":2778.76,"displayEnd":2790.86,"displayMid":2784.8100000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Neutral","score":0,"loudness":0.908172,"pitch":18.438507,"speechRate":4.786,"hasEvents":false,"sentence_source":"对 因为如果参加下一场比赛，你还要中间抓紧时间来抢修 更换一些东西 就是这种情况，后面有一些前辈会跟我说，你不要有这种心理负贪。","sentence_en":"Yes, because if you're entering the next race, you have to rush repairs and replacements in between. That's the situation. Later, some seniors told me not to have that psychological burden."},{"id":"366","start":2790.86,"end":2797.44,"displayStart":2790.86,"displayEnd":2797.44,"displayMid":2794.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Positive","score":0.5,"loudness":0.95441,"pitch":21.256598,"speechRate":5.167,"hasEvents":false,"sentence_source":"我们都是从翻车过来的，都会有那样的时期，证明你就是想突破自己，你不安于现状。","sentence_en":"We've all been through rollovers. Everyone has that period. It proves you want to push yourself and are not content with the status quo."},{"id":"367","start":2797.44,"end":2802.94,"displayStart":2797.44,"displayEnd":2802.94,"displayMid":2800.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Negative","score":-0.5,"loudness":0.892986,"pitch":17.724297,"speechRate":5.818,"hasEvents":false,"sentence_source":"所以说没有什么可丢人的，他们都还在安慰我，但这件事成立到你过不去的考。","sentence_en":"So there's nothing to be ashamed of. They were comforting me, but this incident became a hurdle I couldn't get past."},{"id":"368","start":2802.94,"end":2807.46,"displayStart":2802.94,"displayEnd":2807.46,"displayMid":2805.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Negative","score":-0.6,"loudness":1.007303,"pitch":19.267582,"speechRate":4.646,"hasEvents":false,"sentence_source":"对 然后后面也没有再有更好的机会，帮这件事翻篇。","sentence_en":"Yes, and later there was no better opportunity to turn the page on this."},{"id":"369","start":2807.46,"end":2812.02,"displaySt 为脚的 不能让你放开大胆的去做这些事情，如果是我自己的赛车 我自己来负担，可能我很快就会改变 就会有突破，之前每次有出问题或者是差点出问题的时候，你的胆量是不会变小的。","sentence_en":"Being constrained, you can't boldly do these things. If it were my own race car and I bore the costs myself, I might change quickly and make breakthroughs. Every time there was a problem or near miss, your courage doesn't diminish."},{"id":"373","start":2848.16,"end":2861.5,"displayStart":2848.16,"displayEnd":2861.5,"displayMid":2854.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Neutral","score":0,"loudness":0.930467,"pitch":19.263393,"speechRate":5.52,"hasEvents":false,"sentence_source":"但是如果说有受到一个很大的挫折，重创之后会有一段时间胆子特别小，不敢去轻易尝试，像我们平时培训的时候，比如说我们前面150米有一堵墙，从你的起点提速到100。","sentence_en":"But if you suffer a big setback or blow, there's a period where you become very timid and afraid to try. Like in our usual training, say there's a wall 150 meters ahead, you accelerate from the start to 100."},{"id":"374","start":2861.5,"end":2862.9,"displayStart":2861.5,"displayEnd":2862.9,"displayMid":2862.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career and Retirement Transition","sentiment_en":"Neutral","score":0,"loudness":1.019057,"pitch":19.345959,"speechRate":5.714,"hasEvents":false,"sentence_source":"旁边会有一个装桶。","sentence_en":"There's a cone on the side."},{"id":"375","start":2862.9,"end":2865.46,"displayStart":2862.9,"displayEnd":2865.46,"displayMid":2864.1800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Racing Accidents and Psychological Challenges","sentiment_en":"Neutral","score":0,"loudness":1.126296,"pitch":24.757956,"speechRate":6.089,"hasEvents":false,"sentence_source":"那个装桶就提示你你要刹车了。","sentence_en":"That cone signals you to brake."},{"id":"376","start":2865.46,"end":2871.88,"displayStart":2865.46,"displayEnd":2871.88,"displayMid":2868.67,"speaker":"Lu Yu","speakerColor":"#99 ompetitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.811664,"pitch":21.24721,"speechRate":5.753,"hasEvents":false,"sentence_source":"你看人生其实会有不同的支点，工作是一个支点，家庭是一个支点，孩子对很多父亲母亲来说也是一个支点，人生你总需要有一两个支点，人生才能过得下去，就怕什么支点都没有。","sentence_en":"You see, life has different pillars—work is one, family is one, and for many parents, children are also a pillar. You always need one or two pillars to get through life. What's scary is having no pillars at all."},{"id":"429","start":3238.84,"end":3251.06,"displayStart":3238.84,"displayEnd":3251.06,"displayMid":3244.95,"speaker":"Zhang Nuo","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.962156,"pitch":23.250648,"speechRate":5.401,"hasEvents":false,"sentence_source":"那些作为女性，我能够共情你在那时候的一个个人选择，你看到过你身边，现在有一个女赛车手，可以一边当妈妈，像你那样小孩很小，还可以去赛车，这样的人有吗。","sentence_en":"As a woman, I can empathize with your personal choice at that time. Have you seen around you now a female racer who can be a mother with a small child like yours and still race? Is there such a person?"},{"id":"430","start":3251.06,"end":3258.22,"displayStart":3251.06,"displayEnd":3258.22,"displayMid":3254.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Negative","score":-0.3,"loudness":0.866021,"pitch":18.541971,"speechRate":5.168,"hasEvents":false,"sentence_source":"可能性有吗，CRC比赛几乎每个月都有，一个月基本上有半个月都在外面跑，很少能坚固。","sentence_en":"Is it possible? CRC races happen almost every month, basically half the month on the road, hard to balance."},{"id":"431","start":3258.22,"end":3266.1,"displayStart":3258.22,"displayEnd":3266.1,"displayMid":3262.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Racing Experience and Competitive Dreams","sentiment_en":"Neutral","score":0,"loudness":0.959278,"pitch":21.174734,"speechRate":6.134,"hasEv sterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":1.049951,"pitch":19.299932,"speechRate":5.729,"hasEvents":false,"sentence_source":"在保证安全的情况下绕过所有的障碍，把我儿子安全地送到学校门口，好像每天早上我都在参加一场比赛。","sentence_en":"Safely navigate all obstacles and get my son to the school gate. It seems like I'm in a competition every morning."},{"id":"459","start":3449,"end":3454.74,"displayStart":3449,"displayEnd":3454.74,"displayMid":3451.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.5,"loudness":1.00666,"pitch":26.78553,"speechRate":6.066,"hasEvents":false,"sentence_source":"那个时候你过往的赛车技能对你能有什么帮助吗，帮助特别大，不是说速度多快。","sentence_en":"Does your past racing skills help then? A lot. Not about speed."},{"id":"460","start":3454.74,"end":3461.9,"displayStart":3454.74,"displayEnd":3461.9,"displayMid":3458.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.952854,"pitch":20.730921,"speechRate":5.168,"hasEvents":false,"sentence_source":"因为早上那个时间段根本就不可能，速度非常快，更多的是障碍，你需要用到更多的预见性。","sentence_en":"Because in the morning, you can't go fast. It's more about obstacles—you need more foresight."},{"id":"461","start":3461.9,"end":3466.94,"displayStart":3461.9,"displayEnd":3466.94,"displayMid":3464.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.944063,"pitch":20.921236,"speechRate":4.563,"hasEvents":false,"sentence_source":"因为很多骑电动汽车的骑自行车的家长，跪在车流里面。","sentence_en":"Because many parents on e-bikes or bicycles weave through traffic."},{"id":"462","start":3466.94,"end":3481.32,"displayStart":3466.94,"displayEnd":3481.32,"displayMid":3474.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Neutral","score":0,"loudness":0.96835,"pitch":21.449562,"speechRate":5.507,"hasEvents":false,"sentence_source":"因为大家送孩子那个时间都很紧张，都不愿意停下来，都不愿意刹车去让别人，他们就拐来拐去，不顾忌你后面有没有车，这个时候你就要把眼前所有的可能性，都模拟一遍 判断一遍，前面这个人。","sentence_en":"Because everyone is in a rush dropping off their kids, no one wants to stop or yield to others—they just weave around without caring if there’s a car behind you. At that moment, you have to simulate and judge every possibility ahead, like that person."},{"id":"463","start":3481.32,"end":3493.64,"displayStart":3481.32,"displayEnd":3493.64,"displayMid":3487.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.4,"loudness":0.915457,"pitch":17.477081,"speechRate":5.195,"hasEvents":false,"sentence_source":"他可能比如说要拐到中间来，或者他这个人要过马路，怎么样 很流畅的情况下，速度很快地把孩子送到学校，赛车的所有的技能放在此刻，有没有点大才小用。","sentence_en":"Maybe they’re about to cut into the middle, or someone’s crossing the street—smoothly and quickly getting the kid to school. Using all your racing skills right then, isn’t that overkill?"},{"id":"464","start":3493.64,"end":3506.96,"displayStart":3493.64,"displayEnd":3506.96,"displayMid":3500.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family and Childhood Growth","sentiment_en":"Positive","score":0.6,"loudness":1.0329,"pitch":21.915281,"speechRate":5.666,"hasEvents":false,"sentence_source":"我觉得挺有意思的，每天早上就好像在跟电瓶车斗志斗勇一样，觉得特别有趣，每天早上出门，有时候时间来不及了，头发都不梳，甚至脸都不洗，冬天的时候就穿着厚厚的睡衣开着车。","sentence_en":"I think it’s fun. Every morning it feels like a battle of wits with scooters. I find it really amusing. Sometimes when I’m running late, I don’t even comb my hair or wash my face. In winter, I’d drive in thick pajamas."},{"id":"465","start":3506.96,"end":3511,"displayStart":3506.96,"displayEnd":3511,"displayMid":3508.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1", _sentence_en":"It's different from having sponsors, manufacturers, and a big team behind you. Mentally, it's just different. And such opportunities are extremely rare—maybe one or two in a thousand can become a salaried driver."},{"id":"event-33","event_type":"coughing_speechbrain_filtered","event_type_en":"Cough","start":4541.5,"end":4543.5,"duration":2,"confidence":0.03726753,"displayTime":4542.5,"anchorSentenceId":"610","speaker":"Zhang Nuo","speakerColor":"#A29479","representative_sentence_source":"比如现在我就看到你穿了一个，男孩女孩都可以穿的套头的运动衫，比较中性。","representative_sentence_en":"For instance, right now I see you're wearing a unisex pullover sweatshirt, quite androgynous."},{"id":"event-34","event_type":"sneezing_speechbrain_filtered","event_type_en":"Sneeze","start":4542.5,"end":4545,"duration":2.5,"confidence":0.03480133,"displayTime":4543.75,"anchorSentenceId":"611","speaker":"Zhang Nuo","speakerColor":"#A29479","representative_sentence_source":"那你想到岩中花述这四个字，你的脑海中会有一幅画面吗，你可以把那幅画面给我描述一下。","representative_sentence_en":"When you think of the phrase 'a flower in the rock,' does an image come to mind? Can you describe it?"},{"id":"event-35","event_type":"sneezing_speechbrain_filtered","event_type_en":"Sneeze","start":4625,"end":4627,"duration":2,"confidence":0.03069468,"displayTime":4626,"anchorSentenceId":"623","speaker":"Lu Yu","speakerColor":"#995A91","representative_sentence_source":"但是通过这几个小时聊下来。","representative_sentence_en":"But after talking for these few hours,"},{"id":"event-36","event_type":"laughter_speechbrain_filtered","event_type_en":"Laughter","start":4714.5,"end":4717,"duration":2.5,"confidence":0.04221799,"displayTime":4715.75,"anchorSentenceId":"636","speaker":"Lu Yu","speakerColor":"#995A91","representative_sentence_source":"但是我依然觉得我是一个胜利者。","representative_sentence_en":"But I still felt like a winner."},{"id":"event-37","event_type":"laughter_speechbrain_filtered","event_type_en":"Laughter","start":4718,"end":4720,"duration":2,"confidence":0.04006467,"display
