ign Language Learning and Growth","sentiment_en":"Positive","score":0.5,"loudness":0.951641,"pitch":24.422922,"speechRate":5.427,"hasEvents":false,"sentence_source":"但是碰巧 我就是喜欢文科，我真的对李克没有兴趣 所以我不会认为这样的偏见对我内心会造成某种影响的伤害。","sentence_en":"But as it happens, I just liked liberal arts. I really had no interest in science, so I don't think such bias could hurt me inside."},{"id":"104","start":683.51,"end":690.91,"displayStart":683.51,"displayEnd":690.91,"displayMid":687.21,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Positive","score":0.5,"loudness":0.894764,"pitch":24.90131,"speechRate":4.459,"hasEvents":false,"sentence_source":"对的我，觉得也是因为可能我们从一开始都是对于自己的爱好和选择比较清晰。","sentence_en":"Yes, I think it's also because we were always clear about our own interests and choices."},{"id":"105","start":690.91,"end":705.79,"displayStart":690.91,"displayEnd":705.79,"displayMid":698.3499999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.943976,"pitch":23.415501,"speechRate":4.516,"hasEvents":false,"sentence_source":"所以碰磁一下现在比较火的话题 就是文科的就整体上的衰落不仅是在国内，而且是在全球领域的衰落嘛 其实我觉得一直到现在李克仍然是具有绝对的优势的。","sentence_en":"So let's touch on a hot topic now: the overall decline of liberal arts, not only domestically but globally. Actually, I think even now, science still has an absolute advantage."},{"id":"106","start":705.79,"end":721.33,"displayStart":705.79,"displayEnd":721.33,"displayMid":713.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.821152,"pitch":22.533764,"speechRate":4.651,"hasEvents":false,"sentence_source":"就是哪怕是从最使用的，就是你缺一个理科然后选专业的角度，是有极多的专业可以选，文科的专业它也可以选，理科的专业它，工科的专业，医学都可以选，但文科哪怕是我一个。","sentence_en":"Even from the most practical p 8,"end":1170.56,"displayStart":1159.28,"displayEnd":1170.56,"displayMid":1164.92,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Positive","score":0.5,"loudness":0.952806,"pitch":23.104622,"speechRate":5.23,"hasEvents":false,"sentence_source":"我记得我当时很小，先是看连环画版的《红楼梦》，后来看真正的那个草雪琴版的《红楼梦》，我才第一次感受到我说，哦 为什么林黛玉会吃醋 会不高兴。","sentence_en":"I remember when I was very young, I first read the comic version of Dream of the Red Chamber, then later the original by Cao Xueqin. That's when I first felt, oh, why is Lin Daiyu jealous and upset?"},{"id":"172","start":1170.56,"end":1180.66,"displayStart":1170.56,"displayEnd":1180.66,"displayMid":1175.6100000000001,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.868252,"pitch":22.977381,"speechRate":5.941,"hasEvents":false,"sentence_source":"就她那种心理的感受 在生活中你任何地方你是看不到的，你就很懵 她为什么不高兴，她怎么就跟甲宝玉不高兴，她为什么要跟雪宝差说那样的话。","sentence_en":"You couldn't see that kind of psychological feeling anywhere in real life. You'd be totally confused—why's she unhappy, why's she mad at Jia Baoyu, why did she say that to Xue Baochai?"},{"id":"173","start":1180.66,"end":1193.88,"displayStart":1180.66,"displayEnd":1193.88,"displayMid":1187.27,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.892002,"pitch":23.656214,"speechRate":5.446,"hasEvents":false,"sentence_source":"那种话貌似有一点点读舌，你慢慢的体会中很细微的属于人的感受，在我们当时只有从文学作品当中来，其他地方没有，包括当时看安图生童话 格林童话，如今看却都是挺暗黑。","sentence_en":"Those words were a bit sharp. Slowly, you grasp those very subtle human feelings—back then, we only got them from literature, nowhere else. Even Andersen's Fairy Tales and Grimm's Fairy Tales, looking back now, are pretty dark."},{"id":"174","start":11 ":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.646522,"pitch":31.638981,"speechRate":8,"hasEvents":false,"sentence_source":"对我没有做过研究。","sentence_en":"I haven't studied it."},{"id":"179","start":1212.38,"end":1219.14,"displayStart":1212.38,"displayEnd":1219.14,"displayMid":1215.7600000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.961579,"pitch":27.156151,"speechRate":5.547,"hasEvents":false,"sentence_source":"但是不是隔离童话那个时代，他对于小孩应该知道什么，或者应该拥有哪一类知识跟我们。","sentence_en":"But isn't it that in the era of fairy tales, what they thought kids should know or what kind of knowledge they should have was different from ours?"},{"id":"180","start":1219.14,"end":1225.78,"displayStart":1219.14,"displayEnd":1225.78,"displayMid":1222.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Foreign Language Learning and Growth","sentiment_en":"Neutral","score":0,"loudness":0.788968,"pitch":23.044497,"speechRate":4.151,"hasEvents":false,"sentence_source":"其实是有一些偏差的，如果是评一道比如说18、19世纪的英国。","sentence_en":"Actually, it's a bit off. If you look at, say, 18th or 19th century England,"},{"id":"181","start":1225.78,"end":1234.76,"displayStart":1225.78,"displayEnd":1234.76,"displayMid":1230.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Neutral","score":0,"loudness":0.883807,"pitch":23.908113,"speechRate":4.566,"hasEvents":false,"sentence_source":"那小孩就同工是遍地都在用，而且对于孩子是把他们当成小大人就mini adults来对待。","sentence_en":"child labor was everywhere, and kids were treated as mini adults."},{"id":"182","start":1234.76,"end":1238.32,"displayStart":1234.76,"displayEnd":1238.32,"displayMid":1236.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6"," rt":1273.2,"end":1288.46,"displayStart":1273.2,"displayEnd":1288.46,"displayMid":1280.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.855668,"pitch":23.97752,"speechRate":3.735,"hasEvents":false,"sentence_source":"然后这个死的时候29岁，就这种心智的也是因为在一个非常混乱的时代，逼着人强行让他尽早的成熟，尽早的不管是继承他的家业也好。","sentence_en":"and died at 29. That kind of mentality was also because of a very chaotic era, forcing people to mature early, whether to inherit the family business"},{"id":"187","start":1288.46,"end":1290.62,"displayStart":1288.46,"displayEnd":1290.62,"displayMid":1289.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.738094,"pitch":21.092445,"speechRate":5.093,"hasEvents":false,"sentence_source":"或者是这个子豹复仇也好。","sentence_en":"or to take revenge."},{"id":"188","start":1290.62,"end":1306.42,"displayStart":1290.62,"displayEnd":1306.42,"displayMid":1298.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Negative","score":-0.3,"loudness":0.875372,"pitch":23.789919,"speechRate":5.196,"hasEvents":true,"sentence_source":"其实人的心智是可以成熟的非常早的，而实际上我们现在是通过学校教育，各种各样实际上是人为的推迟了，人的一个成熟或者说把人的一个智性成熟，跟人的一个心理成熟之间的距离拉远了。","sentence_en":"Actually, a person's mind can mature very early. But now, through school education and various means, we are artificially delaying maturity, or rather widening the gap between intellectual maturity and psychological maturity."},{"id":"189","start":1306.92,"end":1308.9,"displayStart":1306.92,"displayEnd":1308.9,"displayMid":1307.91,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Neutral","score":0,"loudness":0.974048,"pitch":28.123598,"speechRate":9.404,"hasEvents":true,"sentence_source":"还有一点就是因为我们寿命延长了。","senten 性组成的。","sentence_en":"So looking back, much of my cultural nourishment in childhood and youth came from women."},{"id":"265","start":1837.12,"end":1851.72,"displayStart":1837.12,"displayEnd":1851.72,"displayMid":1844.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Positive","score":0.7,"loudness":0.876177,"pitch":24.788256,"speechRate":4.609,"hasEvents":false,"sentence_source":"真的很幸运，我其实比较认同《吾尔夫》说的那句话，就我们需要从女性上看到是真的女性，而不是说我们所给她强加的那些，比如说柔弱感性这些品质不是这样的。","sentence_en":"I'm really lucky. I agree with Woolf's statement that we need to see women as they truly are, not with the qualities we impose on them—like fragility or sensitivity."},{"id":"266","start":1851.72,"end":1866.4,"displayStart":1851.72,"displayEnd":1866.4,"displayMid":1859.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Positive","score":0.8,"loudness":0.869563,"pitch":23.594507,"speechRate":5.086,"hasEvents":false,"sentence_source":"而是女性她坦露出自身的那一刻是需要我们看见的，而我觉得其实我在这些女性作家当中看见的是那种属于女性本身的那种力，这个是打动我的 而这种力你可以说她是男性的。","sentence_en":"Instead, women's self-revelation needs to be seen. In these female authors, I saw a kind of strength that belongs to women themselves, which moved me. That strength could be called masculine."},{"id":"267","start":1866.4,"end":1872.68,"displayStart":1866.4,"displayEnd":1872.68,"displayMid":1869.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Positive","score":0.7,"loudness":0.854798,"pitch":22.107645,"speechRate":6.22,"hasEvents":true,"sentence_source":"你也可以说她是女性的，但她是一个人身上非常闪光的东西，恰巧在一个女性身上得到了坦露。","sentence_en":"You could say she is female, but she embodies something very brilliant in a person, which happens to be revealed in a woman."},{"id":"268","start":1873.7,"end":1881.5,"displayStart":1873.7,"displayEnd":1881.5,"displayMid":1877.6,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Neutral","score":0,"loudness":0.945006,"pitch":23.347555,"speechRate":5.145,"hasEvents":true,"sentence_source":"因为在我成长期间 我看了很多女性作家写的小说，后来其实被人有所 不能说够病 就大家会探讨。","sentence_en":"Because during my growing up, I read many novels written by female writers, which later were somewhat criticized, or at least discussed."},{"id":"269","start":1881.5,"end":1890.96,"displayStart":1881.5,"displayEnd":1890.96,"displayMid":1886.23,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Neutral","score":0,"loudness":0.842502,"pitch":24.645699,"speechRate":5.603,"hasEvents":false,"sentence_source":"因为他们认为当时女性作家开始就写一些个人私人领域的，私人情感 私人生活的 你会满足了大家某种的 你说是好奇或者亏私。","sentence_en":"Because people thought that when female writers started writing about personal realms—private emotions, private lives—they were satisfying some curiosity or voyeurism."},{"id":"270","start":1890.96,"end":1895.78,"displayStart":1890.96,"displayEnd":1895.78,"displayMid":1893.37,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Neutral","score":0,"loudness":1.058247,"pitch":26.092339,"speechRate":5.187,"hasEvents":false,"sentence_source":"然后大家会觉得 好像女性 你用这样的角度去书写女性本身。","sentence_en":"Then some said that by writing about women from that angle, you were giving up your power. Of course, others said you were reclaiming it."},{"id":"271","start":1895.78,"end":1904.84,"displayStart":1895.78,"displayEnd":1904.84,"displayMid":1900.31,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Reading in Girlhood","sentiment_en":"Positive","score":0.4,"loudness":0.921802,"pitch":24.889555,"speechRate":5.408,"hasEvents":false,"sentence_source":"其实你在放弃你的权利 当然也会有人说我在夺回我的权利，但不论怎样 他其实我依然认为他写出了某种女性的真实。","sentence_en":"But re re a great textual reference for understanding that era—the private spiritual history of the time."},{"id":"291","start":2061.14,"end":2068.54,"displayStart":2061.14,"displayEnd":2068.54,"displayMid":2064.84,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.103669,"pitch":23.395494,"speechRate":4.645,"hasEvents":false,"sentence_source":"是的，那你是从什么时候发现你可以要去尝试做一些，这种文学类的翻译的工作。","sentence_en":"Yes. When did you realize you could try doing literary translation?"},{"id":"292","start":2068.54,"end":2080.02,"displayStart":2068.54,"displayEnd":2080.02,"displayMid":2074.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.3,"loudness":0.776015,"pitch":24.322756,"speechRate":4.991,"hasEvents":false,"sentence_source":"其实我从本科就开始做翻译的工作，后来本科跟研究生的时候都还依过电影字幕，现在回想起来 我真的不敢去看我做的翻译的质量。","sentence_en":"I actually started translation work as an undergraduate. Later, during undergrad and grad school, I also translated film subtitles. Looking back, I dare not even look at the quality of my translations."},{"id":"293","start":2080.02,"end":2084.26,"displayStart":2080.02,"displayEnd":2084.26,"displayMid":2082.1400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.902584,"pitch":23.718672,"speechRate":4.481,"hasEvents":false,"sentence_source":"所以当时其实是在我真正开始译这本书之前。","sentence_en":"So before I actually started translating this book,"},{"id":"294","start":2084.26,"end":2091.72,"displayStart":2084.26,"displayEnd":2091.72,"displayMid":2087.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.855535,"pitch":23.090132,"speechRate":4.826,"ha s":0.640097,"pitch":24.603161,"speechRate":6.395,"hasEvents":false,"sentence_source":"因为我之前是读过很喜欢。","sentence_en":"Because I had read it before and really liked it."},{"id":"299","start":2113.8,"end":2116.04,"displayStart":2113.8,"displayEnd":2116.04,"displayMid":2114.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.861021,"pitch":20.04583,"speechRate":5.804,"hasEvents":false,"sentence_source":"所以当时知道它是一本后的书。","sentence_en":"So I knew it was a thick book."},{"id":"300","start":2116.04,"end":2118.12,"displayStart":2116.04,"displayEnd":2118.12,"displayMid":2117.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.143019,"pitch":31.195974,"speechRate":6.78,"hasEvents":false,"sentence_source":"但是因为做翻译都在电脑上。","sentence_en":"But since the translation was done on the computer,"},{"id":"301","start":2118.12,"end":2124.34,"displayStart":2118.12,"displayEnd":2124.34,"displayMid":2121.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.860145,"pitch":23.599646,"speechRate":4.662,"hasEvents":false,"sentence_source":"然后也没有概念 艳马对我来说只是一个数字，直到最后出了这个封面。","sentence_en":"I had no concept of it—page numbers were just numbers to me, until the cover came out."},{"id":"302","start":2124.34,"end":2133.96,"displayStart":2124.34,"displayEnd":2133.96,"displayMid":2129.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.813332,"pitch":19.163471,"speechRate":5.428,"hasEvents":false,"sentence_source":"然后我一看书几那么厚 我当时才意识到 这书还是挺厚的，你用了多久翻的，我是在一边读博士一边翻 博士读完了他也翻完了。","sentence_en":"Then I saw how thick the book actually was and realized it was really thick. How long did it take you to translate?"},{"id":"303","start":2133.96,"end":2144.5,"displayStart":2133.96,"displayEnd":2144.5,"displayMid":2139.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.945907,"pitch":26.882269,"speechRate":5.784,"hasEvents":false,"sentence_source":"对我来说他好像是第二个博士一样，虽然我的博士论文做的是艾律特 就是比如说他的一些研究材料，我就可以用得上 但是也相关也不相关吧。","sentence_en":"To me, he seemed like a second PhD advisor, even though my dissertation was on Eliot—like, some of his research materials were useful, but it's kind of relevant and not really."},{"id":"304","start":2144.5,"end":2150.26,"displayStart":2144.5,"displayEnd":2150.26,"displayMid":2147.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.3,"loudness":0.927403,"pitch":29.663202,"speechRate":4.291,"hasEvents":false,"sentence_source":"当时其实我最大的难度也在于文本身 但是文本身他难。","sentence_en":"At the time, my biggest difficulty was actually the text itself. The text was just hard."},{"id":"305","start":2150.26,"end":2163.7,"displayStart":2150.26,"displayEnd":2163.7,"displayMid":2156.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.7,"loudness":0.785317,"pitch":25.039185,"speechRate":5.357,"hasEvents":false,"sentence_source":"但是我很享受这个男 您肯定也有这种感觉，就是每天都会想到一个词，诶 我琢磨这个词或者这句话，我就是想不出来 我怎么把它译出来比较好，每天会去想 就是再加上翻译嘛。","sentence_en":"But I really enjoyed that state—you must know the feeling—where every day you'd think of a word or a phrase and just couldn't figure out the best way to translate it. You'd mull it over, plus there's the translation work itself."},{"id":"306","start":2163.7,"end":2167,"displayStart":2163.7,"displayEnd":2167,"displayMid":2165.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.82803,"pitch":24.112936,"speechRate":5.758,"hasEvents":false,"sentence_source":"相对来说它有一个底本，你是在这个底本底上。","sentence_en":"Relatively speaking, you have a source text to work from, and you're building on that foundation."},{"id":"307","start":2167,"end":2179.02,"displayStart":2167,"displayEnd":2179.02,"displayMid":2173.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.5,"loudness":0.780059,"pitch":22.187357,"speechRate":5.098,"hasEvents":false,"sentence_source":"然后你是在使用很多的语言资源，把它在另外一种语言当中复现出来，它不像写论文，它是一种纯粹的你要往外输出，纯创造 无中生有的一种感觉。","sentence_en":"Then you're using a lot of linguistic resources to recreate it in another language. It's not like writing a paper—it's pure output, pure creation out of nothing."},{"id":"308","start":2179.02,"end":2188.34,"displayStart":2179.02,"displayEnd":2188.34,"displayMid":2183.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.4,"loudness":0.897211,"pitch":26.537006,"speechRate":5.702,"hasEvents":false,"sentence_source":"所以其实我当时面临的最大困难是，我一边又要做翻译 又一边又要做论文，我必须要保证我每天做论文的那个时间是够的。","sentence_en":"So my biggest challenge was juggling translation and my dissertation. I had to make sure I spent enough time on the dissertation every day."},{"id":"309","start":2188.34,"end":2193.22,"displayStart":2188.34,"displayEnd":2193.22,"displayMid":2190.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"clothing","sentiment_en":"Positive","score":0.8,"loudness":0.874792,"pitch":31.481905,"speechRate":6.711,"hasEvents":false,"sentence_source":"但是呢 我做翻译又很着迷 我很希望我恨不得我一天都能够做这个翻译。","sentence_en":"But I was so obsessed with translation that I'd wish I could do it all day long."},{"id":"310","start":2193.22,"e 420816,"speechRate":5.877,"hasEvents":false,"sentence_source":"你知道我后来发现 翻译和我做主持人 就做这种采访的主持人，其有一些相同的地方 请你把自己放在第二位，翻译其实你要在对方的文字后面 你是为对方的文字服务的。","sentence_en":"You know, I later realized translation and being a host—like doing interview shows—share something: you put yourself second. In translation, you're behind the author's words, serving them."},{"id":"315","start":2215.36,"end":2218.92,"displayStart":2215.36,"displayEnd":2218.92,"displayMid":2217.1400000000003,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.6,"loudness":1.023333,"pitch":23.869761,"speechRate":6.139,"hasEvents":false,"sentence_source":"这个快乐在于你找到那个桥梁 就是要最优解。","sentence_en":"The joy comes from finding that bridge—the optimal solution."},{"id":"316","start":2218.92,"end":2231.44,"displayStart":2218.92,"displayEnd":2231.44,"displayMid":2225.1800000000003,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.010723,"pitch":23.445837,"speechRate":5.613,"hasEvents":false,"sentence_source":"我们所谓中文叫信达雅 但你依然是要符合他要表达的那个意思，他的第一位 然后作为主持人其实也是 我要让你表达，你要把自己稍微引在身后 所以引在某一个人。","sentence_en":"We call it 'faithfulness, expressiveness, and elegance' in Chinese, but you still have to serve the meaning they want to convey—they come first. As a host, same thing: I want you to express yourself, so I step back and let someone else take the lead."},{"id":"317","start":2231.44,"end":2238.8,"displayStart":2231.44,"displayEnd":2238.8,"displayMid":2235.12,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.821804,"pitch":23.869032,"speechRate":7.065,"hasEvents":false,"sentence_source":"某一个文字的后边好像是我的一个常态，我不知道这是你的一个感觉 就你要躲在某一个文字的后面，不是躲 你要在他的后面。","sentence_en":"Being behind someone's words seems to be my norm. I don't know if you feel this way—like you need to hide behind a text. Not hide, but stay behind it."},{"id":"318","start":2238.8,"end":2252.96,"displayStart":2238.8,"displayEnd":2252.96,"displayMid":2245.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.6,"loudness":0.864251,"pitch":23.284502,"speechRate":4.791,"hasEvents":false,"sentence_source":"我很喜欢这个躲字 因为他很符合我的个性，我其实是很享受不被看见的一个状态，以至于比如说像今天这种类似的节目就被看见，我其实是要做一些心理调试的。","sentence_en":"I love that word 'hide'—it suits my personality. I actually enjoy not being seen. So for occasions like today's show where I am seen, I have to do some mental adjustment."},{"id":"319","start":2253.42,"end":2264.46,"displayStart":2253.42,"displayEnd":2264.46,"displayMid":2258.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.6,"loudness":0.87172,"pitch":23.296076,"speechRate":4.892,"hasEvents":false,"sentence_source":"我觉得杨将对这个理解的非常深，杨将他把翻译形容成是一仆二主，而且仆这个字就已经把译者放在了这样一个服务的位置上。","sentence_en":"I think Yang Jiang understood this deeply. She described translation as 'one servant serving two masters,' and the word 'servant' places the translator in a service role."},{"id":"320","start":2264.46,"end":2269.08,"displayStart":2264.46,"displayEnd":2269.08,"displayMid":2266.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.83103,"pitch":27.102428,"speechRate":5.134,"hasEvents":false,"sentence_source":"然后他的这个二主当然是一个主是原文 一个主是义文。","sentence_en":"And the two masters are, of course, the original text and the translated text."},{"id":"321","start":2269.08,"end":2280.92,"displayStart":2269.08,"displayEnd":2280.92,"displayMid":2275,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.003439,"pitch":27.13287,"speechRate":4.795,"hasEvents":true,"sentence_source":"其实我对这个理解一方面是主 像您说的是原文 它的文字 它的风格，说白了就是它原文是一个什么样的风格 它是一个什么样的声音。","sentence_en":"Actually, my understanding of this is partly, as you said, about the original text—its words, its style. Simply put, it's about what style the original text has and what voice it carries."},{"id":"322","start":2281.46,"end":2296.84,"displayStart":2281.46,"displayEnd":2296.84,"displayMid":2289.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.4,"loudness":0.866347,"pitch":27.624947,"speechRate":4.264,"hasEvents":true,"sentence_source":"我觉得在义文当中就是要把这个声音让人或者说这种经验，这种你读原文的经验是需要在义文当中复制，原文是一个原容的 优雅的声音 然后不甜腻的声音。","sentence_en":"In the translation, you need to replicate that voice or experience—the experience of reading the original. The original has a calm, elegant, and not overly sweet voice."},{"id":"323","start":2296.84,"end":2311.78,"displayStart":2296.84,"displayEnd":2311.78,"displayMid":2304.3100000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.830201,"pitch":25.728394,"speechRate":4.756,"hasEvents":false,"sentence_source":"在译文当中就需要让它原容 优雅 不甜腻，如果原文是一个冷的声音 译文也应当是一个冷的声音，比如说我前段时间翻译了阿里史密斯的《春》，《春》当中有一部分 其实是许事者。","sentence_en":"And in the translation, you need to make it calm, elegant, and not overly sweet. If the original is a cold voice, the translation should be cold too. For example, I recently translated Ali Smith's 'Spring.' In it, there's a part where the narrator..."},{"id":"324","start":2311.78,"end":2326.44,"displayStart":2311.78,"displayEnd":2326.44,"displayMid":2319.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.4,"loudness":0.947834,"pitch":24.41445,"speechRate":4.194,"hasEvents":false,"sentence_source":"他有点在讽刺当下的一些英国的历史剧里，他的剧本写的很糟 很狗血 然后里面是那种你农我农很浪漫的，哎呀 你看我的爱人在那边 大概是这样的。","sentence_en":"She's kind of satirizing current British historical dramas. The scripts are terrible, melodramatic, with all that 'you-and-me' romantic stuff—'Oh, look, my love is over there'—that kind of thing."},{"id":"325","start":2326.44,"end":2337.78,"displayStart":2326.44,"displayEnd":2337.78,"displayMid":2332.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Family and Growth","sentiment_en":"Neutral","score":0,"loudness":0.92105,"pitch":28.354086,"speechRate":5.42,"hasEvents":false,"sentence_source":"那其实对于译者可能更多就是我怎么样能把这种很甜逆的这种，实际上是只在作为批评对象的一种，让他在译文当中仍然能够作为一种批评对象。","sentence_en":"So for a translator, the question is how to take that overly sweet tone—which is actually being criticized—and keep it as a target of criticism in the translation."},{"id":"326","start":2337.78,"end":2342.96,"displayStart":2337.78,"displayEnd":2342.96,"displayMid":2340.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.783507,"pitch":24.094408,"speechRate":4.68,"hasEvents":false,"sentence_source":"同时让他跟译文当中的其他声音之间有一种紧张感吧。","sentence_en":"At the same time, create a tension between it and other voices in the translation."},{"id":"327","start":2342.96,"end":2352.18,"displayStart":2342.96,"displayEnd":2352.18,"displayMid":2347.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.810028,"pitch":25.933979,"speechRate":6.353,"hasEvents":true,"sentence_source":"所以我觉得译者其实像您说的有点像 比如说躲在后面第二位，也是梁将说的还是谁说的，就大概也是一个变色龙的一个角色，就要不停的变。","sentence_en":"So I think a translator is like what you said, sort of hiding in the second position, also as Liang Jiang or someone else said, probably a chameleon-like role, constantly changing."},{"id":"328","start":2352.74,"end":2354.72,"displayStart":2352.74,"displayEnd":2354.72,"displayMid":2353.7299999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.989651,"pitch":32.60051,"speechRate":7.242,"hasEvents":true,"sentence_source":"然后说《一仆侍二主》另外一个主。","sentence_en":"Then, about 'One Servant Two Masters'—the other master..."},{"id":"329","start":2354.72,"end":2367.48,"displayStart":2354.72,"displayEnd":2367.48,"displayMid":2361.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.3,"loudness":0.790299,"pitch":24.299982,"speechRate":5.861,"hasEvents":false,"sentence_source":"其实我觉得这个主可能更多的也是一个中文读者，或者中文的文学传统，当然我觉得这个前提是在于我们选择的文本，首先就是它作为一种好中文，它值得作为好中文的一部分。","sentence_en":"I think that other master is more of a Chinese reader or the Chinese literary tradition. But of course, this assumes that the text we choose is, first of all, good Chinese—worthy of being part of good Chinese literature."},{"id":"330","start":2367.48,"end":2371.32,"displayStart":2367.48,"displayEnd":2371.32,"displayMid":2369.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.777193,"pitch":23.428596,"speechRate":5.014,"hasEvents":false,"sentence_source":"如果是这个文本它是这样一种值得的文本。","sentence_en":"If this text is one that is worth it."},{"id":"331","start":2371.32,"end":2384.7,"displayStart":2371.32,"displayEnd":2384.7,"displayMid":2378.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.829352,"pitch":26.050167,"speechRate":4.621,"hasEvents":false,"sentence_source":"那我觉得翻译作为仆的另外一个意义在于，他需要让这个文本在中文当中立得住，或者在中文当中成立，他作为一个文学作品是可以跟中文世界的。","sentence_en":"I think another role of translation as a servant is to make the text hold up in Chinese — as a literary work, it should be able to stand alongside works in the Chinese literary world."},{"id":"332","start":2384.7,"end":2396.5,"displayStart":2384.7,"displayEnd":2396.5,"displayMid":2390.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.5,"loudness":0.874411,"pitch":25.206839,"speechRate":5.169,"hasEvents":false,"sentence_source":"其他的用中文生产的好的文学作品是能够比肩的，我当然这是一个野心了，这是我一个渴望不可及的一个标准，但我觉得其实是一个很重要的标准。","sentence_en":"It should be on par with other great Chinese literary works. That's an ambitious, unattainable standard, but it's an important one."},{"id":"333","start":2396.5,"end":2412.02,"displayStart":2396.5,"displayEnd":2412.02,"displayMid":2404.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.4,"loudness":0.78627,"pitch":21.926203,"speechRate":4.482,"hasEvents":false,"sentence_source":"然后这个服务对象说的大一点其实都可以说是一个中文的，正在进行时的一个文学传统，文学的脉络 文学的序列，我甚至觉得我正在服务的是我的那些写作者朋友们。","sentence_en":"More broadly, this service is to an ongoing Chinese literary tradition — its lineage and sequence. I even feel I'm serving my writer friends."},{"id":"334","start":2412.02,"end":2419.94,"displayStart":2412.02,"displayEnd":2419.94,"displayMid":2415.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.3,"loudness":0.900153,"pitch":22.56353,"speechRate":6.452,"hasEvents":false,"sentence_source":"当然他们可能并用不上我的这个服务，但我觉得我的服务对他来说需要是ready的，他要想取用的时候我在这儿。","sentence_en":"They may not need my service, but it needs to be ready. When they want to use it, I'm here."},{"id":"335","start":2419.94,"end":2432.92,"displayStart":2419.94,"displayEnd":2432 ":"I think a truly powerful woman is so because love itself is an ability—not everyone has the ability to love."},{"id":"471","start":3374.46,"end":3382.26,"displayStart":3374.46,"displayEnd":3382.26,"displayMid":3378.36,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Love and Relationships","sentiment_en":"Positive","score":0.7,"loudness":0.820829,"pitch":25.950756,"speechRate":6.032,"hasEvents":false,"sentence_source":"我觉得真正的一个，我心目当中的一个很坚强的独立的女性，就是你有爱的能力，但你也有更有能力接受不爱。","sentence_en":"A truly strong, independent woman in my mind is someone who has the ability to love, but also the greater ability to accept being unloved."},{"id":"472","start":3382.26,"end":3397.32,"displayStart":3382.26,"displayEnd":3397.32,"displayMid":3389.79,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Love and Relationships","sentiment_en":"Positive","score":0.5,"loudness":0.942529,"pitch":25.350819,"speechRate":6.304,"hasEvents":false,"sentence_source":"你会不会爱是你的一部分﹐不是你的全部﹐但是你不能够为了做自己﹐而完全抛弃爱﹐不要爱 我觉得那也有点可惜﹐我觉得生命有很多滋味儿还是该长﹐如果能长到的话最好﹐我会觉得如今可能我们在经历这样一个时期﹐我们更。","sentence_en":"Whether you love or not is part of you, not all of you. But you can't abandon love entirely just to be yourself. That would be a pity. Life has many flavors worth tasting, and if you can, you should. I feel we're now in a time when we're more..."},{"id":"473","start":3397.32,"end":3410.16,"displayStart":3397.32,"displayEnd":3410.16,"displayMid":3403.74,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Love and Relationships","sentiment_en":"Positive","score":0.5,"loudness":0.861542,"pitch":21.359106,"speechRate":5.408,"hasEvents":false,"sentence_source":"热衷于做正确的表达﹐而不是做真诚的表达﹐我有时候觉得真诚表达哪怕有所谓的局限﹐个人的局限﹐历史的局限﹐但是真诚表达其实是更对自己﹐对别人是更有意义的﹐。","sentence_en":"Eager to make correct expressions rather than sincere ones. Sometimes I think even if sincere expression has limitations—personal, historical—it' 部销毁，他就是不希望身后被人记住 更不希望被人去研究 去评论，她是把很多照片都销毁了 她女儿说 妈你不能这样啊。","sentence_en":"She destroyed all written materials, manuscripts, and records related to herself. She didn't want to be remembered after death, let alone studied or commented on. She destroyed many photos. Her daughter said, 'Mom, you can't do this."},{"id":"591","start":4343.29,"end":4355.81,"displayStart":4343.29,"displayEnd":4355.81,"displayMid":4349.55,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Neutral","score":-0.1,"loudness":1.004631,"pitch":24.987837,"speechRate":6.124,"hasEvents":false,"sentence_source":"说你不给我留照片 她小孩长大以后说 姥姥在哪儿，我想看看姥姥 我照片都没有 她有那么绝绝，就是能够找到的 她最好说 好像我没来过一样，就我特别能够明白 包括艾瑞特 包括像他们。","sentence_en":"You don't leave me photos,' her child said when they grew up, 'Where is Grandma? I want to see Grandma, but I have no photos.' She was so resolute that she wanted to be like she never existed. I really understand that, including Eliot and others."},{"id":"592","start":4355.81,"end":4367.25,"displayStart":4355.81,"displayEnd":4367.25,"displayMid":4361.530000000001,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Neutral","score":-0.1,"loudness":1.010494,"pitch":27.928675,"speechRate":5.856,"hasEvents":false,"sentence_source":"一方面明白 自己在文学史一定会有一席之地的，艾瑞特更是倾使留名 就一定会有人研究，她内心明白 我再给我自己数碑力转 我一任无法阻挡别人来研究我。","sentence_en":"On one hand, she understood she would have a place in literary history. Eliot was even more intent on leaving a name, so people would definitely study her. She knew in her heart that even if she built her own monument, she couldn't stop others from studying her."},{"id":"593","start":4367.25,"end":4382.29,"displayStart":4367.25,"displayEnd":4382.29,"displayMid":4374.77,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Neutral","score":0.1,"loudness":0.964819,"pitch":23.458569,"speechRate":5.585,"hasEvents":false,"sentence_source":"或者研究向哪个方向去走﹐随它要控制就销毁﹐但是你根本﹐你即便销毁又能怎样﹐我们依然会谈论它﹐所以我会觉得就是﹐很多时候记录、采访、暴中、非虚构类的文学﹐它的迷人之术又在于﹐它一方面再一次佐证。","sentence_en":"Or the direction of research. So if she wanted to control it, she would destroy it. But even if you destroy it, what can you do? We still talk about it. So I feel that often, in recording, interviews, reporting, non-fiction literature, its charm lies in that on one hand it again confirms my view."},{"id":"594","start":4382.29,"end":4397.23,"displayStart":4382.29,"displayEnd":4397.23,"displayMid":4389.76,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Negative","score":-0.5,"loudness":0.916445,"pitch":21.536974,"speechRate":5.221,"hasEvents":false,"sentence_source":"了我的观点﹐就是真相它真的不存在﹐我们也无法百分之百去了解一个人﹐甚至我们都不能确定自己内心此刻你的想法是百分之百的真实﹐还是你也经过了某种梳理之后﹐就这样我们既绝望﹐。","sentence_en":"My view: truth really doesn't exist. We cannot 100% understand a person, and we can't even be sure that our own thoughts at this moment are 100% true, or if they've been somehow sorted out. So we are both desperate,"},{"id":"595","start":4397.23,"end":4407.47,"displayStart":4397.23,"displayEnd":4407.47,"displayMid":4402.35,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_en":"Positive","score":0.5,"loudness":0.941389,"pitch":21.723408,"speechRate":5.299,"hasEvents":false,"sentence_source":"但是又会觉得通往真相这个路是很值得去探讨 至少你要去试一下，随为什么翻译必须要存在 写作必须要存在 采访也还是要存在。","sentence_en":"But also feel that the path to truth is worth exploring. At least you have to try. That's why translation must exist, writing must exist, and interviews must still exist."},{"id":"596","start":4407.47,"end":4412.81,"displayStart":4407.47,"displayEnd":4412.81,"displayMid":4410.14,"speaker":"Xu Xiaofan","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing Research","sentiment_ <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
