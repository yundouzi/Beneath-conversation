t wants colorful black, he has to create it."},{"id":"19","start":85,"end":98.14,"displayStart":85,"displayEnd":98.14,"displayMid":91.57,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0.1,"loudness":0.802206,"pitch":28.619499,"speechRate":5.556,"hasEvents":false,"sentence_source":"除了那个墓碑，除了那个名字之外，到底还有什么东西留下，我还经常问他们，如果让你在墓脚里面放一件东西，告诉可能两百年之后几百年后的人，你放什么 有人放书 有人放优盘。","sentence_en":"Besides the tombstone and the name, what else is left? I often ask them, if you could put one thing in the tomb to tell people two hundred or several hundred years later, what would you put? Some put books, some put USB drives."},{"id":"20","start":98.14,"end":100.9,"displayStart":98.14,"displayEnd":100.9,"displayMid":99.52000000000001,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.907337,"pitch":30.648537,"speechRate":6.159,"hasEvents":false,"sentence_source":"然后等等等等 其实大家就脑洞开了很多。","sentence_en":"And so on—people's imaginations run wild."},{"id":"21","start":100.9,"end":103.6,"displayStart":100.9,"displayEnd":103.6,"displayMid":102.25,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0.1,"loudness":0.792435,"pitch":30.917055,"speechRate":5.344,"hasEvents":true,"sentence_source":"我觉得其实是可以想这个问题的。","sentence_en":"I think it's actually possible to think about this question."},{"id":"22","start":107.16,"end":110.38,"displayStart":107.16,"displayEnd":110.38,"displayMid":108.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":1.109673,"pitch":29.109573,"speechRate":4.79,"hasEvents":true,"sentence_source":"嗨 大家好 欢迎来到岩中花述。","sentence_en":"Hi everyone, welcome to 'A Flower in the Rock'."},{"id":"23 2,"end":136.56,"displayStart":134.02,"displayEnd":136.56,"displayMid":135.29000000000002,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.855274,"pitch":27.43391,"speechRate":3.937,"hasEvents":false,"sentence_source":"高兴今天做课岩中花述。","sentence_en":"Happy to be on 'Talking Among Flowers and Rocks' today."},{"id":"28","start":136.56,"end":138.4,"displayStart":136.56,"displayEnd":138.4,"displayMid":137.48000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.5,"loudness":0.928986,"pitch":21.185373,"speechRate":4.348,"hasEvents":false,"sentence_source":"这两天挺有意思的。","sentence_en":"These past couple of days have been interesting."},{"id":"29","start":138.4,"end":152.18,"displayStart":138.4,"displayEnd":152.18,"displayMid":145.29000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.944898,"pitch":26.670906,"speechRate":5.08,"hasEvents":false,"sentence_source":"因为我在网上看了好多老师的讲座，老师有一个特点，他会在自己的研究过程当中一旦进入一个新的领域，他会借由研究就生发出一些关于生活的相关的兴趣。","sentence_en":"Because I've watched many of your lectures online. You have a trait: once you enter a new research field, you develop related interests in life."},{"id":"30","start":152.18,"end":163.14,"displayStart":152.18,"displayEnd":163.14,"displayMid":157.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":1.115461,"pitch":27.245953,"speechRate":4.645,"hasEvents":false,"sentence_source":"比如说他因为研究去学了插花，又因为研究要讲到宋代的相识，就跟相有关的一些文化，他又几乎成了半个相方面的专家。","sentence_en":"For example, you studied flower arrangement because of your research, and when you had to talk about Song dynasty incense culture, you became half an expert."},{"id":"31","start":163.14,"end":169.72,"displayStart":163.14,"displayEnd":169.72,"displayMid":166.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.5,"loudness":0.945759,"pitch":29.577204,"speechRate":5.319,"hasEvents":false,"sentence_source":"所以我特别好奇，最近邓菲你有没有因为新的研究，又产生了一些生活当中新的兴趣。","sentence_en":"So I'm really curious—recently, Deng Fei, have you developed any new interests in life from your research?"},{"id":"32","start":169.72,"end":172.92000000000002,"displayStart":169.72,"displayEnd":172.92000000000002,"displayMid":171.32,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Aesthetics of the Song Dynasty","sentiment_en":"Neutral","score":0,"loudness":0.805433,"pitch":15.82335,"speechRate":4.375,"hasEvents":false,"sentence_source":"我之前给上海图书馆讲宋代美学。","sentence_en":"I gave a talk on Song dynasty aesthetics at Shanghai Library."},{"id":"33","start":172.92000000000002,"end":177.62,"displayStart":172.92000000000002,"displayEnd":177.62,"displayMid":175.27,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Aesthetics of the Song Dynasty","sentiment_en":"Positive","score":0.6,"loudness":1.018928,"pitch":22.138268,"speechRate":3.747,"hasEvents":false,"sentence_source":"因为之前对于插花 品茶 点香 特别向往。","sentence_en":"I've always been fascinated by flower arrangement, tea tasting, and incense."},{"id":"34","start":177.62,"end":179.92000000000002,"displayStart":177.62,"displayEnd":179.92000000000002,"displayMid":178.77,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Aesthetics of the Song Dynasty","sentiment_en":"Negative","score":-0.3,"loudness":1.013115,"pitch":22.502865,"speechRate":6.17,"hasEvents":false,"sentence_source":"但是好像自己操作的比较少。","sentence_en":"But I rarely practiced them myself."},{"id":"35","start":179.92000000000002,"end":181.02,"displayStart":1 fter reading it,"},{"id":"136","start":866.3,"end":876.62,"displayStart":866.3,"displayEnd":876.62,"displayMid":871.46,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.865002,"pitch":25.628094,"speechRate":5.426,"hasEvents":false,"sentence_source":"我觉得怎么有这么荒诞和讽刺的一些文字，就是受到了心灵的巨大震撼，大概也就是9岁时候看百年孤独，看完了之后觉得宏大又荒凉。","sentence_en":"I thought, 'How can there be such absurd and ironic writing?' I was deeply shocked. At 9, I read 'One Hundred Years of Solitude' and felt it was grand and desolate."},{"id":"137","start":876.62,"end":877.7,"displayStart":876.62,"displayEnd":877.7,"displayMid":877.1600000000001,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Negative","score":-0.3,"loudness":0.559087,"pitch":26.758747,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后特别鬼觉。","sentence_en":"And very eerie."},{"id":"138","start":877.7,"end":879.92,"displayStart":877.7,"displayEnd":879.92,"displayMid":878.81,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Negative","score":-0.4,"loudness":0.647607,"pitch":18.544489,"speechRate":4.955,"hasEvents":false,"sentence_source":"然后翻来覆去的独独不懂。","sentence_en":"I read it over and over but didn't really understand."},{"id":"139","start":879.92,"end":882.32,"displayStart":879.92,"displayEnd":882.32,"displayMid":881.12,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.01162,"pitch":28.961632,"speechRate":5.467,"hasEvents":false,"sentence_source":"但是独完了之后又大受震撼。","sentence_en":"But after finishing, I was still greatly shocked."},{"id":"140","start":882.32,"end":890.58,"displayStart":882.32,"displayEnd":890.58,"displayMid":886.45,"speaker":"Deng Fe luster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.8873,"pitch":22.393982,"speechRate":5.043,"hasEvents":false,"sentence_source":"所以我经常会去山西地去考察一些遗迹，一个非常反差感的破破烂冷房子，你进去之后发现是五代的壁画 宋代的壁画，它那么好的保存在那里，这个房子马上可能就贪塌了。","sentence_en":"So I often go to Shanxi to investigate relics. There's this very contrasting dilapidated cold house; when you go inside, you find murals from the Five Dynasties and Song Dynasty, so well preserved there, but the house might collapse soon."},{"id":"157","start":992.44,"end":1002.5,"displayStart":992.44,"displayEnd":1002.5,"displayMid":997.47,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.7,"loudness":0.83222,"pitch":23.283182,"speechRate":5.184,"hasEvents":false,"sentence_source":"但是在这样的一个元净之中，它会给你一种特别破败 但是又珍贵的那种脆弱的美感，就像我们说文字和表达是有力量的。","sentence_en":"But within such a Yuan Jing, it gives you a kind of particularly dilapidated yet precious fragile beauty, just like we say words and expressions have power."},{"id":"158","start":1002.5,"end":1016.4,"displayStart":1002.5,"displayEnd":1016.4,"displayMid":1009.45,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.840317,"pitch":20.596972,"speechRate":4.615,"hasEvents":false,"sentence_source":"就在观看了这个行文本身 我觉得它是可以传达出非常多的能量跟力量的感觉，这个其实也是我们一直在讲到 就是每一种表述方式和思想和观念本身。","sentence_en":"Just by viewing the writing itself, I think it can convey a lot of energy and a sense of power. This is actually what we've been talking about—every form of expression, thought, and concept itself."},{"id":"159","start":1016.4,"end":1025.14,"displayStart":1016.4,"displayEnd":1025.14,"displayMid":1020.77,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.5,"loudness" n Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.976433,"pitch":24.575222,"speechRate":4.862,"hasEvents":false,"sentence_source":"其实我觉得有时候研究历史的过程，很多历史学家就像一个侦探在解迷的一个过程，像您刚才讲的 也许你通过一个送贷古墓的某一幅壁画。","sentence_en":"Actually, I think sometimes the process of studying history, many historians are like detectives solving a mystery. As you just said, maybe through a mural in a Song dynasty ancient tomb,"},{"id":"164","start":1055.68,"end":1070.36,"displayStart":1055.68,"displayEnd":1070.36,"displayMid":1063.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.910621,"pitch":27.359915,"speechRate":5.245,"hasEvents":false,"sentence_source":"某一个发掘出来的物件你能够推断出一段历史，包括我们就去博物馆通过一幅画，你一定能够从这幅画的一些细节，从这个画家跟那个时代的连接，能够去理解那一个时代，或者一个地区。","sentence_en":"From an excavated artifact you can infer a period of history, including when we go to a museum and look at a painting, you can definitely understand that era or a region from the details of the painting and the connection between the painter and that time."},{"id":"165","start":1070.36,"end":1076.44,"displayStart":1070.36,"displayEnd":1076.44,"displayMid":1073.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.6,"loudness":1.072588,"pitch":24.454584,"speechRate":6.086,"hasEvents":false,"sentence_source":"甚至是整个世界的有一段历史，我想这个过程，就是研究历史的人的，他的工作的兴趣所在。","sentence_en":"Even a period of history of the entire world. I think this process is where the interest lies for people who study history."},{"id":"166","start":1076.88,"end":1082.72,"displayStart":1076.88,"displayEnd":1082.72,"displayMid":1079.8000000000002,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.7,"loudness":1.013898,"pitch": lly interprets from the paintings of a very famous Dutch artist, Weimier, every small detail, and can even reveal the grand veil of global history in terms of maritime exchanges at that time."},{"id":"170","start":1120.86,"end":1129.18,"displayStart":1120.86,"displayEnd":1129.18,"displayMid":1125.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.900079,"pitch":23.195705,"speechRate":4.511,"hasEvents":false,"sentence_source":"我们简单地给听众大概介绍一下这本书，它就是通过维密尔这个画家切从它的几幅画。","sentence_en":"Let me briefly introduce this book to the audience. It uses the painter Vermeer, starting from several of his paintings."},{"id":"171","start":1129.18,"end":1135.56,"displayStart":1129.18,"displayEnd":1135.56,"displayMid":1132.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.962986,"pitch":26.901939,"speechRate":4.825,"hasEvents":false,"sentence_source":"然后把整个差不多17世纪的一段世界贸易史将整个世界连在一起。","sentence_en":"And then connects the entire world through a period of world trade history in the 17th century."},{"id":"172","start":1135.56,"end":1149.58,"displayStart":1135.56,"displayEnd":1149.58,"displayMid":1142.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.960717,"pitch":24.94311,"speechRate":5.566,"hasEvents":false,"sentence_source":"然后这个作家他在一开始有一段表达 我就很有意思，他说他当时想 为什么是把维密尔的话好像放在封面，而没有把董齐昌的话放在封面，我发现他是一个非常懂得东西方文化的差异。","sentence_en":"Then the writer has an expression at the beginning that I found very interesting. He said he wondered why Vermeer's painting was put on the cover instead of Dong Qichang's painting. I found he is very knowledgeable about the differences between Eastern and Western cultures."},{"id":"173","start":1149.58,"end":1159.72,"displayStart":1149.58,"displayEnd":1159.72,"displayMid":1154.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.92742,"pitch":23.745037,"speechRate":4.965,"hasEvents":false,"sentence_source":"对东西方人的内心世界是很有了解的一个人，他说如果一个东方人看到了董齐昌的话，特别觉得我很了解他失去兴趣。","sentence_en":"He is very understanding of the inner world of Eastern and Western people. He said if an Eastern person sees Dong Qichang's painting, he would think 'I know this very well' and lose interest."},{"id":"174","start":1159.72,"end":1163.42,"displayStart":1159.72,"displayEnd":1163.42,"displayMid":1161.5700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.978399,"pitch":25.387569,"speechRate":6.627,"hasEvents":false,"sentence_source":"然后西方人会想董齐昌是谁，我不了解他 我没有兴趣。","sentence_en":"Then a Westerner would think, 'Who is Dong Qichang? I don't know him, I have no interest."},{"id":"175","start":1163.42,"end":1172.62,"displayStart":1163.42,"displayEnd":1172.62,"displayMid":1168.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.5,"loudness":1.026264,"pitch":27.154501,"speechRate":5.87,"hasEvents":true,"sentence_source":"但是如果你放了维密尔的话，东方人会说 这个人的话很好，我不了解他 我要去了解他，西方人会想 他是维密尔，我了解他 我要看一看。","sentence_en":"But if you show Vermeer, Easterners would say, 'This person's work is good. I don't know him, I want to get to know him.' Westerners would think, 'He's Vermeer. I know him, I want to see it.'"},{"id":"176","start":1173.06,"end":1180.86,"displayStart":1173.06,"displayEnd":1180.86,"displayMid":1176.96,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0," :"Feelings on Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.805914,"pitch":23.663797,"speechRate":5.268,"hasEvents":false,"sentence_source":"他可以做自己想做的任何的创造和追求，他的风格已形成 他的声明已奠定。","sentence_en":"They could pursue whatever creation they wanted, once their style was formed and their reputation established."},{"id":"224","start":1556.86,"end":1569.18,"displayStart":1556.86,"displayEnd":1569.18,"displayMid":1563.02,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.5,"loudness":0.722286,"pitch":20.753445,"speechRate":5.006,"hasEvents":false,"sentence_source":"但是其实他一定会在他某一个艺术生涯的阶段，会有这样所谓的定制的要求，他需要满足某一些需求，但我觉得这个是很有张力的一个角度去看待。","sentence_en":"But at some stage in their artistic career, they always encountered these customized demands—they needed to satisfy certain requirements. I think that's a very tension-filled perspective to look at it."},{"id":"225","start":1569.18,"end":1572.78,"displayStart":1569.18,"displayEnd":1572.78,"displayMid":1570.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.7,"loudness":1.135673,"pitch":29.458445,"speechRate":5.723,"hasEvents":false,"sentence_source":"其实这样的历史我觉得就是我喜欢读的历史。","sentence_en":"Actually, this kind of history is the history I like to read."},{"id":"226","start":1572.78,"end":1587.64,"displayStart":1572.78,"displayEnd":1587.64,"displayMid":1580.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Negative","score":-0.4,"loudness":1.004943,"pitch":25.396046,"speechRate":5.483,"hasEvents":false,"sentence_source":"对于我来说我的小的时候，中学甚至到大学学的历史，它其实都是个群像，甚至群像都谈不上 就是一段 你是看不到人的，你看到大的事件 事件背后带来的历史，意义对一个地区 对一个国家的改变。","sentence_en":"For me, when I studied history in middle school and even college, it was always about the masses—maybe not even masses, just a span. You couldn't see the individual. You saw big events and the historical significance behind them, the impact on a region or a country."},{"id":"227","start":1587.64,"end":1602.66,"displayStart":1587.64,"displayEnd":1602.66,"displayMid":1595.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.912118,"pitch":25.562649,"speechRate":5.34,"hasEvents":false,"sentence_source":"它的历史严格 但是你看不到人，可是由维米尔的帽子这样的书当中，你能够感受到那个时代的某一个族群，某一个阶级当中的具体的人，他的内心所思所想，这个时候整个历史它就变得活了起来。","sentence_en":"It's strict history, but you can't see the people. However, in a book like 'Vermeer's Hat,' you can feel the inner thoughts of specific people from a certain group or class in that era. Then history becomes alive."},{"id":"228","start":1602.66,"end":1610.32,"displayStart":1602.66,"displayEnd":1610.32,"displayMid":1606.49,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.929653,"pitch":24.736649,"speechRate":5.66,"hasEvents":false,"sentence_source":"我非常同意您，就这个其实也是我自己的偏好，就是您知道我们的历史书写，一定是以大的历史的变迁。","sentence_en":"I totally agree. That's actually my own preference too. You know, historical writing has always centered on major historical changes,"},{"id":"229","start":1610.32,"end":1615.06,"displayStart":1610.32,"displayEnd":1615.06,"displayMid":1612.69,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.759612,"pitch":20.865763,"speechRate":3.586,"hasEvents":false,"sentence_source":"然后宏大叙事英雄主义为核心为主流的。","sentence_en":"with grand narratives and heroism as the mainstream."},{"id":"230","start":1615.06,"end":1621.96,"displayStart":1615.06,"displayEnd":1621.96,"displayMid":1618.51,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.891143,"pitch":23.12532,"speechRate":5.41,"hasEvents":false,"sentence_source":"所以即使在中国的主要的院校里面，最多的讲的都是政治史 思想史 经济史这些为主。","sentence_en":"So even in China's major universities, the focus is mostly on political history, intellectual history, and economic history."},{"id":"231","start":1621.96,"end":1634.6,"displayStart":1621.96,"displayEnd":1634.6,"displayMid":1628.28,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.7,"loudness":0.929737,"pitch":24.546358,"speechRate":5.221,"hasEvents":false,"sentence_source":"那我就很喜欢非主流 我喜欢边缘的东西 我就很想去了解社会生活是怎么样，到底当时用多少钱可以买到相应的粮食，比如说一个普通的人他该如何去生活。","sentence_en":"But I like the non-mainstream, the fringe. I really want to know what social life was like—how much money could buy how much grain, and how an ordinary person lived."},{"id":"232","start":1634.6,"end":1646.04,"displayStart":1634.6,"displayEnd":1646.04,"displayMid":1640.32,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Positive","score":0.6,"loudness":0.822991,"pitch":22.368258,"speechRate":5.254,"hasEvents":false,"sentence_source":"就除了像王安什斯马光这些我们非常而出能想，很多人都在研究的历史的这样重要的人物，一个普通人他的生命历程难道不值得我们去研究吗。","sentence_en":"Besides well-known historical figures like Wang Anshi and Sima Guang that many study, isn't the life journey of an ordinary person also worth studying?"},{"id":"233","start":1646.04,"end":1651.46,"displayStart":1646.04,"displayEnd":1651.46,"displayMid":1648.75,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.871636,"pitch":24.795685,"speechRate":5.19,"hasEvents":false,"sentence_s 69.28,"displayStart":2561.52,"displayEnd":2569.28,"displayMid":2565.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Negative","score":-0.4,"loudness":0.938412,"pitch":25.318785,"speechRate":5.097,"hasEvents":false,"sentence_source":"后来人们认为这个所谓的东方学的这个名称，本质太过以白人视角为中心了，显得不够平等。","sentence_en":"Later, people thought that the term 'Oriental Studies' was too centered on a white perspective and seemed unequal."},{"id":"359","start":2569.28,"end":2582.02,"displayStart":2569.28,"displayEnd":2582.02,"displayMid":2575.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.88987,"pitch":21.238691,"speechRate":6.213,"hasEvents":false,"sentence_source":"后来有一段时间就改成叫 Faculty of Asian and Middle Eastern Studies，就是关于亚洲和中东的学术的研究，邓菁大学专业是不是也改了名称后来?","sentence_en":"Then for a while it was renamed the Faculty of Asian and Middle Eastern Studies, referring to academic studies of Asia and the Middle East. Did your department at Cambridge also change its name later?"},{"id":"360","start":2582.38,"end":2587.56,"displayStart":2582.38,"displayEnd":2587.56,"displayMid":2584.9700000000003,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.984982,"pitch":29.581934,"speechRate":5.814,"hasEvents":false,"sentence_source":"谢谢您提到这个，我现在目前没有做最新的研究，我还要去戏里面看一下。","sentence_en":"Thank you for mentioning that. I haven't done the latest research, I'll need to check within the department."},{"id":"361","start":2587.56,"end":2591,"displayStart":2587.56,"displayEnd":2591,"displayMid":2589.2799999999997,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness": lor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Positive","score":0.4,"loudness":1.039981,"pitch":26.099867,"speechRate":5.303,"hasEvents":false,"sentence_source":"大家就很高兴 原来这么久远的一个楼 所以你就可以看到他是一个非常传统的学院。","sentence_en":"Everyone was very happy. Such a historic building – so you can see it's a very traditional college."},{"id":"388","start":2776.14,"end":2781.9,"displayStart":2776.14,"displayEnd":2781.9,"displayMid":2779.02,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Neutral","score":0,"loudness":0.822426,"pitch":20.287523,"speechRate":4.34,"hasEvents":false,"sentence_source":"其实是前级索贝在牛津建立的学院，他又出了非常多的主教。","sentence_en":"It was actually a college founded in Oxford by a former bishop, and it produced many bishops."},{"id":"389","start":2781.9,"end":2785.38,"displayStart":2781.9,"displayEnd":2785.38,"displayMid":2783.6400000000003,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Neutral","score":0,"loudness":0.740757,"pitch":15.465042,"speechRate":4.598,"hasEvents":false,"sentence_source":"所以是一个很保守 政治保守 宗教保守。","sentence_en":"So it's very conservative – politically conservative, religiously conservative."},{"id":"390","start":2785.38,"end":2790.22,"displayStart":2785.38,"displayEnd":2790.22,"displayMid":2787.8,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Neutral","score":0,"loudness":0.718679,"pitch":22.280602,"speechRate":7.053,"hasEvents":false,"sentence_source":"但是又以那种学习成绩好出名的一个学院，叫Merton 就是末顿学院。","sentence_en":"But it's also famous for academic excellence. It's called Merton – Merton College."},{"id":"391","start":2790.22,"end":2797.44,"displayStart":2790.22,"displayEn irect. Nonetheless, she taught us how to do better academic research."},{"id":"395","start":2818.82,"end":2825.8,"displayStart":2818.82,"displayEnd":2825.8,"displayMid":2822.3100000000004,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.749207,"pitch":17.154367,"speechRate":3.295,"hasEvents":false,"sentence_source":"他非常早就开始讨论欧亚草原之间动物的 器物的 签席。","sentence_en":"She started discussing the exchange of animals and artifacts across the Eurasian steppes very early on."},{"id":"396","start":2825.8,"end":2829.02,"displayStart":2825.8,"displayEnd":2829.02,"displayMid":2827.41,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Feelings on Historical Research","sentiment_en":"Neutral","score":0,"loudness":0.854045,"pitch":26.095982,"speechRate":6.01,"hasEvents":false,"sentence_source":"所以他其实一直都在做很早期的文化交流。","sentence_en":"So she was actually always working on early cultural exchange."},{"id":"397","start":2829.02,"end":2837.28,"displayStart":2829.02,"displayEnd":2837.28,"displayMid":2833.15,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Positive","score":0.5,"loudness":0.907627,"pitch":25.236971,"speechRate":5.263,"hasEvents":false,"sentence_source":"我们其实都开始对于这种文化的多元和融合感兴趣，也是在他的指导之下 他说你应该去看一下牧藏。","sentence_en":"We all started to become interested in cultural diversity and fusion. It was under her guidance that she said I should look into wooden burial."},{"id":"398","start":2837.28,"end":2839.84,"displayStart":2837.28,"displayEnd":2839.84,"displayMid":2838.5600000000004,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Neutral","score":0,"loudness":0.828479,"pitch":23.044094,"speechRate":6.25,"hasEvents": ime homemaker. She would use art history to show people one painting after another, especially modern and contemporary works."},{"id":"410","start":2924.6,"end":2937.56,"displayStart":2924.6,"displayEnd":2937.56,"displayMid":2931.08,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Positive","score":0.7,"loudness":0.865285,"pitch":23.298271,"speechRate":5.675,"hasEvents":false,"sentence_source":"然后去让学生们，你不要去背那些课本上的东西，你要去真正意义上的，去近距离的去观看，我其实就是在那个片子里面，我感受到了艺术史的魅力，就是很多时候你要去体验。","sentence_en":"Then she would tell students, 'Don't just memorize what's in the textbooks. You need to truly observe up close.' I actually felt the charm of art history in that film – that many times you have to experience it."},{"id":"411","start":2937.56,"end":2949.54,"displayStart":2937.56,"displayEnd":2949.54,"displayMid":2943.55,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Positive","score":0.6,"loudness":0.759861,"pitch":23.333811,"speechRate":6.093,"hasEvents":false,"sentence_source":"那个体验不一定是书上告诉你的，艺术史的定义，不一定是谁告诉我们美的东西，它就一定是美的有一，些东西它会打破我们的所谓的认知，但还有一些东西，他真的直进你的心灵。","sentence_en":"That experience isn't necessarily what books tell you. The definition of art history isn't necessarily that what someone says is beautiful must be beautiful. Some things break our so-called perceptions, but some things truly touch your heart."},{"id":"412","start":2949.54,"end":2960,"displayStart":2949.54,"displayEnd":2960,"displayMid":2954.77,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Neutral","score":0.2,"loudness":0.797701,"pitch":22.182093,"speechRate":4.78,"hasEvents":false,"sentence_source":"那这个可能就是你所认为的好的艺术，但好的艺术只是个起点，就是你怎么更多的去了解他 研究他，就是审美永远是起点。","sentence_en":"That might be what you consider good art. But good art is just the starting point – how you learn more about it and study it. Aesthetics is always the starting point."},{"id":"413","start":2960,"end":2973.34,"displayStart":2960,"displayEnd":2973.34,"displayMid":2966.67,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Neutral","score":0.1,"loudness":0.904601,"pitch":21.794619,"speechRate":5.042,"hasEvents":false,"sentence_source":"但是审美又是我们永远会回归到的地方，可是除了审美之外，作为艺术史学家要去解决哪些问题，怎么把很多的认知，甚至对于历史的这样的一些了解往前推鲁。","sentence_en":"But aesthetics is also where we always return. However, beyond aesthetics, as art historians, what problems do we need to solve? How do we push forward our understanding, even of history?"},{"id":"414","start":2973.34,"end":2985.56,"displayStart":2973.34,"displayEnd":2985.56,"displayMid":2979.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Neutral","score":0,"loudness":1.006009,"pitch":24.028811,"speechRate":6.465,"hasEvents":false,"sentence_source":"豫 鲁豫 历史未必提供所有答案，我要将大家介绍一下，可以去看看朱利亚罗伯茨主演的那部影片《蒙娜丽莎的微笑》，这部影片讲的其实就上个世纪50年代的美国一座很著名的女校叫威斯里。","sentence_en":"History may not provide all the answers. I want to introduce everyone to the film 'Mona Lisa Smile' starring Julia Roberts. This film is about a famous women's college in the 1950s called Wellesley."},{"id":"415","start":2986.14,"end":2999.04,"displayStart":2986.14,"displayEnd":2999.04,"displayMid":2992.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Negative","score":-0.3,"loudness":0.995077,"pitch":28.384424,"speechRate":5.28,"hasEvents":false,"sentence_source":"其实这个学校在那个年代很像一个高级女德学校，就是那个地方的女生可能家庭都是非负责贵，都受过很好教育的女孩子，但他们的人生的目标 包括学校的目标。","sentence_en":"Actually, that school at the time was like a high-class finishing school. The girls there might come from very wealthy families and were well-educated, but their life goals – and the school's goal –"},{"id":"416","start":2999.04 是到底在主流的某一些学界里面，女性的力量是如何的。","sentence_en":"Yes, that shift from history to hurstory. That's a question we might need to discuss: in some mainstream academic circles, what is the power of women?"},{"id":"493","start":3626.54,"end":3636.24,"displayStart":3626.54,"displayEnd":3636.24,"displayMid":3631.39,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.841557,"pitch":24.800816,"speechRate":4.978,"hasEvents":false,"sentence_source":"比如说我现在在做艺术室，艺术室里面有非常多的男性的学者，早期都是这样子，但现在更多的一些年轻的女生。","sentence_en":"For example, I'm now in art history. There are many male scholars in art history, especially in early times, but now more young women."},{"id":"494","start":3636.24,"end":3638.34,"displayStart":3636.24,"displayEnd":3638.34,"displayMid":3637.29,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.4,"loudness":0.587918,"pitch":22.129656,"speechRate":6.326,"hasEvents":false,"sentence_source":"对这个感兴趣然后也加入进来。","sentence_en":"They become interested and join in."},{"id":"495","start":3638.34,"end":3645.92,"displayStart":3638.34,"displayEnd":3645.92,"displayMid":3642.13,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.777982,"pitch":24.192667,"speechRate":5.585,"hasEvents":false,"sentence_source":"所以现在也会形成一个现象，就是你如果是女生你就去学艺术室，逐渐都会往这样的一个方向去发展。","sentence_en":"So now a phenomenon emerges: if you're a girl, you study art history. Gradually everyone moves in that direction."},{"id":"496","start":3645.92,"end":3654.48,"displayStart":3645.92,"displayEnd":3654.48,"displayMid":3650.2,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.85013,"pitch":27.005735,"speechRate":5.49 erested in children."},{"id":"504","start":3712.26,"end":3719.42,"displayStart":3712.26,"displayEnd":3719.42,"displayMid":3715.84,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.4,"loudness":0.927967,"pitch":26.614191,"speechRate":5.447,"hasEvents":false,"sentence_source":"然后我想做儿童史，就是儿童其实才是真正被忽略的一代 因为他们没有人真正能够留下声音。","sentence_en":"Then I wanted to study children's history. Children are truly the neglected generation because no one can really leave their mark."},{"id":"505","start":3719.42,"end":3730.62,"displayStart":3719.42,"displayEnd":3730.62,"displayMid":3725.02,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.3,"loudness":0.773584,"pitch":22.497313,"speechRate":4.911,"hasEvents":false,"sentence_source":"因为女性还有女性的艺术跟女性的文学 还有很多什么口传的文学，但儿童就是 他永远是被我们不断的去规矩理想化了这样的一代。","sentence_en":"Because women have their art and literature, and oral traditions. But children are always being disciplined and idealized by us."},{"id":"506","start":3730.62,"end":3736.2,"displayStart":3730.62,"displayEnd":3736.2,"displayMid":3733.41,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.960316,"pitch":29.831392,"speechRate":5.831,"hasEvents":false,"sentence_source":"甚至在某一些阶段 在中世纪的欧洲 大家觉得儿童根 成年没有什么不同。","sentence_en":"Even in some periods, like medieval Europe, people thought children were no different from adults."},{"id":"507","start":3736.2,"end":3748.7,"displayStart":3736.2,"displayEnd":3748.7,"displayMid":3742.45,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.901304,"pitch":24.001303,"speechRate":5.04,"hasEvents":false,"sentence_source":"然后在更早的中国南北朝 大家觉得儿童就是小大人，可能宋代的时候 大 ral","score":0,"loudness":0.740117,"pitch":22.815674,"speechRate":5.355,"hasEvents":true,"sentence_source":"那其实也是在想讨论，就是我到底去设定的是，怎么样的一个家庭的环境，学校的环境，我希望他们成长成什么样子，这个问题是历代各个时期的，所有的父母都会去考虑的一个问题。","sentence_en":"That actually raises the question: what kind of family environment and school environment do I set, and what do I want them to grow up to be? This is a question that parents in every era have considered."},{"id":"512","start":3780.28,"end":3791.64,"displayStart":3780.28,"displayEnd":3791.64,"displayMid":3785.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Positive","score":0.5,"loudness":0.976007,"pitch":26.77552,"speechRate":5.719,"hasEvents":true,"sentence_source":"这很有意思，这是我第一次听到一个儿童史这个概念，我从来没有想过，你刚才讲到儿童史，我现在能够得到的跟儿童相关的一些儿童的样本都来自于文学。","sentence_en":"That's very interesting. This is the first time I've heard of the concept of children's history. I never thought about it. When you mentioned children's history, the samples I can think of related to children all come from literature."},{"id":"513","start":3791.64,"end":3799.38,"displayStart":3791.64,"displayEnd":3799.38,"displayMid":3795.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Neutral","score":0,"loudness":0.913168,"pitch":24.495169,"speechRate":6.072,"hasEvents":false,"sentence_source":"可能我想到比如说英国的儿童 当年那就是，乌度顾儿Oliver Twist 哈克贝利芬 或者莎茲一只只羹鸟。","sentence_en":"Maybe I think of British children, like Oliver Twist, Huckleberry Finn, or a thrush from Shakespeare."},{"id":"514","start":3799.38,"end":3803.46,"displayStart":3799.38,"displayEnd":3803.46,"displayMid":3801.42,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Fun of Images","sentiment_en":"Neutral","score":0,"loudness":0.814466,"pitch":24.894497,"speechRate":3.922,"hasEvents":false,"sentence_source":"或者小夫人呢 小夫人算是少女了 对吧。","sentence_en":"Or 'Little Lady' 0.826682,"pitch":22.354864,"speechRate":5.49,"hasEvents":false,"sentence_source":"但是在某一次他们一起去寻姓某一个宫殿的时候，太热了这个小姑娘就可能中暑去世了，你就可以想象 他唯一的精神祭头就是这个小孩子，他倾注了多少的热情 多少的情感。","sentence_en":"But once, when they were touring a palace together, it was too hot, and the girl likely died of heatstroke. You can imagine—this child was her only emotional anchor. She poured all her warmth and affection into her."},{"id":"554","start":4078.54,"end":4084.3,"displayStart":4078.54,"displayEnd":4084.3,"displayMid":4081.42,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.778196,"pitch":22.969978,"speechRate":4.078,"hasEvents":false,"sentence_source":"去装饰 去建置这座墓，他把他直接建在一个寺庙上面。","sentence_en":"She decorated and built this tomb, placing it directly on a temple."},{"id":"555","start":4084.3,"end":4088.04,"displayStart":4084.3,"displayEnd":4088.04,"displayMid":4086.17,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.690671,"pitch":19.28392,"speechRate":5.646,"hasEvents":false,"sentence_source":"然后把最华丽的珠宝全部都给了这个小姑娘。","sentence_en":"And she gave the little girl all the most splendid jewels."},{"id":"556","start":4088.04,"end":4100.14,"displayStart":4088.04,"displayEnd":4100.14,"displayMid":4094.09,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.849925,"pitch":20.378746,"speechRate":4.58,"hasEvents":false,"sentence_source":"所以当这个墓打开的时候，当然是北周随朝皇室成员的，他的墓葬的设置，但你看到的是这个外祖母对他，外孙女的这种爱 这种情感。","sentence_en":"So when the tomb was opened—of course it was a royal burial of the Northern Zhou and Sui—what you see is the grandmother's love and emotion for her granddaughter."},{"id":"557","start":4100.14,"end":4111.12,"displayStart":4100.14,"displayEnd":4111.12,"displayMid":4105.63,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.821246,"pitch":24.326048,"speechRate":5.095,"hasEvents":false,"sentence_source":"这个时候就回到了我的那个点 你可以研究儿童 你也可以强调情感，中国人是一个特别不爱严肃和表达情感 他会把他物质化 文学化。","sentence_en":"That brings me back to my point: you can study children, but you can also highlight emotion. Chinese people are often reluctant to talk about emotions directly—they materialize and literary-ize them."},{"id":"558","start":4111.12,"end":4122.12,"displayStart":4111.12,"displayEnd":4122.12,"displayMid":4116.62,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.857948,"pitch":23.614527,"speechRate":5.128,"hasEvents":false,"sentence_source":"但是直接在言语的表达很少 甚至在木葬里面 我们处处可以看到受到理智的制约，情感的流露少之又少 反倒是在儿童 在这个层面上面。","sentence_en":"But direct verbal expression is rare. Even in burials, you can see constraints from ritual norms, with emotional expression being minimal—except when it comes to children."},{"id":"559","start":4122.12,"end":4129.06,"displayStart":4122.12,"displayEnd":4129.06,"displayMid":4125.59,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.4,"loudness":0.716163,"pitch":21.006376,"speechRate":4.467,"hasEvents":false,"sentence_source":"白发人送黑发人的时候 就特别容易把这种情感完全没有保留的流露出来。","sentence_en":"When the elderly bury the young, it's especially easy to let that emotion flow out without any reservation."},{"id":"560","start":4129.06,"end":4133.72,"displayStart":4129.06,"displayEnd":4133.72,"displayMid":4131.39,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.5,"loudness":0.919375,"pitch":24.64484,"speechRate":5.876,"hasEvents":false,"sentence_source":"所以我在每次在讲课的时候谈到这一点，同学们都比较受到触动。","sentence_en":"So every time I talk about this in class, students are quite moved."},{"id":"561","start":4133.72,"end":4139.48,"displayStart":4133.72,"displayEnd":4139.48,"displayMid":4136.6,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.790046,"pitch":23.0411,"speechRate":5.487,"hasEvents":false,"sentence_source":"然后都想去研究情感是，都想去看一看到底我们的感情是怎么表露出来的。","sentence_en":"Then they all want to study emotions, to see how our feelings really manifest."},{"id":"562","start":4139.48,"end":4145.94,"displayStart":4139.48,"displayEnd":4145.94,"displayMid":4142.709999999999,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.773885,"pitch":24.517994,"speechRate":5.321,"hasEvents":false,"sentence_source":"我们的这种特别含蓄的民族，怎么在理智与情感之间做出这样的一个互动和挣扎。","sentence_en":"How does our particularly reserved culture navigate and struggle between reason and emotion?"},{"id":"563","start":4145.94,"end":4147.4,"displayStart":4145.94,"displayEnd":4147.4,"displayMid":4146.67,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.853299,"pitch":27.256115,"speechRate":8.889,"hasEvents":false,"sentence_source":"我觉得这个其实特别吸引人。","sentence_en":"I think this is really fascinating."},{"id":"564","start":4147.4,"end":4153.76,"displayStart":4147.4,"displayEnd":4153.76,"displayMid":4150.58,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.7,"loudness":0.745396,"pitch":24.619822,"speechRate":5.189,"hasEvents":false,"sentence_source":"因为我觉得现在的人就是谈到情感的时候容易受到共鸣，就这种共情性特别大。","sentence_en":"Because I think people today easily resonate when it comes to emotions; the empathy is very strong."},{"id":"565","start":4153.76,"end":4162.98,"displayStart":4153.76,"displayEnd":4162.98,"displayMid":4158.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.907261,"pitch":25.611959,"speechRate":5.415,"hasEvents":false,"sentence_source":"我在想在研究木葬文化 特别是你在课堂上跟学生们在讲述这个课的过程当中肯定会举到很多特别具体的例子。","sentence_en":"I'm thinking, when studying burial culture, especially when you talk to students in class, you must give many specific examples."},{"id":"566","start":4162.98,"end":4176.98,"displayStart":4162.98,"displayEnd":4176.98,"displayMid":4169.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0.1,"loudness":0.923996,"pitch":25.573759,"speechRate":4.993,"hasEvents":false,"sentence_source":"年轻人他们虽然离死亡是很远的 但是在讲述过去的人的木葬 在讲述死亡的过程当中，一定每个人都会和生活当中的很多自己真实的一些经历可能会连接起来。","sentence_en":"Young people are far from death, but when describing ancient burials and the process of death, everyone surely connects it to their own real-life experiences."},{"id":"567","start":4176.98,"end":4184.5,"displayStart":4176.98,"displayEnd":4184.5,"displayMid":4180.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.84942,"pitch":23.271788,"speechRate":6.216,"hasEvents":false,"sentence_source":"就那种瞬间的人性的共情和共鸣应该还是很大动人的，我想可能会有很多这样的例子能不能跟我们分享一下。","sentence_en":"That instant human empathy and resonance is very moving. I think there must be many such examples—could you share some with me?"},{"id":"568","start":4184.5,"end":4195.84,"displayStart":4184.5,"displayEnd":4195.84,"displayMid":4190.17,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.818881,"pitch":22.23443,"speechRate":4.762,"hasEvents":false,"sentence_source":"我有一段时间大概就是疫情之前开了一门课，我其实想讲考古的例子 想讲古代的木葬，讲着然后因为机缘巧合接触到了现代冰藏。","sentence_en":"For a while, around before the pandemic, I taught a course. I intended to talk about archaeological examples, ancient burials, but then by chance I came across modern sea burial."},{"id":"569","start":4195.84,"end":4208.76,"displayStart":4195.84,"displayEnd":4208.76,"displayMid":4202.3,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.4,"loudness":0.738691,"pitch":21.316637,"speechRate":4.818,"hasEvents":false,"sentence_source":"然后我就会觉得说怎么会这样，就是我们曾经有那么辉煌的那么精美的随藏的物品，当然它属于更高的等级了，全部都是帝王达官贵族的这些木葬。","sentence_en":"And I thought, how could this be? We once had such magnificent, exquisite burial goods—of course, for higher classes, all for emperors and nobles."},{"id":"570","start":4208.76,"end":4217.18,"displayStart":4208.76,"displayEnd":4217.18,"displayMid":4212.97,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.5,"loudness":0.736939,"pitch":22.448978,"speechRate":4.672,"hasEvents":false,"sentence_source":"但是为什么我们现在如此的不重视桑葬之间事情从礼仪的角度也好 从物品的角度也好。","sentence_en":"But why do we now pay so little attention to funeral matters, whether from the perspective of rituals or material objects?"},{"id":"571","start":4217.18,"end":4231.14,"displayStart":4217.18,"displayEnd":4231.14,"displayMid":4224.16,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Educational experience and its impact on life","sentiment_en":"Positive","score":0.5,"loudness":0.807741,"pitch":23.01272,"speechRate":5.231,"hasEvents":false,"sentence_source":"然后我就就产生了好奇 我就给自己打了很多问号，于是我就在课上开始 一年一年的有意识的放异点点跟现实连接的部分，古墓派其实跟现在的冰葬 公墓派也没有那么遥远。","sentence_en":"So I became curious, asking myself many questions. Then I began in class, year by year, intentionally adding elements that connect to reality. The 'ancient tomb school' is actually not that far from modern sea burial or cemetery school."},{"id":"572","start":4231.14,"end":4235,"displayStart":4231.14,"displayEnd":4235,"displayMid":4233.07,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.013778,"pitch":26.251129,"speechRate":6.154,"hasEvents":false,"sentence_source":"所以就是在这个过程之中 就很多学生特别喜欢。","sentence_en":"And throughout this process, many students really liked it."},{"id":"573","start":4235,"end":4248.38,"displayStart":4235,"displayEnd":4248.38,"displayMid":4241.6900000000005,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.740752,"pitch":22.246645,"speechRate":5.83,"hasEvents":false,"sentence_source":"因为我觉得现在的年轻人喜欢探索一些比较禁忌的话题，他们会通过这些东西去探索到底生命是什么，就是我们所说的海德哥尔的像死而生，就是假如你还有一天活 你怎么过好你的人生。","sentence_en":"Because I think young people today like to explore somewhat taboo topics. Through these, they explore what life really is—what Heidegger called 'being-toward-death': if you had only one day to live, how would you live your life?"},{"id":"574","start":4248.38,"end":4253.32,"displayStart":4248.38,"displayEnd":4253.32,"displayMid":4250.85,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0.2,"loudness":0.833086,"pitch":26.041075,"speechRate":6.118,"hasEvents":false,"sentence_source":"就只有你了解到死亡在面前，你才能知道生命最有意义的事情是什么。","sentence_en":"Only when you understand death is before you can you know what is most meaningful in life."},{"id":"575","start":4253.32,"end":4261.94,"displayStart":4253.32,"displayEnd":4261.94,"displayMid":4257.629999999999,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.903812,"pitch":26.008574,"speechRate":5.402,"hasEvents":false,"sentence_source":"然后在这个过程中 我就开始有意识的让他们做小的案例，2021年的时候 有一个学生是复旦新闻系的。","sentence_en":"Then in this process, I began intentionally having them do small case studies. In 2021, there was a student from Fudan's journalism department."},{"id":"576","start":4261.94,"end":4267.8,"displayStart":4261.94,"displayEnd":4267.8,"displayMid":4264.87,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0.1,"loudness":0.973352,"pitch":23.876692,"speechRate":5.959,"hasEvents":false,"sentence_source":"然后他就很想说老师你讲了这么多现代的不太好的地方，我能去采访海藏吗?","sentence_en":"And he wanted to say, 'Teacher, you've talked about so many downsides of modern ways, can I go interview about sea burial?"},{"id":"577","start":4267.82,"end":4270.62,"displayStart":4267.82,"displayEnd":4270.62,"displayMid":4269.219999999999,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Positive","score":0.5,"loudness":0.922697,"pitch":20.535561,"speechRate":6.498,"hasEvents":false,"sentence_source":"我说海藏没有不好，它是一个很环保的方式。","sentence_en":"I said sea burial isn't bad; it's a very eco-friendly method."},{"id":"578","start":4270.62,"end":4284.94,"displayStart":4270.62,"displayEnd":4284.94,"displayMid":4277.78,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Temples and Monks","sentiment_en":"Positive","score":0.5,"loudness":0.794863,"pitch":22.974823,"speechRate":5.307,"hasEvents":false,"sentence_source":"但是现在可能有很多的一些细节，需要更多的这样的一些调整跟处理，我希望我们每个人都有所贡献，他就带着这些问题去采访了上海地区流行海藏，他回来之后拍了一个很小的短片。","sentence_en":"But now there may be many details that require more adjustments and handling. I hope each of us can contribute. He took these questions to interview the popular Hmong in Shanghai and made a short film after returning."},{"id":"579","start":4284.94," story","sentiment_en":"Negative","score":-0.4,"loudness":0.88829,"pitch":23.71026,"speechRate":4.868,"hasEvents":false,"sentence_source":"因为前年年底我父亲去世之后，我其实人生第一次接触到和木葬相关的一些事情，可能内心深处 我不知道会不会有那种忌讳的心理 我不知道。","sentence_en":"Because after my father passed away at the end of the year before last, I actually encountered things related to wooden burials for the first time in my life. Deep down, I'm not sure if there is some taboo feeling—I don't know."},{"id":"598","start":4437.82,"end":4450.86,"displayStart":4437.82,"displayEnd":4450.86,"displayMid":4444.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.887833,"pitch":26.390882,"speechRate":5.298,"hasEvents":false,"sentence_source":"但当你面对一个亲人的离去的时候 这一切变得并不恐怖 你也不会抗拒它，你甚至会某种程度的会内心感到一些安慰，这个时候你才会意识到 为什么人需要仪式感。","sentence_en":"But when you face the departure of a loved one, all this becomes not frightening, and you don't resist it. You even feel some comfort inside. At that moment you realize why people need a sense of ritual."},{"id":"599","start":4450.86,"end":4457.88,"displayStart":4450.86,"displayEnd":4457.88,"displayMid":4454.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.7,"loudness":0.971141,"pitch":26.545771,"speechRate":5.299,"hasEvents":false,"sentence_source":"仪式感是带给生者的一种安慰，它让这种冰冷的死亡变得没有那么地让你觉得恐惧。","sentence_en":"A sense of ritual is a comfort for the living; it makes the coldness of death less frightening."},{"id":"600","start":4457.88,"end":4464.96,"displayStart":4457.88,"displayEnd":4464.96,"displayMid":4461.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Positive","score":0.6,"loudness":0.881707,"pitch":23.307674,"speechRate":4.379,"hasEvents":false,"sentence_source":"所以那一刻我是明白 其实有一些宗教的仪式，是带给人一些温暖和危急的。","sentence_en":"So at that moment I understood that some religious rituals bring warmth and solace."},{"id":"601","start":4464.96,"end":4470.22,"displayStart":4464.96,"displayEnd":4470.22,"displayMid":4467.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.950874,"pitch":26.709026,"speechRate":5.631,"hasEvents":false,"sentence_source":"然后你刚才讲到，从墓葬的一些物品当中，能够去研究到一些历史。","sentence_en":"And you just mentioned that from burial objects, we can study some history."},{"id":"602","start":4470.22,"end":4471.66,"displayStart":4470.22,"displayEnd":4471.66,"displayMid":4470.9400000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.832141,"pitch":28.034506,"speechRate":4.861,"hasEvents":false,"sentence_source":"但是后来我发现。","sentence_en":"But later I discovered."},{"id":"603","start":4471.66,"end":4481.48,"displayStart":4471.66,"displayEnd":4481.48,"displayMid":4476.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Negative","score":-0.4,"loudness":0.981546,"pitch":27.254362,"speechRate":5.601,"hasEvents":false,"sentence_source":"其实在我们的很多墓葬当中，就现在如果你未来的人们，去发掘现在人们的墓葬的话，恰恰是里面没有什么，能够写出这个时代的历史。","sentence_en":"Actually, in many of our tombs, if future people excavated the tombs of today's people, there would be nothing inside that could write the history of this era."},{"id":"604","start":4482.42,"end":4496.72,"displayStart":4482.42,"displayEnd":4496.72,"displayMid":4489.57,"speaker":"Deng Fei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Tombs and History","sentiment_en":"Neutral","score":0,"loudness":0.709402,"pitch":25.659903,"speechRate":2.448,"hasEvents":false,"sentence_source":"历史未必提供所有答案，每一个公墓的面积 以及就是所放置的东西越来越有限。","sentence_en":"History may not provide all answers. The area of each c
