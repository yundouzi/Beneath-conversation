ed about pursuing something inner."},{"id":"18","start":86.8,"end":91.34,"displayStart":86.8,"displayEnd":91.34,"displayMid":89.07,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.042963,"pitch":22.478765,"speechRate":6.306,"hasEvents":false,"sentence_source":"因为内在的东西变得柔和的话，一种道德修养的体高，一种精神状况。","sentence_en":"When the inner becomes gentle, a kind of moral cultivation, a spiritual state."},{"id":"19","start":91.34,"end":94.3,"displayStart":91.34,"displayEnd":94.3,"displayMid":92.82,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.836074,"pitch":25.429266,"speechRate":6.081,"hasEvents":true,"sentence_source":"我觉得我们作为女性可以战友它，霸占也行。","sentence_en":"I think we as women can possess it, or even monopolize it."},{"id":"20","start":98.25,"end":100.83,"displayStart":98.25,"displayEnd":100.83,"displayMid":99.53999999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":1.166523,"pitch":27.752045,"speechRate":6.794,"hasEvents":false,"sentence_source":"Hello 大家好 欢迎来到岩中花述。","sentence_en":"Hello everyone, welcome to 'Yan Zhong Hua Shu'."},{"id":"21","start":100.83,"end":110.11,"displayStart":100.83,"displayEnd":110.11,"displayMid":105.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.4,"loudness":1.030433,"pitch":21.697319,"speechRate":5.388,"hasEvents":false,"sentence_source":"今天我请到的嘉宾是四川外国与大学西方语言文化学院的陈英教授，大家可能更熟悉他的另外一个身份就著名的议者。","sentence_en":"Today my guest is Professor Chen Ying from the School of Western Languages and Cultures at Sichuan International Studies University. You might be more familiar with his other identity as a famous translator."} nce_en":"The actresses include Gina Lollabrigida, Sophia Loren, and in recent years Monica Bellucci."},{"id":"30","start":161.32999999999998,"end":168.31,"displayStart":161.32999999999998,"displayEnd":168.31,"displayMid":164.82,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.7,"loudness":0.930082,"pitch":24.707224,"speechRate":4.871,"hasEvents":false,"sentence_source":"对，所以在我印象当中的意大利女神一般存在的女性，她们的外形当然都无比的美。","sentence_en":"Yes, so in my impression, Italian goddess-like women are of course extremely beautiful in appearance."},{"id":"31","start":168.31,"end":174.82999999999998,"displayStart":168.31,"displayEnd":174.82999999999998,"displayMid":171.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.6,"loudness":0.946906,"pitch":27.46084,"speechRate":5.804,"hasEvents":false,"sentence_source":"然后身形都无比的漫妙丰满，这某种程度在我心目当中也算是形成了对意大利女性。","sentence_en":"And their figures are incredibly curvaceous and full; to some extent, this has shaped my image of Italian women."},{"id":"32","start":174.82999999999998,"end":179.89,"displayStart":174.82999999999998,"displayEnd":179.89,"displayMid":177.35999999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":0.884431,"pitch":18.858196,"speechRate":4.15,"hasEvents":false,"sentence_source":"其实算是刻板印象，就是风雨的 美的 性感的火辣的。","sentence_en":"Actually, it's a stereotype: voluptuous, beautiful, sexy, fiery."},{"id":"33","start":179.89,"end":187.05,"displayStart":179.89,"displayEnd":187.05,"displayMid":183.47,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.5,"loudness":0.893223,"pitch":21.791433,"speechRate":4.748,"hasEvents":false,"sentence_source":"其实我个人的感受，他们比较能够就展现 pressed."},{"id":"69","start":444.15,"end":455.71,"displayStart":444.15,"displayEnd":455.71,"displayMid":449.92999999999995,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.5,"loudness":0.92777,"pitch":23.182219,"speechRate":6.182,"hasEvents":false,"sentence_source":"然后再看纳布洛斯布曲那营造出来的气氛，首先得活下去啊 没有那么多，但她的最大情绪就是活下去，别被别人给杀了 别被别人给害了，就那种状态 得争取一个自己的未来。","sentence_en":"Then look at the atmosphere created in the Neapolitan novels; first of all, you have to survive. There's not much else, but the biggest emotion is survival—don't get killed, don't get harmed—that state of having to fight for your own future."},{"id":"70","start":455.71,"end":458.81,"displayStart":455.71,"displayEnd":458.81,"displayMid":457.26,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.849149,"pitch":12.823803,"speechRate":4.839,"hasEvents":false,"sentence_source":"所以完全是一种 有点相处的感觉吧。","sentence_en":"So it's completely a feeling of... a bit of coexistence."},{"id":"71","start":459.75,"end":467.17,"displayStart":459.75,"displayEnd":467.17,"displayMid":463.46000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":1.039287,"pitch":24.887663,"speechRate":6.158,"hasEvents":true,"sentence_source":"我曾经听到我一个类似于意大利艳语说，看一眼纳布勒斯 然后去死，大概中文的翻译是这样的，可能是个很。","sentence_en":"I once heard something like an Italian saying: 'See Naples and then die.' That's roughly the Chinese translation; it might be a bit off."},{"id":"72","start":467.17,"end":468.95,"displayStart":467.17,"displayEnd":468.95,"displayMid":468.06,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Negative","score":-0.3,"loudness":1.53362,"pitch":30.31199 el, including the movie, has scenes or descriptions that hit me the hardest."},{"id":"149","start":895.75,"end":907.41,"displayStart":895.75,"displayEnd":907.41,"displayMid":901.5799999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Negative","score":-0.5,"loudness":0.988906,"pitch":24.777012,"speechRate":5.152,"hasEvents":false,"sentence_source":"其实我们在作品当中很少会去呈现，他在讲母亲的伟大之余，他也会告诉你 母亲在崩溃的时候也曾经做过很多你不可思议的 但其实残忍的举动。","sentence_en":"We rarely see this in works—while talking about a mother's greatness, it also shows that when a mother breaks down, she's done things you'd never imagine, but are actually cruel."},{"id":"150","start":907.41,"end":914.73,"displayStart":907.41,"displayEnd":914.73,"displayMid":911.0699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Negative","score":-0.4,"loudness":1.05762,"pitch":20.770323,"speechRate":5.718,"hasEvents":false,"sentence_source":"有影片中就比较拍的是比较隐晦 用比较失忆的方法去拍，他曾经打过女儿 然后书中是有描写的。","sentence_en":"In the film, it's filmed more subtly, almost like a memory lapse—she hit her daughter, and the book describes it."},{"id":"151","start":914.73,"end":920.29,"displayStart":914.73,"displayEnd":920.29,"displayMid":917.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Neutral","score":0,"loudness":1.032033,"pitch":23.713224,"speechRate":5.058,"hasEvents":false,"sentence_source":"然后包括他会写道同性之间 其实母女之间很微妙的彼此即爱。","sentence_en":"It also writes about the subtle love-hate between women, especially between mother and daughter."},{"id":"152","start":920.29,"end":932.67,"displayStart":920.29,"displayEnd":932.67,"displayMid":926.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Neutral","score":0,"loudness":0.937491,"pitch":23.741608,"speechRate":5.245,"hasE ,"clusterLabel":"C7","clusterName":"Women's Family Relationships and Psychology","sentiment_en":"Positive","score":0.6,"loudness":1.011106,"pitch":21.026525,"speechRate":5.144,"hasEvents":false,"sentence_source":"然后这个娃娃在那摆着，她就通过她的蚊子不动声色的营造出一种要命啊，这怎么办 她的一种效果，但后来她就把这个推向了最顶端，这就是菲兰特的狠的地方。","sentence_en":"And the doll is just sitting there, and she quietly creates this effect of 'oh no, what do I do' without making a fuss, but later she pushes it to the peak. This is where Ferrante gets ruthless."},{"id":"201","start":1282.73,"end":1285.47,"displayStart":1282.73,"displayEnd":1285.47,"displayMid":1284.1,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Negative","score":-0.6,"loudness":0.976535,"pitch":19.800138,"speechRate":6.608,"hasEvents":false,"sentence_source":"最要命的时候就是她妈找上门来了。","sentence_en":"The worst part is when her mom shows up."},{"id":"202","start":1285.47,"end":1295.43,"displayStart":1285.47,"displayEnd":1295.43,"displayMid":1290.45,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Negative","score":-0.7,"loudness":0.918299,"pitch":18.802952,"speechRate":5.682,"hasEvents":false,"sentence_source":"但是为了是别的事，他把这个事直接摆出来 就是我干的 而且没有借口没有理由，这就是他的最可怕的之处 你看到这里你整个人就很懵。","sentence_en":"But it's for something else, and she just comes out with it—'I did it'—no excuses, no reasons. That's the most terrifying part; you’re completely stunned when you read it."},{"id":"203","start":1295.43,"end":1296.89,"displayStart":1295.43,"displayEnd":1296.89,"displayMid":1296.16,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Work related","sentiment_en":"Neutral","score":0,"loudness":0.879755,"pitch":19.640965,"speechRate":4.11,"hasEvents":false,"sentence_source":"对 所以我相信。","sentence_en":"Right, so I believe."},{"id":"204","start":1296.89,"end":1304.03,"displayStart":1296.89,"displayEnd":1304.03, 1.032379,"pitch":24.165525,"speechRate":6.3,"hasEvents":false,"sentence_source":"但是我觉得曾经经历过 就不同的阶段 我有不同的经历 不同的人生感受，我会觉得挺好的 回想过去就会心一笑那种感觉 我觉得很好，就没有错过最好的时光那种感觉 还是。","sentence_en":"But having gone through it—different stages, different experiences, different feelings—I think it's great. Looking back with a knowing smile, that's wonderful. It's like I haven't missed the best times."},{"id":"459","start":2966.05,"end":2970.07,"displayStart":2966.05,"displayEnd":2970.07,"displayMid":2968.0600000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.5,"loudness":0.865788,"pitch":22.40402,"speechRate":5.797,"hasEvents":false,"sentence_source":"对 人生体验 多维度的 丰富的体验 我觉得是很重要的。","sentence_en":"Yes, life experience—multi-dimensional, rich experiences—I think that's very important."},{"id":"460","start":2970.07,"end":2982.23,"displayStart":2970.07,"displayEnd":2982.23,"displayMid":2976.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.4,"loudness":0.939706,"pitch":22.768808,"speechRate":6.255,"hasEvents":false,"sentence_source":"所以有时候你进入一门语言 就是那种语言带给你的人生的丰富度，不同的维度是很重要的 我觉得如果我没有学英语 你没有学意大利语的话，可能也许会少一些什么 我先想想。","sentence_en":"So sometimes when you enter a language, it brings richness to your life across different dimensions. I think if I hadn't learned English, or you hadn't learned Italian, maybe something would be missing. Let me think."},{"id":"461","start":2982.23,"end":2992.39,"displayStart":2982.23,"displayEnd":2992.39,"displayMid":2987.31,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.5,"loudness":1.081135,"pitch":21.462875,"speechRate":6.101,"hasEvents":false,"sentence_source":"我当时觉得学外语可能很多时候都会觉得，我当时抓好工作跟外语相关，但其实它最深层的对一个人的影响，就是思维的打开还有空间的打开。","sentence_en":"Back then, I thought learning a foreign language was just about getting a job related to it, but its deepest impact is opening up your mind and expanding your horizons."},{"id":"462","start":2992.39,"end":3002.93,"displayStart":2992.39,"displayEnd":3002.93,"displayMid":2997.66,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.98988,"pitch":20.945671,"speechRate":6.128,"hasEvents":false,"sentence_source":"对我来说最震撼的学外语的时刻是我，我其实去意大利已经很晚了，差不多在04-05的时候我去意大利，我从北京到了罗马，我进罗马机场我台湾一看。","sentence_en":"The most awe-inspiring moment for me in language learning was when I went to Italy quite late, around 2004-2005. I flew from Beijing to Rome, entered the airport, and looked around."},{"id":"463","start":3002.93,"end":3006.07,"displayStart":3002.93,"displayEnd":3006.07,"displayMid":3004.5,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.6,"loudness":0.932646,"pitch":13.121148,"speechRate":6.84,"hasEvents":false,"sentence_source":"然后自都认识，我想问什么我张口就来我就可以问。","sentence_en":"And I could understand everything; I could ask anything I wanted, just like that."},{"id":"464","start":3006.07,"end":3017.97,"displayStart":3006.07,"displayEnd":3017.97,"displayMid":3012.02,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.999067,"pitch":21.098352,"speechRate":5.813,"hasEvents":false,"sentence_source":"然后我就想我感觉我去了另外一个省份，中国的另外一个省份，就是一种回家的感觉 就是一种很一下就进入的 长驱直入的感觉，这个对我来说是当时我最高兴的时刻。","sentence_en":"I felt like I'd gone to another province of China—a feeling of home, of instantly fitting in, of smooth entry. That was the happiest moment for me then."},{"id":"465","start":3018.47,"end":3023.37,"displayStart":3018.47,"displayEnd":3023.37,"displayMid":3020.92,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.3,"loudness":0.916139,"pitch":19.033016,"speechRate":7.281,"hasEvents":false,"sentence_source":"比如说我现在我不会得语 我法语不太好，我去法国我就没有那种感觉 一点都没有。","sentence_en":"For example, I don't know German, my French isn't good, so when I go to France, I don't feel that at all."},{"id":"466","start":3023.37,"end":3028.93,"displayStart":3023.37,"displayEnd":3028.93,"displayMid":3026.1499999999996,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.7,"loudness":0.981918,"pitch":20.126099,"speechRate":5.576,"hasEvents":false,"sentence_source":"但是我去意大利第一次去就是这种感觉，这是我在整个外学区觉得最值得。","sentence_en":"But my first time in Italy gave me that feeling, and that's the most worthwhile memory in my entire language learning journey."},{"id":"467","start":3028.93,"end":3042.51,"displayStart":3028.93,"displayEnd":3042.51,"displayMid":3035.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.048133,"pitch":21.843906,"speechRate":5.676,"hasEvents":false,"sentence_source":"记忆的一个时刻，你们在上大学本科 到后来读研究生的时候，就是我们都会有大学的 就是学外语的话 经读 贩读 听力，当时你已经除了必要的这种功课以外，你也设立的一些翻译吧。","sentence_en":"A memorable moment. When you were in college and then grad school, we all had university—for language learning, extensive reading, intensive reading, listening. Apart from the required coursework, you also did some translation, right?"},{"id":"468","start":3042.51,"end":3052.47,"displayStart":3042.51,"displayEnd":3052.47,"displayMid":3047.49,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.774417,"pitch":18.241327,"speechRate":6.205,"hasEvents":false,"sentence_source":"没有 本科的时候基本上没有设立翻译，但你上手就没有那种生书感，没有太多生书感，我后来想了翻译这个事情，为什么我觉得没有那么的困难呢。","sentence_en":"No, I basically didn't do translation in undergrad, but when I started, there was no sense of unfamiliarity. Later I thought about why translation didn't feel so difficult to me."},{"id":"469","start":3052.47,"end":3057.01,"displayStart":3052.47,"displayEnd":3057.01,"displayMid":3054.74,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.4,"loudness":0.878183,"pitch":18.71088,"speechRate":5.172,"hasEvents":false,"sentence_source":"因为我觉得还是做了非常重要的一个充分的准备。","sentence_en":"Because I think I had done very important and thorough preparation."},{"id":"470","start":3057.01,"end":3061.43,"displayStart":3057.01,"displayEnd":3061.43,"displayMid":3059.2200000000003,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.958742,"pitch":21.573879,"speechRate":5.981,"hasEvents":false,"sentence_source":"因为所谓本科的学习，再加上后来在中国的社会体验有工作。","sentence_en":"With undergraduate study and later social experience and work in China."},{"id":"471","start":3061.43,"end":3072.99,"displayStart":3061.43,"displayEnd":3072.99,"displayMid":3067.21,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.94456,"pitch":20.717453,"speechRate":5.623,"hasEvents":false,"sentence_source":"然后在意大利的社会体验工作，再加上博士的学习，在加上不停的读书读意大利的作品，相当于我在去接受意大利文本的时候，我对于整个的两个方面的文化。","sentence_en":"Then, with my social work experience in Italy, my doctoral studies, and constant reading of Italian works, by the time I started engaging with Italian texts, I had a good grasp of both cultures."},{"id":"472","start":3072.99,"end":3079.51,"displayStart":3072.99,"displayEnd":3079.51,"displayMid":3076.25,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.4,"loudness":0.85062,"pitch":17.434084,"speechRate":5.521,"hasEvents":false,"sentence_source":"还有对于语言基本上很多困难已经突破了，还有一个非常重要的突破点就是汉语写作。","sentence_en":"I had overcome most language difficulties, and a key breakthrough was Chinese writing."},{"id":"473","start":3079.51,"end":3083.15,"displayStart":3079.51,"displayEnd":3083.15,"displayMid":3081.33,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.811382,"pitch":18.142956,"speechRate":5.78,"hasEvents":false,"sentence_source":"其实这个翻译其实是汉语写作能力的一个考验。","sentence_en":"Actually, translation is a test of Chinese writing ability."},{"id":"474","start":3083.15,"end":3094.67,"displayStart":3083.15,"displayEnd":3094.67,"displayMid":3088.91,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.950104,"pitch":19.210194,"speechRate":5.767,"hasEvents":false,"sentence_source":"然后因为我当时在意大利读博士的时候，我还在报纸上写东西，在国内的报纸上写东西，我在教汉语，我对汉语的那种语法呀那种写作规范呀，还是有一些体会的。","sentence_en":"When I was doing my PhD in Italy, I also wrote for newspapers in China and taught Chinese, so I had some understanding of Chinese grammar and writing norms."},{"id":"475","start":3094.67,"end":3108.55,"displayStart":3094.67,"displayEnd":3108.55,"displayMid":3101.61,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.926974,"pitch":23.726723,"speechRate":5.735,"hasEvents":false,"sentence_source":"所以正好我在做翻译之前把所有的训练，在无意识之中完成的，当时没有想着我要回去做翻译，做翻译非常偶然，我当时已经教书了，刚开始几年我就一直在教课，教了一段时间课之后有一年。","sentence_en":"So it happened that all my training before translation was done unconsciously; I never planned to go back to translating. Translation came very accidentally. I was already teaching at the time—I had been teaching for a few years, and then one year..."},{"id":"476","start":3108.55,"end":3117.11,"displayStart":3108.55,"displayEnd":3117.11,"displayMid":3112.83,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.6,"loudness":0.881721,"pitch":21.437222,"speechRate":5.724,"hasEvents":false,"sentence_source":"我有一同事他跟我说，有人找我翻那八里科，八里科就是那海人钢琴师的作者，你看你没空，我对八里科是非常有感情的。","sentence_en":"A colleague told me someone wanted me to translate Baricco—the author of The Legend of 1900—and since you were busy, I took it. I have a deep emotional connection to Baricco."},{"id":"477","start":3117.11,"end":3126.33,"displayStart":3117.11,"displayEnd":3126.33,"displayMid":3121.7200000000003,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Positive","score":0.5,"loudness":0.844334,"pitch":17.450251,"speechRate":6.342,"hasEvents":false,"sentence_source":"因为我本科的时候，第一本书就看的那个，海人钢琴师，第二本书看的也是他的书，就完整地看下来的小说，而且我翻了第一本书也是他的。","sentence_en":"Because in my undergraduate years, the first book I read was The Legend of 1900, and the second was also his. Those were the first novels I read in full, and the first book I translated was also his."},{"id":"478","start":3126.33,"end":3138.15,"displayStart":3126.33,"displayEnd":3138.15,"displayMid":3132.24,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.801247,"pitch":19.225536,"speechRate":5.753,"hasEvents":false,"sentence_source":"然后就开始做，做完之后呢，就有灵星的这样的一些机会，我跟北京一个同事挺好的，他当时在做一个非常急的书，当时是一三年嘛，罗马的一个作家写的，讲邮太人的事。","sentence_en":"So I started, and after that, sporadic opportunities came up. A good colleague of mine in Beijing was working on a rush book in 2013, by a Roman writer about Jewish people."},{"id":"479","start":3138.15,"end":3140.37,"displayStart":3138.15,"displayEnd":3140.37,"displayMid":3139.26,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.10669,"pitch":21.372702,"speechRate":6.091,"hasEvents":false,"sentence_source":"然后他说他做不完，又说麻粗。","sentence_en":"He said he couldn't finish it, and it was tough."},{"id":"480","start":3140.37,"end":3142.43,"displayStart":3140.37,"displayEnd":3142.43,"displayMid":3141.3999999999996,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.698704,"pitch":12.222757,"speechRate":5.34,"hasEvents":false,"sentence_source":"然后说我做一半，他做一半。","sentence_en":"Then we split it—I did half, he did half."},{"id":"481","start":3142.43,"end":3156.37,"displayStart":3142.43,"displayEnd":3156.37,"displayMid":3149.3999999999996,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.873543,"pitch":16.511917,"speechRate":4.55,"hasEvents":false,"sentence_source":"然后他做前面我做后头，就支持我做的，差不多是最初的几本书，后来就是上海的一个编辑叫彭罗恩，他就找我做一个男作家也是，《格罗西》 写那本书叫《拳头》。","sentence_en":"He did the first half and I did the second, which got me started. Those were my first few books. Later, an editor in Shanghai named Peng Luoen asked me to translate a male author, Grossi, who wrote Fists."},{"id":"482","start":3156.83,"end":3164.81,"displayStart":3156.83,"displayEnd":3164.81,"displayMid":3160.8199999999997,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Negative","score":-0.4,"loudness":0.858733,"pitch":21.776503,"speechRate":6.679,"hasEvents":false,"sentence_source":"后来这个司不去也是他找的我，我当然也愁，有的时候你一个任务来了之后，你就有两种心理，你就希望这事给黄了你就不用做了。","sente e clauses—the concept of clauses is different from Chinese grammar."},{"id":"494","start":3246.53,"end":3256.73,"displayStart":3246.53,"displayEnd":3256.73,"displayMid":3251.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.099597,"pitch":23.544077,"speechRate":5.581,"hasEvents":false,"sentence_source":"所以很多时候如果是翻语从句的话，你要贴近原文的形式风格，还要符合中国读者的，它其实两个劲儿，你总会要有取舍，这是难的 我懂。","sentence_en":"So often when translating clauses, you have to stay close to the original style while also suiting Chinese readers—it's a tug-of-war, and you have to make compromises. That's the hard part, I understand."},{"id":"495","start":3256.73,"end":3258.39,"displayStart":3256.73,"displayEnd":3258.39,"displayMid":3257.56,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":1.04135,"pitch":26.442663,"speechRate":4.819,"hasEvents":false,"sentence_source":"这个是大长句的话。","sentence_en":"With long sentences..."},{"id":"496","start":3258.39,"end":3266.57,"displayStart":3258.39,"displayEnd":3266.57,"displayMid":3262.48,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.88913,"pitch":23.085928,"speechRate":5.623,"hasEvents":false,"sentence_source":"其实我跟有些编辑可能也会有一些分歧吧他们，就觉得要写大长句，我自己做翻译的时候还是有一定的原则的。","sentence_en":"Actually, I sometimes disagree with editors who want to keep long sentences. I have my own principles when translating."},{"id":"497","start":3266.57,"end":3279.09,"displayStart":3266.57,"displayEnd":3279.09,"displayMid":3272.83,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Feelings as a Translator","sentiment_en":"Neutral","score":0,"loudness":0.873965,"pitch":21.107512,"speechRate":5.272,"hasEvents":false,"senten ame":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.878258,"pitch":18.729019,"speechRate":4.819,"hasEvents":false,"sentence_source":"然后因为你还处于自我自己的状态，你放下完全自我进入到文本，完全是在对方的角度 去把这个事情给做出来，就相当于那个巫师一样 神附在巫师的身上。","sentence_en":"Since you're still in your own head, you have to let go completely and enter the text from the other person's perspective to get it done—it's like a shaman being possessed by a spirit."},{"id":"524","start":3469.77,"end":3473.79,"displayStart":3469.77,"displayEnd":3473.79,"displayMid":3471.7799999999997,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Negative","score":-0.5,"loudness":1.074955,"pitch":21.059975,"speechRate":6.266,"hasEvents":false,"sentence_source":"然后把话给说了 弄完之后整个人像魂丢了一样那种疲惫感。","sentence_en":"After speaking, you feel drained, as if your soul has left your body."},{"id":"525","start":3473.79,"end":3477.11,"displayStart":3473.79,"displayEnd":3477.11,"displayMid":3475.45,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Negative","score":-0.3,"loudness":1.093253,"pitch":22.035091,"speechRate":7.908,"hasEvents":false,"sentence_source":"所以有的时候在这个话传播不清楚的时候 你还得去叫劲。","sentence_en":"So sometimes when the message isn't clear, you have to push even harder."},{"id":"526","start":3477.11,"end":3479.15,"displayStart":3477.11,"displayEnd":3479.15,"displayMid":3478.13,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Negative","score":-0.5,"loudness":0.673809,"pitch":17.798357,"speechRate":5.392,"hasEvents":false,"sentence_source":"所以就是特别累整个过程。","sentence_en":"So the whole process is really exhausting."},{"id":"527","start":3479.15,"end":3486.63,"displayStart":3479.15,"displayEnd":3486.63,"displayMid":3482.8900000000003,"speaker":"Chen Ying","speakerCo 00.9700000000003,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":0.804081,"pitch":25.384459,"speechRate":7.339,"hasEvents":false,"sentence_source":"因为我觉得我们这学外语的死机是一种什么状态，我不知道您有没有体会过。","sentence_en":"Because I think the crash state for language learners is a specific kind—I don't know if you've experienced it."},{"id":"532","start":3503.15,"end":3515.05,"displayStart":3503.15,"displayEnd":3515.05,"displayMid":3509.1000000000004,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":0.811638,"pitch":18.740171,"speechRate":6.05,"hasEvents":false,"sentence_source":"因为我们脑子里面装了两个频道，就装了两个系统，有时候这个系统倒的时候，比如说汉语倒 意大利倒 汉语倒，有时候会出现故障，我现在在很高兴的读者这个意大利语的书籍。","sentence_en":"We have two channels in our heads, two systems. Sometimes when one system crashes—say switching between Chinese and Italian—it glitches. I was happily reading an Italian literary work."},{"id":"533","start":3515.05,"end":3526.09,"displayStart":3515.05,"displayEnd":3526.09,"displayMid":3520.57,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":0.849797,"pitch":18.02243,"speechRate":5.254,"hasEvents":true,"sentence_source":"有文学作品就是完全进入到那个频道嘛，你这个时候让我拿起笔记录我的这个感想用汉语写，我写不出来 出现故障了，他那个两个系统之间。","sentence_en":"And when you're fully immersed in that channel, and I ask you to write down my thoughts in Chinese, I can't do it—the system glitches."},{"id":"534","start":3527.13,"end":3535.97,"displayStart":3527.13,"displayEnd":3535.97,"displayMid":3531.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":1.046628,"pitch":22.164972,"speechRate":4.864,"hasEvents":true,"sentence_so ":3557.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":0.946702,"pitch":24.813559,"speechRate":8.247,"hasEvents":false,"sentence_source":"然后就这样的一篇文章，我全部都看了。","sentence_en":"I read that entire article."},{"id":"539","start":3558.63,"end":3560.83,"displayStart":3558.63,"displayEnd":3560.83,"displayMid":3559.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Positive","score":0.5,"loudness":1.080872,"pitch":20.931658,"speechRate":6.881,"hasEvents":false,"sentence_source":"我觉得那个对我的启发还是挺大的。","sentence_en":"It was really enlightening for me."},{"id":"540","start":3561.35,"end":3562.27,"displayStart":3561.35,"displayEnd":3562.27,"displayMid":3561.81,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"About Ferrante the Person","sentiment_en":"Neutral","score":0,"loudness":1.196345,"pitch":28.973412,"speechRate":6.098,"hasEvents":true,"sentence_source":"工作的女人。","sentence_en":"Working women."},{"id":"541","start":3562.27,"end":3564.91,"displayStart":3562.27,"displayEnd":3564.91,"displayMid":3563.59,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.050915,"pitch":27.029797,"speechRate":6.287,"hasEvents":true,"sentence_source":"对 说我发表在那个书程上的一篇文章。","sentence_en":"Yes, the one I published in a collection."},{"id":"542","start":3564.91,"end":3565.81,"displayStart":3564.91,"displayEnd":3565.81,"displayMid":3565.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.428605,"pitch":22.133114,"speechRate":4.938,"hasEvents":false,"sentence_source":"对 我看了。","sentence_en":"Yes, I read it."},{"id":"543","start":3565.81,"end":3579.83,"displayStart":3565.81,"displayEnd":3579.83,"displayMid":3572.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.096612,"pitch":20.40044,"speechRate":5.579,"hasEvents":true,"sentence_source":"然后我再回想，我想我小的时候的阅读，这种所谓世界民主里面有没有工作状态的女性，我能够想到的 稍微贴一点的 简爱可能算是一个，家庭教师好歹是有工作的是是，其他好像的确是没有。","sentence_en":"Then I recall my childhood reading. In this so-called world literature, were there any women in a working state? The closest I can think of is Jane Eyre—a governess is at least a job. Yes, but there really weren't any others."},{"id":"544","start":3580.37,"end":3591.71,"displayStart":3580.37,"displayEnd":3591.71,"displayMid":3586.04,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.924799,"pitch":19.480148,"speechRate":6.213,"hasEvents":true,"sentence_source":"所以我们需要塑造这个形象，工作的女人是我比较测重的一个，就是把很多东西穿起来了一个标题嘛，我从那个文学作品中找到了一些，而且大家对这个工作的看法。","sentence_en":"So we need to shape this image—working women is a focus of mine. It's a theme that ties many things together. I found examples in literature, along with people's attitudes toward work."},{"id":"545","start":3591.71,"end":3605.51,"displayStart":3591.71,"displayEnd":3605.51,"displayMid":3598.61,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.5,"loudness":1.030984,"pitch":19.68763,"speechRate":5.752,"hasEvents":false,"sentence_source":"这个很多时候那个工作一直是受到排斥的，在50年代比较说 在罗马社会，好丢人啊 居然出去工作，我不要跟人家说你出去工作是为了赚钱，是你没事干 你消遣一下，这是当时的观点 都可怕呀。","sentence_en":"Back then, work was often stigmatized. In 1950s Roman society, it was shameful to work outside the home—people would say, 'Don't tell anyone you're working for money; just say you're doing it for fun out of boredom.' That was the mindset back then—appalling."},{"id":"546","start":3605.51,"end":3610.57,"displayStart":3605.51,"displayEnd":3610.57,"displayMid":3608.04,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.009017,"pitch":22.699545,"speechRate":5.779,"hasEvents":false,"sentence_source":"然后现在的 有的时候我们在工作中，虽然不是遇到那个压力和阻碍。","sentence_en":"And today, even though we don't face those pressures and obstacles at work,"},{"id":"547","start":3610.57,"end":3612.07,"displayStart":3610.57,"displayEnd":3612.07,"displayMid":3611.32,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.3,"loudness":0.65081,"pitch":16.049383,"speechRate":8,"hasEvents":false,"sentence_source":"但是也会有很多很多问题。","sentence_en":"there are still many, many problems."},{"id":"548","start":3612.49,"end":3626.21,"displayStart":3612.49,"displayEnd":3626.21,"displayMid":3619.35,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.4,"loudness":0.892069,"pitch":17.884398,"speechRate":5.582,"hasEvents":false,"sentence_source":"因为他就把女性往另外一个方面推，你就要去照顾家庭生孩子，你找工作你要找的那个目的，就是为了更有利于你生孩子，到现在也是一个热点问题，最近就是英美国家出了蛮多书的。","sentence_en":"Because society pushes women in one direction: take care of the family, have children, and the purpose of finding a job should be to make it easier to have kids. This is still a hot topic. Recently, quite a few books have been published in the UK and US."},{"id":"549","start":3626.21,"end":3628.53,"displayStart":3626.21,"displayEnd":3628.53,"displayMid":3627.37,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.820602,"pitch":19.84141,"speechRate":5.911,"hasEvents":false,"sentence_source":"就是讲这个工作与那个家庭。","sentence_en":"They talk about work and family."},{"id":"550","start":3628.53,"end":3631.15,"displayStart":3628.53,"displayEnd":3631.15,"displayMid":3629.84,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.4,"loudness":1.005182,"pitch":22.84487,"speechRate":8,"hasEvents":false,"sentence_source":"所以他们现在也就是陷入到这个困境了。","sentence_en":"So now they are stuck in this dilemma."},{"id":"551","start":3631.15,"end":3632.83,"displayStart":3631.15,"displayEnd":3632.83,"displayMid":3631.99,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.4,"loudness":1.089787,"pitch":27.609667,"speechRate":6.431,"hasEvents":false,"sentence_source":"然后就两个又都做不到。","sentence_en":"And then they can't do either."},{"id":"552","start":3632.83,"end":3634.53,"displayStart":3632.83,"displayEnd":3634.53,"displayMid":3633.6800000000003,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.3,"loudness":0.93944,"pitch":24.558279,"speechRate":5.882,"hasEvents":false,"sentence_source":"然后如果兼顾的话就难。","sentence_en":"It's difficult to juggle both."},{"id":"553","start":3634.53,"end":3639.71,"displayStart":3634.53,"displayEnd":3639.71,"displayMid":3637.12,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.933578,"pitch":20.767141,"speechRate":6.371,"hasEvents":false,"sentence_source":"所以大家都在考虑这个要怎么样一个出路，还是要从社会层面要采取一些措施。","sentence_en":"So everyone is thinking about a way out, and society needs to take measures."},{"id":"554","start":3639.71,"end":3653.01,"displayStart":3639.71,"displayEnd":3653.01,"displayMid":3646.36,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.987278,"pitch":21.493456,"speechRate":5.37,"hasEvents":false,"sentence_source":"然后给那个女的工作要找到好的一些支点，要支撑他们，目前的研究是研究那些名牌大学的，像那个哈佛呀，他们一样的问题，牛津毕业之后回去生孩子完了，在家带孩子了。","sentence_en":"And for women, we need to find good support points for their work. Current research focuses on elite universities like Harvard—same problem: Oxford graduates go home to have kids and then stay home."},{"id":"555","start":3653.01,"end":3657.83,"displayStart":3653.01,"displayEnd":3657.83,"displayMid":3655.42,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.3,"loudness":0.971925,"pitch":18.155602,"speechRate":6.696,"hasEvents":false,"sentence_source":"到现在还没有太多关注就是这个普通女性，就是这些学者写的这个文章。","sentence_en":"So far, there's not much attention on ordinary women—these scholars wrote this article."},{"id":"556","start":3657.83,"end":3660.97,"displayStart":3657.83,"displayEnd":3660.97,"displayMid":3659.3999999999996,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.801198,"pitch":19.27536,"speechRate":6.688,"hasEvents":false,"sentence_source":"但是我觉得这个困境也是我们所有人都有的我听。","sentence_en":"But I think this dilemma is something we all share, I hear."},{"id":"557","start":3660.97,"end":3662.93,"displayStart":3660.97,"displayEnd":3662.93,"displayMid":3661.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":0.996721,"pitch":25.928438,"speechRate":7.653,"hasEvents":false,"sentence_source":"你在哪里讲过一句话给我触动很深。","sentence_en":"You once said something somewhere that really struck me."},{"id":"558","start":3662.93,"end":3668.65,"displayStart":3662.93,"displayEnd":3668.65,"displayMid":3665.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.9669,"pitch":20.596987,"speechRate":7.092,"hasEvents":false,"sentence_source":"所以你说这个女性是需要，生活中需要参照样本的，这个样本不是来自于生活，就来自于文学作品。","sentence_en":"So you said women need role models in life, and these role models come not from life but from literature."},{"id":"559","start":3668.65,"end":3670.75,"displayStart":3668.65,"displayEnd":3670.75,"displayMid":3669.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.4,"loudness":1.260645,"pitch":25.065506,"speechRate":8.824,"hasEvents":false,"sentence_source":"其实这个特别重要，你刚刚讲到就是。","sentence_en":"Actually, this is very important, as you just mentioned."},{"id":"560","start":3670.75,"end":3676.17,"displayStart":3670.75,"displayEnd":3676.17,"displayMid":3673.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.066677,"pitch":23.114931,"speechRate":5.166,"hasEvents":false,"sentence_source":"我们从小到大看到那个女性所有的一些形象，人物却都有这种困境。","sentence_en":"From childhood, all the female images and characters we see face this dilemma."},{"id":"561","start":3676.17,"end":3682.93,"displayStart":3676.17,"displayEnd":3682.93,"displayMid":3679.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.016388,"pitch":21.60475,"speechRate":6.657,"hasEvents":false,"sentence_source":"那我记得我小时候看的一个好莱坞电影，差不多80年代我看的就是那个，《梅莲斯特里普》他免得可乐莫夫妇。","sentence_en":"I remember a Hollywood movie from my childhood, around the 80s—that one with Meryl Streep and Dustin Hoffman, 'Kramer vs. Kramer'."},{"id":"562","start":3682.93,"end":3691.39,"displayStart":3682.93,"displayEnd": ,"sentiment_en":"Neutral","score":-0.2,"loudness":0.998965,"pitch":20.935942,"speechRate":5.848,"hasEvents":false,"sentence_source":"然后从此孩子跟爸爸两人之间，重新开始建立他们陌生的关系与生活，最终夫妻两个人在法庭上。","sentence_en":"Then the father and child have to rebuild their unfamiliar relationship and life. Eventually, the couple is in court."},{"id":"566","start":3720.29,"end":3723.61,"displayStart":3720.29,"displayEnd":3723.61,"displayMid":3721.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.283446,"pitch":27.560654,"speechRate":7.407,"hasEvents":false,"sentence_source":"因为妈妈后来又独立以后有钱了，回来要领养孩子。","sentence_en":"Because the mother becomes independent and wealthy later, and comes back to claim the child."},{"id":"567","start":3724.03,"end":3730.27,"displayStart":3724.03,"displayEnd":3730.27,"displayMid":3727.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.185863,"pitch":18.155924,"speechRate":6.286,"hasEvents":false,"sentence_source":"然后产生一场法庭的戏，最后爸爸就是非常的慷慨即养，要留下孩子，最后孩子还是归了爸爸。","sentence_en":"There's a court scene, and in the end, the father is magnanimous and wants to keep the child—the child stays with him."},{"id":"568","start":3730.27,"end":3743.31,"displayStart":3730.27,"displayEnd":3743.31,"displayMid":3736.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.971348,"pitch":23.712364,"speechRate":5.681,"hasEvents":false,"sentence_source":"然后妈妈离开，你想对于我年轻的一个女孩，十几岁我看到人生就告诉你，有一天如果你要工作，有可能会面临这样的困境，她其实当时没有影响，我现在觉得也是一个很神奇的事情。","sentence_en":"Then the mother leaves. For me as a young girl in my teens, it showed me that one day if you work, you might face this dilemma. It didn't affect me then, but now I think it's quite strange."},{"id":"569","start": ,"loudness":0.823548,"pitch":22.576233,"speechRate":5.858,"hasEvents":false,"sentence_source":"但是它其实是非常有象征意义的，这个孩子当然不属于母亲，也不属于父亲属于自己的。","sentence_en":"But it's very symbolic. The child doesn't belong to the mother or the father—the child belongs to themselves."},{"id":"599","start":3953.47,"end":3956.95,"displayStart":3953.47,"displayEnd":3956.95,"displayMid":3955.21,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.716678,"pitch":17.802864,"speechRate":5.63,"hasEvents":false,"sentence_source":"因为他走自己的路，就如果从那个客观上来说。","sentence_en":"Because they walk their own path, objectively speaking."},{"id":"600","start":3956.95,"end":3964.55,"displayStart":3956.95,"displayEnd":3964.55,"displayMid":3960.75,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":-0.1,"loudness":0.737589,"pitch":14.927526,"speechRate":5.658,"hasEvents":false,"sentence_source":"但是社会是不是这样觉得的，家庭也不是这样觉得的，你会得出一些，你自己想走的一些方向，一些决定我。","sentence_en":"But society doesn't see it that way, and neither does the family. That helped me form some directions and decisions I wanted to take."},{"id":"601","start":3964.55,"end":3976.23,"displayStart":3964.55,"displayEnd":3976.23,"displayMid":3970.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.6,"loudness":1.065076,"pitch":24.143463,"speechRate":6.849,"hasEvents":false,"sentence_source":"发现你同年的你几个经历，都特别有电影画面感，充满了意象性，就是小女孩被公养，有脚的公养顶着一头包，特别有画面感 特别有一种意象的那种感觉，还有一个场景是我在一篇文章当中看到过。","sentence_en":"I find that many of your childhood experiences are very cinematic, full of imagery. Like the little girl being raised by great-grandfather, with a big head—very vivid and symbolic. I also saw another scene in an article."},{"id":"602","start":3976.23," ribe the scene exactly as you experienced it. That's a very important experience for me too."},{"id":"606","start":4001.93,"end":4004.91,"displayStart":4001.93,"displayEnd":4004.91,"displayMid":4003.42,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Women's Family Relationships and Psychology","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.027348,"pitch":24.583565,"speechRate":7.749,"hasEvents":false,"sentence_source":"然后我去找我姑 我跟我姑关一特别好，我特别爱她。","sentence_en":"Then I went to find my aunt. My aunt and I had a great relationship. I loved her a lot."},{"id":"607","start":4004.91,"end":4008.15,"displayStart":4004.91,"displayEnd":4008.15,"displayMid":4006.5299999999997,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.783871,"pitch":19.314882,"speechRate":6.486,"hasEvents":false,"sentence_source":"然后我就去找她，我一路上走了真的蛮久的。","sentence_en":"I went to see her and walked a really long way."},{"id":"608","start":4008.15,"end":4020.75,"displayStart":4008.15,"displayEnd":4020.75,"displayMid":4014.45,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.6,"loudness":1.035284,"pitch":21.659271,"speechRate":6.036,"hasEvents":false,"sentence_source":"所以我后来就是什么事情也不是特别害怕，是因为我小时候都那么狠，一抬脚都可以走好十几公里，特别小的时候，十几公里啊，你好厉害，小时候我肯定觉得一公里都是特别远的地方。","sentence_en":"Later in life, I wasn't afraid of many things because I was so bold as a kid. I could walk over ten kilometers at a very young age. Ten kilometers—that's impressive. When I was little, even one kilometer felt far."},{"id":"609","start":4020.75,"end":4022.09,"displayStart":4020.75,"displayEnd":4022.09,"displayMid":4021.42,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.794254,"pitch":24.11636,"speechRate":4.478,"hasEvents":false,"sentence_source":"你不怕丢了吗。","sentence_en":"Weren't you afraid of getting lost?"},{"id":"610","start":4022.09,"end":4027.03,"displayStart":4022.09,"displayEnd":4027.03,"displayMid":4024.5600000000004,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0.1,"loudness":0.969039,"pitch":21.759462,"speechRate":7.051,"hasEvents":false,"sentence_source":"所以就没有害怕呀，我听你当然你说你中后来看到一棵树，就是的确是这样子的。","sentence_en":"So I wasn't afraid. When you mentioned seeing a tree later, that's exactly how it was."},{"id":"611","start":4027.03,"end":4032.45,"displayStart":4027.03,"displayEnd":4032.45,"displayMid":4029.74,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.4,"loudness":1.027648,"pitch":23.894215,"speechRate":5.778,"hasEvents":false,"sentence_source":"因为那个树对我来是个标识，我顾家门口有一个粉色的荷环树 还挺好看的。","sentence_en":"That tree was a landmark for me. There was a pink hibiscus tree at the entrance of my aunt's house, and it was beautiful."},{"id":"612","start":4032.45,"end":4034.77,"displayStart":4032.45,"displayEnd":4034.77,"displayMid":4033.6099999999997,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0.1,"loudness":1.105531,"pitch":22.35594,"speechRate":6.834,"hasEvents":false,"sentence_source":"那个季节正好是那个树开花的时候。","sentence_en":"It happened to be the season when the tree was blooming."},{"id":"613","start":4034.77,"end":4037.79,"displayStart":4034.77,"displayEnd":4037.79,"displayMid":4036.2799999999997,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":0.839795,"pitch":18.066387,"speechRate":5.629,"hasEvents":false,"sentence_source":"然后他们就住在那个院子 我说我找到了。","sentence_en":"They lived in that courtyard, so I found it."},{"id":"614","start":4037.79,"end":4039.89,"displayStart":4037.79,"displayEnd":4039.89,"displayMid":4038.84,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":1.147476,"pitch":22.145702,"speechRate":6.667,"hasEvents":false,"sentence_source":"那是一个参照 小时候的参照是山。","sentence_en":"The reference point when I was little was a mountain."},{"id":"615","start":4040.35,"end":4048.11,"displayStart":4040.35,"displayEnd":4048.11,"displayMid":4044.23,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.867632,"pitch":19.429827,"speechRate":5.707,"hasEvents":false,"sentence_source":"我们家背后有一座山 一直往南走，就是我顾在家的比较靠南的地方，往北看山 然后一直往前走 就是往南。","sentence_en":"There was a mountain behind our house. Head south and my aunt's house was further south. Looking north at the mountain, I would walk straight south."},{"id":"616","start":4048.11,"end":4049.25,"displayStart":4048.11,"displayEnd":4049.25,"displayMid":4048.6800000000003,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.832159,"pitch":24.444435,"speechRate":7.442,"hasEvents":false,"sentence_source":"那路也不是特别多。","sentence_en":"There weren't many roads either."},{"id":"617","start":4049.25,"end":4052.95,"displayStart":4049.25,"displayEnd":4052.95,"displayMid":4051.1,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":0.871299,"pitch":19.422199,"speechRate":5.405,"hasEvents":false,"sentence_source":"所以我就定为我小时候比较有勇敢的一件事情。","sentence_en":"So I consider that one of my bravest childhood moments."},{"id":"618","start":4054.17,"end":4065.29,"displayStart":4054.17,"displayEnd":4065.29,"displayMid":4059.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":1.003529,"pitch":24.107443,"speechRate":5.785,"hasEvents":true,"sentence_source":"所以我就特别认同你说的那个，就是一个孩子 特别是小女孩，她在生活的成长过程当中，她小时候 她生活中一定有一个成年女性，就类似于一个姑姑 阿姨。","sentence_en":"So I really agree with what you said, that a child, especially a little girl, must have an adult woman in her life as she grows up, like an aunt or a maternal figure."},{"id":"619","start":4065.29,"end":4068.63,"displayStart":4065.29,"displayEnd":4068.63,"displayMid":4066.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.968411,"pitch":24.928165,"speechRate":5.389,"hasEvents":false,"sentence_source":"就是母亲以外的一个成年女性亲属的角色。","sentence_en":"That role of a female adult relative other than the mother is very important for a girl."},{"id":"620","start":4068.63,"end":4072.31,"displayStart":4068.63,"displayEnd":4072.31,"displayMid":4070.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.4,"loudness":0.89115,"pitch":19.9762,"speechRate":6.25,"hasEvents":false,"sentence_source":"对这个女孩是非常重要的，比如像我也有姑姑 或者表姐。","sentence_en":"For example, I had an aunt or older cousin."},{"id":"621","start":4072.67,"end":4079.99,"displayStart":4072.67,"displayEnd":4079.99,"displayMid":4076.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.5,"loudness":0.932432,"pitch":22.496717,"speechRate":5.17,"hasEvents":false,"sentence_source":"我们就会怀着一种特别亲近的 重庆的 羡慕的，很微妙的一个女孩的心态去看着她们。","sentence_en":"We would look at them with closeness, admiration, envy—a very subtle girl's mindset."},{"id":"622","start":4079.99,"end":4082.77,"displayStart":4079.99,"displayEnd":4082.77,"displayMid":4081.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":1.003707,"pitch":25.202717,"speechRate":8.439,"hasEvents":false,"sentence_source":"然后我记得很清楚 因为我有这样的 我也有姑姑。","sentence_en":"I remember it clearly because I also had an aunt."},{"id":"623","start":4082.77,"end":4097.49,"displayStart":4082.77,"displayEnd":4097.49,"displayMid":4090.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Negative","score":-0.7,"loudness":1.023189,"pitch":22.151463,"speechRate":4.858,"hasEvents":false,"sentence_source":"然后当这个姑姑或者表姐，她们恋爱 结婚的那个瞬间，我会有种巨大的失落和被背叛的感觉，这种背叛不是那种通常意义的背叛，是因为它背叛了我向往的一种不同的生活。","sentence_en":"When that aunt or cousin fell in love and got married, I felt a huge sense of loss and betrayal. This betrayal wasn't the usual kind; it was because it betrayed a different life I yearned for."},{"id":"624","start":4097.49,"end":4101.57,"displayStart":4097.49,"displayEnd":4101.57,"displayMid":4099.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Neutral","score":0,"loudness":0.912065,"pitch":22.223295,"speechRate":4.902,"hasEvents":false,"sentence_source":"你会认为你看我可以跟它一样，就一个人有工作。","sentence_en":"I thought I could be like her—someone with a job."},{"id":"625","start":4101.57,"end":4105.11,"displayStart":4101.57,"displayEnd":4105.11,"displayMid":4103.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Family, as women's growth","sentiment_en":"Positive","score":0.6,"loudness":0.91065,"pitch":16.57268,"speechRate":3.672,"hasEvents":false,"sentence_source":"然后特别帅 特别洒，无签无挂的。","sentence_en":"Very cool, very free, unattached."},{"id":"626","start":4105.11,"end":4110.95,"displayStart":4105.11,"displayEnd":4110.95,"displayMid":4108.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.976473,"pitch":26.467915,"speechRate":4.874,"hasEvents":false,"sentence_source":"然后你发现人终究有一天，都要过寻常的生活，要变回寻常的那个人。","sentence_en":"Then you realize that everyone eventually has to live an ordinary life and become an ordinary person."},{"id":"627","start":4110.95,"end":4111.97,"displayStart":4110.95,"displayEnd":4111.97,"displayMid":4111.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.967149,"pitch":19.446178,"speechRate":5.882,"hasEvents":false,"sentence_source":"那个瞬间你是。","sentence_en":"That moment you..."},{"id":"628","start":4111.97,"end":4126.41,"displayStart":4111.97,"displayEnd":4126.41,"displayMid":4119.1900000000005,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":-0.1,"loudness":0.878592,"pitch":19.926537,"speechRate":5.402,"hasEvents":false,"sentence_source":"很沮丧的在，我这发生的是可能时间比较漫长，我可能经过很多年才会反映过来，他这个选择是非常普通的，我估跟我怡对我的影响非常大，是因为还是阅读方面，我估他们家好像报纸特别多。","sentence_en":"I was very frustrated. What happened to me might have taken a long time, maybe many years, for me to realize that his choice was very ordinary. I think my aunt had a huge influence on me, mainly in terms of reading. It seemed like her family had a lot of newspapers."},{"id":"629","start":4126.41,"end":4140.89,"displayStart":4126.41,"displayEnd":4140.89,"displayMid":4133.65,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.833989,"pitch":15.341318,"speechRate":5.387,"hasEvents":false,"sentence_source":"而且都是新报纸，有的时候也就报纸，一打对暑假的时候，又呆在我顾假，我很少在我自己家，就看他们家报纸，都是一些杂志 报纸，当时挺小的 刚才认权字，差不多十岁 十一二岁的时候就在那看。","sentence_en":"And they were all new newspapers, sometimes just newspapers. During summer vacation, I stayed at my aunt's place. I rarely stayed at my own home, so I read their newspapers. They were all magazines and newspapers. I was quite young then, just learning to read, around ten or eleven years old, and I would read there."},{"id":"630","start":4140.89,"end":4143.37,"displayStart":4140.89,"displayEnd":4143.37,"displayMid":4142.13,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.902497,"pitch":20.677345,"speechRate":4.662,"hasEvents":false,"sentence_source":"一直看到我都高中毕业。","sentence_en":"I kept looking at her until I graduated from high school."},{"id":"631","start":4143.37,"end":4151.03,"displayStart":4143.37,"displayEnd":4151.03,"displayMid":4147.2,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.4,"loudness":0.91024,"pitch":21.777067,"speechRate":6.171,"hasEvents":false,"sentence_source":"因为他们教书的，我辜负还是个小学的校长，就阅读方面材料还是很丰富的然后，我最感兴趣的点还是复刊。","sentence_en":"She was a teacher, and my aunt was actually an elementary school principal, so there were plenty of reading materials. What interested me most were the literary supplements."},{"id":"632","start":4151.03,"end":4153.13,"displayStart":4151.03,"displayEnd":4153.13,"displayMid":4152.08,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.650459,"pitch":18.757313,"speechRate":5.238,"hasEvents":false,"sentence_source":"然后那个文学方面的东西。","sentence_en":"And the literary stuff."},{"id":"633","start":4153.13,"end":4167.09,"displayStart":4153.13,"displayEnd":4167.09,"displayMid":4160.110000000001,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.5,"loudness":0.835695,"pitch":15.539783,"speechRate":5.35,"hasEvents":false,"sentence_source":"所以对于我小时候塑造也是很重要的，现在自己也在那个复刊上，或者我其实很早开始了，写文章读博士的时候就开始写这些文章，我后来想跟我十几年的这种状态还是有关的。","sentence_en":"So it was very important in shaping my childhood. Now I'm writing on those supplements myself—I actually started early, writing articles during my PhD. Later I thought it was related to this influence over the years."},{"id":"634","start":4167.09,"end":4169.85,"displayStart":4167.09,"displayEnd":4169.85,"displayMid":4168.47,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":1.055466,"pitch":21.698246,"speechRate":7.423,"hasEvents":false,"sentence_source":"我一去意大利看意大利报纸也看报纸复刊。","sentence_en":"When I went to Italy, I also read Italian newspaper supplements."},{"id":"635","start":4169.85,"end":4172.87,"displayStart":4169.85,"displayEnd":4172.87,"displayMid":4171.360000000001,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":1.062755,"pitch":26.614979,"speechRate":5.975,"hasEvents":false,"sentence_source":"然后你就知道你这是一个很漫长的过程。","sentence_en":"Then you know it's a long process."},{"id":"636","start":4172.87,"end":4176.59,"displayStart":4172.87,"displayEnd":4176.59,"displayMid":4174.73,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.5,"loudness":0.845423,"pitch":19.472713,"speechRate":5.108,"hasEvents":false,"sentence_source":"其实是一种长时间的引导，如果没有我估的话。","sentence_en":"It's really a long-term guidance. If it weren't for my aunt..."} ,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Cultural life in various cities","sentiment_en":"Negative","score":-0.4,"loudness":0.99616,"pitch":22.399113,"speechRate":6.004,"hasEvents":false,"sentence_source":"因为我们是五年毕业，小的时候你一年，你会觉得整个世界都不一样了，你就很怕外面的热闹跟你无关，你错过了，恰恰大学毕业以后你会发现。","sentence_en":"Because our program was five years; when you're young, one year changes everything, and you fear missing out, but after graduation you realize life is long."},{"id":"646","start":4220.82,"end":4229,"displayStart":4220.82,"displayEnd":4229,"displayMid":4224.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Cultural life in various cities","sentiment_en":"Positive","score":0.7,"loudness":0.823723,"pitch":21.773876,"speechRate":5.134,"hasEvents":false,"sentence_source":"其实人生是个那么漫长的过程，你不用着急，但我会感觉你是一直按你的节奏在走，我从小就这种性格。","sentence_en":"Actually, life is a long process, you don't need to rush. But I feel you've always followed your own rhythm. I've been this way since childhood."},{"id":"647","start":4229,"end":4230.54,"displayStart":4229,"displayEnd":4230.54,"displayMid":4229.77,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":1.32754,"pitch":27.718296,"speechRate":6.452,"hasEvents":true,"sentence_source":"我们闪现话叫很凉。","sentence_en":"In our slang, we call it 'very cool.'"},{"id":"649","start":4260.88,"end":4262.92,"displayStart":4260.88,"displayEnd":4262.92,"displayMid":4261.9,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":0.972265,"pitch":23.827282,"speechRate":7.692,"hasEvents":false,"sentence_source":"我都上初中了 初中大姑娘了。","sentence_en":"I was already in middle school, a big girl."},{"id":"650","start":4262.92,"end":4271.16,"displayStart":4262.92,"displayEnd":4271.16,"displayMid":4267.04,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.91957,"pitch":15.968616,"speechRate":5.704,"hasEvents":false,"sentence_source":"然后坐在那个上数学 我就说又不敢进去，我就睡觉 然后老师就粉笔就过来了 打我，我当时有个睡觉 我同桌也睡觉。","sentence_en":"Then in math class, I was too afraid to go in, so I fell asleep. The teacher threw a piece of chalk at me. I was sleeping, and so was my deskmate."},{"id":"651","start":4271.16,"end":4277.04,"displayStart":4271.16,"displayEnd":4277.04,"displayMid":4274.1,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.905802,"pitch":17.183611,"speechRate":5.612,"hasEvents":false,"sentence_source":"然后我们俩就被拎起来站在那个讲台旁边，我站到我也在打课水 然后也要睡觉。","sentence_en":"Then we were both dragged to stand by the podium. I stood there, still drowsy, wanting to sleep."},{"id":"652","start":4277.7,"end":4290.5,"displayStart":4277.7,"displayEnd":4290.5,"displayMid":4284.1,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.5,"loudness":0.955148,"pitch":22.222744,"speechRate":6.032,"hasEvents":false,"sentence_source":"然后我觉得这个脸皮实在是太厚了，我后来想起这事 脸皮后到这个地步 简直是天赋，后来我觉得我的心理素质可能没那么好了，用现在的话说就是松齿呗 松齿，就也太送车行都行不来。","sentence_en":"I thought I was really thick-skinned. Looking back, being that thick-skinned is almost a talent. Later I felt my mental resilience wasn't that good. In modern terms, it's being too relaxed."},{"id":"653","start":4290.5,"end":4295.64,"displayStart":4290.5,"displayEnd":4295.64,"displayMid":4293.07,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.948491,"pitch":19.465452,"speechRate":6.903,"hasEvents":false,"sentence_source":"你就想你如果被老师叫到前面去，肯定都要羞愧死了，肯定要哭吧，一个小姑娘的反应。","sentence_en":"Imagine if you were called to the front by the teacher—you'd be mortified, you'd cry. That's the reaction of a little girl."},{"id":"654","start":4295.64,"end":4304.34,"displayStart":4295.64,"displayEnd":4304.34,"displayMid":4299.99,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Positive","score":0.6,"loudness":0.830033,"pitch":17.002846,"speechRate":6.432,"hasEvents":false,"sentence_source":"然后我就觉得当时很淡定，不知道为什么哪来的这个，这是天赋我觉得，最近一直在想天赋这个事情，我跟同学也在讨论这个问题。","sentence_en":"But I was very calm then. I don't know where that came from. I think it's a talent. Lately I've been thinking about talent, and I discussed it with classmates."},{"id":"655","start":4304.34,"end":4306.56,"displayStart":4304.34,"displayEnd":4306.56,"displayMid":4305.450000000001,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":1.059471,"pitch":20.589571,"speechRate":7.194,"hasEvents":false,"sentence_source":"因为天赋在意大利语的古代的语言。","sentence_en":"Because talent, in ancient Italian..."},{"id":"656","start":4306.56,"end":4308.5,"displayStart":4306.56,"displayEnd":4308.5,"displayMid":4307.530000000001,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Personal Growth","sentiment_en":"Neutral","score":0,"loudness":0.973777,"pitch":19.647558,"speechRate":7.216,"hasEvents":false,"sentence_source":"那个词的语言叫Talent吗。","sentence_en":"The word is 'talent', right?"},{"id":"657","start":4308.5,"end":4313.48,"displayStart":4308.5,"displayEnd":4313.48,"displayMid":4310.99,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":1.004251,"pitch":23.080637,"speechRate":5.912,"hasEvents":false,"sentence_source":"对，意大利就Dalendo一样的，包括另外一个词叫Genius。","sentence_en":"Yes, in Italian it's 'talento', and also another word 'genius'."},{"id":"658","start":4313.48,"end":4315.32,"displayStart":4313.48,"displayEnd":4315.32,"displayMid":4314.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Neutral","score":0,"loudness":0.999347,"pitch":17.836201,"speechRate":7.609,"hasEvents":false,"sentence_source":"ius 是吗，Genius 这个词。","sentence_en":"ius, right? The word 'genius'."},{"id":"659","start":4315.32,"end":4328.36,"displayStart":4315.32,"displayEnd":4328.36,"displayMid":4321.84,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.5,"loudness":0.891014,"pitch":18.094719,"speechRate":5.905,"hasEvents":false,"sentence_source":"次在意大利的词根在最初的时候，他不是天父的意思 他是欢喜 他是渴望，最重要的是我就在这儿欺判，他有那个情绪在里头的，为什么说大家都说不存在天父，天父背后其实就是一种喜欢。","sentence_en":"In Italian, the root originally didn't mean 'talent', it meant 'joy' and 'desire'. The key is that it contains emotion. Why do people say talent doesn't exist? Behind talent is actually a kind of liking."},{"id":"660","start":4328.36,"end":4330.74,"displayStart":4328.36,"displayEnd":4330.74,"displayMid":4329.549999999999,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.4,"loudness":0.87071,"pitch":13.542225,"speechRate":3.361,"hasEvents":false,"sentence_source":"一种兴趣 一种爱好。","sentence_en":"An interest, a hobby."},{"id":"661","start":4330.74,"end":4332.76,"displayStart":4330.74,"displayEnd":4332.76,"displayMid":4331.75,"speaker":"Chen Ying","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Academic & Career Experience","sentiment_en":"Positive","score":0.6,"loudness":0.909996,"pitch":16.26808,"speechRate":5.187,"hasEvents":false,"sentence_source":"然后一种激情在支撑。","sentence_en":"And a passion that supports it."},{"id":"662","start":4
