ly didn’t go home much."},{"id":"115","start":803.7,"end":816.82,"displayStart":803.7,"displayEnd":816.82,"displayMid":810.26,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Background and Educational Resources","sentiment_en":"Neutral","score":0,"loudness":0.975015,"pitch":24.918304,"speechRate":5.75,"hasEvents":false,"sentence_source":"但你知道有的时候，当一个孩子跟父母在地理空间上离得远的话，他有些时候会因为离家过早，可能慢慢太过独立，跟父母的关系好像就没有那么的亲密，会有些疏离，但你好想反。","sentence_en":"But you know, sometimes when a child is geographically far from parents, they might become too independent too early and the relationship becomes less close, more distant. But you seem the opposite."},{"id":"116","start":816.82,"end":825.08,"displayStart":816.82,"displayEnd":825.08,"displayMid":820.95,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Background and Educational Resources","sentiment_en":"Positive","score":0.6,"loudness":0.968318,"pitch":22.410213,"speechRate":6.174,"hasEvents":false,"sentence_source":"你一直哪怕你们在不同的城市，离得越来越远，但你们一直保持很亲密的关系，我今年还写过，你要给爸妈发牛，就电话的短信。","sentence_en":"You’ve always kept a very close relationship even though you’re in different cities, farther apart. This year I even saw you send text messages to your parents."},{"id":"117","start":825.08,"end":828.68,"displayStart":825.08,"displayEnd":828.68,"displayMid":826.88,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Background and Educational Resources","sentiment_en":"Positive","score":0.5,"loudness":0.948832,"pitch":24.206772,"speechRate":5.833,"hasEvents":false,"sentence_source":"然后会表达你能够观察到的生活，特别细微的感受。","sentence_en":"And you share really detailed observations about your daily life."},{"id":"118","start":828.68,"end":830.02,"displayStart":828.68,"displayEnd":830.02,"displayMid":829.3499999999999,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family Back 78,"speechRate":6.356,"hasEvents":false,"sentence_source":"然后比如说如果树叶变黄了，我会拿这小本子这样记下，我说那天晚上我要把这个事情，写到我的140字段信里面，我要发给我的父母。","sentence_en":"Like if the leaves turned yellow, I’d write it down in the notebook, and that night I’d put it into a 140-character message to send to my parents."},{"id":"123","start":854.34,"end":866.74,"displayStart":854.34,"displayEnd":866.74,"displayMid":860.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Negative","score":-0.5,"loudness":0.864287,"pitch":26.83634,"speechRate":5.035,"hasEvents":false,"sentence_source":"其实我想能够保持亲密的关系，主要原因是因为我没有感觉到，他们对我有任何的要求，离开父母的生活真的非常困难，每一天对于那个时候的我来说。","sentence_en":"I think we could stay close mainly because I never felt they had any expectations of me. Living away from parents was really hard. Every day at that time,"},{"id":"124","start":866.74,"end":871.78,"displayStart":866.74,"displayEnd":871.78,"displayMid":869.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":0.825256,"pitch":30.07712,"speechRate":5.556,"hasEvents":false,"sentence_source":"比如自己洗衣服自己做家务都是困难的事情，是我正在学习的事情。","sentence_en":"things like washing my own clothes and doing housework were difficult—things I was learning."},{"id":"125","start":871.78,"end":878.88,"displayStart":871.78,"displayEnd":878.88,"displayMid":875.3299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Positive","score":0.5,"loudness":0.849981,"pitch":27.107876,"speechRate":5.775,"hasEvents":false,"sentence_source":"但是我同时也清楚的意识到这是我自己的选择，我选了这么困难的生活，我父母我不能够怪罪他们。","sentence_en":"But I'm also acutely aware that this was my own choice. I chose such a difficult life, and I can't blame my parents for it."},{"id":"126","start":878.88,"end":881.08,"displayStart":878.88,"displayEnd":881.08,"displayMid":879.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Positive","score":0.4,"loudness":0.693305,"pitch":27.670496,"speechRate":6.818,"hasEvents":false,"sentence_source":"其实你可以说这是他们教育的成果。","sentence_en":"Actually, you could say it's the result of their parenting."},{"id":"127","start":881.08,"end":893.66,"displayStart":881.08,"displayEnd":893.66,"displayMid":887.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Positive","score":0.7,"loudness":0.885319,"pitch":27.246933,"speechRate":5.399,"hasEvents":false,"sentence_source":"因为我在心里也觉得，我人生中的困难是我自己选择的后果，在这一点上我觉得他们是非常睿智的教育者，他们总是会让我在两个他们想让我做的选择之间挑选。","sentence_en":"Because deep down I feel that the hardships in my life are the consequences of my own choices. In that sense, I think they were very wise educators—they always let me choose between two options they wanted me to take."},{"id":"128","start":893.66,"end":902.66,"displayStart":893.66,"displayEnd":902.66,"displayMid":898.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":0.828372,"pitch":25.791927,"speechRate":6.356,"hasEvents":false,"sentence_source":"最后的结果是 我感觉这一切都是我选择的，就比如说 我清楚的记得我小时候那会儿，所有的家长都把自己的小孩往国学培训班里面送。","sentence_en":"The end result is that I feel everything was my choice. For instance, I clearly remember when I was little, all parents were sending their kids to traditional Chinese studies classes."},{"id":"129","start":902.66,"end":906.28,"displayStart":902.66,"displayEnd":906.28,"displayMid":904.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":0.760866,"pitch":26.123493,"speechRate":6.63,"hasEvents":false,"sentence_source":"然后有一天我回家 我跟我妈说我能不能不上这个培训班。","sentence_en":"Then one day I came home and asked my mom if I could skip that class."},{"id":"130","start":906.28,"end":916.3,"displayStart":906.28,"displayEnd":916.3,"displayMid":911.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":0.937596,"pitch":30.544159,"speechRate":5.51,"hasEvents":false,"sentence_source":"然后我妈说 不上培训班可以，你可以在培训班和自学之间选，如果你选择了自学 那你每天晚上睡前必须要，给我背一个小时的轮女。","sentence_en":"She said, 'You don't have to go to class, but you can choose between the class and self-study. If you choose self-study, you have to recite the Analects to me for an hour every night before bed."},{"id":"131","start":916.3,"end":923.82,"displayStart":916.3,"displayEnd":923.82,"displayMid":920.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":0.925217,"pitch":31.368362,"speechRate":6.32,"hasEvents":false,"sentence_source":"然后我就灰溜溜地选择了自学，我妈就说 这是你自己的选择，你在这个事情上 你既然选择了，你就要为子负责。","sentence_en":"So I sheepishly chose self-study. My mom said, 'This is your own choice. Since you chose it, you have to be responsible for it."},{"id":"132","start":923.82,"end":935.4,"displayStart":923.82,"displayEnd":935.4,"displayMid":929.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Positive","score":0.4,"loudness":0.937303,"pitch":29.144814,"speechRate":6.39,"hasEvents":false,"sentence_source":"然后我就真的就轻轻恳恳的，一个人在家里面，每一天睡前给他备一个小时的轮女，我的心中这个选择是我自己做的，是我自由的代价，最后去技术学校也是这样，随之慢慢慢慢长大。","sentence_en":"And I really did it diligently, alone at home, reciting the Analects for an hour every night. In my heart, this was my own choice—the price of my freedom. Later, going to vocational school was the _source":"但是如果你每个选择是你自己，小他实地的走出来做出来的话。","sentence_en":"But if every choice is your own, something you personally stepped out and made happen,"},{"id":"141","start":981.54,"end":985.02,"displayStart":981.54,"displayEnd":985.02,"displayMid":983.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Negative","score":-0.5,"loudness":0.925639,"pitch":29.903891,"speechRate":6.609,"hasEvents":false,"sentence_source":"那你其实无法责怪别人，你只能够打醉了牙往肚子里咽。","sentence_en":"then you really can't blame anyone else. You just have to grit your teeth and swallow it."},{"id":"142","start":985.58,"end":988.88,"displayStart":985.58,"displayEnd":988.88,"displayMid":987.23,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":1.05291,"pitch":23.230055,"speechRate":6.494,"hasEvents":false,"sentence_source":"你知道还有一点，就是一个小孩很早的独立你会。","sentence_en":"You know another thing—when a child becomes independent very early,"},{"id":"143","start":988.88,"end":1000.66,"displayStart":988.88,"displayEnd":1000.66,"displayMid":994.77,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Neutral","score":0,"loudness":1.000167,"pitch":22.16227,"speechRate":5.772,"hasEvents":false,"sentence_source":"因为你终究意识到人生会在某一个时刻，就你会要失去你的依赖，比如说你的家或者你离开你的父母，这一天早晚会来到，只是我们可能会把这个时间向前提了一点。","sentence_en":"you eventually realize that at some point in life, you'll lose your dependencies, like your home or your parents. That day will come sooner or later; we just moved it forward a bit."},{"id":"144","start":1000.66,"end":1002.1,"displayStart":1000.66,"displayEnd":1002.1,"displayMid":1001.38,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"N  Education and Growth Choices","sentiment_en":"Positive","score":0.5,"loudness":0.803929,"pitch":26.104956,"speechRate":5.583,"hasEvents":false,"sentence_source":"但是正是因为我对于我父母的连结很深。","sentence_en":"But precisely because my connection with my parents was so deep,"},{"id":"149","start":1022.72,"end":1031.2,"displayStart":1022.72,"displayEnd":1031.2,"displayMid":1026.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"School Education and Growth Choices","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.864123,"pitch":29.139687,"speechRate":5.778,"hasEvents":false,"sentence_source":"所以说离开他们的过程，是一个很漫长的过程，我当时我都绝望了，感觉好像离家了之后，再也不能回到妈妈的怀抱了人。","sentence_en":"the process of leaving them was a long one. At that time I was in despair—I felt that after leaving home, I could never return to my mother's embrace."},{"id":"150","start":1031.2,"end":1035.12,"displayStart":1031.2,"displayEnd":1035.12,"displayMid":1033.1599999999999,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Negative","score":-0.6,"loudness":0.996037,"pitch":27.925245,"speechRate":5.357,"hasEvents":false,"sentence_source":"生一片灰暗 不想要做大人，哎 你看那样的一个经历。","sentence_en":"Life was bleak; I didn't want to become an adult. Ah, you see, that kind of experience."},{"id":"151","start":1035.12,"end":1039.82,"displayStart":1035.12,"displayEnd":1039.82,"displayMid":1037.4699999999998,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Negative","score":-0.5,"loudness":0.969147,"pitch":23.696995,"speechRate":5.87,"hasEvents":false,"sentence_source":"我们想象一个孩子那么小，他因为离家每天都觉得活得特别痛苦。","sentence_en":"Imagine a child so young, every day feeling deeply pained because he left home."},{"id":"152","start":1039.82,"end":1041.96,"displayStart":1039.82,"displayEnd":1041.96,"displayMid":1040.8899999999999,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Positive","score":0.4,"loudness":0.908298,"pitch":24.271646,"speechRate":6.341,"hasEvents":false,"sentence_source":"但是并没有因此带来某种创伤。","sentence_en":"Yet it didn't cause any trauma."},{"id":"153","start":1041.96,"end":1045.12,"displayStart":1041.96,"displayEnd":1045.12,"displayMid":1043.54,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Neutral","score":0,"loudness":1.083381,"pitch":29.577141,"speechRate":5.674,"hasEvents":false,"sentence_source":"因为我性格上，我总是觉得我是一个天。","sentence_en":"Because in terms of my personality, I always felt I was a..."},{"id":"154","start":1045.12,"end":1060.46,"displayStart":1045.12,"displayEnd":1060.46,"displayMid":1052.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Negative","score":-0.6,"loudness":0.964823,"pitch":29.166052,"speechRate":4.694,"hasEvents":false,"sentence_source":"生就有点惶恐敏感，而且非常脆弱，相对而言，并不是一个能够在人群中集齐特别大的能量，网坏了说这可能是一种阴谕固执和纠结，我会不愿意向外界屈服，因此又很容易崩溃。","sentence_en":"I was born somewhat fearful, sensitive, and very fragile. Relatively speaking, I am not someone who can gather great energy in a crowd. To put it badly, this might be a kind of gloom, stubbornness, and entanglement. I am unwilling to yield to the outside world, and therefore I easily break down."},{"id":"155","start":1060.46,"end":1073.16,"displayStart":1060.46,"displayEnd":1073.16,"displayMid":1066.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intimate Relationships and Marriage","sentiment_en":"Neutral","score":0,"loudness":0.893187,"pitch":27.356419,"speechRate":5.308,"hasEvents":true,"sentence_source":"因为我并不是一个天生就很强大的人，我现在还是一个就是比较固执纠结，为什么能够这样的人在什么样的契机下，教育环境中能够成为一个感爱感恨的人生。","sentence :"How to view elderly people's stubbornness? But now I can use this framework to discuss the same issues. For example, I once had a podcast episode called 'Kant and Aristotle on How to Lose Weight.' Before that, I might have just thought about the problem simply."},{"id":"265","start":1830.59,"end":1845.89,"displayStart":1830.59,"displayEnd":1845.89,"displayMid":1838.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.877578,"pitch":28.673424,"speechRate":5.187,"hasEvents":false,"sentence_source":"但是我后来发现我可以借哲学的视角去思考同一类的问题，太阳底下无心事 我们困惑的同一批问题，几百年前已经被一批比我更聪明的人讨论过了，我可以借他们的大脑去思考全新的问题。","sentence_en":"But later I found I could use a philosophical perspective to think about the same kind of problems. There's nothing new under the sun—the same questions we're puzzled by were discussed hundreds of years ago by people smarter than me. I can borrow their minds to think about new issues."},{"id":"266","start":1845.89,"end":1851.79,"displayStart":1845.89,"displayEnd":1851.79,"displayMid":1848.8400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Neutral","score":0,"loudness":0.85642,"pitch":28.183489,"speechRate":6.072,"hasEvents":false,"sentence_source":"对于真理的求之欲和对于八卦的求之欲对我来说是无法区分这两者的区别。","sentence_en":"For me, the desire for truth and the desire for gossip are indistinguishable."},{"id":"267","start":1851.79,"end":1862.41,"displayStart":1851.79,"displayEnd":1862.41,"displayMid":1857.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Positive","score":0.6,"loudness":0.988644,"pitch":29.27314,"speechRate":5.952,"hasEvents":false,"sentence_source":"对于我来说就是学习就是在搞八卦 探索八卦，学习对我来说等于是最绘色的八卦，我第一次想到这个想法是我发现，比如说柏拉圖这辈子写的所有著作。","se 为因为。","sentence_en":"So that barrier is there. You can feel it. How do you break it? It's very hard, because, because..."},{"id":"336","start":2311.09,"end":2325.47,"displayStart":2311.09,"displayEnd":2325.47,"displayMid":2318.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.865937,"pitch":27.073868,"speechRate":5.007,"hasEvents":false,"sentence_source":"他们保持的是表面上的体验，这不是一种侮辱 这不是一种拒绝，这是一种非常疏离的接受，就是你知道你进入不了他们的内部的小圈子，我至今都还知道有一些我认知的教授。","sentence_en":"They maintain a surface-level experience, it's not an insult or rejection, but a very distant acceptance—you know you can't get into their inner circle. I still know some professors I'm acquainted with."},{"id":"337","start":2325.47,"end":2336.23,"displayStart":2325.47,"displayEnd":2336.23,"displayMid":2330.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.843454,"pitch":28.669544,"speechRate":5.762,"hasEvents":false,"sentence_source":"他就是会对他喜欢的男同学说一些他对女同学不会说的话，他可能会觉得我可以跟男同学的关系更加亲密，而且我身边也有很多我们戏除了我之外。","sentence_en":"He would say things to male classmates he likes that he wouldn't say to female classmates. He might think he can be closer with male classmates. And besides me, there are many others in our circle."},{"id":"338","start":2336.23,"end":2347.25,"displayStart":2336.23,"displayEnd":2347.25,"displayMid":2341.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.860446,"pitch":31.423248,"speechRate":5.808,"hasEvents":false,"sentence_source":"还有两个女同学 那两个女同学都是白人女同学，她们跟我抱怨 她们觉得跟男同学做读书会的时候，自己讲的话 可能会被男同学在五分钟之后重新说一点。","sentence_en":"There are also two female classmates, both white, who complained to me that during study groups with male classmates, their points would be rephrased by a male classmate five minutes later."},{"id":"339","start":2347.25,"end":2351.49,"displayStart":2347.25,"displayEnd":2351.49,"displayMid":2349.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Lifestyle and Self-Expression","sentiment_en":"Negative","score":-0.4,"loudness":0.778754,"pitch":30.808111,"speechRate":6.84,"hasEvents":false,"sentence_source":"然后当成那个男同学的两法，就这种事情 我觉得大家都要有这个经历。","sentence_en":"And then he would take credit for it. I think everyone has had this experience."},{"id":"340","start":2351.49,"end":2362.85,"displayStart":2351.49,"displayEnd":2362.85,"displayMid":2357.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.783562,"pitch":29.808079,"speechRate":6.514,"hasEvents":false,"sentence_source":"我觉得只有两种方式 对吧 一种就是你可以就是不理他，不让他影响到你 我也可以跟女同学 我也可以跟中国同学，组建我们自己的小军体 我们可以在自己的小军体里面吐槽他们。","sentence_en":"I think there are only two ways, right? One is you can ignore him, not let him affect you. I can also team up with female classmates or Chinese classmates, form our own small group, and vent about them."},{"id":"341","start":2363.97,"end":2366.83,"displayStart":2363.97,"displayEnd":2366.83,"displayMid":2365.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":1.057073,"pitch":33.665379,"speechRate":6.464,"hasEvents":false,"sentence_source":"这是一种方式 另外一种方式 我觉得就是。","sentence_en":"That's one way. The other way, I think, is..."},{"id":"342","start":2366.83,"end":2380.11,"displayStart":2366.83,"displayEnd":2380.11,"displayMid":2373.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.7,"loudness":0.80147,"pitch":30.435202,"speechRate":5.346,"hasEvents":false,"sentence_source":"因为毕竟我们是在专业的方面 在自己深深的热爱的领域，在跟别人进行交流 我可以单单在专业方面，我去说服你 我告诉你 我就是一个，在我这个专业上 我们不想上下的人。","sentence_en":"Because after all, we are communicating in our professional field, in an area we deeply love. I can, purely on professional grounds, convince you—I'll tell you that I am someone who is your equal in this field."},{"id":"343","start":2380.11,"end":2383.19,"displayStart":2380.11,"displayEnd":2383.19,"displayMid":2381.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.6,"loudness":0.856986,"pitch":29.333223,"speechRate":5.195,"hasEvents":false,"sentence_source":"那最终你还是配拓 因为我的努力承认。","sentence_en":"Then in the end, you still have to acknowledge it because of my efforts."},{"id":"344","start":2383.19,"end":2393.77,"displayStart":2383.19,"displayEnd":2393.77,"displayMid":2388.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.5,"loudness":0.852279,"pitch":26.519278,"speechRate":6.049,"hasEvents":false,"sentence_source":"我们在这个专业上 我们就是可以平起平坐的，试博打架 那之前您让我推荐一本书，我想说这个也是其实是我博导的博导，施克莱在学术界的经历也是这样。","sentence_en":"We can stand on equal footing in this field. Speaking of which, earlier you asked me to recommend a book. I want to say that this is also the story of my advisor's advisor, Shklar's experience in academia."},{"id":"345","start":2395.09,"end":2400.59,"displayStart":2395.09,"displayEnd":2400.59,"displayMid":2397.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.844494,"pitch":31.74369,"speechRate":6.727,"hasEvents":false,"sentence_source":"除了他之外 其实唯一的另外一个政治理论的女性就是，Hanna Arrant 阿伦特。","sentence_en":"Besides her, really the only other female political theorist was Hannah Arendt."},{"id":"346","start":2401.41,"end":2412.17,"displayStart":2401.41,"displayEnd":2412.17,"displayMid":2406.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.913554,"pitch":31.535017,"speechRate":6.373,"hasEvents":false,"sentence_source":"我觉得施克莱跟他当时同期的所有，跟他一个地位的男性学者的区别就在于，他其实没有建立一个自己的门派，施克莱没有自己的追随者，他当时在哈佛是唯一一个。","sentence_en":"I think the difference between Shklar and all her male peers of the same status is that she didn't establish her own school of thought. Shklar had no disciples. She was the only one at Harvard."},{"id":"347","start":2412.17,"end":2419.93,"displayStart":2412.17,"displayEnd":2419.93,"displayMid":2416.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.6,"loudness":0.84235,"pitch":29.861477,"speechRate":5.155,"hasEvents":false,"sentence_source":"第一个在政治系被拿到终身教职的女性，我刚才说的他的处境其实至今对我来说都非常有帮助。","sentence_en":"She was the first woman in the political science department to get tenure. Her situation, as I just described, is still very helpful to me."},{"id":"348","start":2419.93,"end":2432.99,"displayStart":2419.93,"displayEnd":2432.99,"displayMid":2426.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.830671,"pitch":29.166735,"speechRate":5.207,"hasEvents":false,"sentence_source":"因为我博导跟我说 当时在哈佛 他明明已经出版了很多著作，在哈佛 在我向我博导教的博士生，他的教学数量 他的学术成绩跟其他所有的男老师的成绩是差不多的。","sentence_en":"Because my advisor told me that at Harvard, she had already published many works. In terms of teaching load and academic output, she was on par with all the male professors."},{"id":"349","start":2432.99,"end":2437.87,"displayStart":2432.99,"displayEnd":2437.87,"displayMid":2435.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.908803,"pitch":26.366121,"speechRate":8.05,"hasEvents":false,"sentence_source":"但是学校就是不给他一个终身教职 他不给他 Tenured Professorship。","sentence_en":"But the school just wouldn't give her a tenured professorship."},{"id":"350","start":2437.87,"end":2445.85,"displayStart":2437.87,"displayEnd":2445.85,"displayMid":2441.8599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.863486,"pitch":33.876331,"speechRate":6.974,"hasEvents":false,"sentence_source":"但是不给他那个终身教职又有点说不过去，于是他们就为了这个女的发明了一个职位 叫做 Tenured Lectures。","sentence_en":"But denying her tenure was hard to justify, so they invented a position for her called 'Tenured Lecturer'."},{"id":"351","start":2445.85,"end":2451.45,"displayStart":2445.85,"displayEnd":2451.45,"displayMid":2448.6499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.87372,"pitch":33.673351,"speechRate":5.357,"hasEvents":false,"sentence_source":"我们都知道讲师的职位就是比教授要低的，他给他发明了一个终身奖师。","sentence_en":"We all know a lecturer is lower than a professor. They invented a tenured lecturer for her."},{"id":"352","start":2451.45,"end":2465.31,"displayStart":2451.45,"displayEnd":2465.31,"displayMid":2458.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.8,"loudness":0.80449,"pitch":32.20665,"speechRate":5.339,"hasEvents":false,"sentence_source":"那你说这个算是什么意思，而且我不倒正经 人家一杯便宜，他跟我说 斯克莱的工资是男教授的一半，做同样的职位 做同样的研究 出同样的书，带同样的博士生只能够拿一半的工资。","sentence_en":"What does that even mean? And not only that, it was unfair. He told me Shklar's salary was half that of a male professor—doing the same job, same research, publishing same books, advising same PhD students, but only half the pay."},{"id":"353","start":2465.31,"end":2467.51,"displayStart":2465.31,"displayEnd":2467.51,"displayMid":2466.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.762178,"pitch":27.284203,"speechRate":4.545,"hasEvents":false,"sentence_source":"当时校方给他的解释是。","sentence_en":"The school's explanation at the time was:"},{"id":"354","start":2467.51,"end":2477.75,"displayStart":2467.51,"displayEnd":2477.75,"displayMid":2472.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.887587,"pitch":32.705704,"speechRate":6.738,"hasEvents":false,"sentence_source":"因为斯克莱还有三个小孩，他说 你要是一个tenured lectureship，你要只是一个奖师的话，你随时想要放弃你的学术生量回归家庭生活，你都可以。","sentence_en":"Because Shklar has three children,' they said. 'If you have a tenured lectureship, if you're just a lecturer, you can give up your academic career and return to family life whenever you want."},{"id":"355","start":2477.75,"end":2488.27,"displayStart":2477.75,"displayEnd":2488.27,"displayMid":2483.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.907143,"pitch":33.610386,"speechRate":6.084,"hasEvents":false,"sentence_source":"所以说我们就没有给你这个学术压力让你非要在这里硬撑，结果 诗克莱是顶着这个中生讲师的职位，他就是我们刚才描绘的那个情况的严重100倍吗。","sentence_en":"So we're not giving you the academic pressure to tough it out here.' In the end, Shklar endured this tenured lecturer position. Wasn't that a hundred times worse than the situation I just described?"},{"id":"356","start":2488.27,"end":2501.53,"displayStart":2488.27,"displayEnd":2501.53,"displayMid":2494.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.854357,"pitch":29.394051,"speechRate":5.807,"hasEvents":false,"sentence_source":"他接受的这种就看似非常礼貌的 实际上已经是侮辱的布公，比我现在能够面对的这个布公 那当然不知道多少倍，我就想诗克莱他是怎么面对的，肯定是诗克莱的选手 现在是教授的老师。","sentence_en":"She accepted this seemingly polite but actually insulting treatment—so much worse than what I face now. I wonder how Shklar dealt with it. Surely her approach—she who is now a professor—her teachers..."},{"id":"357","start":2501.53,"end":2516.59,"displayStart":2501.53,"displayEnd":2516.59,"displayMid":2509.0600000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.85865,"pitch":30.154091,"speechRate":5.312,"hasEvents":false,"sentence_source":"我跟他们聊天的时候 他们都会跟我说，他说师克莱是我见过最刚烈的女人，她在学术上非常严谨，而且在学术上在她自己热爱的世界上，从来不会跟男同事退步，最后我不倒说她的出版的书多到。","sentence_en":"When I talk to them, they all tell me: 'Shklar is the toughest woman I've ever seen. She is rigorous in her scholarship, never backs down to male colleagues in her beloved field.' And I don't even need to mention how many books she published."},{"id":"358","start":2516.59,"end":2523.71,"displayStart":2516.59,"displayEnd":2523.71,"displayMid":2520.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.869452,"pitch":30.733088,"speechRate":4.758,"hasEvents":false,"sentence_source":"让同系的其他老师感觉到，如果这么有成就的一个女的都拿不到中生教授的话。","sentence_en":"To the point that other faculty in the department felt, 'If a woman this accomplished can't get tenure,"},{"id":"359","start":2523.71,"end":2525.35,"displayStart":2523.71,"displayEnd":2525.35,"displayMid":2524.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.982215,"pitch":31.572121,"speechRate":6.098,"hasEvents":false,"sentence_source":"那给我们这个系盟修了。","sentence_en":"then our department would be ashamed."},{"id":"360","start":2525.35,"end":2533.07,"displayStart":2525.35,"displayEnd":2533.07,"displayMid":2529.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.6,"loudness":0.787302,"pitch":26.043608,"speechRate":5.311,"hasEvents":false,"sentence_source":"我们最后他们在师克莱强硬的学术成就下，给她发了一个中生教授的职位，这是一个巨大的不够吗。","sentence_en":"In the end, under the weight of Shklar's formidable academic achievements, they granted her a tenured professorship. Isn't that a huge injustice?"},{"id":"361","start":2533.83,"end":2546.75,"displayStart":2533.83,"displayEnd":2546.75,"displayMid":2540.29,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.980361,"pitch":23.568111,"speechRate":5.804,"hasEvents":false,"sentence_source":"你说他是个特别tough的一个人，但他这一生有没有在他最后拿到那个中生教授的那个职位之前，有没有去抗议过，为自己接受这样很不公平对待，有没有去表示过自己不满。","sentence_en":"You say she was a particularly tough person. But did she ever protest before finally getting that tenured professorship? Did she ever express dissatisfaction about accepting such unfair treatment?"},{"id":"362","start":2546.75,"end":2549.01,"displayStart":2546.75,"displayEnd":2549.01,"displayMid":2547.88,"speaker":"Zhong Shu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.744534,"pitch":22.076948,"speechRate":4.867,"hasEvents":false,"sentence_source":"因为，学术界是一个精英制。","sentence_en":"Because academia is a meritocracy."},{"id":"363","start":2549.01,"end":2557.91,"displayStart":2549.01,"displayEnd":2557.91,"displayMid":2553.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.819958,"pitch":29.266186,"speechRate":5.169,"hasEvents":false,"sentence_source":"他是一个有手门人的 有比较少的一撮，规则制定者监管的精英制，这种制度里面经常会有一些根深蒂固的不够。","sentence_en":"It's a system with gatekeepers, a small group of rule-makers overseeing it. This system often has deep-rooted injustices."},{"id":"364","start":2557.91,"end":2570.01,"displayStart":2557.91,"displayEnd":2570.01,"displayMid":2563.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Lifestyle and Self-Expression","sentiment_en":"Neutral","score":0,"loudness":0.862432,"pitch":28.500326,"speechRate":5.867,"hasEvents":false,"sentence_source":"我觉得作为女性或者说作为一个意识到这个规则，可能有点不公的人我们面临两个选择，第一个选择是你是不是要通过在这个规则里面，努力去改变这个规则的运作。","sentence_en":"I think as a woman, or as someone who realizes these rules may be unfair, we face two choices. The first is whether to work within the system to change how it operates."},{"id":"365","start":2570.01,"end":2584.47,"displayStart":2570.01,"displayEnd":2584.47,"displayMid":2577.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.809262,"pitch":27.784914,"speechRate":5.394,"hasEvents":false,"sentence_source":"或者说你可以去直接质疑这一整个系统本身，我看到的这些在学术权，在大学这个体系里面获得了成就的女性，她们选择的可能都是在这个体系里面，去按部就班的完成她对你的所有期待。","sentence_en":"Or you can directly challenge the whole system itself. The women I've seen who have achieved success in academia, in the university system, they chose to work within the system, to fulfill all its expectations step by step."},{"id":"366","start":2584.47,"end":2587.13,"displayStart":2584.47,"displayEnd":2587.13,"displayMid":2585.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Positive","score":0.5,"loudness":0.826231,"pitch":27.800211,"speechRate":5.639,"hasEvents":false,"sentence_source":"甚至完成的更好了之后再获得认可。","sentence_en":"And even over-deliver before gaining recognition."},{"id":"367","start":2587.13,"end":2593.39,"displayStart":2587.13,"displayEnd":2593.39,"displayMid":2590.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.79586,"pitch":27.67276,"speechRate":6.39,"hasEvents":false,"sentence_source":"但是我们可以看到在学术界之外的有一些，比如说你要是想要去批评这一整个体系的问题的话。","sentence_en":"But we can also see some outside academia, for instance if you want to criticize the problems of the entire system."},{"id":"368","start":2593.39,"end":2598.29,"displayStart":2593.39,"displayEnd":2598.29,"displayMid":2595.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.778074,"pitch":25.78071,"speechRate":7.143,"hasEvents":false,"sentence_source":"因为去瓦解一个体系是一件很难的事情，或者说去治理一个制度更深蒂固的公平性。","sentence_en":"Because dismantling a system is very difficult, or addressing the deep-seated unfairness of an institution."},{"id":"369","start":2598.29,"end":2605.13,"displayStart":2598.29,"displayEnd":2605.13,"displayMid":2601.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Women's Situation and Academic Growth","sentiment_en":"Neutral","score":0,"loudness":0.656678,"pitch":24.094942,"speechRate":7.657,"hasEvents":false,"sentence_source":"但是在公共知识界的领域，你会看到一些Problem intellectuals，就不是教授一些公共知识分子。","sentence_en":"But in the public intellectual sphere, you see some 'problem intellectuals'—not professors, but public intellectuals."},{"id":"370","start":2605.13,"end":2606.45,"displayStart":260 ntence_source":"是 那我还在布兰迪斯大学开过一门点奥斯丁的课呢。","sentence_en":"Yes, I even taught a course on Jane Austen at Brandeis University."},{"id":"539","start":3918.49,"end":3929.33,"displayStart":3918.49,"displayEnd":3929.33,"displayMid":3923.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Language Learning and Educational Experience","sentiment_en":"Neutral","score":0.1,"loudness":0.971605,"pitch":29.395603,"speechRate":6.431,"hasEvents":false,"sentence_source":"其实我不太了解什么文学理论 我不太了解十九世纪，杰奥斯丁作为一个女性作家 她的是受什么谁的影响，我在第一节课的时候 我就跟同学们说，这是一节政治哲学课。","sentence_en":"Actually, I don't know much about literary theory or the 19th century. As a female writer, who Jane Austen was influenced by — in the first class, I told my students, this is a political philosophy course."},{"id":"540","start":3929.33,"end":3943.17,"displayStart":3929.33,"displayEnd":3943.17,"displayMid":3936.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Language Learning and Educational Experience","sentiment_en":"Positive","score":0.5,"loudness":0.992062,"pitch":30.185097,"speechRate":5.78,"hasEvents":false,"sentence_source":"我只是拿杰奥斯丁作为一个载体，这比如说我们班上有两个女同学，他们是女性主义作家的专家，他们就能够跟我讲出很多，一些我不理解的什么文学手法啊，什么技巧，比较就像您刚才说的那个。","sentence_en":"I just use Jane Austen as a vehicle. For example, there were two female students in my class who were experts on feminist writers. They could tell me a lot about literary techniques and skills that I didn't understand, much like what you just mentioned."},{"id":"541","start":3943.17,"end":3947.89,"displayStart":3943.17,"displayEnd":3947.89,"displayMid":3945.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Positive","score":0.5,"loudness":0.915934,"pitch":27.14674,"speechRate":5.65,"hasEvents":false,"sentence_source":"电影上西施科科的拍摄技巧一样，在这点上我要向他们学习。","sentence_en":"The filming techniques in the movie Xishikoko are the same; I need to learn from them on this point."},{"id":"542","start":3947.89,"end":3948.87,"displayStart":3947.89,"displayEnd":3948.87,"displayMid":3948.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Positive","score":0.7,"loudness":0.989124,"pitch":35.5868,"speechRate":8.466,"hasEvents":false,"sentence_source":"那个课最终很成功。","sentence_en":"That class ended up being very successful."},{"id":"543","start":3948.87,"end":3960.41,"displayStart":3948.87,"displayEnd":3960.41,"displayMid":3954.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Positive","score":0.6,"loudness":0.849296,"pitch":29.561398,"speechRate":6.326,"hasEvents":false,"sentence_source":"因为我能够提供的就是，如何从政治哲学的视角去思考，比如说我觉得简奥斯丁他关心的这个人性之间的关系，最终也是一个政治关系，就我在课上提出了一个很有意思的问题。","sentence_en":"Because what I can offer is how to think from a political philosophy perspective. For example, I think the relationships between human natures that Jane Austen cares about are ultimately political relationships. So in class, I raised a very interesting question."},{"id":"544","start":3960.41,"end":3972.67,"displayStart":3960.41,"displayEnd":3972.67,"displayMid":3966.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Philosophical, Literary, and Historical Thinking","sentiment_en":"Neutral","score":0.2,"loudness":0.957738,"pitch":27.13604,"speechRate":5.954,"hasEvents":false,"sentence_source":"就是简奥斯丁是不是现代社会的雅利斯多德，他提供的这种女性的视角，他是不是对他来说婚姻是不是一种雅利斯多德式的友谊，艾玛和Mr. Knightley的这个关系。","sentence_en":"That is, is Jane Austen the Aristotle of modern society? With the female perspective she provides, is marriage for her a kind of Aristotelian friendship, like the relationship between Emma and Mr. Knightley?"},{"id":"545","start":3972.67,"end":3976.15,"displayStart":397 <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
