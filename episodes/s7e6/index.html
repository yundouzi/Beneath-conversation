lusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":1.007454,"pitch":24.424454,"speechRate":5.595,"hasEvents":true,"sentence_source":"那对于一个作家，对于一个写作者来说，什么样的生活场景是未必是有助于生活，是有助于写作的，是一个在爱和华那样的城市，那个城市很安静，但是什么都不发生，都是在其他的地方发生这一些惊心动。","sentence_en":"For a writer, what kind of life setting is actually helpful for writing? It's a city like Iowa—quiet, but nothing happens. All the heart-stirring..."},{"id":"77","start":544.56,"end":545.08,"displayStart":544.56,"displayEnd":545.08,"displayMid":544.8199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.778356,"pitch":17.470657,"speechRate":7.692,"hasEvents":false,"sentence_source":"魄的事情。","sentence_en":"and soul-shaking events happen elsewhere."},{"id":"78","start":545.5,"end":555.54,"displayStart":545.5,"displayEnd":555.54,"displayMid":550.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"City migration and academic journey","sentiment_en":"Neutral","score":0,"loudness":0.985694,"pitch":23.299549,"speechRate":5.688,"hasEvents":true,"sentence_source":"还是在洛杉矶这样，每天有各种各样奇情令人匪夷所思议发生着，但是又无比喧闹的一个城市里面生活，哪一种状态对一个创作者更好?","sentence_en":"Living in a city like Los Angeles, with its daily bizarre events and endless noise—what kind of state is better for a creator?"},{"id":"79","start":555.54,"end":561.22,"displayStart":555.54,"displayEnd":561.22,"displayMid":558.38,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":1.097088,"pitch":29.778681,"speechRate":5.364,"hasEvents":false,"sentence_source":"我以前就是更年轻的时候会觉得我应该待在像洛杉矶这样的地方。","sentence_en":"When I was younger, I thought I should live in a place like LA."},{"id":"80","start":561.22,"end":565.04,"displayStart":561.22,"displayEnd":565.04,"displayMid":563.13,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.952648,"pitch":27.94923,"speechRate":5.45,"hasEvents":false,"sentence_source":"然后因为每天都有各种各样的事情会发生 对吧。","sentence_en":"Because there's always something going on, right?"},{"id":"81","start":565.04,"end":578.1,"displayStart":565.04,"displayEnd":578.1,"displayMid":571.5699999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.7,"loudness":0.889427,"pitch":26.300781,"speechRate":4.99,"hasEvents":false,"sentence_source":"但是我现在因为经历了这两种生活以后，我会觉得最适合我自己写作的生活是，住在一个像艾赫华一样的地方，比如说我有半年很安定的在那里看书写字。","sentence_en":"But now, having experienced both, I feel the best life for my writing is living in a place like Iowa—where I can settle for half the year to read and write."},{"id":"82","start":578.1,"end":587.32,"displayStart":578.1,"displayEnd":587.32,"displayMid":582.71,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.878635,"pitch":25.254791,"speechRate":4.555,"hasEvents":false,"sentence_source":"但是会有另外的时间，我可能会是到个地方去旅行也好，旅居也好 裁缝也好 可能会过一个这样的生活。","sentence_en":"But the other half, I might travel, sojourn, or even do some tailoring—live that kind of life."},{"id":"83","start":587.32,"end":591.18,"displayStart":587.32,"displayEnd":591.18,"displayMid":589.25,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.6,"loudness":1.116789,"pitch":27.420183,"speechRate":5.68,"hasEvents":false,"sentence_source":"但是我会知道我的家是在一个很安定的地方。","sentence_en":"But I know my home is in a very stable place."},{"id":"84","start":591.18,"end":598.94,"displayStart":591.18,"displayEnd":598.94,"displayMid":595.06,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.8,"loudness":0.799613,"pitch":27.364389,"speechRate":6.024,"hasEvents":false,"sentence_source":"那个让我心里会觉得很稳定，如果外面经历了一些波折 或者经历了一些事情以后，我知道我还是可以回家的。","sentence_en":"That gives me a sense of stability. If I encounter some setbacks or go through something outside, I know I can still go home."},{"id":"85","start":598.94,"end":610.24,"displayStart":598.94,"displayEnd":610.24,"displayMid":604.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.974734,"pitch":22.435471,"speechRate":6.038,"hasEvents":false,"sentence_source":"我应该是在你豆瓣上看到，你说你现在想到回家已经不是想到回上海这概念，而是回到中西部，我不知道中西部的概念是指岳和华那样的，非常安静的城市吗。","sentence_en":"I think I saw on your Douban that you now think of home as the Midwest, not Shanghai. Does the Midwest mean a quiet city like Iowa?"},{"id":"86","start":611.04,"end":619.12,"displayStart":611.04,"displayEnd":619.12,"displayMid":615.0799999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.7,"loudness":0.957211,"pitch":28.531982,"speechRate":5.446,"hasEvents":false,"sentence_source":"为什么我会觉得那像一个家一样的感觉，我在那边认识了很多人，就不只是我的workshop的同学。","sentence_en":"Why does it feel like home? I met many people there, not just my workshop classmates."},{"id":"87","start":619.12,"end":628.46,"displayStart":619.12,"displayEnd":628.46,"displayMid":623.79,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.897051,"pitch":25.384348,"speechRate":7.923,"hasEvents":false,"sentence_source":"然后还有很多当地人，在那里留学的第一年，我就参加了一个叫，Friends with International Students，是一个协会 你就要注册一下。","sentence_en":"And many locals. In my first year studying there, I joined an association called Friends with International Students—you just need to register."},{"id":"88","start":628.46,"end":635.32,"displayStart":628.46,"displayEnd":635.32,"displayMid":631.8900000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.876449,"pitch":25.529243,"speechRate":4.637,"hasEvents":false,"sentence_source":"他们会帮你跟当地的家庭结对子，就是很多城市我相信都有的，这种组织。","sentence_en":"They pair you with local families. I believe many cities have this kind of organization."},{"id":"89","start":635.32,"end":638.92,"displayStart":635.32,"displayEnd":638.92,"displayMid":637.12,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.6,"loudness":1.02351,"pitch":31.640516,"speechRate":6.111,"hasEvents":false,"sentence_source":"然后和我结对的是，他叫Jacky，是我很好的朋友。","sentence_en":"The person I was paired with is Jacky, a good friend of mine."},{"id":"90","start":638.92,"end":647.94,"displayStart":638.92,"displayEnd":647.94,"displayMid":643.4300000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.5,"loudness":0.855438,"pitch":26.258972,"speechRate":5.07,"hasEvents":false,"sentence_source":"我们到现在还经常发短信的，他的岁数跟我母亲其实是一样大的，正好是一年出生的，Jacky是一个护士。","sentence_en":"We still text often. He's the same age as my mother, born in the same year. Jacky is a nurse."},{"id":"91","start":647.94,"end":658.2,"displayStart":647.94,"displayEnd":658.2,"displayM 9999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.993848,"pitch":33.458549,"speechRate":6.149,"hasEvents":false,"sentence_source":"但是我觉得是我们成长的时候可能不一样了。","sentence_en":"But I think things changed when we were growing up."},{"id":"154","start":1116.24,"end":1126.96,"displayStart":1116.24,"displayEnd":1126.96,"displayMid":1121.6,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.940684,"pitch":24.660652,"speechRate":5.256,"hasEvents":false,"sentence_source":"因为我们后面是碰到改革开放了，上海的改革开放比较晚的，它其实是到90年代普通开发开放以后，它是在真正开始跟上这个节奏的。","sentence_en":"Because later we experienced the reform and opening up. Shanghai's reform came relatively late; it wasn't until the 1990s that it truly began to catch up."},{"id":"155","start":1126.96,"end":1137,"displayStart":1126.96,"displayEnd":1137,"displayMid":1131.98,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.927345,"pitch":25.307514,"speechRate":5.61,"hasEvents":false,"sentence_source":"但是在我们这一代人，比如说我们的小时候读小学的时候，是没有平复差距这个概念的，大家都在工人形成的，大家都是这样的房子。","sentence_en":"But for our generation, when we were in elementary school, there was no concept of class differences. Everyone lived in workers' new villages, in the same kind of housing."},{"id":"156","start":1137,"end":1150.14,"displayStart":1137,"displayEnd":1150.14,"displayMid":1143.5700000000002,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.864654,"pitch":26.091732,"speechRate":5.228,"hasEvents":false,"sentence_source":"但是可能到我读中学以后，就开始有贫富差距了，父母这代人又碰到下岗，碰到下岗 然后整个工人新村下岗的人非常多，这个时候突然就感觉到，我感受很深的 就是。","sentence_en":"But maybe when I got to middle school, wealth gaps began to appear. Our parents' generation also faced layoffs—so many people in the workers' new village were laid off. That's when I suddenly felt, and I felt it deeply, that..."},{"id":"157","start":1150.14,"end":1160.3,"displayStart":1150.14,"displayEnd":1160.3,"displayMid":1155.22,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.947457,"pitch":30.216413,"speechRate":5.315,"hasEvents":false,"sentence_source":"周围邻居 同邻的邻居 包括的同学，在我中学的时候 大家都搬家了，就全部都从工人新村的房子开始搬到商品房了，搬到各个地方了。","sentence_en":"Neighbors, same-age kids, classmates—everyone moved away during my middle school years. They all moved from workers' new village apartments to commercial housing, to different places."},{"id":"158","start":1160.3,"end":1173.28,"displayStart":1160.3,"displayEnd":1173.28,"displayMid":1166.79,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Negative","score":-0.7,"loudness":1.015518,"pitch":32.533436,"speechRate":5.373,"hasEvents":false,"sentence_source":"然后每天都有人搬家，每天都有人说自己有房间呢 走怎么样，自己就是好像从来没有搬家的，这种机会一样的 然后就觉得自己好像没有跟上时代的列车这种感觉。","sentence_en":"And every day someone was moving, every day someone talked about their new room. I felt like I never had that chance, like I had missed the train of the times."},{"id":"159","start":1173.28,"end":1177.78,"displayStart":1173.28,"displayEnd":1177.78,"displayMid":1175.53,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.956528,"pitch":28.945518,"speechRate":6.089,"hasEvents":false,"sentence_source":"可能是那个时候我忽然觉得 工人兴孙好像没有以前这么辉煌。","sentence_en":"Maybe that's when I suddenly felt that the workers' new village wasn't as glorious as before."},{"id":"160","start":1178.94,"end":1193.02,"displayStart":1178.94,"displayEnd":1193.02,"displayMid":1185.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":1.002736,"pitch":23.423868,"speechRate":5.065,"hasEvents":false,"sentence_source":"我小时候上海话里面就有上知脚跟下知脚的概念，刚才你讲你妈妈小时候住的地方 应该就是所谓上知脚，上知脚就是指现在那种物业 地皮 非常贵的 可能富人住的地方。","sentence_en":"When I was little, there was already the concept of 'upper corner' and 'lower corner' in Shanghai dialect. Earlier you mentioned your mom's childhood home—that would be the 'upper corner.' The upper corner refers to places with very expensive property and land, where wealthy people might live."},{"id":"161","start":1193.02,"end":1197.62,"displayStart":1193.02,"displayEnd":1197.62,"displayMid":1195.32,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.046258,"pitch":23.679075,"speechRate":5.721,"hasEvents":true,"sentence_source":"所以我从小就会明白 这个世界是有穷人跟富人的差距的。","sentence_en":"So I understood from a young age that there is a gap between the rich and the poor."},{"id":"162","start":1198.28,"end":1205.78,"displayStart":1198.28,"displayEnd":1205.78,"displayMid":1202.03,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":1.102656,"pitch":28.101427,"speechRate":5.817,"hasEvents":true,"sentence_source":"对对 就是虽然这么说 但是你可以这样想，我妈那个时候是住在上知角 但上知角的房子没有下知角好。","sentence_en":"Right, right. But you can think of it this way: my mom lived in the upper corner, but the houses in the upper corner weren't as good as those in the lower corner."},{"id":"163","start":1207.3,"end":1217.16,"displayStart":1207.3,"displayEnd":1217.16,"displayMid":1212.23,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.95496,"pitch":26.881134,"speechRate":5.613,"hasEvents":true,"sentence_source":"就是上知角的人很骄傲 因为他觉得他自己住的是市中心，就是上海人很喜欢的那个黄埔区啊 靳安区啊 徐慧区啊 这样的一些地方。","sentence_en":"People in the upper corner were proud because they thought they lived in the city center—places like Huangpu, Jing'an, Xuhui, which Shanghainese love."},{"id":"164","start":1217.16,"end":1222.3,"displayStart":1217.16,"displayEnd":1222.3,"displayMid":1219.73,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.921909,"pitch":23.632999,"speechRate":6.78,"hasEvents":false,"sentence_source":"下知角是旁边的一些区域 但是其实现在旁边的区域显得也是于中心全区了。","sentence_en":"The lower corner refers to surrounding areas, but nowadays those areas also seem to be part of the central districts."},{"id":"165","start":1222.3,"end":1235.96,"displayStart":1222.3,"displayEnd":1235.96,"displayMid":1229.13,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.931571,"pitch":34.567371,"speechRate":3.531,"hasEvents":false,"sentence_source":"所以就是可能是我母亲那代人，它有一种对昔日的这个地方的一种，留在历史里或者留在影像里的那样一种形象。","sentence_en":"So perhaps my mother's generation has an image of this place from the past, preserved in history or in old photographs."},{"id":"166","start":1235.96,"end":1238.52,"displayStart":1235.96,"displayEnd":1238.52,"displayMid":1237.24,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.3,"loudness":0.862638,"pitch":29.494974,"speechRate":6.034,"hasEvents":false,"sentence_source":"它有一种因为怀旧而产生的骄傲。","sentence_en":"There's a kind of pride born from nostalgia."},{"id":"167","start":1238.52,"end" verything had to happen in public."},{"id":"175","start":1290.54,"end":1305.76,"displayStart":1290.54,"displayEnd":1305.76,"displayMid":1298.15,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.924097,"pitch":28.398829,"speechRate":5.139,"hasEvents":false,"sentence_source":"接下来就是没有任何的亲密的这样一种接触的，就是特别是，女方会需要有监护人或者类似像监护人的这样一个，人事把关，包括他们餐厅要点什么菜 我就是很详细 我现在都不记得。","sentence_en":"Then no intimate contact. The woman would have a chaperone, who even decided what to order at restaurants. I remember it being very detailed, but I forget specifics."},{"id":"176","start":1305.76,"end":1317.8,"displayStart":1305.76,"displayEnd":1317.8,"displayMid":1311.78,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.5,"loudness":1.04466,"pitch":32.002056,"speechRate":6.08,"hasEvents":false,"sentence_source":"我也很喜欢看这些东西 但是我觉得很像，这意思是一个因为我们现在时代和过去不一样了嘛对我来说就是一个是当然有种撑时光机穿梭回去的那种感觉对吧。","sentence_en":"I love reading this stuff too. It feels like a time machine back to a different era."},{"id":"177","start":1317.8,"end":1322.06,"displayStart":1317.8,"displayEnd":1322.06,"displayMid":1319.9299999999998,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.143579,"pitch":34.442913,"speechRate":5.903,"hasEvents":false,"sentence_source":"然后第二个会觉得就是我从来也不是很羡慕有钱人的生活。","sentence_en":"Second, I've never envied the rich."},{"id":"178","start":1322.06,"end":1336.56,"displayStart":1322.06,"displayEnd":1336.56,"displayMid":1329.31,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.4,"loudness":0.916355,"pitch":27.914875,"speechRate":4.828,"hasEvents":false,"sentence_source":"但是会反而觉得他们的做事情好像有一套这样的一种章法，有种时候觉得这种章法就是这种秩序感挺令人怀念的，就是我也不知道我怀念什么 但是我也很喜欢看这个。","sentence_en":"But I find their way of doing things has a certain orderliness that feels nostalgic. I don't know what I miss, but I enjoy reading about it."},{"id":"179","start":1336.56,"end":1347.02,"displayStart":1336.56,"displayEnd":1347.02,"displayMid":1341.79,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.987485,"pitch":21.486813,"speechRate":4.579,"hasEvents":false,"sentence_source":"那，你在上海，就你出国之前，包括读大学本科在复旦，后来做老师，一段时间你对于你的未来有一个明确的想象吗?","sentence_en":"So, before you left Shanghai—during your undergrad at Fudan and then teaching—did you have a clear vision of your future?"},{"id":"180","start":1347.32,"end":1350.18,"displayStart":1347.32,"displayEnd":1350.18,"displayMid":1348.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.126379,"pitch":19.626711,"speechRate":4.895,"hasEvents":false,"sentence_source":"你就是要写作，看到佳楠对我摇头。","sentence_en":"You were set on writing? I see Jianan shaking her head at me."},{"id":"181","start":1351.98,"end":1356.78,"displayStart":1351.98,"displayEnd":1356.78,"displayMid":1354.38,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.075375,"pitch":29.441698,"speechRate":5.603,"hasEvents":false,"sentence_source":"没有一个，我说实话，就是其实我在复旦读书的时候是很迷茫的。","sentence_en":"Not at all. To be honest, I was quite lost during my time at Fudan."},{"id":"182","start":1357.06,"end":1361.92,"displayStart":1357.06,"displayEnd":1361.92,"displayMid":1359.49,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.013689,"pitch":30.481377,"speechRate":5.689,"hasEvents":false,"sentence_source":"我一开始进大学的时候，我的专业是汉语言，是个语言学的专业。","sentence_en":"When I started college, my major was Chinese Language, a linguistics program."},{"id":"183","start":1362.52,"end":1373.7,"displayStart":1362.52,"displayEnd":1373.7,"displayMid":1368.1100000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.936783,"pitch":25.380873,"speechRate":6.182,"hasEvents":false,"sentence_source":"我不知道怎么填专业 因为我爸妈都没上过大学，我以为汉语言就是汉语言文学，我的读汉语言的同学 我有很棒的本科同学做什么呢，就是他以前是做机器人语言的。","sentence_en":"I didn't know how to choose majors since my parents hadn't gone to university. I thought Chinese Language was the same as Chinese Literature. One of my classmates did robot language—he taught his robot to speak Shanghainese."},{"id":"184","start":1373.7,"end":1383.94,"displayStart":1373.7,"displayEnd":1383.94,"displayMid":1378.8200000000002,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.4,"loudness":0.953936,"pitch":26.048655,"speechRate":5.706,"hasEvents":false,"sentence_source":"就是他会教他做的机器人说上海话，他的机器人能说各种各样的方言，让他可以去帮别人去保留那个方言，我很有意思的 这是语言学的范畴。","sentence_en":"He taught his robot to speak Shanghainese and other dialects, helping preserve them. That's fascinating—that's linguistics."},{"id":"185","start":1383.94,"end":1389.94,"displayStart":1383.94,"displayEnd":1389.94,"displayMid":1386.94,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.884715,"pitch":28.537817,"speechRate":6.187,"hasEvents":false,"sentence_source":"然后很多人是做古文字，我那个时候跟语言学上课 我们要学古文字就要学甲古文。","sentence_en":"Many studied ancient scripts. In linguistics class, we had to learn oracle bone script."},{"id":"186","start":1389.94,"end":1401.78,"displayStart":1389.94,"displayEnd":1401.78,"displayMid":1395.8600000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.921647,"pitch":27.929087,"speechRate":6.066,"hasEvents":true,"sentence_source":"对 这是语言写 然后文学就是另外的一个概念，当时一开始是这个转移 我那个时候刚刚进了中文系，我还可能不甘心 我那个时候想哎呀 我还是想要读大学以后还是要赚钱。","sentence_en":"Right, that's language. Literature is different. At first, I was in the Chinese department and probably felt unsatisfied—I thought I needed to make money after graduation."},{"id":"187","start":1401.78,"end":1415.76,"displayStart":1401.78,"displayEnd":1415.76,"displayMid":1408.77,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.929373,"pitch":26.893734,"speechRate":4.681,"hasEvents":true,"sentence_source":"我还试图想考那个新加坡的管理学院 我想去读商课，还好我没有去 我这个人是不适合的 我肯定要赔钱的，就是其实我当中波波折折想过很多很多事情。","sentence_en":"I even tried to apply to a Singapore management school for business. Good thing I didn't go—I'm not suited for it, I'd lose money. I went through many twists and turns thinking about all sorts of things."},{"id":"188","start":1415.76,"end":1428.92,"displayStart":1415.76,"displayEnd":1428.92,"displayMid":1422.3400000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.858202,"pitch":25.979824,"speechRate":5.041,"hasEvents":false,"sentence_source":"没有完全想过 我要写作 因为我想那个时候也是觉得写作怎么可能养活自己呢，就兜兜转转 试过很多的事情 最后也是很多事情也是歪打正常，无心插流 就。","sentence_en":"I never fully thought about becoming a writer. Back then, I thought how could writing support me? I tried many things, and things worked out by accident."},{"id":"189","start":1428.92,"end":1444.2,"displayStart":1428.92,"displayEnd":1444.2,"displayMid":1436.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.952576,"pitch":20.048935,"speechRate":5.17,"hasEvents":false,"sentence_source":"这样走过来了，你为什么觉得写作养活不了自己呢 在那个年代生活当中已经，无论是往前看 还是此刻那个时候你看你身边，可能看在远一点国外有很多作家已经会因为畅销而变得很有钱了。","sentence_en":"You got through it. Why did you think writing couldn't support you? Even then, looking around, there were bestselling writers abroad getting rich."},{"id":"190","start":1444.2,"end":1454.94,"displayStart":1444.2,"displayEnd":1454.94,"displayMid":1449.5700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.031767,"pitch":23.269943,"speechRate":5.273,"hasEvents":false,"sentence_source":"那个时候应该国内已经出现了那些财富榜当中的畅销作家的榜单，作家已经开始作为中国的财富新贵登上了各种各样的财富榜单了。","sentence_en":"By then, China had bestseller lists on wealth rankings, and writers were becoming new rich."},{"id":"191","start":1455.72,"end":1464.48,"displayStart":1455.72,"displayEnd":1464.48,"displayMid":1460.1,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.4,"loudness":1.007823,"pitch":27.315788,"speechRate":5.35,"hasEvents":false,"sentence_source":"我觉得我自己写的那种文章是国内不是叫纯文学吗，纯文学的作家其实还是蛮难的 我写不了畅销的作品。","sentence_en":"I thought the kind of writing I did was called 'pure literature,' and pure literature writers struggled. I couldn't write bestsellers."},{"id":"192","start":1464.48,"end":1474.78,"displayStart":1464.48,"displayEnd":1474.78,"displayMid":1469.63,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.938417,"pitch":26.111933,"speechRate":7.153,"hasEvents":false,"sentence_source":"包括其实在国外 国外那个纯文学它叫literary fiction 如果你是写小说的话，它其实也很难畅销 因为他们美国又不一样，美国可以把版权卖到全世界各地去。","sentence_en":"Even abroad, it's called literary fiction. It's hard to sell well, unlike in the US where they can sell rights globally."},{"id":"193","start":1474.78,"end":1478.78,"displayStart":1474.78,"displayEnd":1478.78,"displayMid":1476.78,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.078313,"pitch":30.945061,"speechRate":6.391,"hasEvents":false,"sentence_source":"然后他有这样一个等于是一个文化的位置上的一种优势。","sentence_en":"They have a cultural advantage in that position."},{"id":"194","start":1478.78,"end":1486.14,"displayStart":1478.78,"displayEnd":1486.14,"displayMid":1482.46,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.939424,"pitch":22.83322,"speechRate":5.259,"hasEvents":false,"sentence_source":"但是如果你把这个撇开，很多作家最后还是找一份教职养活自己，这是他更稳定的收入。","sentence_en":"But setting that aside, many writers end up taking teaching jobs for stable income."},{"id":"195","start":1486.68,"end":1502.3,"displayStart":1486.68,"displayEnd":1502.3,"displayMid":1494.49,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.5,"loudness":0.82222,"pitch":29.225773,"speechRate":4.698,"hasEvents":false,"sentence_source":"所以我那个时候一直在想，就完全靠写作是估计是很难的，我是一个非常现实的人，写作这个事情让我最开心最满足的是什么呢，第一个是我能够一直去在阅读当中享受到快乐。","sentence_en":"So I always thought relying solely on writing was tough. I'm practical. What makes me happiest about writing? First, the joy of reading."},{"id":"196","start":1502.3,"end":1514.92,"displayStart":1502.3,"displayEnd":1514.92,"displayMid":1508.6100000000001,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.6,"loudness":0.831433,"pitch":27.646387,"speechRate":5.74,"hasEvents":false,"sentence_source":"我觉得这个是很重要的，就是我如果一直能够去阅读一些大师的作品，就是我可以看出自己之前看的时候看不出来的东西，就我知道他的那个文字是为什么作品是这么好。","sentence_en":"That's important. Reading masters lets me see things I missed before—I understand why their writing is so good."},{"id":"197","start":1514.92,"end":1518.88,"displayStart":1514.92,"displayEnd":1518.88,"displayMid":1516.9,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.5,"loudness":0.762913,"pitch":21.710894,"speechRate":6.009,"hasEvents":false,"sentence_source":"每次看我都会看到新的这个作品为什么好的角度。","sentence_en":"Each time I find new angles on why a work is good."},{"id":"198","start":1518.88,"end":1527.78,"displayStart":1518.88,"displayEnd":1527.78,"displayMid":1523.33,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.4,"loudness":0.871259,"pitch":30.516769,"speechRate":5.52,"hasEvents":false,"sentence_source":"然后我觉得这种阅读的享受是很重要的，第二个是在阅读的享受当中写作的，我把它看成是一个输入和输出的过程。","sentence_en":"This reading pleasure is key. Second, writing within that pleasure—I see it as input and output."},{"id":"199","start":1527.78,"end":1539.6,"displayStart":1527.78,"displayEnd":1539.6,"displayMid":1533.69,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.6,"loudness":0.791861,"pitch":28.41246,"speechRate":4.978,"hasEvents":false,"sentence_source":"所以如果有输出然后我会觉得写出一些自己满意的作品，这个是我的另外一种享受，在这两个输入和输出的过程当中，自己对自己满意。","sentence_en":"So when I produce something I'm satisfied with, that's another joy. In that cycle, I'm content with myself."},{"id":"200","start":1539.6,"end":1546.18,"displayStart":1539.6,"displayEnd":1546.18,"displayMid":1542.8899999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.7,"loudness":0.662847,"pitch":24.140526,"speechRate":4.601,"hasEvents":true,"sentence_source":"那我觉得这个让我对自己的精神上的生活，是感觉到是已经足够如意了。","sentence_en":"That makes me feel my spiritual life is sufficiently fulfilled."},{"id":"201","start":1546.66,"end":1558.16,"displayStart":1546.66,"displayEnd":1558.16,"displayMid":1552.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.973037,"pitch":21.204905,"speechRate":5.186,"hasEvents":true,"sentence_source":"还有你觉得一个作家他这一生不可以只输写一种经历吗，只输写我所熟悉的城市，只输写我所习惯的我经历过的那种生活方式，和某种情感。","sentence_en":"Also, do you think a writer can only write about one experience—their familiar city, lifestyle, and emotions?"},{"id":"202","start":1558.16,"end":1565.84,"displayStart":1558.16,"displayEnd":1565.84,"displayMid":1562,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.3,"loudness":0.823479,"pitch":24.091146,"speechRate":5.128,"hasEvents":false,"sentence_source":"我觉得可以啊，就是有很多作家也是这样做的，比如说你看那个福克纳，他一直写他的《南方》。","sentence_en":"I think so. Many writers do that—like Faulkner, who always wrote about his South."},{"id":"203","start":1565.84,"end":1567.7,"displayStart":1565.84,"displayEnd":1567.7,"displayMid":1566.77,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.346032,"pitch":25.707741,"speechRate":6.989,"hasEvents":false,"sentence_source":"然后是他假想出来的那个城市。","sentence_en":"And his fictional city."},{"id":"204","start":1567.7,"end":1569.7,"displayStart":1567.7,"displayEnd":1569.7,"displayMid":1568.7,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.899352,"pitch":31.749193,"speechRate":4.5,"hasEvents":false,"sentence_source":"但是就是他所居住的。","sentence_en":"But it's based on where he lived."},{"id":"205","start":1569.7,"end":1579.84,"displayStart":1569.7,"displayEnd":1579.84,"displayMid":1574.77,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.755945,"pitch":24.275362,"speechRate":4.635,"hasEvents":false,"sentence_source":"那是密西西比州，杰克逊周围的那样一些生活，这样的作家有很多，就是可能我没有办法这么写，我也不知道怎么办。","sentence_en":"That's the life around Jackson, Mississippi. There are many such writers. I just can't write that way, and I don't know why."},{"id":"206","start":1579.84,"end":1592.44,"displayStart":1579.84,"displayEnd":1592.44,"displayMid":1586.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.3,"loudness":1.042244,"pitch":23.694981,"speechRate":5.754,"hasEvents":false,"sentence_source":"就是我想问的，像你说的那样，的确有很多作家一生就是这样子，你看我们可能都会很喜欢的张艾琳，我知道你到洛杉矶之后你也去找到张艾琳曾经生活过的居住过的地方。","sentence_en":"That's what I'm asking. Like you said, many writers do that. We both love Zhang Ailing. I know you visited her former home in LA."},{"id":"207","start":1592.44,"end":1599.46,"displayStart":1592.44,"displayEnd":1599.46,"displayMid":1595.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.996047,"pitch":21.871742,"speechRate":6.672,"hasEvents":false,"sentence_source":"你看张艾琳就一生就是写上海跟香港，包括弗罗败 他一生很多时候他的创作的环境就是围绕鲁昂的那个地方。","sentence_en":"Zhang Ailing only wrote about Shanghai and Hong Kong. Flaubert too—his setting was often around Rouen."},{"id":"208","start":1599.46,"end":1601.06,"displayStart":1599.46,"displayEnd":1601.06,"displayMid":1600.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.928607,"pitch":17.196421,"speechRate":5.678,"hasEvents":false,"sentence_source":"所以很多人是可以的。","sentence_en":"So many can do that."},{"id":"209","start":1601.06,"end":1612.8,"displayStart":1601.06,"displayEnd":1612.8,"displayMid":1606.9299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.994935,"pitch":22.644423,"speechRate":6.055,"hasEvents":false,"sentence_source":"但是我看到你的文章当中你自己写你当初离开上海，就是因为你觉得你的写作好像陷入了某种你自己的一个你习惯的场景，就是上海 以上海为背景的你的成长经历。","sentence_en":"But in your writing, you said you left Shanghai because your writing felt stuck in a familiar scene—Shanghai and your upbringing there."},{"id":"210","start":1612.8,"end":1614.6,"displayStart":1612.8,"displayEnd":1614.6,"displayMid":1613.6999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.921739,"pitch":16.533642,"speechRate":7.895,"hasEvents":false,"sentence_source":"但这是你做不到的 为什么呢。","sentence_en":"But you can't do it. Why?"},{"id":"211","start":1614.6,"end":1617.94,"displayStart":1614.6,"displayEnd":1617.94,"displayMid":1616.27,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":1.203161,"pitch":36.416214,"speechRate":5.288,"hasEvents":false,"sentence_source":"我也不知道 就可能是因为在上海的时候。","sentence_en":"I don't know. Maybe because in Shanghai..."},{"id":"212","start":1617.94,"end":1630.34,"displayStart":1617.94,"displayEnd":1630.34,"displayMid":1624.1399999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.871028,"pitch":26.518196,"speechRate":4.597,"hasEvents":false,"sentence_source":"那段时间觉得自己的生活变得狭窄了，比如说我大多数的时间 就是两点一线 家 然后学校，学校那个环境 我很享受我那个时候教书的工作。","sentence_en":"I felt my life had become narrow—just home and school. I enjoyed teaching at school."},{"id":"213","start":1630.34,"end":1641.56,"displayStart":1630.34,"displayEnd":1641.56,"displayMid":1635.9499999999998,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.713128,"pitch":27.048517,"speechRate":4.991,"hasEvents":false,"sentence_source":"因为我大多数的工作就是跟学生一起去读这些经典的文学作品，但另一方面你又可以感觉到，它可能是一个比较狭窄的一个生活空间。","sentence_en":"Most of my work was reading classic literature with students, but it was a confined space."},{"id":"214","start":1641.56,"end":1647.5,"displayStart":1641.56,"displayEnd":1647.5,"displayMid":1644.53,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Negative","score":-0.3,"loudness":0.88234,"pitch":30.989902,"speechRate":4.252,"hasEvents":false,"sentence_source":"他很稳定 但是留给我跟其他的人打交道的机会是不多的。","sentence_en":"It was stable, but I didn't have many chances to interact with others."},{"id":"215","start":1647.5,"end":1652.2,"displayStart":1647.5,"displayEnd":1652.2,"displayMid":1649.85,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":1.149871,"pitch":34.175419,"speechRate":5.644,"hasEvents":false,"sentence_source":"然后我在上面的时候尝试过去跟各种各样的人打交道。","sentence_en":"So I tried to connect with all kinds of people."},{"id":"216","start":1652.2,"end":1662.6,"displayStart":1652.2,"displayEnd":1662.6,"displayMid":1657.4,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Neutral","score":0,"loudness":0.810456,"pitch":25.584625,"speechRate":4.72,"hasEvents":false,"sentence_source":"我们那个时候参加了定海桥户住宿 现在拆掉了应该，当时是一个有很多比较旧的那种老房子所在的这样一个区域。","sentence_en":"We joined a project at Dinghai Bridge, which has since been demolished. It was an area with many old houses."},{"id":"217","start":1662.6,"end":1669.46,"displayStart":1662.6,"displayEnd":1669.46,"displayMid":1666.03,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Positive","score":0.3,"loudness":0.878968,"pitch":28.872087,"speechRate":4.322,"hasEvents":false,"sentence_source":"我还在那里去招当地的老爷爷老奶奶试图教他们写自己的人生故事。","sentence_en":"I even recruited local elderly people to teach them to write their life stories."},{"id":"218","start":1669.46,"end":1676.84,"displayStart":1669.46,"displayEnd":1676.84,"displayMid":1673.15,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Study Abroad Experience and Educational Journey","sentiment_en":"Negative","score":-0.5,"loudness":0.923179,"pitch":30.563822,"speechRate":6.288,"hasEvents":false,"sentence_source":"那时候事情做得很失败 其实后来老爷爷老奶奶都说自己眼睛不好，反正就是一个大学生就想当然的是个决定。","sentence_en":"Back then things went really badly. Actually, later the old man and woman both said their eyesight was bad. Anyway, as a college student, I just took it for granted."},{"id":"219","start":1676.84,"end":1688.32,"displayStart":1676.84,"displayEnd":1688.32,"displayMid":1682.58,"speaker":"Qian Jianan","speakerColor":"#A2 lusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.4,"loudness":0.916628,"pitch":30.929832,"speechRate":5.784,"hasEvents":false,"sentence_source":"因为那个翻译的过程，如果你是做一个很好的翻译，你是去找另外一种语言，把他原本的那种美感重新在一个新的语言当中换一种方式去建构。","sentence_en":"Because in the process of translation, if you're a good translator, you look for another language and reconstruct the original beauty in a new language in a different way."},{"id":"238","start":1817.1,"end":1828.22,"displayStart":1817.1,"displayEnd":1828.22,"displayMid":1822.6599999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.5,"loudness":0.932587,"pitch":30.636522,"speechRate":6.748,"hasEvents":true,"sentence_source":"所以他失去了一些东西但是得到了一些东西，虽然他得到的和失去的东西是不一样的，我会觉得我在用英语写作的时候，我第一次写的时候我就发现，我好像得到了一些东西。","sentence_en":"So you lose something but gain something, even though what you gain and lose are different. I feel that when I write in English, the first time I wrote, I found I seemed to gain something."},{"id":"239","start":1828.62,"end":1838.68,"displayStart":1828.62,"displayEnd":1838.68,"displayMid":1833.65,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.5,"loudness":1.064832,"pitch":33.990688,"speechRate":5.556,"hasEvents":true,"sentence_source":"我好像在逼迫自己用了一个英语写的时候，我好像可以去写一些我以前在上海的时候，用中文写的时候不一定会去写的一些题材。","sentence_en":"When I forced myself to write in English, I could write about some topics that I might not have written about when writing in Chinese back in Shanghai."},{"id":"240","start":1839.8,"end":1847.6,"displayStart":1839.8,"displayEnd":1847.6,"displayMid":1843.6999999999998,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sent ot my life, nor anyone else's life. I had some interviews, got some material."},{"id":"257","start":2018.1,"end":2026.22,"displayStart":2018.1,"displayEnd":2026.22,"displayMid":2022.1599999999999,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.873501,"pitch":29.611595,"speechRate":5.542,"hasEvents":false,"sentence_source":"但是完全跟这个也很不一样的，就是它不是一个任何的，我需要一个从头到尾的，已经给我建构好的一个素材。","sentence_en":"But it's completely different—it's not a ready-made material that I need to process from start to finish."},{"id":"258","start":2026.22,"end":2033.08,"displayStart":2026.22,"displayEnd":2033.08,"displayMid":2029.65,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Neutral","score":0,"loudness":0.912146,"pitch":26.831923,"speechRate":5.761,"hasEvents":false,"sentence_source":"然后我通过它把它加工成文学作品，我不是在做这样一个事情，我是一个得到灵心的一些素材。","sentence_en":"Then I process it into a literary work. That's not what I'm doing. I get some scattered material."},{"id":"259","start":2033.08,"end":2038.08,"displayStart":2033.08,"displayEnd":2038.08,"displayMid":2035.58,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.4,"loudness":0.793101,"pitch":26.382524,"speechRate":6.067,"hasEvents":false,"sentence_source":"然后我可以重新用想象去建构一个叙事，就是会是一个那样的一个过程。","sentence_en":"Then I can use imagination to construct a narrative. That's the kind of process."},{"id":"260","start":2038.08,"end":2042.52,"displayStart":2038.08,"displayEnd":2042.52,"displayMid":2040.3,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Bilingual Writing and Literary Translation","sentiment_en":"Positive","score":0.5,"loudness":0.870524,"pitch":29. 种 就是它那种文字你看就很简单。","sentence_en":"It's that kind of writing that seems so simple."},{"id":"336","start":2568.2,"end":2577.56,"displayStart":2568.2,"displayEnd":2577.56,"displayMid":2572.88,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.6,"loudness":0.825561,"pitch":27.022644,"speechRate":5.702,"hasEvents":false,"sentence_source":"但是他建构了一种悬念 这种悬念感不是那种我们今天好像要用一种计划建构的，比如说一开始要一场大火把这个房子烧掉了。","sentence_en":"But he builds suspense, not the kind we deliberately construct today, like starting with a big fire burning down a house."},{"id":"337","start":2577.56,"end":2589.24,"displayStart":2577.56,"displayEnd":2589.24,"displayMid":2583.3999999999996,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Positive","score":0.5,"loudness":0.779006,"pitch":29.920826,"speechRate":5.479,"hasEvents":false,"sentence_source":"然后你知道想发生什么 就是用一种极端的戏剧化的事件，他不是这样的 他就是一个好像很平淡的一个女子，他的整个一个生活的经历 但是就是从剧层面。","sentence_en":"Then you know something will happen through extreme dramatic events. He doesn't do that. He writes about a seemingly ordinary woman, her life experiences, but from a dramatic perspective."},{"id":"338","start":2589.24,"end":2592.86,"displayStart":2589.24,"displayEnd":2592.86,"displayMid":2591.05,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":0.83287,"pitch":25.824331,"speechRate":6.077,"hasEvents":false,"sentence_source":"你觉得他有种不安感 你觉得有什么事情快要发生了。","sentence_en":"You feel a sense of unease, as if something is about to happen."},{"id":"339","start":2592.86,"end":2606.86,"displayStart":2592.86,"displayEnd":2606.86,"displayMid":2599.86,"speaker":"Qian Jianan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Readin ","score":0,"loudness":1.052453,"pitch":22.201376,"speechRate":4.629,"hasEvents":false,"sentence_source":"四个孩子 对就很奇特的那个年代的一个典型美国白人家庭主妇，就属于理理外外什么她都要打理的那个年代的一个女作家，我记得她说的是她在他们家第几个孩子出生前。","sentence_en":"Four children—yes, that was a typical American white housewife of that peculiar era, a female writer who had to manage everything inside and outside the home. I remember she said it was before the birth of their nth child."},{"id":"359","start":2788.68,"end":2802.76,"displayStart":2788.68,"displayEnd":2802.76,"displayMid":2795.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.006343,"pitch":22.434641,"speechRate":4.403,"hasEvents":false,"sentence_source":"她帮她老公烧了咖啡之后，一个人是坐车还是开车去了医院生孩子，我当然看到这段描述 我不仅吃惊 我都愤怒了，我说 天呐 这是一个什么生活的场景。","sentence_en":"After making coffee for her husband, she went to the hospital alone, either by bus or by car, to give birth. When I read that description, I was not only shocked but furious. I thought, 'My God, what kind of life scene is this?'"},{"id":"360","start":2802.76,"end":2806.12,"displayStart":2802.76,"displayEnd":2806.12,"displayMid":2804.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Negative","score":-0.7,"loudness":0.992836,"pitch":19.455225,"speechRate":5.676,"hasEvents":false,"sentence_source":"太过戏剧化 太充满刻板印象了 你知道吗。","sentence_en":"It’s just too dramatic and full of stereotypes, you know."},{"id":"361","start":2806.12,"end":2814.72,"displayStart":2806.12,"displayEnd":2814.72,"displayMid":2810.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Reading and Family Growth","sentiment_en":"Neutral","score":0,"loudness":1.093397,"pitch":24.338129,"speechRate":6.177,"hasEvents":false,"sentence_source":"所以我无法想象一个人可以在那样的环境当中写作，但会不会这样的很奇特的生活环境，才促使他能够写出  Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.93669,"pitch":20.308052,"speechRate":6.207,"hasEvents":false,"sentence_source":"我们有的时候不是生活在自己的环境当中，比如说我是北京 你是上海 我们生活在另外一个地方，你生活在洛杉矶未来美国的一个中小城市。","sentence_en":"Sometimes we don't live in our own environment. For example, I'm from Beijing, you're from Shanghai, but we live somewhere else. You live in LA or a small American city."},{"id":"519","start":3998.52,"end":4000.3,"displayStart":3998.52,"displayEnd":4000.3,"displayMid":3999.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Neutral","score":0,"loudness":0.933969,"pitch":29.372343,"speechRate":6.197,"hasEvents":false,"sentence_source":"因为不在自己的环境当中。","sentence_en":"Because you're not in your own environment."},{"id":"520","start":4000.3,"end":4014.28,"displayStart":4000.3,"displayEnd":4014.28,"displayMid":4007.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Positive","score":0.6,"loudness":0.842956,"pitch":23.635429,"speechRate":5.079,"hasEvents":false,"sentence_source":"我们可以好像某种程度获得一种特权，就不需要被这个环境所评判，这个环境所要求的一个人 一个女性，一个某一个年纪的女性，所有的社会的约定俗成 我都可以忽略不及。","sentence_en":"To some extent, we gain a privilege—we don't have to be judged by that environment. The expectations for a person, a woman, a woman of a certain age, all the social conventions, I can ignore them."},{"id":"521","start":4014.28,"end":4016.46,"displayStart":4014.28,"displayEnd":4016.46,"displayMid":4015.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Women's Life and Growth","sentiment_en":"Strongly Positive","score":0.8,"loudness":1.045315,"pitch":25.311518,"speechRate":5.305,"hasEvents":false,"sentence_source":"这某种程度是一种解放。","sentence_en":"To some extent, this is a liberation."},{"id":"522","star
