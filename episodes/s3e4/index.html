ge anxiety and physical condition","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.787285,"pitch":24.111794,"speechRate":5.749,"hasEvents":false,"sentence_source":"但是我自己生了很多病之后我现在每次如果是自己很有力气，比如说我健身完之后我从那个健身房出来走到路上我就会觉得，哇 这就是健康的感觉。","sentence_en":"But after getting sick so many times, now every time I feel strong—like after working out, walking out of the gym onto the street—I think, 'Wow, this is what health feels like."},{"id":"32","start":181.65,"end":194.29,"displayStart":181.65,"displayEnd":194.29,"displayMid":187.97,"speaker":"Siwen","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Age anxiety and physical condition","sentiment_en":"Neutral","score":-0.1,"loudness":0.914069,"pitch":22.873747,"speechRate":5.419,"hasEvents":true,"sentence_source":"就是经历会让人越来越变得千杯，就是以前你对健康都不在话下，但如今你会明白身体如此之重要，就是所有的都打不过岁月，岁月能把一个人收拾得服服铁铁的。","sentence_en":"Experience makes people more resilient. Before, you took health for granted, but now you understand how important the body is. Everything loses to time; time can humble a person completely."},{"id":"33","start":195.11,"end":198.93,"displayStart":195.11,"displayEnd":198.93,"displayMid":197.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":1.088277,"pitch":26.237003,"speechRate":4.468,"hasEvents":true,"sentence_source":"是 而且我之前有一个咨询师他就跟我讲。","sentence_en":"Yeah, and I had a counselor who once told me something."},{"id":"34","start":198.93,"end":209.15,"displayStart":198.93,"displayEnd":209.15,"displayMid":204.04000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.93972,"pitch":23.805965,"speechRate":5.196,"hasEvents":false,"sentence_source":"其实他最多的客户是那种富二代就是，所有人都很想往过富二代的人生，觉得富二代没有什么烦恼，但他最多的客户就是富二代。","sentence_en":"Actually, most of his clients were rich s 123,"hasEvents":false,"sentence_source":"那个时候吗 天啊 这个世界上怎么会有人穿八千多的衣服，这些衣服造给谁的呀 我就觉得对我的人生充满了冲击当时。","sentence_en":"At that time, I thought, 'Oh my god, how can anyone wear clothes that cost 8,000 yuan? Who are these clothes made for?' It was mind-blowing to me."},{"id":"65","start":453.39,"end":466.79,"displayStart":453.39,"displayEnd":466.79,"displayMid":460.09000000000003,"speaker":"Siwen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Neutral","score":0,"loudness":0.972507,"pitch":22.784754,"speechRate":5.051,"hasEvents":false,"sentence_source":"就是人从小到大成长过程当中你一定会经历一些这样的时刻，我一直到大概三十多岁吧 还是更晚安，我都觉得我从小到大 我生活当中我是没有什么偶像的概念。","sentence_en":"Throughout life, you definitely experience moments like that. Until I was about thirty-something, or even later, I thought I never had any idols growing up."},{"id":"66","start":466.79,"end":469.53,"displayStart":466.79,"displayEnd":469.53,"displayMid":468.15999999999997,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.5,"loudness":0.894867,"pitch":24.859676,"speechRate":7.299,"hasEvents":false,"sentence_source":"或者我没有被任何人影响过 而且我很以此为傲。","sentence_en":"I never felt influenced by anyone, and I was proud of that."},{"id":"67","start":469.53,"end":481.55,"displayStart":469.53,"displayEnd":481.55,"displayMid":475.53999999999996,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.881388,"pitch":22.107798,"speechRate":6.156,"hasEvents":false,"sentence_source":"我觉得我就是靠自然 天生我就长成后来那个样子很独立什么的，后来我发现其实根本就不是 你从小到大一定受过方方面面来自以外部的这种影响，或者某一个人或者某一个事。","sentence_en":"I thought I just naturally became who I am—very independent. But later I realized that's not true at all. You're always influenced by external things, by someone or something, from a young age."}, 95A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Negative","score":-0.4,"loudness":0.882264,"pitch":22.812672,"speechRate":5,"hasEvents":false,"sentence_source":"然后我就会心想 这个世界哪有什么爱情呢，不过是自欺欺人伴，就天天就会有这种想法，包括我觉得我当时受了一些你的影响。","sentence_en":"And I'd think: 'There's no such thing as love in this world—it's all self-deception.' I had those thoughts every day. And I think I was also influenced by you in some ways."},{"id":"73","start":512.61,"end":525.59,"displayStart":512.61,"displayEnd":525.59,"displayMid":519.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.5,"loudness":0.794706,"pitch":24.807322,"speechRate":5.564,"hasEvents":false,"sentence_source":"嗯 就是我觉得你会给我树立一个那种都市女性的一个蓝本，我记得我上大学的时候我姑当时问我她说，你觉得你想成为什么样的人，我说我想成为都市女性，每天穿着高跟鞋。","sentence_en":"Like, you set a blueprint for urban women in my mind. I remember in college, my aunt asked me, 'What kind of person do you want to become?' I said, 'I want to be an urban woman, wearing high heels every day,"},{"id":"74","start":525.59,"end":530.09,"displayStart":525.59,"displayEnd":530.09,"displayMid":527.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.4,"loudness":0.726063,"pitch":21.072247,"speechRate":3.556,"hasEvents":false,"sentence_source":"游走于那个繁华的都市的高楼大厦中。","sentence_en":"Walking through the skyscrapers of a bustling city."},{"id":"75","start":530.09,"end":537.75,"displayStart":530.09,"displayEnd":537.75,"displayMid":533.9200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.4,"loudness":0.751145,"pitch":25.392,"speechRate":5.483,"hasEvents":false,"sentence_source":"然后下了班跟朋友去一个可以放着爵士音乐的小酒吧，喝一杯鸡尾酒，我甚至都不知道什么是鸡尾酒。","sentence_en":"After work, going to a little bar with jazz music and having a cocktail—even though I had no idea what a cocktail was."},{"id":"76","start":538.59,"end":545.29,"displayStart":538.59,"displayEnd":545.29,"displayMid":541.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.5,"loudness":0.852366,"pitch":22.20195,"speechRate":4.732,"hasEvents":true,"sentence_source":"但是我觉得她构成了一些我对有知识的很独立的都是女性的一些幻想。","sentence_en":"But I think she formed some of my fantasies about knowledgeable, independent, urban women."},{"id":"77","start":545.29,"end":552.45,"displayStart":545.29,"displayEnd":552.45,"displayMid":548.87,"speaker":"Siwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.924842,"pitch":23.005356,"speechRate":4.609,"hasEvents":false,"sentence_source":"如果我告诉你 我当时 我96年到香港工作，差不多2001年之类的回到北京。","sentence_en":"If I tell you that when I went to work in Hong Kong in 1996 and came back to Beijing around 2001, I never went out to enjoy Hong Kong's nightlife—would you find that unbelievable?"},{"id":"78","start":552.45,"end":559.93,"displayStart":552.45,"displayEnd":559.93,"displayMid":556.19,"speaker":"Siwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.914887,"pitch":19.515438,"speechRate":4.813,"hasEvents":false,"sentence_source":"那我那几年我从来没有在晚上去过过所谓香港的夜生活，你觉得是不是特别不可思议。","sentence_en":"I completely understand now. When I was a kid, I would have found it unbelievable—how could her life be boring?"},{"id":"79","start":559.93,"end":565.87,"displayStart":559.93,"displayEnd":565.87,"displayMid":562.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.836546,"pitch":28.605101,"speechRate":5.245,"hasEvents":false,"sentence_source":"我现在非常理解 当我小时候肯定不可思议，她的生活怎么可能会枯燥呢。","sentence_en":"I'm also curious: what influenced you to be so independent?"},{"id":"80","start":565.87,"end":571.43,"displayStart":565.87,"displayEnd":571.43,"displayMid":568.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.877607,"pitch":21.993158,"speechRate":4.946,"hasEvents":false,"sentence_source":"那我也挺好奇的 就是您这种独立是受到什么样的影响我是。","sentence_en":"I'm quite a fatalist, and I believe many people's personalities are innate. External influence exists, but not that much."},{"id":"81","start":571.43,"end":580.91,"displayStart":571.43,"displayEnd":580.91,"displayMid":576.17,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.923787,"pitch":22.768549,"speechRate":4.852,"hasEvents":false,"sentence_source":"个比较宿命论的一个人 而且我总相信很多的人的，比如说性格 他是与生俱来的 后天的影响有 但是没有那么大。","sentence_en":"It might also be related to family background. For example, I know you were very close to your grandmother, right? She mostly raised you."},{"id":"82","start":580.91,"end":590.11,"displayStart":580.91,"displayEnd":590.11,"displayMid":585.51,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.933104,"pitch":20.28327,"speechRate":5.433,"hasEvents":false,"sentence_source":"然后可能跟原生家庭也有关系 就比如说像我从小，我知道你是跟你姥姥特别亲 对吧 等于是你姥姥更多时候带搭你。","sentence_en":"I was raised by my grandparents. So if a child grows up without their parents, deep down they must have a lot of... I don't know if I should call it insecurity—but anyway, they feel they need to be independent."},{"id":"83","start":590.11,"end":602.59,"displayStart":590.11,"displayEnd":602.59,"displayMid":596.35,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.861297,"pitch":22.37273,"speechRate":5.53,"hasEvents":false,"sentence_source":"那我是我爷爷奶奶带搭的 所以如果从小没有跟父母在一块的孩子，她内心深处一定是有很多的，我不知道能不能说是不安全感，她总之她会觉得我是需要独立的。","sentence_en":"So I was extremely independent from a young age. Of course, everything has two sides. The good part is you can grow into an independent woman, which is considered a great trait in our time. It is great, but you have to adjust it—because when it comes to close relationships,"},{"id":"84","start":602.59,"end":617.43,"displayStart":602.59,"displayEnd":617.43,"displayMid":610.01,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0.1,"loudness":0.906758,"pitch":21.323689,"speechRate":5.341,"hasEvents":false,"sentence_source":"所以我从小格外的独立，当然凡事都是双刃剑，好处就是你可以成长为一个独立的女性，这如今我们这个时代认为特别棒的一个特质，她的确很棒，但她需要自己去修正，就是你可能在跟别人。","sentence_en":"You might find it hard to deal with them."},{"id":"85","start":617.43,"end":621.43,"displayStart":617.43,"displayEnd":621.43,"displayMid":619.43,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.849461,"pitch":24.549454,"speechRate":5.472,"hasEvents":false,"sentence_source":"某种亲密关系的过程当中，你会比较难以去处理。","sentence_en":"Because you're too independent. Relationships are built on being a bother to each other and needing each other. When you feel you can handle everything yourself,"},{"id":"86","start":621.43,"end":630.85,"displayStart":621.43,"displayEnd":630.85,"displayMid":626.14,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.949041,"pitch":19.772968,"speechRate":5.76,"hasEvents":false,"sentence_source":"因为你太过独立了，人与人之间是靠彼此麻烦彼此需要才能够产生这种关系跟连接的，当你觉得我一切我都可以自我搞定的时候。","sentence_en":"and you don't really need the world around you, that connection becomes too fragile."},{"id":"87","start":630.85,"end":636.53,"displayStart":630.85,"displayEnd":636.53,"displayMid":633.69,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.4,"loudness":0.891616,"pitch":18.495916,"speechRate":4.606,"hasEvents":false,"sentence_source":"那你不太需要周围这个世界的话，这种连接就产生太过脆弱了。","sentence_en":"So later as I grew up, I realized independence can also bring things that aren't entirely good. But I think it's just how my environment shaped me from an early age."},{"id":"88","start":636.53,"end":649.11,"displayStart":636.53,"displayEnd":649.11,"displayMid":642.8199999999999,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.956988,"pitch":18.370117,"speechRate":5.374,"hasEvents":false,"sentence_source":"所以这也是我后来长大以后我发现，独立它也会带来一些未必全部都是好事的那个地方，但我认为它本身可能就是从小的那个环境把我塑造成这个样子的。","sentence_en":"I think you and I might be similar in that regard."},{"id":"89","start":649.11,"end":651.47,"displayStart":649.11,"displayEnd":651.47,"displayMid":650.29,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.3,"loudness":0.926673,"pitch":22.317032,"speechRate":7.289,"hasEvents":false,"sentence_source":"我觉得你可能跟我是有类似的地方的。","sentence_en":"Yes, I totally agree. I even think the independence I developed back then wasn't real independence."},{"id":"90","start":651.47,"end":658.25,"displayStart":651.47,"displayEnd":658.25,"displayMid":654.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.4,"loudness":0.761576,"pitch":23.796856,"speechRate":4.834,"hasEvents":false,"sentence_source":"对 我非常认同 而且我甚至觉得我那个时候所生成的独立并不是真正的独立。","sentence_en":"Because I had needs inside—I just avoided them."},{"id":"91","start":658.25,"end":661.41,"displayStart":658.25,"displayEnd":661.41,"displayMid":659.8299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.816949,"pitch":20.76671,"speechRate":7.581,"hasEvents":false,"sentence_source":"因为我内心是有需求的 只是我回避了自己的需求。","sentence_en":"I felt ashamed to need others. I didn't want to ask for anything from anyone."},{"id":"92","start":661.41,"end":675.49,"displayStart":661.41,"displayEnd":675.49,"displayMid":668.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.6,"loudness":0.786582,"pitch":19.756657,"speechRate":5.362,"hasEvents":false,"sentence_source":"我觉得对别人有需求这件事情是一件令我羞耻的事情 甚至是，就是我不愿意向别人去提出我有诉求这件事情，换句话说 我也不太敢去面对我自己还对别人有诉求这件事情你。","sentence_en":"In other words, I didn't dare to face the fact that I needed others."},{"id":"93","start":675.49,"end":677.37,"displayStart":675.49,"displayEnd":677.37,"displayMid":676.4300000000001,"speaker":"Siwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Negative","score":-0.3,"loudness":1.157171,"pitch":19.677372,"speechRate":6.915,"hasEvents":false,"sentence_source":"其实怕被拒绝 我是这样的或者。","sentence_en":"Actually, it's fear of rejection—for me."},{"id":"94","start":677.37,"end":687.69,"displayStart":677.37,"displayEnd":687.69,"displayMid":682.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Fertility and women's plight","sentiment_en":"Negative","score":-0.5,"loudness":0.852042,"pitch":24.541584,"speechRate":5.62,"hasEvents":false,"sentence_source":"是有一种孔弱症，就是我都对别人有需求，我好弱呀，我不希望我自己这样这么弱，我希望我很强大，我希望我很独立，不需要任何人我也能搞定。","sentence_en":"Or it's like a fear of being weak: 'If I need others, I'm so weak. I don't want to be weak. I want to be strong, independent, and able to handle everything without anyone."},{"id":"95","start":687.69,"end":697.07,"displayStart":687.69,"displayEnd":697.07,"displayMid":692.3800000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Fertility and women's plight","sentiment_en":"Neutral","score":0,"loudness":0.856001,"pitch":23.534655,"speechRate":5.045,"hasEvents":false,"sentence_source":"所以我记得我小时候就是经常看那种，女性作家的小说，比如我经常看那个铁宁，还有那个池莉他们写的东西。","sentence_en":"So I remember often reading novels by female writers like Tie Ning and Chi Li."},{"id":"96","start":697.07,"end":702.03,"displayStart":697.07,"displayEnd":702.03,"displayMid":699.55,"speaker":"Siwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.5,"loudness":1.279113,"pitch":22.824322,"speechRate":4.839,"hasEvents":false,"sentence_source":"希达也是我最喜欢的，我有池莉，我有池莉全部的小说是吧。","sentence_en":"Xi Da is also my favorite. I have all of Chi Li's novels."},{"id":"97","start":702.03,"end":703.51,"displayStart":702.03,"displayEnd":703.51,"displayMid":702.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":1.106897,"pitch":22.180399,"speechRate":3.378,"hasEvents":false,"sentence_source":"我也80%吧。","sentence_en":"Me too—about 80%."},{"id":"98","start":703.51,"end":713.91,"displayStart":703.51,"displayEnd":713.91,"displayMid":708.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.915687,"pitch":23.449461,"speechRate":4.97,"hasEvents":false,"sentence_source":"我觉得她俩给我传达了一个观念，就是比较类似的东西，她俩都特别不喜欢求人 我感觉，我虽然不记得她们具体在写什么。","sentence_en":"I feel they both conveyed a similar message to me: they both really disliked asking for favors. I don't remember exactly what they wrote,"},{"id":"99","start":713.91,"end":717.33,"displayStart":713.91,"displayEnd":717.33,"displayMid":715.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.929147,"pitch":26.593258,"speechRate":7.474,"hasEvents":false,"sentence_source":"但是好像她们给我输出的一个很重要的关键就是不要求人。","sentence_en":"But I think they taught me an important principle: don't ask for favors."},{"id":"100","start":717.33,"end":719.71,"displayStart":717.33,"displayEnd":719.71,"displayMid":718.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.2,"loudness":0.940258,"pitch":21.866545,"speechRate":7.33,"hasEvents":false,"sentence_source":"因为求人是一件非常被动的事情。","sentence_en":"Because asking for a favor puts you in a passive position."},{"id":"101","start":719.71,"end":733.19,"displayStart":719.71,"displayEnd":733.19,"displayMid":726.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.4,"loudness":0.795344,"pitch":22.869726,"speechRate":5.193,"hasEvents":false,"sentence_source":"所以我觉得那个时候可能很多女性会破于这种，外部环境的一些不太友好去逼迫自己强大起来，不要求人 一定要自己振作起来，不管遇到什么样的困难 我一定要扛过去。","sentence_en":"So I think at that time, many women were forced by an unfriendly external environment to push themselves to be strong—don't ask, just tough it out, no matter what difficulties you face."},{"id":"102","start":733.19,"end":747.55,"displayStart":733.19,"displayEnd":747.55,"displayMid":740.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0.1,"loudness":0.805024,"pitch":24.328516,"speechRate":4.515,"hasEvents":false,"sentence_source":"我觉得这个也是一个时代的烙印或者说一代人的一些伤痛我觉得，我现在反而对独立有一些其他理解吧，可能独立是一种你可以自己去跟自己好好相处。","sentence_en":"I think that's a mark of that era, or even a kind of pain for that generation. Now I have a different understanding of independence. Maybe independence means being able to get along well with yourself,"},{"id":"103","start":747.55,"end":762.17,"displayStart":747.55,"displayEnd":762.17,"displayMid":754.8599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.7,"loudness":0.884734,"pitch":23.501015,"speechRate":4.675,"hasEvents":false,"sentence_source":"然后也可以松弛下来跟其他人好好相处，你也可以去友好地接受别人的关心和照顾和帮助，也可以非常自然地去跟别人说，我有这样的诉求并不以自己有需求为耻。","sentence_en":"And also relax and get along well with others. You can openly accept care, concern, and help from others, and naturally tell them that you have this need—without feeling ashamed of having needs."},{"id":"104","start":762.17,"end":769.81,"displayStart":762.17,"displayEnd":769.81,"displayMid":765.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.841443,"pitch":21.154406,"speechRate":4.205,"hasEvents":false,"sentence_source":"这个过程 我觉得需要相当一段时间的自我思考和成长吧 我是这种感觉。","sentence_en":"That process takes quite a while of self-reflection and growth, I think."},{"id":"105","start":769.81,"end":778.27,"displayStart":769.81,"displayEnd":778.27,"displayMid":774.04,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.6,"loudness":0.919257,"pitch":25.895016,"speechRate":5.546,"hasEvents":false,"sentence_source":"我觉得真正独立就是当你发现生活当中你出现某种 有可能是属于弱势的时候 你并不会特别的慌张 你很接受。","sentence_en":"True independence is when you find yourself in a vulnerable position in life, but you don't panic—you just accept it."},{"id":"106","start":778.27,"end":785.15,"displayStart":778.27,"displayEnd":785.15,"displayMid":781.71,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":1.00519,"pitch":19.234711,"speechRate":6.565,"hasEvents":false,"sentence_source":"比如我今天早上我吃早饭的时候 我想打开那个果酱瓶 一个新的果酱瓶 你要照这种瓶都很难打的。","sentence_en":"For example, this morning during breakfast, I wanted to open a new jar of jam. Those jars are always so hard to open."},{"id":"107","start":785.15,"end":797.13,"displayStart":785.15,"displayEnd":797.13,"displayMid":791.14,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.5,"loudness":1.043224,"pitch":24.636486,"speechRate":5.544,"hasEvents":false,"sentence_source":"其实如果是以前的话 你瞬间就会崩溃，我会觉得 这种事我都干不了，就你会瞬间的 会因为有这样一件小事，你会像那个雪崩一样，引发你一系列负面情绪的反应。","sentence_en":"In the past, I would have instantly broken down. I'd think, 'I can't even do this simple thing.' That one small failure would trigger an avalanche of negative emotions."},{"id":"108","start":797.13,"end":805.29,"displayStart":797.13,"displayEnd":805.29,"displayMid":801.21,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.6,"loudness":1.065664,"pitch":21.136766,"speechRate":6.435,"hasEvents":false,"sentence_source":"那我现在就不会了，大不了我不吃又能怎样，这就是我对我来说是一个成熟的一个标志，就这种小事已经很难去影响到你。","sentence_en":"But now I don't react that way. So what if I just skip it? That's a sign of maturity for me—these small things no longer affect me."},{"id":"109","start":805.29,"end":817.47,"displayStart":805.29,"displayEnd":817.47,"displayMid":811.38,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.4,"loudness":0.892499,"pitch":21.62248,"speechRate":5.665,"hasEvents":false,"sentence_source":"但是之前可能分分钟会摧毁你，我一个女朋友，她说她有一次发烧 病得特别厉害，也是跟我一样 她那天特别想吃那个酱豆腐，姜豆腐那瓶就打不开，他当然说我特别崩溃。","sentence_en":"But before, something like that could crush you. A female friend once told me she was really sick with a fever, and she desperately wanted some fermented tofu. But she couldn't open the jar. She said she was completely devastated."},{"id":"110","start":817.47,"end":821.55,"displayStart":817.47,"displayEnd":821.55,"displayMid":819.51,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.863849,"pitch":20.022194,"speechRate":4.167,"hasEvents":false,"sentence_source":"我当时想 我不如嫁个人算了，我说我还好。","sentence_en":"At that moment, she thought, 'Maybe I should just get married.' I said I was fine."},{"id":"111","start":821.55,"end":835.91,"displayStart":821.55,"displayEnd":835.91,"displayMid":828.73,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.5,"loudness":1.005871,"pitch":21.386629,"speechRate":5.362,"hasEvents":false,"sentence_source":"那在那一刻 我打电话给我妈，我妈说 我帮你去看那个姜豆腐瓶，说你千万不要因为打不开一个瓶子，你就想要嫁给谁，当时我们狂笑，但我特别能够理解，就他不是因为一个姜豆腐瓶而崩溃。","sentence_en":"And then she called her mom. Her mom said, 'Let me go check that tofu jar for you. Don't ever decide to marry someone just because you can't open a jar.' We laughed hysterically, but I totally understood—she wasn't breaking down because of the jar."},{"id":"112","start":835.91,"end":843.11,"displayStart":835.91,"displayEnd":843.11,"displayMid":839.51,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":1.000733,"pitch":24.382858,"speechRate":5.567,"hasEvents":false,"sentence_source":"而是因为他会突然发现，生活当中会有很多之如此类的小小，或大大的事儿，他一个人不足以搞定。","sentence_en":"It was because she suddenly realized that life has so many small or big things like that, and she can't handle them all alone."},{"id":"113","start":843.11,"end":850.21,"displayStart":843.11,"displayEnd":850.21,"displayMid":846.6600000000001,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.5,"loudness":1.084436,"pitch":23.04557,"speechRate":5.939,"hasEvents":false,"sentence_source":"那如今我就会想 搞不定我就搞不定，我该找谁帮助找谁帮助 但不用把我的人生一竿子给处出去。","sentence_en":"Now I think, if I can't do it, I can't do it. I'll ask for help when needed, but I won't throw my whole life away over it."},{"id":"114","start":850.21,"end":864.49,"displayStart":850.21,"displayEnd":864.49,"displayMid":857.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.3,"loudness":0.835473,"pitch":23.566504,"speechRate":4.811,"hasEvents":false,"sentence_source":"对 其实这件事情 受我一个朋友的启发蛮大的，她是一个特别可爱的女生 然后是83年的，她可能毕业之后工作过两年吧 然后就嫁人了，嫁人之后就一直没有工作过。","sentence_en":"Yes, actually, I was really inspired by a friend. She's a very lovely woman, born in '83. She probably worked for two years after graduation, then got married and never worked since."},{"id":"115","start":864.49,"end":868.33,"displayStart":864.49,"displayEnd":868.33,"displayMid":866.4100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.933042,"pitch":25.453491,"speechRate":5.63,"hasEvents":false,"sentence_source":"就她老公比较有钱 她就一直当扩态 生了三个孩子。","sentence_en":"Her husband is quite wealthy, so she's been a stay-at-home wife and had three kids."},{"id":"116","start":868.33,"end":871.61,"displayStart":868.33,"displayEnd":871.61,"displayMid":869.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.7,"loudness":0.857534,"pitch":24.088388,"speechRate":5.793,"hasEvents":false,"sentence_source":"然后家庭非常幸福 也很美满 她每天也很开心。","sentence_en":"Her family is very happy and fulfilling, and she's cheerful every day."},{"id":"117","start":871.61,"end":884.19,"displayStart":871.61,"displayEnd":884.19,"displayMid":877.9000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.812522,"pitch":23.480656,"speechRate":4.996,"hasEvents":false,"sentence_source":"但是呢我其实之前一直对这种纯家庭嘱咐是有一些自己的看法呢我就，会觉得这些女生应该总是会有一些不自信或者觉得自己没有价值的地方吧。","sentence_en":"But honestly, I used to have my own opinions about full-time homemakers. I thought these women must always feel a bit insecure or think they lack value."},{"id":"118","start":884.19,"end":887.69,"displayStart":884.19,"displayEnd":887.69,"displayMid":885.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.2,"loudness":0.837054,"pitch":24.308067,"speechRate":6.195,"hasEvents":false,"sentence_source":"就是我觉得他们会经常自我怀疑吧 这是我的判断。","sentence_en":"I mean, I assumed they often doubted themselves—that was my judgment."},{"id":"119","start":887.69,"end":901.03,"displayStart":887.69,"displayEnd":901.03,"displayMid":894.36,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.5,"loudness":0.760767,"pitch":25.941391,"speechRate":4.498,"hasEvents":false,"sentence_source":"但是有一天我就跟她聊天 我就说你做饭这么好吃，为什么从来没有想过做点什么美食相关的工作呢，她说 我不喜欢工作，你看 我就觉得她很自洽。","sentence_en":"But one day I chatted with her and said, 'You cook so well, why haven't you ever considered a food-related job?' She said, 'I don't like working.' See? I found her very self-consistent."},{"id":"120","start":901.03,"end":914.29,"displayStart":901.03,"displayEnd":914.29,"displayMid":907.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.6,"loudness":0.800116,"pitch":27.253555,"speechRate":5.354,"hasEvents":false,"sentence_source":"那一刻我突然觉得 原来世界上真的是有人，什么价值都不用创造 都觉得自己，我很好呀 我很开心啊，我非常乐意过这样的生活 不想去工作，不要让我去工作 我就是喜欢这样。","sentence_en":"At that moment, I suddenly realized there really are people who don't need to create any value to feel good about themselves. 'I'm fine, I'm happy, I love this life. I don't want to work. Don't make me work. I just like it this way."},{"id":"121","start":914.29,"end":916.01,"displayStart":914.29,"displayEnd":916.01,"displayMid":915.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.5,"loudness":0.701168,"pitch":23.750822,"speechRate":5.814,"hasEvents":false,"sentence_source":"我那一刻觉得还蛮震撼。","sentence_en":"That was quite shocking to me."},{"id":"122","start":916.01,"end":930.67,"displayStart":916.01,"displayEnd":930.67,"displayMid":923.3399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.6,"loudness":0.837188,"pitch":23.179688,"speechRate":5.116,"hasEvents":false,"sentence_source":"因为我觉得 但凡声称自己不工作，也过得很开心的女性 多少都有点自我欺骗，但那一刻我看到她的样子，我知道她并没有任何自我欺骗，她是发自内心的很享受当家庭主夫这个事情。","sentence_en":"Because I had thought any woman who claimed to be happy without working was somewhat self-deceiving. But seeing her then, I knew she wasn't deceiving herself at all. She genuinely enjoyed being a homemaker."},{"id":"123","start":931.03,"end":944.23,"displayStart":931.03,"displayEnd":944.23,"displayMid":937.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.877049,"pitch":23.919426,"speechRate":5.47,"hasEvents":false,"sentence_source":"我那天就在想原来我挺狭隘的，就是因为我用我的角度去推测很多人，他们不创造价值他们就觉得自己不行，前两天他们潜踩我的时候，他说你之前说过女性最发光的时刻。","sentence_en":"That day I thought, 'I was really narrow-minded. I was projecting my own perspective, assuming people feel worthless if they don't create value.' The other day, someone subtly criticized me, saying, 'You once said a woman's most radiant moment is when she creates value."},{"id":"124","start":944.23,"end":948.97,"displayStart":944.23,"displayEnd":948.97,"displayMid":946.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.955662,"pitch":23.52923,"speechRate":6.415,"hasEvents":false,"sentence_source":"就是她创造价值的时刻，你现在你觉得你自己创造价值是什么时刻。","sentence_en":"That is, the moment she creates value. Now, what do you think is your moment of creating value?"},{"id":"125","start":948.97,"end":962.89,"displayStart":948.97,"displayEnd":962.89,"displayMid":955.9300000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.4,"loudness":0.91417,"pitch":26.793222,"speechRate":4.734,"hasEvents":false,"sentence_source":"然后我心想我还说过这种话天呀，这是多么恐惧的人呢，我现在就觉得很多女性她就过家庭生活什么的，就是为什么一定要成为那种所谓的独立女性对吧。","sentence_en":"And I thought, 'I said that? Oh my god, what a scary person I was.' Now I feel that many women just live a family life. Why must they become so-called independent women, right?"},{"id":"126","start":962.89,"end":972.73,"displayStart":962.89,"displayEnd":972.73,"displayMid":967.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.7,"loudness":0.86945,"pitch":23.61865,"speechRate":6.595,"hasEvents":false,"sentence_source":"就我觉得她真心的喜欢自己的这种生活自己的这种选择就挺好的，她就是挺独立的 因为她做出了自己独立的判断，这个不是别人让她去当的 自己就爱当。","sentence_en":"I just think it's great that she genuinely likes her life and her choices. She's independent because she made her own judgment—nobody told her to be that way; she just loves it."},{"id":"127","start":972.73,"end":976.23,"displayStart":972.73,"displayEnd":976.23,"displayMid":974.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.4,"loudness":1.061158,"pitch":26.967253,"speechRate":5.119,"hasEvents":false,"sentence_source":"我觉得好像那一瞬间我有点被颠覆。","sentence_en":"I felt like my mind was blown in that moment."},{"id":"128","start":976.23,"end":982.83,"displayStart":976.23,"displayEnd":982.83,"displayMid":979.53,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":1.058558,"pitch":23.300474,"speechRate":5.455,"hasEvents":false,"sentence_source":"其实你刚刚说的那个对于家庭主妇的那个感受，我是在比如说有时候去日本玩的时候。","sentence_en":"Actually, that feeling about being a housewife you just mentioned—I had it, for example, when visiting Japan."},{"id":"129","start":982.83,"end":994.41,"displayStart":982.83,"displayEnd":994.41,"displayMid":988.62,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.4,"loudness":1.033135,"pitch":26.833843,"speechRate":5.761,"hasEvents":false,"sentence_source":"然后我看到接下来很多日本的家庭主妇 我就想，啊 我说一个人他要从小到大上那么多学 考那么多事，好不容易毕业了 我都不试一试 我曾经考过那么多试。","sentence_en":"Then I o do the job well and earn my salary. I'm just... honestly, I'm not someone who likes being on TV."},{"id":"188","start":1464.83,"end":1478.27,"displayStart":1464.83,"displayEnd":1478.27,"displayMid":1471.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Negative","score":-0.4,"loudness":0.969643,"pitch":26.691721,"speechRate":5.914,"hasEvents":false,"sentence_source":"然后我上电视的那一天我希望没有人发现这件事情 反正那个节目也没有很多人看，没想到呢 节目第一期播出的那一天我们班的初中同学群 高中同学群全都炸过了说 啊 黄色的上电视。","sentence_en":"Then on the day my episode aired, I hoped no one would notice, since not many people watch that show. Unexpectedly, on the first day the episode aired, my middle school and high school class group chats exploded, saying, 'Wow, so-and-so is on TV!'"},{"id":"189","start":1478.5,"end":1486.4,"displayStart":1478.5,"displayEnd":1486.4,"displayMid":1482.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Negative","score":-0.6,"loudness":0.866002,"pitch":19.401703,"speechRate":4.605,"hasEvents":false,"sentence_source":"我就很害怕 我就会害怕他们的夸奖 我也害怕他们的批评 虽然他们也并没有批评我。","sentence_en":"I was really scared. I feared their praise and their criticism, even though they hadn't criticized me."},{"id":"190","start":1486.4,"end":1490.42,"displayStart":1486.4,"displayEnd":1490.42,"displayMid":1488.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Neutral","score":0,"loudness":0.934611,"pitch":23.284966,"speechRate":5.392,"hasEvents":false,"sentence_source":"但是我知道她们其实是出于一些面子 或者怎么样。","sentence_en":"But I know they did it out of some sense of face or something."},{"id":"191","start":1491.24,"end":1503.98,"displayStart":1491.24,"displayEnd":1503.98,"displayMid":1497.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.968532,"pitch":23.987125,"speechRate":5.202,"hasEvents":false,"sentence_source":"然后呢 那个时候就受到了很多来自于网友的批评，虽然很少啊 比如说一条微博它只有10条评论，8条是骂我的 这8条评论就会给我造成极大的精神伤害。","sentence_en":"Then at that time, I received a lot of criticism from netizens. Although it was rare—for example, a Weibo post might only have 10 comments, 8 of which were cursing me—those 8 comments caused me immense mental harm."},{"id":"192","start":1503.98,"end":1507.78,"displayStart":1503.98,"displayEnd":1507.78,"displayMid":1505.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.030079,"pitch":26.278641,"speechRate":5.789,"hasEvents":false,"sentence_source":"我当时就是一个人趴在床上 然后舞着我的心脏。","sentence_en":"At that time, I was lying face down on the bed, holding my heart."},{"id":"193","start":1507.78,"end":1519.48,"displayStart":1507.78,"displayEnd":1519.48,"displayMid":1513.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Negative","score":-0.8,"loudness":0.911707,"pitch":21.696051,"speechRate":5.47,"hasEvents":false,"sentence_source":"因为我的心脏在痛过感觉 就这样子呆了两个小时，我才缓过气来 我觉得 我才能穿上一口气 才能继续我的生活，后来呢 就是慢慢的可能骂的人越来越多吧。","sentence_en":"Because my heart was aching, and I just sat there like that for two hours before I could catch my breath. I felt like I could finally take a breath and continue with my life. Later, as more and more people started cursing me out..."},{"id":"194","start":1519.48,"end":1522.96,"displayStart":1519.48,"displayEnd":1522.96,"displayMid":1521.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Negative","score":-0.7,"loudness":0.644417,"pitch":23.695288,"speechRate":5.747,"hasEvents":false,"sentence_source":"然后你就不停的去经历这种痛苦 不停的去接受。","sentence_en":"And then you keep experiencing this pain, keep accepting it."},{"id":"195","start":1522.96,"end":1526.78,"displayStart":1522.96,"displayEnd":1526.78,"displayMid":1524.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Views on podcasts","sentiment_en":"Neutral","score":0.2,"loudness":0.800807,"pitch":25.601004,"speechRate":6.167,"hasEvents":false,"sentence_source":"然后接上到最后 哎呀 就已经OK了 就息以为长了。","sentence_en":"And then finally, ah, it's okay, you get used to it."},{"id":"196","start":1526.78,"end":1537.04,"displayStart":1526.78,"displayEnd":1537.04,"displayMid":1531.9099999999999,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0.1,"loudness":1.008148,"pitch":22.882771,"speechRate":5.065,"hasEvents":false,"sentence_source":"我觉得这就是一个慢慢摆练成纲的一个过程，我之前在跟另外一个你们同行聊天的时候，他也表达过跟你一样的一个感觉。","sentence_en":"I think this is a process of gradually training yourself. When I was chatting with another colleague of yours, he expressed the same feeling as you."},{"id":"197","start":1537.04,"end":1549.18,"displayStart":1537.04,"displayEnd":1549.18,"displayMid":1543.1100000000001,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0,"loudness":0.990675,"pitch":22.871218,"speechRate":5.27,"hasEvents":false,"sentence_source":"我觉得每个人都会有这么一个从一开始一点一点磨练的一个过程，但我觉得这还不是特别难的，男的就是你个人的生活 如果被别人去审视 去放大的话。","sentence_en":"I think everyone goes through this process of gradual tempering from the start, but I don't think this is particularly hard. The hard part is when your personal life is scrutinized and magnified by others."},{"id":"198","start":1549.18,"end":1561.78,"displayStart":1549.18,"displayEnd":1561.78,"displayMid":1555.48,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.6,"loudness":0.977331,"pitch":25.346334,"speechRate":5.556,"hasEvents":false,"sentence_source":"但是我觉得你又很勇敢 因为做脱口秀，就是你要把你最痛的事情拿出来说 即是悖论，但我之前看有一个是黎巴嫩裔的一个脱口秀演员，叫他那名字 我不会发音 N-E-M-R。","sentence_en":"But I think you're very brave because doing stand-up comedy means you have to talk about your most painful experiences. It's a paradox. I once saw a Lebanese-American stand-up comedian named... I can't pronounce his name, N-E-M-R."},{"id":"199","start":1561.78,"end":1571.4,"displayStart":1561.78,"displayEnd":1571.4,"displayMid":1566.5900000000001,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.6,"loudness":0.979104,"pitch":21.035751,"speechRate":5.76,"hasEvents":false,"sentence_source":"然后就讲到他小时候 他说你们认为会有那什么PTSD，我告诉你什么叫PTSD，我从小我们做着那个手术 然后那边炸弹响了。","sentence_en":"And then he talked about his childhood. He said, 'You think you know what PTSD is? Let me tell you what PTSD is. I was having surgery as a child, and then a bomb went off."},{"id":"200","start":1571.4,"end":1573.84,"displayStart":1571.4,"displayEnd":1573.84,"displayMid":1572.62,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.5,"loudness":0.969233,"pitch":18.694027,"speechRate":5.738,"hasEvents":true,"sentence_source":"然后我们要跑 说这个叫 PTSD。","sentence_en":"And then we have to run, calling it PTSD."},{"id":"201","start":1574.32,"end":1586.4,"displayStart":1574.32,"displayEnd":1586.4,"displayMid":1580.3600000000001,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.5,"loudness":1.026768,"pitch":23.991095,"speechRate":5.992,"hasEvents":false,"sentence_source":"然后我看那个弹幕里面都在写，说好残忍的，他讲他的这个痛苦 你们都在笑，我想那这不就是脱口秀的意义吗，就把我们特别痛的拿出来说，但即便如此 你要能够去敢讲的话。","sentence_en":"Then I saw all the comments saying, 'That's so cruel. He's talking about his pain and you're all laughing.' I thought, isn't that the point of stand-up? To bring out our deepest pain and talk about it. But even so, being brave enough to talk about it..."},{"id":"202","start":1586.4,"end":1599.06,"displayStart":1586.4,"displayEnd":1599.06,"displayMid":1592.73,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0.1,"loudness":0.969536,"pitch":22.104334,"speechRate":5.766,"hasEvents":false,"sentence_source":"我觉得还是很难的一件事，包括你后来比如讲你的自己的生活，讲情感讲婚姻，就这一切 我觉得我可能做不到，但比如说你能够做到是因为你必须要，这是你的生活 你的素材来源。","sentence_en":"I think it's still a very difficult thing. Including later, when you talk about your own life, your emotions, your marriage—all of that. I feel like I couldn't do it. But you can do it because you have to—it's your life, your source of material."},{"id":"203","start":1599.06,"end":1604.62,"displayStart":1599.06,"displayEnd":1604.62,"displayMid":1601.84,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.6,"loudness":0.976193,"pitch":19.427254,"speechRate":5.693,"hasEvents":false,"sentence_source":"还是你内心真的已经是足够强大到我就是可以去说可以去笑谈这一切。","sentence_en":"Or is your heart really strong enough that you can just talk and laugh about all this?"},{"id":"204","start":1604.62,"end":1617.88,"displayStart":1604.62,"displayEnd":1617.88,"displayMid":1611.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0.1,"loudness":0.849626,"pitch":24.354565,"speechRate":5.646,"hasEvents":false,"sentence_source":"我是觉得如果没有这个能力的人 他是没法来做脱口秀这一行的，就是做脱口秀这个行业的人 我觉得他们默认都有这样的能力，我不排除有一些表演段落也许有刻意的成分啊。","sentence_en":"I think if someone doesn't have this ability, they can't be in stand-up comedy. People in this field, I think they default have this ability. I'm not ruling out that some performance segments might have deliberate elements though."},{"id":"205","start":1617.88,"end":1633.84,"displayStart":1617.88,"displayEnd":1633.84,"displayMid":1625.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.7,"loudness":0.809488,"pitch":23.317558,"speechRate":4.867,"hasEvents":false,"sentence_source":"但是我觉得我自己从小都不是一个去忌讳谈自己生活中的糟糕的事情的人，可能我会觉得挺好笑的吧 我就发自内心觉得挺好笑的，就比如说去年上那个拖鞠带会，我确实觉得很逗我。","sentence_en":"But I think I've never been someone who shies away from talking about the bad things in my life. Maybe I find it funny—I genuinely find it funny. For example, last year when I went on that talk show, I really thought it was amusing."},{"id":"206","start":1633.84,"end":1646.24,"displayStart":1633.84,"displayEnd":1646.24,"displayMid":1640.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.7,"loudness":0.931073,"pitch":28.397247,"speechRate":5.045,"hasEvents":false,"sentence_source":"就是我一上去他说，哦 你跟程鲁如何如何，我先讲这客离婚cp这不逗吗，这都好笑呀大家能讲出来，大部分都是你发自内心的，觉得这个事情挺好笑的。","sentence_en":"Like when I go up, they say, 'Oh, you and Cheng Lu this and that.' I first talk about this 'guest divorce couple'—isn't that funny? Everyone can talk about it. Most of it comes from the heart, genuinely thinking it's funny."},{"id":"207","start":1646.24,"end":1653.38,"displayStart":1646.24,"displayEnd":1653.38,"displayMid":1649.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.3,"loudness":0.928633,"pitch":26.246698,"speechRate":5.71,"hasEvents":false,"sentence_source":"我觉得如果你并不认为这个好笑，只是为了面对我的伤痛，只是为了勇敢的诉说自己跟他和解。","sentence_en":"I think if you don't actually think it's funny, and you're only doing it to face your pain, to bravely speak about it and reconcile with it..."},{"id":"208","start":1653.92,"end":1657.64,"displayStart":1653.92,"displayEnd":1657.64,"displayMid":1655.7800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.4,"loudness":0.874533,"pitch":22.78503,"speechRate":6.63,"hasEvents":false,"sentence_source":"我觉得其实台下的人，也会感受到那种难受和那种毕业扭。","sentence_en":"I think the audience will also feel that discomfort and that awkwardness."},{"id":"209","start":1657.64,"end":1667.12,"displayStart":1657.64,"displayEnd":1667.12,"displayMid":1662.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.6,"loudness":0.940974,"pitch":23.688612,"speechRate":5.22,"hasEvents":false,"sentence_source":"所以但凡能让你笑的这些段落，我相信表演者都已经跟他充分和解了，并且是发自内心觉得好笑，他才能够让你去笑。","sentence_en":"So for any segment that makes you laugh, I believe the performer has fully reconciled with it and genuinely finds it funny, so they can make you laugh."},{"id":"210","start":1667.58,"end":1669.5,"displayStart":1667.58,"displayEnd":1669.5,"displayMid":1668.54,"speaker":"Siwen","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Positive","score":0.6,"loudness":1.247592,"pitch":29.643646,"speechRate":7.67,"hasEvents":false,"sentence_source":"那就是你先天的你内心是很强。","sentence_en":"So it means you're innately strong inside."},{"id":"211","start":1669.5,"end":1676.46,"displayStart":1669.5,"displayEnd":1676.46,"displayMid":1672.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.897623,"pitch":22.90398,"speechRate":5.172,"hasEvents":false,"sentence_source":"大的一个人，我比较极端吧 两个极端吧，方面又很脆弱 另外一方面很强大，我后来想了想。","sentence_en":"I'm a rather extreme person, two extremes. On one hand, very fragile; on the other, very strong. I thought about it later."},{"id":"212","start":1676.46,"end":1680.04,"displayStart":1676.46,"displayEnd":1680.04,"displayMid":1678.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.961436,"pitch":26.549953,"speechRate":5.658,"hasEvents":false,"sentence_source":"我觉得可能是我妈跟我姥姥的一些巨大反差吧。","sentence_en":"I think it might be due to the huge contrast between my mom and my grandma."},{"id":"213","start":1680.04,"end":1689.16,"displayStart":1680.04,"displayEnd":1689.16,"displayMid":1684.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.7,"loudness":0.946,"pitch":21.863556,"speechRate":5.61,"hasEvents":false,"sentence_source":"我觉得我姥姥给了我很多安全感，就是我姥姥是一个非常喜欢夸奖我的人，她对我的夸奖有时候让我觉得都有点夸张。","sentence_en":"I think my grandma gave me a lot of security. She was someone who really liked to praise me. Sometimes her praise felt a bit over the top."},{"id":"214","start":1689.16,"end":1702.86,"displayStart":1689.16,"displayEnd":1702.86,"displayMid":1696.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Positive","score":0.7,"loudness":0.864644,"pitch":26.939848,"speechRate":5.62,"hasEvents":false,"sentence_source":"但是她是发自内心的夸奖我，就比如说她经常会跟我讲别人家的小孩，但她跟我讲的是，哎呀小孩 我们家文文多厉害呀，还会在班里面画黑板包，你看别人家的小孩，根本都没有画过黑板包。","sentence_en":"But she praised me from the heart. For example, she often talked about other people's kids, but she would say, 'Oh, look at our Wenwen, so amazing! She even draws on the blackboard in class. Other kids have never drawn on the blackboard."},{"id":"215","start":1703.52,"end":1705.46,"displayStart":1703.52,"displayEnd":1705.46,"displayMid":1704.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2 有太多来往 我妈大概一年回家一次。","sentence_en":"Because we didn't have much interaction when I was little. My mom came home about once a year."},{"id":"234","start":1838.94,"end":1845.7,"displayStart":1838.94,"displayEnd":1845.7,"displayMid":1842.3200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.972871,"pitch":25.659769,"speechRate":5.03,"hasEvents":false,"sentence_source":"然后当时就是有时候在家玩着玩着突然一转身，后面有一个年轻的女性在喊 文文。","sentence_en":"And sometimes when I was playing at home, I'd suddenly turn around and there was a young woman behind me calling, 'Wenwen."},{"id":"235","start":1845.7,"end":1857.8,"displayStart":1845.7,"displayEnd":1857.8,"displayMid":1851.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0.1,"loudness":0.936275,"pitch":24.878365,"speechRate":5.43,"hasEvents":false,"sentence_source":"然后我一转身一看 有一个非常时髦的女人，带着墨镜 然后穿着一个大凤衣，还拎着一个那种有一个箱子的名字叫黄冠，不知道你知不知道 我知道，就那个箱子。","sentence_en":"Then I turned around and saw a very stylish woman wearing sunglasses and a trench coat, carrying a suitcase called 'Huang Guan'—don't know if you know it, but I do, that suitcase."},{"id":"236","start":1857.8,"end":1862.64,"displayStart":1857.8,"displayEnd":1862.64,"displayMid":1860.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":1.002517,"pitch":25.406004,"speechRate":5.696,"hasEvents":false,"sentence_source":"然后那种塑料壳的箱子站在我们家门口，我当时就 天呀 这是谁呀。","sentence_en":"And that plastic-shell suitcase was standing at our doorstep. I was like, 'Oh my god, who is this?"},{"id":"237","start":1862.64,"end":1865.08,"displayStart":1862.64,"displayEnd":1865.08,"displayMid":1863.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster": ntence_source":"但是后来我发现其实我会走向另外一个极端。","sentence_en":"But later I realized I actually went to the opposite extreme."},{"id":"246","start":1900.66,"end":1905.9,"displayStart":1900.66,"displayEnd":1905.9,"displayMid":1903.2800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0.1,"loudness":1.085136,"pitch":25.367266,"speechRate":5.405,"hasEvents":false,"sentence_source":"因为我妈妈就特别地关注她的外表，她是一个长得很美的一个人。","sentence_en":"Because my mom was very focused on her appearance; she was naturally beautiful."},{"id":"247","start":1905.9,"end":1913.28,"displayStart":1905.9,"displayEnd":1913.28,"displayMid":1909.5900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":-0.1,"loudness":0.906374,"pitch":23.461843,"speechRate":5.069,"hasEvents":false,"sentence_source":"所以她每天会花很多很多的精力，跟很多很多的钱去打理她的外表，去做美容 做整容。","sentence_en":"So she spent a lot of energy and money every day on her looks—skincare, cosmetic surgery."},{"id":"248","start":1913.28,"end":1929.04,"displayStart":1913.28,"displayEnd":1929.04,"displayMid":1921.1599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.6,"loudness":0.856018,"pitch":22.040304,"speechRate":4.569,"hasEvents":false,"sentence_source":"然后去买衣服等等，而且我妈在即便非常非常穷困料倒的时候，她都要花一千块钱买一条裙子，就是我后来我就非常的反感这种东西，在青春期的时候我就走向另外一个极端。","sentence_en":"And then going shopping for clothes, etc. Even when my mom was extremely down and out, she would spend a thousand yuan on a dress. Later, I became very averse to this kind of thing. During my adolescence, I swung to the other extreme."},{"id":"249","start":1929.04,"end":1930.68,"displayStart":1929.04,"displayEnd":1930.68,"displayMid":1929.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Negative","score":-0.7,"loudness":0.69159,"pitch":13.501719,"speechRate":4.878,"hasEvents":false,"sentence_source":"我就非常讨厌打扮。","sentence_en":"I started hating dressing up."},{"id":"250","start":1930.68,"end":1934.16,"displayStart":1930.68,"displayEnd":1934.16,"displayMid":1932.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.66649,"pitch":21.766771,"speechRate":5.172,"hasEvents":false,"sentence_source":"因为我觉得所有打扮的女人都是用俗空虚。","sentence_en":"Because I thought all women who dressed up were vulgar, empty, and superficial."},{"id":"251","start":1935.4,"end":1938.16,"displayStart":1935.4,"displayEnd":1938.16,"displayMid":1936.7800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Negative","score":-0.8,"loudness":0.834592,"pitch":18.117386,"speechRate":4.71,"hasEvents":false,"sentence_source":"以及非常的浮浅，我就这种感觉。","sentence_en":"And very shallow—that's how I felt."},{"id":"252","start":1938.16,"end":1952.86,"displayStart":1938.16,"displayEnd":1952.86,"displayMid":1945.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Negative","score":-0.7,"loudness":0.791621,"pitch":19.540022,"speechRate":4.286,"hasEvents":false,"sentence_source":"所以说当时我有次去看那个心理咨询师，我就会跟她聊到这个漂不漂亮的问题，她就会说提到漂亮这个词，你能联想到三个词是什么我说，庸俗 肤浅 空洞。","sentence_en":"So once, when I went to see a counselor, I talked to her about the issue of being pretty or not. She said, when you think of the word 'pretty,' what three words come to mind? I said, vulgar, shallow, empty."},{"id":"253","start":1952.86,"end":1962.22,"displayStart":1952.86,"displayEnd":1962.22,"displayMid":1957.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Neutral","score":-0.2,"loudness":0.999811,"pitch":24.730806,"speechRate":5.24,"hasEvents":false,"sentence_source":"然后她说 那你想到你妈妈 你会试试一个什么画面，我说 想到我妈妈她就是一个在穿衣镜前一直在打扮自己的人。","sentence_en":"Then she said, 'When you think of your mom, what image comes to mind?' I said, 'My mom is always in front of the mirror dressing herself up."},{"id":"254","start":1962.22,"end":1969.96,"displayStart":1962.22,"displayEnd":1969.96,"displayMid":1966.0900000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Negative","score":-0.5,"loudness":0.856407,"pitch":20.877821,"speechRate":5.291,"hasEvents":false,"sentence_source":"然后我就坐在一个角落 观察着她在打扮，她说 那其实你对漂亮这件事情是有一些抵触的我说 对。","sentence_en":"And I would sit in a corner watching her. She said, 'So you actually have some resistance to beauty.' I said, 'Yes."},{"id":"255","start":1969.96,"end":1978.02,"displayStart":1969.96,"displayEnd":1978.02,"displayMid":1973.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Neutral","score":-0.1,"loudness":0.822874,"pitch":21.973577,"speechRate":5.211,"hasEvents":false,"sentence_source":"所以说之前 我就穿得特别的低调朴素，而且我甚至不知道怎么穿得好看，我可以给别人搭配很多衣服。","sentence_en":"That's why I used to dress very plain and modest; I didn't even know how to dress nicely. I could style others,"},{"id":"256","start":1978.02,"end":1984.28,"displayStart":1978.02,"displayEnd":1984.28,"displayMid":1981.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Negative","score":-0.5,"loudness":0.659749,"pitch":20.331095,"speechRate":5.272,"hasEvents":false,"sentence_source":"但是我自己穿的就很丑觉得 好像是一种非常莫名的潜意识的力量吧这种感觉。","sentence_en":"but I looked awful myself. It felt like some strange subconscious force."},{"id":"257","start":1984.28,"end":1987.18,"displayStart":1984.28,"displayEnd":1987.18,"displayMid":1985.73,"speaker":"Siwen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Neutral","score":0,"loudness":1.042749,"pitch":24.072807,"speechRate":8.171,"hasEvents":false,"sentence_source":"所以你知道后来最亲近的人还是你的老了跟老爷。","sentence_en":"So you know, in the end, the closest people are still your grandparents."},{"id":"258","start":1987.18,"end":1992.48,"displayStart":1987.18,"displayEnd":1992.48,"displayMid":1989.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Negative","score":-0.6,"loudness":0.805682,"pitch":23.774429,"speechRate":5.488,"hasEvents":false,"sentence_source":"对，然后到我长大之后我跟我爸爸比较亲近吧 后来我爸就去世了。","sentence_en":"Right. As I grew up, I became closer to my dad. Later he passed away."},{"id":"259","start":1992.48,"end":2001.82,"displayStart":1992.48,"displayEnd":2001.82,"displayMid":1997.15,"speaker":"Siwen","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Neutral","score":0.2,"loudness":0.865101,"pitch":20.072514,"speechRate":5.032,"hasEvents":false,"sentence_source":"但其实他在你成长到可能很大他都是某种缺位的状态，但依然到后来会成为你特别亲密的一个家人 神奇的血缘。","sentence_en":"But actually, for much of your childhood he was somewhat absent. Still, he later became a very close family member—amazing, the power of blood."},{"id":"260","start":2001.82,"end":2012.12,"displayStart":2001.82,"displayEnd":2012.12,"displayMid":2006.9699999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Positive","score":0.5,"loudness":0.823255,"pitch":23.070967,"speechRate":5.383,"hasEvents":false,"sentence_source":"很神奇 因为我发现我跟我爸有一些很莫名的章字之处，我爸是一个挺逗的人 他虽然平时是一个离宫男，天天搞一些工程的东西。","sentence_en":"It's amazing because I found we had some weird similarities. My dad was funny—though he was an engineer guy, always dealing with construction stuff."},{"id":"261","start":2012.12,"end":2024.32,"displayStart":2012.12,"displayEnd":2024.32,"displayMid":2018.2199999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Positive","score":0.4,"loudness":0.842208,"pitch":22.273006,"speechRate":5.609,"hasEvents":false,"sentence_source":"但是有时候他说话就会令我觉得他其实是挺幽默的，就比如有一次我问他 我说你喜欢什么样的女人，他说 我喜欢好看的女人，我说那如果好看的女人 特别无聊呢。","sentence_en":"But sometimes he'd say things that showed his humor. For example, I once asked, 'What kind of woman do you like?' He said, 'I like good-looking women.' I said, 'What if a good-looking woman is really boring?"},{"id":"262","start":2024.32,"end":2031.2,"displayStart":2024.32,"displayEnd":2031.2,"displayMid":2027.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Positive","score":0.5,"loudness":0.994479,"pitch":23.753082,"speechRate":4.239,"hasEvents":false,"sentence_source":"他说 那你不懂 好看的女人是不会无聊的，我说的我爸挺有意思的。","sentence_en":"He said, 'You don't get it—good-looking women are never boring.' I thought my dad was quite interesting."},{"id":"263","start":2031.2,"end":2045.18,"displayStart":2031.2,"displayEnd":2045.18,"displayMid":2038.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Positive","score":0.7,"loudness":0.897758,"pitch":23.958826,"speechRate":5.263,"hasEvents":false,"sentence_source":"其实我觉得他是一个让我很敬佩的人，就是他是一个非常之认真负责而且非常真诚坦率的一个人，直到他去世的时候，就是我爸去世当时是一个工商，就是他去检查一个工程。","sentence_en":"Actually, I really admired him—he was very responsible, sincere, and straightforward. When he died, he was on a work trip inspecting a construction site."},{"id":"264","start":2045.18,"end":2048.54,"displayStart":2045.18,"displayEnd":2048.54,"displayMid":2046.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Clothing and beauty","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.060368,"pitch":24.694286,"speechRate":5.689,"hasEvents":false,"sentence_source":"然后从一个高厨调下来，当时就摔死了就这样。","sentence_en":"He fell from a high place and died instantly."},{"id":"265","start":2048.54,"end":2051.28,"displayStart":2048.54,"displayEnd":2051.28,"displayMid":2049.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Negative","score":-0.8,"loudness":0.907839,"pitch":21.980894,"speechRate":5.597,"hasEvents":false,"sentence_source":"然后当时我就很不能接受这件事情。","sentence_en":"At the time, I couldn't accept it."},{"id":"266","start":2051.28,"end":2057.3,"displayStart":2051.28,"displayEnd":2057.3,"displayMid":2054.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0.2,"loudness":0.863231,"pitch":23.27726,"speechRate":6.05,"hasEvents":false,"sentence_source":"因为中午还在跟他一起吃饭，下午就已经消失了，有一件事情让我突然觉得我爸很伟大。","sentence_en":"Because I had lunch with him at noon, and he was gone by afternoon. One thing made me suddenly think my dad was great."},{"id":"267","start":2057.3,"end":2068.76,"displayStart":2057.3,"displayEnd":2068.76,"displayMid":2063.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Negative","score":-0.4,"loudness":0.879116,"pitch":23.581417,"speechRate":5.092,"hasEvents":false,"sentence_source":"因为当时他的那个负责工程的这个甲方给他赔钱，后来我要去签这个合同签字，我当时是抱着一种很防御的对抗的态度去签这个合同的。","sentence_en":"The client responsible for the project wanted to pay compensation. Later I had to sign the contract. I went in with a defensive, confrontational attitude."},{"id":"268","start":2068.76,"end":2071.34,"displayStart":2068.76,"displayEnd":2071.34,"displayMid":2070.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1", ke if we now recall lost family members, we'll have a lot of regrets."},{"id":"286","start":2205.82,"end":2209.96,"displayStart":2205.82,"displayEnd":2209.96,"displayMid":2207.8900000000003,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.803798,"pitch":21.430651,"speechRate":5.556,"hasEvents":false,"sentence_source":"那你反过来想 他们也会有遗憾，就这些东西一定是相通。","sentence_en":"And if you think about it the other way, they also have regrets. These things are definitely connected."},{"id":"287","start":2209.96,"end":2214.04,"displayStart":2209.96,"displayEnd":2214.04,"displayMid":2212,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.3,"loudness":0.931029,"pitch":26.445951,"speechRate":4.902,"hasEvents":false,"sentence_source":"我觉得有时候人生的一个终极的命题就是遗憾。","sentence_en":"I think sometimes the ultimate question in life is regret."},{"id":"288","start":2214.04,"end":2220.82,"displayStart":2214.04,"displayEnd":2220.82,"displayMid":2217.4300000000003,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0,"loudness":0.872868,"pitch":20.371576,"speechRate":6.342,"hasEvents":false,"sentence_source":"所以人生的终极命题就是你要去和解，为什么和解 就是因为有太多的遗憾，它已经过去了 那我们怎么办。","sentence_en":"So the ultimate question of life is to make peace with it. Why make peace? Because there are so many regrets. It's already in the past. What do we do?"},{"id":"289","start":2220.82,"end":2223.24,"displayStart":2220.82,"displayEnd":2223.24,"displayMid":2222.0299999999997,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Neutral","score":0.1,"loudness":0.76271,"pitch":18.033836,"speechRate":4.959,"hasEvents":false,"sentence_source":"那你只有接受啊 只有和解啊。","sentence_en":"You can only accept it, only make peace."},{"id":"290","start":2223.24,"end":2230.1,"displayStart":2223.24,"displayEnd":2230.1,"displayMid":2226.67,"speaker":"Siwen","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Family of origin and personal beliefs","sentiment_en":"Negative","score":-0.5,"loudness":0.891702,"pitch":20.530401,"speechRate":5.692,"hasEvents":false,"sentence_source":"所以这是一个懂再多道理，都是无法解决的一个人生难题，我就想想有时候觉得挺残酷的。","sentence_en":"So this is a life problem that no matter how much you understand, you can't solve. When I think about it, sometimes it feels quite cruel."},{"id":"291","start":2230.1,"end":2233.48,"displayStart":2230.1,"displayEnd":2233.48,"displayMid":2231.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.894771,"pitch":24.898241,"speechRate":6.547,"hasEvents":false,"sentence_source":"我之前生病的时候 其实跟我的咨询治疗过很多。","sentence_en":"When I was sick before, I actually did a lot of consultations and therapy."},{"id":"292","start":2233.48,"end":2234.62,"displayStart":2233.48,"displayEnd":2234.62,"displayMid":2234.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.731811,"pitch":23.016895,"speechRate":7.018,"hasEvents":false,"sentence_source":"因为我当时很崩溃。","sentence_en":"Because I was really devastated at the time."},{"id":"293","start":2234.62,"end":2245.64,"displayStart":2234.62,"displayEnd":2245.64,"displayMid":2240.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.6,"loudness":0.863056,"pitch":23.668247,"speechRate":5.026,"hasEvents":false,"sentence_source":"然后我的资讯是说一般人知道自己生了一个大病，他都会经历一个过程，你生病跟你父亲去世是前后脚的时间吗，差不多 前后脚。","sentence_en":"And my therapist said that when people learn they have a serious illness, they go through a process. Did your illness and your father's death happen around the same time? Pretty much, one right after the other."},{"id":"294","start":2245.64,"end":2259.9,"displayStart":2245.64,"displayEnd":2259.9,"displayMid":2252.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.843316,"pitch":23.109726,"speechRate":5.552,"hasEvents":false,"sentence_source":"然后所以那段时间我就极其的崩溃，整个人就觉得陷入了一些绝境的感觉，我的资讯是说他就说第一个阶段是否认，包括亲人去世，就是我不承认这件事情发生 不可能，第二个阶段就是接受。","sentence_en":"So during that time I was extremely broken, feeling like I was in a dead end. My therapist said the first stage is denial—including the death of a loved one—I refuse to accept that it happened, it's impossible. The second stage is acceptance."},{"id":"295","start":2259.9,"end":2274.92,"displayStart":2259.9,"displayEnd":2274.92,"displayMid":2267.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.6,"loudness":0.784697,"pitch":21.832222,"speechRate":4.454,"hasEvents":false,"sentence_source":"我那一刻突然觉得接受这两个字的力量是如此之强大，就是可能我觉得人的一生都在不断地去接受各种的事情，或者接受各种不同的灾难也好 痛苦也好。","sentence_en":"At that moment I suddenly felt the power of the word 'acceptance' was so strong. Maybe I think a person's whole life is about continuously accepting all kinds of things, or accepting various disasters or pains."},{"id":"296","start":2274.92,"end":2282.84,"displayStart":2274.92,"displayEnd":2282.84,"displayMid":2278.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.5,"loudness":0.752737,"pitch":20.125095,"speechRate":4.974,"hasEvents":false,"sentence_source":"即便这个事情再令你痛苦，只要时间到位了，你总有一天会发现你接受了，就你可以跟他共处。","sentence_en":"Even if something causes you immense pain, as long as enough time passes, one day you'll find you've accepted it, and you can coexist with it."},{"id":"297","start":2282.84,"end":2297.02,"displayStart":2282.84,"displayEnd":2297.02,"displayMid":2289.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0.1,"loudness":0.77184,"pitch":21.737989,"speechRate":4.494,"hasEvents":false,"sentence_source":"然后你不会为他感到积蓄的痛苦跟困扰，不管是亲人也好 还是自己生病也好，包括那些得绝症的人，像当时我看那个离开宿的书，他说他得一线爱什么的。","sentence_en":"And then you won't feel accumulated pain and distress over it. Whether it's a loved one or your own illness, including those with terminal diseases. Like when I read the book 'Leaving the Hostel', he said he got something like first-line love..."},{"id":"298","start":2297.02,"end":2308.92,"displayStart":2297.02,"displayEnd":2308.92,"displayMid":2302.9700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.6,"loudness":0.835487,"pitch":24.098246,"speechRate":6.372,"hasEvents":false,"sentence_source":"我就觉得他们都经历过一个漫长的挣扎跟痛苦，一开始就会觉得这怎么会发生到我身上，为什么是我为什么不是别人，我是一个好人 为什么会这样，我还要改变世界 为什么 不停地问。","sentence_en":"I think they all went through a long struggle and pain. At first they'd think, 'How could this happen to me? Why me and not someone else? I'm a good person, why is this happening? I still want to change the world, why?' Asking endlessly."},{"id":"299","start":2308.92,"end":2322.52,"displayStart":2308.92,"displayEnd":2322.52,"displayMid":2315.7200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.7,"loudness":0.746833,"pitch":20.372721,"speechRate":5.124,"hasEvents":false,"sentence_source":"然后有一天你会发现 早上起来之后突然觉得，我接受了 我接受我是一个绝症的患者，我接受我得了这个病 我接受上天给我这样对待，我接受我现在人生所有的一切。","sentence_en":"Then one day you'll find that after waking up in the morning, you suddenly feel, 'I accept it. I accept that I'm a terminal patient. I accept that I have this disease. I accept that heaven has treated me this way. I accept everything in my life right now."},{"id":"300","start":2322.52,"end":2328.36,"displayStart":2322.52,"displayEnd":2328.36,"displayMid":2325.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.6,"loudness":0.710486,"pitch":22.418831,"speechRate":3.767,"hasEvents":false,"sentence_source":"就是我那段时间觉得接受这两个字的分量非常之重。","sentence_en":"That's what I felt during that period—the weight of the word 'acceptance' was very heavy."},{"id":"301","start":2328.36,"end":2335.2,"displayStart":2328.36,"displayEnd":2335.2,"displayMid":2331.7799999999997,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.5,"loudness":0.933993,"pitch":21.814697,"speechRate":5.41,"hasEvents":false,"sentence_source":"所以你看所谓匹极太来，就是人好像总是要经历一些低谷之后能够开始慢慢地向好。","sentence_en":"So you see, the saying 'extreme adversity brings prosperity' means that people always seem to go through some low points before they can slowly start to improve."},{"id":"302","start":2335.2,"end":2345.98,"displayStart":2335.2,"displayEnd":2345.98,"displayMid":2340.59,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0,"loudness":0.965969,"pitch":26.526747,"speechRate":5.888,"hasEvents":false,"sentence_source":"那从我一个外人 从我观众的一个角度来看你，认识你的话 好像你的慢慢进入我们的视线都是从18年，就你经历了很多生活中翻天覆地事以后开始。","sentence_en":"From an outsider's perspective, as an audience member getting to know you, it seems you gradually came into our sight starting from 2018, after you experienced many earth-shattering changes in your life."},{"id":"303","start":2345.98,"end":2352,"displayStart":2345.98,"displayEnd":2352,"displayMid":2348.99,"speaker":"Siwen","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Positive","score":0.4,"loudness":0.960934,"pitch":20.874222,"speechRate":5.653,"hasEvents":false,"sentence_source":"出现在大家面前的就是从一个绝境开始慢慢往上走的一个过程，时间表示这样吧。","sentence_en":"What appeared before everyone was a process of slowly climbing up from a desperate situation. That's roughly the timeline."},{"id":"304","start":2352,"end":2354.68,"displayStart":2352,"displayEnd":2354.68,"displayMid":2353.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":1.034718,"pitch":29.414722,"speechRate":5.295,"hasEvents":false,"sentence_source":"但是对于我来讲所谓的往上走。","sentence_en":"But for me, the so-called 'climbing up"},{"id":"305","start":2354.68,"end":2360.84,"displayStart":2354.68,"displayEnd":2360.84,"displayMid":2357.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.835206,"pitch":22.925114,"speechRate":3.409,"hasEvents":false,"sentence_source":"其实并不是所谓的事业的成功或者是金钱的积累。","sentence_en":"actually isn't about career success or money accumulation."},{"id":"306","start":2360.84,"end":2364.88,"displayStart":2360.84,"displayEnd":2364.88,"displayMid":2362.86,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Standards for evaluating women","sentiment_en":"Neutral","score":0,"loudness":0.807727,"pitch":23.471209,"speechRate":5.483,"hasEvents":false,"sentence_source":"我觉得这个对我来说并不是往上走的一个标志它。","sentence_en":"I think these are not signs of moving upward for me."},{"id":"307","start":2364.88,"end":2365.92,"displayStart":2364.88,"displayEnd":2365.92,"displayMid":2365. es and emotions","sentiment_en":"Negative","score":-0.6,"loudness":0.566904,"pitch":17.128681,"speechRate":6.897,"hasEvents":false,"sentence_source":"因为我付出了太多痛苦了。","sentence_en":"Because I had paid too much pain."},{"id":"316","start":2404.4,"end":2405.94,"displayStart":2404.4,"displayEnd":2405.94,"displayMid":2405.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0,"loudness":1.121465,"pitch":34.824356,"speechRate":8.209,"hasEvents":false,"sentence_source":"然后我发现我得了之后呢。","sentence_en":"And then after I got it,"},{"id":"317","start":2405.94,"end":2414.14,"displayStart":2405.94,"displayEnd":2414.14,"displayMid":2410.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Negative","score":-0.6,"loudness":0.902717,"pitch":28.271013,"speechRate":6.472,"hasEvents":false,"sentence_source":"那个男生丝毫没有注意到我，我再去拎我的卷子的时候，他连我一眼瓢都没有瓢，我突然觉得 妈 这年纪第一的意义是什么呢。","sentence_en":"that guy didn't notice me at all. When I went to pick up my exam paper, he didn't even glance at me. I suddenly thought, 'Mom, what's the point of being first in grade?"},{"id":"318","start":2414.14,"end":2423.7,"displayStart":2414.14,"displayEnd":2423.7,"displayMid":2418.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":"Neutral","score":0,"loudness":0.955268,"pitch":25.899342,"speechRate":4.948,"hasEvents":false,"sentence_source":"所以说我觉得在我工作的这些，包括您说的所谓的进入大众视野，或者是所谓的一些什么工作的发展什么的。","sentence_en":"So I think during my work, including what you called entering the public eye or some career development,"},{"id":"319","start":2423.7,"end":2427.92,"displayStart":2423.7,"displayEnd":2427.92,"displayMid":2425.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Real experiences and emotions","sentiment_en":
