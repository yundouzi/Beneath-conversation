    <script type="application/json" id="episode-data">{"episode":{"id":"S9E4","label":"S9E4","title":"S9E4 Lu Yu in Conversation with Meng Man | Life should not be 'if only I had known.' I decide to be braver.","intro":"Meng Man, cultural historian\nChen Luyu, media personality, host\n\nRock Flower Talk Season 9 Episode 4: Luyu meets Meng Man, who has just returned to Beijing from Jilin. That day, she crossed Chang'an Street, the setting sun about to fall, the sunset spreading outside the car window. She recited, 'Bow back bright as dawn, sword shining frost; autumn wind, horse galloping out of Xianyang.'\n'Walking' is Meng Man's life keyword. In her growth stage, 'walking' was in books. Reading built her imagination of the world. She skipped school to read, was caught, beaten, but still read on.\nOver the years, 'walking' has become concrete—she travels national highways, walks the Eight Passages of Taihang, and is about to walk the Shu Road. Standing among mountains, rivers, wilderness, and ancient paths, she explores where people come from. She says: 'Only by walking along the road can you string history into a line.'\nIn 2007, 32-year-old Meng Man was the youngest lecturer on 'Lecture Room,' standing on the podium in a cheongsam, speaking about Wu Zetian, as well as Tang and Song poetry. For a long time, that was the Meng Man most familiar to the public.\n'But that's not all of me,' she says.\nAt that time, she had been a teacher for five years and clearly knew: people look down on young teachers, and also look down on female teachers. So when she had the chance to 'sit at the table,' she went all out.\nNearly twenty years later, Meng Man still feels certain hidden biases—in group conversations, the host always throws harder topics to men, leaving feelings and emotions for her. She chooses to 'answer the softest topic with the hardest words.'\nShe finds that the world is changing, and gradually people listen to her. 'The world is actually quite weak; if you are e":"那个画面是我人生当中最早的很刺激的画面，就小孩是很震惊的 因为你发现人的脚是那样子的，完全变形 我从来没看见过他。","sentence_en":"That image was one of the earliest shocking images in my life. As a child, I was shocked to discover a person's foot could be that deformed. I had never seen it."},{"id":"110","start":660.84,"end":664.92,"displayStart":660.84,"displayEnd":664.92,"displayMid":662.88,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Neutral","score":0,"loudness":1.034913,"pitch":21.947075,"speechRate":5.898,"hasEvents":false,"sentence_source":"从来没有在我们面前露出过他那个小脚真实的模样。","sentence_en":"She never showed us the real appearance of her bound feet."},{"id":"111","start":664.92,"end":671.36,"displayStart":664.92,"displayEnd":671.36,"displayMid":668.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.3,"loudness":1.050935,"pitch":22.853386,"speechRate":5.569,"hasEvents":false,"sentence_source":"他可能是因为我小 他没有避回我，但小孩也看到感受到内心是有一种很复杂的情绪。","sentence_en":"Maybe because I was young, she didn't avoid me, but even as a child, I felt a complex emotion inside."},{"id":"112","start":671.36,"end":680.98,"displayStart":671.36,"displayEnd":680.98,"displayMid":676.1700000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.5,"loudness":0.913665,"pitch":21.640451,"speechRate":6.341,"hasEvents":false,"sentence_source":"因为太小了 其实你感受不到具体这个脚意味着什么，但你本能都会有一种恐惧 会感受到疼痛，都是小孩的本能 我是有记忆的，我本能都感觉到不是。","sentence_en":"Because I was too young to understand what the foot meant, but instinctively you feel fear and pain. That's a child's instinct. I remember; my instinct told me it was wrong."},{"id":"113","start":680.98,"end":690.32,"displayStart":680.98,"displayEnd":690.32,"displayMid":685.6500000000001,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Positive","score":0.4,"loudness":0.95471,"pitch":21.311659,"speechRate":4.721,"hasEvents":false,"sentence_source":"疼痛 我是好奇，我是一个发育挺晚的这种小孩 清零发育，就是一直显得比较幼稚，我看见什么都觉得很好玩。","sentence_en":"Pain? I was curious. I was a late bloomer, always seemed naive. I found everything amusing."},{"id":"114","start":690.32,"end":702.78,"displayStart":690.32,"displayEnd":702.78,"displayMid":696.55,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Neutral","score":0,"loudness":1.018882,"pitch":22.094315,"speechRate":6.088,"hasEvents":false,"sentence_source":"所以我就看她小脚那个样子 我也让她把我那个脚缠一下，她稍稍省一用劲 我说不不不就拉倒了，她后面承载着什么 没有想过呀，我可能对画面也好 对生活也好 感受力没有那么强。","sentence_en":"So when I saw her bound foot, I asked her to bind mine. She applied a little pressure, and I said 'No, no, no, forget it.' I never thought about what it represented. Maybe I'm not that sensitive to images or life."},{"id":"115","start":702.78,"end":716.28,"displayStart":702.78,"displayEnd":716.28,"displayMid":709.53,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.960449,"pitch":22.62471,"speechRate":5.407,"hasEvents":false,"sentence_source":"我比较害怕文字 就是文字会给我制造那样的一种恐惧心，或者是伤痛感也好 大概我五岁左右的时候，有一个小人书 叫做安哥拉与小红娃，小红娃就是一个新中国的小女孩儿了。","sentence_en":"I'm more afraid of text - text creates that kind of fear or pain. When I was about five, there was a comic called 'Angola and Little Red Baby,' where Little Red Baby was a little girl from New China."},{"id":"116","start":716.28,"end":726.92,"displayStart":716.28,"displayEnd":726.92,"displayMid":721.5999999999999,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.920585,"pitch":19.49873,"speechRate":5.894,"hasEvents":false,"sentence_source":"安哥拉是一个非洲的小男孩，蒙曼又讲他们的奴隶主用皮鞭打他，我就害怕得不得了 反复做恶梦，后来那个小时候被藏的远远的我再也没有看见过他。","sentence_en":"Angola is a little African boy. Meng Man talked about how their slave owners whipped him with a leather whip. I was terrified and had repeated nightmares. Later, the little boy who was hidden far away in my childhood was never seen again."},{"id":"117","start":726.92,"end":735.88,"displayStart":726.92,"displayEnd":735.88,"displayMid":731.4,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Positive","score":0.5,"loudness":0.893886,"pitch":20.233696,"speechRate":5.427,"hasEvents":false,"sentence_source":"但是这个印象一直在 我为什么看儿童文学，就是我觉得儿童文学里制造的所有的丑恶也好 痛苦也好 是极有节制的。","sentence_en":"But this impression has stayed. Why I read children's literature is because I feel that all the ugliness and pain created in children's literature are very restrained."},{"id":"118","start":735.88,"end":740.18,"displayStart":735.88,"displayEnd":740.18,"displayMid":738.03,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.5,"loudness":1.098393,"pitch":23.846846,"speechRate":5.29,"hasEvents":false,"sentence_source":"但是如果要进入承认世界的那些东西 我还会害怕。","sentence_en":"But if I have to enter that world that acknowledges reality, I'd still be afraid."},{"id":"119","start":740.18,"end":745.08,"displayStart":740.18,"displayEnd":745.08,"displayMid":742.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Neutral","score":0,"loudness":0.940342,"pitch":22.587021,"speechRate":5.371,"hasEvents":false,"sentence_source":"我有一次特别一样的 我是看故事会，讲了一篇是很新的父母。","sentence_en":"I had a really similar experience—I was reading a story collection, and there was one about very new parents."},{"id":"120","start":745.08,"end":758.18,"displayStart":745.08,"displayEnd":758.18,"displayMid":751.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.6,"loudness":0.996692,"pitch":25.242563,"speechRate":5.573,"hasEvents":false,"sentence_source":"因为什么原因把年幼的姐弟两个人带到深山老龄里面一气，莫名的恐惧 完全是来自于文字当中营造了一个你所不了解的成人的世界，你认为那个世界里面你完全没有掌控权。","sentence_en":"For some reason, they took their young brother and sister deep into the mountains, and an inexplicable fear came entirely from the words creating an adult world you don't understand, a world where you feel you have no control."},{"id":"121","start":758.18,"end":764.04,"displayStart":758.18,"displayEnd":764.04,"displayMid":761.1099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.7,"loudness":1.112262,"pitch":25.001965,"speechRate":5.489,"hasEvents":false,"sentence_source":"你明白身为一个小孩对自己的命运多么的束手无策我觉得恐惧是 是 是。","sentence_en":"You understand how helpless a child feels about their own fate—I think that fear is, it's, it's..."},{"id":"122","start":764.04,"end":776.62,"displayStart":764.04,"displayEnd":776.62,"displayMid":770.3299999999999,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Neutral","score":0,"loudness":0.845601,"pitch":16.270493,"speechRate":5.246,"hasEvents":false,"sentence_source":"所以我一直在想 给小孩要看什么，或者说一个经典的儿童文学，他怎样不吓唬孩子 又能够大动大人，又能够引起孩子和大人都能够思考一些属于自己的话题但。","sentence_en":"So I've always wondered what to give kids to read, or how a classic children's literature can avoid scaring children yet still move adults, and get both kids and adults thinking about their own topics."},{"id":"123", nce_en":"And of course, both his writing and Ye Junjian's translation were excellent."},{"id":"127","start":796.9,"end":809.64,"displayStart":796.9,"displayEnd":809.64,"displayMid":803.27,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.911559,"pitch":21.674068,"speechRate":5.965,"hasEvents":false,"sentence_source":"我觉得那个文字非常非常的节制温暖有力量，在大海的深处水是那么的烂，烂得像石车局的花瓣，又是那么的清，可以看到海底的水槽等等等等，就是那些时候，这个东西没有人要求你背。","sentence_en":"I think the language is very restrained, warm, and powerful: 'In the deep sea, the water is so blue, blue like the petals of a cornflower, and so clear, you can see the seaweed at the bottom,' etc. Nobody ever asked you to memorize that."},{"id":"128","start":809.64,"end":817.34,"displayStart":809.64,"displayEnd":817.34,"displayMid":813.49,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.904714,"pitch":20.065071,"speechRate":5.195,"hasEvents":false,"sentence_source":"但是自然而然就能够把它给背下来，你看他讲小美人于化成泡沫，你能够认真的理解这就是死吗。","sentence_en":"But you naturally ended up memorizing it. When he talks about the little mermaid turning into foam, can you really understand that as death?"},{"id":"129","start":817.34,"end":819.84,"displayStart":817.34,"displayEnd":819.84,"displayMid":818.59,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.915895,"pitch":24.495428,"speechRate":6.4,"hasEvents":false,"sentence_source":"我觉得到不直接观摄到这样一个话题。","sentence_en":"I don't think it directly hits you with that topic."},{"id":"130","start":819.84,"end":824.02,"displayStart":819.84,"displayEnd":824.02,"displayMid":821.9300000000001,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.4,"loudness":0.891422,"pitch":23.220213,"speechRate":5.685,"hasEvents":false,"sentence_source":"然后你会跟着他的文字一起，感受到所谓灵魂升华吗。","sentence_en":"And then you follow his words and feel something like a spiritual sublimation."},{"id":"131","start":824.02,"end":829.24,"displayStart":824.02,"displayEnd":829.24,"displayMid":826.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":1.032117,"pitch":23.015337,"speechRate":7.207,"hasEvents":false,"sentence_source":"所以你小时候是几岁开始就能够，把你爸妈们书柜里面书拿出来一本一本的，开始阅读。","sentence_en":"So how old were you when you started taking books from your parents' bookshelves and reading them one by one?"},{"id":"132","start":829.24,"end":838.88,"displayStart":829.24,"displayEnd":838.88,"displayMid":834.06,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.998254,"pitch":20.645977,"speechRate":5.711,"hasEvents":false,"sentence_source":"我小时候并没有书会 所有的书都是装在箱子里的，你要打开 打出来 箱子是很沉的，把那盖子举起来 从那里往外拿 拿到什么算什么。","sentence_en":"When I was little, I didn't have a bookshelf—all the books were in boxes. You had to open them, the boxes were heavy, lift the lid, and take out whatever you could reach."},{"id":"133","start":838.88,"end":841.44,"displayStart":838.88,"displayEnd":841.44,"displayMid":840.1600000000001,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":1.111721,"pitch":29.23661,"speechRate":8.368,"hasEvents":false,"sentence_source":"但是那个时候最大的好处是什么 大家书都很少。","sentence_en":"But the best part back then was that everyone had very few books."},{"id":"134","start":841.44,"end":845,"displayStart":841.44,"displayEnd":845,"displayMid":843.22,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.4,"loudness":0.878137,"pitch":24.042761,"speechRate":6.461,"hasEvents":false,"sentence_source":"所以拿出来拿本都是经典，就是您说的 基督山博觉等等。","sentence_en":"So whatever you took out was a classic, like you said, The Count of Monte Cristo."},{"id":"135","start":845,"end":848.32,"displayStart":845,"displayEnd":848.32,"displayMid":846.6600000000001,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.5,"loudness":0.851602,"pitch":21.743364,"speechRate":4.819,"hasEvents":false,"sentence_source":"我们都是看的牛蒙 那是一代人的记忆。","sentence_en":"We all read those—it's a memory of a generation."},{"id":"136","start":848.32,"end":853.9,"displayStart":848.32,"displayEnd":853.9,"displayMid":851.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.977771,"pitch":24.13166,"speechRate":7.324,"hasEvents":false,"sentence_source":"我相信当时我把我们各自书贵，或者把你的书箱拍个照片的话，都是差不多同一个版本的书 对。","sentence_en":"I believe if we took photos of our bookshelves or our book boxes back then, they'd all be the same editions."},{"id":"137","start":853.9,"end":855.02,"displayStart":853.9,"displayEnd":855.02,"displayMid":854.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.088395,"pitch":26.047813,"speechRate":8.036,"hasEvents":false,"sentence_source":"因为同一个时期吗 对。","sentence_en":"Because it was the same time period."},{"id":"138","start":855.02,"end":864.68,"displayStart":855.02,"displayEnd":864.68,"displayMid":859.8499999999999,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.893825,"pitch":24.717279,"speechRate":5.28,"hasEvents":false,"sentence_source":"然后还有我对押韵的文字比较敏感，像什么女儿精之类的 我既不认同她的内容，也不觉得她那里有非常具有吸引力的故事。","sentence_en":"And I was also sensitive to rhyming texts, like 'Nü'er Jing'—I neither agreed with its content nor found it very attractive as a story."},{"id":"139","start":864.68,"end":877.82,"displayStart":864.68,"displayEnd":877.82,"displayMid":871.25,"speaker":"Meng Man","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Children's Literature and Reading Growth","sentiment_en":"Neutral","score":0,"loudness":1.040678,"pitch":25.957853,"speechRate":5.099,"hasEvents":false,"sentence_source":"但是因为她是孕婚，我本能就能把她记下来，附加区 娘家宿 想娘家来庇护，娘家户能几回等等，就讲一个媳妇到底应该在婆家怎么样去为人处事，她对一个小孩会有。","sentence_en":"But because she was pregnant and married, I instinctively remembered her. There are sayings about a daughter's maternal home, how many times she can return, telling a wife how to behave in her in-laws' home and its effect on a child."},{"id":"140","start":877.82,"end":879.4,"displayStart":877.82,"displayEnd":879.4,"displayMid":878.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.048004,"pitch":26.13995,"speechRate":9.677,"hasEvents":false,"sentence_source":"什么样的影响在那时候，你背的时候。","sentence_en":"What kind of effect did it have on you when you memorized it?"},{"id":"141","start":879.4,"end":882.54,"displayStart":879.4,"displayEnd":882.54,"displayMid":880.97,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.3,"loudness":1.09033,"pitch":23.044773,"speechRate":4.459,"hasEvents":false,"sentence_source":"我觉得还是阴影的感是文字本身。","sentence_en":"I think it's the shadow of the language itself,"},{"id":"142","start":882.54,"end":884.64,"displayStart":882.54,"displayEnd":884.64,"displayMid":883.5899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.871025,"pitch":26.730585,"speechRate":7.143,"hasEvents":false,"sentence_source":"而不是文字的内容对小孩会有影响。","sentence_en":"not the content, that affects a child."},{"id":"143","start":884.64,"end":896.58,"displayStart":884.64,"displayEnd":896.58,"displayMid":890.61,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.995811,"pitch":21.835709,"speechRate":5.779,"hasEvents":false,"sentence_source":"对 但是后来想想，一个女孩嫁到婆家去了 对她来讲 跟现在进入职场是一个道理嘛，你得全身心的投入 进入这个新的家庭，她其实就讲 你在那儿尽可能的自己解决问题。","sentence_en":"Yes, but thinking back, a girl marrying into her husband's family is like entering the workplace today—you have to fully commit to this new family. She basically said you should solve problems on your own as much as possible."},{"id":"144","start":896.58,"end":908.32,"displayStart":896.58,"displayEnd":908.32,"displayMid":902.45,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.3,"loudness":0.993171,"pitch":23.628418,"speechRate":5.486,"hasEvents":false,"sentence_source":"附家区 娘家宿 想娘家来庇护 那是做不到的，娘家宿 你让娘家庇护 能够庇护几回呢，而且你一旦养成了这样的一种习惯 其实你在两头，好像都很难相处下去。","sentence_en":"Relying on your family for support is impossible. How many times can they protect you? Once you form that habit, you'll find it hard to get along with both sides."},{"id":"145","start":908.32,"end":919.7,"displayStart":908.32,"displayEnd":919.7,"displayMid":914.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.005704,"pitch":26.563513,"speechRate":6.893,"hasEvents":false,"sentence_source":"我觉得你说的特别对 我们不能够跨越年代以今天的标准去要求当时的，当时那个文字是给那个时候的年轻女性，你一个尽可能的生活指导 生存守则，就你按这个生存法则去生活的话。","sentence_en":"I think you're absolutely right. We can't judge the past by today's standards. That text was a survival guide for young women of that time. If you follow those rules, you might have a smoother life."},{"id":"146","start":919.7,"end":922.32,"displayStart":919.7,"displayEnd":922.32,"displayMid":921.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.3,"loudness":1.044723,"pitch":29.557093,"speechRate":5.846,"hasEvents":false,"sentence_source":"你可能过得稍微的能够顺利一点。","sentence_en":"You might get by a bit more smoothly."},{"id":"147","start":922.32,"end":924.5,"displayStart":922.32,"displayEnd":924.5,"displayMid":923.4100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.3,"loudness":0.995906,"pitch":27.244162,"speechRate":6.42,"hasEvents":false,"sentence_source":"对，而且它不是一个过高的要求。","sentence_en":"Right, and it wasn't asking too much."},{"id":"148","start":924.5,"end":938.28,"displayStart":924.5,"displayEnd":938.28,"displayMid":931.39,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.991042,"pitch":25.238953,"speechRate":5.588,"hasEvents":false,"sentence_source":"你就像班昭 嫌女婕，它不是一个过高的要求，德业荣公 德是什么，不是让你平道德模范 对吧，是让你有一个品德 岩，也不是让像咱们俩这样，还能够互相这样聊啊，他说你不要去张家长李家短。","sentence_en":"Like Ban Zhao's Admonitions for Women—it wasn't demanding. Virtue, speech, deportment, work: virtue doesn't mean being a saint, just having integrity. It's not like us chatting casually. It says don't gossip about others."},{"id":"149","start":938.28,"end":949.8,"displayStart":938.28,"displayEnd":949.8,"displayMid":944.04,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.835097,"pitch":22.517696,"speechRate":4.8,"hasEvents":false,"sentence_source":"荣也不是说你长得多漂亮，他说你要勤换洗衣服嘛 要洗澡嘛，公也不是说 你就去做非宜 你得勤快呀，就是我觉得做一些最低的设定。","sentence_en":"Deportment isn't about being beautiful; it's about keeping clean and bathing. Work isn't about doing extraordinary things; it's about being diligent. I think it sets a minimum standard."},{"id":"150","start":949.8,"end":964.94,"displayStart":949.8,"displayEnd":964.94,"displayMid":957.37,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.846458,"pitch":21.837852,"speechRate":5.086,"hasEvents":false,"sentence_source":"然后说 你符合这样的设定，你就有资格在这个社会中活下去，你就有资格获得别人的尊重，您刚才说的特别对古人的理解，不能超越他的那个时代，而且要想他的用心，他想害这些人吗 不是。","sentence_en":"If you meet these standards, you qualify to live in society and earn respect. You're right about understanding the ancients—don't go beyond their time, and consider their intent. Did they mean harm? No."},{"id":"151","start":964.94,"end":974.04,"displayStart":964.94,"displayEnd":974.04,"displayMid":969.49,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.82533,"pitch":21.745502,"speechRate":5.094,"hasEvents":false,"sentence_source":"他其实是说 我给社会建立一些标准，这标准并不难达到，符合这个标准，他就有资格理直气壮地活在这个世界上。","sentence_en":"He was actually setting standards for society—standards that aren't hard to meet. Meeting them gives one the right to live confidently in the world."},{"id":"152","start":974.04,"end":985.1,"displayStart":974.04,"displayEnd":985.1,"displayMid":979.5699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.075864,"pitch":24.740801,"speechRate":6.62,"hasEvents":false,"sentence_source":"其实看任何一个作品，你要注意三个时间背景嘛，一个就是书写的时间背景，还有书中文字发生的那个时间背景，和我们阅读的时间背景，不能够完全跨越这三个时代背景的。","sentence_en":"When reading any work, consider three time contexts: when it was written, when the story is set, and when we read it. You can't fully ignore these three eras."},{"id":"153","start":985.1,"end":987.16,"displayStart":985.1,"displayEnd":987.16,"displayMid":986.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.985936,"pitch":23.452967,"speechRate":6.436,"hasEvents":false,"sentence_source":"任何一个时代都有它的局限性。","sentence_en":"Every era has its limitations."},{"id":"154","start":987.16,"end":997.68,"displayStart":987.16,"displayEnd":997.68,"displayMid":992.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.922726,"pitch":22.766087,"speechRate":6.247,"hasEvents":false,"sentence_source":"对 还有任何时代都有它的突破的余地，这一点特别特别的重要，非常重要，刚刚你说你小时候家里面的条件不是很好，歪那个年代它的相同性造成非常的平等。","sentence_en":"Right, and every era has room for breakthroughs. That's very important. Earlier you said your family wasn't well-off when you were young. The uniformity of that era created a lot of equality."},{"id":"155","start":997.68,"end":1000.8,"displayStart":997.68,"displayEnd":1000.8,"displayMid":999.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.885727,"pitch":18.921747,"speechRate":6.612,"hasEvents":false,"sentence_source":"所以都有好处跟不好的地方，没有任何可攀比的。","sentence_en":"So each has pros and cons, nothing to compare."},{"id":"156","start":1000.8,"end":1013.86,"displayStart":1000.8,"displayEnd":1013.86,"displayMid":1007.3299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.02651,"pitch":25.559702,"speechRate":5.968,"hasEvents":false,"sentence_source":"我们那个家庭就跟任何一个家里面的家具都是一模一样的，床 桌子 柜子 椅子基本都是他们那个单位里面发的，会干一个单位的戳，书柜也是差不多一样的知识，跟奢侈没有任何的关系。","sentence_en":"Our family's furniture was exactly like everyone else's—beds, tables, cabinets, chairs all issued by their work unit, often stamped with the unit's mark. Bookshelves were similar too, nothing luxurious."},{"id":"157","start":1013.86,"end":1016.04,"displayStart":1013.86,"displayEnd":1016.04,"displayMid":1014.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.4,"loudness":0.978344,"pitch":18.687305,"speechRate":3.874,"hasEvents":false,"sentence_source":"但是朴素 食用 平等。","sentence_en":"But simple, practical, and equal."},{"id":"158","start":1016.04,"end":1018.76,"displayStart":1016.04,"displayEnd":1018.76,"displayMid":1017.4,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.998519,"pitch":22.872536,"speechRate":6.195,"hasEvents":false,"sentence_source":"是一种建立在贫乏基础上的平等。","sentence_en":"It was equality built on scarcity."},{"id":"159","start":1018.76,"end":1032.1,"displayStart":1018.76,"displayEnd":1032.1,"displayMid":1025.4299999999998,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.916914,"pitch":19.721439,"speechRate":5.144,"hasEvents":false,"sentence_source":"但是能造成一代人普遍意义上的怀旧心态，当然可能还有一个社会阶层的问题，就是我们是在公职员家庭中长大的，刚才在路上还在想 我个人是没有吃过苦的人。","sentence_en":"But it created a sense of nostalgia for a whole generation. Of course, there's also the social class aspect—we grew up in civil servant families. Just now I was thinking, personally, I haven't suffered hardships."},{"id":"160","start":1032.1,"end":1038.9,"displayStart":1032.1,"displayEnd":1038.9,"displayMid":1035.5,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.106335,"pitch":26.278463,"speechRate":5.385,"hasEvents":false,"sentence_source":"可能在成长的过程中 比方说 像您啊 因为工作啊 什么的，可能会有一些颠簸啊 起伏啊。","sentence_en":"Maybe during growth, like you, because of work, there might be some ups and downs."},{"id":"161","start":1038.9,"end":1042.08,"displayStart":1038.9,"displayEnd":1042.08,"displayMid":1040.49,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.950612,"pitch":22.24445,"speechRate":5.975,"hasEvents":false,"sentence_source":"但是从大的环境来讲 我们是属于没有吃过苦。","sentence_en":"But generally speaking, we belong to the generation that didn't suffer."},{"id":"162","start":1042.08,"end":1042.64,"displayStart":1042.08,"displayEnd":1042.64,"displayMid":1042.3600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.549448,"pitch":14.352707,"speechRate":7.143,"hasEvents":false,"sentence_source":"的这一代。","sentence_en":"This generation."},{"id":"163","start":1042.64,"end":1049.12,"displayStart":1042.64,"displayEnd":1049.12,"displayMid":1045.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.061316,"pitch":21.066645,"speechRate":5.732,"hasEvents":false,"sentence_source":"对 我就之前我非常感恩 回望，60年代以前的人 他们吃过什么苦 是基本能够感受到的。","sentence_en":"Yes, I'm very grateful looking back. People born before the 1960s—you can sense what hardships they went through."},{"id":"164","start":1049.12,"end":1052.1,"displayStart":1049.12,"displayEnd":1052.1,"displayMid":1050.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":-0.1,"loudness":1.192346,"pitch":24.908766,"speechRate":6.316,"hasEvents":false,"sentence_source":"所以有个成长洗下的感觉 但是真正的沉重。","sentence_en":"So there's a feeling of being washed over by growth, but the real weight—"},{"id":"165","start":1052.1,"end":1053.9,"displayStart":1052.1,"displayEnd":1053.9,"displayMid":1053,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.056513,"pitch":23.816902,"speechRate":6.667,"hasEvents":false,"sentence_source":"我们自己没有去亲身的体验。","sentence_en":"We didn't experience it firsthand."},{"id":"166","start":1053.9,"end":1059.02,"displayStart":1053.9,"displayEnd":1059.02,"displayMid":1056.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0.1,"loudness":1.001896,"pitch":22.610415,"speechRate":6.836,"hasEvents":false,"sentence_source":"所以我们在前进的时候 基本是能够清装前行的，而且我们的父母 我不知道您的情况。","sentence_en":"So when we move forward, we can travel light. And our parents—I don't know your situation—"},{"id":"167","start":1059.02,"end":1062.04,"displayStart":1059.02,"displayEnd":1062.04,"displayMid":1060.53,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":-0.1,"loudness":0.981936,"pitch":24.384796,"speechRate":7.119,"hasEvents":false,"sentence_source":"我们父母没有能够创造出巨大的财富，跟我们继承。","sentence_en":"Our parents didn't create great wealth to leave us."},{"id":"168","start":1062.04,"end":1070.4,"displayStart":1062.04,"displayEnd":1070.4,"displayMid":1066.22,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.990944,"pitch":24.980257,"speechRate":5.857,"hasEvents":false,"sen rtment."},{"id":"176","start":1107.78,"end":1115.42,"displayStart":1107.78,"displayEnd":1115.42,"displayMid":1111.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Negative","score":-0.4,"loudness":1.055631,"pitch":22.129084,"speechRate":6.602,"hasEvents":false,"sentence_source":"所以我上大约第一天非常恐怖，所有老师第一句话进来就问我，谁是陈鲁豫 然后看我一眼说，你爸我教过 你妈我教过。","sentence_en":"So on the first day, it was terrifying. Every teacher who came in asked, 'Who is Chen Luyu?' then looked at me and said, 'I taught your father, I taught your mother."},{"id":"177","start":1115.42,"end":1129.72,"displayStart":1115.42,"displayEnd":1129.72,"displayMid":1122.5700000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0.1,"loudness":0.98381,"pitch":20.300146,"speechRate":5.035,"hasEvents":false,"sentence_source":"那我有一个好奇 你为什么会选择同一个学校，我从我有意识起 我就想考那个大学的国际新闻专业，而当时国内只有三个学校有国际新闻专业，北京广播学院 复旦和厦门大学。","sentence_en":"Then I'm curious: why did you choose the same school? Since I could remember, I wanted to study International Journalism at that university. At that time, only three schools in China offered that major: Beijing Broadcasting Institute, Fudan, and Xiamen University."},{"id":"178","start":1129.72,"end":1131.88,"displayStart":1129.72,"displayEnd":1131.88,"displayMid":1130.8000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":1.169889,"pitch":19.49725,"speechRate":6.469,"hasEvents":false,"sentence_source":"北京小孩其实还想考在北京。","sentence_en":"Kids from Beijing actually prefer to stay in Beijing for college."},{"id":"179","start":1131.88,"end":1135.62,"displayStart":1131.88,"displayEnd":1135.62,"displayMid":1133.75,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0.1,"loudness":0.986929,"pitch":21.597336,"speechRate":6.725,"hasEvents":false,"sentence_source":"原来如此 所以你看 不同的地域人们的想法是不一样的。","sentence_en":"I see. So you see, people from different regions have different mindsets."},{"id":"180","start":1135.62,"end":1139.14,"displayStart":1135.62,"displayEnd":1139.14,"displayMid":1137.38,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":0.947769,"pitch":17.387163,"speechRate":6.149,"hasEvents":false,"sentence_source":"对我们合本人来讲 我们好像第一想法是要到北京。","sentence_en":"For us from Hebei, our first thought was to go to Beijing."},{"id":"181","start":1139.14,"end":1144.98,"displayStart":1139.14,"displayEnd":1144.98,"displayMid":1142.06,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Negative","score":-0.3,"loudness":0.974308,"pitch":18.292681,"speechRate":6.217,"hasEvents":false,"sentence_source":"对于我来说 第二位的选择是 你完全想不到，就这个地方 他吃饭得还可以 因为我很惨。","sentence_en":"For me, the second priority was something you'd never guess: the food there had to be decent, because I had a tough time."},{"id":"182","start":1145.48,"end":1148.28,"displayStart":1145.48,"displayEnd":1148.28,"displayMid":1146.88,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":1.394491,"pitch":21.906239,"speechRate":5.78,"hasEvents":false,"sentence_source":"那个年代都学校食堂 有啥大产市场。","sentence_en":"In those days, it was all school cafeterias; what big market was there?"},{"id":"183","start":1148.28,"end":1155.36,"displayStart":1148.28,"displayEnd":1155.36,"displayMid":1151.82,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Positive","score":0.5,"loudness":1.067911,"pitch":28.007467,"speechRate":6.777,"hasEvents":false,"sentence_source":"我们民族学院 那时候叫民族学院，民族学院的食堂 那是远近文明的，你怎么能知道那个学院的食堂是远近文明的。","sentence_en":"Our Minzu Institute (then called Minzu Institute), its cafeteria was famous far and wide. How did you know that?"},{"id":"184","start":1155.36,"end":1161.66,"displayStart":1155.36,"displayEnd":1161.66,"displayMid":1158.51,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0.1,"loudness":1.085074,"pitch":23.660219,"speechRate":6.19,"hasEvents":false,"sentence_source":"因为我父母都是老师 老师他们总会输送一代一代的学生，就会有这样的一些信息 这个很重要。","sentence_en":"Because my parents were teachers—they always send off generations of students, so they had such information. That was important."},{"id":"185","start":1161.66,"end":1167.26,"displayStart":1161.66,"displayEnd":1167.26,"displayMid":1164.46,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":1.101578,"pitch":24.766033,"speechRate":6.607,"hasEvents":true,"sentence_source":"对我来说 我后来问了很多人 没有一个人把这个作为一个理由，你这个参照物的确很特别。","sentence_en":"For me, I later asked many people, and no one used that as a reason. Your reference point is indeed unique."},{"id":"186","start":1168.14,"end":1172.86,"displayStart":1168.14,"displayEnd":1172.86,"displayMid":1170.5,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Positive","score":0.3,"loudness":0.946281,"pitch":22.215462,"speechRate":5.646,"hasEvents":true,"sentence_source":"但是对我来说他确实挺重要的呀，民族学院当时是不吃醋粮的。","sentence_en":"But for me, it was really important. At Minzu Institute, we didn't eat coarse grains back then."},{"id":"187","start":1172.86,"end":1179.28,"displayStart":1172.86,"displayEnd":1179.28," erature and Reading Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.870356,"pitch":19.441547,"speechRate":6.608,"hasEvents":false,"sentence_source":"然后就给我拿出一本红颜来看，红颜的文字其实对我来说也形成某种惊悚的刺激。","sentence_en":"Then he took out a book called 'Hongyan' for me to read. The text of 'Hongyan' actually gave me a kind of thrilling stimulation."},{"id":"227","start":1380.97,"end":1382.95,"displayStart":1380.97,"displayEnd":1382.95,"displayMid":1381.96,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.5,"loudness":0.744267,"pitch":18.07008,"speechRate":5.556,"hasEvents":false,"sentence_source":"因为它这里头会讲到酷刑。","sentence_en":"Because it has torture scenes."},{"id":"228","start":1382.95,"end":1395.15,"displayStart":1382.95,"displayEnd":1395.15,"displayMid":1389.0500000000002,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.4,"loudness":0.939916,"pitch":22.026083,"speechRate":5.41,"hasEvents":false,"sentence_source":"其实我更愿意看《芬莫斯坦基》，是因为古典时代的那些侦探小说，它的血腥似乎是不真实的，阿婆也是一样的，阿强克里斯蒂 你看他写的有的时候是一连串的杀人。","sentence_en":"Actually, I preferred reading 'Fenmostanji' because the bloodiness in classic detective novels seems unreal. Agatha Christie is the same—she sometimes writes a series of murders."},{"id":"229","start":1395.15,"end":1397.63,"displayStart":1395.15,"displayEnd":1397.63,"displayMid":1396.39,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.3,"loudness":0.837117,"pitch":22.054125,"speechRate":6.048,"hasEvents":false,"sentence_source":"但他不恐怖 你感觉好像是一个游戏。","sentence_en":"But it's not terrifying; it feels like a game."},{"id":"230","start":1397.63,"end":1410.61,"displayStart":1397.63,"displayEnd":1410.61,"displayMid":1404.12,"speaker":"Meng Man","speaker #A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.973308,"pitch":20.394161,"speechRate":5.175,"hasEvents":false,"sentence_source":"但是在这个散漫之中确实有非常大的一笔，是开销在书上的，就是那些没有用的事情，就比方说更新鲜的野菜，香蠢刚上市的时候，是非常贵的 二十块钱一斤，能想象吗 二十块钱一斤在当时。","sentence_en":"But amid that casual spending, a huge chunk went to books—on things that were useless, like fresher wild vegetables. When toon leaves first hit the market, they were very expensive, 20 yuan per catty. Can you imagine? 20 yuan per catty back then."},{"id":"377","start":2389.13,"end":2391.91,"displayStart":2389.13,"displayEnd":2391.91,"displayMid":2390.52,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.478934,"pitch":28.128834,"speechRate":5.214,"hasEvents":false,"sentence_source":"当年 我的天呐 相当于当时的生蚝。","sentence_en":"Back then, my god, that was like the price of oysters at the time."},{"id":"378","start":2391.91,"end":2395.91,"displayStart":2391.91,"displayEnd":2395.91,"displayMid":2393.91,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.873692,"pitch":16.82482,"speechRate":4.376,"hasEvents":false,"sentence_source":"对啊 然后我们家会买，一批新书到了 会买。","sentence_en":"Right. And our family would buy them—when a new batch of books arrived, we'd buy."},{"id":"379","start":2395.91,"end":2411.11,"displayStart":2395.91,"displayEnd":2411.11,"displayMid":2403.51,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.017433,"pitch":25.163139,"speechRate":5.113,"hasEvents":false,"sentence_source":"我们家我倒觉得，在传统中国而言，是属于比较浪漫主义的过日子的方式，中国的小知识分子，就没有想到要攒钱，比方说买房 买家具 什么什么的，都没有 但是他不好奇，我父母 他们也经常说。","sentence_en":"In my family, I think, by traditional Chinese standards, we live in a rather romantic way. As petty intellectuals, they never thought about saving money, like buying a house or furniture, nothing like that. But they weren't curious either. My parents often said that."},{"id":"380","start":2411.11,"end":2413.23,"displayStart":2411.11,"displayEnd":2413.23,"displayMid":2412.17,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.208143,"pitch":28.041025,"speechRate":6.132,"hasEvents":false,"sentence_source":"啊 宁吃鲜头一口 不吃烂性一框。","sentence_en":"Ah, 'Better to taste the first fresh bite than to have a whole basket of stale stuff."},{"id":"381","start":2413.23,"end":2427.53,"displayStart":2413.23,"displayEnd":2427.53,"displayMid":2420.38,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.00925,"pitch":24.424578,"speechRate":5.455,"hasEvents":false,"sentence_source":"所以什么东西都买新鲜的，我认为他们的冲动或者说这个好奇心是超过我的，也跟性格有关系，就是我们家到现在没有人管钱，大家对钱好像都觉得是一个很大的麻烦，从他们年轻的时候起。","sentence_en":"So they bought everything fresh. I think their impulse or curiosity surpassed mine. It's also a matter of personality—no one in our family has ever managed money. Everyone seems to see money as a big hassle, ever since they were young."},{"id":"382","start":2427.53,"end":2432.57,"displayStart":2427.53,"displayEnd":2432.57,"displayMid":2430.05,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.946519,"pitch":20.40369,"speechRate":6.151,"hasEvents":false,"sentence_source":"所有的钱就放在一个信封里头，工资拿出来都放信封里，只要花钱就从这拿。","sentence_en":"All the money was put in one envelope. When salaries came in, they went into the envelope. Whenever we needed to spend, we took from it."},{"id":"383","start":2432.57,"end":2435.09,"displayStart":2432.57,"displayEnd":2435.09,"displayMid":2433.83,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.122747,"pitch":25.895809,"speechRate":9.112,"hasEvents":false,"sentence_source":"然后拿着拿着就发现这个信封里什么都没有了。","sentence_en":"Then after a while, we'd find the envelope empty."},{"id":"384","start":2435.09,"end":2439.55,"displayStart":2435.09,"displayEnd":2439.55,"displayMid":2437.32,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.2,"loudness":0.961231,"pitch":18.300793,"speechRate":6.467,"hasEvents":false,"sentence_source":"然后就开始去借，打一个一个的欠条，开始是一点钱 后来是一大条。","sentence_en":"Then we'd start borrowing, writing IOU after IOU. At first small amounts, later big chunks."},{"id":"385","start":2439.55,"end":2441.79,"displayStart":2439.55,"displayEnd":2441.79,"displayMid":2440.67,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.851686,"pitch":25.008936,"speechRate":4.911,"hasEvents":false,"sentence_source":"所以直到我都工作以后了。","sentence_en":"So it wasn't until I started working..."},{"id":"386","start":2441.79,"end":2443.69,"displayStart":2441.79,"displayEnd":2443.69,"displayMid":2442.74,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.654944,"pitch":11.665075,"speechRate":5.263,"hasEvents":false,"sentence_source":"我们家才不打迁条了所。","sentence_en":"...that our family stopped writing IOUs."},{"id":"387","start":2443.69,"end":2445.49,"displayStart":2443.69,"displayEnd":2445.49,"displayMid":2444.59,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.291396,"pitch":34.086395,"speechRate":6.111,"hasEvents":false,"sentence_source":"谓银吃某粮 就是这么回事。","sentence_en":"That's what 'living beyond your means' is all about."},{"id":"388","start":2445.49,"end":2450.15,"displayStart":2445.49,"displayEnd":2450.15,"displayMid":2447.8199999999997,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.176559,"pitch":29.448219,"speechRate":4.721,"hasEvents":false,"sentence_source":"某粮没有计划没有安排没有像勤检吃家不是那样的。","sentence_en":"That kind of living has no plan, no arrangement—not like a thrifty, disciplined family."},{"id":"389","start":2450.15,"end":2456.57,"displayStart":2450.15,"displayEnd":2456.57,"displayMid":2453.36,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.5,"loudness":0.954327,"pitch":23.231148,"speechRate":6.184,"hasEvents":false,"sentence_source":"所以感谢那时候没有太大的贫富悬殊贫富差异，让一个小孩敏感的内心还得到妥善的保护。","sentence_en":"So I'm grateful that back then there wasn't a huge gap between rich and poor, which allowed a sensitive child's heart to be properly protected."},{"id":"390","start":2456.57,"end":2466.93,"displayStart":2456.57,"displayEnd":2466.93,"displayMid":2461.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.934201,"pitch":21.297939,"speechRate":5.695,"hasEvents":false,"sentence_source":"对 我们好像没有说还是拼命要什么大人拼命不给，我这辈子只跟我爸要我两次，一次要吃一个肯德鸡，我爸带我去了冬天我进去以后差点吐了。","sentence_en":"Right. It's not like we desperately begged for things and parents refused. I only asked my dad for two things in my life. Once, I wanted to eat KFC. My dad took me there in winter, and as soon as I walked in, I almost threw up."},{"id":"391","start":2466.93,"end":2476.95,"displayStart":2466.93,"displayEnd":2476.95,"displayMid":2471.9399999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":-0.1,"loudness":0.950305,"pitch":22.074543,"speechRate":4.682,"hasEvents":false,"sentence_source":"因为里面冬天聚浓的黄油的味道，结果梦想就破面 好像没吃就回来了，第二次问我爸要一个牛仔福 就有两次哇。","sentence_en":"Because in winter, the place was thick with the smell of butter. So my dream was shattered—we came back without eating, I think. The second time, I asked my dad for a cowboy outfit. That's twice."},{"id":"392","start":2476.95,"end":2483.51,"displayStart":2476.95,"displayEnd":2483.51,"displayMid":2480.23,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.4,"loudness":0.818847,"pitch":24.005499,"speechRate":5.793,"hasEvents":false,"sentence_source":"呀没有 我就没有要过什么 但是也没缺过什么，到现在还是这种感觉 就是我们内心挺堵定的。","sentence_en":"Well, no. I never really asked for anything, but I never lacked for anything either. Even now I have that feeling—we're quite settled inside."},{"id":"393","start":2483.51,"end":2487.19,"displayStart":2483.51,"displayEnd":2487.19,"displayMid":2485.3500000000004,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.4,"loudness":0.732493,"pitch":21.054607,"speechRate":6.231,"hasEvents":false,"sentence_source":"因为满足我的需求的东西极其有限 满足的就够了。","sentence_en":"Because the things that could satisfy my needs were extremely limited; once satisfied, that was enough."},{"id":"394","start":2487.19,"end":2492.21,"displayStart":2487.19,"displayEnd":2492.21,"displayMid":2489.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.874304,"pitch":22.629681,"speechRate":6.488,"hasEvents":true,"sentence_source":"我小时候的心里面会想 这个没有没关系，这些都是要靠我自己去买的。","sentence_en":"As a child, I thought, 'It's okay if I don't have this—I'll have to buy it myself later."},{"id":"395","start":2492.21,"end":2503.79,"displayStart":2492.21,"displayEnd":2503.79,"displayMid":2498,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.825605,"pitch":19.874006,"speechRate":6.303,"hasEvents":true,"sentence_source":"其实没有任何人跟我关书说 以后这一切你都要自己去挣啊，没有人跟我说我这句话，我小时候对于财富唯一的渴望就是暑假去上海，看我家里的亲戚，他们带我走很热很善。","sentence_en":"Actually, no one ever told me, 'You'll have to earn all this yourself.' No one said that. My only desire for wealth as a child was to go to Shanghai during summer vacation to visit my relatives. They took me walking in the sweltering heat."},{"id":"396","start":2503.79,"end":2507.21,"displayStart":2503.79,"displayEnd":2507.21,"displayMid":2505.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.88144,"pitch":22.993902,"speechRate":6.725,"hasEvents":false,"sentence_source":"我当时说能不能打一个车，当时好像还没有什么出租车。","sentence_en":"I asked, 'Can we take a cab?' But back then there weren't really taxis."},{"id":"397","start":2507.21,"end":2512.61,"displayStart":2507.21,"displayEnd":2512.61,"displayMid":2509.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.832073,"pitch":16.408123,"speechRate":5.741,"hasEvents":false,"sentence_source":"那谁能打得起啊，我想 这是对财富的渴望，将来长大以后自己能够赚钱打车。","sentence_en":"Who could afford one? I thought, that's the desire for wealth—to grow up and earn enough to take a cab."},{"id":"398","start":2512.61,"end":2525.07,"displayStart":2512.61,"displayEnd":2525.07,"displayMid":2518.84,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.880216,"pitch":22.219593,"speechRate":5.998,"hasEvents":false,"sentence_source":"哎 要这样说的话我打车也挺少，就是那时候我们还在伟大念书读博士的时候，他们说我一出校门就伸手，招手叫车嘛，他们说我的本能动作就是伸手，你的钱来自于哪呢 你钱够吗。","sentence_en":"Well, if you put it that way, I also take cabs pretty rarely. Back when we were still in school doing PhDs, they said as soon as I walked out of campus I'd stick out my hand—hailing a cab. They said my instinct was to reach out. 'Where does your money come from? Do you have enough?"},{"id":"399","start":2525.07,"end":2535.21,"displayStart":2525.07,"displayEnd":2535.21,"displayMid":2530.1400000000003,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.839081,"pitch":19.672438,"speechRate":4.635,"hasEvents":false,"sentence_source":"够 我讲已经挺多的，我没有开小 我就是吃 和出门就打车，我晕车 在公交车上我就特别的难受，真是他吐在别人身上。","sentence_en":"Enough. I said I had quite a bit. I didn't spend on small things—I only spent on food and taking cabs when going out. I get carsick; on a bus I feel terribly uncomfortable. Once I even threw up on someone."},{"id":"400","start":2535.21,"end":2538.39,"displayStart":2535.21,"displayEnd":2538.39,"displayMid":2536.8,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.987408,"pitch":22.303387,"speechRate":4.762,"hasEvents":false,"sentence_source":"所以出门就打车 后来就形成习惯。","sentence_en":"So I'd take a cab whenever I went out. It became a habit."},{"id":"401","start":2538.39,"end":2541.01,"displayStart":2538.39,"displayEnd":2541.01,"displayMid":2539.7,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.734031,"pitch":17.090523,"speechRate":6.489,"hasEvents":false,"sentence_source":"然后我现在也不会开车，我现在不会开车。 ral","score":0,"loudness":0.867649,"pitch":23.585598,"speechRate":6.522,"hasEvents":false,"sentence_source":"也没有别的娱乐呀，现在我都大量看手机了。","sentence_en":"There were no other entertainments. Now I spend a lot of time on my phone."},{"id":"493","start":2981.51,"end":2986.55,"displayStart":2981.51,"displayEnd":2986.55,"displayMid":2984.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":0.92515,"pitch":20.780016,"speechRate":6.392,"hasEvents":false,"sentence_source":"但是那个时候就大量看书，都是娱乐呀，你当时对未来的想象是什么老师呀。","sentence_en":"But back then, I read a lot, and that was entertainment. What was your vision for the future? A teacher?"},{"id":"494","start":2986.55,"end":2991.01,"displayStart":2986.55,"displayEnd":2991.01,"displayMid":2988.78,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.706527,"pitch":18.291933,"speechRate":6.139,"hasEvents":true,"sentence_source":"特别明确呀，我喜欢讲台，我也喜欢对人说话，而且别人必须得听。","sentence_en":"Very clear. I liked the podium, I liked speaking to people, and they had to listen."},{"id":"495","start":2992.35,"end":2998.17,"displayStart":2992.35,"displayEnd":2998.17,"displayMid":2995.26,"speaker":"Meng Man","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Positive","score":0.7,"loudness":0.759107,"pitch":21.019478,"speechRate":5.498,"hasEvents":true,"sentence_source":"但是你怎么知道你喜欢讲台呢，我就是喜欢说话给别人听，我有这样的表达欲。","sentence_en":"But how do you know you like the podium? I just like speaking to others; I have this desire to express myself."},{"id":"496","start":2998.17,"end":3001.33,"displayStart":2998.17,"displayEnd":3001.33,"displayMid":2999.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringi sterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.6,"loudness":1.132235,"pitch":23.632526,"speechRate":5.595,"hasEvents":false,"sentence_source":"那我也不会记哈哈哈哈哈，就是 所以什么叫滚刀肉嘛，怎么着不对，我就得按照我的节奏来了，我想这样就这样 不想。","sentence_en":"Then I wouldn't take them either, hahaha. So that's what a tough cookie means — no matter what, I go at my own pace. If I feel like it, I do it; if not, I don't."},{"id":"505","start":3049.97,"end":3063.23,"displayStart":3049.97,"displayEnd":3063.23,"displayMid":3056.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.8,"loudness":0.849101,"pitch":20.474064,"speechRate":5.732,"hasEvents":false,"sentence_source":"这样就算了，我好像是今天有一个我的生存的策略跟底线，就是我的底线你不能碰触，在底线之上，我愿意尽可能的在大众的规则里面生存，我也不觉得痛苦，这是特别特别好的一种做法。","sentence_en":"That's it. I have a survival strategy and a bottom line—don't cross it. Above that, I'm happy to follow society's rules without pain. It's a great approach."},{"id":"506","start":3063.23,"end":3069.55,"displayStart":3063.23,"displayEnd":3069.55,"displayMid":3066.3900000000003,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.7,"loudness":0.777484,"pitch":19.348751,"speechRate":6.329,"hasEvents":false,"sentence_source":"我到今天也没有特别学会这种做法，我认为我一直特别幸运，就是社会真的是给了我很大的空间。","sentence_en":"I haven't mastered that approach yet. I've been lucky—society gave me plenty of room."},{"id":"507","start":3069.55,"end":3073.55,"displayStart":3069.55,"displayEnd":3073.55,"displayMid":3071.55,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.6,"loudness":0.85387,"pitch":17.879698,"speechRate":5.867,"hasEvents":false,"sentence_source":"对，就刚好是我要到的那个空间，再大我好像也不需要了。","sentence_en":"Exactly the space I needed. Any bigger hasEvents":false,"sentence_source":"你就人生得谨小甚微的度过，可是我们的人生是允许大开大合的，是 我们早生和晚上其实都不会像这一代那么幸运，就是我们也不需要有那么多的才艺，我从小也没学过任何才艺。","sentence_en":"You have to live cautiously now, but we were allowed to take risks. We were lucky—we didn't need many talents. I never learned any as a kid."},{"id":"512","start":3110.75,"end":3120.11,"displayStart":3110.75,"displayEnd":3120.11,"displayMid":3115.4300000000003,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.4,"loudness":0.837843,"pitch":24.664454,"speechRate":5.616,"hasEvents":false,"sentence_source":"但是觉得那又怎样呢，现在小孩不是从小被过高的期待吗，你去学这个学那个，可是最后他们真的因此人生就过得更加饱满吗。","sentence_en":"But so what? Kids today face high expectations, learning this and that. Does it really make their lives fuller?"},{"id":"513","start":3120.11,"end":3132.27,"displayStart":3120.11,"displayEnd":3132.27,"displayMid":3126.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.831172,"pitch":20.028522,"speechRate":5.592,"hasEvents":true,"sentence_source":"其实也未必，真的是 所以人生有太多偶然性，你说财义 我也没有任何财义 你就觉得也可以，我一直以为主持人是全挂子的武艺，本质上来讲 你只要会说话就可以。","sentence_en":"Not necessarily. Life is full of chance. I have no talents, and that's okay. I thought hosts needed all-round skills, but really you just need to speak."},{"id":"514","start":3132.85,"end":3140.13,"displayStart":3132.85,"displayEnd":3140.13,"displayMid":3136.49,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.912059,"pitch":20.31584,"speechRate":6.044,"hasEvents":true,"sentence_source":"但是我看他好像觉得大家什么都会，吹拉弹唱各种各样的，不是本主持人 本主持人 吹拉弹唱什么都不会酷。","sentence_en":"But I saw that he seemed to think everyone could do everything—playing instruments, singing, and all sorts of things. Not this host. This host can't do any of that—cool."},{"id":"515","start":3140.27,"end":3143.15,"displayStart":3140.27,"displayEnd":3143.15,"displayMid":3141.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.493152,"pitch":29.379156,"speechRate":3.571,"hasEvents":false,"sentence_source":"除了说以外什么都不会。","sentence_en":"I can't do anything except talk."},{"id":"516","start":3143.15,"end":3144.23,"displayStart":3143.15,"displayEnd":3144.23,"displayMid":3143.69,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.8,"loudness":0.773307,"pitch":15.816787,"speechRate":3.704,"hasEvents":false,"sentence_source":"真的很棒。","sentence_en":"That's really great."},{"id":"517","start":3144.23,"end":3151.75,"displayStart":3144.23,"displayEnd":3151.75,"displayMid":3147.99,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.99257,"pitch":23.02853,"speechRate":6.699,"hasEvents":false,"sentence_source":"其实我觉得财义有也罢 没有也罢 自恰就好，你自己觉得你喜欢那么多的东西 那就喜欢，不喜欢也没有必要一定要喜欢。","sentence_en":"Talents or not, as long as you're fine with yourself. If you like many things, great. If not, no need to force it."},{"id":"518","start":3152.15,"end":3164.53,"displayStart":3152.15,"displayEnd":3164.53,"displayMid":3158.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.923119,"pitch":22.754803,"speechRate":5.724,"hasEvents":false,"sentence_source":"我是觉得有一记之长 一朝鲜吃遍天，你不具备多方面的才能 这样我人生也没那么多困惑，但凡我有很多才能 以我这纠结的双子的性格，我的人生可能会分出很多的差路。","sentence_en":"I think one skill is enough. Without many talents, I have fewer confusions. If I had many, my Gemini nature would make me take many detours."},{"id":"519"," irst. I know that the heroes in 'Water Margin' go somewhere and first check the pot."},{"id":"564","start":3378.49,"end":3380.77,"displayStart":3378.49,"displayEnd":3380.77,"displayMid":3379.63,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.950424,"pitch":23.657661,"speechRate":7.018,"hasEvents":false,"sentence_source":"然后能够有什么东西先吃到嘴里。","sentence_en":"Then they see what they can eat right away."},{"id":"565","start":3380.77,"end":3381.53,"displayStart":3380.77,"displayEnd":3381.53,"displayMid":3381.15,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.3,"loudness":0.815116,"pitch":16.631449,"speechRate":5.263,"hasEvents":false,"sentence_source":"那是真的。","sentence_en":"That's true."},{"id":"566","start":3381.95,"end":3384.07,"displayStart":3381.95,"displayEnd":3384.07,"displayMid":3383.01,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.5,"loudness":1.127645,"pitch":22.641649,"speechRate":5.66,"hasEvents":false,"sentence_source":"我觉得生活当然可以有想象。","sentence_en":"I think life can certainly involve imagination."},{"id":"567","start":3384.07,"end":3392.59,"displayStart":3384.07,"displayEnd":3392.59,"displayMid":3388.33,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.903503,"pitch":18.688072,"speechRate":5.917,"hasEvents":false,"sentence_source":"因为所有的文学作品必须建立在想象的基础之上，但这想象要落在史处，它要存在一种历史的真实，一种人的情绪的真实。","sentence_en":"Because all literature must be built on imagination, but that imagination needs to land on solid ground—it needs historical truth and emotional truth."},{"id":"568","start":3393.29,"end":3394.37,"di
