5.89,"displayStart":3412.63,"displayEnd":3415.89,"displayMid":3414.26,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.4,"loudness":0.944112,"pitch":20.726393,"speechRate":5.414,"hasEvents":false,"sentence_source":"所以我就始终觉得 哎呀 怎么现在张恨水。","sentence_en":"So I always feel—how come now we talk about Zhang Henshui?"},{"id":"573","start":3415.89,"end":3429.91,"displayStart":3415.89,"displayEnd":3429.91,"displayMid":3422.8999999999996,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.8,"loudness":1.007622,"pitch":23.21068,"speechRate":4.924,"hasEvents":false,"sentence_source":"但是大家说他冤仰蝴蝶派 然后想的问题也很窄 思想也很老套，可是那些表达很美呀 真的非常美 文字很干净 系列和优美，就属于中国古典小说不该放弃的一个传统。","sentence_en":"But people say he's part of the 'Mandarin Duck and Butterfly' school, his concerns are narrow, his ideas are outdated. Yet those expressions are beautiful—really beautiful, with clean, refined, and elegant prose. That's a tradition classical Chinese novels shouldn't have abandoned."},{"id":"574","start":3429.91,"end":3440.69,"displayStart":3429.91,"displayEnd":3440.69,"displayMid":3435.3,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.6,"loudness":0.915639,"pitch":19.857405,"speechRate":6.277,"hasEvents":false,"sentence_source":"可是现在我们的文学和史学和哲学其实我们所有的传统都已经放弃了，包括比如说我们现在做历史 中国有那么漫长的二四史为核心的那样的一个史学体系。","sentence_en":"But now in our literature, history, and philosophy, we've abandoned almost all our traditions. For example, in how we do history—China has such a long historical system centered on the Twenty-Four Histories."},{"id":"575","start":3440.69,"end":3453.87,"displayStart":3440.69,"displayEnd":3453.87,"displayMid":3447.2799999999997,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.5,"loudness":0.804975,"pitch":18.102814,"speechRate":5.615,"hasEvents":false,"sentence_source":"经常的这个传统 你说司马谦写东西多漂亮，司马光写东西那是一种理性之美业 多漂亮，可是现在我们其实用的方式不是基于我们这个传统的，它是属于西洋近代的那个史写传统。","sentence_en":"That tradition—how beautifully Sima Qian wrote, and Sima Guang's writing had a kind of rational beauty, also beautiful. But now the way we do things isn't based on our own tradition; it's from the Western modern historical tradition."},{"id":"576","start":3453.87,"end":3461.23,"displayStart":3453.87,"displayEnd":3461.23,"displayMid":3457.55,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.4,"loudness":0.897955,"pitch":22.788113,"speechRate":6.456,"hasEvents":false,"sentence_source":"可是西洋近代史写传统提出问题 解决问题，我就觉得有的时候现在我们真的在解决一些真问题吗，又不尽然。","sentence_en":"But the Western modern historical tradition raises questions and solves them. Sometimes I wonder if we're really solving real problems. Not really."},{"id":"577","start":3461.23,"end":3464.43,"displayStart":3461.23,"displayEnd":3464.43,"displayMid":3462.83,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.7,"loudness":0.87049,"pitch":15.821701,"speechRate":5.903,"hasEvents":false,"sentence_source":"所以就觉得好可惜啊，两个很伟大的传统。","sentence_en":"So it feels such a shame—two great traditions."},{"id":"578","start":3464.43,"end":3474.49,"displayStart":3464.43,"displayEnd":3474.49,"displayMid":3469.46,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.6,"loudness":0.776868,"pitch":16.74189,"speechRate":5.044,"hasEvents":true,"sentence_source":"其实都没接住，文学也是一样，现在中文系的人们孩子们都不再读小说了，你不读小说然后读文学批评，请问你在批评谁。","sentence_en":"Neither has been carried forward. It's the same with literature. Now in Chinese departments, kids don't even read novels anymore. If you don't read novels but read literary criticism, who are you criticizing?"},{"id":"579","start":3474.99,"end":3481.89,"displayStart":3474.99,"displayEnd":3481.89,"displayMid":3478.4399999999996,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.7,"loudness":0.758135,"pitch":16.509584,"speechRate":5.723,"hasEvents":true,"sentence_source":"我们有自己的一个文学的传统，西洋有西洋文学的一个传统，你两个都没接住，这是太可惜了。","sentence_en":"We have our own literary tradition, the West has its own. You haven't embraced either. That's such a pity."},{"id":"580","start":3481.89,"end":3483.55,"displayStart":3481.89,"displayEnd":3483.55,"displayMid":3482.7200000000003,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Negative","score":-0.8,"loudness":0.763415,"pitch":18.841169,"speechRate":6.338,"hasEvents":false,"sentence_source":"对，你的人生太可惜了。","sentence_en":"Yes, your life is such a pity."},{"id":"581","start":3483.55,"end":3485.23,"displayStart":3483.55,"displayEnd":3485.23,"displayMid":3484.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.5,"loudness":0.88074,"pitch":28.52071,"speechRate":8.497,"hasEvents":false,"sentence_source":"我特别理解你说这个文学传统。","sentence_en":"I really understand what you mean about the literary tradition."},{"id":"582","start":3485.23,"end":3496.99,"displayStart":3485.23,"displayEnd":3496.99,"displayMid":3491.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.984598,"pitch":24.487064,"speechRate":6.087,"hasEvents":false,"sentence_source":"其实你不阅读 慢慢慢慢就会丧失的，像你读这么多的书 你跟别人去分享的话 别人能接得住吗，就你有可以分享的同伴吗，有的时候我会跟朋友推荐一下 说最近我在看什么。","sentence_en":"If you don't read, you gradually lose it. Given how much you read, when you share with others, can they even follow? Do you have friends to share with? Sometimes I recommend to friends what I'm reading recently."},{"id":"583","start":3496.99,"end":3503.67,"displayStart":3496.99,"displayEnd":3503.67,"displayMid":3500.33,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.876409,"pitch":20.508528,"speechRate":5.86,"hasEvents":false,"sentence_source":"书挺好看的，大概率大家会说是吗 我也来看看 然后就没有然后了，我也没有太多的叛逃的欲望。","sentence_en":"The book is pretty good. Most likely people will say 'Oh really? Let me check it out too' and then nothing happens. I don't have much desire to escape either."},{"id":"584","start":3503.67,"end":3512.99,"displayStart":3503.67,"displayEnd":3512.99,"displayMid":3508.33,"speaker":"Meng Man","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Neutral","score":0,"loudness":0.815978,"pitch":20.63027,"speechRate":4.91,"hasEvents":false,"sentence_source":"其实我觉得这些东西是很有私属性的，有的时候跟人分享好像得不到那个预期的效果 所以也没必要啊你是。","sentence_en":"Actually I think these things are very personal. Sometimes sharing them with others doesn't get the expected response, so there's no need. You know?"},{"id":"585","start":3512.99,"end":3515.51,"displayStart":3512.99,"displayEnd":3515.51,"displayMid":3514.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.999381,"pitch":22.97719,"speechRate":7.661,"hasEvents":false,"sentence_source":"一个一直性高采烈的生活在自己世界里的人。","sentence_en":"A person who always lives cheerfully in their own world."},{"id":"586","start":3515.51,"end":3522.53,"displayStart":3515.51,"displayEnd":3522.53,"displayMid":3519.0200000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.812452,"pitch":18.601105,"speechRate":4.345,"hasEvents":false,"sentence_source":"对 这点特别可贵 自成体系 特别自洽，跟外部世界去连接没有那么的深刻。","sentence_en":"Yes, that's especially valuable—self-contained, very self-consistent, not deeply connected to the outside world."},{"id":"587","start":3522.53,"end":3526.65,"displayStart":3522.53,"displayEnd":3526.65,"displayMid":3524.59,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.96502,"pitch":25.688009,"speechRate":6.796,"hasEvents":false,"sentence_source":"呀 但是你说我们跟外界连接不深刻吗，我倒觉得像我们的父辈也好。","sentence_en":"Ah, but you say our connection with the outside world isn't deep? I think, whether it's our parents' generation..."},{"id":"588","start":3526.65,"end":3532.87,"displayStart":3526.65,"displayEnd":3532.87,"displayMid":3529.76,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.894904,"pitch":18.358475,"speechRate":5.466,"hasEvents":false,"sentence_source":"我们这一代也好 真的是随着大历史一起成长啊，像我妈妈她当年 因为就是我老了。","sentence_en":"Our generation too—we really grew up together with the big history. Like my mother back then, because... I'm old now."},{"id":"589","start":3532.87,"end":3545.83,"displayStart":3532.87,"displayEnd":3545.83,"displayMid":3539.35,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.871532,"pitch":20.758999,"speechRate":6.019,"hasEvents":false,"sentence_source":"那个时候是一个就是妇女嘛，她不觉得读书有什么重要性，她不让我妈妈去读书啊，据委会第一年成立的时候，我妈妈自己去找居委会 说我要读书，她等于说在公权力的干预之下 就去上学呀。","sentence_en":"At that time, she was just a woman. She didn't think reading was important, so she didn't let my mother go to school. In the first year the neighborhood committee was established, my mother went to the committee herself and said she wanted to study. So, under the intervention of public authority, she went to school."},{"id":"590","start":3545.83,"end":3553.57,"displayStart":3545.83,"displayEnd":3553.57,"displayMid":3549.7,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.02636,"pitch":25.349413,"speechRate":6.383,"hasEvents":false,"sentence_source":"那就是一个大时代 如果没有那样的一个居委会，这样的一个开头 或者说没有当时的宪法，男女有平等受教育的权力。","sentence_en":"That was a great era. Without that neighborhood committee, that beginning, or without the constitution at the time, which gave men and women equal rights to education..."},{"id":"591","start":3553.57,"end":3561.03,"displayStart":3553.57,"displayEnd":3561.03,"displayMid":3557.3,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":1.042424,"pitch":22.368441,"speechRate":6.671,"hasEvents":false,"sentence_source":"然后居委会也在大张旗鼓的宣传，学校也在大张旗鼓的宣传，没有这样的一个时代的话，她不可能活成现在这个样子呀。","sentence_en":"And the neighborhood committee was publicizing it loudly, schools were also publicizing it loudly. Without such an era, she couldn't have become what she is today."},{"id":"592","start":3561.03,"end":3563.31,"displayStart":3561.03,"displayEnd":3563.31,"displayMid":3562.17,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.873426,"pitch":21.507797,"speechRate":6.468,"hasEvents":false,"sentence_source":"那我们也是呀 我们这些欺凌后。","sentence_en":"We are the same—we later generations."},{"id":"593","start":3563.31,"end":3570.21,"displayStart":3563.31,"displayEnd":3570.21,"displayMid":3566.76,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.8,"loudness":0.874211,"pitch":18.136969,"speechRate":5.494,"hasEvents":false,"sentence_source":"我们为什么其实是属于幸福感特别强的一代人，是因为我们和改革开放是一道成长的呀。","sentence_en":"Why are we actually a generation with a particularly strong sense of happiness? Because we grew up together with the reform and opening-up."},{"id":"594","start":3570.21,"end":3578.27,"displayStart":3570.21,"displayEnd":3578.27,"displayMid":3574.24,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.9,"loudness":0.873463,"pitch":17.61272,"speechRate":7.133,"hasEvents":false,"sentence_source":"我们是在一个大时代建起的那个小楼之中，而且这个大时代居然允许我们建起了这样的一个小楼，这本身就是大时代的伟大之处。","sentence_en":"We are in the small building built by the great era, and the fact that this great era allowed us to build such a small building is itself the greatness of the great era."},{"id":"595","start":3578.27,"end":3590.37,"displayStart":3578.27,"displayEnd":3590.37,"displayMid":3584.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.905855,"pitch":24.337709,"speechRate":6.368,"hasEvents":false,"sentence_source":"对 我现在想想其实我们是第一代真正感受到，就是咱俩没什么不同吗，你是男的我是女的咱们都一样，但其实我们上一辈，我现在想想我爸爸是他们家族里面，第一个唯一的大学生。","sentence_en":"Yes, now I think about it, we are actually the first generation to truly feel that there's no difference between us—you're a man, I'm a woman, we're all the same. But actually our parents' generation, my father was the first and only college student in his family."},{"id":"596","start":3590.37,"end":3591.25,"displayStart":3590.37,"displayEnd":3591.25,"displayMid":3590.81,"speaker":"SPEAKER_00","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":1.18798,"pitch":35.268085,"speechRate":4.571,"hasEvents":false,"sentence_source":"他的姐姐。","sentence_en":"His elder sister."},{"id":"597","start":3591.25,"end":3596.25,"displayStart":3591.25,"displayEnd":3596.25,"displayMid":3593.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":1.010415,"pitch":26.277462,"speechRate":6.6,"hasEvents":false,"sentence_source":"妹妹都是要进工厂去做工人的，在我爷爷奶奶就是个特别贫穷的一个家庭的话。","sentence_en":"His younger sisters all had to go to factories to become workers, since my grandparents' family was particularly poor."},{"id":"598","start":3596.25,"end":3606.61,"displayStart":3596.25,"displayEnd":3606.61,"displayMid":3601.4300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Family education and upbringing","sentiment_en":"Neutral","score":0,"loudness":0.945268,"pitch":23.387369,"speechRate":6.178,"hasEvents":false,"sentence_source":"那要上学的话肯定是要儿子上嘛，我想 我的姑姑大姑姑小姑姑，他们多少是为了我爸做出他们的奉献，但他们可能不认为，他们可能认为好像就该如此天经。","sentence_en":"Then if someone had to go to school, it had to be the son. I think my aunts—the older and younger ones—they all made sacrifices for my father to some extent, but they probably don't see it that way. They probably think it was only natural."},{"id":"599","start":3606.61,"end":3608.25,"displayStart":3606.61,"displayEnd":3608.25,"displayMid":3607.4300000000003,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.600477,"pitch":25.299227,"speechRate":6.098,"hasEvents":false,"sentence_source":"地义啊 天经地义真的是。","sentence_en":"Only natural. Absolutely natural."},{"id":"600","start":3608.25,"end":3617.41,"displayStart":3608.25,"displayEnd":3617.41,"displayMid":3612.83,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":0.941967,"pitch":26.906023,"speechRate":6.441,"hasEvents":false,"sentence_source":"对呀 我们好像是创造了很多第一代吧，当然您的情况不太一样，这个父辈本身程度比较高，像我们第一个坐飞机的人，拿博士头衔的人等等等等。","sentence_en":"Yes, we seem to have created many firsts. Of course your situation is different, your parents' generation had a higher level of education. For us, we were the first to fly, to get a PhD, and so on."},{"id":"601","start":3617.41,"end":3620.99,"displayStart":3617.41,"displayEnd":3620.99,"displayMid":3619.2,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.8,"loudness":0.91557,"pitch":21.840429,"speechRate":6.069,"hasEvents":true,"sentence_source":"我们有太多太多的第一了，就是这是一个大时代呀。","sentence_en":"We have so many firsts. It's truly a great era."},{"id":"602","start":3620.99,"end":3623.47,"displayStart":3620.99,"displayEnd":3623.47,"displayMid":3622.2299999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":1.040391,"pitch":26.325439,"speechRate":7.712,"hasEvents":true,"sentence_source":"这一点是我们这一代人的一个幸运。","sentence_en":"This is a fortune for our generation."},{"id":"603","start":3623.47,"end":3628.45,"displayStart":3623.47,"displayEnd":3628.45,"displayMid":3625.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.6,"loudness":1.034268,"pitch":21.74482,"speechRate":5.333,"hasEvents":false,"sentence_source":"因为我们成长的环境已经这些差异，一开始在变小 束缚在变少。","sentence_en":"Because the environment we grew up in—these differences were already shrinking from the start, constraints were decreasing."},{"id":"604","start":3628.45,"end":3639.33,"displayStart":3628.45,"displayEnd":3639.33,"displayMid":3633.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.8,"loudness":0.844668,"pitch":23.610516,"speechRate":5.79,"hasEvents":false,"sentence_source":"所以我们在成长过程当中，没有因此又产生什么样的心理上的自卑，或觉得不如人，就内心不割裂，而且这种独立好像是一直都有的，这件我非常非常感谢。","sentence_en":"So during our growth, we didn't develop any psychological inferiority complex or feel inferior to others. Our inner self wasn't fragmented, and this independence seemed to have always existed. I am very, very grateful for that."},{"id":"605","start":3639.33,"end":3643.39,"displayStart":3639.33,"displayEnd":3643.39,"displayMid":3641.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.789257,"pitch":18.191826,"speechRate":5.433,"hasEvents":false,"sentence_source":"我能够长成这样一个从小就觉得很独立的一个人。","sentence_en":"I was able to grow into a person who felt independent from a young age."},{"id":"606","start":3643.39,"end":3645.05,"displayStart":3643.39,"displayEnd":3645.05,"displayMid":3644.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.037914,"pitch":21.411028,"speechRate":6.207,"hasEvents":false,"sentence_source":"其实是辛苦的 但是内。","sentence_en":"Actually it was hard, but inside..."},{"id":"607","start":3645.05,"end":3647.95,"displayStart":3645.05,"displayEnd":3647.95,"displayMid":3646.5,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":0.738501,"pitch":19.348129,"speechRate":5.172,"hasEvents":false,"sentence_source":"心是高兴的，而且你说有那么辛苦吗。","sentence_en":"Heart is happy. And you say, was it really that hard?"},{"id":"608","start :0,"loudness":0.985731,"pitch":20.839844,"speechRate":5.314,"hasEvents":false,"sentence_source":"那我想 这说对呀 我就站起来 从我旁边的人开始敬起。","sentence_en":"I thought, 'That makes sense,' so I stood up and started toasting from the person next to me."},{"id":"740","start":4428.81,"end":4435.21,"displayStart":4428.81,"displayEnd":4435.21,"displayMid":4432.01,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.4,"loudness":0.925822,"pitch":21.454615,"speechRate":5.625,"hasEvents":false,"sentence_source":"然后这个老师又教导我说 不得先从领导人开始敬起，我就想 哎呀 好累呀 早知道不敬啊。","sentence_en":"Then the teacher corrected me, saying I should start with the leaders first. I thought, 'Oh, so tiring. If I'd known, I wouldn't have done it."},{"id":"741","start":4435.21,"end":4443.53,"displayStart":4435.21,"displayEnd":4443.53,"displayMid":4439.37,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.034203,"pitch":27.698278,"speechRate":7.37,"hasEvents":false,"sentence_source":"然后后来我就决定 无论谁说什么 我就不敬了，最后人家说干杯的时候 我特别听话，好像就这个仪式结束了 人家说干杯 我就自动把那杯酒干掉。","sentence_en":"After that, I decided no matter what anyone says, I won't propose toasts. When people say 'cheers,' I obediently drink my glass—it's like once the ritual's over, I automatically finish it."},{"id":"742","start":4443.53,"end":4445.69,"displayStart":4443.53,"displayEnd":4445.69,"displayMid":4444.61,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.902999,"pitch":20.818731,"speechRate":5.14,"hasEvents":false,"sentence_source":"但是从头到尾就是那杯酒。","sentence_en":"But from start to finish, it's just that one glass."},{"id":"743","start":4445.69,"end":4451.41,"displayStart":4445.69,"displayEnd":4451.41,"displayMid":4448.549999999999,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.5,"loudness":1.095487,"pitch":25.681761,"speechRate":6.157,"hasEvents":false,"sentence_source":"其实别人给我敬酒只要他不需要我说一些奇怪的客套话我一直是觉得挺好的。","sentence_en":"Actually, when others toast me, as long as they don't expect me to say some weird polite phrases, I think it's fine."},{"id":"744","start":4451.41,"end":4464.45,"displayStart":4451.41,"displayEnd":4464.45,"displayMid":4457.93,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.6,"loudness":1.13192,"pitch":24.891365,"speechRate":5.418,"hasEvents":false,"sentence_source":"但是我害怕是什么 就是因为现在有的时候人家需要我来先说一句什么，哎呀 这个事情太可怕了 太可怕了，尤其是你要讲话 别人总希望你能讲出花来最好金句贫出。","sentence_en":"But what I'm afraid of is that sometimes people expect me to say something first. Oh, that's terrible, terrible. Especially when you have to speak—people want you to be witty and come out with brilliant lines."},{"id":"745","start":4465.31,"end":4477.31,"displayStart":4465.31,"displayEnd":4477.31,"displayMid":4471.31,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.061097,"pitch":24.409334,"speechRate":6.713,"hasEvents":true,"sentence_source":"我们有一位比我年纪还大一点的同志 他就给我起了一篇稿子，说你无论是哪一个场合 你就照这三段论来说，大体上是什么 先感谢这个主人 后感谢什么，后来大家一块什么用餐愉快之类的。","sentence_en":"There's a colleague a bit older than me who drafted a script for me, saying, 'No matter the occasion, follow this three-part formula: first thank the host, then thank others, then say something like enjoy the meal together."},{"id":"746","start":4477.31,"end":4490.45,"displayStart":4477.31,"displayEnd":4490.45,"displayMid":4483.88,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.3,"loudness":1.04697,"pitch":26.487692,"speechRate":5.728,"hasEvents":true,"sentence_source":"就是他说这个绝对不出错 当然一点都没有金句，你任何场合都可以用啊，我倒是觉得大如祸至宝啊 果然是这样啊，可是我发现当我狙齐酒杯的时候，就那些全都忘了 就拉倒了。","sentence_en":"He said it's foolproof—no clever lines, but usable anywhere. I thought it was a lifesaver, and it worked. But I found that when I raised my glass, I forgot everything and just gave up."},{"id":"747","start":4490.45,"end":4497.91,"displayStart":4490.45,"displayEnd":4497.91,"displayMid":4494.18,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.095169,"pitch":22.516453,"speechRate":6.285,"hasEvents":false,"sentence_source":"所以还是词不达意 说一些奇怪的话，当然别人就期望我说一首诗嘛，这好像还行吧 一般就随便临出一首诗来。","sentence_en":"So I still end up rambling and saying weird things. Of course, people expect me to recite a poem—that's okay, I can usually improvise one on the spot."},{"id":"748","start":4498.51,"end":4505.27,"displayStart":4498.51,"displayEnd":4505.27,"displayMid":4501.89,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.5,"loudness":1.179512,"pitch":27.281801,"speechRate":5.473,"hasEvents":true,"sentence_source":"但是你不觉得这很奇怪吗，我都这个岁数了 我像小孩子一样 你给我表演一个，这好奇怪呀。","sentence_en":"But don't you think it's weird? At my age, you're treating me like a child asking me to perform. That's so strange."},{"id":"749","start":4505.77,"end":4511.05,"displayStart":4505.77,"displayEnd":4511.05,"displayMid":4508.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.445222,"pitch":29.343122,"speechRate":4.735,"hasEvents":true,"sentence_source":"对呀 我觉得本质上讲就是说 蒙曼唱个歌没有任何区别这有。","sentence_en":"Exactly, I think essentially it's no different from Meng Man singing a song."},{"id": ed in what they say."},{"id":"784","start":4705.95,"end":4710.89,"displayStart":4705.95,"displayEnd":4710.89,"displayMid":4708.42,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.5,"loudness":1.187266,"pitch":26.47653,"speechRate":6.178,"hasEvents":false,"sentence_source":"对呀 所以千万人无王矣 这不是一个口号啊 一个了不起的事情啊。","sentence_en":"Exactly. So 'when millions are silent, there is no king' — this is not just a slogan. It's a remarkable thing."},{"id":"785","start":4710.89,"end":4717.57,"displayStart":4710.89,"displayEnd":4717.57,"displayMid":4714.23,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.6,"loudness":0.932641,"pitch":22.594263,"speechRate":6.75,"hasEvents":true,"sentence_source":"那按照自己的节奏做事 有什么问题吗 我又没有被抓起来，我又没有被禁言 我为什么不能说我想说的话。","sentence_en":"What's wrong with doing things at my own pace? I'm not arrested, I'm not silenced—why can't I say what I want?"},{"id":"786","start":4717.57,"end":4727.27,"displayStart":4717.57,"displayEnd":4727.27,"displayMid":4722.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.938521,"pitch":20.795164,"speechRate":5.029,"hasEvents":true,"sentence_source":"老师 你应该出本书 如何拥有蒙曼一样的心态，你这个心态太可贵了，这个心态挺正常的 他正常 但稀少 相信我。","sentence_en":"Teacher, you should write a book on how to have a mindset like Meng Man's. Your mindset is precious—normal but rare, trust me."},{"id":"787","start":4727.27,"end":4737.11,"displayStart":4727.27,"displayEnd":4737.11,"displayMid":4732.1900000000005,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.5,"loudness":0.954983,"pitch":22.374147,"speechRate":5.488,"hasEvents":false,"sen of-body' control over myself—just a few modules, how to arrange and combine them. I could instantly think: if someone wanted to twist my words, deleting the beginning or the middle, how could I rearrange them?"},{"id":"791","start":4766.73,"end":4770.33,"displayStart":4766.73,"displayEnd":4770.33,"displayMid":4768.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.791095,"pitch":17.744755,"speechRate":4.444,"hasEvents":false,"sentence_source":"尽可能把这个伤害降低到最低的程度。","sentence_en":"To minimize the damage as much as possible."},{"id":"792","start":4770.33,"end":4781.71,"displayStart":4770.33,"displayEnd":4781.71,"displayMid":4776.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.5,"loudness":0.825687,"pitch":21.203121,"speechRate":5.593,"hasEvents":false,"sentence_source":"我们每次讲话不断地由我跳出来，再指挥我自己 有一段时间是这样子的，但后来我觉得不能够这样，而且那样很累 而且你依然于事无补，于事无补 没错。","sentence_en":"Every time I spoke, I'd constantly step outside myself and direct myself. That was the case for a while, but later I felt I couldn't do that—it's too tiring and ultimately useless. Useless, exactly."},{"id":"793","start":4781.71,"end":4785.29,"displayStart":4781.71,"displayEnd":4785.29,"displayMid":4783.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.100888,"pitch":20.039555,"speechRate":5.587,"hasEvents":false,"sentence_source":"因为这个排列组会有太多种可能性了太对了你。","sentence_en":"Because there are too many possibilities in these permutations—you're right."},{"id":"794","start":4785.29,"end":4797.45,"displayStart":4785.29,"displayEnd":4797.45,"displayMid":4791.37,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.107537,"pitch":26.11916,"speechRate":5.37,"hasEvents":false,"sentence_source":"做不了什么，现在我们的同伴们也跟我说，你不要那么快的反应，人家问完你先沉淫两三秒钟，我心想我沉淫两三秒钟，就我沉淫两三个小时，我说的还是那些话。","sentence_en":"Nothing can be done. Now my colleagues also tell me: don't react so fast, take two or three seconds to pause after being asked. I thought, even if I paused two or three seconds—or even two or three hours—I'd still say the same thing."},{"id":"795","start":4797.45,"end":4803.51,"displayStart":4797.45,"displayEnd":4803.51,"displayMid":4800.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.112046,"pitch":25.811337,"speechRate":5.954,"hasEvents":false,"sentence_source":"真的 就是，两秒钟跟两小时，只是让大家觉得心里舒服一点，但其实没有任何的变化。","sentence_en":"Really, two seconds versus two hours just makes everyone feel a bit more comfortable, but there's no actual change."},{"id":"796","start":4803.51,"end":4804.83,"displayStart":4803.51,"displayEnd":4804.83,"displayMid":4804.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":1.143831,"pitch":22.966314,"speechRate":8.658,"hasEvents":false,"sentence_source":"我们还是会讲一样的话。","sentence_en":"We'd still say the same things."},{"id":"797","start":4804.83,"end":4808.27,"displayStart":4804.83,"displayEnd":4808.27,"displayMid":4806.55,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Positive","score":0.5,"loudness":1.124713,"pitch":30.365999,"speechRate":4.783,"hasEvents":false,"sentence_source":"而且我都觉得 哎呀，老要张狂 少要稳当。","sentence_en":"And I think, well, 'The old should be bold, the young should be steady."},{"id":"798","start":4808.27,"end":4821.47,"displayStart":4808.27,"displayEnd":4821.47,"displayMid":4814.870000000001,"speaker":"Meng Man","speak th or two. Why is it like this? But at the time, I had no malicious intent to make him unhappy."},{"id":"873","start":5313.25,"end":5315.35,"displayStart":5313.25,"displayEnd":5315.35,"displayMid":5314.3,"speaker":"Meng Man","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Artistic Taste and Reading Experience","sentiment_en":"Neutral","score":0,"loudness":0.813734,"pitch":17.335447,"speechRate":5.238,"hasEvents":true,"sentence_source":"所以就是这样来开解自己。","sentence_en":"So that's how I console myself."},{"id":"874","start":5315.85,"end":5325.63,"displayStart":5315.85,"displayEnd":5325.63,"displayMid":5320.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Physical Illness and Life Choices","sentiment_en":"Negative","score":-0.5,"loudness":0.871835,"pitch":22.649973,"speechRate":5.934,"hasEvents":false,"sentence_source":"你知道我当时看了以后特别感动 就是因为我爸爸也去世了，我就想 啊 人有时候 因为我爸爸到晚年 他有二次海默，他后来还查出有一线矮。","sentence_en":"You know, I was really moved when I saw that because my dad also passed away. I thought, ah, sometimes people... because in his later years, my dad had Alzheimer's, and later they found he also had lung cancer."},{"id":"875","start":5325.63,"end":5328.33,"displayStart":5325.63,"displayEnd":5328.33,"displayMid":5326.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Physical Illness and Life Choices","sentiment_en":"Neutral","score":0,"loudness":0.823288,"pitch":20.617077,"speechRate":6.667,"hasEvents":false,"sentence_source":"然后医生就说你们要做个决定，做不做手术。","sentence_en":"Then the doctor said we had to decide: whether to do surgery or not."},{"id":"876","start":5328.33,"end":5334.21,"displayStart":5328.33,"displayEnd":5334.21,"displayMid":5331.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":10,"clusterLabel":"C10","clusterName":"Physical Illness and Life Choices","sentiment_en":"Neutral","score":0,"loudness":0.717038,"pitch":22.633808,"speechRate":5.442,"hasEvents":fa ow to bring it up."},{"id":"903","start":5500.09,"end":5505.25,"displayStart":5500.09,"displayEnd":5505.25,"displayMid":5502.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Negative","score":-0.3,"loudness":0.662861,"pitch":18.296045,"speechRate":4.242,"hasEvents":false,"sentence_source":"我又能理解又不理解，我能够明白，就是你特别内疚。","sentence_en":"I both understand and don't understand. I can see that you feel very guilty."},{"id":"904","start":5505.25,"end":5507.81,"displayStart":5505.25,"displayEnd":5507.81,"displayMid":5506.530000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.752619,"pitch":19.895868,"speechRate":6.68,"hasEvents":false,"sentence_source":"那你妈每次会有什么表情的什么态度呢。","sentence_en":"What kind of expression or attitude does your mother show each time?"},{"id":"905","start":5507.81,"end":5510.07,"displayStart":5507.81,"displayEnd":5510.07,"displayMid":5508.9400000000005,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.885296,"pitch":20.15793,"speechRate":6.436,"hasEvents":false,"sentence_source":"她也不会说什么，她就会知道了。","sentence_en":"She doesn't say anything. She just knows."},{"id":"906","start":5510.07,"end":5516.57,"displayStart":5510.07,"displayEnd":5516.57,"displayMid":5513.32,"speaker":"Meng Man","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Life choices and attitudes","sentiment_en":"Neutral","score":0,"loudness":0.93041,"pitch":15.352018,"speechRate":6.615,"hasEvents":false,"sentence_source":"然后就是注意安全，少说话呀什么什么什么的，就是原来我爸爸跟我说那些，现在被我妈完整的继承下来。","sentence_en":"Then it's just 'be safe, talk less' and so on. It's exactly what my father used to say to me, now fully inherited by my mother."},{"id":"907","start":5516.57,"end":5531. yStart":5831.29,"displayEnd":5844.75,"displayMid":5838.02,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Negative","score":-0.4,"loudness":0.899593,"pitch":20.548246,"speechRate":5.92,"hasEvents":false,"sentence_source":"因为他确实他们后来脾气是越来越大，我老觉得和他们失去了那种人生的目标，我要失去了关注有关系，一点小事就容易发脾气，我就一直对这句话印象特别特别的深，我就想不要早知如此。","sentence_en":"Because he really did get more irritable as time went on. I always felt like they lost their purpose in life, or maybe lost their focus. Small things would set them off. That sentence stuck with me deeply. I thought, don't let it be 'if only I'd known."},{"id":"956","start":5844.75,"end":5845.95,"displayStart":5844.75,"displayEnd":5845.95,"displayMid":5845.35,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.643802,"pitch":17.17952,"speechRate":5,"hasEvents":false,"sentence_source":"生命就是这样。","sentence_en":"That's what life is."},{"id":"957","start":5845.95,"end":5858.53,"displayStart":5845.95,"displayEnd":5858.53,"displayMid":5852.24,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Positive","score":0.5,"loudness":0.826557,"pitch":18.51524,"speechRate":5.724,"hasEvents":true,"sentence_source":"所以现在我要是喜欢什么，我一定要，我比原来要勇敢的多，要直接的多，你爸爸对你说最后一句话是什么，最后一句话其实是对他的后世的交代，他希望回到爷爷奶奶身边。","sentence_en":"So now, if I like something, I just go for it. I'm much braver and more direct than before. What were your father's last words to you? His last words were actually about his funeral arrangements—he wanted to be buried next to his parents."},{"id":"958","start":5859.17,"end":5863.01,"displayStart":5859.17,"displayEnd":5863.01,"displayMid":5861.09,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Neutral","score":0,"loudness":0.867715,"pitch":20.760643,"speechRate":6.51,"hasEvents":true,"sentence_source":"我觉得他那个时候已经非常清晰了，就是知道自己来日武多。","sentence_en":"I think he was very clear at that point—he knew he didn't have much time left."},{"id":"959","start":5863.01,"end":5865.95,"displayStart":5863.01,"displayEnd":5865.95,"displayMid":5864.48,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Neutral","score":0,"loudness":0.752158,"pitch":19.133642,"speechRate":6.349,"hasEvents":false,"sentence_source":"然后后来就没有说过特别有意义的事情了。","sentence_en":"After that, he didn't say anything particularly meaningful."},{"id":"960","start":5865.95,"end":5880.09,"displayStart":5865.95,"displayEnd":5880.09,"displayMid":5873.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Positive","score":0.6,"loudness":0.706082,"pitch":19.870066,"speechRate":4.85,"hasEvents":false,"sentence_source":"我爸爸对我说的最后一句话是，他这位从来没有讲过，关于外貌，他说你今天很好看哦，特别震动我，我想天啊，一个人最后，他却已经没有意识了，他当时是我还认识我。","sentence_en":"The last thing my father said to me was something he'd never talked about before—appearance. He said, 'You look really good today.' It shook me. I thought, wow, at his last moment, he barely had consciousness, but he still recognized me."},{"id":"961","start":5880.09,"end":5882.43,"displayStart":5880.09,"displayEnd":5882.43,"displayMid":5881.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Neutral","score":0,"loudness":0.649829,"pitch":14.015915,"speechRate":6.278,"hasEvents":false,"sentence_source":"其实我都不能够百分之百的肯定。","sentence_en":"Actually, I can't be a hundred percent sure."},{"id":"962","start":5882.43,"end":5886.15,"displayStart":5882.43,"displayEnd":5886.15,"displayMid":5884.29,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Neutral","score":0,"loudness":1.03039,"pitch":24.879229,"speechRate":4.732,"hasEvents":false,"sentence_source":"哦 因为您父亲有二次海默的女朋友。","sentence_en":"Oh, because your father had Alzheimer's."},{"id":"963","start":5886.15,"end":5894.55,"displayStart":5886.15,"displayEnd":5894.55,"displayMid":5890.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Positive","score":0.7,"loudness":0.836533,"pitch":23.447735,"speechRate":5.405,"hasEvents":false,"sentence_source":"但是他震撼我的就是人到最后的阶段，他可能都未必知道你是谁的时候，他对于美还有一种表达渴望和认知。","sentence_en":"But what moved me was that at the very end, when he might not even know who you are, he still had the desire and awareness to express something about beauty."},{"id":"964","start":5894.55,"end":5900.11,"displayStart":5894.55,"displayEnd":5900.11,"displayMid":5897.33,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Negative","score":-0.5,"loudness":0.935483,"pitch":25.516829,"speechRate":4.856,"hasEvents":false,"sentence_source":"对 真的是 因为我父亲中间有一段时间他就是精神特别的不稳定。","sentence_en":"Right, absolutely. Because my father went through a period where he was emotionally very unstable."},{"id":"965","start":5900.11,"end":5916.03,"displayStart":5900.11,"displayEnd":5916.03,"displayMid":5908.07,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Positive","score":0.6,"loudness":0.853301,"pitch":18.708067,"speechRate":3.832,"hasEvents":false,"sentence_source":"然后我给他听江河水 听思乡曲 听这些 他会安定一些，就是人对美 一直是不能够完全忘却的，我也觉得这个事情很神奇 因为我当时有点无忌可思了。","sentence_en":"Then I played 'River of Sorrow' and 'Nostalgia' for him, and he would calm down a bit. It's like people can never completely forget beauty. I found it amazing because at that time I was at a loss for words."},{"id":"966","start":5916.03,"end":5925.09,"displayStart":5916.03,"displayEnd":5925.09,"displayMid":5920.5599999999995,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Negative","score":-0.4,"loudness":0.871722,"pitch":19.459822,"speechRate":6.924,"hasEvents":false,"sentence_source":"中间的意思 他也不认识我了 也不认认任何人，我就不知道应该怎么办好 因为这是他非常喜欢的一些，我就放江河水 我发现它就安静下来了。","sentence_en":"At that point, he didn't recognize me or anyone. I didn't know what to do, so I played 'River Water'—something he really loved—and found he calmed down."},{"id":"967","start":5925.09,"end":5928.63,"displayStart":5925.09,"displayEnd":5928.63,"displayMid":5926.860000000001,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Neutral","score":0,"loudness":1.074408,"pitch":25.437077,"speechRate":7.453,"hasEvents":false,"sentence_source":"其实江河水是很碰派的一个曲子呀，但它反倒安静下来了。","sentence_en":"Actually, 'River Water' is a very powerful piece, but it calmed him down instead."},{"id":"968","start":5928.63,"end":5932.33,"displayStart":5928.63,"displayEnd":5932.33,"displayMid":5930.48,"speaker":"Meng Man","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Family Relationships and Life Insights","sentiment_en":"Negative","score":-0.3,"loudness":0.857802,"pitch":20.633121,"speechRate":4.665,"hasEvents":false,"sentence_source":"所以我就想 哎呀 连我都忘记的时候它。","sentence_en":"So I thought, 'Oh, even when I forget myself, it—"},{"id":"969","start":5932.33,"end":5934.55,"displayStart":5932.33,"displayEnd":5934.55,"displayMid":5933.4400000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writing, literature, and works","sentiment_en":"Positive","score":0.5,"loudness":0.848975, el":"C5","clusterName":"Artistic Taste and Reading Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.950445,"pitch":25.051155,"speechRate":5.227,"hasEvents":false,"sentence_source":"因为美伊战争 伊拉克还进飞区呢，巴格达时中心那个唯一的五星级酒店，保护的很好但已经残破不堪了很久了。","sentence_en":"During the US-Iraq war, Iraq had no-fly zones. The only five-star hotel in central Baghdad was well-protected but had been in disrepair for a long time."},{"id":"1057","start":6460.07,"end":6473.61,"displayStart":6460.07,"displayEnd":6473.61,"displayMid":6466.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Artistic Taste and Reading Experience","sentiment_en":"Neutral","score":0,"loudness":0.993953,"pitch":23.043234,"speechRate":5.465,"hasEvents":false,"sentence_source":"因为所有的设施你运不进去，他们在酒店的正门口正中间的地上，把那个磁砖敲掉新铺的磁砖组成了一个，老布什的那个脸歪七扭八的一个图片，就是让你每个人走过去你得踩它。","sentence_en":"Because you couldn't get supplies in. They had removed the tiles right at the hotel's main entrance and laid new ones to form a twisted image of George H.W. Bush, forcing everyone to step on it as they walked in."},{"id":"1058","start":6473.61,"end":6476.13,"displayStart":6473.61,"displayEnd":6476.13,"displayMid":6474.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.3,"loudness":1.175023,"pitch":27.493349,"speechRate":6.573,"hasEvents":false,"sentence_source":"我当时内心总觉得踩人是有障碍。","sentence_en":"I always felt uneasy stepping on someone's face."},{"id":"1059","start":6476.13,"end":6485.89,"displayStart":6476.13,"displayEnd":6485.89,"displayMid":6481.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.016387,"pitch":24.133488,"speechRate":6.547,"hasEvents":true,"sentence_source":"因为中国人习惯踩人不礼貌，但我怕我不踩人 伊拉克人不高兴，每次我都看看周围没有人看我，就我绕过去我跳过去，就是非常独特的一段历史跟记忆。","sentence_en":"As a Chinese, it's impolite, but I was afraid Iraqis would be upset if I didn't. So every time, I'd look around to see if anyone was watching, then jump over it. It was a very unique piece of history and memory."},{"id":"1060","start":6485.89,"end":6497.97,"displayStart":6485.89,"displayEnd":6497.97,"displayMid":6491.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":1.001187,"pitch":24.897095,"speechRate":5.79,"hasEvents":true,"sentence_source":"一打开伊拉克酒店的窗帘 萨达姆的图片恨然出现在我的面前，整面墙 当时用两翼战争的一些遗迹，你能够看到伊拉克跟伊朗的边界 因为我们都是从边界穿进去吗。","sentence_en":"When I opened the curtain in my hotel room in Iraq, Saddam's picture suddenly loomed before me—covering an entire wall. There were remnants from the Iran-Iraq war. You could see the border between Iraq and Iran because we crossed it."},{"id":"1061","start":6497.97,"end":6506.19,"displayStart":6497.97,"displayEnd":6506.19,"displayMid":6502.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Neutral","score":0,"loudness":0.977547,"pitch":23.476131,"speechRate":6.306,"hasEvents":false,"sentence_source":"我忘了是伊拉克是冲着伊朗 伊朗冲着伊拉克 有没有雕塑，一帮战士用手指指的对面 对着敌人 但其实战争已经结束了。","sentence_en":"I forget if it was Iraq facing Iran or Iran facing Iraq, but there were sculptures of soldiers pointing at the enemy across the border. The war had ended, but the relics were still there."},{"id":"1062","start":6506.19,"end":6513.27,"displayStart":6506.19,"displayEnd":6513.27,"displayMid":6509.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.889643,"pitch":21.432341,"speechRate":4.744,"hasEvents":false,"sentence_source":"但那些遗迹都还在 你会发现天 人类就不断地这样 战争停止和平 下一次战争。","sentence_en":"You realize humanity keeps cycling like this: war stops, peace comes, then the next war."},{"id":"1063"," idn't treasure it enough. In 1999, human confidence was at its peak. Thank you for comforting me—I think it's because I was young and didn't know the limits of the world. I thought, 'I'll come back here often, right? I'm just shooting a show."},{"id":"1067","start":6540.21,"end":6547.65,"displayStart":6540.21,"displayEnd":6547.65,"displayMid":6543.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Negative","score":-0.5,"loudness":0.947255,"pitch":25.355604,"speechRate":5.854,"hasEvents":false,"sentence_source":"节目不就走马关花吗，如果我知道今天他将是可能人类难得一见的一个时期的话，我会更加地珍惜他。","sentence_en":"The show was just a quick tour. If I had known that this would become a period rarely seen in human history, I would have cherished it more."},{"id":"1068","start":6547.65,"end":6549.93,"displayStart":6547.65,"displayEnd":6549.93,"displayMid":6548.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.5,"loudness":1.056758,"pitch":23.718878,"speechRate":7.692,"hasEvents":false,"sentence_source":"但是，我觉得当时那种状态就是最好的。","sentence_en":"But I think that state of mind back then was the best."},{"id":"1069","start":6549.93,"end":6552.53,"displayStart":6549.93,"displayEnd":6552.53,"displayMid":6551.23,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.885069,"pitch":20.525946,"speechRate":5.15,"hasEvents":false,"sentence_source":"人类甜蜜地享受着那种自信。","sentence_en":"Humanity was sweetly enjoying that confidence."},{"id":"1070","start":6552.53,"end":6561.21,"displayStart":6552.53,"displayEnd":6561.21,"displayMid":6556.87,"speaker":"Meng Man","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"History, Era, and Culture","sentiment_en":"Positive","score":0.7,"loudness":0.942369,"pitch":21.964764," <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
