hRate":6.145,"hasEvents":false,"sentence_source":"那你的生活你觉得幸福吗?","sentence_en":"Then, do you feel happy in your life?"},{"id":"18","start":93.11,"end":108.71,"displayStart":93.11,"displayEnd":108.71,"displayMid":100.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.893789,"pitch":25.862669,"speechRate":4.921,"hasEvents":false,"sentence_source":"我觉得幸福是一个被过高评估的一个，会给我们带来很多困惑，造成很多不必要麻烦的一个词汇，人不需要每天都过得很幸福，你每天过得依然自得，你很平静 你很舒服，是非常非常好的。","sentence_en":"I think happiness is an overrated term that brings us a lot of confusion and unnecessary trouble. People don't need to be happy every day. If you are content, calm, and comfortable every day, that's very, very good."},{"id":"19","start":108.71,"end":111.65,"displayStart":108.71,"displayEnd":111.65,"displayMid":110.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.846675,"pitch":29.117874,"speechRate":5.49,"hasEvents":false,"sentence_source":"那是我们需要达到的一个境界嗨。","sentence_en":"That is a realm we need to achieve, hey."},{"id":"20","start":114.55,"end":130.43,"displayStart":114.55,"displayEnd":130.43,"displayMid":122.49000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.914952,"pitch":21.375376,"speechRate":3.904,"hasEvents":true,"sentence_source":"大家好 欢迎来到岩中花述，我最近一次因为感动流泪 是几天前 我在看张春的作品，我读到其中 他写到他妈妈 爸爸 哥哥，所有的片段我都流泪流到不行。","sentence_en":"Hello everyone, welcome to 'Rocks in Flowers'. The last time I was moved to tears was a few days ago when I was reading Zhang Chun's work. I read about his mother, father, and brother, and I couldn't stop crying at every passage."},{"id":"21","start":130.43,"end":145.13,"displayStart":130.43,"displayEnd":145.13,"displayMid":137.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":0.840965,"pitch":22.324759,"speechRate":4.626,"hasEvents":false,"sentence_source":"这些片段来自于张春的作品 一生里的某一刻，我先想分享给大家一段 他写他哥哥的，他说哥哥和我不算非常亲密的兄妹，他为我做的事很少 但想为我做的事情很多。","sentence_en":"These clips are from Zhang Chun's work 'A Moment in Life'. I want to share a passage he wrote about his brother. He said, 'My brother and I are not very close siblings. He has done very little for me, but he wants to do a lot for me."},{"id":"22","start":145.71,"end":152.35,"displayStart":145.71,"displayEnd":152.35,"displayMid":149.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.7,"loudness":0.858895,"pitch":21.765068,"speechRate":5.312,"hasEvents":false,"sentence_source":"他在我婚礼前的一天 拍着新郎的肩膀说，你对我妹妹好一点 这个妹妹对我很重要。","sentence_en":"The day before my wedding, he patted the groom on the shoulder and said, 'Be good to my sister—she means a lot to me."},{"id":"23","start":152.35,"end":166.89,"displayStart":152.35,"displayEnd":166.89,"displayMid":159.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.7,"loudness":0.761481,"pitch":20.498552,"speechRate":4.608,"hasEvents":false,"sentence_source":"然后嚎嚎大哭 再也说不下去了，我从未用年龄 容貌 视野 家庭，这些标词去衡量我的哥哥，他在我眼中永远是那个 挣扎着成长的少年，或许在别人看来 我们很不一样。","sentence_en":"Then he burst into tears and couldn’t go on. I’ve never measured my brother by age, looks, vision, or family. In my eyes, he’s always been that struggling, growing kid. Maybe to others, we seem very different."},{"id":"24","start":166.89,"end":176.39,"displayStart":166.89,"displayEnd":176.39,"displayMid":171.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":0.800773,"pitch":22.41 al","score":0,"loudness":1.303489,"pitch":30.477839,"speechRate":6.633,"hasEvents":false,"sentence_source":"然后另外一个人还有相当长的。","sentence_en":"And the other lived quite a long time."},{"id":"72","start":495.31,"end":509.67,"displayStart":495.31,"displayEnd":509.67,"displayMid":502.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Negative","score":-0.3,"loudness":0.898079,"pitch":24.640696,"speechRate":5.259,"hasEvents":false,"sentence_source":"但是也是非常颠沛流离 跌宕起伏的人生，但你会发现他们的拿到人生剧本是如此的不同，这是让我当时看到我会内心特别兮兮的一个地方，但我内心的情感部分会更加倾向于肖宏。","sentence_en":"Also a very turbulent, up-and-down life—but you see how different the scripts they were given were. That really stirred something in me. Emotionally, I lean more toward Xiao Hong."},{"id":"73","start":509.67,"end":517.05,"displayStart":509.67,"displayEnd":517.05,"displayMid":513.36,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Positive","score":0.5,"loudness":0.9498,"pitch":22.713018,"speechRate":6.111,"hasEvents":false,"sentence_source":"因为他那么的脆弱 转瞬即逝，他的文笔 他的性格 他的行为 处事，一切都很符合我们当代人，我不知道你的感。","sentence_en":"Because she was so fragile, so fleeting. Her writing, her personality, her behavior, her way of dealing with things—everything about her feels so contemporary. I don't know how you feel—"},{"id":"74","start":517.05,"end":519.87,"displayStart":517.05,"displayEnd":519.87,"displayMid":518.46,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Neutral","score":0,"loudness":0.753507,"pitch":18.224474,"speechRate":4.965,"hasEvents":false,"sentence_source":"觉是怎样，你觉得他符合当代人吗。","sentence_en":"how does it seem to you? Do you think she fits contemporary people?"},{"id":"75","start":519.87,"end":527.03,"displayStart":519.87,"displayEnd":527.03,"displayMid":523.45,"speaker":"Zhang Chun","speake ,"hasEvents":true,"sentence_source":"我可能更多是他的文笔吧，你看他的文笔其实你根本不会感受到，这是一个写于上个世纪那么久远之前的一位作家的笔下，他的文章当中很少有那种我们看到的文字中的八古气，太难得了。","sentence_en":"I'm probably more drawn to his writing style. You see, when you read his prose, you never feel that it was written by an author from so long ago, from the last century. His articles rarely have that old-fashioned, pedantic tone we often see. It's so rare."},{"id":"80","start":553.59,"end":558.47,"displayStart":553.59,"displayEnd":558.47,"displayMid":556.03,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Positive","score":0.6,"loudness":0.961934,"pitch":20.074434,"speechRate":3.491,"hasEvents":false,"sentence_source":"对 其实至今他也是少见的，就是他有思想。","sentence_en":"Yeah, even now he's rare—he has depth of thought."},{"id":"81","start":558.47,"end":571.95,"displayStart":558.47,"displayEnd":571.95,"displayMid":565.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Positive","score":0.6,"loudness":0.966312,"pitch":22.691004,"speechRate":4.867,"hasEvents":false,"sentence_source":"但是他没有这种意识形态的这种说教，我猜这就是你说的那个八古气，他也很推崇鲁迅 但是他也不像鲁迅那样写，也说 有多少种生活 就应该有多少种小说。","sentence_en":"But he avoids ideological preaching, which I guess is what you mean by that stale cliché. He admires Lu Xun but doesn't write like him—says as many kinds of lives there are, so many kinds of novels there should be."},{"id":"82","start":571.95,"end":573.95,"displayStart":571.95,"displayEnd":573.95,"displayMid":572.95,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Neutral","score":0,"loudness":0.887985,"pitch":19.597692,"speechRate":5.5,"hasEvents":false,"sentence_source":"那他也不要像鲁迅那样写。","sentence_en":"He doesn't want to write like Lu Xun either."},{"id":"83","start":573.95,"end":582.27,"displayStart":573.95,"displayEnd":582. eakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":0.855797,"pitch":23.320131,"speechRate":3.892,"hasEvents":false,"sentence_source":"说中的文学，是那样的黄黄俱智 得经历时代 得波澜壮阔，得有一些中心 有一些主角 小宏就没有。","sentence_en":"Like the literature they talk about—grand, sweeping, full of twists and turns, with central figures and protagonists. Xiao Hong didn't have that."},{"id":"92","start":630.69,"end":645.99,"displayStart":630.69,"displayEnd":645.99,"displayMid":638.34,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.855759,"pitch":22.641903,"speechRate":4.706,"hasEvents":false,"sentence_source":"所以那个时候我读到我也不是很有感觉，过后慢慢的才反起来 才满满的意识到，我现在想他是怎样写出这些东西的，我以一个创作者的这种心情去看待的时候 我就维制震撼。","sentence_en":"So at that time, when I read it, I didn't feel much. Only later did it slowly sink in, and I gradually realized. Now I think about how he wrote these things. When I look at it from a creator's perspective, I am utterly awestruck."},{"id":"93","start":645.99,"end":655.35,"displayStart":645.99,"displayEnd":655.35,"displayMid":650.6700000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Negative","score":-0.3,"loudness":0.993234,"pitch":26.262442,"speechRate":5.099,"hasEvents":false,"sentence_source":"而且你提起小宏那个隐隐约约的人们的印象，也绝不会先想起他的作品 都是很少的，都是想起他不幸的人生。","sentence_en":"And when you bring up Xiao Hong, people's vague impressions never jump to her works—they're too few. Instead, they think of her unfortunate life."},{"id":"94","start":655.35,"end":661.09,"displayStart":655.35,"displayEnd":661.09,"displayMid":658.22,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":1.240959,"pitch":23.548687,"speechRate":3.34,"hasEvents":false,"sentence_source":"对 他的情感经历 他的颠沛流离的生活这个。","sentence_en":"Yeah, her love life, her tumultuous journey."},{"id":"95","start":661.09,"end":666.15,"displayStart":661.09,"displayEnd":666.15,"displayMid":663.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Negative","score":-0.5,"loudness":0.829717,"pitch":18.926378,"speechRate":4.55,"hasEvents":false,"sentence_source":"不行 我不同意，你知道了20多岁开始读到小红的作品。","sentence_en":"No, I disagree. You said you started reading Xiao Hong's works in your twenties."},{"id":"96","start":666.15,"end":678.49,"displayStart":666.15,"displayEnd":678.49,"displayMid":672.3199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":1.068908,"pitch":22.802404,"speechRate":4.84,"hasEvents":false,"sentence_source":"那在你的少年时期，当你开始就认为自己就是一个作家，你未来是要以写作，作为你的使命的一个女孩子的时候最，早会被哪些文学作品所激励。","sentence_en":"But in your teenage years, when you already saw yourself as a writer, a girl destined to write—what literary works inspired you the most back then?"},{"id":"97","start":678.49,"end":688.39,"displayStart":678.49,"displayEnd":688.39,"displayMid":683.44,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Positive","score":0.5,"loudness":0.866754,"pitch":22.728243,"speechRate":4.262,"hasEvents":false,"sentence_source":"马克·土温 哈克·贝利芬令险记，这个我印象很深，他里面有一个情节是这样子的，就是汤姆幻想自己死了。","sentence_en":"Mark Twain's The Adventures of Huckleberry Finn. I remember a scene vividly: Tom imagines himself dead."},{"id":"98","start":688.39,"end":702.29,"displayStart":688.39,"displayEnd":702.29,"displayMid":695.3399999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":0.994902,"pitch":24.90485,"speechRate":5.396,"hasEvents":false,"sentence_source":"因为丢了衣服还是什么，反正就是说他要被他的姨妈责骂，这个姨妈就对着他小小的棺材流泪，说他是一个多么好的孩子，就不应该为了这件衣服骂他，他想着想着自己就流下泪来。","sentence_en":"He lost his clothes or something, and he thinks his aunt will scold him. But then she weeps over his little coffin, saying what a good kid he was, that she shouldn't have yelled at him for the clothes. As he imagines this, he starts crying himself."},{"id":"99","start":702.29,"end":710.59,"displayStart":702.29,"displayEnd":710.59,"displayMid":706.44,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.949025,"pitch":25.427319,"speechRate":5.419,"hasEvents":false,"sentence_source":"然后我就觉得天呐，这就是我想的事情，原来这个写下来他就是作家，我就想好我也可以当作家 我就是作家。","sentence_en":"And I thought, wow, that's exactly what I think. So writing this down makes you a writer. I figured, I can be a writer too. I am a writer."},{"id":"100","start":711.91,"end":713.55,"displayStart":711.91,"displayEnd":713.55,"displayMid":712.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":1.621448,"pitch":25.867805,"speechRate":6.25,"hasEvents":true,"sentence_source":"这是你多大时候的想法。","sentence_en":"How old were you when you thought that?"},{"id":"101","start":713.55,"end":720.07,"displayStart":713.55,"displayEnd":720.07,"displayMid":716.81,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":0.827986,"pitch":24.761271,"speechRate":5.061,"hasEvents":false,"sentence_source":"四年级 你看我长大了以后，有一部分的我认为作家是需要认证的，是需要资格的。","sentence_en":"Fourth grade. See, when I grew up, part of me believed you need credentials, need to be certified to be a writer."},{"id":"102","start":720.07,"end":723.05,"displayStart":720.07,"displayEnd":723.05,"displayMid":721.56,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Positive","score":0.5,"loudness":1.113477,"pitch":26.159014,"speechRate":6.071,"hasEvents":false,"sentence_source":"但是那个时候我觉得能这样写就是作家。","sentence_en":"But at that time, I thought being able to write like that made me a writer."},{"id":"103","start":723.05,"end":736.31,"displayStart":723.05,"displayEnd":736.31,"displayMid":729.68,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Positive","score":0.6,"loudness":1.032029,"pitch":23.537291,"speechRate":4.525,"hasEvents":false,"sentence_source":"那我也能 那我就是，我现在也保留了一部分就是，我说我是作家 我就是，我不需要别人承认的那个四年级的想法当然，也有一部分是被归训的想法。","sentence_en":"Then I can too, so I am. I still partly hold that fourth-grade mindset: I say I'm a writer, so I am. I don't need others' approval. But of course, part of me is also disciplined by norms."},{"id":"104","start":736.91,"end":740.77,"displayStart":736.91,"displayEnd":740.77,"displayMid":738.8399999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Positive","score":0.4,"loudness":1.176955,"pitch":28.599443,"speechRate":4.743,"hasEvents":true,"sentence_source":"你说你是小说家 你总得有一部小说吧哈哈。","sentence_en":"You say you're a novelist, but you need at least one novel, haha."},{"id":"105","start":741.89,"end":752.89,"displayStart":741.89,"displayEnd":752.89,"displayMid":747.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Positive","score":0.5,"loudness":1.012773,"pitch":24.249023,"speechRate":4.909,"hasEvents":true,"sentence_source":"也有一部分的我是这样子的长大的我，先成为作家 再成为小说家 一步一步来，我看你的作品当中 你早期有一个身份 我觉得很特别。","sentence_en":"Part of me grew up like that: become a writer first, then a novelist, step by step. I see in your work you had an early identity that I find very special."},{"id":"106","start":752.89,"end":765.33,"displayStart":752.89,"displayEnd":765.33,"displayMid":759.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":0.998721,"pitch":25.890209,"speechRate":4.904,"hasEvents":false,"sentence_source":"那是有太浓重的历史的印记，你说你是一个超生的一个孩子对我，觉得这个印记 可能再过十年二十年，很多小孩子会不理解 这是什么概念 什么意思。","sentence_en":"That has such a strong historical mark. You say you were an extra child born under the policy. I think in another ten or twenty years, many kids won't understand what that concept means."},{"id":"107","start":765.33,"end":775.13,"displayStart":765.33,"displayEnd":775.13,"displayMid":770.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":1.021481,"pitch":23.371435,"speechRate":5.255,"hasEvents":false,"sentence_source":"但是所有经历过80年代的人 他都会明白超生意味着什么，但我从来没有想过 从一个超生的孩子角度去看待这个事情除。","sentence_en":"But everyone who lived through the 80s knows what it means. I never thought about it from that perspective, except that I am a supernumerary child myself."},{"id":"108","start":775.13,"end":780.65,"displayStart":775.13,"displayEnd":780.65,"displayMid":777.89,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":0.944302,"pitch":24.629601,"speechRate":4.891,"hasEvents":false,"sentence_source":"了我自己是超生的 然后我现在接触的我的资客 他们也是超生的。","sentence_en":"And now the clients I work with are also supernumerary children."},{"id":"109","start":780.65,"end":789.39,"displayStart":780.65,"displayEnd":789.39,"displayMid":785.02,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0,"loudness":1.060209,"pitch":29.301706,"speechRate":5.718,"hasEvents":false,"sentence_source":"但是我作为一个超生的女孩 我意识到我在这种比较里面，我发现是有一点点特殊的 一般都是有女孩 然后追一个男孩。","sentence_en":"But as a supernumerary girl, I realized in these comparisons that I'm a bit special. Usually, families have a girl and then chase a boy."},{"id":"110","start":789.39,"end":804.43,"displayStart":789.39,"displayEnd":804.43,"displayMid":796.91,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.4,"loudness":0.954712,"pitch":23.734419,"speechRate":5.183,"hasEvents":false,"sentence_source":"但是我们家是我有一个哥哥 但是我妈妈想生一个女孩，他就想儿女双全 其实是多多一善，他觉得孩子越多越好，他就是一个很朴素的喜欢小孩的一个想法，超生大家都知道就是很不容易。","sentence_en":"But in my family, I have an older brother, and my mom wanted a girl. She wanted both a son and a daughter—actually, more is better. She just simply loved children. Everyone knows having a supernumerary child is very hard."},{"id":"111","start":804.43,"end":805.93,"displayStart":804.43,"displayEnd":805.93,"displayMid":805.18,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.113493,"pitch":30.286352,"speechRate":5.932,"hasEvents":false,"sentence_source":"我是春天出生的。","sentence_en":"I was born in spring."},{"id":"112","start":805.93,"end":809.73,"displayStart":805.93,"displayEnd":809.73,"displayMid":807.8299999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.930844,"pitch":23.522373,"speechRate":5,"hasEvents":false,"sentence_source":"所以我在肚子里面最显怀的时候都是在冬天。","sentence_en":"So the time I was most visibly pregnant was in winter."},{"id":"113","start":809.73,"end":821.61,"displayStart":809.73,"displayEnd":821.61,"displayMid":815.6700000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.939997,"pitch":22.181095,"speechRate":5.387,"hasEvents":false,"sentence_source":"但是我妈妈整个冬天都把里面的衣服都就不穿空心了的，就穿那个棉袄，这样子他整个冬天都没有人看出来他怀孕了我出生，就第二天我爸爸就去发喜糖。","sentence_en":"But my mom went the whole winter without wearing any undershirt, just a padded jacket, so no one noticed she was pregnant. Then I was born, and the next day my dad handed out celebratory candies."},{"id":"114","start":821.61,"end":828.51,"displayStart":821.61,"displayEnd":828.51,"displayMid":825.06,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.978988,"pitch":24.564646,"speechRate":4.928,"hasEvents":false,"sentence_source":"然后是说我老婆生了一个女儿，没有人信，就说你不要胡扯了，前天你老婆还在拎着。","sentence_en":"He said, 'My wife gave birth to a daughter.' No one believed him. They said, 'Don't joke, just two days ago your wife was carrying..."},{"id":"115","start":828.51,"end":829.59,"displayStart":828.51,"displayEnd":829.59,"displayMid":829.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.866295,"pitch":22.260023,"speechRate":5.556,"hasEvents":false,"sentence_source":"热水瓶上楼呢。","sentence_en":"...a thermos upstairs."},{"id":"116","start":829.59,"end":843.61,"displayStart":829.59,"displayEnd":843.61,"displayMid":836.6,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.933649,"pitch":23.891228,"speechRate":4.413,"hasEvents":false,"sentence_source":"为了防止那些计划生育干部的那个追捕，我不是在医院出生的，是在我妈妈的姐姐家，我妈妈的同学去接生的，我的家里面，我奶奶生了六个儿子。","sentence_en":"To avoid the family planning officers, I wasn't born in a hospital, but at my maternal aunt's house, delivered by my mom's classmate. At home, my grandmother had six sons."},{"id":"117","start":843.61,"end":844.97,"displayStart":843.61,"displayEnd":844.97,"displayMid":844.29,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.281975,"pitch":26.940004,"speechRate":6.838,"hasEvents":false,"sentence_source":"然后我爸爸是老大。","sentence_en":"And my father was the eldest."},{"id":"118","start":844.97,"end":847.45,"displayStart":844.97,"displayEnd":847.45,"displayMid":846.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.918883,"pitch":26.412432,"speechRate":4.435,"hasEvents":false,"sentence_source":"然后他自己呢，他又是长子。","sentence_en":"And he himself is the firstborn son."},{"id":"119","start":847.45,"end":854.83,"displayStart":847.45,"displayEnd":854.83,"displayMid":851.1400000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.91656,"pitch":23.161293,"speechRate":5.64,"hasEvents":false,"sentence_source":"然后他生的第一个孩子又是一个儿子，好像我是家里面比较珍贵的一个女孩，我小时候是这种感觉。","sentence_en":"And his first child was also a son. So I seemed like a precious girl in the family—that's how I felt as a child."},{"id":"120","start":854.83,"end":867.51,"displayStart":854.83,"displayEnd":867.51,"displayMid":861.1700000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.843393,"pitch":23.507881,"speechRate":5.205,"hasEvents":false,"sentence_source":"我觉得其实有点特别，就大部分的超生的女孩是不被期待的，这个我是从我后来的这个经历里面慢慢观察到，但这只是一方面，另外一方面是我的这种被期待呢。","sentence_en":"I think that's somewhat special. Most supernumerary girls are not wanted. I gradually observed that from later experiences. But that's only one side. The other side is that I was wanted."},{"id":"121","start":867.51,"end":882.91,"displayStart":867.51,"displayEnd":882.91,"displayMid":875.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.3,"loudness":0.913507,"pitch":23.043083,"speechRate":4.481,"hasEvents":false,"sentence_source":"后来又跟很多的别的那种事情有一些冲突有一些扭曲，比如说我爷爷说家里有个女孩了，你将来最好去做护士或者做老师，当时我并不觉得 但是隐隐的觉得有一点怪。","sentence_en":"But later that conflicted and twisted with many other things. For example, my grandfather said, 'Now we have a girl, you'd better become a nurse or a teacher.' At the time I didn't feel much, but vaguely sensed something odd."},{"id":"122","start":882.91,"end":886.33,"displayStart":882.91,"displayEnd":886.33,"displayMid":884.62,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.949686,"pitch":22.583818,"speechRate":4.386,"hasEvents":false,"sentence_source":"那为什么呢 其实家里有一个女孩了。","sentence_en":"Why? Actually, we already had a girl."},{"id":"123","start":886.33,"end":902.07,"displayStart":886.33,"displayEnd":902.07,"displayMid":894.2,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":0.830276,"pitch":20.586901,"speechRate":4.511,"hasEvents":false,"sentence_source":"然后你去做护士或者做老师的意思是，你去做这个家庭的照顾者 服务者，这个我又常常听说了，很多的女孩都被赋予过这样子的一个使命，后来我还生病嘛 躺在家里面修养。","sentence_en":"The implication of you becoming a nurse or teacher is that you become the family's caretaker and server. I've often heard that. Many girls are given that mission. Later, I got sick and stayed home to recover."},{"id":"124","start":902.07,"end":913.59,"displayStart":902.07,"displayEnd":913.59,"displayMid":907.83,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.3,"loudness":0.99509,"pitch":29.981243,"speechRate":5.516,"hasEvents":false,"sentence_source":"然后我奶奶就是三番五次就来训斥我妈妈，说你看 就让她念那么多书干什么，就是早不要出去就不会这样子了，你看一方面我又觉得他好像是关心我。","sentence_en":"And my grandmother repeatedly scolded my mother: 'Look, why let her study so much? If she hadn't gone out earlier, this wouldn't have happened.' On one hand, I felt she cared about me."},{"id":"125","start":913.59,"end":926.95,"displayStart":913.59,"displayEnd":926.95,"displayMid":920.27,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":0.86727,"pitch":24.079958,"speechRate":4.799,"hasEvents":false,"sentence_source":"但是另一方面又觉得他好像是在阻止我，这就让我很冲突，就是这些细致末节的各种各样的事情，我家有一位邻居这个奶奶，她也是很多儿子没有女儿。","sentence_en":"But on the other hand, I felt she was holding me back. That created a conflict. These little things... We had a neighbor grandmother who also had many sons and no daughters."},{"id":"126","start":926.95,"end":940.55,"displayStart":926.95,"displayEnd":940.55,"displayMid":933.75,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.932382,"pitch":25.137844,"speechRate":5.259,"hasEvents":false,"sentence_source":"然后她的儿子都非常有出息，都在外地然后做着很大的事业，她呢跟我的妈妈两个人就说，我要是个女儿多好，我要是个女儿多享福，我小时候没有多想 但是也会记住这种话。","sentence_en":"Her sons were very successful, working far away in big careers. She and my mom would say, 'How nice if I had a daughter, I'd be so blessed.' As a child, I didn't think much, but I remembered those words."},{"id":"127","start":940.55,"end":956.37,"displayStart":940.55,"displayEnd":956.37,"displayMid":948.46,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":0.858561,"pitch":21.775764,"speechRate":5.043,"hasEvents":false,"sentence_source":"后来我就慢慢地意识到这个所谓的多想福，它的意思就是能更好的来孝敬父母，儿子们出去发展 我们不能阻止他，而女儿天生就是要在这里和父母唯一在一起，让他们更舒适的一个角色。","sentence_en":"I gradually realized that the so-called 'blessing of many children' actually means being able to better care for parents. We can't stop sons from going out to develop, but daughters are naturally the ones who stay with parents and make them more comfortable."},{"id":"128","start":956.37,"end":958.77,"displayStart":956.37,"displayEnd":958.77,"displayMid":957.5699999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.88393,"pitch":23.155939,"speechRate":5.603,"hasEvents":false,"sentence_source":"我觉得，你这么解读是有道理的。","sentence_en":"I think your interpretation makes sense."},{"id":"129","start":958.77,"end":967.91,"displayStart":958.77,"displayEnd":967.91,"displayMid":963.3399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":1.184593,"pitch":28.999718,"speechRate":6.201,"hasEvents":false,"sentence_source":"但这么去解读的话 我会发现天哪，过往我听到的很多的我认为是充满善意和鼓励的话，可能都可以赋予他另外一个角度，另外一种解。","sentence_en":"But with this interpretation, I realize that many well-intentioned and encouraging words I've heard before can be seen from another angle."},{"id":"130","start":967.91,"end":977.05,"display :"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.5,"loudness":0.916987,"pitch":24.469189,"speechRate":4.661,"hasEvents":false,"sentence_source":"因为你太漂亮了 你就是在诱惑别人，或者是 这就意味着你虚荣 你就补物正业，你最好学业有成 你不能是个文盲，你不能是一个没文化的家伙 你富有师书 气自华。","sentence_en":"Because being too pretty means you're tempting others, or it means you're vain and not focusing on your career. You should be academically successful, not illiterate or uncultured. 'Learning enriches your aura."},{"id":"161","start":1179.96,"end":1193.7,"displayStart":1179.96,"displayEnd":1193.7,"displayMid":1186.83,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.6,"loudness":0.95828,"pitch":24.326071,"speechRate":4.876,"hasEvents":false,"sentence_source":"但是 你也不能念太多的书，你看 一方面我觉得 OK 我要上大学，但另一方面也有很多的声音说 你念那么多书干嘛，你这样子会嫁不出去 会没有男人喜欢 会太强势。","sentence_en":"But you also can't study too much. On one hand, I think it's okay to go to college, but on the other hand, many say, 'Why study so much? You'll never get married, no man will like you, you'll be too strong-willed."},{"id":"162","start":1193.7,"end":1205.56,"displayStart":1193.7,"displayEnd":1205.56,"displayMid":1199.63,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.7,"loudness":0.989296,"pitch":23.693113,"speechRate":5.098,"hasEvents":false,"sentence_source":"你看这样子的压力在男人身上是没有的，你要有学问 那你越有学问越好，你越有学问你就会得到越多的正反馈，得到越多的奖励 但是女孩不是的。","sentence_en":"You see, men don't have this kind of pressure. The more educated you are, the better—you get more positive feedback and rewards. But not for girls."},{"id":"163","start":1206.16,"end":1216.38,"displayStart":1206.16,"displayEnd":1216.38,"displayMid":1211.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.8,"loudness":1.026699,"pitch":25.62034,"speechRate":5.079,"hasEvents":false,"sentence_source":"所有这些关于女性的充满了束缚，充满了偏见的一些念头，都是在你青春期的时候方方面面的，就灌输到你的脑海当中的。","sentence_en":"All these thoughts about women, full of constraints and prejudices, were instilled into your mind from all sides during your adolescence."},{"id":"164","start":1216.38,"end":1224.46,"displayStart":1216.38,"displayEnd":1224.46,"displayMid":1220.42,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.939175,"pitch":24.847364,"speechRate":5.151,"hasEvents":false,"sentence_source":"对啊 我觉得不只是我，所有的女孩都是这个感觉，你的应对方是什么 你怎么做呢，我抑郁 我就想自杀。","sentence_en":"Yes, I think it's not just me, but all girls feel this way. What's your coping strategy? What do you do? I get depressed, I want to kill myself."},{"id":"165","start":1224.46,"end":1227.36,"displayStart":1224.46,"displayEnd":1227.36,"displayMid":1225.9099999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.886083,"pitch":23.854836,"speechRate":4.828,"hasEvents":false,"sentence_source":"但是真正最抑郁的还是结婚以后。","sentence_en":"But the most depressing time was after marriage."},{"id":"166","start":1227.36,"end":1233.54,"displayStart":1227.36,"displayEnd":1233.54,"displayMid":1230.4499999999998,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.8,"loudness":1.055934,"pitch":24.20446,"speechRate":5.472,"hasEvents":false,"sentence_source":"但是这种抑郁我觉得是贯穿于我的一生，除了就是很小的时候，前半辈子吧。","sentence_en":"But I think this depression has run through my life, except for when I was very young. The first half of my life."},{"id":"167","start":1233.96,"end":1236.06,"displayStart":1233.96,"displayEnd":1236.06,"displayMid":1235.01,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Positive","score":0.5,"loudness":0.866204,"pitch":23.058966,"speechRate":6.806,"hasEvents":false,"sentence_source":"我觉得下半辈子应该会好一点。","sentence_en":"I think the second half will be better."},{"id":"168","start":1236.06,"end":1242.36,"displayStart":1236.06,"displayEnd":1242.36,"displayMid":1239.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Negative","score":-0.5,"loudness":0.964044,"pitch":25.889902,"speechRate":5.705,"hasEvents":false,"sentence_source":"那在青春期那个成长期间，你离家又很远在学校里面，你说跟同学这也没有很愉快。","sentence_en":"During adolescence, you were far from home at school, and you said it wasn't pleasant with classmates."},{"id":"169","start":1242.36,"end":1249.2,"displayStart":1242.36,"displayEnd":1249.2,"displayMid":1245.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.975806,"pitch":20.718973,"speechRate":4.532,"hasEvents":false,"sentence_source":"那当时你的自己排遣这些负面情绪的方法是什么，你能跟谁去倾诉这些呢。","sentence_en":"So at that time, what methods did you use to relieve these negative emotions? Who could you talk to?"},{"id":"170","start":1251.1,"end":1265.72,"displayStart":1251.1,"displayEnd":1265.72,"displayMid":1258.4099999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Positive","score":0.5,"loudness":0.875879,"pitch":21.763275,"speechRate":4.382,"hasEvents":true,"sentence_source":"我没有想过这个问题，我现在想一下，我现在觉得好像写作就是一个很重要的方法，从小到大 特别是有了电脑以后，十几岁以后 因为电脑不用手写嘛。","sentence_en":"I haven't thought about that. Let me think now. I feel writing was an important method, from childhood, especially after getting a computer in my teens, because typing is less tiring than handwriting."},{"id":"171","start":1265.72,"end":1268.96,"displayStart":1265.72,"displayEnd":1268.96,"displayMid":1267.3400000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.784829,"pitch":15.436171,"speechRate":3.086,"hasEvents":false,"sentence_source":"手写很累 然后打字不累。","sentence_en":"Handwriting is tiring, but typing is not."},{"id":"172","start":1268.96,"end":1270.78,"displayStart":1268.96,"displayEnd":1270.78,"displayMid":1269.87,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.286621,"pitch":28.732639,"speechRate":6.294,"hasEvents":false,"sentence_source":"然后还有很多的日记。","sentence_en":"And I kept many diaries."},{"id":"173","start":1270.78,"end":1277.86,"displayStart":1270.78,"displayEnd":1277.86,"displayMid":1274.32,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.4,"loudness":0.85874,"pitch":24.159676,"speechRate":5.379,"hasEvents":false,"sentence_source":"其实我妈妈前些时候还帮我把我小时候的日记寄来了，我发现有这么一裸 可能有几十本吧。","sentence_en":"Actually, my mother recently sent me my childhood diaries. I found a stack, maybe dozens of them."},{"id":"174","start":1277.86,"end":1284.44,"displayStart":1277.86,"displayEnd":1284.44,"displayMid":1281.15,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":1.006333,"pitch":30.165215,"spee 是这样子的，没有聊到点子上我现在想。","sentence_en":"But at that time, talking didn't really help—I didn't know what the real pain was. We never got to the heart of it, I think now."},{"id":"179","start":1302.04,"end":1304.66,"displayStart":1302.04,"displayEnd":1304.66,"displayMid":1303.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.226517,"pitch":28.951744,"speechRate":5.725,"hasEvents":false,"sentence_source":"那个时候比如说绘画能帮助到你吗。","sentence_en":"Did painting help you back then, for example?"},{"id":"180","start":1304.66,"end":1310.2,"displayStart":1304.66,"displayEnd":1310.2,"displayMid":1307.43,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.119534,"pitch":28.560591,"speechRate":4.623,"hasEvents":false,"sentence_source":"画画也是一部分 但是因为是在学它 然后又在考大学嘛。","sentence_en":"Drawing was part of it, but since I was studying it and preparing for college exams,"},{"id":"181","start":1310.2,"end":1313.82,"displayStart":1310.2,"displayEnd":1313.82,"displayMid":1312.01,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":0.959088,"pitch":26.616146,"speechRate":5.249,"hasEvents":false,"sentence_source":"所以那个时候画画它也是学业压力的一部分。","sentence_en":"back then, drawing was also part of academic pressure."},{"id":"182","start":1313.82,"end":1324.44,"displayStart":1313.82,"displayEnd":1324.44,"displayMid":1319.13,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.980845,"pitch":25.126038,"speechRate":5.323,"hasEvents":true,"sentence_source": 48,"displayMid":1606.67,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":1.064453,"pitch":33.17197,"speechRate":5.58,"hasEvents":false,"sentence_source":"但是其实2010年我那时候开了一个店嘛。","sentence_en":"But actually, in 2010 I opened a shop."},{"id":"220","start":1608.48,"end":1610.64,"displayStart":1608.48,"displayEnd":1610.64,"displayMid":1609.56,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.7,"loudness":0.87229,"pitch":32.762657,"speechRate":7.009,"hasEvents":false,"sentence_source":"那个时候我的店已经非常非常红了。","sentence_en":"At that time, my shop was very, very popular."},{"id":"221","start":1610.64,"end":1616.16,"displayStart":1610.64,"displayEnd":1616.16,"displayMid":1613.4,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":0.90663,"pitch":24.815672,"speechRate":5.616,"hasEvents":false,"sentence_source":"我们早上10点半开门，10点以前那个已经聚了很多的人在等着排队了。","sentence_en":"We opened at 10:30 am, and before 10, many people had already gathered waiting in line."},{"id":"222","start":1616.16,"end":1620.92,"displayStart":1616.16,"displayEnd":1620.92,"displayMid":1618.54,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.5,"loudness":1.025533,"pitch":23.62149,"speechRate":6.04,"hasEvents":false,"sentence_source":"然后10点半开始排队 排到晚上11点半关门，就是一直排着队。","sentence_en":"Then from 10:30, people lined up until we closed at 11:30 pm—the line was constant."},{"id":"223","start":1620.92,"end":1636.5,"displayStart":1620.92,"displayEnd":1636.5,"displayMid":1628.71,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":0.944385,"pitch":24.751087,"speechRate":4.878,"hasEvents":false,"sentence_source":"然后到了11点 我们就要有人到那个队伍的最后面去跟他们说，不要再排了 因为马上就不卖了，这样子 你说这个不成功吗，我的店的周围就有11家卖我一模一样的东西的冰淇淋店。","sentence_en":"And at 11 pm, we'd have someone go to the end of the line and tell them, 'Don't wait anymore, we're about to stop selling.' That kind of thing. You call that not successful? There were 11 shops around me selling the exact same product—ice cream."},{"id":"224","start":1636.5,"end":1642.1,"displayStart":1636.5,"displayEnd":1642.1,"displayMid":1639.3,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":1.040492,"pitch":27.864891,"speechRate":5.498,"hasEvents":false,"sentence_source":"因为他们觉得卖这个这么好，我也来卖 你知道就是跟风就是很容易卖。","sentence_en":"Because they thought, 'If this sells so well, I'll sell it too,' you know, following the trend is easy."},{"id":"225","start":1642.1,"end":1652.7,"displayStart":1642.1,"displayEnd":1652.7,"displayMid":1647.4,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.7,"loudness":0.848453,"pitch":23.238234,"speechRate":5.283,"hasEvents":false,"sentence_source":"然后网上全都是到用我的名字的那个店 各地都是，在Google上搜的话几千万条词条，就是我的店 你说这个不成功吗 也挺成功的。","sentence_en":"And online, there were shops using my name everywhere—all over. If you search on Google, there were tens of millions of results for my shop. You call that not successful? It was pretty successful."},{"id":"226","start":1652.7,"end":1660.3,"displayStart":1652.7,"displayEnd":1660.3,"displayMid":1656.5,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.858916,"pitch":22.398146,"speechRate":5.461,"hasEvents":false,"sentence_source":"但是我那个时候非常的抑郁啊，我到13年14年的时候一度就是就握床不起了，就完全不行了。","sentence_en":"But I was very depressed at that time. By 2013 or 2014, I was bedridden—completely out of it."},{"id":"227","start":1660.92,"end":1669.68,"displayStart":1660.92,"displayEnd":1669.68,"displayMid":1665.3000000000002,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.5,"loudness":0.803916,"pitch":21.883091,"speechRate":5.047,"hasEvents":true,"sentence_source":"所以我觉得跟成功的关系不是很大，更重要的是自己的心吧，就像你说的可能有一些东西理得比较顺了。","sentence_en":"So I think it has little to do with success. It's more about your own heart, like you said—maybe some things just sort themselves out."},{"id":"228","start":1669.68,"end":1685.42,"displayStart":1669.68,"displayEnd":1685.42,"displayMid":1677.5500000000002,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":0.925151,"pitch":24.363331,"speechRate":4.374,"hasEvents":false,"sentence_source":"但是这个理顺它不是一瞬间的 它是一个过程，你今天觉得顺了 你明天发现，它其实还有很多的不顺，他还得反复 他还得从来，他没有一个魔力时刻，没有一个人物高光。","sentence_en":"But this smoothing out isn't instantaneous; it's a process. You feel it's smooth today, but tomorrow you realize there's still plenty of roughness. It requires repetition and starting over. There's no magic moment, no character highlight."},{"id":"229","start":1685.42,"end":1691.78,"displayStart":1685.42,"displayEnd":1691.78,"displayMid":1688.6,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":0.936407,"pitch":24.074312,"speechRate":4.403,"hasEvents":false,"sentence_source":"那个编剧手则里面的那种，从某个时刻开始，时来运转 一切都OK了。","sentence_en":"Like in the screenwriter's handbook, there's that moment when everything turns around and it's all okay."},{"id":"230","start":1691.78,"end":1695.22,"displayStart":1691.78,"displayEnd":1695.22,"displayMid":1693.5,"speaker":"Zhang C 3.28,"end":1756.56,"displayStart":1743.28,"displayEnd":1756.56,"displayMid":1749.92,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.5,"loudness":0.842116,"pitch":20.075874,"speechRate":4.443,"hasEvents":false,"sentence_source":"然后再多一点我就工作一点，再多一点我就再干点别的，反正就是有口气就撑一撑，没有气了就躺一躺，就这么老牛脱破车的把这个时间渡过去。","sentence_en":"With a bit more strength, I'd work a bit; with even more, I'd do something else. Basically, if I had breath, I'd push through; if not, I'd lie down. That's how I dragged myself through that time, like an old ox pulling a broken cart."},{"id":"239","start":1756.56,"end":1764.32,"displayStart":1756.56,"displayEnd":1764.32,"displayMid":1760.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.965091,"pitch":25.651361,"speechRate":6.179,"hasEvents":false,"sentence_source":"但你心里面有一个底层的声音在跟自己说，你还是会过去的，就是这么黑暗的时候还是会过去的，这个声音有吗。","sentence_en":"But deep down, was there a voice telling you that you would get through it, that even this dark time would pass?"},{"id":"240","start":1764.32,"end":1765.14,"displayStart":1764.32,"displayEnd":1765.14,"displayMid":1764.73,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.323408,"pitch":8.923859,"speechRate":2.439,"hasEvents":true,"sentence_source":"没有。","sentence_en":"No."},{"id":"241","start":1766.44,"end":1770.2,"displayStart":1766.44,"displayEnd":1770.2,"displayMid":1768.3200000000002,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.025062,"pitch":21.71426,"speechRate":4.932,"hasEvents":true,"sentence_source":"就是经常想的是这一次恐怕真的过不去了。","sentence_en":"I often thought that this time I really might not make it."},{"id":"242","start":1772.32,"end":1778.38,"displayStart":1772.32,"displayEnd":1778.38,"displayMid":1775.35,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.7,"loudness":0.965873,"pitch":24.495968,"speechRate":5.612,"hasEvents":false,"sentence_source":"我也有另外一个想法，就是如果我不动手，自己动手吧 自己干掉，我应该也死不了。","sentence_en":"I also had another thought: if I didn't take action, if I ended it myself, I probably wouldn't die anyway."},{"id":"243","start":1779.12,"end":1784.7,"displayStart":1779.12,"displayEnd":1784.7,"displayMid":1781.9099999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.782581,"pitch":21.97682,"speechRate":4.839,"hasEvents":false,"sentence_source":"那时候我就想到一些活法，就是你就当你已经死了，你看看怎么活。","sentence_en":"Back then, I thought of a way to live: just pretend you're already dead, and see how you live."},{"id":"244","start":1785.56,"end":1788.88,"displayStart":1785.56,"displayEnd":1788.88,"displayMid":1787.22,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0.1,"loudness":1.149243,"pitch":30.23654,"speechRate":5.705,"hasEvents":false,"sentence_source":"其实我刚刚描述的那种活法，就是我能起床。","sentence_en":"Actually, the way I just described living was that I could get up."},{"id":"245","start":1788.88,"end":1799.3,"displayStart":1788.88,"displayEnd":1799.3,"displayMid":1794.0900000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.6,"loudness":0.796919,"pitch":19.647587,"speechRate":4.415,"hasEvents":false,"sentence_source":"然后 core":-0.7,"loudness":1.032085,"pitch":26.088221,"speechRate":3.977,"hasEvents":false,"sentence_source":"有啊 有一段时间是非常非常的难。","sentence_en":"Yes, there was a time that was extremely hard."},{"id":"250","start":1819.32,"end":1824.86,"displayStart":1819.32,"displayEnd":1824.86,"displayMid":1822.09,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.843796,"pitch":23.666182,"speechRate":3.43,"hasEvents":false,"sentence_source":"嗯 然后那段时间我就回了趟家，我回去一路上。","sentence_en":"Mm, during that time I went back home, the whole journey there."},{"id":"251","start":1824.86,"end":1831.42,"displayStart":1824.86,"displayEnd":1831.42,"displayMid":1828.1399999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":0.928092,"pitch":24.738461,"speechRate":4.421,"hasEvents":false,"sentence_source":"因为从厦门到河北出行是很困难的，但反正就是拼尽全身的这个力气。","sentence_en":"Traveling from Xiamen to Hebei was very difficult, but I just used all the strength I had."},{"id":"252","start":1831.42,"end":1844.4,"displayStart":1831.42,"displayEnd":1844.4,"displayMid":1837.91,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.6,"loudness":1.102548,"pitch":28.393538,"speechRate":4.822,"hasEvents":false,"sentence_source":"然后在路上呢 我一样一样的吧，我的帽子啊 散啊 外套啊，反正就是零零落落的就一路就弄丢了，而且最后一站我还下错车，行李箱也还落在出租车上。","sentence_en":"Along the way, I lost things one by one—my hat, my scarf, my coat—just scattered and lost. At the last stop, I even got off at the wrong station and left my suitcase in the taxi."},{"id":"253","start":1844.4,"end":1855.36,"displayStart":1844.4,"displayEnd":1855.36,"displayMid":1849.88,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":0.92045,"pitch":21.266407,"speechRate":4.562,"hasEvents":true,"sentence_source":"而且最后快要到的时候 我打电话给他们说家在党啊，就我不记得就是地址了，就是这么之后就非常非常困难地到了他家。","sentence_en":"And when I was almost there, I called them and said I was home, but I didn't remember the address. After that, I finally made it to his place with great difficulty."},{"id":"254","start":1855.94,"end":1864.66,"displayStart":1855.94,"displayEnd":1864.66,"displayMid":1860.3000000000002,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":0.818248,"pitch":18.623646,"speechRate":4.659,"hasEvents":true,"sentence_source":"那段时间我在他那里住的时候 我就觉得我就是跟在住院一样，就是躺着 起来吃个饭，随便说几句。","sentence_en":"During that time I stayed with him, I felt like I was in the hospital—just lying down, getting up to eat, chatting a bit."},{"id":"255","start":1865.12,"end":1879.7,"displayStart":1865.12,"displayEnd":1879.7,"displayMid":1872.4099999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":0.741641,"pitch":18.253162,"speechRate":3.103,"hasEvents":false,"sentence_source":"然后我妈妈经常给我辅助啊什么的，我记得我哥有一天晚上走过来拍拍我的肩膀，他说你保住狗命无所畏惧。","sentence_en":"My mom often helped me. I remember one night my brother came over, patted my shoulder, and said, 'Just keep your dog life and fear nothing."},{"id":"256","start":1880.99,"end":1889.67,"displayStart":1880.99,"displayEnd":1889.67,"displayMid":1885.33,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.772029,"pitch":17.328218,"speechRate":4.394,"hasEvents":false,"sentence_source":"我现在在跟你视频的这个iPad上课的字还课了，他说的这几个字，保住狗命无所畏惧。","sentence_en":"The words on the iPad I'm using to video chat with you now are still there: 'Keep your dog life and fear nothing."},{"id":"257","start":1890.15,"end":1895.22,"displayStart":1890.15,"displayEnd":1895.22,"displayMid":1892.685,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.643287,"pitch":17.849735,"speechRate":4.142,"hasEvents":false,"sentence_source":"他可能在特别难的时候也自己给自己的一种对吧。","sentence_en":"He probably told himself the same thing during his own tough times, right?"},{"id":"258","start":1895.22,"end":1898.1,"displayStart":1895.22,"displayEnd":1898.1,"displayMid":1896.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Neutral","score":0.1,"loudness":0.841216,"pitch":14.523751,"speechRate":5.283,"hasEvents":false,"sentence_source":"对 这肯定是他也跟自己说过的话。","sentence_en":"Yes, that must be something he said to himself too."},{"id":"259","start":1899.36,"end":1903.66,"displayStart":1899.36,"displayEnd":1903.66,"displayMid":1901.51,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.3,"loudness":1.019608,"pitch":26.871033,"speechRate":4.738,"hasEvents":true,"sentence_source":"我没想到我们会聊这些 你看我连纸巾都没有。","sentence_en":"I didn't expect we'd talk about this—see, I don't even have a tissue."},{"id":"260","start":1905.76,"end":1907.76,"displayStart":1905.76,"displayEnd":1907.76,"displayMid":1906.76,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.013855,"pitch":35.190968,"speechRate":5.759,"h ard for me to even live, and he told me that just living is enough—that's winning."},{"id":"269","start":1947.68,"end":1950.86,"displayStart":1947.68,"displayEnd":1950.86,"displayMid":1949.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.4,"loudness":0.772304,"pitch":21.213764,"speechRate":5.245,"hasEvents":false,"sentence_source":"真的 所以我们老说 致之死地而后生。","sentence_en":"Really. That's why we often say, 'From death comes life."},{"id":"270","start":1950.86,"end":1959.65,"displayStart":1950.86,"displayEnd":1959.65,"displayMid":1955.255,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.6,"loudness":0.770911,"pitch":20.280411,"speechRate":4.096,"hasEvents":false,"sentence_source":"对 对 有人问过我这样的问题，就是你一生里面最好的时光，一个是现在，另一个真的就是。","sentence_en":"Yes, yes. Someone once asked me about the best times in my life: one is now, and the other is truly,"},{"id":"271","start":1959.65,"end":1964.15,"displayStart":1959.65,"displayEnd":1964.15,"displayMid":1961.9,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.761891,"pitch":18.47909,"speechRate":4.63,"hasEvents":false,"sentence_source":"那个时候我一天只能起床，几个小时 两三个小时。","sentence_en":"Back then, I could only get up for a few hours a day, two or three hours."},{"id":"272","start":1964.15,"end":1965.95,"displayStart":1964.15,"displayEnd":1965.95,"displayMid":1965.0500000000002,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0.1,"loudness":0.972668,"pitch":23.618118,"speechRate":7.784,"hasEvents":false,"sentence_source":"然后我画了一点画的那个时候。","sentence_en":"And that time when I did a little drawing."} o hope for myself. I cut out all external voices, and whatever was left of me, I just did that. That moment had no utility—it just was."},{"id":"277","start":1996.83,"end":1999.17,"displayStart":1996.83,"displayEnd":1999.17,"displayMid":1998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.957423,"pitch":18.084309,"speechRate":5.128,"hasEvents":false,"sentence_source":"活着 他除了活着什么都没干。","sentence_en":"Living. It did nothing but live."},{"id":"278","start":1999.59,"end":2006.81,"displayStart":1999.59,"displayEnd":2006.81,"displayMid":2003.1999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.6,"loudness":1.008247,"pitch":27.932686,"speechRate":7.028,"hasEvents":false,"sentence_source":"对 我觉得那一刻就是生命的意义，很多时候我们老说活着为了什么，有时候活着不为了什么 活着本身就是意义。","sentence_en":"Yes, I think that moment was the meaning of life. Often we ask what we live for. Sometimes we live for nothing—living itself is the meaning."},{"id":"279","start":2007.47,"end":2010.41,"displayStart":2007.47,"displayEnd":2010.41,"displayMid":2008.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.4,"loudness":0.707535,"pitch":21.351124,"speechRate":4.159,"hasEvents":false,"sentence_source":"嗯 嗯 但做到那个真的好难啊。","sentence_en":"Mm, mm, but that's really hard to achieve."},{"id":"280","start":2010.41,"end":2011.55,"displayStart":2010.41,"displayEnd":2011.55,"displayMid":2010.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":1.279258,"pitch":26.410406,"speechRate":4.706,"hasEvents":false,"sentence_source":"对 你得死。","sentence_en":"Yes, you have to die."},{"id":"281 ry concrete in my heart. You have to walk through an abyss, give up all hope, know you have nothing in this world."},{"id":"285","start":2046.39,"end":2050.03,"displayStart":2046.39,"displayEnd":2050.03,"displayMid":2048.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"New Feelings as a Creator","sentiment_en":"Negative","score":-0.6,"loudness":1.012991,"pitch":25.168562,"speechRate":5.475,"hasEvents":false,"sentence_source":"然后你连身体都不再拥有，就是那个时候。","sentence_en":"And then you don't even own your body anymore. At that moment."},{"id":"286","start":2052.02,"end":2054.64,"displayStart":2052.02,"displayEnd":2054.64,"displayMid":2053.33,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.1823,"pitch":22.727966,"speechRate":6.765,"hasEvents":false,"sentence_source":"这个我在写那本书的时候我还不敢说。","sentence_en":"I didn't dare say that when I wrote that book."},{"id":"287","start":2054.64,"end":2062.96,"displayStart":2054.64,"displayEnd":2062.96,"displayMid":2058.8,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.882423,"pitch":21.930399,"speechRate":4.072,"hasEvents":false,"sentence_source":"但是今天我又开放了一些，实际上我完全不能出门到什么程度，有一天我起床了。","sentence_en":"But now I've opened up more. Actually, I couldn't even go outside. One day I got up."},{"id":"288","start":2062.96,"end":2065.96,"displayStart":2062.96,"displayEnd":2065.96,"displayMid":2064.46,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.048616,"pitch":19.147404,"speechRate":6.557,"hasEvents":false,"sentence_source":"然后我想去吃个早饭，很久没有吃过早饭了。","sentence_en":"And I wanted to go eat breakfast—I hadn't had breakfast in a long time."},{"id":"289","start":2065.96,"end":2076.38,"displayStart":2065.96,"displayEnd":2076.38,"displayMid":2071.17,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.994885,"pitch":25.646957,"speechRate":5.253,"hasEvents":false,"sentence_source":"然后我离开我住的那个楼大概100米，就失敬了 我很害怕，整个这个世界都让我害怕，我也不知道为什么，就是这么困难吗 不明白。","sentence_en":"Then I walked about 100 meters from my building and lost my composure. I was terrified. The whole world scared me, and I didn't know why. Was it really that hard? I didn't understand."},{"id":"290","start":2076.38,"end":2080.28,"displayStart":2076.38,"displayEnd":2080.28,"displayMid":2078.33,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.4,"loudness":0.954082,"pitch":22.073374,"speechRate":5.128,"hasEvents":false,"sentence_source":"然后我就赶紧就跑回家，就赶紧去洗澡 去清理啊。","sentence_en":"So I ran back home, took a shower, cleaned myself."},{"id":"291","start":2080.28,"end":2082.14,"displayStart":2080.28,"displayEnd":2082.14,"displayMid":2081.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":1.238015,"pitch":21.216208,"speechRate":6.122,"hasEvents":false,"sentence_source":"然后洗着洗着还摔了。","sentence_en":"And while showering, I fell."},{"id":"292","start":2083.38,"end":2090.34,"displayStart":2083.38,"displayEnd":2090.34,"displayMid":2086.86,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Strongly Negative","score":-0.8,"loudness":1.08279,"pitch":22.027515,"speechRate":4.109,"hasEvents":false,"sentence_source":"摔倒在那个磁砖地板上，摔得非常的疼 起不来，就是这么一生误会的。","sentence_en":"Fell on the tile floor, hurt so badly I couldn't get up—just a complete loss of control."},{"id":"293","start":2090.34,"end":2093.72,"displayStart":2090.34,"displayEnd":2093.72,"displayMid":2092.0299999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.7,"loudness":0.886549,"pitch":18.773758,"speechRate":6.213,"hasEvents":false,"sentence_source":"然后赤身裸体地摔在那个地板上，躺了一个多小时。","sentence_en":"And there I was, naked on the floor, lying there for over an hour."},{"id":"294","start":2093.72,"end":2100.18,"displayStart":2093.72,"displayEnd":2100.18,"displayMid":2096.95,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.908628,"pitch":20.31719,"speechRate":6.239,"hasEvents":false,"sentence_source":"那个时候我真的觉得，你看我啥也没有了，我就是啥也没有了，真的很平静 不痛苦 你知道吗。","sentence_en":"At that moment, I really thought, look, I have nothing. I have nothing. And I felt truly calm, no pain, you know?"},{"id":"295","start":2100.18,"end":2104.6,"displayStart":2100.18,"displayEnd":2104.6,"displayMid":2102.39,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.905311,"pitch":23.538074,"speechRate":5.276,"hasEvents":false,"sentence_source":"那个时候真的不痛苦 就心里觉得那种就是被鸡穿了。","sentence_en":"At that moment, there really was no pain. My heart just felt like it had been pierced."},{"id":"296","start":2104.6,"end":2115.46,"displayStart":2104.6,"displayEnd":2115.46,"displayMid":2110.0299999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","se
