t_en":"Neutral","score":0,"loudness":0.979822,"pitch":24.372238,"speechRate":6.169,"hasEvents":false,"sentence_source":"但是我做的时候，我当然没有觉得我了不起了。","sentence_en":"But when I was doing it, of course I didn't feel amazing."},{"id":"320","start":2279.47,"end":2285.69,"displayStart":2279.47,"displayEnd":2285.69,"displayMid":2282.58,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0.1,"loudness":0.892459,"pitch":25.913225,"speechRate":4.019,"hasEvents":false,"sentence_source":"我觉得我还挺机智的，就一方面已经愚钝到就是义无所能了。","sentence_en":"I thought I was pretty smart—on one hand, I was too dull to do anything,"},{"id":"321","start":2285.69,"end":2292.93,"displayStart":2285.69,"displayEnd":2292.93,"displayMid":2289.31,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.4,"loudness":0.9921,"pitch":25.492962,"speechRate":4.125,"hasEvents":false,"sentence_source":"但是另一方面好像又有本事，竟然用这种办法让自己最小程度的自理。","sentence_en":"but on the other, I somehow had the skill to keep myself minimally functional with that method."},{"id":"322","start":2293.39,"end":2300.39,"displayStart":2293.39,"displayEnd":2300.39,"displayMid":2296.89,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":1.039028,"pitch":25.360291,"speechRate":4.435,"hasEvents":false,"sentence_source":"然后我还有一个办法，就是那时候就我跟我的狗吗，我睡在被子的最下面。","sentence_en":"And I had another method. At that time, it was just me and my dog. I slept under the blanket."},{"id":"323","start":2300.39,"end":2302.85,"displayStart":2300.39,"displayEnd":2302.85,"displayMid":2301.62,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.778754,"pitch":21.14538,"speechRate":4.878,"hasEvents":false,"sentence_source":"然后我的狗睡在被子的上面。","sentence_en":"My dog slept on top of the blanket."},{"id":"324","start":2302.85,"end":2316.97,"displayStart":2302.85,"displayEnd":2316.97,"displayMid":2309.91,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.5,"loudness":0.954408,"pitch":21.95459,"speechRate":4.895,"hasEvents":false,"sentence_source":"然后上面还有一层被子，就是它可以睡最顶上的被子和被子的夹层，我睡在最底下，这样子就既能保证它也能上床，也能保证我睡的地方不太脏，我的背窝里面是干净的。","sentence_en":"And there was another blanket on top, so he could sleep between the top blanket and the cover. I slept at the very bottom. That way he could be on the bed, and my sleeping area wasn't too dirty—my nest was clean."},{"id":"325","start":2317.61,"end":2330.31,"displayStart":2317.61,"displayEnd":2330.31,"displayMid":2323.96,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.94216,"pitch":23.269939,"speechRate":4.915,"hasEvents":false,"sentence_source":"然后我又需要跟狗一起睡，跟狗在床上睡觉真的极大的帮助了我，就是你知道他是一个活灵灵的小东西，他经常把他的鼻子和嘴钻到我的手心里面。","sentence_en":"And I needed to sleep with the dog. Sleeping with him in bed really helped me a lot. You know, he's a lively little creature. He'd often poke his nose and mouth into my palm."},{"id":"326","start":2330.31,"end":2331.61,"displayStart":2330.31,"displayEnd":2331.61,"displayMid":2330.96,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.6,"loudness":0.74843,"pitch":23.591845,"speechRate":7.937,"hasEvents":false,"sentence_source":"然后他在我的手上呼吸。","sentence_en":"Then he'd breathe on my hand."},{"id":"327","start":2331.61,"end":2346.25,"displayStart":2331.61,"displayEnd":2346.25,"displayMid":2338.9300000000003,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Lu Xun and Other Writers","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.965674,"pitch":21.549212,"speechRate":4.986,"hasEvents":false,"sentence_source":"然后他瞪着我，他在猜测我什么时候能起来带他出去，他在感觉我现在在干什么 我准备干什么，就是那种生机 我太需要他了，我没有办法忍受他不在床上睡，我必须要跟他在一起。","sentence_en":"And he'd stare at me, guessing when I'd get up and take him out, sensing what I was doing and planning to do. That kind of vitality—I needed him so much. I couldn't stand him not sleeping on the bed. I had to be with him."},{"id":"328","start":2346.75,"end":2348.35,"displayStart":2346.75,"displayEnd":2348.35,"displayMid":2347.55,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":1.130287,"pitch":24.760303,"speechRate":5.091,"hasEvents":true,"sentence_source":"吸他的那个阳气。","sentence_en":"Absorb his life force."},{"id":"329","start":2351.18,"end":2360.38,"displayStart":2351.18,"displayEnd":2360.38,"displayMid":2355.7799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.6,"loudness":1.030475,"pitch":24.28632,"speechRate":5.807,"hasEvents":true,"sentence_source":"然后这个也是我的另外一个字里的办法，就是因为很脏，我根本没法打扫，我不能打扫，我没有打扫，家里面很脏很脏，很大的张朗。","sentence_en":"And that was another coping method of mine. Because it was so dirty, I couldn't clean at all. I couldn't clean, I didn't clean. The house was very dirty, huge cockroaches."},{"id":"330","start":2360.38,"end":2366.36,"displayStart":2360.38,"displayEnd":2366.36,"displayMid":2363.37,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.4,"loudness":0.927719,"pitch":24.564905,"speechRate":4.227,"hasEvents":false,"sentence_source":"然后我现在我有一个好朋友，他叫Mona，他有一次去看我。","sentence_en":"Then I have a good friend named Mona. She came to see me once."},{"id":"331","start":2366.36,"end":2380.6,"displayStart":2366.36,"displayEnd":2380.6,"displayMid":2373.48,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.028325,"pitch":24.56389,"speechRate":5.305,"hasEvents":false,"sentence_source":"然后他去 我心里想，我这个张朗有点着落了，来了一个很有经历的，一个活力私社的人，我说 张朗 张朗 张朗 张朗正在从他的脚边跑过去，我说 快快快 踩踩踩，他就看着那个张朗跑过去。","sentence_en":"She came over, and I thought, 'Finally some help with these cockroaches—an experienced, energetic person.' I said, 'Cockroach! Cockroach! Cockroach!' It was running past her feet. I said, 'Quick, quick, step on it, step on it!' She watched it run away."},{"id":"332","start":2380.6,"end":2387.86,"displayStart":2380.6,"displayEnd":2387.86,"displayMid":2384.23,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":0.750137,"pitch":19.270538,"speechRate":4.132,"hasEvents":false,"sentence_source":"然后他盯着我说 为什么，他们才是地球的主人哈哈，这个事情我一直记得。","sentence_en":"Then she looked at me and said, 'Why? They're the masters of the earth.' Haha, I've never forgotten that."},{"id":"333","start":2387.86,"end":2399.44,"displayStart":2387.86,"displayEnd":2399.44,"displayMid":2393.65,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.981901,"pitch":24.951309,"speechRate":4.231,"hasEvents":false,"sentence_source":"我觉得他除了就是当时 这很好玩以外，另一方面我觉得 他也有安慰到我，就是我为我的家里 如此的脏乱不堪而愧疚嘛。","sentence_en":"I think besides it being fun at the time, it also comforted me—I felt guilty about how messy my home was."},{"id":"334","start":2399.44,"end":2408.68,"displayStart":2399.44,"displayEnd":2408.68,"displayMid":2404.06,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":1.037386,"pitch":26.717527,"speechRate":4.895,"hasEvents":true,"sentence_source":"然后我再表达说我还是希望干净一点的时刻，他表达出了那种对这个肮脏的一种很宏达的一种接纳。","sentence_en":"Then I expressed that I still prefer a cleaner moment, and he showed a kind of grand acceptance of that dirtiness."},{"id":"335","start":2409.4,"end":2413.74,"displayStart":2409.4,"displayEnd":2413.74,"displayMid":2411.5699999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":1.308294,"pitch":34.591816,"speechRate":4.398,"hasEvents":true,"sentence_source":"我觉得这个在某种意义上我好像也被原谅了。","sentence_en":"In a way, I felt forgiven."},{"id":"336","start":2415.08,"end":2430.38,"displayStart":2415.08,"displayEnd":2430.38,"displayMid":2422.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.893861,"pitch":23.158735,"speechRate":5.239,"hasEvents":true,"sentence_source":"你知道你让我想到我不久前读的一本书，是一个英国女作家叫Diana Asher，她写的一本书叫《木色将近》，她90多岁的时候一个类似于自传性的一本书，他里面有很多京剧性的表达。","sentence_en":"You know, you remind me of a book I read recently by a British female writer named Diana Asher. She wrote a book called 'The Nearness of Wood' when she was in her 90s, an autobiographical book with many striking expressions."},{"id":"337","start":2430.38,"end":2442.32,"displayStart":2430.38,"displayEnd":2442.32,"displayMid":2436.3500000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.925297,"pitch":25.243517,"speechRate":5.496,"hasEvents":false,"sentence_source":"其中有一句话当时我印象满身，他说我对男人没有什么期待，我独处的时候我才会真正的赶到完整后，来这句话我想了很多 我觉得对，就他不是光表述男人。","sentence_en":"There's one line that really stuck with me: 'I have no expectations of men; I only feel complete when I'm alone.' Later, I thought about it a lot and realized it wasn't just about men."},{"id":"338","start":2442.32,"end":2456.72,"displayStart":2442.32,"displayEnd":2456.72,"displayMid":2449.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.919145,"pitch":20.902281,"speechRate":5.208,"hasEvents":false,"sentence_source":"你可以放到很多 你可以是家人 可以是朋友，就是不要有太多的期待，的意思就是你最终还是要靠你自己，其他的其实他只能够起到紧上天花的作用，不管亲人 朋友 还是爱人 都是如此。","sentence_en":"You can apply it to many things—family, friends. Don't have too many expectations. Ultimately, you have to rely on yourself. Everyone else is just the icing on the cake, whether they're family, friends, or lovers."},{"id":"339","start":2456.72,"end":2460,"displayStart":2456.72,"displayEnd":2460,"displayMid":2458.3599999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.868764,"pitch":20.464239,"speechRate":4.878,"hasEvents":false,"sentence_source":"她是90多岁的时候说的这句话是吗。","sentence_en":"Did she say that when she was in her 90s?"},{"id":"340","start":2460,"end":2474.68,"displayStart":2460,"displayEnd":2474.68,"displayMid":2467.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":1.016659,"pitch":23.455505,"speechRate":4.967,"hasEvents":false,"sentence_source":"对 她那本书是90多岁的时候写出来的，她说她才意识到她90多岁人生开始变得如此的丰富，可以有那么多的可能性，在那本书出来之后她是101岁 110几岁去世的。","sentence_en":"Yeah, she wrote that book in her 90s. She said she only realized then that her life was becoming so rich, full of possibilities. After the book came out, she lived to 101 or 110 something when she passed away."},{"id":"341","start":2474.68,"end":2478.4,"displayStart":2474.68,"displayEnd":2478.4,"displayMid":2476.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":1.120039,"pitch":28.634684,"speechRate":5.352,"hasEvents":false,"sentence_source":"她等于又度过了将近10年的很丰富的人生。","sentence_en":"So she lived another nearly ten years of a very rich life."},{"id":"342","start":2478.4,"end":2483.76,"displayStart":2478.4,"displayEnd":2483.76,"displayMid":2481.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":1.022378,"pitch":24.555998,"speechRate":5.222,"hasEvents":false,"sentence_source":"所以她的话我很相信她是用自己的亲身实践告诉我，这是真实的。","sentence_en":"I truly believe her words came from her own experience—she showed me it's real."},{"id":"343","start":2483.76,"end":2486.24,"displayStart":2483.76,"displayEnd":2486.24,"displayMid":2485,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.888414,"pitch":22.645136,"speechRate":4.462,"hasEvents":false,"sentence_source":"太好了 我也要活到150。","sentence_en":"Great, I want to live to 150 too."},{"id":"344","start":2487.92,"end":2493.2,"displayStart":2487.92,"displayEnd":2493.2,"displayMid":2490.56,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.863097,"pitch":26.145571,"speechRate":5.268,"hasEvents":false,"sentence_source":"有几年的时间 我每天睁开眼睛，第一个念头 就是要不要今天去死。","sentence_en":"For a few years, every morning when I opened my eyes, my first thought was whether I should die today."},{"id":"345","start":2493.76,"end":2505.24,"displayStart":2493.76,"displayEnd":2505.24,"displayMid":2499.5,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.951077,"pitch":22.251291,"speechRate":5.226,"hasEvents":false,"sentence_source":"但是现在 我真的觉得，我绝对不会自己去死了 而且我要活很长，就我要尽可能地活很久，你刚刚这样说 我也觉得 好，有人已经活到100多了 对吧。","sentence_en":"But now, I really feel I will never kill myself, and I want to live a long time—as long as possible. When you said that, I thought, yeah, someone has already lived over 100, right?"},{"id":"346","start":2505.24,"end":2511.6,"displayStart":2505.24,"displayEnd":2511.6,"displayMid":2508.42,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.963275,"pitch":21.20871,"speechRate":5.263,"hasEvents":false,"sentence_source":"然后而且他觉得最后的那十年是最有趣的，我也要活很久 我决定了我要活很久。","sentence_en":"And she said the last ten years were the most interesting. I want to live a long time too. I've decided I'll live a long time."},{"id":"347","start":2512.1,"end":2520.12,"displayStart":2512.1,"displayEnd":2520.12,"displayMid":2516.1099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.5,"loudness":0.927561,"pitch":24.098715,"speechRate":5.181,"hasEvents":false,"sentence_source":"对呀 我的理解就是 我们的结局最终都是一样的，既然我们知道那个结局是怎样的 那招什么急呢。","sentence_en":"Exactly. My understanding is that we all end up the same way. Since we know the ending, why rush?"},{"id":"348","start":2520.6,"end":2531.96,"displayStart":2520.6,"displayEnd":2531.96,"displayMid":2526.2799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.992737,"pitch":25.012962,"speechRate":4.76,"hasEvents":false,"sentence_source":"你说的太对了 我的播客里面之前有一集是一些抑郁症的同伴们一起来谈论，我现在有一个体会 我觉得我在那个时候老想自杀。","sentence_en":"You're so right. In my podcast, there was an episode where some people with depression talked. I realized back then I always wanted to kill myself."},{"id":"349","start":2531.96,"end":2544.66,"displayStart":2531.96,"displayEnd":2544.66,"displayMid":2538.31,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.809173,"pitch":23.220066,"speechRate":4.567,"hasEvents":false,"sentence_source":"有可能有一个念头是我觉得我因为绝望而觉得这个人生是没有尽头的但是，我现在回想起来有一个很简单的事情，就是你不自杀也会死的。","sentence_en":"Maybe part of it was thinking life was endless because of despair. But looking back, there's a simple truth: even if you don't kill yourself, you'll die anyway."},{"id":"350","start":2546.1,"end":2548.98,"displayStart":2546.1,"displayEnd":2548.98,"displayMid":2547.54,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":1.255035,"pitch":33.913322,"speechRate":4.553,"hasEvents":false,"sentence_source":"现在说起来它有点过于简单了。","sentence_en":"It sounds too simple now."},{"id":"351","start":2548.98,"end":2562.54,"displayStart":2548.98,"displayEnd":2562.54,"displayMid":2555.76,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Positive","score":0.5,"loudness":1.043871,"pitch":26.716736,"speechRate":5.013,"hasEvents":false,"sentence_source":"但是我真的觉得这件事情是有一天，它变成一个灵感在我的心里的，我感觉得有这种抑郁的经历的人，才会真正的觉得这个话是多么的有道理，大家都觉得有道理。","sentence_en":"But I really feel that one day, it hit me like an inspiration. Only those who've experienced depression truly understand how profound that simple truth is. Everyone thinks it makes sense."},{"id":"352","start":2562.54,"end":2570.5,"displayStart":2562.54,"displayEnd":2570.5,"displayMid":2566.52,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.4,"loudness":1.025451,"pitch":26.636303,"speechRate":4.523,"hasEvents":true,"sentence_source":"但是有一类人可能会特别的觉得有道理，哦 是这样啊 是啊 就是有那种灵光一线的感觉。","sentence_en":"But some people feel it especially deeply—like a lightbulb moment."},{"id":"353","start":2571.16,"end":2573.8,"displayStart":2571.16,"displayEnd":2573.8,"displayMid":2572.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.4,"loudness":1.085643,"pitch":26.852034,"speechRate":4.167,"hasEvents":true,"sentence_source":"对 既然如此 那何必着急呢。","sentence_en":"Exactly. So why rush?"},{"id":"354","start":2574.42,"end":2580,"displayStart":2574.42,"displayEnd":2580,"displayMid":2577.21,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.872155,"pitch":21.625509,"speechRate":3.738,"hasEvents":false,"sentence_source":"我也想跟那些就是再考虑要不要早点死的人说。","sentence_en":"I also want to say to those considering an early death:"},{"id":"355","start":2580.68,"end":2596.42,"displayStart":2580.68,"displayEnd":2596.42,"displayMid":2588.55,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.6,"loudness":0.783837,"pitch":20.639223,"speechRate":4.257,"hasEvents":false,"sentence_source":"我觉得再忍一忍 再活一活，如果你活得太难了 你可以先就瞎活一活，你就当死了一样的活，你只要不做什么 你就不会死 你就会活着，你就这样子自然的胡乱的瞎火。","sentence_en":"I think just endure a little longer, live a little longer. If living is too hard, you can just muddle through for now. Live as if you were dead. As long as you don't do anything, you won't die; you'll live. Just live naturally, randomly, and aimlessly."},{"id":"356","start":2596.42,"end":2601.16,"displayStart":2596.42,"displayEnd":2601.16,"displayMid":2598.79,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.6,"loudness":0.808677,"pitch":20.279295,"speechRate":5.257,"hasEvents":false,"sentence_source":"活到有一天有可能，你会觉得人生还是值得一过的。","sentence_en":"Someday, you might find life is worth living."},{"id":"357","start":2601.68,"end":2617.34,"displayStart":2601.68,"displayEnd":2617.34,"displayMid":2609.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.902123,"pitch":23.60091,"speechRate":4.311,"hasEvents":false,"sentence_source":"所以我现在明白你有一次表达，你说你对于那种金句式的一些，金句是充满了警惕或者是反对的，就如做更好的自己，女性要向前一步，就这种鼓励式的鸡汤式的话。","sentence_en":"So now I understand something you once said—you're wary or opposed to those quote-like sayings, like 'be a better version of yourself' or 'women, lean in'—that kind of inspirational, chicken-soup stuff."},{"id":"358","start":2617.34,"end":2619.72,"displayStart":2617.34,"displayEnd":2619.72,"displayMid":2618.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.5,"loudness":0.972787,"pitch":22.590189,"speechRate":5.702,"hasEvents":false,"sentence_source":"你内心是充满了警惕和反感的。","sentence_en":"You're deeply wary and even repulsed by them."},{"id":"359","start":2619.72,"end":2635.32,"displayStart":2619.72,"displayEnd":2635.32,"displayMid":2627.52,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.917006,"pitch":23.695232,"speechRate":4.928,"hasEvents":false,"sentence_source":"对 因为这些东西一度他们都是我的压力，它甚至是我的闭手 就是刺向我的闭手，就是这些东西它一直折磨我，它一直让我觉得我活得不对 我生活错了，全都错了 我这个存在就是错的。","sentence_en":"Yeah, because those things were once a source of pressure for me. They were like weapons pointed at me. They tormented me, making me feel that I was living wrong, that everything I did was wrong—my very existence was wrong."},{"id":"360","start":2635.32,"end":2642.06,"displayStart":2635.32,"displayEnd":2642.06,"displayMid":2638.69,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.7,"loudness":0.900543,"pitch":22.896242,"speechRate":4.744,"hasEvents":false,"sentence_source":"而那个时候我没有自我 我就是得听所有的人，去让所有的外界的声音满意。","sentence_en":"Back then, I had no sense of self. I just had to listen to everyone, satisfy all external voices."},{"id":"361","start":2642.06,"end":2645.7,"displayStart":2642.06,"displayEnd":2645.7,"displayMid":2643.88,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.934495,"pitch":22.231108,"speechRate":4.923,"hasEvents":false,"sentence_source":"然后我满足这一切我就会想消灭自己。","sentence_en":"Trying to fulfill all that made me want to destroy myself."},{"id":"362","start":2645.7,"end":2653.26,"displayStart":2645.7,"displayEnd":2653.26,"displayMid":2649.48,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.907703,"pitch":20.669947,"speechRate":4.701,"hasEvents":false,"sentence_source":"因为我满足不了，而且我不知道如何去实现，好 那如果这个世界没有错 那就是我错了。","sentence_en":"Because I couldn't meet those standards, and I 3513.76,"displayEnd":3521.1,"displayMid":3517.4300000000003,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.5,"loudness":0.89202,"pitch":21.745707,"speechRate":4.799,"hasEvents":false,"sentence_source":"然后我为什么要一直抽呢，就是因为这些正确的选项让我感受到我不能自我选择。","sentence_en":"And why did I keep smoking? Because those 'correct' choices made me feel I couldn't choose for myself."},{"id":"480","start":3521.1,"end":3524.82,"displayStart":3521.1,"displayEnd":3524.82,"displayMid":3522.96,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.4,"loudness":1.029764,"pitch":28.012011,"speechRate":4.905,"hasEvents":false,"sentence_source":"那如果那个正确的选项已经被别人污染了。","sentence_en":"If that correct option has been tainted by others."},{"id":"481","start":3524.82,"end":3529.88,"displayStart":3524.82,"displayEnd":3529.88,"displayMid":3527.3500000000004,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.6,"loudness":0.985348,"pitch":22.830276,"speechRate":5.72,"hasEvents":false,"sentence_source":"那我就得选那个错的，只有选这个错的选项才能证明这是我选的。","sentence_en":"Then I'd have to choose the wrong one. Only by picking the wrong option could I prove it was my own choice."},{"id":"482","start":3529.88,"end":3538.68,"displayStart":3529.88,"displayEnd":3538.68,"displayMid":3534.2799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.7,"loudness":0.913579,"pitch":25.073349,"speechRate":5.463,"hasEvents":false,"sentence_source":"所以我就一直抽，而有一天我突然意识到就是已经没有人能够让我戒烟了，就是这个声音已经不再能左右我了。","sentence_en":"So I kept smoking, until one day I realized no one could make me quit anymore—that voice no longer controlled me."},{"id":"483","start":3538.68,"end":3543.66,"displayStart":3538.68,"displayEnd":3543.66,"displayMid":3541.17,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.812579,"pitch":23.183908,"speechRate":5.28,"hasEvents":false,"sentence_source":"然后那个时刻我才真正的第一次去思考我到底想不想抽烟。","sentence_en":"That was the first time I truly thought about whether I actually wanted to smoke."},{"id":"484","start":3543.66,"end":3545.9,"displayStart":3543.66,"displayEnd":3545.9,"displayMid":3544.7799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.5,"loudness":0.852166,"pitch":23.443726,"speechRate":5.804,"hasEvents":false,"sentence_source":"然后那一刻我突然想我不想抽。","sentence_en":"And at that moment, I suddenly thought, I don't want to."},{"id":"485","start":3545.9,"end":3548.2,"displayStart":3545.9,"displayEnd":3548.2,"displayMid":3547.05,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.7,"loudness":1.032411,"pitch":27.621099,"speechRate":5.641,"hasEvents":false,"sentence_source":"因为抽烟真的很难受 很臭。","sentence_en":"Because smoking is really unpleasant and stinky."},{"id":"486","start":3548.2,"end":3550.66,"displayStart":3548.2,"displayEnd":3550.66,"displayMid":3549.43,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.8,"loudness":1.106708,"pitch":25.462336,"speechRate":5.285,"hasEvents":false,"sentence_source":"然后仿的很痛 各种各样的难受。","sentence_en":"It hurts and causes all kinds of discomfort."},{"id":"487","start":3550.66,"end":3558.04,"displayStart":3550.66,"displayEnd":3558.04,"displayMid":3554.35,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.6,"loudness":0.771974,"pitch":21.313349,"speechRate":5.186,"hasEvents":false,"sentence_source":"然后突然我就不抽了 灵痛苦，就像走路停下来一样就停掉了，我现在想自我就是自我选择。","sentence_en":"Then I just stopped, painlessly, like stopping while walking. Now I think selfhood is about self-choice."},{"id":"488","start":3558.04,"end":3574.02,"displayStart":3558.04,"displayEnd":3574.02,"displayMid":3566.0299999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.7,"loudness":0.883666,"pitch":24.086798,"speechRate":4.67,"hasEvents":false,"sentence_source":"但是这个世界上所有的选择，比如说你要健康 你要快乐 上进，这些选择全都被污染了，我为了进行自我选择，我就没法去选被污染的那个好的选择引号，我就只能去选那个坏的选择。","sentence_en":"But all the choices in this world, like you want to be healthy, happy, ambitious—these choices are all contaminated. In order to make my own choices, I can't choose the contaminated good choices, so I have to choose the bad ones."},{"id":"489","start":3574.02,"end":3575.66,"displayStart":3574.02,"displayEnd":3575.66,"displayMid":3574.84,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.638175,"pitch":22.30201,"speechRate":4.878,"hasEvents":false,"sentence_source":"这样才能证明是我。","sentence_en":"That's how I prove it's me."},{"id":"490","start":3576.08,"end":3579.52,"displayStart":3576.08,"displayEnd":3579.52,"displayMid":3577.8,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0.1,"loudness":0.884819,"pitch":26.916744,"speechRate":4.931,"hasEvents":false,"sentence_source":"然后作为我 我才能够去证明我的存在。","sentence_en":"And as myself, I can then prove my existence."},{"id":"491","start":3579.52,"end":3593.5,"displayStart":3579.52,"displayEnd":3593.5,"displayMid":3586.51,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":1.003997,"pitch":23.894707,"speechRate":5.007,"hasEvents":false,"sentence_source":"我觉得有很多的人的意欲或者是所谓的坏习惯，比如说什么拖延啊 不上进啊，什么懒啊 是这样子的出发，就是因为好的选择是这个世界的指使，你就把它想象成一个权威。","sentence_en":"I think many people's impulses or so-called bad habits—like procrastination, lack of motivation, laziness—stem from this. Because the 'good' choices are dictated by the world. Imagine it as an authority."},{"id":"492","start":3593.5,"end":3598.24,"displayStart":3593.5,"displayEnd":3598.24,"displayMid":3595.87,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.5,"loudness":0.829144,"pitch":22.450502,"speechRate":5.297,"hasEvents":false,"sentence_source":"然后这个权威无处不在，老有一个人他指挥你说你得选这个。","sentence_en":"And this authority is everywhere, always telling you that you must choose this."},{"id":"493","start":3598.24,"end":3604.58,"displayStart":3598.24,"displayEnd":3604.58,"displayMid":3601.41,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.896869,"pitch":25.387682,"speechRate":5.34,"hasEvents":false,"sentence_source":"然后你为了不听别人的 你为了自我选择，你就选那些这些选项以外的那个选择。","sentence_en":"Then, to avoid listening to others and to make your own choice, you pick the option outside of those options."},{"id":"494","start":3604.58,"end":3611.32,"displayStart":3604.58,"displayEnd":3611.32,"displayMid":3607.95,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.6,"loudness":0.747872,"pitch":17.529062,"speechRate":4.748,"hasEvents":false,"sentence_source":"那通常都是那个所谓的不好的选择，就是那些都是极好极好的，可我偏要吃屎。","sentence_en":"That is usually the so-called bad choice—those are all extremely good, but I insist on eating shit."},{"id":"495","start":3611.32,"end":3613.62,"displayStart":3611.32,"displayEnd":3613.62,"displayMid":3612.4700000000003,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":1.009462,"pitch":21.07439,"speechRate":6.17,"hasEvents":false,"sentence_source":"因为只有这个选项是我选的。","sentence_en":"Because this is the only option I chose."},{"id":"496","start":3613.62,"end":3618.06,"displayStart":3613.62,"displayEnd":3618.06,"displayMid":3615.84,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.836663,"pitch":20.267939,"speechRate":4.623,"hasEvents":false,"sentence_source":"对，我有时候也是非常警惕为别人所裹挟着走。","sentence_en":"Yes, I am also very cautious about being swept along by others."},{"id":"497","start":3618.06,"end":3619.86,"displayStart":3618.06,"displayEnd":3619.86,"displayMid":3618.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.5,"loudness":1.206568,"pitch":26.472338,"speechRate":6.515,"hasEvents":false,"sentence_source":"我倒是要自己试一试看。","sentence_en":"I want to try it myself."},{"id":"498","start":3619.86,"end":3624.68,"displayStart":3619.86,"displayEnd":3624.68,"displayMid":3622.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.7,"loudness":0.927077,"pitch":20.309935,"speechRate":5.308,"hasEvents":false,"sentence_source":"因为自己的尝试是最重要的，个体的感受真的是无可替代的。","sentence_en":"Because one's own attempt is the most important; personal feelings are truly irreplaceable."},{"id":"499","start":3624.68,"end":3638.94,"displayStart":3624.68,"displayEnd":3638.94,"displayMid":3631.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.880441,"pitch":25.410912,"speechRate":4.798,"hasEvents":false,"sentence_source":"所以我很好奇在你做心理咨询的过程当中，跟你来访者这样的一种聊天，被他们做咨询对你来说是，也会造成某种工作的压力，还是也会成为你自我疗愈的一部分。","sentence_en":"So I'm curious: during your psychotherapy sessions, when you talk with your clients, does being their counselor create work pressure for you, or does it also become part of your own self-healing?"},{"id":"500","start":3638.94,"end":3645.6,"displayStart":3638.94,"displayEnd":3645.6,"displayMid":3642.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.6,"loudness":0.936838,"pitch":27.717606,"speechRate":5.492,"hasEvents":false,"sentence_source":"好像在这样的互相的清谈过程当中，你能够帮助到别人，某种程度也会反过来帮助到你。","sentence_en":"It seems that in this mutual, free-flowing conversation, you can help others, and to some extent, it also helps you in return."},{"id":"501","start":3645.6,"end":3655.2,"displayStart":3645.6,"displayEnd":3655.2,"displayMid":3650.3999999999996,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.888322,"pitch":26.007507,"speechRate":4.918,"hasEvents":false,"sentence_source":"我觉得工作对我有帮助，首先它是我的生计，你说在这个过程里面，我是否会获得工作的报酬之外的这种帮助。","sentence_en":"I think work helps me. First, it's my livelihood. You ask whether I also gain help beyond the monetary compensation in this process."},{"id":"502","start":3655.2,"end":3667.76,"displayStart":3655.2,"displayEnd":3667.76,"displayMid":3661.48,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0.1,"loudness":0.899859,"pitch":22.343504,"speechRate":5.653,"hasEvents":false,"sentence_source":"我觉得这个是它是一个呼应吧，就是我想过的那些事情它不只是我想的，别人也在想，如果我要写一本关于咨询有关的时候，我可能会用这个故事开头，就是我七八岁的时候。","sentence_en":"I think it's a kind of resonance—the things I've thought about aren't just mine; others think about them too. If I were to write a book about counseling, I might start with this story: when I was seven or eight years old."},{"id":"503","start":3667.76,"end":3670.34,"displayStart":3667.76,"displayEnd":3670.34,"displayMid":3669.05,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.968163,"pitch":26.055807,"speechRate":4.651,"hasEvents":false,"sentence_source":"我在回家的路上有一个上坡。","sentence_en":"On my way home, there was an uphill slope."},{"id":"504","start":3670.34,"end":3678.68,"displayStart":3670.34,"displayEnd":3678.68,"displayMid":3674.51,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.847852,"pitch":25.072325,"speechRate":5.036,"hasEvents":false,"sentence_source":"那个上坡的右边是一个井，井旁边是一棵无铜树，我走着走着 我抬头在那个无团树的顶上看到了月亮。","sentence_en":"To the right of the slope was a well, and next to the well was a Wutong tree. As I walked, I looked up and saw the moon on top of that tree."},{"id":"505","start":3678.68,"end":3687.04,"displayStart":3678.68,"displayEnd":3687.04,"displayMid":3682.8599999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.914034,"pitch":26.002518,"speechRate":5.849,"hasEvents":false,"sentence_source":"然后那个月亮是一个早盆那么大的月亮，很多年以后我可能问了一些人，我说 你有没有见过早盆那么大的月亮。","sentence_en":"That moon was as big as a bathtub. Many years later, I asked some people, 'Have you ever seen a moon as big as a bathtub?"},{"id":"506","start":3687.04,"end":3701.92,"displayStart":3687.04,"displayEnd":3701.92,"displayMid":3694.48,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.961913,"pitch":25.904892,"speechRate":4.533,"hasEvents":false,"sentence_source":"然后人们都说没有啊，最多就是脸盆那么大，还有一次 就是我那时候开的那个店，有一年 有一帮就是天文爱好者或者是从业者，他们要观测一个日环时还是日全时。","sentence_en":"And they all said no, at most as big as a washbasin. Another time, when I was running a shop, a group of astronomy enthusiasts or professionals came to observe an annular or total solar eclipse."},{"id":"507","start":3701.92,"end":3708.08,"displayStart":3701.92,"displayEnd":3708.08,"displayMid":3705,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.843327,"pitch":26.781441,"speechRate":5.059,"hasEvents":false,"sentence_source":"然后我当时 我就问他们 我说 有没有某一年的某一天 有一个巨大的月亮。","sentence_en":"So I asked them, 'Was there a day in some year when there was a huge moon?"},{"id":"508","start":3708.08,"end":3718.8,"displayStart":3708.08,"displayEnd":3718.8,"displayMid":3713.44,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.909783,"pitch":25.994875,"speechRate":5.784,"hasEvents":false,"sentence_source":"然后他们说没有 你看这件事情 他一方面 他在我的记忆里面 他是真实的，但另一方面呢 我又一直没有验证 他是不是一个小孩做的梦 或者是一个幻想。","sentence_en":"They said no. You see, on one hand, this event is real in my memory; on the other hand, I have never verified whether it was a child's dream or a fantasy."},{"id":"509","start":3718.8,"end":3732.1,"displayStart":3718.8,"displayEnd":3732.1,"displayMid":3725.45,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.835088,"pitch":21.973875,"speechRate":5.46,"hasEvents":false,"sentence_source":"而且他在我的记忆里面 他忽大忽小 他有的时候真的变成脸盆那么大，有的时候变成就是澡盆那么大 我很肯定 他就是很大 就挂在那，他在我的记忆里面那个画面也变了。","sentence_en":"Moreover, in my memory, it keeps changing size—sometimes it really becomes as big as a washbasin, sometimes as big as a bathtub. I'm sure it was huge, just hanging there. The image in my memory has also changed."},{"id":"510","start":3732.1,"end":3744.7,"displayStart":3732.1,"displayEnd":3744.7,"displayMid":3738.3999999999996,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.978153,"pitch":25.273743,"speechRate":5.377,"hasEvents":false,"sentence_source":"但是有一天有一个我在网上提到这样的一件事情，就是我写博客的那个时候，我的博客的读者不超过50个，而且我每一个都认识，我认识的意思就是他们老来。","sentence_en":"But one day, I mentioned this online when I was writing a blog. My blog had fewer than 50 readers, and I knew each one—by 'knew' I mean they visited often."},{"id":"511","start":3744.7,"end":3747.64,"displayStart":3744.7,"displayEnd":3747.64,"displayMid":3746.17,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":1.063602,"pitch":25.584116,"speechRate":5.102,"hasEvents":false,"sentence_source":"然后有一个人留言说 没错我也见过。","sentence_en":"Then someone commented, 'That's right, I've seen it too."},{"id":"512","start":3747.64,"end":3754.08,"displayStart":3747.64,"displayEnd":3754.08,"displayMid":3750.8599999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.5,"loudness":0.881786,"pitch":22.905687,"speechRate":5.099,"hasEvents":false,"sentence_source":"然后那一刻我的记忆也他好像就固定了，就是早盆那么大 不是脸盆那么大。","sentence_en":"At that moment, my memory seemed to fixate: it was as big as a bathtub, not a washbasin."},{"id":"513","start":3754.08,"end":3766.72,"displayStart":3754.08,"displayEnd":3766.72,"displayMid":3760.3999999999996,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.951678,"pitch":26.14369,"speechRate":5.357,"hasEvents":false,"sentence_source":"我觉得在咨询里面有的时候，他们在谈的就是那个月亮，比如说 我觉得 我的妈妈 我的爸爸好像不喜欢我，我感觉 我的家里人不爱我，我说 有可能他们就是不爱你。","sentence_en":"I think sometimes in counseling, they are talking about that moon. For example, if someone says, 'I feel like my mom and dad don't like me; I feel my family doesn't love me,' I might say, 'It's possible they really don't love you."},{"id":"514","start":3766.72,"end":3774.1,"displayStart":3766.72,"displayEnd":3774.1,"displayMid":3770.41,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.86407,"pitch":21.891453,"speechRate":5.445,"hasEvents":false,"sentence_source":"他说 我认为他们不爱我 这是我的心理问题，我说 这有可能不是你的心理问题 这是个现实。","sentence_en":"They say, 'I think they don't love me—that's my psychological problem.' I say, 'This might not be your psychological problem; it's reality."},{"id":"515","start":3774.6,"end":3789.7,"displayStart":3774.6,"displayEnd":3789.7,"displayMid":3782.1499999999996,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Positive","score":0.6,"loudness":0.904644,"pitch":23.952618,"speechRate":5.034,"hasEvents":false,"sentence_source":"然后 我觉得这种时刻 这种呼应，有的时候 人们就是要这个呼应 他就是要一个确认，一个来自于 不是我的内心 我的声音，我的记忆的一个声音的确认，你说这个对我有帮助吗 我觉得有。","sentence_en":"And I think that moment, that resonance—sometimes people just need that resonance, a confirmation, a confirmation that comes not from my own inner voice or memory, but from another person. Does that help me? I think it does."},{"id":"516","start":3789.7,"end":3798.16,"displayStart":3789.7,"displayEnd":3798.16,"displayMid":3793.93,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.900441,"pitch":25.914612,"speechRate":5.437,"hasEvents":false,"sentence_source":"因为我也有这样的月亮，比如说我作为一个女人，我老是觉得我的生活不对劲，这件事情我在和大家的交谈里面。","sentence_en":"Because I also have such a moon. For instance, as a woman, I often feel that my life is not right. In my conversations with others..."},{"id":"517","start":3798.16,"end":3803.28,"displayStart":3798.16,"displayEnd":3803.28,"displayMid":3800.7200000000003,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":0.894705,"pitch":25.06604,"speechRate":5.078,"hasEvents":false,"sentence_source":"我觉得慢慢的这种声音越来越清晰，就是我难看我也挺难过的。","sentence_en":"I feel that gradually this voice becomes clearer: I am sad that I am ugly."},{"id":"518","start":3803.28,"end":3811.48,"displayStart":3803.28,"displayEnd":3811.48,"displayMid":3807.38,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.6,"loudness":0.94376,"pitch":25.741261,"speechRate":5.746,"hasEvents":false,"sentence_source":"但是我要努力地去变得好看也挺难过的，或者我本来就长得好看也还是很难过，这是怎么回事 这种不对劲是什么。","sentence_en":"But it's also sad to work hard to become good-looking. Or even if I'm naturally good-looking, I still feel sad. What is this? What is this wrongness?"},{"id":"519","start":3811.48,"end":3815.22,"displayStart":3811.48,"displayEnd":3815.22,"displayMid":3813.35,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Ne 他说 亲爱的 相信我，你爸爸就是不爱你，哈哈哈很吓人，他太残忍了。","sentence_en":"I seem to never have the courage to say, 'Darling, trust me, your father just doesn't love you.' Haha, that's scary, too cruel."},{"id":"523","start":3854.1,"end":3861.04,"displayStart":3854.1,"displayEnd":3861.04,"displayMid":3857.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Positive","score":0.5,"loudness":0.993779,"pitch":25.156034,"speechRate":6.118,"hasEvents":true,"sentence_source":"但是在心理咨询的过程当中，你需要这样去直面他，去直击他的脆弱是吗 有的时候，这才是最好的治愈。","sentence_en":"But in psychotherapy, you need to face him like that, to hit his vulnerability, right? Sometimes, that's the best healing."},{"id":"524","start":3861.04,"end":3862.58,"displayStart":3861.04,"displayEnd":3862.58,"displayMid":3861.81,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":1.206493,"pitch":29.609953,"speechRate":6.178,"hasEvents":false,"sentence_source":"有些时候是这样的。","sentence_en":"Sometimes it is."},{"id":"525","start":3862.58,"end":3867.46,"displayStart":3862.58,"displayEnd":3867.46,"displayMid":3865.02,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.6,"loudness":0.965919,"pitch":23.386971,"speechRate":4.964,"hasEvents":false,"sentence_source":"因为他的痛苦就来自于我的感觉被否认，他否认你的感受。","sentence_en":"Because his pain comes from his feelings being denied—others deny his feelings."},{"id":"526","start":3867.46,"end":3870.66,"displayStart":3867.46,"displayEnd":3870.66,"displayMid":3869.06,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.998028,"pitch":25.592278,"speechRate":4.063,"hasEvents":false,"sentence_source":"但是当你的感受被否认了以后。","sentence_en":"But after your feelings are denied,"},{"id":"527","start":3870.66,"end":3875.04,"displayStart":3870.66,"displayEnd":3875.04,"displayMid":3872.85,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.5,"loudness":0.945379,"pitch":26.422503,"speechRate":5.936,"hasEvents":false,"sentence_source":"那你还能相信什么呢，比如说他说我为什么觉得我爸爸不爱我。","sentence_en":"What can you still believe? For example, he says, 'Why do I feel my father doesn't love me?"},{"id":"528","start":3875.04,"end":3882.42,"displayStart":3875.04,"displayEnd":3882.42,"displayMid":3878.73,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.875071,"pitch":23.749191,"speechRate":5.691,"hasEvents":false,"sentence_source":"因为他有一次他把我往死里打，他还拿刀出来说，我希望你从这个家里滚出去，我永远都不要再见到你。","sentence_en":"Because once he beat me nearly to death, and he took out a knife and said, 'I want you out of this house; I never want to see you again."},{"id":"529","start":3882.42,"end":3888.14,"displayStart":3882.42,"displayEnd":3888.14,"displayMid":3885.2799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.6,"loudness":1.051781,"pitch":24.734835,"speechRate":5.984,"hasEvents":false,"sentence_source":"那在这种情况下，如果所有的人都告诉他说，你爸爸是爱你的，他只是表达的不对。","sentence_en":"In that situation, if everyone tells him, 'Your father loves you; he just expresses it wrongly,"},{"id":"530","start":3888.14,"end":3891.32,"displayStart":3888.14,"displayEnd":3891.32,"displayMid":3889.73,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.717056,"pitch":21.649475,"  these things, he says, 'I feel my family doesn't love me,' and I say, 'How do you feel that?"},{"id":"535","start":3907.66,"end":3915.28,"displayStart":3907.66,"displayEnd":3915.28,"displayMid":3911.4700000000003,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.6,"loudness":0.928353,"pitch":24.599503,"speechRate":4.987,"hasEvents":false,"sentence_source":"我们可能会聊一聊 展开一些，他就会说些 我说，如果这个就叫爱 那爱就是错的，爱就等于伤害。","sentence_en":"We might chat and expand on it, and he might say something. I say, 'If this is called love, then love is wrong, love equals harm."},{"id":"536","start":3915.28,"end":3917.38,"displayStart":3915.28,"displayEnd":3917.38,"displayMid":3916.33,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":1.189898,"pitch":30.351803,"speechRate":5.839,"hasEvents":false,"sentence_source":"我们就不要说他有没有爱你。","sentence_en":"Let's not talk about whether he loves you."},{"id":"537","start":3917.38,"end":3920.88,"displayStart":3917.38,"displayEnd":3920.88,"displayMid":3919.13,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.797877,"pitch":19.5982,"speechRate":5.848,"hasEvents":false,"sentence_source":"我们只谈他有没有伤害你，这是不是就很简单了。","sentence_en":"Let's just talk about whether he harmed you. Isn't that simpler?"},{"id":"538","start":3920.88,"end":3922.8,"displayStart":3920.88,"displayEnd":3922.8,"displayMid":3921.84,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":1.079693,"pitch":22.743961,"speechRate":6.377,"hasEvents":false,"sentence_source":"我们也不谈他是不是爱你。","sentence_en":"We don't talk about whether he loves you."},{"id":"539","start":3922.8,"end":3924.88,"displayStart":3922.8,"displayEnd":3924.88,"displayMid":3923.84,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.793403,"pitch":19.564486,"speechRate":6.015,"hasEvents":false,"sentence_source":"我们只谈他是不是伤害了你。","sentence_en":"We only talk about whether he harmed you."},{"id":"540","start":3924.88,"end":3931.74,"displayStart":3924.88,"displayEnd":3931.74,"displayMid":3928.31,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Negative","score":-0.5,"loudness":0.980319,"pitch":25.489799,"speechRate":5.659,"hasEvents":false,"sentence_source":"然后又会有另外一种纠结，他之所以这样对我是因为，他也没有被善待，我还能怪他吗 他不会。","sentence_en":"Then there is another dilemma: the reason he treated me like this is because he himself was not treated well. Can I still blame him? No."},{"id":"541","start":3931.74,"end":3946.44,"displayStart":3931.74,"displayEnd":3946.44,"displayMid":3939.09,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.956635,"pitch":25.221148,"speechRate":4.286,"hasEvents":false,"sentence_source":"但是我们在工作里面就要去澄清这个部分就是，无论他是因为他人很恶劣，还是因为他不喜欢你，还是因为他自己也有创伤等等等等，不管他是什么书图。","sentence_en":"But in our work, we need to clarify this part: no matter whether it's because he is a bad person, or because he doesn't like you, or because he has his own trauma, and so on—whatever the reasons."},{"id":"542","start":3946.44,"end":3961.12,"displayStart":3946.44,"displayEnd":3961.12,"displayMid":3953.7799999999997,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Negative emotions and solutions","sentiment_en":"Neutral","score":0,"loudness":0.864402,"pitch":20.130869,"speechRate":4.36,"h ":"When choosing my next job, I pick one I like relatively at that moment, or if I find something I like more, I’ll switch."},{"id":"573","start":4177.68,"end":4188.5,"displayStart":4177.68,"displayEnd":4188.5,"displayMid":4183.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.4,"loudness":0.967682,"pitch":27.083578,"speechRate":5.812,"hasEvents":false,"sentence_source":"所以那我现在有一些明白 在我看来我会觉得 这个人同时做了那么多的事情，但对你来说 只在人生不同阶段 你其实是专注的做了唯一的一件事情。","sentence_en":"So now I understand a bit—in my view, it seems like this person did so many things at once. But for you, it’s just that in different stages of life, you were focused on one thing."},{"id":"574","start":4189.02,"end":4201.48,"displayStart":4189.02,"displayEnd":4201.48,"displayMid":4195.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.87336,"pitch":23.377392,"speechRate":5.274,"hasEvents":false,"sentence_source":"那如今在你的生活当中 对你来说排序最重要的是什么，比如说工作 家庭 你的兴趣 爱好 朋友，就所有这一切生活的组成部分 哪些是排在最重要的位置的。","sentence_en":"So today, in your life, what’s the most important priority? Like work, family, your interests, hobbies, friends—all the components of life—which are the most important?"},{"id":"575","start":4201.48,"end":4215.78,"displayStart":4201.48,"displayEnd":4215.78,"displayMid":4208.629999999999,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":1.024746,"pitch":26.153622,"speechRate":4.181,"hasEvents":false,"sentence_source":"我觉得最重要的是谋生，就是我要保证一个能够谋生的工作时间强度，这个是我所有的时间安排里的第一项优先，第二优先的就是画画。","sentence_en":"I think the most important is making a living. I need to ensure a work schedule that sustains me—that’s my top priority in time management. Second priority is painting."},{"id":"576","start":4215.78,"end":4227.52,"displayStart":4215.78,"displayEnd":4227.52,"displayMid":4221.65,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.4,"loudness":0.847398,"pitch":21.701729,"speechRate":4.259,"hasEvents":false,"sentence_source":"然后第三就是我的朋友 家人，我仅有的这些我非常尊重的这种人际关系，如果还有余力的话就为社会为世界做一些思考。","sentence_en":"Then third is my friends and family, these few relationships I deeply respect. If there’s energy left, I think a bit for society or the world."},{"id":"577","start":4229.32,"end":4236.36,"displayStart":4229.32,"displayEnd":4236.36,"displayMid":4232.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Positive","score":0.5,"loudness":0.917732,"pitch":26.297867,"speechRate":5.216,"hasEvents":true,"sentence_source":"你刚刚一直提到谋生和生计，但在我看来好像你从来都没有为钱发酵过，你不会恐惧。","sentence_en":"You keep mentioning making a living, but to me, you’ve never seemed anxious about money. You don’t fear it."},{"id":"578","start":4236.36,"end":4242.7,"displayStart":4236.36,"displayEnd":4242.7,"displayMid":4239.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.821479,"pitch":19.482656,"speechRate":5.705,"hasEvents":false,"sentence_source":"那你是从什么时候开始就已经完成了基本的谋生，从什么时候开始就是自己养活自己。","sentence_en":"So when did you basically become financially independent? When did you start supporting yourself?"},{"id":"579","start":4242.7,"end":4254.06,"displayStart":4242.7,"displayEnd":4254.06,"displayMid":4248.38,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.905214,"pitch":24.091293,"speechRate":5.109,"hasEvents":false,"sentence_source":"这个从我开始有一份稳定的工作的时候，我就觉得我可以安身立命了，很多人没有安全感，也不是他不能养活自己，他明明正在养活自己。","sentence_en":"From the moment I got a stable job, I felt I could support myself. Many people lack security, even though they’re clearly supporting themselves."},{"id":"580","start":4254.06,"end":4259.08,"displayStart":4254.06,"displayEnd":4259.08,"displayMid":4256.57,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.3,"loudness":0.813886,"pitch":22.273466,"speechRate":5.16,"hasEvents":false,"sentence_source":"但是他就是随时随地觉得 我可能要饿死 我将来可能会饿死。","sentence_en":"But they always feel like they might starve—in the future."},{"id":"581","start":4259.08,"end":4273.18,"displayStart":4259.08,"displayEnd":4273.18,"displayMid":4266.13,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.4,"loudness":0.946719,"pitch":24.859568,"speechRate":4.993,"hasEvents":false,"sentence_source":"但是这件事情我好像是好一些，就我有第一份工作我就觉得 不管干什么 总是能谋生的，甚至我还认真的去钻研了一下 如果在厦门 然后怎么要饭能活着，能够生存下去。","sentence_en":"I seem to be better at this. Once I had my first job, I thought no matter what, I could always earn a living. I even seriously researched how to beg for food in Xiamen to survive."},{"id":"582","start":4273.18,"end":4276.8,"displayStart":4273.18,"displayEnd":4276.8,"displayMid":4274.99,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":0.926947,"pitch":28.932327,"speechRate":5.846,"hasEvents":false,"sentence_source":"连这个我都想好了 我真的觉得我一定能活着。","sentence_en":"I figured that out too—I truly believed I could make it."},{"id":"583","start":4276.8,"end":4290.12,"displayStart":4276.8,"displayEnd":4290.12,"displayMid":4283.46,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":1.010767,"pitch":28.777004,"speechRate":5.584,"hasEvents":false,"sentence_source":"所以这个安全不安全 不在于你是不是有这个能力 我感觉，他好像是在于一个不知道一个思路，反正曾经跟我的一个好朋友 他叫Luna，我跟他说我财富自由了 他非常震惊。","sentence_en":"So whether you feel secure or not isn’t about ability, I think—it’s about a mindset. I once told a good friend, Luna, that I had achieved financial freedom. She was shocked."},{"id":"584","start":4290.12,"end":4304.1,"displayStart":4290.12,"displayEnd":4304.1,"displayMid":4297.110000000001,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.5,"loudness":0.918116,"pitch":21.719809,"speechRate":4.506,"hasEvents":true,"sentence_source":"因为他是一个精灵，他说你有多少存款 我是两万，他说朋友这个不叫财富自由，我说你看我想买的东西我都已经买了，我还剩两万 这不叫财富自由叫什么。","sentence_en":"She’s a sharp one. She asked how much savings I had—I said 20,000. She said, 'Friend, that’s not financial freedom.' I said, 'Look, I’ve bought everything I wanted, and I still have 20,000 left—what would you call it?"},{"id":"585","start":4304.76,"end":4318.2,"displayStart":4304.76,"displayEnd":4318.2,"displayMid":4311.48,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Positive","score":0.6,"loudness":1.000222,"pitch":24.776312,"speechRate":4.504,"hasEvents":false,"sentence_source":"他真的就是翻着白眼看天，我买了一台我想要的大电脑 还剩2万 我觉得我还需要钱吗，我真的再有更多的钱我也不知道干什么了 就不用了呀。","sentence_en":"She just rolled her eyes. I bought a big computer I wanted and still had 20,000 left. Do I need more money? I really wouldn’t know what to do with it—no need."},{"id":"586","start":4318.2,"end":4326.14,"displayStart":4318.2,"displayEnd":4326.14,"displayMid":4322.17,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":1.044304,"pitch":27.530104,"speechRate":4.743,"hasEvents":false,"sentence_source":"你看马云他肯定比我有钱 但是他的空调也要开26度，他也不能因为有钱 他就开15。","sentence_en":"Jack Ma is certainly richer than me, but his air conditioner is still set to 26°C. He can’t turn it to 15° just because he’s rich."},{"id":"587","start":4326.14,"end":4339.7,"displayStart":4326.14,"displayEnd":4339.7,"displayMid":4332.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Media and Education","sentiment_en":"Neutral","score":0,"loudness":0.906344,"pitch":23.945929,"speechRate":5.331,"hasEvents":false,"sentence_source":"度 对吧，很多人的不安全感可能是来自于对未来的一些不确定性，他可能此刻不要说2万 此刻我有一万我都很够，但他会想到我明年后年 我晚年 我仅靠这一万两万是不够的。","sentence_en":"Right? Many people’s insecurity comes from uncertainty about the future. They might be fine with 10,000 now, but they worry they won’t have enough next year, or in old age."},{"id":"588","start":4339.7,"end":4345.22,"displayStart":4339.7,"displayEnd":4345.22,"displayMid":4342.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":0.995671,"pitch":28.268293,"speechRate":6.232,"hasEvents":false,"sentence_source":"但他不确定自己未来还有能够赚到一万两万的能力，随总不安全感是来自于此。","sentence_en":"But they aren’t sure they can earn that 10,000 or 20,000 in the future. That’s where insecurity comes from."},{"id":"589","start":4346,"end":4353.34,"displayStart":4346,"displayEnd":4353.34,"displayMid":4349.67,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":1.086483,"pitch":27.740274,"speechRate":4.851,"hasEvents":false,"sentence_source":"我觉得这是一种很乐观的人，就是他乐观的认为他能活到他赚不到那个生计的时候。","sentence_en":"I think that’s an optimistic view—optimistic enough to believe they’ll live long enough to be unable to earn a living."},{"id":"590","start":4354,"end":4367.14,"displayStart":4354,"displayEnd":4367.14,"displayMid":4360.57,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clu ith Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.917473,"pitch":34.249786,"speechRate":5.172,"hasEvents":false,"sentence_source":"那如果这就是英雄啊。","sentence_en":"Well, if that's what a hero is..."},{"id":"614","start":4494.57,"end":4499.25,"displayStart":4494.57,"displayEnd":4499.25,"displayMid":4496.91,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":0.838469,"pitch":23.09552,"speechRate":4.274,"hasEvents":false,"sentence_source":"那真的每个人都可以，你觉得这样做的难度在哪。","sentence_en":"Then anyone can be one. What do you think is hard about it?"},{"id":"615","start":4499.25,"end":4513.99,"displayStart":4499.25,"displayEnd":4513.99,"displayMid":4506.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Negative","score":-0.5,"loudness":0.917492,"pitch":24.281473,"speechRate":5.36,"hasEvents":false,"sentence_source":"个人会觉得我可能熬不过来，会觉得熬太难了 会看不到镜头，就你告诉我一个期限 比如说你熬一年，好 我咬牙 很多人就会觉得我相信匹极太来，但问题是那个太什么时候来呀 太晚永远不来呢。","sentence_en":"Personally, I feel like I might not make it through. It feels too hard to endure; I can't see the light at the end of the tunnel. If you give me a deadline, like endure for one year, okay, I'll grit my teeth. Many people would believe that after extreme hardship comes good fortune. But the problem is, when will that good fortune come? What if it never comes?"},{"id":"616","start":4513.99,"end":4520.85,"displayStart":4513.99,"displayEnd":4520.85,"displayMid":4517.42,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":1.041425,"pitch":25.327333,"speechRate":5.156,"hasEvents":false,"sentence_source":"哦 这个是有区别的 我是觉得永远不会好了，这是我的基本的看法 但凡有好一点。","sentence_en":"Oh, there's a difference. My basic view is ntence_en":"I thought maybe the world would always be like this—a plague-ridden place. I remember many people said, 'Oh, when the pandemic ends, we'll do this or that.' I never thought that way. From the start I believed it wouldn't end."},{"id":"621","start":4552.43,"end":4554.45,"displayStart":4552.43,"displayEnd":4554.45,"displayMid":4553.4400000000005,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.916854,"pitch":23.599951,"speechRate":6.395,"hasEvents":false,"sentence_source":"世界永远都是这个样子的。","sentence_en":"The world would always be like this."},{"id":"622","start":4554.45,"end":4561.93,"displayStart":4554.45,"displayEnd":4561.93,"displayMid":4558.1900000000005,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.924319,"pitch":27.605904,"speechRate":5.383,"hasEvents":false,"sentence_source":"所以你看今天居然它结束了，或者说他已经回到了疫情前的那个秩序，这个对我来说是意外的。","sentence_en":"So look—today it actually ended, or returned to pre-pandemic order. That was unexpected to me."},{"id":"623","start":4561.93,"end":4576.18,"displayStart":4561.93,"displayEnd":4576.18,"displayMid":4569.055,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.911132,"pitch":24.202391,"speechRate":5.538,"hasEvents":false,"sentence_source":"对我来说你就是罗曼罗兰所讲书的英雄主义了，你觉不觉得这种英雄是大家都可以当的，如果这是英雄的话，发新书的时候的那个读者见面婚上有一个女孩就问我，她说我的父亲不在了。","sentence_en":"To me, you're exactly the heroism Romain Rolland wrote about. Do you think everyone can be that kind of hero? If this is heroism, at a book launch a girl asked me, 'My father passed away..."},{"id":"624","start":4576.18,"end":4581.4,"displayStart":4576.18,"displayEnd":4581.4,"displayMid":4578.79,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.5,"loudness":0.788568,"pitch":22.205761,"speechRate":5.364,"hasEvents":false,"sentence_source":"然后我心里有一个洞，我怎么才能把它补上，我说我的父亲也去世了。","sentence_en":"...and there's a hole in my heart. How do I fill it?' I said my father also died."},{"id":"625","start":4581.4,"end":4583.36,"displayStart":4581.4,"displayEnd":4583.36,"displayMid":4582.379999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Negative","score":-0.6,"loudness":0.760868,"pitch":28.622564,"speechRate":6.685,"hasEvents":false,"sentence_source":"我觉得这个洞就是补不上啊。","sentence_en":"I think that hole can't be filled."},{"id":"626","start":4583.36,"end":4593.86,"displayStart":4583.36,"displayEnd":4593.86,"displayMid":4588.61,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":0.757704,"pitch":22.261578,"speechRate":5.276,"hasEvents":false,"sentence_source":"你现在就是一个有洞的人，就带着这个洞活着 没有别的路，你就要想办法适应你的新的身体，你这个有洞的身体 用新的办法活下去。","sentence_en":"Now you're a person with a hole. You live with that hole. There's no other way. You have to adapt to your new body—this body with a hole—and find new ways to live."},{"id":"627","start":4594.48,"end":4595.98,"displayStart":4594.48,"displayEnd":4595.98,"displayMid":4595.23,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Parents, Expectations, and Attitudes Toward Life","sentiment_en":"Neutral","score":0,"loudness":1.038438,"pitch":25.563259,"speechRate":8.835,"hasEvents":false,"sentence_source":"我觉得我就是这样一个人。","sentence_en":"I think that's how I am."},{"id":"628","start":4595.98,"end":4596.68,"displayStart":4595.98,"displayEnd":4596.68,"displayMid":4596.33,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":1.094265,"pitch":36.633217,"speechRate":7.547,"hasEvents":false,"sentence_source":"我们都是。","sentence_en":"We all are."},{"id":"629","start":4597.04,"end":4609,"displayStart":4597.04,"displayEnd":4609,"displayMid":4603.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Negative","score":-0.3,"loudness":0.822745,"pitch":24.012905,"speechRate":4.706,"hasEvents":false,"sentence_source":"因为人长大的过程，你不断的生命当中 会失去 失去亲人 朋友 某个机会，你内心的空洞会不断的增加，你就带这种空洞 带这种残缺往下走。","sentence_en":"As we grow up, we keep losing—losing loved ones, friends, opportunities. The emptiness inside keeps growing. You carry that emptiness, that incompleteness, and move on."},{"id":"630","start":4609,"end":4613.3,"displayStart":4609,"displayEnd":4613.3,"displayMid":4611.15,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.855215,"pitch":21.959755,"speechRate":4.387,"hasEvents":false,"sentence_source":"我也想问你一个问题，为什么还在做采访。","sentence_en":"I want to ask you something too. Why are you still doing interviews?"},{"id":"631","start":4613.74,"end":4616.6,"displayStart":4613.74,"displayEnd":4616.6,"displayMid":4615.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"The Energy Source of Life","sentiment_en":"Neutral","score":0,"loudness":0.767357,"pitch":21.003138,"speechRate":3.704,"hasEvents":false,"sentence_source":"因为我没想过去做别的。","sentence_en":"Because I never thought of doing anything else."},{"id":"632","start":4616.6,"end":4618.66,"displayStart":4616.6,"displayEnd":4618.66,"displayMid":4617.63,"speaker":"Lu Yu","speakerColor":"#995A91","clu ence_en":"But I think podcast is a different space. And when no one can see you, you feel safer, and you open up more."},{"id":"663","start":4839.6,"end":4852.86,"displayStart":4839.6,"displayEnd":4852.86,"displayMid":4846.23,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":1.020481,"pitch":24.241453,"speechRate":4.63,"hasEvents":true,"sentence_source":"我还有一个感觉 就是不管电视也好 播客也好 你尽管现在你比较敞开 但是你依然是那个主持的角色这个，嘉宾还是主要被了解 被讲述的对象吗。","sentence_en":"I also have a feeling—whether TV or podcast, even if you’re more open now, you’re still playing the host role. The guest is still the main one being understood and talked about, right?"},{"id":"664","start":4852.86,"end":4853.72,"displayStart":4852.86,"displayEnd":4853.72,"displayMid":4853.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.601495,"pitch":17.030861,"speechRate":2.326,"hasEvents":false,"sentence_source":"对对。","sentence_en":"Right, right."},{"id":"665","start":4853.72,"end":4863.12,"displayStart":4853.72,"displayEnd":4863.12,"displayMid":4858.42,"speaker":"Zhang Chun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.879644,"pitch":25.860973,"speechRate":4.043,"hasEvents":false,"sentence_source":"那你在这个过程里面 你几乎没有怎么做那个被观察 被注视 被讲述的那个对象 你会寂寞吗。","sentence_en":"And in that process, you’re almost never the one being observed, watched, or talked about. Do you ever feel lonely?"},{"id":"666","start":4863.12,"end":4867.68,"displayStart":4863.12,"displayEnd":4867.68,"displayMid":4865.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutra ":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Neutral","score":0,"loudness":0.92427,"pitch":26.263693,"speechRate":5.575,"hasEvents":true,"sentence_source":"因为当你把你自己引去让对方呈现的时候，你会觉得那此刻我的任务完成了。","sentence_en":"Because when you fade yourself out to let the other person shine, you feel like your job is done."},{"id":"671","start":4894.74,"end":4907.2,"displayStart":4894.74,"displayEnd":4907.2,"displayMid":4900.969999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Communication with Friends and Self-Reflection","sentiment_en":"Positive","score":0.3,"loudness":0.943192,"pitch":21.726393,"speechRate":5.585,"hasEvents":false,"sentence_source":"但是我慢慢的也会有一些改变，你看我现在也更多的播客里面会有一些表达是呀，也可能我是有表达欲的，可能只是这个时间还没到，可能前30年我帮助别人表达。","sentence_en":"But I’m slowly changing. See, now I express more on my podcast. Maybe I do have a desire to express—it just hasn’t come yet. Maybe for the first 30 years, I helped others express."},{"id":"672","start":4907.2,"end":4910.7,"displayStart":4907.2,"displayEnd":4910.7,"displayMid":4908.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Positive","score":0.3,"loudness":0.851601,"pitch":20.276823,"speechRate":6.043,"hasEvents":true,"sentence_source":"也许从这一刻开始慢慢的会有自己的表达不一定。","sentence_en":"Maybe from now on, I’ll start expressing myself—or maybe not."},{"id":"673","start":4911.28,"end":4913.14,"displayStart":4911.28,"displayEnd":4913.14,"displayMid":4912.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Economic status and living conditions","sentiment_en":"Neutral","score":0,"loudness":0.880084,"pitch":27.575363,"speechRate":6.061,"hasEvents":true,"sentence_source":"那你的生活你觉得幸福吗。","sentence_en":"Do you feel happy in your life?"},{"id":"674","start":4913.14,"end":4925.7,"displayStart":4913.14,"displayEnd":4925.7,"displayMid":4919.
