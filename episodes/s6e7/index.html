rt":1138.78,"displayEnd":1142.92,"displayMid":1140.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.5,"loudness":1.154533,"pitch":28.198576,"speechRate":6.522,"hasEvents":false,"sentence_source":"但是因为他们很美好 我们就愿意相信，比如说说你在那认识孩子。","sentence_en":"But because they're so beautiful, we want to believe them, like how you met a child there."},{"id":"121","start":1142.92,"end":1146.8,"displayStart":1142.92,"displayEnd":1146.8,"displayMid":1144.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.6,"loudness":1.063595,"pitch":27.808346,"speechRate":5.455,"hasEvents":false,"sentence_source":"然后孩子对你的诗 格外的肯定，就诸如此样的故事。","sentence_en":"And the child especially praised your poems—stories like that."},{"id":"122","start":1146.8,"end":1148.72,"displayStart":1146.8,"displayEnd":1148.72,"displayMid":1147.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.5,"loudness":1.303902,"pitch":30.563946,"speechRate":4.813,"hasEvents":false,"sentence_source":"对 我们会很买单这个。","sentence_en":"Yes, we would totally buy that."},{"id":"123","start":1148.72,"end":1151,"displayStart":1148.72,"displayEnd":1151,"displayMid":1149.8600000000001,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.973501,"pitch":37.09919,"speechRate":5.263,"hasEvents":false,"sentence_source":"我已经就是必摇过很多次了。","sentence_en":"I've already shaken my head many times."},{"id":"124","start":1151,"end":1153.52,"displayStart":1151,"displayEnd":1153.52,"displayMid":1152.26,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","cl displayMid":1185.565,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Neutral","score":0,"loudness":0.909712,"pitch":32.562134,"speechRate":4.771,"hasEvents":false,"sentence_source":"我说我从来不认识他 他们说那孩子没有说过这句话吗，说你坚持下去一定能变成一个非常了不起的诗人，我说你知道写诗不是减肥啊 为什么要坚持听，了也不像是孩子能说。","sentence_en":"I said I've never met him. They asked, 'Didn't the child say to you, \"If you keep at it, you'll become a truly remarkable poet\"?' I said, 'Writing poetry isn't like losing weight—why would you need to keep at it? And it doesn't sound like something a child would say."},{"id":"129","start":1193.11,"end":1203.34,"displayStart":1193.11,"displayEnd":1203.34,"displayMid":1198.225,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Neutral","score":0,"loudness":0.913886,"pitch":26.802662,"speechRate":3.812,"hasEvents":true,"sentence_source":"出来的话 还要坚持下去，《未来人生》的这种规划和想象是在北大期间变得非常清晰了吗。","sentence_en":"And if you manage to produce something, you still have to persevere? Did this kind of planning and envisioning of a 'future life' become much clearer during your time at Peking University?"},{"id":"131","start":1230.5,"end":1233.32,"displayStart":1230.5,"displayEnd":1233.32,"displayMid":1231.9099999999999,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.765764,"pitch":20.515242,"speechRate":3.901,"hasEvents":false,"sentence_source":"鲁豫对话田晓菲 岩中花述。","sentence_en":"Luyu in conversation with Tian Xiaofei: 'Talking from Within the Rock."},{"id":"133","start":1261.26,"end":1274.64,"displayStart":1261.26,"displayEnd":1274.64,"displayMid":1267.95,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.4,"loudness":0.973145,"pitch":31.555094,"speechRate":4.185,"hasEvents":false,"sentence_source":"鲁豫对话，就会有一个恐白症，尤其在开始写第一句之前面对一个空白，以前是一张白纸，现在就是空白的电脑屏幕，有的时候觉得是开始。","sentence_en":"Luyu says: 'There's this fear of the blank page, especially before writing the first sentence. Facing a blank—originally a blank sheet of paper, now a blank computer screen—sometimes feels like the start."},{"id":"134","start":1274.64,"end":1277.36,"displayStart":1274.64,"displayEnd":1277.36,"displayMid":1276,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.4,"loudness":0.605601,"pitch":19.96246,"speechRate":4.842,"hasEvents":false,"sentence_source":"那个是最难的，第一句是最难的。","sentence_en":"That's the hardest part. The first sentence is the hardest."},{"id":"135","start":1277.36,"end":1278.48,"displayStart":1277.36,"displayEnd":1278.48,"displayMid":1277.92,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.997036,"pitch":33.888386,"speechRate":7.24,"hasEvents":false,"sentence_source":"但是这个怎么说呢。","sentence_en":"But how should I put it?"},{"id":"136","start":1278.48,"end":1281.48,"displayStart":1278.48,"displayEnd":1281.48,"displayMid":1279.98,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.882591,"pitch":28.778292,"speechRate":4.333,"hasEvents":false,"sentence_source":"因为学术写作的话跟创作还是。","sentence_en":"Because academic writing is still different from creative writing."},{"id":"137","start":1281.48,"end":1283.74,"displayStart":1281.48,"displayEnd":1283.74,"displayMid":1282.6100000000001,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.778323,"pitch":27.143053,"speechRate":4.867,"hasEvents":false,"sentence_source":"因为我两个都有一些经验。","sentence_en":"Because I have experience with both."},{"id":"138","start":1283.74,"end":1298.3,"displayStart":1283.74,"displayEnd":1298.3,"displayMid":1291.02,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.873784,"pitch":26.242378,"speechRate":4.602,"hasEvents":false,"sentence_source":"所以我知道还是不太一样，我写学术不管是论文的话，还是写一本书的话，一方面是好像是这种治学的学者的研究的这种态度，另外一方面我会有一种作者的态度。","sentence_en":"So I know they are quite different. When I write academically—whether a paper or a book—on one hand, I have the attitude of a scholar engaged in research; on the other hand, I also have the attitude of an author."},{"id":"139","start":1298.3,"end":1306.3,"displayStart":1298.3,"displayEnd":1306.3,"displayMid":1302.3,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.792924,"pitch":29.1614,"speechRate":5.125,"hasEvents":false,"sentence_source":"就是说一种文学作者的态度，我希望能够就是写一个学术的一个论著的话，不仅应该有丰富的资料。","sentence_en":"That is, the attitude of a literary author. I hope that when writing an academic work, it should not only have rich material."},{"id":"140","start":1306.3,"end":1309.16,"displayStart":1306.3,"displayEnd":1309.16,"displayMid":1307.73,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.821731,"pitch":25.771978,"speechRate":5.245,"hasEvents":false,"sentence_source":"然后有学术研究的这个层面在里面。","sentence_en":"And also include the dimension of academic research."},{"id":"141","start":1309.16,"end":1319.46,"displayStart":1309.16,"displayEnd":1319.46,"displayMid":1314.31,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.842316,"pitch":25.055988,"speechRate":4.451,"hasEvents":false,"sentence_source":"我觉得应该这种有思想的，有观点的 有论点的 有想法的，而不是就是一个很死板的，就是好像是个资料库一样。","sentence_en":"I think it should be thoughtful, have viewpoints, arguments, ideas—not be rigid, like a mere database."},{"id":"142","start":1319.46,"end":1322.48,"displayStart":1319.46,"displayEnd":1322.48,"displayMid":1320.97,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.018838,"pitch":28.760237,"speechRate":5.479,"hasEvents":false,"sentence_source":"我觉得否则我们为什么要做学者?","sentence_en":"Otherwise, why would we become scholars?"},{"id":"143","start":1322.8,"end":1324.54,"displayStart":1322.8,"displayEnd":1324.54,"displayMid":1323.67,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.978948,"pitch":30.34144,"speechRate":5.172,"hasEvents":false,"sentence_source":"为什么要做学术研究?","sentence_en":"Why engage in academic research?"},{"id":"144","start":1324.96,"end":1336.06,"displayStart":1324.96,"displayEnd":1336.06,"displayMid":1330.51,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.813518,"pitch":28.651093,"speechRate":4.865,"hasEvents":false,"sentence_source":"尤其是做文学的研究、古典文学的研究，我现在就是花时间最多只中国古典文学，然后我觉得我们为什么现代人要去研究古典文学?","sentence_en":"Especially in literary studies, classical literature. I spend most of my time on Chinese classical literature now. Then I ask, why should modern people study classical literature?"},{"id":"145","start":1336.22,"end":1344.16,"displayStart":1336.22,"displayEnd":1344.16,"displayMid":1340.19,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.756153,"pitch":26.545282,"speechRate":4.66,"hasEvents":false,"sentence_source":"因为现代文学有很多非常丰富的、非常精彩的作品，然后我们研究古典文学到底是为什么?","sentence_en":"Because modern literature has many rich and brilliant works. So why exactly do we study classical literature?"},{"id":"146","start":1344.16,"end":1350.76,"displayStart":1344.16,"displayEnd":1350.76,"displayMid":1347.46,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.728405,"pitch":27.249189,"speechRate":4.708,"hasEvents":false,"sentence_source":"我觉得是因为中国古典文学确实有非常聪明的、非常好的、非常优秀的东西。","sentence_en":"I think it's because Chinese classical literature truly has very clever, very good, very excellent things."},{"id":"147","start":1350.76,"end":1357.28,"displayStart":1350.76,"displayEnd":1357.28,"displayMid":1354.02,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.908864,"pitch":28.563875,"speechRate":4.448,"hasEvents":false,"sentence_source":"但是我们隔着时间的一种时空的这种障碍，就是有一点像要穿越一样。","sentence_en":"But there is a temporal and spatial barrier across time—it's a bit like time travel."},{"id":"148","start":1357.28,"end":1363.76,"displayStart":1357.28,"displayEnd":1363.76,"displayMid":1360.52,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.037025,"pitch":31.124563,"speechRate":4.817,"hasEvents":false,"sentence_source":"但是学者的穿越又不是说是一个想象写历史小说的穿越小说的那种穿越。","sentence_en":"But a scholar's 'time travel' is not the kind of imaginative time travel you write about in historical novels."},{"id":"149","start":1363.76,"end":1372.18,"displayStart":1363.76,"displayEnd":1372.18,"displayMid":1367.97,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.781642,"pitch":29.70331,"speechRate":4.751,"hasEvents":false,"sentence_source":"因为你穿越应该是有一个丰富的学识作为一种背景，你能够真正地回到它的历史的语境里面去。","sentence_en":"Because for your 'travel' you need rich knowledge as background, enabling you to truly return to its historical context."},{"id":"150","start":1372.18,"end":1382.06,"displayStart":1372.18,"displayEnd":1382.06,"displayMid":1377.12,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.799957,"pitch":27.727215,"speechRate":5.567,"hasEvents":false,"sentence_source":"所以学者有的时候就是他是像搭一个桥梁一样，他是为了向告诉其他的人，就说我们应该看一看这些东西，他们有多好的东西在里面。","sentence_en":"So scholars sometimes act like building a bridge, to tell others: 'We should take a look at these things; there is so much good in them."},{"id":"151","start":1382.06,"end":1396.02,"displayStart":1382.06,"displayEnd":1396.02,"displayMid":1389.04,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.800729,"pitch":23.666943,"speechRate":4.871,"hasEvents":false,"sentence_source":"但是你把这些好的东西揭示出来，做学术研究的话，为什么说我会有一种作者的态度，就是我觉得就是应该把他写的不是很枯燥的，而是他应该有一种思想 有点观点。","sentence_en":"But when you reveal these good things in academic research, why do I say I have an author's attitude? Because I think it should be written not too dryly; it should have some thought and viewpoint."}, 91,"hasEvents":false,"sentence_source":"因为它也是一种逻辑的一种推理的过程，有的时候真的是需要花很多的精神花很多的精力。","sentence_en":"Because it's a process of logical reasoning, and sometimes it really takes a lot of mental energy and effort."},{"id":"156","start":1429.18,"end":1432.5,"displayStart":1429.18,"displayEnd":1432.5,"displayMid":1430.8400000000001,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.940783,"pitch":24.28006,"speechRate":4.63,"hasEvents":false,"sentence_source":"然后去想怎么把她更好的传达出来。","sentence_en":"Then to figure out how to convey it better."},{"id":"157","start":1432.5,"end":1444.4,"displayStart":1432.5,"displayEnd":1444.4,"displayMid":1438.45,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.3,"loudness":0.788855,"pitch":26.940004,"speechRate":5.9,"hasEvents":false,"sentence_source":"所以在这种时候完全是有这种所谓的Writers' block，或者是说写到一个地方就是我觉得，怎么表述她呢或者说我怎么去把她给更好的给传达出来呢。","sentence_en":"So at times like this, it's exactly that so-called writer's block, or when you're stuck at a point and think, 'How do I express this? How can I communicate it better?"},{"id":"158","start":1445.06,"end":1458.22,"displayStart":1445.06,"displayEnd":1458.22,"displayMid":1451.6399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.007993,"pitch":24.674372,"speechRate":5.672,"hasEvents":false,"sentence_source":"刚刚说到这种学术研究然后关于文学的写作，给了我一个新的想法，我以前认为如果你研究英美文学，就应该在英美文学图让里面生活，如果是研究中国文学就应该生活在中国。","sentence_en":"Speaking of academic research and literary writing, it gave me a new perspective. I used to think that if you study English literature, you should live in the English-speaking world, and if you study Chinese literature 611.12,"displayEnd":1626.64,"displayMid":1618.88,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.808844,"pitch":29.427294,"speechRate":4.639,"hasEvents":false,"sentence_source":"然后有不同的语言，有很多的大量大量的翻译的作品的产生，而且人们会有很多的争论，有的时候就说这种所谓华仪之变，或者是说我们本国本土文化和其他文化会发生冲击。","sentence_en":"Then there are different languages, and a huge number of translated works emerge. People have many debates, sometimes about the so-called 'Hua-Yi transformation' or the clash between our native culture and other cultures."},{"id":"182","start":1626.64,"end":1633.3,"displayStart":1626.64,"displayEnd":1633.3,"displayMid":1629.97,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.823019,"pitch":27.735271,"speechRate":4.204,"hasEvents":false,"sentence_source":"然后我说如果想到这样的一个时期的话，人们会想到 晚清 现代 民国。","sentence_en":"I said that if people think of such a period, they think of the late Qing, modern era, and Republican China."},{"id":"183","start":1633.3,"end":1641.14,"displayStart":1633.3,"displayEnd":1641.14,"displayMid":1637.22,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.791341,"pitch":27.163639,"speechRate":4.847,"hasEvents":false,"sentence_source":"但是同时 这个也是六朝时和卫星南北朝的时空，实际上也是完全可以用同样的东西来描述。","sentence_en":"But at the same time, this is also the time of the Six Dynasties or Wei-Jin Southern and Northern Dynasties, which can actually be described in the same way."},{"id":"184","start":1641.14,"end":1655.26,"displayStart":1641.14,"displayEnd":1655.26,"displayMid":1648.2,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.5,"loudness":0.81855,"pitch":27.797424,"speechRate":4.958,"hasEvents":false,"sentence_source":"所以他们这种时期都是在一个各种各样的东西，人们熟悉的东西在消失，或者熟悉的东西被外来的陌生的东西所改变，这种时候人们受到思想上受到的冲击非常非常大。","sentence_en":"So these periods are all about various things—familiar things disappearing or being changed by foreign, unfamiliar things. At such times, people experience a tremendous intellectual shock."},{"id":"185","start":1655.26,"end":1658.58,"displayStart":1655.26,"displayEnd":1658.58,"displayMid":1656.92,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.77658,"pitch":27.616024,"speechRate":5.519,"hasEvents":false,"sentence_source":"有的时候是很激烈的 甚至很暴力的碰撞。","sentence_en":"Sometimes it's a fierce, even violent collision."},{"id":"186","start":1658.58,"end":1670.64,"displayStart":1658.58,"displayEnd":1670.64,"displayMid":1664.6100000000001,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.804294,"pitch":27.537243,"speechRate":4.643,"hasEvents":false,"sentence_source":"但是有的时候往往就是这个时候的人的创造力是非常的旺盛的，而且创造出来的东西是非常辉煌的，往往它跟那种动荡的这种大环境。","sentence_en":"But sometimes people's creativity is extremely vigorous during such times, and what they create is brilliant, often in relation to the turbulent environment."},{"id":"187","start":1670.64,"end":1679.42,"displayStart":1670.64,"displayEnd":1679.42,"displayMid":1675.0300000000002,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.721166,"pitch":28.840105,"speechRate":4.556,"hasEvents":false,"sentence_source":"那种动荡也不一定都是战争，有的时候就是因为你所熟悉的东西 信仰 观点 忽然看到一个全新的。","sentence_en":"That turbulence isn't necessarily war—sometimes it's just because you suddenly encounter something completely new in what you're familiar with, your beliefs, or your viewpoints."},{"id":"188","start":1679.42,"end":1689.72,"displayStart":1679.42,"displayEnd":1689.72,"displayMid":1684.5700000000002,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.781525,"pitch":24.175924,"speechRate":5.141,"hasEvents":false,"sentence_source":"那么自然的就说你不管是接受它还是排斥它，你都不能再禁止了这个世界就不再禁止了，就变成一个动的世界 变化的世界。","sentence_en":"Then naturally, whether you accept or reject it, you can no longer stop the world from changing—it becomes a dynamic, changing world."},{"id":"189","start":1689.72,"end":1704.02,"displayStart":1689.72,"displayEnd":1704.02,"displayMid":1696.87,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.6,"loudness":0.808156,"pitch":23.146633,"speechRate":5.524,"hasEvents":false,"sentence_source":"然后这种时候就是说，你哪怕是非常排斥这种改变，或者说你非常的拥抱这种改变，接受这种改变的话，你这个整个人生就再也不可能是同样的了，我就觉得这种时候是对我是有很大的吸引力。","sentence_en":"At such a time, even if you strongly resist the change or strongly embrace it, your entire life can never be the same again. I find this kind of time very appealing to me."},{"id":"190","start":1704.74,"end":1709.46,"displayStart":1704.74,"displayEnd":1709.46,"displayMid":1707.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.834302,"pitch":21.5313,"speechRate":3.814,"hasEvents":false,"sentence_source":"我是这几天看完了那本，你写的那个《陈己录》。","sentence_en":"I just finished reading that book you wrote, 'Chen Ji Lu'."},{"id":"191","start":1709.46,"end":1718.88,"displayStart":1709.46,"displayEnd":1718.88,"displayMid":1714.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.6,"loudness":1.005103,"pitch":23.388098,"speechRate":4.14,"hasEvents":false,"sentence_source":"我觉得很好看，我就的确觉得像你也说过，还有后来我看到有一句松寿的话，他就说教书如浮沉。","sentence_en":"I think it's very good. I indeed feel, as you said, and later I saw a quote from Song Shou: 'Teaching is like floating and sinking."},{"id":"192","start":1718.88,"end":1724.62,"displayStart":1718.88,"displayEnd":1724.62,"displayMid":1721.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":1.160376,"pitch":29.549324,"speechRate":5.923,"hasEvents":true,"sentence_source":"那我在想那的确就像你说的，就是生辰的计案，它本身就意味着是教书的一个悖论。","sentence_en":"Then I thought, that is indeed like you said—the case of birth is itself a paradox of teaching."},{"id":"193","start":1725.14,"end":1740.86,"displayStart":1725.14,"displayEnd":1740.86,"displayMid":1733,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.94126,"pitch":30.847567,"speechRate":4.557,"hasEvents":true,"sentence_source":"是的 真的是一个悖论，而且你不教的话，还不觉得有什么 有什么程度，你只有在去清理的时候，你不教那个书的话，你给我觉得一样的都是很稳定的，可是在你开始教的时候。","sentence_en":"Yes, it's really a paradox. And if you don't teach, you don't realize the extent of it. Only when you start teaching, you feel it. If I didn't teach, I'd feel the same stability, but once you start teaching..."},{"id":"194","start":1740.86,"end":1753.52,"displayStart":1740.86,"displayEnd":1753.52,"displayMid":1747.19,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.861644,"pitch":30.426456,"speechRate":5.45,"hasEvents":false,"sentence_source":"你开始注意到的时候，就会觉得 哇 这个怎么就是，没完没了的这个文本义文 每个版本都不一样，就突然他看 这个是一个非常特别的时候，就是在北宋的时候 在北宋之前。","sentence_en":"When you start noticing, you think, 'Wow, how is this? Endless textual variants, every edition different.' Then suddenly, he sees that this is a very special time—in the Northern Song dynasty, before the Northern Song."},{"id":"195","start":1753.52,"end":1766.82,"displayStart":1753.52,"displayEnd":1766.82,"displayMid":1760.17,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.4,"loudness":0.7749,"pitch":24.917555,"speechRate":4.621,"hasEvents":false,"sentence_source":"人们从来没有对文学作品 对诗歌，人们没有这种教书的意识，这个是一个很有意思的一个很大的变化，就是在北宋以前的话 都是抄本时代 写本时代。","sentence_en":"People never had this awareness of teaching for literary works, for poetry. This is a very interesting, big change. Before the Northern Song, it was the era of manuscripts, the era of handwritten copies."},{"id":"196","start":1766.82,"end":1768.2,"displayStart":1766.82,"displayEnd":1768.2,"displayMid":1767.51,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.949731,"pitch":32.469597,"speechRate":7.547,"hasEvents":false,"sentence_source":"因为那时候没有印刷书。","sentence_en":"Because there were no printed books at that time."},{"id":"197","start":1768.2,"end":1773.62,"displayStart":1768.2,"displayEnd":1773.62,"displayMid":1770.9099999999999,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.812877,"pitch":27.175638,"speechRate":5.904,"hasEvents":false,"sentence_source":"所以你要想得到一本书的话 你要想拥有这本书，你可以从朋友那边借一本书。","sentence_en":"So if you wanted to get a book, to own it, you could borrow one from a friend."},{"id":"198","start":1773.62,"end":1777.86,"displayStart":1773.62,"displayEnd":1777.86,"displayMid":1775.7399999999998,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Positive","score":0.3,"loudness":0.885223,"pitch":25.757271,"speechRate":4.953,"hasEvents":false,"sentence_source":"然后你看觉得很好 我也想要一册 你当然可以去买。","sentence_en":"Then if you read it and liked it, you might want a copy yourself. Of course, you could buy it."},{"id":"199","start":1777.86,"end":1788.38,"displayStart":1777.86,"displayEnd":1788.38,"displayMid":1783.12,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.817932,"pitch":26.415424,"speechRate":5.057,"hasEvents":false,"sentence_source":"但是就是书籍的购买的话 当时是比较贵的，不是说每个人都随便你就可以买到你想要的书，有的时候是得不到 这种时候怎么办。","sentence_en":"But buying books was relatively expensive at that time; not everyone could easily buy the books they wanted. Sometimes you couldn't get them—what to do then?"},{"id":"200","start":1788.38,"end":1801.76,"displayStart":1788.38,"displayEnd":1801.76,"displayMid":1795.0700000000002,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.775079,"pitch":23.084328,"speechRate":5.082,"hasEvents":false,"sentence_source":"那么就自己动手抄写 然后很多人在抄写，而且你不一定抄写整本书 因为你得到一个文集的话，你就喜欢其中的某一些事 所以自然就是说，只抄写自己喜欢的那些事。","sentence_en":"Then you would copy it yourself. Many people copied books, and you didn't necessarily copy the whole book—if you got a collection, you might only like some pieces, so naturally you only copied the ones you liked."},{"id":"201","start":1801.76,"end":1814.2,"displayStart":1801.76,"displayEnd":1814.2,"displayMid":1807.98,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.827672,"pitch":24.404615,"speechRate":4.965,"hasEvents":false,"sentence_source":"然后这样不知不觉的你就参与到了这种文本生产的过程里面，大家读书的情况实际上都是一种处在抄写的过程中，抄写的时候就难免会产生错误。","sentence_en":"Thus, unknowingly, you became part of the process of text production. Everyone's reading was essentially a process of copying, and mistakes were inevitable during copying."},{"id":"202","start":1814.2,"end":1828.9,"displayStart":1814.2,"displayEnd":1828.9,"displayMid":1821.5500000000002,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.858529,"pitch":27.359653,"speechRate":4.881,"hasEvents":false,"sentence_source":"还有的时候你拿到的那个抄本本身就是残缺不全的，这个时候你就想这句是少一个字，这个字应该是什么，有的时候就会自己想一想，应该是这样的一个字就直接补在里面。","sentence_en":"Also, sometimes the manuscript you got was already incomplete. Then you would think, 'This sentence is missing a word—what should it be?' Sometimes you'd guess and directly fill it in."},{"id":"203","start":1828.9,"end":1840.94,"displayStart":1828.9,"displayEnd":1840.94,"displayMid":1834.92,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.85151,"pitch":27.340509,"speechRate":5.236,"hasEvents":false,"sentence_source":"当时的人没有这种意识，我一定要看到原文 没有人有过这种想法，在北宋以前 大家就是好像尤其对诗歌这种文本，人们觉得有一点它不像独家的经书。","sentence_en":"People at that time didn't have the awareness of 'I must see the original text.' No one had such an idea. Before the Northern Song, especially for poetry, people felt it wasn't like exclusive scriptures."},{"id":"204","start":1840.94,"end":1851.12,"displayStart":1840.94,"displayEnd":1851.12,"displayMid":1846.03,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.753808,"pitch":28.958654,"speechRate":4.72,"hasEvents":false,"sentence_source":"你觉得你一次一句一定要非常忠实于原文如何如何，它也不像是说史书，这个一定要什么忠于原文 要抄写如何如何。","sentence_en":"They didn't think that every word must be completely faithful to the original, nor was it like historical records where you must be faithful to the original when copying."},{"id":"205","start":1851.12,"end":1866.46,"displayStart":1851.12,"displayEnd":1866.46,"displayMid":1858.79,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":0.839148,"pitch":28.476793,"speechRate":4.63,"hasEvents":false,"sentence_source":"但是你在拿到一个诗集的时候，你就觉得这是我个人的好像一种娱乐的 休闲的 整编读物，在这种时候你抄写的话没有人有这种历史，就是说我达到一本桃圆明的是蛮好的。","sentence_en":"But when you got a poetry collection, you felt it was a personal, recreational, leisure reading. When copying it, no one had the historical sense—like 'I got a Tao Yuanming collection, that's nice."},{"id":"206","start":1866.46,"end":1868.46,"displayStart":1866.46,"displayEnd":1868.46,"displayMid":1867.46,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":0.823172,"pitch":33.008766,"speechRate":5,"hasEvents":false,"sentence_source":"然后到底是不是原文呢?","sentence_en":"Then is it the original text or not?"},{"id":"207","start":1868.48,"end":1870.18,"displayStart":1868.48,"displayEnd":1870.18,"displayMid":1869.33,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Reading Education and Learning Growth","sentiment_en":"Neutral","score":0,"loudness":1.233847,"pitch":26.859581,"speechRate":5.316,"hasEvents":false,"sentence_source":"然后是不是原本呢?","sentence_en":"And is it the original version?"},{"id":"208","start":1870.26,"end":1871.5,"displayStart":1870.26,"displayEnd":1871.5,"displayMid":1870.88,"speaker":"Tian Xiaofei","s luster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.759677,"pitch":26.679489,"speechRate":4.926,"hasEvents":false,"sentence_source":"你就会知道这个安德反自然，并不是一个可能是哪个抄写的人，就是犯了一个很愚蠢的错误，他完全是有可能是陶渊明的那个师，是所本来的那个样子。","sentence_en":"you'd realize that 'how can I return to nature' is not necessarily a stupid mistake by some scribe—it could very well be the original version of Tao Yuanming's poem."},{"id":"235","start":2087.6,"end":2096.78,"displayStart":2087.6,"displayEnd":2096.78,"displayMid":2092.19,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.882386,"pitch":31.617479,"speechRate":4.802,"hasEvents":false,"sentence_source":"但是我觉得我写这本书的时候，你知道苏东坡他是很好玩的一个人，他就会说 陶渊明写的诗《悠然见南山》。","sentence_en":"But when I was writing this book, you know Su Dongpo was a very playful person, and he would say that Tao Yuanming wrote the poem 'Leisurely Gazing at the Southern Mountain'."},{"id":"236","start":2096.78,"end":2112,"displayStart":2096.78,"displayEnd":2112,"displayMid":2104.3900000000003,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.84631,"pitch":32.580017,"speechRate":4.205,"hasEvents":false,"sentence_source":"然后本来的一个诗就是叫《悠然望南山》，苏氏就很主观，而且苏氏就是说 陶渊明这样自然的人，他怎么会去望南山，你去望的话就是说，就是很带着很多的渴望。","sentence_en":"The original line was actually 'Leisurely Looking at the Southern Mountain,' but Su was very subjective, saying that someone as natural as Tao Yuanming wouldn't 'look' at the mountain—'looking' implies too much desire."},{"id":"237","start":2112,"end":2119.86,"displayStart":2112,"displayEnd":2119.86,"displayMid":2115.9300000000003,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":0.996364,"pitch":34.630466,"speechRate":4.198,"hasEvents":true,"sentence_source":"然后是非常主动的要趁着脖子去望南山，桃圆明如此超脱的人，他只能是见南山。","sentence_en":"It's a very active act to crane your neck and look; someone as detached as Tao Yuanming could only 'see' the mountain."},{"id":"238","start":2121.22,"end":2126.1,"displayStart":2121.22,"displayEnd":2126.1,"displayMid":2123.66,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":1.169049,"pitch":37.284237,"speechRate":4.103,"hasEvents":true,"sentence_source":"我就是偶尔一抬头，南山在那里我就见到了南山。","sentence_en":"I just happened to look up, and there was the Southern Mountain—I saw it."},{"id":"239","start":2126.1,"end":2139.46,"displayStart":2126.1,"displayEnd":2139.46,"displayMid":2132.7799999999997,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.852427,"pitch":27.260063,"speechRate":5.19,"hasEvents":false,"sentence_source":"但是因为苏东坡自己是一个非常大才子，而且他是非常有影响力的人，他就见到每个人他总是非常强调，你如果说是又来望南山，你就一定是个俗人，你就不了解桃圆明。","sentence_en":"But because Su Dongpo was such a great talent and had huge influence, he would emphasize to everyone he met: if you say 'look at the Southern Mountain,' you're definitely a vulgar person who doesn't understand Tao Yuanming."},{"id":"240","start":2139.46,"end":2145.04,"displayStart":2139.46,"displayEnd":2145.04,"displayMid":2142.25,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.178825,"pitch":39.429249,"speechRate":4.817,"hasEvents":false,"sentence_source":"结果最后就变得了苏东坡的版本，又然建南山就变成了正本。","sentence_en":"In the end, Su's version—'leisurely seeing l":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.744048,"pitch":29.389353,"speechRate":5.792,"hasEvents":false,"sentence_source":"因为我觉得如果我们时事求是的说。","sentence_en":"Because if we're being practical about it,"},{"id":"246","start":2154.84,"end":2156.96,"displayStart":2154.84,"displayEnd":2156.96,"displayMid":2155.9,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.81142,"pitch":26.214838,"speechRate":4.926,"hasEvents":false,"sentence_source":"我们没有人认识陶元明。","sentence_en":"none of us actually know Tao Yuanming."},{"id":"247","start":2156.96,"end":2164.74,"displayStart":2156.96,"displayEnd":2164.74,"displayMid":2160.85,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.846981,"pitch":30.361542,"speechRate":4.765,"hasEvents":false,"sentence_source":"我们不可能坐着这个时间机器跑回去来问他，你到底写的是见还是忘呢，永远是不可能的。","sentence_en":"We can't travel back in time to ask him: did you write 'see' or 'look'? That's impossible forever."},{"id":"248","start":2164.74,"end":2174.58,"displayStart":2164.74,"displayEnd":2174.58,"displayMid":2169.66,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.837273,"pitch":27.35932,"speechRate":4.893,"hasEvents":false,"sentence_source":"所以在这种时候我们只能就是很时事求是的，有一个健有一个望﹐或者是说有一个负德反自然﹐有一个安德反自然。","sentence_en":"So in such a situation, we can only be very pragmatic—there's one version with 'see' and one with 'look,' or one with 'return to nature' and one with 'return to the true nature'."},{"id":"249","start":2174.58,"end":2186.18,"displayStart":2174.58,"displayEnd":2186.18,"displayMid":2180.38,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.770575,"pitch":25.15292,"speechRate":5.297,"hasEvents":false,"sentence_source":"然后在这种时候 我想我们学者能做的工作，就是说我们看一看桃圆明生活的时代，如果你说安德反自然 这个合理不合理，这是不是个合理的可能性。","sentence_en":"And then, I think the work we scholars can do is to consider the era Tao Yuanming lived in: is the 'return to true nature' version reasonable or not? Is it a plausible possibility?"},{"id":"250","start":2186.18,"end":2189.16,"displayStart":2186.18,"displayEnd":2189.16,"displayMid":2187.67,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.762717,"pitch":27.29637,"speechRate":6.308,"hasEvents":false,"sentence_source":"然后最后我就说 那么我们有两种可能性。","sentence_en":"In the end, I say: we have two possibilities."},{"id":"251","start":2189.16,"end":2194.66,"displayStart":2189.16,"displayEnd":2194.66,"displayMid":2191.91,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.872251,"pitch":25.965204,"speechRate":5.571,"hasEvents":false,"sentence_source":"但是大家一般不选择的那个版本就是安德反自然，为什么不去选择它呢?","sentence_en":"But the version people generally don't choose is 'return to true nature.' Why not?"},{"id":"252","start":2194.84,"end":2199.76,"displayStart":2194.84,"displayEnd":2199.76,"displayMid":2197.3,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.781399,"pitch":28.081093,"speechRate":6.11,"hasEvents":false,"sentence_source":"因为你要是选择了那个版本的话，你会觉得这个诗本来是让你很舒服的。","sentence_en":"Because if you choose that version, the poem originally felt comforting."},{"id": ","score":-0.6,"loudness":0.700801,"pitch":24.066164,"speechRate":5.03,"hasEvents":false,"sentence_source":"然后在这种时候你这个师用一个疑问来结束的话，会给人一种很不安的一种感觉。","sentence_en":"Then using a question to end the poem gives you a very unsettling feeling."},{"id":"257","start":2233.5,"end":2238.88,"displayStart":2233.5,"displayEnd":2238.88,"displayMid":2236.19,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.789503,"pitch":25.414751,"speechRate":4.647,"hasEvents":false,"sentence_source":"然后他就把你重新又推到一个怀疑的痛苦的一个状态之中。","sentence_en":"It pushes you back into a painful state of doubt."},{"id":"258","start":2238.88,"end":2243.88,"displayStart":2238.88,"displayEnd":2243.88,"displayMid":2241.38,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.4,"loudness":0.6632,"pitch":23.219343,"speechRate":5.4,"hasEvents":false,"sentence_source":"所以我觉得很多读者就不愿意去接受这样的一种版本的桃圆明。","sentence_en":"So I think many readers are unwilling to accept that version of Tao Yuanming."},{"id":"259","start":2243.88,"end":2252.24,"displayStart":2243.88,"displayEnd":2252.24,"displayMid":2248.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":1.018028,"pitch":24.907393,"speechRate":4.306,"hasEvents":false,"sentence_source":"理解 因为我是读者 比如说桃圆明或者上苏氏，他们对我们来说代表着一种传统和永恒。","sentence_en":"I understand—as a reader, Tao Yuanming or Su Dongpo represent a kind of tradition and permanence to us."},{"id":"260","start":2252.74,"end":2259.7,"displayStart":2252.74,"displayEnd":2259.7,"displayMid":2256.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.5,"loudness":1.134104,"pitch":29.5832,"speechRate":5.172,"hasEvents":false,"sentence_source":"但是像您说的 我了解到古代文本的脆弱跟不确定性，分分钟有可能打破我们这种相信。","sentence_en":"But as you said, learning about the fragility and uncertainty of ancient texts can break that belief at any moment."},{"id":"261","start":2260.94,"end":2265.66,"displayStart":2260.94,"displayEnd":2265.66,"displayMid":2263.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.6,"loudness":1.049442,"pitch":31.66732,"speechRate":5.508,"hasEvents":true,"sentence_source":"我们的生活本来就已经智力破碎，可以称为永恒传统东西不多。","sentence_en":"Our lives are already fragmented, and there aren't many things we can call eternal traditions."},{"id":"262","start":2265.66,"end":2271.88,"displayStart":2265.66,"displayEnd":2271.88,"displayMid":2268.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Strongly Negative","score":-0.8,"loudness":1.176256,"pitch":31.028517,"speechRate":5.145,"hasEvents":false,"sentence_source":"然后背了一辈子时居然如今又被认为，还有另外一种可能性 我可能会崩溃的。","sentence_en":"If a poem I've recited my whole life suddenly has another possibility, I might collapse."},{"id":"263","start":2271.88,"end":2273.98,"displayStart":2271.88,"displayEnd":2273.98,"displayMid":2272.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.210335,"pitch":35.450439,"speechRate":3.333,"hasEvents":false,"sentence_source":"但是先不要崩溃。","sentence_en":"But don't collapse just yet."},{"id":"264","start":2274.1,"end":2289.72,"displayStart":2274.1,"displayEnd":2289.72,"displayMid":2281.91,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.7,"loudness":0.916451,"pitch":32.573345,"speechRate":4.738,"hasEvents":false,"sentence_source":"因为我觉得就是，我其实在另外那个版本的桃园名里面，我看到了更多的另外一种安慰，鲁豫是说 我们读到的这个让我觉得很安心，至少有曾经生活过这样的一个人，他是很超脱的。","sentence_en":"Because I think, actually, in that other version of Tao Yuanming, I find another kind of comfort. Lu Yu said the version we read is reassuring—at least there lived someone so detached."},{"id":"265","start":2289.72,"end":2294.4,"displayStart":2289.72,"displayEnd":2294.4,"displayMid":2292.06,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.769491,"pitch":30.870615,"speechRate":6.41,"hasEvents":false,"sentence_source":"然后也许我们自己在我们的生活里面，看一看这样的人绝对是一种安慰。","sentence_en":"And maybe in our own lives, looking at such a person is definitely a comfort."},{"id":"266","start":2294.4,"end":2307.7,"displayStart":2294.4,"displayEnd":2307.7,"displayMid":2301.05,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.815359,"pitch":29.117962,"speechRate":5.566,"hasEvents":false,"sentence_source":"但是还有一种安慰，就是像我觉得在我眼中的桃圆明，或者我阅读的这些由不同的文本义文所构成的，另外的一个桃圆明的话，我是觉得他是从某种意义上来说是更真实的一个人。","sentence_en":"But there's another comfort: the Tao Yuanming I see, or the one constructed from different textual versions, is in a sense more real."},{"id":"267","start":2307.7,"end":2311.02,"displayStart":2307.7,"displayEnd":2311.02,"displayMid":2309.3599999999997,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.7,"loudness":0.693315,"pitch":30.457752,"speechRate":4.587,"hasEvents":false,"sentence_source":"就是我更能够跟我的心灵产生共鸣。","sentence_en":"I can resonate with him more deeply."},{"id":"268","start":2311.02,"end":2325.58,"displayStart":2311.02,"displayEnd":2325.58,"displayMid":2318.3,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.878329,"pitch":27.982637,"speechRate":4.876,"hasEvents":false,"sentence_source":"因为我会看到他怎么用写诗在这个过程当中慢慢的思索一些人生的问题，而这些人生问题实际上这就是1500多年来，就是我们一直还能够喜欢他或者至少对我来说。","sentence_en":"Because I see how he used poetry to slowly ponder life's questions—and these are the same fundamental questions that, over 1,500 years, have made us still like him, or at least for me,"},{"id":"269","start":2325.58,"end":2338.1,"displayStart":2325.58,"displayEnd":2338.1,"displayMid":2331.84,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.831615,"pitch":28.297691,"speechRate":5.192,"hasEvents":false,"sentence_source":"我还能够喜欢他和欣赏他，就是因为就是他面对的一些根本的一些人生的问题，跟我们所面对的一些根本人生问题也没有什么不同之处，甚至是息息相通的。","sentence_en":"I can still like and appreciate him because the fundamental life issues he faced are no different from, even deeply connected to, the ones we face."},{"id":"270","start":2338.1,"end":2343.56,"displayStart":2338.1,"displayEnd":2343.56,"displayMid":2340.83,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.5,"loudness":0.796479,"pitch":30.627081,"speechRate":5.41,"hasEvents":false,"sentence_source":"这个也是一种安慰 就是觉得曾经有这样一个人 他有这样的一种生活。","sentence_en":"That's also a comfort: to know there was someone who lived such a life."},{"id":"271","start":2343.56,"end":2347.38,"displayStart":2343.56,"displayEnd":2347.38,"displayMid":2345.4700000000003,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.78187,"pitch":28.04034,"speechRate":4.712,"hasEvents":false,"sentence_source":"然后但是他的生活也是有各种不完美之处。","sentence_en":"But his life also had various imperfections."},{"id":"272","start":2347.38,"end":2353.14,"displayStart":2347.38,"displayEnd":2353.14,"displayMid":2350.26,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":0.831481,"pitch":24.76296,"speechRate":4.34,"hasEvents":false,"sentence_source":"然后但是他找到了一种方式来面对他和怎么样子去对付他。","sentence_en":"Yet he found a way to face them and deal with them."},{"id":"273","start":2353.14,"end":2360.5,"displayStart":2353.14,"displayEnd":2360.5,"displayMid":2356.8199999999997,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.764924,"pitch":23.775982,"speechRate":4.895,"hasEvents":true,"sentence_source":"然后而且他的找到的这种对付的方式是写诗 是用文字做到这一点，就是感觉是很好的。","sentence_en":"And the way he found was writing poetry—using words to achieve that. That feels great."},{"id":"274","start":2361.5,"end":2365.82,"displayStart":2361.5,"displayEnd":2365.82,"displayMid":2363.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.910659,"pitch":27.750509,"speechRate":4.398,"hasEvents":true,"sentence_source":"所以 对，你在另外一个阶段 你写的人物是薩福。","sentence_en":"So yes, at another stage, the person you wrote about was Sappho."},{"id":"275","start":2365.82,"end":2373.78,"displayStart":2365.82,"displayEnd":2373.78,"displayMid":2369.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":0.974024,"pitch":24.018045,"speechRate":5.276,"hasEvents":false,"sentence_source":"对于读者来说 比如说我会觉得从陶渊明到萨弗中间是个很大的跨越，但萨弗又是个很有意思的一个。","sentence_en":"For a reader, jumping from Tao Yuanming to Sappho feels like a big leap, but Sappho is also very interesting."},{"id":"276","start":2373.78,"end":2383.06,"displayStart":2373.78,"displayEnd":2383.06,"displayMid":2378.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.08778,"pitch":24.3557,"speechRate":4.992,"hasEvents":true,"sentence_source":"然后我对于他的兴趣在于 我记得我读他的一个很小的简介，就读到他是生活在希腊的那个岛叫 L-E-S-B-O-S。","sentence_en":"My interest in him stems from reading a brief introduction about him, where I learned that he lived on a Greek island called L-E-S-B-O-S."},{"id":"277","start":2384.42,"end":2390.44,"displayStart":2384.42,"displayEnd":2390.44,"displayMid":2387.4300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":1.076772,"pitch":29.611485,"speechRate":6.028,"hasEvents":true,"sentence_source":"然后当时我的本能就认为这个词跟那个Lesbian那个词应该有某种联系。","sentence_en":"And instinctively I thought the name must be connected to the word 'lesbian."},{"id":"278","start":2390.44,"end":2399.24,"displayStart":2390.44,"displayEnd":2399.24,"displayMid":2394.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Positive","score":0.4,"loudness":1.050927,"pitch":26.519188,"speechRate":4.205,"hasEvents":false,"sentence_source":"所以我就去查 果然，后来我才知道很多女童训练者把萨弗视为某种先驱某种精神的领袖。","sentence_en":"So I looked it up, and indeed, I later learned that many female thinkers see Sappho as a kind of pioneer, a spiritual leader."},{"id":"279","start":2399.24,"end":2413.26,"displayStart":2399.24,"displayEnd":2413.26,"displayMid":2406.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Positive","score":0.5,"loudness":1.071442,"pitch":27.043398,"speechRate":5.394,"hasEvents":false,"sentence_source":"然后我会觉得很有意思 我大概翻了一下这本书，我就会发现人们说对于萨弗对于他的神话跟丑话几乎是同时开始的，但我看他对他早年的那个画像的描画又是一个很美的一个人。","sentence_en":"And I found it fascinating. I skimmed through the book and saw that people say the mythologizing and demonizing of Sappho began almost simultaneously. But the early portraits of her describe a very beautiful person."},{"id":"280","start":2413.26,"end":2416.8,"displayStart":2413.26,"displayEnd":2416.8,"displayMid":2415.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Negative","score":-0.3,"loudness":1.136151,"pitch":25.980917,"speechRate":7.284,"hasEvents":true,"sentence_source":"然后当人们开始神话他又把它描写成一个很丑的一个人。","sentence_en":"Then when people began to mythologize him, they also depicted him as a very ugly person."},{"id":"281","start":2423.54,"end":2446.78,"displayStart":2423.54,"displayEnd":2446.78,"displayMid":2435.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Life Experiences and Female Growth","sentiment_en":"Neutral","score":0,"loudness":0.879611,"pitch":29.197031,"speechRate":0.345,"hasEvents":false,"sentence_source":"话田晓菲 鲁豫对话。","sentence_en":"Hua Tianxiaofei, Lu Yu conversation."},{"id":"282","start":2446.78,"end":2449.16,"displayStart":2446.78,"displayEnd":2449.16,"displayMid":2447.9700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.914598,"pitch":21.116318,"speechRate":5.085,"hasEvents":false,"sentence_source":"他的博士论文 写的就是薩芙。","sentence_en":"Her doctoral thesis was on Sappho."},{"id":"283","start":2449.16,"end":2461.64,"displayStart":2449.16,"displayEnd":2461.64,"displayMid":2455.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.4,"loudness":1.004601,"pitch":27.749493,"speechRate":5.288,"hasEvents":false,"sentence_source":"然后他曾经就是好像受够了以后，意思就是说 你们关于薩芙 你们就闭嘴吧，他当时有这样表达 我当时不明白，我现在后来看到这段时候 我会觉得原来如此是你。","sentence_en":"And she once seemed fed up and basically said, 'Everyone, just shut up about Sappho.' She expressed that. I didn't get it then, but now seeing this passage, I think, 'Ah, so it was you."},{"id":"284","start":2461.64,"end":2474.7,"displayStart":2461.64,"displayEnd":2474.7,"displayMid":2468.17,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.7,"loudness":0.830714,"pitch":29.689863,"speechRate":5.36,"hasEvents":false,"sentence_source":"刚才说到安妮卡森，我非常喜欢安妮卡森对于薩芙的那个权势，我也受到他很多影响，就是包括他那个对于薩芙师的那种处理，就是因为薩芙的很多师是都是残缺不全的。","sentence_en":"Speaking of Anne Carson, I really like Anne Carson's interpretation of Sappho. I've been heavily influenced by her, including how she handles Sappho's poems, since many of Sappho's poems are fragmentary."},{"id":"285","start":2474.7,"end":2477.44,"displayStart":2474.7,"displayEnd":2477.44,"displayMid":2476.0699999999997,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.86019,"pitch":28.040766,"speechRate":5.983,"hasEvents":false,"sentence_source":"这个也是跟文本物之性很有关系。","sentence_en":"That's also closely related to the materiality of texts."},{"id":"286","start":2477.44,"end":2479.44,"displayStart":2477.44,"displayEnd":2479.44,"displayMid":2478.44,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.933943,"pitch":30.64938,"speechRate":6,"hasEvents":false,"sentence_source":"所以从这种意义上来说的话。","sentence_en":"So in that sense..."},{"id":"287","start":2479.44,"end":2482.86,"displayStart":2479.44,"displayEnd":2482.86,"displayMid":2481.15,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.735499,"pitch":28.720015,"speechRate":3.801,"hasEvents":false,"sentence_source":"我觉得薩福 陶渊明 甚至金平梅。","sentence_en":"I think of Sappho, Tao Yuanming, and even Jin Ping Mei."},{"id":"288","start":2482.86,"end":2491.82,"displayStart":2482.86,"displayEnd":2491.82,"displayMid":2487.34,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.881521,"pitch":24.608578,"speechRate":5.402,"hasEvents":false,"sentence_source":"因为金平梅也是最早出现，不是印刷本 而是一个超本出现的，而且金平梅也有不同的版本，这个也跟陶渊明很有关系。","sentence_en":"Because Jin Ping Mei also appeared early, not as a printed edition but as a manuscript, and it has multiple versions, which is very relevant to Tao Yuanming."},{"id":"289","start":2491.82,"end":2500.14,"displayStart":2491.82,"displayEnd":2500.14,"displayMid":2495.98,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.898516,"pitch":30.384962,"speechRate":5.566,"hasEvents":false,"sentence_source":"但是薩福作为诗人的话，他那个生活的时代比陶渊明还要更早，而且那个时候他们也连纸都没有，就是那个卢纸。","sentence_en":"But Sappho as a poet lived even earlier than Tao Yuanming, and at that time they didn't even have paper—just papyrus."},{"id":"290","start":2500.14,"end":2514.54,"displayStart":2500.14,"displayEnd":2514.54,"displayMid":2507.34,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.781967,"pitch":26.501543,"speechRate":4.322,"hasEvents":false,"sentence_source":"所以就是薩福的很多诗，基本上都是残缺不全的，当时安妮卡森在翻译和处理她的诗的时候，就会流出很多的空白来反映她的诗的那种残缺的状态。","sentence_en":"So many of Sappho's poems are fragmentary. When Anne Carson translated and worked on them, she left a lot of blank space to reflect that state of fragmentation."},{"id":"291","start":2514.54,"end":2528.42,"displayStart":2514.54,"displayEnd":2528.42,"displayMid":2521.48,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Positive","score":0.6,"loudness":0.799507,"pitch":24.523916,"speechRate":5.002,"hasEvents":false,"sentence_source":"我就是很喜欢她的那种处理的方法，而且我记得我在翻译薩福的诗的时候，在写那本书的时候，我还特别跟三连的我的编辑在讲，当时我的要求就是薩福的每一首诗。","sentence_en":"I really liked her approach. And I remember when I was translating Sappho's poems for that book, I specifically told my editor at Sanlian that my request was for each of Sappho's poems"},{"id":"292","start":2528.42,"end":2531.9,"displayStart":2528.42,"displayEnd":2531.9,"displayMid":2530.16,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.773836,"pitch":29.221691,"speechRate":4.317,"hasEvents":true,"sentence_source":"一定要单独的出现在一张纸叶上面。","sentence_en":"must appear alone on a single page."},{"id":"293","start":2552.68,"end":2561.88,"displayStart":2552.68,"displayEnd":2561.88,"displayMid":2557.2799999999997,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.839351,"pitch":28.149923,"speechRate":11.522,"hasEvents":false,"sentence_source":"鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫对话鲁豫 ls like a prophecy—truly, we know very, very little about Sappho, just like this blankness. Later generations, based on their own imagination, try to imagine what kind of person Sappho was and what she did."},{"id":"297","start":2595.4,"end":2597.82,"displayStart":2595.4,"displayEnd":2597.82,"displayMid":2596.61,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.899237,"pitch":24.414951,"speechRate":4.132,"hasEvents":false,"sentence_source":"然后有丑化的 有美化的。","sentence_en":"Some vilify her, some glorify her."},{"id":"298","start":2597.82,"end":2600.72,"displayStart":2597.82,"displayEnd":2600.72,"displayMid":2599.27,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Neutral","score":0,"loudness":0.757393,"pitch":31.22673,"speechRate":5.172,"hasEvents":false,"sentence_source":"然后但是实际上都是一种空白而已。","sentence_en":"But in reality, it's all just blankness."},{"id":"299","start":2600.72,"end":2602.44,"displayStart":2600.72,"displayEnd":2602.44,"displayMid":2601.58,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.3,"loudness":0.86298,"pitch":27.313223,"speechRate":4.651,"hasEvents":false,"sentence_source":"因为她已经不在了。","sentence_en":"Because she is no longer here."},{"id":"300","start":2602.44,"end":2607.48,"displayStart":2602.44,"displayEnd":2607.48,"displayMid":2604.96,"speaker":"Tian Xiaofei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Literary Creation and Classical Literature","sentiment_en":"Negative","score":-0.4,"loudness":0.759169,"pitch":22.898079,"speechRate":4.167,"hasEvents":false,"sentence_source":"所以她也从来不可能去回应，去辩解为自己来表白。","sentence_en":"So she could never respond, defend her
