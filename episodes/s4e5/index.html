r watching it, we all felt that if we could make a documentary like that in our lifetime, it would be a dream fulfilled."},{"id":"47","start":289.95,"end":296.67,"displayStart":289.95,"displayEnd":296.67,"displayMid":293.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.973221,"pitch":20.922371,"speechRate":5.004,"hasEvents":false,"sentence_source":"然后如果是新闻方向的话 那就是新闻调查 或者是像当时冯华卫视的那些节目。","sentence_en":"For news, it would be News Probe or programs like those on Phoenix TV."},{"id":"48","start":296.67,"end":299.79,"displayStart":296.67,"displayEnd":299.79,"displayMid":298.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":1.374064,"pitch":26.237514,"speechRate":5.474,"hasEvents":false,"sentence_source":"所以那个时候其实也没有太多的想。","sentence_en":"So at that time, I didn't really think much."},{"id":"49","start":299.79,"end":302.85,"displayStart":299.79,"displayEnd":302.85,"displayMid":301.32000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":1.152293,"pitch":22.692108,"speechRate":6.36,"hasEvents":false,"sentence_source":"我觉得做学生的时候更多的是一种模仿吧。","sentence_en":"I think as a student, it was more about imitation."},{"id":"50","start":303.25,"end":308.43,"displayStart":303.25,"displayEnd":308.43,"displayMid":305.84000000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":1.08596,"pitch":23.410818,"speechRate":5.996,"hasEvents":false,"sentence_source":"然后在模仿当中因为你没有基础去悟住来或者创新自己新的东西。","sentence_en":"And in imitation, since you didn't have a foundation to grasp or create something new,"},{"id":"51","start":308.43,"end":309.71,"displayStart":308.43,"displayEnd":309.71,"displayMid":309.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":1.033666,"pitch":22.577808,"speechRate":5.357,"hasEvents":false,"sentence_source":"然后就在模仿。","sentence_en":"you just kept imitating."},{"id":"52","start":309.71,"end":311.59,"displayStart":309.71,"displayEnd":311.59,"displayMid":310.65,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Positive","score":0.4,"loudness":1.019915,"pitch":24.692207,"speechRate":5.112,"hasEvents":false,"sentence_source":"对 你说模仿特别对。","sentence_en":"Yeah, you're right. Imitation is exactly it."},{"id":"53","start":311.59,"end":324.23,"displayStart":311.59,"displayEnd":324.23,"displayMid":317.90999999999997,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.944196,"pitch":22.048857,"speechRate":5.38,"hasEvents":false,"sentence_source":"我们当时外教给我们做新闻现场报道的那些课程，一切我们都是在模仿，我记得老师当时给我们讲说你们作为新人，你们去现场采访的时候人家根本不会理你们的。","sentence_en":"Our foreign teacher taught us how to do live news reporting, and we just imitated everything. I remember the teacher saying that as newcomers, when you go to interview on-site, nobody will pay attention to you."},{"id":"54","start":324.23,"end":339.51,"displayStart":324.23,"displayEnd":339.51,"displayMid":331.87,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.894679,"pitch":21.596371,"speechRate":5.357,"hasEvents":false,"sentence_source":"那怎么样让对方理你呢 或者让对方很重视你，发现你不是一个那种愣头青小孩，你就让他知道你很了解他 你怎么让他知道你很了解他呢，你把你知道他所有的信息都堆进在你的问题当中我们。","sentence_en":"So how do you get them to listen or take you seriously, and not see you as a clueless kid? You let them know you know them well. How? By packing everything you know about them into your questions."},{"id":"55","start":339.51,"end":349.67,"displayStart":339.51,"displayEnd":349.67,"displayMid":344.59000000000003,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.97934,"pitch":20.43714,"speechRate":5.512,"hasEvents":false,"sentence_source":"当时说 哦 这个是管用的吗，后来我记得我第一次在北京首都体馆，当时那个John Denver 约翰丹佛，当时他在后台我就去问他。","sentence_en":"We thought, 'Is that really going to work?' Later, I remember the first time I was backstage at Beijing Capital Gymnasium, asking John Denver questions."},{"id":"56","start":349.67,"end":351.37,"displayStart":349.67,"displayEnd":351.37,"displayMid":350.52,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":0.937042,"pitch":18.00979,"speechRate":7.059,"hasEvents":false,"sentence_source":"然后我就用老师的这个方法。","sentence_en":"I used that method the teacher taught."},{"id":"57","start":351.37,"end":353.31,"displayStart":351.37,"displayEnd":353.31,"displayMid":352.34000000000003,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Positive","score":0.4,"loudness":1.491333,"pitch":23.709356,"speechRate":5.935,"hasEvents":true,"sentence_source":"我觉得好像还挺管用的。","sentence_en":"It seemed to work pretty well."},{"id":"58","start":354.13,"end":360.05,"displayStart":354.13,"displayEnd":360.05,"displayMid":357.09000000000003,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":1.320833,"pitch":24.019955,"speechRate":4.223,"hasEvents":true,"sentence_source":"所以开始都是这样的模仿 然后都是这样的学习的一个过程。","sentence_en":"So it all started with imitation and then a process of learning."},{"id":"59","start":360.05,"end":371.89,"displayStart":360.05,"displayEnd":371.89,"displayMid":365.97,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Positive","score":0.5,"loudness":1.15591,"pitch":20.920567,"speechRate":4.484,"hasEvents":false,"sentence_source":"然后当时的就业的环境其实还不错，就是我们都会确信 都会有一个比较安全的，能够看得到的 能够摸得到的一个未来 一个位置。","sentence_en":"Back then, the job market was actually pretty good. We were all confident that there would be a safe, visible, tangible future and position for us."},{"id":"60","start":371.89,"end":379.31,"displayStart":371.89,"displayEnd":379.31,"displayMid":375.6,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Neutral","score":0,"loudness":0.967953,"pitch":16.518347,"speechRate":6.039,"hasEvents":false,"sentence_source":"那一点是肯定的 所以你当时想象你的状态，你要不要在比如说央视 北京电视台 这基本上是确定的 对吧。","sentence_en":"That was certain. So, imagining your future, would it be something like at CCTV or Beijing TV? That was basically determined, right?"},{"id":"61","start":379.31,"end":388.01,"displayStart":379.31,"displayEnd":388.01,"displayMid":383.65999999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.071245,"pitch":22.983694,"speechRate":4.917,"hasEvents":false,"sentence_source":"对 当时好像没有任何的 找工作的压力，我的整个环境不是因为我没有压力 或者是别人没有压力。","sentence_en":"Yeah, at that time there didn't seem to be any pressure to find a job. It wasn't that I had no pressure or others had no pressure;"},{"id":"62","start":388.01,"end":390.85,"displayStart":388.01,"displayEnd":390.85,"displayMid":389.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.027122,"pitch":21.879269,"speechRate":5.634,"hasEvents":false,"sentence_source":"我觉得整个的同班同学都是这样一个。","sentence_en":"I think it was like that for all my classmates."},{"id":"63","start":390.85,"end":394.21,"displayStart":390.85,"displayEnd":394.21,"displayMid":392.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.180887,"pitch":22.97987,"speechRate":5.06,"hasEvents":false,"sentence_source":"因为当时中国也非常需要新的电视人才。","sentence_en":"Because China was in great need of new TV talent back then."},{"id":"64","start":394.21,"end":397.45,"displayStart":394.21,"displayEnd":397.45,"displayMid":395.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.3,"loudness":1.111097,"pitch":22.437511,"speechRate":4.667,"hasEvents":false,"sentence_source":"所以那个时候就业的机会也很多。","sentence_en":"So there were plenty of job opportunities."},{"id":"65","start":397.45,"end":407.79,"displayStart":397.45,"displayEnd":407.79,"displayMid":402.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.032515,"pitch":20.840391,"speechRate":5.319,"hasEvents":false,"sentence_source":"所以更多的是想说自己想要去一个什么样的单位，什么样的剧组 然后对自己对未来，比如说有的人一定要去央视 有的人想去地方台。","sentence_en":"It was more about deciding what kind of organization or production team you wanted to join, and what you wanted for the future. For example, some people insisted on CCTV, others wanted local stations."},{"id":"66","start":407.79,"end":412.39,"displayStart":407.79,"displayEnd":412.39,"displayMid":410.09000000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.971021,"pitch":22.107639,"speechRate":6.856,"hasEvents":false,"sentence_source":"然后有的人想做新闻类的节目 有的人想做纪录片 更多的是这些想法。","sentence_en":"Some wanted to do news programs, others documentaries. That was more what we were thinking."},{"id":"67","start":412.39,"end":418.37,"displayStart":412.39,"displayEnd":418.37,"displayMid":415.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.14386,"pitch":23.532476,"speechRate":5.142,"hasEvents":false,"sentence_source":"所以，讲讲你几次离开 因为我不是一个特别善于离开结束的一个人。","sentence_en":"So, talk about your departures. I'm not someone who's good at leaving or ending things."},{"id":"68","start":419.01,"end":425.21,"displayStart":419.01,"displayEnd":425.21,"displayMid":422.11,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.017605,"pitch":21.183323,"speechRate":5.968,"hasEvents":false,"sentence_source":"我是一个就是比较持续性可能比较强的一个人 就每个人的特点会非常的不同 会很鲜明。","sentence_en":"I'm more of a persistent person. Everyone has very different, distinct traits."},{"id":"69","start":425.21,"end":441.23,"displayStart":425.21,"displayEnd":441.23,"displayMid":433.22,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.937315,"pitch":19.364599,"speechRate":4.806,"hasEvents":false,"sentence_source":"那你是一个有过几次离开 然后每次离开我觉得都做得很棒的一个人，有你第一次离开 离开央视 对，这在当年 其实放在任何时候 大家会觉得 哇 央视要离开 这个需要很大的勇气的 为什么。","sentence_en":"You are someone who has left several times, and each time I think you handled it brilliantly. Your first time leaving CCTV—that took a lot of courage, back then or at any time. Why?"},{"id":"70","start":441.23,"end":451.33,"displayStart":441.23,"displayEnd":451.33,"displayMid":446.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.965088,"pitch":21.958904,"speechRate":4.059,"hasEvents":false,"sentence_source":"我觉得我的离开 可能分两个阶段吧 就是，当然有可能 待会我们也会聊到2013年我去南极跑步。","sentence_en":"I think my departures can be split into two phases. Of course, we might also talk about my trip to Antarctica for running in 2013 later."},{"id":"71","start":451.91,"end":466.49,"displayStart":451.91,"displayEnd":466.49,"displayMid":459.20000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.953295,"pitch":17.250309,"speechRate":5.075,"hasEvents":false,"sentence_source":"那个事情之前和那个事情之后 我觉得这个对我人生来讲是一个特别大的一个转折点，在那个之前的所有的离开也好 转换工作也好，基本上是一种 就是有点混沌的那种感觉 就是。","sentence_en":"Before that and after that—I think it was a huge turning point in my life. Before that, whether it was leaving or switching jobs, it was kind of a chaotic feeling."},{"id":"72","start":466.95,"end":476.55,"displayStart":466.95,"displayEnd":476.55,"displayMid":471.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.985041,"pitch":19.666103,"speechRate":5.594,"hasEvents":true,"sentence_source":"我觉得现在做的东西无聊了 然后呢 刚好又有一个机会 我觉得挺好玩的，就去了 其实也没有多想什么 可能更多的是就是靠运气。","sentence_en":"I felt what I was doing was boring, and then a new opportunity came up that sounded fun, so I went for it. I didn't really think much; it was more about luck."},{"id":"73","start":476.55,"end":483.97,"displayStart":476.55,"displayEnd":483.97,"displayMid":480.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.123377,"pitch":24.375196,"speechRate":5.397,"hasEvents":true,"sentence_source":"所以那时候在央视做了一年的这个纪录片 那时候跟陈小清他们那边做那个百年中国。","sentence_en":"So at that time, I worked End":938.75,"displayMid":932.8199999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.3,"loudness":0.986973,"pitch":19.706717,"speechRate":4.827,"hasEvents":false,"sentence_source":"所以那个阶段我跟搜护视频 我们在谈Lost 迷失的第六季的时候，我不但要跟国内的客户谈 我还要跟美国去nego shit。","sentence_en":"So during that time, when I was negotiating the sixth season of 'Lost' with Sohu Video, I had to talk not only with domestic clients but also negotiate with the US."},{"id":"139","start":938.75,"end":953.71,"displayStart":938.75,"displayEnd":953.71,"displayMid":946.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.4,"loudness":0.988505,"pitch":18.700989,"speechRate":5.159,"hasEvents":false,"sentence_source":"因为美国一开始给我很多的条件 比如说同时在线不能有多少机，不能有四集 你上了第五集 第一集就要下去，要保证你同时不能够看到这个剧所有的机，它要保护它的电视的播放。","sentence_en":"Because the US initially gave me many conditions—like how many episodes could be online simultaneously. You couldn't have four episodes; if you put up a fifth, the first had to come down. They wanted to ensure you couldn't see all episodes at once, to protect TV broadcasts."},{"id":"140","start":953.71,"end":967.33,"displayStart":953.71,"displayEnd":967.33,"displayMid":960.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.5,"loudness":0.887795,"pitch":19.221668,"speechRate":5.335,"hasEvents":true,"sentence_source":"然后我就跟他说 在中国你没有电视播放，你再保护什么东西 对吧 我最后是Lost当时开播，开播的时候 说实话 我的合同都没有拿到，就是最后签字的合同都没有拿到。","sentence_en":"Then I told them, 'In China, you don't have TV broadcasts, so what are you protecting?' Eventually, when 'Lost' premiered, honestly, I didn't even have the signed contract yet."},{"id":"141","start":967.33,"end":973.83,"displayStart":967.33,"displayEnd":973.83,"displayMid":970.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.886955,"pitch":18.659529,"speechRate":6.446,"hasEvents":true,"sentence_source":"我当天晚上 因为是美国晚上开播嘛，我当天那时候在上海坐在那块 我就等着美国给我合同。","sentence_en":"That evening, because it aired in the US at night, I was sitting in Shanghai waiting for the contract from the US."},{"id":"142","start":973.83,"end":976.35,"displayStart":973.83,"displayEnd":976.35,"displayMid":975.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.126129,"pitch":23.740919,"speechRate":7.489,"hasEvents":false,"sentence_source":"因为他只有拿到合同我才能让这边上线。","sentence_en":"Because I had to get the contract to let them go online."},{"id":"143","start":976.35,"end":980.25,"displayStart":976.35,"displayEnd":980.25,"displayMid":978.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":1.169776,"pitch":22.500267,"speechRate":5.634,"hasEvents":false,"sentence_source":"然后当时就坐在那看着电脑 就各种的那种兴趣。","sentence_en":"So I just sat there staring at the computer, feeling all kinds of excitement."},{"id":"144","start":980.25,"end":993.99,"displayStart":980.25,"displayEnd":993.99,"displayMid":987.12,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.193817,"pitch":22.54644,"speechRate":5.24,"hasEvents":false,"sentence_source":"因为谈了很久了 终于拿到了之后上线，当时看到上线的时候 我就觉得可能没有人知道就是让这个剧上线有多难，从那个之后就慢慢的就发现了中国的新媒体视频起来之后。","sentence_en":"After long negotiations, I finally got it and went live. When I saw it online, I felt like no one knew how hard it was to make that happen. From then on, as Chinese new media video sites grew,"},{"id":"145","start":993.99,"end":1001.71,"displayStart":993.99,"displayEnd":1001.71,"displayMid":997.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.965595,"pitch":16.194807,"speechRate":5.372,"hasEvents":false,"sentence_source":"我们开始有时候在改变美国那边对于新媒体授权的，就是他们会要参考我们的这个这些合同。","sentence_en":"we started to sometimes change how the US handled new media licensing. They would reference our contracts."},{"id":"146","start":1001.71,"end":1012.87,"displayStart":1001.71,"displayEnd":1012.87,"displayMid":1007.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.7,"loudness":0.984787,"pitch":18.174835,"speechRate":5.38,"hasEvents":false,"sentence_source":"所以就是从一开始是所有东西都是就像咱们刚才说的模仿，学美国那一套 到后来因为中国市场起来之后，我美国也开始参考中国的东西。","sentence_en":"So it started from everything being about imitation, learning from the US, but later, as the Chinese market grew, the US began to look at us for reference."},{"id":"147","start":1012.87,"end":1026.41,"displayStart":1012.87,"displayEnd":1026.41,"displayMid":1019.6400000000001,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.926265,"pitch":20.865238,"speechRate":4.109,"hasEvents":false,"sentence_source":"对 Lost 当年我真的是狂追的一个剧集，Lost 讲的是什么呢 讲的一个美国某航班，在一个荒屋人烟的神秘的小岛上吃坠毁了。","sentence_en":"I was really obsessed with Lost back in the day. What is Lost about? It's about a US flight that crashes on a mysterious deserted island."},{"id":"148","start":1026.41,"end":1036.21,"displayStart":1026.41,"displayEnd":1036.21,"displayMid":1031.31,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.114363,"pitch":22.156431,"speechRate":4.337,"hasEvents":false,"sentence_source":"然后机上有一些人幸存下来，他们要在这个岛上如何团结在一起，抵抗来自各种各样的很神秘的危险。","sentence d it too—is that Hong Kong is really interesting. When I first went to the Hong Kong office and met the colleagues, you could clearly tell..."},{"id":"169","start":1164.29,"end":1178.11,"displayStart":1164.29,"displayEnd":1178.11,"displayMid":1171.1999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.831975,"pitch":18.312807,"speechRate":4.414,"hasEvents":false,"sentence_source":"就是那种就直接说就是瞧不起瞧不起大陆人的感觉，而且尤其是人事部门这个现在想想都是节的不可思议的事情人事部门的人跟我说话的态度。","sentence_en":"It was that feeling of looking down on mainlanders. Especially HR—it's unbelievable even now thinking about the attitude HR had when talking to me."},{"id":"170","start":1178.11,"end":1187.55,"displayStart":1178.11,"displayEnd":1187.55,"displayMid":1182.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.6,"loudness":0.989225,"pitch":20.178967,"speechRate":6.912,"hasEvents":false,"sentence_source":"比如说我提出一些要求 然后他的那个回应的方式和态度，就基本上就是condescending 就是从上而下的这种 在教育你啊再怎么样的。","sentence_en":"For example, when I made requests, the way they responded was basically condescending—like talking down to me, lecturing me."},{"id":"171","start":1187.55,"end":1191.25,"displayStart":1187.55,"displayEnd":1191.25,"displayMid":1189.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.150975,"pitch":20.407745,"speechRate":6.775,"hasEvents":false,"sentence_source":"甚至是到了我后来我的职位已经升到比他还高的时候。","sentence_en":"Even later when my position was higher than theirs."},{"id":"172","start":1191.25,"end":1195.37,"displayStart":1191.25,"displayEnd":1195.37,"displayMid":1193.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.7,"loudness":0.698409,"pitch":8.781871,"speechRate":3.883,"hasEvents":false,"sentence_source":"然后还是这种态度 其实心里面很不爽。","sentence_en":"And still that attitude. It really pissed me off inside."},{"id":"173","start":1195.37,"end":1205.63,"displayStart":1195.37,"displayEnd":1205.63,"displayMid":1200.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.996463,"pitch":21.135836,"speechRate":5.824,"hasEvents":false,"sentence_source":"但是心里面那时候也没有一个什么被歧视的，或者是你可以去complain 可以去投诉的这种概念，没有 因为你就是之前没有这种经历。","sentence_en":"But at that time, I didn't have the concept of being discriminated against or that you could complain. No, because I'd never experienced it before."},{"id":"174","start":1205.63,"end":1216.93,"displayStart":1205.63,"displayEnd":1216.93,"displayMid":1211.2800000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.008676,"pitch":21.147186,"speechRate":5.847,"hasEvents":false,"sentence_source":"但是给了我一点鼓励的是什么呢，就是我当时离开华纳是因为，我老板一开始教了我很多东西，但到后来他已经 我觉得没有太多的，从他可以学到的东西了。","sentence_en":"But what gave me some encouragement was that when I left Warner, it was because my boss taught me a lot at first, but later I felt there wasn't much more I could learn from him."},{"id":"175","start":1217.33,"end":1219.33,"displayStart":1217.33,"displayEnd":1219.33,"displayMid":1218.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.249114,"pitch":21.751373,"speechRate":6.268,"hasEvents":true,"sentence_source":"那他呢 是一个美籍的华人。","sentence_en":"He is a Chinese-American."},{"id":"176","start":1219.33,"end":1228.53,"displayStart":1219.33,"displayEnd":1228.53,"displayMid":1223.9299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.876758,"pitch":19.223047,"speechRate":4.793,"hasEvents":false,"sentence_source":"那个时候 外国公司在中国，要顾一个什么高管的话，基本上都是 要不就是美籍华人，要不就是港台的这些人。","sentence_en":"At that time, when foreign companies in China wanted to hire an executive, it was basically either Chinese Americans or people from Hong Kong or Taiwan."},{"id":"177","start":1228.53,"end":1230.55,"displayStart":1228.53,"displayEnd":1230.55,"displayMid":1229.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.682569,"pitch":16.768709,"speechRate":4.455,"hasEvents":false,"sentence_source":"因为他们英语比较好。","sentence_en":"Because their English was better."},{"id":"178","start":1230.55,"end":1232.67,"displayStart":1230.55,"displayEnd":1232.67,"displayMid":1231.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.737707,"pitch":14.068139,"speechRate":6.604,"hasEvents":false,"sentence_source":"然后又比较了解西方的这些文化。","sentence_en":"And they understood Western culture better."},{"id":"179","start":1232.67,"end":1246.63,"displayStart":1232.67,"displayEnd":1246.63,"displayMid":1239.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.924603,"pitch":16.37274,"speechRate":4.875,"hasEvents":false,"sentence_source":"所以后来我离开了华纳，离开华纳的时候 当时其实最大的老板，就是他的老板还来挽留我，他是个美国人，他的挽留一开始他会说几句客套话，说什么我们希望你留下。","sentence_en":"So later I left Warner. When I left, the big boss—his boss—actually tried to keep me. He was American. At first he said some polite things like 'we hope you'll stay."},{"id":"180","start":1246.63,"end":1255.97,"displayStart":1246.63,"displayEnd":1255.97,"displayMid":1251.3000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.5,"loudness":0.954223,"pitch":21.236406,"speechRate":5.359,"hasEvents":false,"sentence_source":"但是到最后的时候他说了一句，他说没有人离开华纳还能再回来的，就当时你听着那个话就感觉是那种威胁一样。","sentence_en":"But at the end, he said, 'No one leaves Warner and comes back.' When I heard that, it felt like a threat."},{"id":"181","start":1255.97,"end":1265.09,"displayStart":1255.97,"displayEnd":1265.09,"displayMid":1260.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.918668,"pitch":18.842295,"speechRate":6.122,"hasEvents":false,"sentence_source":"我觉得反正当时也没有想回来嘛，就算了 离开华纳去了Disney，等到在Disney两年之后，我之前在华南的老板离开了。","sentence_en":"I figured I didn't plan to come back anyway, so I left Warner and went to Disney. Two years later at Disney, my former boss at Warner left."},{"id":"182","start":1265.09,"end":1269.27,"displayStart":1265.09,"displayEnd":1269.27,"displayMid":1267.1799999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.935135,"pitch":17.401701,"speechRate":6.409,"hasEvents":false,"sentence_source":"然后这个时候华南回来找我，等于是接替了我老板的位置。","sentence_en":"Then Warner came back to me, essentially to take my boss's position."},{"id":"183","start":1269.27,"end":1275.59,"displayStart":1269.27,"displayEnd":1275.59,"displayMid":1272.4299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.105832,"pitch":22.300951,"speechRate":4.762,"hasEvents":false,"sentence_source":"所以我觉得这个有两方面，一方面是说，也确实是体现了中国在那七年。","sentence_en":"So I think there are two aspects. On one hand, it reflects the change in China over those seven years."},{"id":"184","start":1275.59,"end":1285.07,"displayStart":1275.59,"displayEnd":1285.07,"displayMid":1280.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.773452,"pitch":17.881243,"speechRate":5.38,"hasEvents":false,"sentence_source":"那七年时间的一个整个的一个变化，包括整体的我们的员工的素质，和整个国际接轨的这些，当然肯定也有我自己个人努力。","sentence_en":"The overall change in those seven years, including the quality of our employees and how they aligned with international standards—and of course my own efforts."},{"id":"185","start":1285.07,"end":1287.73,"displayStart":1285.07,"displayEnd":1287.73,"displayMid":1286.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.033003,"pitch":20.091208,"speechRate":3.383,"hasEvents":false,"sentence_source":"但是能够是在两年前。","sentence_en":"But to be able to, just two years earlier..."},{"id":"186","start":1287.73,"end":1291.73,"displayStart":1287.73,"displayEnd":1291.73,"displayMid":1289.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.945039,"pitch":18.152182,"speechRate":4.523,"hasEvents":false,"sentence_source":"我觉得跟这个老板没有什么可学的情况下。","sentence_en":"When I felt I had nothing more to learn from that boss."},{"id":"187","start":1291.73,"end":1303.37,"displayStart":1291.73,"displayEnd":1303.37,"displayMid":1297.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.7,"loudness":0.839849,"pitch":16.659073,"speechRate":4.897,"hasEvents":false,"sentence_source":"然后两年之后我回来能够作为一个大陆的人，来接替一个美籍华裔的之前还是什么哈佛商学院的这个高材生，他们愿意让我做这个职位。","sentence_en":"And two years later, I came back as a mainlander to replace a Chinese American who was a Harvard Business School graduate. They were willing to let me take that role."},{"id":"188","start":1303.37,"end":1312.49,"displayStart":1303.37,"displayEnd":1312.49,"displayMid":1307.9299999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.949023,"pitch":16.743778,"speechRate":5.396,"hasEvents":false,"sentence_source":"我觉得这个是给了我个人的一个比较大的一个信心的一个鼓励，还有就是当时威胁我说离开华南的人不会回来的。","sentence_en":"That gave me a big boost of personal confidence. Also, the guy who threatened me saying no one leaves Warner and comes back..."},{"id":"189","start":1312.49,"end":1317.55,"displayStart":1312.49,"displayEnd":1317.55,"displayMid":1315.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":1.127073,"pitch":14.150825,"speechRate":5.714,"hasEvents":true,"sentence_source":"然后现在还是同样的人把我顾回来，当然他已经不再提这句话了。","sentence_en":"And now the same person has hired me back. Of course, he no longer mentions that phrase."},{"id":"190","start":1318.03,"end":1320.23,"displayStart":1318.03,"displayEnd":1320.23,"displayMid":1319.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.325571,"pitch":22.16629,"speechRate":3.99,"hasEvents":true,"sentence_source":"所以就是一些体会。","sentence_en":"So just some reflections."},{"id":"191","start":1320.23,"end":1323.49,"displayStart":1320.23,"displayEnd":1323.49,"displayMid":1321.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.150206,"pitch":23.715288,"speechRate":6.135,"hasEvents":false,"sentence_source":"对 但是怎么说呢 当时还是一个比较懵懂的阶段。","sentence_en":"Yeah, but how to put it... At that time I was still quite naive."},{"id":"192","start":1323.49,"end":1333.63,"displayStart":1323.49,"displayEnd":1333.63,"displayMid":1328.56,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.050069,"pitch":20.454056,"speechRate":5.424,"hasEvents":false,"sentence_source":"我觉得这就是 有些时候你经历了一些事情，如果你不明白它的话 你只是有一点感受，只有你明白了之后 你才意识到这个是一个歧视。","sentence_en":"I think sometimes you go through things without understanding them—you just feel something. Only when you understand do you realize it was discrimination."},{"id":"193","start":1333.63,"end":1348.69,"displayStart":1333.63,"displayEnd":1348.69,"displayMid":1341.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.95818,"pitch":15.93377,"speechRate":5.312,"hasEvents":true,"sentence_source":"或者你才意识到这个是一个 glass ceiling 或者是怎么样，你当时甚至是 包括女性 包括在职场的这些感觉，就是你在不清楚的状态下 你只是觉得自己没有做好 或者是自己怎么样。","sentence_en":"Or you realize it was a glass ceiling or something. At that time, including feelings about women in the workplace—when you're not clear, you just think you didn't do well enough or something."},{"id":"194","start":1349.15,"end":1354.07,"displayStart":1349.15,"displayEnd":1354.07,"displayMid":1351.6100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.4,"loudness":0.870508,"pitch":15.336542,"speechRate":4.686,"hasEvents":true,"sentence_source":"但是你一旦了解了之后 你才能再去争取自己的权利。","sentence_en":"But once you understand it, you can then fight for your rights."},{"id":"195","start":1354.07,"end":1365.89,"displayStart":1354.07,"displayEnd":1365.89,"displayMid":1359.98,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.796293,"pitch":21.44249,"speechRate":6.1,"hasEvents":false,"sentence_source":"范贝 我觉得人有时候在职场当中 不论什么性别吧，人的确内心要坚强一点 不能剥离心，就很多时候你不要把它 就是英文叫Don't take it personally。","sentence_en":"Fan Bei, I think sometimes in the workplace, 9,"displayEnd":2110.17,"displayMid":2102.7799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.9818,"pitch":23.209265,"speechRate":5.473,"hasEvents":true,"sentence_source":"我2013年的时候是去南极 在南极跑了人生第一个马拉松，而且那个经历是特别奇怪 为什么说是一个转变的，就是我去南极之前我从来也不跑步 我到现在其实说实话我也不爱跑步。","sentence_en":"In 2013, I went to Antarctica and ran my first marathon there. That experience was particularly strange—why I say it was a turning point is that before going to Antarctica, I never ran, and to be honest, I still don't like running."},{"id":"285","start":2110.17,"end":2114.25,"displayStart":2110.17,"displayEnd":2114.25,"displayMid":2112.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.078981,"pitch":21.456795,"speechRate":4.872,"hasEvents":true,"sentence_source":"然后但我一直想去南极 后来我就找了很多的。","sentence_en":"But I had always wanted to go to Antarctica, so later I looked into many options."},{"id":"286","start":2114.25,"end":2120.57,"displayStart":2114.25,"displayEnd":2120.57,"displayMid":2117.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.878555,"pitch":18.351603,"speechRate":5.222,"hasEvents":false,"sentence_source":"因为我又不想是那种坐船在南极边上转的，我想真的到南极大陆里面住上几天。","sentence_en":"Because I didn't want to just cruise around the edge of Antarctica; I wanted to actually stay on the continent for a few days."},{"id":"287","start":2120.97,"end":2125.55,"displayStart":2120.97,"displayEnd":2125.55,"displayMid":2123.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.987495,"pitch":19.725954,"speechRate":5.618,"hasEvents":false,"sentence_source":"然后我就找到了这个跑马拉松的 而且它相对来讲比较便宜。","sentence_en":"Then I found this marathon running option, and it was relatively cheap."},{"id":"288","start":2125.55,"end":2128.91,"displayStart":2125.55,"displayEnd":2128.91,"displayMid":2127.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.962133,"pitch":20.989595,"speechRate":5.423,"hasEvents":false,"sentence_source":"因为你真的就是去跑马拉松 跑完马拉松。","sentence_en":"Because you literally just go to run a marathon, finish it."},{"id":"289","start":2128.91,"end":2137.13,"displayStart":2128.91,"displayEnd":2137.13,"displayMid":2133.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.798437,"pitch":16.222826,"speechRate":6.321,"hasEvents":false,"sentence_source":"然后第二天他还有一个100公里的一个比赛，这个第三天就飞回来了，并没有什么导游啊 或者也没有什么游览的项目。","sentence_en":"Then the next day there's a 100-kilometer race, and you fly back on the third day. There's no guide or sightseeing."},{"id":"290","start":2137.13,"end":2147.43,"displayStart":2137.13,"displayEnd":2147.43,"displayMid":2142.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.927022,"pitch":21.366062,"speechRate":5.303,"hasEvents":false,"sentence_source":"所以我就报名去了，去了之后到那儿 认识了一群人，他们都是那种就很喜欢跑步的，而且呢 就是会出去到世界各个地方这么跑步。","sentence_en":"So I signed up and went. There I met a group of people who all loved running and would travel around the world to run."},{"id":"291","start":2147.43,"end":2160.03,"displayStart":2147.43,"displayEnd":2160.03,"displayMid":2153.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.7,"loudness":0.908368,"pitch":21.271122,"speechRate":5.32,"hasEvents":false,"sentence_source":"然后跟他们聊天的时候呢，我就学到了特别多东西，而且就是那种大开眼界的，以前从来不知道还有人是这么活的，你比如说他们有些人是一年做六个月的工作。","sentence_en":"While chatting with them, I learned a lot and had my eyes opened. I had never known that some people live like this. For example, some of them work six months a year."},{"id":"292","start":2160.03,"end":2172.93,"displayStart":2160.03,"displayEnd":2172.93,"displayMid":2166.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.857337,"pitch":19.471663,"speechRate":5.969,"hasEvents":false,"sentence_source":"然后剩下六个月就是做自己想做的事情，另外我在那教他的最好的一个朋友，他是一个美国的一个女孩，他就说说我给自己计划的是说，在我30岁之前我要去七大州，这是我的一个目标。","sentence_en":"Then the other six months they do what they want. Also, the best friend I made there, an American girl, said she had planned for herself: before turning 30, she wanted to visit all seven continents. That was her goal."},{"id":"293","start":2172.93,"end":2182.39,"displayStart":2172.93,"displayEnd":2182.39,"displayMid":2177.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.989772,"pitch":24.508364,"speechRate":5.214,"hasEvents":false,"sentence_source":"然后我听了之后我就觉得说，我从来都没有想过第一，你能够没有一个长期的稳定的工作，你不是说每天要去上班。","sentence_en":"After hearing that, I felt that I had never thought about it. First, you could not have a long-term stable job, you don't have to go to work every day."},{"id":"294","start":2182.39,"end":2192.07,"displayStart":2182.39,"displayEnd":2192.07,"displayMid":2187.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Negative","score":-0.4,"loudness":0.989814,"pitch":19.695242,"speechRate":4.772,"hasEvents":false,"sentence_source":"然后从一个小的职位要到一个大的职位，整个我的想法人生是限性的，不是一个能够打破这个限性而来活的。","sentence_en":"And moving from a small position to a big one—my whole idea of life was linear, not about breaking that linearity to live."},{"id":"295","start":2192.07,"end":2207.67,"displayStart":2192.07,"displayEnd":2207.67,"displayMid":2199.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.931924,"pitch":20.683758,"speechRate":4.905,"hasEvents":false,"sentence_source":"所以这个是第一个对我的触动，第二个触动是 我感觉我在那之前，我所有的想法都是要工作，要挣钱 要完成业绩 要怎么样，我从来没有想过说 有这种目标，就是30岁之前我要去七大州。","sentence_en":"So that was the first thing that struck me. The second thing was that before that, all my thoughts were about working, making money, hitting targets, and so on. I had never thought about having a goal like visiting all seven continents before 30."},{"id":"296","start":2207.67,"end":2214.09,"displayStart":2207.67,"displayEnd":2214.09,"displayMid":2210.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.877246,"pitch":18.715132,"speechRate":4.167,"hasEvents":false,"sentence_source":"然后第三个就是说，还有很多的跑步者，他是给慈善组织筹款的。","sentence_en":"And thirdly, many runners were fundraising for charitable organizations."},{"id":"297","start":2214.09,"end":2217.11,"displayStart":2214.09,"displayEnd":2217.11,"displayMid":2215.6000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":1.002993,"pitch":21.369659,"speechRate":6.642,"hasEvents":false,"sentence_source":"然后他们就告诉我说他们整个筹款的过程。","sentence_en":"And they told me about their entire fundraising process."},{"id":"298","start":2217.11,"end":2231.69,"displayStart":2217.11,"displayEnd":2231.69,"displayMid":2224.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.974401,"pitch":18.300961,"speechRate":4.87,"hasEvents":false,"sentence_source":"因为我原来也没有想过说我自己去跑个马拉松，我能跟人家用什么理由来筹款 对吧，后来听他们解释了之后 我才意识到，原来还可以通过这种形式让大家支持你这个挑战。","sentence_en":"Because I had never thought about what reason I could give to fundraise by running a marathon, right? After hearing their explanations, I realized that you could get people to support your challenge this way."},{"id":"299","start":2231.69,"end":2233.83,"displayStart":2231.69,"displayEnd":2233.83,"displayMid":2232.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.97478,"pitch":18.722364,"speechRate":4.432,"hasEvents":false,"sentence_source":"支持你的这个项目。","sentence_en":"Support your project."},{"id":"300","start":2233.83,"end":2237.47,"displayStart":2233.83,"displayEnd":2237.47,"displayMid":2235.6499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.902847,"pitch":16.800787,"speechRate":4.856,"hasEvents":false,"sentence_source":"然后为你想要支持的慈善组织做筹款。","sentence_en":"And raise funds for the charity you want to support."},{"id":"301","start":2237.47,"end":2240.31,"displayStart":2237.47,"displayEnd":2240.31,"displayMid":2238.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.071875,"pitch":20.723543,"speechRate":5.809,"hasEvents":false,"sentence_source":"所以这个三个东西是我在那学的。","sentence_en":"So those three things were what I learned there."},{"id":"302","start":2240.31,"end":2243.55,"displayStart":2240.31,"displayEnd":2243.55,"displayMid":2241.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.8,"loudness":1.124439,"pitch":22.203058,"speechRate":6.154,"hasEvents":false,"sentence_source":"对我来讲是一个完全打开了一个新的世界。","sentence_en":"For me, it completely opened up a new world."},{"id":"303","start":2243.55,"end":2253.93,"displayStart":2243.55,"displayEnd":2253.93,"displayMid":2248.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.893654,"pitch":19.196728,"speechRate":4.64,"hasEvents":false,"sentence_source":"对于我性格上的或者是我本人个人的一些改变是跑完马拉松之后天气变坏了，结果一下就是飞机飞不进来接我们。","sentence_en":"As for changes in my personality or myself personally, after finishing the marathon, the weather turned bad, so the plane couldn't fly in to pick us up."},{"id":"304","start":2253.93,"end":2256.95,"displayStart":2253.93,"displayEnd":2256.95,"displayMid":2255.4399999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.845944,"pitch":21.252893,"speechRate":6.476,"hasEvents":false,"sentence_source":"然后我们等于被困在那个地方困了五天。","sentence_en":"So we were stranded there for five days."},{"id":"305","start":2256.95,"end":2263.37,"displayStart":2256.95,"displayEnd":2263.37,"displayMid":2260.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.914305,"pitch":20.126965,"speechRate":4.222,"hasEvents":false,"sentence_source":"然后那个五天就真的是我人生第一次可以忘掉所有其他的东西。","sentence_en":"Those five days were truly the first time in my life I could forget everything else."},{"id":"306","start":2263.37,"end":2267.09,"displayStart":2263.37,"displayEnd":2267.09,"displayMid":2265.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.835711,"pitch":20.302591,"speechRate":5.256,"hasEvents":false,"sentence_source":"因为你在那个地方你也没有网 你出也出不去。","sentence_en":"Because there, you had no internet, and you couldn't leave."},{"id":"307","start":2267.09,"end":2279.43,"displayStart":2267.09,"displayEnd":2279.43,"displayMid":2273.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.887384,"pitch":19.799442,"speechRate":5.092,"hasEvents":false,"sentence_source":"然后你也没有电话 什么也没有的情况下，你每天只是能够想的 就是你今天干什么 你现在干什么，他对我的转变就是说 第一 咱们老说什么关注当下。","sentence_en":"Without a phone or anything, all you could think about each day was what you were going to do today, what you were doing now. The change it brought me was, first, we always talk about focusing on the present."},{"id":"308","start":2279.43,"end":2290.83,"displayStart":2279.43,"displayEnd":2290.83,"displayMid":2285.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.7,"loudness":0.889202,"pitch":18.154295,"speechRate":4.737,"hasEvents":false,"sentence_source":"人想要追求的一个状态 就是你不要去担心未来，你也不要去回顾过去 你要关注当下 活在当下，南极的那次经历是逼着我活在当下。","sentence_en":"The state that people want to achieve is not worrying about the future, not dwelling on the past, but focusing on the present, living in the moment. That experience in Antarctica forced me to live in the moment."},{"id":"309","start":2290.83,"end":2293.29,"displayStart":2290.83,"displayEnd":2293.29,"displayMid":2292.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.8,"loudness":0.953381,"pitch":25.639318,"speechRate":7.177,"hasEvents":false,"sentence_source":"然后你就会发现整个人特别的轻松。","sentence_en":"And you find yourself completely relaxed."},{"id":"310","start":2293.29,"end":2297.13,"displayStart":2293.29,"displayEnd":2297.13,"displayMid":2295.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.800769,"pitch":17.796196,"speechRate":5.859,"hasEvents":false,"sentence_source":"因为你每天你只用想 你今天干什么 你现在要干什么。","sentence_en":"Because each day you only need to think about what to do today, what to do now."},{"id":"311","start":2297.13,"end":2311.29,"displayStart":2297.13,"displayEnd":2311.29,"displayMid":2304.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.5,"loudness":0.950457,"pitch":22.665407,"speechRate":5.13,"hasEvents":false,"sentence_source":"然后第二呢 就是在那之前 我会有很多的焦虑是，如果我离开公司几天一个星期 那回来之后，我这工作还能做吗 我的客户万一出什么事儿，就是所有的这种没有必要的焦虑。","sentence_en":"And second, before that, I had a lot of anxiety: if I left the company for a few days or a week, when I came back, would my job still be there? What if something happened to my clients? All those unnecessary worries."},{"id":"312","start":2311.29,"end":2318.29,"displayStart":2311.29,"displayEnd":2318.29,"displayMid":2314.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.6,"loudness":1.010795,"pitch":21.685936,"speechRate":5.397,"hasEvents":false,"sentence_source":"然后在那些时间逼着自己也没法想就不想了，回来之后呢 发现世界没了我还是在赚的。","sentence_en":"During that time, forced by the situation, I couldn't think about it, so I stopped. After returning, I found that the world still went on without me."},{"id":"313","start":2318.29,"end":2323.83,"displayStart":2318.29,"displayEnd":2323.83,"displayMid":2321.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Positive","score":0.5,"loudness":1.009453,"pitch":24.210333,"speechRate":4.897,"hasEvents":false,"sentence_source":"所以就从那个之后也开始 不去有这种特别无味的这种焦虑。","sentence_en":"So from then on, I started to let go of that kind of pointless anxiety."},{"id":"314","start":2323.83,"end":2336.67,"displayStart":2323.83,"display  this Earth there is this continent with nothing on it."},{"id":"318","start":2352.99,"end":2357.73,"displayStart":2352.99,"displayEnd":2357.73,"displayMid":2355.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":0.939149,"pitch":22.306818,"speechRate":5.274,"hasEvents":false,"sentence_source":"尤其是在大陆中间 连动物也没有 也没有树 也没有任何植物。","sentence_en":"Especially in the middle of the continent, there were no animals, no trees, no plants at all."},{"id":"319","start":2357.73,"end":2370.77,"displayStart":2357.73,"displayEnd":2370.77,"displayMid":2364.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Positive","score":0.6,"loudness":0.959667,"pitch":20.258671,"speechRate":5.598,"hasEvents":false,"sentence_source":"所以对我来讲 我不知道为什么 就是觉得特别不可思议的一个地方，我一定要去看看 我就去了 当时抱了个半马 因为我真的不跑步嘛，后来到了那儿的时候呢 大家就开始聊天啊。","sentence_en":"So for me, I don’t know why, but it felt like such an incredible place that I had to see it. I went, and initially signed up for a half marathon because I really don’t run. When I got there, everyone started chatting."},{"id":"320","start":2370.77,"end":2374.53,"displayStart":2370.77,"displayEnd":2374.53,"displayMid":2372.65,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":1.166606,"pitch":25.875772,"speechRate":6.125,"hasEvents":true,"sentence_source":"然后就说 你来都来了 这非这么大劲来了 你就跑个全马。","sentence_en":"Then they said, 'Since you're here, you've come all this way, you might as well run a full marathon.'"},{"id":"321","start":2375.23,"end":2377.61,"displayStart":2375.23,"displayEnd":2377.61,"displayMid":2376.42,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":2.055007,"pitch":25.89 ck before entering the mountain, and after reaching the first high camp, I had to retreat."},{"id":"354","start":2587.19,"end":2596.13,"displayStart":2587.19,"displayEnd":2596.13,"displayMid":2591.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":0.904106,"pitch":20.255653,"speechRate":4.997,"hasEvents":false,"sentence_source":"其实那个当时也是一个，就我跟我弟弟是同样一个向导，当时在大本营我就要做一个决定，就是要不我下去。","sentence_en":"At that time, my brother and I had the same guide. At base camp, I had to decide: either I go down,"},{"id":"355","start":2596.13,"end":2600.01,"displayStart":2596.13,"displayEnd":2600.01,"displayMid":2598.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":0.703006,"pitch":17.49555,"speechRate":5.412,"hasEvents":false,"sentence_source":"然后我弟弟还有机会爬，要不我跟我弟弟一块上去。","sentence_en":"and my brother still gets a chance to climb, or we go up together."},{"id":"356","start":2600.01,"end":2607.65,"displayStart":2600.01,"displayEnd":2607.65,"displayMid":2603.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Positive","score":0.7,"loudness":0.853003,"pitch":13.254406,"speechRate":5.405,"hasEvents":false,"sentence_source":"但是如果下来就得两个人一起下来，后来 最后还是决定让他去爬了，他最后登顶了 所以还挺开心的。","sentence_en":"But if I came down, we both had to come down. In the end, I decided to let him go. He summited, so I was really happy."},{"id":"357","start":2607.65,"end":2609.89,"displayStart":2607.65,"displayEnd":2609.89,"displayMid":2608.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Marathon Related","sentiment_en":"Neutral","score":0,"loudness":1.091488,"pitch":25.848486,"speechRate":5.14,"hasEvents":true,"sentence_source":"所以你有可能成为七家二?","sentence_en":"So, could you become a Seven Summits + Two echRate":5.676,"hasEvents":false,"sentence_source":"你会脱离远离所有你生活中其他的杂事。","sentence_en":"I get away from all the other distractions in my life."},{"id":"374","start":2719.17,"end":2727.57,"displayStart":2719.17,"displayEnd":2727.57,"displayMid":2723.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.6,"loudness":0.790077,"pitch":19.795687,"speechRate":5.662,"hasEvents":false,"sentence_source":"然后你有自己的时间去思考，同时在这个过程当中，经历的一些事情会让你最后对自己有一些认识，有一些了解。","sentence_en":"Then you have your own time to think, and in the process, the things you experience eventually give you some self-awareness and understanding."},{"id":"375","start":2727.57,"end":2737.95,"displayStart":2727.57,"displayEnd":2737.95,"displayMid":2732.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.7,"loudness":0.898785,"pitch":20.562773,"speechRate":5.922,"hasEvents":false,"sentence_source":"我觉得这个是很有意思的，就是你就通过这些事情，你能够更多的了解自己，你要原来我还是这样的人，或者原来我还会这么想，这个是我比较喜欢的。","sentence_en":"I think that's really interesting. Through these things, you can learn more about yourself—like, 'Oh, I'm actually this kind of person' or 'I never thought I would think this way.' That's what I like."},{"id":"376","start":2737.95,"end":2749.23,"displayStart":2737.95,"displayEnd":2749.23,"displayMid":2743.59,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":1.084264,"pitch":23.165045,"speechRate":4.965,"hasEvents":false,"sentence_source":"解自己相对容易 要接受，比如说我就非常明白我可以坦然的面对，比如说我不是属于那种我会被纯自然的环境，所觉得兴奋的那样的人。","sentence_en":"Understanding yourself is relatively easy; accepting it is the hard part. For example, I know very well that I can face it calmly—I'm not the kind of person who gets e eel helpless."},{"id":"414","start":3009.21,"end":3018.91,"displayStart":3009.21,"displayEnd":3018.91,"displayMid":3014.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.6,"loudness":0.785118,"pitch":17.592262,"speechRate":4.262,"hasEvents":true,"sentence_source":"所以有一段时间很低落，而且后来要吃鸡素嘛 吃了一年鸡素，整个副作用非常的强，就是恶心 头晕。","sentence_en":"So I was really down for a while, and later I had to take chicken essence for a year. The side effects were very strong—nausea and dizziness."},{"id":"415","start":3019.41,"end":3022.33,"displayStart":3019.41,"displayEnd":3022.33,"displayMid":3020.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.4,"loudness":0.699435,"pitch":18.776367,"speechRate":5.545,"hasEvents":true,"sentence_source":"然后整个人也都是那种服种的状态。","sentence_en":"And I was in a kind of resigned state overall."},{"id":"416","start":3022.33,"end":3033.13,"displayStart":3022.33,"displayEnd":3033.13,"displayMid":3027.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Neutral","score":0,"loudness":0.894892,"pitch":18.967117,"speechRate":4.442,"hasEvents":false,"sentence_source":"所以后来把激素也停了，我现在是这样 就是停了激素之后，大夫跟我说还有一种新的药 是生物之际，是要打针的。","sentence_en":"So later I stopped the steroids. Now, after stopping steroids, the doctor told me there was a new drug—a biologic—that required injections."},{"id":"417","start":3033.13,"end":3039.65,"displayStart":3033.13,"displayEnd":3039.65,"displayMid":3036.3900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Neutral","score":0,"loudness":0.747355,"pitch":14.201727,"speechRate":5.515,"hasEvents":false,"sentence_source":"然后要每两个星期打一针，它也是维持 它也不是治愈，这只副是没有激素的副作用。","sentence_en":"And I needed an injection every two weeks. It's also maintenance, not a cure. But it doesn't have the side effects of steroids."},{"id":"418","start":3039.65,"end":3042.27,"displayStart":3039.65,"displayEnd":3042.27,"displayMid":3040.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.3,"loudness":0.959507,"pitch":24.172668,"speechRate":5.263,"hasEvents":false,"sentence_source":"那个时候呢 这个药还没有医保。","sentence_en":"At that time, this drug was not covered by insurance."},{"id":"419","start":3042.27,"end":3046.97,"displayStart":3042.27,"displayEnd":3046.97,"displayMid":3044.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.4,"loudness":0.863713,"pitch":23.066628,"speechRate":5.687,"hasEvents":false,"sentence_source":"所以这个要非常的贵 这一针大概是8000块钱人民币。","sentence_en":"So it was very expensive—about 8,000 RMB per injection."},{"id":"420","start":3046.97,"end":3053.75,"displayStart":3046.97,"displayEnd":3053.75,"displayMid":3050.3599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.3,"loudness":0.790932,"pitch":20.401325,"speechRate":4.921,"hasEvents":false,"sentence_source":"然后你要两周打一针 而且是没有头的，不是说你在一个月或者三个月辽城。","sentence_en":"And you had to have it every two weeks with no end—it's not like a one-month or three-month course."},{"id":"421","start":3053.75,"end":3058.27,"displayStart":3053.75,"displayEnd":3058.27,"displayMid":3056.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.72085,"pitch":15.492983,"speechRate":4.425,"hasEvents":false,"sentence_source":"所以当时我也是考虑了挺久的 也是跟我父母谈。","sentence_en":"So I thought about it for a long time and discussed it with my parents."},{"id":"422","start":3058.27,"end":3068.73,"displayStart":3058.27,"displayEnd":3068.73,"displayMid":3063.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.897624,"pitch":18.552404,"speechRate":5.643,"hasEvents":false,"sentence_source":"但是最后就觉得 只要是还打得起的时候就先打着，打不起了再说 所以就开始打这个针，而打这针也特别逗 一开始的时候是那种静脉注射的针。","sentence_en":"But in the end, I thought, as long as I can afford it, I'll keep taking it. If I can't afford it later, we'll figure it out then. So I started the injections. And it was funny—at first, it was an intravenous injection."},{"id":"423","start":3068.73,"end":3082.61,"displayStart":3068.73,"displayEnd":3082.61,"displayMid":3075.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.4,"loudness":1.036092,"pitch":21.889357,"speechRate":4.949,"hasEvents":false,"sentence_source":"然后我就发现我拿着那个针 我真的扎不下去 就给自己打针，真的是 你觉得你看别人给你打针没关系 你给自己打针 你试试，真的是不敢 还逼着自己开始学打针。","sentence_en":"And I realized that when I held the needle, I really couldn't bring myself to inject myself. You think watching someone else give you a shot is fine, but try giving it to yourself—you really don't dare. I had to force myself to learn how to inject."},{"id":"424","start":3082.61,"end":3095.61,"displayStart":3082.61,"displayEnd":3095.61,"displayMid":3089.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.833499,"pitch":18.712107,"speechRate":5.154,"hasEvents":false,"sentence_source":"然后后来第二天就不疼了 第二天不疼的时候，我到现在我都记得当时的想法 就是我已经好多年没有早晨起来，哪里不疼的状态了所以，就是那个感觉特别的新鲜。","sentence_en":"Then the next day, the pain was gone. When it didn't hurt the next day, I still remember my thought at that moment: I hadn't woken up in the morning without pain anywhere for years. That feeling was so fresh."},{"id":"425","start":3095.61,"end":3098.91,"displayStart":3095.61,"displayEnd":3098.91,"displayMid":3097.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.6,"loudness":0.980978,"pitch":22.752228,"speechRate":4.242,"hasEvents":false,"sentence_source":"就是感觉已经跳出来自己的身体。","sentence_en":"It felt like I had jumped out of my own body."},{"id":"426","start":3098.91,"end":3103.83,"displayStart":3098.91,"displayEnd":3103.83,"displayMid":3101.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.7,"loudness":1.020056,"pitch":19.269003,"speechRate":5.579,"hasEvents":false,"sentence_source":"然后就看着这个身体就觉得这是一个全新的一个身体的感觉。","sentence_en":"And then looking at this body, it felt like a brand new body."},{"id":"427","start":3103.83,"end":3119.57,"displayStart":3103.83,"displayEnd":3119.57,"displayMid":3111.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.5,"loudness":1.138618,"pitch":20.646502,"speechRate":4.239,"hasEvents":false,"sentence_source":"那之后我又本着这个直回票价的想法就开始各种运动，既然不疼了 打了这么的贵的针 一定得把它给直回了对，我后来在英国的时候 我参加了一个超码的比赛。","sentence_en":"After that, with the mindset of getting my money's worth, I began various sports. Since the pain was gone after such expensive injections, I had to make it worth it. Later, when I was in the UK, I participated in a super marathon competition."},{"id":"428","start":3119.57,"end":3130.83,"displayStart":3119.57,"displayEnd":3130.83,"displayMid":3125.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.803671,"pitch":17.826336,"speechRate":5.062,"hasEvents":false,"sentence_source":"然后那个比赛我就是给在英国这边的强直的一个慈善机构 穆娟的，通过他们 我才意识到 因为自己我只是一个个体 我有特别特殊的情况。","sentence_en":"And that race I did was to raise money for an ankylosing spondylitis charity here in the UK. Through them, I realized that as an individual, I have a very unique situation."},{"id":"429","start":3130.83,"end":3143.15,"displayStart":3130.83,"displayEnd":3143.15,"displayMid":3136.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.3,"loudness":0.859615,"pitch":18.844961,"speechRate":5.3,"hasEvents":false,"sentence_source":"但是通过他们 我才学习到很多东西 就是这个病吧，它其实还有一个很大的问题 就是别人看不出来，你的所有的疼 所有的症状 都是你自己体会 外人看不出来。","sentence_en":"But through them, I learned a lot. This disease has a big problem: others can't see it. All the pain and symptoms are felt only by you; outsiders can't see them."},{"id":"430","start":3143.15,"end":3147.75,"displayStart":3143.15,"displayEnd":3147.75,"displayMid":3145.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.4,"loudness":1.004753,"pitch":24.309328,"speechRate":5.963,"hasEvents":false,"sentence_source":"所以它没办法理解你 所以就很多人就觉得你是个关节眼。","sentence_en":"So they can't understand you, and many people think you're just faking it."},{"id":"431","start":3147.75,"end":3159.67,"displayStart":3147.75,"displayEnd":3159.67,"displayMid":3153.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.5,"loudness":0.736378,"pitch":19.337259,"speechRate":4.949,"hasEvents":false,"sentence_source":"然后或者是什么 就是你就腰疼 你有什么该上班还上班 对吧，我那个时候发病的时候动都动不了的，就是一点力气都没有，我是站都站不起来。","sentence_en":"Or they think, 'It's just back pain, you should still go to work,' right? But when I had a flare-up, I couldn't move at all—I had no strength, I couldn't even stand up."},{"id":"432","start":3159.67,"end":3164.47,"displayStart":3159.67,"displayEnd":3164.47,"displayMid":3162.0699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Negative","score":-0.3,"loudness":0.844156,"pitch":20.854406,"speechRate":5.656,"hasEvents":false,"sentence_source":"但是呢 外人看不出来，不像你断个胳膊断个腿，人都能看出来。","sentence_en":"But to outsiders, it's invisible—unlike a broken arm or leg that everyone can see."},{"id":"433","start":3165.11,"end":3169.47,"displayStart":3165.11,"displayEnd":3169.47,"displayMid":3167.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical illness","sentiment_en":"Positive","score":0.4,"loudness":0.997015,"pitch":23.112194,"speechRate":5.651,"hasEvents":false,"sentence_source":"所以这一点呢 就是特别需要，大家更多的去讨论这个病。","sentence_en":"So that's why it's especially important for more people to talk about this disease."},{"id":"434","start":3169.47,"end":3172.15,"displayStart":3169.47,"displayEnd":3172.15,"displayMid":3170.81,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.4,"loudness":0.610848,"pitch":18.654312,"speechRate":5.224,"hasEvents":false,"sentence_source":"然后更加让更多人知道这个病范。","sentence_en":"And to make more people aware of it."},{"id":"435","start":3172.15,"end":3178.37,"displayStart":3172.15,"displayEnd":3178.37,"displayMid":3175.26,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":1.012107,"pitch":23.707777,"speechRate":4.394,"hasEvents":false,"sentence_source":"贝 那你在生病的那段时间，也正好是你在工作也相当忙碌的时候。","sentence_en":"Bei, during that time you were sick, you were also really busy with work."},{"id":"436","start":3178.37,"end":3180.07,"displayStart":3178.37,"displayE .87,"displayEnd":3216.81,"displayMid":3210.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.5,"loudness":0.873404,"pitch":18.38356,"speechRate":4.791,"hasEvents":false,"sentence_source":"但是我相信如果我不能运动了，我也会再找其他的东西，就是让这个事情变成我生活中的一部分，是变成一个常态 而不是说我时刻要想着就受它控制。","sentence_en":"But I believe if I couldn't exercise anymore, I'd find something else to make it part of my life—a normal routine, not constantly thinking about being controlled by it."},{"id":"441","start":3216.81,"end":3220.89,"displayStart":3216.81,"displayEnd":3220.89,"displayMid":3218.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.4,"loudness":0.9203,"pitch":19.03406,"speechRate":5.584,"hasEvents":false,"sentence_source":"而是我是想尽量去控制它 那个时候更多的想的就是。","sentence_en":"I wanted to control it as much as possible. Back then, I mostly thought about..."},{"id":"442","start":3220.89,"end":3226.45,"displayStart":3220.89,"displayEnd":3226.45,"displayMid":3223.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Negative","score":-0.4,"loudness":0.887726,"pitch":16.367146,"speechRate":7.194,"hasEvents":false,"sentence_source":"因为最脆弱的时候 其实你就是自己可怜自己，就 feel sorry for yourself。","sentence_en":"Because when you're at your most vulnerable, you just feel sorry for yourself."},{"id":"443","start":3226.45,"end":3227.39,"displayStart":3226.45,"displayEnd":3227.39,"displayMid":3226.92,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.487697,"pitch":14.722526,"speechRate":2.128,"hasEvents":false,"sentence_source":"所以。","sentence_en":"So."},{"id":"444","start":3227.39,"end ns. When is the right time to leave? Everyone says, 'It's never too late."},{"id":"463","start":3357.81,"end":3369.11,"displayStart":3357.81,"displayEnd":3369.11,"displayMid":3363.46,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":1.045142,"pitch":21.10437,"speechRate":5.761,"hasEvents":false,"sentence_source":"但这话说起来很容易，但其实每时每刻你都会觉得，40岁是不是太晚了 50岁是不是太晚了，总会有某个太晚的时刻吗，但你好像一直处理得很好所有。","sentence_en":"But that's easy to say. In reality, you constantly wonder: Is 40 too late? Is 50 too late? Is there always a point where it's too late? But you seem to handle it well."},{"id":"464","start":3369.11,"end":3383.39,"displayStart":3369.11,"displayEnd":3383.39,"displayMid":3376.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Positive","score":0.5,"loudness":0.935837,"pitch":18.390251,"speechRate":4.902,"hasEvents":false,"sentence_source":"的处理的好都是事后助个量 对吧，所有的处理的好都是因为事后看着，觉得你当时做的这个决定是对的其实，我现在感悟下来就是做决定，就是要有勇气做决定 你怎么走。","sentence_en":"The 'handling well' is always judged in hindsight, right? It's only after the fact that you think the decision was right. Right now, I feel that making a decision just requires courage—just go for it."},{"id":"465","start":3383.39,"end":3394.51,"displayStart":3383.39,"displayEnd":3394.51,"displayMid":3388.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Emotion Management and Life Reflections","sentiment_en":"Neutral","score":0,"loudness":0.878546,"pitch":18.88423,"speechRate":5.966,"hasEvents":false,"sentence_source":"那时候我有一个朋友跟我举例子 他说就像打游戏，你可以进左边这个门 你可以进右边那个门，你唯一需要做的选择就是选择还是选右 进了门之后就接着打。","sentence_en":"A friend once gave me an example: it's like playing a game. You can enter the left door or the right door. The only choice you have to make is left or right. Once you enter, yo r I joked and said it was my midlife crisis, I needed a change of path."},{"id":"505","start":3671.35,"end":3682.83,"displayStart":3671.35,"displayEnd":3682.83,"displayMid":3677.09,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.96126,"pitch":18.754448,"speechRate":4.887,"hasEvents":false,"sentence_source":"但是其实我心里面知道 真的就是那个之后觉得没有什么不可能的了，但好就好在人生还很漫长 还有很多的机会 可以不断的在改正。","sentence_en":"But deep down I knew it was because after that, I felt nothing was impossible. The good thing is life is long, and there are many chances to keep correcting."},{"id":"506","start":3682.83,"end":3685.87,"displayStart":3682.83,"displayEnd":3685.87,"displayMid":3684.35,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Positive","score":0.8,"loudness":1.112982,"pitch":24.642248,"speechRate":5.772,"hasEvents":false,"sentence_source":"这个特别重要 就是说的那个永远都不晚。","sentence_en":"That's especially important — it's never too late."},{"id":"507","start":3685.87,"end":3698.99,"displayStart":3685.87,"displayEnd":3698.99,"displayMid":3692.43,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Intergenerational relationships and emotions","sentiment_en":"Negative","score":-0.4,"loudness":1.079692,"pitch":24.848679,"speechRate":5.862,"hasEvents":false,"sentence_source":"但是我们会有一个先天的认知就会觉得 人到了某一个阶段，就你就可以停下步伐了 比如说到了50岁或者多少岁，大家会有这么一个紧迫感 总觉得这个钟在旁边 你没有多长时间了。","sentence_en":"But we have an inherent belief that at a certain stage, you can stop moving forward — say, at 50 or some age. Everyone feels this urgency, as if the clock is ticking and you don't have much time."},{"id":"508","start":3698.99,"end":3701.93,"displayStart":3698.99,"displayEnd":3701.93,"displayMid":3700.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster :"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.994819,"pitch":21.599442,"speechRate":4.212,"hasEvents":false,"sentence_source":"那你说你50岁的时候，人家告诉你说你还有50年要活，你怎么过呢，比如原来说的是60岁退休，70岁就差不多准备要杀手人还了。","sentence_en":"So when you're 50 and someone tells you you have 50 more years to live, how do you live? Originally, you'd retire at 60 and be ready to... by 70."},{"id":"513","start":3733.07,"end":3743.23,"displayStart":3733.07,"displayEnd":3743.23,"displayMid":3738.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.109449,"pitch":21.875139,"speechRate":4.455,"hasEvents":false,"sentence_source":"但是现在发现你50岁的时候，你接下来需要过的生活，比你之前活的还要多，比你之前的成人的生活还要长。","sentence_en":"But now you realize that at 50, the life ahead of you is longer than what you've already lived — longer than your adult life so far."},{"id":"514","start":3743.23,"end":3754.35,"displayStart":3743.23,"displayEnd":3754.35,"displayMid":3748.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.6,"loudness":0.896066,"pitch":20.786957,"speechRate":5.221,"hasEvents":false,"sentence_source":"那这个时候你做什么 你怎么去规划 所以把时间放在这个维度之后，你就会发现你就没有什么 什么也都不晚了 或者是什么做什么决定。","sentence_en":"So what do you do? How do you plan? When you put time in that perspective, you realize nothing is too late, and any decision is okay."},{"id":"515","start":3754.35,"end":3766.05,"displayStart":3754.35,"displayEnd":3766.05,"displayMid":3760.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.7,"loudness":0.803346,"pitch":19.677483,"speechRate":6.109,"hasEvents":false,"sentence_source":"你就现在做决定 你还有50年的时间 要不就改 要不就发展 要不就怎么样 就是，你都说不了 谁也不能说我就做了一个错的决定 10年之后可能这是一个正确的决定。","sentence_en":"Make a decision now — you have 50 years. Either change, develop, or whatever. You can't say you made a wrong decision; ten years later it might turn out to be the right one."},{"id":"516","start":3766.05,"end":3772.91,"displayStart":3766.05,"displayEnd":3772.91,"displayMid":3769.48,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.927693,"pitch":22.306801,"speechRate":5.295,"hasEvents":false,"sentence_source":"是 因为人生你要放在一个人生漫长的这样一个旅程下去考虑 怎么叫成怎么叫不成。","sentence_en":"Yes, because you have to consider life as a long journey. What counts as success or failure?"},{"id":"517","start":3772.91,"end":3777.07,"displayStart":3772.91,"displayEnd":3777.07,"displayMid":3774.99,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":1.088767,"pitch":24.84959,"speechRate":5.905,"hasEvents":false,"sentence_source":"因为它不是结局 所以你不知道还有没有第二张第三张。","sentence_en":"Because it's not an ending; you don't know if there's a second or third act."},{"id":"518","start":3777.07,"end":3778.91,"displayStart":3777.07,"displayEnd":3778.91,"displayMid":3777.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Positive","score":0.5,"loudness":0.733714,"pitch":13.909151,"speechRate":4.348,"hasEvents":false,"sentence_source":"对 所以活在当下吗。","sentence_en":"Right, so live in the moment."},{"id":"519","start":3778.91,"end":3783.01,"displayStart":3778.91,"displayEnd":3783.01,"displayMid":3780.96,"speaker":"Fan Beibei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Career experience","sentiment_en":"Neutral","score":0,"loudness":0.941389,"pitch":25.145044,"speechRate":6.274,"hasEvents":false,"sentence_source":"是 对我自己来说 我跟你不一样 就我没有换过那么多的工作。","sentence_en":"For me personally, I'm different from you — I haven't changed jobs that many times."},{"id":"520","start":3783.01,"end":3
