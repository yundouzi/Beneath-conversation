n I was a kid, I thought, wow, Chinese characters are so magical, beautiful, and vivid. The phrase 'barefoot doctor'—the two characters 'barefoot'—instantly make you understand all the attributes behind the profession: both professional and non-professional."},{"id":"78","start":450.45,"end":457.69,"displayStart":450.45,"displayEnd":457.69,"displayMid":454.07,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":1.088499,"pitch":26.401455,"speechRate":5.908,"hasEvents":false,"sentence_source":"然后又那么的贴近生活，你明白他除了行业以外，还要做很多跟医学没有太多关系的，可能农活是的。","sentence_en":"And it's so close to life. You understand that beyond the medical field, they also had to do many things not really related to medicine, like farm work."},{"id":"79","start":457.69,"end":462.61,"displayStart":457.69,"displayEnd":462.61,"displayMid":460.15,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.723845,"pitch":25.87817,"speechRate":5.488,"hasEvents":false,"sentence_source":"这个我们对医生的理解，如果你真的对赤脚医生能够理解的全面。","sentence_en":"This is our understanding of doctors. If you can truly understand barefoot doctors comprehensively,"},{"id":"80","start":462.61,"end":464.97,"displayStart":462.61,"displayEnd":464.97,"displayMid":463.79,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive","score":0.5,"loudness":0.719212,"pitch":15.459253,"speechRate":7.862,"hasEvents":false,"sentence_source":"其实对医生也是一个特别全面的理解。","sentence_en":"then it's also a very comprehensive understanding of doctors."},{"id":"81","start":464.97,"end":466.43,"displayStart":464.97,"displayEnd":466.43,"displayMid":465.70000000000005,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patie sentence_source":"然后你再继续解下一个case。","sentence_en":"Then you move on to the next case."},{"id":"146","start":825.27,"end":835.71,"displayStart":825.27,"displayEnd":835.71,"displayMid":830.49,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive","score":0.5,"loudness":0.717976,"pitch":21.90884,"speechRate":4.412,"hasEvents":false,"sentence_source":"其实每一个病人 甚至每一个同事，甚至我们手术室里面推车的大妈都会参与我们人生观 世界观，进一步的形成。","sentence_en":"Actually, every patient, every colleague, even the aunt pushing the cart in the operating room, all contribute to shaping our outlook on life and worldview."},{"id":"147","start":835.71,"end":846.19,"displayStart":835.71,"displayEnd":846.19,"displayMid":840.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.828091,"pitch":21.095631,"speechRate":5.539,"hasEvents":false,"sentence_source":"一点的你就成为今天这样一个人了，你知道在我们成长期间其实还是有一些先入为主的刻板印象，比如觉得男生学理科可能会好于女生。","sentence_en":"Little by little, you become the person you are today. You know, growing up, there are some preconceived stereotypes, like thinking boys are better at science than girls."},{"id":"148","start":846.19,"end":848.31,"displayStart":846.19,"displayEnd":848.31,"displayMid":847.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":1.001502,"pitch":24.711477,"speechRate":6.813,"hasEvents":false,"sentence_source":"然后女生可能适合文科或者外语。","sentence_en":"And that girls might be better suited for liberal arts or foreign languages."},{"id":"149","start":848.31,"end":851.91,"displayStart":848.31,"displayEnd":851.91,"displayMid":850.1099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.9629,"pitch":23.472191,"speechRate":5.997,"hasEvents":false,"sentence_source":"那我不知道在你们医学这个领域里面会有这样。","sentence_en":"So I wonder if in your medical field there's something like that."},{"id":"150","start":851.91,"end":855.77,"displayStart":851.91,"displayEnd":855.77,"displayMid":853.8399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.988523,"pitch":20.317459,"speechRate":5.774,"hasEvents":false,"sentence_source":"因为性别而产生的某种先入为主的一个刻板印象吗。","sentence_en":"A preconceived stereotype based on gender?"},{"id":"151","start":855.77,"end":867.45,"displayStart":855.77,"displayEnd":867.45,"displayMid":861.61,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.766612,"pitch":22.611237,"speechRate":4.573,"hasEvents":false,"sentence_source":"我觉得很多行业可能对女生都会有一些限制，或者认为女生做不好 以男生为主的，例如建筑 律师 可能他们刻板印象都是男生。","sentence_en":"I think many industries have restrictions on women, or think women can't do well in male-dominated fields like architecture or law—their stereotype is that those are for men."},{"id":"152","start":867.45,"end":872.91,"displayStart":867.45,"displayEnd":872.91,"displayMid":870.1800000000001,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive","score":0.5,"loudness":0.945867,"pitch":27.904554,"speechRate":4.171,"hasEvents":false,"sentence_source":"但是医院里女生还是一个不错的职业，她相对的女。","sentence_en":"But in hospitals, being a woman is still a good career; it's relatively female-friendly."},{"id":"153","start":872.91,"end":874.53,"displayStart":872.91,"displayEnd":874.53,"displayMid":873.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive"," :"别歧视问题还是少，就刻板印象没有造成太多的你们职业前进当中的一些障碍。","sentence_en":"Gender discrimination is still rare, so stereotypes haven't caused too many obstacles in career advancement."},{"id":"158","start":895.99,"end":910.93,"displayStart":895.99,"displayEnd":910.93,"displayMid":903.46,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.728316,"pitch":19.867737,"speechRate":5.221,"hasEvents":false,"sentence_source":"但这也就要求我们要和男生一样战斗，但其实女医生要想做的和男医生差不多，女医生复处的东西是更多的，例如一个月男生可以战到30天，当我们女医生一个月可能有几天来大姨妈了。","sentence_en":"But that also requires us to fight like men. Actually, for female doctors to achieve as much as male doctors, they have to sacrifice more. For example, a man can work 30 days a month, but a female doctor may have a few days of menstruation."},{"id":"159","start":910.93,"end":913.01,"displayStart":910.93,"displayEnd":913.01,"displayMid":911.97,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Negative","score":-0.3,"loudness":0.804581,"pitch":20.774605,"speechRate":6.731,"hasEvents":false,"sentence_source":"生理期了 可能身体就不那么舒适。","sentence_en":"During her period, she may not feel physically well."},{"id":"160","start":913.01,"end":927.37,"displayStart":913.01,"displayEnd":927.37,"displayMid":920.19,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.753241,"pitch":20.738495,"speechRate":5.254,"hasEvents":false,"sentence_source":"但是该排手术你就是要上手术的，该值班你就是要值班的，没有人在安排工作的时候会问你会不会大姨妈不舒服啊，或者会问你什么，还有我们在职场过程中还要生孩子 要怀孕。","sentence_en":"But when it's time for surgery, you have to do it; when it's time for duty, you have to be on duty. No one asks if you're uncomfortable on your period or anything. Also, in the workplace, we have to get pregnant and give birth."},{"id":"161", any of us PUMCH residents only went home three weekends a month; the rest of the time we stayed in the resident dorm—truly living at the hospital."},{"id":"244","start":1418.93,"end":1432.59,"displayStart":1418.93,"displayEnd":1432.59,"displayMid":1425.76,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.799431,"pitch":21.480463,"speechRate":4.616,"hasEvents":false,"sentence_source":"所以那时候我们租个房子也都是周末 两个人才回去，平时我住宿舍 他上班然后就出差，这种生活节奏持续了很久，一直到我是做了一年的实习医生。","sentence_en":"So at that time, we rented a house and only went back on weekends. I lived in the dormitory during the week, while he worked and traveled on business. This lifestyle continued for a long time until I completed my one-year internship as a doctor."},{"id":"245","start":1432.59,"end":1434.61,"displayStart":1432.59,"displayEnd":1434.61,"displayMid":1433.6,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.794695,"pitch":26.147514,"speechRate":7.283,"hasEvents":false,"sentence_source":"然后我又做了三年的住院医生。","sentence_en":"Then I worked as a resident for three more years."},{"id":"246","start":1434.61,"end":1438.37,"displayStart":1434.61,"displayEnd":1438.37,"displayMid":1436.4899999999998,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.5,"loudness":0.695312,"pitch":20.168699,"speechRate":5.053,"hasEvents":false,"sentence_source":"然后我就考博士了，又通过四年把博士念完了。","sentence_en":"Then I took the doctoral exam and finished my PhD in four years."},{"id":"247","start":1438.37,"end":1443.03,"displayStart":1438.37,"displayEnd":1443.03,"displayMid":1440.6999999999998,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience", 6,"speechRate":5.421,"hasEvents":false,"sentence_source":"我们在写《只有医生知道》的时候也写到，就是说小孩儿 我们当时就写了一句泰格尔的史，说人世间任何美好的东西从不独来，他伴随着一切同来，一个小孩儿 他这么美好 他不是自己来的。","sentence_en":"When we wrote 'Only Doctors Know,' we included a line from Tagore: that nothing beautiful comes alone in this world—it comes with everything else. A child, so beautiful, doesn't come by itself."},{"id":"252","start":1468.67,"end":1481.23,"displayStart":1468.67,"displayEnd":1481.23,"displayMid":1474.95,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Negative","score":-0.3,"loudness":0.802405,"pitch":26.479677,"speechRate":5.598,"hasEvents":false,"sentence_source":"他落地以后 你要有阿姨，像我们也不可能补上班了 去照顾孩子，可能还有父母的帮忙 婆婆的公公，以前我们都不发生密切接触的人，一下子都要放在一个特别狭窄的空间。","sentence_en":"Once the baby arrives, you need a nanny—we can't quit our jobs to care for the child. There might also be help from parents, in-laws, people we weren't close with before, all suddenly squeezed into a very tight space."},{"id":"253","start":1481.23,"end":1487.57,"displayStart":1481.23,"displayEnd":1487.57,"displayMid":1484.4,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.778386,"pitch":20.359995,"speechRate":5.363,"hasEvents":false,"sentence_source":"然后矛盾也会集中式的爆发，一定是水道去乘吧 各方面条件 自己的心理也成熟了。","sentence_en":"Then conflicts would erupt intensively—it's like water finding its channel. By then, all conditions and our own psychology had matured."},{"id":"254","start":1487.57,"end":1499.85,"displayStart":1487.57,"displayEnd":1499.85,"displayMid":1493.71,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive","score":0.6,"loudness":0.805448,"pitch":21.803518,"speechRate":5.238,"hasEvents":false,"sentence_source":"然后两个人相处了这么多年 也稳定了，将来大风大浪都能协守走过了，还有就是有个小房了 然后我们才打算怀孕，你当时对于你的事业规划是什么。","sentence_en":"After being together for so many years, we were stable, able to weather any storm. And we had a small apartment. Only then did we plan to get pregnant. What was your career plan at that time?"},{"id":"255","start":1499.85,"end":1503.99,"displayStart":1499.85,"displayEnd":1503.99,"displayMid":1501.92,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.878905,"pitch":23.362316,"speechRate":5.457,"hasEvents":false,"sentence_source":"我们的事业规划就很清楚，例如我先做住院医师。","sentence_en":"Our career plan was very clear. For example, I first became a resident."},{"id":"256","start":1503.99,"end":1507.37,"displayStart":1503.99,"displayEnd":1507.37,"displayMid":1505.6799999999998,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Positive","score":0.5,"loudness":0.885968,"pitch":20.495033,"speechRate":5.405,"hasEvents":false,"sentence_source":"然后我要把我的学位 把博士至少要读完了。","sentence_en":"Then I had to at least finish my PhD."},{"id":"257","start":1507.37,"end":1510.95,"displayStart":1507.37,"displayEnd":1510.95,"displayMid":1509.1599999999999,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.972717,"pitch":25.762413,"speechRate":5.76,"hasEvents":false,"sentence_source":"然后我做完住院医师 我就要做住院总医师。","sentence_en":"After finishing residency, I would become chief resident."},{"id":"258","start":1510.95,"end":1514.01,"displayStart":1510.95,"displayEnd":1514.01,"displayMid":1512.48,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.882662,"pitch":20.817129,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后我就组织医师 然后我就副主任医师。","sente ey're afraid of upsetting the patient..."},{"id":"313","start":1857.85,"end":1862.31,"displayStart":1857.85,"displayEnd":1862.31,"displayMid":1860.08,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.962508,"pitch":21.293415,"speechRate":5.034,"hasEvents":false,"sentence_source":"可能医生在传达消息的时候，医生在交代病情的时候。","sentence_en":"Maybe when doctors are delivering news, when they're explaining the condition."},{"id":"314","start":1862.31,"end":1864.67,"displayStart":1862.31,"displayEnd":1864.67,"displayMid":1863.49,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Negative","score":-0.3,"loudness":0.853209,"pitch":21.445467,"speechRate":5.66,"hasEvents":false,"sentence_source":"因为医生总是要交代坏消息。","sentence_en":"Because doctors always have to deliver bad news."},{"id":"315","start":1864.67,"end":1870.09,"displayStart":1864.67,"displayEnd":1870.09,"displayMid":1867.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":1.198695,"pitch":25.651951,"speechRate":6.936,"hasEvents":false,"sentence_source":"医生一定要把最坏的先跟你讲，你知道我碰到一个特别陡 很多年前，我就说哪个医院了。","sentence_en":"Doctors must tell you the worst first. You know, I had a very blunt experience many years ago. I won't name the hospital."},{"id":"316","start":1870.09,"end":1874.43,"displayStart":1870.09,"displayEnd":1874.43,"displayMid":1872.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":1.061276,"pitch":21.447445,"speechRate":4.839,"hasEvents":false,"sentence_source":"然后就常规的检查，就拍片子然后胸哪都照了一下。","sentence_en":"Then a routine check, X-rays, chest scan—just everything."},{"id":"317","start":1874.43,"end":1884.6 ays be as tough and competitive as you were at 30. You need to know the limits of your body and what you'll face."},{"id":"436","start":2727.17,"end":2736.57,"displayStart":2727.17,"displayEnd":2736.57,"displayMid":2731.87,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Lifestyle suitable for women","sentiment_en":"Positive","score":0.5,"loudness":0.699786,"pitch":22.241598,"speechRate":4.681,"hasEvents":false,"sentence_source":"但是你有办法 我怎么适当做检法，我怎么去求助医学或者求助一些生活方式的管理和改善让自己变得好。","sentence_en":"But you have ways: how to do proper check-ups, how to seek medical help or lifestyle management to improve yourself."},{"id":"437","start":2736.57,"end":2744.93,"displayStart":2736.57,"displayEnd":2744.93,"displayMid":2740.75,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Lifestyle suitable for women","sentiment_en":"Positive","score":0.6,"loudness":0.762304,"pitch":20.885351,"speechRate":5.531,"hasEvents":false,"sentence_source":"所以我觉得这个过程中我们医生还是要继续的去输出，通过各种方式和自己的同龄人携手向前走就是稳。","sentence_en":"So I think during this process, we doctors must continue to contribute, through various means, and walk forward hand in hand with our peers—steadily."},{"id":"438","start":2744.93,"end":2753.37,"displayStart":2744.93,"displayEnd":2753.37,"displayMid":2749.1499999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Lifestyle suitable for women","sentiment_en":"Neutral","score":0,"loudness":0.819608,"pitch":23.760511,"speechRate":5.45,"hasEvents":true,"sentence_source":"稳地走好下坡路，现在你的受众当中比如你的读者 你的听众还有你的一些病人，他们应该是各个年龄段的都有。","sentence_en":"Steadily walk the downhill path; now your audience, such as your readers, listeners, and some of your patients, should span all age groups."},{"id":"439","start":2753.87,"end":2765.49,"displayStart":2753.87,"displayEnd":2765.49,"displayMid":2759.68,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","cl ":5.355,"hasEvents":false,"sentence_source":"那如果我不做 我也要知道，我可能会有哪一些所谓的遗憾也好，或者说我不做我也可能这方面我不得到，但我也不拾取，但将来我也不后悔。","sentence_en":"And if I don't do it, I also need to know what regrets I might have. Or if I don't do it, I might not gain in this area, but I won't lose either, and I won't regret it in the future."},{"id":"644","start":4030.97,"end":4041.87,"displayStart":4030.97,"displayEnd":4041.87,"displayMid":4036.42,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Positive","score":0.7,"loudness":0.713055,"pitch":20.426285,"speechRate":4.543,"hasEvents":false,"sentence_source":"我们始终在写作还有我个人的想传达的这个理念，就是女性在每个生活的点上都做利弊风险的权衡，只要权衡了。","sentence_en":"In our writing and my personal message, the concept is that women should weigh pros, cons, and risks at every point in life. As long as they weigh them,"},{"id":"645","start":4041.87,"end":4048.77,"displayStart":4041.87,"displayEnd":4048.77,"displayMid":4045.3199999999997,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Positive","score":0.6,"loudness":0.620743,"pitch":22.82016,"speechRate":5.74,"hasEvents":false,"sentence_source":"那么我做知情和自主的决定，决定了以后我就不想那么多了，我就向前走，但你知道有一个问题。","sentence_en":"then I make informed and autonomous decisions. After deciding, I won't think too much; I'll move forward. But you know, there's one issue."},{"id":"646","start":4048.77,"end":4057.69,"displayStart":4048.77,"displayEnd":4057.69,"displayMid":4053.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Positive","score":0.7,"loudness":0.903262,"pitch":20.657154,"speechRate":6.023,"hasEvents":false,"sentence_source":"花了我在想，就是我一直认为 我作为一个女性，我要不要孩子 其实我要也是我的选择，我不要也是我的选择 没有人必须要求 对吧。","sentence_en":"Speaking of which, I've been thinking: as a woman, whether I want children is my choice. If I want them, it's my choice; if I don't, it's also my choice. No one can force me, right?"},{"id":"647","start":4057.69,"end":4070.51,"displayStart":4057.69,"displayEnd":4070.51,"displayMid":4064.1000000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Negative","score":-0.6,"loudness":0.911911,"pitch":24.403997,"speechRate":5.185,"hasEvents":false,"sentence_source":"但是有一个问题 现在很多 比如说夫妻两个人，或者一段长期伴侣 他们会选择丁克，于是问题来了 男的反悔他来得及，但当您反悔的时候 我女性已经来不及了。","sentence_en":"But there is a problem. Nowadays, many couples or long-term partners choose to be DINK. Then the issue arises: if the man changes his mind, he still has time; but when he changes his mind, the woman has already run out of time."},{"id":"648","start":4070.51,"end":4073.79,"displayStart":4070.51,"displayEnd":4073.79,"displayMid":4072.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Negative","score":-0.4,"loudness":0.842229,"pitch":27.088976,"speechRate":5.822,"hasEvents":false,"sentence_source":"我生活当中出现过不止一个这样的例子。","sentence_en":"I've come across more than one such example in my life."},{"id":"649","start":4073.79,"end":4077.27,"displayStart":4073.79,"displayEnd":4077.27,"displayMid":4075.5299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Neutral","score":0,"loudness":0.871137,"pitch":26.334896,"speechRate":4.935,"hasEvents":false,"sentence_source":"那这个时候女性如何保护自己的权益呢。","sentence_en":"How can women protect their rights in this situation?"},{"id":"650","start":4077.27,"end":4084.39,"displayStart":4077.27,"displayEnd":4084.39,"displayMid":4080.83,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":9,"clusterLabel":"C9","clusterName":"Female Medical Risk Preparedness","sentiment_en":"Neutral","score":0,"loudness":0.7675 s":false,"sentence_source":"然后你的胸腔还不断的在出血，这个时候卫生兵能给它的就是一只马飞，就是让它在不那么痛苦的过程中结束它的生命，甚至它二战的时候它发现了敌军 就是日本人，他也给了他一致。","sentence_en":"And your chest is still bleeding. At that moment, the medic gives you a morphine shot to let you pass without too much pain. Even during WWII, if he found an enemy—a Japanese soldier—he would give him one too."},{"id":"699","start":4435.31,"end":4438.91,"displayStart":4435.31,"displayEnd":4438.91,"displayMid":4437.110000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Positive","score":0.8,"loudness":0.623084,"pitch":25.073618,"speechRate":5.678,"hasEvents":false,"sentence_source":"就是无国界医生的这种对人的终极的关爱。","sentence_en":"That's the ultimate humanitarian care of a doctor without borders."},{"id":"700","start":4438.91,"end":4452.45,"displayStart":4438.91,"displayEnd":4452.45,"displayMid":4445.68,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Negative","score":-0.6,"loudness":0.728046,"pitch":25.984873,"speechRate":4.719,"hasEvents":false,"sentence_source":"就是美国的药物滥用问题 包括我们中国 其实它是两个极端，一个是过度使用 承掩 造成的死亡和伤害，另一个是我们医学的对疼痛的治疗的远远的不够。","sentence_en":"The drug abuse problem in the US and China actually represent two extremes: one is overuse and addiction causing death and harm; the other is the medical field's insufficient treatment of pain."},{"id":"701","start":4452.91,"end":4465.93,"displayStart":4452.91,"displayEnd":4465.93,"displayMid":4459.42,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Negative","score":-0.7,"loudness":0.652796,"pitch":26.911037,"speechRate":5.646,"hasEvents":false,"sentence_source":"甚至我们的疼痛的无痛分明 扑的不是那么好 教育的不是那么好，甚至有的女生想无痛分明 她的爱人不给她签字，甚至产生很多说 哎呀 无动分明会让你没劲啊 会让你孩子窒息。","sentence_en":"Even our painless childbirth isn't well promoted or educated. Some women want it, but their partners won't sign. There are many misconceptions like 'painless birth will make you weak' or 'it will suffocate the baby."},{"id":"702","start":4465.93,"end":4475.17,"displayStart":4465.93,"displayEnd":4475.17,"displayMid":4470.55,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.59829,"pitch":25.731045,"speechRate":5.087,"hasEvents":false,"sentence_source":"这些都是主正确的认识，还有就是我们大部分的晚期的肿瘤病人，是在疼痛中 是在哀嚎中离世的，这是很难想象的。","sentence_en":"These are incorrect beliefs. Also, most late-stage cancer patients die in pain and agony—that's hard to imagine."},{"id":"703","start":4475.17,"end":4490.29,"displayStart":4475.17,"displayEnd":4490.29,"displayMid":4482.73,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Negative","score":-0.5,"loudness":0.687447,"pitch":23.287838,"speechRate":4.825,"hasEvents":false,"sentence_source":"但是其实这是因为我们对疼痛 对腰舞的这种主正确的认识，还包括我们的医疗这种三阶级止痛，这种医疗服务的提供是远远不够的，两个极端 其实应该科学 然后把它柔和。","sentence_en":"But this is due to our correct understanding of pain and the lumbar region, as well as the three-step analgesic ladder in medical care. The provision of such medical services is far from sufficient. There are two extremes; in fact, it should be scientific and integrated."},{"id":"704","start":4490.29,"end":4502.43,"displayStart":4490.29,"displayEnd":4502.43,"displayMid":4496.360000000001,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.6,"loudness":0.68123,"pitch":22.627588,"speechRate":5.071,"hasEvents":false,"sentence_source":"应该给予止痛的时候 给予安全的止痛，又需要医生的医疗服务的提供，又需要受体 受者 接受者对他的一个科学认识，才能达到比较相对完美的状态。","sentence_en":"When pain relief should be given, safe pain relief should be provided. It requires both the provision of medical services by doctors and a scientific understanding by the recipients to achieve a relatively perfect state."},{"id":"705","start":4502.85,"end":4505.75,"displayStart":4502.85,"displayEnd":4505.75,"displayMid":4504.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.5,"loudness":0.942474,"pitch":25.972183,"speechRate":8.381,"hasEvents":false,"sentence_source":"诶 我发现你是个平常特别看很多电影的一个人。","sentence_en":"Hey, I notice you watch a lot of movies."},{"id":"706","start":4505.75,"end":4507.61,"displayStart":4505.75,"displayEnd":4507.61,"displayMid":4506.68,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.5,"loudness":0.872079,"pitch":21.482693,"speechRate":6.54,"hasEvents":false,"sentence_source":"对 我还爱看电影 爱看书。","sentence_en":"Yes, I love movies and books."},{"id":"707","start":4507.61,"end":4513.45,"displayStart":4507.61,"displayEnd":4513.45,"displayMid":4510.53,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.5,"loudness":0.730963,"pitch":22.860626,"speechRate":5.137,"hasEvents":false,"sentence_source":"其实我平常也很宅，除了工作在家 就看书啊 鼓刀鼓刀，自己写点小东西张。","sentence_en":"Actually, I'm quite a homebody. Besides work, I stay home reading, tinkering around, and writing little things."},{"id":"708","start":4513.45,"end":4516.63,"displayStart":4513.45,"displayEnd":4516.63,"displayMid":4515.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.82095,"pitch":27.263996,"speechRate":5.975,"hasEvents":false,"sentence_source":"羽 你现在工作主要是由哪几部分组成张。","sentence_en":"Yu, what does your work consist of now?"},{"id":"709","start":4516.63,"end":4519.19,"displayStart":4516.63,"displayEnd":4519.19,"displayMid":4517.91,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.80136,"pitch":22.264038,"speechRate":4.331,"hasEvents":false,"sentence_source":"羽 工作就是首先出诊治病。","sentence_en":"Yu: First, I see patients and treat them."},{"id":"710","start":4519.19,"end":4521.37,"displayStart":4519.19,"displayEnd":4521.37,"displayMid":4520.28,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.804063,"pitch":25.554104,"speechRate":5.505,"hasEvents":false,"sentence_source":"我们在荷姆家医院出诊两天。","sentence_en":"I work at Holm Home Hospital two days a week."},{"id":"711","start":4521.37,"end":4525.03,"displayStart":4521.37,"displayEnd":4525.03,"displayMid":4523.2,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Neutral","score":0,"loudness":0.754634,"pitch":23.293293,"speechRate":4.372,"hasEvents":false,"sentence_source":"然后我还有两个治疗中心要出诊两天。","sentence_en":"Then I have two treatment centers where I also work two days."},{"id":"712","start":4525.03,"end":4531.71,"displayStart":4525.03,"displayEnd":4531.71,"displayMid":4528.37,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Work and academic experience","sentiment_en":"Positive","score":0.6,"loudness":0.716121,"pitch":24.425301,"speechRate":5.53,"hasEvents":false,"sentence_source":"所以我由原来的五个工作日，给自己压缩到四个工作日，这样我就有三天自己的时间一。","sentence_en":"So I compressed my schedule from five workdays to four, giving myself three days of personal time."},{"id":"713","start":4531.71,"end":4533.49,"displayStart":4531.71,"displayEnd":4533.49,"displayMid":4532.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Neutral","score":0,"loudness":0.913225,"pitch":19.940428,"speechRate":5.618,"hasEvents":false,"sentence_source":"般什么样的患者来看你。","sentence_en":"What kind of patients come to see you?"},{"id":"714","start":4533.49,"end":4544.47,"displayStart":4533.49,"displayEnd":4544.47,"displayMid":4538.98,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Neutral","score":0,"loudness":0.625341,"pitch":24.717518,"speechRate":4.508,"hasEvents":false,"sentence_source":"我们的患者很有意思，两级分化，一类是病不重 但心病重，就是这个病小小病，在我们夫人和医生眼里，就是多发病常见病。","sentence_en":"Our patients are interesting—two extremes. One group has mild illnesses but severe psychological issues. The disease is minor, a common ailment in our eyes."},{"id":"715","start":4544.47,"end":4559.31,"displayStart":4544.47,"displayEnd":4559.31,"displayMid":4551.89,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Medical-Related Thoughts","sentiment_en":"Neutral","score":0,"loudness":0.607944,"pitch":21.96932,"speechRate":4.114,"hasEvents":false,"sentence_source":"但是由病导致的心理问题重，甚至让它焦虑失眠 红黄不可中日，就是心病更重 这是一块 另一块就是真重 病真重，它可能走了一些基本的医疗机构。","sentence_en":"But the psychological problems from it are serious—anxiety, insomnia, constant distress. So the mental burden is heavier. The other group is truly severe cases. They may have already visited basic medical facilities."},{"id":"716","start":4559.31,"end":4573.29,"displayStart":4559.31,"displayEnd":4573.29,"displayMid":4566.3,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.631076,"pitch":25.769115,"speechRate":5.651,"hasEvents":false,"sentence_source":"二级医院 当地医院 医生都没有什么好办法，或者医生给它的办法是它不能接受的，打个比方 两性的机流就让它切子弓，或者长了一个小囊种就让它切卵巢，还是不能接受的 它们就会找到我们。","sentence_en":"Secondary hospitals or local doctors have no good solutions, or the solutions are unacceptable to them. For example, a benign tumor and they say remove the uterus, or a small cyst and they say remove the ovary. If they can't accept that, they come to us."},{"id":"717","start":4573.65,"end":4578.41,"displayStart":4573.65,"displayEnd":4578.41,"displayMid":4576.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.846383,"pitch":25.092016,"speechRate":6.904,"hasEvents":false,"sentence_source":"见病人的这个过程 就做整的这个过程，作为医生 她其实消耗是很多的吧。","sentence_en":"The process of seeing patients—this process of providing whole-person care—must be very draining for a doctor, right?"},{"id":"718","start":4578.41,"end":4592.77,"displayStart":4578.41,"displayEnd":4592.77,"displayMid":4585.59,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.75909,"pitch":23.165762,"speechRate":4.695,"hasEvents":false,"sentence_source":"是的 如果是真心真意的一次看诊，清心清丽的一次看诊 也是很累的，虽然不是上手术台拿刀拿枪的一站几个小时，就是看一上午门诊，要不停地说话 不停地了解她。","sentence_en":"Yes, a truly heartfelt and clear-minded consultation is also exhausting. It's not like standing for hours in surgery. Just a morning of outpatient visits, constantly talking and trying to understand her."},{"id":"719","start":4592.77,"end":4602.45,"displayStart":4592.77,"displayEnd":4602.45,"displayMid":4597.610000000001,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.725154,"pitch":24.608084,"speechRate":4.947,"hasEvents":false,"sentence_source":"然后用自己的专业知识，再加上自己的女性智慧，自己在生活中积累的这些人生经验，来帮她解决这个问题 也很累。","sentence_en":"Then using my professional knowledge, plus my feminine wisdom and life experience to help her solve the problem—it's tiring too."},{"id":"720","start":4602.45,"end":4605.91,"displayStart":4602.45,"displayEnd":4605.91,"displayMid":4604.18,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":1.012533,"pitch":28.833048,"speechRate":7.221,"hasEvents":false,"sentence_source":"就你有时候即使专家 医生，有时候还要做一个知心大姐。","sentence_en":"Sometimes, even as an expert doctor, you have to be a caring older sister."},{"id":"721","start":4605.91,"end":4613.91,"displayStart":4605.91,"displayEnd":4613.91,"displayMid":4609.91,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Doctor-Patient Communication","sentiment_en":"Neutral","score":0,"loudness":0.801338,"pitch":25.837133,"speechRate":4.425,"hasEvents":false,"sentence_source":"对 知心大姐 知心阿姨 知心的小朋友 同龄的 大的 小的 老的 不同年龄端的女性老的女。","sentence_en":"We have understanding older sisters, understanding aunties, understanding kids, peers, older, younger, elderly—women of all ages."},{"id":"722","start":4613.91,"end":4615.89,"displayStart":4613.91,"displayEnd":4615.89,"displayMid":4614.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Menopause and Depression in Women","sentiment_en":"Positive","score":0.4,"loudness":0.635275,"pitch":23.308382,"speechRate":7.071,"hasEvents":false,"sentence_source":"性他们的问题会是什么 我很好奇。","sentence_en":"What are their problems? I'm curious."},{"id":"723","start":4615.89,"end":4631.69,"displayStart":4615.89,"displayEnd":4631.69,"displayMid":4623.79,"speaker":"Zhang Yu","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Menopause and Depression in Women","sentiment_en":"Neutral","score":0,"loudness":0.798637,"pitch":24.911156,"speechRate":4.526,"hasEvents":false,"sentence_source":"老年女性其实我们现在接触的比较年龄稍稍大一点，还不算老年女性 主要就是个年气，5012岁53岁或者有的人早489岁，他们更多的是面临的 原来很能打 能拼。","sentence_en":"Older women we currently encounter are slightly older, not quite elderly, mainly around 50 to 53 years old, or some as early as 48 or 49. They face the challenge of having been very capable function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
