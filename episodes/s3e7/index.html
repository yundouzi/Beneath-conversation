w up in those alleyways in Shanghai."},{"id":"34","start":258.6,"end":274.36,"displayStart":258.6,"displayEnd":274.36,"displayMid":266.48,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Shanghai","sentiment_en":"Neutral","score":0.1,"loudness":0.880121,"pitch":24.023417,"speechRate":4.828,"hasEvents":false,"sentence_source":"所以上海在我的记忆当中它是有声音的，每天早晨一醒来你不是先看到什么，你这些能够隐约的听到在外边街上有人在那用很硬的那种刷子，在刷马桶的那种擦擦的那种声音。","sentence_en":"So in my memory, Shanghai has sounds. Every morning when you wake up, you don't see anything first—you faintly hear someone outside on the street using a hard brush to scrub a toilet, making a scraping sound."},{"id":"35","start":274.36,"end":281.08,"displayStart":274.36,"displayEnd":281.08,"displayMid":277.72,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Shanghai","sentiment_en":"Positive","score":0.4,"loudness":0.916983,"pitch":24.475752,"speechRate":5.71,"hasEvents":false,"sentence_source":"然后那个声音包括当时黄浦江的江水的味道，他对我来说就是童年的上海的记忆还有钟声。","sentence_en":"Then that sound, including the smell of the Huangpu River, for me is the memory of childhood Shanghai, along with the bell sounds."},{"id":"36","start":281.08,"end":294.6,"displayStart":281.08,"displayEnd":294.6,"displayMid":287.84000000000003,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Shanghai","sentiment_en":"Positive","score":0.5,"loudness":0.843813,"pitch":23.221443,"speechRate":5.283,"hasEvents":false,"sentence_source":"所以我总觉得这样有很丰富的声音有味道，有画面的城市都是韵含着故事的，但我不知道在你成长过程当中上海还有什么样的声音跟气味，是你记忆当中还很印象鲜明的。","sentence_en":"So I always feel that such a city with rich sounds, smells, and pictures is full of stories. But I don't know what other sounds and smells of Shanghai in your memory are still vivid."},{"id":"37","start":294.6,"end":301.9,"displayStart":294.6,"displayEnd":301.9,"displayMid":298.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel"  Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Neutral","score":0.1,"loudness":0.934483,"pitch":19.26198,"speechRate":5.07,"hasEvents":false,"sentence_source":"那后来也成为文学空间，在我生活的工人新村里 我感觉我生活过的三个工人新村还是有很多的侧点的，比方说最早的在徐慧区的田岭新村呢 它其实还是有一些乡土气息的。","sentence_en":"It later became a literary space. In the worker's new villages where I lived, I feel the three I experienced still have many characteristics. For example, the earliest one, Tianling New Village in Xuhui District, still had some rural flavor."},{"id":"49","start":392.46,"end":404.1,"displayStart":392.46,"displayEnd":404.1,"displayMid":398.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Neutral","score":0,"loudness":1.041001,"pitch":21.964075,"speechRate":5.625,"hasEvents":false,"sentence_source":"我小时候还是会看到一些动物 鹅啊 甚至是猪圈啊 还是能看到的，怎么会看到猪圈，会有 那时候就是您说的那个到马桶的经历 我在非常小的时候。","sentence_en":"As a child, I could still see animals like geese and even pigsties. How did I see pigsties? It existed then. That was the chamber pot experience you mentioned, from my very early childhood."},{"id":"50","start":404.1,"end":409.42,"displayStart":404.1,"displayEnd":409.42,"displayMid":406.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Neutral","score":0,"loudness":0.988655,"pitch":17.759161,"speechRate":4.887,"hasEvents":false,"sentence_source":"会跟我妈妈要去到马桶的时候 会路过一个很乡土的一个环境。","sentence_en":"When I had to go to the toilet with my mom, we would pass through a very rustic environment."},{"id":"51","start":409.42,"end":415.66,"displayStart":409.42,"displayEnd":415.66,"displayMid":412.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Neutral","score":0,"loudness":1.108764,"pitch":16.618025,"sp 西。","sentence_en":"Nowadays we think of comfort as something expensive or particularly special."},{"id":"67","start":520.76,"end":525.38,"displayStart":520.76,"displayEnd":525.38,"displayMid":523.0699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Neutral","score":0,"loudness":0.930889,"pitch":23.962921,"speechRate":5.429,"hasEvents":false,"sentence_source":"但是在以前的那些人看来老人家能用个几年抽水马桶的话。","sentence_en":"But in the eyes of people back then, if an elderly person could use a flush toilet for a few years..."},{"id":"68","start":525.38,"end":533.46,"displayStart":525.38,"displayEnd":533.46,"displayMid":529.4200000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Positive","score":0.5,"loudness":0.777061,"pitch":19.893795,"speechRate":4.208,"hasEvents":false,"sentence_source":"那可能就代表说说他这辈子还能够过一点点好日子，这个是有这个亲情的感动在。","sentence_en":"That meant they got to enjoy a bit of a good life in their later years. That's the emotional touch of family love."},{"id":"69","start":533.46,"end":548.3,"displayStart":533.46,"displayEnd":548.3,"displayMid":540.88,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Family and childhood experiences","sentiment_en":"Negative","score":-0.5,"loudness":0.89638,"pitch":22.776098,"speechRate":5.379,"hasEvents":true,"sentence_source":"我觉得这句话特别戳人，瞬间我也想到对啊 我觉得我爷爷奶奶他们都没有用上抽水马桶，都没有过上我们心目当中 现在看来是很平常的，但对他们来说就是好日子嘛，瞬间一下就戳到我了。","sentence_en":"I find this sentence particularly striking. It instantly made me think, yes, my grandparents never got to use a flush toilet or live the good life we imagine—things that seem ordinary to us now but were a big deal for them. That really hit me."},{"id":"70","start":548.78,"end":551.28,"displayStart":548.78,"displayEnd":551.28,"displayMid":550.03,"speaker":"Zhang Yiwei","speakerColor":"#A2 "sentiment_en":"Neutral","score":0.1,"loudness":1.005769,"pitch":16.920311,"speechRate":4.33,"hasEvents":false,"sentence_source":"那我就会买收获，买那个上海文学还有萌芽杂志，当故事书看的。","sentence_en":"So I would buy Harvest, Shanghai Literature, and Sprout magazine, and read them like storybooks."},{"id":"75","start":575.34,"end":577.06,"displayStart":575.34,"displayEnd":577.06,"displayMid":576.2,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Shanghai","sentiment_en":"Neutral","score":0,"loudness":1.08805,"pitch":18.748043,"speechRate":7.143,"hasEvents":false,"sentence_source":"那有一些也看不太懂。","sentence_en":"Some of them I didn't quite understand."},{"id":"76","start":577.06,"end":591.8,"displayStart":577.06,"displayEnd":591.8,"displayMid":584.43,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Mother and Family","sentiment_en":"Neutral","score":0,"loudness":0.979539,"pitch":21.587275,"speechRate":5.071,"hasEvents":false,"sentence_source":"那我们工人的小孩其实是缺乏比较正规的文学引导，但另外一方面父母会对家里喜欢看书的小孩比较保护的，觉得他在做一件正经事其实看来是显书 看来是当故事书看的嘛。","sentence_en":"We, as children of workers, lacked proper literary guidance. But on the other hand, parents tended to protect kids at home who liked reading, thinking they were doing something serious. Actually, it was just reading for fun, treating it like storybooks."},{"id":"77","start":591.8,"end":594.7,"displayStart":591.8,"displayEnd":594.7,"displayMid":593.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Mother and Family","sentiment_en":"Positive","score":0.3,"loudness":1.122032,"pitch":19.685068,"speechRate":5.566,"hasEvents":false,"sentence_source":"但是会觉得这个小孩可能会学好吧。","sentence_en":"But I felt it might be good for a kid to learn from them."},{"id":"78","start":595.98,"end":601.82,"displayStart":595.98,"displayEnd":601.82,"displayMid":598.9000000000001,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Neutral","score":0,"loudness":0.907448,"pitch":20.897926,"speechRate":5.825,"hasEvents":false,"sentence_source":"那刚才你讲到了一些穷摇，我不知道你后来是不是看过穷摇几乎所有的东西啊。","sentence_en":"You mentioned Qiong Yao earlier. I wonder if you later read almost all her works?"},{"id":"79","start":601.82,"end":605.16,"displayStart":601.82,"displayEnd":605.16,"displayMid":603.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Neutral","score":0,"loudness":1.050847,"pitch":22.170559,"speechRate":4.871,"hasEvents":false,"sentence_source":"看了一些 但也不是所有 他写的也很错。","sentence_en":"I read some, but not all. She wrote a lot too."},{"id":"80","start":605.16,"end":616.88,"displayStart":605.16,"displayEnd":616.88,"displayMid":611.02,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Neutral","score":0,"loudness":0.864676,"pitch":22.555643,"speechRate":4.522,"hasEvents":false,"sentence_source":"我后来看过你大概在哪个采访当中，你说你写《四合如意》的时候，就是故事的原型多少是有一点点，像是琼瑶跟平心涛之间的故事。","sentence_en":"I later saw in an interview that you said when you wrote 'Si He Ru Yi', the story's prototype was somewhat like the story between Qiong Yao and Ping Xintao."},{"id":"81","start":616.88,"end":619.86,"displayStart":616.88,"displayEnd":619.86,"displayMid":618.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Neutral","score":0,"loudness":0.910796,"pitch":16.652838,"speechRate":2.657,"hasEvents":false,"sentence_source":"对 原起是写一个。","sentence_en":"Yes, it initially started as a story about..."},{"id":"82","start":619.86,"end":632.08,"displayStart":619.86,"displayEnd":632.08,"displayMid":625.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":-0.1,"loudness":0.99196,"pitch":19.947981,"speechRate":4.255,"hasEvents":false,"sentence_source":"其实跟当时平心涛先生患病，琼瑶的一些公开的表述是有关的，有关就是说他的查管，查鼻尾管的这个痛苦跟医院的这个伦理。","sentence_en":"Actually, it was related to Mr. Ping Xintao's illness and some public statements by Qiong Yao, about the pain of nasal tube feeding and hospital ethics."},{"id":"83","start":632.08,"end":636.58,"displayStart":632.08,"displayEnd":636.58,"displayMid":634.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.4,"loudness":0.969803,"pitch":21.175375,"speechRate":5.778,"hasEvents":false,"sentence_source":"就是我们是不是要放弃一个可以通过机器维持生命体征的人。","sentence_en":"Whether we should give up on a person whose vital signs are maintained by machines."},{"id":"84","start":636.58,"end":640.72,"displayStart":636.58,"displayEnd":640.72,"displayMid":638.6500000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.838354,"pitch":18.636377,"speechRate":4.374,"hasEvents":false,"sentence_source":"那我当时就对这个议题其实是很感兴趣的。","sentence_en":"I was actually very interested in this issue at the time."},{"id":"85","start":640.72,"end":653.34,"displayStart":640.72,"displayEnd":653.34,"displayMid":647.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":0.932844,"pitch":21.263618,"speechRate":4.845,"hasEvents":false,"sentence_source":"因为我觉得这里面是有很复杂的内容在的，一方面是我们的科技已经到达了很厉害的水平，可以让一个原本没有办法维持生命的人能够延长生命。","sentence_en":"Because I think there's a lot of complexity. On one hand, technology has reached a level where we can extend the life of someone who otherwise couldn't survive."},{"id":"86","start":653.34,"end":658.92,"displayStart":653.34,"displayEnd":658.92,"displayMid":656.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.6,"loudness":0.880857,"pitch":22.882254,"speechRate":4.744,"hasEvents":false,"sentence_source":"另一方面这种延长它又是质量并不太高，病人本人也很痛苦。","sentence_en":"On the other hand, this extension is often of low quality, and the patient themselves suffer a lot."},{"id":"87","start":658.92,"end":663.22,"displayStart":658.92,"displayEnd":663.22,"displayMid":661.0699999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":-0.1,"loudness":0.914064,"pitch":21.531506,"speechRate":5.392,"hasEvents":false,"sentence_source":"那这其实是每个地方的医院每天都会发生的事情。","sentence_en":"And this is something that happens every day in hospitals everywhere."},{"id":"88","start":663.22,"end":677,"displayStart":663.22,"displayEnd":677,"displayMid":670.11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0.1,"loudness":0.811922,"pitch":18.38036,"speechRate":4.572,"hasEvents":false,"sentence_source":"那当时我就写了这一系列机器于事情系列比较早期的一个故事的形态，就是那个躺在床上靠机器维持生命体真的那个人可能背后有一个命运的安排。","sentence_en":"So at that time I wrote one of the earlier stories in my 'Machine and Things' series, about a person lying in bed kept alive by machines, perhaps with a fate behind it."},{"id":"89","start":677,"end":683.66,"displayStart":677,"displayEnd":683.66,"displayMid":680.3299999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.3,"loudness":0.873604,"pitch":18.545202,"speechRate":4.354,"hasEvents":false,"sentence_source":"我写过一个故事是妈妈已经以这样的一个植物人的形态躺了很久了。","sentence_en":"I wrote a story where the mother has been lying as a vegetative state for a long time."},{"id":"90","start":683.66,"end":689.4,"displayStart":683.66,"displayEnd":689.4,"displayMid":686.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.4,"loudness":1.069994,"pitch":25.913185,"speechRate":5.53,"hasEvents":false,"sentence_source":"然后家里人甚至也在 已经接受说妈妈有可能早一天晚一天就是会离开。","sentence_en":"And the family has even accepted that she might leave sooner or later."},{"id":"91","start":689.4,"end":703.54,"displayStart":689.4,"displayEnd":703.54,"displayMid":696.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.5,"loudness":0.924673,"pitch":17.794292,"speechRate":4.88,"hasEvents":false,"sentence_source":"所以爸爸在找新的女朋友的时候呢 也没有反对，可是就说 在大家都以一家人的形态生活在一起的时候，父亲因为心脏病而活就过世了，反而是那个躺着的人 他还活着。","sentence_en":"So when the father finds a new girlfriend, no one objects. But just as they start living together as a new family, the father dies of a heart attack, while the one lying in bed is still alive."},{"id":"92","start":703.54,"end":715.94,"displayStart":703.54,"displayEnd":715.94,"displayMid":709.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.914382,"pitch":17.721853,"speechRate":4.719,"hasEvents":false,"sentence_source":"所以他没有让他们得逞 没有让这个看似没有他也可以骑了荣荣的家庭，以这样的方式生活 他在抗争，这个躺着的力量就是一个命运的力量。","sentence_en":"So he didn't let them succeed. He didn't let the family that seemed fine without him live that way. He was fighting. The power of the one lying down is the power of fate."},{"id":"93","start":715.94,"end":719.12,"displayStart":715.94,"displayEnd":719.12,"displayMid":717.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.7,"loudness":0.856201,"pitch":20.225298,"speechRate":5.975,"hasEvents":false,"sentence_source":"那这种象征性的隐喻性的故事很打动我。","sentence_en":"Stories like that, symbolic and metaphorical, really resonate with me."},{"id":"94","start":719.12,"end":723.78,"displayStart":719.12,"displayEnd":723.78,"displayMid":721.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.877703,"pitch":14.433266,"speechRate":4.536,"hasEvents":false,"sentence_source":"但是最早期确实还是受到这个穷摇的故事的影响。","sentence_en":"But early on, I was definitely influenced by Qiong Yao's stories."},{"id":"95","start":723.78,"end":734.96,"displayStart":723.78,"displayEnd":734.96,"displayMid":729.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.7,"loudness":0.894176,"pitch":16.953211,"speechRate":4.653,"hasEvents":false,"sentence_source":"我觉得它是一个非常善于发现，平凡生活当中一些极强的戏剧长里的一个女作家，他是一个通俗的力量 很强的一个女作家。","sentence_en":"I think she's a writer who's very good at finding strong drama in ordinary life. She has a powerful popular appeal."},{"id":"96","start":734.96,"end":740.84,"displayStart":734.96,"displayEnd":740.84,"displayMid":737.9000000000001,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0.1,"loudness":0.82235,"pitch":22.49132,"speechRate":5.496,"hasEvents":false,"sentence_source":"对 我一直觉得穷摇对至少一代吧，至少像我们70后 可能60后有一部分。","sentence_en":"Right, I've always felt Qiong Yao influenced at least one generation—maybe those born in the '70s, and some from the '60s."},{"id":"97","start":740.84,"end":755.22,"displayStart":740.84,"displayEnd":755.22,"displayMid":748.03,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.874742,"pitch":24.26948,"speechRate":5.076,"hasEvents":false,"sentence_source":"然后一部分80后还是成长过程当中对于我们的，至少你看到爱情的方式 很多生活的态度还是有很大影响的，只是他后来的很多电视剧当中一些台词可能乔断有点带跑偏了。","sentence_en":"And some post-80s, during their growing up, she also had a big impact on how we view love and life attitudes. It's just that some of the lines in her later TV dramas might have led us astray a bit."},{"id":"98","start":755.22,"end":769.3,"displayStart":755.22,"displayEnd":769.3,"displayMid":762.26,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.7,"loudness":0.892803,"pitch":26.117571,"speechRate":5.425,"hasEvents":false,"sentence_source":"但他某些方面还是被低估了的 至少我被他的影响还蛮大，我记得有一次我去欧洲出差 然后我瞬间就记起了是在聚散两一一，你记得这部书吗 聚散两一一 这些名字都好浪漫 我觉得。","sentence_en":"But she's still underestimated in some ways. At least I'm quite influenced by her. I remember once on a business trip to Europe, I suddenly recalled a scene from 'Ju San Liang Yi Yi' (Parting and Meeting Again). Do you remember that book? Such romantic titles, I think."},{"id":"99","start":769.86,"end":781.88,"displayStart":769.86,"displayEnd":781.88,"displayMid":775.87,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":0.928715,"pitch":24.268135,"speechRate":5.178,"hasEvents":false,"sentence_source":"就算梁依开头里边 她就写道说，这个女主人公回忆起她在欧洲，说踩着那个古老的石板路 然后吃烤栗子，她从来没有想到我烤栗子的味道这么好吃。","sentence_en":"In the beginning, the heroine recalls being in Europe, walking on old cobblestone streets and eating roasted chestnuts. She never thought chestnuts could taste so good."},{"id":"100","start":781.88,"end":792.58,"displayStart":781.88,"displayEnd":792.58,"displayMid":787.23,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0.1,"loudness":0.906198,"pitch":24.373541,"speechRate":4.673,"hasEvents":false,"sentence_source":"因为当时当我想到这个情节跟画面的时候，我正好是站在 我忘了是巴黎还是米兰哪个地方，总之我一看脚下就是石板路。","sentence_en":"When I thought of that scene, I happened to be standing—I forget if it was Paris or Milan—but I looked down and saw cobblestone streets."},{"id":"101","start":792.58,"end":803.64,"displayStart":792.58,"displayEnd":803.64,"displayMid":798.11,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.861806,"pitch":23.214098,"speechRate":5.202,"hasEvents":false,"sentence_source":"然后旁边就有一个小贩在卖烤栗子，哇 我瞬间我就会发现 哇 这个文学的力量，如此之神奇 于是我立刻去买粒包烤粒子，但根本就不好吃。","sentence_en":"And there was a vendor selling roasted chestnuts. Wow, I instantly realized the power of literature—it's amazing. So I immediately bought a bag of roasted chestnuts, but they weren't good at all."},{"id":"102","start":805.02,"end":817.56,"displayStart":805.02,"displayEnd":817.56,"displayMid":811.29,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":0.785365,"pitch":21.3519,"speechRate":4.705,"hasEvents":false,"sentence_source":"然后你发现我其实对于他的作品这么的熟悉，现在其实忘了很多 但当年真的是烂熟于心，我就觉得我还是被这些文字 被这些故事所滋养过的。","sentence_en":"And you see, I was so familiar with her works. I've forgotten a lot now, but back then I knew them by heart. I feel I was truly nourished by those words and stories."},{"id":"103","start":817.56,"end":820.86,"displayStart":817.56,"displayEnd":820.86,"displayMid":819.21,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0.1,"loudness":0.874448,"pitch":20.176064,"speechRate":9.045,"hasEvents":false,"sentence_source":"这是我的一些感受 我不知道有没有类似这样的记忆，你会不会有。","sentence_en":"Those are some of my feelings. I don't know if you have similar memories—do you?"},{"id":"104","start":820.86,"end":824.22,"displayStart":820.86,"displayEnd":824.22,"displayMid":822.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":1.059904,"pit  of Writing","sentiment_en":"Neutral","score":0,"loudness":1.031203,"pitch":20.405239,"speechRate":4.783,"hasEvents":false,"sentence_source":"因为我母亲对于穷瑶的这一些接受其实也是很表面的，她对我的祝福 像是有亲间接里面的那个，鱼威的祝福也是不过是希望我昏洁的好一点，有一个爱我的人 我其实是很传统的。","sentence_en":"My mother's acceptance of Qiong Yao was quite superficial. Her blessing to me, like the one from 'Yuwei' in one of the dramas, was just hoping I'd marry well and have someone who loves me. I'm actually quite traditional."},{"id":"113","start":901.4,"end":905.06,"displayStart":901.4,"displayEnd":905.06,"displayMid":903.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":-0.1,"loudness":1.090704,"pitch":17.753403,"speechRate":5.191,"hasEvents":false,"sentence_source":"跟现在的理念也不是很符合的那样一个形态。","sentence_en":"A mindset that doesn't quite align with today's values."},{"id":"114","start":905.06,"end":917.66,"displayStart":905.06,"displayEnd":917.66,"displayMid":911.3599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":1.084083,"pitch":20.875143,"speechRate":4.558,"hasEvents":false,"sentence_source":"但是我觉得我母亲跟其他没有看过穷瑶爱的教育的，妈妈不太一样的一点是她很喜欢表达，她到现在还是看到我还是会大声的呼唤说。","sentence_en":"But I think my mother is different from other mothers who haven't had Qiong Yao's love education: she loves to express herself. Even now, when she sees me, she'll call out loudly."},{"id":"115","start":917.66,"end":922.42,"displayStart":917.66,"displayEnd":922.42,"displayMid":920.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.7,"loudness":0.970888,"pitch":18.768307,"speechRate":3.151,"hasEvents":false,"sentence_source":"我妈妈好爱你这些不太中国的表达。","sentence_en":"Mommy loves you so much'—these expressions are not very Chinese."},{"id":"116","start":922.42,"end":926.7 e."},{"id":"120","start":951.18,"end":963.2,"displayStart":951.18,"displayEnd":963.2,"displayMid":957.19,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.5,"loudness":0.849809,"pitch":22.882711,"speechRate":5.344,"hasEvents":false,"sentence_source":"因为我会成长 然后我在成长过程当中我不断的会揪篇，我不断的会通过我现有的对于世界的认知，我目前掌握的知识 我的知识储备 我会不断的去修正它。","sentence_en":"Because I'll grow, and as I grow, I'll constantly revise—I'll continuously use my current understanding of the world, the knowledge I have, to correct it."},{"id":"121","start":963.2,"end":970.78,"displayStart":963.2,"displayEnd":970.78,"displayMid":966.99,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Negative","score":-0.4,"loudness":0.910051,"pitch":25.322399,"speechRate":5.145,"hasEvents":false,"sentence_source":"包括我记得我当初看穷摇的应该是《心有千千节》，其中有一句台词 我当时听了我觉得就很惊悚。","sentence_en":"For example, I remember watching Qiong Yao's 'Heart with a Thousand Knots' (Xin You Qian Qian Jie). There was a line that shocked me."},{"id":"122","start":970.78,"end":982.9,"displayStart":970.78,"displayEnd":982.9,"displayMid":976.8399999999999,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Negative","score":-0.5,"loudness":0.813275,"pitch":21.748228,"speechRate":5.222,"hasEvents":false,"sentence_source":"那个女主人公的妈妈对她说说，女孩子一步都不能错 一步错不不错，我当时第一次看是看书报后来看电视剧，我都觉得特别惊悚 但是我不知道错在哪里。","sentence_en":"The heroine's mother says to her, 'A girl cannot make a single mistake—one wrong step leads to all wrong.' When I first read it in the book and later saw the TV drama, I found it terrifying, but I didn't know what was wrong."},{"id":"123","start":982.9,"end":985.02,"displayStart":982.9,"displayEnd":985.02,"displayMid":983.96,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clust rything contrary to the Southern education that told her girls can't do these things."},{"id":"134","start":1094.64,"end":1103.58,"displayStart":1094.64,"displayEnd":1103.58,"displayMid":1099.1100000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Neutral","score":-0.1,"loudness":0.873035,"pitch":19.534201,"speechRate":4.922,"hasEvents":false,"sentence_source":"告诉他女孩子不能做这些事情的，你怎么会算账 你怎么会出发之类的，这些不是女孩子的事情 他也知道啊。","sentence_en":"It told her girls can't do these things—'How can you do accounting? How can you venture out?' She knows it's not considered proper for girls."},{"id":"135","start":1103.58,"end":1106.48,"displayStart":1103.58,"displayEnd":1106.48,"displayMid":1105.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Negative","score":-0.3,"loudness":0.984988,"pitch":22.181086,"speechRate":5.929,"hasEvents":false,"sentence_source":"但是家里怎么办的那么多人要养活。","sentence_en":"But what about the family? So many people to support."},{"id":"136","start":1106.48,"end":1109.48,"displayStart":1106.48,"displayEnd":1109.48,"displayMid":1107.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.5,"loudness":0.821545,"pitch":16.145031,"speechRate":4.667,"hasEvents":false,"sentence_source":"所以他还在不断的突破这个极限。","sentence_en":"So she keeps pushing the boundaries."},{"id":"137","start":1109.48,"end":1123.12,"displayStart":1109.48,"displayEnd":1123.12,"displayMid":1116.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Neutral","score":0,"loudness":0.89363,"pitch":19.115263,"speechRate":4.712,"hasEvents":false,"sentence_source":"那在这个过程当中，这种新旧价值交接时期的一个女孩子的尝试，他当然有很多的缺点，他甚至也做了很多奇怪的事，他可能也是一个自我感觉过于良好。","sentence_en":"In this process, the attempts of a girl at the intersectio riting","sentiment_en":"Neutral","score":0,"loudness":0.901551,"pitch":19.811909,"speechRate":5.117,"hasEvents":false,"sentence_source":"还觉得女孩子跟写作这两件事情放在一起，也是一个学而未觉很可疑的一个事情与，此同时他自己非常的勤奋，他写了很多长篇小说，很多短篇小说，他写了论文书信 中众，他甚至还正常上下班。","sentence_en":"He felt that putting girls and writing together was a suspicious and unfulfilling thing. At the same time, he was very diligent—he wrote many novels, short stories, essays, letters, and even had a regular day job."},{"id":"200","start":1607.24,"end":1617.64,"displayStart":1607.24,"displayEnd":1617.64,"displayMid":1612.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.949941,"pitch":20.895699,"speechRate":5.769,"hasEvents":false,"sentence_source":"他叫特洛洛普也是一个，早期的意识流的一个写作者，我就算了一下我跟他还差多少本书，才能跟他来谈谈女性写作的话题，我发现还差58本书。","sentence_en":"His name is Trollope. He was also an early stream-of-consciousness writer. I calculated how many books I'd need to write before I could discuss women's writing with him. It turns out I'm 58 books short."},{"id":"201","start":1617.64,"end":1624.32,"displayStart":1617.64,"displayEnd":1624.32,"displayMid":1620.98,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.985491,"pitch":15.474645,"speechRate":4.79,"hasEvents":false,"sentence_source":"那还早呢，等他写出来了之后再说，哎呀其实写作也就这么回事吧，就是也没有。","sentence_en":"That's still a long way off. Let him write those first, then we'll talk. Actually, writing is just that—it's not as bad as you describe."},{"id":"202","start":1624.32,"end":1625.8,"displayStart":1624.32,"displayEnd":1625.8,"displayMid":1625.06,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.3,"loudness":1.088267,"pitch":20.694956,"speechRate":4.73,"hasEvents":false,"sentence_source":"你说的这么糟糕。","sen sentence_en":"She said her teenage literary idols were all male writers—Dostoevsky, Flaubert, Dickens. She said she never liked a female writer."},{"id":"226","start":1800.64,"end":1811.58,"displayStart":1800.64,"displayEnd":1811.58,"displayMid":1806.1100000000001,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.5,"loudness":0.852097,"pitch":20.086668,"speechRate":5.712,"hasEvents":false,"sentence_source":"但是说我到了20岁之后 我的创作的观点，我对于文学的看法说彻底的改变了，我当时看到这一段我还是蛮震惊的，我不知道你有没有这样的一个。","sentence_en":"But then she said that after she turned 20, her perspective on creation and literature completely changed. I was quite shocked when I read that. I wonder if you've had that kind of"},{"id":"227","start":1811.58,"end":1814.64,"displayStart":1811.58,"displayEnd":1814.64,"displayMid":1813.1100000000001,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Neutral","score":0,"loudness":0.976912,"pitch":22.886766,"speechRate":7.204,"hasEvents":false,"sentence_source":"就是你从文学的审美上有个特别明确的一个变化。","sentence_en":"clear shift in your literary aesthetic."},{"id":"228","start":1814.64,"end":1822.38,"displayStart":1814.64,"displayEnd":1822.38,"displayMid":1818.5100000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Neutral","score":0,"loudness":1.013283,"pitch":24.574732,"speechRate":5.556,"hasEvents":false,"sentence_source":"还是有吧 小的时候我觉得我们看文学书还是为了获得经验的，就是说要有东西学习希望自己提高。","sentence_en":"Probably yes. When I was young, I read literary works to gain experience—to learn something and improve myself."},{"id":"229","start":1822.38,"end":1828.1,"displayStart":1822.38,"displayEnd":1828.1,"displayMid":1825.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Neutral","score":0,"loudness":0.931951,"pitch":20.749111,"speechRate":4.021,"hasEvents":false,"sentence_source":"但是长大了之后再看一下说，可能经验的部分就比较少。","sentence_en":"But as I grew older, the experiential part became less important."},{"id":"230","start":1828.1,"end":1838.7,"displayStart":1828.1,"displayEnd":1838.7,"displayMid":1833.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.4,"loudness":0.869757,"pitch":18.822145,"speechRate":5.217,"hasEvents":false,"sentence_source":"我觉得我比较想看一些超越我自己的经验，就是说不管是情感经验还是生活经验，甚至是不是世俗生活的经验，能够起初的那些仪。","sentence_en":"I think I wanted to read things that transcend my own experience—whether emotional, life, or even non-secular experiences—things that go beyond the ordinary."},{"id":"231","start":1838.7,"end":1853.86,"displayStart":1838.7,"displayEnd":1853.86,"displayMid":1846.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.6,"loudness":0.904906,"pitch":15.355266,"speechRate":4.831,"hasEvents":false,"sentence_source":"那有一些女作家是非常优秀的在这方面，比方阿里斯门洛啊，或者格特小时候也会有我很喜欢的地方，这个学历杰克逊啊，就他会提醒我们生活当中的这个陷阱，或者说恐怖之处。","sentence_en":"There are some female writers who excel at this, like Alice Munro, or Gertrude. There are places I like in her work too, or Shirley Jackson, who reminds us of the traps or terrors in life."},{"id":"232","start":1853.86,"end":1861.92,"displayStart":1853.86,"displayEnd":1861.92,"displayMid":1857.8899999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Writers and Works","sentiment_en":"Positive","score":0.5,"loudness":0.727083,"pitch":17.761854,"speechRate":4.467,"hasEvents":false,"sentence_source":"或者说枯燥的生活，怎么样可以一步一步走到外面去啊，就走到这个生活的逻辑之外去。","sentence_en":"Or how to step out of a boring life, step outside the logic of everyday life."},{"id":"233","start":1861.92,"end":1864.12,"displayStart":1861.92,"displayEnd":1864.12,"di t a magazine: 'How much do you pay per word?' She said something like one dollar. I said 'That much?"},{"id":"335","start":2567.22,"end":2568.94,"displayStart":2567.22,"displayEnd":2568.94,"displayMid":2568.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Positive","score":0.4,"loudness":1.22164,"pitch":22.221516,"speechRate":6.918,"hasEvents":false,"sentence_source":"对 她可以买好多高跟鞋嘛。","sentence_en":"Yeah, she could buy a lot of high heels."},{"id":"336","start":2569.88,"end":2577.28,"displayStart":2569.88,"displayEnd":2577.28,"displayMid":2573.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Shanghai","sentiment_en":"Neutral","score":0,"loudness":0.954649,"pitch":18.546577,"speechRate":4.093,"hasEvents":true,"sentence_source":"对啊，事实上 上海的稿费会高一些，比作为新人在台湾鞋做的话会高一些。","sentence_en":"Yes, in fact, the manuscript fees in Shanghai are higher than what a newcomer would earn in Taiwan for similar work."},{"id":"337","start":2577.28,"end":2581.16,"displayStart":2577.28,"displayEnd":2581.16,"displayMid":2579.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.951219,"pitch":20.860168,"speechRate":6.639,"hasEvents":false,"sentence_source":"但是台湾有很多比赛，有很多文学比赛的奖金是非常高的。","sentence_en":"But Taiwan has many competitions with very high prize money."},{"id":"338","start":2581.16,"end":2596.18,"displayStart":2581.16,"displayEnd":2596.18,"displayMid":2588.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":0.935411,"pitch":16.183649,"speechRate":5.12,"hasEvents":false,"sentence_source":"所以我一靠奖金也活了一阵子，还跟房东谈判说，如果一年的房租都转给你，可不可以少一个月，给你现金 这样我就不用花给你太太，她想了一下她就说好我请你喝咖啡，就可以删一个月。","sentence_en":"So I also lived on prize money for a while. I even negotiated with my landlord: 'If I pay a year's rent upfront in cash, can you give me one month off? That way you don't have to give it to your wife.' She thought about it and said, 'Okay, I'll buy you coffee,' and I got one month off."},{"id":"339","start":2596.18,"end":2602.26,"displayStart":2596.18,"displayEnd":2602.26,"displayMid":2599.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.956652,"pitch":16.480921,"speechRate":5.729,"hasEvents":false,"sentence_source":"因为他可以拿现金走嘛 他就不用 不然的话他就一份都没有，就有一些生活的谈判。","sentence_en":"Because he could take the cash directly—otherwise he wouldn't get any of it. So there were these life negotiations."},{"id":"340","start":2603.22,"end":2614.36,"displayStart":2603.22,"displayEnd":2614.36,"displayMid":2608.79,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.986859,"pitch":25.81657,"speechRate":5.353,"hasEvents":true,"sentence_source":"你刚刚跟我讲你在台湾写作的那个场景，我脑海当中浮现的画面就是94.95年那一版的小富人电影里面，维诺纳·赖德扮演的那个周末尺。","sentence_en":"When you just told me about your writing scene in Taiwan, the image that came to my mind was from the 1994-1995 version of the movie 'Little Women,' with Winona Ryder playing the character."},{"id":"341","start":2614.36,"end":2618.82,"displayStart":2614.36,"displayEnd":2618.82,"displayMid":2616.59,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.837401,"pitch":20.549765,"speechRate":4.933,"hasEvents":false,"sentence_source":"他写作的那个场景 就趴在那儿 然后箭上批一个批尖。","sentence_en":"He would lie there writing, with a shawl over his shoulder."},{"id":"342","start":2618.82,"end":2624.5,"displayStart":2618.82,"displayEnd":2624.5,"displayMid":2621.66,"speaker":"Zhang Yiwei","speakerColor":"#A2 rLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":0.898836,"pitch":16.836685,"speechRate":4.117,"hasEvents":false,"sentence_source":"我觉得我有早期非常多的小说，都是很害怕成为我写的那个女孩子，但事实证明我比她们都要强大的多。","sentence_en":"I think many of my early novels were about being afraid of becoming the girl I wrote about, but it turned out I'm much stronger than them."},{"id":"375","start":2832.82,"end":2835.62,"displayStart":2832.82,"displayEnd":2835.62,"displayMid":2834.2200000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.6,"loudness":1.186023,"pitch":26.206142,"speechRate":5.846,"hasEvents":false,"sentence_source":"那慢慢的我会发现我不再害怕了。","sentence_en":"Then gradually I realized I'm no longer afraid."},{"id":"376","start":2835.62,"end":2840.3,"displayStart":2835.62,"displayEnd":2840.3,"displayMid":2837.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":1.062006,"pitch":22.519606,"speechRate":5.79,"hasEvents":false,"sentence_source":"但是我还是有别的恐惧，我不太害怕成为这个人或那个人。","sentence_en":"But I still have other fears. I'm not so afraid of becoming this or that person."},{"id":"377","start":2840.3,"end":2849.86,"displayStart":2840.3,"displayEnd":2849.86,"displayMid":2845.08,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.917069,"pitch":15.301814,"speechRate":4.557,"hasEvents":false,"sentence_source":"但是还有一些人的终极的不安和恐惧，这种危机感我觉得是支持写作很重要的一个动力，你害怕什么呢?","sentence_en":"But there are also ultimate anxieties and fears. I think this sense of crisis is a very important motivation for writing. What are you afraid of?"},{"id":"378","start":2849.88,"end":2851.14,"displayStart":2849.88,"displayEnd":2851.14,"displayMid":2850.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.898487,"pitch":14.201535,"speechRate":6.278,"hasEvents":false,"sentence_source":"具体害怕什么呢?","sentence_en":"Specifically, what are you afraid of?"},{"id":"379","start":2851.24,"end":2864.56,"displayStart":2851.24,"displayEnd":2864.56,"displayMid":2857.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Negative","score":-0.6,"loudness":0.931882,"pitch":17.479158,"speechRate":4.699,"hasEvents":false,"sentence_source":"很多啊 害怕活着没有意思啊，你会害怕你做再多的努力可能都是一场空，都是毫无意义的 那也会害怕亲人的离去，也会害怕爱而不得 亲情当中也会有。","sentence_en":"A lot. Afraid of living without meaning, afraid that no matter how hard you try, it might all be in vain and meaningless. Also afraid of losing loved ones, afraid of unrequited love—even in family."},{"id":"380","start":2864.56,"end":2870.38,"displayStart":2864.56,"displayEnd":2870.38,"displayMid":2867.4700000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Negative","score":-0.5,"loudness":0.906455,"pitch":17.419567,"speechRate":5.434,"hasEvents":false,"sentence_source":"友谊也会 你不知道为什么就不好了，不知道为什么 好好的一个人就不在了。","sentence_en":"Friendship too—you don't know why it goes bad, why a good person is suddenly gone."},{"id":"381","start":2870.38,"end":2874.2,"displayStart":2870.38,"displayEnd":2874.2,"displayMid":2872.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Negative","score":-0.4,"loudness":0.958241,"pitch":13.989079,"speechRate":4.878,"hasEvents":false,"sentence_source":"那这一些的感受还是会很强烈的触动到我。","sentence_en":"These feelings still affect me strongly."},{"id":"382","start":2874.2,"end":2883.16,"displayStart":2874.2,"displayEnd":2883.16,"displayMid":2878.68,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster" yMid":2906.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.6,"loudness":0.83784,"pitch":22.103563,"speechRate":4.714,"hasEvents":false,"sentence_source":"紧张 而且我觉得还是经常会有心酸的感受，跟很难以跟别人说清楚的那种感受。","sentence_en":"Tension, and I still often feel a sense of bitterness, a feeling that's hard to explain to others."},{"id":"387","start":2910.12,"end":2918.78,"displayStart":2910.12,"displayEnd":2918.78,"displayMid":2914.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.853908,"pitch":16.078568,"speechRate":5.294,"hasEvents":false,"sentence_source":"因为我现在做教师做了六七年，会有职业的困境，例如觉得所有的事情都是可以说清楚，都是可以表达出来的。","sentence_en":"Because I've been a teacher for six or seven years, I face professional dilemmas. For example, I feel everything can be explained and expressed."},{"id":"388","start":2918.78,"end":2928.04,"displayStart":2918.78,"displayEnd":2928.04,"displayMid":2923.41,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.5,"loudness":0.940781,"pitch":19.701546,"speechRate":4.656,"hasEvents":false,"sentence_source":"但是在我表达了很多过度表达的这个环境当中，也会有一种非常强大的力量，会让我没有办法说出来。","sentence_en":"But in this environment where I've already expressed too much, there's also a very powerful force that prevents me from speaking out."},{"id":"389","start":2928.04,"end":2943.74,"displayStart":2928.04,"displayEnd":2943.74,"displayMid":2935.89,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.893358,"pitch":18.652504,"speechRate":4.832,"hasEvents":false,"sentence_source":"那那种力量我觉得是一个非常真实的，我的对于自己生存的处境的一个看法，另外一方面就是，我已经从原来的那个不快乐的原生的家庭挣脱出来，我也在慢慢的处理一个中年人。","sentence_en":"That kind of power, I think, is a very real view of my own survival situation. On the other hand, I've already broken free from my unhappy original family, and I'm slowly dealing with being a middle-aged person."},{"id":"390","start":2943.74,"end":2947.24,"displayStart":2943.74,"displayEnd":2947.24,"displayMid":2945.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.674282,"pitch":15.154691,"speechRate":4.571,"hasEvents":false,"sentence_source":"他会面临到的这个和亲人之间的关系。","sentence_en":"It also involves relationships with family."},{"id":"391","start":2947.24,"end":2958.48,"displayStart":2947.24,"displayEnd":2958.48,"displayMid":2952.8599999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.914309,"pitch":14.956325,"speechRate":5.477,"hasEvents":false,"sentence_source":"那我仍然不是一个很擅长处理关系的人，尽管我一直在写小说，我可以理解为我写小说的这个过程，就是我在假设这些关系会议这样的方式升涨。","sentence_en":"I'm still not very good at handling relationships, even though I keep writing novels. I can understand my novel writing process as me imagining relationships developing in certain ways."},{"id":"392","start":2958.48,"end":2964.32,"displayStart":2958.48,"displayEnd":2964.32,"displayMid":2961.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Negative","score":-0.4,"loudness":0.840412,"pitch":13.244962,"speechRate":5.479,"hasEvents":false,"sentence_source":"但是在现实生活当中，它可能还是处在胶水当中，没有办法有进展的一个情况。","sentence_en":"But in real life, it might still be stuck in glue, unable to make progress."},{"id":"393","start":2964.32,"end":2968.6,"displayStart":2964.32,"displayEnd":2968.6,"displayMid":2966.46,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.867169,"pitch":17 3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.826817,"pitch":22.869022,"speechRate":5.607,"hasEvents":false,"sentence_source":"因为我觉得这就是亲人吧，你如果从物质的角度来讲，这个事情是没有意义的呀。","sentence_en":"Because that's what family is. From a material perspective, it's meaningless."},{"id":"430","start":3204.16,"end":3209.76,"displayStart":3204.16,"displayEnd":3209.76,"displayMid":3206.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Positive","score":0.5,"loudness":0.948913,"pitch":19.95377,"speechRate":5.2,"hasEvents":false,"sentence_source":"但是从精神上来讲说，他们确实完成了一个我外婆相信的那个价值。","sentence_en":"But spiritually, they truly honored a value my grandmother believed in."},{"id":"431","start":3209.76,"end":3220.52,"displayStart":3209.76,"displayEnd":3220.52,"displayMid":3215.1400000000003,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.905471,"pitch":23.761862,"speechRate":7.006,"hasEvents":false,"sentence_source":"你刚才讲到那个手工的力量，我就想到那个早年那个美国顶90年代，也是威罗娜耐德演的叫How to make an American quilt，如何制作美国什么被子。","sentence_en":"You mentioned the power of handiwork. It reminds me of an early 1990s American film called 'How to Make an American Quilt' starring Winona Ryder."},{"id":"432","start":3220.52,"end":3225.52,"displayStart":3220.52,"displayEnd":3225.52,"displayMid":3223.02,"speaker":"Zhang Yiwei","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"The Power of Writing","sentiment_en":"Neutral","score":0,"loudness":0.89374,"pitch":23.852571,"speechRate":5.4,"hasEvents":false,"sentence_source":"我不知道中文翻成是什么，就也是讲美国，就是他们两代几个女性。","sentence_en":"I don't know the Chinese title. It's also about American women across two generations."},{"id":"433","start":3225.52,"end":3229.46,"displayStart":3225.52,"displayEnd":3229.46,"displayMid":3227.49,"speaker":"Zhang Yiwei" s":false,"sentence_source":"那包括另外 宇光中也写过一些，在《逍遥游》当中也写过一些，此外就是王毅老师在95年的时候，曾经编过一本散文选。","sentence_en":"Also, Yu Guangzhong wrote some in his book \"Free and Easy Wandering.\" Besides that, Wang Yi compiled an essay collection in 1995."},{"id":"633","start":4484.57,"end":4491.81,"displayStart":4484.57,"displayEnd":4491.81,"displayMid":4488.1900000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Neutral","score":0,"loudness":0.6997,"pitch":16.351458,"speechRate":4.144,"hasEvents":false,"sentence_source":"但是这个散文选叫，王毅选金人散文，里面有第一篇的导读，叫《情感的生命》。","sentence_en":"That collection is called \"Wang Yi's Selected Essays of Modern Writers.\" The first essay's introduction is titled \"The Life of Emotion."},{"id":"634","start":4491.81,"end":4504.61,"displayStart":4491.81,"displayEnd":4504.61,"displayMid":4498.21,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Positive","score":0.7,"loudness":0.859152,"pitch":16.674532,"speechRate":4.844,"hasEvents":false,"sentence_source":"那这篇是写得非常好的一个导读的序，他就讲到说，散文的质量取决于情感的质量，而尖锐和痛苦是情感的质量的来源，这个观点对我影响是非常大的。","sentence_en":"That introduction is excellent—it says the quality of prose depends on the quality of emotion, and sharpness and pain are the source of emotional quality. This idea greatly influenced me."},{"id":"635","start":4504.61,"end":4518.85,"displayStart":4504.61,"displayEnd":4518.85,"displayMid":4511.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Qiong Yao novels","sentiment_en":"Positive","score":0.6,"loudness":0.839978,"pitch":14.478237,"speechRate":3.933,"hasEvents":false,"sentence_source":"基本上是奠定了我自己看待什么是好的三文写作，不管是情感类、抒情类的还是有迹，包括《非虚构》这一整个脉络当中很重要的一个影响。","sentence_en":"It basically shaped how I see good prose writing, whether emotional, lyrical, or narrative, including the whole vein of non-fiction."},{"id":"636","start":4518.85,"end":453 <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
