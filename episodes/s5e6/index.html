","sentence_en":"During that time, I would be heavily influenced by the book—my whole world was in it, and my writing style might even resemble the author's a bit."},{"id":"81","start":588.18,"end":592.1,"displayStart":588.18,"displayEnd":592.1,"displayMid":590.14,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.753492,"pitch":21.334232,"speechRate":4.592,"hasEvents":false,"sentence_source":"就你说你人生开始的晚 你说是从翻译开始。","sentence_en":"You said your life started late, that it began with translation."},{"id":"82","start":592.1,"end":595.22,"displayStart":592.1,"displayEnd":595.22,"displayMid":593.6600000000001,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.555871,"pitch":22.369089,"speechRate":4.167,"hasEvents":false,"sentence_source":"那翻译之前的人生呢 怎么算 对。","sentence_en":"What about the life before translation? How do you count that? Right."},{"id":"83","start":595.22,"end":603.04,"displayStart":595.22,"displayEnd":603.04,"displayMid":599.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.5,"loudness":1.03579,"pitch":25.373755,"speechRate":5.065,"hasEvents":false,"sentence_source":"我觉得严格来说，我的人生是从那场车祸开始的吧，就是因为那场车祸我才找到了翻译的东西。","sentence_en":"I feel that strictly speaking, my life started from that car accident. It was because of the accident that I found translation."},{"id":"84","start":603.04,"end":611.06,"displayStart":603.04,"displayEnd":611.06,"displayMid":607.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Neutral","score":-0.1,"loudness":0.952377,"pitch":21.469477,"speechRate":4.425,"hasEvents":false,"sentence_source":"我觉得在那之前我一直是一个特别听话的人，小镇作题家嘛 就是在小镇好好地作题。","sentence_en":"Before that, I think I was always a very obedient person, a 'small-town exam taker'—just diligently doing problems in a small town."},{"id":"85","start":611.06,"end":625.28,"displayStart":611.06,"displayEnd":625.28,"displayMid":618.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Neutral","score":-0.1,"loudness":0.870578,"pitch":20.478193,"speechRate":3.657,"hasEvents":false,"sentence_source":"然后考上重点 中学 重点 大学，大学的时候 我也始终是一个结果导向的人，在那个时候 就是非常盲目地跟着老师进行一些阅读。","sentence_en":"Then I got into a top middle school and a top university. In college, I was always results-oriented, blindly following teachers in reading assignments."},{"id":"86","start":625.28,"end":637.18,"displayStart":625.28,"displayEnd":637.18,"displayMid":631.23,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Negative","score":-0.3,"loudness":0.953749,"pitch":29.326721,"speechRate":4.531,"hasEvents":false,"sentence_source":"但你只感觉到这是一个好像伴随你很久的习惯跟任务，你没有觉得离不开他 你没有觉得 哇 这个东西给我很大的情感冲击。","sentence_en":"But you just felt it was a long-standing habit and task; you didn't feel you couldn't live without it, or that 'wow, this gives me such an emotional impact."},{"id":"87","start":637.18,"end":643.76,"displayStart":637.18,"displayEnd":643.76,"displayMid":640.47,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Negative","score":-0.6,"loudness":0.933348,"pitch":23.74909,"speechRate":4.255,"hasEvents":false,"sentence_source":"或者什么的﹐然后直到我教了毕业乐文的第二天，突然就是出了车祸。","sentence_en":"The day after I submitted my graduation thesis, I suddenly got into a car accident."},{"id":"88","start":643.76,"end":654.98,"displayStart":643.76,"displayEnd":654.98,"displayMid":649.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Negative","score":-0.5,"loudness":0.979231,"pitch":25.819029,"speechRate":4.635,"hasEvents":false,"sentence_source":"然后这个时候就强迫我有一段时间是躺在床上的，经历住院啊 手术啊 各种各样的一系列的东西，前后住院大概一年半的时间。","sentence_en":"This forced me to stay in bed for a while, going through hospitalization, surgery, and all sorts of things—about a year and a half in total."},{"id":"89","start":654.98,"end":660.7,"displayStart":654.98,"displayEnd":660.7,"displayMid":657.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.6,"loudness":0.862506,"pitch":23.662146,"speechRate":4.413,"hasEvents":false,"sentence_source":"然后这个时候你才感受到，阅读对你人生的这种陪伴的作用。","sentence_en":"It was then that I truly felt reading's role as a companion in my life."},{"id":"90","start":660.7,"end":665.56,"displayStart":660.7,"displayEnd":665.56,"displayMid":663.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Neutral","score":0.2,"loudness":0.856335,"pitch":24.479712,"speechRate":4.224,"hasEvents":false,"sentence_source":"然后你觉得你才在病床上去阅读其他人的书籍。","sentence_en":"And I read other people's books while lying on the hospital bed."},{"id":"91","start":665.56,"end":680.6,"displayStart":665.56,"displayEnd":680.6,"displayMid":673.0799999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Negative","score":-0.4,"loudness":0.864291,"pitch":22.201527,"speechRate":3.989,"hasEvents":false,"sentence_source":"然后感受到这种她对你心灵的这种安慰，而且当时我受伤的时候，我的身边的几乎是所有人都觉得我好可怜啊，你为什么在人生这个关键的节点。","sentence_en":"I felt the comfort it gave my soul. When I was injured, almost everyone around me thought I was pitiful: 'Why at this critical point in your life?"},{"id":"92","start":680.6,"end":690.4,"displayStart":680.6,"displayEnd":690.4,"displayMid":685.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Negative","score":-0.5,"loudness":0.905976,"pitch":23.003521,"speechRate":4.702,"hasEvents":false,"sentence_source":"你要么应该去做新的工作，你要么就应该去考研，或者你就应该出国，就是各种各样这种出路，我都没办法选择。","sentence_en":"You should either start a new job, take the graduate exam, or go abroad—all kinds of paths I couldn't choose."},{"id":"93","start":690.4,"end":701.5,"displayStart":690.4,"displayEnd":701.5,"displayMid":695.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.7,"loudness":0.912698,"pitch":23.858644,"speechRate":4.727,"hasEvents":false,"sentence_source":"但是我自己没有这样觉得，我反而觉得很切异，第一个就是 我开始真正的感受到我离不开阅读，虽然以前我一直是一个阅读者。","sentence_en":"But I didn't feel that way. Instead, I felt something strange: first, I truly realized I couldn't live without reading, even though I had always been a reader."},{"id":"94","start":701.5,"end":709.2,"displayStart":701.5,"displayEnd":709.2,"displayMid":705.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.90403,"pitch":25.796522,"speechRate":4.066,"hasEvents":false,"sentence_source":"但是在这个期间 我终于感受到，我是发自内心的 自主的去离不开她 喜欢她。","sentence_en":"But during this period, I finally felt that I genuinely, willingly couldn't live without it and loved it."},{"id":"95","start":709.2,"end":719.6,"displayStart":709.2,"displayEnd":719.6,"displayMid":714.4000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Strongly Negative","score":-0.8,"loudness":0.897642,"pitch":25.498701,"speechRate":4.231,"hasEvents":true,"sentence_source":"那段时间我读的大部分都是你作家的书，我记得我拿起卡森麦卡尔斯写的那个，《心是孤独》的列手，哇 我就哭。","sentence_en":"During that time, I mostly read the author's books. I remember picking up Carson McCullers' 'The Heart Is a Lonely Hunter' and just crying. ,"displayMid":1460.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":1.004856,"pitch":23.074131,"speechRate":5.233,"hasEvents":false,"sentence_source":"然后看了之后说，我也在北京上学 上了这么多年，还要继续回去做社书啊，或者工作之类的。","sentence_en":"After reading it, I thought: I've been studying in Beijing for years and will go back for social work or a job."},{"id":"201","start":1464.37,"end":1471.39,"displayStart":1464.37,"displayEnd":1471.39,"displayMid":1467.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.6,"loudness":0.85063,"pitch":22.265892,"speechRate":5.341,"hasEvents":false,"sentence_source":"然后我也很喜欢这本书，我也有翻译经验，我是不是可以把你这本书翻成中文，跟她联系。","sentence_en":"I really liked the book, and since I had translation experience, I asked if I could translate it into Chinese and contacted her."},{"id":"202","start":1471.39,"end":1477.49,"displayStart":1471.39,"displayEnd":1477.49,"displayMid":1474.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.5,"loudness":0.884892,"pitch":19.986776,"speechRate":4.403,"hasEvents":false,"sentence_source":"然后也联系了大陆的出版社，这样就开始我的《非虚构翻译之旅》。","sentence_en":"Then I contacted a mainland publisher, and that began my journey of translating nonfiction."},{"id":"203","start":1477.49,"end":1492.03,"displayStart":1477.49,"displayEnd":1492.03,"displayMid":1484.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.954327,"pitch":24.517544,"speechRate":4.333,"hasEvents":false,"sentence_source":"因为在那之前都是做的，女性的小书，比较好读的那种小书的翻译，后来就不知道为什么，就是一件事情到另一件事情，就翻译了很多外国人写中国的书哇。","sentence_en":"Before that, I'd only translated short women's books, easy reads. Then, one thing led to another, and I ended up translating many books by foreigners about China."},{"id":"204","start":1492.03,"end":1505.71,"displayStart":1492.03,"displayEnd":1505.71,"displayMid":1498.87,"speaker":"He Yujia","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.893229,"pitch":23.073053,"speechRate":5.687,"hasEvents":false,"sentence_source":"你是会在，比如说你在翻译讲，北京的时候你会去北京，胡同里面做那种City Walk，就你每翻译本书，会把自己尽可能放到书里面所描写的那个场景，和情境当中去体验一下生活吗。","sentence_en":"So when translating, say, a book about Beijing, would you go to the hutongs for a city walk? For every book you translate, do you try to immerse yourself in the scenes and settings described?"},{"id":"205","start":1506.27,"end":1510.75,"displayStart":1506.27,"displayEnd":1510.75,"displayMid":1508.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":1.116073,"pitch":26.688293,"speechRate":5.58,"hasEvents":false,"sentence_source":"也不是每本书都这样，就是因为有的时候还是有一些限制嘛。","sentence_en":"Not every book, because sometimes there are limitations."},{"id":"206","start":1510.75,"end":1526.31,"displayStart":1510.75,"displayEnd":1526.31,"displayMid":1518.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.5,"loudness":0.931766,"pitch":27.107412,"speechRate":4.756,"hasEvents":false,"sentence_source":"但是我会蛮尽量的，就比如说我翻在回老北京的时候，就是它里面有一些人民啊 地民啊，我会在网上搜，如果能够搜到它的消息，我就打电话问那个人，我还会通知他，我说你知不知道。","sentence_en":"But I try my best. For example, when I return to old Beijing, there are some people and locals in it. I search online, and if I can find their news, I call them and inform them, saying, 'Do you know...'"},{"id":"207","start":1526.31,"end":1529.35,"displayStart":1526.31,"displayEnd":1529.35,"displayMid":1527.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.6,"loudness":0.900696,"pitch":26.792871,"speechRate":6.25,"hasEvents":false,"sentence_source":"你出现在一本书里面，这个书版写得非常的好。","sentence_en":"You appear in a book, and the writing is very good."},{"id":"208","start":1529.35,"end":1531.13,"displayStart":1529.35,"displayEnd":1531.13,"displayMid":1530.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":1.224613,"pitch":28.047852,"speechRate":5.056,"hasEvents":false,"sentence_source":"然后还写到你那个电。","sentence_en":"And it even mentioned your shop."},{"id":"209","start":1531.13,"end":1545.35,"displayStart":1531.13,"displayEnd":1545.35,"displayMid":1538.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.6,"loudness":0.956646,"pitch":24.341938,"speechRate":4.008,"hasEvents":true,"sentence_source":"然后等他中文版出来之后，你的那个民宿或者是你的那个餐馆就会大火，我这样告诉她，就是去跟这个里面写的人产生连接还蛮有意思的。","sentence_en":"After the Chinese edition comes out, your guesthouse or restaurant might become hugely popular. I told her it's interesting to connect with the people written about."},{"id":"210","start":1545.97,"end":1561.19,"displayStart":1545.97,"displayEnd":1561.19,"displayMid":1553.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.5,"loudness":0.925752,"pitch":22.43639,"speechRate":4.631,"hasEvents":true,"sentence_source":"包括后来这个中文版出来之后我也尽量的去帮Michael找到了里面写到的很多人，就是能够交给他们一本书，很多我翻的《非虚构》的作品尤其是外国人写中国的。","sentence_en":"After the Chinese edition came out, I tried to help Michael find many of the people he wrote about, so I could give them a copy. Many of the nonfiction works I translate, especially those by foreigners about China."},{"id":"211","start":1561.19,"end":1564.13,"displayStart":1561.19,"displayEnd":1564.13,"displayMid":1562.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.939334,"pitch":20.398087,"speechRate":5.323,"hasEvents":false,"sentence_source":"我都会尽量去找到里面写到的人。","sentence_en":"I try to find the people mentioned in the books."},{"id":"212","start":1564.13,"end":1566.45,"displayStart":1564.13,"displayEnd":1566.45,"displayMid":1565.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.526855,"pitch":14.640728,"speechRate":4.31,"hasEvents":false,"sentence_source":"然后交给他们一门书这。","sentence_en":"And give them a copy."},{"id":"213","start":1566.45,"end":1567.93,"displayStart":1566.45,"displayEnd":1567.93,"displayMid":1567.19,"speaker":"He Yujia","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":1.037348,"pitch":31.583748,"speechRate":6.757,"hasEvents":false,"sentence_source":"也是个额外的一些工作。","sentence_en":"It's also some extra work."},{"id":"214","start":1567.93,"end":1569.97,"displayStart":1567.93,"displayEnd":1569.97,"displayMid":1568.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.5,"loudness":0.833514,"pitch":30.762548,"speechRate":7.821,"hasEvents":false,"sentence_source":"但这个额外的工作还蛮有意思的。","sentence_en":"But this extra work is actually quite interesting."},{"id":"215","start":1569.97,"end":1576.13,"displayStart":1569.97,"displayEnd":1576.13,"displayMid":1573.0500000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.6,"loudness":1.060412,"pitch":28.548838,"speechRate":3.512,"hasEvents":false,"sentence_source":"对 我觉得是我通过翻译拓展我人生的一种方式吧。","sentence_en":"Yeah, I think it's a way for me to expand my life through translation."},{"id":"216","start":1576.13,"end":1589.07,"displayStart":1576.13,"displayEnd":1589.07,"displayMid":1582.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.5,"loudness":0.941229,"pitch":25.348637,"speechRate":4.602,"hasEvents":false,"sentence_source":"因为本身在翻译之外的话，我的性格也是非常的喜欢去跟人交流的，用现在的话说就是特别易的一个人，你居然是个艺人 我不能说自己是哀人。","sentence_en":"Because aside from translation, I'm very outgoing—in today's terms, a total 'E' person. An extrovert? I can't call myself an introvert."},{"id":"217","start":1589.07,"end":1590.85,"displayStart":1589.07,"displayEnd":1590.85,"displayMid":1589.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.5,"loudness":0.967484,"pitch":25.90205,"speechRate":4.571,"hasEvents":false,"sentence_source":"因为我非常的活泼。","sentence_en":"Because I'm very lively."},{"id":"218","start":1591.31,"end":1593.95,"displayStart":1591.31,"displayEnd":1593.95,"displayMid":1592.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Neutral","score":0,"loudness":1.20219,"pitch":28.223465,"speechRate":5.773,"hasEvents":false,"sentence_source":"所以如果我自称是一个哀人的话。","sentence_en":"So if I called myself an introvert,"},{"id":"219","start":1593.95,"end":1597.73,"displayStart":1593.95,"displayEnd":1597.73,"displayMid":1595.8400000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Physical changes","sentiment_en":"Positive","score":0.4,"loudness":0.846277,"pitch":22.592981,"speechRate":3.704,"hasEvents":false,"sentence_source":"那世界上可能艺人就比较少了吧。","sentence_en":"then there would be very few extroverts in the world."},{"id":"220","start":1597.73,"end":1599.27,"displayStart":1597.73,"displayEnd":1599.27,"displayMid":1598.5,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":1.116974,"pitch":34.147121,"speechRate":5.195,"hasEvents":false,"sentence_source":"一个艺人去做一个。","sentence_en":"An extrovert doing that kind of work?"},{"id":"221","start":1599.27,"end":1603.51,"displayStart":1599.27,"displayEnd":1603.51,"displayMid":1601.3899999999999,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Negative","score":-0.4,"loudness":0.939913,"pitch":24.188093,"speechRate":6.132,"hasEvents":false,"sentence_source":"其实翻译是一个满孤独的一个工作，就在你创作的那过程当中。","sentence_en":"Actually, translation is a quite lonely job, especially in the creative process."},{"id":"222","start":1603.51,"end":1609.75,"displayStart":1603.51,"displayEnd":1609.75,"displayMid":1606.63,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.956981,"pitch":20.424274,"speechRate":4.85,"hasEvents":false,"sentence_source":"因为就是你面对你的，要翻译的那个作品，他需要把世界暂时的挡在外边。","sentence_en":"Because you face the work you're translating; it requires shutting out the world temporarily."},{"id":"223","start":1609.75,"end":1615.61,"displayStart":1609.75,"displayEnd":1615.61,"displayMid":1612.6799999999998,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.887147,"pitch":25.338808,"speechRate":5.445,"hasEvents":false,"sentence_source":"那这个过程对一个艺人来说，是一个有他孤独的地方吗，还是你乐在其中。","sentence_en":"So for an extrovert, is that lonely, or do you enjoy it?"},{"id":"224","start":1615.61,"end":1630.37,"displayStart":1615.61,"displayEnd":1630.37,"displayMid":1622.9899999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.6,"loudness":1.005107,"pitch":25.429567,"speechRate":4.352,"hasEvents":false,"sentence_source":"对我来说实在是太安全了，就很多时候 我可能在别人面前是特别外放 特别输出的一个人，就是 我可能讲我的爱好 讲我正在读的书 或者正在翻译的书。","sentence_en":"For me, it's extremely safe. Often, I'm very outgoing and expressive in front of others—I talk about my hobbies, the books I'm reading or translating."},{"id":"225","start":1630.37,"end":1643.69,"displayStart":1630.37,"displayEnd":1643.69,"displayMid":1637.03,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.7,"loudness":0.947664,"pitch":25.76561,"speechRate":4.129,"hasEvents":false,"sentence_source":"而我正在做的事情 但是当我面对我的屏幕和键盘的时候，只有作者跟我 然后我是躲在作者背后说话的，这个实在是太安全 太舒适了。","sentence_en":"But when I'm facing my screen and keyboard, it's just me and the author. I speak from behind the author. That's so safe and comfortable."},{"id":"226","start":1643.69,"end":1652.21,"displayStart":1643.69,"displayEnd":1652.21,"displayMid":1647.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.886157,"pitch":24.458227,"speechRate":3.991,"hasEvents":false,"sentence_source":"我自己翻译的时候那个场景也不是很安静，就是我的键盘是机械键盘 它非常的吵。","sentence_en":"My own translation scene isn't quiet either—my keyboard is mechanical and very loud."},{"id":"227","start":1652.21,"end":1660.75,"displayStart":1652.21,"displayEnd":1660.75,"displayMid":1656.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.987665,"pitch":25.8883,"speechRate":5.683,"hasEvents":false,"sentence_source":"然后那个声音就是伴随着我的，已经读完一本书 然后你开始翻译它的时候，你会重新再去更深入地去理解那段话。","sentence_en":"That sound accompanies me. After finishing a book, when you start translating, you re-understand the passage more deeply."},{"id":"228","start":1660.75,"end":1666.69,"displayStart":1660.75,"displayEnd":1666.69,"displayMid":1663.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.964544,"pitch":24.305536,"speechRate":4.452,"hasEvents":false,"sentence_source":"然后再翻到那段话的时候，我就会看着那段话说 哇 写的好好啊。","sentence_en":"Then when I get to that passage, I look at it and think, 'Wow, that's so well written."},{"id":"229","start":1666.69,"end":1677.11,"displayStart":1666.69,"displayEnd":1677.11,"displayMid":1671.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.7,"loudness":1.060831,"pitch":26.879995,"speechRate":4.684,"hasEvents":false,"sentence_source":"然后我觉得它写的特别好，我就会非常大声地把它朗读一遍，朗读完之后 我就在键盘上疯狂地敲字 敲出他的中文。","sentence_en":"And if I think it's particularly good, I'll read it out loud very loudly. After reading, I frantically type the Chinese version."},{"id":"230","start":1677.11,"end":1690.77,"displayStart":1677.11,"displayEnd":1690.77,"displayMid":1683.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.6,"loudness":0.936471,"pitch":25.093418,"speechRate":4.1,"hasEvents":false,"sentence_source":"然后又把我的中文在朗读一遍说 我翻的也是不错的，就在那个时刻 我是被作家所保护的，我这个时候 我不需要承担任何气氛组的作用。","sentence_en":"Then I read my Chinese version aloud and say, 'My translation is pretty good too.' At that moment, I'm protected by the author. I don't need to be a mood maker."},{"id":"231","start":1690.77,"end":1698.29,"displayStart":1690.77,"displayEnd":1698.29,"displayMid":1694.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.5,"loudness":0.868349,"pitch":23.1415,"speechRate":4.405,"hasEvents":false,"sentence_source":"或者我不用担心外面的人 有什么对我及时的反馈或者什么的，我就是 我和他。","sentence_en":"Or worry about immediate feedback from others. It's just me and him."},{"id":"232","start":1698.29,"end":1703.85,"displayStart":1698.29,"displayEnd":1703.85,"displayMid":1701.07,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.884382,"pitch":27.164627,"speechRate":5.216,"hasEvents":false,"sentence_source":"对 对于一个译者来说 他其实面对着 你是在两种文字当中做一个桥梁。","sentence_en":"Yes, for a translator, you're a bridge between two languages."},{"id":"233","start":1703.85,"end":1708.09,"displayStart":1703.85,"displayEnd":1708.09,"displayMid":1705.9699999999998,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.811797,"pitch":25.36227,"speechRate":5.189,"hasEvents":false,"sentence_source":"那这个时候你是被两种文字都呵护着的吗，就是这样。","sentence_en":"And at that moment, you're sheltered by both languages? Exactly."},{"id":"234","start":1708.09,"end":1722.67,"displayStart":1708.09,"displayEnd":1722.67,"displayMid":1715.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.5,"loudness":0.941929,"pitch":25.444664,"speechRate":3.841,"hasEvents":false,"sentence_source":"的 就是我看原文的时候 我脑子里面浮现出的画面 或者是浮现出的意象，我在用中文把它表现出来 很多时候是特别流畅的 不会有组织。","sentence_en":"When I read the original, images or imagery come to mind, and I express them in Chinese. Often it's very fluid, no blockage."},{"id":"235","start":1722.67,"end":1736.59,"displayStart":1722.67,"displayEnd":1736.59,"displayMid":1729.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.5,"loudness":0.979668,"pitch":28.338573,"speechRate":4.67,"hasEvents":false,"sentence_source":"因为是跟作者间接的交流嘛，你也不担心有一个人会及时给你一个反应，不会说有老师在背后站着，在监督你什么的，所有的这种东西都是你个人和一段文字。","sentence_en":"Because it's indirect communication with the author—no one reacts immediately, no teacher standing behind. It's just you and the text."},{"id":"236","start":1736.59,"end":1751.41,"displayStart":1736.59,"displayEnd":1751.41,"displayMid":1744,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.7,"loudness":0.85276,"pitch":24.434719,"speechRate":4.049,"hasEvents":false,"sentence_source":"你好像是在帮作家用中文在说话，你变成他中文里面的这个声音，这个voice，整个的感觉就是一次最深入的，最完整的这种阅读理解的体验。","sentence_en":"It's like helping the author speak in Chinese. You become their voice in Chinese. The whole feeling is the deepest, most complete reading comprehension experience."},{"id":"237","start":1751.93,"end":1761.19,"displayStart":1751.93,"displayEnd":1761.19,"displayMid":1756.56,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.908025,"pitch":24.94558,"speechRate":4.573,"hasEvents":false,"sentence_source":"对 因为我们都明白翻译的过程其实你总会失去一些什么，翻译是没有办法百分之百的去呈现出来。","sentence_en":"Yes, because we all know that in translation, you always lose something. It's impossible to present it 100%."},{"id":"238","start":1761.19,"end":1774.17,"displayStart":1761.19,"displayEnd":1774.17,"displayMid":1767.68,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Positive","score":0.5,"loudness":0.852065,"pitch":25.138319,"speechRate":5.393,"hasEvents":false,"sentence_source":"我们只是尽可能的抵达嘛但是，你总觉得这个过程它很奇妙，像是个游戏一样，而且这个游戏的过程其实是一个角力的过程对，就是你要比一比到底看此刻谁更聪明一点。","sentence_en":"We just try to get there as best we can, but you always feel the process is amazing, like a game. And the game is actually a contest—you compare to see who's smarter at the moment."},{"id":"239","start":1774.17,"end":1777.03,"displayStart":1774.17,"displayEnd":1777.03,"displayMid":1775.6,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.876703,"pitch":25.810665,"speechRate":5.594,"hasEvents":false,"sentence_source":"我就记得我们在上大学的时候翻译课。","sentence_en":"I remember our translation class in college."},{"id":"240","start":1777.03,"end":1781.41,"displayStart":1777.03,"displayEnd":1781.41,"displayMid":1779.22,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Neutral","score":0,"loudness":0.860571,"pitch":26.161224,"speechRate":6.393,"hasEvents":false,"sentence_source":"因为我们是更多的新闻翻译，有一次老师让我们翻译一篇新闻稿子。","sentence_en":"Since we focused more on news translation, one time the teacher asked us to translate a press release."},{"id":"241","start":1781.41,"end":1782.95,"displayStart":1781.41,"displayEnd":1782.95,"displayMid":1782.18,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Strongly Negative","score":-0.9,"loudness":0.70399,"pitch":25.131794,"speechRate":7.143,"hasEvents":false,"sentence_source":"然后我们所有人就崩溃了。","sentence_en":"And we all broke down."},{"id":"242","start":1782.95,"end":1790.43,"displayStart":1782.95,"displayEnd":1790.43,"displayMid":1786.69,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Negative","score":-0.6,"loudness":0.791592,"pitch":22.022331,"speechRate":5.533,"hasEvents":false,"sentence_source":"因为当时的新闻稿子充满了很多八股习气的那种文字，比如说讲一个工厂 说这个工厂关停并转。","sentence_en":"Because the press releases at the time were full of stereotyped writing, for example, talking about a factory being 'closed, halted, merged, or transformed'."},{"id":"243","start":1790.43,"end":1805.89,"displayStart":1790.43,"displayEnd":1805.89,"displayMid":1798.16,"speaker":"He Yujia","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Differences between different translation jobs","sentiment_en":"Negative","score":-0.5,"loudness":0.878384,"pitch":25.958721,"speechRate":4.943,"hasEvents":false,"sentence_source":"我们就完全傻了 我们说这怎么翻呢，老师就说你不要小看中文四个字关停并转，你要解释啊 就是四个从具啊，有的工厂就被关闭了 有的工厂就倒闭了，有的工厂转产 有的工厂停产。","sentence_en":"We were completely stunned. We said, how do we translate this? The teacher said, don't underestimate that four-character Chinese phrase. You need to explain it: some factories are shut down, some go bankrupt, some switch production, and some cease production."},{"id":"244","start":1805.89,"end":1808.65,"displayStart":1805.89,"displayEnd":1808.65,"displayMid":1807.27,"speaker":"He Yujia","speakerColor":"#A29479","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.095,"pitch":26.741077,"speechRate":6,"hasEvents":false,"sentence_source":"我们说天呐 原来翻译是这么有趣的。","sentence_en":"We said, \"Wow, translation is actually this interesting."},{"id":"245","start":1808.65,"end":1820.01,"displayStart":1808.65,"displayEnd":1820.01,"displayMid":1814.33,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Neutral","score":0,"loudness":0.863037,"pitch":25.271591,"speechRate":4.032,"hasEvents":false,"sentence_source":"对 你说到游戏的时候 我的感受最深刻的就是，当她英文当中出现一些特定的修词，比如说她会压头晕的时候。","sentence_en":"Yes, when you mentioned games, what struck me most was when English has certain rhetorical devices, like when she uses alliteration."},{"id":"246","start":1820.51,"end":1823.93,"displayStart":1820.51,"displayEnd":1823.93,"displayMid":1822.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Neutral","score":0,"loudness":0.953254,"pitch":27.082739,"speechRate":4.658,"hasEvents":false,"sentence_source":"其实中文是没有压头晕这件事情的。","sentence_en":"Actually, Chinese doesn't have alliteration."},{"id":"247","start":1823.93,"end":1838.61,"displayStart":1823.93,"displayEnd":1838.61,"displayMid":1831.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Positive","score":0.5,"loudness":1.006329,"pitch":26.01358,"speechRate":4.255,"hasEvents":false,"sentence_source":"那我就想办法在中文里面压尾晕，或者是用同样的一个字来显得她这个韵律还在那里，比如说那个蓝叶里面，蓝叶 因为我知道你也很喜欢那个地点。","sentence_en":"So I tried to use end rhyme in Chinese, or use the same character to maintain the rhythm. For example, in 'Blue Leaves,' because I know you also really like that piece."},{"id":"248","start":1838.61,"end":1850.81,"displayStart":1838.61,"displayEnd":1850.81,"displayMid":1844.71,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Neutral","score":0,"loudness":0.989262,"pitch":25.382294,"speechRate":5.173,"hasEvents":false,"sentence_source":"她蓝叶里面她一开始有举了好几个词，就是蓝叶这个东西在英文里面可能有Glamoring Glittering，这里有好几个歌开头的词。","sentence_en":"In 'Blue Leaves', she listed several words at the beginning—like in English there's 'Glamoring', 'Glittering', several words starting with 'g'."},{"id":"249","start":1850.81,"end":1863.01,"displayStart":1850.81,"displayEnd":1863.01,"displayMid":1856.9099999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":8,"clusterLabel":"C8","clusterName":"Reading and Creation","sentiment_en":"Positive","score":0.4,"loudness":0.889196,"pitch":24.809685,"speechRate":4.18,"hasEvents":false,"sentence_source":"然后当时我想了一下我就一定需要有光这个词在中文里面，就是比如说微光 目光 闪光，就是各种各样的 就是用了几个光字。","sentence_en":"Then at that moment I thought, I definitely need the word 'light' in Chinese, like 'dim light', 'gaze', 'flash'—various ones, using the character 'light' a few times."},{"id":"250","start":1863.01,"end":1867.51,"displayStart":1863.01,"displayEnd":1867.51,"displayMid":1865.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.6,"loudness":1.018728,"pitch":23.745947,"speechRate":4.222,"hasEvents":true,"sentence_source":"然后就我觉得把歌这个发音给她get到了。","sentence_en":"And I felt I captured the 'g' sound that way."},{"id":"251","start":1868.45,"end":1872.51,"displayStart":1868.45,"displayEnd":1872.51,"displayMid":1870.48,"speaker":"He Yujia","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.982348,"pitch":32.281967,"speechRate":6.117,"hasEvents":true,"sentence_source":"对 我记得你在翻那个穷迪迪恩的《向伯立恒法》社的时候。","sentence_en":"Yes, I remember when you were translating Joan Didion's 'Slouching Towards Bethlehem'."},{"id":"252","start":1872.51,"end":1883.35,"displayStart":1872.51,"displayEnd":1883.35,"displayMid":1877.9299999999998,"speaker":"He Yujia","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Neutral","score":0,"loudness":0.978502,"pitch":29.042763,"speechRate":5.812,"hasEvents":false,"sentence_source":"因为穷迪迪恩是很喜欢描述加里弗尼亚什么旧金山那些地区的那个亚日代的寄风，他会描述各种各样的风，我记得你在《友业》里面你写了各种各样的风。","sentence_en":"Because Joan Didion loved to describe the seasonal winds of California, like in San Francisco. She described all kinds of winds. I remember in 'Youye' you wrote about various winds."},{"id":"253","start":1883.35,"end":1898.17,"displayStart":1883.35,"displayEnd":1898.17,"displayMid":1890.76,"speaker":"He Yujia","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Non-fiction books and related people","sentiment_en":"Positive","score":0.5,"loudness":0.936073,"pitch":26.816074,"speechRate":4.453,"hasEvents":false,"sentence_source":"什么坟风 暴风 还有钢风 还有什么干热风 密尸托拉风，我当时看了 我说 哇 在一页纸上有各种各样的风，我能想到 这个义者在当时翻译的时候想 天呐 这么多的风。","sentence_en":"Like 'fohn', 'storm wind', 'steel wind', 'dry heat wind', 'mistral'. When I saw that, I thought, 'Wow, so many winds on one page. I can imagine the translator thinking, 'My god, so many winds."},{"id":"254","start":1898.17,"end":1900.51,"displayStart":1898.17,"displayEnd":1900.51,"displayMid":1899.3400000000001,"speaker":"He Yujia","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":1.043111,"pitch":30.805174,"speechRate":5.983,"hasEvents":true,"sentence_source":"我该如何的去用中文精准的表达。","sentence_en":"How can I express this precisely in Chinese?"},{"id":"255","start":1901.05,"end":1907.03,"displayStart":1901.05,"displayEnd":1907.03,"displayMid":1904.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.4,"loudness":0.92954,"pitch":27.407078,"speechRate":3.344,"hasEvents":true,"sentence_source":"对 那个时候 确实那个书是我翻译的一个转折点。","sentence_en":"Yes, that book was indeed a turning point in my translation work."},{"id":"256","start":1907.83,"end":1921.83,"displayStart":1907.83,"displayEnd":1921.83,"displayMid":1914.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.84447,"pitch":25.290697,"speechRate":4.071,"hasEvents":false,"sentence_source":"因为其他的书很多时候是在我书室区之内的，大概了解这个东西 然后书里面的行文 逻辑非常清楚，当你第一次阅读她的时候 你就是懂的。","sentence_en":"Because with other books, they were often within my comfort zone—I roughly knew the subject, and the writing and logic were very clear. When you read it the first time, you understood it."},{"id":"257","start":1921.83,"end":1930.47,"displayStart":1921.83,"displayEnd":1930.47,"displayMid":1926.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.3,"loudness":0.970764,"pitch":25.335909,"speechRate":4.745,"hasEvents":false,"sentence_source":"当然开始翻那个《非虚构》的时候，后面几乎找上门的都是《非虚构》，很多《非虚构》作品是非常好读的。","sentence_en":"Of course, when I started translating non-fiction, almost all subsequent projects were non-fiction. Many non-fiction works are very easy to read."},{"id":"258","start":1930.47,"end":1942.07,"displayStart":1930.47,"displayEnd":1942.07,"displayMid":1936.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.4,"loudness":0.980506,"pitch":24.554724,"speechRate":4.573,"hasEvents":false,"sentence_source":"因为她传递她的信息的过程当中，她就需要做到一个语言的剪练跟叙事的这种生动，不需要你去揣摩 作者到底想要表达什么。","sentence_en":"Because in conveying information, the author needs concise language and vivid narration; you don't need to figure out what the author is trying to say."},{"id":"259","start":1942.07,"end":1944.97,"displayStart":1942.07,"displayEnd":1944.97,"displayMid":1943.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.3,"loudness":0.891226,"pitch":20.555752,"s .11,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.5,"loudness":0.841361,"pitch":23.750694,"speechRate":4.578,"hasEvents":false,"sentence_source":"我觉得我们如果体会过失去都会有，就是你不会承认 他一直不承认，他在那个书的最后才说，我决定要放下，我决定要承认你的失去。","sentence_en":"I think if we've experienced loss, we all have that—you won't admit it, he kept not admitting it, only at the end of the book did he say, 'I decide to let go, I decide to acknowledge your loss."},{"id":"349","start":2695.07,"end":2704.19,"displayStart":2695.07,"displayEnd":2704.19,"displayMid":2699.63,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.6,"loudness":0.980154,"pitch":26.247614,"speechRate":3.948,"hasEvents":false,"sentence_source":"对 约翰，然后到了蓝叶的时候 他已经，完全是一个把自己的悲伤展露在纸面上的状态。","sentence_en":"Right, John. Then by the time of 'Blue Nights', he was already in a state of fully exposing his grief on paper."},{"id":"350","start":2704.19,"end":2707.29,"displayStart":2704.19,"displayEnd":2707.29,"displayMid":2705.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.4,"loudness":1.127162,"pitch":31.039396,"speechRate":4.839,"hasEvents":false,"sentence_source":"然后她已经完全承认了人生的失去。","sentence_en":"And she had fully acknowledged the loss in life."},{"id":"351","start":2707.29,"end":2712.23,"displayStart":2707.29,"displayEnd":2712.23,"displayMid":2709.76,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.5,"loudness":0.851572,"pitch":21.898327,"speechRate":4.251,"hasEvents":false,"sentence_source":"然后她在思考自己的年岁无多 年华老去这件事情。","sentence_en":"And she was contemplating the fact that she doesn't have many years left, aging."},{"id":"352","start":2712.23,"end":2719.79,"displayStart":2712.23,"displayEnd":2719.79,"displayMid":2716.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.7,"loudness":0.814905,"pitch":25.235012,"speechRate":4.775,"hasEvents":false,"sentence_source":"然后整个的感觉就是给人一种，如果你站在旁观者的角度，你真的就是会更心痛的感觉。","sentence_en":"And the overall feeling gives you—if you stand from an observer's perspective, you really feel more heartache."},{"id":"353","start":2719.79,"end":2730.23,"displayStart":2719.79,"displayEnd":2730.23,"displayMid":2725.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Negative","score":-0.6,"loudness":0.803487,"pitch":25.969507,"speechRate":3.94,"hasEvents":false,"sentence_source":"所以当时地点给我的感觉就是一个承受了太多，伤痛只能自己记录下一些思维的异语的这种老人。","sentence_en":"So at that time, the author gave me the feeling of an old person who had endured too much, only able to record some strange thoughts in their pain."},{"id":"354","start":2730.23,"end":2735.23,"displayStart":2730.23,"displayEnd":2735.23,"displayMid":2732.73,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.949171,"pitch":23.35375,"speechRate":3.8,"hasEvents":false,"sentence_source":"然后我才好像反过去才接触到像玻璃横拔射。","sentence_en":"Then it was only later that I seemed to go back and encounter something like 'Slouching Towards Bethlehem'."},{"id":"355","start":2735.23,"end":2742.85,"displayStart":2735.23,"displayEnd":2742.85,"displayMid":2739.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0 "Different people encountered because of writing","sentiment_en":"Positive","score":0.6,"loudness":0.916107,"pitch":27.12322,"speechRate":5.139,"hasEvents":false,"sentence_source":"然后相当于在那个时候是为女性提供了一间自己的房间。","sentence_en":"So at that time, it essentially provided women with a room of their own."},{"id":"360","start":2773.77,"end":2779.07,"displayStart":2773.77,"displayEnd":2779.07,"displayMid":2776.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.7,"loudness":0.912113,"pitch":25.40423,"speechRate":4.34,"hasEvents":false,"sentence_source":"然后她是很多女孩子到纽约大城市来追梦的一个起点。","sentence_en":"It was a starting point for many girls coming to New York City to chase their dreams."},{"id":"361","start":2779.07,"end":2782.05,"displayStart":2779.07,"displayEnd":2782.05,"displayMid":2780.5600000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":1.099317,"pitch":27.984657,"speechRate":5.66,"hasEvents":false,"sentence_source":"因为她第一相对便宜 第二相对安全。","sentence_en":"Because first, it was relatively affordable, and second, relatively safe."},{"id":"362","start":2782.05,"end":2793.95,"displayStart":2782.05,"displayEnd":2793.95,"displayMid":2788,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.5,"loudness":0.951119,"pitch":23.736353,"speechRate":3.782,"hasEvents":false,"sentence_source":"然后在那里面你不用承担任何家务，不用下厨所有的配套设施给你配备齐全，这个酒店它在30年代末开始。","sentence_en":"And inside, you didn't have to do any housework or cooking; all facilities were provided. This hotel started in the late 1930s."},{"id":"363","start":2793.95,"end":2806.79,"displayStart":2793.95,"displayEnd":2806.79,"displayMid":2800.37,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.6,"loudness":0.946883,"pitch":22.018579,"speechRate":5.062,"hasEvents":false,"sentence_source":"和Mamazela这个杂志开启了一个合作，就是Mamazela有一个在全美的各个大学选择写的特别好的，特别聪明的 特别有野心的年轻女孩子。","sentence_en":"It started a collaboration with Mamazela magazine, which selected exceptionally talented, smart, and ambitious young women from colleges across the U.S."},{"id":"364","start":2806.79,"end":2816.95,"displayStart":2806.79,"displayEnd":2816.95,"displayMid":2811.87,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Positive","score":0.7,"loudness":0.921479,"pitch":25.425369,"speechRate":4.724,"hasEvents":false,"sentence_source":"然后来参加她们暑期的课作编辑项目，这对于很多其他地方的女孩来说，是人生第一个进入纽约这个大都市的机会。","sentence_en":"Then they came for the summer guest editor program, which for many girls from elsewhere was their first chance to enter the big city of New York."},{"id":"365","start":2816.95,"end":2831.69,"displayStart":2816.95,"displayEnd":2831.69,"displayMid":2824.3199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.82496,"pitch":24.401049,"speechRate":3.731,"hasEvents":false,"sentence_source":"我们所知的很多人，希尔维亚普拉斯是1953年的客座编辑，第一点刚好就是1955年应该是，有点记不清了，被选中的客座编辑。","sentence_en":"Many famous names—Sylvia Plath was a guest editor in 1953, though the first one was maybe 1955, I can't quite recall—were selected."},{"id":"366","start":2831.69,"end":2846.09,"displayStart":2831.69,"displayEnd":2846.09,"displayMid":2838.8900000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.977953,"pitch":27.32799,"speechRate":4.236,"hasEvents":false,"sentence_source":"然后她第一次来到了纽约，她在建了一切里面写的那个场景，就她第一次来到纽约的场景，也出现在巴比松大饭店里面，这本书我是怎么决定接的呢。","sentence_en":"Then she came to New York for the first time. The scene she wrote in 'The Bell Jar' about her first arrival also appears in 'The Barbizon Hotel'. How did I decide to take on this book?"},{"id":"367","start":2846.09,"end":2856.81,"displayStart":2846.09,"displayEnd":2856.81,"displayMid":2851.45,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.993702,"pitch":24.756796,"speechRate":4.906,"hasEvents":false,"sentence_source":"我在试读PDF的时候，就看到作者在前衣里面写到说，来到巴比松大饭店的那个女人是谁，她也许是谁谁谁 也许是谁谁谁。","sentence_en":"When I was reading the PDF sample, I saw the author write in the preface, 'Who was the woman who came to the Barbizon Hotel? She might be so-and-so, might be so-and-so."},{"id":"368","start":2856.81,"end":2871.87,"displayStart":2856.81,"displayEnd":2871.87,"displayMid":2864.34,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.945353,"pitch":27.664728,"speechRate":4.468,"hasEvents":false,"sentence_source":"然后就接了一个说，穷迪迪恩也入住过这个酒店，我说好 我就要翻译这本书，就是好像给当时的沉浸在迪迪恩的那个世界里面的自己，又有一个回响 又有一个交代。","sentence_en":"Then I saw a line saying, 'Joan Didion also stayed at this hotel.' I said, okay, I want to translate this book. It felt like giving an echo and closure to myself, who was immersed in Didion's world at that time."},{"id":"369","start":2871.87,"end":2885.97,"displayStart":2871.87,"displayEnd":2885.97,"displayMid":2878.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Different people encountered because of writing","sentiment_en":"Neutral","score":0,"loudness":0.913812,"pitch":27.07128,"speechRate":3.972,"hasEvents":false,"s <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
