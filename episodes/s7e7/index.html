ss":0.915364,"pitch":21.234535,"speechRate":5.135,"hasEvents":false,"sentence_source":"我们院里面有一个宪法的同事 就是年资比我深了，他就开玩笑 哎呦他说你好好的一个女生干嘛去学刑法呢，包括我原来同门当中 哎呦他说他私下的偏见他认为女性不可能学好刑法。","sentence_en":"There was a colleague in our department who taught constitutional law and was senior to me. He joked, 'Why would a nice girl study criminal law?' Some of my former classmates also privately held the prejudice that women can never master criminal law."},{"id":"198","start":1431.29,"end":1439.43,"displayStart":1431.29,"displayEnd":1439.43,"displayMid":1435.3600000000001,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Positive","score":0.5,"loudness":0.769879,"pitch":16.927498,"speechRate":5.391,"hasEvents":false,"sentence_source":"但实际上我们现在刑事领域女性还是很多的，不管是女性的检察官法官还是女性的学者其实很多。","sentence_en":"But in reality, there are plenty of women in the criminal justice field now, whether as female prosecutors, judges, or scholars."},{"id":"199","start":1439.43,"end":1444.73,"displayStart":1439.43,"displayEnd":1444.73,"displayMid":1442.08,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.968143,"pitch":17.489914,"speechRate":5.479,"hasEvents":false,"sentence_source":"那当然有可能是因为法律这个行业它本身也是偏文科的关系。","sentence_en":"Of course, that might be because the legal profession itself leans toward the humanities."},{"id":"200","start":1444.73,"end":1451.89,"displayStart":1444.73,"displayEnd":1451.89,"displayMid":1448.31,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.909546,"pitch":20.662437,"speechRate":6.169,"hasEvents":false,"sentence_source":"那么就是说在文科的这个问题上可能我的情况跟您的情况也比较相似，不过中学的时候就物理不太好。","sentence_en":"So when it comes to the humanities, my situation might be similar to yours. But I wasn't good at physics in middle school."},{"id":"201","start":1451.89,"end":1454.81,"displayStart":1451.89,"displayEnd":1454.81,"displayMid":1453.35,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Positive","score":0.3,"loudness":1.021651,"pitch":17.59898,"speechRate":5.587,"hasEvents":false,"sentence_source":"对当我的数学 生物化化学都还不错。","sentence_en":"I was pretty good at math, biology, and chemistry."},{"id":"202","start":1454.81,"end":1464.55,"displayStart":1454.81,"displayEnd":1464.55,"displayMid":1459.6799999999998,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.866605,"pitch":19.948549,"speechRate":5.178,"hasEvents":false,"sentence_source":"所以我当时的话数学老师也曾经劝我，他是劝我就是在高一纷文理科的时候让我去学理科，他说其实理科女生也少。","sentence_en":"So my math teacher advised me to choose science when we had to decide between arts and sciences in my first year of high school. He said there were fewer girls in science."},{"id":"203","start":1464.55,"end":1469.89,"displayStart":1464.55,"displayEnd":1469.89,"displayMid":1467.22,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.831533,"pitch":19.112274,"speechRate":5.528,"hasEvents":false,"sentence_source":"然后女生会更被宝贝，我当时为什么就我内心就决定还叫做文科呢。","sentence_en":"He said girls would be more valued. But I still decided to go with arts. Why?"},{"id":"204","start":1469.89,"end":1475.35,"displayStart":1469.89,"displayEnd":1475.35,"displayMid":1472.62,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.875521,"pitch":18.739065,"speechRate":5.5 "displayEnd":1653.08,"displayMid":1651.75,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.655105,"pitch":14.555366,"speechRate":6.391,"hasEvents":false,"sentence_source":"那我首先就排除掉了一个就在机关工作。","sentence_en":"I first ruled out working in government agencies."},{"id":"231","start":1653.08,"end":1655.3,"displayStart":1653.08,"displayEnd":1655.3,"displayMid":1654.19,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.990091,"pitch":20.991802,"speechRate":6.761,"hasEvents":false,"sentence_source":"那我对其他行业我并不清楚。","sentence_en":"I wasn't clear about other industries."},{"id":"232","start":1655.66,"end":1665.36,"displayStart":1655.66,"displayEnd":1665.36,"displayMid":1660.51,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Positive","score":0.4,"loudness":0.858608,"pitch":15.428022,"speechRate":5.626,"hasEvents":false,"sentence_source":"但是我当时去考研那我自己内心的想法就是，我想要出国，我可能想当律师，我当时是把这两个选项作为自己的主要职业选项的。","sentence_en":"But when I went for the postgraduate exam, my inner thought was that I wanted to go abroad, and I might want to become a lawyer. I considered these two as my main career options."},{"id":"233","start":1665.36,"end":1679.52,"displayStart":1665.36,"displayEnd":1679.52,"displayMid":1672.44,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":1.085229,"pitch":23.991732,"speechRate":5.476,"hasEvents":false,"sentence_source":"你看你刚讲到一个你在上海，想做法官想进入司法机关的时候，你当时充分的意识到第一，就地狱你来自于哪里，你的户口在哪里，就是一个基本的门槛，你不是上海的，你是来自少兴的。","sentence_en":"You see, you mentioned that when you wanted to be a judge in Shanghai and enter the judiciary, you fully realized that first, where you come from and your hukou were basic thresholds. You were not from Shanghai; you were from Shaoxing."},{"id":"234","start":1679.52,"end":1694.38,"displayStart":1679.52,"displayEnd":1694.38,"displayMid":1686.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.955404,"pitch":21.117826,"speechRate":4.493,"hasEvents":false,"sentence_source":"第二性别有很大的影响，像这种感觉它一定不是白纸黑字写下来，是某种大家都明白的潜规则，你是怎么样意识到在此刻地域和性别有着非常重要的意义。","sentence_en":"Second, gender has a huge impact. This kind of feeling is definitely not written in black and white; it's some kind of unspoken rule that everyone understands. How did you come to realize that region and gender have such important significance at this moment?"},{"id":"235","start":1694.38,"end":1704.04,"displayStart":1694.38,"displayEnd":1704.04,"displayMid":1699.21,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.944271,"pitch":22.472431,"speechRate":5.229,"hasEvents":false,"sentence_source":"对 因为我们当时同学之间其实是有一个内在的，或者一个潜规则其实就是说，当时找工作首先就是本地男生 外地男生。","sentence_en":"Yes, because among classmates, there was an unwritten rule: when job hunting, it was first local males, then out-of-town males."},{"id":"236","start":1704.04,"end":1706.62,"displayStart":1704.04,"displayEnd":1706.62,"displayMid":1705.33,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.80697,"pitch":16.037571,"speechRate":4.31,"hasEvents":false,"sentence_source":"然后本地女生 外地女生。","sentence_en":"Then local females, then out-of-town females."},{"id":"237","start":1706.62,"end":1709.76,"displayStart":1706.62,"displayEnd":1709.76,"displayMid":1708.19,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Negative","score":-0.4,"loudness":1.009157,"pitch":17.228697,"speechRate":6.159,"hasEvents":false,"sentence_source":"对 那其实我正法就是在了 又是女神 又是外地。","sentence_en":"Yes, so I was at a disadvantage: I was both female and from out of town."},{"id":"238","start":1709.76,"end":1711.98,"displayStart":1709.76,"displayEnd":1711.98,"displayMid":1710.87,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.761102,"pitch":17.466564,"speechRate":6.838,"hasEvents":false,"sentence_source":"我觉得性别的因素应该可能。","sentence_en":"I think gender might be more important."},{"id":"239","start":1711.98,"end":1725.68,"displayStart":1711.98,"displayEnd":1725.68,"displayMid":1718.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.983087,"pitch":23.274338,"speechRate":4.614,"hasEvents":false,"sentence_source":"是更重要的吧，像那个时候你想当法官，当时你心目当中 或者你想象当中的，类似于女性法官的样板和榜样有吗，92年入学 然后等到你想去应聘的时候。","sentence_en":"Was it more important? At that time, when you wanted to be a judge, did you have any role model or ideal image of a female judge in your mind? You entered in '92, and when you went to apply..."},{"id":"240","start":1725.68,"end":1729.9,"displayStart":1725.68,"displayEnd":1729.9,"displayMid":1727.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.878138,"pitch":20.530296,"speechRate":4.739,"hasEvents":false,"sentence_source":"当时我们有知道金斯伯格这个女法官的形象吗。","sentence_en":"Did we know about Justice Ginsburg as a female judge back then?"},{"id":"241","start":1729.9,"end":1733.82,"displayStart":1729.9,"displayEnd":1733.82,"displayMid":1731.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":1.090085,"pitch":27.865788,"speechRate":5.534,"hasEvents":true,"sentence_source":"对 我想我那时候可能唯一想象当中女法官就使良。","sentence_en":"Yes, I think back then the only female judge I could imagine was Shi Liang."},{"id":"242","start":1734.3,"end":1735.02,"displayStart":1734.3,"displayEnd":1735.02,"displayMid":1734.6599999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":1.012202,"pitch":36.125832,"speechRate":7.339,"hasEvents":true,"sentence_source":"其实我是。","sentence_en":"Actually, I am one."},{"id":"243","start":1735.02,"end":1744.88,"displayStart":1735.02,"displayEnd":1744.88,"displayMid":1739.95,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":0.937642,"pitch":21.87874,"speechRate":5.578,"hasEvents":true,"sentence_source":"觉得在很长时间之内 我都不是一个性贴意识特别强烈的人，也就是跟人交往的时候 我很少意识到说我是在以女性的身份跟人交往。","sentence_en":"For a long time, I wasn't someone with strong gender awareness. That is, when interacting with others, I rarely thought of myself as interacting as a woman."},{"id":"244","start":1745.62,"end":1757.48,"displayStart":1745.62,"displayEnd":1757.48,"displayMid":1751.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Neutral","score":0,"loudness":1.013857,"pitch":23.711849,"speechRate":5.618,"hasEvents":false,"sentence_source":"我不知道这是不是跟那个时代有关 因为我们都是成长于80年代的女性，就是我们在成长过程当中 其实都没有太多的关注到或者意识到自己的女性身份。","sentence_en":"I don't know if this is related to the era, because we're all women who grew up in the 1980s. During our upbringing, we didn't really pay much attention to or realize our female identity."},{"id":"245","start":1757.48,"end":1766.96,"displayStart":1757.48,"displayEnd":1766.96,"displayMid":1762.22,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Gender Education and Growth Experience","sentiment_en":"Positive","score":0.4,"loudness":1.025563,"pitch":22.443968,"speechRate":5.654,"hasEvents":false,"sentence_source":"至少我们在作为学生的时候 老师 家长 社会 贯书给我们就是只要你成绩好，其他其实并不重要 这对个女孩来说也是可贵的。","sentence_en":"At least when we were students, teachers, parents, and society instilled in us that as long as you have good grades, nothing else really matters. This was also valuable for a girl."},{"id":"246","start":1766.96,"end":1768.08,"displayStart":1766.96,"displayEnd":1768.08,"displayMid":1767.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":9,"clusterLabel":"C9","clusterName":"Female professional image and aesthetic expression","sentiment_en":"Neutral","score":0,"loudness":1.672475,"pitch":32.905918,"speechRate":3.175,"hasEvents":false,"sentence_source":"对我。","sentence_en":"Right."},{"id":"247","start":1768.08,"end":1777.12,"displayStart":1768.08,"displayEnd":1777.12,"displayMid":1772.6,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Women's Situation and Gender Equality","sentiment_en":"Neutral","score":0,"loudness":0.835935,"pitch":19.662144,"speechRate":4.425,"hasEvents":false,"sentence_source":"确实从小到大一直到大学毕业的时候，开始有点知道 好像性别有点不同，包括我之后的这种成长。","sentence_en":"Indeed, from childhood until college graduation, I began to realize that gender seemed to make a difference, including in my subsequent growth."},{"id":"248","start":1777.12,"end":1780.76,"displayStart":1777.12,"displayEnd":1780.76,"displayMid":1778.94,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Women's Situation and Gender Equality","sentiment_en":"Neutral","score": 8,"displayEnd":2247.28,"displayMid":2243.6800000000003,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Neutral","score":0,"loudness":0.896377,"pitch":17.282915,"speechRate":5.54,"hasEvents":false,"sentence_source":"然后另外一个就价值观层面的，究竟什么样的价值观更是一个良好的社会秩序当中应该有的。","sentence_en":"Then another aspect is the level of values. What kind of values should a good social order have?"},{"id":"316","start":2247.28,"end":2253.24,"displayStart":2247.28,"displayEnd":2253.24,"displayMid":2250.26,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Positive","score":0.6,"loudness":0.75826,"pitch":16.636448,"speechRate":5.551,"hasEvents":false,"sentence_source":"那我就认为平等 男女平等 包括阶层平等，比如说公权力应该受到必要的制约。","sentence_en":"I think equality, gender equality, including class equality. For example, public power should be subject to necessary checks."},{"id":"317","start":2253.24,"end":2265.46,"displayStart":2253.24,"displayEnd":2265.46,"displayMid":2259.35,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Positive","score":0.6,"loudness":0.79265,"pitch":16.488892,"speechRate":5.646,"hasEvents":false,"sentence_source":"然后个体权力应该受到尊重，这个其实在我看来都是一个，这两个就是良好的社会秩序当中必须坚守的价值观，我一直会首先判断这两个方面，判断完了之后再来决定。","sentence_en":"Then individual rights should be respected. In my view, these two are the values that must be upheld in a good social order. I always judge these two aspects first, and then decide."},{"id":"318","start":2265.46,"end":2268.3,"displayStart":2265.46,"displayEnd":2268.3,"displayMid":2266.88,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Neutral","score":0,"loudness":0.820317,"pitch":15.154637,"speechRate":6.936,"hasEvents":false,"sentence_source":"也就在这个法律问题上我应该吃什么立场。","sentence_en":"That is, what position I should take on this legal issue."},{"id":"319","start":2268.74,"end":2272.9,"displayStart":2268.74,"displayEnd":2272.9,"displayMid":2270.8199999999997,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Neutral","score":0,"loudness":0.95609,"pitch":17.509295,"speechRate":6.879,"hasEvents":false,"sentence_source":"那我们会发现那什么样的价值值得捍卫，什么样的价值是没好的。","sentence_en":"Then we will find which values are worth defending and which values are good."},{"id":"320","start":2272.9,"end":2280.18,"displayStart":2272.9,"displayEnd":2280.18,"displayMid":2276.54,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Positive","score":0.5,"loudness":0.684538,"pitch":13.781696,"speechRate":5.651,"hasEvents":false,"sentence_source":"那其实这里面肯定有感性的成分在里面，法律当然是应该情理法的融合，而不是一个冷冰冰的存在。","sentence_en":"Then there must be emotional components in it. Law should be a fusion of reason and emotion, not a cold existence."},{"id":"321","start":2280.18,"end":2284.48,"displayStart":2280.18,"displayEnd":2284.48,"displayMid":2282.33,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Neutral","score":0,"loudness":0.851878,"pitch":18.978605,"speechRate":4.272,"hasEvents":false,"sentence_source":"所以我不觉得感性的存在会影响法律。","sentence_en":"So I don't think the existence of emotion affects law."},{"id":"322","start":2284.48,"end":2295.32,"displayStart":2284.48,"displayEnd":2295.32,"displayMid":2289.9,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Legal Justice and Value Judgment","sentiment_en":"Negative","score":-0.3,"loudness":0.836452,"pitch":15.859841,"speechRate":5.784,"hasEvents":false,"sentence_source":"那恰恰相反说， "其实就是被体制化了，变成自己年轻的时候特别讨厌的人。","sentence_en":"You are actually institutionalized, becoming the person you particularly disliked when you were young."},{"id":"441","start":3013.2,"end":3028.82,"displayStart":3013.2,"displayEnd":3028.82,"displayMid":3021.01,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Positive","score":0.6,"loudness":0.742722,"pitch":16.782873,"speechRate":5.205,"hasEvents":false,"sentence_source":"所以我自己的话对这个一直是有内心警惕的，也就我不愿变成我年轻时候所讨厌的人，比如说势力 这种小人得势或者是那种攀高采低，都是我很讨厌的这种品质，我后来就觉得 比如当你意识到。","sentence_en":"So I myself have always been inwardly vigilant about this. I don't want to become the person I hated when I was young, such as being snobbish, petty people in power, or those who fawn on the rich and look down on the poor—these are all qualities I detest. Later I felt that when you realize..."},{"id":"442","start":3028.82,"end":3031.7,"displayStart":3028.82,"displayEnd":3031.7,"displayMid":3030.26,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Negative","score":-0.3,"loudness":1.035532,"pitch":21.274193,"speechRate":5.825,"hasEvents":false,"sentence_source":"就是有这样一种倾向 而且这种压力。","sentence_en":"There is such a tendency, and this pressure..."},{"id":"443","start":3031.7,"end":3034.62,"displayStart":3031.7,"displayEnd":3034.62,"displayMid":3033.16,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Negative","score":-0.4,"loudness":0.716667,"pitch":18.54064,"speechRate":6.164,"hasEvents":false,"sentence_source":"其实是很多普通人都没有办法抵抗的时候。","sentence_en":"Is actually something many ordinary people cannot resist."},{"id":"444","start":3034.62,"end":3038.12,"displayStart":3034.62,"displayEnd":3038.12,"displayMid":3036.37,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Neutral","score":0,"loudness":0.682873,"pitch":23.237949,"speechRate":5.429,"hasEvents":false,"sentence_source":"那这时候就会去了解这里面的这种作用机制。","sentence_en":"Then at that point, you start to understand the mechanism at work here."},{"id":"445","start":3038.12,"end":3046.98,"displayStart":3038.12,"displayEnd":3046.98,"displayMid":3042.55,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Neutral","score":0,"loudness":0.745137,"pitch":19.041452,"speechRate":5.892,"hasEvents":false,"sentence_source":"然后去想说 有没有一些反制的这种措施，就像我后面看到 就是，绝大多数人都有一种重众的心理，也就是人性其实就是重众的。","sentence_en":"And then think about whether there are any countermeasures. As I later saw, the vast majority of people have a herd mentality—human nature is actually conformist."},{"id":"446","start":3046.98,"end":3048.36,"displayStart":3046.98,"displayEnd":3048.36,"displayMid":3047.67,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Neutral","score":0,"loudness":0.634053,"pitch":15.69723,"speechRate":7.207,"hasEvents":false,"sentence_source":"那你怎么样反重众。","sentence_en":"So how do you counter conformity?"},{"id":"447","start":3048.36,"end":3051.56,"displayStart":3048.36,"displayEnd":3051.56,"displayMid":3049.96,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Positive","score":0.5,"loudness":0.897597,"pitch":16.371788,"speechRate":7.421,"hasEvents":false,"sentence_source":"其实反重众就是需要有人站出来说不同的声音。","sentence_en":"In fact, to counter the crowd, someone needs to speak up with a different voice."},{"id":"448","start":3051.56,"end":3061.12,"displayStart":3051.56,"displayEnd":3061.12,"displayMid":3056.34,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Positive","score":0.4,"loudness":0.718711,"pitch":16.425127,"speechRate":5.81,"hasEvents":false,"sentence_source":"然后第二个人予以支持，这就是一个反重众的重措施，人一定需要有事情外部环境的一面，但有的地方是你不想被外部环境改变的。","sentence_en":"Then a second person supports it—that's a key measure to counter the crowd. People must have an aspect that responds to the external environment, but there are parts you don't want changed by it."},{"id":"449","start":3061.12,"end":3065.9,"displayStart":3061.12,"displayEnd":3065.9,"displayMid":3063.51,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Neutral","score":0,"loudness":0.786015,"pitch":19.155516,"speechRate":4.773,"hasEvents":false,"sentence_source":"那你这时候如何让内心还是有坚定坚实的一部分。","sentence_en":"So how do you maintain a firm and solid part of your heart at such times?"},{"id":"450","start":3065.9,"end":3072.6,"displayStart":3065.9,"displayEnd":3072.6,"displayMid":3069.25,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Psychological Resilience and Life Attitude","sentiment_en":"Positive","score":0.5,"loudness":0.846693,"pitch":18.287416,"speechRate":5.759,"hasEvents":false,"sentence_source":"那我是觉得这个实际上也是需要有意思的去培养的，不然的话其实你很容易是被代偏了。","sentence_en":"I think this really needs to be cultivated consciously; otherwise, you can easily be led astray."},{"id":"451","start":3073.12,"end":3087.44,"displayStart":3073.12,"displayEnd":3087.44,"displayMid":3080.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Neutral","score":0,"loudness":0.934883,"pitch":24.310163,"speechRate":4.837,"hasEvents":false,"sentence_source":"你看刚才我们谈到的《萧生课》的救赎，包括《海域部》电影《楚门世界》，这里面有不同的几个人物，他们的反抗是不同的，刚才我跟劳东燕教授谈到了那个人，叫布鲁克斯·布鲁克。","sentence_en":"Look at what we just discussed: 'The Shawshank Redemption' and the movie 'The Truman Show'. There are different characters with different forms of resistance. Earlier, Professor Lao Dongyan and I talked about that character named Brooks."},{"id":"452","start":3087.44,"end":3102.48,"displayStart":3087.44,"displayEnd":3102.48,"displayMid":3094.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Neutral","score":0,"loudness":1.051793,"pitch":22.250412,"speechRate":5.319,"hasEvents":false,"sentence_source":"《萧生课救赎》里面的一个老头的形象，我给大家介绍一下，他是在《萧生课监狱》里面，待时间非常长的一个犯人，他在监狱里面，大家其实都很喜欢这个老头，他很无害，他的工作就是管理监狱的图书馆。","sentence_en":"The image of an old man in 'The Shawshank Redemption'. Let me introduce him: he was a prisoner who spent a very long time in Shawshank Prison. Everyone in prison liked him—he was harmless. His job was managing the prison library."},{"id":"453","start":3102.48,"end":3107.5,"displayStart":3102.48,"displayEnd":3107.5,"displayMid":3104.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Neutral","score":0,"loudness":1.132036,"pitch":28.387917,"speechRate":4.49,"hasEvents":false,"sentence_source":"津津夜夜，这老头到了晚年的时候，他就被释放出狱了。","sentence_en":"Day after day, when the old man reached his old age, he was released from prison."},{"id":"454","start":3107.5,"end":3122.04,"displayStart":3107.5,"displayEnd":3122.04,"displayMid":3114.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.5,"loudness":1.05228,"pitch":27.298714,"speechRate":5.375,"hasEvents":false,"sentence_source":"我们普通人认为你离开监狱，女女获得自由难道不好吗 你应该心喜若狂，老头整个的表情就是已经觉得晴天霹雳 世界末日了，她特别迷茫的困惑的拎着她行李 离开监狱 到了外面世界。","sentence_en":"We normal people think: leaving prison and gaining freedom—isn't that good? You should be overjoyed. But the old man's expression showed he felt like a bolt from the blue, the end of the world. He was utterly confused and bewildered, carrying his luggage out of prison into the outside world."},{"id":"455","start":3122.04,"end":3136.74,"displayStart":3122.04,"displayEnd":3136.74,"displayMid":3129.39,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Strongly Negative","score":-0.9,"loudness":1.021513,"pitch":22.396452,"speechRate":4.83,"hasEvents":false,"sentence_source":"在一个超市里面打工帮人装买好的东西 完全力不从心，最后就是她在自己租的一个非常破的房间里面 踩在桌子上面 上吊死了，在上吊之前 她在她家的房顶上刻下几个字。","sentence_en":"He got a job at a supermarket bagging groceries, completely overwhelmed. In the end, he stood on a table in his shabby rented room and hanged himself. Before hanging himself, he carved a few words on the ceiling."},{"id":"456","start":3136.74,"end":3146.4,"displayStart":3136.74,"displayEnd":3146.4,"displayMid":3141.5699999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.5,"loudness":0.959967,"pitch":25.178448,"speechRate":5.59,"hasEvents":false,"sentence_source":"此字写的是布鲁克斯来到过这儿 曾经到过这儿，这是我人生第一次意识到，也许对于某些已经习惯在一个封闭的环境当中的人类。","sentence_en":"The words said: 'Brooks was here.' That was the first time I realized that for some people who are accustomed to a closed environment..."},{"id":"457","start":3146.4,"end":3151.48,"displayStart":3146.4,"displayEnd":3151.48,"displayMid":3148.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.4,"loudness":0.936267,"pitch":19.949106,"speechRate":4.528,"hasEvents":false,"sentence_source":"所以布鲁克斯来说，自由没有束缚未必是一个好的事情。","sentence_en":"So for Brooks, freedom without constraints isn't necessarily a good thing."},{"id":"458","start":3151.48,"end":3158.06,"displayStart":3151.48,"displayEnd":3158.06,"displayMid":3154.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.6,"loudness":1.04784,"pitch":23.25878,"speechRate":6.25,"hasEvents":false,"sentence_source":"因为他已经失去独立生活能力，他对自由有一种先天的恐惧，他已经产生了严重的病害的心理依赖。","sentence_en":"Because he had lost the ability to live independently. He had an innate fear of freedom and developed severe pathological psychological dependence."},{"id":"459","start":3158.06,"end":3171.3,"displayStart":3158.06,"displayEnd":3171.3,"displayMid":3164.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Neutral","score":0,"loudness":1.001947,"pitch":25.104868,"speechRate":5.049,"hasEvents":false,"sentence_source":"所以布鲁克斯是面对自由 他是完全放弃了，另外一方面的反抗就是像安迪，安迪是采用完全合理合法的，长期处心积虑的 然后忍辱腹中卧心长胆的一种方式。","sentence_en":"So Brooks completely gave up in the face of freedom. On the other hand, resistance like Andy—Andy used completely legitimate means, long-term scheming, enduring humiliation, and biding his time."},{"id":"460","start":3171.3,"end":3181.46,"displayStart":3171.3,"displayEnd":3181.46,"displayMid":3176.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Positive","score":0.5,"loudness":0.964503,"pitch":22.560299,"speechRate":5.413,"hasEvents":false,"sentence_source":"最后离开了监狱 获得他拥有的幸福的所谓自由的生活，另外一个电影《储门》的世界里面的储门，他的反抗完全是一种纯信仰式的反抗。","sentence_en":"Eventually left prison and obtained what he considered a happy, free life. Another movie, 'The Truman Show', Truman's resistance was purely faith-based."},{"id":"461","start":3181.46,"end":3190.96,"displayStart":3181.46,"displayEnd":3190.96,"displayMid":3186.21,"speaker":"Lu Yu","spea wl of beer in a short time, bask in the sun, and enjoy a sense of freedom—there's actually a problem here. Many people might think that because Andy succeeded in escaping, he went to a distant island and lived a happy life."},{"id":"477","start":3278.42,"end":3285.64,"displayStart":3278.42,"displayEnd":3285.64,"displayMid":3282.0299999999997,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.3,"loudness":0.871796,"pitch":19.969835,"speechRate":6.233,"hasEvents":false,"sentence_source":"然后他的前面的努力才有意义 我不这么看，如果说按照我今天的这个观点的话，我不认为是因为有这个结局。","sentence_en":"That would make his previous efforts meaningful only because of the ending. But I don't see it that way. In my view today, I don't think it's about the outcome."},{"id":"478","start":3285.64,"end":3295.12,"displayStart":3285.64,"displayEnd":3295.12,"displayMid":3290.38,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Positive","score":0.7,"loudness":0.746943,"pitch":20.203285,"speechRate":5.726,"hasEvents":false,"sentence_source":"所以显然他前面的努力有意义，即便安迪最终没有乐于成功，他的一生都在监狱里面度过，我认为他前面的努力，仍然都是有意义的。","sentence_en":"So clearly his earlier efforts are meaningful. Even if Andy never succeeded in the end and spent his life in prison, I still believe his earlier efforts were meaningful."},{"id":"479","start":3295.12,"end":3304.68,"displayStart":3295.12,"displayEnd":3304.68,"displayMid":3299.8999999999996,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Positive","score":0.6,"loudness":0.906203,"pitch":17.054905,"speechRate":5.373,"hasEvents":false,"sentence_source":"因为首先他坚持了自己该坚持的，同时他改变了这个外部环境当中，比较恶劣的地方，让这个监狱的环境变得比以前更好。","sentence_en":"Because first, he persisted in what he should, and he also changed the harsh aspects of the external environment, making the prison better than before."},{"id":"480","start":3304.68,"end":3311.38,"displayStart":3304.68,"displayEnd":3311.38,"displayMid":3308.0299999999997,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Negative","score":-0.4,"loudness":0.875678,"pitch":17.424892,"speechRate":6.446,"hasEvents":false,"sentence_source":"因为很多人我都觉得太结果论了，好像就说只要没有那个结果，我其实我就不值得付出这个努力。","sentence_en":"Because I feel many people are too result-oriented, as if without that outcome, the effort wasn't worth making."},{"id":"481","start":3311.38,"end":3324.52,"displayStart":3311.38,"displayEnd":3324.52,"displayMid":3317.95,"speaker":"Lao Dongyan","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.817767,"pitch":17.372534,"speechRate":5.717,"hasEvents":false,"sentence_source":"对 但是我这么看，我认为努力本身就有意义，而且努力本身就在博取一种改变的可能性，而且即便说你说努力，没有任何改变外界的可能性，你的努力本身就在使得自己不被改变。","sentence_en":"Yes, but I see it differently. I think effort itself is meaningful, and it's about seeking a possibility of change. Even if effort can't change the outside, it prevents yourself from being changed."},{"id":"482","start":3324.52,"end":3328.52,"displayStart":3324.52,"displayEnd":3328.52,"displayMid":3326.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Crime, Punishment, and Public Perception","sentiment_en":"Neutral","score":0,"loudness":1.010993,"pitch":24.678623,"speechRate":5.305,"hasEvents":false,"sentence_source":"那我想平常您会喜欢看《孝顺客救赎》这样的电影。","sentence_en":"So I suppose you usually enjoy watching movies like 'The Shawshank Redemption'."},{"id":"483","start":3328.52,"end":3330.06,"displayStart":3328.52,"displayEnd":3330.06,"displayMid":3329.29,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3", ppy about that. It shows that people from the same era indeed have many common readings and similar book lists."},{"id":"494","start":3425.3,"end":3430.8,"displayStart":3425.3,"displayEnd":3430.8,"displayMid":3428.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Changing Times and Social Trends","sentiment_en":"Positive","score":0.7,"loudness":1.022686,"pitch":16.297117,"speechRate":5.375,"hasEvents":false,"sentence_source":"我有时候还是挺感谢我们所成长的那个年代，就是八十年代九十年代。","sentence_en":"Sometimes I'm quite grateful for the era we grew up in, the '80s and '90s."},{"id":"495","start":3430.8,"end":3445.5,"displayStart":3430.8,"displayEnd":3445.5,"displayMid":3438.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Changing Times and Social Trends","sentiment_en":"Positive","score":0.7,"loudness":1.036849,"pitch":23.581579,"speechRate":5.026,"hasEvents":false,"sentence_source":"那种社会思潮会激发我们作为一个年轻人，你会愿意参与到社会事务的讨论和思考当中，某种程度可以塑造我们未来成为什么样的人，再有就是那个年代文学艺术所有的发展。","sentence_en":"That kind of social trend can inspire us as young people to participate in discussions and reflections on social affairs, shaping to some extent who we become in the future, along with all the developments in literature and art during that era."},{"id":"496","start":3445.5,"end":3448.56,"displayStart":3445.5,"displayEnd":3448.56,"displayMid":3447.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Changing Times and Social Trends","sentiment_en":"Positive","score":0.6,"loudness":0.924578,"pitch":21.505768,"speechRate":5.546,"hasEvents":false,"sentence_source":"紧喷式的发展会带给我们很多的滋养。","sentence_en":"The explosive development provided us with a lot of nourishment."},{"id":"497","start":3448.56,"end":3453.32,"displayStart":3448.56,"displayEnd":3453.32,"displayMid":3450.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Changing Times and Social Trends <script type="module">
const EMBEDDED = document.getElementById("episode-data");

const COLORS = {
  bg: "#F5EEE0",
  overlay: "rgba(129, 122, 93, 0.1)",
  line: "rgba(129, 122, 93, 0.42)",
  lineSoft: "rgba(129, 122, 93, 0.18)",
  text: "#584216",
  taupe: "#A29479",
  purple: "#995A91",
  black: "#000000"
};

const LAYOUT = {
  baseWidth: 1920,
  plotHeight: 645,
  chartLeft: 0,
  sentimentTop: 0,
  sentimentBottom: 645 * 0.48,
  audioTop: 645 * 0.55,
  audioBottom: 645,
  basePxPerSec: 12,
  minZoom: 0.08,
  maxZoom: 1.8
};

const state = {
  data: null,
  zoom: 0.3,
  variable: "loudness",
  audio: null,
  svg: null,
  scroller: null,
  playhead: null,
  isDragging: false,
  dragStartX: 0,
  dragScrollLeft: 0
};

function pxPerSec() {
  return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {
  if (EMBEDDED) return JSON.parse(EMBEDDED.textContent);
  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";
  const stage = el("div", "stage");
  stage.appendChild(el("div", "page-overlay"));
  stage.appendChild(renderFontWarning());
  stage.appendChild(renderHeader(data));
  stage.appendChild(renderLegend(data));
  stage.appendChild(el("div", "chart-label sentiment-label", "Sentiment Analysis"));
  stage.appendChild(el("div", "chart-label audio-label", "Audio Variable Analysis"));
  stage.appendChild(renderAudioControls(data));
  stage.appendChild(renderVariableControl());
  stage.appendChild(el("div", "time-axis-label", "Timeline"));
  stage.appendChild(renderChart(data));
  stage.appendChild(renderBottomPanels(data));
  stage.appendChild(renderTooltip());
  app.appendChild(stage);
  resizeStage();
  applyIntroLayout(stage);
  checkFonts();
  wireInteractions();
  console.log("Loaded episode:", data.episode.id);
  console.log("Sentences:", data.sentences.length, "Events:", data.events.length, "Zoom:", `${Math.round(state.zoom * 100)}%`);
}

function renderFontWarning() {
  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
    const hit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: Math.max(8, w),
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, sentimentTooltip(s)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = [];
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const y = audioY(v, stats);
    points.push({ x: xOf(s.displayMid), y, color: s.speakerColor || COLORS.taupe, sentence: s });
  });
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    g.appendChild(svgEl("line", {
      x1: prev.x,
      y1: prev.y,
      x2: next.x,
      y2: next.y,
      stroke: prev.color,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  }
  points.forEach(({ x, y, sentence }) => {
    const hit = svgEl("circle", {
      cx: x,
      cy: y,
      r: 10,
      fill: COLORS.text,
      opacity: 0
    });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, audioTooltip(sentence)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});
