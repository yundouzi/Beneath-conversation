e I was leaving home, so I didn't bring those things. My advantage is that I don't dwell on the past. Things are over, so I didn't bring them."},{"id":"176","start":1243.75,"end":1258.01,"displayStart":1243.75,"displayEnd":1258.01,"displayMid":1250.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.914401,"pitch":22.024599,"speechRate":4.686,"hasEvents":false,"sentence_source":"我从国内带了一套红帽帽，带了一本从文家书就是那样子，1996年的时候打了电话从美国打到中国要一美元一分钟，如果要是关架 所以但现在是不一样的。","sentence_en":"I brought a set of Dream of the Red Chamber and a book of Shen Congwen's letters from China. In 1996, a call from the US to China cost one dollar per minute. If you wanted to call... but now it's different."},{"id":"177","start":1258.01,"end":1265.37,"displayStart":1258.01,"displayEnd":1265.37,"displayMid":1261.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.3,"loudness":0.947994,"pitch":23.091995,"speechRate":4.891,"hasEvents":false,"sentence_source":"所以现在大家都东西都留下来，照片都照在手机里，所有的记忆都是留着的 可能是好处。","sentence_en":"So now everyone keeps everything, photos on their phones, all memories preserved. Maybe that's good."},{"id":"178","start":1265.37,"end":1266.91,"displayStart":1265.37,"displayEnd":1266.91,"displayMid":1266.1399999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.978239,"pitch":26.389944,"speechRate":7.143,"hasEvents":false,"sentence_source":"但是也可能就没有那么好。","sentence_en":"But maybe it's not that good either."},{"id":"179","start":1266.91,"end":1271.29,"displayStart":1266.91,"displayEnd":1271.29,"displayMid":1269.1,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.761465,"pitch":19.412189,"speechRate":5.251,"hasEvents":false,"sentence_source":"因为我觉得有些东西过去就过去了，不需要再怎么说呢。","sentence_en":"Because I think some things just pass, and there's no need to, how to put it..."},{"id":"180","start":1271.29,"end":1281.69,"displayStart":1271.29,"displayEnd":1281.69,"displayMid":1276.49,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.798909,"pitch":19.580851,"speechRate":5.288,"hasEvents":false,"sentence_source":"我觉得佛家那个想法就是比较执着，比较 just attached to things，我就是不是那么执着了 对那些很多的事情。","sentence_en":"I think the Buddhist idea is about being attached to things. I'm not that attached to many things."},{"id":"181","start":1282.41,"end":1289.51,"displayStart":1282.41,"displayEnd":1289.51,"displayMid":1285.96,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.894393,"pitch":20.50289,"speechRate":4.085,"hasEvents":false,"sentence_source":"你说你96年带着红萝梦来到美国，为什么是爱荷华这个地方。","sentence_en":"You said you came to the US in 1996 with Dream of the Red Chamber. Why Iowa?"},{"id":"182","start":1289.51,"end":1295.73,"displayStart":1289.51,"displayEnd":1295.73,"displayMid":1292.62,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.014724,"pitch":27.170984,"speechRate":5.145,"hasEvents":false,"sentence_source":"因为当时我被四个学校露了，我当美国以后所有人都觉得我为什么去爱荷华。","sentence_en":"Because I was admitted to four schools. When I arrived in the US, everyone wondered why I chose Iowa."},{"id":"183","start":1295.73,"end":1298.55,"displayStart":1295.73,"displayEnd":1298.55,"displayMid":1297.1399999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.062683,"pitch":27.766655,"speechRate":5.319,"hasEvents":false,"sentence_source":"因为当时还有个纽约上周一个学校。","sentence_en":"There was also a school in New York State."},{"id":"184","start":1298.55,"end":1307.97,"displayStart":1298.55,"displayEnd":1307.97,"displayMid":1303.26,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.89463,"pitch":21.749966,"speechRate":5.202,"hasEvents":false,"sentence_source":"然后由他一个学校，还有波士顿一个学校，为什么是爱荷华，不知道 现在想都不知道，当年也不知道，为什么就觉得艾河华。","sentence_en":"Then another school, and one in Boston. Why Iowa? I don't know. I still don't know now, and I didn't know back then. Why did I feel drawn to Iowa?"},{"id":"185","start":1307.97,"end":1309.11,"displayStart":1307.97,"displayEnd":1309.11,"displayMid":1308.54,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.90128,"pitch":28.036404,"speechRate":6.14,"hasEvents":false,"sentence_source":"但是有一个原因。","sentence_en":"But there is one reason."},{"id":"186","start":1309.11,"end":1319.43,"displayStart":1309.11,"displayEnd":1319.43,"displayMid":1314.27,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.716142,"pitch":20.6036,"speechRate":4.748,"hasEvents":false,"sentence_source":"因为当年那三个路，我的这个研究生都是做生化的，好像是艾河华是免疫，我当时上大学的时候，觉得免疫学比较有意思。","sentence_en":"Because the other three schools offered graduate programs in biochemistry, while Iowa was in immunology. When I was in college, I thought immunology was more interesting."},{"id":"187","start":1319.43,"end":1328.03,"displayStart":1319.43,"displayEnd":1328.03,"displayMid":1323.73,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.87088,"pitch":22.546127,"speechRate":5.51,"hasEvents":false,"sentence_source":"所以我就去了艾河华，当时都不知道艾河华在哪儿，买了个美国地图册，上面说艾河华是美国的猪圈，我印象特别深。","sentence_en":"So I went to Iowa. At that time, I didn't even know where Iowa was. I bought a US atlas that said Iowa is America's pigsty. That left a deep impression."},{"id":"188","start":1328.03,"end":1329.73,"displayStart":1328.03,"displayEnd":1329.73,"displayMid":1328.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.398685,"pitch":29.131292,"speechRate":6.406,"hasEvents":false,"sentence_source":"因为艾河华是养猪的。","sentence_en":"Because Iowa raises pigs."},{"id":"189","start":1329.73,"end":1330.93,"displayStart":1329.73,"displayEnd":1330.93,"displayMid":1330.33,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.265503,"pitch":34.322327,"speechRate":6.635,"hasEvents":false,"sentence_source":"那个都是农业州。","sentence_en":"It's all agricultural states."},{"id":"190","start":1330.93,"end":1338.31,"displayStart":1330.93,"displayEnd":1338.31,"displayMid":1334.62,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.902373,"pitch":20.454071,"speechRate":4.607,"hasEvents":false,"sentence_source":"所以那时候中国出的，这个美国地图册也不是很专业了，也不是很detail的。","sentence_en":"So that Chinese atlas of the US wasn't very professional or detailed."},{"id":"191","start":1338.31,"end":1344.49,"displayStart":1338.31,"displayEnd":1344.49,"displayMid":1341.4,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.793537,"pitch":22.189608,"speechRate":5.825,"hasEvents":false,"sentence_source":"所以这唯一一句话就是爱河华盛美国的诸卷，我就印象中 我说那我就去美国的诸卷吧。","sentence_en":"So the only description was 'Iowa is America's pigsty.' I thought, then I'll go to America's pigsty."},{"id":"192","start":1344.49,"end":1352.99,"displayStart":1344.49,"displayEnd":1352.99,"displayMid":1348.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.125799,"pitch":24.049053,"speechRate":5.144,"hasEvents":false,"sentence_source":"我知道爱河华是因为我当时读了，聂华林女士的三生三世，她当时在爱河华不是开国际写作计划吧。","sentence_en":"I knew about Iowa because I had read Nie Hualing's Three Lives. She was running the International Writing Program in Iowa, right?"},{"id":"193","start":1352.99,"end":1357.57,"displayStart":1352.99,"displayEnd":1357.57,"displayMid":1355.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.054994,"pitch":23.900536,"speechRate":6.755,"hasEvents":false,"sentence_source":"所以当时很多中国作家都参加过这个国写作计划，我是因为知道她。","sentence_en":"So many Chinese writers had participated in that program. I knew about her."},{"id":"194","start":1357.57,"end":1359.67,"displayStart":1357.57,"displayEnd":1359.67,"displayMid":1358.62,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.306924,"pitch":26.768652,"speechRate":6.19,"hasEvents":false,"sentence_source":"然后当然爱河华周宁是知道的。","sentence_en":"And of course, I knew about Iowa State."},{"id":"195","start":1359.67,"end":1360.63,"displayStart":1359.67,"displayEnd":1360.63,"displayMid":1360.15,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.194945,"pitch":28.853912,"speechRate":7.292,"hasEvents":false,"sentence_source":"但是因为知道她。","sentence_en":"But because of her."},{"id":"196","start":1360.63,"end":1366.21,"displayStart":1360.63,"displayEnd":1366.21,"displayMid":1363.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.98894,"pitch":26.970583,"speechRate":7.978,"hasEvents":false,"sentence_source":"所以好像格外的关注爱河华大学，我因为你是因为有这样一个写作计划，他可能才会被这个地方吸引呢。","sentence_en":"So I paid extra attention to the University of Iowa. You think it was because of that writing program that I was attracted to the place?"},{"id":"197","start":1366.21,"end":1371.27,"displayStart":1366.21,"displayEnd":1371.27,"displayMid":1368.74,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.662887,"pitch":21.088223,"speechRate":4.847,"hasEvents":false,"sentence_source":"那我那会去美国的时候并没有想当写作，没有想当作家。","sentence_en":"When I went to the US, I didn't intend to become a writer."},{"id":"198","start":1371.27,"end":1375.59,"displayStart":1371.27,"displayEnd":1375.59,"displayMid":1373.4299999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.027413,"pitch":22.685635,"speechRate":5.556,"hasEvents":false,"sentence_source":"所以我这也知道爱和华那个国际写作计划去之前就知道。","sentence_en":"I knew about the Iowa International Writing Program before I went."},{"id":"199","start":1375.59,"end":1381.65,"displayStart":1375.59,"displayEnd":1381.65,"displayMid":1378.62,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.76088,"pitch":19.460844,"speechRate":5.941,"hasEvents":false,"sentence_source":"因为当年王安逸写了一篇文章是他去爱和华，年轻的时候去爱和华参加国际写作计划。","sentence_en":"Because Wang Anyi wrote an article about going to Iowa when she was young to attend the International Writing Program."},{"id":"200","start":1381.65,"end":1389.83,"displayStart":1381.65,"displayEnd":1389.83,"displayMid":1385.74,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.804152,"pitch":20.4027,"speechRate":6.854,"hasEvents":false,"sentence_source":"所以我看过 但是没有印象，没有联系起来，我当时还是刚来美国的时候还是想做科学，还是想做science，没有想当writer。","sentence_en":"I read it but didn't really remember or connect it. At that time, I still wanted to do science, not be a writer."},{"id":"201","start":1389.83,"end":1395.37,"displayStart":1389.83,"displayEnd":1395.37,"displayMid":1392.6,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.3,"loudness":0.882625,"pitch":24.88018,"speechRate":5.4,"hasEvents":false,"sentence_source":"所以我老公说你就是比较幸运，你要是没学艾荷华就不会成为艾荷华。","sentence_en":"So my husband said I was lucky. If I hadn't studied at Iowa, I wouldn't have become an Iowan."},{"id":"202","start":1395.37,"end":1399.09,"displayStart":1395.37,"displayEnd":1399.09,"displayMid":1397.23,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.795987,"pitch":19.33588,"speechRate":6.183,"hasEvents":false,"sentence_source":"我觉得他说的可能是对的，他老是说你要到了一个城市。","sentence_en":"I think he might be right. He always says that when you go to a city..."},{"id":"203","start":1399.09,"end":1408.91,"displayStart":1399.09,"displayEnd":1408.91,"displayMid":1404,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.953566,"pitch":22.70014,"speechRate":7.23,"hasEvents":false,"sentence_source":"那城市大家都是Firefighter，你就变成一个Firefighter了，有些人是这样子，可能就随大溜，我可能到了艾荷华以后才知道，我当年做免疫的时候。","sentence_en":"If everyone in that city is a firefighter, you become a firefighter. Some people are like that, they follow the crowd. I probably realized after arriving in Iowa, when I was doing immunology."},{"id":"204","start":1408.91,"end":1421.89,"displayStart":1408.91,"displayEnd":1421.89,"displayMid":1415.4,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.954809,"pitch":22.705936,"speechRate":5.855,"hasEvents":false,"sentence_source":"我楼上的一个医生也是研究，他就跟我说，他说艾荷华的人都写书，我说你写吗，他说我也写，后来几年以后，我知道他写了好几本书，都是他是这个Holocaust survivor。","sentence_en":"A doctor upstairs from me also did research. He told me that everyone in Iowa writes books. I asked if he writes. He said yes. Years later, I learned he wrote several books. He was a Holocaust survivor."},{"id":"205","start":1421.89,"end":1425.79,"displayStart":1421.89,"displayEnd":1425.79,"displayMid":1423.8400000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.749005,"pitch":22.963739,"speechRate":4.359,"hasEvents":false,"sentence_source":"她是从匈牙利那个孩子在这个集中营住。","sentence_en":"She was a child from Hungary who lived in a concentration camp."},{"id":"206","start":1425.79,"end":1432.65,"displayStart":1425.79,"displayEnd":1432.65,"displayMid":1429.22,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":1.048136,"pitch":20.243496,"speechRate":5.457,"hasEvents":false,"sentence_source":"那时候她跟我说她说艾赫华人人都写书，我还很惊讶 很有意思，我想大家都写书我也写了。","sentence_en":"Back then she told me that everyone in Iowa writes books. I was surprised and thought it interesting. I thought, if everyone writes, I'll write too."},{"id":"207","start":1432.65,"end":1437.95,"displayStart":1432.65,"displayEnd":1437.95,"displayMid":1435.3000000000002,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.893104,"pitch":26.075851,"speechRate":4.929,"hasEvents":false,"sentence_source":"那可真是年轻的时候很傻，就是想那大家都写我也写，我就去学。","sentence_en":"That was really naive of me when I was young. I thought, if everyone writes, I'll write too. So I went to learn."},{"id":"208","start":1437.95,"end":1439.21,"displayStart":1437.95,"displayEnd":1439.21,"displayMid":1438.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.584375,"pitch":13.939328,"speechRate":5.622,"hasEvents":false,"sentence_source":"这个写作课去了。","sentence_en":"I took that writing class."},{"id":"209","start":1439.21,"end":1443.35,"displayStart":1439.21,"displayEnd":1443.35,"displayMid":1441.28,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":1.104749,"pitch":30.381063,"speechRate":6.386,"hasEvents":false,"sentence_source":"所以你看我就觉得冥冥当中是有一些神奇的力量的。","sentence_en":"So you see, I feel there are some magical forces at work."},{"id":"210","start":1443.35,"end":1450.21,"displayStart":1443.35,"displayEnd":1450.21,"displayMid":1446.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.046899,"pitch":23.086136,"speechRate":6.834,"hasEvents":false,"sentence_source":"所以我刚才会好奇你到艾赫华，难道是因为被这个写作计划吸引的吗，后来我知道是艾赫华其实你毕业之后。","sentence_en":"So I was curious earlier: did you go to Iowa because you were attracted by the writing program? Later I learned that after you graduated..."},{"id":"211","start":1450.21,"end":1455.83,"displayStart":1450.21,"displayEnd":1455.83,"displayMid":1453.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":0.951131,"pitch":25.590334,"speechRate":7.194,"hasEvents":false,"sentence_source":"你们那个地方已经被联合国教课文组织就颁为City of Literature 文化之城。","sentence_en":"That place was designated a UNESCO City of Literature."},{"id":"212","start":1455.83,"end":1459.25,"displayStart":1455.83,"displayEnd":1459.25,"displayMid":1457.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.096567,"pitch":27.964741,"speechRate":7.869,"hasEvents":false,"sentence_source":"所以我能想象好像每个人都是某种程度我要做一个作家。","sentence_en":"So I can imagine that everyone, to some extent, wants to be a writer."},{"id":"213","start":1459.25,"end":1460.47,"displayStart":1459.25,"displayEnd":1460.47,"displayMid":1459.8600000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.64203,"pitch":16.783628,"speechRate":5.128,"hasEvents":false,"sentence_source":"那氛围多好呀。","sentence_en":"What a great atmosphere."},{"id":"214","start":1461.85,"end":1465.09,"displayStart":1461.85,"displayEnd":1465.09,"displayMid":1463.4699999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.312352,"pitch":27.349239,"speechRate":3.135,"hasEvents":true,"sentence_source":"是很好 但是也很不现实。","sentence_en":"It's great, but also very unrealistic."},{"id":"215","start":1465.09,"end":1471.41,"displayStart":1465.09,"displayEnd":1471.41,"displayMid":1468.25,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.88015,"pitch":20.452644,"speechRate":6.013,"hasEvents":false,"sentence_source":"那时候我记得艾赫华其实很小的一个城市，中间有一个Java House 就是个咖啡馆。","sentence_en":"I remember Iowa City was actually a small town. There was a Java House in the center, just a coffee shop."},{"id":"216","start":1471.41,"end":1477.81,"displayStart":1471.41,"displayEnd":1477.81,"displayMid":1474.6100000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.965273,"pitch":20.412119,"speechRate":4.348,"hasEvents":false,"sentence_source":"那咖啡馆里坐满了人，年老年有的都在那写东西 大家都想当作家。","sentence_en":"The café was packed with people, young and old, all writing. Everyone wanted to become a writer."},{"id":"217","start":1477.81,"end":1486.99,"displayStart":1477.81,"displayEnd":1486.99,"displayMid":1482.4,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":0.819182,"pitch":20.429518,"speechRate":5.12,"hasEvents":false,"sentence_source":"所以是挺有意思的，我记得那时候 我们在那时候 我有同学跟我说，你看见那老头吗 那老头穿一身白色的西装裤子。","sentence_en":"It was quite interesting. I remember back then, a classmate said to me, 'See that old man? He's wearing white suit pants."},{"id":"218","start":1486.99,"end":1502.51,"displayStart":1486.99,"displayEnd":1502.51,"displayMid":1494.75,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.973745,"pitch":24.477074,"speechRate":5.1,"hasEvents":false,"sentence_source":"然后他每天骑自行车骑到那儿，换上他白色的西装裤子开始写东西，就像上班似的 下班的时候就换下来换穿普通的衣服，一路骑车拎着他的白色的西装裤子在那个衣架上就骑着就回家了。","sentence_en":"He would bike there every day, change into his white suit pants, and start writing, like it was his job. When he was done, he'd change back into regular clothes and bike home, his white suit pants hanging on the rack."},{"id":"219","start":1502.51,"end":1506.87,"displayStart":1502.51,"displayEnd":1506.87,"displayMid":1504.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.700874,"pitch":19.016001,"speechRate":5.473,"hasEvents":true,"sentence_source":"那个我的同学就跟我说 他就想当作家 他听见来上班。","sentence_en":"My classmate told me he wanted to be a writer, so he came there like going to work."},{"id":"220","start":1507.73,"end":1521.75,"displayStart":1507.73,"displayEnd":1521.75,"displayMid":1514.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.944022,"pitch":22.344027,"speechRate":4.524,"hasEvents":true,"sentence_source":"多可爱啊，我很好奇在那样的一个文学之城，一个理科的女孩子，她在什么时候内心发生了某种转变，就把她从一个理科生，从一个科学家，变成了一个作家。","sentence_en":"How lovely. I'm curious, in a literary city like that, when did a science-oriented girl undergo the inner change from a scientist to a writer?"},{"id":"221","start":1521.75,"end":1524.73,"displayStart":1521.75,"displayEnd":1524.73,"displayMid":1523.24,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.042812,"pitch":27.099834,"speechRate":5.273,"hasEvents":false,"sentence_source":"那我没有那么一个试课，有好多年。","sentence_en":"I didn't have a sudden turning point; it took years."},{"id":"222","start":1524.73,"end":1526.11,"displayStart":1524.73,"displayEnd":1526.11,"displayMid":1525.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.661759,"pitch":21.568756,"speechRate":5.072,"hasEvents":false,"sentence_source":"因为，我96年去。","sentence_en":"I went in '96."},{"id":"223","start":1526.11,"end":1528.63,"displayStart":1526.11,"displayEnd":1528.63,"displayMid":1527.37,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.760089,"pitch":24.148657,"speechRate":4.365,"hasEvents":false,"sentence_source":"我97年学了一个写作课。","sentence_en":"In '97, I took a writing class."},{"id":"224","start":1528.63,"end":1542.35,"displayStart":1528.63,"displayEnd":1542.35,"displayMid":1535.49,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.866889,"pitch":20.127954,"speechRate":5.383,"hasEvents":false,"sentence_source":"那时候就从来没有写过，第一次用英语写，而且不是本科生的课，就是那种社区的课，八个星期有一个老师，我那老师问我说，说你将来想发表吗，我其实选择个主要是为了学英语。","sentence_en":"I had never written before; it was my first time writing in English. It wasn't even an undergraduate course, just a community class. Eight weeks, one teacher. My teacher asked, 'Do you want to publish someday?' I had chosen the class mainly to learn English."},{"id":"225","start":1542.35,"end":1550.29,"displayStart":1542.35,"displayEnd":1550.29,"displayMid":1546.32,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.734957,"pitch":20.726864,"speechRate":6.549,"hasEvents":false,"sentence_source":"我那时候英语也没那么好的，我说发表吗，我说我还从来没有英语写过东西，这是第一篇，他说我觉得你应该好好写将来想发表。","sentence_en":"My English wasn't great then. I said, 'Publish? I've never written anything in English. This is my first piece.' He said, 'I think you should write seriously; you could publish in the future."},{"id":"226","start":1550.29,"end":1554.89,"displayStart":1550.29,"displayEnd":1554.89,"displayMid":1552.5900000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.877161,"pitch":20.432812,"speechRate":5.105,"hasEvents":false,"sentence_source":"那时候他说了1997年，后来我就想那就先写写试试。","sentence_en":"That was in 1997. Later, I thought, let me just try writing."},{"id":"227","start":1554.89,"end":1557.77,"displayStart":1554.89,"displayEnd":1557.77,"displayMid":1556.33,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.203605,"pitch":28.147615,"speechRate":5.159,"hasEvents":false,"sentence_source":"其实也很长，没有什么特别确定。","sentence_en":"Actually, it was a long process, nothing very certain."},{"id":"228","start":1557.77,"end":1561.69,"displayStart":1557.77,"displayEnd":1561.69,"displayMid":1559.73,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.724348,"pitch":25.980614,"speechRate":5.357,"hasEvents":false,"sentence_source":"但是我觉得是1999年的时候，我在书店里看书。","sentence_en":"But I think it was in 1999, I was reading in a bookstore."},{"id":"229","start":1561.69,"end":1570.99,"displayStart":1561.69,"displayEnd":1570.99,"displayMid":1566.3400000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.911106,"pitch":20.966618,"speechRate":5.31,"hasEvents":false,"sentence_source":"那时候你也知道书店里书都是有好有差的，我就随便翻了一本书，哎呀 我就觉得这书写真差呀 我要写的比它好十倍。","sentence_en":"You know, books in a store vary in quality. I flipped through one and thought, 'Wow, this book is so bad. I could write ten times better."},{"id":"230","start":1570.99,"end":1578.27,"displayStart":1570.99,"displayEnd":1578.27,"displayMid":1574.63,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.823479,"pitch":20.189749,"speechRate":5.632,"hasEvents":false,"sentence_source":"那个时候就觉得这书写的都已经出来了 也确实这么差，我就想 我可能能写的比它好 我应该试一试。","sentence_en":"This book was published and it was that bad. I thought, I could probably write better than this. I should try."},{"id":"231","start":1578.27,"end":1586.91,"displayStart":1578.27,"displayEnd":1586.91,"displayMid":1582.5900000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":1.036183,"pitch":20.255997,"speechRate":5.5,"hasEvents":false,"sentence_source":"那时候 可能你要说真的是转变 真的是就在那书店里觉得，我一定能比这个人做得好 我要试一试 所以就想试一试。","sentence_en":"If you ask about a real turning point, it was right there in the bookstore: I felt I could definitely do better than that person. So I decided to try."},{"id":"232","start":1586.91,"end":1590.57,"displayStart":1586.91,"displayEnd":1590.57,"displayMid":1588.74,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.4,"loudness":1.020452,"pitch":28.152382,"speechRate":6.206,"hasEvents":false,"sentence_source":"但是是挺难的 因为那会儿有签证的问题 也没法工作。","sentence_en":"But it was tough. There were visa issues, and I couldn't work."},{"id":"233","start":1590.57,"end":1603.09,"displayStart":1590.57,"displayEnd":1603.09,"displayMid":1596.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.86385,"pitch":17.423836,"speechRate":4.952,"hasEvents":false,"sentence_source":"所以就 还是挺艰难的有几年，2000年的时候 我就不念我那免疫学了，我说我是三年 要是做不出来的话，我去上法学院或者商学院学个有用的抵规。","sentence_en":"So those years were hard. In 2000, I quit my immunology program. I told myself: I'll give it three years. If I can't make it, I'll go to law school or business school and learn something practical."},{"id":"234","start":1603.09,"end":1605.79,"displayStart":1603.09,"displayEnd":1605.79,"displayMid":1604.44,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.816592,"pitch":9.464948,"speechRate":5.556,"hasEvents":false,"sentence_source":"然后出来找有钱的工作 挣钱的工作。","sentence_en":"Then get a well-paying job."},{"id":"235","start":1606.67,"end":1610.35,"displayStart":1606.67,"displayEnd":1610.35,"displayMid":1608.51,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.977384,"pitch":22.597702,"speechRate":5.435,"hasEvents":false,"sentence_source":"然后正好快要到三年的时候，就在纽约课上发了。","sentence_en":"Then, just before the three years were up, I got published in a New York class."},{"id":"236","start":1610.35,"end":1615.93,"displayStart":1610.35,"displayEnd":1615.93,"displayMid":1613.1399999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.793354,"pitch":20.095959,"speechRate":5.8,"hasEvents":false,"sentence_source":"那时候就知道就不用去再读商学院或者法学院了，就继续往下写就可以了。","sentence_en":"Then I knew I didn't need to go to business or law school. I could just keep writing."},{"id":"237","start":1615.93,"end":1625.93,"displayStart":1615.93,"displayEnd":1625.93,"displayMid":1620.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.084985,"pitch":22.949913,"speechRate":5.408,"hasEvents":false,"sentence_source":"这种转变是跟千喜年带给人的某种冲击有关系吗，还是你只是在那个时候，突然就你到了一个人生的转折 转变的时间节点。","sentence_en":"Was this change related to the impact of the millennium, or was it simply that you reached a turning point in life around that time?"},{"id":"238","start":1625.93,"end":1629.75,"displayStart":1625.93,"displayEnd":1629.75,"displayMid":1627.8400000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.136729,"pitch":25.246752,"speechRate":6.486,"hasEvents":false,"sentence_source":"可能都有吧 我觉得我27岁的时候离开Science。","sentence_en":"Probably both. At 27, I left science."},{"id":"239","start":1629.75,"end":1640.73,"displayStart":1629.75,"displayEnd":1640.73,"displayMid":1635.24,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.6,"loudness":0.691438,"pitch":19.258852,"speechRate":6.648,"hasEvents":false,"sentence_source":"那时候我就觉得 因为我做Science做得很好，我真的是很不谦虚地说我是一个good scientist，我做得很好 也很容易 什么事情对我来说做起来都很容易。","sentence_en":"At that time, I felt — and I say this without false modesty — I was a good scientist. I did well, everything came easily to me."},{"id":"240","start":1640.73,"end":1655.81,"displayStart":1640.73,"displayEnd":1655.81,"displayMid":1648.27,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.865343,"pitch":23.279463,"speechRate":4.993,"hasEvents":false,"sentence_source":"所以我当时那个导师就特别的可惜，他说你做就马上就拿到研究审码大博士吧，你就找工作 你在生活在美国多自由 多幸福那意思，就是说 我就说 你告诉我那个生活我是知道的。","sentence_en":"So my advisor was especially regretful. He said, 'You could get your PhD soon, find a job, live freely and happily in America.' I said, 'You're describing a life I already know."},{"id":"241","start":1655.81,"end":1669.61,"displayStart":1655.81,"displayEnd":1669.61,"displayMid":1662.71,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.6,"loudness":0.734295,"pitch":17.680468,"speechRate":5.843,"hasEvents":false,"sentence_source":"我从这儿一直能看到退休了，没有任何的surprise，没有什么惊议的地方了，我就说我不喜欢那样子，我老实说 我说我提前来的中年危机，我就是27岁就有中年危机了，就不想做那样。","sentence_en":"I could see myself staying here until retirement, with no surprises, nothing unexpected. I said I didn't like that. Honestly, I said I had an early midlife crisis—I had one at 27 and didn't want to live that way."},{"id":"242","start":1669.61,"end":1673.33,"displayStart":1669.61,"displayEnd":1673.33,"displayMid":1671.4699999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.90903,"pitch":22.616173,"speechRate":6.144,"hasEvents":false,"sentence_source":"但是千世年的时候，我现在想 你说的可能有道理。","sentence_en":"But back then, now I think you might have had a point."},{"id":"243","start":1673.33,"end":1685.11,"displayStart":1673.33,"displayEnd":1685.11,"displayMid":1679.2199999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.831364,"pitch":23.404884,"speechRate":4.584,"hasEvents":false,"sentence_source":"那个年代的人可能相对来说比较，更有 不知道是希望呢，还是这种 就是总有要试一下的，这个想法觉得生活中是有一些可以尝试的。","sentence_en":"People of that era were relatively more, I don't know if it's hope or just this feeling that you always had to give things a try, the idea that life has things worth attempting."},{"id":"244","start":1685.11,"end":1693.83,"displayStart":1685.11,"displayEnd":1693.83,"displayMid":1689.4699999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.860201,"pitch":18.293081,"speechRate":5.734,"hasEvents":false,"sentence_source":"那时候可能也许在中国也是这样，我就在美国也是，就是大家总还是要试一下才行，现在可能就20多年以后也不一样了。","sentence_en":"Maybe it was the same in China back then, and in the US too—people always felt they had to give it a shot. Now, over 20 years later, it's different."},{"id":"245","start":1693.83,"end":1698.43,"displayStart":1693.83,"displayEnd":1698.43,"displayMid":1696.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.725224,"pitch":19.198874,"speechRate":6.332,"hasEvents":false,"sentence_source":"我觉得现在生活也比较困难了，我看年轻人的生活都比较困难现在但。","sentence_en":"I think life is harder now. I see young people struggling."},{"id":"246","start":1698.43,"end":1711.47,"displayStart":1698.43,"displayEnd":1711.47,"displayMid":1704.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.98817,"pitch":24.012564,"speechRate":5.445,"hasEvents":false,"sentence_source":"你的那个事很有意思，你不像我说我去创业，我满怀激情的，我就冲到一个项目当中去，录取袖子我就全是心投入进去，你冲到一个新的领域，但你需要非常安静的，你要去创作。","sentence_en":"What you did is interesting. Unlike me, who went into entrepreneurship with full passion, diving into a project, rolling up my sleeves and giving it my all, you entered a new field but needed to be very quiet and creative."},{"id":"247","start":1711.47,"end":1716.29,"displayStart":1711.47,"displayEnd":1716.29,"displayMid":1713.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.943805,"pitch":26.265108,"speechRate":5.151,"hasEvents":false,"sentence_source":"你是用一种非常近的状态，去面对一个完全崭新的领域。","sentence_en":"You approached a completely new field with a very calm state of mind."},{"id":"248","start":1716.29,"end":1729.51,"displayStart":1716.29,"displayEnd":1729.51,"displayMid":1722.9,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.6,"loudness":0.99013,"pitch":23.018663,"speechRate":4.756,"hasEvents":false,"sentence_source":"对 但是可能现在让我想那个决定，也许是个冲动，也许是不理智的，现在回头想实在是不理智，为什么要放弃这么好的专业，这么好的生活去做一件事情。","sentence_en":"Right. But now thinking back, that decision was perhaps impulsive, irrational. Looking back, it was really irrational—why give up such a good profession and good life to do something?"},{"id":"249","start":1729.51,"end":1732.75,"displayStart":1729.51,"displayEnd":1732.75,"displayMid":1731.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.4,"loudness":0.672138,"pitch":28.372435,"speechRate":5.247,"hasEvents":false,"sentence_source":"那时候都不知道能不能出版，能不能发表。","sentence_en":"Back then, I didn't even know if it could be published or released."},{"id":"250","start":1732.75,"end":1746.93,"displayStart":1732.75,"displayEnd":1746.93,"displayMid":1739.8400000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.854381,"pitch":19.63525,"speechRate":5.19,"hasEvents":false,"sentence_source":"但是我觉得人总是会有那么一两次，都想一定要试一下，否则将来会后悔的，这是唯一一次我当时想，如果我现在不是过了这个就没有这个机会了，生活就会到下面一个阶段。","sentence_en":"But I think everyone has one or two times when they feel they must try, or they'll regret it later. This was the only time I thought, if I don't do it now, I'll never have this chance again, and life will move to the next stage."},{"id":"251","start":1746.93,"end":1751.09,"displayStart":1746.93,"displayEnd":1751.09,"displayMid":1749.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.792311,"pitch":26.020575,"speechRate":5.933,"hasEvents":false,"sentence_source":"不会用这种方式去试，但有些时候其实我们内心是知道的。","sentence_en":"I wouldn't try it this way again, but sometimes we know deep down."},{"id":"252","start":1751.09,"end":1753.03,"displayStart":1751.09,"displayEnd":1753.03,"displayMid":1752.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.78847,"pitch":17.641474,"speechRate":7.524,"hasEvents":false,"sentence_source":"我们内心知道自己是可以的。","sentence_en":"Deep down, we know we can do it."},{"id":"253","start":1753.03,"end":1760.05,"displayStart":1753.03,"displayEnd":1760.05,"displayMid":1756.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.869925,"pitch":23.895081,"speechRate":6.375,"hasEvents":false,"sentence_source":"对，我相信那时候在你内心深处一定有个地方，你就是知道，你也不要问我为什么我就是知道我是可以的。","sentence_en":"Yes, I believe back then deep inside you, there was a place where you just knew—don't ask me why—I just knew I could do it."},{"id":"254","start":1760.05,"end":1761.55,"displayStart":1760.05,"displayEnd":1761.55,"displayMid":1760.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.805304,"pitch":18.860132,"speechRate":4.082,"hasEvents":false,"sentence_source":"那可能你要。","sentence_en":"Then maybe you need to."},{"id":"255","start":1761.55,"end":1765.35,"displayStart":1761.55,"displayEnd":1765.35,"displayMid":1763.4499999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":1.13209,"pitch":28.047247,"speechRate":6.579,"hasEvents":false,"sentence_source":"是这么说，可能我确实就在书店里觉得我能比那人写得更好。","sentence_en":"That's right. Maybe I really did feel in the bookstore that I could write better than that person."},{"id":"256","start":1765.35,"end":1778.23,"displayStart":1765.35,"displayEnd":1778.23,"displayMid":1771.79,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.807005,"pitch":21.557745,"speechRate":5.342,"hasEvents":false,"sentence_source":"但是知道自己是可以的和能够写出来，还是两回事情 我觉得写作是一回事情，发表是另一回事情 发表以后是有很多都要运气，这点让我觉得我可能就是运气比较好。","sentence_en":"But knowing you can do it and actually writing it are two different things. I think writing is one thing, publishing is another. After publication, a lot depends on luck. That makes me think I was just lucky."},{"id":"257","start":1778.23,"end":1785.53,"displayStart":1778.23,"displayEnd":1785.53,"displayMid":1781.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.933988,"pitch":23.81233,"speechRate":5.564,"hasEvents":false,"sentence_source":"但是这个运气是你没法控制的，这个就是像你说的，是一些力量是你没法左右也没法处载的。","sentence_en":"But this luck is uncontrollable. As you said, it's forces beyond your control, that you can't manipulate."},{"id":"258","start":1785.53,"end":1788.67,"displayStart":1785.53,"displayEnd":1788.67,"displayMid":1787.1,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":0.878157,"pitch":18.708534,"speechRate":5.096,"hasEvents":false,"sentence_source":"所以那时候就 但是写东西我确实想写。","sentence_en":"So back then—but I did want to write."},{"id":"259","start":1788.67,"end":1790.99,"displayStart":1788.67,"displayEnd":1790.99,"displayMid":1789.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.412355,"pitch":13.688133,"speechRate":6.667,"hasEvents":true,"sentence_source":"因为我觉得我要是不写会后悔的李。","sentence_en":"Because I thought I would regret it if I didn't write."},{"id":"260","start":1790.99,"end":1799.29,"displayStart":1790.99,"displayEnd":1799.29,"displayMid":1795.1399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.933918,"pitch":22.139763,"speechRate":5.467,"hasEvents":true,"sentence_source":"翊云 你曾经讲过你说，仅仅知道一个故事还不够吗 为什么还要写出来，是哈 有的时候你想为什么要写呢。","sentence_en":"Yiyun, you once said, isn't it enough to just know a story? Why write it out? Right, ha. Sometimes you wonder why write at all."},{"id":"261","start":1799.29,"end":1805.41,"displayStart":1799.29,"displayEnd":1805.41,"displayMid":1802.35,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.870312,"pitch":20.831106,"speechRate":5.259,"hasEvents":true,"sentence_source":"我觉得这个为什么要写是一个问题，我是个问题我没法回答就无解的问题。","sentence_en":"I think the question of why write is a problem—it's a problem I can't answer, an unsolvable problem."},{"id":"262","start":1805.93,"end":1812.85,"displayStart":1805.93,"displayEnd":1812.85,"displayMid":1809.3899999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.931784,"pitch":20.444466,"speechRate":5.527,"hasEvents":true,"sentence_source":"因为如果我能有一个答案的话，可能我真的是就不需要写了，就是因为我不知道为什么要写。","sentence_en":"Because if I had an answer, I probably wouldn't need to write. It's precisely because I don't know why I write."},{"id":"263","start":1812.85,"end":1828.41,"displayStart":1812.85,"displayEnd":1828.41,"displayMid":1820.63,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.773569,"pitch":18.025393,"speechRate":4.434,"hasEvents":false,"sentence_source":"所以我总是还是在写，知道一个故事和写出来真的是两回事情，这个有时候我教我的学生就是说，你有一个想法，这个想法在头脑中觉得特别好，觉得很深奥 或者很炫烂。","sentence_en":"So I still keep writing. Knowing a story and actually writing it are really two different things. Sometimes I tell my students that you have an idea, and it feels great in your mind, profound or dazzling."},{"id":"264","start":1828.41,"end":1834.65,"displayStart":1828.41,"displayEnd":1834.65,"displayMid":1831.5300000000002,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.980871,"pitch":20.509525,"speechRate":5.789,"hasEvents":false,"sentence_source":"但是你写出来，你要是不能把它用最精确的语言，和最简洁的语言表达出来的话。","sentence_en":"But if you write it down and can't express it in the most precise and concise language,"},{"id":"265","start":1834.65,"end":1848.85,"displayStart":1834.65,"displayEnd":1848.85,"displayMid":1841.75,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.883498,"pitch":25.354218,"speechRate":5.605,"hasEvents":false,"sentence_source":"那个想法是没有用的，我就说那个想法就是，就像一个海里游的鱼，你不把它捞上来，永远是海里游，你其实那鱼不是你的，就是你得捞上来，你捞上来 发现是个空网，你就知道那个想法是不成立的。","sentence_en":"Then that idea is useless. I say that idea is like a fish swimming in the sea—if you don't catch it, it's always in the sea. That fish isn't yours. You have to catch it. But if you pull up an empty net, you know the idea doesn't hold."},{"id":"266","start":1848.85,"end":1863.45,"displayStart":1848.85,"displayEnd":1863.45,"displayMid":1856.15,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.889143,"pitch":22.015163,"speechRate":5.069,"hasEvents":false,"sentence_source":"所以为什么要写，可能就是像做科学的时候，就要看一看能不能做到那个地步，能写得多好 能做到的有多接近，另一个我从做科学带到我这现在的这个career里的想法是。","sentence_en":"So why write? It's like doing science—you want to see if you can reach that level, how well you can write, how close you can get. Another idea I brought from science to my current career is."},{"id":"267","start":1863.45,"end":1877.11,"displayStart":1863.45,"displayEnd":1877.11,"displayMid":1870.28,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.894898,"pitch":21.876835,"speechRate":4.392,"hasEvents":false,"sentence_source":"永远没有最好 只有更好，就是做科学就是没有做到头 只有做得越来越近，但你没走一进一步 就会有十个可能性，你要从心开始走 写东西是一样的。","sentence_en":"There is never a best, only better. In science, you never reach an end, only get closer. But every step forward opens ten possibilities. You have to start from the heart—same with writing."},{"id":"268","start":1877.11,"end":1882.59,"displayStart":1877.11,"displayEnd":1882.59,"displayMid":1879.85,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":0.65571,"pitch":21.033831,"speechRate":6.387,"hasEvents":false,"sentence_source":"我觉得没有最好 这个更好，就只能今天比昨天写的好一些 不可能是perfect。","sentence_en":"I think there is no 'best,' only 'better.' You can only write a bit better than yesterday; it can't be perfect."},{"id":"269","start":1882.59,"end":1885.01,"displayStart":1882.59,"displayEnd":1885.01,"displayMid":1883.8,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.000472,"pitch":25.789099,"speechRate":5.492,"hasEvents":false,"sentence_source":"所以为什么要写 我没法回答。","sentence_en":"So why write? I can't answer that."},{"id":"270","start":1885.53,"end":1901.43,"displayStart":1885.53,"displayEnd":1901.43,"displayMid":1893.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.5,"loudness":0.882679,"pitch":21.94665,"speechRate":4.814,"hasEvents":false,"sentence_source":"我记得我有一段时间 特别热衷于读，我应该怎么称呼他 就海外华人写的一些中文的小说，更多的是描写他们在海外的一些移民的生活，比如当时写敏安琪 包括谭恩美 Amy Tan。","sentence_en":"I remember a time when I was particularly keen on reading—how should I put it—Chinese novels written by overseas Chinese, mostly depicting their immigrant lives abroad. For example, Min Anqi at the time, including Amy Tan."},{"id":"271","start":1901.43,"end":1907.07,"displayStart":1901.43,"displayEnd":1907.07,"displayMid":1904.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.6,"loudness":0.907651,"pitch":18.862608,"speechRate":3.546,"hasEvents":false,"sentence_source":"我非常好奇他们比下的那种华人在海外的生活。","sentence_en":"I'm very curious about the lives of Chinese people abroad as described by them."},{"id":"272","start":1907.07,"end":1919.93,"displayStart":1907.07,"displayEnd":1919.93,"displayMid":1913.5,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":1.024614,"pitch":25.960686,"speechRate":5.635,"hasEvents":false,"sentence_source":"然后我也明白当一个人 他进入了一个不是自己母语的状态时候，他会经历两种感觉和两种不同的状态，一开始他当语言还不够熟练的时候，他会进入某种失语的感觉。","sentence_en":"I also understand that when someone enters a non-native language environment, they experience two kinds of feelings and states. At first, when the language isn't fluent enough, they enter a kind of aphasia."},{"id":"273","start":1919.93,"end":1925.09,"displayStart":1919.93,"displayEnd":1925.09,"displayMid":1922.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Negative","score":-0.3,"loudness":0.901746,"pitch":22.954216,"speechRate":4.738,"hasEvents":false,"sentence_source":"就是你无法用那种外语来特别自如的，很深入的表达自己。","sentence_en":"That is, you can't express yourself very freely or deeply in that foreign language."},{"id":"274","start":1925.09,"end":1938.25,"displayStart":1925.09,"displayEnd":1938.25,"displayMid":1931.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.5,"loudness":0.933674,"pitch":25.919605,"speechRate":6.138,"hasEvents":true,"sentence_source":"那个时候人可能会feel inadequate，就是我没有办法很好的表达自己，可能内心是有某种的焦虑不甘，当你跨过那个状态之后，你会发现英语是一个他很精准的一种语言。","sentence_en":"At that time, one might feel inadequate, meaning I couldn't express myself well. There might have been some anxiety and unwillingness inside. Once you get past that state, you'll find that English is a very precise language."},{"id":"275","start":1938.25,"end":1945.87,"displayStart":1938.25,"displayEnd":1945.87,"displayMid":1942.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.6,"loudness":1.097872,"pitch":28.553215,"speechRate":6.018,"hasEvents":true,"sentence_source":"你有科学家的这种训练，你会发现你很容易很精准的去表达你内心当中的，以前好像很虚无飘缈的思想。","sentence_en":"With scientific training, you find it easy to precisely express your inner thoughts, which previously seemed vague and ethereal."},{"id":"276","start":1945.87,"end":1951.81,"displayStart":1945.87,"displayEnd":1951.81,"displayMid":1948.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.929143,"pitch":23.589706,"speechRate":5.013,"hasEvents":false,"sentence_source":"我们当时小时候是用中文去写作文啊 写毕业论文，后来你用英文写。","sentence_en":"When we were young, we wrote essays and theses in Chinese; later, you write in English."},{"id":"277","start":1951.81,"end":1961.25,"displayStart":1951.81,"displayEnd":1961.25,"displayMid":1956.53,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.98397,"pitch":24.147192,"speechRate":5.421,"hasEvents":false,"sentence_source":"对于来说你在用英文和中文不同的时期写作的时候，你会自己内心有一种感受，哪一种语言带给你更自如的感觉。","sentence_en":"For you, when writing in different periods—English or Chinese—you have an inner feeling of which language gives you a more comfortable sense."},{"id":"278","start":1961.25,"end":1969.17,"displayStart":1961.25,"displayEnd":1969.17,"displayMid":1965.21,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.5,"loudness":0.788263,"pitch":19.35429,"speechRate":5.494,"hasEvents":false,"sentence_source":"对我来说英语确实是更自如，可能因为我每天想事情看书都看的是英语，这个英语就是我的语言了吗。","sentence_en":"For me, English is indeed more comfortable, probably because I think and read in English every day. Is English my language now?"},{"id":"279","start":1969.17,"end":1971.47,"displayStart":1969.17,"displayEnd":1971.47,"displayMid":1970.3200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":1.166797,"pitch":30.899889,"speechRate":7.292,"hasEvents":false,"sentence_source":"或者这么说 因为它不是你的母语。","sentence_en":"Or rather, because it's not your mother tongue."},{"id":"280","start":1971.47,"end":1983.17,"displayStart":1971.47,"displayEnd":1983.17,"displayMid":1977.3200000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.933113,"pitch":23.962713,"speechRate":5.641,"hasEvents":false,"sentence_source":"所以你需要更想 更仔细地去斟酌 去思考，而一旦在母语的环境当中，你会让这些会更自由的，有时候可能更随意的去表达，是完全不同的状态，是这样子的 我觉得。","sentence_en":"So you need to think more carefully, weigh and consider. In a native language environment, you express more freely, sometimes more casually—completely different states. That's how I see it."},{"id":"281","start":1983.17,"end":1986.25,"displayStart":1983.17,"displayEnd":1986.25,"displayMid":1984.71,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.986961,"pitch":20.292372,"speechRate":5.844,"hasEvents":false,"sentence_source":"我之所以用英语写的，是第二元是很重要的。","sentence_en":"The reason I write in English—the second aspect is very important."},{"id":"282","start":1986.25,"end":1999.13,"displayStart":1986.25,"displayEnd":1999.13,"displayMid":1992.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.762782,"pitch":22.968878,"speechRate":5.435,"hasEvents":false,"sentence_source":"因为每一个字都要，就像你说的 自真去做，每个字都要想明白了才能用，用母语写作的人，当然我的学生都很多都是，母语是英语，我经常跟他们讲，我说你如果用你英语写作。","sentence_en":"Because every word has to, as you said, be done sincerely. Every word must be understood before use. Native language writers—of course many of my students are native English speakers—I often tell them, if you write in English..."},{"id":"283","start":1999.13,"end":2012.21,"displayStart":1999.13,"displayEnd":2012.21,"displa ur voice. It's not a Chinese accent—it's not about having an accent when speaking English."},{"id":"294","start":2079.63,"end":2085.57,"displayStart":2079.63,"displayEnd":2085.57,"displayMid":2082.6000000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.7,"loudness":0.741095,"pitch":21.100132,"speechRate":5.772,"hasEvents":false,"sentence_source":"而是你有自己的这个独特的声音，这个当时他说了以后我觉得是对我很有启发的。","sentence_en":"But you have your own unique voice.' After he said that, I found it very inspiring."},{"id":"295","start":2085.57,"end":2093.81,"displayStart":2085.57,"displayEnd":2093.81,"displayMid":2089.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.866242,"pitch":17.784924,"speechRate":5.826,"hasEvents":false,"sentence_source":"因为可能我们小时候学英语就想说，把英语说的能像美国人一样最流利就最好，能写的像这个普通美国人一样。","sentence_en":"When we were kids learning English, we thought the goal was to speak as fluently as an American and write like an average American."},{"id":"296","start":2093.81,"end":2098.51,"displayStart":2093.81,"displayEnd":2098.51,"displayMid":2096.16,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.905176,"pitch":22.318903,"speechRate":5.1,"hasEvents":false,"sentence_source":"那样只是没有X没有口音而已，并不是独特的一个声音。","sentence_en":"That just means no accent, but it's not a unique voice."},{"id":"297","start":2098.51,"end":2100.61,"displayStart":2098.51,"displayEnd":2100.61,"displayMid":2099.5600000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":1.011853,"pitch":24.386599,"speechRate": ,"sentiment_en":"Neutral","score":0,"loudness":1.046196,"pitch":24.863716,"speechRate":8.205,"hasEvents":false,"sentence_source":"那就是他把他自己就藏在了Henry James里头。","sentence_en":"That's how he hid himself within Henry James."},{"id":"310","start":2167.05,"end":2180.57,"displayStart":2167.05,"displayEnd":2180.57,"displayMid":2173.8100000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.842681,"pitch":22.575624,"speechRate":5.848,"hasEvents":false,"sentence_source":"我觉得很多Writer都是这样子，就是会把自己生活中一些小的事情，就像你说是细节或者是想法有些想法，这个想法对我自己一点用都没有，可能对我的人物就有用，所谓藏起来。","sentence_en":"I think many writers are like that—they take small things from their lives, details or thoughts that are useless to themselves but might be useful for their characters. That's what hiding means."},{"id":"311","start":2180.57,"end":2183.97,"displayStart":2180.57,"displayEnd":2183.97,"displayMid":2182.27,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.790103,"pitch":19.1719,"speechRate":5.588,"hasEvents":false,"sentence_source":"我觉得就是说，把你生活这些东西都给了人物。","sentence_en":"I think it means giving all those life details to your characters."},{"id":"312","start":2183.97,"end":2195.05,"displayStart":2183.97,"displayEnd":2195.05,"displayMid":2189.51,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.818451,"pitch":16.887964,"speechRate":5.083,"hasEvents":false,"sentence_source":"对他们更有用一些，像我自己就是，我知道这是个假象，我自己就感觉我好像是透明的，我在看我自己的东西，就知道我是透明的没有我。","sentence_en":"It's more useful for them. As for me, I know it's an illusion—I feel transparent. When I look at my own work, I see that I'm transparent, not there."},{"id":"313","start":2195.13,"end":2205.49,"displayStart":2195.13,"displayEnd":2205.49,"displayMid":2200.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.947689,"pitch":22.953882,"speechRate":5.598,"hasEvents":false,"sentence_source":"而是只有人物，如果看你的小说 了解你的人能够从你不同时期的创作的小说的人物当中能够看到你成长的一步一步的某些细节 某些经历。","sentence_en":"Only the characters exist. If someone who knows you reads your novels, they can see the steps of your growth through the characters from different periods—certain details, certain experiences."},{"id":"314","start":2205.49,"end":2207.03,"displayStart":2205.49,"displayEnd":2207.03,"displayMid":2206.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":1.248693,"pitch":24.531866,"speechRate":4.781,"hasEvents":false,"sentence_source":"对 那是肯定的。","sentence_en":"Yes, definitely."},{"id":"315","start":2207.03,"end":2220.93,"displayStart":2207.03,"displayEnd":2220.93,"displayMid":2213.98,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.05851,"pitch":21.520811,"speechRate":5.298,"hasEvents":false,"sentence_source":"我觉得所有的作家都会是这样的，就是说很难逃脱这个命运的 我觉得 是大家是能看见的，但他们看见的只是这种皮毛的经历 比如说我前面的小说 有些小说是写在中国的事情。","sentence_en":"I think all writers are like that—it's hard to escape this fate. People can see it, but they only see the surface experiences. For example, some of my earlier novels are set in China."},{"id":"316","start":2220.93,"end":2226.13,"displayStart":2220.93,"displayEnd":2226.13,"displayMid":2223.5299999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.78869,"pitch":18.987215,"speechRate":4.647,"hasEvents":false,"sentence_source":"会有这些可能是这种可以相匹配的在我的生活经历中有。","sentence_en":"And those might match some of my life experiences."},{"id":"317","start":2226.13,"end":2239.75,"displayStart":2226.13,"displayEnd":2239.75,"displayMid":2232.94,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.934367,"pitch":17.685963,"speechRate":5.087,"hasEvents":false,"sentence_source":"但是我现在后面写的一些小说就已经是跟我自己差得很远了，比如说我前面在中国出了一本小说叫《我该走了》，好像那本小说其实写的是一个美国老太太的事情。","sentence_en":"But the novels I've written later are far from myself. For instance, I published a novel in China called 'I Should Go'—it was actually about an American old lady."},{"id":"318","start":2239.75,"end":2243.25,"displayStart":2239.75,"displayEnd":2243.25,"displayMid":2241.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.772454,"pitch":16.025877,"speechRate":6,"hasEvents":false,"sentence_source":"然后我下面的《恶之书》写的是两个法国品牌的事情。","sentence_en":"And then my next book, 'Book of Evil,' is about two French brands."},{"id":"319","start":2243.25,"end":2249.49,"displayStart":2243.25,"displayEnd":2249.49,"displayMid":2246.37,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.060217,"pitch":21.15971,"speechRate":5.16,"hasEvents":false,"sentence_source":"那些小说就是说其实知道我经历的人可能会觉得这些小说也是写我。","sentence_en":"Those novels—people who know my experiences might think they're also about me."},{"id":"320","start":2249.49,"end":2261.07,"displayStart":2249.49,"displayEnd":2261.07,"displayMid":2255.2799999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.886597,"pitch":21.144497,"speechRate":6.508,"hasEvents":false,"sentence_source":"但是就不是皮毛了 就是更深刻的，我当时写《额之书》的时候，我的编辑也是我的好朋友他就说，finally you get an autobiographical novel。","sentence_en":"But it's not surface-level; it's deeper. When I was writing 'Book of Evil,' my editor, who is also a good friend, said, 'Finally you've written an autobiographical novel."},{"id":"321","start":2261.07,"end":2275.31,"displayStart":2261.07,"displayEnd":2275.31,"displayMid":2268.19,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.968019,"pitch":25.336082,"speechRate":5.22,"hasEvents":false,"sentence_source":"他就说《额之书》就是我的自传性的小说，我就很高兴 我说 除了你 没别人知道，只有你知道 而且只有你会说这句话，是这样的 因为任何一个人看那书，就是说写的是法国二战的时候。","sentence_en":"He said 'Book of Evil' is my autobiographical novel. I was very happy and said, 'No one else knows except you. Only you would say that.' Because anyone reading the book would think it's about France during WWII."},{"id":"322","start":2275.31,"end":2284.53,"displayStart":2275.31,"displayEnd":2284.53,"displayMid":2279.92,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.841513,"pitch":24.102819,"speechRate":5.423,"hasEvents":false,"sentence_source":"战后两个少女 或者就teenager，跟我的生活没有任何关系，没有任何经历没有任何交接，是说 但是我的编辑就说。","sentence_en":"Two girls after the war, or teenagers, had no connection to my life, no overlap in experience. But my editor said."},{"id":"323","start":2284.53,"end":2287.01,"displayStart":2284.53,"displayEnd":2287.01,"displayMid":2285.7700000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.935488,"pitch":19.797264,"speechRate":2.419,"hasEvents":false,"sentence_source":"那是自转性的。","sentence_en":"It's autobiographical."},{"id":"324","start":2287.01,"end":2290.61,"displayStart":2287.01,"displayEnd":2290.61,"displayMid":2288.8100000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.966678,"pitch":25.554405,"speechRate":3.889,"hasEvents":false,"sentence_source":"所以可能是能看到也会藏肯定是。","sentence_en":"So maybe you can see it, but you definitely hide it."},{"id":"325","start":2290.61,"end":2292.31,"displayStart":2290.61,"displayEnd":2292.31,"displayMid":2291.46,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0.1,"loudness":1.107298,"pitch":23.431955,"speechRate":5.882,"hasEvents":false,"sentence_source":"其实我现在也不怎么藏。","sentence_en":"Actually, I don't hide it much anymore."},{"id":"326","start":2292.31,"end":2297.87,"displayStart":2292.31,"displayEnd":2297.87,"displayMid":2295.09,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.767126,"pitch":18.412882,"speechRate":6.475,"hasEvents":false,"sentence_source":"因为我觉得藏也没用，就说 it doesn't matter，只要这个书写得好就可以。","sentence_en":"Because I think hiding is pointless, so it doesn't matter, as long as the book is good."},{"id":"327","start":2297.87,"end":2299.45,"displayStart":2297.87,"displayEnd":2299.45,"displayMid":2298.66,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":1.136335,"pitch":27.7759,"speechRate":6.962,"hasEvents":false,"sentence_source":"特别好奇刚才你的编辑讲。","sentence_en":"I was really curious about what your editor just said."},{"id":"328","start":2299.45,"end":2302.97,"displayStart":2299.45,"displayEnd":2302.97,"displayMid": erary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.966566,"pitch":22.966557,"speechRate":6.515,"hasEvents":false,"sentence_source":"因为我现在在教战争与和平，我说托尔斯泰就把他一部分放在这个，Andre的身上另一部分放在Pierre身上，我当时写《恶之书》的时候就想，主要说我是觉得当年感觉。","sentence_en":"Because now I teach War and Peace, and I say Tolstoy put part of himself in Andrei and part in Pierre. When I wrote The Book of Evil, I felt the same way."},{"id":"333","start":2329.33,"end":2340.05,"displayStart":2329.33,"displayEnd":2340.05,"displayMid":2334.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.905484,"pitch":22.433535,"speechRate":4.757,"hasEvents":false,"sentence_source":"我像你可能有这种经历就是Tinaage，就是年轻的小姑娘们12岁到15岁，是一个非常丰富的年代，感情也很丰富。","sentence_en":"I think you might have had this experience too—teenage girls from 12 to 15 are in a very rich period, emotionally rich."},{"id":"334","start":2340.05,"end":2349.35,"displayStart":2340.05,"displayEnd":2349.35,"displayMid":2344.7,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.858181,"pitch":25.81163,"speechRate":4.946,"hasEvents":false,"sentence_source":"那个年代的女孩子也会很有想象力，也很rasch，就是说有很多这种矛盾的性格，就在那个年代的女孩子里。","sentence_en":"Girls at that age are also imaginative and bold—they have many contradictory personalities."},{"id":"335","start":2349.35,"end":2354.15,"displayStart":2349.35,"displayEnd":2354.15,"displayMid":2351.75,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0.1,"loudness":0.932687,"pitch":20.273834,"speechRate":6.494,"hasEvents":false,"sentence_source":"所以我其实虽然写的是法国的女孩，我肯定是想到我小时候是怎么样的。","sentence_en":"So even though I wrote about French girls, I was definitely thinking about what I was like as a child."},{"id":"336","start":2354.15,"end":2355.63,"displayStart":2354.15,"displayEnd":2355.63,"displayMid":2354.8900000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.971865,"pitch":28.04974,"speechRate":6.081,"hasEvents":false,"sentence_source":"然后这本书出来之后。","sentence_en":"Then after the book came out,"},{"id":"337","start":2355.63,"end":2366.99,"displayStart":2355.63,"displayEnd":2366.99,"displayMid":2361.31,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.974289,"pitch":19.856712,"speechRate":5.538,"hasEvents":false,"sentence_source":"我觉得是很有趣的，我有一个朋友，他是从德国来的，也是个数学家和教育员写的，他就说 哎呀，他说我看你这书，我就想起来小时候在德国就是这样子的。","sentence_en":"I found it interesting. A friend from Germany, a mathematician and educator, said, 'When I read your book, I remembered my childhood in Germany—it was exactly like this."},{"id":"338","start":2366.99,"end":2368.87,"displayStart":2366.99,"displayEnd":2368.87,"displayMid":2367.93,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.815753,"pitch":24.180988,"speechRate":8.383,"hasEvents":false,"sentence_source":"我们德国长大的时候就是这样子。","sentence_en":"That's how we grew up in Germany."},{"id":"339","start":2368.87,"end":2375.11,"displayStart":2368.87,"displayEnd":2375.11,"displayMid":2371.99,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.6,"loudness":0.977954,"pitch":26.344082,"speechRate":6.673,"hasEvents":false,"sentence_source":"那我有一个钢琴老师，他妈妈是从意大利来的，他妈妈说 哎呀 他说我们在意大利就是这样子。","sentence_en":"And my piano teacher's mother, who is Italian, said, 'In Italy, it was just like that."},{"id":"340","start":2375.11,"end":2378.75,"displayStart":2375.11,"displayEnd":2378.75,"displayMid":2376.9300000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0.1,"loudness":0.998931,"pitch":23.059898,"speechRate":3.741,"hasEvents":false,"sentence_source":"所以我觉得可能是很自传性的。","sentence_en":"So I think it might be very autobiographical."},{"id":"341","start":2378.75,"end":2384.55,"displayStart":2378.75,"displayEnd":2384.55,"displayMid":2381.65,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.912204,"pitch":20.049789,"speechRate":5.862,"hasEvents":false,"sentence_source":"但是也可能就是所有人都有过的经历，不管是从哪个文化出来，都会有这样的经历。","sentence_en":"But it might also be a universal experience, no matter the culture."},{"id":"342","start":2384.55,"end":2393.71,"displayStart":2384.55,"displayEnd":2393.71,"displayMid":2389.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.966508,"pitch":18.845091,"speechRate":5.432,"hasEvents":false,"sentence_source":"所以我听到大家的这个反应就觉得很有意思，就想 也许这就是为什么我们要写作的，是大家都觉得我写了他们的故事。","sentence_en":"So hearing these reactions is fascinating. Maybe that's why we write—everyone feels I've written their story."},{"id":"343","start":2393.71,"end":2395.13,"displayStart":2393.71,"displayEnd":2395.13,"displayMid":2394.42,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.03614,"pitch":22.849894,"speechRate":8.118,"hasEvents":false,"sentence_source":"而不是说我写了我的故事。","sentence_en":"Rather than that I wrote my own story."},{"id":"344",
