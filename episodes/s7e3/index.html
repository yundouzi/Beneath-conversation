luster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.926126,"pitch":24.197002,"speechRate":5.3,"hasEvents":false,"sentence_source":"我们都有24小时 一年365天，还有一个时间的公平跟民主在于，时间会过去，意味着一切都会过去，好与坏都会过去。","sentence_en":"We all have 24 hours, 365 days a year. Another fairness and democracy of time is that time passes, meaning everything will pass, both good and bad."},{"id":"10","start":78.68,"end":85.36,"displayStart":78.68,"displayEnd":85.36,"displayMid":82.02000000000001,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.997071,"pitch":25.997702,"speechRate":5.65,"hasEvents":false,"sentence_source":"所以当我照这两个时间的要素之后，内心会变得平静下来，你会明白这一切都会过去。","sentence_en":"So when I consider these two elements of time, I feel calm inside, knowing that everything will pass."},{"id":"11","start":85.36,"end":88.48,"displayStart":85.36,"displayEnd":88.48,"displayMid":86.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.086262,"pitch":30.417236,"speechRate":6.169,"hasEvents":false,"sentence_source":"但是在过去的过程当中，你依然要每天去经历。","sentence_en":"But during that passing, you still have to live through it day by day."},{"id":"12","start":88.48,"end":91.9,"displayStart":88.48,"displayEnd":91.9,"displayMid":90.19,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.885672,"pitch":26.62468,"speechRate":4.58,"hasEvents":false,"sentence_source":"那如何去面对它，我可能从来不会说。","sentence_en":"How to face it—I might never say."},{"id":"13","start":91.9,"end":94.86,"displayStart":91.9,"displayEnd":94.86,"displayMid":93.38,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.765504,"pitch":15.489368,"speechRate":8.108,"hasEvents":false,"sentence_source":"我要走出什么，就说get over something。","sentence_en":"Like, I’d never say 'get over something."},{"id":"14","start":94.86,"end":100.04,"displayStart":94.86,"displayEnd":100.04,"displayMid":97.45,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.766464,"pitch":24.672754,"speechRate":5.154,"hasEvents":false,"sentence_source":"我觉得生活中有些艰难是不能够走出来的，也不需要走出来的。","sentence_en":"I think some hardships in life can’t be gotten over, and they don’t need to be."},{"id":"15","start":100.04,"end":113.68,"displayStart":100.04,"displayEnd":113.68,"displayMid":106.86000000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.879301,"pitch":21.130308,"speechRate":5.695,"hasEvents":false,"sentence_source":"那就是生活的一部分，像我自己的经纪就是说，我就在这里面，我的存在是存在在这个痛苦里面，而不是说走出这个痛苦，你生活很痛苦也是24小时一天，你生活很快的时候也是24小时。","sentence_en":"It’s part of life. My own philosophy is, I exist within it—I exist in this pain, not outside it. A painful day is still 24 hours, just like a happy one."},{"id":"16","start":113.68,"end":128.28,"displayStart":113.68,"displayEnd":128.28,"displayMid":120.98,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.932322,"pitch":21.233013,"speechRate":4.937,"hasEvents":false,"sentence_source":"关键对我来说是你怎么过这24小时，做了一些有用的事情或者有趣的事情，或者你想了一些问题，或者你写了就像我就是写了两篇书，写了两篇字，可能那对我来说更重要。","sentence_en":"What matters to me is how you live those 24 hours—doing something useful or interesting, thinking through some questions, or writing, like how I wrote two books, two pieces. That might be more important to me."},{"id":"17","start":128.28,"end":132.6,"displayStart":128.28,"displayEnd":132.6,"displayMid":130.44,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.82993,"pitch":20.304974,"speechRate":5.75,"hasEvents":false,"sentence_source":"所以走得出走不出在，我现在觉得都是没有关系的事情。","sentence_en":"So whether you can get over it or not, I feel now, it doesn’t matter."},{"id":"18","start":135.25,"end":143.89,"displayStart":135.25,"displayEnd":143.89,"displayMid":139.57,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.854572,"pitch":27.738266,"speechRate":4.167,"hasEvents":false,"sentence_source":"但我有时候其实想跟别人讲的就是，再痛苦这个日子依然是值得我们去体验的觉得吗。","sentence_en":"But sometimes I want to tell others: even in pain, this life is still worth experiencing, don’t you think?"},{"id":"19","start":143.89,"end":145.93,"displayStart":143.89,"displayEnd":145.93,"displayMid":144.91,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.833382,"pitch":25.748777,"speechRate":6.936,"hasEvents":false,"sentence_source":"我觉得值得 你觉得不值得吗。","sentence_en":"I think it is. Don’t you?"},{"id":"20","start":145.93,"end":148.35,"displayStart":145.93,"displayEnd":148.35,"displayMid":147.14,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":1.301388,"pitch":30.471651,"speechRate":5.714,"hasEvents":true,"sentence_source":"我不知道 我就想问你的想法。","sentence_en":"I don’t know—I just wanted to hear your thoughts."},{"id":"21","start":154.64,"end":170.07999999999998,"displayStart":154.64,"displayEnd":170.07999999999998,"displayMid":162.35999999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.943019,"pitch":22.673967,"speechRate":5.052,"hasEvents":true,"sentence_source":"现在是普林斯顿大学，留一丝艺术中心 创意写作教授，他是当代最具国际知名度和影响力的华裔作家之一，我最初关注到李翊云是从他在纽约课上发表的几篇短片小说开始的。","sentence_en":"Currently a professor of creative writing at Princeton University's Lewis Center for the Arts, he is one of the most internationally renowned and influential Chinese-American writers. I first noticed Li Yiyun from several short stories he published in The New Yorker."},{"id":"22","start":170.07999999999998,"end":184.34,"displayStart":170.07999999999998,"displayEnd":184.34,"displayMid":177.20999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.899921,"pitch":20.982069,"speechRate":5.049,"hasEvents":false,"sentence_source":"我读了秩序的威力 一切都会好起来的，还有技巧与特制 他的语言非常冷静克制 精准有力，特别符合我的阅读审美，另外尽管他的文字很简联 但是他的小说特别有画面感。","sentence_en":"I read 'The Power of Order' and 'Everything Will Be Alright', as well as 'Skills and Specialties'. His language is very calm and restrained, precise and powerful, which particularly suits my reading aesthetic. Additionally, although his writing is concise, his novels are very vivid."},{"id":"23","start":184.34,"end":197.64,"displayStart":184.34,"displayEnd":197.64,"displayMid":190.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.897417,"pitch":20.937744,"speechRate":4.907,"hasEvents":false,"sentence_source":"每一次读他的短片 我总是从第一句话开始 就好像进入一部电影，每一个细节都在我眼前许许如生的展现，我也喜欢李翊云在文字之外的表达 很有意思。","sentence_en":"Every time I read his short pieces, I start from the first sentence, like entering a movie. Every detail comes alive before my eyes. I also love Li Yiyun’s expression beyond words—it’s really interesting."},{"id":"24","start":197.64,"end":207.94,"displayStart":197.64,"displayEnd":207.94,"displayMid":202.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.899014,"pitch":23.597073,"speechRate":6.113,"hasEvents":false,"sentence_source":"我读过一篇李翊云的讲演文字稿，是他2024年春天在纽约参加The National Art Club，全美艺术中心俱乐部的一个活动。","sentence_en":"I once read a transcript of a speech by Li Yiyun, from spring 2024 at an event at The National Arts Club in New York."},{"id":"25","start":207.94,"end":216.4,"displayStart":207.94,"displayEnd":216.4,"displayMid":212.17000000000002,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.6,"loudness":0.908499,"pitch":20.519087,"speechRate":5.015,"hasEvents":false,"sentence_source":"为作家柯尔姆托兵颁奖 他上台介绍托兵 秀了一段脱口秀，这一段表达给我留下了非常深刻的印象。","sentence_en":"She was presenting an award to writer Colm Tóibín. She went on stage to introduce him and did a stand-up comedy bit—that left a deep impression on me."},{"id":"26","start":216.82,"end":222.48,"displayStart":216.82,"displayEnd":222.48,"displayMid":219.64999999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":1.019622,"pitch":23.509552,"speechRate":5.474,"hasEvents":false,"sentence_source":"这不仅是一个简单的介绍，里面有人物，有对话，有场景，还有写作的方法论。","sentence_en":"It wasn’t just a simple introduction; it had characters, dialogue, scenes, and even writing methodology."},{"id":"27","start":222.74,"end":230.7,"displayStart":222.74,"displayEnd":230.7,"displayMid":226.72,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.934688,"pitch":21.52425,"speechRate":6.667,"hasEvents":false,"sentence_source":"还提到了很多文学和文化名人，比如沃尔夫的姐姐画家Vanessa Bell，Vanessa的女儿Angelaika。","sentence_en":"She also mentioned many literary and cultural figures, like Virginia Woolf’s sister, painter Vanessa Bell, Vanessa’s daughter Angelica."},{"id":"28","start":231.16,"end":236.4,"displayStart":231.16,"displayEnd":236.4,"displayMid":233.78,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.926475,"pitch":22.166462,"speechRate":9.16,"hasEvents":false,"sentence_source":"还有Vanessa的丈夫Duncan Grant，以及Duncan的同性情人David Garnett。","sentence_en":"And Vanessa’s husband Duncan Grant, along with Duncan’s gay lover David Garnett."},{"id":"29","start":236.74,"end":247.3,"displayStart":236.74,"displayEnd":247.3,"displayMid":242.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Negative","score":-0.4,"loudness":0.864514,"pitch":20.672255,"speechRate":7.031,"hasEvents":false,"sentence_source":"还有他们之间非常狗血的故事，比如David Garnett曾经对Duncan Grant说，20年以后我要娶Andre Leica 结果他还真的娶了他 就简直恐怖。","sentence_en":"And the messy, dramatic story between them—like how David Garnett once told Duncan Grant, 'I’ll marry Angelica in 20 years,' and he actually did—it’s almost terrifying."},{"id":"30","start":247.3,"end":257.2,"displayStart":247.3,"displayEnd":257.2,"displayMid":252.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Strongly Positive","score":0.9,"loudness":0.890258,"pitch":21.551384,"speechRate":4.646,"hasEvents":false,"sentence_source":"这些人构成了一张交错复杂充满趣味的文学和文化关系网，李翊云就是这样 是一位讲故事的高手 表达的高手。","sentence_en":"These people form a complex, fascinating web of literary and cultural connections. Li Yiyun is like that—a master storyteller, a master of expression."},{"id":"31","start":257.2,"end":268.8,"displayStart":257.2,"displayEnd":268.8,"displayMid":263,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.855926,"pitch":21.035271,"speechRate":5.022,"hasEvents":false,"sentence_source":"那我们在谈论李翊云的时候 除了他的作品 也会谈论他的人生经历，他经历的那些爱和痛 而对翊云来说 有一些表达只会存在于文字中。","sentence_en":"So when we talk about Li Yiyun, besides her work, we also talk about her life experiences, the love and pain she’s been through. For Li Yiyun, some expressions only exist in writing."},{"id":"32","start":268.8,"end":273.34000000000003,"displayStart":268.8,"displayEnd":273.34000000000003,"displayMid":271.07000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Neutral","score":0,"loudness":0.83151,"pitch":14.385629,"speechRate":4.185,"hasEvents":false,"sentence_source":"无法存在于讲述中 有一些情感 他可以写下来。","sentence_en":"They can’t exist in speech. Some emotions she can write down."},{"id":"33","start":273.34000000000003,"end":288.46,"displayStart":273.34000000000003,"displayEnd":288.46,"displayMid":280.9,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":0,"clusterLabel":"C0","clusterName":"Episode Summary","sentiment_en":"Positive","score":0.5,"loudness":0.844759,"pitch":18.600304,"speechRate":4.529,"hasEvents":false,"sentence_source":"但是无法讲给我们听 至少现在还不行，而讲述和语言抵达不了的地方 文字会帮他抵达，李云就是这样 他的文字承载了他所有的情绪，而生活中他就是这样淡淡的。","sentence_en":"But he cannot tell us, at least not yet. Where words and speech cannot reach, writing will help him get there. That's how Li Yiyun is—his writing carries all his emotions, while in life he remains understated."},{"id":"34","start":288.46,"end":294.67,"displayStart":288.46,"displayEnd":294.67,"displayMid":291.565,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.6,"loudness":0.920858,"pitch":19.626827,"speechRate":4.036,"hasEvents":false,"sentence_source":"那接下来是我和李翊云的对话，嗨 大家好 欢迎来到岩中花述。","sentence_en":"Now here’s my conversation with Li Yiyun. Hi everyone, welcome to 'Rocks and Flowers."},{"id":"35","start":295.19,"end":298.51,"displayStart":295.19,"displayEnd":298.51,"displayMid":296.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.5,"loudness":0.883041,"pitch":29.580177,"speechRate":5.601,"hasEvents":false,"sentence_source":"今天我请到的嘉宾是著名的作家李翊云。","sentence_en":"Today my guest is the renowned writer Li Yiyun."},{"id":"36","start":298.97,"end":311.63,"displayStart":298.97,"displayEnd":311.63,"displayMid":305.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.94793,"pitch":27.292707,"speechRate":5.493,"hasEvents":false,"sentence_source":"那此刻我和易云面对面，只不过我们俩的面对面中间隔着从北京到新泽西州的距离，我问了一下Deep Seek 据说是11000多公里，还有12小时的时差。","sentence_en":"Right now, Yiyun and I are face to face, but between us is the distance from Beijing to New Jersey. I asked DeepSeek—it’s about 11,000 kilometers, with a 12-hour time difference."},{"id":"37","start":311.63,"end":314.91,"displayStart":311.63,"displayEnd":314.91,"displayMid":313.27,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":1.006887,"pitch":23.033567,"speechRate":5.183,"hasEvents":false,"sentence_source":"那现在北京的时间是晚上8点钟多一点。","sentence_en":"It’s a little past 8 PM in Beijing now."},{"id":"38","start":314.91,"end":322.73,"displayStart":314.91,"displayEnd":322.73,"displayMid":318.82000000000005,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.6,"loudness":0.920236,"pitch":23.129808,"speechRate":4.859,"hasEvents":false,"sentence_source":"所以易云今天比较早8点多钟，首先先欢迎易云 然后请他跟大家打个招呼，谢谢你 鲁豫老师。","sentence_en":"So Yiyun is up early today, around 8-something. First, welcome Yiyun, and please say hello to everyone. Thank you, Lu Yu."},{"id":"39","start":322.85,"end":324.75,"displayStart":322.85,"displayEnd":324.75,"displayMid":323.8,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Positive","score":0.5,"loudness":0.646686,"pitch":17.481804,"speechRate":4.336,"hasEvents":false,"sentence_source":"谢谢让我来上节目。","sentence_en":"Thanks for having me on the show."},{"id":"40","start":325.59,"end":337.69,"displayStart":325.59,"displayEnd":337.69,"displayMid":331.64,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.938405,"pitch":25.111912,"speechRate":5.421,"hasEvents":false,"sentence_source":"我知道翊云其实在英文和中文两中语言的国家和地区有很多很多的读者，他有很多代表作 大家可能会非常熟悉 比如说千年近期 理性终结之处 我该走了吗。","sentence_en":"I know Li Yiyun has many, many readers in both English and Chinese-speaking regions. She has many representative works that might be familiar to you, like 'The Thousand Autumns of Jacob de Zoet,' 'Where Reasons End,' 'Must I Go."},{"id":"41","start":337.69,"end":352.19,"displayStart":337.69,"displayEnd":352.19,"displayMid":344.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.968812,"pitch":25.193535,"speechRate":4.966,"hasEvents":false,"sentence_source":"我特别要推荐一下 就他有一本书是2022年的作品 《额之书》的中文版 很快就要在国内和大家见面了，我想推荐大家 如果大家还没有看过翊云的书的话 我特别特别的建议。","sentence_en":"I especially want to recommend one of her books: a 2022 work, 'The Book of Goose,' the Chinese edition will be out soon. If you haven’t read any of her books yet, I highly, highly suggest it."},{"id":"42","start":352.19,"end":361.79,"displayStart":352.19,"displayEnd":361.79,"displayMid":356.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.995566,"pitch":26.255405,"speechRate":5.073,"hasEvents":false,"sentence_source":"我最近有一个很神奇的阅读体验 我读的是易云 不是他的小说，而是他在去年2024年春天的一篇《讲演稿》。","sentence_en":"I recently had a fascinating reading experience—I read not her novel, but a speech transcript from spring 2024."},{"id":"43","start":361.79,"end":373.75,"displayStart":361.79,"displayEnd":373.75,"displayMid":367.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.038597,"pitch":26.105286,"speechRate":5.618,"hasEvents":false,"sentence_source":"他在这篇算是讲演稿的最后 他说觉得柯尔姆托兵他的写作方法很有意思，他说 像他那么熟悉Henry James 但是他依然没有办法在写那个大师的时候。","sentence_en":"At the end of that speech, she said she found Colm Tóibín’s writing method very interesting. She said, 'As familiar as he is with Henry James, he still couldn’t figure out how to approach writing about the master."},{"id":"44","start":373.75,"end":378.87,"displayStart":373.75,"displayEnd":378.87,"displayMid":376.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.978934,"pitch":25.823299,"speechRate":6.445,"hasEvents":false,"sentence_source":"不知道该怎么样进入这样的一个宏大的一个题目 所以他在意大利不断的散布。","sentence_en":"He didn’t know how to enter such a grand subject, so he kept walking in Italy."},{"id":"45","start":378.87,"end":389.07,"displayStart":378.87,"displayEnd":389.07,"displayMid":383.97,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.866044,"pitch":20.080076,"speechRate":4.902,"hasEvents":false,"sentence_source":"然后做了一个梦 于是这本书的开头就有了，李翊云说 从此以后我的写作每一天都是以柯尔姆的方式开启我写作的一天。","sentence_en":"Then he had a dream, and so the opening of that book came to him. Li Yiyun said, 'From then on, I start my writing day every day the Colm way."},{"id":"46","start":389.07,"end":392.79,"displayStart":389.07,"displayEnd":392.79,"displayMid":390.93,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":1.076057,"pitch":24.751734,"speechRate":6.183,"hasEvents":false,"sentence_source":"所以我很好奇 具体的柯尔姆方式到底是什么 是做梦吗。","sentence_en":"So I’m curious: what exactly is the Colm way? Is it dreaming?"},{"id":"47","start":392.79,"end":401.21,"displayStart":392.79,"displayEnd":401.21,"displayMid":397,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.868368,"pitch":19.819275,"speechRate":4.835,"hasEvents":false,"sentence_source":"那是很多年之前我问她的，她就是说 有的时候你对一个人物的了解 比对自己的了解还要多。","sentence_en":"I asked her that many years ago. She said, sometimes you know a character better than you know yourself."},{"id":"48","start":401.21,"end":404.95,"displayStart":401.21,"displayEnd":404.95,"displayMid":403.08,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.094724,"pitch":18.74799,"speechRate":4.928,"hasEvents":false,"sentence_source":"但是 因为你太了解了 就不知道从何下笔。","sentence_en":"But because you know them so well, you don’t know where to start."},{"id":"49","start":404.95,"end":408.55,"displayStart":404.95,"displayEnd":408.55,"displayMid":406.75,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.752565,"pitch":21.026691,"speechRate":4.308,"hasEvents":false,"sentence_source":"因为很多事情 很多经历都可以写。","sentence_en":"Because so many things and experiences could be written."},{"id":"50","start":408.55,"end":421.45,"displayStart":408.55,"displayEnd":421.45,"displayMid":415,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.947251,"pitch":24.401316,"speechRate":5.426,"hasEvents":false,"sentence_source":"那时候我很年轻 他说年轻的作家就是想，怎么才能够一写上来 就像那里很炫烂的这么一笔开篇，他说其实没有这么麻烦的，他说你就那天发生了什么事情 就从那件事情。","sentence_en":"I was very young then. She said young writers always think about how to start with something flashy and brilliant."},{"id":"51","start":421.45,"end":430.21,"displayStart":421.45,"displayEnd":430.21,"displayMid":425.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.834425,"pitch":21.912817,"speechRate":4.798,"hasEvents":false,"sentence_source":"你要是出去给我看见了一棵树，或者跟人说了一句话 就从那件事情开始写，把那件事情给你的人物。","sentence_en":"She said it’s actually not that complicated. 'Just write about whatever happened that day—start with that."},{"id":"52","start":430.21,"end":444.65,"displayStart":430.21,"displayEnd":444.65,"displayMid":437.42999999999995,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.986854,"pitch":21.400335,"speechRate":5.324,"hasEvents":false,"sentence_source":"我觉得他这个方法就是很方便 很sneaky怎么说，sneaky就是很有一点点脚滑，有一点点很脚斜的那个意思 对脚滑 很脚斜的意思，就是说他写的是Henry James。","sentence_en":"Like if you went out and saw a tree, or said a word to someone—start from that, and give that thing to your character."},{"id":"53","start":444.65,"end":452.35,"displayStart":444.65,"displayEnd":452.35,"displayMid":448.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.97598,"pitch":17.39887,"speechRate":5.098,"hasEvents":false,"sentence_source":"但是我们不知道那本书里都有多少是他自己的经历，他就是把他的自己的经历写到那里头去。","sentence_en":"I think her method is very convenient, very sneaky—how to put it? Sneaky means a bit tricky, a bit sly. She was writing about Henry James."},{"id":"54","start":452.35,"end":466.39,"displayStart":452.35,"displayEnd":466.39,"displayMid":459.37,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.967568,"pitch":21.204172,"speechRate":4.915,"hasEvents":false,"sentence_source":"因为我们写东西都是生活在生活中吗，我就想从那以后我就用他这个，比如我这一天有看见一本书，看见一句话 我觉得这个词很好，或者跟人说的话，这句话说得好奇怪。","sentence_en":"But we don’t know how much of her own experience is in that book—she just wrote her own experiences into it."},{"id":"55","start":466.39,"end":470.05,"displayStart":466.39,"displayEnd":470.05,"displayMid":468.22,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.138774,"pitch":20.374506,"speechRate":4.372,"hasEvents":false,"sentence_source":"我就会想办法把那个试剑写到书里去。","sentence_en":"Because we all live our lives when we write. Since then, I’ve adopted her method. For example, if I read a book, see a phrase, think the word is good, or hear someone say something strange."},{"id":"56","start":470.05,"end":475.23,"displayStart":470.05,"displayEnd":475.23,"displayMid":472.64,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.910617,"pitch":19.539734,"speechRate":5.405,"hasEvents":false,"sentence_source":"其实就是一个隐子吧，有的时候再搞的时候，再编辑的时候就会删掉。","sentence_en":"I’ll try to work that seed into my writing."},{"id":"57","start":475.23,"end":478.93,"displayStart":475.23,"displayEnd":478.93,"displayMid":477.08000000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.210203,"pitch":24.610226,"speechRate":4.916,"hasEvents":false,"sentence_source":"但是我觉得都需要一个就是热身过程。","sentence_en":"It’s really just a seed. Sometimes when editing, I’ll delete it."},{"id":"58","start":478.93,"end":483.03,"displayStart":478.93,"displayEnd":483.03,"displayMid":480.98,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.969008,"pitch":27.820587,"speechRate":7.037,"hasEvents":false,"sentence_source":"所以你在日常生活当中，随时随地会有一些灵感要记录下来吗。","sentence_en":"But I think we all need a warm-up process."},{"id":"59","start":483.03,"end":497.47,"displayStart":483.03,"displayEnd":497.47,"displayMid":490.25,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.985504,"pitch":20.602566,"speechRate":5.116,"hasEvents":false,"sentence_source":"是的 可能也不能说是灵感，就是我就是注意力第一很集中第二很分散，就集中就是说我要想一件事情就会想了，我就会一直想下去可能想一个小时就想这一句话或者一个念头。","sentence_en":"So in daily life, do you record inspirations anytime, anywhere?"},{"id":"60","start":497.47,"end":508.67,"displayStart":497.47,"displayEnd":508.67,"displayMid":503.07000000000005,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.051143,"pitch":25.084604,"speechRate":5.037,"hasEvents":false,"sentence_source":"但是我的注意力也很分散因为我要，路上看见什么人或者是场里看见什么菜，我都会看见就会想一下有的时候其实就是一念之差吧。","sentence_en":"Yes. Maybe it’s not inspiration. I’d say my attention is both highly focused and highly scattered. Focused means if I want to think about something, I will—I might dwell on one sentence or one thought for an hour."},{"id":"61","start":508.67,"end":513.01,"displayStart":508.67,"displayEnd":513.01,"displayMid":510.84000000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.952995,"pitch":22.170544,"speechRate":5.53,"hasEvents":false,"sentence_source":"我觉得就是一念，我以前的话先上带一个本，看见东西就记。","sentence_en":"But my attention is also scattered because on the street I’ll notice someone, or see some vegetable at the market, and I’ll think about it for a moment. Sometimes it’s just a split-second thought."},{"id":"62","start":513.01,"end":518.17,"displayStart":513.01,"displayEnd":518.17,"displayMid":515.5899999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.035424,"pitch":14.778143,"speechRate":5.233,"hasEvents":false,"sentence_source":"但是现在有时候也就乱了，就直接就打在手机上 我就记在手机上。","sentence_en":"I think it’s just a thought. Before, I carried a notebook and wrote things down."},{"id":"63","start":518.17,"end":531.93,"displayStart":518.17,"displayEnd":531.93,"displayMid":525.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.976466,"pitch":22.395435,"speechRate":5.451,"hasEvents":false,"sentence_source":"我在纽约课上看到你的短片，我记得我读到的 不是第一篇了，我是读到的是在去年8月25号，一篇Particles of Order 秩序的威力，你第一句话就写两个女主人工。","sentence_en":"I saw your short film in New York class. I recall reading something earlier — not the first piece — on August 25 last year: 'Particles of Order: The Power of Order.' Your first sentence mentioned two female protagonists."},{"id":"64","start":531.93,"end":534.11,"displayStart":531.93,"displayEnd":534.11,"displayMid":533.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.061561,"pitch":24.09631,"speechRate":7.339,"hasEvents":false,"sentence_source":"其中那个Earthla 她往上窗外。","sentence_en":"In it, Earthla looked out the window."},{"id":"65","start":534.11,"end":535.79,"displayStart":534.11,"displayEnd":535.79,"displayMid":534.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.049392,"pitch":24.132029,"speechRate":10.714,"hasEvents":false,"sentence_source":"然后手里面再准备的一个platter。","sentence_en":"She was preparing a platter."},{"id":"66","start":535.79,"end":543.31,"displayStart":535.79,"displayEnd":543.31,"displayMid":539.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":1.020448,"pitch":24.498184,"speechRate":6.915,"hasEvents":false,"sentence_source":"那个细节 我非常喜欢细节，她在platter那个盘子上面，她往那个cheese还有那个nuts，应该上面交上蜂蜜。","sentence_en":"I loved that detail — she put cheese and nuts on the platter and drizzled honey on top."},{"id":"67","start":543.31,"end":547.03,"displayStart":543.31,"displayEnd":547.03,"displayMid":545.17,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.891009,"pitch":19.163626,"speechRate":4.57,"hasEvents":false,"sentence_source":"因为他看到远处的那个出租车开过来了。","sentence_en":"Because she saw a taxi approaching from afar."},{"id":"68","start":547.03,"end":562.81,"displayStart":547.03,"displayEnd":562.81,"displayMid":554.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":1.067195,"pitch":27.006632,"speechRate":4.932,"hasEvents":false,"sentence_source":"然后那个时候我完全是通过儿素勒的目光，透过那个窗户，望向了房子外边车道上面开过来的那辆出租车，所有的画面英国乡村房子外面的气息，我当时幻想的也许是傍晚十分的阳光。","sentence_en":"At that time, I was completely looking through the eyes of Ersu Le, through that window, toward the taxi driving up the lane outside the house. All those images of the English countryside, the atmosphere outside the house—I imagined it was perhaps the light of early evening."},{"id":"69","start":562.81,"end":571.09,"displayStart":562.81,"displayEnd":571.09,"displayMid":566.95,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.4,"loudness":0.931926,"pitch":25.31859,"speechRate":5.072,"hasEvents":false,"sentence_source":"所有的画面在我脑海当中，我很好奇你在写的时候，脑海当中是不是跟我一样有这样的画面，这个问题。","sentence_en":"All those images came to mind. I'm curious — when you wrote it, did you have the same visuals in your head?"},{"id":"70","start":571.09,"end":571.93,"displayStart":571.09,"displayEnd":571.93,"displayMid":571.51,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Strongly Positive","score":0.8,"loudness":0.886058,"pitch":24.212992,"speechRate":5.952,"hasEvents":false,"sentence_source":"问得太好了。","sentence_en":"Great question."},{"id":"71","start":571.93,"end":576.39,"displayStart":571.93,"displayEnd":576.39,"displayMid":574.16,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.795695,"pitch":17.903816,"speechRate":3.587,"hasEvents":false,"sentence_source":"因为我的画面感很差的，现在好一些了。","sentence_en":"I used to be bad at visualizing things. I'm a bit better now."},{"id":"72","start":576.39,"end":583.39,"displayStart":576.39,"displayEnd":583.39,"displayMid":579.89,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.794661,"pitch":21.098549,"speechRate":5.918,"hasEvents":false,"sentence_source":"因为我小时候画画是很差，就是我看不见东西，我的朋友和我老公都说我看不见东西，看见就忘。","sentence_en":"When I was little, I was terrible at drawing—I couldn't see things clearly. My friends and husband say I don't notice things; I see them and forget."},{"id":"73","start":583.39,"end":590.77,"displayStart":583.39,"displayEnd":590.77,"displayMid":587.0799999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.96928,"pitch":18.352461,"speechRate":4.472,"hasEvents":false,"sentence_source":"所以我事实上，我可能写东西的想法更像音乐似的，就是是节奏感，而不是图画感。","sentence_en":"So actually, my writing process feels more like music—it's about rhythm, not imagery."},{"id":"74","start":590.77,"end":595.89,"displayStart":590.77,"displayEnd":595.89,"displayMid":593.3299999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.987993,"pitch":19.770737,"speechRate":3.644,"hasEvents":false,"sentence_source":"但是我觉得有的时候，你虽然看不见东西。","sentence_en":"But sometimes, even if you can't see it visually—"},{"id":"75","start":595.89,"end":602.77,"displayStart":595.89,"displayEnd":602.77,"displayMid":599.3299999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.060535,"pitch":23.053213,"speechRate":5.378,"hasEvents":false,"sentence_source":"但是你用文字是可以把它画出来的，你要让我在头脑里像你那样画出来，我是画不出来的。","sentence_en":"—you can paint it with words. But if you asked me to picture it in my head like you do, I couldn't."},{"id":"76","start":602.77,"end":606.05,"displayStart":602.77,"displayEnd":606.05,"displayMid":604.41,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.057068,"pitch":21.928492,"speechRate":5.793,"hasEvents":false,"sentence_source":"因为我可能就会注意到还是文字还是节奏感。","sentence_en":"I'd probably just focus on the words and the rhythm."},{"id":"77","start":606.05,"end":609.11,"displayStart":606.05,"displayEnd":609.11,"displayMid":607.5799999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.873407,"pitch":22.219637,"speechRate":6.679,"hasEvents":false,"sentence_source":"但是我觉得因为我也写东西写了好多年了。","sentence_en":"But I've been writing for many years now."},{"id":"78","start":609.11,"end":618.91,"displayStart":609.11,"displayEnd":618.91,"displayMid":614.01,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.941603,"pitch":19.398834,"speechRate":6.327,"hasEvents":true,"sentence_source":"所以我就知道大概应该怎么写，就像你说的是detail，就是细节的东西我们都说God is in details，你看这个上帝就是在细节中。","sentence_en":"So I have a sense of how to write. You mentioned details—we say God is in the details."},{"id":"79","start":619.43,"end":632.21,"displayStart":619.43,"displayEnd":632.21,"displayMid":625.8199999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.973862,"pitch":20.875563,"speechRate":5.164,"hasEvents":true,"sentence_source":"所以事实上我觉得我写东西有时候就在想，当时那个Earthla在那是哪个细节最重要，是因为他在准备吃的时候，他是在想象他自己是个画家，他在画画。","sentence_en":"So when I write, I think about which detail matters most. At that moment, Earthla, while preparing food, imagined herself as a painter painting."},{"id":"80","start":632.21,"end":633.65,"displayStart":632.21,"displayEnd":633.65,"displayMid":632.9300000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.843367,"pitch":11.491571,"speechRate":6.25,"hasEvents":false,"sentence_source":"所以那个细节最重要。","sentence_en":"That detail was the most important."},{"id":"81","start":633.65,"end":637.13,"displayStart":633.65,"displayEnd":637.13,"displayMid":635.39,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.580452,"pitch":11.60008,"speechRate":4.31,"hasEvents":false,"sentence_source":"所以我就从那儿那么写的吧有一个。","sentence_en":"So I wrote from that angle."},{"id":"82","start":637.13,"end":651.91,"displayStart":637.13,"displayEnd":651.91,"displayMid":644.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.6,"loudness":1.053418,"pitch":25.025173,"speechRate":4.939,"hasEvents":false,"sentence_source":"细节我印象是特别深刻，你在描述就是Lillian租的，尔斯拉他们那个房子里面有一些摆设，有一些非常具体的细微的，我明白属于英国相间那些小房子里面固有的摆设。","sentence_en":"I remember the details very vividly. You described the decorations in the house that Lillian rented, Ersula's house, some very specific, subtle things that I understand are inherent in those small English country houses."},{"id":"83","start":651.91,"end":664.19,"displayStart":651.91,"displayEnd":664.19,"displayMid":658.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.5,"loudness":1.014624,"pitch":24.563017,"speechRate":6.076,"hasEvents":false,"sentence_source":"我当时在想这些摆设是你曾经去过英国乡村的某一个小房子，看到过你记下来了，或者你以什么样的方式，就能够想到我要在我的主人公的房间里面，有那样的一个小小的装饰。","sentence_en":"I was wondering: did you see those decorations in a little English countryside house and jot them down? Or how did you come up with having such a small ornament in your protagonist's room?"},{"id":"84","start":664.19,"end":666.89,"displayStart":664.19,"displayEnd":666.89,"displayMid":665.54,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.990444,"pitch":23.223845,"speechRate":4.803,"hasEvents":false,"sentence_source":"这些细节其实都是以前经。","sentence_en":"These details are actually from past experiences."},{"id":"85","start":666.89,"end":668.71,"displayStart":666.89,"displayEnd":668.71,"displayMid":667.8,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.024092,"pitch":17.438314,"speechRate":4.945,"hasEvents":false,"sentence_source":"过的事情，就记下来了。","sentence_en":"Things I've seen and remembered."},{"id":"86","start":668.71,"end":672.41,"displayStart":668.71,"displayEnd":672.41,"displayMid":670.56,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.639727,"pitch":21.237921,"speechRate":4.878,"hasEvents":false,"sentence_source":"因为我们经常出门，有的时候就住在乡间。","sentence_en":"Because we travel often, sometimes staying in the countryside."},{"id":"87","start":672.41,"end":684.81,"displayStart":672.41,"displayEnd":684.81,"displayMid":678.6099999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.990936,"pitch":23.552263,"speechRate":5.499,"hasEvents":false,"sentence_source":"因为就住在乡间那些房子，都是不像旅馆，不像大饭店，都是同样的摆设，同样的这个Personal Inpersonal 就是不是很个人化，这些乡间的房子。","sentence_en":"Those countryside houses aren't like hotels or big inns—they have the same furnishings, a kind of impersonal personal feel."},{"id":"88","start":684.81,"end":687.79,"displayStart":684.81,"displayEnd":687.79,"displayMid":686.3,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.805321,"pitch":25.26186,"speechRate":6.367,"hasEvents":false,"sentence_source":"就是一些人一辈子用的东西就放在那儿。","sentence_en":"Things that someone used their whole life are just left there."},{"id":"89","start":687.79,"end":703.07,"displayStart":687.79,"displayEnd":703.07,"displayMid":695.4300000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.875742,"pitch":20.804426,"speechRate":5.035,"hasEvents":false,"sentence_source":"所以我还是挺喜欢看那些东西，有的时候会照张照片什么的，现在很方便了，以前没有手机的时候，有的时候就靠脑子记下来，现在就是照照照片或者想一想，什么时候能够用到这些东西。","sentence_en":"I like looking at those things. Sometimes I take photos—it's easy now. Before smartphones, I'd just memorize them. Now I snap pictures and think about when I might use them."},{"id":"90","start":703.07,"end":706.65,"displayStart":703.07,"displayEnd":706.65,"displayMid":704.86,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.040033,"pitch":25.410622,"speechRate":5.255,"hasEvents":false,"sentence_source":"其实我觉得写作就好像，你收集了很多信息。","sentence_en":"Writing is like collecting a lot of information."},{"id":"91","start":706.65,"end":710.07,"displayStart":706.65,"displayEnd":710.07,"displayMid":708.36,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.876226,"pitch":17.642899,"speechRate":4.418,"hasEvents":false,"sentence_source":"其实用到的不到10%或者更少一些。","sentence_en":"You end up using less than 10% of it."},{"id":"92","start":710.07,"end":717.05,"displayStart":710.07,"displayEnd":717.05,"displayMid":713.56,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.5,"loudness":0.883109,"pitch":19.523722,"speechRate":4.871,"hasEvents":false,"sentence_source":"但是总是要收集data，就是我喜欢看东西，喜欢到处走，我记得好多年之前 我去。","sentence_en":"But you always need to collect data. I love observing things and walking around. I remember years ago, I went—"},{"id":"93","start":717.05,"end":718.85,"displayStart":717.05,"displayEnd":718.85,"displayMid":717.95,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.921593,"pitch":18.399845,"speechRate":6.111,"hasEvents":false,"sentence_source":"那时候我们回北京的时候。","sentence_en":"—when we returned to Beijing."},{"id":"94","start":718.85,"end":724.37,"displayStart":718.85,"displayEnd":724.37,"displayMid":721.61,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.846916,"pitch":18.530012,"speechRate":4.71,"hasEvents":false,"sentence_source":"我们也租的是这种Airbnb，就是在北京城里的一个民居。","sentence_en":"We rented an Airbnb, a residential house in Beijing."},{"id":"95","start":724.37,"end":740.15,"displayStart":724.37,"displayEnd":740.15,"displayMid":732.26,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.7,"loudness":0.925072,"pitch":22.119228,"speechRate":4.436,"hasEvents":false,"sentence_source":"其实就像我们小时候长大那种单元房，特别有意思，里面有一个茶杯 是那个当年香港1979年，1980年那个麦式咖啡，滴滴香浓，是那么一个特别漂亮的茶盘和杯子。","sentence_en":"Actually, it's like the apartment buildings we grew up in, very interesting. There was a teacup from that time, Hong Kong 1979, 1980, the Maxwell coffee, 'drops of fragrance,' a beautiful tea tray and cup."},{"id":"96","start":740.15,"end":751.83,"displayStart":740.15,"displayEnd":751.83,"displayMid":745.99,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.6,"loudness":0.98959,"pitch":26.608255,"speechRate":5.8,"hasEvents":false,"sentence_source":"那个你要是在美国就知道，卖式咖啡是没有人喝的，我就把那个杯子给照了一张相，带回来我们在美国的朋友就觉得特别稀罕，会有这么漂亮的卖式咖啡的杯子。","sentence_en":"You'd know if you're in the US—nobody drinks Maxwell House coffee. I took a photo of the cup and brought it back. Our friends in the US found it rare to see such a beautiful Maxwell House cup."},{"id":"97","start":751.83,"end":763.55,"displayStart":751.83,"displayEnd":763.55,"displayMid":757.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.5,"loudness":0.853811,"pitch":26.065144,"speechRate":5.604,"hasEvents":false,"sentence_source":"所以其实就是生活中东西很多，你就看有的时候就会有突然觉得，这个东西很有意思，将来可能会用得到，或者是这个东西很有意思，我要给我的朋友看一眼。","sentence_en":"So there's so much in life. Sometimes you suddenly feel something is interesting and might be useful later, or you want to show it to a friend."},{"id":"98","start":763.55,"end":769.23,"displayStart":763.55,"displayEnd":769.23,"displayMid":766.39,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.823776,"pitch":26.153706,"speechRate":5.655,"hasEvents":false,"sentence_source":"生活中的这种细节像你说的真的是无穷无尽的吧，反正我觉得就是看呗。","sentence_en":"These details in life are endless, as you said. I think you just keep observing."},{"id":"99","start":769.23,"end":782.37,"displayStart":769.23,"displayEnd":782.37,"displayMid":775.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.7,"loudness":1.074372,"pitch":25.962416,"speechRate":5.705,"hasEvents":false,"sentence_source":"刚才那个细节瞬间就把我拉回到了当年，我的确跟易云我们俩是同一个年代的，易云比我稍微小一点，他刚才说那个Maxwell麦士咖啡是我们同年的一个记忆。","sentence_en":"That detail just pulled me back in time. I'm indeed from the same generation as Yiyun—she's a bit younger. She mentioned Maxwell House coffee, a shared memory from our era."},{"id":"100","start":782.37,"end":787.89,"displayStart":782.37,"displayEnd":787.89,"displayMid":785.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.098726,"pitch":25.628569,"speechRate":5.754,"hasEvents":false,"sentence_source":"同一时代的人的确会有相同的，很多属于大众流行文化的一些参照物。","sentence_en":"People from the same era share many pop culture references."},{"id":"101","start":787.89,"end":791.27,"displayStart":787.89,"displayEnd":791.27,"displayMid":789.5799999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.018917,"pitch":21.896214,"speechRate":8.876,"hasEvents":false,"sentence_source":"我们会使用相同的Culture Reference，我有一个好奇。","sentence_en":"We use the same cultural references. I'm curious about one thing."},{"id":"102","start":791.27,"end":801.83,"displayStart":791.27,"displayEnd":801.83,"displayMid":796.55,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.5,"loudness":0.981349,"pitch":25.463497,"speechRate":4.924,"hasEvents":false,"sentence_source":"因为我们是同一个年代，就是都是北京的孩子，我在幻想也许我们在同年时候不经意间，曾经在某一个地方有过交集插肩而过。","sentence_en":"Since we're from the same era and both grew up in Beijing, I daydream that maybe our paths crossed somewhere as kids without realizing it."},{"id":"103","start":801.83,"end":805.41,"displayStart":801.83,"displayEnd":805.41,"displayMid":803.62,"speaker":"Lu Yu","speakerColor":"#995A91","clu .5,"loudness":0.895039,"pitch":21.01899,"speechRate":5.498,"hasEvents":false,"sentence_source":"其实就是在想当年的生活是怎么样的，就像你说 只有我们生活的那个年代的人，才知道卖是咖啡 滴滴香浓 一油为金是什么意思。","sentence_en":"is really about reflecting on what life was like back then. Like you said, only people from our era know what 'Maxwell House, drop by drop, rich and aromatic, a drop as precious as gold' means."},{"id":"119","start":908.73,"end":915.65,"displayStart":908.73,"displayEnd":915.65,"displayMid":912.19,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.733545,"pitch":15.217482,"speechRate":4.046,"hasEvents":false,"sentence_source":"但是写东西的时候就是要把它给别的人表现出来，或者表达出来我。","sentence_en":"But when writing, you have to present it to others and express it."},{"id":"120","start":915.65,"end":926.23,"displayStart":915.65,"displayEnd":926.23,"displayMid":920.94,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":1.08872,"pitch":25.325363,"speechRate":5.86,"hasEvents":false,"sentence_source":"记得有一次看你一个采访还是一个节目，你当时说了一个细节我也特别感同身受，你说因为我们那个年代能够获得的阅读的材料获得的书籍相对少。","sentence_en":"I remember once watching an interview or show with you, and you mentioned a detail I really related to. You said that because in our era, the reading materials and books available were relatively scarce,"},{"id":"121","start":926.23,"end":928.99,"displayStart":926.23,"displayEnd":928.99,"displayMid":927.61,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.02988,"pitch":26.534542,"speechRate":6.439,"hasEvents":false,"sentence_source":"所以我们格外真是手边能够找到的文字。","sentence_en":"we especially cherished whatever text we could find at hand."},{"id":"122","start":928.99,"end":936.77,"displayStart":928.99,"displayEnd":936.77,"displayMid":932.88,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.941158,"pitch":25.145966,"speechRate":5.398,"hasEvents":false,"sentence_source":"所以我跟你拥有同样的来自于那个年代的印记，就是当时能够如今刺客的阅读身边找到所有的文字。","sentence_en":"So I share the same mark from that era with you—that is, we would avidly read all the text we could find around us."},{"id":"123","start":936.77,"end":944.27,"displayStart":936.77,"displayEnd":944.27,"displayMid":940.52,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":1.076908,"pitch":28.092947,"speechRate":5.16,"hasEvents":false,"sentence_source":"然后到现在我从那个年代带来的一个习惯，就是我非常爱习书 爱习纸张 爱习所有的文句。","sentence_en":"And to this day, a habit I brought from that era is that I love books, love paper, love all words and sentences."},{"id":"124","start":944.27,"end":949.83,"displayStart":944.27,"displayEnd":949.83,"displayMid":947.05,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Strongly Positive","score":0.9,"loudness":1.016961,"pitch":25.672604,"speechRate":5.822,"hasEvents":true,"sentence_source":"然后到今天依然有拿到一本好书内心会很激动，兴奋舍不得看的那种感觉。","sentence_en":"And even now, I still get that feeling of excitement and reluctance to start reading when I get a good book."},{"id":"125","start":949.83,"end":953.39,"displayStart":949.83,"displayEnd":953.39,"displayMid":951.61,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.046812,"pitch":26.091766,"speechRate":5.055,"hasEvents":true,"sentence_source":"是这样子的 我记得小的时候家里买鱼。","sentence_en":"That's right. I remember when I was little, my family bought fish."},{"id":"126","start":953.39,"end":957.53,"displayStart":953.39,"displayEnd":957.53,"displayMid":955.46,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.068824,"pitch":24.925989,"speechRate":6.039,"hasEvents":false,"sentence_source":"那鱼外面包的报纸我都要拿出来，把那报纸先看一遍再扔掉。","sentence_en":"I would take out the newspaper wrapping the fish and read it before throwing it away."},{"id":"127","start":957.53,"end":959.59,"displayStart":957.53,"displayEnd":959.59,"displayMid":958.56,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.89656,"pitch":20.947878,"speechRate":4.878,"hasEvents":false,"sentence_source":"那时候书是很少的。","sentence_en":"Books were scarce back then."},{"id":"128","start":959.59,"end":962.29,"displayStart":959.59,"displayEnd":962.29,"displayMid":960.94,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.849462,"pitch":21.082018,"speechRate":4.444,"hasEvents":false,"sentence_source":"我们小时候住在单元房里头。","sentence_en":"When we were kids, we lived in apartment units."},{"id":"129","start":962.29,"end":967.71,"displayStart":962.29,"displayEnd":967.71,"displayMid":965,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.972579,"pitch":21.281315,"speechRate":5.629,"hasEvents":false,"sentence_source":"那时候没有每一家有信箱，信箱都是在一起，就是一个单元的信都放在那。","sentence_en":"Back then, not every household had its own mailbox; mailboxes were shared, so all the mail for the unit was placed there."},{"id":"130","start":967.71,"end":974.03,"displayStart":967.71,"displayEnd":974.03,"displayMid":970.87,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.949248,"pitch":19.091587,"speechRate":5.978,"hasEvents":false,"sentence_source":"因为我们家就住在一楼，我就守着那信箱，刘迪元送来了我先把里头的报纸先看一遍。","sentence_en":"Since we lived on the first floor, I would guard the mailbox. When the mailman delivered, I would first read the newspapers inside."},{"id":"131","start":974.03,"end":978.53,"displayStart":974.03,"displayEnd":978.53,"displayMid":976.28,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.851979,"pitch":24.197229,"speechRate":6.889,"hasEvents":false,"sentence_source":"然后把人家的这个明清片也看看都是从哪儿寄来的，信都是从哪儿寄来。","sentence_en":"And I would also look at other people's postcards and letters to see where they were sent from."},{"id":"132","start":978.53,"end":980.25,"displayStart":978.53,"displayEnd":980.25,"displayMid":979.39,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":1,"clusterLabel":"C1","clusterName":"Bilingual Writing and Language Expression","sentiment_en":"Neutral","score":0,"loudness":0.801521,"pitch":26.803818,"speechRate":5.233,"hasEvents":false,"sentence_source":"因为能看见的字很少。","sentence_en":"Because there was so little text to see."},{"id":"133","start":980.25,"end":990.21,"displayStart":980.25,"displayEnd":990.21,"displayMid":985.23,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.821141,"pitch":22.791107,"speechRate":5.046,"hasEvents":false,"sentence_source":"我觉得是一种饥饿感，可能现在的小孩子们，现在的年轻人也不理解了，是一种就是想得到更多的信息，就更多的细节吧。","sentence_en":"I think it was a kind of hunger. Maybe kids today, young people now, wouldn't understand. It was a desire to get more information, more details."},{"id":"134","start":990.21,"end":992.75,"displayStart":990.21,"displayEnd":992.75,"displayMid":991.48,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.3,"loudness":0.875639,"pitch":24.253597,"speechRate":6.823,"hasEvents":false,"sentence_source":"我觉得因为生活很狭隘，很狭窄那时候。","sentence_en":"I think because life was very narrow and confined back then."},{"id":"135","start":992.75,"end":994.33,"displayStart":992.75,"displayEnd":994.33,"displayMid":993.54,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.544076,"pitch":20.654165,"speechRate":4.43,"hasEvents":true,"sentence_source":"那年代也比较凶。","sentence_en":"That era was also tough."},{"id":"136","start":994.97,"end":1006.07,"displayStart":994.97,"displayEnd":1006.07,"displayMid":1000.52,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.879834,"pitch":22.765829,"speechRate":5.315,"hasEvents":true,"sentence_source":"所以我是跟你有这样同样的感觉，就是只要是书都要看一看，而且印出来的字总是很重要，学校主要要留下来看一下子，我记得我上初一的时候。","sentence_en":"So I feel the same way as you: I had to look at any book, and printed words always seemed important. At school, I would keep them to read for a while. I remember when I was in seventh grade,"},{"id":"137","start":1006.07,"end":1010.11,"displayStart":1006.07,"displayEnd":1010.11,"displayMid":1008.09,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.822973,"pitch":14.26664,"speechRate":4.95,"hasEvents":false,"sentence_source":"那时候第一次看见了图书馆，小时候没有图书馆。","sentence_en":"that was the first time I saw a library. I didn't have libraries when I was little."},{"id":"138","start":1010.11,"end":1024.85,"displayStart":1010.11,"displayEnd":1024.85,"displayMid":1017.48,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.95212,"pitch":20.341873,"speechRate":4.897,"hasEvents":false,"sentence_source":"然后学校就有图书馆，有那个越南市，就订了很多这种文学杂志，我印象特别深，我第一次看见那些，就是民国时代的诗人，就是在那些杂志上看见的，觉得哎呀，好像就是很惊讶。","sentence_en":"Then the school had a library, and there was a reading room that subscribed to many literary magazines. I remember vividly, that was the first time I saw poets from the Republican era, in those magazines. I was so amazed."},{"id":"139","start":1024.85,"end":1028.21,"displayStart":1024.85,"displayEnd":1028.21,"displayMid":1026.53,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.059351,"pitch":22.808239,"speechRate":6.116,"hasEvents":false,"sentence_source":"觉得还会有这样的人，写这样的诗，都是很奇怪的。","sentence_en":"I thought, there are people like that writing such poems? It was all very strange."},{"id":"140","start":1028.21,"end":1032.67,"displayStart":1028.21,"displayEnd":1032.67,"displayMid":1030.44,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.043323,"pitch":27.565874,"speechRate":5.276,"hasEvents":false,"sentence_source":"所以那时候小的时候是很，是有种那种阅读饥饿感吧。","sentence_en":"So when I was a kid, there was that kind of reading hunger."},{"id":"141","start":1032.67,"end":1041.03,"displayStart":1032.67,"displayEnd":1041.03,"displayMid":1036.85,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.908205,"pitch":18.212,"speechRate":5.981,"hasEvents":false,"sentence_source":"我觉得就是特别的hungry for anything，就是想看 就是想知道，小的时候的这个头脑也就像海绵似的。","sentence_en":"I think I was just particularly hungry for anything, wanting to see and know everything. When I was little, my mind was like a sponge."},{"id":"142","start":1041.03,"end":1048.25,"displayStart":1041.03,"displayEnd":1048.25,"displayMid":1044.6399999999999,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.017514,"pitch":26.348837,"speechRate":5.801,"hasEvents":false,"sentence_source":"看了什么东西都记下来，在我成长的过程当中，初中开始当时那些蒙龙师，蒙龙师人是非常流行的。","sentence_en":"I'd remember everything I saw. As I grew up, starting in middle school, those Misty Poets were very popular."},{"id":"143","start":1048.25,"end":1051.15,"displayStart":1048.25,"displayEnd":1051.15,"displayMid":1049.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.092004,"pitch":24.17972,"speechRate":5.926,"hasEvents":false,"sentence_source":"我们每个小孩也都会非常捉烈的模仿。","sentence_en":"Every kid would imitate them very intensely."},{"id":"144","start":1051.15,"end":1058.05,"displayStart":1051.15,"displayEnd":1058.05,"displayMid":1054.6,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.890462,"pitch":19.906225,"speechRate":4.928,"hasEvents":false,"sentence_source":"那些师人去写我们想象当中所谓的蒙龙师，你经历过那样一个过程吗，经历过 虽然。","sentence_en":"Those poets wrote what we imagined as 'Misty' poetry. Did you go through that process? I did, actually."},{"id":"145","start":1058.05,"end":1063.15,"displayStart":1058.05,"displayEnd":1063.15,"displayMid":1060.6,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.758852,"pitch":18.746822,"speechRate":5.347,"hasEvents":false,"sentence_source":"因为我从来也没有想当作家，都是学理科 但是也写东西 我印象中。","sentence_en":"Because I never wanted to be a writer; I studied science. But I did write things, as I recall."},{"id":"146","start":1063.15,"end":1065.01,"displayStart":1063.15,"displayEnd":1065.01,"displayMid":1064.08,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.8586,"pitch":25.685926,"speechRate":7.283,"hasEvents":false,"sentence_source":"那会儿我可能正好比你小两岁。","sentence_en":"At that time, I was probably two years younger than you."},{"id":"147","start":1065.01,"end":1069.77,"displayStart":1065.01,"displayEnd":1069.77,"displayMid":1067.3899999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.710557,"pitch":18.327858,"speechRate":4.58,"hasEvents":false,"sentence_source":"所以我是上高一的时候 就开始看龙龙龙是写东西。","sentence_en":"So when I was a high school freshman, I started reading and writing hazy poetry."},{"id":"148","start":1069.77,"end":1082.05,"displayStart":1069.77,"displayEnd":1082.05,"displayMid":1075.9099999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.934317,"pitch":27.558529,"speechRate":4.215,"hasEvents":false,"sentence_source":"那时候我们有一个高中同学就给我起了个外号叫李蒙龙，现在想 这个外号实在是太糟糕了，他真的是小男孩 都是很讨气的。","sentence_en":"At that time, a high school classmate gave me the nickname Li Menglong. Now I think it's a terrible nickname. He was really a naughty little boy."},{"id":"149","start":1082.05,"end":1090.21,"displayStart":1082.05,"displayEnd":1090.21,"displayMid":1086.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.993134,"pitch":26.603556,"speechRate":4.657,"hasEvents":false,"sentence_source":"女孩子她就说这个叫李蒙龙那个叫藏浪漫 对，这个蒙龙那个浪漫所以那时候都会写一些的。","sentence_en":"The girls would say things like 'this one is Li Menglong, that one is Zang Langman.' Yes, one was Meng Long, the other was Langman. So we all wrote some stuff back then."},{"id":"150","start":1090.21,"end":1099.19,"displayStart":1090.21,"displayEnd":1099.19,"displayMid":1094.7,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.907697,"pitch":22.378685,"speechRate":5.234,"hasEvents":false,"sentence_source":"我觉得作家都是要先读这种特别强的模仿的，这个心理慢慢的才能写出来的，这不是我说的 这是美国一个作家说。","sentence_en":"I think writers all start with a strong period of imitative reading, and gradually develop the psychology to write. That's not my idea; an American writer said it."},{"id":"151","start":1099.19,"end":1105.01,"displayStart":1099.19,"displayEnd":1105.01,"displayMid":1102.1,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.849825,"pitch":18.801649,"speechRate":6.873,"hasEvents":false,"sentence_source":"Writers are readers move to emulation 就是你一举一读者。","sentence_en":"Writers are readers moved to emulation. It means you start as a reader first."},{"id":"152","start":1105.01,"end":1107.97,"displayStart":1105.01,"displayEnd":1107.97,"displayMid":1106.49,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.920268,"pitch":19.805105,"speechRate":5.068,"hasEvents":false,"sentence_source":"然后你被感动到一定要模仿的时候。","sentence_en":"Then, when you're so moved that you have to imitate,"},{"id":"153","start":1107.97,"end":1109.65,"displayStart":1107.97,"displayEnd":1109.65,"displayMid":1108.81,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.55566,"pitch":15.781911,"speechRate":6.25,"hasEvents":false,"sentence_source":"那时候就变成了作家了。","sentence_en":"that's when you become a writer."},{"id":"154","start":1110.29,"end":1115.31,"displayStart":1110.29,"displayEnd":1115.31,"displayMid":1112.8,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.053495,"pitch":26.354128,"speechRate":6.479,"hasEvents":false,"sentence_source":"所以你在成长过程当中有一个漫长的做reader做读者的一个过程。","sentence_en":"So in the process of growing up, there is a long phase of being a reader."},{"id":"155","start":1115.31,"end":1122.73,"displayStart":1115.31,"displayEnd":1122.73,"displayMid":1119.02,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.032036,"pitch":21.731054,"speechRate":6.953,"hasEvents":true,"sentence_source":"然后慢慢慢慢要到一个阶段才能够积累出，你成为你必须要去表达 必须要自己创作，只是成长过程当中还没有到那个时候。","sentence_en":"Then gradually you reach a stage where you've accumulated enough that you must express yourself, must create on your own. But in the growth process, you haven't reached that point yet."},{"id":"156","start":1122.73,"end":1125.95,"displayStart":1122.73,"displayEnd":1125.95,"displayMid":1124.3400000000001,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.15712,"pitch":25.177494,"speechRate":5.405,"hasEvents":true,"sentence_source":"没有 我小的时候虽然作文写挺好的。","sentence_en":"No, when I was little, although I wrote good essays,"},{"id":"157","start":1125.95,"end":1140.87,"displayStart":1125.95,"displayEnd":1140.87,"displayMid":1133.4099999999999,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.884302,"pitch":23.518614,"speechRate":5.295,"hasEvents":false,"sentence_source":"但是我就没有那种表达欲望 也没有想写东西的欲望，主要是看书 我从初一开始看《红浪梦》，《红浪梦》我现在还看，我说我最亏黄的时候上大学的时候，红红梦一半都能备下来了 现在可能也都忘了。","sentence_en":"I just didn't have that urge to express or to write. I mainly read books. I started reading 'Dream of the Red Chamber' in seventh grade, and I still read it now. I'd say the craziest time was in college; I could recite half of it by heart. Now I've probably forgotten it all."},{"id":"158","start":1140.87,"end":1148.17,"displayStart":1140.87,"displayEnd":1148.17,"displayMid":1144.52,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.914574,"pitch":24.766195,"speechRate":5.095,"hasEvents":false,"sentence_source":"但是当年红红梦真的是反复的看，一年看上二三十遍 就是不停地看就能够备下来了。","sentence_en":"But back then I really read 'Dream of the Red Chamber' over and over, twenty or thirty times a year. By reading constantly, I could memorize it."},{"id":"159","start":1148.17,"end":1153.65,"displayStart":1148.17,"displayEnd":1153.65,"displayMid":1150.91,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.8519,"pitch":14.469791,"speechRate":5.209,"hasEvents":false,"sentence_source":"所以我在25岁之前的经历 其实是读者的经历，从来没想过写东西。","sentence_en":"So my experience before age 25 was really that of a reader; I never thought about writing."},{"id":"160","start":1154.53,"end":1159.59,"displayStart":1154.53,"displayEnd":1159.59,"displayMid":1157.06,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.206672,"pitch":27.617914,"speechRate":6.363,"hasEvents":true,"sentence_source":"所以我就会觉得每个人成长的过程当中，可能他找的那个路径是不同的。","sentence_en":"So I feel that in everyone's growth process, the path they take may be different."},{"id":"161","start":1159.59,"end":1165.91,"displayStart":1159.59,"displayEnd":1165.91,"displayMid":1162.75,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.076362,"pitch":23.499285,"speechRate":5.158,"hasEvents":false,"sentence_source":"但是有些又是相似的，你说你在101 其实我高考的考场就是101是吗。","sentence_en":"But some things are similar. You mentioned you were at 101? Actually, my college entrance exam site was also at 101, right?"},{"id":"162","start":1166.35,"end":1168.59,"displayStart":1166.35,"displayEnd":1168.59,"displayMid":1167.4699999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.040984,"pitch":22.289579,"speechRate":6.912,"hasEvents":false,"sentence_source":"那你们是哪个学校去101考试啊?","sentence_en":"Which school were you from that took the exam at 101?"},{"id":"163","start":1168.75,"end":1170.77,"displayStart":1168.75,"displayEnd":1170.77,"displayMid":1169.76,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.18407,"pitch":27.831789,"speechRate":4.687,"hasEvents":false,"sentence_source":"我是清华附中这样子?","sentence_en":"I was from Tsinghua Affiliated High School, something like that."},{"id":"164","start":1170.77,"end":1171.87,"displayStart":1170.77,"displayEnd":1171.87,"displayMid":1171.32,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Positive","score":0.3,"loudness":0.667579,"pitch":23.882544,"speechRate":8.219,"hasEvents":false,"sentence_source":"对，那就是我们的邻居。","sentence_en":"Right, that's our neighbor."},{"id":"165","start":1171.87,"end":1174.73,"displayStart":1171.87,"displayEnd":1174.73,"displayMid":1173.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":1.082869,"pitch":25.485037,"speechRate":5.245,"hasEvents":false,"sentence_source":"对，清华附中随我跑到101去高考。","sentence_en":"Yes, I went from Tsinghua Affiliated High School to 101 for the college entrance exam."},{"id":"166","start":1174.73,"end":1178.03,"displayStart":1174.73,"displayEnd":1178.03,"displayMid":1176.38,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Neutral","score":0,"loudness":0.921188,"pitch":20.236296,"speechRate":5.616,"hasEvents":false,"sentence_source":"所以这是我对于你的那个成长环境的一个。","sentence_en":"So this is about your upbringing."},{"id":"167","start":1178.03,"end":1185.87,"displayStart":1178.03,"displayEnd":1185.87,"displayMid":1181.9499999999998,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Negative","score":-0.4,"loudness":1.01164,"pitch":26.549253,"speechRate":6.25,"hasEvents":false,"sentence_source":"其实没有任何记忆，我是个记忆力非常好的人，但我对于我成长过程当中，我的童年少年的记忆其实相当的模糊为什么?","sentence_en":"Actually, I have no memory of it. I have a great memory, but my memories of my childhood and youth are quite vague. Why?"},{"id":"168","start":1186.29,"end":1193.29,"displayStart":1186.29,"displayEnd":1193.29,"displayMid":1189.79,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Negative","score":-0.5,"loudness":1.081046,"pitch":24.312992,"speechRate":6.03,"hasEvents":false,"sentence_source":"我不知道，还好我不是一个作家，如果我是一个作家，我想回看我的童年少年，我想去写的话，我无法去写。","sentence_en":"I don't know. Good thing I'm not a writer. If I were a writer trying to recall my childhood to write about it, I couldn't."},{"id":"169","start":1193.29,"end":1201.41,"displayStart":1193.29,"displayEnd":1201.41,"displayMid":1197.35,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":5,"clusterLabel":"C5","clusterName":"Childhood Experiences and Growth Memories","sentiment_en":"Negative","score":-0.4,"loudness":0.901278,"pitch":23.350607,"speechRate":5.788,"hasEvents":false,"sentence_source":"因为很多的细节好像已经慢慢的隐去了，这可能就是一个不写日记，没有一些对人生有记录的人的一个问题不要。","sentence_en":"Because many details have gradually faded. That's probably the problem for someone who doesn't keep a diary or record their life. Not to worry."},{"id":"170","start":1201.41,"end":1206.25,"displayStart":1201.41,"displayEnd":1206.25,"displayMid":1203.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.98787,"pitch":23.984064,"speechRate":5.992,"hasEvents":true,"sentence_source":"紧 我的观点是凡是忘记的东西都是不重要的真的，记下来的东西真的。","sentence_en":"My view is: whatever is forgotten is unimportant. What's remembered truly matters."},{"id":"171","start":1207.55,"end":1217.33,"displayStart":1207.55,"displayEnd":1217.33,"displayMid":1212.44,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.896807,"pitch":26.004656,"speechRate":6.442,"hasEvents":true,"sentence_source":"因为我觉得有的时候并不是active的记下来，就像我说就是这储存的可能又有用的时候就掉出来了，掉不出来的东西就是没有用的了对我来说。","sentence_en":"Because sometimes it's not actively remembered. As I said, stored memories might pop up when useful. Those that don't pop up are useless to me."},{"id":"172","start":1217.33,"end":1220.57,"displayStart":1217.33,"displayEnd":1220.57,"displayMid":1218.9499999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.838341,"pitch":24.995398,"speechRate":6.79,"hasEvents":false,"sentence_source":"因为肯定会记了很多忘记巴多东西掉不出来了现在。","sentence_en":"Because surely I've remembered a lot and forgotten even more, and now they don't come back."},{"id":"173","start":1220.57,"end":1222.59,"displayStart":1220.57,"displayEnd":1222.59,"displayMid":1221.58,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.436278,"pitch":14.085651,"speechRate":4.444,"hasEvents":false,"sentence_source":"所以也就不要紧了。","sentence_en":"So it doesn't matter."},{"id":"174","start":1222.59,"end":1229.85,"displayStart":1222.59,"displayEnd":1229.85,"displayMid":1226.2199999999998,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.906778,"pitch":18.996513,"speechRate":6.389,"hasEvents":false,"sentence_source":"那你当年那些你记得日记记得笔记如今还留着吗，没有了 我都没带出来这些东西，我小时候的东西都没带出来。","sentence_en":"Do you still keep the diaries and notes you remember from back then? No, I didn't bring them out. I didn't bring anything from my childhood."},{"id":"175","start":1229.85,"end":1243.75,"displayStart":1229.85,"displayEnd":1243.75,"displayMid":1236.8,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.815209,"pitch":22.01755,"speechRate":5.398,"hasEvents":false,"sentence_source":"我们出国的时候那时候还是，96年出来的时候就带两个箱子，觉得就是离家了就是已经那些东西都没带，我后来也就我的好处是在于不练旧，东西过去了就过去了 我也就没带出来。","sentence_en":"When I went abroad in 1996, I only brought two suitcases. I felt lik
