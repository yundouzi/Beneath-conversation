","score":-0.7,"loudness":0.827746,"pitch":19.876581,"speechRate":5.297,"hasEvents":false,"sentence_source":"然后我的父母分开，这带过很大的压力跟痛苦，类似于这样的一些经历，你跟我有一些相似的东西吗。","sentence_en":"Then my parents separated, which brought a lot of pressure and pain. Experiences like these—do you have anything similar to me?"},{"id":"362","start":2548.59,"end":2551.47,"displayStart":2548.59,"displayEnd":2551.47,"displayMid":2550.0299999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0.1,"loudness":0.940778,"pitch":23.713825,"speechRate":5.21,"hasEvents":false,"sentence_source":"我觉得我当时就看书看了很多。","sentence_en":"I think I read a lot of books back then."},{"id":"363","start":2551.47,"end":2557.21,"displayStart":2551.47,"displayEnd":2557.21,"displayMid":2554.34,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":-0.2,"loudness":0.69805,"pitch":21.171005,"speechRate":5.202,"hasEvents":false,"sentence_source":"觉得在书里看见的东西和世界是不一样的，就那个反差实在是太大了。","sentence_en":"I felt that what I saw in books was different from the real world—the contrast was huge."},{"id":"364","start":2557.21,"end":2561.31,"displayStart":2557.21,"displayEnd":2561.31,"displayMid":2559.26,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.5,"loudness":1.018948,"pitch":26.990082,"speechRate":6.566,"hasEvents":false,"sentence_source":"但是我在书里看见的东西和我想的东西，没有人对那个有兴趣。","sentence_en":"But no one was interested in what I saw in books or what I thought."},{"id":"365","start":2561.31,"end":2564.53,"displayStart":2561.31,"displayEnd":2564.53,"displayMid":2562.92,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":-0.2,"loudness":0.6546,"pitch":16.922512,"speechRate":4.658,"hasEvents":false,"sentence_source":"我觉得大家都想的是很实际的东西。","sentence_en":"I felt everyone only cared about practical things."},{"id":"366","start":2564.53,"end":2571.45,"displayStart":2564.53,"displayEnd":2571.45,"displayMid":2567.99,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.876584,"pitch":21.966606,"speechRate":4.928,"hasEvents":false,"sentence_source":"因为我小时候最大的特点是听话，学习学都特别好，我上初中学习学特别好为什么?","sentence_en":"Because my biggest trait as a child was being obedient and doing well in school. Why did I do so well in middle school?"},{"id":"367","start":2571.77,"end":2582.49,"displayStart":2571.77,"displayEnd":2582.49,"displayMid":2577.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.883285,"pitch":22.754166,"speechRate":6.564,"hasEvents":false,"sentence_source":"今天如果学习学都特别好，别人就不会来关注我想的是什么，就不会给我来 interfere with my thinking，我小时候做数学体在奥校也都做特好。","sentence_en":"If I did exceptionally well in school, others wouldn't pay attention to what I was thinking, wouldn't interfere with my thinking. I did math problems in the Olympiad school really well too."},{"id":"368","start":2582.49,"end":2586.97,"displayStart":2582.49,"displayEnd":2586.97,"displayMid":2584.7299999999996,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0.1,"loudness":0.886191,"pitch":26.446917,"speechRate":6.596,"hasEvents":false,"sentence_source":"但是我做数学的时候，我抽屉里就放一会儿诗集，我就自己在那看诗。","sentence_en":"But when I did math, I would put a poetry collection in my drawer and read poems on my own."},{"id":"369","start":2586.97,"end":2602.95,"displayStart":2586.97,"displayEnd":2602.95,"displayMid":2594.96,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.897255,"pitch":21.965731,"speechRate":5.006,"hasEvents":false,"sentence_source":"然后等大人来了，我就把这抽屉一关上，就在做数学 就是那样子，我可能我觉得 就那种状态十二三岁十四五岁，你看到的世界和你想到的东西是别人不关心的，也别人都觉得这都是没有用的东西。","sentence_en":"Then when the adults came, I would close the drawer and pretend to do math. That was it. I think that state, at twelve or thirteen, fourteen or fifteen, the world you see and the things you think about are things others don't care about, and they all think these are useless."},{"id":"370","start":2602.95,"end":2604.81,"displayStart":2602.95,"displayEnd":2604.81,"displayMid":2603.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":-0.2,"loudness":0.767701,"pitch":18.703903,"speechRate":5.376,"hasEvents":false,"sentence_source":"就那个反差还是挺大的。","sentence_en":"The contrast was quite big."},{"id":"371","start":2604.81,"end":2611.23,"displayStart":2604.81,"displayEnd":2611.23,"displayMid":2608.02,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":-0.2,"loudness":0.727282,"pitch":19.695618,"speechRate":9.165,"hasEvents":false,"sentence_source":"那个印象我是印象很深，就是说 What I cared about was not what the world cared about。","sentence_en":"That impression is very deep—what I cared about was not what the world cared about."},{"id":"372","start":2611.23,"end":2620.31,"displayStart":2611.23,"displayEnd":2620.31,"displayMid":2615.77,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.858284,"pitch":16.200928,"speechRate":5.841,"hasEvents":false,"sentence_source": .4,"loudness":1.01992,"pitch":26.415451,"speechRate":6.317,"hasEvents":false,"sentence_source":"那那个时候那个年纪的小孩很容易，比如说在学校跟老师跟同学或者回家跟家长，发生某种冲突会觉得不被理解。","sentence_en":"At that age, kids easily feel misunderstood when they have conflicts, like at school with teachers or classmates, or at home with parents."},{"id":"381","start":2668.09,"end":2683.99,"displayStart":2668.09,"displayEnd":2683.99,"displayMid":2676.04,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.855683,"pitch":24.244991,"speechRate":5.031,"hasEvents":false,"sentence_source":"然后内心会有某种的苦闷，像我的话我会觉得好像我回想我那个时候的自己，我那些其实是有很多的困惑和有很多的苦闷的，但好像我并没有找一个渠道，我要把那些苦闷和我的困惑表达出来。","sentence_en":"And inside, there is some kind of anguish. For me, I feel like when I look back at myself at that time, I actually had a lot of confusion and a lot of anguish, but it seems I didn't find a channel to express that anguish and confusion."},{"id":"382","start":2683.99,"end":2689.47,"displayStart":2683.99,"displayEnd":2689.47,"displayMid":2686.7299999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":-0.2,"loudness":0.883455,"pitch":26.618763,"speechRate":5.976,"hasEvents":false,"sentence_source":"但我现在已经忘了我是如何去化解它，如何去和它共存我现在已经忘了。","sentence_en":"But I've already forgotten how I resolved it, how I coexisted with it. I've forgotten now."},{"id":"383","start":2689.47,"end":2695.49,"displayStart":2689.47,"displayEnd":2695.49,"displayMid":2692.4799999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.878425,"pitch":25.151321,"speechRate":6.751,"hasEvents":false,"sentence_source":"对，所以我好奇是那个时候的你是如何去把当时你的那些，困惑痛苦去化解和它去和解和它共存。","sentence_en":"Right, so I'm curious how you, at that time, managed to resolve those confusions and pains, to reconcile and coexist with them."},{"id":"384","start":2695.49,"end":2702.95,"displayStart":2695.49,"displayEnd":2702.95,"displayMid":2699.22,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.97272,"pitch":26.557104,"speechRate":5.211,"hasEvents":false,"sentence_source":"我觉得可能那时候都没有化解的能力，可能共存是更重要的，我现在想想可能现在的小孩。","sentence_en":"I think maybe I didn't have the ability to resolve back then, coexistence was more important. Thinking now, maybe today's kids..."},{"id":"385","start":2702.95,"end":2709.53,"displayStart":2702.95,"displayEnd":2709.53,"displayMid":2706.24,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.5,"loudness":0.960483,"pitch":21.533373,"speechRate":6.875,"hasEvents":false,"sentence_source":"那个年纪小孩也是很困难的，就是说自己想的事情是没有用的事情，大人让你做的事情是你不喜欢做的事情。","sentence_en":"Kids that age also have a hard time—things they think about seem useless, and adults make them do things they don't like."},{"id":"386","start":2709.53,"end":2710.97,"displayStart":2709.53,"displayEnd":2710.97,"displayMid":2710.25,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.4,"loudness":0.714187,"pitch":23.803061,"speechRate":5.224,"hasEvents":false,"sentence_source":"但是就只好去做。","sentence_en":"But you just have to do it."},{"id":"387","start":2710.97,"end":2714.69,"displayStart":2710.97,"displayEnd":2714.69,"displayMid":2712.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Negative","score":-0.6,"loudness":0.987648,"pitch":24.712498,"speechRate":4.491,"hasEvents":false,"sentence_source":"我觉得可能我十几岁就总是很苦闷。","sentence_en":"I think I was always very depressed as a teenager."},{"id":"388","start":2714.69,"end":2725.47,"displayStart":2714.69,"displayEnd":2725.47,"displayMid":2720.08,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0.1,"loudness":0.918037,"pitch":24.394073,"speechRate":7.276,"hasEvents":false,"sentence_source":"但是有一件事情可能对我是很有帮助，就是那时候我看英语书，我以前特别深，当年看这个Dylan Thomas，我十几岁看Dylan Thomas的这个essay，什么都看不懂。","sentence_en":"But one thing that probably helped me a lot was reading English books. I was especially into it—back then I read Dylan Thomas's essays as a teen, I didn't understand anything."},{"id":"389","start":2725.47,"end":2726.87,"displayStart":2725.47,"displayEnd":2726.87,"displayMid":2726.17,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.4,"loudness":1.229763,"pitch":24.47139,"speechRate":6.114,"hasEvents":false,"sentence_source":"但是看不懂也看。","sentence_en":"But even though I didn't understand, I still read."},{"id":"390","start":2726.87,"end":2732.33,"displayStart":2726.87,"displayEnd":2732.33,"displayMid":2729.6,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.80846,"pitch":22.036583,"speechRate":5.678,"hasEvents":false,"sentence_source":"但是我觉得当时可能就是有那种想法，就是This is my world。","sentence_en":"But I think at that time I had this idea: 'This is my world."},{"id":"391","start":2732.33,"end":2737.15,"displayStart":2732.33,"displayEnd":2737.15,"displayMid":2734.74,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.882655,"pitch":16.012117,"speechRate":12.993,"hasEvents":false,"sentence_source":"I'm going to spend the time with my world，even though I don't understand them.。","sentence_en":"I'm going to spend time with my world, even though I don't understand them."},{"id":"392","start":2738.41,"end":2747.23,"displayStart":2738.41,"displayEnd":2747.23,"displayMid":2742.8199999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.921607,"pitch":20.854517,"speechRate":5.669,"hasEvents":true,"sentence_source":"因为学英语大人总是没有问题的，但是那时候我就坐在那儿看书，可能就像你说虽然很苦闷，但是没有办法解决，就是看书。","sentence_en":"Because adults never had a problem with me learning English, so I'd just sit there reading. Maybe like you said, even though I was depressed and couldn't solve it, I just read."},{"id":"393","start":2747.69,"end":2756.39,"displayStart":2747.69,"displayEnd":2756.39,"displayMid":2752.04,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.823242,"pitch":24.233675,"speechRate":5.632,"hasEvents":true,"sentence_source":"可能其实苦闷就是一个把时间，就是feel in the time，我这个feel in the time就是看书吧。","sentence_en":"Maybe depression is just a way to fill the time. My way to fill the time was reading."},{"id":"394","start":2757.23,"end":2768.41,"displayStart":2757.23,"displayEnd":2768.41,"displayMid":2762.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.056157,"pitch":23.986679,"speechRate":5.853,"hasEvents":true,"sentence_source":"但其实如果是那时候的我，看你的话会觉得哇，可能每个人都这样看别人你为什么要苦闷，你学习很好，你有一个非常完整的一个家庭，好像又是很好的学校。","sentence_en":"But actually, if I were that age and looked at you, I'd think wow, maybe everyone sees others that way—why are you depressed? You study well, have a complete family, seem to be in a good school."},{"id":"395","start":2768.87,"end":2771.75,"displayStart":2768.87,"displayEnd":2771.75,"displayMid":2770.31,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":1.214389,"pitch":26.839518,"speechRate":7.94,"hasEvents":true,"sentence_source":"你会觉得哇，这样的小孩他有什么可以去苦恼的呢?","sentence_en":"You'd think, wow, what does such a kid have to worry about?"},{"id":"396","start":2772.39,"end":2779.73,"displayStart":2772.39,"displayEnd":2779.73,"displayMid":2776.06,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":-0.2,"loudness":0.980304,"pitch":28.057095,"speechRate":3.76,"hasEvents":false,"sentence_source":"我觉得大家都会这么说 但是是这样子 总是人生没有不苦脑的吧。","sentence_en":"I think everyone says that, but it's like this—life always has its troubles."},{"id":"397","start":2779.73,"end":2784.03,"displayStart":2779.73,"displayEnd":2784.03,"displayMid":2781.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.017434,"pitch":22.849876,"speechRate":6.273,"hasEvents":false,"sentence_source":"我觉得如果不苦脑的只有两种可能性 一个是傻瓜 一个是疯子。","sentence_en":"I think the only two possibilities for not having troubles are being a fool or being crazy."},{"id":"398","start":2784.03,"end":2793.29,"displayStart":2784.03,"displayEnd":2793.29,"displayMid":2788.66,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.877587,"pitch":21.168379,"speechRate":4.921,"hasEvents":false,"sentence_source":"那疯子可能也是要苦脑的 所以这些苦脑总是会有的，现在想想是 那会儿我可能别人看我都觉得我学习特好。","sentence_en":"But even a crazy person might have troubles, so troubles always exist. Thinki  Experience","sentiment_en":"Neutral","score":0,"loudness":0.867297,"pitch":23.953127,"speechRate":5,"hasEvents":true,"sentence_source":"有一个问题我想我其实是想问 就是人在经历过碰苦之后。","sentence_en":"There's a question I want to ask: after people experience suffering,"},{"id":"424","start":2934.45,"end":2945.57,"displayStart":2934.45,"displayEnd":2945.57,"displayMid":2940.01,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.941151,"pitch":20.779123,"speechRate":6.338,"hasEvents":false,"sentence_source":"我们是一定是会走出来的 像你说时间是最democratic thing，就时间是特别民主的一个事情，它有两层意思在我看来，第一个时间对每个人它都很公平。","sentence_en":"We will definitely get through it. As you said, time is the most democratic thing. First, it's fair to everyone."},{"id":"425","start":2945.57,"end":2955.23,"displayStart":2945.57,"displayEnd":2955.23,"displayMid":2950.4,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.856202,"pitch":22.243315,"speechRate":5.286,"hasEvents":false,"sentence_source":"我们都有24小时 一年365天，还有一个时间的公平跟民主在于，时间会过去 意味着一切都会过去，好与坏都会过去。","sentence_en":"We all have 24 hours and 365 days. Also, time's fairness means everything passes—both good and bad."},{"id":"426","start":2955.23,"end":2961.99,"displayStart":2955.23,"displayEnd":2961.99,"displayMid":2958.6099999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.934014,"pitch":24.303394,"speechRate":5.56,"hasEvents":false,"sentence_source":"所以当我照这两个时间的要素之后，内心会变得平静下来，你会明白这一切都会过去。","sentence_en":"So when I consider these two elements of time, I feel calm inside, knowing that everything will pass."},{"id":"427","start":2961.99,"end":2965.35,"displayStart":2961.99,"displayEnd":2965.35,"displayMid":2963.67,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.976414,"pitch":28.562698,"speechRate":5.891,"hasEvents":false,"sentence_source":"但是在过去的过程当中，你依然要每天去经历。","sentence_en":"But during that passing, you still have to live through it day by day."},{"id":"428","start":2965.35,"end":2966.85,"displayStart":2965.35,"displayEnd":2966.85,"displayMid":2966.1,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.832722,"pitch":18.01849,"speechRate":4.667,"hasEvents":false,"sentence_source":"那如何去面对它。","sentence_en":"So how to face it?"},{"id":"429","start":2966.85,"end":2969.01,"displayStart":2966.85,"displayEnd":2969.01,"displayMid":2967.9300000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.696765,"pitch":20.059359,"speechRate":2.315,"hasEvents":false,"sentence_source":"对 我可能说。","sentence_en":"Yes, I might say."},{"id":"430","start":2969.01,"end":2972.33,"displayStart":2969.01,"displayEnd":2972.33,"displayMid":2970.67,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":0.927539,"pitch":21.526794,"speechRate":6.024,"hasEvents":false,"sentence_source":"时间是democratic 对 是有这个意思。","sentence_en":"Time is democratic. Yes, that's the meaning."},{"id":"431","start":2972.33,"end":2978.33,"displayStart":2972.33,"displayEnd":2978.33,"displayMid":2975.33,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.750429,"pitch":14.701097,"speechRate":5.667,"hasEvents":false,"sentence_source":"但是我可能从来不会说我要走出什么，就是get over something。","sentence_en":"But I probably would never say I want to walk out of something, meaning get over something."},{"id":"432","start":2978.33,"end":2993.81,"displayStart":2978.33,"displayEnd":2993.81,"displayMid":2986.0699999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.752438,"pitch":21.73237,"speechRate":5.152,"hasEvents":false,"sentence_source":"我觉得生活中有些艰难是不能够走出来的，也不需要走出来的 那就是生活的一部分，像我自己的经理就是说，觉得 我就在这里面，我的存在是存在在这个痛苦里面，而不是说走出这个痛苦。","sentence_en":"I think some hardships in life cannot be overcome, and they don't need to be. They are part of life. In my own experience, I feel that I exist within this pain, rather than stepping out of it."},{"id":"433","start":2993.81,"end":3000.27,"displayStart":2993.81,"displayEnd":3000.27,"displayMid":2997.04,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.764419,"pitch":20.287962,"speechRate":8.131,"hasEvents":false,"sentence_source":"因为走出的痛苦就有很大的压力，你走不出来怎么样 走不出来 走出来，What does it mean to get over?","sentence_en":"Because walking out of pain brings a lot of pressure: what if you can't walk out? Walk out? What does it mean to get over?"},{"id":"434","start":3000.83,"end":3011.19,"displayStart":3000.83,"displayEnd":3011.19,"displayMid":3006.01,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.895644,"pitch":20.735205,"speechRate":6.332,"hasEvents":false,"sentence_source":"所以可能对我来说 时间是Democratic part of the reason is，生活很痛苦 也是24小时一天，你生活很快的时候 也是24小时。","sentence_en":"So for me, time is democratic. Part of the reason is: life is painful, and it's still 24 hours a day; when life is fast, it's also 24 hours."},{"id":"435","start":3011.19,"end":3023.83,"displayStart":3011.19,"displayEnd":3023.83,"displayMid":3017.51,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.827306,"pitch":18.962713,"speechRate":6.245,"hasEvents":false,"sentence_source":"关键对我来说是 你怎么过这24小时，怎么样觉得这24小时过了以后，觉得you have done something，就是你做了一些事情，做了一些有用的事情 或者有趣的事情。","sentence_en":"The key for me is how you spend those 24 hours, how you feel after those 24 hours that you have done something – that you've done something useful or interesting."},{"id":"436","start":3023.83,"end":3029.91,"displayStart":3023.83,"displayEnd":3029.91,"displayMid":3026.87,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":1.004204,"pitch":19.014416,"speechRate":4.925,"hasEvents":true,"sentence_source":"或者你想了一些问题，或者你写了，像我就是写了两篇书，写了两篇字。","sentence_en":"Or you thought about some questions, or you wrote something. For me, I wrote two books, wrote two pieces."},{"id":"437","start":3030.35,"end":3031.91,"displayStart":3030.35,"displayEnd":3031.91,"displayMid":3031.13,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":0.871641,"pitch":21.228983,"speechRate":5.882,"hasEvents":true,"sentence_source":"那对我来说更重要。","sentence_en":"That is more important to me."},{"id":"438","start":3031.91,"end":3036.45,"displayStart":3031.91,"displayEnd":3036.45,"displayMid":3034.18,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.764342,"pitch":17.912054,"speechRate":5.38,"hasEvents":false,"sentence_source":"所以走得出走不出，在我现在觉得都是没有关系的事情。","sentence_en":"So whether I can walk out or not, I think it doesn't matter now."},{"id":"439","start":3037.29,"end":3040.69,"displayStart":3037.29,"displayEnd":3040.69,"displayMid":3038.99,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.090418,"pitch":28.352676,"speechRate":7.384,"hasEvents":false,"sentence_source":"所以你也说你现在每天花一些时间，会在你的那个花园。","sentence_en":"So you also said that now you spend some time every day in your garden."},{"id":"440","start":3040.69,"end":3042.03,"displayStart":3040.69,"displayEnd":3042.03,"displayMid":3041.36,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.972257,"pitch":19.613577,"speechRate":2.985,"hasEvents":false,"sentence_source":"对 我因为。","sentence_en":"Yes, because..."},{"id":"441","start":3042.03,"end":3043.25,"displayStart":3042.03,"displayEnd":3043.25,"displayMid":3042.6400000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.916389,"pitch":24.959269,"speechRate":4.098,"hasEvents":false,"sentence_source":"喜欢这种花。","sentence_en":"I like this kind of flower."},{"id":"442","start":3043.25,"end":3045.51,"displayStart":3043.25,"displayEnd":3045.51,"displayMid":3044.38,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.593792,"pitch":18.896961,"speechRate":4.867,"hasEvents":false,"sentence_source":"我小时候跟我爸一块养花。","sentence_en":"When I was a child, I grew flowers with my dad."},{"id":"443","start":3045.51,"end":3051.05,"displayStart":3045.51,"displayEnd":3051.05,"displayMid":3048.28,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":1.042734,"pitch":26.985931,"speechRate":6.137,"hasEvents":false,"sentence_source":"但是就是这个Gardening，这个养花是个很有意思的事件，总是市议院为。","sentence_en":"But gardening – growing flowers is a very interesting thing. It's always that things don't go as you wish."},{"id":"444","start":3051.05,"end":3061.07,"displayStart":3051.05,"displayEnd":3061.07,"displayMid":3056.0600000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.022463,"pitch":25.437893,"speechRate":6.088,"hasEvents":false,"sentence_source":"我觉得Gardening是，最容易誓以愿为的事情，你种了那么多花，这个花你觉得能活下来都死了，你觉得 哎呀 可能活不下来的，反倒活下来了。","sentence_en":"I think gardening is the easiest thing to go against your wishes. You plant so many flowers; the ones you think will survive all die, and the ones you think might not survive end up living."},{"id":"445","start":3061.07,"end":3065.49,"displayStart":3061.07,"displayEnd":3065.49,"displayMid":3063.2799999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.954276,"pitch":24.150774,"speechRate":6.109,"hasEvents":false,"sentence_source":"所以每一年都是新的事情，你觉得这Garden都种了五年了。","sentence_en":"So every year is new. You think this garden has been planted for five years."},{"id":"446","start":3065.49,"end":3075.51,"displayStart":3065.49,"displayEnd":3075.51,"displayMid":3070.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.78902,"pitch":23.644709,"speechRate":4.945,"hasEvents":false,"sentence_source":"但是每一年长出来都是不一样的，有的时候就是，所谓风调雨顺，天气好了，Garden就特别好，就不下雨，天气也很热。","sentence_en":"But every year the growth is different. Sometimes, with favorable weather, the garden is especially good; other times it doesn't rain and it's very hot."},{"id":"447","start":3075.51,"end":3081.71,"displayStart":3075.51,"displayEnd":3081.71,"displayMid":3078.61,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.992472,"pitch":27.587339,"speechRate":4.677,"hasEvents":false,"sentence_source":"所以Garden 我觉得，这个花园，永远没有一个很让你满意的时候。","sentence_en":"So the garden, I think, never has a moment that fully satisfies you."},{"id":"448","start":3081.71,"end":3084.13,"displayStart":3081.71,"displayEnd":3084.13,"displayMid":3082.92,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":0.707848,"pitch":21.505825,"speechRate":5.628,"hasEvents":false,"sentence_source":"但是每一天都会有不同的样子。","sentence_en":"But every day it looks different."},{"id":"449","start":3084.13,"end":3090.01,"displayStart":3084.13,"displayEnd":3090.01,"displayMid":3087.07,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.92968,"pitch":21.806723,"speechRate":9.416,"hasEvents":false,"sentence_source":"我觉得那个是我比较喜欢的状态就是说，The whole garden is never going to be alright。","sentence_en":"I think that's the state I prefer, which is: the whole garden is never going to be alright."},{"id":"450","start":3090.01,"end":3092.93,"displayStart":3090.01,"displayEnd":3092.93,"displayMid":3091.4700000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.885013,"pitch":17.385038,"speechRate":14.726,"hasEvents":true,"sentence_source":"But there are a few flowers in there In there that you。","sentence_en":"But there are a few flowers in there that you..."},{"id":"451","start":3092.93,"end":3093.63,"displayStart":3092.93,"displayEnd":3093.63,"displayMid":3093.2799999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.997303,"pitch":10.862152,"speechRate":11.429,"hasEvents":true,"sentence_source":"like them。","sentence_en":"like them."},{"id":"452","start":3094.22,"end":3100.1,"displayStart":3094.22,"displayEnd":3100.1,"displayMid":3097.16,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.947847,"pitch":22.398811,"speechRate":6.104,"hasEvents":true,"sentence_source":"那你哪一本书是写的最难的，最艰难的，哪一本书又是代表了一段你最喜欢的记忆。","sentence_en":"Then which book was the hardest to write, the most difficult? And which book represents a favorite memory of yours?"},{"id":"453","start":3100.1,"end":3101.44,"displayStart":3100.1,"displayEnd":3101.44,"displayMid":3100.77,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.824033,"pitch":16.486549,"speechRate":8.772,"hasEvents":false,"sentence_source":"所以是你最喜欢的一本。","sentence_en":"So it's your favorite book."},{"id":"454","start":3101.44,"end":3113.94,"displayStart":3101.44,"displayEnd":3113.94,"displayMid":3107.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.7,"loudness":0.861856,"pitch":18.639988,"speechRate":4.69,"hasEvents":false,"sentence_source":"我还是很喜欢俄之书，我很喜欢写那本书的，不是那本书，是写那本书的有一些印象很深，其中有一个就是当时我要写到最后一章的时候。","sentence_en":"I still really like 'E Zhi Shu.' I enjoyed writing that book. Actually, not the book itself, but there are some deep impressions from writing it. One of them was when I was about to write the last chapter."},{"id":"455","start":3113.94,"end":3125.64,"displayStart":3113.94,"displayEnd":3125.64,"displayMid":3119.79,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.4,"loudness":0.917143,"pitch":19.357983,"speechRate":6.154,"hasEvents":false,"sentence_source":"那最后一章就是非常的intense 就是非常的这个强烈，我当时写完了 我至少写过于的intense，我就赶紧去游泳池去了 我想我去赶紧先去游一下泳 放一下松。","sentence_en":"That last chapter was very intense. After I finished writing it – at least I had written it too intensely – I quickly went to the swimming pool. I thought I'd go swim to relax."},{"id":"456","start":3125.64,"end":3134.9,"displayStart":3125.64,"displayEnd":3134.9,"displayMid":3130.27,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.986767,"pitch":24.315165,"speechRate":5.4,"hasEvents":false,"sentence_source":"我开到游泳池 到水里游了两圈，哎呀 不行 我还得回去 因为我还得继续把这本书，就说结尾再重新看一遍 我就又开车回来。","sentence_en":"I drove to the pool, swam a couple of laps, and then thought, 'Ah, no, I have to go back because I need to continue with the book – I need to review the ending again.' So I drove back."},{"id":"457","start":3134.9,"end":3142.38,"displayStart":3134.9,"displayEnd":3142.38,"displayMid":3138.6400000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.4,"loudness":0.76104,"pitch":20.886675,"speechRate":9.195,"hasEvents":false,"sentence_source":"所以就那个经历我就印象中很深，I need to return to the world I cannot be in a swimming pool 那种强烈的感觉。","sentence_en":"So that experience left a deep impression on me. 'I need to return to the world, I cannot be in a swimming pool' – that intense feeling."},{"id":"458","start":3142.38,"end":3150,"displayStart":3142.38,"displayEnd":3150,"displayMid":3146.19,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.897458,"pitch":22.474079,"speechRate":5.034,"hasEvents":false,"sentence_source":"我有些书没有那种感觉 写到最后一篇就想，总算写完了 但是这鹅枝书就是有那么一个天。","sentence_en":"Some of my books didn't have that feeling. When I wrote the last chapter, I just thought, 'Finally, it's done.' But this 'E Zhi Shu' had such a moment."},{"id":"459","start":3150,"end":3162.98,"displayStart":3150,"displayEnd":3162.98,"displayMid":3156.49,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.880361,"pitch":23.429615,"speechRate":5.393,"hasEvents":false,"sentence_source":"那么强烈的感觉，像鹅枝书或者你的任何一部作品写到后来，是你带着他们走 还是他们带着你走，好像有种程度，你的主人公会有他们自己的生命成长的轨迹，都是这样子。","sentence_en":"Such a strong feeling. With 'E Zhi Shu' or any of your works, when you're writing later, are you leading them or are they leading you? To some extent, your characters have their own trajectories of life growth. It's always like that."},{"id":"460","start":3162.98,"end":3168.4,"displayStart":3162.98,"displayEnd":3168.4,"displayMid":3165.69,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":1.053925,"pitch":21.51911,"speechRate":4.906,"hasEvents":false,"sentence_source":"的 我觉得，我的观点是如果都写到后来了，还是你带着书走的话。","sentence_en":"Yes, I think so. My view is that if you're still leading the book when you're far into writing it,"},{"id":"461","start":3168.4,"end":3180.16,"displayStart":3168.4,"displayEnd":3180.16,"displayMid":3174.2799999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.886079,"pitch":19.118116,"speechRate":5.527,"hasEvents":false,"sentence_source":"那个书就是有问题 有一定的问题，就是说人物没有变成活生生的，They did not come alive，事实上写到后来我觉得总是这些人物的决定。","sentence_en":"then that book has a problem – meaning the characters haven't become alive. They did not come alive. In fact, when writing later, I think it's always the characters' decisions."},{"id":"462","start":3180.16,"end":3195.5,"displayStart":3180.16,"displayEnd":3195.5,"displayMid":3187.83,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.739869,"pitch":19.213795,"speechRate":5.152,"hasEvents":false,"sentence_source":"有的时候会让你觉得很惊讶 或者很难过，有的时候我觉得写的好的东西，总是写到后来你和这个人物之间会有一些conflict，你们会有一些矛盾，这人物想往一边走 你想往另一边走。","sentence_en":"Sometimes it surprises you or makes you sad. Sometimes I think that in good writing, there is always some conflict between you and the character later on. The character wants to go one way, and you want to go the other way."},{"id":"463","start":3195.5,"end":3198.26,"displayStart":3195.5,"displayEnd":3198.26,"displayMid":3196.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.850145,"pitch":22.671976,"speechRate":7.709,"hasEvents":false,"sentence_source":"总是那个conflict如果存在的话。","sentence_en":"If that conflict exists, always."},{"id":"464","start":3198.26,"end":3208.74,"displayStart":3198.26,"displayEnd":3208.74,"displayMid":3203.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.3,"loudness":0.935077,"pitch":22.35643,"speechRate":5.66,"hasEvents":false,"sentence_source":"那个书就会比较有意思，如果这个人物写的后来就变成了puppet，你让他往东走 他就往东走 跳过舞，或者你让他往上走 他就往上走。","sentence_en":"That book will be more interesting. If the character later becomes a puppet, you tell him to go east and he goes east, you tell him to go up and he goes up..."},{"id":"465","start":3208.74,"end":3212.12,"displayStart":3208.74,"displayEnd":3212.12,"displayMid":3210.43,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Negative","score":-0.4,"loudness":0.834648,"pitch":16.987738,"speechRate":6.471,"hasEvents":false,"sentence_source":"那样的话我觉得书给我的感觉写出来就会差一些。","sentence_en":"In that case, I think the book will turn out to be not as good."},{"id":"466","start":3212.12,"end":3216.84,"displayStart":3212.12,"displayEnd":3216.84,"displayMid":3214.48,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.873573,"pitch":23.382345,"speechRate":4.661,"hasEvents":false,"sentence_source":"这个很有趣，这个我以前的确没有听作家这么描述过。","sentence_en":"This is very interesting. I've never heard a writer describe it this way before."},{"id":"467","start":3216.84,"end":3224.84,"displayStart":3216.84,"displayEnd":3224.84,"displayMid":3220.84,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.958353,"pitch":24.838385,"speechRate":6.313,"hasEvents":false,"sentence_source":"那比如像罗芝书这本书，到什么时候开始那两个主人公已经带你走，带你能感到你跟他们之间是有这样的冲突的。","sentence_en":"For example, with 'E Zhi Shu', at what point did the two protagonists start to lead you, so that you felt this conflict with them?"},{"id":"468","start":3224.84,"end":3226.52,"displayStart":3224.84,"displayEnd":3226.52,"displayMid":3225.6800000000003,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":1.202156,"pitch":27.349792,"speechRate":8.333,"hasEvents":false,"sentence_source":"其实有的时候就很有意思。","sentence_en":"Actually, sometimes it's very interesting."},{"id":"469","start":3226.52,"end":3228.64,"displayStart":3226.52,"displayEnd":3228.64,"displayMid":3227.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.880712,"pitch":23.840731,"speechRate":6.132,"hasEvents":false,"sentence_source":"那个，额之书我写第一稿的时候。","sentence_en":"Um, when I wrote the first draft of 'E Zhi Shu',"},{"id":"470","start":3228.64,"end":3232.9,"displayStart":3228.64,"displayEnd":3232.9,"displayMid":3230.77,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.942482,"pitch":27.742496,"speechRate":5.025,"hasEvents":false,"sentence_source":"还有一半 还有就三分之一，就最没有到中稿里面。","sentence_en":"there was still half, or a third, that didn't make it into the final draft."},{"id":"471","start":3232.9,"end":3246.06,"displayStart":3232.9,"displayEnd":3246.06,"displayMid":3239.48,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.799917,"pitch":21.138004,"speechRate":6.091,"hasEvents":false,"sentence_source":"那三分之一是关于另一个人物，不是关于这两个小姑娘的事情，当时我之所以觉得那个很重要，就是可能我从某种程度上就受到，Nobokov的影响，就是完全是这种Nobokov的写法。","sentence_en":"That third was about another character, not about these two girls. At the time, I thought it was important, probably because I was partly influenced by Nabokov – it was completely written in Nabokov's style."},{"id":"472","start":3246.06,"end":3257.08,"displayStart":3246.06,"displayEnd":3257.08,"displayMid":3251.5699999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.865317,"pitch":22.014383,"speechRate":6.055,"hasEvents":false,"sentence_source":"是一种structure就是结构上，会有点不一样跟现在这个最后玩稿，我当时把这本书给我的编辑看，他说 你得把那后三分之一删掉 我说 为什么。","sentence_en":"It was a structure – structurally a bit different from the final draft. I showed the book to my editor, and he said, 'You need to delete that last third.' I said, 'Why?"},{"id":"473","start":3257.08,"end":3266.96,"displayStart":3257.08,"displayEnd":3266.96,"displayMid":3262.02,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.781675,"pitch":21.418837,"speechRate":7.389,"hasEvents":false,"sentence_source":"他非常聪明 他说 The book wants to be one thing You want it to be another thing，他说 这书是这一往这边走 你要往那边走。","sentence_en":"He was very smart. He said, 'The book wants to be one thing. You want it to be another thing.' He said, 'The book wants to go this way; you want to go that way."},{"id":"474","start":3266.96,"end":3276.36,"displayStart":3266.96,"displayEnd":3276.36,"displayMid":3271.66,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.908557,"pitch":24.340219,"speechRate":6.287,"hasEvents":false,"sentence_source":"他这么一说 我马上就知道他什么意思了，我就把那后三分之一删掉了，删掉了以后 当然你就是不是说前面三分之二，就能成为一本书记的冲写。","sentence_en":"As soon as he said that, I immediately knew what he meant. So I deleted that last third. After deleting it, of course, it wasn't that the first two-thirds could become a complete book; I had to rewrite it."},{"id":"475","start":3276.36,"end":3279.26,"displayStart":3276.36,"displayEnd":3279.26,"displayMid":3277.8100000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.886248,"pitch":23.011974,"speechRate":4.828,"hasEvents":false,"sentence_source":"那时候 我再回去第二稿写的时候。","sentence_en":"Then when I went back to write the second draft,"},{"id":"476","start":3279.26,"end":3292.62,"displayStart":3279.26,"displayEnd":3292.62,"displayMid":3285.94,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.831424,"pitch":20.308521,"speechRate":5.689,"hasEvents":false,"sentence_source":"因为删掉了后面三分之一 整个书的感觉就不一样了，就完全是觉得三百业、两百业、两百五十业以后，就完全是这两个小姑娘的决定，就是他们就有点自主权嘛 我就是follow他们。","sentence_en":"because I had deleted the last third, the whole book felt different. After about 300 pages, 200 pages, 250 pages, it was completely the decisions of the two girls – they had a bit of autonomy. I just followed them."},{"id":"477","start":3292.62,"end":3301.5,"displayStart":3292.62,"displayEnd":3301.5,"displayMid":3297.06,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.85762,"pitch":20.406118,"speechRate":5.294,"hasEvents":false,"sentence_source":"所以那时候我就知道，啊 我觉得我的这个编辑说的是对的，你不能够跟书或者跟你这个人物有这么大的冲突。","sentence_en":"So then I knew: ah, I think my editor was right. You cannot have such a big conflict with the book or with your characters."},{"id":"478","start":3301.5,"end":3305.82,"displayStart":3301.5,"displayEnd":3305.82,"displayMid":3303.66,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.955258,"pitch":21.102209,"speechRate":6.481,"hasEvents":true,"sentence_source":"但是你要一点冲突都没有也不行，就是总是这种balance完。","sentence_en":"But having no conflict at all is also not good. It's always about finding this balance."},{"id":"479","start":3306.26,"end":3319.28,"displayStart":3306.26,"displayEnd":3319.28,"displayMid":3312.7700000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Neutral","score":0,"loudness":0.89772,"pitch":21.656305,"speechRate":5.243,"hasEvents":false,"sentence_source":"我觉得写东西就像人，你这个作家和你的这个人物，总是一种在叫拔河的状态，它往那边去 你往那边去，你总是要把拔河那个状态写出来，就有这种tension。","sentence_en":"I think writing is like a tug-of-war between you as the writer and your character. It goes one way, you go the other way. You always have to write that tug-of-war state – that tension."},{"id":"480","start":3319.28,"end":3321.94,"displayStart":3319.28,"displayEnd":3321.94,"displayMid":3320.61,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.750788,"pitch":17.961622,"speechRate":5.263,"hasEvents":false,"sentence_source":"所以我觉得那时候就会很有意思。","sentence_en":"So I think that's when it becomes interesting."},{"id":"481","start":3321.94,"end":3325.9,"displayStart":3321.94,"displayEnd":3325.9,"displayMid":3323.92,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.729938,"pitch":17.616272,"speechRate":4.293,"hasEvents":false,"sentence_source":"像这种时刻 你会有精疲力尽的感觉吗啊。","sentence_en":"At times like this, do you feel exhausted?"},{"id":"482","start":3326.42,"end":3327.22,"displayStart":3326.42,"displayEnd":3327.22,"displayMid":3326.8199999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.765997,"pitch":33.793991,"speechRate":12.5,"hasEvents":false,"sentence_source":"not really。","sentence_en":"Not really."},{"id":"483","start":3329.4,"end":3337.46,"displayStart":3329.4,"displayEnd":3337.46,"displayMid":3333.4300000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.6,"loudness":0.988299,"pitch":22.40535,"speechRate":7.301,"hasEvents":true,"sentence_source":"我觉得 我这人可能就是喜欢那个状态，就是说被challenge 被这个输challenge，或者被人物challenge。","sentence_en":"I think I just like that state—being challenged, whether by a book, a character, or a person."},{"id":"484","start":3337.46,"end":3345.38,"displayStart":3337.46,"displayEnd":3345.38,"displayMid":3341.42,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":4,"clusterLabel":"C4","clusterName":"Literary Creation and Writer's Life","sentiment_en":"Positive","score":0.5,"loudness":0.836016,"pitch":20.951372,"speechRate":4.569,"hasEvents":true,"sentence_source":"我觉得不是会很精疲力尽的，我好像没有一本书写完后来精疲力尽，好像没有这个状态。","sentence_en":"I don't think I get very exhausted—I've never felt that way after finishing a book."},{"id":"485","start":3346.24,"end":3353.56,"displayStart":3346.24,"displayEnd":3353.56,"displayMid":3349.8999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":1.011988,"pitch":26.00881,"speechRate":6.935,"hasEvents":true,"sentence_source":"OK 我记得你曾经讲过，你说对一个作家来说或者任何一个人，你接近他你会问他你每天是怎么过的，这个细节特别重要。","sentence_en":"OK, I remember you once said that for a writer or anyone, when you get close to them, you ask how they spend their days—that detail is very important."},{"id":"486","start":3353.56,"end":3357.92,"displayStart":3353.56,"displayEnd":3357.92,"displayMid":3355.74,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.845345,"pitch":15.035633,"speechRate":7.933,"hasEvents":false,"sentence_source":"那我也很好奇你的每天是怎么过的，一个typical的每一天是怎么过的。","sentence_en":"So I'm curious about your daily routine—what's a typical day like?"},{"id":"487","start":3357.92,"end":3366.4,"displayStart":3357.92,"displayEnd":3366.4,"displayMid":3362.16,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Positive","score":0.4,"loudness":0.818171,"pitch":16.650198,"speechRate":5.226,"hasEvents":false,"sentence_source":"对 我的typical每天是很平稳，很就是regular 就是很，我早上起得挺早，我一般五点钟起来。","sentence_en":"Yes, my typical day is very stable, very regular. I get up quite early, usually at five o'clock."},{"id":"488","start":3366.4,"end":3374.58,"displayStart":3366.4,"displayEnd":3374.58,"displayMid":3370.49,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.804021,"pitch":18.72562,"speechRate":4.681,"hasEvents":false,"sentence_source":"然后135就去旅游，246就不游泳了，不游泳就干点别的 坐鱼家嘛，就是有时候坐鱼家。","sentence_en":"Then on odd-numbered days I travel; on even-numbered days I don't swim—I do other things like yoga, sometimes yoga."},{"id":"489","start":3374.58,"end":3375.88,"displayStart":3374.58,"displayEnd":3375.88,"displayMid":3375.23,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.680255,"pitch":20.623018,"speechRate":5.385,"hasEvents":false,"sentence_source":"所以早上起得早。","sentence_en":"So I wake up early in the morning."},{"id":"490","start":3376.84,"end":3382.14,"displayStart":3376.84,"displayEnd":3382.14,"displayMid":3379.49,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.814702,"pitch":20.682793,"speechRate":6.038,"hasEvents":false,"sentence_source":"然后因为我现在经常得开会，如果上午不教书不开会的话，我上午一般都写作。","sentence_en":"And since I often have meetings now, if I'm not teaching or in meetings in the morning, I usually write."},{"id":"491","start":3382.14,"end":3384.38,"displayStart":3382.14,"displayEnd":3384.38,"displayMid":3383.26,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Positive","score":0.4,"loudness":0.745589,"pitch":14.259044,"speechRate":5.357,"hasEvents":false,"sentence_source":"因为早上起来的状态比较好。","sentence_en":"Because I'm in better shape in the morning."},{"id":"492","start":3384.38,"end":3386.14,"displayStart":3384.38,"displayEnd":3386.14,"displayMid":3385.26,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Positive","score":0.4,"loudness":0.680186,"pitch":13.59672,"speechRate":5.114,"hasEvents":false,"sentence_source":"我觉得集中力比较好。","sentence_en":"I think my concentration is better."},{"id":"493","start":3386.14,"end":3387.2,"displayStart":3386.14,"displayEnd":3387.2,"displayMid":3386.67,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":1.007857,"pitch":12.641307,"speechRate":6.604,"hasEvents":false,"sentence_source":"所以上午就写作。","sentence_en":"So I write in the morning."},{"id":"494","start":3387.2,"end":3390.42,"displayStart":3387.2,"displayEnd":3390.42,"displayMid":3388.81,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.751826,"pitch":20.781065,"speechRate":4.969,"hasEvents":false,"sentence_source":"然后到了中午就出去六大六的走一走。","sentence_en":"Then around noon I go out for a long walk."},{"id":"495","start":3390.42,"end":3405.12,"displayStart":3390.42,"displayEnd":3405.12,"displayMid":3397.77,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":7,"clusterLabel":"C7","clusterName":"Writing Habits and Creative Routine","sentiment_en":"Neutral","score":0,"loudness":0.783281,"pitch":16.148623,"speechRate":5.238,"hasEvents":false,"sentence_source":"然后到下午一般就看书了，下午就不写东西了，我过了一点钟很少写东西，一直到晚上都是看书，就是这样子了，我不喜欢出门，我不喜欢开party，偶尔去开一下party，也不看电视。","sentence_en":"Then in the afternoon, I usually read. I don't write in the afternoon. After one o'clock, I rarely write. I read until evening. That's how it is. I don't like going out, I don't like throwing parties. Occasionally I go to a party, but I don't watch TV."},{"id":"496","start":3405.12,"end":3406.92,"displayStart":3405.12,"displayEnd":3406.92,"displayMid":3406.02,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.871965,"pitch":20.437101,"speechRate":7.222,"hasEvents":false,"sentence_source":"因为我们家没电视，也不看电影。","sentence_en":"Because we don't have a TV at home, and we don't watch movies."},{"id":"497","start":3406.92,"end":3414.76,"displayStart":3406.92,"displayEnd":3414.76,"displayMid":3410.84,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.773322,"pitch":20.962826,"speechRate":5.523,"hasEvents":false,"sentence_source":"所以我留下来的时间就是，不写东西的时间就在看书，不会太安静吗，我不怕安静的，我从小就不怕安静的。","sentence_en":"So the remaining time, when I'm not writing, I read books. Isn't it too quiet? I'm not afraid of silence—I never have been since childhood."},{"id":"498","start":3414.76,"end":3417.34,"displayStart":3414.76,"displayEnd":3417.34,"displayMid":3416.05,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.713189,"pitch":23.141001,"speechRate":6.426,"hasEvents":false,"sentence_source":"我们在家都是很安静的，经常就不说话。","sentence_en":"At home we're very quiet; we often don't talk."},{"id":"499","start":3417.34,"end":3425.88,"displayStart":3417.34,"displayEnd":3425.88,"displayMid":3421.61,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.6,"loudness":0.779837,"pitch":20.805546,"speechRate":5.289,"hasEvents":false,"sentence_source":"我觉得我比较适合这种，比较solitary的life，就是比较安静，坐在那里看书，我并不觉得烦。","sentence_en":"I think I'm suited for this kind of solitary life—quiet, sitting and reading—and I don't find it boring."},{"id":"500","start":3425.88,"end":3429.92,"displayStart":3425.88,"displayEnd":3429.92,"displayMid":3427.9,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.958744,"pitch":23.606256,"speechRate":6.767,"hasEvents":false,"sentence_source":"我觉得有的人可能那么安静，就会觉得太近了，或者就想干点什么。","sentence_en":"I think some people might find it too quiet and want to do something else."},{"id":"501","start":3429.92,"end":3432.9,"displayStart":3429.92,"displayEnd":3432.9,"displayMid":3431.41,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.5,"loudness":0.648021,"pitch":18.622236,"speechRate":4.362,"hasEvents":false,"sentence_source":"但是我就会觉得很自然的状态。","sentence_en":"But for me it feels very natural."},{"id":"502","start":3432.9,"end":3436.26,"displayStart":3432.9,"displayEnd":3436.26,"displayMid":3434.58,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.742011,"pitch":20.250769,"speechRate":5.06,"hasEvents":false,"sentence_source":"现在天暖和了，我到了周末的时候就出去。","sentence_en":"Now that it's warmer, I go out on weekends."},{"id":"503","start":3436.26,"end":3440.08,"displayStart":3436.26,"displayEnd":3440.08,"displayMid":3438.17,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.7,"loudness":0.853159,"pitch":21.458036,"speechRate":5.622,"hasEvents":false,"sentence_source":"做Garden一做，就做好几个小时也挺快乐的。","sentence_en":"I work in the garden for hours—it's quite enjoyable."},{"id":"504","start":3440.08,"end":3442.92,"displayStart":3440.08,"displayEnd":3442.92,"displayMid":3441.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.755195,"pitch":23.2876,"speechRate":8.534,"hasEvents":false,"sentence_source":"我觉得，白天就是weekday我不做Garden。","sentence_en":"I think on weekdays I don't garden."},{"id":"505","start":3442.92,"end":3449.22,"displayStart":3442.92,"displayEnd":3449.22,"displayMid":3446.0699999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.906814,"pitch":22.938852,"speechRate":4.762,"hasEvents":false,"sentence_source":"因为这个Garden比写作还要花时间，多少时间他都会给你花掉的。","sentence_en":"Because gardening takes even more time than writing—it can consume as much time as you give it."},{"id":"506","start":3449.22,"end":3455.7,"displayStart":3449.22,"displayEnd":3455.7,"displayMid":3452.46,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.940391,"pitch":21.149181,"speechRate":6.643,"hasEvents":false,"sentence_source":"所以我要是天天做到Garden，就什么都去干不了，书也看不成，我一般就周末走李翊云。","sentence_en":"So if I gardened every day, I wouldn't be able to do anything else, not even read. I generally garden only on weekends, Li Yiyun."},{"id":"507","start":3455.7,"end":3465.32,"displayStart":3455.7,"displayEnd":3465.32,"displayMid":3460.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.049899,"pitch":25.525732,"speechRate":4.626,"hasEvents":false,"sentence_source":"我很好奇，从小到大女孩子，女性会有的一些困惑，成长当中的一些难题，你会很敏感吗，你还是会从小到大。","sentence_en":"I'm curious—growing up, did you feel sensitive to the typical confusions and challenges that girls and women face? Or were you always like that?"},{"id":"508","start":3465.32,"end":3469.28,"displayStart":3465.32,"displayEnd":3469.28,"displayMid":3467.3,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.87791,"pitch":22.786942,"speechRate":6.566,"hasEvents":false,"sentence_source":"其实没有特别多的这种性别意识，我觉得我可能还真的。","sentence_en":"Actually, I didn't have much gender awareness. I think I really didn't."},{"id":"509","start":3469.28,"end":3470.92,"displayStart":3469.28,"displayEnd":3470.92,"displayMid":3470.1000000000004,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":1.040293,"pitch":28.12488,"speechRate":6.494,"hasEvents":false,"sentence_source":"没有那么大的性别意识。","sentence_en":"Not a strong sense of gender identity."},{"id":"510","start":3470.92,"end":3483.58,"displayStart":3470.92,"displayEnd":3483.58,"displayMid":3477.25,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.883061,"pitch":23.676313,"speechRate":6.022,"hasEvents":false,"sentence_source":"因为我觉得那天我就想，我就记得我上大学的时候，在北大上学，我经常自己就骑车道一河远去逛去，就一个人去，我就记得我们从宿舍的一个女孩，说这意思是你怎么这么weird。","sentence_en":"Because I remember thinking back then, when I was at Peking University, I'd often ride my bike alone to a faraway park to wander. A girl from my dorm once said, 'Why are you so weird?"},{"id":"511","start":3483.58,"end":3489.52,"displayStart":3483.58,"displayEnd":3489.52,"displayMid":3486.55,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.3,"loudness":0.794046,"pitch":25.848236,"speechRate":6.363,"hasEvents":false,"sentence_source":"你怎么这么怪，说人家出去都是两个人出去，或者跟男朋友出去，你就一个人去骑车去逛去。","sentence_en":"She said, 'Everyone else goes out in pairs or with a boyfriend, but you go alone, riding your bike."},{"id":"512","start":3489.52,"end":3490.94,"displayStart":3489.52,"displayEnd":3490.94,"displayMid":3490.23,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.906595,"pitch":34.86364,"speechRate":6.084,"hasEvents":false,"sentence_source":"但是我当时就觉得。","sentence_en":"But at the time I thought—"},{"id":"513","start":3490.94,"end":3494.08,"displayStart":3490.94,"displayEnd":3494.08,"displayMid":3492.51,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":1.074386,"pitch":35.223576,"speechRate":5.414,"hasEvents":false,"sentence_source":"那艺合园是很漂亮的，一个人逛是比两个。","sentence_en":"That park is beautiful—wandering alone is better than with someone else."},{"id":"514","start":3494.08,"end":3495.32,"displayStart":3494.08,"displayEnd":3495.32,"displayMid":3494.7,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.5,"loudness":0.884303,"pitch":21.671015,"speechRate":5.645,"hasEvents":false,"sentence_source":"人逛更有意思的。","sentence_en":"More interesting to wander alone."},{"id":"515","start":3495.32,"end":3498,"displayStart":3495.32,"displayEnd":3498,"displayMid":3496.66,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Positive","score":0.4,"loudness":0.889722,"pitch":29.372175,"speechRate":6.742, :"可能年轻的时候。","sentence_en":"Maybe when I was young."},{"id":"520","start":3519.58,"end":3531.06,"displayStart":3519.58,"displayEnd":3531.06,"displayMid":3525.3199999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":6,"clusterLabel":"C6","clusterName":"Adolescent Growth and Self-Awareness","sentiment_en":"Neutral","score":0,"loudness":0.938365,"pitch":26.57025,"speechRate":4.965,"hasEvents":false,"sentence_source":"我觉得现在想他们都不能叫情伤了，就是年轻的总会上大学的谈个男朋友，谈那么两个月就吹了，现在想就不能算情伤了 我觉得，那。","sentence_en":"I think looking back now, they can't even be called heartbreaks—just the usual college relationship that lasted two months and ended. Not real heartbreak, I think."},{"id":"521","start":3531.06,"end":3532.58,"displayStart":3531.06,"displayEnd":3532.58,"displayMid":3531.8199999999997,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Neutral","score":0,"loudness":0.763641,"pitch":13.177938,"speechRate":5.921,"hasEvents":false,"sentence_source":"的确不算，真的。","sentence_en":"It really doesn't count."},{"id":"522","start":3532.58,"end":3536.9,"displayStart":3532.58,"displayEnd":3536.9,"displayMid":3534.74,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":0.936644,"pitch":26.520073,"speechRate":5.324,"hasEvents":false,"sentence_source":"情伤好像还真没，我认识我老公的时候我们俩都21岁。","sentence_en":"I don't think I've ever had a real heartbreak. When I met my husband, we were both 21."},{"id":"523","start":3536.9,"end":3538.9,"displayStart":3536.9,"displayEnd":3538.9,"displayMid":3537.9,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.7,"loudness":0.942812,"pitch":17.061632,"speechRate":7.712,"hasEvents":false,"sentence_source":"所以我们俩一样在一起的一辈子了。","sentence_en":"So we've been toge
