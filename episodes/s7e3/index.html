ness":0.816547,"pitch":22.561752,"speechRate":6.312,"hasEvents":false,"sentence_source":"那么该如何对他们讲，这个痛苦的这个状态它会过去，痛苦不会过去 但这痛苦的状态会过去。","sentence_en":"So how should we tell them that this painful state will pass? The pain won't pass, but the painful state will."},{"id":"556","start":3720.6,"end":3721.92,"displayStart":3720.6,"displayEnd":3721.92,"displayMid":3721.26,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.234275,"pitch":32.523708,"speechRate":4.464,"hasEvents":false,"sentence_source":"对 就是说你。","sentence_en":"Right, meaning you—"},{"id":"557","start":3721.92,"end":3725.84,"displayStart":3721.92,"displayEnd":3725.84,"displayMid":3723.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.938725,"pitch":24.207325,"speechRate":4.768,"hasEvents":false,"sentence_source":"那个事情痛苦的本身事情是永远会在那的。","sentence_en":"The painful event itself is always there."},{"id":"558","start":3725.84,"end":3731.7,"displayStart":3725.84,"displayEnd":3731.7,"displayMid":3728.77,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.930847,"pitch":21.944056,"speechRate":5.15,"hasEvents":false,"sentence_source":"但是那个感觉就好像你第一天受了伤，比如说你还在流血或者这个骨折。","sentence_en":"But the feeling is like when you get hurt on the first day—say you're bleeding or have a fracture."},{"id":"559","start":3731.7,"end":3742.96,"displayStart":3731.7,"displayEnd":3742.96,"displayMid":3737.33,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.928447,"pitch":20.278076,"speechRate":6.715,"hasEvents":false,"sentence_source":"那是很疼的，你那个伤好了，你那个骨头也永远是还是又会有些不是那么strong了，或者你那个上接了疤以后，这个scar还是在那儿，scar tissue还是在那儿。","sentence_en":"It hurts a lot. When the wound heals, that bone might never be as strong again, or after the scar forms, the scar is still there, the scar tissue is still there."},{"id":"560","start":3742.96,"end":3744.72,"displayStart":3742.96,"displayEnd":3744.72,"displayMid":3743.84,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.966899,"pitch":25.30295,"speechRate":6.173,"hasEvents":false,"sentence_source":"但是就是不会那么痛了。","sentence_en":"But it doesn't hurt as much anymore."},{"id":"561","start":3744.72,"end":3747,"displayStart":3744.72,"displayEnd":3747,"displayMid":3745.8599999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.806984,"pitch":20.07406,"speechRate":5.702,"hasEvents":false,"sentence_source":"我觉得，不是说痛不预伤那个痛。","sentence_en":"I think it's not that the pain doesn't hurt anymore."},{"id":"562","start":3747,"end":3751.86,"displayStart":3747,"displayEnd":3751.86,"displayMid":3749.4300000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.945188,"pitch":16.369911,"speechRate":5.556,"hasEvents":false,"sentence_source":"我觉得痛不预伤那个痛，是很难够坚持到很长时间的，总是会过去。","sentence_en":"I think the initial pain of an injury can't last very long; it always passes."},{"id":"563","start":3751.86,"end":3759.56,"displayStart":3751.86,"displayEnd":3759.56,"displayMid":3755.71,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.807749,"pitch":24.238523,"speechRate":5.128,"hasEvents":false,"sentence_source":"所以是你说的是这个感觉和状态是两回事情，状态是客观的，客观的状态我们谁也没法改变。","sentence_en":"So what you're saying is that feeling and state are two different things. The state is objective, and none of us can change an objective state."},{"id":"564","start":3759.56,"end":3761.72,"displayStart":3759.56,"displayEnd":3761.72,"displayMid":3760.64,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.88158,"pitch":24.322687,"speechRate":6.593,"hasEvents":false,"sentence_source":"但是主观的是那个主观感觉。","sentence_en":"But the subjective part is the subjective feeling."},{"id":"565","start":3761.72,"end":3763.86,"displayStart":3761.72,"displayEnd":3763.86,"displayMid":3762.79,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.374977,"pitch":18.238667,"speechRate":6.075,"hasEvents":false,"sentence_source":"那个主观感觉我觉得是会变的。","sentence_en":"That subjective feeling, I think, can change."},{"id":"566","start":3763.86,"end":3778.6,"displayStart":3763.86,"displayEnd":3778.6,"displayMid":3771.23,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.769194,"pitch":19.206324,"speechRate":4.337,"hasEvents":false,"sentence_source":"但是你怎么像没有经历过这些的人，只能说我觉得没法解释，可能就得靠他们自己，经过了再回想过来，就是原来是这样的，这个状态和感觉是两回事的。","sentence_en":"But how do you explain it to someone who hasn't experienced it? I can only say I don't think I can explain it. They might have to go through it themselves and look back to realize, 'So that's how it is.' The state and the feeling are two different things."},{"id":"567","start":3778.6,"end":3781.28,"displayStart":3778.6,"displayEnd":3781.28,"displayMid":3779.94,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.799959,"pitch":24.093019,"speechRate":7.173,"hasEvents":false,"sentence_source":"我们可以有办法躲过那些人生的痛苦吗。","sentence_en":"Can we find a way to avoid life's pain?"},{"id":"568","start":3781.28,"end":3788.86,"displayStart":3781.28,"displayEnd":3788.86,"displayMid":3785.07,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.877239,"pitch":23.935101,"speechRate":4.577,"hasEvents":false,"sentence_source":"我觉得好像没有吧，我还没有认识到人能躲得过去，除非你就是真的是不生活了。","sentence_en":"I don't think so. I haven't seen anyone able to avoid it unless they completely stop living."},{"id":"569","start":3788.86,"end":3794.58,"displayStart":3788.86,"displayEnd":3794.58,"displayMid":3791.7200000000003,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.933049,"pitch":23.404892,"speechRate":4.529,"hasEvents":true,"sentence_source":"我觉得不可能，我估计要是做和尚 也还是会有很多痛苦的吧。","sentence_en":"I don't think it's possible. I imagine even being a monk comes with a lot of pain."},{"id":"570","start":3795.32,"end":3809.38,"displayStart":3795.32,"displayEnd":3809.38,"displayMid":3802.3500000000004,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.861292,"pitch":19.646275,"speechRate":4.965,"hasEvents":false,"sentence_source":"因为我也有做和尚的朋友，我会觉得他们的生活当中，也有各种各样的属于他们的烦恼和他们的苦恼，好像谁也不会在这个问题上能够超脱，能够比别人好像更幸运。","sentence_en":"I also have friends who are monks. I feel that in their lives, they also have all kinds of troubles and worries. It seems no one can transcend these issues or be luckier than others."},{"id":"571","start":3809.38,"end":3812.28,"displayStart":3809.38,"displayEnd":3812.28,"displayMid":3810.83,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.052205,"pitch":22.41272,"speechRate":6.198,"hasEvents":false,"sentence_source":"除了时间以外 痛苦似乎也是公平的。","sentence_en":"Apart from time, pain seems to be fair too."},{"id":"572","start":3812.28,"end":3821.3,"displayStart":3812.28,"displayEnd":3821.3,"displayMid":3816.79,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.049004,"pitch":24.854553,"speechRate":5.767,"hasEvents":false,"sentence_source":"对 我觉得是这样子的，有的人耐受率低一些 也会受到很多的痛苦，就好像比如说有个人被蚊子嚼了，他就会觉得特别痛苦。","sentence_en":"Yes, I think so. Some people have a lower tolerance and still suffer a lot—like if someone gets bitten by a mosquito, they might feel extremely painful."},{"id":"573","start":3821.3,"end":3823.54,"displayStart":3821.3,"displayEnd":3823.54,"displayMid":3822.42,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.119829,"pitch":27.349419,"speechRate":5.14,"hasEvents":false,"sentence_source":"那个痛苦的感觉都是真的。","sentence_en":"That feeling of pain is real."},{"id":"574","start":3823.54,"end":3831.72,"displayStart":3823.54,"displayEnd":3831.72,"displayMid":3827.63,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.749564,"pitch":19.342808,"speechRate":5.134,"hasEvents":false,"sentence_source":"那也是真的痛苦，当然客观来说那只是个蚊子包而已，就是这样子的，可能另一个人受到痛苦更大一些。","sentence_en":"It's real pain. Objectively it's just a mosquito bite, but another person might be suffering more."},{"id":"575","start":3831.72,"end":3833.9,"displayStart":3831.72,"displayEnd":3833.9,"displayMid":3832.81,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.850685,"pitch":18.974962,"speechRate":5.505,"hasEvents":false,"sentence_source":"但是他感觉也是同样的痛苦。","sentence_en":"But the feeling is the same pain."},{"id":"576","start":3833.9,"end":3841.86,"displayStart":3833.9,"displayEnd":3841.86,"displayMid":3837.88,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.724905,"pitch":17.355211,"speechRate":5.882,"hasEvents":false,"sentence_source":"我觉得痛苦本身那个感觉没法衡量的，你的痛苦和我的痛苦和他的痛苦，都是我们自己的感觉，当然是不知道的。","sentence_en":"I think the feeling of pain itself can't be measured. Your pain, my pain, and his pain are all our own feelings, which we can't really know."},{"id":"577","start":3841.86,"end":3850.4,"displayStart":3841.86,"displayEnd":3850.4,"displayMid":3846.13,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.5,"loudness":0.828641,"pitch":19.693567,"speechRate":4.404,"hasEvents":false,"sentence_source":"但我有时候其实想跟别人讲的就是，在痛苦这个日子依然是值得我们去体验的觉得吗。","sentence_en":"But sometimes I want to tell others that even in pain, life is still worth experiencing, don't you think?"},{"id":"578","start":3850.4,"end":3852.62,"displayStart":3850.4,"displayEnd":3852.62,"displayMid":3851.51,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.5,"loudness":0.505088,"pitch":24.091568,"speechRate":5.467,"hasEvents":false,"sentence_source":"我觉得值得 你觉得不值得吗。","sentence_en":"I think it is. Don’t you?"},{"id":"579","start":3852.62,"end":3855,"displayStart":3852.62,"displayEnd":3855,"displayMid":3853.81,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.279369,"pitch":28.687172,"speechRate":5.714,"hasEvents":false,"sentence_source":"我不知道 我就想问你的想法。","sentence_en":"I don’t know—I just wanted to hear your thoughts."},{"id":"580","start":3855,"end":3856.74,"displayStart":3855,"displayEnd":3856.74,"displayMid":3855.87,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.493161,"pitch":19.114229,"speechRate":4.72,"hasEvents":false,"sentence_source":"我觉得还是值得的。","sentence_en":"I think it is worth it."},{"id":"581","start":3856.74,"end":3858.66,"displayStart":3856.74,"displayEnd":3858.66,"displayMid":3857.7,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.686065,"pitch":26.996485,"speechRate":4.905,"hasEvents":false,"sentence_source":"因为痛苦不会是全部。","sentence_en":"Because pain isn't everything."},{"id":"582","start":3858.66,"end":3867.94,"displayStart":3858.66,"displayEnd":3867.94,"displayMid":3863.3,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.822637,"pitch":20.958708,"speechRate":5.28,"hasEvents":false,"sentence_source":"对 我觉得这点是你说的是对的，另外一个 我不知道你说的痛苦，可能就是我说的比如说，pain 或者 sadness。","sentence_en":"Yes, I think you're right about that. And another thing: I don't know if the pain you mean is what I'd call pain or sadness."},{"id":"583","start":3867.94,"end":3870.06,"displayStart":3867.94,"displayEnd":3870.06,"displayMid":3869,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.130168,"pitch":27.405338,"speechRate":8.491,"hasEvents":false,"sentence_source":"我觉得更多是pain和 sadness。","sentence_en":"I think it's more pain and sadness."},{"id":"584","start":3870.06,"end":3871.64,"displayStart":3870.06,"displayEnd":3871.64,"displayMid":3870.85,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.974685,"pitch":17.659081,"speechRate":8.228,"hasEvents":false,"sentence_source":"对，pain和 sadness。","sentence_en":"Yes, pain and sadness."},{"id":"585","start":3871.64,"end":3883.13,"displayStart":3871.64,"displayEnd":3883.13,"displayMid":3877.385,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.787251,"pitch":21.221439,"speechRate":6.876,"hasEvents":false,"sentence_source":"我觉得那些东西是可以的，是可以的 我觉得不好的是这种，disatisfaction 或者这种 unhappiness，就是不满意 对自己的生活不满，或者有种做过不安的那种感觉。","sentence_en":"I think those are okay—they're fine. What I think is bad is dissatisfaction or unhappiness—being dissatisfied with your life, or feeling restless."},{"id":"586","start":3883.13,"end":3885.79,"displayStart":3883.13,"displayEnd":3885.79,"displayMid":3884.46,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Negative","score":-0.4,"loudness":0.862234,"pitch":15.711159,"speechRate":7.519,"hasEvents":false,"sentence_source":"就 listless 那个东西我觉得是不好的。","sentence_en":"That listless feeling, I think, is bad."},{"id":"587","start":3885.79,"end":3895.21,"displayStart":3885.79,"displayEnd":3895.21,"displayMid":3890.5,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":0.71254,"pitch":19.309347,"speechRate":4.777,"hasEvents":false,"sentence_source":"所以如果你这么说 我觉得是这样的，这个 pain 和 sadness 这个痛苦是不能够避免，是人都会有的。","sentence_en":"So if you put it that way, I agree: pain and sadness are unavoidable—everyone experiences them."},{"id":"588","start":3895.21,"end":3901.41,"displayStart":3895.21,"displayEnd":3901.41,"displayMid":3898.31,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Positive","score":0.4,"loudness":0.811096,"pitch":17.984364,"speechRate":6.985,"hasEvents":false,"sentence_source":"但是我觉得 unhappiness 是可以避免的，或者是可以想办法 less unhappy。","sentence_en":"But I think unhappiness can be avoided, or you can find ways to be less unhappy."},{"id":"589","start":3902.35,"end":3904.45,"displayStart":3902.35,"displayEnd":3904.45,"displayMid":3903.3999999999996,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Neutral","score":0,"loudness":1.159056,"pitch":23.898329,"speechRate":9.091,"hasEvents":true,"sentence_source":"怎么做到能够Less Unhappy。","sentence_en":"How to become less unhappy?"},{"id":"590","start":3904.59,"end":3905.97,"displayStart":3904.59,"displayEnd":3905.97,"displayMid":3905.2799999999997,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.884999,"pitch":27.403296,"speechRate":3.493,"hasEvents":false,"sentence_source":"这个好难。","sentence_en":"That's really hard."},{"id":"591","start":3905.97,"end":3916.21,"displayStart":3905.97,"displayEnd":3916.21,"displayMid":3911.09,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.3,"loudness":0.906598,"pitch":26.24762,"speechRate":6.324,"hasEvents":false,"sentence_source":"我觉得人总是要跟别人比，比如说我可以说的是我生活中间，比如这个writer觉得那个writer得的东西，得的奖比我多他就不happy了。","sentence_en":"I think people always compare with others. For example, in my life, one writer might feel unhappy if another writer gets more awards."},{"id":"592","start":3916.21,"end":3926.27,"displayStart":3916.21,"displayEnd":3926.27,"displayMid":3921.24,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":3,"clusterLabel":"C3","clusterName":"Pain Cognition and Psychological Growth","sentiment_en":"Negative","score":-0.4,"loudness":0.808801,"pitch":22.979063,"speechRate":5.336,"hasEvents":false,"sentence_source":"但是事实上那个东西我觉得，就是说中国人说的话，说是人比人气死人，就是这种比较的话，就会引起很多不happy的感觉。","sentence_en":"But actually, as the Chinese saying goes, 'Comparing people can drive you crazy.' This kind of comparison causes a lot of unhappiness."},{"id":"593","start":3926.27,"end":3928.81,"displayStart":3926.27,"displayEnd":3928.81,"displayMid":3927.54,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":0.63964,"pitch":16.238224,"speechRate":5.532,"hasEvents":true,"sentence_source":"那个东西我觉得是可以避免的。","sentence_en":"I think that can be avoided."},{"id":"594","start":3928.81,"end":3931.07,"displayStart":3928.81,"displayEnd":3931.07,"displayMid":3929.94,"speaker":"Li Yiyun","speakerColor":"#A29479","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","sentiment_en":"Positive","score":0.4,"loudness":1.473822,"pitch":29.015671,"speechRate":7.08,"hasEvents":true,"sentence_source":"我觉得永远不要把自己跟别。","sentence_en":"I think you should never compare yourself with others."},{"id":"595","start":3931.07,"end":3943.43,"displayStart":3931.07,"displayEnd":3943.43,"displayMid":3937.25,"speaker":"Lu Yu","speakerColor":"#995A91","cluster":2,"clusterLabel":"C2","clusterName":"Pain, Time, and Life Experience","   return LAYOUT.basePxPerSec * state.zoom;
}

function currentStageScale() {
  const raw = getComputedStyle(document.documentElement).getPropertyValue("--scale");
  return Number.parseFloat(raw) || 1;
}

function localScrollerX(event, rect) {
  return (event.clientX - rect.left) / currentStageScale();
}

function displayTimeForAudioTime(audioTime) {
  return Number(audioTime) || 0;
}

function audioTimeForDisplayTime(displayTime) {
  return Math.max(0, Math.min(state.data.episode.duration, Number(displayTime) || 0));
}

async function loadData() {

  const response = await fetch("./data/processed/s8e1_dashboard_data.json");
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function svgEl(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v));
  return node;
}

function topicStyle(def) {
  return `background:${def.color};opacity:${def.opacity}`;
}

function siteBasePath() {
  const path = window.location.pathname;
  const episodeIndex = path.indexOf("/episodes/");
  if (episodeIndex >= 0) return path.slice(0, episodeIndex + 1);
  const s8e1Index = path.indexOf("/s8e1/");
  if (s8e1Index >= 0) return path.slice(0, s8e1Index + 1);
  return path.replace(/[^/]*$/, "");
}

function episodeUrl(slug) {
  const base = siteBasePath();
  return slug === "s8e1" ? `${base}s8e1/index.html` : `${base}episodes/${slug}/index.html`;
}

function landingUrl() {
  return `${siteBasePath()}index.html`;
}

function renderApp(data) {
  state.data = data;
  document.title = `Beneath the Conversation - ${data.episode.label || data.episode.id || "Episode"}`;
  const app = document.getElementById("app");
  app.innerHTML = "";

  stage.appendChild(el("div", "page-overlay"));

  const warning = el("div", "font-warning hidden", "Development warning: Frutiger LT Pro font files were not found in /fonts. The page intentionally does not define fallback fonts.");
  warning.id = "font-warning";
  return warning;
}

function checkFonts() {
  if (!document.fonts) return;
  Promise.all([
    document.fonts.load('12px "Frutiger LT Pro 45 Light"'),
    document.fonts.load('12px "Frutiger LT Pro 67 Bold Condensed"')
  ]).then(() => {
    const ok = document.fonts.check('12px "Frutiger LT Pro 45 Light"') && document.fonts.check('12px "Frutiger LT Pro 67 Bold Condensed"');
    document.getElementById("font-warning")?.classList.toggle("hidden", ok);
    applyIntroLayout(document.querySelector(".stage"));
    resizeStage();
  });
}

function applyIntroLayout(stage) {
  if (!stage) return;
  fitEpisodeTitle(stage);
  const intro = stage.querySelector(".episode-intro");
  if (!intro) return;
  const headerTop = 24;
  const baseLegendTop = 198;
  const desiredGap = 34;
  const introBottom = headerTop + intro.offsetTop + intro.scrollHeight;
  const shift = Math.max(0, Math.ceil(introBottom + desiredGap - baseLegendTop));
  stage.style.setProperty("--content-shift", `${shift}px`);
  resizeStage();
}

function renderEpisodeTitle(titleText) {
  const title = el("h1", "episode-title", titleText);
  const pipeMatch = titleText.match(/\s+\|\s+|丨/);
  if (pipeMatch) {
    const index = pipeMatch.index;
    title.dataset.titleLead = titleText.slice(0, index).trim();
    title.dataset.titleRest = titleText.slice(index + pipeMatch[0].length).trim();
  }
  return title;
}

function fitEpisodeTitle(stage) {
  const title = stage.querySelector(".episode-title");
  const actions = stage.querySelector(".header-actions");
  if (!title || !actions) return;
  const lead = title.dataset.titleLead;
  const rest = title.dataset.titleRest;
  if (!lead || !rest) return;

  title.classList.remove("episode-title--split");
  title.textContent = `${lead} | ${rest}`;
  const maxWidth = Math.max(900, actions.offsetLeft - 28);
  title.style.maxWidth = `${maxWidth}px`;

  if (title.scrollWidth > maxWidth) {
    title.classList.add("episode-title--split");
    title.textContent = "";
    title.append(document.createTextNode(lead), document.createElement("br"), document.createTextNode(rest));
  }
}

function resizeStage() {
  const stage = document.querySelector(".stage");
  const app = document.getElementById("app");
  if (!stage || !app) return;
  const scale = window.innerWidth / LAYOUT.baseWidth;
  document.documentElement.style.setProperty("--scale", String(scale));
  const stageHeight = stage.scrollHeight || stage.offsetHeight || 0;
  app.style.height = `${Math.ceil(stageHeight * scale)}px`;
}

function renderHeader(data) {
  const header = el("header", "header");
  const titleBlock = el("div", "title-block");
  titleBlock.appendChild(renderEpisodeTitle(data.episode.title));
  titleBlock.appendChild(el("p", "episode-intro", data.episode.intro));

  const actions = el("div", "header-actions");
  const back = el("button", "back-button", "Back");
  back.type = "button";
  back.setAttribute("aria-label", "Back to main page");
  back.appendChild(backIcon());
  back.addEventListener("click", () => {
    window.location.href = landingUrl();
  });

  const selector = el("label", "selector");
  const select = el("select", "episode-select");
  const currentSlug = data.navigation?.currentSlug || String(data.episode.id || "").toLowerCase();
  const navEpisodes = data.navigation?.episodes?.length ? data.navigation.episodes : [{
    slug: currentSlug,
    label: data.episode.label || data.episode.id || "Episode",
    guest: data.episode.guest || "Guest"
  }];
  navEpisodes.forEach((episode) => {
    select.appendChild(new Option(`${episode.label}   ${episode.guest}`, episode.slug));
  });
  select.value = currentSlug;
  select.addEventListener("change", () => {
    window.location.href = episodeUrl(select.value);
  });
  selector.append(select, el("span", "filter-caret", "▼"));
  actions.append(back, selector);
  header.append(titleBlock, actions);
  return header;
}

function backIcon() {
  const svg = svgEl("svg", { class: "back-icon", viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.appendChild(svgEl("path", {
    d: "M6.1 3.2 3.2 5.2l2.9 2",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round",
    "stroke-linejoin": "round"
  }));
  svg.appendChild(svgEl("path", {
    d: "M3.8 5.2h6.5a3.6 3.6 0 1 1 0 7.2H5.1",
    fill: "none",
    stroke: "currentColor",
    "stroke-width": 1.7,
    "stroke-linecap": "round"
  }));
  return svg;
}

function renderLegend(data) {
  const wrap = el("div", "legend");
  const row1 = el("div", "legend-row topic-row");
  Object.values(data.topicDefinitions).forEach((def) => {
    const item = el("div", "legend-item");
    const swatch = el("span", "topic-swatch");
    swatch.setAttribute("style", topicStyle(def));
    item.append(swatch, document.createTextNode(`${def.label} ${def.name}`));
    row1.appendChild(item);
  });
  const row2 = el("div", "legend-row");
  const s1 = el("span", "speaker-dot");
  s1.style.background = COLORS.taupe;
  const s2 = el("span", "speaker-dot");
  s2.style.background = COLORS.purple;
  const evIcon = el("span", "event-icon");
  evIcon.append(el("i"), el("i"), el("i"));
  const i1 = el("div", "legend-item"); i1.append(s1, document.createTextNode(data.episode.host || "Lu Yu"));
  const i2 = el("div", "legend-item"); i2.append(s2, document.createTextNode(data.episode.guest || "Jiang Shengnan"));
  const i3 = el("div", "legend-item"); i3.append(evIcon, document.createTextNode("Events"));
  row2.append(i1, i2, i3);
  const zoom = el("div", "zoom-readout", "30%");
  zoom.id = "zoom-readout";
  wrap.append(row1, row2, zoom);
  return wrap;
}

function renderAudioControls(data) {
  const wrap = el("div", "audio-controls");
  const hasAudio = Boolean(data.episode.audioSrc);
  const audio = document.createElement("audio");
  if (hasAudio) audio.src = data.episode.audioSrc;
  audio.className = "native-audio";
  state.audio = audio;
  const play = el("button", "audio-play", "▶");
  play.type = "button";
  play.disabled = !hasAudio;
  play.title = hasAudio ? "Play audio" : "Audio not included in this build";
  play.addEventListener("click", () => {
    if (!hasAudio) return;
    if (audio.paused) audio.play();
    else audio.pause();
  });
  const time = el("span", "audio-time", hasAudio ? `0:00 / ${formatTime(data.episode.duration || 0)}` : "Audio unavailable");
  const seek = el("input", "audio-seek");
  seek.type = "range";
  seek.min = "0";
  seek.max = String(data.episode.duration || 0);
  seek.step = "0.1";
  seek.value = "0";
  seek.disabled = !hasAudio;
  seek.addEventListener("input", () => {
    if (!hasAudio) return;
    audio.currentTime = Number(seek.value);
    updatePlayhead();
  });
  const volume = el("span", "audio-volume", "●");
  const more = el("span", "audio-more", "⋮");
  audio.addEventListener("play", () => { play.textContent = "Ⅱ"; });
  audio.addEventListener("pause", () => { play.textContent = "▶"; });
  wrap.append(audio, play, time, seek, volume, more);
  return wrap;
}

function renderVariableControl() {
  const wrap = el("label", "variable-control");
  const shell = el("span", "filter-shell");
  const select = el("select", "audio-variable-select");
  select.append(new Option("loudness", "loudness"), new Option("pitch", "pitch"));
  select.value = state.variable;
  select.addEventListener("change", () => {
    state.variable = select.value;
    redrawChart();
  });
  shell.appendChild(select);
  shell.appendChild(el("span", "filter-caret", "▼"));
  wrap.appendChild(shell);
  return wrap;
}

function renderChart(data) {
  const scroller = el("div", "chart-viewport");
  state.scroller = scroller;
  const width = Math.ceil(data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  const svg = svgEl("svg", { class: "chart-svg", width, height: LAYOUT.plotHeight, viewBox: `0 0 ${width} ${LAYOUT.plotHeight}` });
  state.svg = svg;
  scroller.appendChild(svg);
  drawChart(svg, data, width);
  return scroller;
}

function clearSvg(svg) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
}

function redrawChart() {
  const width = Math.ceil(state.data.episode.displayDuration * pxPerSec()) + LAYOUT.chartLeft + 80;
  state.svg.setAttribute("width", width);
  state.svg.setAttribute("viewBox", `0 0 ${width} ${LAYOUT.plotHeight}`);
  clearSvg(state.svg);
  drawChart(state.svg, state.data, width);
  updatePlayhead();
}

function xOf(t) {
  return LAYOUT.chartLeft + displayTimeForAudioTime(t) * pxPerSec();
}

function drawChart(svg, data, width) {
  drawTopicBackground(svg, data);
  drawGrid(svg, width);
  drawZeroLine(svg, width);
  drawSentimentBars(svg, data);
  drawAudioLine(svg, data);
  drawSentenceHoverTargets(svg, data);
  drawEvents(svg, data);
  state.playhead = svgEl("line", { x1: 0, x2: 0, y1: 0, y2: LAYOUT.plotHeight, stroke: COLORS.black, "stroke-width": 2 });
  svg.appendChild(state.playhead);
  drawStickyAxisLabels(svg);
  updateStickyAxisLabels();
}

function chartGuides() {
  return [
    { y: sentimentY(0.8), label: "0.8 Strongly Positive", area: "sentiment", solid: false },
    { y: sentimentY(0.2), label: "0.2 Positive", area: "sentiment", solid: false },
    { y: sentimentY(0), label: "0 Neutral", area: "sentiment", solid: true },
    { y: sentimentY(-0.2), label: "-0.2 Negative", area: "sentiment", solid: false },
    { y: sentimentY(-0.8), label: "-0.8 Strongly Negative", area: "sentiment", solid: false },
    ...audioGuides()
  ];
}

function drawGrid(svg, width) {
  const g = svgEl("g");
  chartGuides().forEach(({ y, solid }) => {
    g.appendChild(svgEl("line", {
      x1: LAYOUT.chartLeft,
      x2: width,
      y1: y,
      y2: y,
      stroke: solid ? COLORS.line : COLORS.lineSoft,
      "stroke-dasharray": solid ? "" : "4 8",
      "stroke-width": solid ? 1.2 : 1
    }));
  });
  g.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 22, stroke: COLORS.line, "stroke-width": 1 }));
  svg.appendChild(g);
}

function drawStickyAxisLabels(svg) {
  const g = svgEl("g", { class: "sticky-axis-labels" });
  chartGuides().forEach(({ y, label, area }) => {
    const text = svgEl("text", { x: LAYOUT.chartLeft + 7, y: y - 4, class: `axis-label axis-label-${area} sticky-axis-label`, "text-anchor": "start" });
    text.textContent = label;
    g.appendChild(text);
  });
  svg.appendChild(g);
}

function updateStickyAxisLabels() {
  const x = (state.scroller?.scrollLeft || 0) + LAYOUT.chartLeft + 7;
  state.svg?.querySelectorAll(".sticky-axis-label").forEach((label) => {
    label.setAttribute("x", x);
  });
}

function drawTopicBackground(svg, data) {
  const g = svgEl("g", { opacity: 1 });
  data.sentences.forEach((s) => {
    const def = data.topicDefinitions[s.cluster] || data.topicDefinitions[6];
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    g.appendChild(svgEl("rect", { x, y: 0, width: w, height: LAYOUT.plotHeight, fill: def.color, opacity: def.opacity }));
  });
  svg.appendChild(g);
}

function drawZeroLine(svg, width) {
  svg.appendChild(svgEl("line", { x1: LAYOUT.chartLeft, x2: width, y1: LAYOUT.audioTop, y2: LAYOUT.audioTop, stroke: COLORS.lineSoft, "stroke-width": 1 }));
  drawTimeAxis(svg);
}

function drawTimeAxis(svg) {
  const g = svgEl("g");
  const duration = state.data.episode.displayDuration;
  const step = 60;
  for (let t = 0; t <= duration; t += step) {
    const x = xOf(t);
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: 0, y2: LAYOUT.plotHeight - 22, stroke: COLORS.lineSoft, "stroke-width": 1 }));
    g.appendChild(svgEl("line", { x1: x, x2: x, y1: LAYOUT.plotHeight - 22, y2: LAYOUT.plotHeight - 16, stroke: COLORS.line, "stroke-width": 1 }));
    const text = svgEl("text", { x, y: LAYOUT.plotHeight - 4, "text-anchor": "middle", class: "axis-label" });
    text.textContent = formatTime(t);
    g.appendChild(text);
  }
  svg.appendChild(g);
}

function sentimentY(score) {
  const top = LAYOUT.sentimentTop + 28;
  const bottom = LAYOUT.sentimentBottom - 20;
  const mid = (top + bottom) / 2;
  const half = (bottom - top) / 2;
  return mid - Math.max(-1, Math.min(1, score)) * half;
}

function audioValues(data = state.data) {
  return (data?.sentences || []).map((s) => Number(s[state.variable])).filter(Number.isFinite);
}

function audioStats(data = state.data) {
  const values = audioValues(data);
  const max = Math.max(...values, 1);
  const avg = values.length ? values.reduce((sum, v) => sum + v, 0) / values.length : 0;
  return { values, max, avg };
}

function audioY(value, stats = audioStats()) {
  const top = LAYOUT.audioTop + 35;
  const bottom = LAYOUT.audioBottom - 35;
  const max = Math.max(stats.max, 1e-6);
  const ratio = Math.max(0, Math.min(1, value / max));
  return bottom - ratio * (bottom - top);
}

function formatAxisNumber(value) {
  if (!Number.isFinite(value)) return "0";
  if (Math.abs(value) >= 10) return value.toFixed(1);
  return value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function formatSigned(value) {
  const n = Number(value) || 0;
  return `${n >= 0 ? "+" : ""}${n.toFixed(1)}`;
}

function formatMetricValue(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "N/A";
  return n.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function escapeHtml(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function sentenceText(s) {
  const text = s.sentence_en || s.representative_sentence_en || "";
  return escapeHtml(text || "English transcript is not available for this segment.");
}

function topicClusterText(s) {
  const label = [s.clusterLabel, s.clusterName].filter(Boolean).join(" ");
  return escapeHtml(label || `C${s.cluster ?? ""}`);
}

function sentimentTooltip(s) {
  const sentiment = escapeHtml(s.sentiment_en || "Sentiment");
  return `<strong>${sentiment} (${formatSigned(s.score)})</strong><br>Loudness: ${formatMetricValue(s.loudness)}<br>Pitch: ${formatMetricValue(s.pitch)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioTooltip(s) {
  const primary = state.variable === "pitch" ? "Pitch" : "Loudness";
  const secondary = state.variable === "pitch" ? "Loudness" : "Pitch";
  const primaryKey = state.variable === "pitch" ? "pitch" : "loudness";
  const secondaryKey = state.variable === "pitch" ? "loudness" : "pitch";
  return `<strong>${primary}: ${formatMetricValue(s[primaryKey])}</strong><br>${secondary}: ${formatMetricValue(s[secondaryKey])}<br>Sentiment: ${formatSigned(s.score)}<br>Topic Cluster: ${topicClusterText(s)}<br>${sentenceText(s)}`;
}

function audioGuides() {
  const stats = audioStats();
  return [
    { y: audioY(stats.max, stats), label: `Max=${formatAxisNumber(stats.max)}`, area: "audio", solid: false },
    { y: audioY(stats.avg, stats), label: `Average=${formatAxisNumber(stats.avg)}`, area: "audio", solid: false },
    { y: audioY(0, stats), label: "0", area: "audio", solid: true }
  ];
}

function drawSentimentBars(svg, data) {
  const g = svgEl("g");
  const zero = sentimentY(0);
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const y = sentimentY(s.score);
    const h = Math.max(1, Math.abs(zero - y));
    g.appendChild(svgEl("rect", {
      x,
      y: Math.min(y, zero),
      width: w,
      height: h,
      fill: s.speakerColor
    }));
  });
  svg.appendChild(g);
}

function normalize(values, value) {
  const valid = values.filter((v) => Number.isFinite(v));
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max === min) return 0.5;
  return (value - min) / (max - min);
}

function linePoints(points) {
  return points.map((p) => `${p.x},${p.y}`).join(" ");
}

function interpolatedAudioY(points, x) {
  if (!points.length) return null;
  if (x <= points[0].x) return points[0].y;
  for (let i = 1; i < points.length; i += 1) {
    const prev = points[i - 1];
    const next = points[i];
    if (x <= next.x) {
      const span = next.x - prev.x;
      if (span <= 0) return next.y;
      return prev.y + ((x - prev.x) / span) * (next.y - prev.y);
    }
  }
  return points[points.length - 1].y;
}

function drawAudioLine(svg, data) {
  const stats = audioStats(data);
  const g = svgEl("g");
  const points = data.sentences
    .map((s) => {
      const v = Number(s[state.variable]);
      if (!Number.isFinite(v)) return null;
      return { x: xOf(s.displayMid), y: audioY(v, stats), sentence: s };
    })
    .filter(Boolean);

  if (points.length > 1) {
    g.appendChild(svgEl("polyline", {
      points: linePoints(points),
      fill: "none",
      stroke: COLORS.line,
      "stroke-width": 2.4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      opacity: 0.38
    }));
  }

  const midpointXs = points.map((p) => p.x);
  data.sentences.forEach((s) => {
    const v = Number(s[state.variable]);
    if (!Number.isFinite(v)) return;
    const x1 = xOf(s.displayStart);
    const x2 = Math.max(x1 + 1, xOf(s.displayEnd));
    const xs = [x1, ...midpointXs.filter((x) => x > x1 && x < x2), x2]
      .filter((x, index, arr) => Number.isFinite(x) && (index === 0 || Math.abs(x - arr[index - 1]) > 0.001));
    const segmentPoints = xs
      .map((x) => ({ x, y: interpolatedAudioY(points, x) }))
      .filter((p) => Number.isFinite(p.y));
    if (segmentPoints.length < 2) return;
    g.appendChild(svgEl("polyline", {
      points: linePoints(segmentPoints),
      fill: "none",
      stroke: s.speakerColor || COLORS.taupe,
      "stroke-width": 4,
      "stroke-linejoin": "round",
      "stroke-linecap": "round"
    }));
  });
  svg.appendChild(g);
}

function addSentenceHover(hit, tooltip) {
  hit.addEventListener("mouseenter", (e) => showTooltip(e, tooltip));
  hit.addEventListener("mousemove", (e) => moveTooltip(e));
  hit.addEventListener("mouseleave", hideTooltip);
}

function drawSentenceHoverTargets(svg, data) {
  const g = svgEl("g", { class: "sentence-hover-targets" });
  data.sentences.forEach((s) => {
    const x = xOf(s.displayStart);
    const w = Math.max(1, (s.displayEnd - s.displayStart) * pxPerSec());
    const sentimentHit = svgEl("rect", {
      x,
      y: LAYOUT.sentimentTop,
      width: w,
      height: LAYOUT.sentimentBottom - LAYOUT.sentimentTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(sentimentHit, sentimentTooltip(s));
    g.appendChild(sentimentHit);

    const audioHit = svgEl("rect", {
      x,
      y: LAYOUT.audioTop,
      width: w,
      height: LAYOUT.audioBottom - LAYOUT.audioTop,
      fill: COLORS.text,
      opacity: 0
    });
    addSentenceHover(audioHit, audioTooltip(s));
    g.appendChild(audioHit);
  });
  svg.appendChild(g);
}

function drawEvents(svg, data) {
  const g = svgEl("g");
  data.events.forEach((ev) => {
    const x = xOf(ev.displayTime);
    [-3, 0, 3].forEach((dx) => {
      const line = svgEl("line", {
        x1: x + dx,
        x2: x + dx,
        y1: 0,
        y2: LAYOUT.plotHeight,
        stroke: COLORS.purple,
        "stroke-width": 1.8
      });
      g.appendChild(line);
    });
    const hit = svgEl("rect", { x: x - 8, y: 0, width: 16, height: LAYOUT.plotHeight, fill: COLORS.text, opacity: 0 });
    hit.addEventListener("mouseenter", (e) => showTooltip(e, eventTooltip(ev)));
    hit.addEventListener("mousemove", (e) => moveTooltip(e));
    hit.addEventListener("mouseleave", hideTooltip);
    g.appendChild(hit);
  });
  svg.appendChild(g);
}

function eventTooltip(ev) {
  return `<strong>${ev.event_type_en}</strong><br>Time: ${formatTime(ev.start)}–${formatTime(ev.end)}<br>Duration: ${ev.duration.toFixed(2)}s<br>Speaker: ${ev.speaker}<br>Confidence: ${Math.round((ev.confidence || 0) * 100)}%<br>${ev.representative_sentence_en}`;
}

function formatTime(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function renderTooltip() {
  const t = el("div", "tooltip hidden");
  t.id = "tooltip";
  return t;
}

function showTooltip(event, html) {
  const t = document.getElementById("tooltip");
  t.innerHTML = html;
  t.classList.remove("hidden");
  moveTooltip(event);
}

function moveTooltip(event) {
  const t = document.getElementById("tooltip");
  const stage = document.querySelector(".stage");
  const rect = stage?.getBoundingClientRect();
  const scale = currentStageScale();
  const x = rect ? (event.clientX - rect.left) / scale : event.clientX;
  const y = rect ? (event.clientY - rect.top) / scale : event.clientY;
  t.style.left = `${x + 14}px`;
  t.style.top = `${y + 14}px`;
}

function hideTooltip() {
  document.getElementById("tooltip")?.classList.add("hidden");
}

function wireInteractions() {
  const scroller = state.scroller;
  window.addEventListener("resize", resizeStage);
  scroller.addEventListener("scroll", updateStickyAxisLabels);
  scroller.addEventListener("click", (event) => {
    if (state.isDragging) return;
    if (!state.audio?.src) return;
    const rect = scroller.getBoundingClientRect();
    const localX = localScrollerX(event, rect);
    const displayTime = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
    state.audio.currentTime = audioTimeForDisplayTime(displayTime);
    updatePlayhead();
  });
  scroller.addEventListener("wheel", (event) => {
    if (event.ctrlKey) {
      event.preventDefault();
      const rect = scroller.getBoundingClientRect();
      const localX = localScrollerX(event, rect);
      const anchor = (localX + scroller.scrollLeft - LAYOUT.chartLeft) / pxPerSec();
      const old = state.zoom;
      state.zoom = Math.max(LAYOUT.minZoom, Math.min(LAYOUT.maxZoom, state.zoom * (event.deltaY < 0 ? 1.08 : 0.92)));
      const nextScroll = LAYOUT.chartLeft + anchor * pxPerSec() - localX;
      redrawChart();
      scroller.scrollLeft = nextScroll;
      updateStickyAxisLabels();
      document.getElementById("zoom-readout").textContent = `${Math.round(state.zoom * 100)}%`;
      console.log("Zoom changed:", old, "->", state.zoom);
    } else if (event.shiftKey) {
      event.preventDefault();
      scroller.scrollLeft += event.deltaY;
    }
  }, { passive: false });
  scroller.addEventListener("pointerdown", (event) => {
    state.isDragging = false;
    state.dragStartX = event.clientX / currentStageScale();
    state.dragScrollLeft = scroller.scrollLeft;
    scroller.setPointerCapture(event.pointerId);
  });
  scroller.addEventListener("pointermove", (event) => {
    if (!scroller.hasPointerCapture(event.pointerId)) return;
    const dx = event.clientX / currentStageScale() - state.dragStartX;
    if (Math.abs(dx) > 3) {
      state.isDragging = true;
      scroller.classList.add("dragging");
      scroller.scrollLeft = state.dragScrollLeft - dx;
    }
  });
  scroller.addEventListener("pointerup", (event) => {
    scroller.releasePointerCapture(event.pointerId);
    scroller.classList.remove("dragging");
    setTimeout(() => { state.isDragging = false; }, 0);
  });
  state.audio.addEventListener("timeupdate", updatePlayhead);
  state.audio.addEventListener("seeked", updatePlayhead);
}

function updatePlayhead() {
  if (!state.playhead || !state.audio) return;
  const x = xOf(displayTimeForAudioTime(state.audio.currentTime));
  state.playhead.setAttribute("x1", x);
  state.playhead.setAttribute("x2", x);
  const seek = document.querySelector(".audio-seek");
  const time = document.querySelector(".audio-time");
  if (seek) seek.value = String(state.audio.currentTime || 0);
  if (time) time.textContent = `${formatTime(state.audio.currentTime || 0)} / ${formatTime(state.audio.duration || state.data.episode.duration || 0)}`;
  const left = state.scroller.scrollLeft;
  const right = left + state.scroller.clientWidth;
  if (!state.audio.paused && x > right - 160) state.scroller.scrollLeft = x - state.scroller.clientWidth * 0.45;
}

function renderBottomPanels(data) {
  const wrap = el("section", "bottom-panels");
  const left = el("div", "left-panels");
  left.appendChild(renderPanel("Overview of Sentiment Analysis", renderSentimentTable(data.overview.sentimentRows)));
  left.appendChild(renderPanel("Overview of Acoustic Events", renderEventTable(data.overview.eventRows)));
  wrap.appendChild(left);
  wrap.appendChild(renderPanel("Overview of Topic Clusters", renderClusterTable(data.overview.clusterRows)));
  return wrap;
}

function renderPanel(title, content) {
  const panel = el("div", "panel");
  panel.appendChild(el("h2", "", title));
  const scroll = el("div", "panel-scroll");
  scroll.appendChild(content);
  panel.appendChild(scroll);
  return panel;
}

function makeTable(headers, rows, className = "") {
  const table = document.createElement("table");
  if (className) table.className = className;
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach((h) => trh.appendChild(el("th", "", h)));
  thead.appendChild(trh);
  const tbody = document.createElement("tbody");
  rows.forEach((cells) => {
    const tr = document.createElement("tr");
    cells.forEach((cell) => {
      const td = document.createElement("td");
      if (cell instanceof Node) td.appendChild(cell);
      else td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.append(thead, tbody);
  return table;
}

function renderSentimentTable(rows) {
  return makeTable(["Sentiment", "Distribution", "Representative Sentences"], rows.map((r) => [r.sentiment, r.distribution, r.representative_sentences]));
}

function renderEventTable(rows) {
  const safe = rows.length ? rows : [{ event: "No Event", times: 0, representative_sentences_before_events: "No acoustic event is available for this episode." }];
  return makeTable(["Event", "Times", "Representative Sentences Before Events"], safe.map((r) => [r.event, String(r.times), r.representative_sentences_before_events]));
}

function renderClusterTable(rows) {
  return makeTable(
    ["Cluster", "First Category", "Second Category", "Key Words", "Duration", "Proportion", "Representative Sentences"],
    rows.map((r) => {
      const cell = el("div", "cluster-cell");
      const chip = el("span", "cluster-chip");
      chip.style.background = r.color;
      chip.style.opacity = r.opacity;
      cell.append(chip, document.createTextNode(`${r.label} ${r.name}`));
      return [
        cell,
        r.firstCategory,
        r.secondCategory,
        r.keyWords.join(", "),
        r.duration_formatted,
        `${Math.round(r.proportion * 100)}%`,
        r.representative_sentences_en.join(" ")
      ];
    }),
    "cluster-table"
  );
}

loadData().then(renderApp).catch((error) => {
  console.error(error);
  document.getElementById("app").textContent = error.message;
});

</script>
